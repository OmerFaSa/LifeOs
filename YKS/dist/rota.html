    return c.Card({ title:list.label, sub:'Bugünün ritüeli', body:html`
      <div class="stack-xs">
        ${map(list.items, (it, i) => c.Checkbox({ label:it, checked:!!state[ritual+'-'+i],
          act:'checklist', data:{ 'data-key':ritual+'-'+i } }))}
      </div>
      <div class="ritual__cta">${cta}</div>` });
  }

  function DueCards(){
    const due = C.dueCards().sort((a,b) => a.dueAt.localeCompare(b.dueAt));
    const overdue = C.overdueCards().length;
    if(!due.length){
      return c.Card({ title:'Due kartlar', badge:c.Badge({ label:'temiz', tone:'ok' }),
        body:html`<p class="small muted">Bugün için bekleyen kart yok. Yeni kartlar deneme analizinden otomatik üretilir.</p>` });
    }
    const card = due[0];
    const flipped = !!S.ui.flipped[card.id];
    const rate = (rating, label, tone) => c.Button({ label, tone, class:'grow', act:'rate',
      data:{ 'data-id':card.id, 'data-rating':rating } });

    return c.Card({
      title:'Due kartlar', sub:due.length+' kart bekliyor'+(overdue ? ' · '+overdue+' gecikmiş' : ''),
      actions:c.Button({ label:'Tümü', size:'sm', act:'go', data:{ 'data-route':'cards' } }),
      body:html`
        <div class="flashcard flashcard--sm" data-act="flip" data-id="${card.id}" role="button" tabindex="0">
          <span class="flashcard__side">${flipped ? 'Arka' : 'Ön'}</span>
          <span class="flashcard__text">${flipped ? (card.back || '—') : card.front}</span>
        </div>
        ${flipped
          ? html`<div class="row row--tight due__actions">
              ${rate('forgot','Hatırlamadım','danger')}${rate('hard','Zorlandım')}${rate('remembered','Hatırladım','primary')}
            </div>`
          : html`<p class="tiny dim center due__hint">Cevabı görmek için karta dokun</p>`}` });
  }

  function RepairQueue(){
    const open = C.openErrors().filter(e => !e.repairDoneAt).slice(0, 6);
    if(!open.length) return '';
    return c.Card({ title:'Tamir kuyruğu', sub:'Açık yanlışların reçeteleri',
      actions:c.Button({ label:'Yanlış defteri', size:'sm', act:'go', data:{ 'data-route':'cards', 'data-tab':'notebook' } }),
      body:html`<div class="list">
        ${map(open, e => html`
          <div class="listitem">
            ${raw(UI.tagDot(e.tag))}
            <div class="grow">
              <div class="small strong">${e.topic || e.testName || 'Yanlış'}</div>
              <div class="tiny dim">${e.recipe}</div>
            </div>
            ${c.Button({ label:'Yapıldı', size:'sm', act:'repair-done', data:{ 'data-id':e.id } })}
          </div>`)}
      </div>` });
  }

  function WeekContext(week, n){
    const comp = C.planCompletion(n);
    const qr = C.questionRealization(n);
    const phase = M.phaseOf(n);
    return c.Card({
      title:'Hafta '+n+' bağlamı', sub:phase.label+' — '+phase.theme,
      actions:c.Button({ label:'Aç', size:'sm', act:'go', data:{ 'data-route':'week' } }),
      body:html`
        <div class="stack-sm">
          <div class="stack-xs">
            <span class="mono-label">Bu haftanın ana konuları</span>
            ${map(week.mainTopics, t => html`
              <div class="row between"><span class="small">${t.name}</span>
              <span class="tiny dim num">${t.questionTarget} soru · %${t.accuracy}</span></div>`)}
          </div>
          ${when(comp != null, () => c.Meter({ label:'Plan tamamlama', value:comp }))}
          ${when(qr, () => c.Meter({ label:'Soru gerçekleşme', value:qr.pct, text:qr.solved+' / '+qr.target }))}
          ${c.Notice({ body:week.checkpoint, tone:'info' })}
        </div>` });
  }

  /* ---------- uyarilar ---------- */
  function Banners(){
    const out = [];
    const untilStart = M.daysUntilStart();
    const goBtn = (label, route) => c.Button({ label, size:'sm', act:'go', data:{ 'data-route':route } });

    if(untilStart > 0){
      out.push(c.Notice({ tone:'info', title:untilStart+' gün sonra başlıyor.',
        body:html`Program ${U.fmtDate(R.PLAN.startISO)} tarihinde başlıyor. Hafta 1 içeriği şimdiden önizleme olarak açık.` }));
    }
    M.activeProtocols().forEach(p => {
      out.push(c.Notice({ tone:'warn',
        body:html`<b>${p.title}</b> protokolü ${U.fmtShort(p.endsAt)} tarihine kadar aktif. ${goBtn('Adımları gör','protocols')}` }));
    });
    const triggers = C.protocolTriggers();
    if(triggers.length){
      const def = R.RECOVERY_PROTOCOLS.find(p => p.id === triggers[0].id);
      out.push(c.Notice({ tone:'warn', title:'Telafi tetiklendi.',
        body:html`${triggers[0].detail} <b>${def.title}</b> protokolü öneriliyor. ${goBtn('İncele','protocols')}` }));
    }
    if(M.backupDue()){
      const age = M.backupAgeDays();
      out.push(c.Notice({ tone:'info', title:'Yedekleme.',
        body:html`${age === null ? 'Henüz hiç yedek almadın.' : 'Son yedeğin '+age+' gün önce alındı.'} Tarayıcı verisi silinirse çalışma geçmişin kaybolur. ${goBtn('Yedek al','guide')}` }));
    }
    const debt = C.analysisDebt();
    if(debt.length){
      out.push(c.Notice({ tone:'danger', title:'Analiz borcu.',
        body:html`${debt.length} denemenin analizi 24 saati aştı. Analiz edilmemiş deneme, analiz edilenden daha düşük değerlidir. ${goBtn('Analize git','exams')}` }));
    }
    return out;
  }

  /* ---------- render ---------- */
  /* ---------- günün akışı, enerji, mola, ödül ---------- */

  function FlowCard(){
    const flow = C.dailyFlow();
    return c.Card({
      title:'Günün akışı', hint:'next-action',
      sub:'İzle → not → soru → kart → mola',
      badge:c.Badge({ label:flow.done+'/'+flow.total, tone:flow.pct >= 100 ? 'ok' : 'muted' }),
      body:html`
        ${c.Bar({ value:flow.pct, tone:'' })}
        <div class="mt-12">${map(flow.steps, s => html`
          <div class="${s.done ? 'flowstep is-done' : 'flowstep'}">
            <span class="flowstep__dot">${raw(UI.icon(s.done ? 'check' : s.icon))}</span>
            <div class="minw0">
              <div class="flowstep__title">${s.title}</div>
              <div class="flowstep__why">${s.why}</div>
            </div>
            ${when(!s.done, () => c.Button({ label:'Git', size:'sm', tone:'ghost',
              act:'go', data:{ 'data-route':s.route } }))}
          </div>`)}</div>`,
    });
  }

  function AutoCard(){
    const list = R.Auto.suggestions();
    if(!list.length) return null;
    return c.Card({
      title:'Sistem önerileri', sub:'Otomasyon önerir, sen onaylarsın',
      badge:c.Badge({ label:String(list.length), tone:'muted' }),
      body:html`<div class="autolist">${map(list, s => html`
        <div class="autorow">
          <span class="autorow__icon">${raw(UI.icon(s.icon))}</span>
          <div class="minw0">
            <div class="small strong">${s.title}</div>
            <div class="tiny dim">${s.why}</div>
          </div>
          ${c.Button({ label:'Uygula', size:'sm', tone:s.tone || null, act:s.act, data:s.data || {} })}
        </div>`)}</div>` });
  }

  function PlanHealthCard(){
    const h = M.planHealth();
    if(!h || h.status === 'yeni') return null;
    const tone = h.status === 'saglikli' ? 'ok' : h.status === 'sapma' ? 'warn' : 'danger';
    return c.Card({ pad:'sm', body:html`
      <div class="row between">
        <span class="stat__label">Plan sağlığı</span>
        ${c.Badge({ label:h.pct == null ? '—' : '%'+h.pct, tone })}
      </div>
      ${c.Bar({ value:h.pct || 0, tone:tone === 'ok' ? '' : tone })}
      <p class="tiny dim mt-6">${h.note}</p>
      ${when(h.status !== 'saglikli', () => c.Button({ label:'Planı yeniden hesapla', size:'sm',
        class:'mt-8', act:'auto-replan' }))}` });
  }

  function EnergyCard(){
    const today = U.todayISO();
    const mood = M.moodOf(today);
    const avg = M.energyAverage(7);
    const cur = mood ? mood.energy : null;
    return c.Card({
      title:'Enerji', sub:'Günde tek soru — plan buna göre esner',
      badge:when(avg != null, () => c.Badge({ label:'7 gün ort. '+avg, tone:'muted' })),
      body:html`
        <div class="energy">${map(R.ENERGY_SCALE, e => html`
          <button class="${cur === e.value ? 'is-on' : ''}" data-act="energy-set" data-value="${e.value}"
            aria-pressed="${cur === e.value ? 'true' : 'false'}" title="${e.note}">
            <b>${e.value}</b><span>${e.label}</span></button>`)}</div>
        ${when(cur != null, () => html`<p class="tiny dim mt-8">
          ${(R.ENERGY_SCALE.find(e => e.value === cur) || {}).note}</p>`)}`,
    });
  }

  function BreakCard(){
    const sug = C.suggestBreak();
    const taken = M.breaksOf(U.todayISO());
    if(!sug.ok){
      return c.Card({ title:'Mola', sub:'Bugün alınan: '+taken.length,
        body:c.Notice({ tone:'info', body:sug.reason }) });
    }
    return c.Card({
      title:'Mola', hint:'minimum-day', sub:sug.minutes+' dakika · '+taken.length+' mola alındı',
      body:html`
        <p class="small muted">${sug.why}</p>
        <div class="stack-xs mt-10">${map(sug.picks, a => html`
          <div class="row between">
            <div class="minw0"><b class="small">${a.name}</b>
              <div class="tiny dim">${a.minutes} dk · ${R.ACTIVITY_KINDS[a.kind].label}</div></div>
            ${c.Button({ label:'Aldım', size:'sm', act:'break-take',
              data:{ 'data-id':a.id, 'data-min':a.minutes } })}
          </div>`)}</div>`,
    });
  }

  function RewardCard(){
    const r = C.todayReward();
    const tier = C.rewardTier();
    const ALL = [
      { key:'minimum', label:'Minimum gün', icon:'check' },
      { key:'sleep', label:'Uyku', icon:'moon' },
      { key:'analysis', label:'Analiz', icon:'exam' },
      { key:'cards', label:'Tekrar', icon:'cards' },
    ];
    const has = k => r.earned.some(e => e.key === k);
    return c.Card({
      title:'Bugünün ödülü', hint:'streak', sub:r.title,
      badge:when(r.all, () => c.Badge({ label:'tam gün', tone:'ok' })),
      body:html`
        <div class="reward">${map(ALL, a => html`
          <span class="${has(a.key) ? 'reward__item' : 'reward__item is-off'}">
            ${raw(UI.icon(has(a.key) ? 'check' : a.icon))}${a.label}</span>`)}</div>

        ${when(tier.current || tier.next, () => html`
          <div class="stack-xs mt-12">
            <div class="row between">
              <span class="small">${tier.current ? tier.current.name + ' eşiği geçildi' : 'İlk eşik'}</span>
              ${when(tier.next, () => html`<span class="tiny dim num">${tier.next.name}’e ${tier.toNext} gün</span>`)}
            </div>
            ${c.Bar({ value:tier.next ? U.pct(tier.streak, tier.next.days) : 100,
              tone:tier.current ? '' : 'warn' })}
            <span class="tiny dim">${(tier.current || tier.next || {}).note || ''}</span>
          </div>`)}

        <p class="tiny dim mt-10">${r.note}</p>`,
    });
  }

  /* Kötü gün: sistem çökmesin diye tek düğmelik iniş. */
  function BadDayCard(day){
    if(day.badDay){
      return c.Card({ pad:'sm', class:'card--accent', body:html`
        <div class="row between wrap gap-8">
          <div class="minw0">
            <b class="small">Bugün kötü gün olarak işaretli</b>
            <div class="tiny dim">Hedef minimuma indi, seri korunuyor.</div>
          </div>
          ${c.Button({ label:'Geri al', size:'sm', act:'bad-day-undo' })}
        </div>` });
    }
    return c.Card({ pad:'sm', body:html`
      <div class="row between wrap gap-8">
        <div class="minw0">
          <b class="small">${R.BAD_DAY.label}</b>
          <div class="tiny dim">${R.BAD_DAY.note}</div>
        </div>
        ${c.Button({ label:'İşaretle', size:'sm', act:'bad-day' })}
      </div>` });
  }

  /* Dikkat dağılması: tek tık, kalıbı gösterir. */
  function DistractionCard(day){
    const n = day.distractions || 0;
    const trend = R.Analytics.distractionTrend(14);
    return c.Card({ pad:'sm', body:html`
      <div class="row between">
        <span class="stat__label">Bölünme</span>
        <b class="num">${n}<span class="dim"> kez</span></b>
      </div>
      <div class="row gap-8 mt-8">
        ${c.Button({ label:'+1 bölündüm', size:'sm', class:'grow', act:'distract' })}
        ${when(n, () => c.Button({ label:'Sıfırla', size:'sm', tone:'ghost', act:'distract-reset' }))}
      </div>
      ${when(trend.ok && trend.avg >= 2, () => html`<p class="tiny dim mt-6">${trend.note}</p>`)}` });
  }

  /* Ofisten gelen — ekip sen ekrani acmadan da calisir. Notlar kural
     motorundan gelir; brifing gunde bir kez uretilip onbellekten okunur. */
  function OfficeCard(){
    const notes = R.Office.notes();
    /* Bayat brifing burada hic gosterilmez: notlar her zaman tazedir ve
       ikisi celisirse kullanici hangisine inanacagini bilemez. */
    const cached = R.Office.briefingOf();
    const brief = (cached && !cached.stale) ? cached : null;
    const open = R.Office.openDecisions();
    if(!notes.length && !brief && !open.length) return '';

    return c.Card({
      title:'Ofisten', sub:'Ekibin bugünkü notu',
      badge:when(notes.length, () => c.Badge({ label:notes.length + ' not',
        tone:notes.some(n => n.tone === 'danger') ? 'danger' : 'warn' })),
      body:html`
        ${when(brief, () => html`<p class="small">${brief.text}</p>`)}
        ${when(notes.length, () => html`<div class="notes mt-10">${map(notes.slice(0, 3), n => html`
          <div class="${'note note--' + n.tone}">
            <span class="note__dot"></span>
            <span class="minw0"><b class="small">${n.name}:</b> ${n.text}</span>
          </div>`)}</div>`)}
        ${when(open.length, () => html`<div class="mt-10">${c.Notice({ tone:'warn',
          title:'Açık karar:', body:open[0].title })}</div>`)}
        <div class="row wrap gap-6 mt-10">
          ${c.Button({ label:'Ofise git', size:'sm', act:'go', data:{ 'data-route':'office' } })}
          ${c.Button({ label:'Patron’a sor', size:'sm', tone:'ghost', act:'ask-agent',
            data:{ 'data-agent':'patron' } })}
        </div>`,
    });
  }

  async function render(){
    const dateISO = U.todayISO();
    const n = M.currentWeek();
    await M.ensureWeek(n);
    const day = await M.ensureDay(U.today());
    const week = S.weeks[M.weekId(n)];
    const wd = R.WEEKDAYS[day.dow];

    const minMet = C.minimumDayMet(dateISO);
    const doneBlocks = day.blocks.filter(b => b.status === 'done').length;
    const planBlocks = day.blocks.filter(b => b.slot !== 'Dinlenme').length;
    const debt = C.cardDebt();
    const banners = Banners();

    return c.Grid(html`
      ${when(banners.length, () => c.Span(12, html`<div class="stack-sm">${banners}</div>`))}
      ${c.Span(12, R.Setup.needed() ? raw(R.Setup.card()) : NextUpCard())}

      ${c.Span(12, c.Cols(4, html`
        ${c.Stat({ label:'Bugünün bloğu', value:html`${doneBlocks}<small>/${planBlocks}</small>`,
          note:wd.label+' düzeni',
          tone:planBlocks && doneBlocks >= planBlocks ? 'ok' : null,
          progress:planBlocks ? (100 * doneBlocks / planBlocks) : null })}
        ${c.Stat({ label:'Minimum gün', value:minMet ? 'Tamam' : 'Açık', tone:minMet ? 'ok' : 'warn',
          note:'45 dk · 15 paragraf · kart', progress:minMet ? 100 : 0 })}
        ${c.Stat({ label:'Due kart', value:C.dueCards().length, tone:debt > 10 ? 'warn' : null,
          note:'borç %'+debt, progress:debt })}
        ${c.Stat({ label:'Sınava kalan', value:U.diffDays(dateISO, R.PLAN.examTytISO), unit:' gün',
          note:'TYT tahmini', progress:M.programProgress() })}
      `))}

      ${c.Span(6, c.Stack(html`
        ${AutoCard()}
        <div id="pane-flow">${FlowCard()}</div>
        ${c.SectionTitle(html`${wd.label} blokları${raw(UI.hint('block'))}`, html`<span class="small dim">${U.fmtDate(dateISO)}</span>`)}
        ${map(day.blocks, BlockCard)}
        ${c.Card({ pad:'sm', body:c.Field({ label:'Günün notu',
          input:c.Textarea({ rows:2, value:day.note, change:'day-note', placeholder:'Bugün ne engelledi, ne kolaylaştırdı?' }) }) })}
      `))}

      ${c.Span(4, c.Stack(html`
        ${OfficeCard()}
        <div id="pane-anchors">${AnchorPane(day)}</div>
        <div id="pane-energy">${EnergyCard()}</div>
        <div id="pane-reward">${RewardCard()}</div>
        ${BadDayCard(day)}
        ${DistractionCard(day)}
        ${PlanHealthCard()}
        ${StreakCard()}
        ${SleepCard(day)}
        <div id="pane-break">${BreakCard()}</div>
        <div id="pane-due">${DueCards()}</div>
        <div id="pane-ritual">${RitualCard(day)}</div>
        ${RepairQueue()}
        ${WeekContext(week, n)}
      `))}

      ${c.Span(12, raw(UI.rail(['next-action','anchor','minimum-day','timer','streak','skip-reason'])))}
    `);
  }

  function afterRender(){
    if(runningBlock()) startTick(); else stopTick();
  }

  /* ---------- eylemler ---------- */
  const handle = {
    async 'bad-day'(){
      UI.confirmSheet(R.BAD_DAY.label,
        'Bugünün hedefi minimum güne iner, kalan bloklar “kötü gün” nedeniyle atlanır ve '
        + 'davranış serin kırılmaz. Yarın normal plana dönersin.', async () => {
          await M.badDay();
          UI.closeSheet();
          UI.toast('Bugün minimuma indi — seri korunuyor');
          R.App.render();
        });
    },
    async 'bad-day-undo'(){
      await M.undoBadDay();
      UI.toast('Normal plana dönüldü');
      R.App.render();
    },
    async 'distract'(){
      const n = await M.addDistraction();
      UI.toast(n + '. bölünme kaydedildi');
      R.App.render();
    },
    async 'distract-reset'(){
      const day = todayDoc();
      day.distractions = 0;
      await M.saveDay(day.date);
      R.App.render();
    },
    async 'share-week'(){
      const n = M.currentWeek();
      const comp = C.planCompletion(n);
      const qr = C.questionRealization(n);
      const tyt = C.medianTrend('TYT');
      const streak = C.behaviorStreak().streak;
      const lines = [
        'Hafta ' + n + ' özeti',
        'Plan tamamlama: ' + (comp == null ? '—' : '%' + comp),
        'Soru: ' + (qr ? qr.solved + ' / ' + qr.target : '—'),
        'TYT medyan (son 3): ' + (tyt.last3 == null ? '—' : U.fmtNet(tyt.last3)),
        'Davranış serisi: ' + streak + ' gün',
        'Analiz borcu: ' + C.analysisDebt().length,
        'Konu kapanışı: %' + C.overallClosure().pct,
      ];
      const text = lines.join('\n');
      try{
        if(navigator.share){ await navigator.share({ title:'Rota — hafta özeti', text }); return; }
        await navigator.clipboard.writeText(text);
        UI.toast('Özet kopyalandı — birine gönderebilirsin');
      }catch(e){
        UI.sheet({
          title:'Hafta özeti', subtitle:'Kopyalayıp paylaşabilirsin',
          body:String(c.Textarea({ id:'share-box', rows:8, value:text })),
          footer:String(c.Button({ label:'Kapat', act:'sheet-close' })),
        });
      }
    },
    async 'energy-set'(el){
      await M.saveMood(U.todayISO(), { energy:Number(el.dataset.value) });
      if(!R.App.patch('#pane-energy', EnergyCard())) R.App.render();
      else R.App.patch('#pane-break', BreakCard());
    },
    async 'break-take'(el){
      await M.saveBreak({ activityId:el.dataset.id, minutes:Number(el.dataset.min) || 5 });
      UI.toast('Mola kaydedildi — dönünce blok seni bekliyor');
      if(!R.App.patch('#pane-break', BreakCard())) R.App.render();
      else R.App.patch('#pane-flow', FlowCard());
    },
    async anchor(el){
      const day = todayDoc();
      const field = el.dataset.kind === 'paragraph' ? 'paragraphActual' : 'problemActual';
      day[field] = Math.max(0, (day[field]||0) + Number(el.dataset.delta));
      await M.saveDay(day.date);
      // yalniz cipa panelini yenile; tam cizim gerekmez
      if(!R.App.patch('#pane-anchors', AnchorPane(day))) R.App.render();
    },
    async 'block-status'(el){
      const day = todayDoc();
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.status = el.dataset.value;
      if(b.status === 'done' && b.actualMin == null && !b.startedAt) b.actualMin = b.targetMin;
      if(b.status !== 'skipped') b.skipReason = null;
      if(b.startedAt){ b.actualMin = (b.actualMin||0) + Math.round(elapsedSeconds(b)/60); b.startedAt = null; }
      await M.saveDay(day.date);
      R.App.render();
    },
    async 'skip-reason'(el){
      const day = todayDoc();
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.skipReason = el.dataset.reason;
      await M.saveDay(day.date);
      R.App.render();
    },
    async 'timer-start'(el){
      const day = todayDoc();
      day.blocks.forEach(b => {
        if(b.startedAt){ b.actualMin = (b.actualMin||0) + Math.round(elapsedSeconds(b)/60); b.startedAt = null; }
      });
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.startedAt = new Date().toISOString();
      await M.saveDay(day.date);
      R.App.render();
    },
    async 'timer-stop'(el){
      const day = todayDoc();
      const b = day.blocks.find(x => x.id === el.dataset.block);
      const mins = Math.round(elapsedSeconds(b)/60);
      b.actualMin = (b.actualMin||0) + mins;
      b.startedAt = null;
      if(b.status === 'pending') b.status = mins >= b.targetMin*0.8 ? 'done' : 'partial';
      await M.saveDay(day.date);
      UI.toast(mins+' dakika kaydedildi');
      R.App.render();
    },
    async checklist(el){
      const day = todayDoc();
      day.checklist = day.checklist || {};
      day.checklist[el.dataset.key] = el.checked;
      await M.saveDay(day.date);
      if(!R.App.patch('#pane-ritual', RitualCard(day))) R.App.render();
    },
    async flip(el){
      S.ui.flipped[el.dataset.id] = !S.ui.flipped[el.dataset.id];
      if(!R.App.patch('#pane-due', DueCards())) R.App.render();
    },
    async rate(el){
      const card = S.cards.find(x => x.id === el.dataset.id);
      M.schedule(card, el.dataset.rating);
      await M.saveCard(card);
      delete S.ui.flipped[card.id];
      UI.toast('Sonraki tekrar: '+U.fmtShort(card.dueAt));
      R.App.render();
    },
    async 'repair-done'(el){
      const err = S.errors.find(e => e.id === el.dataset.id);
      err.repairDoneAt = new Date().toISOString();
      await M.saveError(err);
      UI.toast('Reçete tamamlandı');
      R.App.render();
    },
    async 'open-review'(){ R.Screens.week.openReview(); },
  };

  const change = {
    async 'block-subject'(el){
      const day = todayDoc();
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.subjectId = el.value || null;
      b.topicId = null;
      await M.saveDay(day.date);
      R.App.render();
    },
    async 'block-topic-ref'(el){
      const day = todayDoc();
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.topicId = el.value || null;
      await M.saveDay(day.date);
    },
    async 'block-topic'(el){
      const day = todayDoc();
      day.blocks.find(x => x.id === el.dataset.block).topic = el.value;
      await M.saveDay(day.date);
    },
    async 'block-num'(el){
      const day = todayDoc();
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b[el.dataset.field] = el.value === '' ? null : Number(el.value);
      await M.saveDay(day.date);
      R.App.render();
    },
    async sleep(el){
      const day = todayDoc();
      day.sleepHours = el.value === '' ? null : Number(el.value);
      await M.saveDay(day.date);
      R.App.render();
    },
    async 'day-note'(el){
      const day = todayDoc();
      day.note = el.value;
      await M.saveDay(day.date);
    },
  };

  return {
    id:'today',
    title:'Bugün',
    subtitle(){
      const wd = R.WEEKDAYS[U.weekdayIndex(U.today())];
      return wd.label + ' · ' + U.fmtDate(U.todayISO()) + ' · Hafta ' + M.currentWeek() + '/' + R.PLAN.totalWeeks;
    },
    actions(){
      return String(html`
        ${c.Button({ label:'Özeti paylaş', icon:'upload', size:'sm', act:'share-week' })}
        ${c.Button({ label:'Deneme ekle', icon:'exam', size:'sm', act:'go', data:{ 'data-route':'exams' } })}`);
    },
    render, afterRender, handle, change,
  };
})();

/* ==== js/screens/week.js ==== */
/* Hafta — kapasite sozlesmesi, 7 gunluk izgara ve weekly review.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.week = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const BLOCK_STATUS = [
    { value:'pending', label:'Bekliyor' }, { value:'done', label:'Tamam' },
    { value:'partial', label:'Yarım' }, { value:'skipped', label:'Atlandı' },
  ];

  function viewN(){ return S.ui.weekView || M.currentWeek(); }
  function weekOf(n){ return S.weeks[M.weekId(n)]; }

  /* ---------- 7 gunluk izgara ---------- */

  function DayColumn(dateObj){
    const iso = U.iso(dateObj);
    const day = S.days[iso];
    const wd = R.WEEKDAYS[U.weekdayIndex(dateObj)];
    const today = U.todayISO();
    const planned = day ? day.blocks.filter(b => b.slot !== 'Dinlenme').length : 0;
    const done = day ? day.blocks.filter(b => b.status === 'done').length : 0;

    const blocks = day
      ? map(day.blocks, b => html`<div class="${b.status === 'done' ? 'daycol__block is-done'
          : b.status === 'skipped' ? 'daycol__block is-skipped' : 'daycol__block'}">
          <b>${b.slot}</b><br/>${b.topic}</div>`)
      : map(wd.blocks, b => html`<div class="daycol__block is-preview"><b>${b.slot}</b><br/>${b.subject}</div>`);

    return html`
      <div class="${['daycol', iso === today && 'is-today', iso < today && 'is-past'].filter(Boolean).join(' ')}"
           data-act="open-day" data-date="${iso}">
        <div class="daycol__head"><span class="daycol__name">${wd.short}</span>
          <span class="daycol__date">${U.fmtShort(iso)}</span></div>
        ${blocks}
        ${when(day, () => html`<div class="tiny dim daycol__foot">${done}/${planned} tamam</div>`)}
      </div>`;
  }

  /* ---------- sozlesme ---------- */

  function TopicRow(t, i, signed, count){
    const subjectOpts = [{ value:'', label:'— ders —' }].concat(R.SUBJECTS.map(s => ({ value:s.id, label:s.name })));
    const num = (label, change, value) => K.Field({ label,
      input:K.Input({ type:'number', size:'sm', numeric:true, value, disabled:signed, change, data:{ 'data-i':i } }) });

    return K.Card({ flat:true, pad:'sm', class:'stack-sm', body:html`
      <div class="row gap-8">
        <span class="topicrow__order">${i+1}</span>
        ${K.Input({ class:'grow', value:t.name, aria:'konu adı', disabled:signed,
          change:'topic-name', data:{ 'data-i':i } })}
        ${when(count > 1 && !signed, () => K.IconButton({ icon:'close', size:'sm', plain:true,
          aria:'konuyu kaldır', act:'topic-remove', data:{ 'data-i':i } }))}
      </div>
      ${K.Cols(3, [
        num('Soru hedefi', 'topic-q', t.questionTarget),
        num('Doğruluk %', 'topic-acc', t.accuracy),
        K.Field({ label:'Ders', input:K.Select({ options:subjectOpts, value:t.subjectId || '', size:'sm',
          disabled:signed, change:'topic-subject', data:{ 'data-i':i } }) }),
      ])}` });
  }

  function contractCard(week, n){
    const signed = !!week.signedAt;
    const cap = C.capacityLoad(n);
    const over = !!(cap && cap.pct > 110);
    const curriculum = M.curriculumFor(n);

    return K.Card({
      title:'Haftalık sözleşme', hint:'contract', sub:'En fazla üç ana konu, çıktı temelli hedef',
      badge:signed ? K.Badge({ label:'İmzalandı', tone:'ok' }) : K.Badge({ label:'İmza bekliyor', tone:'warn' }),
      body:html`
        ${K.Stack(map(week.mainTopics, (t, i) => TopicRow(t, i, signed, week.mainTopics.length)), 'sm')}
        ${when(!signed && week.mainTopics.length < 3, () => K.Button({ label:'Konu ekle', icon:'plus',
          size:'sm', class:'mt-8', act:'topic-add' }))}

        <div class="cols-3 mt-16">
          ${K.Field({ label:'Haftalık soru hedefi', hint:'plan: '+curriculum.q,
            input:K.Input({ type:'number', numeric:true, value:week.questionTarget, disabled:signed, change:'week-q' }) })}
          ${K.Field({ label:'Kapasite (saat)',
            input:K.Input({ type:'number', numeric:true, step:0.5, value:U.round(week.capacityMin/60, 1), disabled:signed, change:'week-cap' }) })}
          ${K.Field({ label:'Davranış hedefi',
            input:K.Input({ value:week.behaviorGoal || '', placeholder:'ör. 6 gün 23:30 yatış', change:'week-behavior' }) })}
        </div>

        ${when(cap, () => html`<div class="mt-12">${K.Meter({ label:'Planlanan yük / kapasite', value:cap.pct,
          text:U.fmtMin(cap.planned)+' / '+U.fmtMin(cap.capacity),
          tone:over ? 'danger' : cap.pct > 95 ? 'warn' : '' })}</div>`)}
        ${when(over, () => html`<div class="mt-10">${K.Notice({ tone:'warn',
          body:'Planlanan süre kapasitenin %110’unu aşıyor. İmzadan önce blok azalt veya kapasiteyi gerçekçi yaz.' })}</div>`)}`,
      foot:K.Row(signed
        ? html`<span class="small muted">${U.fmtDate(week.signedAt.slice(0, 10))} tarihinde imzalandı.</span>
               <span class="grow"></span>
               ${K.Button({ label:'Revize et', size:'sm', act:'week-revise' })}`
        : html`${K.Button({ label:'Haftayı imzala', icon:'check', tone:'primary', act:'week-sign', disabled:over })}
               <span class="small dim">Geçen haftanın verisi görülmeden yeni hedef yazılmaz.</span>`,
        { wrap:true }),
    });
  }

  /* ---------- review ---------- */

  function reasonChips(reasons){
    const keys = Object.keys(reasons);
    if(!keys.length) return null;
    return html`<div class="stack-xs"><span class="mono-label">Sapma nedenleri</span>
      ${K.Row(map(keys, r => K.Chip(r+' × '+reasons[r])), { wrap:true })}</div>`;
  }

  function reviewCard(n){
    const rev = S.reviews[M.weekId(n)];
    const comp = C.planCompletion(n);
    const qr = C.questionRealization(n);
    const reasons = C.skipReasonCounts(n);

    return K.Card({
      title:'Weekly review', hint:'review', sub:'Pazar · 30–40 dakika',
      badge:rev ? K.Badge({ label:'tamamlandı', tone:'ok' }) : K.Badge({ label:'bekliyor', tone:'muted' }),
      body:html`
        <div class="cols-2 mb-10">
          ${K.Stat({ label:'Plan tamamlama', value:comp == null ? '—' : '%'+comp,
            tone:comp == null ? null : comp >= 85 ? 'ok' : comp >= 70 ? 'warn' : 'danger' })}
          ${K.Stat({ label:'Soru gerçekleşme', value:qr ? '%'+qr.pct : '—', note:qr ? qr.solved+' / '+qr.target : 'hedef yok' })}
        </div>
        ${reasonChips(reasons) || html`<p class="small dim">Bu hafta atlanan blok yok.</p>`}
        ${when(rev && rev.decision, () => html`<div class="mt-10">${K.Notice({ tone:'ok', title:'Düzeltme:', body:rev.decision })}</div>`)}
        ${K.Button({ label:rev ? 'Review’u güncelle' : 'Review’u doldur', tone:'primary', block:true,
          class:'mt-12', act:'open-review' })}`,
    });
  }

  /* Haftalık özet — review yazmadan önce bakılacak tek kart. */
  function digestCard(n){
    const comp = C.planCompletion(n);
    const qr = C.questionRealization(n);
    const time = C.timeRealization(n);
    const blocks = C.weekBlocks(n, true);
    const solved = U.sum(blocks.map(b => b.actualQ || 0));
    const correct = U.sum(blocks.map(b => b.correctQ || 0));
    const acc = solved ? U.pct(correct, solved) : null;
    const exams = S.exams.filter(e => {
      const d = U.parse(e.date);
      return d >= M.weekStart(n) && d <= M.weekEnd(n);
    });
    const newErrors = S.errors.filter(e => {
      const d = (e.createdAt || '').slice(0, 10);
      return d && d >= U.iso(M.weekStart(n)) && d <= U.iso(M.weekEnd(n));
    });
    const notes = S.videoNotes.filter(v => {
      const d = (v.createdAt || '').slice(0, 10);
      return d && d >= U.iso(M.weekStart(n)) && d <= U.iso(M.weekEnd(n));
    });
    const reviewed = S.cards.filter(c => c.lastReviewedAt
      && c.lastReviewedAt >= U.iso(M.weekStart(n)) && c.lastReviewedAt <= U.iso(M.weekEnd(n))).length;
    const reasons = C.skipReasonCounts(n);
    const topReason = Object.keys(reasons).sort((a, b) => reasons[b] - reasons[a])[0];

    const lines = [];
    if(comp != null) lines.push(comp >= 85 ? 'Plan tamamlama hedefte.'
      : comp >= 70 ? 'Plan tamamlama hedefin altında ama toparlanabilir.'
      : 'Plan tamamlama düşük; hedef hacmi gerçekçi değil olabilir.');
    if(acc != null && acc < 70) lines.push('Çözülen soruda doğruluk %'+acc+' — hız değil isabet sorunu.');
    if(topReason) lines.push('En sık sapma nedeni: '+topReason+' ('+reasons[topReason]+' blok).');
    if(time.target && time.pct < 70) lines.push('Planlanan sürenin %'+time.pct+'’i çalışıldı.');
    if(!lines.length) lines.push('Bu hafta için kayda değer sapma yok.');

    return K.Card({
      title:'Hafta özeti', sub:'Review yazmadan önce buna bak',
      badge:comp == null ? null : K.Badge({ label:'%'+comp,
        tone:comp >= 85 ? 'ok' : comp >= 70 ? 'warn' : 'danger' }),
      body:html`
        ${K.Cols(4, [
          K.Stat({ label:'Soru', value:U.fmtNum(solved), note:qr ? 'hedef '+qr.target : 'hedef yok' }),
          K.Stat({ label:'Doğruluk', value:acc == null ? '—' : '%'+acc,
            tone:acc == null ? null : acc >= 70 ? 'ok' : 'warn' }),
          K.Stat({ label:'Süre', value:U.fmtMin(time.actual), note:'plan '+U.fmtMin(time.target) }),
          K.Stat({ label:'Tekrar', value:U.fmtNum(reviewed), note:'kart çözüldü' }),
        ])}
        ${K.Row([
          K.Chip(U.plural(exams.length, 'deneme', 'deneme')),
          K.Chip(U.plural(newErrors.length, 'yeni yanlış', 'yeni yanlış')),
          K.Chip(U.plural(notes.length, 'ders notu', 'ders notu')),
        ], { wrap:true })}
        <ul class="bullets small muted mt-10">${map(lines, l => html`<li>${l}</li>`)}</ul>`,
    });
  }

  function openReview(){
    const n = viewN();
    const rev = S.reviews[M.weekId(n)] || { planned:'', done:'', why:'', decision:'', carry:[] };
    const comp = C.planCompletion(n);
    const qr = C.questionRealization(n);
    const tyt = C.medianTrend('TYT');
    const base = C.examBase('TYT');
    const area = (label, id, value, placeholder) => K.Field({ label,
      input:K.Textarea({ id, rows:2, value, placeholder }) });

    const body = K.Stack([
      K.Notice({ tone:'info', body:'Dört sütun doldurulur: planlandı / yapıldı / neden sapıldı / düzeltme. '
        + 'Yeni haftaya yalnız en yüksek etkili iki eksik taşınır.' }),
      K.Cols(4, [
        K.Stat({ label:'Plan', value:comp == null ? '—' : '%'+comp }),
        K.Stat({ label:'Soru', value:qr ? '%'+qr.pct : '—' }),
        K.Stat({ label:'Son 3 medyan', value:tyt.last3 == null ? '—' : U.fmtNet(tyt.last3) }),
        K.Stat({ label:'Taban', value:base == null ? '—' : U.fmtNet(base) }),
      ]),
      reasonChips(C.skipReasonCounts(n)),
      area('Planlandı', 'rv-planned', rev.planned, 'Bu hafta ne planlanmıştı?'),
      area('Yapıldı', 'rv-done', rev.done, 'Fiilen ne yapıldı?'),
      area('Neden sapıldı', 'rv-why', rev.why, 'Kök neden — “vakit yoktu” değil, hangi blok hangi engelle düştü?'),
      area('Düzeltme', 'rv-decision', rev.decision, 'Gelecek hafta ne değişecek? Tek somut değişiklik.'),
      K.Field({ label:'Yeni haftaya taşınacak en fazla 2 eksik',
        input:K.Input({ id:'rv-carry', value:(rev.carry || []).join(', '),
          placeholder:'ör. AYT fonksiyon tekrarı, üçgende benzerlik' }) }),
    ]);

    UI.sheet({
      title:'Weekly review — Hafta '+n,
      subtitle:U.fmtRange(M.weekStart(n), M.weekEnd(n)),
      body:String(body),
      footer:String(html`${K.Button({ label:'Kapat', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet ve haftayı kapat', tone:'primary', act:'save-review', data:{ 'data-n':n } })}`),
      wide:true, noFocus:true,
    });
  }

  function openDay(dateISO){
    const day = S.days[dateISO];
    const wd = R.WEEKDAYS[U.weekdayIndex(dateISO)];

    if(!day){
      UI.sheet({
        title:U.fmtDate(dateISO), subtitle:wd.label, noFocus:true,
        body:String(K.Notice({ tone:'info', body:'Bu gün henüz açılmadı. Gün geldiğinde plan otomatik oluşturulur; '
          + 'şimdiden açmak istersen aşağıdaki düğmeyi kullan.' })),
        footer:String(html`${K.Button({ label:'Kapat', act:'sheet-close' })}
          ${K.Button({ label:'Günü oluştur', tone:'primary', act:'create-day', data:{ 'data-date':dateISO } })}`),
      });
      return;
    }

    const body = K.Stack(map(day.blocks, b => K.Card({ flat:true, pad:'sm', body:html`
      <div class="row between"><b class="small">${b.slot}</b><span class="tiny dim">${b.targetMin} dk</span></div>
      ${K.Input({ size:'sm', class:'mt-8', value:b.topic, aria:b.slot+' konusu',
        change:'day-topic', data:{ 'data-date':dateISO, 'data-block':b.id } })}
      <div class="mt-8">${K.Segmented({ items:BLOCK_STATUS, value:b.status, act:'day-status', block:true, primary:true,
        aria:b.slot+' durumu', data:{ 'data-date':dateISO, 'data-block':b.id } })}</div>` })), 'sm');

    UI.sheet({
      title:U.fmtDate(dateISO),
      subtitle:wd.label+' · '+(day.ritual ? 'ritüel günü' : 'çalışma günü'),
      body:String(body), noFocus:true,
      footer:String(K.Button({ label:'Kapat', act:'sheet-close' })),
    });
  }

  /* ---------- ekran ---------- */

  function weekNav(n, week, phase){
    const isCurrent = n === M.currentWeek();
    return K.Span(12, K.Row([
      html`<div class="row-sm">
        ${K.IconButton({ icon:'left', aria:'önceki hafta', act:'week-nav', data:{ 'data-n':n-1 }, disabled:n <= 1 })}
        <div><h2 class="weekhead__title">Hafta ${n} — ${week.title}</h2>
          <span class="small dim">${U.fmtRange(M.weekStart(n), M.weekEnd(n))} · ${phase.label} — ${phase.theme}</span></div>
        ${K.IconButton({ icon:'right', aria:'sonraki hafta', act:'week-nav', data:{ 'data-n':n+1 }, disabled:n >= R.PLAN.totalWeeks })}
      </div>`,
      isCurrent ? K.Badge({ label:'bu hafta', tone:'ok' })
        : K.Button({ label:'Bu haftaya dön', size:'sm', act:'week-nav', data:{ 'data-n':M.currentWeek() } }),
    ], { between:true, wrap:true }));
  }

  async function render(){
    const n = viewN();
    await M.ensureWeek(n);
    const week = weekOf(n);
    const phase = M.phaseOf(n);
    const curriculum = M.curriculumFor(n);
    const history = C.completionHistory(8).map(h => ({ label:'H'+h.n, value:h.value }));

    return String(K.Grid([
      weekNav(n, week, phase),
      K.Span(12, html`<div class="weekgrid">${map(M.weekDates(n), DayColumn)}</div>`),

      K.Span(6, K.Stack([
        contractCard(week, n),
        K.Card({ title:'Plan tamamlama geçmişi', sub:'Hedef %85',
          body:raw(UI.barChart(history, { targetLine:85, goodAt:85 })) }),
      ])),

      K.Span(4, K.Stack([
        digestCard(n),
        reviewCard(n),
        K.Card({ title:'Müfredat referansı', sub:'Bu haftanın plandaki karşılığı', body:html`
          <div class="stack-xs"><span class="mono-label">Konu blokları</span>
            ${K.Row(map(curriculum.topics, t => K.Chip(t)), { wrap:true })}</div>
          <div class="stack-xs mt-10"><span class="mono-label">Deneme planı</span>
            <p class="small">${curriculum.exam}</p></div>
          <div class="stack-xs mt-10"><span class="mono-label">Kontrol noktası</span>
            <p class="small">${curriculum.check}</p></div>` }),
        when(week.revisions && week.revisions.length, () => K.Card({ title:'Revizyon kaydı',
          body:html`<div class="stack-xs">${map(week.revisions, r => html`
            <div class="small"><b>${U.fmtShort(r.at.slice(0, 10))}</b> — ${r.reason}</div>`)}</div>` })),
      ])),

      K.Span(12, raw(UI.rail(['contract', 'capacity', 'review', 'carry', 'plan-completion']))),
    ]));
  }

  const handle = {
    async 'week-nav'(el){
      S.ui.weekView = U.clamp(Number(el.dataset.n), 1, R.PLAN.totalWeeks);
      await M.ensureWeek(S.ui.weekView);
      R.App.render();
    },
    async 'week-sign'(){
      const n = viewN();
      weekOf(n).signedAt = new Date().toISOString();
      await M.saveWeek(n);
      UI.toast('Hafta imzalandı');
      R.App.render();
    },
    async 'week-revise'(){
      const n = viewN();
      UI.sheet({
        title:'Sözleşmeyi revize et',
        body:String(html`
          ${K.Notice({ tone:'info', body:'İmzalı bir hafta değiştirildiğinde neden kaydedilir; '
            + 'bu, sonraki review’da sapma analizini mümkün kılar.' })}
          ${K.Field({ label:'Revizyon nedeni', input:K.Textarea({ id:'rev-reason', rows:2,
            placeholder:'ör. hastalık nedeniyle soru hedefi %20 azaltıldı' }) })}`),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Kaydet ve aç', tone:'primary', act:'week-revise-save', data:{ 'data-n':n } })}`),
      });
    },
    async 'week-revise-save'(el){
      const n = Number(el.dataset.n);
      const week = weekOf(n);
      const reason = document.getElementById('rev-reason').value.trim() || 'Neden belirtilmedi';
      week.revisions = (week.revisions || []).concat([{ at:new Date().toISOString(), reason }]);
      week.signedAt = null;
      await M.saveWeek(n);
      UI.closeSheet();
      UI.toast('Sözleşme yeniden açıldı');
      R.App.render();
    },
    async 'topic-add'(){
      const n = viewN();
      const week = weekOf(n);
      if(week.mainTopics.length >= 3) return;
      week.mainTopics.push({ name:'', questionTarget:100, accuracy:70, subjectId:null, topicId:null });
      await M.saveWeek(n);
      R.App.render();
    },
    async 'topic-remove'(el){
      const n = viewN();
      weekOf(n).mainTopics.splice(Number(el.dataset.i), 1);
      await M.saveWeek(n);
      R.App.render();
    },
    async 'open-review'(){ openReview(); },
    async 'save-review'(el){
      const n = Number(el.dataset.n);
      const data = {
        planned:document.getElementById('rv-planned').value,
        done:document.getElementById('rv-done').value,
        why:document.getElementById('rv-why').value,
        decision:document.getElementById('rv-decision').value,
        carry:document.getElementById('rv-carry').value.split(',').map(s => s.trim()).filter(Boolean).slice(0, 2),
        completion:C.planCompletion(n),
        savedAt:new Date().toISOString(),
      };
      await M.saveReview(n, data);
      if(n < R.PLAN.totalWeeks && data.carry.length){
        const next = await M.ensureWeek(n+1);
        next.carryIn = data.carry;
        await M.saveWeek(n+1);
      }
      UI.closeSheet();
      UI.toast('Review kaydedildi');
      R.App.render();
    },
    async 'open-day'(el){ openDay(el.dataset.date); },
    async 'create-day'(el){
      await M.ensureDay(el.dataset.date);
      UI.closeSheet();
      R.App.render();
    },
    async 'day-status'(el){
      const day = S.days[el.dataset.date];
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.status = el.dataset.value;
      await M.saveDay(day.date);
      openDay(el.dataset.date);
      R.App.render();
    },
  };

  async function patchTopic(el, fn){
    const n = viewN();
    fn(weekOf(n).mainTopics[Number(el.dataset.i)]);
    await M.saveWeek(n);
  }

  const change = {
    async 'topic-name'(el){ await patchTopic(el, t => { t.name = el.value; }); },
    async 'topic-q'(el){ await patchTopic(el, t => { t.questionTarget = Number(el.value) || 0; }); },
    async 'topic-acc'(el){ await patchTopic(el, t => { t.accuracy = Number(el.value) || 0; }); },
    async 'topic-subject'(el){ await patchTopic(el, t => { t.subjectId = el.value || null; }); },
    async 'week-q'(el){
      const n = viewN(); weekOf(n).questionTarget = Number(el.value) || 0; await M.saveWeek(n); R.App.render();
    },
    async 'week-cap'(el){
      const n = viewN(); weekOf(n).capacityMin = Math.round((Number(el.value) || 0)*60); await M.saveWeek(n); R.App.render();
    },
    async 'week-behavior'(el){
      const n = viewN(); weekOf(n).behaviorGoal = el.value; await M.saveWeek(n);
    },
    async 'day-topic'(el){
      const day = S.days[el.dataset.date];
      const b = day.blocks.find(x => x.id === el.dataset.block);
      b.topic = el.value;
      await M.saveDay(day.date);
    },
  };

  return {
    id:'week',
    title:'Hafta',
    subtitle(){
      const n = viewN();
      return 'Hafta '+n+'/'+R.PLAN.totalWeeks+' · '+U.fmtRange(M.weekStart(n), M.weekEnd(n));
    },
    actions(){
      return String(K.Button({ label:'Weekly review', icon:'check', size:'sm', act:'open-review' }));
    },
    render, handle, change, openReview,
  };
})();

/* ==== js/screens/exams.js ==== */
/* Deneme — kayit, net hesabi, analiz protokolu ve hata olaylari.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz; metin h`` icinde
   otomatik kacirilir, yapisal parcalar C.* bilesenlerinden gelir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.exams = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const FILTERS = [{ value:'all', label:'Tümü' }, { value:'TYT', label:'TYT' }, { value:'AYT', label:'AYT' }];

  function analysisState(exam){
    if(exam.analysisCompletedAt) return { label:'Analiz tamam', tone:'ok' };
    const hours = (Date.now() - new Date(exam.date+'T12:00:00').getTime())/3600000;
    if(hours > 24) return { label:'Analiz borcu', tone:'danger' };
    return { label:'Analiz bekliyor', tone:'warn' };
  }

  /* ---------- liste ---------- */

  function ExamRow(exam){
    const st = analysisState(exam);
    const errs = S.errors.filter(e => e.examId === exam.id).length;
    const meta = [U.fmtDate(exam.date), exam.publisher, errs ? errs+' hata kaydı' : null].filter(Boolean).join(' · ');
    return html`
      <div class="listitem listitem--tap" data-act="open-exam" data-id="${exam.id}">
        <div class="exam-row__net">
          <div class="num exam-net">${U.fmtNet(M.examNet(exam))}</div>
          <div class="tiny dim">net</div>
        </div>
        <div class="grow">
          <div class="row-sm"><b>${exam.type}</b>${K.Badge({ label:exam.family, tone:'muted' })}</div>
          <div class="tiny dim">${meta}</div>
        </div>
        ${K.Badge({ label:st.label, tone:st.tone })}
      </div>`;
  }

  /* Dönem başına plan/gerçekleşen. Dört sütunlu tablo bu dar kolonda
     taşıp kesiliyordu ("Branş" başlığı yarım, değerler görünmüyordu);
     dönem başlığı üstte, üç ölçüm altında etiket olarak dizilir. */
  function volumeTable(){
    const curWeek = M.currentWeek();
    const pill = (label, actual, target, note) => {
      if(!target){
        return html`<span class="volpill volpill--off"><b>${label}</b> ${note || '—'}</span>`;
      }
      const span = target[1] !== target[0] ? target[0]+'–'+target[1] : String(target[0]);
      return html`<span class="${'volpill' + (actual >= target[0] ? ' is-ok' : '')}">
        <b>${label}</b> <span class="num">${actual}</span><span class="dim">/${span}</span></span>`;
    };
    return html`<div class="vollist">${map(C.examVolumeProgress(), v => {
      const active = curWeek >= v.weeks[0] && curWeek <= v.weeks[1];
      return html`<div class="${'volrow' + (active ? ' is-now' : '')}">
        <div class="volrow__head">
          <span class="volrow__period">${v.period}</span>
          ${when(active, () => K.Badge({ label:'şimdi', tone:'ok' }))}
        </div>
        <div class="volrow__cells">
          ${pill('TYT', v.actual.tyt, v.tyt)}
          ${pill('AYT', v.actual.ayt, v.ayt, v.aytNote)}
          ${pill('Branş', v.actual.branch, v.branch, v.branchNote)}
        </div>
      </div>`;
    })}</div>`;
  }

  function listView(){
    const filter = S.ui.examFilter || 'all';
    let list = S.exams.slice().sort((a, b) => b.date.localeCompare(a.date));
    if(filter !== 'all') list = list.filter(e => e.family === filter);
    const pg = K.paginate(list, S.ui.examPage || 1, 25);

    const body = list.length
      ? html`<div class="list">${map(pg.items, ExamRow)}</div>
             ${K.Pager({ page:pg.page, pages:pg.pages, total:pg.total, act:'exam-page' })}`
      : K.Empty({ icon:'exam',
          text:'Henüz deneme eklenmedi. Cumartesi denemesi yalnız skor üretmez; bir sonraki haftanın ders dağılımını belirler.',
          action:K.Button({ label:'İlk denemeyi ekle', icon:'plus', tone:'primary', act:'new-exam' }) });

    return K.Grid([
      K.Span(8, K.Stack([
        K.Row([
          K.Segmented({ items:FILTERS, value:filter, act:'exam-filter', aria:'Deneme ailesi' }),
          html`<span class="small dim">${U.plural(list.length, 'kayıt', 'kayıt')}</span>`,
        ], { between:true, wrap:true }),
        K.Card({ body, pad:'sm' }),
      ])),
      K.Span(3, K.Stack([
        K.Card({ title:'Deneme hacmi', hint:'exam-volume', sub:'Plan / gerçekleşen', body:volumeTable() }),
        K.Card({ title:'Yayın merdiveni', hint:'publisher', sub:'Zorluk kademesi',
          body:html`<div class="ladder">${map(R.PUBLISHER_LADDER, l => html`
            <div class="ladder__row"><span class="ladder__level">${l.level}</span>
              <span class="muted">${l.detail}</span></div>`)}</div>` }),
      ])),
      K.Span(12, raw(UI.rail(['net', 'analysis-debt', 'error-tags', 'exam-volume', 'publisher']))),
    ]);
  }

  /* ---------- detay ---------- */

  function NumCell(o){
    return K.Input({ type:'number', size:'sm', numeric:true, class:'input--cell',
      value:o.value, aria:o.aria, change:o.change, data:o.data });
  }

  function testTable(exam){
    const rows = exam.tests.map((t, i) => {
      const net = M.testNet(t);
      const answered = t.correct + t.wrong;
      const acc = answered ? U.pct(t.correct, answered) : 0;
      const band = R.TEST_BANDS.find(b => b.exam === exam.family && b.testKey && t.name.indexOf(b.testKey) >= 0);
      const num = (field, label) => NumCell({ value:t[field], aria:t.name+' '+label,
        change:'test-num', data:{ 'data-i':i, 'data-field':field } });
      return [
        t.name,
        num('correct', 'doğru'), num('wrong', 'yanlış'), num('blank', 'boş'),
        html`<b class="num">${U.fmtNet(net)}</b>${when(band, () => html`<div class="tiny dim">hedef ${band.low}–${band.high}</div>`)}`,
        html`<span class="${acc >= 70 ? 'num' : 'num dim'}">%${acc}</span>`,
      ];
    });
    return K.Table({ rows, headers:['Test', { label:'D', num:true }, { label:'Y', num:true },
      { label:'B', num:true }, { label:'Net', num:true }, { label:'Doğruluk', num:true }] });
  }

  function protocolList(steps){
    return html`<div class="checklist stack-xs">${map(R.ANALYSIS_PROTOCOL, (p, i) => html`
      <label class="${p.key && steps[p.key] ? 'check is-done' : 'check'}" title="${p.detail}">
        <input type="checkbox" ${steps[p.key] ? raw('checked') : ''} data-act="protocol-step" data-key="${p.key}"/>
        <span><b>${(i+1)+'. '+p.title}</b>${when(p.time !== '—', () => html` <span class="tiny dim">${p.time}</span>`)}</span>
      </label>`)}</div>`;
  }

  function ErrorRow(e){
    const label = (e.testName || '—') + (e.questionNo ? ' · soru '+e.questionNo : '');
    return html`
      <div class="listitem">
        ${raw(UI.tagDot(e.tag))}
        <div class="grow">
          <div class="row-sm"><b class="small">${label}</b>
            ${K.Badge({ label:e.tag+' · '+R.ERROR_TAGS[e.tag].name, tone:'muted' })}
            ${when(e.status, () => K.Badge({ label:e.status, tone:'muted' }))}</div>
          <div class="tiny dim">${e.rootCause || 'kök neden yazılmadı'}</div>
          ${when(e.principle, () => html`<div class="tiny">İlke: ${e.principle}</div>`)}
        </div>
        ${K.IconButton({ icon:'edit', size:'sm', plain:true, aria:'hatayı düzenle', act:'edit-error', data:{ 'data-id':e.id } })}
      </div>`;
  }

  function detailView(id){
    const exam = S.exams.find(e => e.id === id);
    if(!exam) return K.Empty({ text:'Deneme bulunamadı.',
      action:K.Button({ label:'Denemelere dön', act:'exam-back' }) });

    const errs = S.errors.filter(e => e.examId === id);
    const st = analysisState(exam);
    const steps = exam.protocol || {};
    const dist = {};
    errs.forEach(e => { dist[e.tag] = (dist[e.tag] || 0) + 1; });
    const segs = Object.keys(R.ERROR_TAGS).map(k => ({ label:k, value:dist[k] || 0, color:R.ERROR_TAGS[k].color }));
    const meta = [U.fmtDate(exam.date), exam.publisher, exam.duration ? exam.duration+' dk' : null].filter(Boolean).join(' · ');

    return K.Grid([
      K.Span(12, K.Row([
        K.Button({ label:'Denemeler', icon:'left', size:'sm', tone:'ghost', act:'exam-back' }),
        html`<div class="row-sm">${K.Badge({ label:st.label, tone:st.tone })}
          ${K.IconButton({ icon:'trash', size:'sm', aria:'denemeyi sil', act:'delete-exam', data:{ 'data-id':exam.id } })}</div>`,
      ], { between:true, wrap:true })),

      K.Span(8, K.Stack([
        K.Card({
          title:exam.type, sub:meta,
          actions:html`<div class="right">
            <div class="num exam-net exam-net--lg">${U.fmtNet(M.examNet(exam))}</div>
            <div class="tiny dim">toplam net</div></div>`,
          body:testTable(exam),
        }),
        K.Card({
          title:'Hata analizi', sub:U.plural(errs.length, 'kayıt', 'kayıt'),
          actions:K.Button({ label:'Hata ekle', icon:'plus', size:'sm', tone:'primary', act:'new-error', data:{ 'data-exam':exam.id } }),
          body:html`
            ${when(errs.length, () => html`<div class="mb-12">${raw(UI.stackBar(segs))}</div>`)}
            ${errs.length
              ? html`<div class="list">${map(errs, ErrorRow)}</div>`
              : K.Empty({ icon:'list',
                  text:'Henüz hata kaydedilmedi. Her yanlış ve boş için konu ve etiket girilir; yavaş sorular ayrıca işaretlenir.' })}`,
        }),
      ])),

      K.Span(4, K.Stack([
        K.Card({
          title:'Analiz protokolü', hint:'analysis-protocol', sub:'24 saat içinde',
          body:html`
            ${protocolList(steps)}
            ${exam.analysisCompletedAt
              ? html`<div class="mt-12">${K.Notice({ tone:'ok',
                  body:'Analiz '+U.fmtDate(exam.analysisCompletedAt.slice(0, 10))+' tarihinde tamamlandı.' })}</div>`
              : K.Button({ label:'Analizi tamamla', icon:'check', tone:'primary', block:true,
                  class:'mt-12', act:'complete-analysis', data:{ 'data-id':exam.id } })}`,
        }),
        K.Card({
          title:'Süre kaydı', hint:'time-drift', sub:'Test başına harcanan dakika',
          body:K.Stack(map(exam.tests, (t, i) => html`
            <div class="row between"><span class="small">${t.name}</span>
              <div class="row-sm">${K.Input({ type:'number', size:'sm', numeric:true, class:'input--mins',
                placeholder:'dk', value:t.minutes == null ? '' : t.minutes, aria:t.name+' süresi',
                change:'test-minutes', data:{ 'data-i':i } })}<span class="tiny dim">dk</span></div>
            </div>`), 'sm'),
        }),
      ])),
    ]);
  }


  /* ---------- süreli oturum (sınav günü provası) ---------- */

  let tick = null;
  function startTick(){
    stopTick();
    tick = setInterval(() => {
      const total = document.getElementById('run-total');
      if(!R.ExamRun.active() || !total){ stopTick(); return; }
      total.textContent = U.fmtClock(R.ExamRun.remaining());
      const test = document.getElementById('run-test');
      if(test) test.textContent = U.fmtClock(R.ExamRun.elapsedTest());
    }, 1000);
  }
  function stopTick(){ if(tick){ clearInterval(tick); tick = null; } }

  function runView(){
    const run = R.ExamRun.active();
    const t = R.ExamRun.currentTest();
    const left = R.ExamRun.remaining();
    const marks = run.marks.filter(m => m.test === t.name);
    const paused = R.ExamRun.isPaused();

    return K.Grid([
      K.Span(8, K.Stack([
        K.Card({ pad:'sm', body:html`
          <div class="row between wrap gap-8">
            <div>
              <div class="mono-label">${run.name}${run.publisher ? ' · ' + run.publisher : ''}</div>
              <div class="${left <= 300 ? 'runclock is-low' : 'runclock'}" id="run-total">${U.fmtClock(left)}</div>
              <div class="tiny dim">kalan toplam süre</div>
            </div>
            <div class="right">
              <div class="mono-label">${t.name}</div>
              <div class="runclock runclock--sm" id="run-test">${U.fmtClock(R.ExamRun.elapsedTest())}</div>
              <div class="tiny dim">${marks.length} / ${t.q} soru işaretlendi</div>
            </div>
          </div>
          ${K.Bar({ value:U.pct(marks.length, t.q), tone:'' })}` }),

        html`<div class="row gap-8">${map(Object.keys(R.ExamRun.MARKS), k => {
          const m = R.ExamRun.MARKS[k];
          const cls = m.tone === 'ok' ? 'btn grow btn--primary'
            : m.tone === 'warn' ? 'btn grow' : 'btn grow btn--ghost';
          return html`<button class="${cls}" data-act="run-mark" data-kind="${k}"
            ${paused ? raw('disabled') : ''}>
            <span>${m.label}</span><span class="tiny dim">${m.key}</span></button>`;
        })}</div>`,

        K.Row([
          K.Button({ label:'Geri al', size:'sm', tone:'ghost', act:'run-undo', disabled:!run.marks.length }),
          K.Row([
            K.Button({ label:paused ? 'Devam et' : 'Duraklat', size:'sm',
              icon:paused ? 'play' : 'pause', act:'run-pause' }),
            K.Button({ label:'Sonraki test', size:'sm', act:'run-next',
              disabled:run.index >= run.tests.length - 1 }),
            K.Button({ label:'Bitir', size:'sm', tone:'primary', act:'run-finish' }),
          ], { wrap:true }),
        ], { between:true, wrap:true }),

        K.Card({ title:'Testler', sub:'Tıklayarak geç — süre o teste yazılır',
          body:html`<div class="stack-xs">${map(run.tests, (x, i) => html`
            <button class="${'runtest' + (i === run.index ? ' is-on' : '') + (x.finished ? ' is-done' : '')}"
              data-act="run-goto" data-i="${i}">
              <span class="small strong">${x.name}</span>
              <span class="tiny dim num">${U.fmtClock(i === run.index ? R.ExamRun.elapsedTest() : x.seconds)} · ${x.q} soru</span>
            </button>`)}</div>` }),
      ])),

      K.Span(4, K.Stack([
        K.Notice({ tone:'info', title:'Nasıl kullanılır?',
          body:'Her soruyu bitirdiğinde bir tuşa bas: 1 yaptım, 2 zorlandım, 3 atladım. '
             + 'Sistem soru başına süreyi kendisi hesaplar; sonunda dakikaları elle girmene gerek kalmaz.' }),
        K.Card({ title:'Son işaretler', sub:U.plural(run.marks.length, 'işaret', 'işaret'),
          body:run.marks.length
            ? html`<div class="stack-xs">${map(run.marks.slice(-8).reverse(), m => html`
                <div class="row between">
                  <span class="small">${m.test} · ${m.no}. soru</span>
                  <span class="tiny dim num">${m.spent} sn · ${R.ExamRun.MARKS[m.kind].label}</span>
                </div>`)}</div>`
            : K.Empty({ icon:'clock', text:'Henüz işaret yok.' }) }),
        raw(UI.rail(['time-drift', 'analysis-protocol'])),
      ])),
    ]);
  }

  function startRunSheet(){
    const opts = R.EXAM_TEMPLATES.map(t => ({ value:t.id, label:t.name + ' · ' + t.duration + ' dk' }));
    UI.sheet({
      title:'Süreli oturum', subtitle:'Sınav koşullarında prova — süre otomatik ölçülür',
      body:String(K.Stack([
        K.Notice({ tone:'info', body:'Oturum başlayınca kronometre işler. Her soruyu bitirdiğinde '
          + 'bir tuşa basarsın; sistem soru başına süreyi hesaplar.' }),
        K.Cols(2, [
          K.Field({ label:'Şablon', input:K.Select({ id:'rn-tmpl', options:opts, value:'tyt-full' }) }),
          K.Field({ label:'Yayın', input:K.Input({ id:'rn-pub', placeholder:'ör. 345' }) }),
        ]),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Başlat', tone:'primary', icon:'play', act:'run-start' })}`),
    });
  }

  function finishSheet(){
    const run = R.ExamRun.active();
    if(!run) return;
    const sum = R.ExamRun.summary();
    const cell = (key, ph, i, aria) => K.Input({ type:'number', size:'sm', numeric:true,
      class:'input--cell', placeholder:ph, aria:aria, data:{ 'data-run':key, 'data-i':i } });

    UI.sheet({
      title:'Oturumu bitir', subtitle:'Netleri gir — süreler zaten ölçüldü', wide:true,
      body:String(K.Stack([
        K.Cols(3, [
          K.Stat({ label:'Toplam süre', value:U.fmtClock(sum.totalSeconds) }),
          K.Stat({ label:'Süre sapması', value:(sum.overtime > 0 ? '+' : '') + Math.round(sum.overtime/60),
            unit:' dk', tone:sum.overtime > 300 ? 'danger' : sum.overtime > 0 ? 'warn' : 'ok' }),
          K.Stat({ label:'İşaret', value:sum.marks, note:sum.slow + ' zorlandım' }),
        ]),
        html`<div class="stack-sm">${map(run.tests, (t, i) => html`
          <div class="card card--flat card--pad-sm">
            <div class="row between"><b class="small">${t.name}</b>
              <span class="tiny dim num">${U.fmtClock(sum.perTest[i].seconds)} · plan ${U.fmtClock(sum.perTest[i].planned)}</span></div>
            <div class="row-sm mt-8">
              ${cell('c', 'D', i, t.name + ' doğru')}
              ${cell('w', 'Y', i, t.name + ' yanlış')}
              ${cell('b', 'B', i, t.name + ' boş')}
              <span class="tiny dim">/ ${t.q}</span>
            </div>
          </div>`)}</div>`,
        when(sum.warmup, () => K.Notice({ tone:'warn', body:sum.warmup })),
      ])),
      footer:String(html`${K.Button({ label:'İptal et', tone:'danger', act:'run-cancel' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'run-save' })}`),
    });
  }

  /* ---------- formlar ---------- */

  function newExamSheet(){
    const tmplOptions = R.EXAM_TEMPLATES.map(t => ({ value:t.id, label:t.name }));
    const body = K.Stack([
      K.Cols(2, [
        K.Field({ label:'Tarih', input:K.Input({ id:'ex-date', type:'date', value:U.todayISO() }) }),
        K.Field({ label:'Şablon', input:K.Select({ id:'ex-tmpl', options:tmplOptions, value:'tyt-full' }) }),
      ]),
      K.Cols(2, [
        K.Field({ label:'Yayın / aile', hint:'trend için en az 3 deneme aynı aileden',
          input:K.Input({ id:'ex-pub', placeholder:'ör. 345, Bilgi Sarmal, Endemik' }) }),
        K.Field({ label:'Toplam süre (dk)', input:K.Input({ id:'ex-dur', type:'number', numeric:true, value:165 }) }),
      ]),
      raw('<div id="ex-tests" class="stack-sm"></div>'),
      K.Notice({ tone:'info', body:'Net otomatik hesaplanır: doğru − yanlış/4. Boş bırakılan testler kaydedilmez.' }),
    ]);

    UI.sheet({
      title:'Deneme ekle', subtitle:'Hızlı kayıt — hedef 60 saniyenin altı',
      body:String(body),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}${K.Button({ label:'Kaydet', tone:'primary', act:'save-exam' })}`),
    });

    renderTemplateRows('tyt-full');
    const sel = document.getElementById('ex-tmpl');
    sel.addEventListener('change', () => {
      renderTemplateRows(sel.value);
      const t = R.EXAM_TEMPLATES.find(x => x.id === sel.value);
      document.getElementById('ex-dur').value = t.duration;
    });
  }

  function renderTemplateRows(tmplId){
    const t = R.EXAM_TEMPLATES.find(x => x.id === tmplId);
    const wrap = document.getElementById('ex-tests');
    if(!wrap || !t) return;
    const cell = (key, ph) => K.Input({ size:'sm', numeric:true, class:'input--cell', type:'number',
      placeholder:ph, aria:ph, data:{ 'data-t':key } });
    wrap.innerHTML = String(html`
      <span class="mono-label">Test sonuçları</span>
      ${map(t.tests, test => html`
        <div class="row-sm" data-test-row>
          ${K.Input({ size:'sm', class:'grow', value:test.name, aria:'test adı', data:{ 'data-t':'name' } })}
          ${cell('c', 'D')}${cell('w', 'Y')}${cell('b', 'B')}
          <span class="tiny dim w-34 right">/${test.q}</span>
        </div>`)}`);
  }

  function errorSheet(examId, errorId){
    const exam = S.exams.find(e => e.id === examId);
    const err = errorId ? S.errors.find(e => e.id === errorId) : null;
    const testOptions = exam.tests.map(t => ({ value:t.name, label:t.name }));
    const tagOptions = Object.keys(R.ERROR_TAGS).map(k => ({ value:k, label:k+' — '+R.ERROR_TAGS[k].name }));
    const topicOptions = [{ value:'', label:'— konu —' }].concat(
      R.SUBJECTS.reduce((acc, s) => acc.concat(s.topics.map(t => ({ value:s.id+'::'+t.id, label:s.name+' · '+t.name }))), [])
    );
    const v = (field, fallback) => err ? (err[field] == null ? '' : err[field]) : (fallback == null ? '' : fallback);

    const body = K.Stack([
      html`<span class="mono-label">Kimlik</span>`,
      K.Cols(3, [
        K.Field({ label:'Test', input:K.Select({ id:'er-test', options:testOptions, value:v('testName') }) }),
        K.Field({ label:'Soru no', input:K.Input({ id:'er-no', type:'number', numeric:true, value:v('questionNo') }) }),
        K.Field({ label:'Durum', input:K.Select({ id:'er-status', options:['Yanlış', 'Boş', 'Yavaş'], value:v('status', 'Yanlış') }) }),
      ]),
      K.Field({ label:'Ders – konu', input:K.Select({ id:'er-topic', options:topicOptions, value:v('topicRef') }) }),
      html`<span class="mono-label">Etiket ve kök neden</span>`,
      K.Cols(2, [
        K.Field({ label:'Etiket', input:K.Select({ id:'er-tag', options:tagOptions, value:v('tag', 'K') }) }),
        K.Field({ label:'Harcanan süre (sn)', input:K.Input({ id:'er-secs', type:'number', numeric:true, value:v('seconds') }) }),
      ]),
      K.Field({ label:'Kök neden — tek somut cümle', hint:'“dikkatsizlik” son açıklama değildir',
        input:K.Input({ id:'er-root', value:v('rootCause'), placeholder:'ör. birimi çevirmeden işleme girdim' }) }),
      K.Field({ label:'Doğru ilke (2–3 satır)',
        input:K.Textarea({ id:'er-principle', rows:2, value:v('principle'),
          placeholder:'Tam çözüm kopyalanmaz; genellenebilir ilke yazılır.' }) }),
      K.Cols(2, [
        K.Field({ label:'Benzer soru — kaynak / test no',
          input:K.Input({ id:'er-similar', value:v('similar'), placeholder:'ör. 345 TYT Mat test 12 / 7' }) }),
        K.Field({ label:'Tamir reçetesi', input:K.Input({ id:'er-recipe', value:v('recipe', R.ERROR_TAGS.K.recipe) }) }),
      ]),
      K.Notice({ tone:'info', body:'Kaydedince tekrar kartı otomatik oluşur ve +1 gün / +3 gün / +1 hafta / +1 ay takvimine girer.' }),
    ]);

    UI.sheet({
      title:err ? 'Hatayı düzenle' : 'Hata ekle',
      subtitle:exam.type+' · '+U.fmtDate(exam.date),
      body:String(body), wide:true,
      footer:String(html`
        ${when(err, () => K.Button({ label:'Sil', tone:'danger', act:'delete-error', data:{ 'data-id':err.id } }))}
        ${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-error',
          data:Object.assign({ 'data-exam':examId }, err ? { 'data-id':err.id } : {}) })}`),
    });

    const tagSel = document.getElementById('er-tag');
    tagSel.addEventListener('change', () => {
      document.getElementById('er-recipe').value = R.ERROR_TAGS[tagSel.value].recipe;
    });
  }

  async function render(){
    if(R.ExamRun.active()) return String(runView());
    return String(S.ui.examOpen ? detailView(S.ui.examOpen) : listView());
  }

  function afterRender(){
    if(R.ExamRun.active()) startTick(); else stopTick();
  }

  const handle = {
    async 'new-exam'(){ newExamSheet(); },
    async 'run-open'(){ startRunSheet(); },
    async 'run-start'(){
      const tmpl = document.getElementById('rn-tmpl').value;
      const pub = document.getElementById('rn-pub').value.trim();
      const res = R.ExamRun.start(tmpl, { publisher:pub });
      if(!res.ok){ UI.toast(res.reason); return; }
      UI.closeSheet();
      UI.toast('Oturum başladı — kronometre işliyor');
      R.App.render();
    },
    async 'run-mark'(el){
      if(R.ExamRun.mark(el.dataset.kind)) R.App.render();
    },
    async 'run-undo'(){ R.ExamRun.undoMark(); R.App.render(); },
    async 'run-pause'(){
      if(R.ExamRun.isPaused()) R.ExamRun.resume(); else R.ExamRun.pause();
      R.App.render();
    },
    async 'run-next'(){
      const next = R.ExamRun.nextTest();
      if(next) UI.toast(next.name + ' başladı');
      R.App.render();
    },
    async 'run-goto'(el){ R.ExamRun.gotoTest(Number(el.dataset.i)); R.App.render(); },
    async 'run-finish'(){ R.ExamRun.pause(); finishSheet(); },
    async 'run-cancel'(){
      UI.confirmSheet('Oturumu iptal et', 'Ölçülen süreler kaydedilmeyecek.', async () => {
        R.ExamRun.cancel();
        UI.closeSheet();
        R.App.render();
      }, true);
    },
    async 'run-save'(){
      const scores = [];
      document.querySelectorAll('[data-run]').forEach(el => {
        const i = Number(el.dataset.i);
        scores[i] = scores[i] || {};
        const key = el.dataset.run === 'c' ? 'correct' : el.dataset.run === 'w' ? 'wrong' : 'blank';
        scores[i][key] = Number(el.value) || 0;
      });
      const res = await R.ExamRun.finish(scores);
      UI.closeSheet();
      if(res){
        S.ui.examOpen = res.exam.id;
        UI.toast('Oturum kaydedildi · net ' + U.fmtNet(M.examNet(res.exam)));
      }
      R.App.render();
    },
    async 'exam-filter'(el){ S.ui.examFilter = el.dataset.value; S.ui.examPage = 1; R.App.render(); },
    async 'exam-page'(el){ S.ui.examPage = Number(el.dataset.page); R.App.render(); },
    async 'open-exam'(el){ S.ui.examOpen = el.dataset.id; R.App.render(); },
    async 'exam-back'(){ S.ui.examOpen = null; R.App.render(); },
    async 'save-exam'(){
      const date = document.getElementById('ex-date').value || U.todayISO();
      const tmpl = R.EXAM_TEMPLATES.find(t => t.id === document.getElementById('ex-tmpl').value);
      const publisher = document.getElementById('ex-pub').value.trim();
      const duration = Number(document.getElementById('ex-dur').value) || tmpl.duration;
      const rows = Array.prototype.slice.call(document.querySelectorAll('#ex-tests [data-test-row]'));
      const tests = rows.map(r => {
        const g = sel => r.querySelector('[data-t="'+sel+'"]').value;
        const c = Number(g('c'))||0, w = Number(g('w'))||0, b = Number(g('b'))||0;
        return { name:g('name')||'Test', correct:c, wrong:w, blank:b, minutes:null };
      }).filter(t => t.correct || t.wrong || t.blank);

      if(!tests.length){ UI.toast('En az bir test doldurulmalı'); return; }

      const exam = {
        id:U.uid('e'), date, type:tmpl.name, family:tmpl.family, kind:tmpl.kind,
        publisher, duration, tests, protocol:{},
        createdAt:new Date().toISOString(), analysisCompletedAt:null,
      };
      await M.saveExam(exam);
      UI.closeSheet();
      S.ui.examOpen = exam.id;
      UI.toast('Deneme kaydedildi · net '+U.fmtNet(M.examNet(exam)));
      R.App.render();
    },
    async 'delete-exam'(el){
      const id = el.dataset.id;
      UI.confirmSheet('Denemeyi sil', 'Bu deneme ve bağlı hata kayıtları silinecek. Bu işlem geri alınamaz.', async () => {
        await M.deleteExam(id);
        S.ui.examOpen = null;
        UI.closeSheet();
        UI.toast('Deneme silindi');
        R.App.render();
      }, true);
    },
    async 'protocol-step'(el){
      const exam = S.exams.find(e => e.id === S.ui.examOpen);
      exam.protocol = exam.protocol || {};
      exam.protocol[el.dataset.key] = el.checked;
      await M.saveExam(exam);
      R.App.render();
    },
    async 'complete-analysis'(el){
      const exam = S.exams.find(e => e.id === el.dataset.id);
      const errs = S.errors.filter(e => e.examId === exam.id);
      if(!errs.length){
        UI.confirmSheet('Hata kaydı yok', 'Hiç hata etiketlenmedi. Yine de analizi tamamlandı olarak işaretlemek istiyor musun?', async () => {
          exam.analysisCompletedAt = new Date().toISOString();
          await M.saveExam(exam);
          UI.closeSheet(); R.App.render();
        });
        return;
      }
      exam.analysisCompletedAt = new Date().toISOString();
      await M.saveExam(exam);
      UI.toast('Analiz tamamlandı');
      R.App.render();
    },
    async 'new-error'(el){ errorSheet(el.dataset.exam); },
    async 'edit-error'(el){
      const err = S.errors.find(e => e.id === el.dataset.id);
      errorSheet(err.examId, err.id);
    },
    async 'save-error'(el){
      const examId = el.dataset.exam;
      const exam = S.exams.find(e => e.id === examId);
      const existing = el.dataset.id ? S.errors.find(e => e.id === el.dataset.id) : null;
      const topicRef = document.getElementById('er-topic').value;
      const [subjectId, topicId] = topicRef ? topicRef.split('::') : [null, null];
      const subject = subjectId ? R.SUBJECTS.find(s => s.id === subjectId) : null;
      const topic = subject ? subject.topics.find(t => t.id === topicId) : null;

      const err = Object.assign(existing || { id:U.uid('r'), createdAt:new Date().toISOString(), closedAt:null, repairDoneAt:null }, {
        examId,
        examDate:exam.date,
        publisher:exam.publisher,
        testName:document.getElementById('er-test').value,
        questionNo:document.getElementById('er-no').value,
        status:document.getElementById('er-status').value,
        tag:document.getElementById('er-tag').value,
        seconds:Number(document.getElementById('er-secs').value) || null,
        rootCause:document.getElementById('er-root').value.trim(),
        principle:document.getElementById('er-principle').value.trim(),
        similar:document.getElementById('er-similar').value.trim(),
        recipe:document.getElementById('er-recipe').value.trim(),
        topicRef, subjectId, topicId,
        topic: topic ? topic.name : '',
      });
      await M.saveError(err);

      if(!existing){
        const card = M.newCard({
          front:(err.topic || err.testName || 'Yanlış') + ' — ' + (err.rootCause || 'kök neden'),
          back:err.principle || err.recipe,
          topic:err.topic || err.testName,
          subjectId:err.subjectId,
          source:'error', sourceRef:err.id,
        });
        await M.saveCard(card);
      }
      UI.closeSheet();
      UI.toast(existing ? 'Hata güncellendi' : 'Hata ve tekrar kartı kaydedildi');
      R.App.render();
    },
    async 'delete-error'(el){
      await M.deleteError(el.dataset.id);
      UI.closeSheet();
      UI.toast('Hata silindi');
      R.App.render();
    },
  };

  const change = {
    async 'test-num'(el){
      const exam = S.exams.find(e => e.id === S.ui.examOpen);
      exam.tests[Number(el.dataset.i)][el.dataset.field] = Number(el.value)||0;
      await M.saveExam(exam);
      R.App.render();
    },
    async 'test-minutes'(el){
      const exam = S.exams.find(e => e.id === S.ui.examOpen);
      exam.tests[Number(el.dataset.i)].minutes = el.value === '' ? null : Number(el.value);
      await M.saveExam(exam);
    },
  };

  return {
    id:'exams',
    title:'Deneme',
    subtitle(){
      const debt = C.analysisDebt().length;
      return S.exams.length + ' deneme' + (debt ? ' · ' + debt + ' analiz borcu' : ' · analiz borcu yok');
    },
    actions(){
      if(R.ExamRun.active()) return '';
      return String(html`
        ${K.Button({ label:'Süreli oturum', icon:'clock', size:'sm', act:'run-open' })}
        ${K.Button({ label:'Deneme ekle', icon:'plus', size:'sm', tone:'primary', act:'new-exam' })}`);
    },
    onKey(e){
      if(!R.ExamRun.active() || UI.isSheetOpen()) return;
      if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
      const keys = { '1':'ok', '2':'slow', '3':'skip' };
      if(keys[e.key]){ e.preventDefault(); handle['run-mark']({ dataset:{ kind:keys[e.key] } }); }
    },
    render, afterRender, handle, change,
  };
})();

/* ==== js/screens/cards.js ==== */
/* Tekrar — aralikli tekrar oturumu, kart yonetimi ve yanlis defteri.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.cards = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const STAGES = ['yeni', '+1 gün', '+3 gün', '+1 hafta', '+1 ay'];
  const RATINGS = [
    { rating:'forgot', label:'Hatırlamadım', key:'1', tone:'danger' },
    { rating:'hard', label:'Zorlandım', key:'2', tone:null },
    { rating:'remembered', label:'Hatırladım', key:'3', tone:'primary' },
  ];

  function tab(){ return S.ui.cardTab || 'due'; }
  function stageLabel(stage){ return STAGES[stage] || 'yeni'; }

  /* ---------- due oturumu ---------- */

  function dueSession(){
    const due = C.dueCards().sort((a, b) => a.dueAt.localeCompare(b.dueAt));
    if(!due.length){
      return K.Card({ body:K.Empty({ icon:'cards',
        text:'Bugün için bekleyen kart yok. Kartlar deneme analizinden otomatik üretilir; elle de ekleyebilirsin.',
        action:K.Button({ label:'Kart ekle', icon:'plus', tone:'primary', act:'new-card' }) }) });
    }

    const card = due[0];
    const flipped = !!S.ui.flipped[card.id];
    const doneToday = S.cards.filter(c => c.lastReviewedAt === U.todayISO()).length;
    const late = card.dueAt < U.todayISO();

    return K.Card({ body:html`
      <div class="row between mb-10">
        <span class="small muted">${due.length} kart bekliyor${late ? ' · bu kart '+U.relativeDay(card.dueAt) : ''}</span>
        <span class="small dim">bugün ${doneToday} tekrar yapıldı</span>
      </div>
      ${K.Meter({ label:'Oturum ilerlemesi', value:U.pct(doneToday, doneToday+due.length),
        text:doneToday+' / '+(doneToday+due.length) })}

      <div class="flashcard mt-14" data-act="flip" data-id="${card.id}">
        <span class="flashcard__side">${(flipped ? 'Arka yüz' : 'Ön yüz') + (card.topic ? ' · '+card.topic : '')}</span>
        <span class="flashcard__text">${flipped ? (card.back || '—') : card.front}</span>
        ${when(!flipped, () => html`<span class="flashcard__hint">Dokun veya boşluk tuşuna bas</span>`)}
      </div>

      ${flipped
        ? html`<div class="row mt-12 gap-8">${map(RATINGS, r => html`
            <button class="${'btn grow' + (r.tone ? ' btn--'+r.tone : '')}" data-act="rate"
              data-id="${card.id}" data-rating="${r.rating}">
              <span>${r.label}</span><span class="tiny dim">${r.key}</span></button>`)}</div>`
        : K.Button({ label:'Cevabı göster', block:true, class:'mt-12', act:'flip', data:{ 'data-id':card.id } })}

      <div class="row between mt-10">
        <span class="tiny dim">Aşama: ${stageLabel(card.stage)}${card.source === 'error' ? ' · deneme hatasından' : ''}</span>
        ${K.Button({ label:'Düzenle', icon:'edit', size:'sm', tone:'ghost', act:'edit-card', data:{ 'data-id':card.id } })}
      </div>` });
  }

  /* ---------- tum kartlar ---------- */

  function allCards(){
    if(!S.cards.length){
      return K.Card({ body:K.Empty({ icon:'cards', text:'Henüz kart yok.',
        action:K.Button({ label:'Kart ekle', icon:'plus', tone:'primary', act:'new-card' }) }) });
    }

    const q = U.norm(S.ui.cardQuery || '');
    let list = S.cards.slice().sort((a, b) => a.dueAt.localeCompare(b.dueAt));
    if(q) list = list.filter(c => U.norm(c.front+' '+c.back+' '+(c.topic || '')).indexOf(q) >= 0);
    const pg = K.paginate(list, S.ui.cardPage || 1, 30);

    const rows = pg.items.map(c => [
      html`<div><b class="small">${c.front}</b><div class="tiny dim">${c.topic || '—'}</div></div>`,
      html`<span class="small">${stageLabel(c.stage)}</span>`,
      html`<span class="${c.dueAt < U.todayISO() ? 'small num is-late' : 'small num dim'}">${U.fmtShort(c.dueAt)}</span>`,
      html`<div class="row-sm jc-end">${K.IconButton({ icon:'edit', size:'sm', plain:true,
        aria:'kartı düzenle', act:'edit-card', data:{ 'data-id':c.id } })}</div>`,
    ]);

    const body = html`
      <div class="row between wrap mb-10 gap-8">
