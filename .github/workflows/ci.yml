name: CI

# AGENTS.md §2: "bir değişiklik, dokunduğu sistemin testleri ve duman testi
# geçmeden önerilmez." Bu iş akışı o kuralı otomatikleştirir — insan elle
# koşturmayı unutsa da PR kırmızı/yeşil kalır.
#
# ---------------------------------------------------------------------
# NEDEN BUTUN DENETIMLER BURADA
#
# Depoda on dort denetim araci yazili; bu is akisi uzun sure bunlardan
# IKISINI kosturuyordu (runtests + smoke). Geri kalanlar yazildiklari
# gun kosmus, sonra yalnizca elle cagrildiklarinda kosmustu. Sonucu
# olculdu: seviye paneli eklendiginde SPI'nin layoutcheck'i ve ESP'nin
# a11ycheck'i kirmiziya dondu — ikisi de gercek kullanici hatasiydi
# (yazarken kaybolan odak, calinan ilk Tab duragi) ve ikisi de CI'dan
# YESIL gececekti.
#
# Kosmayan bir denetim, yazilmis bir denetim degildir.
#
# ---------------------------------------------------------------------
# SURE
#
# `arayuz` isi uc sistemi PARALEL kosar, yani toplam sure bir sistemin
# kendi denetimleri kadar uzar — ucune bolunmez. Agir olan tek denetim
# (`loadcheck`, bes yillik veri uretir) her PR'da degil, haftada bir
# ayri bir iste kosar: asagidaki `yuk` isi.
#
# ---------------------------------------------------------------------
# BURADA KOSMAYAN IKI ARAC — VE NEDEN
#
#   AYS/tools/audit.py       rapor uretir, HICBIR KOSULDA cikis kodu 1
#                            vermez. Kirmiziya donmeyen bir denetim,
#                            denetim degil bir olcumdur; CI'a konsa
#                            yalnizca gurultu eklerdi.
#   AYS/tools/evalagents.js  gercek bir dil modeli saglayicisina anahtar
#                            ister (ROTA_KEY). CI'da ne anahtar vardir
#                            ne de her PR'da para harcamak dogrudur.
#
# Ikisi de elle kosulur; `python3 tools/sayilar.py --tam` ciktisinda
# yerleri yazilidir.

on:
  push:
    branches: [main, sadelesme]
  pull_request:
  schedule:
    # Haftalik yuk denetimi (asagidaki `yuk` isi) — pazartesi 04:17 UTC.
    # Dakika bilerek yuvarlak degil: her saatin basinda kalkan binlerce
    # is akisinin kuyruguna girmemek icin.
    - cron: '17 4 * * 1'
  workflow_dispatch:

jobs:
  arayuz:
    name: ${{ matrix.system }} — bütün denetimler
    runs-on: ubuntu-latest
    # Bir sistemin kirmizisi digerlerinin olcumunu gizlemesin: uc sistemin
    # de raporu ayni kosumda gorunsun.
    strategy:
      fail-fast: false
      matrix:
        system: [AYS, SPI, ESP]
    defaults:
      run:
        working-directory: ${{ matrix.system }}
    env:
      # Bütçeler yerel bir makinede ölçülerek yazıldı; paylaşımlı koşum
      # makinesi aynı kodu düzenli olarak daha yavaş ölçer. Bütçeyi
      # gevşetmek yerine ORTAM kendi payını açıkça söylüyor — araç bu
      # payı çıktısına da yazar (bkz. tools/perfcheck.js, PERF_PAY).
      PERF_PAY: '1.5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Denetimlerin cogu sayfayi `devserver.py` ile servis eder: node
      # tek basina yetmez.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # HATALAR D-14: duman testi dist/'teki TEK DOSYAYI geziyor. Kaynak
      # degisip dist unutulursa test edilen sey kaynak olmaz; derleyici
      # bellekte derler ve depodaki dist ile karsilastirir.
      - name: Tek dosya kaynaktan derlenmiş hâliyle aynı mı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Tek dosya kaynaktan derlenmiş hâliyle aynı mı" python3 build.py --denetle

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Chromium kur
        run: npx playwright install --with-deps chromium

      - name: Birim testleri
        run: bash ../tools/ci_hata.sh "${{ matrix.system }} birim testleri" node tools/runtests.js

      - name: Duman testi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Duman testi" node tools/smoke.js

      - name: Erişilebilirlik
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Erişilebilirlik" node tools/a11ycheck.js

      - name: Telefon ve tablet düzeni (390 ve 820px)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Telefon ve tablet düzeni (390 ve 820px)" node tools/layoutcheck.js

      - name: Palet kontrastı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Palet kontrastı" node tools/palettecheck.js

      - name: Çizim bütçesi (dokuz aylık veri)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Çizim bütçesi (dokuz aylık veri)" node tools/perfcheck.js

      # Bugun yalniz SPI'de olan denetimler. `if: matrix.system == 'SPI'`
      # yerine DOSYA VARLIGINA bakilir: bir denetim yarin AYS'ye de
      # tasindiginda bu is akisini duzenlemek gerekmesin — tasiyan kisi
      # dosyayi koyar, CI onu kendiliginden kosar.
      - name: Sisteme özel denetimler
        run: |
          set -e
          bulundu=0
          for t in ledgercheck designcheck tasarimcheck; do
            if [ -f "tools/$t.js" ]; then
              echo "→ $t"
              node "tools/$t.js"
              bulundu=$((bulundu + 1))
            fi
          done
          echo "$bulundu sisteme özel denetim koştu."

  tekkaynak:
    name: Tek kaynaklar — üç kopya kaynakla aynı mı
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Kademe adlari, renkleri ve XP esikleri TEK KAYNAKTAN (brand/seviye/)
      # uc arayuze kopyalanir. Kopyanin elle duzenlenmesi sessiz bir
      # ayrisma demektir: AYS'te "Altin" olan SPI'de baska bir sey olur ve
      # bu ancak iki ekran yan yana konunca fark edilir. Denetim o sessiz
      # hali gurultuluye cevirir.
      - name: Kopyalar kaynakla aynı mı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kopyalar kaynakla aynı mı" python3 tools/seviye.py --denetle

      # Ortak CSS de ayni mekanizmayla yayiliyor (brand/ortak/ -> uc
      # arayuz). Ayni gerekce: elle duzenlenen bir kopya bir gun ayrisir.
      - name: Ortak CSS kaynakla aynı mı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Ortak CSS kaynakla aynı mı" python3 tools/ortak.py --denetle

      - name: Parca kaydi ve blok adlari
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Parca kaydi ve blok adlari" python3 tools/parca_test.py

      # MARKA ADLANDIRMASI VE YOL MUHAFIZI. Bu denetim bir suredir
      # yalnizca `tools/sayilar.py --tam` icinden kosuyordu, yani
      # birinin elle koşturmasina bagliydi. Sinadigi sey onemli:
      # `_ortak_marka_yolu` gelen adda `/`, `\`, nokta dosyasi ya da
      # tanimsiz bir aile gorurse REDDEDER — yani `img/marka/` ucu bir
      # dizin gezinme kapisi degildir. Bir gun o muhafizi kiran bir
      # degisiklik, ancak CI kirmizi olursa fark edilir.
      - name: Marka adlandırması ve yol muhafızı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Marka adlandırması ve yol muhafızı" python3 tools/marka.py --sina

      # DİNLEME KUYRUĞU. Python sunucusu varsayılan olarak listen(5) ile
      # açılır; Windows taşan bağlantıyı reddeder ve sayfa bir betiği hiç
      # yüklemez (2026-10-03: paralel denetimlerde açılışların yarısından
      # fazlası). Linux taşanı reddetmez; burada test kuyruk boyunu, yani
      # listen()'e giden sayıyı sınar.
      - name: Sunucular bekleyen bağlantıyı reddetmez
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Sunucular bekleyen bağlantıyı reddetmez" python3 tools/kuyruk_test.py

      # GÜNCEL TEK DOSYA. Modül kapısının kökü dist'i yalnız kaynaklar
      # aynıysa sunar (230 istek yerine 3); değilse src. dist/kaynak.json
      # build.py'den, denetimi build.py --denetle'de de.
      - name: Modül kapısı yalnız güncel dist'i sunar
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Modül kapısı yalnız güncel dist i sunar" python3 tools/dist_sun_test.py

      # TELEFON (ev ağı + https). Sertifika yokken hiçbir kapı ev ağına
      # açılmaz; varsa üç modül https ile açılır, kurulum sayfası özel
      # anahtarı ve depo dosyalarını asla vermez. Geçici klasörde koşar.
      - name: Telefon kapıları yalnız bilinçli kurulumla ve https ile açılır
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Telefon kapıları yalnız bilinçli kurulumla ve https ile açılır" python3 tools/telefon_test.py

      # YENI BILGISAYARA TASIMA (2026-11-05). Paket sifresiz acilmaz, degismis dosya
      # acilmaz, var olan silinmez, listede olmayan yola yazilmaz.
      - name: Taşıma paketi şifreli ve üstüne yazmaz
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Taşıma paketi şifreli ve üstüne yazmaz" python3 tools/tasi_test.py

      # SADELESME FAZ 1 GOC (2026-11-12). Kaynaga yazmaz, sayi dengesi, etiket tek dil,
      # turetilmis tasinmaz, sir pakette durur, ayni girdi ayni rapor, goc_id ile geri alinir.
      - name: Göç aracı kuru koşusu
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Göç aracı kuru koşusu" python3 tools/goc_test.py

      # SADELESME FAZ 1 P3 TEK DEPO (2026-11-13). Ust anahtar duzeyinde son saat kazanir,
      # saati kayan cihaz kirpilir, silme mezar tasi, sira sonucu degistirmez, yedek ustune yazmaz.
      - name: Tek depo birleştirme ve yedek
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Tek depo birleştirme ve yedek" python3 tools/tekdepo_test.py

      # SADELESME FAZ 1 P2 GOC PAKETI (2026-11-13). Cihaz tarafi (node, sahte depolarla) uretir,
      # PC tarafi kaydeder ve goc okuyucusundan gecirir; sir girmez, ustune yazmaz, ucu yalniz sahip.
      - name: Göç paketi cihazdan PC'ye
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Göç paketi cihazdan PC'ye" python3 tools/gocpaket_test.py

      # Motorlarin gercek veri kosusu araci (sentetik veriyle): yalniz sayi yazar, canli dosya acmaz, gecici siler.
      - name: Gerçek veri koşusu aracı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Gerçek veri koşusu aracı" python3 tools/gercek_kosu_test.py

      # P6 SONRASI (2026-11-14). Tek depodaki eski not ve kayitlar motor bagdastiricilarindan gecip yeni kabugun
      # baslangic paketine doner; icerik ekrana basilmaz, depo degismez.
      - name: Kabuk başlangıç paketi (eski kayıtlar yeni kabuğa)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kabuk başlangıç paketi" python3 tools/kabuk_baslangic_test.py

      # SADELESME FAZ 1 P5 TEK KAPI (2026-11-13). Tek surec, tek adres; eski isleyiciler yeniden
      # yazilmaz, ayni cevabi verir. ETKIN kapali: eski kapilar P6'ya kadar yerinde.
      - name: Tek kapı, tek süreç
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Tek kapı, tek süreç" python3 tools/tekkapi_test.py

      # SADELESME FAZ 3 MOTORLAR (2026-11-13). Yol, Tekrar, Not: saf (saat disaridan gelir), sifir
      # bagimlilik. Tekrar testi eski zamanlayicilarin gercek kaynagini yukler: goc vadeyi degistirmez.
      - name: Motorlar (Yol, Tekrar, Not)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Motorlar (Yol, Tekrar, Not)" bash -c 'node motor/yol.test.js && node motor/tekrar.test.js && node motor/not.test.js && node motor/not-hkm.test.js'

      # SADELESME FAZ 3 MOTORLAR 2 (2026-11-13). Soru: AYS net ve siralama kurallariyla esdeger, her sayi
      # etiketli. Kayit: gercek SPI kurallariyla gun gun ayni. Plan: ESP onceligi, AYS istisnalari.
      - name: Motorlar (Soru, Kayıt, Plan)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Motorlar (Soru, Kayıt, Plan)" bash -c 'node motor/soru.test.js && node motor/kayit.test.js && node motor/plan.test.js'

      # SADELESME FAZ 3 ICERIK (2026-11-13). Alan icerigi semaya uyar (alan/SEMA.md); onaysiz ders
      # taslak etiketiyle durur. Denetimin kendisi de sinanir.
      - name: Alan içeriği şema denetimi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Alan içeriği şema denetimi" bash -c 'python3 alan/denetle_test.py && python3 alan/denetle.py alan/felsefe && python3 alan/denetle.py alan/akademik && python3 alan/denetle.py alan/tarih && python3 alan/denetle.py alan/dil && for a in muzik okuma beslenme hareket uyku tahlil; do python3 alan/denetle.py alan/$a || exit 1; done'

      # SADELESME FAZ 4 OLCUM (2026-11-13). Sayim kurallari, butce asimi, ayni girdi ayni kayit,
      # olculmeyen egri sayi tasimaz. Butce denetimi asagidaki adimda.
      - name: Ölçüm motoru sayım ve bütçe kuralları
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Ölçüm motoru sayım ve bütçe kuralları" python3 kalite/olcum_test.py

      # SADELESME FAZ 5 (2026-11-13). King'in salt okur MCP ucu: el sikisma, en cok 12 arac, ozel not donmez,
      # canli dosya acilmaz (yalniz kopya), yazma araci yok.
      - name: King MCP ucu salt okur
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "King MCP ucu salt okur" python3 king/mcp_test.py

      # SADELESME FAZ 5 KING CEKIRDEGI (2026-11-13). Bes niyet; 141 eski arac 12 kapiya bir kez eslenir;
      # baglam jeton butcesini asmaz, ozel isaretli parca girmez. Ag yok, yazma yok.
      - name: King çekirdeği (niyet, katalog, bağlam)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "King çekirdeği (niyet, katalog, bağlam)" bash -c 'python3 king/niyet_test.py && python3 king/katalog_test.py && python3 king/baglam_test.py && python3 king/hafiza_test.py'

      # SADELESME FAZ 5 ARAMA (2026-11-13). Arastir niyeti HKM'nin arastirma kodunu kullanir, hafizaya
      # yazmaz, yalniz onerir. Test cevrimdisi. BAM'a dokunulmaz (gercek soru setiyle gecene kadar).
      - name: Arama motoru (çevrimdışı)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Arama motoru (çevrimdışı)" python3 king/arama_test.py

      # SADELESME FAZ 4 A9 KALANLAR (2026-11-13). Katman kurali: motor kabugu bilmez, kimse bir motorun
      # acik arayuzu (LIFEOS.Motor.<Ad> nesnesinin anahtarlari) disina uzanamaz, alan yalniz veridir ve
      # baska alana uzanamaz; bilinen istisnalar yalniz kuculur. Kullanim sayaci yalniz bu bilgisayarda
      # sayar (ag cagrisi yok); "yanlis anladin" seti bicim denetimi, yalniz isaretli satirla deger yazilmaz.
      - name: Katman denetimi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Katman denetimi" bash -c 'python3 kalite/katman_test.py && python3 kalite/katman.py'
      - name: Kullanım sayacı ve «yanlış anladın» seti
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kullanım sayacı ve «yanlış anladın» seti" bash -c 'node kalite/kullanim.test.js && python3 kalite/anlama_test.py && python3 kalite/egri/anlama.py --denetle'

      # A9 cikisi (2026-11-13, sahibin karariyla asim kabul edilip kayit yenilendikten sonra baglandi):
      # son kayda (kalite/kayit/) gore artan butce birlestirmeyi durdurur (AGENTS 0.1 kural 5).
      - name: Karmaşıklık bütçesi aşılmadı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Karmaşıklık bütçesi aşılmadı" python3 kalite/olcum.py --denetle

      # SADELESME FAZ 2 KABUK (2026-11-13). Sistem haritasi: her yer halkadan en cok iki, komut
      # cubugundan bir adim; ayar tek tanimdan turer; arama Turkce harfleri katlar.
      - name: Kabuk haritası, ayar şeması ve arama
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kabuk haritası, ayar şeması ve arama" node kabuk/kabuk.test.js

      # SADELESME FAZ 7 TANISMA (2026-11-13). Dil modelsiz gorusme: desenler, onaysiz yazim yok, geri alma.
      - name: Tanışma görüşmesi kuralları
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Tanışma görüşmesi kuralları" node kabuk/tanisma.test.js
      - name: Süreli deneme kuralları
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Süreli deneme kuralları" node kabuk/deneme.test.js
      # Kayit deposu (faz2-indexeddb.md): kayit IndexedDB'de, ayar localStorage'da; tasima hicbir seyi kaybetmez.
      - name: Kabuk kayıt deposu
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kabuk kayıt deposu" node kabuk/depo.test.js
      - name: Kabuk bileşen kataloğu
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kabuk bileşen kataloğu" node kabuk/bilesen.test.js
      # Onaylar (faz6-onay-ekrani.md): sahibin onayı içeriğe Yol'dan önce bindirilir; onay_uygula dosyaya biçimi bozmadan yazar.
      - name: Onay bindirmesi ve onay aracı
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Onay bindirmesi" node kabuk/onay.test.js && bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Onay aracı" python3 tools/onay_uygula_test.py

      # Telefonun bilgisayarsiz indirdigi web paketi (uygulama/ios/web_paket.py).
      - name: Web paketi üreticisi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Web paketi üreticisi" python3 uygulama/ios/web_paket_test.py

      # KENDİ ARKA PLANIN (2026-10-29). Kullanıcının fotoğrafı/videosu PC'de
      # durur; yalnız bu bilgisayardan okunur ve yazılır, tür içerikle uyuşmalı.
      - name: Arka plan dosyası yalnız bu bilgisayardan ve doğru türle
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Arka plan dosyası yalnız bu bilgisayardan ve doğru türle" python3 tools/zemin_test.py

      # SİSTEM PLANLAMASI (2026-10-29). Haftalık vade, kaçan iş (hemen/onay),
      # kapanış, Windows açılış görevi komutu, salt okunur veri denetimi.
      - name: Sistem planlaması vadeyi ve kaçan işi doğru sayar
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Sistem planlaması vadeyi ve kaçan işi doğru sayar" python3 tools/planlama_test.py

      # MÜZİK (2026-10-30). Kullanıcının parçaları ve listeleri PC'de durur;
      # yalnız bu bilgisayardan, doğru türle; listede yalnız var olan parça.
      - name: Müzik dosyaları ve listeleri yalnız bu bilgisayardan
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Müzik dosyaları ve listeleri yalnız bu bilgisayardan" python3 tools/muzik_test.py

      # İÇE AKTARMA (2026-10-30). Google verisi hesap bağlanmadan: takvimin gizli
      # iCal adresi ve Takeout özeti; yalnız bu bilgisayardan, adres dışarı verilmez.
      - name: Google verisi hesap bağlanmadan, yalnız bu bilgisayardan
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Google verisi hesap bağlanmadan  yalnız bu bilgisayardan" python3 tools/ice_test.py

      # ORTAK AYARLAR (2026-10-30). Sistem ayarları PC'de tek kopya; her kapı sayfanın
      # başına koyar. Yalnız tercih anahtarları; kilit, veri ve modül yüzeyi yazılamaz.
      - name: Sistem ayarları tek kopya, yalnız tercih
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Sistem ayarları tek kopya  yalnız tercih" python3 tools/ayar_test.py

      - name: Görev takip okuyucusu
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Görev takip okuyucusu" python3 tools/gorev_takip_test.py

      # AJANLAR (2026-10-31). Claude Code Antigravity'yi surer; konusma kaydi okuyucu,
      # efor -> model, yuva -> port (carpismaz), istem. Antigravity CI'da yok: sahte kayitla.
      - name: Ajan okuyucusu ve istemi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Ajan okuyucusu ve istemi" python3 tools/ajan_test.py

      # OFIS PILOTU (2026-10-31). Pilot kuyrugu yurutur (Denetci turu, Testci, kota dususu);
      # birlestirmez, push etmez. Karar tablosu saf islevdir; tur sahte ajanlarla sinanir.
      - name: Ofis pilotu ve Testçi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Ofis pilotu ve Testçi" python3 tools/ofis_pilot_test.py
      - name: Bilgisayar platform katmani kabul (ofis 080, KING-4 §E)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Bilgisayar platform katmani kabul (ofis 080  KING-4 §E)" python3 tools/bilgisayar_kabul_test.py
      - name: King guven kurallari (KING-4 §G)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "King guven kurallari (KING-4 §G)" node tools/king_guven.js

      # Ofis kabul testlerinin bir kismi (King sinavi ve kapsami, perde hizi) uc arayuzu gercek tarayicida
      # acar. Bu is baska yerde Playwright kurmaz; 2026-11-09'dan beri bu testler CI'da yalniz bu yuzden
      # kirmiziydi (yerelde gecer). Tarayicisiz denetimler yine Playwright'siz sinanir (playwrightsiz.test.js engeller).
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ofis testleri için Playwright
        run: for m in AYS SPI ESP; do (cd "$m" && npm ci) || exit 1; done && cd SPI && npx playwright install --with-deps chromium

      # OFIS (2026-10-31). Antigravity islerinin kabul testleri (Claude Code yazar) ve
      # Uygulayici'nin birim testleri. «ajan.py birlestir» satir ekler; elle silme.
      - name: Ofis kabul ve birim testleri
        run: |
          python3 tools/ayar_esit_kabul_test.py
          python3 tools/ays_deney_kabul_test.py
          python3 tools/merdiven_uc_kabul_test.py
          python3 tools/merdiven_olcum_kabul_test.py
          python3 tools/kingveri_brifing_spi_kabul_test.py
          python3 tools/kingveri_brifing_esp_kabul_test.py
          python3 tools/kingveri_brifing_ays_kabul_test.py
          python3 tools/hafiza_olcum_kabul_test.py
          python3 tools/hafiza_uc_kabul_test.py
          python3 tools/king_sinav_ays_kabul_test.py
          python3 tools/king_sinav_spi_kabul_test.py
          python3 tools/king_sinav_esp_kabul_test.py
          python3 tools/kingveri_ays_kabul_test.py
          python3 tools/kingveri_spi_kabul_test.py
          python3 tools/kingveri_esp_kabul_test.py
          python3 tools/ogret_spi_kabul_test.py
          python3 tools/ogret_esp_kabul_test.py
          python3 tools/ogret_belge_kabul_test.py
          python3 tools/king_olay_uctan_test.py
          python3 tools/king_kapsam_esp_kabul_test.py
          python3 tools/king_kapsam_spi_kabul_test.py
          python3 tools/king_kapsam_ays_kabul_test.py
          python3 tools/king_sinav_300_kabul_test.py
          python3 tools/ays_takvim_tekrar_kabul_test.py
          python3 tools/spi_porsiyon_kabul_test.py
          python3 tools/esp_sure_kabul_test.py
          python3 tools/ays_sure_kabul_test.py
          python3 tools/ays_sinav_sure_kabul_test.py
          python3 tools/spi_sure_kabul_test.py
          python3 tools/veri_dogrula_test.py
          python3 tools/tarih_ortak_kabul_test.py
          python3 tools/perde_test_hiz_kabul_test.py
          python3 tools/tools_dizin_kabul_test.py
          python3 tools/belge_dizin_kabul_test.py
          python3 tools/portreonar_test.py
          python3 tools/ice_suren_kabul_test.py
          python3 tools/kabul_js_test.py
          python3 tools/veri_denetle_kabul_test.py
          python3 tools/veri_denetle_test.py
        # Her satir ayri kosar, kalan her satir kendi ::error bildirimini yazar (is kaydi yetki ister).
        shell: bash tools/ci_satir.sh {0}

      # SADELESME FAZ 2 (2026-11-13). Yeni kabuk tek kapidan sunulur; Felsefe pilotunun ilk unitesi gercek
      # tarayicida yurunur (ders, alistirma, unite kapisi, kayit). Playwright yukaridaki adimda kuruldu.
      - name: Kabuk gezisi (tek kapı + Felsefe pilotu, gerçek tarayıcı)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Kabuk gezisi" node tools/kabuk_gez.js

      - name: Ölü CSS aracının sınaması
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Ölü CSS aracının sınaması" python3 tools/olucss.py --sina

      # MEDYA KÜNYESİ TAZE Mİ. Künye (`brand/ortak/medya.js`) üretilmiş
      # bir dosyadır ve ekranın hangi görseli isteyebileceğini söyler.
      # Taze değilse iki yönde de bozulur: yeni gelen bir görsel hiç
      # kullanılmaz, ya da silinmiş bir görsel her açılışta 404 döner.
      # Üretici saf Python — bu iş node istemez.
      - name: Medya künyesi taze mi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Medya künyesi taze mi" python3 tools/marka.py --kunye --denetle
      # Vitrin kartlarının biçimi vitrinden ÜRETİLİR (tools/vitrin.py);
      # vitrin değişip vitrin.css yeniden yazılmazsa sistem eski kartı çizer.
      - name: Vitrin kart biçimi taze mi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Vitrin kart biçimi taze mi" python3 tools/vitrin.py --denetle
      # ONAY DÜĞMESİ SONUCU SÖYLER (katalog 022). `confirmSheet`'e etiket
      # verilmezse düğme «Evet, devam et» yazar ve basınca ne olacağını
      # söylemez. Kural kaynakta sayılır (tarayıcı istemez); önce sayacın
      # kendisi denenir, sonra üç arayüz. Bu iş npm ci yapmaz: önce
      # tarayıcısız denetimlerin Playwright istemediği sınanır.
      - name: Onay düğmeleri sonucu söylüyor mu
        run: node tools/playwrightsiz.test.js && node tools/envanterhkm.test.js && node tools/sadelik.test.js && node tools/sadelik.js --onay
      # PORT MUHAFIZI. Denetimlerin portları sabittir; iki worktree aynı
      # denetimi aynı anda koşunca ikincisi ötekinin sunucusunu ölçüyordu
      # (2026-10-03, entegre.js: üç geçersiz koşu). Her araç port doluysa
      # hiçbir şey başlatmadan 2 ile çıkmalı. Test tarayıcı, python3 ve alt
      # süreç istemez (hepsi engellenir) — bu hızlı işte koşar.
      - name: Sabit portlu denetimler port doluysa başlamaz
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Sabit portlu denetimler port doluysa başlamaz" node tools/portmuhafiz.test.js

  hkm:
    name: HKM — testler, sorgu bütçesi, panonun yüzü
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Testler
        working-directory: HKM
        run: bash ../tools/ci_hata.sh "HKM testleri" python3 -m tests.run

      - name: Sorgu bütçesi
        working-directory: HKM
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Sorgu bütçesi" python3 tools/perf.py

      # yuz.js kendi Playwright'ini tasimaz; ESP'nin kurulumunu kullanir.
      # Bagimliligi burada kuruyoruz ki denetim tek komutla kossun.
      - name: Playwright (ESP'nin kurulumu)
        working-directory: ESP
        run: npm ci && npx playwright install --with-deps chromium

      - name: Panonun yüzü (erişilebilirlik, telefon, kontrast)
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Panonun yüzü (erişilebilirlik  telefon  kontrast)" node HKM/tools/yuz.js

      - name: Giriş ve Gün sayfası açılıyor mu
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Giriş ve Gün sayfası açılıyor mu" node tools/giris_sayfa_test.js

  butunlesme:
    name: Üç arayüz + HKM uçtan uca
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # entegre.js de ESP'nin Playwright'ini kullanir.
      - name: Bağımlılıklar
        working-directory: ESP
        run: npm ci && npx playwright install --with-deps chromium

      # HKM kapaliyken uc arayuzun bozulmadigini da bu dogrular: bagin
      # TEK YONLU oldugu sozu burada olculur (AGENTS.md §1.4).
      - name: Uçtan uca
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Uçtan uca" node tools/entegre.js

      - name: Android kurulum sayfası çalışan adresi bulur
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Android kurulum sayfası çalışan adresi bulur" node tools/android_kurulum_test.js

  envanter:
    name: Envanter + sadelik — tek tasarıma geçerken kayıp yok
    # belgeler/ekip/EKIP-PLANI.md: «hicbir sey silinmez, katmanlanir». Tabandaki
    # (belgeler/ekip/envanter/taban-*.json) her eylem, isleyici ve giris alani
    # bugunku kodda da bulunmali; bilerek kaldirilan yalniz kullanici
    # onayiyla belgeler/ekip/envanter/kaldirilan.json'a yazilir. Uc arayuzu iki
    # profil ve iki genislikte gezer (~4 dk).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıklar
        working-directory: ESP
        run: npm ci && npx playwright install --with-deps chromium

      # Olcunun kendisi once denenir: yanlis sayan bir olcu butun
      # ekranlari kirmizi (ya da yesil) gosterir (tools/envanter.test.js).
      - name: Ölçü testi
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Ölçü testi" node tools/envanter.test.js

      - name: Envanter
        run: bash tools/ci_hata.sh "Envanter" node tools/envanter.js --json gezinti.json

      # Ayni gezintinin olculeri: plan §1.2 sadelik butcesi. Yalniz
      # EKIP-DURUM teslim tablosunda ✅ olan modullerde kirmizi olur.
      - name: Sadelik
        if: always()
        run: test -f gezinti.json && node tools/sadelik.js --gezinti gezinti.json

  yuk:
    name: ${{ matrix.system }} — beş yıllık yük denetimi
    # Agir is: bes yillik veri uretir ve butun ekranlari cizer. Her PR'da
    # kosturmak, her PR'a birkac dakika eklemek demekti — yavaslama veri
    # biriktikce gelir, bir gunde degil. Haftada bir yeter; elle de
    # baslatilabilir (workflow_dispatch).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        system: [AYS, SPI, ESP]
    defaults:
      run:
        working-directory: ${{ matrix.system }}
    env:
      # `perfcheck` ile aynı gerekçe: eşik değil ORTAM payı esner ve
      # araç bu payı çıktısına yazar (tools/loadcheck.js, PERF_PAY).
      PERF_PAY: '1.5'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Chromium kur
        run: npx playwright install --with-deps chromium

      - name: Beş yıllık veriyle çizim
        run: bash "$GITHUB_WORKSPACE/tools/ci_hata.sh" "Beş yıllık veriyle çizim" node tools/loadcheck.js
