      + (label ? '<div class="tiny dim">'+U.esc(label)+'</div>' : '')
      + '</div></div></div>';
  }

  function gauge(value, band, safeBand, unit){
    const hi = Math.max(band[1], safeBand ? safeBand[1] : band[1], value || 0) * 1.18;
    const p = v => U.clamp(100*v/hi, 0, 100);
    let html = '<div class="gauge">';
    html += '<div class="gauge__band" style="left:'+p(band[0])+'%;width:'+(p(band[1])-p(band[0]))+'%"></div>';
    if(safeBand) html += '<div class="gauge__safe" style="left:0;width:'+p(safeBand[0])+'%"></div>';
    if(value != null) html += '<div class="gauge__mark'+(value < band[0] ? ' is-low' : '')+'" style="left:'+p(value)+'%"></div>';
    html += '</div>';
    html += '<div class="gauge__scale"><span>0</span><span>gözlenen '+band[0]+'–'+band[1]+(safeBand ? ' · güvenli '+safeBand[0]+'–'+safeBand[1] : '')+'</span><span>'+Math.round(hi)+unit+'</span></div>';
    return html;
  }

  function sparkline(values, opts){
    const o = opts || {};
    const vals = values.filter(v => v != null);
    if(vals.length < 2) return '';
    const w = 100, h = 26;
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const X = i => (w) * (i/(values.length-1));
    const Y = v => h - 3 - (h-6) * ((v-min)/((max-min)||1));
    const pts = values.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:26px">'
      + '<path class="line'+(o.accent?' line--accent':'')+'" style="stroke-width:1.6" d="M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+'"/></svg>';
  }

  function stackBar(segments){
    const total = U.sum(segments.map(s => s.value));
    if(!total) return '<p class="small dim">Veri yok.</p>';
    return '<div class="stackbar">'
      + segments.filter(s => s.value).map(s => '<div class="stackbar__seg" style="width:'+(100*s.value/total)+'%;background:'+s.color+'" title="'+U.esc(s.label)+'"></div>').join('')
      + '</div>'
      + '<div class="legend">' + segments.map(s => '<span class="legend__item"><span class="legend__swatch" style="background:'+s.color+'"></span>'+U.esc(s.label)+' '+s.value+'</span>').join('') + '</div>';
  }

  /* 40 hafta x 7 gun calisma yogunlugu — hucre degeri 0..1 */
  function heatmap(cells, opts){
    const o = opts || {};
    const cols = o.cols || 40, rows = 7;
    const cell = 11, gap = 2, padL = 26, padT = 14;
    const w = padL + cols*(cell+gap), h = padT + rows*(cell+gap) + 14;
    const dayLabels = ['Pzt','','Çar','','Cum','','Paz'];

    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" style="min-width:'+Math.min(w, 760)+'px">';
    for(let r = 0; r < rows; r++){
      if(dayLabels[r]) svg += '<text x="0" y="'+(padT + r*(cell+gap) + cell - 1)+'" style="font-size:8.5px">'+dayLabels[r]+'</text>';
    }
    for(let c = 0; c < cols; c++){
      for(let r = 0; r < rows; r++){
        const item = cells[c*rows + r];
        const v = item ? item.value : null;
        const x = padL + c*(cell+gap), y = padT + r*(cell+gap);
        let fill = 'var(--surface-3)', op = '1';
        if(v != null && v > 0){ fill = 'var(--primary)'; op = String(0.25 + 0.75*Math.min(1, v)); }
        else if(item && item.future){ fill = 'var(--surface-2)'; }
        else if(item && item.missed){ fill = 'var(--danger)'; op = '0.22'; }
        svg += '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="2.5" fill="'+fill+'" opacity="'+op+'">'
          + (item ? '<title>'+esc(item.label)+'</title>' : '') + '</rect>';
      }
    }
    (o.monthTicks || []).forEach(t => {
      svg += '<text x="'+(padL + t.col*(cell+gap))+'" y="'+(padT-4)+'" style="font-size:8.5px">'+esc(t.label)+'</text>';
    });
    svg += '</svg>';
    return '<div style="overflow-x:auto">'+svg+'</div>';
  }
  function esc(s){ return R.U.esc(s); }

  function legend(items){
    return '<div class="legend">'+items.map(i => '<span class="legend__item"><span class="legend__swatch" style="background:'+i.color+'"></span>'+U.esc(i.label)+'</span>').join('')+'</div>';
  }

  /* ---------- ipucu (ⓘ) ve kenar bilgi rayi ---------- */

  /* Baslik yaninda kucuk bir ⓘ; tiklayinca balon acar. */
  function hint(key){
    const h = R.HINTS[key];
    if(!h) return '';
    return '<button class="hint" data-act="hint" data-hint="'+key+'" aria-label="'+U.esc(h.t)+' hakkında bilgi">i</button>';
  }

  /* Bolum kenarinda duran kisa aciklama kartlari — uzun metin yerine. */
  /* Ekran acıklamaları. Eskiden her ekranın altında acık duran bir metin
     duvariydi ve sayfanin sonunu bozuyordu; artik katlanir bir panel:
     varsayilan kapali, tek dokunusla acilir, tercih oturumda hatirlanir. */
  function rail(keys, title){
    const list = keys.filter(k => R.HINTS[k]);
    if(!list.length) return '';
    const open = !!(R.S.ui && R.S.ui.railOpen);
    const label = title === false ? 'Bu ekran nasıl okunur' : (title || 'Bu ekran nasıl okunur');

    const cards = list.map(k => {
      const h = R.HINTS[k];
      return '<button class="railcard" data-act="hint" data-hint="'+k+'">'
        + '<span class="railcard__t">'+U.esc(h.t)+'</span>'
        + '<span class="railcard__b">'+U.esc(h.b)+'</span>'
        + '</button>';
    }).join('');

    return '<section class="rail'+(open ? ' is-open' : '')+'">'
      + '<button class="rail__toggle" data-act="rail-toggle" aria-expanded="'+(open ? 'true' : 'false')+'">'
      +   icon('guide', 'rail__icon')
      +   '<span class="rail__label">'+U.esc(label)+'</span>'
      +   '<span class="rail__count">'+list.length+'</span>'
      +   '<span class="rail__chev">'+icon('down')+'</span>'
      + '</button>'
      + '<div class="rail__body"'+(open ? '' : ' hidden')+'>'+cards+'</div>'
      + '</section>';
  }

  function openHint(key, anchorEl){
    closeHint();
    const h = R.HINTS[key];
    if(!h) return;
    const el = document.createElement('div');
    el.className = 'popover';
    el.id = 'popover';
    el.setAttribute('role','dialog');
    el.innerHTML = '<div class="popover__title">'+U.esc(h.t)+'</div>'
      + '<div class="popover__body">'+U.esc(h.b)+'</div>'
      + (h.more ? '<div class="popover__more">'+U.esc(h.more)+'</div>' : '');
    document.getElementById('overlay-root').appendChild(el);

    const r = anchorEl.getBoundingClientRect();
    const w = el.offsetWidth, hgt = el.offsetHeight;
    let left = r.left + r.width/2 - w/2;
    left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
    let top = r.bottom + 8;
    if(top + hgt > window.innerHeight - 12) top = Math.max(12, r.top - hgt - 8);
    el.style.left = left+'px';
    el.style.top = top+'px';
  }
  function closeHint(){
    const el = document.getElementById('popover');
    if(el) el.remove();
  }
  function isHintOpen(){ return !!document.getElementById('popover'); }

  /* ---------- alt sayfa ---------- */
  function sheet(opts){
    closeSheet();
    const root = document.getElementById('overlay-root');
    const el = document.createElement('div');
    el.className = 'overlay';
    el.id = 'sheet';
    const { html, when } = R.h;
    el.innerHTML = String(html`
      <div class="${opts.wide ? 'sheet sheet--wide' : 'sheet'}" role="dialog" aria-modal="true" aria-label="${opts.title}">
        <div class="sheet__head">
          <div><h3>${opts.title}</h3>${when(opts.subtitle, () => html`<p>${opts.subtitle}</p>`)}</div>
          ${R.C.IconButton({ icon:'close', plain:true, aria:'Kapat', act:'sheet-close' })}
        </div>
        <div class="sheet__body">${raw(opts.body)}</div>
        ${when(opts.footer, () => html`<div class="sheet__foot">${raw(opts.footer)}</div>`)}
      </div>`);
    el.addEventListener('mousedown', e => { if(e.target === el) closeSheet(); });
    root.appendChild(el);
    const first = el.querySelector('input, textarea, select');
    if(first && !opts.noFocus) setTimeout(()=>first.focus(), 40);
  }
  function closeSheet(){
    const el = document.getElementById('sheet');
    if(el) el.remove();
  }
  function isSheetOpen(){ return !!document.getElementById('sheet'); }

  function toast(text){
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    root.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; }, 1500);
    setTimeout(() => el.remove(), 1800);
  }

  function confirmSheet(title, message, onConfirm, danger){
    sheet({
      title,
      body:String(R.h.html`<p>${message}</p>`),
      footer:String(R.h.html`${R.C.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${R.C.Button({ label:'Evet, devam et', tone:danger ? 'danger' : 'primary', act:'confirm-yes' })}`),
      noFocus:true,
    });
    R.UI._confirm = onConfirm;
  }

  return {
    icon, tagDot, certainty,
    lineChart, barChart, paretoBars, donut, gauge, sparkline, stackBar, heatmap, legend,
    hint, rail, openHint, closeHint, isHintOpen,
    sheet, closeSheet, isSheetOpen, toast, confirmSheet,
  };
})();

/* ==== js/core/components.js ==== */
/* Deklaratif bilesen seti.

   Her bilesen tek ve net bir API'ye sahiptir; varyantlar acik "modifier"
   alanlariyla gelir (ornegin tone:'ok'). Hepsi h.raw doner, ic ice gecebilir.

   Kullanim:
     C.Card({ title:'Deneme hacmi', sub:'Plan / gerçekleşen', body: C.Table(...) })
     C.Button({ label:'Kaydet', tone:'primary', act:'save-exam' })

   Not: eski R.UI yardimcilari bu setin ustune ince sarmalayici olarak durur;
   ekranlar kademeli olarak C.* API'sine gecirilir. */

window.R = window.R || {};

R.C = (function(){
  const { html, raw, when, cls, attrs, map } = R.h;
  const icon = name => raw(R.UI.icon(name));

  /* ---------- yapisal ---------- */

  /* Card: tek kart stili. Vurgu icin renkli kenarlik yerine rozet kullanilir. */
  function Card(o){
    const head = (o.title || o.sub || o.badge || o.actions) ? html`
      <div class="card__head">
        <div>
          ${when(o.title, () => html`<h3>${o.title}${when(o.hint, () => raw(R.UI.hint(o.hint)))}</h3>`)}
          ${when(o.sub, () => html`<p>${o.sub}</p>`)}
        </div>
        ${when(o.badge, o.badge)}
        ${when(o.actions, o.actions)}
      </div>` : '';
    return html`
      <section class="${cls('card', o.flat && 'card--flat', o.pad === 'sm' && 'card--pad-sm', o.class)}"
               ${when(o.id, () => attrs({ id:o.id }))}>
        ${head}
        ${o.body}
        ${when(o.foot, () => html`<div class="card__foot">${o.foot}</div>`)}
      </section>`;
  }

  /* Katlanir kart: uzun referans metinleri varsayilan olarak kapali tutar. */
  function Collapsible(o){
    return html`
      <section class="card">
        <button class="collapse__btn" data-act="${o.act}" ${attrs(o.data || {})}
                aria-expanded="${o.open ? 'true' : 'false'}">
          <span class="row-sm"><h3 class="collapse__title">${o.title}</h3>${when(o.meta, () => html`<span class="tiny dim">${o.meta}</span>`)}</span>
          <span class="${cls('collapse__chev', o.open && 'is-open')}">${icon('down')}</span>
        </button>
        ${when(o.open, o.body)}
      </section>`;
  }

  /* ---------- olcum ---------- */

  /* progress: 0–100. Sayinin yaninda "hedefin neresindeyim" seridi cizer —
     ciplak bir sayi ile dolulugu gorunen bir sayi ayni sey degildir.
     Deger anlamsizsa (hesaplanamiyorsa) alan hic verilmez, serit cizilmez. */
  function Stat(o){
    const pct = o.progress == null ? null : Math.max(0, Math.min(100, Number(o.progress) || 0));
    return html`
      <div class="${cls('stat', o.tone && 'stat--'+o.tone)}">
        <span class="stat__label">${o.label}${when(o.hint, () => raw(R.UI.hint(o.hint)))}</span>
        <span class="stat__value">${o.value}${when(o.unit, () => html`<small>${o.unit}</small>`)}</span>
        ${when(o.spark, o.spark)}
        ${when(pct != null, () => html`<span class="stat__bar" aria-hidden="true">
          <i style="width:${pct}%"></i></span>`)}
        ${when(o.note, () => html`<span class="stat__note">${o.note}</span>`)}
      </div>`;
  }

  function Bar(o){
    const pct = Math.max(0, Math.min(100, Number(o.value) || 0));
    const tone = o.tone || (pct >= 85 ? '' : pct >= 60 ? 'warn' : 'danger');
    return html`<div class="${cls('bar', o.large && 'bar--lg')}">
      <div class="${cls('bar__fill', tone && 'bar__fill--'+tone)}" style="width:${pct}%"></div>
    </div>`;
  }

  function Meter(o){
    const pct = Math.max(0, Math.min(100, Number(o.value) || 0));
    return html`
      <div class="meter">
        <div class="meter__top"><span class="muted">${o.label}</span><b class="num">${o.text != null ? o.text : '%'+Math.round(o.value)}</b></div>
        ${Bar({ value:pct, tone:o.tone, large:o.large })}
        ${when(o.note, () => html`<span class="tiny dim">${o.note}</span>`)}
      </div>`;
  }

  /* ---------- etiket ---------- */

  function Badge(o){
    const ICONS = { ok:'check', warn:'warn', danger:'warn', info:'info' };
    return html`<span class="${cls('badge', 'badge--'+(o.tone || 'muted'))}">${when(o.icon !== false && ICONS[o.tone], () => icon(ICONS[o.tone]))}${o.label}</span>`;
  }

  function Chip(o){
    if(typeof o === 'string') o = { label:o };
    return html`<span class="${cls('chip', o.act && 'chip--tap', o.on && 'chip--on')}"
      ${when(o.act, () => attrs(Object.assign({ 'data-act':o.act }, o.data || {})))}>${o.label}</span>`;
  }

  /* ---------- etkilesim ---------- */

  function Button(o){
    return html`<button
      class="${cls('btn', o.tone && 'btn--'+o.tone, o.size && 'btn--'+o.size, o.block && 'btn--block', o.class)}"
      ${attrs(Object.assign({ 'data-act':o.act, disabled:o.disabled, 'aria-label':o.aria, title:o.title }, o.data || {}))}
    >${when(o.icon, () => icon(o.icon))}${o.label}</button>`;
  }

  function IconButton(o){
    return html`<button class="${cls('iconbtn', o.plain && 'iconbtn--plain', o.size === 'sm' && 'iconbtn--sm', o.class)}"
      ${attrs(Object.assign({ 'data-act':o.act, 'aria-label':o.aria || o.label, title:o.title }, o.data || {}))}
    >${icon(o.icon)}</button>`;
  }

  /* Segmented: [{value,label}] + aktif deger */
  function Segmented(o){
    return html`<div class="${cls('seg', o.block && 'seg--block', o.primary && 'seg--primary')}" role="group" ${attrs({ 'aria-label':o.aria })}>
      ${map(o.items, it => html`<button class="${cls(String(it.value) === String(o.value) && 'is-on')}"
        ${attrs(Object.assign({ 'data-act':o.act, 'data-value':it.value }, o.data || {}))}
        aria-pressed="${String(it.value) === String(o.value) ? 'true' : 'false'}">${it.label}</button>`)}
    </div>`;
  }

  /* Ekran ici sekmeler: [{id,label}] + aktif id */
  function Subtabs(o){
    return html`<div class="subtabs" role="tablist" ${attrs({ 'aria-label':o.aria })}>
      ${map(o.items, t => html`<button class="${cls('subtab', t.id === o.value && 'is-active')}"
        role="tab" aria-selected="${t.id === o.value ? 'true' : 'false'}"
        ${attrs({ 'data-act':o.act, 'data-tab':t.id })}>${t.label}</button>`)}
    </div>`;
  }

  function Field(o){
    return html`<label class="field">
      <span>${o.label}${when(o.hint, () => html` <span class="hint-text">${o.hint}</span>`)}</span>
      ${o.input}
    </label>`;
  }

  function Input(o){
    return html`<input class="${cls('input', o.size === 'sm' && 'input--sm', o.numeric && 'input--num', o.class)}"
      ${attrs(Object.assign({
        id:o.id, type:o.type || 'text', value:o.value == null ? null : o.value,
        placeholder:o.placeholder, min:o.min, max:o.max, step:o.step,
        disabled:o.disabled, 'aria-label':o.aria, 'data-change':o.change,
      }, o.data || {}))}/>`;
  }

  function Textarea(o){
    return html`<textarea class="textarea"
      ${attrs(Object.assign({ id:o.id, rows:o.rows || 3, placeholder:o.placeholder, 'data-change':o.change }, o.data || {}))}
    >${o.value || ''}</textarea>`;
  }

  function Select(o){
    return html`<select class="${cls('select', o.size === 'sm' && 'input--sm')}"
      ${attrs(Object.assign({ id:o.id, disabled:o.disabled, 'data-change':o.change }, o.data || {}))}>
      ${map(o.options, op => {
        const v = op.value != null ? op.value : op;
        const l = op.label != null ? op.label : op;
        return html`<option value="${v}" ${String(v) === String(o.value) ? raw('selected') : ''}>${l}</option>`;
      })}
    </select>`;
  }

  function Checkbox(o){
    return html`<label class="${cls('check', o.checked && 'is-done')}">
      <input type="checkbox" ${o.checked ? raw('checked') : ''}
        ${attrs(Object.assign({ 'data-act':o.act }, o.data || {}))}/>
      <span>${o.label}</span>
    </label>`;
  }

  /* ---------- bilgi ---------- */

  function Notice(o){
    const tone = o.tone || 'info';
    return html`<div class="${cls('notice', 'notice--'+tone, o.class)}" ${when(tone === 'danger', () => attrs({ role:'alert' }))}>
      ${icon(tone === 'warn' || tone === 'danger' ? 'warn' : 'info')}
      <div>${when(o.title, () => html`<span class="notice__title">${o.title}</span> `)}${o.body}</div>
    </div>`;
  }

  function Empty(o){
    return html`<div class="empty">
      ${icon(o.icon || 'list')}
      <p>${o.text}</p>
      ${when(o.action, o.action)}
    </div>`;
  }

  /* Yukleniyor: spinner degil iskelet */
  function Skeleton(o){
    const n = o && o.rows ? o.rows : 3;
    return html`<div class="skeleton" aria-busy="true" aria-live="polite">
      ${map(Array.from({ length:n }), (_, i) => html`<div class="skeleton__row" style="width:${[92, 74, 84, 62][i % 4]}%"></div>`)}
    </div>`;
  }

  /* Siradaki hamle — her ekranda ayni merkez kart */
  function NextUp(o){
    return html`
      <div class="${cls('nextup', o.calm && 'nextup--calm')}">
        <div class="nextup__icon">${icon(o.icon)}</div>
        <div class="nextup__body">
          <div class="nextup__label">${o.label}${when(o.hint, () => raw(R.UI.hint(o.hint)))}</div>
          <div class="nextup__title">${o.title}</div>
          ${when(o.why, () => html`<div class="nextup__why">${o.why}</div>`)}
        </div>
        ${when(o.action, o.action)}
      </div>`;
  }

  /* ---------- tablo ---------- */

  /* headers: ['Ad', {label:'Net', num:true}] · rows: [[hucre, ...]] */
  function Table(o){
    return html`<div class="tablewrap"><table class="${cls(o.tight && 'table--tight')}">
      <thead><tr>${map(o.headers, hd => html`<th class="${cls(hd && hd.num && 'num')}">${hd && hd.label != null ? hd.label : hd}</th>`)}</tr></thead>
      <tbody>${map(o.rows, r => html`<tr>${map(r, (cell, i) => {
        const hd = o.headers[i];
        return html`<td class="${cls(hd && hd.num && 'num')}">${cell}</td>`;
      })}</tr>`)}</tbody>
    </table></div>`;
  }

  /* Sayfalama: uzun listelerde tum DOM'u cizmemek icin.
     paginate(list, page, size) -> { items, page, pages, total } */
  function paginate(list, page, size){
    const per = size || 25;
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total/per));
    const p = Math.min(Math.max(1, page || 1), pages);
    return { items:list.slice((p-1)*per, p*per), page:p, pages, total, per };
  }

  function Pager(o){
    if(o.pages <= 1) return raw('');
    return html`
      <div class="pager" role="navigation" aria-label="Sayfalama">
        ${Button({ label:'Önceki', size:'sm', act:o.act, disabled:o.page <= 1,
          data:{ 'data-page':o.page-1 } })}
        <span class="pager__info num">${o.page} / ${o.pages}
          <span class="dim">· ${o.total} kayıt</span></span>
        ${Button({ label:'Sonraki', size:'sm', act:o.act, disabled:o.page >= o.pages,
          data:{ 'data-page':o.page+1 } })}
      </div>`;
  }

  /* ---------- duzen ---------- */

  const Grid = body => html`<div class="grid">${body}</div>`;
  const Span = (n, body) => html`<div class="span-${n}">${body}</div>`;
  const Stack = (body, gap) => html`<div class="${cls('stack', gap === 'sm' && 'stack-sm', gap === 'xs' && 'stack-xs')}">${body}</div>`;
  const Cols = (n, body) => html`<div class="cols-${n}">${body}</div>`;
  const Row = (body, o) => html`<div class="${cls('row', o && o.between && 'between', o && o.wrap && 'wrap', o && o.sm && 'row-sm')}">${body}</div>`;
  const SectionTitle = (title, right) => html`<div class="section-title"><h2>${title}</h2>${when(right, right)}</div>`;

  return {
    Card, Collapsible, Stat, Bar, Meter, Badge, Chip, Button, IconButton, Segmented, Subtabs,
    Field, Input, Textarea, Select, Checkbox, Notice, Empty, Skeleton, NextUp, Table, Pager, paginate,
    Grid, Span, Stack, Cols, Row, SectionTitle,
  };
})();

/* ==== js/core/quiz.js ==== */
/* Kendini sınama motoru.

   Neden var: kart çevirmek "tanıma"dır, sınav "geri çağırma" ister.
   Aday kartı görünce "biliyorum" der, sınavda aynı soruyu yapamaz.
   Quiz bu farkı ölçer: önce cevabı yazdırır/seçtirir, sonra gösterir.

   Kaynaklar (hepsi sistemde zaten var, yeni veri türü üretilmez):
     - tekrar kartları (ön/arka yüz)
     - yanlış defteri (kök neden → doğru ilke)
     - video notları (zaman damgalı segmentler)

   Sonuç kural motoruna bağlanır:
     - bilinmeyen madde → kartın SRS aşaması düşer (schedule 'forgot')
     - kart yoksa yeni kart açılır
     - oturum özeti konu risk skoruna girdi olur

   Karar motoru burada da otoritedir; LLM soru üretebilir ama puanlamaz. */

window.R = window.R || {};

R.Quiz = (function(){
  const U = R.U, M = R.Model, S = R.S;

  const MODES = {
    due:      { label:'Bugünün kartları', note:'Tekrar takviminde bugüne düşenler' },
    subject:  { label:'Ders',             note:'Seçtiğin dersin tüm kartları' },
    topic:    { label:'Konu',             note:'Tek konuya odaklan' },
    errors:   { label:'Yanlış defteri',   note:'Kapanmamış yanlışların ilkeleri' },
    notes:    { label:'Ders notları',     note:'Video notlarından geri çağırma' },
    mixed:    { label:'Karışık',          note:'Hepsinden rastgele — sınav benzeri' },
  };

  const SIZES = [5, 10, 20];

  /* Sınama biçimi: açık uçlu (üret) ya da çoktan seçmeli (tanı + ele).
     ÖSYM çoktan seçmelidir; ikisi farklı beceri ölçer, ikisi de gerekir. */
  const FORMATS = {
    open:   { id:'open',   name:'Açık uçlu', note:'Cevabı kendin üret — en zoru, en öğreticisi' },
    choice: { id:'choice', name:'Çoktan seçmeli', note:'Şıklardan ele — sınav biçimine yakın' },
  };

  /* Süre baskısı: bildiğin ama yetiştiremediğin konuyu ayırır. */
  const TIMERS = [0, 20, 45, 90];

  /* Oturum yalnizca bellekte durur; bitince sonuc kalici kayitlara yazilir.
     Yarim kalan oturum kaydedilmez — yarim sinav veri kirletir. */
  let session = null;

  /* Çoktan seçmeli için çeldirici: aynı konudan, benzer uzunlukta başka cevaplar. */
  function distractors(item, pool_, n){
    const want = n || 3;
    const same = pool_.filter(x => x.id !== item.id && x.answer && x.answer !== item.answer);
    const sameTopic = same.filter(x => x.topic && x.topic === item.topic);
    const rest = same.filter(x => !x.topic || x.topic !== item.topic);
    const pick = shuffle(sameTopic).slice(0, want);
    if(pick.length < want) pick.push.apply(pick, shuffle(rest).slice(0, want - pick.length));
    return pick.slice(0, want).map(x => x.answer);
  }

  function buildChoices(item, pool_){
    const wrong = distractors(item, pool_, 3);
    if(wrong.length < 2) return null;                 // yeterli çeldirici yoksa açık uçlu kal
    const all = shuffle([item.answer].concat(wrong));
    return { options:all, correct:all.indexOf(item.answer) };
  }

  /* ---------- madde üretimi ---------- */

  function fromCard(card){
    return {
      id:'c:'+card.id,
      kind:'card',
      prompt:card.front,
      answer:card.back || '—',
      topic:card.topic || '',
      subjectId:card.subjectId || null,
      cardId:card.id,
      sourceLabel:card.source === 'error' ? 'yanlış defterinden'
        : card.source === 'note' ? 'ders notundan' : 'kart',
    };
  }

  function fromError(err){
    const label = err.topic || err.testName || 'Yanlış';
    return {
      id:'e:'+err.id,
      kind:'error',
      prompt:label + ' — "' + (err.rootCause || 'kök neden yazılmadı') + '" hatasında doğru ilke neydi?',
      answer:err.principle || err.recipe || '—',
      topic:err.topic || '',
      subjectId:err.subjectId || null,
      errorId:err.id,
      sourceLabel:'yanlış defteri',
    };
  }

  function fromSegment(note, seg, i){
    const topic = M.noteTopicName(note);
    const tag = (M.SEGMENT_TAGS[seg.tag] || M.SEGMENT_TAGS.not).label.toLowerCase();
    return {
      id:'n:'+note.id+':'+i,
      kind:'note',
      prompt:(topic ? topic + ' — ' : '') + M.fmtTs(seg.ts) + ' anındaki ' + tag + ' neydi?',
      answer:seg.text,
      topic,
      subjectId:note.subjectId || null,
      noteId:note.id,
      sourceLabel:'ders notu',
    };
  }

  /* Kaynak havuzu — moda gore toplanir, karistirilir, kirpilir. */
  function pool(opts){
    const o = opts || {};
    const mode = o.mode || 'due';
    const C = R.Calc;
    let items = [];

    if(mode === 'due'){
      items = C.dueCards().map(fromCard);
    }else if(mode === 'subject'){
      items = S.cards.filter(c => c.subjectId === o.subjectId).map(fromCard);
    }else if(mode === 'topic'){
      const subject = R.SUBJECTS.find(s => s.id === o.subjectId);
      const topic = subject ? subject.topics.find(t => t.id === o.topicId) : null;
      const name = topic ? topic.name : null;
      items = S.cards.filter(c => c.subjectId === o.subjectId && (!name || c.topic === name)).map(fromCard);
      S.videoNotes.filter(n => n.subjectId === o.subjectId && (!o.topicId || n.topicId === o.topicId))
        .forEach(n => n.segments.forEach((seg, i) => items.push(fromSegment(n, seg, i))));
    }else if(mode === 'errors'){
      items = C.openErrors().filter(e => e.principle || e.recipe).map(fromError);
    }else if(mode === 'notes'){
      S.videoNotes.forEach(n => n.segments.forEach((seg, i) => items.push(fromSegment(n, seg, i))));
    }else{ // mixed
      items = S.cards.map(fromCard)
        .concat(C.openErrors().filter(e => e.principle).map(fromError));
      S.videoNotes.forEach(n => n.segments.forEach((seg, i) => items.push(fromSegment(n, seg, i))));
    }

    return items.filter(x => x.answer && x.answer !== '—');
  }

  /* Deterministik olmayan ama tekrar edilebilir karistirma:
     ayni saniyede iki kez baslatilirsa ayni sirayi vermesin diye Math.random. */
  function shuffle(list){
    const a = list.slice();
    for(let i = a.length-1; i > 0; i--){
      const j = Math.floor(Math.random()*(i+1));
      const t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  /* ---------- oturum ---------- */

  function start(opts){
    const o = opts || {};
    const size = Number(o.size) > 0 ? Math.min(Math.floor(Number(o.size)), 100) : 10;
    const format = FORMATS[o.format] ? o.format : 'open';
    const perQuestion = TIMERS.indexOf(Number(o.seconds)) >= 0 ? Number(o.seconds) : 0;

    const all = pool(o);
    let items = shuffle(all).slice(0, size);

    /* Karışık tekrar: aynı konudan iki madde peş peşe gelmesin.
       ÖSYM sana konu başlığı vermiyor; ard arda aynı konu yanıltıcı kolaylık üretir. */
    if(o.interleave !== false) items = interleave(items);

    if(!items.length){
      session = null;
      return { ok:false, reason:'Bu seçimde sınanacak madde yok. Önce kart üret ya da ders notu ekle.' };
    }

    if(format === 'choice'){
      items = items.map(it => {
        const ch = buildChoices(it, all);
        return ch ? Object.assign({}, it, { choices:ch.options, correct:ch.correct }) : it;
      });
    }

    session = {
      mode:o.mode || 'due',
      format, perQuestion,
      subjectId:o.subjectId || null,
      topicId:o.topicId || null,
      items,
      index:0,
      revealed:false,
      picked:null,
      questionStartedMs:Date.now(),
      timedOut:0,
      results:[],
      startedAt:new Date().toISOString(),
      startedMs:Date.now(),
    };
    return { ok:true, total:items.length, format, perQuestion };
  }

  /* Aynı konudan ard arda gelmeyi engelle; mümkün değilse sırayı bozmadan bırak. */
  function interleave(list){
    const out = [];
    const rest = list.slice();
    let lastTopic = null;
    while(rest.length){
      let idx = rest.findIndex(x => !x.topic || x.topic !== lastTopic);
      if(idx < 0) idx = 0;
      const item = rest.splice(idx, 1)[0];
      lastTopic = item.topic || null;
      out.push(item);
    }
    return out;
  }

  function active(){ return session; }
  function current(){ return session ? session.items[session.index] : null; }
  function reveal(){ if(session) session.revealed = true; }
  function pick(i){
    if(!session || session.revealed) return null;
    session.picked = i;
    session.revealed = true;
    const item = current();
    return { correct:item && item.correct === i, correctIndex:item ? item.correct : null };
  }
  function pickedIndex(){ return session ? session.picked : null; }
  function format(){ return session ? session.format : 'open'; }
  function questionSeconds(){
    if(!session) return 0;
    return Math.floor((Date.now() - session.questionStartedMs)/1000);
  }
  function questionLeft(){
    if(!session || !session.perQuestion) return null;
    return Math.max(0, session.perQuestion - questionSeconds());
  }
  function isRevealed(){ return !!(session && session.revealed); }

  function progress(){
    if(!session) return null;
    return {
      index:session.index, total:session.items.length,
      answered:session.results.length,
      pct:U.pct(session.results.length, session.items.length),
      seconds:Math.round((Date.now() - session.startedMs)/1000),
    };
  }

  /* Cevap kaydi. Kart tabanli maddede SRS aşaması da guncellenir:
     bilinmeyen madde tekrar takviminde one cekilir. */
  async function answer(verdict){
    if(!session) return null;
    const item = current();
    if(!item) return null;

    session.results.push({ itemId:item.id, verdict, kind:item.kind, topic:item.topic,
      subjectId:item.subjectId, seconds:questionSeconds(), picked:session.picked });

    if(item.cardId){
      const card = S.cards.find(c => c.id === item.cardId);
      if(card){
        M.schedule(card, verdict === 'known' ? 'remembered' : verdict === 'shaky' ? 'hard' : 'forgot');
        await M.saveCard(card);
      }
    }

    session.revealed = false;
    session.picked = null;
    session.questionStartedMs = Date.now();
    session.index++;
    if(session.index >= session.items.length) return await finish();
    return { done:false, next:current() };
  }

  function skip(){
    if(!session) return null;
    session.revealed = false;
    session.picked = null;
    session.questionStartedMs = Date.now();
    session.index = Math.min(session.index + 1, session.items.length);
    return current();
  }

  /* Süre dolunca madde otomatik "bilmiyordum" sayılır — sınavdaki gibi. */
  async function timeout(){
    if(!session) return null;
    session.timedOut++;
    session.revealed = true;
    return await answer('unknown');
  }

  /* ---------- bitiş ve sonuç ---------- */

  /* Bilinmeyen madde icin kart yoksa acilir: sinav bosluk gosterir,
     bosluk kapatilmadan biten oturum ise yalniz moral kirar. */
  async function ensureCards(res){
    const created = [];
    for(const r of res){
      if(r.verdict === 'known') continue;
      const item = session.items.find(x => x.id === r.itemId);
      if(!item || item.cardId) continue;

      const card = M.newCard({
        front:item.prompt,
        back:item.answer,
        topic:item.topic,
        subjectId:item.subjectId,
        source:item.kind === 'error' ? 'error' : 'note',
        sourceRef:item.errorId || item.noteId || null,
      });
      await M.saveCard(card);
      created.push(card);
    }
    return created;
  }

  async function finish(){
    if(!session) return null;
    const res = session.results;
    const known = res.filter(r => r.verdict === 'known').length;
    const shaky = res.filter(r => r.verdict === 'shaky').length;
    const unknown = res.filter(r => r.verdict === 'unknown').length;
    const created = await ensureCards(res);

    // Zayif konular: iki ve uzeri bilinmeyen/sallantili madde ureten konular.
    const byTopic = {};
    res.forEach(r => {
      if(!r.topic) return;
      byTopic[r.topic] = byTopic[r.topic] || { topic:r.topic, total:0, miss:0 };
      byTopic[r.topic].total++;
      if(r.verdict !== 'known') byTopic[r.topic].miss++;
    });
    const weak = Object.values(byTopic).filter(t => t.miss >= 2)
      .sort((a, b) => b.miss - a.miss).slice(0, 3);

    const total = res.length || 1;
    const score = U.pct(known, total);
    const times = res.map(r => r.seconds).filter(x => x != null && x >= 0);
    const medianTime = U.median(times);
    const summary = {
      mode:session.mode,
      total:res.length, known, shaky, unknown, score,
      seconds:Math.round((Date.now() - session.startedMs)/1000),
      format:session.format,
      perQuestion:session.perQuestion,
      timedOut:session.timedOut,
      medianTime:medianTime == null ? null : Math.round(medianTime),
      createdCards:created.length,
      weak,
      verdict:score >= 80 ? 'strong' : score >= 55 ? 'ok' : 'weak',
      note:score >= 80
        ? 'Geri çağırma sağlam. Bu konuda tekrar aralığını uzatabilirsin.'
        : score >= 55
        ? 'Yarıdan fazlası geldi ama boşluk var. Bilinmeyenler karta düştü.'
        : 'Geri çağırma zayıf. Konu "biliyorum" hissi veriyor ama üretilmiyor — kartlarla tekrar et.',
      finishedAt:new Date().toISOString(),
    };

    session = null;
    return { done:true, summary };
  }

  function cancel(){ session = null; }

  /* Bir sinav baslatilabilir mi? Ekran bunu sorup dugmeyi kilitler. */
  function availability(){
    return {
      due:pool({ mode:'due' }).length,
      errors:pool({ mode:'errors' }).length,
      notes:pool({ mode:'notes' }).length,
      mixed:pool({ mode:'mixed' }).length,
    };
  }

  return { MODES, SIZES, FORMATS, TIMERS, pool, start, active, current, reveal, isRevealed,
    pick, pickedIndex, format, questionSeconds, questionLeft, timeout,
    progress, answer, skip, finish, cancel, availability };
})();

/* ==== js/core/examrun.js ==== */
/* Süreli deneme oturumu — sınav günü provası.

   Test başına kronometre işler, soru bazlı işaretler alınır, oturum bitince
   deneme kaydına dönüşür. Dakikalar elle girilmez; ölçülür.

   Kural motoru otoritedir: burada yalnız süre ve işaret toplanır; net,
   medyan ve karar hesabı her zaman R.Calc'te kalır. */

window.R = window.R || {};

R.ExamRun = (function(){
  const U = R.U, M = R.Model;

  const MARKS = {
    ok:   { label:'Yaptım',    tone:'ok',    key:'1' },
    slow: { label:'Zorlandım', tone:'warn',  key:'2' },
    skip: { label:'Atladım',   tone:'muted', key:'3' },
  };

  let run = null;

  function active(){ return run; }
  function currentTest(){ return run ? run.tests[run.index] : null; }

  function start(template, opts){
    const o = opts || {};
    const tmpl = typeof template === 'string'
      ? R.EXAM_TEMPLATES.find(t => t.id === template)
      : template;
    if(!tmpl) return { ok:false, reason:'Şablon bulunamadı.' };

    run = {
      templateId:tmpl.id,
      name:tmpl.name,
      family:tmpl.family,
      kind:tmpl.kind,
      duration:tmpl.duration,
      publisher:o.publisher || '',
      date:o.date || U.todayISO(),
      tests:tmpl.tests.map(t => ({
        name:t.name, q:t.q,
        seconds:0, startedMs:null, finished:false,
      })),
      index:0,
      marks:[],
      startedMs:Date.now(),
      pausedMs:0,
      pausedAt:null,
    };
    run.tests[0].startedMs = Date.now();
    return { ok:true, run };
  }

  function elapsedTotal(){
    if(!run) return 0;
    const paused = run.pausedAt ? Date.now() - run.pausedAt : 0;
    return Math.max(0, Math.floor((Date.now() - run.startedMs - run.pausedMs - paused)/1000));
  }
  function elapsedTest(){
    const t = currentTest();
    if(!t) return 0;
    if(!t.startedMs || run.pausedAt) return t.seconds;
    return t.seconds + Math.floor((Date.now() - t.startedMs)/1000);
  }
  function remaining(){
    if(!run) return 0;
    return Math.max(0, run.duration*60 - elapsedTotal());
  }

  function pause(){
    if(!run || run.pausedAt) return;
    const t = currentTest();
    if(t && t.startedMs){
      t.seconds += Math.floor((Date.now() - t.startedMs)/1000);
      t.startedMs = null;
    }
    run.pausedAt = Date.now();
  }
  function resume(){
    if(!run || !run.pausedAt) return;
    run.pausedMs += Date.now() - run.pausedAt;
    run.pausedAt = null;
    const t = currentTest();
    if(t) t.startedMs = Date.now();
  }
  function isPaused(){ return !!(run && run.pausedAt); }

  /* Soru işareti: hangi testte, kaçıncı soruda, o soruya kaç saniye gitti. */
  function mark(kind){
    if(!run) return null;
    const t = currentTest();
    if(!t) return null;
    const secs = elapsedTest();
    const prev = run.marks.filter(m => m.test === t.name);
    const last = prev.length ? prev[prev.length-1].at : 0;
    const rec = {
      test:t.name,
      no:prev.length + 1,
      kind:kind,
      at:secs,
      spent:Math.max(0, secs - last),
    };
    run.marks.push(rec);
    return rec;
  }
  function undoMark(){
    if(!run || !run.marks.length) return null;
    return run.marks.pop();
  }

  function stopClockOfCurrent(){
    const t = currentTest();
    if(t && t.startedMs){
      t.seconds += Math.floor((Date.now() - t.startedMs)/1000);
      t.startedMs = null;
    }
    return t;
  }

  function nextTest(){
    if(!run) return null;
    const t = stopClockOfCurrent();
    if(t) t.finished = true;
    if(run.index >= run.tests.length - 1) return null;
    run.index++;
    const next = currentTest();
    if(!run.pausedAt) next.startedMs = Date.now();
    return next;
  }
  function gotoTest(i){
    if(!run || i < 0 || i >= run.tests.length) return null;
    stopClockOfCurrent();
    run.index = i;
    const next = currentTest();
    if(!run.pausedAt) next.startedMs = Date.now();
    return next;
  }

  function testSeconds(t){
    if(!t) return 0;
    if(!t.startedMs || (run && run.pausedAt)) return t.seconds;
    return t.seconds + Math.floor((Date.now() - t.startedMs)/1000);
  }

  /* Oturum özeti: süre dağılımı, yavaş sorular ve ısınma analizi. */
  function summary(){
    if(!run) return null;
    const total = elapsedTotal();
    const totalQ = U.sum(run.tests.map(x => x.q)) || 1;
    const perTest = run.tests.map(t => {
      const seconds = testSeconds(t);
      const planned = Math.round(run.duration*60 * (t.q / totalQ));
      return { name:t.name, q:t.q, seconds, planned, drift:seconds - planned };
    });

    const marks = run.marks;
    const spent = marks.map(m => m.spent).filter(x => x > 0);
    const medianSpent = U.median(spent);

    const early = marks.filter(m => m.at <= 20*60);
    const late = marks.filter(m => m.at > 20*60);
    const rate = list => list.length ? U.pct(list.filter(m => m.kind === 'ok').length, list.length) : null;
    const earlyRate = rate(early);
    const lateRate = rate(late);

    return {
      totalSeconds:total,
      overtime:total - run.duration*60,
      perTest,
      marks:marks.length,
      slow:marks.filter(m => m.kind === 'slow').length,
      skipped:marks.filter(m => m.kind === 'skip').length,
      medianSpent:medianSpent == null ? null : Math.round(medianSpent),
      slowest:marks.slice().sort((a, b) => b.spent - a.spent).slice(0, 5),
      earlyRate, lateRate,
      warmup:(earlyRate != null && lateRate != null && lateRate - earlyRate >= 15)
        ? 'Isınma sorunu: ilk 20 dakikada isabet %'+earlyRate+', sonrasında %'+lateRate+'. '
          + 'Denemeye başlamadan önce 5 dakikalık kolay set çöz.'
        : null,
    };
  }

  /* Oturumu bitir: deneme kaydı ve süre kaydı oluşur. */
  async function finish(scores){
    if(!run) return null;
    pause();
    const sum = summary();
    const tests = run.tests.map((t, i) => {
      const sc = (scores && scores[i]) || {};
      return {
        name:t.name,
        correct:Number(sc.correct) || 0,
        wrong:Number(sc.wrong) || 0,
        blank:Number(sc.blank) || 0,
        minutes:Math.round(sum.perTest[i].seconds / 60),
      };
    });

    const exam = {
      id:U.uid('e'),
      date:run.date,
      type:run.name,
      family:run.family,
      kind:run.kind,
      publisher:run.publisher,
      duration:run.duration,
      tests,
      protocol:{},
      createdAt:new Date().toISOString(),
      analysisCompletedAt:null,
      timed:true,
    };
    await M.saveExam(exam);

    const session = await M.saveSession({
      examId:exam.id,
      templateId:run.templateId,
      date:run.date,
      status:'done',
      totalSeconds:sum.totalSeconds,
      overtime:sum.overtime,
      tests:sum.perTest,
      marks:run.marks,
      earlyRate:sum.earlyRate,
      lateRate:sum.lateRate,
      warmup:sum.warmup,
      finishedAt:new Date().toISOString(),
    });

    run = null;
    return { exam, session, summary:sum };
  }

  function cancel(){ run = null; }

  return { MARKS, start, active, currentTest, elapsedTotal, elapsedTest, remaining,
    pause, resume, isPaused, mark, undoMark, nextTest, gotoTest, summary, finish, cancel };
})();

/* ==== js/core/auto.js ==== */
/* Otomasyon — sistemin kendi kendine yaptığı işler.

   İlke: otomasyon ÖNERİR, kullanıcı ONAYLAR. Hiçbir şey sessizce değişmez.
   Her öneri "neden" taşır ve tek tıkla uygulanır ya da atlanır.

   Kural motoru (R.Calc) ve plan üreteci (R.Planner) otoritedir; burası
   yalnız onların çıktısını eyleme çevirir. LLM burada yer almaz. */

window.R = window.R || {};

R.Auto = (function(){
  const U = R.U, M = R.Model, C = R.Calc, S = R.S;

  /* ---------- haftalık sözleşmeyi plandan doldur ---------- */

  /* Plandaki konular + risk sıralaması → hafta sözleşmesi taslağı.
     İmzalı hafta dokunulmaz. */
  function draftWeek(n){
    const week = S.weeks[M.weekId(n)];
    if(!week) return null;
    if(week.signedAt) return { ok:false, reason:'Hafta imzalı; önce revize et.' };

    const plan = M.curriculumFor(n);
    const items = (plan.items || []).slice(0, 3);
    const risky = C.riskRanking(6);
    const carry = week.carryIn || [];

    /* Plan konuları + geçen haftadan devir + en riskli konu (varsa boşluk). */
    const picked = [];
    const seen = {};
    const push = (name, subjectId, topicId, why) => {
      const key = (subjectId || '') + ':' + (topicId || '') + ':' + name;
      if(seen[key] || picked.length >= 3) return;
      seen[key] = true;
      picked.push({ name, subjectId:subjectId || null, topicId:topicId || null, why });
    };

    carry.forEach(name => push(name, null, null, 'geçen haftadan devir'));
    items.forEach(it => push(it.name, it.subjectId, it.topicId, 'plandaki sıra'));
    risky.forEach(r => {
      if(picked.length >= 3) return;
      push(r.topicName, r.subjectId, r.topicId, 'risk ' + r.score + ' — ' + r.label.toLowerCase());
    });

    const cap = Number(S.profile.capacityHoursPerWeek) || 21;
    const target = plan.q || 400;
    const perTopic = Math.max(40, Math.round(target / Math.max(1, picked.length) / 10) * 10);

    return {
      ok:true,
      topics:picked.map(p => ({
        name:p.name, subjectId:p.subjectId, topicId:p.topicId,
        questionTarget:perTopic, accuracy:70, why:p.why,
      })),
      questionTarget:target,
      capacityMin:Math.round(cap * 60),
      behaviorGoal:week.behaviorGoal || suggestBehaviorGoal(),
      examPlan:plan.exam,
      checkpoint:plan.check,
    };
  }

  /* Davranış hedefi verideki en zayıf davranıştan seçilir. */
  function suggestBehaviorGoal(){
    const sleep = C.sleepAverage(7);
    const target = (S.profile && S.profile.sleepTarget) || 7.5;
    const streak = C.behaviorStreak().streak;
    const debt = C.analysisDebt().length;

    if(sleep != null && sleep < target - 0.75) return '6 gün ' + target + ' saat uyku';
    if(debt) return 'Her denemenin analizi 24 saat içinde biter';
    if(streak < 3) return '6 gün minimum standardı tuttur';
    if(C.cardDebt() > 10) return 'Her gün due kartları sıfırla';
    return '6 gün planlanan blokların en az beşini tamamla';
  }

  async function applyDraft(n, draft){
    const week = S.weeks[M.weekId(n)];
    if(!week || !draft || !draft.ok) return false;
    week.mainTopics = draft.topics.map(t => ({
      name:t.name, questionTarget:t.questionTarget, accuracy:t.accuracy,
      subjectId:t.subjectId, topicId:t.topicId,
    }));
    week.questionTarget = draft.questionTarget;
    week.capacityMin = draft.capacityMin;
    if(!week.behaviorGoal) week.behaviorGoal = draft.behaviorGoal;
    await M.saveWeek(n);
    return true;
  }

  /* ---------- günün bloklarını haftanın konularına bağla ---------- */

  async function syncDayBlocks(dateISO){
    const iso = dateISO || U.todayISO();
    const day = S.days[iso];
    if(!day) return 0;
    const n = M.weekOf(iso);
    const week = S.weeks[M.weekId(n)];
    if(!week || !week.mainTopics.length) return 0;

    let changed = 0;
    const work = day.blocks.filter(b => b.slot !== 'Dinlenme');
    work.forEach((b, i) => {
      if(b.status !== 'pending') return;          // başlanmış bloğa dokunma
      const t = week.mainTopics[i % week.mainTopics.length];
      if(!t) return;
      if(b.topic !== t.name || b.subjectId !== (t.subjectId || null)){
        b.topic = t.name;
        b.subjectId = t.subjectId || null;
        b.topicId = t.topicId || null;
        changed++;
      }
    });
    if(changed) await M.saveDay(iso);
    return changed;
  }

  /* ---------- öneri kuyruğu ----------
     Bugün ekranında ve hafta ekranında gösterilir; her biri tek tıkla uygulanır. */

  function suggestions(){
    const out = [];
    const n = M.currentWeek();
    const week = S.weeks[M.weekId(n)];
    const health = M.planHealth();
    const todayISO = U.todayISO();
    const day = S.days[todayISO];

    if(week && !week.signedAt && !week.mainTopics.some(t => t.name)){
      out.push({
        id:'draft-week', icon:'week', title:'Haftalık sözleşmeyi doldur',
        why:'Plandaki konular ve risk sıralaması hazır; taslak tek tıkla yazılır.',
        act:'auto-draft-week', tone:'primary',
      });
    }

    if(day && week && week.mainTopics.length){
      const unlinked = day.blocks.filter(b => b.slot !== 'Dinlenme' && b.status === 'pending' && !b.subjectId).length;
      if(unlinked >= 2){
        out.push({
          id:'sync-blocks', icon:'today', title:'Blokları haftanın konularına bağla',
          why:unlinked+' blok derse bağlı değil; bağlanmayan blok konu istatistiğine girmez.',
          act:'auto-sync-blocks',
        });
      }
    }

    if(health && health.status === 'geride'){
      out.push({
        id:'replan', icon:'map', title:'Planı yeniden hesapla',
        why:health.note,
        act:'auto-replan', tone:'primary',
      });
    }

    const pending = C.pendingSecondChecks().filter(p => p.overdue);
    if(pending.length){
      out.push({
        id:'second-check', icon:'check', title:pending.length+' konuda 2. ölçüm gecikti',
        why:'Tek ölçüm kapanış saymaz; gecikmiş ölçüm konu kapanışını olduğundan iyi gösterir.',
        act:'go', data:{ 'data-route':'subjects' },
      });
    }

    const triggers = C.protocolTriggers().filter(t => !M.activeProtocols().some(a => a.protoId === t.id));
    triggers.forEach(t => {
      out.push({
        id:'proto-' + t.id, icon:'shield', title:'Telafi önerisi: ' + t.title,
        why:t.detail, act:'go', data:{ 'data-route':'protocols' },
      });
    });

    const notesNoCards = S.videoNotes.filter(v =>
      v.segments.length >= 3 && !S.cards.some(c => c.source === 'note' && c.sourceRef === v.id));
    if(notesNoCards.length){
      out.push({
        id:'note-cards', icon:'cards', title:notesNoCards.length+' dersin notu karta dönmedi',
        why:'Not tek başına tekrar değildir; kart olmadan iki haftada unutulur.',
        act:'go', data:{ 'data-route':'learn' },
      });
    }

    /* Erken uyarı: iki hafta üst üste sapma varsa dördüncü haftayı bekleme. */
    const drift = driftStreak();
    if(drift.weeks >= 2){
      out.push({
        id:'drift', icon:'warn', title:drift.weeks + ' hafta üst üste plan sapması',
        why:'Ortalama tamamlama %' + drift.avg + '. Bu bir irade sorunu değil kapasite sorunu olabilir; '
          + 'hedefi kısmak ya da engeli kaldırmak gerekir.',
        act:'go', data:{ 'data-route':'protocols' }, tone:'primary',
      });
    }

    /* Pazar akşamı: hafta kapanışı hatırlatması. */
    const dow = U.weekdayIndex(U.today());
    if(dow === 6 && !S.reviews[M.weekId(n)]){
      out.push({
        id:'close-week', icon:'check', title:'Haftayı kapat',
        why:'Pazar review’u 30–40 dakika. Sistem özeti hazırladı; sen dört sütunu doldur.',
        act:'auto-close-week', tone:'primary',
      });
    }

    /* Sınav haftası modu: son iki hafta arayüz sadeleşir. */
    const ew = C.examWeekMode();
    if(ew.active && !S.ui.examWeekAck){
      out.push({
        id:'exam-week', icon:'flag', title:'Sınav haftası modu',
        why:ew.note + ' Kalan ' + ew.daysLeft + ' gün.',
        act:'auto-exam-week',
      });
    }

    if(M.backupDue()){
      out.push({
        id:'backup', icon:'download', title:'Yedek al',
        why:'Son yedekten bu yana bir haftadan fazla geçti; tarayıcı verisi silinirse geçmiş kaybolur.',
        act:'export-data',
      });
    }

    return out;
  }

  /* Üst üste sapan hafta sayısı — erken uyarının girdisi. */
  function driftStreak(){
    const cur = M.currentWeek();
    let weeks = 0;
    const vals = [];
    for(let n = cur - 1; n >= Math.max(1, cur - 4); n--){
      const comp = C.planCompletion(n);
      if(comp == null) break;
      if(comp >= 70) break;
      weeks++;
      vals.push(comp);
    }
    return { weeks, avg:vals.length ? U.round(U.sum(vals) / vals.length, 0) : null };
  }

  /* Hafta kapanış taslağı: review'un dört sütununu veriyle doldurur. */
  function closeWeekDraft(n){
    const week = S.weeks[M.weekId(n)];
    const comp = C.planCompletion(n);
    const qr = C.questionRealization(n);
    const reasons = C.skipReasonCounts(n);
    const topReason = Object.keys(reasons).sort((a, b) => reasons[b] - reasons[a])[0];
    const blocks = C.weekBlocks(n, true);
    const solved = U.sum(blocks.map(b => b.actualQ || 0));
    const correct = U.sum(blocks.map(b => b.correctQ || 0));
    const acc = solved ? U.pct(correct, solved) : null;

    const planned = week && week.mainTopics.length
      ? week.mainTopics.map(t => t.name + ' (' + t.questionTarget + ' soru)').join(', ')
      : 'Hafta sözleşmesi boş kaldı.';
    const done = qr
      ? qr.solved + ' soru çözüldü (hedef ' + qr.target + '), plan tamamlama %' + (comp == null ? '—' : comp) + '.'
        + (acc != null ? ' Doğruluk %' + acc + '.' : '')
      : 'Ölçülebilir çıktı kaydedilmedi.';
    const why = topReason
      ? 'En sık sapma nedeni: ' + topReason + ' (' + reasons[topReason] + ' blok).'
      : (comp != null && comp >= 85 ? 'Belirgin sapma yok.' : 'Sapma nedeni işaretlenmemiş.');

    /* Devir: kapanmamış plan konuları. */
    const carry = [];
    const plan = M.curriculumFor(n);
    (plan.items || []).forEach(it => {
      const st = M.topicState(it.subjectId, it.topicId);
      if(st.state !== 'closed' && carry.length < 2) carry.push(it.name);
    });

    return { planned, done, why, decision:'', carry };
  }

  /* ---------- gün açılışında çalışan sessiz bakım ----------
     Yalnız güvenli işler: plan üretimi ve blok bağlama. Veri silmez. */
  async function onDayOpen(){
    const done = [];
    try{
      if(S.profile && S.profile.setupDone){
        const before = S.plan;
        await M.ensurePlan();
        if(S.plan !== before) done.push('plan');
      }
      const n = await syncDayBlocks();
      if(n) done.push('bloklar:' + n);
    }catch(e){
      console.error('[Auto]', e);
    }
    return done;
  }

  return { draftWeek, applyDraft, suggestBehaviorGoal, syncDayBlocks, suggestions, onDayOpen,
    driftStreak, closeWeekDraft };
})();

  function hatalar(input){

    return subjects.map(s => {
      const c = C.subjectClosure(s.id);

          konu:t.name, grup:t.group || null, siklik:t.freq, tahminiSure:t.days,

  function haftalar(input){
    const o = input || {};
    const cur = M.currentWeek();
    const from = Math.max(1, cur - (o.gerideHafta || 6));
    const out = [];
    for(let n = from; n <= cur; n++){
      const w = S.weeks[M.weekId(n)];
      const rev = S.reviews[M.weekId(n)];
      out.push({
        hafta:n,

        planTamamlama:C.planCompletion(n),
        soruGerceklesme:C.questionRealization(n),
        imzalandi:!!(w && w.signedAt),
        sapmaNedenleri:C.skipReasonCounts(n),
        review: rev ? { planlandi:rev.planned, yapildi:rev.done, neden:rev.why, duzeltme:rev.decision, devir:rev.carry } : null,
      });

  function gunler(input){

        notId:{ type:'string', description:'tek bir dersin id’si' },

    { name:'mesgaleler', description:'Mola ve meşgale durumu: bugün kaç mola alındı, şu an ne önerilebilir.',
      inputSchema:{ type:'object', properties:{} }, execute:mesgaleler },

    { name:'enerji_durumu', description:'Adayın günlük enerji girişi (1–5), ortalaması ve uyku ortalaması.',
      inputSchema:{ type:'object', properties:{ gun:{ type:'number' } } }, execute:enerjiDurumu },

    { name:'gunun_akisi', description:'Bugünün adımları (izle → not → soru → kart → mola), hangileri tamam, sıradaki hamle ve kazanılan davranışlar.',
      inputSchema:{ type:'object', properties:{} }, execute:gununAkisi },

    { name:'konu_riski', description:'Konu bazlı risk sıralaması: frekans, kapanış, açık yanlış, gecikmiş kart ve tazelikten hesaplanır. “Neye çalışayım” sorusunda kullan.',
      inputSchema:{ type:'object', properties:{ limit:{ type:'number' } } }, execute:konuRiski },

    { name:'puan_tahmini', description:'Kural motorunun ürettiği tahmini puan ve sıra BANDI. Bu bant dışına çıkma, kesin sıra söyleme.',
      inputSchema:{ type:'object', properties:{} }, execute:puanTahmini },
  ];

  /* ---------- gizlilik suzgeci ----------
     LLM'e giden her nesne bu suzgecten gecer. Kisisel alanlar ADILA cikarilir;
     yalnizca davranissal ve akademik metrikler kalir. Yeni bir alan eklenirse
     varsayilan olarak GECER — ama ad/sehir/okul gibi anahtarlar her derinlikte
     silinir ve metin icindeki profil degerleri maskelenir. */
  const BLOCKED_KEYS = ['name','ad','isim','city','sehir','şehir','school','okul',
    'email','eposta','e-posta','phone','telefon','address','adres','tcNo','tckn'];

  function scrub(value, secrets){
    if(value == null) return value;
    if(typeof value === 'string'){
      let out = value;
      secrets.forEach(sec => {
        if(sec && sec.length > 2) out = out.split(sec).join('—');
      });
      return out;
    }
    if(Array.isArray(value)) return value.map(v => scrub(v, secrets));
    if(typeof value === 'object'){
      const out = {};
      Object.keys(value).forEach(k => {
        if(BLOCKED_KEYS.indexOf(k) >= 0) return;         // anahtar bazli eleme
        out[k] = scrub(value[k], secrets);
      });
      return out;
    }
    return value;
  }

  /* Profildeki kisisel degerleri toplar; ciktida maskelenir. */
  function secretList(){
    const p = S.profile || {};
    return [p.name, p.city, p.school].filter(Boolean);
  }

  function sanitize(value){ return scrub(value, secretList()); }

  /* ---------- arac onbellegi ----------
     Ayni cagri ayni turda tekrarlanirsa veri yeniden hesaplanmaz. */
  let cache = new Map();
  function resetCache(){ cache = new Map(); }

  /* sample() icin: her aracin execute'u guvenli sarmalanir */
  function forSample(){
    resetCache();
    return TOOLS.map(t => ({
      name:t.name,
      description:t.description,
      inputSchema:t.inputSchema,
      execute(input){
        const key = t.name + ':' + JSON.stringify(input || {});
        if(cache.has(key)) return cache.get(key);
        let out;
        try{
          const raw = t.execute(input || {});
          out = raw === undefined ? { sonuc:'veri yok' } : sanitize(raw);
        }catch(e){
          out = { hata:'okunamadı: '+(e && e.message ? e.message : 'bilinmeyen') };
        }
        cache.set(key, out);
        return out;
      },
    }));
  }

  return { TOOLS, forSample, sanitize, resetCache, durum, denemeler, hatalar, konular, haftalar, gunler, hedef, kartlar,
    videoNotlari, mesgaleler, enerjiDurumu, gununAkisi, konuRiski, puanTahmini };
})();

/* ==== js/core/quota.js ==== */
/* Istek sinir yoneticisi — ucretsiz modellerin kotasi asilmaz.

   Ucretsiz saglayicilarin uc sinirı vardir ve ucu de asilirsa istek reddedilir:
     RPM  dakikada istek     (asilirsa 429; birkac saniye beklemek yeter)
     RPD  gunde istek        (asilirsa gun bitene kadar kapali; beklemek anlamsiz)
     TPM  dakikada jeton     (buyuk istemlerde binder; ofis istemleri kucuk)

   Bu modul iki sey yapar:

   1) ARALIK KOYAR. Ard arda gelen iki istek arasina en az 60000/RPM ms boşluk
      birakir. Boylece patlama (burst) hic olusmaz; toplanti da bu sayede
      "sirayla konusuluyor" ritmine kavusur.

   2) GUNU SAYAR. Gunluk sayac localStorage'da durur; sayfa yenilense de
      kaybolmaz. Gun dolduysa beklemek yerine acik bir hata dondurur.

   Sayaclar saglayici+model basina ayri tutulur: Groq'ta sinira takilmak
   Gemini'yi durdurmaz. */

window.R = window.R || {};

R.Quota = (function(){

  const STORE = 'rota.llm.quota';
  /* Saglayicinin bildirdigi sinirin tamami kullanilmaz: saat farki, ayni
     anahtarla acilmis baska sekme ve saglayicinin kendi yuvarlamasi icin pay. */
  const SAFETY = 0.85;
  /* Bir istegin kuyrukta bekleyebilecegi en uzun sure. Daha uzunu kullaniciyi
     bekletmek yerine acikca soylenir. */
  const MAX_WAIT_MS = 75000;

  /* ---------- kalici gunluk sayac ---------- */

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function readStore(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORE) || '{}');
      if(raw.day !== todayKey()) return { day:todayKey(), used:{} };
      return { day:raw.day, used:raw.used || {} };
    }catch(e){ return { day:todayKey(), used:{} }; }
  }

  let daily = readStore();

  function persist(){
    try{ localStorage.setItem(STORE, JSON.stringify(daily)); }catch(e){}
  }

  function rollDay(){
    if(daily.day !== todayKey()){ daily = { day:todayKey(), used:{} }; persist(); }
  }

  /* ---------- dakikalik pencere (bellekte) ---------- */

  /* key -> { times:[ms], nextFreeAt:ms } */
  const minute = new Map();

  function bucket(key){
    if(!minute.has(key)) minute.set(key, { times:[], nextFreeAt:0 });
    return minute.get(key);
  }

  function prune(b, now){
    while(b.times.length && now - b.times[0] >= 60000) b.times.shift();
  }

  /* ---------- sinirlarin okunmasi ---------- */

  /* Sayac anahtari saglayici + model + ANAHTAR kimligidir: ayni saglayiciya
     iki API anahtari verildiginde kota ayri sayilir ve gunluk hak katlanir. */
  function key(cfg){
    const k = (cfg && cfg.keyId != null) ? '#' + cfg.keyId : '';
    return (cfg && cfg.provider) + '|' + (cfg && cfg.model) + k;
  }

  /* ---------- kullanici duzeltmesi ----------
     Gunluk hak hesaba bagli olabilir (OpenRouter'da kredi yuklediysen 50 yerine
     1000). Kullanici gercek sinirini ayarlardan yazar; katalog degismez. */

  const OVERRIDE_STORE = 'rota.llm.limits';

  function readOverrides(){
    try{ return JSON.parse(localStorage.getItem(OVERRIDE_STORE) || '{}'); }
    catch(e){ return {}; }
  }
  let overrides = readOverrides();

  function setOverride(providerId, patch){
    const next = Object.assign({}, overrides[providerId] || {});
    Object.keys(patch || {}).forEach(k => {
      const v = Number(patch[k]);
      if(Number.isFinite(v) && v > 0) next[k] = v; else delete next[k];
    });
    if(Object.keys(next).length) overrides[providerId] = next;
    else delete overrides[providerId];
    try{ localStorage.setItem(OVERRIDE_STORE, JSON.stringify(overrides)); }catch(e){}
    return next;
  }
  function getOverride(providerId){ return overrides[providerId] || {}; }
  function clearOverrides(){
    overrides = {};
    try{ localStorage.removeItem(OVERRIDE_STORE); }catch(e){}
  }

  /* Modelin kendi siniri yoksa saglayicinin varsayilanina duser;
     kullanici duzeltmesi ikisinin de ustundedir. */
  function limitsFor(cfg){
    const p = R.PROVIDERS[cfg && cfg.provider];
    if(!p) return null;
    const m = (p.models || []).find(x => x.id === cfg.model);
    const l = Object.assign({}, p.limits || {}, (m && m.limits) || {}, getOverride(p.id));
    if(l.rpm == null && l.rpd == null) return null;   // sinirsiz sayilir (yerlesik, ozel uc)
    return l;
  }

  /* Etkin sinirlar.

     Pay YALNIZ dakikalik sinira uygulanir: orada saatin kaymasi ve
     saglayicinin kendi yuvarlamasi bizi sinirin ustune tasiyabilir.

     Gunluk sayacta pay YOKTUR ve olmamalidir: bu bir zamanlama sorunu degil
     duz bir sayimdir; pay dusmek kullanicinin ucretsiz hakkinin bir kismini
     harcamadan curutur. Sayimimiz saglayicininkinden ancak DUSUK olabilir
     (baska bir sekme ayni anahtari kullaniyorsa); o durumda gercek 429 gelir
     ve penalize() devreye girer. */
  function effective(cfg){
    const l = limitsFor(cfg);
    if(!l) return null;
    const rpm = l.rpm ? Math.max(1, Math.floor(l.rpm * SAFETY)) : null;
    return {
      rpm,
      rpd: l.rpd || null,
      gapMs: rpm ? Math.ceil(60000 / rpm) : 0,
    };
  }

  /* ---------- sorgu ---------- */

  /* Simdi istek yapilsa ne olurdu: hemen mi, ne kadar bekleyerek mi, yoksa
     gun dolduğu icin hic mi? UI bunu cagirarak "3 sn sonra" yazabilir. */
  function check(cfg, now){
    const eff = effective(cfg);
    if(!eff) return { ok:true, waitMs:0, limited:false };

    const t = now == null ? Date.now() : now;
    rollDay();

    const k = key(cfg);
    const usedToday = daily.used[k] || 0;
    if(eff.rpd && usedToday >= eff.rpd){
      return { ok:false, reason:'daily', waitMs:0, limited:true, usedToday, rpd:eff.rpd };
    }

    const b = bucket(k);
    prune(b, t);

    let waitMs = Math.max(0, b.nextFreeAt - t);
    if(eff.rpm && b.times.length >= eff.rpm){
      waitMs = Math.max(waitMs, 60000 - (t - b.times[0]) + 50);
    }
    return { ok:waitMs === 0, waitMs, limited:waitMs > 0, usedToday, rpd:eff.rpd, rpm:eff.rpm };
  }

  /* ---------- ayirma ---------- */

  function sleep(ms, signal){
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { cleanup(); resolve(); }, ms);
      const onAbort = () => { cleanup(); reject(Object.assign(new Error('iptal'), { code:'cancelled' })); };
      function cleanup(){
        clearTimeout(timer);
        if(signal) signal.removeEventListener('abort', onAbort);
      }
      if(signal){
        if(signal.aborted){ cleanup(); reject(Object.assign(new Error('iptal'), { code:'cancelled' })); return; }
        signal.addEventListener('abort', onAbort);
      }
    });
  }

  /* Bir istek icin sira bekler ve yerini ayirir.
     opts.onWait(ms) beklemeden once cagirilir; ekran "3 sn" yazabilir.
     Gun dolduysa beklemez, 'daily_quota' hatasi atar. */
  async function acquire(cfg, opts){
    const o = opts || {};
    const eff = effective(cfg);
    if(!eff){ return { waited:0 }; }

    const state = check(cfg);
    if(!state.ok && state.reason === 'daily'){
      throw Object.assign(new Error('gunluk kota doldu'), {
        code:'daily_quota', usedToday:state.usedToday, rpd:state.rpd,
      });
    }
    if(state.waitMs > MAX_WAIT_MS){
      throw Object.assign(new Error('sira cok uzun'), {
        code:'rate_wait', waitMs:state.waitMs,
      });
    }

    if(state.waitMs > 0){
      if(o.onWait) o.onWait(state.waitMs);
      await sleep(state.waitMs, o.signal);
    }

    /* Yeri simdi ayir: ayni anda baslayan iki cagri ayni yuvayi kapmasin. */
    const now = Date.now();
    const k = key(cfg);
    const b = bucket(k);
    prune(b, now);
    b.times.push(now);
    b.nextFreeAt = now + eff.gapMs;
    daily.used[k] = (daily.used[k] || 0) + 1;
    persist();

    return { waited:state.waitMs, usedToday:daily.used[k], rpd:eff.rpd };
  }

  /* Saglayici yine de 429 dondurduyse: sayilan sinir gercekte daha dusuk.
     Pencereyi doldur ve bir sonraki denemeyi bir sonraki dakikaya at. */
  function penalize(cfg, seconds){
    const eff = effective(cfg);
    if(!eff) return;
    const b = bucket(key(cfg));
    const now = Date.now();
    b.nextFreeAt = Math.max(b.nextFreeAt, now + (seconds ? seconds*1000 : 60000));
  }

  /* Basarisiz istek gunluk kotadan dusulmez mi? OpenRouter'da DUSULUR:
     429 alan istek de gunu tuketir. Bu yuzden acquire'da sayilir ve
     burada geri alinmaz. Yalniz istek hic gonderilmediyse geri alinir. */
  function release(cfg){
    const k = key(cfg);
    if(daily.used[k]) { daily.used[k]--; persist(); }
    const b = bucket(k);
    if(b.times.length) b.times.pop();
  }

  /* ---------- ekran icin ozet ---------- */

  function status(cfg){
    const eff = effective(cfg);
    const k = key(cfg);
    rollDay();
    const usedToday = daily.used[k] || 0;
    if(!eff) return { known:false, usedToday };
    const b = bucket(k);
    prune(b, Date.now());
    return {
      known:true,
      rpm:eff.rpm, rpd:eff.rpd, gapMs:eff.gapMs,
      lastMinute:b.times.length,
      usedToday,
      remainingToday:eff.rpd ? Math.max(0, eff.rpd - usedToday) : null,
      full:!!(eff.rpd && usedToday >= eff.rpd),
    };
  }

  /* Bir dizi cagri (ornegin toplanti) kac saniye surer? */
  function estimateMs(cfg, calls){
    const eff = effective(cfg);
    if(!eff || !eff.gapMs) return 0;
    return Math.max(0, (calls - 1)) * eff.gapMs;
  }

  function reset(){
    minute.clear();
    daily = { day:todayKey(), used:{} };
    persist();
    overrides = readOverrides();
  }

  return { acquire, release, penalize, check, status, estimateMs, effective, limitsFor, reset,
    setOverride, getOverride, clearOverrides,
    SAFETY, MAX_WAIT_MS, STORE, OVERRIDE_STORE };
})();

/* ==== js/core/llm.js ==== */
/* Model tasima katmani — ofis ajanlarini ucretsiz LLM uclarina baglar.

   Ilke: bu modul YALNIZCA tasir. Ne istem kurar, ne veri secer, ne karar verir.
   Istemler core/office.js'te, kural motoru calc/analytics'te durur.

   Uc bicim desteklenir:
     builtin  window.claude.use('sample')      — Artifact icinde, anahtarsiz
     openai   POST /chat/completions (SSE)     — OpenRouter, Groq, ozel uc
     gemini   POST /models/x:streamGenerateContent — Google AI Studio

   Anahtarlar 'rota.llm.keys' altinda, uygulama verisinden AYRI durur:
   yedege girmez (Store.exportAll baska bir anahtari okur), buluta gitmez. */

window.R = window.R || {};

R.LLM = (function(){

  const KEY_STORE = 'rota.llm.keys';
  const TIMEOUT_MS = 90000;

  /* Turkce ayni cumleyi Ingilizceden belirgin daha cok token'la yazar:
     ekler ve genis alfabe yuzunden bes cumlelik bir ajan yaniti rahatlikla
     300 token eder. Eski 700'luk tavan uzun yanitlari cumle ortasinda
     kesiyordu ve kesildigi hicbir yerde fark edilmiyordu. */
  const DEFAULT_MAX_TOKENS = 1200;

  /* Yanit yine de kesilirse kac ek istekle tamamlanmaya calisilir.
     Her devam bir kota hakki harcar; ucretsiz katmanda ikiden fazlasi
     pahaliya gelir. */
  const MAX_CONTINUATIONS = 2;

  /* Saglayicilar "token siniri doldu"yu farkli adlandirir. */
  const TRUNCATED_FINISH = ['length', 'max_tokens', 'MAX_TOKENS'];
  function truncated(finish){
    return TRUNCATED_FINISH.indexOf(String(finish || '')) >= 0;
  }

  /* Devam istekleri de yetmediyse yarim kalan son cumle atilir: kesik bir
     cumle gostermek, bir cumle eksik gostermekten kotudur. Sayi icindeki
     nokta (1.500) cumle sonu sayilmaz — noktalamayi bosluk ya da metin
     sonu izlemelidir. */
  function trimToSentence(text){
    const s = String(text || '').trim();
    const m = s.match(/^[\s\S]*[.!?…](?=\s|$)/);
    if(!m) return s;                        // hic tam cumle yok: dokunma
    const head = m[0].trim();
    /* Yalniz SARKAN bir parca kirpilir. Kesilen cumle metnin govdesiyse
       (geriye yarisindan azi kaliyorsa) atmak yerine eksik hâliyle
       gosterilir: yarim cumle kotudur, bos ekran daha kotudur. */
    return head.length >= s.length * 0.4 ? head : s;
  }

  /* Kesilen metnin son kelimesi yarim kalmis olabilir ("kaybı" degil
     "kayb"). Devam istemeden once o kelime atilir ve modelden kaldigi
     noktadan sonrasi istenir: boylece birlestirme ne kelime boler ne de
     kelime kaybeder — atilan kelimeyi model yeniden yazar. */
  function dropLastWord(s){
    const t = String(s || '').trimEnd();
    const i = t.search(/\s\S*$/);
    return i <= 0 ? t : t.slice(0, i);
  }

  /* Kesilen yaniti tamamlatma istemi. Tekrar, kesik cumleden daha kotu
     bir bozulmadir; acikca yasaklanir. */
  function continueAsk(tail){
    return 'Yanıtın uzunluk sınırı yüzünden yarıda kesildi. Yukarıdaki metnin '
      + 'DEVAMINI yaz: baştan başlama, yazdıklarını tekrar etme, selamlama ekleme. '
      + 'Yalnızca eksik kalan kısmı yaz ve cümleyi tamamla.\n\n'
      + 'KESİLDİĞİ YER: …' + tail;
  }

  /* Devam parcasini birlestirir. Model uyariya ragmen sondan bir parcayi
     tekrarlamis olabilir: ortusen en uzun ek bir kez yazilir. */
  function joinContinuation(prev, piece){
    if(!piece) return prev;
    if(!prev) return piece;
    const max = Math.min(prev.length, piece.length, 240);
    for(let n = max; n >= 12; n--){
      if(prev.slice(-n).toLowerCase() === piece.slice(0, n).toLowerCase()){
        return prev + piece.slice(n);
      }
    }
    return prev + (/\s$/.test(prev) ? '' : ' ') + piece;
  }

  /* ---------- anahtar deposu ---------- */

  function readKeys(){
    try{ return JSON.parse(localStorage.getItem(KEY_STORE) || '{}'); }
    catch(e){ return {}; }
  }

  /* Bir saglayiciya BIRDEN COK anahtar verilebilir. Kota anahtar basina
     sayildigi icin ikinci anahtar gunluk hakki ikiye katlar — ucretsiz
     katmanda en ucuz buyume yolu budur.
     Eski bicim (tek dize) okunmaya devam eder. */
  function getKeys(providerId){
    const v = readKeys()[providerId];
    const list = Array.isArray(v) ? v : (typeof v === 'string' ? [v] : []);
    return list.map(k => String(k || '').trim()).filter(Boolean);
  }
  function getKey(providerId){ return getKeys(providerId)[0] || ''; }

  /* value: dize (tek anahtar) ya da dizi. Bos deger anahtarlari siler. */
  function setKey(providerId, value){
    const all = readKeys();
    const list = (Array.isArray(value) ? value : [value])
      .map(k => String(k || '').trim()).filter(Boolean);
    /* Ayni anahtar iki kez sayilmasin: kota anahtar kimligine bagli. */
    const uniq = list.filter((k, i) => list.indexOf(k) === i);
    if(uniq.length) all[providerId] = uniq; else delete all[providerId];
    try{ localStorage.setItem(KEY_STORE, JSON.stringify(all)); return true; }
    catch(e){ return false; }
  }

  function addKey(providerId, value){
    const v = String(value || '').trim();
    if(!v) return getKeys(providerId);
    const list = getKeys(providerId);
    if(list.indexOf(v) < 0) list.push(v);
    setKey(providerId, list);
    return list;
  }
  function removeKeyAt(providerId, index){
    const list = getKeys(providerId);
    list.splice(index, 1);
    setKey(providerId, list);
    return list;
  }
  function clearKeys(){
    try{ localStorage.removeItem(KEY_STORE); }catch(e){}
  }

  function mask(k){
    if(!k) return '';
    return k.length <= 10 ? '••••' : k.slice(0, 6) + '…' + k.slice(-4);
  }
  /* Ayar ekraninda gosterilecek maskeli hâl — tam anahtar hicbir yerde cizilmez. */
  function maskKey(providerId){ return mask(getKey(providerId)); }
  function maskKeys(providerId){ return getKeys(providerId).map(mask); }

  /* Kotasi musait olan anahtari secer; hepsi doluysa en az bekleyeni.
     Donen index kota sayacinin anahtarina girer. */
  function pickKey(cfg){
    const keys = getKeys(cfg.provider);
    if(!keys.length) return null;
    let best = null;
    for(let i = 0; i < keys.length; i++){
      const state = R.Quota.check(Object.assign({}, cfg, { keyId:i }));
      if(state.ok) return { key:keys[i], index:i, waitMs:0 };
      if(state.reason === 'daily') continue;              // bu anahtarin gunu bitti
      if(!best || state.waitMs < best.waitMs) best = { key:keys[i], index:i, waitMs:state.waitMs };
    }
    return best;   // hepsinin gunu bittiyse null → daily_quota
  }

  /* ---------- yerlesik yetenek ---------- */

  let sample = null;
  let builtinState = 'unknown';   // 'unknown' | 'ready' | 'unavailable'

  async function initBuiltin(){
    if(builtinState !== 'unknown') return builtinState === 'ready';
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const api = await window.claude.use('sample');
        if(api){ sample = api; builtinState = 'ready'; return true; }
      }
    }catch(e){ /* sessizce dus */ }
    builtinState = 'unavailable';
    return false;
  }
  function builtinReady(){ return builtinState === 'ready'; }

  /* ---------- hata ---------- */

  function fail(code, message){
    return Object.assign(new Error(message || code), { code });
  }

  /* Yayimlanmis bir Artifact icinde disariya fetch CSP ile engellenir ve
     tarayici bunu ayirt edilemeyen bir TypeError olarak verir. Ayni hata
     cevrimdisiyken de olusur; window.claude varsa neden neredeyse kesin
     kum havuzudur ve kullaniciya bu soylenir. */
  function inSandbox(){
    return !!(window.claude && typeof window.claude.use === 'function');
  }
  function networkCode(){ return inSandbox() ? 'sandboxed' : 'network'; }

  function retryAfterSeconds(response){
    const raw = response.headers && response.headers.get('retry-after');
    const n = Number(raw);
    return Number.isFinite(n) && n > 0 ? Math.min(n, 300) : null;
  }

  function codeForStatus(status){
    if(status === 401 || status === 403) return 'unauthorized';
    if(status === 402) return 'no_credit';
    if(status === 404) return 'bad_model';
    if(status === 408) return 'timeout';
    if(status === 429) return 'rate_limited';
    if(status >= 500) return 'server';
    return 'bad_request';
  }

  /* Tarayici cevrimdisi oldugunu biliyorsa istek hic gonderilmez: kota
     harcanmaz, kullaniciya dogru sebep soylenir, baglanti gelince devam edilir. */
  function offline(){
    return typeof navigator !== 'undefined' && navigator.onLine === false;
  }

  const ERRORS = {
    no_provider:'Model sağlayıcı seçilmedi. Ofis → Ayarlar bölümünden bir sağlayıcı seç.',
    no_key:'Bu sağlayıcı için API anahtarı girilmedi.',
    no_model:'Model seçilmedi.',
    no_endpoint:'Özel uç için adres girilmedi.',
    unauthorized:'API anahtarı kabul edilmedi. Anahtarı kontrol et ya da yenisini üret.',
    no_credit:'Bu hesapta kredi kalmamış. Ücretsiz bir model seç ya da başka sağlayıcı ekle.',
    bad_model:'Model bulunamadı. Model kimliği değişmiş olabilir; listeden başka bir model seç.',
    rate_limited:'İstek sınırına takıldın. Birkaç dakika bekle ya da başka sağlayıcı dene.',
    server:'Sağlayıcı şu an yanıt vermiyor. Biraz sonra tekrar dene.',
    bad_request:'İstek reddedildi. Model kimliği ya da uç adresi hatalı olabilir.',
    network:'Bağlantı kurulamadı. İnternetini ve uç adresini kontrol et.',
    timeout:'Yanıt zaman aşımına uğradı. Daha hızlı bir model dene.',
    cancelled:'İptal edildi.',
    empty:'Model boş yanıt döndürdü. Tekrar dene.',
    unavailable:'Yerleşik model bu ortamda kapalı. Ofis → Ayarlar’dan ücretsiz bir sağlayıcı bağla.',
    offline:'Bağlantı yok. Çevrimiçi olunca kaldığın yerden devam edersin; kural motoru bu sırada çalışmayı sürdürüyor.',
    daily_quota:'Bu modelin günlük ücretsiz hakkı doldu. Yarın sıfırlanır; o zamana kadar başka bir sağlayıcı kullanabilirsin.',
    rate_wait:'Dakikalık sıra çok uzun. Birkaç dakika sonra tekrar dene ya da dakikalık sınırı daha yüksek bir sağlayıcı seç.',
    sandboxed:'Bu ortam dış servislere bağlanmaya izin vermiyor. Uygulama Claude içinde yayımlanmış bir sayfa olarak '
      + 'çalışırken dış API çağrıları engellenir: burada yerleşik modeli kullan, ücretsiz sağlayıcılar için uygulamayı '
      + 'kendi tarayıcında (dosyadan ya da kendi sunucundan) aç.',
  };
  function errorText(code){ return ERRORS[code] || 'Model şu an yanıt veremedi.'; }

  /* Yeniden denenebilir hatalar: yedek modele gecmek anlamli olanlar. */
  const RETRYABLE = ['rate_limited', 'server', 'bad_model', 'timeout', 'empty'];
  /* Baglanti gelince kaldigi yerden devam edilebilecek hatalar. */
  const RESUMABLE = ['offline', 'network', 'server', 'timeout'];
  function retryable(code){ return RETRYABLE.indexOf(code) >= 0; }
  function resumable(code){ return RESUMABLE.indexOf(code) >= 0; }

  /* Baglanti geri gelince haber verir; toplanti kaldigi yerden devam eder. */
  function onceOnline(fn){
    if(!offline()){ fn(); return function(){}; }
    const h = function(){ window.removeEventListener('online', h); fn(); };
    window.addEventListener('online', h);
    return function(){ window.removeEventListener('online', h); };
  }

  /* ---------- ortak yardimcilar ---------- */

  /* Cagiranin signal'i ile zaman asimini tek denetleyicide birlestirir. */
  function withTimeout(signal, ms){
    const ctrl = new AbortController();
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, ms || TIMEOUT_MS);
    const onAbort = () => ctrl.abort();
    if(signal){
      if(signal.aborted) ctrl.abort();
      else signal.addEventListener('abort', onAbort);
    }
    return {
      signal:ctrl.signal,
      timedOut(){ return timedOut; },
      done(){
        clearTimeout(timer);
        if(signal) signal.removeEventListener('abort', onAbort);
      },
    };
  }

  /* SSE govdesini satir satir okur; her 'data:' satirini fn'e verir.

     Iki kapanis tuzagi vardir ve ikisi de yanitin SONUNU goturur:
     akis son 'data:' satirini yeni satirla kapatmadan bitebilir, ve cok
     baytli bir karakter (Turkce ç/ğ/ş/ü hepsi iki bayt) son parcaya
     bolunmus olabilir. Bu yuzden bitiste hem cozucu hem tampon bosaltilir. */
  async function readSSE(response, fn){
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let closed = false;

    /* true donerse akis kapanmistir ([DONE]) ve okuma biter. */
    function handle(line){
      const s = line.trim();
      if(!s || s.indexOf(':') === 0) return false;          // yorum / keep-alive
      if(s.indexOf('data:') !== 0) return false;
      const payload = s.slice(5).trim();
      if(payload === '[DONE]'){ closed = true; return true; }
      try{ fn(JSON.parse(payload)); }
      catch(e){ /* parcali kare — bir sonraki satirda tamamlanir */ }
      return false;
    }

    try{
      for(;;){
        const { done, value } = await reader.read();
        if(done){
          buffer += decoder.decode();                       // yarim kalan cok baytli karakter
          break;
        }
        buffer += decoder.decode(value, { stream:true });
        let nl;
        while((nl = buffer.indexOf('\n')) >= 0){
          const line = buffer.slice(0, nl);
          buffer = buffer.slice(nl + 1);
          if(handle(line)) return;
        }
      }
      /* Kapanis satiri yeni satirla bitmediyse elde kalan HÂLÂ veridir. */
      if(!closed && buffer) handle(buffer);
    }finally{
      try{ reader.cancel(); }catch(e){}
    }
  }

  /* Hata govdesinden okunabilir mesaj cikarir (saglayicilar farkli sarar). */
  async function errorMessage(response){
    let body = '';
    try{ body = await response.text(); }catch(e){ return ''; }
    try{
