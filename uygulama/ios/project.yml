# XcodeGen tanimi: Xcode projesi depoda durmaz, CI'da bundan uretilir
# (`xcodegen generate`). Uretilmis bir proje dosyasi bir gun kaynagiyla
# ayrisir; bu dosya tektir.
name: LifeOS
options:
  bundleIdPrefix: com.omerfasa
  # Uygulamanin dili Turkce: yoksa iPhone uygulama icindeki sistem dugmelerini
  # (kamera, dosya secici, paylas) Turkce telefonda da Ingilizce gosterir.
  developmentLanguage: tr
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  LifeOS:
    type: application
    platform: iOS
    sources:
      - path: LifeOS
        excludes:
          - "Web"
          - "Web/**"
      - path: LifeOS/Web
        type: folder
        buildPhase: resources
    info:
      path: LifeOS/Info.plist
      properties:
        CFBundleDisplayName: LifeOS
        CFBundleDevelopmentRegion: tr
        CFBundleLocalizations:
          - tr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarStyle: UIStatusBarStyleDefault
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoadsInWebContent: true
          NSExceptionDomains:
            "127.0.0.1":
              NSExceptionAllowsInsecureHTTPLoads: true
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        NSCameraUsageDescription: "SPİ'de hareketin, öğünün ya da ilerlemenin fotoğrafını çekmek için. Fotoğraf yalnız bu telefonda kalır."
        NSPhotoLibraryUsageDescription: "Galeriden fotoğraf seçip kayda eklemek için. Fotoğraf yalnız bu telefonda kalır."
        NSMicrophoneUsageDescription: "Kamera açılırken sistem mikrofonu da sorabilir; LifeOS ses kaydetmez."
        NSLocationWhenInUseUsageDescription: "SPİ'de koşu, yürüyüş ve bisiklet rotasını kaydetmek için — ekran kapalıyken de. Konum yalnız senin cihazlarında kalır."
        NSLocationAlwaysAndWhenInUseUsageDescription: "Kayıt sürerken ekran kapalıyken de rotayı çizmek için. Konum yalnız senin cihazlarında kalır."
        NSLocalNetworkUsageDescription: "Hesabını bilgisayarındaki LifeOS ile eşitlemek için ev ağındaki bilgisayara bağlanır. Veri yalnız senin bilgisayarına gider."
        UIBackgroundModes:
          - location
        # Ana ekran kisayollari (simgeye basili tut, 2026-10-09): modulu
        # dogrudan acar; alt satir kabuk.js MODULLER.not ile ayni. Yetki
        # gerektirmez; AltStore izin karsilastirmasina girmez.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: com.omerfasa.lifeos.ays
            UIApplicationShortcutItemTitle: AYS
            UIApplicationShortcutItemSubtitle: Sınav hazırlığı
            UIApplicationShortcutItemIconSymbolName: graduationcap
          - UIApplicationShortcutItemType: com.omerfasa.lifeos.spi
            UIApplicationShortcutItemTitle: SPİ
            UIApplicationShortcutItemSubtitle: Uyku, beslenme, hareket
            UIApplicationShortcutItemIconSymbolName: heart
          - UIApplicationShortcutItemType: com.omerfasa.lifeos.esp
            UIApplicationShortcutItemTitle: ESP
            UIApplicationShortcutItemSubtitle: Dil, felsefe, müzik
            UIApplicationShortcutItemIconSymbolName: book
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omerfasa.lifeos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
  LifeOSTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LifeOSTests
    dependencies:
      - target: LifeOS
    settings:
      base:
        CODE_SIGNING_ALLOWED: "NO"
        GENERATE_INFOPLIST_FILE: "YES"
schemes:
  LifeOS:
    build:
      targets:
        LifeOS: all
        LifeOSTests: [test]
    test:
      targets:
        - LifeOSTests
