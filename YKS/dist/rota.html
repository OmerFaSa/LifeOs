      if(to && to < from){ UI.toast('Bitiş, başlangıçtan önce olamaz'); return; }
      await M.saveCalendar({ kind, from, to:to || from, note });
      UI.toast('İstisna eklendi — plan yükü güncellendi');
      R.App.render();
    },
    async 'cal-del'(el){
      await M.deleteCalendar(el.dataset.id);
      UI.toast('İstisna kaldırıldı');
      R.App.render();
    },
    async 'set-tone'(el){
      S.profile.coachTone = el.dataset.value;
      await M.saveProfile();
      UI.toast('Koç üslubu: ' + R.COACH_TONES[el.dataset.value].name);
      R.App.render();
    },
    async 'set-palette'(el){
      S.profile.palette = el.dataset.palette;
      await M.saveProfile();
      R.App.applyTheme();
      R.App.render();
    },
    async 'set-theme'(el){
      S.profile.theme = el.dataset.value;
      await M.saveProfile();
      R.App.applyTheme();
      R.App.render();
    },
    async 'save-profile'(){
      const p = S.profile;
      const v = id => document.getElementById(id).value;
      p.name = v('st-name');
      p.city = v('st-city');
      p.capacityHoursPerWeek = Number(v('st-cap')) || p.capacityHoursPerWeek;
      p.sleepTarget = Number(v('st-sleep')) || p.sleepTarget;
      p.diplomaGrade = U.clamp(Number(v('st-diploma')) || 0, 0, 100);
      p.targetRank = Number(v('st-rank')) || p.targetRank;
      await M.saveProfile();
      UI.toast('Profil kaydedildi');
      R.App.render();
    },
    async 'export-data'(){
      const payload = R.Store.exportAll();
      const json = JSON.stringify(payload, null, 2);
      const filename = 'rota-yedek-'+U.todayISO()+'.json';
      let saved = false;
      try{
        if(window.claude && window.claude.use){
          const dl = await window.claude.use('downloads');
          if(dl){ await dl.save({ filename, data:json }); saved = true; }
        }
      }catch(e){ /* iptal edilmis olabilir */ }
      if(!saved){
        try{
          const blob = new Blob([json], { type:'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url; a.download = filename;
          document.body.appendChild(a); a.click(); a.remove();
          URL.revokeObjectURL(url);
          saved = true;
        }catch(e){
          UI.toast('Yedek indirilemedi: '+(e.message || 'bilinmeyen hata'));
          return;
        }
      }
      await M.markBackup();
      UI.toast('Yedek alındı — '+Object.keys(payload.data).length+' kayıt');
      R.App.render();
    },
    async 'import-data'(){
      UI.sheet({
        title:'Yedekten yükle',
        body:String(html`
          ${K.Notice({ tone:'warn', body:'Mevcut veriler bu yedekle değiştirilir. Önce güncel bir yedek almanı öneririm.' })}
          ${K.Field({ label:'JSON dosyası', input:raw('<input class="input" type="file" id="imp-file" accept="application/json"/>') })}`),
        footer:String(html`
          ${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Yükle', tone:'primary', act:'import-run' })}`),
      });
    },
    async 'import-run'(){
      const input = document.getElementById('imp-file');
      const file = input && input.files[0];
      if(!file){ UI.toast('Önce bir yedek dosyası seç'); return; }
      let obj;
      try{
        obj = JSON.parse(await file.text());
      }catch(e){
        UI.toast('Dosya geçerli bir JSON değil');
        return;
      }
      const check = R.Store.readBackup(obj);
      if(!check.ok){ UI.toast(check.error); return; }
      try{
        const meta = await R.Store.importAll(obj);
        UI.closeSheet();
        UI.toast('Yedek yüklendi'+(meta.legacy ? ' (eski sürüm)' : '')+' — yeniden başlatılıyor');
        setTimeout(() => location.reload(), 700);
      }catch(e){
        UI.toast('Yükleme başarısız: '+(e.message || 'bilinmeyen hata'));
      }
    },
    async 'reset-data'(){
      UI.confirmSheet('Tüm veriyi sıfırla',
        'Tüm haftalar, günler, denemeler, hatalar ve kartlar silinecek. Bu işlem geri alınamaz — önce yedek al.',
        async () => {
          await R.Store.clear();
          UI.closeSheet();
          location.reload();
        }, true);
    },
  };

  return {
    id:'guide',
    title:'Rehber',
    subtitle(){
      const tab = TABS.find(t => t.id === (S.ui.guideTab || 'analysis'));
      return tab ? tab.label + ' · protokoller ve ayarlar' : 'Protokoller, kontrol listeleri ve ayarlar';
    },
    actions(){ return ''; },
    render, handle,
  };
})();

/* ==== js/screens/profiles.js ==== */
/* Profiller — aynı cihazda birden fazla aday, gözetmen özeti ve kıyas.

   Her profilin verisi ayrı anahtarda durur; profiller birbirinin kaydını
   göremez. Gözetmen özeti yalnız özet sayıları okur, ham kaydı değil.

   Yazim bicimi: STIL.md. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.profiles = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const SNAPSHOT_KEY = 'rota.snapshots';

  /* Her profil kapanırken küçük bir özet bırakır; gözetmen bunu okur.
     Ham veri paylaşılmaz — yalnız sayılar. */
  function snapshots(){
    try{ return JSON.parse(localStorage.getItem(SNAPSHOT_KEY) || '{}'); }
    catch(e){ return {}; }
  }
  function writeSnapshot(){
    try{
      const all = snapshots();
      const tyt = C.medianTrend('TYT');
      const est = C.estimateScore();
      all[M.activeProfileId()] = {
        name:(S.profile && S.profile.name) || 'Adsız',
        program:(S.profile && S.profile.program) || '',
        week:M.currentWeek(),
        totalWeeks:R.PLAN.totalWeeks,
        completion:C.planCompletion(M.currentWeek()),
        closure:C.overallClosure().pct,
        tytMedian:tyt.last3,
        streak:C.behaviorStreak().streak,
        cardDebt:C.cardDebt(),
        analysisDebt:C.analysisDebt().length,
        rankBest:est.ok ? est.rankBest : null,
        rankWorst:est.ok ? est.rankWorst : null,
        targetRank:(S.profile && S.profile.targetRank) || null,
        at:new Date().toISOString(),
      };
      localStorage.setItem(SNAPSHOT_KEY, JSON.stringify(all));
      return true;
    }catch(e){ return false; }
  }

  /* ---------- profiller ---------- */

  function profileCard(){
    const list = M.profileList();
    const active = M.activeProfileId();
    return K.Card({
      title:'Cihazdaki profiller', sub:'Her profilin verisi ayrı tutulur',
      actions:K.Button({ label:'Profil ekle', icon:'plus', size:'sm', tone:'primary', act:'prof-new' }),
      body:html`<div class="list">${map(list, p => html`
        <div class="listitem">
          <span class="${p.id === active ? 'notedot is-done' : 'notedot'}">${raw(UI.icon(p.id === active ? 'check' : 'today'))}</span>
          <div class="grow">
            <div class="row-sm wrap"><b>${p.name}</b>
              ${when(p.id === active, () => K.Badge({ label:'açık', tone:'ok' }))}</div>
            <div class="tiny dim">${p.createdAt ? U.fmtDate(p.createdAt.slice(0, 10)) + ' tarihinde eklendi' : 'ilk profil'}</div>
          </div>
          ${when(p.id !== active, () => K.Button({ label:'Geç', size:'sm',
            act:'prof-switch', data:{ 'data-id':p.id } }))}
        </div>`)}</div>
        <p class="tiny dim mt-10">Profil değiştirmek sayfayı yeniden yükler. Veriler karışmaz;
          her profil kendi anahtarında saklanır.</p>`,
    });
  }

  function transferCard(){
    return K.Card({
      title:'Profil aktarımı', sub:'Planı ve ayarları başka cihaza ya da kişiye taşı',
      body:html`
        ${K.Notice({ tone:'info', body:'Dışa aktarım tüm çalışma verini içerir. Başka birine '
          + 'yalnız planı vermek istersen “Yalnız kurulum” seçeneğini kullan: hedef, takvim, '
          + 'kapasite ve seviye gider; deneme ve hata kayıtların gitmez.' })}
        ${K.Row([
          K.Button({ label:'Tüm veriyi dışa aktar', icon:'download', act:'export-data' }),
          K.Button({ label:'Yalnız kurulumu dışa aktar', icon:'download', act:'prof-export-setup' }),
          K.Button({ label:'Kurulum yükle', icon:'upload', act:'prof-import-setup' }),
        ], { wrap:true })}`,
    });
  }

  /* ---------- gözetmen ---------- */

  function supervisorCard(){
    const snaps = snapshots();
    const ids = Object.keys(snaps);
    const active = M.activeProfileId();

    if(!ids.length){
      return K.Card({ title:'Gözetmen özeti', sub:'Öğretmen ya da veli için salt okunur',
        body:K.Empty({ icon:'chart',
          text:'Henüz özet yok. Her profil “Özeti yenile” dediğinde buraya bir satır bırakır.',
          action:K.Button({ label:'Bu profilin özetini yaz', size:'sm', tone:'primary', act:'prof-snapshot' }) }) });
    }

    const rows = ids.map(id => {
      const x = snaps[id];
      const stale = U.diffDays(x.at.slice(0, 10), U.todayISO());
      return [
        html`<div><b class="small">${x.name}</b>
          <div class="tiny dim">${x.program || '—'}${id === active ? ' · açık profil' : ''}</div></div>`,
        html`<span class="num">H${x.week}/${x.totalWeeks}</span>`,
        html`<span class="${x.completion == null ? 'num dim' : x.completion >= 85 ? 'num' : 'num is-down'}">${
          x.completion == null ? '—' : '%' + x.completion}</span>`,
        html`<span class="num">%${x.closure}</span>`,
        html`<span class="num">${x.tytMedian == null ? '—' : U.fmtNet(x.tytMedian)}</span>`,
        html`<span class="num">${x.streak}</span>`,
        html`<span class="${stale > 7 ? 'tiny dim is-down' : 'tiny dim'}">${stale === 0 ? 'bugün' : stale + ' gün önce'}</span>`,
      ];
    });

    return K.Card({
      title:'Gözetmen özeti', sub:ids.length + ' profil · yalnız özet sayılar',
      actions:K.Button({ label:'Özeti yenile', icon:'refresh', size:'sm', act:'prof-snapshot' }),
      body:html`
        ${K.Table({ tight:true,
          headers:['Aday', { label:'Hafta', num:true }, { label:'Plan', num:true },
            { label:'Kapanış', num:true }, { label:'TYT medyan', num:true },
            { label:'Seri', num:true }, 'Güncellik'],
          rows })}
        <p class="tiny dim mt-10">Bu tablo ham kayıt içermez: not, hata metni ve kişisel alan
          paylaşılmaz. Yalnız ilerleme sayıları görünür.</p>`,
    });
  }

  /* ---------- kıyas ---------- */

  function compareCard(){
    const snaps = snapshots();
    const ids = Object.keys(snaps);
    const me = snaps[M.activeProfileId()];
    const others = ids.filter(id => id !== M.activeProfileId()).map(id => snaps[id]);

    if(!me || !others.length){
      return K.Card({ title:'Kıyas', sub:'Benzer hedefli adaylarla karşılaştırma',
        body:K.Empty({ icon:'chart', text:'Kıyas için en az iki profilin özeti gerekir.' }) });
    }

    const band = (mine, list, label, better) => {
      const vals = list.map(x => x[label]).filter(v => v != null);
      if(!vals.length || mine == null) return null;
      const avg = U.round(U.sum(vals) / vals.length, 1);
      const diff = U.round(mine - avg, 1);
      const good = better === 'high' ? diff >= 0 : diff <= 0;
      return { avg, diff, good };
    };

    const rows = [
      { key:'completion', label:'Plan tamamlama', unit:'%', better:'high' },
      { key:'closure',    label:'Konu kapanışı',  unit:'%', better:'high' },
      { key:'streak',     label:'Davranış serisi', unit:' gün', better:'high' },
      { key:'cardDebt',   label:'Tekrar borcu',   unit:'%', better:'low' },
    ].map(r => {
      const b = band(me[r.key], others, r.key, r.better);
      return { r, b };
    }).filter(x => x.b);

    return K.Card({
      title:'Kıyas', sub:'Kendi verinle diğer profillerin ortalaması',
      body:html`
        ${K.Table({ tight:true, headers:['Ölçüt', { label:'Sen', num:true },
          { label:'Ortalama', num:true }, { label:'Fark', num:true }],
          rows:rows.map(x => [
            x.r.label,
            html`<b class="num">${me[x.r.key]}${x.r.unit}</b>`,
            html`<span class="num dim">${x.b.avg}${x.r.unit}</span>`,
            html`<span class="${x.b.good ? 'num is-up' : 'num is-down'}">${
              (x.b.diff > 0 ? '+' : '') + x.b.diff}${x.r.unit}</span>`,
          ]) })}
        ${K.Notice({ tone:'info', class:'mt-12',
          body:'Kıyas motivasyon aracıdır, karar aracı değil. Kendi medyanın ve kendi konu '
             + 'kapanışın tek bağlayıcı ölçüdür; başkasının hızı seninkini geçersiz kılmaz.' })}`,
    });
  }

  /* ---------- kurulum aktarımı ---------- */

  function setupPayload(){
    const p = S.profile || {};
    return {
      __meta:{ app:'rota84285', kind:'setup', at:new Date().toISOString(), schemaVersion:R.SCHEMA_VERSION },
      setup:{
        program:p.program, targetRank:p.targetRank, diplomaGrade:p.diplomaGrade,
        startDate:p.startDate, examTytISO:p.examTytISO, examAytISO:p.examAytISO,
        capacityHoursPerWeek:p.capacityHoursPerWeek, studyDaysPerWeek:p.studyDaysPerWeek,
        sleepTarget:p.sleepTarget, level:p.level, weakSubjects:p.weakSubjects,
        theme:p.theme, palette:p.palette, coachTone:p.coachTone,
      },
      calendar:S.calendar.map(x => ({ kind:x.kind, from:x.from, to:x.to, note:x.note, load:x.load })),
    };
  }

  async function render(){
    return String(K.Grid([
      K.Span(7, K.Stack([profileCard(), transferCard()])),
      K.Span(5, K.Stack([supervisorCard(), compareCard()])),
    ]));
  }

  const handle = {
    async 'prof-new'(){
      UI.sheet({
        title:'Profil ekle', subtitle:'Yeni adayın verisi ayrı tutulur',
        body:String(K.Stack([
          K.Notice({ tone:'info', body:'Yeni profil boş başlar ve kurulum sihirbazı açılır. '
            + 'Mevcut profilin verisi etkilenmez.' }),
          K.Field({ label:'Profil adı', input:K.Input({ id:'pf-name', placeholder:'ör. Kardeşim' }) }),
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Oluştur ve geç', tone:'primary', act:'prof-create' })}`),
      });
    },
    async 'prof-create'(){
      const name = (document.getElementById('pf-name').value || '').trim() || 'Yeni profil';
      const rec = await M.saveProfileEntry({ name });
      writeSnapshot();
      UI.closeSheet();
      M.switchProfile(rec.id);
    },
    async 'prof-switch'(el){
      const id = el.dataset.id;
      UI.confirmSheet('Profil değiştir',
        'Sayfa yeniden yüklenecek ve o profilin verisi açılacak. Bu profilin verisi silinmez.',
        async () => {
          writeSnapshot();
          M.switchProfile(id);
        });
    },
    async 'prof-snapshot'(){
      const ok = writeSnapshot();
      UI.toast(ok ? 'Özet güncellendi' : 'Özet yazılamadı');
      R.App.render();
    },
    async 'prof-export-setup'(){
      const json = JSON.stringify(setupPayload(), null, 2);
      const filename = 'rota-kurulum-' + U.todayISO() + '.json';
      try{
        if(window.claude && window.claude.use){
          const dl = await window.claude.use('downloads');
          if(dl){ await dl.save({ filename, data:json }); UI.toast('Kurulum dosyası indirildi'); return; }
        }
        await navigator.clipboard.writeText(json);
        UI.toast('Kurulum panoya kopyalandı');
      }catch(e){
        UI.sheet({ title:'Kurulum', subtitle:'Kopyalayıp aktarabilirsin',
          body:String(K.Textarea({ id:'pf-out', rows:12, value:json })),
          footer:String(K.Button({ label:'Kapat', act:'sheet-close' })) });
      }
    },
    async 'prof-import-setup'(){
      UI.sheet({
        title:'Kurulum yükle', subtitle:'Yalnız hedef, takvim, kapasite ve seviye aktarılır',
        body:String(K.Stack([
          K.Notice({ tone:'warn', body:'Bu işlem mevcut kurulumunu değiştirir ve planı yeniden üretir. '
            + 'Deneme, hata ve kart kayıtların korunur.' }),
          K.Field({ label:'Kurulum JSON’u', input:K.Textarea({ id:'pf-in', rows:10,
            placeholder:'Dışa aktarılan kurulum metnini yapıştır' }) }),
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Yükle', tone:'primary', act:'prof-import-run' })}`),
      });
    },
    async 'prof-import-run'(){
      let obj;
      try{ obj = JSON.parse(document.getElementById('pf-in').value); }
      catch(e){ UI.toast('Geçerli JSON değil'); return; }
      if(!obj || !obj.setup){ UI.toast('Bu bir kurulum dosyası değil'); return; }

      Object.assign(S.profile, obj.setup, { setupDone:true });
      await M.saveProfile();

      if(Array.isArray(obj.calendar)){
        for(const c of obj.calendar) await M.saveCalendar(c);
      }
      const plan = await M.ensurePlan(true);
      await M.ensureWeek(M.currentWeek());
      await M.ensureDay(U.today());

      UI.closeSheet();
      R.App.applyTheme();
      UI.toast(plan.meta.total + ' haftalık plan yeniden üretildi');
      R.App.render();
    },
  };

  return {
    id:'profiles',
    title:'Profiller',
    subtitle(){
      const n = M.profileList().length;
      return n > 1 ? n + ' profil · gözetmen ve kıyas' : 'Çoklu kullanım, aktarım ve gözetmen özeti';
    },
    actions(){ return ''; },
    render, handle, writeSnapshot,
  };
})();

/* ==== js/screens/office.js ==== */
/* Ofis — bes ajanin masasi, gunun karari, kota panosu ve model ayarlari.

   Yazim bicimi: STIL.md / DONUSTURME.md. String birlestirme yok,
   etkilesim yalniz data-act / data-change ile baglanir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.office = (function(){
  const U = R.U, UI = R.UI, S = R.S;
  const { html, raw, when, map, cls } = R.h;
  const K = R.C;
  const O = R.Office;

  /* ---------- parcalar ---------- */

  function Avatar(agent, size){
    return html`<span class="${cls('agentav', 'agentav--' + agent.id, size === 'sm' && 'agentav--sm')}"
      aria-hidden="true">${agent.initial}</span>`;
  }

  function findingRow(f){
    return html`<div class="finding">
      <span class="${'finding__dot finding__dot--' + (f.tone || 'muted')}"></span>
      <span>${f.text}</span>
    </div>`;
  }

  function deskMetrics(b){
    return html`<div class="deskstats">${map(b.metrics, m => html`
      <div class="deskstat">
        <span class="deskstat__label">${m.label}</span>
        <b class="${cls('deskstat__value num', m.tone && m.tone !== 'muted' && 'is-' + m.tone)}">${m.value}</b>
        ${when(m.note, () => html`<span class="deskstat__note">${m.note}</span>`)}
      </div>`)}</div>`;
  }

  /* Masanin durum satiri — ofis hissini veren sey: herkesin ne yaptigi belli. */
  /* short: kat planındaki dar masa için — orada uzun metin kırpılıyordu. */
  function deskStatus(agent){
    const q = O.agentQuota(agent.id);
    if(O.mode() !== 'llm'){
      return { text:'kural motoruyla çalışıyor', short:'kural motoru', tone:'muted' };
    }
    if(q && q.full) return { text:'günlük hakkı doldu', short:'hak doldu', tone:'danger' };
    if(q && q.waitMs > 1500){
      const sn = Math.ceil(q.waitMs / 1000);
      return { text:'sırada · ' + sn + ' sn', short:'sırada · ' + sn + ' sn', tone:'warn' };
    }
    return { text:'masasında, müsait', short:'müsait', tone:'ok' };
  }

  function Desk(agent){
    const b = O.brief(agent.id);
    const open = S.ui.officeDesk === agent.id;
    const st = deskStatus(agent);
    const notes = O.notes(agent.id);
    const trust = R.Journal.trust(agent.id);
    const worst = b.findings.some(f => f.tone === 'danger') ? 'danger'
      : b.findings.some(f => f.tone === 'warn') ? 'warn' : 'ok';

    return K.Card({
      class:'desk',
      body:html`
        <div class="desk__head">
          ${Avatar(agent)}
          <div class="minw0">
            <b class="desk__name">${agent.name}</b>
            <span class="desk__role">${agent.role}</span>
          </div>
          ${K.Badge({ label:worst === 'danger' ? 'dikkat' : worst === 'warn' ? 'izliyor' : 'temiz', tone:worst })}
        </div>

        <div class="${'deskstate deskstate--' + st.tone}">
          <span class="deskstate__dot"></span>${st.text}
        </div>

        <p class="desk__line">${b.headline}</p>
        ${deskMetrics(b)}

        ${when(notes.length, () => html`<div class="notes mt-10">${map(notes, n => html`
          <div class="${'note note--' + n.tone}">
            <span class="note__dot"></span>
            <span class="minw0">${n.text}</span>
            ${when(n.route, () => K.Button({ label:'Git', size:'sm', tone:'ghost', act:'go',
              data:{ 'data-route':n.route } }))}
          </div>`)}</div>`)}

        ${when(open, () => html`
          <div class="desk__open">
            <div class="stack-xs">${map(b.findings, findingRow)}</div>
            ${when(b.suggestion, () => html`<div class="mt-10">
              ${K.Notice({ tone:'info', title:'Önerisi:', body:b.suggestion.text })}</div>`)}

            ${when(b.journal && b.journal.length, () => html`
              <div class="mt-12">${K.SectionTitle('Defteri')}</div>
              <div class="stack-xs">${map(b.journal, j => html`
                <div class="finding">
                  <span class="${'finding__dot finding__dot--' + (j.tone || 'info')}"></span>
                  <span>${j.text} <span class="tiny dim">· ${j.kind}</span></span>
                </div>`)}</div>`)}

            ${when(trust.toplam, () => html`<p class="tiny dim mt-10">
              Alanına düşen ${trust.toplam} karardan ${trust.kapanan} tanesi kapandı;
              ${trust.yuzde == null ? 'henüz oran çıkmadı' : 'uygulanma oranı %' + trust.yuzde}.</p>`)}

            <p class="tiny dim mt-8">Masasındaki veri: ${agent.reads.join(' · ')}</p>
          </div>`)}

        <div class="row wrap gap-6 mt-10">
          ${K.Button({ label:'Konuş', icon:'zap', size:'sm', tone:'primary',
            act:'office-talk', data:{ 'data-agent':agent.id } })}
          ${K.Button({ label:open ? 'Kapat' : 'Raporu aç', size:'sm', tone:'ghost',
            act:'office-desk', data:{ 'data-agent':agent.id } })}
          ${when(b.suggestion && b.suggestion.route, () => K.Button({ label:b.suggestion.label, size:'sm',
            act:'go', data:{ 'data-route':b.suggestion.route } }))}
        </div>`,
    });
  }

  /* ---------- kat planı ----------
     Ofisi "panel" olmaktan çıkaran katman. Beş masa bir zemin üzerinde
     durur: kimin ışığı yanıyor, kimin masasında iş birikmiş, kim şu an
     konuşuyor — bakınca anlaşılır. Tıklayınca o masanın raporu açılır. */

  function seat(agent){
    const st = deskStatus(agent);
    const notes = O.notes(agent.id);
    const open = S.ui.officeDesk === agent.id;
    const busy = S.ui.officeBusy === agent.id;
    const load = Math.min(notes.length, 4);

    return html`<button type="button"
      class="${cls('seat', 'seat--' + agent.id, open && 'is-open')}"
      data-act="office-desk" data-agent="${agent.id}"
      aria-expanded="${open ? 'true' : 'false'}">
      ${Avatar(agent)}
      <span class="seat__body">
        <span class="seat__name">${agent.name}</span>
        <span class="seat__role">${agent.role}</span>
        <span class="seat__state">
          <i class="${cls('seatlight', busy ? 'seatlight--busy' : 'seatlight--' + st.tone)}"></i>
          <span>${busy ? 'konuşuyor…' : (agent.lead ? st.text : st.short)}</span>
        </span>
        <span class="seat__load" aria-hidden="true">${map([0, 1, 2, 3], i =>
          html`<i class="${cls(i < load && 'is-on')}"></i>`)}</span>
        ${when(agent.lead, () => html`<span class="seat__task">Günün işi:
          <b>${O.nextAction().title}</b></span>`)}
      </span>
      ${when(notes.length, () => html`<span class="seat__count">${notes.length}</span>`)}
    </button>`;
  }

  function floorPlan(){
    const specialists = R.AGENTS.filter(a => !a.lead);
    const waiting = R.Proposals.actionable().length;

    return html`
      <div class="floor">
        <div class="floor__head">
          <div class="minw0">
            <div class="floor__title">${raw(UI.icon('users'))} Ofis kat planı</div>
            <div class="floor__meta">${O.mode() === 'llm' ? O.providerLabel() : 'kural motoru modu'}
              · masaya dokununca raporu açılır</div>
          </div>
          <div class="row wrap gap-6">
            ${when(waiting, () => K.Badge({ label:waiting + ' öneri bekliyor', tone:'warn' }))}
            ${K.Button({ label:'Masaları tara', icon:'refresh', size:'sm', act:'office-scan' })}
          </div>
        </div>
        <div class="floor__room">
          <div class="floor__lead">${seat(R.AGENT_BY_ID.patron)}</div>
          ${map(specialists, seat)}
        </div>
      </div>`;
  }

  /* ---------- onay kutusu ----------
     Ofisin sisteme dokunabildiği TEK kapı. Ne değişeceği onaydan önce
     önce/sonra olarak gösterilir; onaysız hiçbir satır uygulanmaz. */

  function diffRows(rows){
    return html`<div class="diff">${map(rows, r => html`
      <div class="diff__row">
        <span class="diff__label">${r.label}</span>
        <span class="diff__before">${r.before}</span>
        <span class="diff__arrow" aria-hidden="true">→</span>
        <span class="diff__after">${r.after}</span>
      </div>`)}</div>`;
  }

  function proposalRow(p){
    const def = R.ACTION_BY_ID[p.action];
    const agent = R.AGENT_BY_ID[p.agent];
    return html`
      <div class="${cls('prop', 'prop--' + p.agent)}">
        <div class="prop__head">
          ${Avatar(agent, 'sm')}
          <div class="prop__who">
            <b class="prop__title">${def.title}</b>
            <span class="prop__by">${agent.name} · ${def.touches}
              · ${p.source === 'llm' ? 'ajanın önerisi' : 'kural motoru buldu'}</span>
          </div>
        </div>
        <p class="prop__why">${p.reason || def.summary}</p>
        ${diffRows(p.preview.rows)}
        <div class="prop__acts">
          ${K.Button({ label:'Onayla ve uygula', icon:'check', size:'sm', tone:'primary',
            act:'office-approve', data:{ 'data-id':p.id } })}
          ${K.Button({ label:'Reddet', size:'sm', tone:'ghost',
            act:'office-reject', data:{ 'data-id':p.id } })}
          ${when(def.route, () => K.Button({ label:'Yerini gör', size:'sm', tone:'ghost',
            act:'go', data:{ 'data-route':def.route } }))}
        </div>
      </div>`;
  }

  function appliedRow(p){
    const def = R.ACTION_BY_ID[p.action];
    const agent = R.AGENT_BY_ID[p.agent];
    return html`
      <div class="prop prop--done">
        <div class="prop__head">
          ${Avatar(agent, 'sm')}
          <div class="prop__who">
            <b class="prop__title">${def.title}</b>
            <span class="prop__by">${agent.name} ·
              ${U.relativeDay(String(p.appliedAt || '').slice(0, 10))} uygulandı</span>
          </div>
          ${K.Button({ label:'Geri al', icon:'undo', size:'sm', tone:'ghost',
            act:'office-undo', data:{ 'data-id':p.id } })}
        </div>
      </div>`;
  }

  function proposalsCard(){
    const list = R.Proposals.actionable();
    const done = R.Proposals.applied().slice(-3).reverse();
    if(!list.length && !done.length) return '';

    return K.Card({
      title:'Ofisin önerileri',
      sub:'Ajanlar değişiklik önerir; uygulanıp uygulanmayacağına sen karar verirsin',
      badge:when(list.length, () => K.Badge({ label:String(list.length), tone:'warn' })),
      body:html`
        ${when(!list.length, () => K.Notice({ tone:'ok',
          title:'Bekleyen öneri yok.',
          body:'“Masaları tara” dersen ofis veriyi yeniden okur ve gerekiyorsa öneri bırakır.' }))}
        ${when(list.length, () => html`<div class="props">${map(list, proposalRow)}</div>`)}
        ${when(done.length, () => html`
          <div class="mt-12">${K.SectionTitle('Uygulananlar')}</div>
          <div class="props">${map(done, appliedRow)}</div>`)}`,
    });
  }

  /* Ofis panosu — girişte asılı tahta: hangi gün, kaç gün kaldı, ekip ne durumda. */
  function boardCard(){
    const n = M().currentWeek();
    const daysLeft = U.diffDays(U.todayISO(), R.PLAN.examTytISO);
    const meetings = O.meetings().length;
    const open = O.openDecisions().length;

    return K.Card({
      class:'board',
      body:html`
        <div class="board__row">
          <div class="board__cell">
            <span class="board__label">Bugün</span>
            <b class="board__value">${U.fmtShort(U.today())}</b>
            <span class="board__note">hafta ${n}/${R.PLAN.totalWeeks}</span>
          </div>
          <div class="board__cell">
            <span class="board__label">TYT’ye kalan</span>
            <b class="board__value num">${daysLeft}</b>
            <span class="board__note">gün (tahmin)</span>
          </div>
          <div class="board__cell">
            <span class="board__label">Toplantı</span>
            <b class="board__value num">${meetings}</b>
            <span class="board__note">${meetings ? 'tutanak arşivde' : 'henüz yapılmadı'}</span>
          </div>
          <div class="board__cell">
            <span class="board__label">Açık karar</span>
            <b class="${cls('board__value num', open && 'is-warn')}">${open}</b>
            <span class="board__note">${open ? 'takipte' : 'temiz'}</span>
          </div>
        </div>`,
    });
  }

  function M(){ return R.Model; }

  /* Gunluk brifing — sabah bir kez uretilir, gun boyu onbellekten okunur. */
  function briefingCard(){
    const b = O.briefingOf();
    const notes = O.notes();
    return K.Card({
      title:'Bugünün brifingi',
      sub:b ? new Date(b.at).toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' })
            + ' · günde bir kez üretilir'
            : 'Patron masaları henüz özetlemedi',
      badge:when(notes.length, () => K.Badge({ label:notes.length + ' not', tone:'warn' })),
      actions:K.Button({ label:b ? 'Yenile' : 'Brifing al', icon:'refresh', size:'sm',
        act:'office-briefing' }),
      body:html`
        <div id="office-briefing">
          ${b
            ? html`<p class="prose">${b.text}</p>
                ${when(b.stale, () => html`<div class="mt-10">${K.Notice({ tone:'warn',
                  title:'Bu brifing eskidi.',
                  body:'Masalardaki notlar brifing yazıldıktan sonra değişti. '
                     + 'Aşağıdaki notlar günceldir; brifingi yenileyebilirsin.' })}</div>`)}
                ${when(b.mode === 'kural', () => html`<p class="tiny dim mt-8">
                  Kural motoru metni — model bağlı değil.</p>`)}`
            : html`<p class="small muted">${O.ruleBriefingText()}</p>`}
        </div>

        ${when(notes.length, () => html`<div class="notes mt-12">${map(notes.slice(0, 4), n => html`
          <div class="${'note note--' + n.tone}">
            <span class="note__dot"></span>
            <span class="minw0"><b class="small">${n.name}:</b> ${n.text}</span>
            ${when(n.route, () => K.Button({ label:'Git', size:'sm', tone:'ghost', act:'go',
              data:{ 'data-route':n.route } }))}
          </div>`)}</div>`)}`,
    });
  }

  /* Patron karti — gunun tek isini gosterir, digerlerinden ayrilir. */
  function BossCard(){
    const b = O.brief('patron');
    const action = O.nextAction();
    const patron = R.AGENT_BY_ID.patron;

    return K.Card({
      class:'card--primary',
      body:html`
        <div class="desk__head">
          ${Avatar(patron)}
          <div class="minw0">
            <b class="desk__name">Patron’un masası</b>
            <span class="desk__role">Dört uzmanın raporunu birleştirir; günün tek işini o söyler</span>
          </div>
          ${K.Badge({ label:O.mode() === 'llm' ? 'model bağlı' : 'kural motoru',
            tone:O.mode() === 'llm' ? 'ok' : 'info' })}
        </div>

        <div class="mt-12">
          ${K.NextUp({ icon:action.icon || 'zap', label:action.label || 'Sıradaki iş',
            title:action.title, why:action.why, hint:'next-action',
            action:K.Button({ label:'Şimdi yap', tone:'primary', size:'sm', act:'go',
              data:{ 'data-route':action.route || 'today' } }) })}
        </div>

        <div class="stack-xs mt-12">${map(b.findings, findingRow)}</div>

        <div class="row wrap gap-6 mt-12">
          ${K.Button({ label:'Toplantı başlat', icon:'zap', tone:'primary', act:'office-meet' })}
          ${K.Button({ label:'Patron’a danış', size:'sm', act:'office-talk',
            data:{ 'data-agent':'patron' } })}
          ${K.Button({ label:'Toplantı odası', size:'sm', tone:'ghost', act:'go',
            data:{ 'data-route':'meeting' } })}
        </div>`,
    });
  }

  /* Takipteki kararlar — ofisi "gercek" yapan sey: verilen karar unutulmaz. */
  function decisionsCard(){
    const open = O.openDecisions();
    if(!open.length) return '';
    return K.Card({
      title:'Takipteki kararlar', sub:'Toplantıda verildi, henüz kapanmadı',
      badge:K.Badge({ label:String(open.length), tone:'warn' }),
      body:html`<div class="stack-sm">${map(open, d => html`
        <div class="decisionrow">
          <div class="minw0">
            <b class="small">${d.title}</b>
            <span class="tiny dim">${U.relativeDay(d.at.slice(0, 10))} · ${d.topic}</span>
          </div>
          <div class="row gap-6">
            ${K.Button({ label:'Yapıldı', size:'sm', tone:'primary', act:'office-decision',
              data:{ 'data-id':d.id, 'data-state':'done' } })}
            ${K.Button({ label:'Devret', size:'sm', tone:'ghost', act:'office-decision',
              data:{ 'data-id':d.id, 'data-state':'carried' } })}
          </div>
        </div>`)}</div>`,
    });
  }

  /* ---------- model ve kota panosu ---------- */

  function quotaCard(){
    const cfg = O.agentConfig('patron');
    const q = R.Quota.status(Object.assign({}, cfg, { keyId:0 }));
    const keyCount = R.LLM.getKeys(cfg.provider).length;
    const sandbox = R.LLM.inSandbox() && cfg.provider !== 'builtin';

    if(O.mode() !== 'llm'){
      return K.Card({
        title:'Ofis modeli', sub:'Ücretsiz bir model bağlayınca ajanlar konuşmaya başlar',
        actions:K.Button({ label:'Bağla', icon:'gear', size:'sm', tone:'primary', act:'office-settings' }),
        body:html`
          ${K.Notice({ tone:'info', title:'Şu an kural motoru modundasın.',
            body:'Ajanlar veriyi okuyup bulgularını yazıyor ama cümleleri sabit. '
               + 'Ücretsiz bir anahtar bağlarsan aynı bulguları kendi cümleleriyle tartışırlar.' })}
          <div class="row wrap gap-6 mt-10">
            ${map(['openrouter', 'groq', 'gemini'], id => K.Chip({ label:R.PROVIDERS[id].label,
              act:'office-settings', data:{ 'data-provider':id } }))}
          </div>`,
      });
    }

    return K.Card({
      title:'Ofis modeli', sub:O.providerLabel(),
      actions:K.Button({ label:'Ayarlar', icon:'gear', size:'sm', act:'office-settings' }),
      body:html`
        ${when(sandbox, () => K.Notice({ tone:'warn', title:'Bu ortamda dış model çalışmayabilir.',
          body:'Uygulama Claude içinde yayımlanmış bir sayfa olarak açıldığında dış API çağrıları '
             + 'engellenir. Yerleşik modeli seç ya da uygulamayı kendi tarayıcında aç.' }))}

        ${when(q.known, () => html`
          ${K.Meter({ label:'Bugün kullanılan hak', value:q.rpd ? (100 * q.usedToday / q.rpd) : 0,
            text:q.usedToday + ' / ' + q.rpd, tone:q.full ? 'danger' : (q.remainingToday < 10 ? 'warn' : ''),
            note:'dakikada en fazla ' + q.rpm + ' istek · istekler arası ' + Math.round(q.gapMs/100)/10 + ' sn' })}
          <p class="tiny dim mt-8">
            Sınır motorda uygulanıyor: istekler sıraya alınır, kota hiçbir zaman aşılmaz.
            Bir toplantı turu ${Math.round(R.Quota.estimateMs(O.agentConfig('patron'), 6)/1000)} sn sürer.
            ${when(keyCount > 1, () => html`${keyCount} anahtar bağlı — günlük hak ${keyCount} katı.`)}
          </p>`)}
        ${when(!q.known, () => html`<p class="small muted">Bu sağlayıcı için bilinen bir istek sınırı yok;
          kota yöneticisi araya girmiyor.</p>`)}`,
    });
  }

  function lastMeetingCard(){
    const m = O.lastMeeting();
    if(!m){
      return K.Card({ title:'Son toplantı', sub:'Ekip henüz toplanmadı',
        body:K.Empty({ icon:'guide', text:'Toplantıda gündemi kural motoru seçer, uzmanlar sırayla konuşur, '
          + 'sen bitirdiğinde rapor çıkar.',
          action:K.Button({ label:'İlk toplantıyı başlat', tone:'primary', act:'office-meet' }) }) });
    }
    return K.Card({
      title:'Son toplantı', sub:U.relativeDay(m.at.slice(0, 10)) + ' · ' + m.topic,
      badge:K.Badge({ label:m.mode, tone:m.mode === 'llm' ? 'ok' : 'info' }),
      body:html`
        ${when(m.report, () => html`<p class="prose">${m.report.summary}</p>`)}
        ${when(m.action, () => K.Notice({ tone:'info', title:'Karar:', body:m.action.title }))}
        <div class="row wrap gap-6 mt-10">
          ${K.Button({ label:'Tutanağı aç', size:'sm', act:'go', data:{ 'data-route':'meeting' } })}
          ${when(m.action, () => K.Button({ label:'Kararı uygula', size:'sm', tone:'primary', act:'go',
            data:{ 'data-route':m.action.route || 'today' } }))}
        </div>`,
    });
  }

  /* ---------- ayar sayfasi ---------- */

  /* Anahtar bicimi saglayiciya gore bellidir; yanlis yapistirmayi kaydetmeden
     once yakalamak icin uyarilir (engellenmez: bicim degisebilir). */
  const KEY_SHAPES = {
    openrouter:{ re:/^sk-or-/, hint:'OpenRouter anahtarları "sk-or-" ile başlar.' },
    groq:      { re:/^gsk_/,   hint:'Groq anahtarları "gsk_" ile başlar.' },
    gemini:    { re:/^AIza/,   hint:'Google AI Studio anahtarları "AIza" ile başlar.' },
  };

  /* Bir anahtarin bugunku durumu — coklu anahtarda hangisinin dolduğu görünsün. */
  function keyUsage(providerId, model, index){
    const q = R.Quota.status({ provider:providerId, model, keyId:index });
    if(!q.known) return 'sınır bilinmiyor';
    return q.usedToday + '/' + q.rpd + (q.full ? ' · doldu' : '');
  }

  /* Bildirim izni — istenmeden bildirim gonderilmez. */
  function notifyRow(){
    const state = R.App.notifyState();
    if(state === 'unsupported'){
      return html`<p class="tiny dim">Bu tarayıcı bildirim desteklemiyor.</p>`;
    }
    if(state === 'granted'){
      return K.Notice({ tone:'ok', body:'Bildirim açık. Ofis acil bir not bulduğunda '
        + 'ya da karar iki gündür açık kaldığında günde en fazla bir kez haber verir.' });
    }
    if(state === 'denied'){
      return html`<p class="tiny dim">Bildirim izni reddedilmiş. Tarayıcı ayarlarından
        bu siteye izin verirsen ofis haber verebilir.</p>`;
    }
    return html`<div class="row wrap gap-6">
      ${K.Button({ label:'Bildirime izin ver', icon:'info', size:'sm', act:'office-notify' })}
      <span class="tiny dim">Ofis acil bir not bulduğunda haber verir; günde en fazla bir kez.</span>
    </div>`;
  }

  function keyWarning(providerId, value){
    const shape = KEY_SHAPES[providerId];
    if(!shape || !value) return null;
    if(shape.re.test(value)) return null;
    return shape.hint + ' Yanlış sağlayıcının anahtarını yapıştırmış olabilirsin.';
  }

  function providerForm(providerId){
    const st = O.settings();
    const p = R.PROVIDERS[providerId];
    const models = p.models || [];
    const current = providerId === st.provider ? st.model : (models[0] ? models[0].id : '');
    const keys = R.LLM.maskKeys(providerId);
    const lim = R.Quota.limitsFor({ provider:providerId, model:current });
    const over = R.Quota.getOverride(providerId);

    return K.Stack([
      K.Notice({ tone:'info', body:p.note }),

      /* --- 1. anahtarlar (birden cok olabilir) --- */
      when(p.needsKey, () => K.Stack([
        K.SectionTitle('1. API anahtarı'),
        when(keys.length, () => html`<div class="stack-xs">${map(keys, (masked, i) => html`
          <div class="keyrow">
            <span class="keyrow__mask">${masked}</span>
            <span class="keyrow__q">${keyUsage(providerId, current, i)}</span>
            ${K.Button({ label:'Sil', size:'sm', tone:'ghost', act:'office-forget',
              data:{ 'data-provider':providerId, 'data-index':i } })}
          </div>`)}</div>`),
        K.Field({ label:keys.length ? 'Başka bir anahtar ekle' : 'Anahtarı yapıştır',
          hint:p.keyHint,
          input:K.Input({ id:'llm-key', type:'password', placeholder:p.keyHint,
            aria:'API anahtarı', change:'office-key' }) }),
        html`<div id="llm-key-warn"></div>`,
        when(keys.length, () => html`<p class="tiny dim">Kota her anahtar için ayrı sayılır:
          ikinci anahtar günlük hakkı ikiye katlar. Motor kotası müsait olanı seçer.</p>`),
        html`<p class="tiny dim">Anahtar yalnız bu tarayıcıda durur; yedeğe girmez, buluta gitmez,
          modele gönderilmez. ${when(p.keyUrl, () => html`Ücretsiz anahtar:
          <a href="${p.keyUrl}" target="_blank" rel="noopener">${p.keyUrl.replace(/^https:\/\//, '')}</a>`)}</p>`,
      ], 'sm')),

      /* --- 2. uc adresi (yalniz ozel) --- */
      when(p.editableEndpoint, () => K.Stack([
        K.SectionTitle('Uç adresi'),
        K.Field({ label:'OpenAI uyumlu /chat/completions',
          hint:p.endpoint ? 'varsayılan: ' + p.endpoint : null,
          input:K.Input({ id:'llm-endpoint',
            value:(providerId === st.provider ? st.endpoint : '') || p.endpoint || '',
            placeholder:p.endpoint || 'http://localhost:11434/v1/chat/completions' }) }),
      ], 'sm')),

      /* --- 3. model --- */
      K.Stack([
        K.SectionTitle(p.needsKey ? '2. Model' : 'Model'),
        when(models.length, () => K.Field({ label:'Listeden seç',
          input:K.Select({ id:'llm-model', value:current, change:'office-model',
            options:models.map(m => ({ value:m.id,
              label:m.label + (m.strength ? ' · ' + m.strength : '') })) }) })),
        K.Field({ label:'Ya da model kimliğini elle yaz',
          hint:'liste eskiyse doldur; boş bırakırsan yukarıdaki seçilir',
          input:K.Input({ id:'llm-model-custom', placeholder:'ör. deepseek/deepseek-chat-v3-0324:free' }) }),
      ], 'sm'),

      /* --- 4. istek siniri --- */
      when(p.needsKey, () => K.Stack([
        K.SectionTitle(p.editableEndpoint ? 'İstek sınırı' : '3. İstek sınırı'),
        html`<p class="small muted">Motor bu sınırı hiç aşmaz: istekleri sıraya alır ve aralarına
          boşluk koyar. Sınır senin hesabında farklıysa buradan düzelt.
          ${when(p.checked, () => html`<span class="tiny dim">(katalog: ${p.checked})</span>`)}</p>`,
        html`<div class="cols-2">
          ${K.Field({ label:'Dakikada istek',
            input:K.Input({ id:'llm-rpm', type:'number', min:1, numeric:true,
              value:over.rpm || (lim && lim.rpm) || '', placeholder:'—' }) })}
          ${K.Field({ label:'Günde istek',
            input:K.Input({ id:'llm-rpd', type:'number', min:1, numeric:true,
              value:over.rpd || (lim && lim.rpd) || '', placeholder:'—' }) })}
        </div>`,
        when(p.rpdChoices, () => K.Row(map(p.rpdChoices, c =>
          K.Chip({ label:c.label, act:'office-rpd', data:{ 'data-rpd':c.value } })), { wrap:true })),
      ], 'sm')),

      /* --- 5. ofis davranisi --- */
      K.Stack([
        K.SectionTitle('Ofis davranışı'),
        K.Checkbox({ label:'Model düşerse yedeğe geç (önerilir)', checked:st.fallback !== false,
          act:'office-toggle-fallback' }),
        K.Checkbox({ label:'Sabah günün brifingini kendiliğinden üret (günde 1 istek)',
          checked:st.autoBriefing !== false, act:'office-toggle-briefing' }),
        html`<div id="office-notify">${notifyRow()}</div>`,
      ], 'sm'),

      html`<div id="llm-test"></div>`,
    ]);
  }

  function openSettings(providerId){
    const st = O.settings();
    const pid = providerId || st.provider || 'builtin';
    const sandbox = R.LLM.inSandbox();

    UI.sheet({
      title:'Ofis ayarları',
      subtitle:'Ajanların kullandığı model — ücretsiz sağlayıcılar desteklenir',
      wide:true,
      body:String(K.Stack([
        when(sandbox, () => K.Notice({ tone:'warn', title:'Dikkat: bu ortam dışa kapalı olabilir.',
          body:'Uygulama Claude içinde yayımlanmış bir sayfa olarak çalışıyor. Bu ortamda dış API '
             + 'çağrıları engellenir; "Yerleşik" sağlayıcı çalışır, diğerleri çalışmayabilir. '
             + 'Ücretsiz sağlayıcıları kullanmak için uygulamayı kendi tarayıcında aç.' })),
        K.Field({ label:'Sağlayıcı', input:K.Select({ id:'llm-provider', change:'office-provider',
          value:pid,
          options:R.PROVIDER_ORDER.map(id => ({ value:id,
            label:R.PROVIDERS[id].label + (R.PROVIDERS[id].free ? ' · ücretsiz' : '') })) }) }),
        html`<div id="llm-form">${providerForm(pid)}</div>`,
        K.Collapsible({ title:'Ajan başına model', meta:'isteğe bağlı', act:'office-peragent',
          open:!!S.ui.officePerAgent,
          body:html`<div class="stack-sm">
            <p class="small muted">Boş bırakılan ajan ofis varsayılanını kullanır.
              Patron’a güçlü, uzmanlara hızlı model verebilirsin.</p>
            ${map(R.AGENTS, a => K.Field({ label:a.name + ' · ' + a.role,
              input:K.Input({ id:'llm-agent-' + a.id,
                value:(st.perAgent && st.perAgent[a.id] && st.perAgent[a.id].model) || '',
                placeholder:'ofis varsayılanı' }) }))}
          </div>` }),
      ])),
      footer:String(html`
        ${K.Button({ label:'Bağlantıyı dene', icon:'refresh', act:'office-test' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'office-save' })}`),
    });
  }

  /* Sheet icindeki alanlari tek yerden okur. */
  function readForm(){
    const provider = (document.getElementById('llm-provider') || {}).value;
    if(!provider || !R.PROVIDERS[provider]){ UI.toast('Sağlayıcı seçilmedi'); return null; }
    const p = R.PROVIDERS[provider];
    const val = id => { const el = document.getElementById(id); return el ? String(el.value).trim() : ''; };
    const custom = val('llm-model-custom');
    const picked = val('llm-model');
    const model = custom || picked || (p.models[0] ? p.models[0].id : '');
    return {
      provider, model,
      endpoint:document.getElementById('llm-endpoint') ? val('llm-endpoint') : (O.settings().endpoint || ''),
      key:val('llm-key'),
      rpm:val('llm-rpm'),
      rpd:val('llm-rpd'),
    };
  }

  /* Kaydetmeden once eksigi soyler; sessizce kabul edip sonra patlamaz. */
  function validate(cfg){
    const p = R.PROVIDERS[cfg.provider];
    if(p.needsKey && !cfg.key && !R.LLM.getKeys(cfg.provider).length){
      return 'Bu sağlayıcı için API anahtarı gerekiyor. Ücretsiz anahtarı bağlantıdan alabilirsin.';
    }
    if(p.editableEndpoint && !cfg.endpoint){
      return 'Özel uç için adres gerekiyor (OpenAI uyumlu /chat/completions).';
    }
    if(!cfg.model) return 'Model seçilmedi. Listeden seç ya da model kimliğini elle yaz.';
    return null;
  }

  function applyForm(cfg){
    /* Yeni anahtar eskisinin yerine gecmez, havuza EKLENIR. */
    if(cfg.key) R.LLM.addKey(cfg.provider, cfg.key);
    R.Quota.setOverride(cfg.provider, { rpm:cfg.rpm, rpd:cfg.rpd });
  }

  function testOutput(node){
    const out = document.getElementById('llm-test');
    if(out) out.innerHTML = String(node);
  }

  /* ---------- ekran ---------- */

  async function render(){
    O.resetBriefs();
    const specialists = R.AGENTS.filter(a => !a.lead);

    return String(K.Grid([
      K.Span(8, K.Stack([
        boardCard(),
        floorPlan(),
        proposalsCard(),
        briefingCard(),
        BossCard(),
        decisionsCard(),
        K.SectionTitle('Uzman masaları'),
        html`<div class="desks">${map(specialists, Desk)}</div>`,
      ])),
      K.Span(4, K.Stack([
        quotaCard(),
        lastMeetingCard(),
        raw(UI.rail(['next-action', 'median', 'closure'])),
      ])),
    ]));
  }

  /* ---------- eylemler ---------- */

  const handle = {
    async 'office-desk'(el){
      const id = el.dataset.agent;
      S.ui.officeDesk = S.ui.officeDesk === id ? null : id;
      R.App.render();
    },

    async 'office-talk'(el){
      S.ui.officeAgent = el.dataset.agent;
      R.App.go('team');
    },

    async 'office-meet'(){
      S.ui.meetingAuto = true;
      R.App.go('meeting');
    },

    async 'office-settings'(el){
      openSettings(el && el.dataset ? el.dataset.provider : null);
    },

    async 'office-peragent'(){
      S.ui.officePerAgent = !S.ui.officePerAgent;
      const sel = document.getElementById('llm-provider');
      openSettings(sel ? sel.value : null);
    },

    async 'office-toggle-fallback'(el){
      await O.saveSettings({ fallback:!!el.checked });
    },

    async 'office-toggle-briefing'(el){
      await O.saveSettings({ autoBriefing:!!el.checked });
    },

    async 'office-notify'(){
      await R.App.askNotify();
      const box = document.getElementById('office-notify');
      if(box) box.innerHTML = String(notifyRow());
    },

    async 'office-forget'(el){
      R.LLM.removeKeyAt(el.dataset.provider, Number(el.dataset.index) || 0);
      UI.toast('Anahtar silindi');
      const sel = document.getElementById('llm-provider');
      const form = document.getElementById('llm-form');
      if(form && sel) form.innerHTML = String(providerForm(sel.value));
    },

    async 'office-rpd'(el){
      const input = document.getElementById('llm-rpd');
      if(input) input.value = el.dataset.rpd;
    },

    async 'office-test'(el){
      const cfg = readForm();
      if(!cfg) return;
      const problem = validate(cfg);
      if(problem){ testOutput(K.Notice({ tone:'warn', body:problem })); return; }
      applyForm(cfg);

      el.disabled = true;
      testOutput(K.Notice({ tone:'info', body:'Deneniyor… (ücretsiz modellerde 5–30 sn sürebilir)' }));
      try{
        const res = await R.LLM.test({ provider:cfg.provider, model:cfg.model, endpoint:cfg.endpoint });
        const q = R.Quota.status({ provider:cfg.provider, model:cfg.model });
        testOutput(K.Notice({ tone:'ok', title:'Bağlantı çalışıyor.',
          body:res.model + ' · ' + res.ms + ' ms'
            + (q.known ? ' · bugün ' + q.usedToday + '/' + q.rpd + ' istek kullanıldı' : '')
            + ' · yanıt: “' + res.text + '”' }));
      }catch(err){
        const code = err && err.code;
        const detail = (err && err.message && err.message !== code)
          ? String(err.message).slice(0, 160) : '';
        testOutput(K.Notice({ tone:'danger', title:'Bağlanamadı.',
          body:html`${R.LLM.errorText(code)}
            ${when(detail, () => html`<span class="tiny dim"> — sağlayıcının yanıtı: ${detail}</span>`)}` }));
      }finally{
        el.disabled = false;
      }
    },

    async 'office-save'(){
      const cfg = readForm();
      if(!cfg) return;
      const problem = validate(cfg);
      if(problem){ testOutput(K.Notice({ tone:'warn', body:problem })); return; }
      applyForm(cfg);

      const perAgent = {};
      R.AGENTS.forEach(a => {
        const el = document.getElementById('llm-agent-' + a.id);
        const v = el ? el.value.trim() : '';
        if(v) perAgent[a.id] = { provider:cfg.provider, model:v, endpoint:cfg.endpoint };
      });

      await O.saveSettings({
        provider:cfg.provider, model:cfg.model, endpoint:cfg.endpoint, perAgent,
      });
      UI.closeSheet();
      UI.toast(O.mode() === 'llm' ? 'Ofis modeli bağlandı' : 'Ayarlar kaydedildi');
      R.App.render();
    },

    async 'office-briefing'(el){
      const out = document.getElementById('office-briefing');
      el.disabled = true;
      /* Kat planinda Patron'un isigi yanip sonsun: ofis calisiyor gorunmeli.
         Tum ekrani yeniden cizmek yerine tek dugum degistirilir. */
      const light = document.querySelector('.seat--patron .seatlight');
      if(light) light.className = 'seatlight seatlight--busy';
      if(out) out.innerHTML = String(html`<p class="small muted">Masaları okuyor…</p>`);
      try{
        await O.dailyBriefing({ force:true });
      }catch(err){
        UI.toast(R.LLM.errorText(err && err.code));
      }finally{
        el.disabled = false;
        R.App.render();
      }
    },

    /* Kural motoru masalari yeniden okur; model gerekmez, kota harcanmaz. */
    async 'office-scan'(el){
      el.disabled = true;
      try{
        const added = await R.Proposals.refresh();
        UI.toast(added.length
          ? added.length + ' yeni öneri masaya bırakıldı'
          : 'Ofis her şeyi yerinde buldu');
      }finally{
        el.disabled = false;
        R.App.render();
      }
    },

    /* Onay kapisi: uygulama YALNIZ buradan gecer. */
    async 'office-approve'(el){
      const res = await R.Proposals.approve(el.dataset.id);
      if(!res) return;
      UI.toast(res.ok ? 'Uygulandı — istersen geri alabilirsin' : res.why);
      R.App.render();
    },

    async 'office-reject'(el){
      await R.Proposals.reject(el.dataset.id);
      UI.toast('Öneri reddedildi');
      R.App.render();
    },

    async 'office-undo'(el){
      await R.Proposals.undo(el.dataset.id);
      UI.toast('Geri alındı');
      R.App.render();
    },

    async 'office-decision'(el){
      await O.closeDecision(el.dataset.id, el.dataset.state);
      UI.toast(el.dataset.state === 'done' ? 'Karar kapandı' : 'Karar devredildi');
      R.App.render();
    },
  };

  const change = {
    async 'office-provider'(el){
      const form = document.getElementById('llm-form');
      if(form) form.innerHTML = String(providerForm(el.value));
      testOutput('');
    },
    async 'office-key'(el){
      const sel = document.getElementById('llm-provider');
      const warn = keyWarning(sel ? sel.value : '', el.value.trim());
      const box = document.getElementById('llm-key-warn');
      if(box) box.innerHTML = warn ? String(K.Notice({ tone:'warn', body:warn })) : '';
    },
    async 'office-model'(el){
      const custom = document.getElementById('llm-model-custom');
      if(custom) custom.value = '';
      const sel = document.getElementById('llm-provider');
      const lim = R.Quota.limitsFor({ provider:sel ? sel.value : '', model:el.value });
      const rpm = document.getElementById('llm-rpm');
      const rpd = document.getElementById('llm-rpd');
      const over = R.Quota.getOverride(sel ? sel.value : '');
      if(rpm && !over.rpm) rpm.value = (lim && lim.rpm) || '';
      if(rpd && !over.rpd) rpd.value = (lim && lim.rpd) || '';
    },
  };

  return {
    id:'office',
    title:'Ofis',
    subtitle(){
      const m = O.mode();
      const open = O.openDecisions().length;
      return (m === 'llm' ? O.providerLabel() : 'kural motoru modu')
        + ' · 5 ajan' + (open ? ' · ' + open + ' açık karar' : '');
    },
    actions(){
      return String(K.Button({ label:'Ayarlar', icon:'gear', size:'sm', act:'office-settings' }));
    },
    render, handle, change, openSettings,
  };
})();

/* ==== js/screens/team.js ==== */
/* Ekip sohbeti — bes ajandan biriyle konusma ekrani.

   Her ajan yalnizca kendi brifingini gorur; alan disi soruda kendi
   arkadasina yonlendirir. Model bagli degilse yanit kural motoru
   metninden gelir — ekran her kosulda calisir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.team = (function(){
  const U = R.U, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;
  const O = R.Office;

  let busy = false;
  let controller = null;

  function current(){
    const id = S.ui.officeAgent;
    return R.AGENT_BY_ID[id] ? R.AGENT_BY_ID[id] : R.AGENT_BY_ID.patron;
  }

  function Avatar(agent){
    return html`<span class="${'agentav agentav--' + agent.id + ' agentav--sm'}"
      aria-hidden="true">${agent.initial}</span>`;
  }

  function Bubble(agent, m){
    if(m.role === 'user'){
      return html`<div class="msg msg--me">
        <div class="msg__body">${raw(U.esc(m.text).replace(/\n/g, '<br/>'))}</div>
      </div>`;
    }
    return html`
      <div class="msg msg--agent">
        <div class="msg__who">${Avatar(agent)}<b>${agent.name}</b>
          <span class="dim">${agent.role}</span>
          ${when(m.mode === 'kural', () => K.Badge({ label:'kural motoru', tone:'info' }))}
        </div>
        <div class="msg__body">${raw(U.esc(m.text).replace(/\n/g, '<br/>'))}</div>
        ${when(m.warnings && m.warnings.length, () => html`
          <div class="msg__warn">${raw(UI.icon('warn'))} ${m.warnings.join(' ')}</div>`)}
        ${when(m.error, () => html`<div class="msg__warn">${raw(UI.icon('warn'))} ${m.error}</div>`)}
      </div>`;
  }

  /* Ajanin masasindaki sayilar — sohbetin ustunde sabit durur,
     boylece yanitin neye dayandigi gorunur. */
  function deskStrip(agent){
    const b = O.brief(agent.id);
    return K.Row(map(b.metrics, m => html`
      <span class="chip"><span class="dim">${m.label}</span> <b>${m.value}</b></span>`), { wrap:true });
  }

  function picker(){
    return K.Segmented({
      act:'team-agent', value:current().id, block:true, aria:'Ajan seç',
      items:R.AGENTS.map(a => ({ value:a.id, label:a.name })),
    });
  }

  async function render(){
    O.resetBriefs();
    const agent = current();
    const msgs = O.chatOf(agent.id);
    const ruleMode = O.mode() !== 'llm';

    return String(K.Grid([
      K.Span(8, K.Stack([
        K.Card({
          body:html`
            <div class="desk__head">
              ${html`<span class="${'agentav agentav--' + agent.id}" aria-hidden="true">${agent.initial}</span>`}
              <div class="minw0">
                <b class="desk__name">${agent.name}</b>
                <span class="desk__role">${agent.role} — ${agent.desk}</span>
              </div>
              ${when(msgs.length, () => K.Button({ label:'Temizle', size:'sm', tone:'ghost', act:'team-clear' }))}
            </div>
            <p class="small muted mt-8">${agent.scope}</p>
            <div class="mt-10">${deskStrip(agent)}</div>`,
        }),

        picker(),

        when(ruleMode, () => K.Notice({ tone:'info', title:'Model bağlı değil.',
          body:'Ajan yine de verine bakıp yanıtlıyor ama cümleleri kural motorundan geliyor. '
             + 'Ücretsiz bir model bağlarsan kendi cümleleriyle konuşur.' })),

        html`<div class="chat" id="chat-log">
          ${msgs.length
            ? map(msgs, m => Bubble(agent, m))
            : html`<div class="chat__empty">${raw(UI.icon('guide'))}
                <p>${agent.name} masasındaki raporu okudu. Sor ya da brifing iste.</p></div>`}
          <div id="chat-pending"></div>
        </div>`,

        K.Row(map(agent.ask, q => K.Chip({ label:q, act:'team-suggest', data:{ 'data-q':q } })), { wrap:true }),

        html`<div class="composer">
          ${K.Textarea({ id:'team-input', rows:2, class:'composer__input',
            placeholder:agent.name + '’a sor…' })}
          ${K.Button({ label:'Sor', icon:'zap', tone:'primary', act:'team-send' })}
        </div>`,
      ])),

      K.Span(4, K.Stack([
        K.Card({
          title:'Masasındaki rapor', sub:'Kural motoru hesapladı; ajan bunu yorumlar',
          actions:K.Button({ label:'Brifing', icon:'refresh', size:'sm', act:'team-brief' }),
          body:html`
            <div class="stack-xs">${map(O.brief(agent.id).findings, f => html`
              <div class="finding">
                <span class="${'finding__dot finding__dot--' + (f.tone || 'muted')}"></span>
                <span>${f.text}</span>
              </div>`)}</div>
            <p class="tiny dim mt-10">Okuduğu veri: ${agent.reads.join(' · ')}</p>`,
        }),
        K.Card({
          title:'Ekipteki diğerleri', sub:'Alan dışı soruyu sahibine sor',
          body:html`<div class="stack-xs">${map(R.AGENTS.filter(a => a.id !== agent.id), a => html`
            <button class="agentrow" data-act="team-agent" data-value="${a.id}">
              ${Avatar(a)}
              <span class="minw0"><b class="small">${a.name}</b>
                <span class="tiny dim">${a.desk}</span></span>
            </button>`)}</div>`,
        }),
        raw(UI.rail([agent.hint, 'ai-coach'])),
      ])),
    ]));
  }

  /* ---------- konusma ---------- */

  function scrollLog(){
    const log = document.getElementById('chat-log');
    if(log) log.scrollTop = log.scrollHeight;
  }

  function pendingBox(agent, label){
    const pending = document.getElementById('chat-pending');
    if(!pending) return;
    pending.innerHTML = String(html`
      <div class="msg msg--agent">
        <div class="msg__who">${Avatar(agent)}<b>${agent.name}</b><span class="dim">${agent.role}</span></div>
        <div class="msg__body dim" id="chat-stream">${label}
          <span class="tiny">(ücretsiz modellerde ilk yanıt 10–60 sn sürebilir)</span></div>
      </div>`);
    scrollLog();
  }

  async function run(kind, question){
    if(busy) return;
    const agent = current();
    busy = true;
    controller = new AbortController();

    if(kind === 'ask'){
      await O.pushChat(agent.id, 'user', question);
      await R.App.render();
    }
    pendingBox(agent, kind === 'ask' ? 'Raporuna bakıyor…' : 'Brifingi hazırlıyor…');

    try{
      const opts = {
        signal:controller.signal,
        onText(ev){
          const el = document.getElementById('chat-stream');
          if(!el) return;
          el.classList.remove('dim');
          el.innerHTML = U.esc(ev.text).replace(/\n/g, '<br/>');
          scrollLog();
        },
      };
      const res = kind === 'ask'
        ? await O.ask(agent.id, question, opts)
        : await O.briefing(agent.id, opts);
      await O.pushChat(agent.id, 'agent', res.text, {
        warnings:res.warnings || [], mode:res.mode, error:res.error || null,
      });
    }catch(err){
      if(!(err && err.code === 'cancelled')){
        await O.pushChat(agent.id, 'agent', R.LLM.errorText(err && err.code), { mode:'kural' });
      }
    }finally{
      busy = false;
      controller = null;
      await R.App.render();
      scrollLog();
    }
  }

  const handle = {
    async 'team-agent'(el){
      const id = el.dataset.value;
      if(!R.AGENT_BY_ID[id]) return;
      if(busy && controller) controller.abort();
      S.ui.officeAgent = id;
      R.App.render();
    },
    async 'team-send'(){
      const el = document.getElementById('team-input');
      const q = el ? el.value.trim() : '';
      if(el) el.value = '';
      if(q) await run('ask', q);
    },
    async 'team-suggest'(el){ await run('ask', el.dataset.q); },
    async 'team-brief'(){ await run('brief'); },
    async 'team-clear'(){
      const agent = current();
      UI.confirmSheet('Sohbeti temizle',
        agent.name + ' ile yaptığın konuşma silinecek. Çalışma verilerin etkilenmez.', async () => {
          await O.clearChat(agent.id);
          UI.closeSheet();
          R.App.render();
        });
    },
  };

  function onKey(e){
    if(e.key !== 'Enter' || !(e.ctrlKey || e.metaKey)) return;
    const el = document.getElementById('team-input');
    if(el && document.activeElement === el){
      e.preventDefault();
      handle['team-send']();
    }
  }

  return {
    id:'team',
    title:'Ekip sohbeti',
    subtitle(){
      const agent = current();
      const n = O.chatOf(agent.id).length;
      return agent.name + ' · ' + agent.role + (n ? ' · ' + Math.ceil(n/2) + ' soru' : '');
    },
    actions(){
      return String(R.C.Button({ label:'Ofis', icon:'guide', size:'sm', act:'go',
        data:{ 'data-route':'office' } }));
    },
    render, handle, onKey, afterRender:scrollLog,
  };
})();

/* ==== js/screens/meeting.js ==== */
/* Toplanti odasi — ajanlarin birbiriyle konustugu yer.

   Akis: Patron gundemi acar → uzmanlar TUR TUR konusur (durum → fikir →
   itiraz → toparlama → serbest) → toplantiyi SEN bitirirsin → rapor cikar.

   Konusmalar ard arda degil SIRAYLA akar: her tur bir model cagrisidir ve
   kota yoneticisi aralarina bosluk koyar, boylece dakikalik sinir asilmaz.
   Gundemi ve karari kural motoru belirler; ajanlar yalnizca gerekcelendirir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.meeting = (function(){
  const U = R.U, UI = R.UI, S = R.S;
  const { html, raw, when, map, cls } = R.h;
  const K = R.C;
  const O = R.Office;

  /* Canli oturum durumu — ekranda tutulur, kaydedilmez. */
  let session = null;
  let running = false;
  let stopAsked = false;
  let turnIndex = 0;
  let controller = null;
  let closed = null;       // biten toplantinin kaydi
  let waitTimer = null;

  const PER_ROUND = R.MEETING_ORDER.length;
  function maxRounds(){ return O.maxRounds(); }
  function maxTurns(){ return maxRounds() * PER_ROUND; }

  /* ---------- parcalar ---------- */

  function Avatar(agent){
    return html`<span class="${cls('agentav', 'agentav--' + agent.id, 'agentav--sm')}"
      aria-hidden="true">${agent.initial}</span>`;
  }

  /* Metinde gecen ajan adlarini tiklanabilir yapar: "bu Tuna'nin alani"
     dendiginde o masaya gecilebilsin. Kacirma ONCE yapilir, baglanti sonra;
     boylece model ne yazarsa yazsin HTML enjeksiyonu olmaz. */
  const NAME_RE = new RegExp('\\b(' + R.AGENTS.map(a => a.name).join('|') + ')\\b', 'g');

  function body(text){
    const escaped = U.esc(String(text || '')).replace(/\n/g, '<br/>');
    return escaped.replace(NAME_RE, name => {
      const a = R.AGENTS.find(x => x.name === name);
      if(!a) return name;
      return '<button class="agentref agentref--' + a.id + '" data-act="meet-talk" '
        + 'data-agent="' + a.id + '" title="' + U.esc(a.role) + '">' + name + '</button>';
    });
  }

  function Turn(t){
    if(t.agent === 'aday'){
      return html`
        <div class="meetturn meetturn--me">
          <div class="meetturn__who"><b>Sen</b><span class="dim">söz aldın</span></div>
          <div class="meetturn__body">${raw(body(t.text))}</div>
        </div>`;
    }
    const agent = R.AGENT_BY_ID[t.agent] || R.AGENT_BY_ID.patron;
    return html`
      <div class="${cls('meetturn', t.closing && 'meetturn--closing',
        t.roundKey === 'capraz' && 'meetturn--cross')}">
        <div class="meetturn__who">
          ${Avatar(agent)}<b>${agent.name}</b><span class="dim">${agent.role}</span>
          ${when(t.roundTitle, () => html`<span class="meetturn__round">${t.roundTitle}</span>`)}
          ${when(t.vote, () => K.Badge({ label:t.vote + '. fikre oy', tone:'info' }))}
          ${when(t.closing, () => K.Badge({ label:'karar', tone:'ok' }))}
          ${when(t.mode === 'kural', () => K.Badge({ label:'kural motoru', tone:'info' }))}
        </div>
        <div class="meetturn__body">${raw(body(t.text))}</div>
        ${when(t.warnings && t.warnings.length, () => html`
          <div class="msg__warn">${raw(UI.icon('warn'))} ${t.warnings.join(' ')}</div>`)}
        ${when(t.error, () => html`<div class="msg__warn">${raw(UI.icon('warn'))} ${t.error}</div>`)}
      </div>`;
  }

  function pendingTurn(agentId, label){
    const agent = R.AGENT_BY_ID[agentId] || R.AGENT_BY_ID.patron;
    return html`
      <div class="meetturn is-live">
        <div class="meetturn__who">${Avatar(agent)}<b>${agent.name}</b>
          <span class="dim">${agent.role}</span></div>
        <div class="meetturn__body dim" id="meet-stream">${label}</div>
      </div>`;
  }

  /* ---------- gundem ---------- */

  function agendaCard(){
    if(session || closed) return '';
    const list = O.agendaCandidates().slice(0, 5);
    const picked = list[U.clamp(S.ui.meetingAgenda || 0, 0, list.length - 1)] || list[0];
    const q = O.agentQuota('patron');
    const roundMs = O.roundEstimateMs('patron');

    return K.Card({
      title:'Gündem', sub:'Kural motoru en yüksek öncelikli başlığı seçti',
      badge:K.Badge({ label:O.mode() === 'llm' ? 'model bağlı' : 'kural motoru',
        tone:O.mode() === 'llm' ? 'ok' : 'info' }),
      body:html`
        ${K.Notice({ tone:'info', title:picked.topic + '.', body:picked.why })}

        ${(function(){
          const d = O.pendingDecision();
          return when(d, () => html`<div class="mt-10">
            ${K.Notice({ tone:'warn', title:'Geçen toplantının kararı hâlâ açık:',
              body:d.title + ' — Patron toplantıyı bunun hesabını sorarak açacak.' })}
          </div>`);
        })()}

        ${when(list.length > 1, () => html`<div class="mt-10">
          ${K.Field({ label:'Başka bir gündemle topla',
            input:K.Select({ id:'meet-agenda', change:'meet-agenda',
              value:String(S.ui.meetingAgenda || 0),
              options:list.map((c, i) => ({ value:String(i), label:c.topic })) }) })}
        </div>`)}

        <div class="row wrap gap-6 mt-12">
          ${K.Button({ label:'Toplantıyı başlat', icon:'zap', tone:'primary', act:'meet-start' })}
          ${K.Button({ label:'Ofise dön', size:'sm', tone:'ghost', act:'go', data:{ 'data-route':'office' } })}
        </div>

        ${(function(){
          const list = O.conflicts();
          return when(list.length, () => html`<div class="mt-10">
            ${K.Notice({ tone:'info', title:'Kural motoru ' + list.length + ' çelişki buldu:',
              body:list.map(c => c.name + '’ya sorulacak' ).join(' · ')
                + ' — Patron tur aralarında çapraz soru soracak.' })}
          </div>`);
        })()}

        <div class="meetplan mt-12">
          <b class="small">Nasıl işleyecek?</b>
          <ol class="meetplan__list">
            ${map(R.Office.ROUNDS.slice(0, maxRounds()), (r, i) =>
              html`<li><b>${i+1}. ${r.title}</b> — dört uzman sırayla konuşur</li>`)}
          </ol>
          <p class="tiny dim">Toplantıyı <b>sen</b> bitirirsin; istediğin turda “Bitir ve rapor al”a bas.
            Araya girip söz de alabilirsin.
            ${when(roundMs > 0, () => html`Bir tur yaklaşık
              ${Math.round(roundMs/1000)} sn sürer — istekler kotayı aşmamak için sıraya alınır.`)}
            ${when(q && q.known, () => html`Bugünkü hak: ${q.usedToday}/${q.rpd} istek kullanıldı.`)}
            ${when(O.mode() !== 'llm', () => html`Model bağlı olmadığı için toplantı
              ${maxRounds()} turda durur: ajanların elinde yalnızca kural motorunun raporu var,
              sonrasında söyleyecek yeni bir şeyleri olmaz.`)}
          </p>
        </div>`,
    });
  }

  /* ---------- canli toplanti ---------- */

  function controls(){
    const round = session ? Math.min(maxRounds(), Math.floor(turnIndex / PER_ROUND) + 1) : 0;
    return html`
      <div class="meetbar">
        <div class="meetbar__state">
          ${when(running, () => html`<span class="meetbar__live"></span>`)}
          <b>${running ? 'Tur ' + round + '/' + maxRounds() : 'Toplantı duraklatıldı'}</b>
          <span class="dim">${session ? session.turns.length + ' konuşma' : ''}</span>
        </div>
        <div class="row wrap gap-6">
          ${when(voiceAvailable(), () => K.Button({
            label:S.ui.meetingVoice ? 'Sesi kapat' : 'Sesli dinle',
            icon:S.ui.meetingVoice ? 'pause' : 'play', size:'sm',
            tone:S.ui.meetingVoice ? 'primary' : 'ghost', act:'meet-voice' }))}
          ${K.Button({ label:'Söz al', icon:'edit', size:'sm', act:'meet-say' })}
          ${when(running, () => K.Button({ label:'Duraklat', size:'sm', tone:'ghost', act:'meet-pause' }))}
          ${when(!running && session,
            () => K.Button({ label:'Devam et', size:'sm', act:'meet-resume' }))}
          ${K.Button({ label:'Bitir ve rapor al', size:'sm', tone:'primary', act:'meet-finish' })}
        </div>
      </div>`;
  }

  function liveCard(){
    if(!session) return '';
    return K.Card({
      title:'Toplantı sürüyor', sub:session.topic,
      body:html`
        ${controls()}
        <div class="meet mt-12" id="meet-live">
          <div id="meet-turns">${map(session.turns, Turn)}</div>
          <div id="meet-pending"></div>
        </div>
        <div id="meet-say-box"></div>`,
    });
  }

  /* ---------- rapor ---------- */

  function reportCard(m){
    if(!m) return '';
    const r = m.report || {};
    return K.Card({
      class:'card--primary',
      title:'Toplantı raporu',
      sub:U.relativeDay(m.at.slice(0, 10)) + ' · ' + m.topic + ' · ' + m.rounds + ' tur',
      actions:K.Button({ label:'Kopyala', icon:'edit', size:'sm', act:'meet-copy',
        data:{ 'data-id':m.id } }),
      body:html`
        ${when(r.summary, () => html`<p class="prose">${r.summary}</p>`)}

        <div class="mt-12">
          ${K.NextUp({ icon:'zap', label:'Karar', title:m.action.title, why:m.action.why,
            action:K.Button({ label:'Şimdi yap', tone:'primary', size:'sm', act:'go',
              data:{ 'data-route':m.action.route || 'today' } }) })}
        </div>

        ${when(r.vote && r.vote.kazanan, () => html`
          <div class="mt-12">${K.SectionTitle('Oylama', K.Badge({
            label:r.vote.oyVeren + ' oy', tone:'info' }))}</div>
          ${K.Table({ tight:true,
            headers:['Fikir', 'Sahibi', { label:'Oy', num:true }, { label:'Ağırlık', num:true }],
            rows:r.vote.rows.map(row => [
              html`<span class="small">${row.text.slice(0, 90)}</span>`,
              row.name, row.oy, row.agirlik,
            ]) })}
          <p class="tiny dim mt-8">Ağırlık ajanın güven skorundan gelir: önerisi tutan ajanın
            oyu daha ağır basar. Sayımı kural motoru yapar.</p>`)}

        ${when((r.crossed || []).length, () => html`
          <div class="mt-12">${K.SectionTitle('Çapraz soru')}</div>
          <div class="stack-xs">${map(r.crossed, c => html`
            <div class="finding">
              <span class="finding__dot finding__dot--warn"></span>
              <span><b>${c.ajan}:</b> ${c.yanit}</span>
            </div>`)}</div>`)}

        <div class="mt-12">${K.SectionTitle('Kim ne dedi')}</div>
        <div class="stack-sm">${map(Object.keys(r.byAgent || {}), id => {
          const a = r.byAgent[id];
          const agent = R.AGENT_BY_ID[id];
          return html`<div class="reportrow">
            <div class="meetturn__who">${when(agent, () => Avatar(agent))}
              <b>${a.name}</b><span class="dim">${a.role}</span></div>
            <ul class="reportrow__list">${map(a.lines, l =>
              html`<li><span class="dim">${l.roundTitle}:</span> ${l.text}</li>`)}</ul>
          </div>`;
        })}</div>

        ${when((r.userSaid || []).length, () => html`<div class="mt-12">
          ${K.Notice({ tone:'info', title:'Senin sözlerin:', body:r.userSaid.join(' · ') })}</div>`)}

        ${when((r.warnings || []).length, () => html`<div class="mt-12">
          ${K.Notice({ tone:'warn', title:'Kural motoru düzeltmesi:', body:r.warnings.join(' ') })}</div>`)}

        <div class="mt-12">
          ${K.Table({ tight:true, headers:['Dayandığı veri', { label:'Değer', num:true }], rows:[
            ['Program haftası', r.basis.hafta],
            ['Plan tamamlama', r.basis.planTamamlama == null ? '—' : '%' + r.basis.planTamamlama],
            ['Konu kapanışı', '%' + r.basis.konuKapanisi],
            ['TYT medyan', r.basis.tytMedyan == null ? '—' : U.fmtNet(r.basis.tytMedyan)],
            ['Analiz borcu', r.basis.analizBorcu],
            ['Tekrar borcu', '%' + r.basis.tekrarBorcu],
          ] })}
        </div>

        <div class="row wrap gap-6 mt-12">
          ${K.Button({ label:'Kararı yapıldı işaretle', size:'sm', act:'meet-decide',
            data:{ 'data-id':m.id, 'data-state':'done' } })}
          ${K.Button({ label:'Raporu indir', icon:'download', size:'sm', act:'meet-download',
            data:{ 'data-id':m.id } })}
          ${K.Button({ label:'Yeni toplantı', size:'sm', tone:'ghost', act:'meet-new' })}
        </div>`,
    });
  }

  /* ---------- arsiv ---------- */

  /* Tutanak arama: gundem, karar ve butun konusma metni taranir. */
  function matches(m, q){
    if(!q) return true;
    const hay = [m.topic, m.why, m.action && m.action.title,
      m.report && m.report.summary]
      .concat((m.turns || []).map(t => t.name + ' ' + t.text))
      .join(' ').toLocaleLowerCase('tr');
    return hay.indexOf(q.toLocaleLowerCase('tr')) >= 0;
  }

  function archiveCard(){
    const all = O.meetings();
    if(!all.length) return '';
    const q = S.ui.meetingSearch || '';
    const list = all.filter(m => matches(m, q));

    return K.Card({
      title:'Geçmiş toplantılar',
      sub:q ? list.length + ' / ' + all.length + ' tutanak eşleşti'
            : all.length + ' tutanak saklanıyor',
      actions:when(all.length > 2, () => K.Input({ id:'meet-search', size:'sm',
        value:q, placeholder:'Tutanaklarda ara…', change:'meet-search', data:{ 'data-debounce':'250' } })),
      body:html`
        ${when(!list.length, () => K.Empty({ icon:'search',
          text:'“' + q + '” için tutanak bulunamadı.',
          action:K.Button({ label:'Süzgeci sıfırla', size:'sm', act:'meet-search-clear' }) }))}
        <div class="stack-xs">${map(list, m => K.Collapsible({
        title:m.topic,
        meta:U.relativeDay(m.at.slice(0, 10)) + ' · ' + (m.rounds || 1) + ' tur · '
          + (m.decision && m.decision.state === 'open' ? 'karar açık' : 'karar kapandı'),
        act:'meet-open', data:{ 'data-id':m.id },
        open:S.ui.meetingOpen === m.id,
        body:html`
          ${when(m.report && m.report.summary, () => html`<p class="prose">${m.report.summary}</p>`)}
          ${K.Notice({ tone:'info', title:'Karar:', body:m.action.title })}
          <div class="meet mt-12">${map(m.turns, Turn)}</div>
          <div class="row wrap gap-6 mt-10">
            ${K.Button({ label:'Raporu kopyala', size:'sm', act:'meet-copy', data:{ 'data-id':m.id } })}
            ${K.Button({ label:'Kararı uygula', size:'sm', tone:'primary', act:'go',
              data:{ 'data-route':m.action.route || 'today' } })}
            ${K.Button({ label:'Tutanağı sil', size:'sm', tone:'ghost', act:'meet-delete',
              data:{ 'data-id':m.id } })}
          </div>`,
      }))}</div>`,
    });
  }

  function teamCard(){
    const ids = ['patron'].concat(R.MEETING_ORDER);
    return K.Card({
      title:'Masadakiler', sub:'Patron açar, uzmanlar tur tur konuşur, sen bitirirsin',
      body:html`<div class="stack-xs">${map(ids, id => {
        const a = R.AGENT_BY_ID[id];
        const q = O.agentQuota(id);
        return html`<button class="agentrow" data-act="meet-talk" data-agent="${a.id}">
          ${Avatar(a)}
          <span class="minw0"><b class="small">${a.name}</b>
            <span class="tiny dim">${a.desk}</span></span>
          ${when(q && q.full, () => K.Badge({ label:'kota', tone:'danger' }))}
        </button>`;
      })}</div>`,
    });
  }

  /* ---------- ekran ---------- */

  async function render(){
    O.resetBriefs();
    return String(K.Grid([
      K.Span(8, K.Stack([
        agendaCard(),
        liveCard(),
        when(!session && closed, () => reportCard(closed)),
        archiveCard(),
      ])),
      K.Span(4, K.Stack([
        teamCard(),
        raw(UI.rail(['next-action', 'gate'])),
      ])),
    ]));
  }

  /* ---------- yurutme ---------- */

  function paint(){
    const box = document.getElementById('meet-turns');
    if(box && session) box.innerHTML = String(map(session.turns, Turn));
    scrollToLive();
  }

  function setPending(node){
    const box = document.getElementById('meet-pending');
    if(box) box.innerHTML = node ? String(node) : '';
  }

  function scrollToLive(){
    const el = document.getElementById('meet-pending') || document.getElementById('meet-turns');
    if(el && el.scrollIntoView) el.scrollIntoView({ block:'nearest' });
  }

  /* Kota sirasi beklenirken geri sayim gosterilir; bekleme gizlenmez. */
  function showWait(agentId, ms){
    clearInterval(waitTimer);
    let left = Math.ceil(ms/1000);
    const tick = () => {
      setPending(pendingTurn(agentId, 'Sırasını bekliyor — ' + left + ' sn '
        + '(istek sınırı aşılmasın diye)'));
      if(--left < 0) clearInterval(waitTimer);
    };
    tick();
    waitTimer = setInterval(tick, 1000);
  }

  function stopWait(){ clearInterval(waitTimer); waitTimer = null; }
