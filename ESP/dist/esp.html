      }),

      K.Entry({
        label:'BANT', hint:'pedagogic',
        meta:bant.band ? bant.band.label : 'ölçülemedi',
        note:'Bant KİŞİYE değil ÜRETİME verilir ve iki ölçüm birden gerekir: '
           + 'aktif kelime sayısı ve retansiyon.',
        body:html`
          ${K.Notice({ tone:bant.band ? 'info' : 'warn',
            body:bant.text || bant.why })}
          ${K.Table({ tight:true,
            headers:['Bant', { label:'Aktif kelime', num:true }, { label:'Retansiyon', num:true }, 'Ne yapabilir'],
            rows:ESP.CEFR.map(b => [
              b.label, U.fmtNum(b.activeWords), '%' + Math.round(b.retention * 100), b.can,
            ]) })}
          <p class="small muted mt-8">Şu an: ${d.active} aktif kelime,
            ${d.retention.cert === 'missing' ? 'retansiyon ölçülmedi'
              : '%' + Math.round(d.retention.value * 100) + ' retansiyon'}.</p>`,
      }),

      K.Entry({
        label:'SHADOWING',
        meta:'kaynak türleri',
        note:'Süre ölçülür, kalite ölçülmez: sistem sesini dinlemez. '
           + 'Kendi işaretlediğin zorluk «tahmin» etiketiyle durur.',
        body:K.Table({ tight:true, headers:['Kaynak', 'Not'],
          rows:ESP.SHADOW_SOURCES.map(s => [s.label, s.note]) }),
      }),
    ];
  }

  /* ------------------------------------------------------------------ çizim */

  function render(){
    const tab = S.ui.langTab || 'calis';
    const d = ESP.SRS.deckStatus(aktifDil());
    const rows = tab === 'kartlar' ? cardRows()
      : tab === 'ekle' ? addRows()
      : tab === 'ilerleme' ? progressRows()
      : reviewRows();

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'lang-tab', aria:'Dil sekmeleri',
          items:TABS.map(t => Object.assign({}, t,
            t.id === 'calis' ? { count:d.due || null } : {})) }),
        actions:K.Select({ value:aktifDil(), change:'deck-lang', size:'sm',
          aria:'Çalışılan dil',
          options:ESP.LANGS.map(l => ({ value:l.id, label:l.label })) }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  const handle = {
    async 'lang-tab'(el){ S.ui.langTab = el.dataset.tab; ESP.App.render(); },
    async 'tab-ekle'(){ S.ui.langTab = 'ekle'; ESP.App.render(); },

    async 'start-review'(){ S.ui.reviewQueue = queueStart(); ESP.App.render(); },
    async 'reveal-card'(){ if(S.ui.reviewQueue) S.ui.reviewQueue.shown = true; ESP.App.render(); },

    async 'grade-card'(el){
      const q = S.ui.reviewQueue;
      if(!q) return;
      const res = await ESP.SRS.answer(q.ids[q.pos], el.dataset.grade);
      if(!res.ok){ ESP.UI.toast(res.error); return; }
      if(el.dataset.grade === 'again') q.again++; else q.correct++;
      q.pos++; q.shown = false;
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'end-review'(){ S.ui.reviewQueue = null; ESP.App.render(); },

    async 'log-review'(el){
      const n = Number(el.dataset.count) || 0;
      await M.addSession(U.todayISO(), { disc:'lang', minutes:Math.max(1, Math.round(n * 0.4)),
        count:n, note:'kart çalışması' });
      S.ui.reviewQueue = null;
      ESP.Memo.bitir();
      ESP.UI.toast('Bugüne yazıldı');
      ESP.App.render();
    },

    async 'parse-vocab'(){
      const el = document.getElementById('vocab-text');
      const dil = document.getElementById('vocab-lang');
      const res = ESP.Parse.parseVocab(el ? el.value : '', dil ? dil.value : aktifDil());
      if(!res.rows.length && !res.unmatched.length){ ESP.UI.toast('Liste boş'); return; }
      S.ui.vocabParsed = res;
      ESP.App.render();
    },

    async 'save-vocab'(){
      const res = S.ui.vocabParsed;
      if(!res) return;
      for(const r of res.rows){
        await M.saveCard(M.newCard({ front:r.front, back:r.back, lang:r.lang }));
      }
      S.ui.vocabParsed = null;
      ESP.Memo.bitir();
      ESP.UI.toast(res.rows.length + ' kart eklendi');
      ESP.App.render();
    },

    async 'clear-vocab'(){ S.ui.vocabParsed = null; ESP.App.render(); },

    async 'add-card'(){
      const v = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const front = v('c-front'), back = v('c-back');
      if(!front || !back){ ESP.UI.toast('Ön yüz ve karşılık gerekir'); return; }
      await M.saveCard(M.newCard({ front, back, context:v('c-ctx'), lang:aktifDil() }));
      ESP.Memo.bitir();
      ESP.UI.toast('Kart eklendi');
      ESP.App.render();
    },

    async 'seed-cards'(){
      const tohum = ESP.SEED_CARDS[aktifDil()] || [];
      for(const t of tohum){
        await M.saveCard(M.newCard({ front:t.front, back:t.back, lang:aktifDil(),
          tags:['tohum'] }));
      }
      ESP.Memo.bitir();
      ESP.UI.toast(tohum.length + ' tohum kart eklendi');
      ESP.App.render();
    },

    async 'toggle-active'(el){
      const c = S.cards.find(x => x.id === el.dataset.id);
      if(!c) return;
      c.active = !c.active;
      await M.saveCard(c);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'del-card'(el){
      await M.deleteCard(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },
  };

  const change = {
    async 'card-query'(el){ S.ui.cardQuery = el.value; ESP.App.render(); },
    async 'deck-lang'(el){ S.ui.langDeck = el.value; S.ui.reviewQueue = null; ESP.App.render(); },
    async 'pick-lang'(){ /* form içi seçim; kaydetme anında okunur */ },
  };

  return {
    id:'lang',
    title:'Dil Stüdyosu',
    headline(){
      const d = ESP.SRS.deckStatus(aktifDil());
      if(!d.total) return 'Deste boş.';
      if(d.overdue) return d.overdue + ' kartın vadesi geçti.';
      if(d.due) return d.due + ' kart bugün vadeli.';
      return 'Bugün vadesi gelen kart yok.';
    },
    lede(){
      const d = ESP.SRS.deckStatus(aktifDil());
      if(!d.total) return 'Bir liste yapıştırdığında ölçüm başlar: retansiyon, kutu dağılımı ve bant.';
      return d.retention.cert === 'missing'
        ? d.total + ' kart kayıtlı; hiçbiri henüz cevaplanmadı, retansiyon ölçülmedi.'
        : d.total + ' kart · retansiyon %' + Math.round(d.retention.value * 100)
          + ' (' + d.retention.n + ' karttan hesaplandı).';
    },
    stats(){
      const d = ESP.SRS.deckStatus(aktifDil());
      return [
        { value:String(d.total), label:'kart' },
        { value:String(d.due), label:'vadeli' },
        { value:String(d.active), label:'aktif' },
        { value:d.retention.cert === 'missing' ? '—' : '%' + Math.round(d.retention.value * 100),
          label:'retansiyon' },
      ];
    },
    subtitle(){ return (ESP.LANG_BY_ID[aktifDil()] || {}).label || aktifDil(); },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/symposium.js ==== */
/* Sempozyum — tez, destek, itiraz ve safsata denetimi.

   Dört sekme: Açık · Kapalı · Ekle · Metinler.

   Sistemin buradaki tek iddiası şu: bir tez ancak cevaplanmamış itirazı
   kalmadığında kapanır. Bunu model değil kural motoru zorlar (Model.
   argumentOpen) — bir tezi «kapandı» diye işaretlemek, itirazı cevaplamanın
   yerine geçmez.

   Socrates cevap yazmaz, soru sorar. Model kapalıyken de sorar: sorular
   data/canon.js içindeki kalıplardan gelir ve kural motorunun kendi
   çıktısıdır. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.symposium = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C;

  const TABS = [
    { id:'acik',     label:'Açık' },
    { id:'kapali',   label:'Kapalı' },
    { id:'ekle',     label:'Ekle' },
    { id:'metinler', label:'Metinler' },
  ];

  /* ---------------------------------------------------------------- tez kartı */

  function argRow(a){
    const acikItiraz = (a.objections || []).filter(o => !o.answered);
    const safsata = ESP.Intellect.checkFallacies(
      [a.thesis].concat(a.supports || []).join(' '));
    const yas = U.diffDays((a.updatedAt || a.createdAt || '').slice(0, 10), U.todayISO());

    return K.Entry({
      label:a.status === 'open' ? 'AÇIK TEZ' : 'KAPANDI',
      meta:U.fmtShort((a.updatedAt || a.createdAt || '').slice(0, 10))
        + (yas >= 14 && a.status === 'open' ? ' · ' + yas + ' gündür sessiz' : ''),
      note:acikItiraz.length
        ? acikItiraz.length + ' itiraz cevaplanmadı; tez bu yüzden kapanamaz.'
        : (a.status === 'open' ? 'Cevaplanmamış itiraz yok — kapatılabilir.' : ''),
      action:html`${when(a.status === 'open' && !acikItiraz.length,
          () => K.Button({ label:'Kapat', size:'sm', tone:'primary', act:'close-arg',
            data:{ 'data-id':a.id } }))}
        ${K.Button({ label:'Sil', size:'sm', act:'del-arg', data:{ 'data-id':a.id } })}`,
      wide:true,
      body:html`
        <p class="thesis">${a.thesis}</p>

        ${when((a.concepts || []).length, () => html`<div class="row wrap mt-8">
          ${map(a.concepts, c => K.Chip({ label:(ESP.CONCEPT_BY_ID[c] || {}).label || c }))}
        </div>`)}

        <div class="argcols mt-12">
          <div class="argcol">
            <p class="argcol__h">Destek</p>
            ${(a.supports || []).length
              ? html`<ul class="argcol__list">${map(a.supports, s => html`<li>${s}</li>`)}</ul>`
              : html`<p class="small muted">Henüz destek yazılmadı.</p>`}
            <div class="row mt-8">
              ${K.Input({ id:'sup-' + a.id, placeholder:'Destek ekle…', size:'sm',
                aria:'Destek ekle' })}
              ${K.Button({ label:'Ekle', size:'sm', act:'add-support', data:{ 'data-id':a.id } })}
            </div>
          </div>

          <div class="argcol">
            <p class="argcol__h">İtiraz</p>
            ${(a.objections || []).length
              ? html`<ul class="argcol__list">${map(a.objections, o => html`
                  <li class="${o.answered ? 'is-answered' : ''}">
                    <span>${o.text}</span>
                    ${o.answered
                      ? html`<em class="argcol__ans">${o.answer}</em>`
                      : html`<div class="row mt-4">
                          ${K.Input({ id:'ans-' + o.id, placeholder:'Cevabın…', size:'sm',
                            aria:'İtiraza cevabın' })}
                          ${K.Button({ label:'Cevapla', size:'sm', act:'answer-obj',
                            data:{ 'data-id':a.id, 'data-obj':o.id } })}
                        </div>`}
                  </li>`)}</ul>`
              : html`<p class="small muted">İtiraz yok. En güçlü karşı tezi sen yazmazsan
                  tez sınanmamış kalır.</p>`}
            <div class="row mt-8">
              ${K.Input({ id:'obj-' + a.id, placeholder:'İtiraz ekle…', size:'sm',
                aria:'İtiraz ekle' })}
              ${K.Button({ label:'Ekle', size:'sm', act:'add-obj', data:{ 'data-id':a.id } })}
            </div>
          </div>
        </div>

        ${when(safsata.length, () => K.Notice({ tone:'info', title:'Safsata denetimi',
          body:safsata.map(f => '<b>' + f.label + '</b> — ' + f.note).join('<br/>')
            + '<br/><br/>Bu bir yargı değil bir bulgudur: kalıbın yakalanması '
            + 'argümanın yanlış olduğunu göstermez, bakmaya değer olduğunu gösterir.' }))}

        <div class="row mt-12">
          ${K.Button({ label:'Socrates\'e sor', act:'ask-socrates', data:{ 'data-id':a.id } })}
          ${K.Button({ label:'Rastgele soru', size:'sm', act:'socratic-q',
            data:{ 'data-id':a.id } })}
        </div>
        ${when(S.ui.socraticFor === a.id && S.ui.socraticQ,
          () => K.Notice({ tone:'info', title:'Soru', body:S.ui.socraticQ }))}`,
    });
  }

  /* ------------------------------------------------------------------ sekmeler */

  function openRows(){
    const rows = ESP.Intellect.openArguments();
    if(!rows.length){
      return [K.Entry({ label:'AÇIK TEZ', meta:'yok',
        body:K.Empty({ text:'Açık tez yok. Tek cümlelik bir tez yazmak yeterli; '
          + 'gerisini itirazlar açar.',
          action:K.Button({ label:'Tez yaz', tone:'primary', act:'tab-ekle' }) }) })];
    }
    return rows.map(argRow);
  }

  function closedRows(){
    const rows = (S.args || []).filter(a => a.status === 'closed');
    if(!rows.length){
      return [K.Entry({ label:'KAPANAN TEZ', meta:'yok',
        body:K.Empty({ text:'Henüz kapanan tez yok. Bir tez ancak cevaplanmamış '
          + 'itirazı kalmadığında kapanır.' }) })];
    }
    return rows.map(argRow);
  }

  function addRows(){
    const res = S.ui.argParsed;
    return [
      K.Entry({
        label:'YENİ TEZ', hint:'argument',
        meta:'tek cümle yeter',
        note:'Uzun deneme gerekmez. «X doğrudur çünkü Y. Ama Z olabilir.» yazarsan '
           + 'tez, destek ve itiraz ayrıştırılır — anlaşılmayan cümle atılmaz, sorulur.',
        body:html`
          ${K.Textarea({ id:'arg-text', rows:4, aria:'Tez metni',
            placeholder:'Özgürlük yalnızca seçenek çokluğu değildir çünkü seçenekleri '
              + 'değerlendirecek ölçüt de gerekir. Ama ölçütü kim koyar?' })}
          <div class="row mt-10">
            ${K.Button({ label:'Çöz', act:'parse-arg' })}
            ${K.Button({ label:'Olduğu gibi kaydet', tone:'primary', act:'save-arg-raw' })}
          </div>
          ${when(res, () => html`
            <div class="mt-10">
              ${K.Table({ tight:true, headers:['Parça', 'İçerik'], rows:[
                ['Tez', res.thesis || '—'],
                ['Destek', (res.supports || []).join(' · ') || '—'],
                ['İtiraz', (res.objections || []).join(' · ') || '—'],
              ] })}
              ${when(res.unmatched.length, () => K.Notice({ tone:'warn',
                title:'Nereye koyacağımı anlamadım',
                body:res.unmatched.map(u => '«' + U.esc(u.text) + '»').join('<br/>')
                  + '<br/><br/>Kaydedersen bu cümleler destek sayılır; '
                  + 'istersen metni düzenleyip yeniden çözebilirsin.' }))}
              <div class="row mt-8">
                ${K.Button({ label:'Kaydet', tone:'primary', size:'sm', act:'save-arg' })}
                ${K.Button({ label:'Vazgeç', size:'sm', act:'clear-arg' })}
              </div>
            </div>`)}`,
      }),

      K.Entry({
        label:'SOKRATİK SORULAR',
        meta:ESP.SOCRATIC.length + ' kalıp',
        note:'Model kapalıyken Socrates bu kalıplardan sorar. Kalıp olmaları '
           + 'kasıtlı: bir soru ancak teze bağlandığında işe yarar.',
        body:K.Table({ tight:true, headers:['Soru'],
          rows:ESP.SOCRATIC.map(q => [q.q]) }),
      }),
    ];
  }

  function textRows(){
    const kitaplar = (S.books || []);
    return [
      K.Entry({
        label:'KAYNAKLAR', hint:'primary-text',
        meta:kitaplar.length + ' kayıt',
        note:'Primer metin filozofun kendi metnidir; yorum ayrı tutulur. '
           + 'Sentez katsayısı yalnızca primer metinden kurulan bağları sayar.',
        wide:true,
        body:kitaplar.length
          ? K.Table({ tight:true, headers:['Eser', 'Yazar', 'Tür', 'Başlangıç', ''],
              rows:kitaplar.map(b => [
                b.title, b.author,
                b.kind === 'primary' ? 'primer' : 'yorum',
                U.fmtShort(b.startedAt),
                K.Button({ label:'Sil', size:'sm', act:'del-book', data:{ 'data-id':b.id } }),
              ]) })
          : K.Empty({ text:'Kaynak listesi boş.' }),
      }),

      K.Entry({
        label:'KANONDAN EKLE',
        meta:ESP.CANON.length + ' eser',
        note:'Yazar adının iki farklı yazımı sentez katsayısının yazar sayısını '
           + 'ikiye katlıyordu; listeden seçmek bunu kapatır.',
        body:html`
          <div class="row wrap">
            ${K.Select({ id:'canon-pick', aria:'Kanondan eser seç',
              options:ESP.CANON.map(c => ({ value:c.id,
                label:c.author + ' — ' + c.title })) })}
            ${K.Button({ label:'Ekle', tone:'primary', act:'add-canon' })}
          </div>
          <p class="small muted mt-8">Listede olmayan bir kaynağı elle de ekleyebilirsin.</p>
          <div class="cols-3 mt-10">
            ${K.Field({ label:'Eser', input:K.Input({ id:'b-title', placeholder:'Başlık' }) })}
            ${K.Field({ label:'Yazar', input:K.Input({ id:'b-author', placeholder:'Yazar' }) })}
            ${K.Field({ label:'Tür', input:K.Select({ id:'b-kind', value:'primary',
              options:[{ value:'primary', label:'Primer metin' },
                { value:'secondary', label:'Yorum' }] }) })}
          </div>
          ${K.Button({ label:'Elle ekle', act:'add-book', class:'mt-10' })}`,
      }),
    ];
  }

  /* ------------------------------------------------------------------ çizim */

  function render(){
    const tab = S.ui.philoTab || 'acik';
    const rows = tab === 'kapali' ? closedRows()
      : tab === 'ekle' ? addRows()
      : tab === 'metinler' ? textRows()
      : openRows();

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'philo-tab', aria:'Sempozyum sekmeleri',
          items:TABS.map(t => Object.assign({}, t,
            t.id === 'acik' ? { count:ESP.Intellect.openArguments().length || null } : {})) }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  const handle = {
    async 'philo-tab'(el){ S.ui.philoTab = el.dataset.tab; ESP.App.render(); },
    async 'tab-ekle'(){ S.ui.philoTab = 'ekle'; ESP.App.render(); },

    async 'parse-arg'(){
      const res = ESP.Parse.parseArgument(val('arg-text'));
      if(!res.thesis){ ESP.UI.toast('Tez bulunamadı'); return; }
      S.ui.argParsed = res;
      ESP.App.render();
    },

    async 'save-arg'(){
      const res = S.ui.argParsed;
      if(!res) return;
      /* Anlasilmayan cumleler ATILMAZ: destek olarak kaydedilir ve kullanici
         sonradan tasiyabilir. Sessizce dusmesi kullanicinin yazdigini sandigi
         ama sistemde olmayan bir metin demektir. */
      const destekler = (res.supports || []).concat((res.unmatched || []).map(u => u.text));
      await M.saveArgument(M.newArgument({
        thesis:res.thesis,
        supports:destekler,
        objections:(res.objections || []).map(t => ({ id:U.uid('o'), text:t, answered:false })),
        concepts:ESP.Parse.extractConcepts(res.thesis + ' ' + destekler.join(' ')).map(c => c.id),
      }));
      S.ui.argParsed = null;
      S.ui.philoTab = 'acik';
      ESP.Memo.bitir();
      ESP.UI.toast('Tez kaydedildi');
      ESP.App.render();
    },

    async 'save-arg-raw'(){
      const t = val('arg-text');
      if(!t){ ESP.UI.toast('Metin boş'); return; }
      await M.saveArgument(M.newArgument({ thesis:t,
        concepts:ESP.Parse.extractConcepts(t).map(c => c.id) }));
      S.ui.philoTab = 'acik';
      ESP.Memo.bitir();
      ESP.UI.toast('Tez kaydedildi');
      ESP.App.render();
    },

    async 'clear-arg'(){ S.ui.argParsed = null; ESP.App.render(); },

    async 'add-support'(el){
      const a = S.args.find(x => x.id === el.dataset.id);
      const t = val('sup-' + el.dataset.id);
      if(!a || !t) return;
      a.supports = (a.supports || []).concat([t]);
      await M.saveArgument(a);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'add-obj'(el){
      const a = S.args.find(x => x.id === el.dataset.id);
      const t = val('obj-' + el.dataset.id);
      if(!a || !t) return;
      a.objections = (a.objections || []).concat([{ id:U.uid('o'), text:t, answered:false }]);
      a.status = 'open';
      await M.saveArgument(a);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'answer-obj'(el){
      const a = S.args.find(x => x.id === el.dataset.id);
      if(!a) return;
      const o = (a.objections || []).find(x => x.id === el.dataset.obj);
      const t = val('ans-' + el.dataset.obj);
      if(!o || !t) return;
      o.answered = true; o.answer = t;
      await M.saveArgument(a);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'close-arg'(el){
      const a = S.args.find(x => x.id === el.dataset.id);
      if(!a) return;
      if(M.argumentOpen(a)){
        ESP.UI.toast('Cevaplanmamış itiraz varken tez kapanmaz');
        return;
      }
      a.status = 'closed';
      await M.saveArgument(a);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'del-arg'(el){
      await M.deleteArgument(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'socratic-q'(el){
      const q = ESP.SOCRATIC[Math.floor(Math.random() * ESP.SOCRATIC.length)];
      S.ui.socraticFor = el.dataset.id;
      S.ui.socraticQ = q.q;
      ESP.App.render();
    },

    /* Tezin METNI burada gider — brifingde degil.

       Fark kasitlidir: brifing her cagride otomatik gider ve icinde yalnizca
       olcum vardir. Tez metni yalnizca kullanici bu dugmeye bastiginda,
       SORUNUN icinde gider. Acikca paylasilan parca. */
    async 'ask-socrates'(el){
      const a = S.args.find(x => x.id === el.dataset.id);
      if(!a) return;
      S.ui.officeAgent = 'socrates';
      const soru = 'Tezim: «' + a.thesis + '»'
        + ((a.supports || []).length ? '\nDesteklerim: ' + a.supports.join(' · ') : '')
        + ((a.objections || []).length ? '\nİtirazlar: '
            + a.objections.map(o => o.text + (o.answered ? ' (cevapladım)' : ' (açık)')).join(' · ') : '')
        + '\nBana tek bir soru sor.';
      ESP.App.go('team');
      setTimeout(() => {
        const inp = document.getElementById('chat-input');
        if(inp){ inp.value = soru; inp.focus(); }
      }, 200);
    },

    async 'add-canon'(){
      const id = val('canon-pick');
      const c = ESP.CANON_BY_ID[id];
      if(!c) return;
      await M.saveBook(M.newBook({ title:c.title, author:c.author, kind:c.kind }));
      ESP.Memo.bitir();
      ESP.UI.toast(c.title + ' eklendi');
      ESP.App.render();
    },

    async 'add-book'(){
      const t = val('b-title'), a = val('b-author');
      if(!t){ ESP.UI.toast('Eser adı gerekir'); return; }
      await M.saveBook(M.newBook({ title:t, author:a, kind:val('b-kind') || 'primary' }));
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'del-book'(el){
      await M.deleteBook(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },
  };

  const change = {};

  return {
    id:'symposium',
    title:'Sempozyum',
    headline(){
      const acik = ESP.Intellect.openArguments();
      const tikanan = ESP.Intellect.stalledArguments();
      if(!(S.args || []).length) return 'Henüz tez yok.';
      if(tikanan.length) return tikanan.length + ' tez 14 günden uzun süredir sessiz.';
      const itiraz = acik.reduce((a, x) => a + (x.objections || []).filter(o => !o.answered).length, 0);
      if(itiraz) return itiraz + ' itiraz cevaplanmayı bekliyor.';
      return acik.length + ' tez açık.';
    },
    lede(){
      return 'Bir tez ancak cevaplanmamış itirazı kalmadığında kapanır. '
           + 'Socrates cevap yazmaz, soru sorar.';
    },
    stats(){
      const acik = ESP.Intellect.openArguments();
      const kapali = (S.args || []).filter(a => a.status === 'closed');
      const itiraz = acik.reduce((a, x) => a + (x.objections || []).filter(o => !o.answered).length, 0);
      const primer = (S.books || []).filter(b => b.kind === 'primary');
      return [
        { value:String(acik.length), label:'açık tez' },
        { value:String(itiraz), label:'açık itiraz' },
        { value:String(kapali.length), label:'kapandı' },
        { value:String(primer.length), label:'primer metin' },
      ];
    },
    subtitle(){ return (S.args || []).length + ' tez'; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/studio.js ==== */
/* Stüdyo — gitar metronomu ve diksiyon kaydı.

   Üç sekme: Müzik · Diksiyon · İlerleme.

   İki disiplin aynı ekranda çünkü aynı katmanı paylaşıyorlar
   (core/acoustic.js): ikisi de zamanlamayı ölçer, ikisi de «temiz tekrar»
   sayar, ikisinin de kuralı aynıdır — hız bir sonuçtur, hedef değil.

   Bu ekran ses DİNLEMEZ. Metronom ses ÜRETİR (Web Audio), ama mikrofon hiç
   açılmaz ve hiçbir kayıt dosyası oluşmaz. Diksiyonda saklanan şey süre,
   kelime sayısı ve kendi işaretlediğin hata sayısıdır. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.studio = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C;

  const TABS = [
    { id:'muzik',    label:'Müzik' },
    { id:'diksiyon', label:'Diksiyon' },
    { id:'ilerleme', label:'İlerleme' },
  ];

  /* --------------------------------------------------------------- metronom

     Ses üretimi burada, zamanlama hesabı core/acoustic.js'te. Ayrım kasıtlı:
     «80 BPM'de vuruş kaç ms» sorusu tarayıcısız test edilebilmeli.

     AudioContext yalnızca kullanıcı düğmeye bastığında açılır: tarayıcılar
     etkileşim olmadan ses bağlamı açmaya izin vermez ve sessizce başarısız
     olur. */
  let ctx = null, timer = null, nextTick = 0, beat = 0;

  function metronomeStart(bpm, beatsPerBar){
    metronomeStop();
    try{
      ctx = ctx || new (window.AudioContext || window.webkitAudioContext)();
    }catch(e){ ESP.UI.toast('Tarayıcı ses üretemiyor'); return false; }
    const ms = ESP.Acoustic.beatMs(bpm);
    if(ms == null) return false;
    const bar = beatsPerBar || 4;
    beat = 0;
    nextTick = ctx.currentTime + 0.06;
    timer = setInterval(() => {
      /* Ileriye bak: setInterval'in kaymasi duyulur, zamanlanmis osilatorun
         kaymasi duyulmaz. 120 ms'lik bir pencereyi onceden doldururuz. */
      while(nextTick < ctx.currentTime + 0.12){
        tick(nextTick, beat % bar === 0);
        nextTick += ms / 1000;
        beat++;
      }
    }, 25);
    return true;
  }

  function tick(at, accent){
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = accent ? 1320 : 880;
    gain.gain.setValueAtTime(accent ? 0.22 : 0.12, at);
    gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.05);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(at); osc.stop(at + 0.06);
  }

  function metronomeStop(){
    if(timer){ clearInterval(timer); timer = null; }
  }

  /* ------------------------------------------------------------------ müzik */

  function musicRows(){
    const bpm = S.ui.metronomeBpm || 80;
    const parcalar = S.pieces || [];
    const acik = S.ui.pieceOpen ? parcalar.find(p => p.id === S.ui.pieceOpen) : null;

    const rows = [
      K.Entry({
        label:'METRONOM',
        meta:bpm + ' BPM',
        note:'Temiz çalınan tempo, hızlı çalınan tempodan önce gelir. '
           + 'Eşik yalnızca «temiz» işaretlenen tekrarlardan açılır.',
        body:html`
          <div class="metro">
            <div class="metro__bpm">
              <button class="metro__step" data-act="bpm" data-d="-5" aria-label="5 azalt">−5</button>
              <span class="metro__val num">${bpm}</span>
              <button class="metro__step" data-act="bpm" data-d="5" aria-label="5 artır">+5</button>
            </div>
            <div class="metro__ctrl">
              ${K.Button({ label:S.ui.metronomeOn ? 'Durdur' : 'Başlat',
                tone:S.ui.metronomeOn ? '' : 'primary', act:'metro-toggle' })}
              ${K.Select({ id:'metro-sig', value:S.ui.metroSig || '4/4', change:'metro-sig',
                aria:'Ölçü türü',
                options:ESP.TIME_SIGNATURES.map(t => ({ value:t.id, label:t.label })) })}
            </div>
          </div>
          <p class="small muted mt-8">Vuruş aralığı
            ${U.fmtNum(Math.round(ESP.Acoustic.beatMs(bpm)))} ms.
            İlk vuruş vurgulu: metronomun işi vuruşu değil ölçünün nerede
            başladığını duyurmaktır.</p>`,
      }),

      K.Entry({
        label:'TEKRAR KAYDET',
        meta:acik ? acik.name : 'parça seç',
        note:'«Temiz» senin işaretindir: sistem duymaz. Bu yüzden tempo ve tarih '
           + '«ölçüldü», temizlik yargısı senindir.',
        body:parcalar.length
          ? html`
            <div class="row wrap">
              ${K.Select({ id:'att-piece', value:acik ? acik.id : parcalar[0].id,
                change:'pick-piece', aria:'Tekrarın yazılacağı parça',
                options:parcalar.map(p => ({ value:p.id, label:p.name })) })}
              ${K.Button({ label:'Temiz tekrar', tone:'primary', act:'log-clean' })}
              ${K.Button({ label:'Hatalı tekrar', act:'log-dirty' })}
            </div>
            <p class="small muted mt-8">
              ${ESP.Acoustic.CLEAN_STREAK} temiz tekrar aynı tempoda ve son
              ${ESP.Acoustic.CLEAN_WINDOW_DAYS} gün içinde geldiğinde eşik açılır.
              Eşik kendiliğinden artar, kendiliğinden düşmez.</p>`
          : K.Empty({ text:'Henüz parça ya da teknik yok. Aşağıdan ekleyebilirsin.' }),
      }),
    ];

    parcalar.forEach(p => {
      const t = ESP.Acoustic.cleanThreshold(p);
      const next = ESP.Acoustic.nextStep(p);
      const sonDeneme = (p.attempts || []).slice(-6).reverse();
      rows.push(K.Entry({
        label:p.kind === 'technique' ? 'TEKNİK' : 'PARÇA',
        meta:p.name,
        note:t.cert === 'missing'
          ? (t.why || 'Henüz temiz eşik ölçülmedi.')
          : 'Temiz eşik ' + t.value + ' BPM' + (p.targetBpm ? ' · hedef ' + p.targetBpm : ''),
        action:K.Button({ label:'Sil', size:'sm', act:'del-piece', data:{ 'data-id':p.id } }),
        body:html`
          ${t.cert === 'missing'
            ? K.Notice({ tone:'info', body:t.why || 'Bu parçada ölçülmüş temiz eşik yok. '
                + 'Tempo girip «temiz» işaretlediğinde ölçüm başlar.' })
            : html`${K.Meter({ label:'Temiz eşik',
                value:p.targetBpm ? Math.min(100, t.value / p.targetBpm * 100) : 50,
                text:t.value + ' BPM' + (p.targetBpm ? ' / ' + p.targetBpm : ''),
                tone:p.targetBpm && t.value >= p.targetBpm ? 'ok' : '' })}
              ${when(next.cert !== 'missing', () => html`<p class="small muted mt-8">
                Sıradaki basamak ${next.value} BPM (+${ESP.Acoustic.BPM_STEP}).</p>`)}`}
          ${when(sonDeneme.length, () => K.Table({ tight:true,
            headers:['Tarih', { label:'BPM', num:true }, 'Temiz'],
            rows:sonDeneme.map(a => [U.fmtShort(a.date), String(a.bpm),
              a.clean ? 'evet' : 'hayır']) }))}`,
      }));
    });

    rows.push(K.Entry({
      label:'PARÇA EKLE',
      meta:'teknik ya da repertuar',
      body:html`
        <div class="cols-3">
          ${K.Field({ label:'Ad', input:K.Input({ id:'p-name', placeholder:'Dönüşümlü mızrap' }) })}
          ${K.Field({ label:'Tür', input:K.Select({ id:'p-kind', value:'technique',
            options:[{ value:'technique', label:'Teknik' }, { value:'piece', label:'Parça' }] }) })}
          ${K.Field({ label:'Hedef BPM', hint:'isteğe bağlı',
            input:K.Input({ id:'p-target', type:'number', numeric:true, min:20, max:300,
              placeholder:'120' }) })}
        </div>
        ${K.Button({ label:'Ekle', tone:'primary', act:'add-piece', class:'mt-10' })}
        <p class="small muted mt-10">Hazır teknikler:</p>
        <div class="row wrap mt-4">
          ${map(ESP.TECHNIQUES, t => K.Button({ label:t.label, size:'sm',
            act:'add-technique', data:{ 'data-id':t.id } }))}
        </div>`,
    }));

    return rows;
  }

  /* --------------------------------------------------------------- diksiyon */

  function dictionRows(){
    const d = ESP.Acoustic.dictionStatus(30);
    const kayitlar = (S.recordings || []).slice(0, 10);
    const secili = ESP.TWISTER_BY_ID[S.ui.twister || 'kartal'] || ESP.TONGUE_TWISTERS[0];

    return [
      K.Entry({
        label:'ÇALIŞMA METNİ', hint:'articulation',
        meta:'düzey ' + secili.level + ' · ' + (ESP.PHONEME_GROUPS.find(g => g.id === secili.target) || {}).label,
        note:'Hedef hızlı söylemek değil, hangi sesin düzeldiği. Hızlı ama bozuk '
           + 'bir tekerleme çalışmanın başarısı değil başarısızlığıdır.',
        body:html`
          <div class="row wrap">
            ${K.Select({ id:'tw-pick', value:secili.id, change:'pick-twister',
              aria:'Çalışma metni',
              options:ESP.TONGUE_TWISTERS.map(t => ({ value:t.id,
                label:'D' + t.level + ' · ' + t.text.slice(0, 40) + '…' })) })}
          </div>
          <p class="twister mt-10">${secili.text}</p>
          <p class="small muted mt-8">${secili.words} kelime ·
            ${(ESP.PHONEME_GROUPS.find(g => g.id === secili.target) || {}).note || ''}</p>`,
      }),

      K.Entry({
        label:'KAYIT ÖLÇÜMÜ',
        meta:'ses dosyası tutulmaz',
        note:'Saklanan şey süre, kelime ve senin işaretlediğin hata sayısıdır. '
           + 'Olmayan ses dosyası sızamaz.',
        body:html`
          <div class="cols-3">
            ${K.Field({ label:'Süre (saniye)',
              input:K.Input({ id:'r-sec', type:'number', numeric:true, min:1, max:3600,
                placeholder:'12' }) })}
            ${K.Field({ label:'Kelime',
              input:K.Input({ id:'r-words', type:'number', numeric:true, min:1,
                value:secili.words }) })}
            ${K.Field({ label:'Hata sayısı', hint:'kendi işaretin — tahmin sayılır',
              input:K.Input({ id:'r-err', type:'number', numeric:true, min:0,
                placeholder:'2' }) })}
          </div>
          <div class="row wrap mt-10">
            ${map(ESP.ARTICULATION_ERRORS, e => K.Button({ label:e.label, size:'sm',
              tone:(S.ui.errTags || []).indexOf(e.id) >= 0 ? 'primary' : '',
              act:'toggle-err', data:{ 'data-id':e.id } }))}
          </div>
          ${K.Button({ label:'Ölçümü kaydet', tone:'primary', act:'add-recording', class:'mt-10' })}`,
      }),

      K.Entry({
        label:'KONUŞMA HIZI', hint:'wpm',
        meta:d.cert === 'missing' ? 'veri yok'
          : (d.wpm.cert === 'missing' ? 'hesaplanamadı' : d.wpm.value + ' kelime/dk'),
        note:ESP.WPM_NOTE,
        body:d.cert === 'missing'
          ? K.Empty({ text:'Son 30 günde kayıt yok.' })
          : html`
            ${d.wpm.cert === 'missing'
              ? K.Notice({ tone:'warn', body:'WPM için hem süre hem kelime sayısı ölçülmüş olmalı.' })
              : K.Meter({ label:'Medyan hız (' + d.wpm.n + ' kayıttan)',
                  value:Math.min(100, d.wpm.value / 200 * 100),
                  text:d.wpm.value + ' kelime/dk',
                  tone:d.wpm.value >= ESP.Acoustic.WPM_BAND.min
                    && d.wpm.value <= ESP.Acoustic.WPM_BAND.max ? 'ok' : 'warn' })}
            ${when(d.errorRate.cert !== 'missing', () => html`<p class="small muted mt-8">
              Kendi işaretlediğin hata oranı medyanı
              %${Math.round(d.errorRate.value * 100)} — tahmin etiketlidir,
              yalnızca kendi geçmişinle karşılaştırılır.</p>`)}`,
      }),

      K.Entry({
        label:'NEFES VE VURGU',
        meta:ESP.BREATH_DRILLS.length + ' çalışma',
        note:'Ölçülen şey süredir, «iyi yaptım» değil.',
        body:html`
          ${K.Table({ tight:true, headers:['Çalışma', { label:'Süre', num:true }, 'Not'],
            rows:ESP.BREATH_DRILLS.map(b => [b.label, U.fmtMin(Math.round(b.seconds / 60)) , b.note]) })}
          ${map(ESP.STRESS_DRILLS, s => html`
            <div class="mt-12">
              <p class="thesis">${s.sentence}</p>
              ${K.Table({ tight:true, headers:['Vurgu', 'Anlam'],
                rows:s.readings.map(r => [r.stress, r.means]) })}
            </div>`)}`,
      }),

      K.Entry({
        label:'SON KAYITLAR',
        meta:kayitlar.length + ' ölçüm',
        wide:true,
        body:kayitlar.length
          ? K.Table({ tight:true,
              headers:['Tarih', { label:'Süre', num:true }, { label:'Kelime', num:true },
                { label:'WPM', num:true }, { label:'Hata', num:true }, ''],
              rows:kayitlar.map(r => {
                const w = ESP.Acoustic.wpmOf(r);
                return [U.fmtShort(r.date),
                  r.seconds != null ? r.seconds + ' sn' : '—',
                  r.words != null ? String(r.words) : '—',
                  w.cert === 'missing' ? '—' : String(w.value),
                  r.errors != null ? String(r.errors) : '—',
                  K.Button({ label:'Sil', size:'sm', act:'del-rec', data:{ 'data-id':r.id } })];
              }) })
          : K.Empty({ text:'Henüz ölçüm yok.' }),
      }),
    ];
  }

  /* -------------------------------------------------------------- ilerleme */

  function progressRows(){
    const m = ESP.Acoustic.musicStatus();
    const t = ESP.Acoustic.dictionTrend();
    const plato = ESP.Acoustic.plateaus();

    return [
      K.Entry({
        label:'PLATO', hint:'plateau',
        meta:plato.length ? plato.length + ' teknik' : 'yok',
        note:'Plato bir başarısızlık değil bir sinyaldir: aynı çalışma aynı '
           + 'sonucu veriyorsa değişmesi gereken çalışmanın kendisidir.',
        body:plato.length
          ? K.Table({ tight:true, headers:['Parça', { label:'Gün', num:true }, { label:'BPM', num:true }],
              rows:plato.map(p => [p.piece.name, String(p.days), String(p.bpm)]) })
          : K.Notice({ tone:'ok', body:'Hiçbir teknik '
              + ESP.Acoustic.PLATEAU_DAYS + ' gündür takılı değil. '
              + 'Hiç çalışılmamış parça plato sayılmaz — plato çalışan bir şeyin durmasıdır.' }),
      }),

      K.Entry({
        label:'HEDEFE ULAŞMA',
        meta:m.progress && m.progress.cert !== 'missing'
          ? m.progress.reached + '/' + m.progress.n : 'veri yok',
        note:'Hedefi girilmemiş parça paydaya girmez: hedefsiz parça başarısız değildir.',
        body:m.progress && m.progress.cert !== 'missing'
          ? K.Meter({ label:'Hedef tempoya ulaşan parça oranı',
              value:m.progress.value * 100,
              text:'%' + Math.round(m.progress.value * 100) })
          : K.Empty({ text:'Hedef BPM girilmiş ve eşiği ölçülmüş parça yok.' }),
      }),

      K.Entry({
        label:'DİKSİYON EĞİLİMİ',
        meta:t.cert === 'missing' ? 'veri yok' : t.direction,
        note:'İki pencere karşılaştırılır: son 14 gün ve ondan önceki 14 gün. '
           + 'İkisinde de ölçüm yoksa bulgu üretilmez.',
        body:t.cert === 'missing'
          ? K.Notice({ tone:'info', body:t.why })
          : K.Notice({ tone:t.direction === 'iyi' ? 'ok' : t.direction === 'kotu' ? 'warn' : 'info',
              body:'Hata oranı %' + Math.round(t.before * 100) + ' → %'
                + Math.round(t.now * 100) + '. Bu bir tahmindir: hataları sen işaretledin.' }),
      }),

      K.Entry({
        label:'ISINMA SIRASI',
        meta:'öneri',
        note:'Zorunlu değildir; sistem senin yerine karar vermez.',
        body:K.Table({ tight:true, headers:['Aşama', { label:'Dakika', num:true }, 'Not'],
          rows:ESP.WARMUP.map(w => [w.label, String(w.minutes), w.note]) }),
      }),
    ];
  }

  /* ------------------------------------------------------------------ çizim */

  function render(){
    const tab = S.ui.studioTab || 'muzik';
    const rows = tab === 'diksiyon' ? dictionRows()
      : tab === 'ilerleme' ? progressRows()
      : musicRows();

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'studio-tab', aria:'Stüdyo sekmeleri', items:TABS }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  const handle = {
    async 'studio-tab'(el){
      if(S.ui.metronomeOn){ metronomeStop(); S.ui.metronomeOn = false; }
      S.ui.studioTab = el.dataset.tab;
      ESP.App.render();
    },

    async 'bpm'(el){
      const d = Number(el.dataset.d) || 0;
      S.ui.metronomeBpm = Math.max(30, Math.min(260, (S.ui.metronomeBpm || 80) + d));
      if(S.ui.metronomeOn){
        const sig = ESP.TIME_SIGNATURES.find(t => t.id === (S.ui.metroSig || '4/4'));
        metronomeStart(S.ui.metronomeBpm, sig ? sig.beats : 4);
      }
      ESP.App.render();
    },

    async 'metro-toggle'(){
      if(S.ui.metronomeOn){
        metronomeStop();
        S.ui.metronomeOn = false;
      }else{
        const sig = ESP.TIME_SIGNATURES.find(t => t.id === (S.ui.metroSig || '4/4'));
        S.ui.metronomeOn = metronomeStart(S.ui.metronomeBpm || 80, sig ? sig.beats : 4);
      }
      ESP.App.render();
    },

    async 'log-clean'(el){ await logAttempt(true); },
    async 'log-dirty'(el){ await logAttempt(false); },

    async 'add-piece'(){
      const ad = val('p-name');
      if(!ad){ ESP.UI.toast('Ad gerekir'); return; }
      const hedef = val('p-target');
      await M.savePiece(M.newPiece({ name:ad, kind:val('p-kind') || 'technique',
        targetBpm:hedef ? Number(hedef) : null }));
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'add-technique'(el){
      const t = ESP.TECHNIQUE_BY_ID[el.dataset.id];
      if(!t) return;
      if((S.pieces || []).some(p => p.name === t.label)){
        ESP.UI.toast('Bu teknik zaten var');
        return;
      }
      await M.savePiece(M.newPiece({ name:t.label, kind:'technique', targetBpm:t.targetBpm }));
      ESP.S.ui.metronomeBpm = t.startBpm;
      ESP.Memo.bitir();
      ESP.UI.toast(t.label + ' eklendi');
      ESP.App.render();
    },

    async 'del-piece'(el){
      await M.deletePiece(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'toggle-err'(el){
      const id = el.dataset.id;
      const list = S.ui.errTags || [];
      S.ui.errTags = list.indexOf(id) >= 0 ? list.filter(x => x !== id) : list.concat([id]);
      ESP.App.render();
    },

    async 'add-recording'(){
      const sn = val('r-sec'), kelime = val('r-words'), hata = val('r-err');
      if(!sn){ ESP.UI.toast('Süre girilmedi'); return; }
      const s = M.numCert(sn, 'measured');
      const w = M.numCert(kelime, 'measured');
      /* Hata sayisi DAIMA tahmindir: sistem sesi dinlemedi. */
      const e = M.numCert(hata, 'estimated');
      await M.saveRecording({
        date:U.todayISO(),
        seconds:s.value, secondsCert:s.cert,
        words:w.value, wordsCert:w.cert,
        errors:e.value, errorsCert:e.cert,
        textId:S.ui.twister || null,
        note:(S.ui.errTags || []).join(','),
      });
      S.ui.errTags = [];
      ESP.Memo.bitir();
      ESP.UI.toast('Ölçüm kaydedildi');
      ESP.App.render();
    },

    async 'del-rec'(el){
      await M.deleteRecording(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },
  };

  async function logAttempt(clean){
    const sel = document.getElementById('att-piece');
    const id = sel ? sel.value : (S.pieces[0] && S.pieces[0].id);
    if(!id){ ESP.UI.toast('Önce parça ekle'); return; }
    const res = await ESP.Acoustic.logAttempt(id, S.ui.metronomeBpm || 80, clean);
    if(!res.ok){ ESP.UI.toast(res.error); return; }
    ESP.Memo.bitir();
    ESP.UI.toast(res.raised
      ? 'Yeni temiz eşik: ' + res.piece.cleanBpm + ' BPM'
      : (clean ? 'Temiz tekrar kaydedildi' : 'Tekrar kaydedildi'));
    ESP.App.render();
  }

  const change = {
    async 'metro-sig'(el){
      S.ui.metroSig = el.value;
      if(S.ui.metronomeOn){
        const sig = ESP.TIME_SIGNATURES.find(t => t.id === el.value);
        metronomeStart(S.ui.metronomeBpm || 80, sig ? sig.beats : 4);
      }
    },
    async 'pick-piece'(el){ S.ui.pieceOpen = el.value; ESP.App.render(); },
    async 'pick-twister'(el){ S.ui.twister = el.value; ESP.App.render(); },
  };

  return {
    id:'studio',
    title:'Stüdyo',
    headline(){
      const plato = ESP.Acoustic.plateaus();
      if(plato.length) return plato[0].piece.name + ' ' + plato[0].days + ' gündür platoda.';
      const m = ESP.Acoustic.musicStatus();
      if(m.cert === 'missing') return 'Henüz parça ya da teknik yok.';
      const d = ESP.Acoustic.dictionStatus(30);
      if(d.cert === 'missing') return 'Diksiyon 30 gündür hiç açılmadı.';
      return m.measured + ' parçanın temiz eşiği ölçülü.';
    },
    lede(){
      return 'Hız bir sonuçtur, hedef değil. Temiz çalınan tempo, hızlı çalınan '
           + 'tempodan önce gelir — diksiyonda da öyle.';
    },
    stats(){
      const m = ESP.Acoustic.musicStatus();
      const d = ESP.Acoustic.dictionStatus(30);
      return [
        { value:String(m.n || 0), label:'parça' },
        { value:String((m.plateaus || []).length), label:'plato' },
        { value:String(d.n || 0), label:'kayıt' },
        { value:d.cert === 'missing' || d.wpm.cert === 'missing' ? '—' : String(d.wpm.value),
          label:'WPM' },
      ];
    },
    subtitle(){ return (S.pieces || []).length + ' parça · ' + (S.recordings || []).length + ' kayıt'; },
    actions(){ return ''; },
    render, handle, change,

    /* Ekrandan cikarken metronom susmali: gorunmeyen bir ekranin sesi
       kullanicinin kapatamayacagi bir sestir. */
    leave(){ metronomeStop(); S.ui.metronomeOn = false; },
  };
})();

/* ==== js/screens/library.js ==== */
/* Kütüphane — atomik not, sentopik matris ve kaynaklar.

   Üç sekme: Notlar · Matris · Kaynaklar.

   Tek kural: BİR NOT BİR FİKİR. İki fikir taşıyan not hiçbir yere
   bağlanamaz, çünkü hangi fikirle bağlandığı belirsizdir.

   Sistem bağ KURMAZ, bağ ÖNERİR: iki notun ortak kavramı varsa satır düşer,
   bağın nedenini kullanıcı yazar. Nedeni uydurmak, uydurulmuş sayı kadar
   zararlıdır — matris görünür ama anlamsız olur. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.library = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map, cls } = ESP.h;
  const K = ESP.C;

  const TABS = [
    { id:'notlar',    label:'Notlar' },
    { id:'matris',    label:'Matris' },
    { id:'kaynaklar', label:'Kaynaklar' },
  ];

  function bookOf(id){ return (S.books || []).find(b => b.id === id); }

  /* ------------------------------------------------------------------ notlar */

  function noteRows(){
    const q = U.norm(S.ui.noteQuery || '');
    const kavram = S.ui.conceptFilter;
    const hepsi = (S.notes || [])
      .filter(n => !q || U.norm(n.text).indexOf(q) >= 0)
      .filter(n => !kavram || (n.concepts || []).indexOf(kavram) >= 0);

    const rows = [
      K.Entry({
        label:'NOT EKLE', hint:'atomic-note',
        meta:'tek fikir, tek cümle',
        note:'Kitap özeti değil. İki fikir taşıyan not bağlanamaz; bölerek yaz.',
        body:html`
          ${K.Textarea({ id:'note-text', rows:3, aria:'Atomik not metni',
            placeholder:'Özgürlük, seçenek çokluğu değil seçebilme kapasitesidir.' })}
          <div class="row wrap mt-10">
            ${K.Select({ id:'note-book', value:'', aria:'Notun kaynağı',
              options:[{ value:'', label:'Kaynak seç (isteğe bağlı)' }]
                .concat((S.books || []).map(b => ({ value:b.id, label:b.author + ' — ' + b.title }))) })}
            ${K.Button({ label:'Notu ekle', tone:'primary', act:'add-note' })}
          </div>
          <p class="small muted mt-8">Kavram etiketleri metinden otomatik çıkarılır;
            kanonda olmayan kelime uydurulmaz, elle ekleyebilirsin.</p>`,
      }),
    ];

    if(!hepsi.length){
      rows.push(K.Entry({ label:'NOTLAR', meta:'yok',
        body:K.Empty({ text:q || kavram ? 'Süzgece uyan not yok.'
          : 'Henüz atomik not yok. Okuduğun tek bir fikri tek cümleyle yaz.' }) }));
      return rows;
    }

    rows.push(K.Entry({
      label:'NOTLAR',
      meta:hepsi.length + ' not' + (kavram ? ' · ' + (ESP.CONCEPT_BY_ID[kavram] || {}).label : ''),
      action:html`${K.Input({ id:'note-q', value:S.ui.noteQuery || '',
          placeholder:'Not ara…', change:'note-query', size:'sm', aria:'Not ara' })}
        ${when(kavram, () => K.Button({ label:'Süzgeci kaldır', size:'sm', act:'clear-concept' }))}`,
      wide:true,
      body:html`${map(hepsi, n => {
        const kitap = bookOf(n.bookId);
        return html`
          <div class="noterow">
            <p class="noterow__text">${n.text}</p>
            <div class="noterow__meta">
              ${when(kitap, () => html`<span class="tiny dim">${kitap.author} · ${kitap.title}</span>`)}
              ${map(n.concepts, c => K.Button({ size:'sm', act:'filter-concept',
                label:(ESP.CONCEPT_BY_ID[c] || {}).label || c, data:{ 'data-id':c } }))}
              <span class="tiny dim">${(n.links || []).length} bağ</span>
              ${K.Button({ label:'Bağla', size:'sm', act:'open-link', data:{ 'data-id':n.id } })}
              ${K.Button({ label:'Sil', size:'sm', act:'del-note', data:{ 'data-id':n.id } })}
            </div>
            ${when(S.ui.linkFrom === n.id, () => linkForm(n))}
            ${when((n.links || []).length, () => html`
              <ul class="noterow__links">${map(n.links, l => {
                const hedef = (S.notes || []).find(x => x.id === l.to);
                return html`<li>
                  <span>${hedef ? hedef.text : '(silinmiş not)'}</span>
                  ${when(l.why, () => html`<em>${l.why}</em>`)}
                  ${K.Button({ label:'Kaldır', size:'sm', act:'unlink',
                    data:{ 'data-a':n.id, 'data-b':l.to } })}
                </li>`;
              })}</ul>`)}
          </div>`;
      })}`,
    }));

    return rows;
  }

  function linkForm(n){
    const adaylar = (S.notes || []).filter(x => x.id !== n.id
      && !(n.links || []).some(l => l.to === x.id));
    if(!adaylar.length){
      return K.Notice({ tone:'info', body:'Bağlanacak başka not yok.' });
    }
    return html`
      <div class="linkform">
        ${K.Select({ id:'link-to', aria:'Bağlanacak not',
          options:adaylar.map(x => ({ value:x.id, label:x.text.slice(0, 60) })) })}
        ${K.Input({ id:'link-why', placeholder:'Neden bağlı? (bir cümle)',
          aria:'Bağın gerekçesi' })}
        ${K.Button({ label:'Bağla', tone:'primary', size:'sm', act:'do-link',
          data:{ 'data-id':n.id } })}
        ${K.Button({ label:'Vazgeç', size:'sm', act:'close-link' })}
      </div>`;
  }

  /* ------------------------------------------------------------------ matris */

  function matrixRows(){
    const ss = ESP.Intellect.syntopic();
    const oneri = ESP.Intellect.linkSuggestions(10);
    const bagsiz = ESP.Intellect.unlinkedNotes();

    /* Kavram × yazar matrisi: hangi kavramda kac yazar okunmus.
       Sentopik okuma AYNI SORUYU birden cok yazara sormaktir; matris bunu
       tek bakista gosterir. */
    const kavramlar = {};
    (S.notes || []).forEach(n => {
      const b = bookOf(n.bookId);
      (n.concepts || []).forEach(c => {
        kavramlar[c] = kavramlar[c] || { notes:0, authors:new Set() };
        kavramlar[c].notes++;
        if(b && b.author) kavramlar[c].authors.add(b.author);
      });
    });
    const kavramSatirlari = Object.keys(kavramlar)
      .map(c => ({ id:c, label:(ESP.CONCEPT_BY_ID[c] || {}).label || c,
        notes:kavramlar[c].notes, authors:kavramlar[c].authors.size }))
      .sort((a, b) => b.authors - a.authors || b.notes - a.notes);

    return [
      K.Entry({
        label:'SENTEZ KATSAYISI', hint:'ssk',
        meta:ss.cert === 'missing' ? 'veri yok'
          : U.fmtNum(Math.round(ss.value * 100) / 100),
        note:ss.cert === 'missing' ? (ss.why || 'Hesap için kaynak gerekir.')
          : ss.linked + ' bağlı not ÷ ' + ss.books + ' kaynak × log(1 + '
            + ss.authors + ' yazar)',
        body:ss.cert === 'missing'
          ? K.Notice({ tone:'info', body:ss.why
              || 'Not ve kaynak girildiğinde katsayı hesaplanmaya başlar.' })
          : html`
            ${K.Meter({ label:'Bağlanmış not oranı', value:ss.linkedRatio * 100,
              text:ss.linked + '/' + ss.total })}
            <p class="small muted mt-8">Formül tek yazarda sıfırlanmaz:
              log(1 + n) kullanılır. Bir kitabı derinlemesine analiz eden
              kullanıcı cezalandırılmaz.</p>`,
      }),

      K.Entry({
        label:'BAĞ ÖNERİLERİ', hint:'syntopic',
        meta:oneri.length + ' öneri',
        note:'Sistem bağı KURMAZ, önerir. Bağın nedenini sen yazarsın; '
           + 'sistem nedeni uyduramaz.',
        wide:true,
        body:oneri.length
          ? html`${map(oneri, o => html`
              <div class="sugg">
                <div class="sugg__pair">
                  <p>${o.a.text}</p>
                  <span class="sugg__op">↔</span>
                  <p>${o.b.text}</p>
                </div>
                <div class="sugg__meta">
                  ${map(o.concepts, c => K.Chip({ label:(ESP.CONCEPT_BY_ID[c] || {}).label || c }))}
                  ${when(o.cross, () => K.Badge({ label:'farklı kaynak', tone:'info' }))}
                  ${K.Button({ label:'Bağla', size:'sm', act:'open-link',
                    data:{ 'data-id':o.a.id } })}
                </div>
              </div>`)}`
          : K.Empty({ text:bagsiz.length
              ? 'Ortak kavram bulunamadı. Notlara kavram etiketi eklemek öneri açar.'
              : 'Bağlanmamış not yok.' }),
      }),

      K.Entry({
        label:'KAVRAM MATRİSİ',
        meta:kavramSatirlari.length + ' kavram',
        note:'Bir kavramda kaç ayrı yazar okunduğu, o kavramın ne kadar '
           + 'sentopik çalışıldığını söyler. Tek yazar bir başlangıçtır, '
           + 'bir eksiklik değil.',
        wide:true,
        body:kavramSatirlari.length
          ? K.Table({ tight:true,
              headers:['Kavram', { label:'Not', num:true }, { label:'Yazar', num:true }, ''],
              rows:kavramSatirlari.map(c => [
                c.label, String(c.notes), String(c.authors),
                K.Button({ label:'Notları gör', size:'sm', act:'filter-concept',
                  data:{ 'data-id':c.id } }),
              ]) })
          : K.Empty({ text:'Henüz kavram etiketli not yok.' }),
      }),
    ];
  }

  /* --------------------------------------------------------------- kaynaklar */

  function bookRows(){
    const kitaplar = S.books || [];
    const notSayisi = id => (S.notes || []).filter(n => n.bookId === id).length;

    return [
      K.Entry({
        label:'KAYNAKLAR', hint:'primary-text',
        meta:kitaplar.length + ' kayıt',
        note:'Primer metin sentez katsayısına girer, yorum girmez. '
           + 'Yoksa bir özet kitabı on filozof okumuş gibi görünürdü.',
        wide:true,
        body:kitaplar.length
          ? K.Table({ tight:true,
              headers:['Eser', 'Yazar', 'Tür', { label:'Not', num:true }, 'Durum', ''],
              rows:kitaplar.map(b => [
                b.title, b.author,
                b.kind === 'primary' ? 'primer' : 'yorum',
                String(notSayisi(b.id)),
                b.finishedAt ? 'bitti' : 'okunuyor',
                html`${K.Button({ label:b.finishedAt ? 'Yeniden aç' : 'Bitir', size:'sm',
                    act:'toggle-book', data:{ 'data-id':b.id } })}
                  ${K.Button({ label:'Sil', size:'sm', act:'del-book2',
                    data:{ 'data-id':b.id } })}`,
              ]) })
          : K.Empty({ text:'Kaynak listesi boş. Sempozyum → Metinler sekmesinden '
              + 'kanondan da ekleyebilirsin.' }),
      }),

      K.Entry({
        label:'KAYNAK EKLE',
        meta:'elle',
        body:html`
          <div class="cols-3">
            ${K.Field({ label:'Eser', input:K.Input({ id:'lb-title', placeholder:'Başlık' }) })}
            ${K.Field({ label:'Yazar', input:K.Input({ id:'lb-author', placeholder:'Yazar' }) })}
            ${K.Field({ label:'Tür', input:K.Select({ id:'lb-kind', value:'primary',
              options:[{ value:'primary', label:'Primer metin' },
                { value:'secondary', label:'Yorum' }] }) })}
          </div>
          ${K.Button({ label:'Ekle', tone:'primary', act:'add-book2', class:'mt-10' })}`,
      }),
    ];
  }

  /* ------------------------------------------------------------------ çizim */

  function render(){
    const tab = S.ui.readTab || 'notlar';
    const rows = tab === 'matris' ? matrixRows()
      : tab === 'kaynaklar' ? bookRows()
      : noteRows();

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'read-tab', aria:'Kütüphane sekmeleri',
          items:TABS.map(t => Object.assign({}, t,
            t.id === 'notlar' ? { count:(S.notes || []).length || null } : {})) }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  const handle = {
    async 'read-tab'(el){ S.ui.readTab = el.dataset.tab; ESP.App.render(); },

    async 'add-note'(){
      const t = val('note-text');
      if(!t){ ESP.UI.toast('Not boş'); return; }
      const kavramlar = ESP.Parse.extractConcepts(t).map(c => c.id);
      await M.saveNote(M.newNote({ text:t, bookId:val('note-book') || null,
        concepts:kavramlar }));
      ESP.Memo.bitir();
      ESP.UI.toast(kavramlar.length
        ? 'Not eklendi · ' + kavramlar.length + ' kavram bulundu'
        : 'Not eklendi · kavram bulunamadı');
      ESP.App.render();
    },

    async 'del-note'(el){
      await M.deleteNote(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'open-link'(el){
      S.ui.linkFrom = el.dataset.id;
      S.ui.readTab = 'notlar';
      ESP.App.render();
    },
    async 'close-link'(){ S.ui.linkFrom = null; ESP.App.render(); },

    async 'do-link'(el){
      const to = val('link-to'), why = val('link-why');
      const res = await M.linkNotes(el.dataset.id, to, why);
      if(!res.ok){ ESP.UI.toast(res.error); return; }
      S.ui.linkFrom = null;
      ESP.Memo.bitir();
      ESP.UI.toast('Bağ kuruldu');
      ESP.App.render();
    },

    async 'unlink'(el){
      await M.unlinkNotes(el.dataset.a, el.dataset.b);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'filter-concept'(el){
      S.ui.conceptFilter = el.dataset.id;
      S.ui.readTab = 'notlar';
      ESP.App.render();
    },
    async 'clear-concept'(){ S.ui.conceptFilter = null; ESP.App.render(); },

    async 'add-book2'(){
      const t = val('lb-title');
      if(!t){ ESP.UI.toast('Eser adı gerekir'); return; }
      await M.saveBook(M.newBook({ title:t, author:val('lb-author'),
        kind:val('lb-kind') || 'primary' }));
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'del-book2'(el){
      await M.deleteBook(el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'toggle-book'(el){
      const b = bookOf(el.dataset.id);
      if(!b) return;
      b.finishedAt = b.finishedAt ? null : U.todayISO();
      await M.saveBook(b);
      ESP.Memo.bitir();
      ESP.App.render();
    },
  };

  const change = {
    async 'note-query'(el){ S.ui.noteQuery = el.value; ESP.App.render(); },
  };

  return {
    id:'library',
    title:'Kütüphane',
    headline(){
      const ss = ESP.Intellect.syntopic();
      if(!ss.total) return 'Henüz atomik not yok.';
      const bagsiz = ss.total - ss.linked;
      if(bagsiz >= 3) return bagsiz + ' not hiçbir yere bağlı değil.';
      const oneri = ESP.Intellect.linkSuggestions(1);
      if(oneri.length) return 'İki not aynı kavramda buluşuyor.';
      return ss.linked + ' not bağlı.';
    },
    lede(){
      return 'Kaç sayfa okuduğun değil, kaç bağ kurduğun sayılır. '
           + 'Bağlanmamış not henüz sermaye değildir.';
    },
    stats(){
      const ss = ESP.Intellect.syntopic();
      return [
        { value:String(ss.total), label:'not' },
        { value:String(ss.linked), label:'bağlı' },
        { value:String(ss.books), label:'kaynak' },
        { value:ss.cert === 'missing' ? '—' : U.fmtNum(Math.round(ss.value * 100) / 100),
          label:'SSK' },
      ];
    },
    subtitle(){ return (S.notes || []).length + ' not · ' + (S.books || []).length + ' kaynak'; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/writing.js ==== */
/* Yazı Laboratuvarı — taslak, ölçüm ve üslup.

   İki sekme: Taslaklar · Ölçüm.

   Montaigne yargı vermez, ÖLÇER: cümle uzunluğu, tekrar eden kelime,
   okunabilirlik. «Bu deneme yayımlanmaya hazır» demek estetik otorite
   iddiasıdır ve ESP.Office.validate bunu yakalar.

   Okunabilirlik için Ateşman formülü kullanılır. Flesch Türkçede yanlış
   sonuç verir: Türkçe sondan eklemeli bir dildir, kelime başına hece sayısı
   doğal olarak yüksektir ve Flesch her Türkçe metni «çok zor» gösterir. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.writing = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C;

  const TABS = [
    { id:'taslaklar', label:'Taslaklar' },
    { id:'olcum',     label:'Ölçüm' },
  ];

  function acikTaslak(){
    const id = S.ui.draftOpen;
    return id ? (S.drafts || []).find(d => d.id === id) : null;
  }

  /* --------------------------------------------------------------- taslaklar */

  function draftRows(){
    const acik = acikTaslak();
    const rows = [];

    if(acik){
      const ok = ESP.Intellect.readability(acik.text);
      const tekrar = ESP.Intellect.repeats(acik.text);
      rows.push(K.Entry({
        label:'TASLAK',
        meta:acik.title || 'başlıksız',
        note:ok.cert === 'missing' ? 'Ölçüm için en az bir tam cümle gerekir.'
          : ok.words + ' kelime · ' + ok.sentences + ' cümle · cümle başına '
            + U.fmtNum(ok.wordsPerSentence) + ' kelime',
        action:html`${K.Button({ label:'Kapat', size:'sm', act:'close-draft' })}
          ${K.Button({ label:'Sil', size:'sm', act:'del-draft', data:{ 'data-id':acik.id } })}`,
        wide:true,
        body:html`
          ${K.Input({ id:'d-title', value:acik.title, placeholder:'Başlık' })}
          ${K.Textarea({ id:'d-text', rows:14, value:acik.text,
            placeholder:'Yazmaya başla…' })}
          <div class="row wrap mt-10">
            ${K.Button({ label:'Kaydet', tone:'primary', act:'save-draft',
              data:{ 'data-id':acik.id } })}
            ${K.Button({ label:'Revizyon olarak kaydet', act:'save-revision',
              data:{ 'data-id':acik.id } })}
            ${K.Button({ label:'Bugüne oturum yaz', act:'log-writing',
              data:{ 'data-id':acik.id } })}
          </div>
          <p class="small muted mt-8">«Revizyon» sayacı üslup ölçümüne girer:
            sürekli yeni taslak açıp hiçbirini revize etmemek en yaygın yazı
            tıkanmasıdır. Sayı bir hedef değil bir aynadır.</p>

          ${when(ok.cert !== 'missing', () => html`
            <div class="mt-12">
              ${K.Meter({ label:'Okunabilirlik (Ateşman)', value:Math.max(0, Math.min(100, ok.value)),
                text:U.fmtNum(ok.value) + ' · ' + ok.band.label })}
              <p class="small muted mt-8">${ok.band.note}
                Bant bir not değil bir tarif: felsefi bir metnin «zor» olması beklenir.</p>
            </div>`)}

          ${when(tekrar.length, () => html`
            <div class="mt-12">
              <p class="small muted">Üç kez ve üzeri geçen kelimeler:</p>
              <div class="row wrap mt-4">
                ${map(tekrar, t => K.Chip({ label:t.word + ' · ' + t.count }))}
              </div>
            </div>`)}`,
      }));
    }

    const liste = S.drafts || [];
    rows.push(K.Entry({
      label:'TASLAKLAR',
      meta:liste.length + ' taslak',
      action:K.Button({ label:'Yeni taslak', tone:'primary', size:'sm', act:'new-draft' }),
      wide:true,
      body:liste.length
        ? K.Table({ tight:true,
            headers:['Başlık', { label:'Kelime', num:true }, { label:'Revizyon', num:true },
              'Güncellendi', ''],
            rows:liste.map(d => {
              const ok = ESP.Intellect.readability(d.text);
              return [
                d.title || 'başlıksız',
                ok.cert === 'missing' ? '—' : U.fmtNum(ok.words),
                String(d.revisions || 0),
                U.fmtShort((d.updatedAt || '').slice(0, 10)),
                K.Button({ label:'Aç', size:'sm', act:'open-draft', data:{ 'data-id':d.id } }),
              ];
            }) })
        : K.Empty({ text:'Henüz taslak yok. Bir başlık ve bir paragraf yeter; '
            + 'ölçüm oradan başlar.',
            action:K.Button({ label:'Yeni taslak', tone:'primary', act:'new-draft' }) }),
    }));

    return rows;
  }

  /* ------------------------------------------------------------------ ölçüm */

  function measureRows(){
    const w = ESP.Intellect.wordsWritten(7);
    const r = ESP.Intellect.draftRatio();
    const h = ESP.Intellect.hoursOf('writing', 14);
    const hepsi = (S.drafts || []);
    const olculen = hepsi.map(d => ({ d, ok:ESP.Intellect.readability(d.text) }))
      .filter(x => x.ok.cert !== 'missing');

    return [
      K.Entry({
        label:'HAFTALIK ÜRETİM',
        meta:w.cert === 'missing' ? 'veri yok' : U.fmtNum(w.value) + ' kelime',
        note:w.cert === 'missing'
          ? 'Son 7 günde yazı oturumu girilmemiş. Taslağı açıp kapatmak üretim sayılmaz; '
            + 'oturumu Bugün ekranından ya da taslak sayfasından yazarsın.'
          : w.windowDays + ' günün ' + w.enteredDays + '\'inde yazı oturumu var.',
        body:w.cert === 'missing'
          ? K.Empty({ text:'Ölçüm için oturum kaydı gerekir.' })
          : K.Meter({ label:'Son 7 gün', value:Math.min(100, w.value / 3500 * 100),
              text:U.fmtNum(w.value) + ' kelime' }),
      }),

      K.Entry({
        label:'TASLAK–REVİZYON', hint:'draft-ratio',
        meta:r.cert === 'missing' ? 'veri yok'
          : U.fmtNum(Math.round(r.value * 10) / 10) + ' / taslak',
        note:'Sürekli yeni taslak açıp hiçbirini revize etmemek en yaygın yazı '
           + 'tıkanmasıdır. Oran bir hedef değil bir aynadır.',
        body:r.cert === 'missing'
          ? K.Empty({ text:'Henüz taslak yok.' })
          : html`${K.Meter({ label:r.drafts + ' taslak, ' + r.revisions + ' revizyon',
              value:Math.min(100, r.value * 50), text:U.fmtNum(Math.round(r.value * 10) / 10) })}`,
      }),

      K.Entry({
        label:'OKUNABİLİRLİK', hint:'readability',
        meta:olculen.length + ' taslak ölçüldü',
        note:'Ateşman formülü: 198,825 − 40,175 × (hece/kelime) − 2,610 × (kelime/cümle). '
           + 'Türkçede hece sayısı = ünlü harf sayısıdır; bu yüzden hece sayacı bir '
           + 'tahmin değil bir ölçümdür.',
        wide:true,
        body:olculen.length
          ? K.Table({ tight:true,
              headers:['Taslak', { label:'Puan', num:true }, 'Bant',
                { label:'Kelime/cümle', num:true }, { label:'Hece/kelime', num:true }],
              rows:olculen.map(x => [
                x.d.title || 'başlıksız',
                U.fmtNum(x.ok.value),
                x.ok.band.label,
                U.fmtNum(x.ok.wordsPerSentence),
                U.fmtNum(x.ok.syllablesPerWord),
              ]) })
          : K.Empty({ text:'Ölçülecek metin yok.' }),
      }),

      K.Entry({
        label:'PRATİK SÜRESİ',
        meta:h.cert === 'missing' ? 'veri yok' : U.fmtMin(h.minutes),
        note:h.cert === 'missing'
          ? 'Son 14 günde yazı oturumu yok.'
          : h.windowDays + ' günün ' + h.enteredDays + '\'inde kayıt var. '
            + 'Girilmemiş gün ortalamaya katılmaz.',
        body:h.cert === 'missing'
          ? K.Empty({ text:'Oturum girildiğinde ölçülmeye başlar.' })
          : K.Meter({ label:'Son 14 gün', value:Math.min(100, h.minutes / 420 * 100),
              text:U.fmtMin(h.minutes) }),
      }),

      K.Entry({
        label:'SINIR', hint:'pedagogic',
        meta:'ne söylenmez',
        note:'Bu ekran üslup yargılamaz.',
        body:K.Notice({ tone:'info',
          body:'«Kusursuz», «yayımlanmaya hazır», «şaheser» gibi ifadeler estetik '
            + 'otorite iddiasıdır ve ajan çıktısında yakalanır. Ölçülebilen şey '
            + 'söylenir: uzunluk, tekrar, akış.' }),
      }),
    ];
  }

  /* ------------------------------------------------------------------ çizim */

  function render(){
    const tab = S.ui.writeTab || 'taslaklar';
    const rows = tab === 'olcum' ? measureRows() : draftRows();

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'write-tab', aria:'Yazı sekmeleri',
          items:TABS.map(t => Object.assign({}, t,
            t.id === 'taslaklar' ? { count:(S.drafts || []).length || null } : {})) }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  function val(id){ const el = document.getElementById(id); return el ? el.value : ''; }

  const handle = {
    async 'write-tab'(el){ S.ui.writeTab = el.dataset.tab; ESP.App.render(); },

    async 'new-draft'(){
      const d = await M.saveDraft(M.newDraft({ title:'', text:'' }));
      S.ui.draftOpen = d.id;
      S.ui.writeTab = 'taslaklar';
      ESP.App.render();
    },

    async 'open-draft'(el){ S.ui.draftOpen = el.dataset.id; ESP.App.render(); },
    async 'close-draft'(){ S.ui.draftOpen = null; ESP.App.render(); },

    async 'save-draft'(el){
      const d = (S.drafts || []).find(x => x.id === el.dataset.id);
      if(!d) return;
      d.title = val('d-title').trim();
      d.text = val('d-text');
      await M.saveDraft(d);
      ESP.Memo.bitir();
      ESP.UI.toast('Kaydedildi');
      ESP.App.render();
    },

    async 'save-revision'(el){
      const d = (S.drafts || []).find(x => x.id === el.dataset.id);
      if(!d) return;
      d.title = val('d-title').trim();
      d.text = val('d-text');
      d.revisions = (d.revisions || 0) + 1;
      await M.saveDraft(d);
      ESP.Memo.bitir();
      ESP.UI.toast('Revizyon ' + d.revisions + ' kaydedildi');
      ESP.App.render();
    },

    async 'log-writing'(el){
      const d = (S.drafts || []).find(x => x.id === el.dataset.id);
      if(!d) return;
      const ok = ESP.Intellect.readability(val('d-text') || d.text);
      ESP.UI.sheet({
        title:'Yazı oturumu',
        body:String(html`
          <p class="small muted">Süre ölçümdür; kelime sayısı metinden sayıldı.</p>
          <div class="cols-2 mt-10">
            ${K.Field({ label:'Süre (dakika)',
              input:K.Input({ id:'wl-min', type:'number', numeric:true, min:1,
                placeholder:'40' }) })}
            ${K.Field({ label:'Kelime',
              input:K.Input({ id:'wl-words', type:'number', numeric:true,
                value:ok.cert === 'missing' ? '' : ok.words }) })}
          </div>`),
        footer:String(K.Button({ label:'Bugüne yaz', tone:'primary', act:'do-log-writing' })
          + K.Button({ label:'Vazgeç', act:'sheet-close' })),
      });
    },

    async 'do-log-writing'(){
      const dk = val('wl-min').trim();
      if(!dk){ ESP.UI.toast('Süre girilmedi'); return; }
      await M.addSession(U.todayISO(), {
        disc:'writing', minutes:dk, count:val('wl-words').trim(), note:'taslak',
      });
      ESP.Memo.bitir();
      ESP.UI.closeSheet();
      ESP.UI.toast('Bugüne yazıldı');
      ESP.App.render();
    },

    async 'del-draft'(el){
      await M.deleteDraft(el.dataset.id);
      S.ui.draftOpen = null;
      ESP.Memo.bitir();
      ESP.App.render();
    },
  };

  const change = {};

  return {
    id:'writing',
    title:'Yazı Laboratuvarı',
    headline(){
      const w = ESP.Intellect.wordsWritten(7);
      if(!(S.drafts || []).length) return 'Henüz taslak yok.';
      if(w.cert === 'missing') return 'Son 7 günde yazı oturumu girilmemiş.';
      return 'Son 7 günde ' + U.fmtNum(w.value) + ' kelime yazıldı.';
    },
    lede(){
      const r = ESP.Intellect.draftRatio();
      if(r.cert === 'missing') return 'Bir başlık ve bir paragraf yeter; ölçüm oradan başlar.';
      return r.drafts + ' taslak, taslak başına '
        + U.fmtNum(Math.round(r.value * 10) / 10) + ' revizyon. '
        + 'Ölçülen şey üslup değil: uzunluk, tekrar, akış.';
    },
    stats(){
      const w = ESP.Intellect.wordsWritten(7);
      const r = ESP.Intellect.draftRatio();
      const son = (S.drafts || [])[0];
      const ok = son ? ESP.Intellect.readability(son.text) : { cert:'missing' };
      return [
        { value:String((S.drafts || []).length), label:'taslak' },
        { value:w.cert === 'missing' ? '—' : U.fmtNum(w.value), label:'kelime / 7g' },
        { value:r.cert === 'missing' ? '—' : String(r.revisions), label:'revizyon' },
        { value:ok.cert === 'missing' ? '—' : U.fmtNum(ok.value), label:'okunabilirlik' },
      ];
    },
    subtitle(){ return (S.drafts || []).length + ' taslak'; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/office.js ==== */
/* Ofis — yedi masa ve aralarındaki devir.

   Patron dört uzmanın yanına dizilmez, ÜSTÜNE konur: kendi defteri kendi
   işi değil, trafiğin kendisidir.

   Masa notu bir tavsiye değil BULGUDUR: koşul sağlandığında kendiliğinden
   düşer, koşul geçtiğinde kendiliğinden kalkar. Kullanıcı silmez.

   Masanın sol kenarındaki kimlik şeridi bir DURUM değil bir İMZADIR:
   masanın kime ait olduğunu söyler. Durum renkleri (kırmızı/sarı/yeşil)
   kimlik şeridinde asla kullanılmaz; aciliyet yalnızca devir okuna dokunur.
   İki renk sistemi aynı yüzeyde karışmaz. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.office = (function(){
  const U = ESP.U, S = ESP.S;
  const { html, raw, when, map, cls } = ESP.h;
  const K = ESP.C;

  function avatar(a){
    return html`<span class="agentav" style="background:${a.color}"
      aria-hidden="true">${a.initial}</span>`;
  }

  /* --------------------------------------------------------------- masalar */

  function deskCard(a){
    const notlar = ESP.Office.notes(a.id);
    const devir = ESP.Office.handoffsFor(a.id);
    const hazir = ESP.Office.ready(a.id);

    return K.Card({
      box:true,
      class:'desk desk--' + a.id,
      title:html`${avatar(a)} ${a.short || a.name}`,
      sub:a.role,
      badge:K.Badge({ label:hazir ? 'model bağlı' : 'kural motoru',
        tone:hazir ? 'info' : 'muted' }),
      body:html`
        ${notlar.length
          ? html`<ul class="desknotes">${map(notlar, n => html`
              <li class="${cls('desknote', 'desknote--' + n.tone)}">
                <span class="desknote__label">${n.label}</span>
                <span class="desknote__text">${n.text}</span>
                ${when(n.route, () => K.Button({ label:'Aç', size:'sm', act:'go',
                  data:{ 'data-route':n.route } }))}
              </li>`)}</ul>`
          : html`<p class="small muted">Bu masada bekleyen bulgu yok.</p>`}

        ${when(devir.in.length || devir.out.length, () => html`
          <div class="deskflow">
            ${map(devir.in, h => html`<div class="deskflow__row deskflow__row--in">
              <span class="deskflow__arrow">←</span>
              <span><b>${h.fromName}</b> ${h.finding}</span>
            </div>`)}
            ${map(devir.out, h => html`<div class="deskflow__row deskflow__row--out">
              <span class="deskflow__arrow">→</span>
              <span><b>${h.toName}</b> ${h.finding}</span>
            </div>`)}
          </div>`)}`,
      foot:html`${K.Button({ label:'Danış', size:'sm', act:'open-agent',
          data:{ 'data-agent':a.id } })}
        ${when(a.owns && a.owns.length, () => K.Button({ label:'Masaya git', size:'sm',
          act:'go', data:{ 'data-route':a.owns[0] } }))}`,
    });
  }

  function render(){
    const patron = ESP.AGENT_BY_ID.patron;
    const uzmanlar = ESP.AGENTS.filter(a => a.id !== 'patron');
    const devir = ESP.Office.handoffs();
    const brf = ESP.Office.patronBrief();
    const next = brf.next;

    return K.Grid(html`
      ${K.Span(12, K.Ledger(() => [

        K.Entry({
          label:'PATRON', hint:'rule-engine',
          meta:ESP.Office.ready('patron') ? 'model bağlı' : 'kural motoru',
          note:'Patron kendi hesabını yapmaz: altı uzmanın raporunu okur, '
             + 'çelişkiyi öncelik sırasına göre çözer.',
          action:K.Button({ label:'Danış', size:'sm', act:'open-agent',
            data:{ 'data-agent':'patron' } }),
          body:html`
            ${K.NextUp({ icon:next.rank ? 'zap' : 'check', calm:!next.rank,
              label:'Sıradaki tek iş', title:next.title, why:next.why })}
            <p class="rulesay mt-10">${ESP.Office.ruleText('patron', brf)}</p>`,
        }),

        K.Entry({
          label:'MASALAR ARASI DEVİR', hint:'handoff',
          meta:devir.length ? devir.length + ' devir' : 'yok',
          note:'Devir bir tavsiye değildir: «şu ölçüldü, şu masaya düşüyor» der. '
             + 'Ölçülmemiş bir şey devredilemez — tahmin devir üretmez.',
          wide:true,
          body:devir.length
            ? html`${map(devir, h => html`
                <button class="handoff" data-act="go" data-route="${h.route}">
                  <span class="handoff__from">${h.fromName}</span>
                  <span class="handoff__arrow">→</span>
                  <span class="handoff__to">${h.toName}</span>
                  <span class="handoff__text">${h.finding}</span>
                </button>`)}`
            : K.Empty({ text:'İki masayı birbirine bağlayan ölçülmüş bir bulgu yok.' }),
        }),

        K.Entry({
          label:'UZMAN MASALARI',
          meta:uzmanlar.length + ' masa',
          note:'Her ajan yalnızca kendi alanına bakar. Alan dışı bir soru gelirse '
             + 'sahibine yönlendirir, cevap uydurmaz.',
          wide:true,
          /* Masa kartlarinin basligi h3'tur; araya bir h2 girmezse baslik
             sirasi h1'den h3'e atlar ve ekran okuyucu bir seviye kaybeder. */
          body:html`${K.SectionTitle('Uzman masaları')}
            <div class="desks">${map(uzmanlar, deskCard)}</div>`,
        }),

        K.Entry({
          label:'ÖNCELİK SIRASI', hint:'precedence',
          meta:ESP.PRECEDENCE.length + ' kural',
          note:'İki uzman ters şey söylediğinde Patron bu sıraya uyar. '
             + 'Üstteki alttakini her zaman yener.',
          body:K.Table({ tight:true, headers:[{ label:'#', num:true }, 'Kural', 'Neden'],
            rows:ESP.PRECEDENCE.map(p => [String(p.rank), p.label, p.note]) }),
        }),

      ]))}`);
  }

  const handle = {
    async 'open-agent'(el){
      S.ui.officeAgent = el.dataset.agent;
      ESP.App.go('team');
    },
  };

  const change = {};

  return {
    id:'office',
    title:'Masalar',
    headline(){
      const n = ESP.Office.notes().filter(x => x.tone === 'danger').length;
      if(n) return n + ' masada tıkanma bulgusu var.';
      const d = ESP.Office.handoffs();
      if(d.length) return d.length + ' bulgu başka bir masaya düşüyor.';
      return 'Masalarda bekleyen bulgu yok.';
    },
    lede(){
      return 'Yedi masa: Patron ve altı uzman. Her masa yalnızca kendi '
           + 'ölçümüne bakar; çelişkiyi Patron çözer.';
    },
    stats(){
      const notlar = ESP.Office.notes();
      return [
        { value:String(ESP.AGENTS.length), label:'masa' },
        { value:String(notlar.filter(n => n.tone === 'danger').length), label:'tıkanma' },
        { value:String(notlar.filter(n => n.tone === 'warn').length), label:'vadesi geçmiş' },
        { value:String(ESP.Office.handoffs().length), label:'devir' },
      ];
    },
    subtitle(){ return ESP.Office.notes().length + ' bulgu'; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/team.js ==== */
/* Danışma — bir masayla konuşma.

   Her cümlenin altında hangi kaynaktan geldiği yazar: «model» ya da «kural
   motoru». Bu rozet süs değildir — kullanıcının bir cümleye ne kadar
   güveneceğini belirler.

   Brifingin ham JSON'u açılabilir. Kullanıcı ajanın ne gördüğünü tam olarak
   görebilmelidir; görmediği bir şeye dayanarak konuşamaz. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};
