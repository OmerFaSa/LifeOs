      return { k:clampK(0.85 + oran * 0.3), cert:'derived',
        why:'Notların %' + Math.round(oran * 100) + '\'i bağlanmış.' };
    }

    if(discId === 'music'){
      const p = ESP.Acoustic ? ESP.Acoustic.progressRatio() : { value:null, cert:'missing' };
      if(p.cert === 'missing') return yok;
      return { k:clampK(0.85 + p.value * 0.3), cert:'derived',
        why:'Parçaların %' + Math.round(p.value * 100) + '\'i hedef tempoda.' };
    }

    if(discId === 'writing'){
      const w = draftRatio();
      if(w.cert === 'missing') return yok;
      return { k:clampK(0.85 + Math.min(1, w.value) * 0.3), cert:'derived',
        why:'Taslak başına ' + U.fmtNum(Math.round(w.value * 10) / 10) + ' revizyon.' };
    }

    return yok;
  }

  function clampK(v){ return Math.min(1.15, Math.max(0.85, v)); }

  /* Bir disiplinin son N gundeki olculmus saati.

     `days` kac gun geriye bakildigini, `entered` o araliktaki KAC GUNDE
     kayit bulundugunu soyler. Ikisi farkliysa ekran bunu yazar. */
  function hoursOf(discId, days){
    const n = days || 14;
    const gunler = U.lastDays(n);
    let dakika = 0, girilen = 0;
    gunler.forEach(d => {
      const m = ESP.Model.minutesOf(d, discId);
      if(m == null) return;                    // veri yok — sifir sayilmaz
      dakika += m; girilen++;
    });
    return {
      hours:dakika / 60,
      minutes:dakika,
      enteredDays:girilen,
      windowDays:n,
      cert:girilen ? 'measured' : 'missing',
    };
  }

  function ehs(days){
    const n = days || 14;
    const rows = ESP.DISCIPLINES.map(d => {
      const h = hoursOf(d.id, n);
      const k = qualityCoef(d.id);
      return {
        disc:d, hours:h.hours, enteredDays:h.enteredDays, cert:h.cert,
        k:k.k, kCert:k.cert, kWhy:k.why,
        score:h.cert === 'missing' ? null : d.weight * h.hours * k.k,
      };
    });
    const olculen = rows.filter(r => r.score != null);
    const gunler = new Set();
    U.lastDays(n).forEach(d => { if(ESP.Model.dayHasEntry(S.days[d])) gunler.add(d); });

    return {
      value:olculen.length ? olculen.reduce((a, r) => a + r.score, 0) : null,
      cert:olculen.length ? 'derived' : 'missing',
      rows,
      windowDays:n,
      enteredDays:gunler.size,
      /* Hic dokunulmamis disiplinler ayrica doner: EHS'nin dusuk olmasi ile
         bir disiplinin hic acilmamis olmasi ayri iki bulgudur. */
      untouched:rows.filter(r => r.cert === 'missing').map(r => r.disc.id),
    };
  }

  /* ==================================================================== SSK

     Sentopik Sentez Katsayisi:

       SSK = (Baglantili_Notlar / Toplam_Kitap) × log(1 + Yazar_Sayisi)

     Orijinal formul log(Yazar_Sayisi) idi ve tek yazarda log(1) = 0 tum
     sentezi sifirliyordu: bir kitabi derinlemesine analiz eden kullanici
     cezalandiriliyordu. log(1 + n) bu tekilligi giderir ve n = 0 (henuz
     kitap yok) durumunda da tanimli kalir.

     Payda "toplam kitap"tir, "toplam not" degil: olcuyu buyuten sey nota
     bolunmus bir kitap degil, kitaplar ARASI baglardir. */
  function syntopic(){
    const notlar = S.notes || [];
    const kitaplar = S.books || [];
    if(!notlar.length && !kitaplar.length){
      return { value:null, cert:'missing', linked:0, total:0, books:0, authors:0, linkedRatio:0 };
    }
    const baglantili = notlar.filter(n => (n.links || []).length > 0).length;
    const yazarlar = new Set(kitaplar.map(b => U.norm(b.author || '')).filter(Boolean));
    const kitapSayisi = kitaplar.length;

    if(!kitapSayisi){
      /* Kitap yokken bolme yapilamaz. "0" demek yerine hesabin neden
         yapilamadigi soylenir. */
      return { value:null, cert:'missing', linked:baglantili, total:notlar.length,
        books:0, authors:yazarlar.size, linkedRatio:notlar.length ? baglantili / notlar.length : 0,
        why:'Henüz kaynak girilmemiş; katsayının paydası kitap sayısıdır.' };
    }

    const value = (baglantili / kitapSayisi) * Math.log(1 + yazarlar.size);
    return {
      value, cert:'derived',
      linked:baglantili, total:notlar.length,
      books:kitapSayisi, authors:yazarlar.size,
      linkedRatio:notlar.length ? baglantili / notlar.length : 0,
    };
  }

  /* Hic baglanmamis notlar — okunmus ama yerlesmemis. */
  function unlinkedNotes(){
    return (S.notes || []).filter(n => !(n.links || []).length);
  }

  /* Iki notu birlestirebilecek ortak kavramlar. Oneri URETIR, bag KURMAZ:
     bagin nedenini kullanici yazar, sistem uyduramaz. */
  function linkSuggestions(limit){
    const notlar = S.notes || [];
    const out = [];
    for(let i = 0; i < notlar.length; i++){
      for(let j = i + 1; j < notlar.length; j++){
        const a = notlar[i], b = notlar[j];
        if((a.links || []).some(l => l.to === b.id)) continue;
        const ortak = (a.concepts || []).filter(c =>
          (b.concepts || []).some(x => U.norm(x) === U.norm(c)));
        if(!ortak.length) continue;
        /* Ayni kaynaktan iki not zaten aynı yazari paylasir; sentopik olan
           FARKLI kaynaklar arasindaki bagdir ve once o onerilir. */
        const farkliKaynak = a.bookId && b.bookId && a.bookId !== b.bookId;
        out.push({ a, b, concepts:ortak, cross:farkliKaynak,
          score:ortak.length + (farkliKaynak ? 2 : 0) });
      }
    }
    return out.sort((x, y) => y.score - x.score).slice(0, limit || 8);
  }

  /* ============================================================ arguman

     Bir tez ACIK kalir: cevaplanmamis itirazi varsa kapanmaz. */

  function openArguments(){
    return (S.args || []).filter(a => a.status === 'open');
  }

  /* 14+ gundur dokunulmamis acik tezler. Bu bir suclama degil bir
     hatirlatmadir: dusunce askida kalmis demektir. */
  function stalledArguments(days, todayISO){
    const n = days || 14;
    const today = todayISO || U.todayISO();
    return openArguments().filter(a => {
      const at = (a.updatedAt || a.createdAt || '').slice(0, 10);
      return at && U.diffDays(at, today) >= n;
    });
  }

  /* Safsata denetimi.

     Kalip tabanlidir ve KESIN DEGILDIR: "bulgu" olarak isaretler, yargi
     vermez. Bir kalibin yakalanmasi argumanin yanlis oldugunu gostermez,
     bakmaya deger oldugunu gosterir. Ekranda bu cumleyle birlikte durur. */
  const FALLACIES = [
    { id:'ad-hominem', label:'Kişiye saldırı',
      re:ESP.trRe('(cahil|aptal|salak)|zaten[^.!?]{0,20}(bilmiyor|anlamıyor)|sen kimsin'),
      note:'Tezin sahibine değil tezin kendisine bakılır.' },
    { id:'straw-man', label:'Korkuluk adam',
      re:ESP.trRe('(yani sen|demek ki sen|yani diyorsun ki)[^.!?]{0,40}'
        + '(diyorsun|savunuyorsun|istiyorsun)'),
      note:'Karşı tezin en güçlü hâli çürütülür, en zayıf hâli değil.' },
    { id:'slippery-slope', label:'Kaygan zemin',
      re:ESP.trRe('(sonunda|eninde sonunda|er geç)[^.!?]{0,50}'
        + '(gider|varır|döner|yol açar)'),
      note:'Her adımın kaçınılmaz olduğu ayrı ayrı gösterilmeli.' },
    { id:'false-dilemma', label:'Yanlış ikilem',
      re:ESP.trRe('ya [^.!?]{1,30} ya da |başka (bir )?(seçenek|yol) yok'),
      note:'Üçüncü bir seçenek var mı diye sorulur.' },
    { id:'appeal-authority', label:'Otoriteye başvuru',
      re:ESP.trRe('[' + ESP.TR_LETTERS + ']+ (böyle )?(dediği|söylediği) için'
        + '|bilim insanları diyor ki|herkes biliyor ki'),
      note:'Kimin söylediği değil, hangi gerekçeyle söylediği önemlidir.' },
    { id:'circular', label:'Döngüsel akıl yürütme',
      re:ESP.trRe('çünkü[^.!?]{0,40}doğru(dur)?[^.!?]{0,20}çünkü'),
      note:'Sonuç, kendi öncülü olarak kullanılmış olabilir.' },
  ];

  function checkFallacies(text){
    const s = String(text || '');
    if(!s.trim()) return [];
    return FALLACIES.filter(f => f.re.test(s))
      .map(f => ({ id:f.id, label:f.label, note:f.note }));
  }

  /* ====================================================== okunabilirlik

     Turkce icin Atesman formulu kullanilir:

       OS = 198,825 − 40,175 × (hece / kelime) − 2,610 × (kelime / cumle)

     Ingilizce icin gelistirilmis Flesch, Turkcede yanlis sonuc verir: Turkce
     sondan eklemeli bir dildir ve kelime basina hece sayisi dogal olarak
     yuksektir; Flesch her Turkce metni "cok zor" gosterir. Atesman ayni
     fikri Turkce uzerinde kalibre eder.

     Hece sayimi Turkce'de kolaydir: HECE SAYISI = SESLI HARF SAYISI.
     Kural istisnasizdir; bu yuzden hece sayaci bir tahmin degil bir
     olcumdur.

     Bu bir KALITE YARGISI DEGILDIR. Uzun cumle kotu degildir; farkinda
     olmadan uzayan cumle sorundur. Gosterge kullanicinin kendi gecmis
     metinleriyle karsilastirilir. */
  const SESLILER = 'aeıioöuüâîû';

  function syllables(word){
    let n = 0;
    const w = String(word).toLocaleLowerCase('tr-TR');
    for(let i = 0; i < w.length; i++) if(SESLILER.indexOf(w[i]) >= 0) n++;
    return n;
  }

  function readability(text){
    const s = String(text || '').trim();
    if(!s){
      return { value:null, cert:'missing', words:0, sentences:0, syllables:0,
        band:null, why:'Metin boş.' };
    }
    /* Cumle ayraci: nokta, soru, unlem. Sayi icindeki nokta ayrac DEGILDIR
       ("1.500 lira" tek parcadir) — devir notundaki tuzagin ayni. */
    const cumleler = s.split(/(?<!\d)[.!?]+(?!\d)|\n{2,}/)
      .map(x => x.trim()).filter(Boolean);
    const kelimeler = s.split(/\s+/).map(w => w.replace(/[^\wçğıöşüÇĞİÖŞÜâîû]/gi, ''))
      .filter(Boolean);
    if(!kelimeler.length || !cumleler.length){
      return { value:null, cert:'missing', words:kelimeler.length,
        sentences:cumleler.length, syllables:0, band:null,
        why:'Ölçüm için en az bir tam cümle gerekir.' };
    }
    const hece = kelimeler.reduce((a, w) => a + syllables(w), 0);
    const hkOran = hece / kelimeler.length;
    const kcOran = kelimeler.length / cumleler.length;
    const os = 198.825 - 40.175 * hkOran - 2.610 * kcOran;

    return {
      value:Math.round(os * 10) / 10,
      cert:'derived',
      words:kelimeler.length, sentences:cumleler.length, syllables:hece,
      wordsPerSentence:Math.round(kcOran * 10) / 10,
      syllablesPerWord:Math.round(hkOran * 100) / 100,
      band:bandOf(os),
    };
  }

  /* Atesman'in kendi bant tablosu. Bant bir NOT degil bir tarif:
     "zor" kotu demek degildir — felsefi bir metnin zor olmasi beklenir. */
  function bandOf(os){
    if(os >= 90) return { id:'cok-kolay', label:'Çok kolay',  note:'İlkokul düzeyi.' };
    if(os >= 70) return { id:'kolay',     label:'Kolay',      note:'Ortaokul düzeyi.' };
    if(os >= 50) return { id:'orta',      label:'Orta güçlük', note:'Lise düzeyi; çoğu deneme burada.' };
    if(os >= 30) return { id:'zor',       label:'Zor',        note:'Üniversite düzeyi; akademik ve felsefi metinler burada.' };
    return { id:'cok-zor', label:'Çok zor', note:'Uzmanlık metni. Kasıtlı değilse cümleler kısaltılabilir.' };
  }

  /* Tekrarlanan kelimeler — uslup degil OLCUM. En sik gecen dolu kelimeler.
     Baglaclar ve edatlar sayilmaz; sayilsaydi her metnin basinda "ve" olurdu. */
  const DURAK = new Set(('ve veya ile bir bu şu o da de ki için gibi ama fakat ancak '
    + 'çünkü daha çok en her hiç ise ne mi mı mu mü olarak olan olduğu var yok '
    + 'ben sen biz siz onlar kadar sonra önce göre').split(' '));

  function repeats(text, limit){
    const s = String(text || '').toLocaleLowerCase('tr-TR');
    const say = {};
    s.split(/[^\wçğıöşüâîû]+/i).filter(Boolean).forEach(w => {
      if(w.length < 4 || DURAK.has(w)) return;
      say[w] = (say[w] || 0) + 1;
    });
    return Object.keys(say).filter(w => say[w] >= 3)
      .map(w => ({ word:w, count:say[w] }))
      .sort((a, b) => b.count - a.count)
      .slice(0, limit || 6);
  }

  /* Taslak basina revizyon orani. Surekli yeni taslak acip hicbirini revize
     etmemek en yaygin yazi tikanmasidir. Oran bir hedef degil bir aynadir. */
  function draftRatio(){
    const d = S.drafts || [];
    if(!d.length) return { value:null, cert:'missing', drafts:0, revisions:0 };
    const rev = d.reduce((a, x) => a + (x.revisions || 0), 0);
    return { value:rev / d.length, cert:'derived', drafts:d.length, revisions:rev };
  }

  /* Son N gunde uretilen kelime. Taslagin kendi kelime sayisindan degil,
     gun kayitlarindaki yazi oturumlarindan gelir — yoksa eski bir taslagi
     acip kapatmak "uretim" sayilirdi. */
  function wordsWritten(days){
    const n = days || 7;
    let toplam = 0, gun = 0;
    U.lastDays(n).forEach(d => {
      const rows = ESP.Model.sessionsOf(d)
        .filter(s => s.disc === 'writing' && s.countCert !== 'missing' && s.count != null);
      if(!rows.length) return;
      toplam += rows.reduce((a, s) => a + s.count, 0);
      gun++;
    });
    return { value:gun ? toplam : null, cert:gun ? 'measured' : 'missing',
      enteredDays:gun, windowDays:n };
  }

  return {
    /* hacim */
    hoursOf, qualityCoef, ehs,
    /* sentez */
    syntopic, unlinkedNotes, linkSuggestions,
    /* arguman */
    openArguments, stalledArguments, checkFallacies, FALLACIES,
    /* yazi */
    readability, bandOf, syllables, repeats, draftRatio, wordsWritten,
  };
})();

/* ==== js/core/acoustic.js ==== */
/* Akustik katman — metronom, temiz BPM esigi ve artikulasyon olcumu.

   Iki ajan bu dosyayi PAYLASIR: Maestro (muzik) ve Demosthenes (diksiyon).
   Kasitlidir — ikisi de ayni ham girdiyi (zamanlama ve tekrar) farkli
   esiklerle okur. Kod tekrari yerine tek bir sinyal isleme katmani.

   Ortak olan sey su fikirdir: HIZ BIR SONUCTUR, HEDEF DEGIL. Temiz calinan
   BPM hizli calinan BPM'den once gelir; temiz konusulan hiz hizli
   konusulandan once gelir. Ikisinde de olcut "hatasiz tekrar"dir.

   Dikkat: bu dosya SES DINLEMEZ. Tarayicinin mikrofonunu acmaz, konusma
   tanima modeli kullanmaz, kayit tutmaz. Olctugu sey kullanicinin kendi
   isaretledigi tekrarlar ve zamanlayicinin verdigi suredir. Bu bir eksiklik
   degil bir karardir: olmayan ses dosyasi sizamaz. */

window.ESP = window.ESP || {};

ESP.Acoustic = (function(){
  const U = ESP.U;
  const S = ESP.S;

  /* Esigin acilmasi icin gereken temiz tekrar sayisi.

     Ucu birden ayni BPM'de olmali ve son 14 gun icinde gelmis olmali:
     uc ay once yapilmis bir temiz tekrar bugunun esigini acmaz. */
  const CLEAN_STREAK = 3;
  const CLEAN_WINDOW_DAYS = 14;

  /* Plato esigi — ESP.PRECEDENCE'daki "tikanmis temel" ile ayni sayi. */
  const PLATEAU_DAYS = 14;

  /* BPM merdiveni: esik acildiginda bir sonraki basamak. Kucuk adim
     kasitlidir — %10'luk siçramalar temizligi bozar ve kullaniciyi geri
     dondurur. */
  const BPM_STEP = 4;

  /* ------------------------------------------------------------ metronom

     Zamanlama hesabi burada, ses uretimi ekranda. Boylece metronom
     matematigi test edilebilir: bir tarayici olmadan "80 BPM'de 4/4 olcude
     ilk vurus nereye duser" sorusu cevaplanir. */
  function beatMs(bpm){
    const b = Number(bpm);
    if(!isFinite(b) || b <= 0) return null;
    return 60000 / b;
  }

  /* Bir olcudeki vurus zamanlari (ms). `accent` ilk vurusu isaretler:
     metronomun isini yapan sey vurusun kendisi degil, olcunun NEREDE
     basladigini duyurmasidir. */
  function beatsOfBar(bpm, beatsPerBar){
    const ms = beatMs(bpm);
    if(ms == null) return [];
    const n = Math.max(1, Math.min(16, beatsPerBar || 4));
    const out = [];
    for(let i = 0; i < n; i++) out.push({ index:i, at:Math.round(i * ms), accent:i === 0 });
    return out;
  }

  /* --------------------------------------------------------- temiz esik

     Kural: esik KENDILIGINDEN ARTAR, KENDILIGINDEN DUSMEZ.

     Bir kotu gun kazanilmis esigi geri almaz — yoksa hastalikli bir hafta
     aylarin kazanimini siler ve kullanici sisteme guvenmeyi birakir. Esigin
     dusmesi yalnizca kullanicinin kendi elindedir (parcayi sifirlamak). */
  function cleanThreshold(piece, todayISO){
    const p = piece || {};
    const today = todayISO || U.todayISO();
    const sinir = U.iso(U.addDays(U.parse(today), -CLEAN_WINDOW_DAYS));
    const temiz = (p.attempts || [])
      .filter(a => a.clean && a.date >= sinir && typeof a.bpm === 'number');

    if(!temiz.length){
      /* Pencerede temiz tekrar yok: kayitli esik varsa o durur (dusmez),
         yoksa "veri yok". */
      return p.cleanBpm != null
        ? { value:p.cleanBpm, cert:'measured', fresh:false, n:0 }
        : { value:null, cert:'missing', fresh:false, n:0 };
    }

    /* Hangi BPM'de en az CLEAN_STREAK temiz tekrar var? En yuksegi esiktir. */
    const sayac = {};
    temiz.forEach(a => { sayac[a.bpm] = (sayac[a.bpm] || 0) + 1; });
    const acilan = Object.keys(sayac)
      .map(Number)
      .filter(bpm => sayac[bpm] >= CLEAN_STREAK)
      .sort((a, b) => b - a);

    if(!acilan.length){
      return p.cleanBpm != null
        ? { value:p.cleanBpm, cert:'measured', fresh:false, n:temiz.length,
            why:'Bu pencerede hiçbir tempoda ' + CLEAN_STREAK + ' temiz tekrar yok.' }
        : { value:null, cert:'missing', fresh:false, n:temiz.length,
            why:CLEAN_STREAK + ' temiz tekrar gerekir; ' + temiz.length + ' var.' };
    }

    const yeni = acilan[0];
    const onceki = p.cleanBpm != null ? p.cleanBpm : 0;
    return {
      value:Math.max(yeni, onceki),       // dusmez
      cert:'measured', fresh:yeni > onceki, n:sayac[yeni],
    };
  }

  /* Bir tekrari kaydeder ve esigi yeniden hesaplar.

     `clean` kullanicinin isaretidir: sistem duymaz. Bu yuzden tekrarin
     kendisi "olculdu" (BPM ve tarih makineden), temizlik yargisi ise
     kullanicinindir — ikisi ayri alanlarda durur ve karistirilmaz. */
  async function logAttempt(pieceId, bpm, clean, note){
    const p = (S.pieces || []).find(x => x.id === pieceId);
    if(!p) return { ok:false, error:'Parça bulunamadı.' };
    const n = Number(bpm);
    if(!isFinite(n) || n <= 0) return { ok:false, error:'Tempo girilmedi.' };

    p.attempts = (p.attempts || []).concat([{
      date:U.todayISO(), bpm:Math.round(n), clean:!!clean, note:note || '',
      at:new Date().toISOString(),
    }]);

    const onceki = p.cleanBpm;
    const esik = cleanThreshold(p);
    if(esik.cert === 'measured' && (p.cleanBpm == null || esik.value > p.cleanBpm)){
      p.cleanBpm = esik.value;
      p.thresholdAt = U.todayISO();
    }
    await ESP.Model.savePiece(p);
    return { ok:true, piece:p, threshold:esik, raised:p.cleanBpm !== onceki };
  }

  /* Bir sonraki basamak. Esik yoksa oneri de yoktur: olculmemis bir seyin
     ustune basamak konmaz. */
  function nextStep(piece){
    const t = cleanThreshold(piece);
    if(t.cert === 'missing') return { value:null, cert:'missing' };
    return { value:t.value + BPM_STEP, cert:'derived', from:t.value };
  }

  /* --------------------------------------------------------------- plato

     Bir teknikte PLATEAU_DAYS gundur esigin artmamasi. Plato bir
     basarisizlik degil bir sinyaldir: ayni calisma ayni sonucu veriyorsa
     degismesi gereken sey calismanin kendisidir.

     Hic calisilmamis parca PLATO SAYILMAZ — plato calisan bir seyin
     durmasidir, hic baslamamis bir seyin degil. */
  function plateaus(todayISO){
    const today = todayISO || U.todayISO();
    return (S.pieces || []).filter(p => {
      if(p.cleanBpm == null) return false;                 // henuz esik yok
      const sonDeneme = (p.attempts || []).reduce((m, a) => a.date > m ? a.date : m, '');
      if(!sonDeneme) return false;
      if(U.diffDays(sonDeneme, today) > PLATEAU_DAYS) return false;  // calisilmiyor, plato degil
      const esikTarihi = p.thresholdAt || sonDeneme;
      return U.diffDays(esikTarihi, today) >= PLATEAU_DAYS;
    }).map(p => ({
      piece:p,
      days:U.diffDays(p.thresholdAt || '', today),
      bpm:p.cleanBpm,
    }));
  }

  /* Hedefe ulasmis parca orani — EHS'nin muzik kalite katsayisi buradan gelir.
     Hedefi girilmemis parca paydaya GIRMEZ: hedefsiz parca basarisiz degildir. */
  function progressRatio(){
    const hedefli = (S.pieces || []).filter(p => p.targetBpm != null && p.cleanBpm != null);
    if(!hedefli.length) return { value:null, cert:'missing', n:0 };
    const ulasan = hedefli.filter(p => p.cleanBpm >= p.targetBpm).length;
    return { value:ulasan / hedefli.length, cert:'derived', n:hedefli.length, reached:ulasan };
  }

  /* ==================================================== artikulasyon (diksiyon)

     WPM = kelime / dakika. Iki girdinin de OLCULMUS olmasi sarttir; biri
     eksikse hesap yapilmaz — "tahmini WPM" diye bir sey yoktur.

     Yuksek WPM iyi degildir; hedef banda yakin WPM iyidir. Bant bir kural
     degil bir baslangic cizgisidir ve kullanicinin kendi kayitlari onu
     yerine oturtur. */
  const WPM_BAND = { min:120, max:150,
    note:'Türkçe sunumda rahat izlenen bant. Kendi kayıtların bu bandı kaydırabilir.' };

  function wpmOf(rec){
    const r = rec || {};
    if(r.secondsCert === 'missing' || r.wordsCert === 'missing') {
      return { value:null, cert:'missing',
        why:'WPM için hem süre hem kelime sayısı ölçülmüş olmalı.' };
    }
    if(!r.seconds || r.seconds <= 0) return { value:null, cert:'missing' };
    return { value:Math.round(r.words / (r.seconds / 60)), cert:'derived' };
  }

  /* Hata orani — kullanicinin kendi isaretledigi hata sayisindan.
     DAIMA "tahmin" etiketi tasir: sistem sesini dinlemedi. */
  function errorRateOf(rec){
    const r = rec || {};
    if(r.errorsCert === 'missing' || r.wordsCert === 'missing' || !r.words){
      return { value:null, cert:'missing' };
    }
    return { value:r.errors / r.words, cert:'estimated' };
  }

  /* Son N kaydin ozeti. Karsilastirma DAIMA kendi gecmisiyle yapilir;
     baskasinin WPM'i ile karsilastirma yapilmaz. */
  function dictionStatus(days, todayISO){
    const n = days || 30;
    const today = todayISO || U.todayISO();
    const sinir = U.iso(U.addDays(U.parse(today), -n));
    const kayitlar = (S.recordings || []).filter(r => r.date >= sinir);
    if(!kayitlar.length){
      return { cert:'missing', n:0, windowDays:n,
        why:'Son ' + n + ' günde diksiyon kaydı yok.' };
    }
    const wpmler = kayitlar.map(wpmOf).filter(x => x.cert !== 'missing').map(x => x.value);
    const hatalar = kayitlar.map(errorRateOf).filter(x => x.cert !== 'missing').map(x => x.value);
    const son = kayitlar[0];

    return {
      cert:'derived', n:kayitlar.length, windowDays:n,
      wpm:wpmler.length
        ? { value:Math.round(U.median(wpmler)), cert:'derived', n:wpmler.length }
        : { value:null, cert:'missing' },
      errorRate:hatalar.length
        ? { value:U.median(hatalar), cert:'estimated', n:hatalar.length }
        : { value:null, cert:'missing' },
      inBand:wpmler.length
        ? wpmler.filter(w => w >= WPM_BAND.min && w <= WPM_BAND.max).length / wpmler.length
        : null,
      last:son,
      lastWpm:wpmOf(son),
    };
  }

  /* Diksiyonda "plato": son 30 gunde hata orani medyaninin iyilesmemesi.
     Iki pencere karsilastirilir; ikisinde de olcum yoksa bulgu URETILMEZ. */
  function dictionTrend(todayISO){
    const today = todayISO || U.todayISO();
    const yeni = dictionStatus(14, today);
    const eski = (function(){
      const sinir1 = U.iso(U.addDays(U.parse(today), -28));
      const sinir2 = U.iso(U.addDays(U.parse(today), -14));
      const rows = (S.recordings || []).filter(r => r.date >= sinir1 && r.date < sinir2);
      const h = rows.map(errorRateOf).filter(x => x.cert !== 'missing').map(x => x.value);
      return h.length ? U.median(h) : null;
    })();

    if(yeni.cert === 'missing' || !yeni.errorRate || yeni.errorRate.cert === 'missing'
       || eski == null){
      return { cert:'missing', why:'İki pencerede de ölçüm gerekir; karşılaştırma yapılamadı.' };
    }
    const fark = yeni.errorRate.value - eski;
    return {
      cert:'estimated',
      delta:fark,
      direction:fark < -0.01 ? 'iyi' : fark > 0.01 ? 'kotu' : 'sabit',
      now:yeni.errorRate.value, before:eski,
    };
  }

  /* ------------------------------------------------------------------ ozet */

  /* Muzik masasinin brifing girdisi. */
  function musicStatus(todayISO){
    const today = todayISO || U.todayISO();
    const parcalar = S.pieces || [];
    if(!parcalar.length){
      return { cert:'missing', n:0, why:'Henüz parça ya da teknik girilmemiş.' };
    }
    const esikler = parcalar.map(p => ({ piece:p, t:cleanThreshold(p, today) }));
    const olculen = esikler.filter(x => x.t.cert !== 'missing');
    return {
      cert:olculen.length ? 'measured' : 'missing',
      n:parcalar.length,
      measured:olculen.length,
      plateaus:plateaus(today),
      progress:progressRatio(),
      rows:esikler,
    };
  }

  return {
    CLEAN_STREAK, CLEAN_WINDOW_DAYS, PLATEAU_DAYS, BPM_STEP, WPM_BAND,
    beatMs, beatsOfBar,
    cleanThreshold, logAttempt, nextStep, plateaus, progressRatio, musicStatus,
    wpmOf, errorRateOf, dictionStatus, dictionTrend,
  };
})();

/* ==== js/core/planner.js ==== */
/* Planlayici — siradaki tek is, haftalik rota ve capraz bulgular.

   Patron'un karari BURADAN gelir. Ajan kararı degistiremez, yalnizca
   gerekcelendirir: toplanti kapanisinda yazilan eylem daima
   ESP.Planner.nextAction()'in dondugu eylemdir. Model "bunun yerine sunu
   yap" derse tutanaktaki eylem yine kural motorununkidir.

   Sira ESP.PRECEDENCE ile AYNIDIR ve tartisilmaz:

     1  Tikanmis temel      (retansiyon dusuk ya da teknik platoda)
     2  Zamana bagli hedef  (yaklasan sunum, konser, sinav)
     3  Vadesi gecmis SRS   (unutma egrisi beklemez)
     4  Sentopik sentez     (derinlik hacimden sonra gelir)
     5  Yeni icerik         (temel saglamken genisleme)

   Sinirli olan kaynak ZAMANDIR, dogruluk degil. Bu yuzden sira "hangisi
   daha dogru" degil "hangisi beklerse otekileri cokertir" sorusuna gore
   dizilir. */

window.ESP = window.ESP || {};

ESP.Planner = (function(){
  const U = ESP.U;
  const S = ESP.S;

  const RETENTION_FLOOR = 0.50;      // altina inerse "tikanmis temel"

  /* Retansiyon tabani ancak YETERI KADAR olcumle tetiklenir.

     Tek bir gecikmis kart ortalamayi %7'ye dusurur ve sistem "temel
     tikandi" der — oysa soylenebilecek tek sey "bir kart gecikti"dir.
     SPI'nin "egilim icin en az uc olcum" kuralinin buradaki karsiligi:
     bes karttan az olculmusse taban KARAR VERMEZ, vadesi gecmis kart
     kurali (sira 3) devreye girer ve zaten dogru isi soyler. */
  const RETENTION_MIN_CARDS = 5;
  const DEADLINE_DAYS = 14;          // bu kadar gun kalan hedef acil sayilir
  const BALANCE_WINDOW = 7;          // dagilim bu pencerede olculur

  /* ---------------------------------------------------------- 1 · tikanma */

  /* Temeli tikayan iki sey: retansiyonun tabanin altina inmesi ve bir
     teknigin platoya girmesi. Ikisi de "yeni icerik eklemeden once
     kapanmali" sinifindadir. */
  function blockedCore(todayISO){
    const out = [];

    const r = ESP.SRS.retention(null, todayISO);
    if(r.cert !== 'missing' && r.n >= RETENTION_MIN_CARDS && r.value < RETENTION_FLOOR){
      out.push({
        id:'retention', disc:'lang', agent:'polyglot',
        label:'Retansiyon tabanın altında',
        detail:'Kartların hatırlanma olasılığı ortalaması %' + Math.round(r.value * 100)
             + ' (' + r.n + ' karttan hesaplandı; taban için en az '
             + RETENTION_MIN_CARDS + ' ölçüm gerekir). Yeni kelime eklemek bu '
             + 'tabanı daha da düşürür.',
        route:'lang', tab:'calis',
        metric:{ value:r.value, cert:r.cert },
      });
    }

    ESP.Acoustic.plateaus(todayISO).forEach(p => {
      out.push({
        id:'plateau:' + p.piece.id, disc:'music', agent:'maestro',
        label:p.piece.name + ' platoda',
        detail:p.days + ' gündür temiz tempo eşiği ' + p.bpm + ' BPM\'de duruyor. '
             + 'Aynı çalışma aynı sonucu veriyorsa değişmesi gereken çalışmanın kendisi.',
        route:'studio', tab:'muzik', ref:p.piece.id,
        metric:{ value:p.bpm, cert:'measured' },
      });
    });

    return out;
  }

  /* ------------------------------------------------------ 2 · zamana bagli */

  function deadlines(todayISO){
    const today = todayISO || U.todayISO();
    return ESP.Model.openGoals().map(g => {
      const kalan = U.diffDays(today, g.date);
      return { goal:g, daysLeft:kalan, urgent:kalan <= DEADLINE_DAYS };
    });
  }

  /* -------------------------------------------------------- 3 · vadesi gecmis */

  function overdue(todayISO){
    const today = todayISO || U.todayISO();
    const kartlar = ESP.SRS.dueCards(today);
    const geciken = kartlar.filter(c => ESP.SRS.overdueDays(c, today) > 0);
    return { due:kartlar, overdue:geciken,
      maxDays:geciken.reduce((m, c) => Math.max(m, ESP.SRS.overdueDays(c, today)), 0) };
  }

  /* ------------------------------------------------------------ 4 · sentez */

  function synthesisGap(){
    const baglanmamis = ESP.Intellect.unlinkedNotes();
    const oneriler = ESP.Intellect.linkSuggestions(3);
    return { unlinked:baglanmamis, suggestions:oneriler };
  }

  /* --------------------------------------------------------- siradaki is

     Tek bir oncelik gosterilir. Ikinci bir "bunu da yapabilirsin" satiri
     eklemek, tek is gosterme fikrinin kendisini bozar: iki secenek bir
     karardir ve karar vermek zaman alir.

     Donus `{ rank, id, title, detail, route, tab, ref, agent, why }`.
     `why` hangi oncelik kuralinin devreye girdigini soyler — kullanici
     sistemin neden bunu sectigini gorebilmeli. */
  function nextAction(todayISO){
    const today = todayISO || U.todayISO();

    /* 1 — tikanmis temel */
    const tikanan = blockedCore(today);
    if(tikanan.length){
      const t = tikanan[0];
      return {
        rank:1, id:t.id, agent:t.agent, disc:t.disc,
        title:t.label, detail:t.detail,
        route:t.route, tab:t.tab, ref:t.ref || null,
        why:'Tıkanmış temel: yeni içerik, eskiyi çökertmeden eklenmez.',
      };
    }

    /* 2 — zamana bagli hedef */
    const acil = deadlines(today).filter(d => d.urgent)[0];
    if(acil){
      const d = ESP.DISCIPLINE_BY_ID[acil.goal.disc];
      return {
        rank:2, id:'goal:' + acil.goal.id, agent:d ? d.agent : 'patron', disc:acil.goal.disc,
        title:acil.goal.label,
        detail:acil.daysLeft === 0 ? 'Hedef bugün.'
          : acil.daysLeft + ' gün kaldı. ' + (acil.goal.note || ''),
        route:d ? d.route : 'today', tab:null, ref:acil.goal.id,
        why:'Zamana bağlı hedef: dış dünyanın takvimi iç plandan önce gelir.',
      };
    }

    /* 3 — vadesi gecmis kartlar */
    const o = overdue(today);
    if(o.overdue.length){
      return {
        rank:3, id:'srs-overdue', agent:'polyglot', disc:'lang',
        title:o.overdue.length + ' kartın vadesi geçti',
        detail:'En çok geciken kart ' + o.maxDays + ' gündür bekliyor. '
             + 'Unutma eğrisi beklemez; geciken her gün kartı bir adım geriye atar.',
        route:'lang', tab:'calis',
        why:'Vadesi geçmiş tekrar: gecikme kartı geriye atar.',
      };
    }
    if(o.due.length){
      return {
        rank:3, id:'srs-due', agent:'polyglot', disc:'lang',
        title:o.due.length + ' kart bugün vadeli',
        detail:'Bugünün tekrarı henüz yapılmadı.',
        route:'lang', tab:'calis',
        why:'Vadesi gelmiş tekrar: günü geçirmeden kapanır.',
      };
    }

    /* 4 — sentopik sentez */
    const sentez = synthesisGap();
    if(sentez.suggestions.length){
      const s = sentez.suggestions[0];
      return {
        rank:4, id:'link', agent:'aristoteles', disc:'reading',
        title:'İki not aynı kavramda buluşuyor',
        detail:'«' + s.concepts[0] + '» iki ayrı notta geçiyor'
             + (s.cross ? ' ve notlar farklı kaynaklardan.' : '.')
             + ' Bağı kurmak sana düşer; sistem nedenini uyduramaz.',
        route:'library', tab:'matris', ref:s.a.id,
        why:'Sentopik sentez: bağlanmamış not henüz sermaye değildir.',
      };
    }
    if(sentez.unlinked.length >= 3){
      return {
        rank:4, id:'unlinked', agent:'aristoteles', disc:'reading',
        title:sentez.unlinked.length + ' not hiçbir yere bağlı değil',
        detail:'Ortak kavram bulunamadı: notlara kavram etiketi eklemek '
             + 'bağ önerilerini açar.',
        route:'library', tab:'notlar',
        why:'Sentopik sentez: derinlik hacimden sonra gelir.',
      };
    }

    /* 5 — yeni icerik.

       Buraya gelmek iyi haberdir: temel saglam. Hangi disiplinin
       genisleyecegini dagilim belirler — en az dokunulan once gelir. */
    const denge = balance(BALANCE_WINDOW, today);
    const aday = denge.rows.filter(r => r.cert === 'missing')[0] || denge.rows[0];
    if(aday){
      const d = aday.disc;
      return {
        rank:5, id:'expand:' + d.id, agent:d.agent, disc:d.id,
        title:d.label + ' bu hafta en az çalışılan alan',
        detail:aday.cert === 'missing'
          ? 'Son ' + BALANCE_WINDOW + ' günde hiç girilmemiş. Temel sağlam; '
            + 'genişleme sırası burada.'
          : 'Son ' + BALANCE_WINDOW + ' günde ' + U.fmtMin(aday.minutes) + '. '
            + 'Temel sağlam; genişleme sırası burada.',
        route:d.route, tab:null,
        why:'Yeni içerik: temel sağlamken genişleme sistemin asıl amacıdır.',
      };
    }

    return {
      rank:0, id:'none', agent:'patron', disc:null,
      title:'Bugün için bekleyen bir iş yok',
      detail:'Vadesi gelen kart yok, tıkanma yok, açık sentez önerisi yok. '
           + 'Asgari günü yapıp bırakmak da bir seçenektir.',
      route:'today', tab:null,
      why:'Öncelik sırasındaki beş kuralın hiçbiri tetiklenmedi.',
    };
  }

  /* ------------------------------------------------------------- dagilim

     Haftanin pratigi disiplinlere nasil dagilmis? Bir disipline yigilmis
     ve biri hic acilmamissa bu bir bulgudur — ama bir SUCLAMA degildir:
     yogunlasma kasitli olabilir. Ofis yalnizca gorunur kilar. */
  function balance(days, todayISO){
    const n = days || BALANCE_WINDOW;
    const rows = ESP.DISCIPLINES.map(d => {
      const h = ESP.Intellect.hoursOf(d.id, n);
      return { disc:d, minutes:h.minutes, enteredDays:h.enteredDays, cert:h.cert };
    });
    const olculen = rows.filter(r => r.cert !== 'missing');
    const toplam = olculen.reduce((a, r) => a + r.minutes, 0);

    rows.forEach(r => {
      r.share = (toplam && r.cert !== 'missing') ? r.minutes / toplam : null;
    });
    rows.sort((a, b) => {
      if(a.cert === 'missing' && b.cert !== 'missing') return -1;
      if(b.cert === 'missing' && a.cert !== 'missing') return 1;
      return a.minutes - b.minutes;
    });

    const dokunulmayan = rows.filter(r => r.cert === 'missing');
    const enBuyuk = olculen.length
      ? olculen.reduce((m, r) => r.minutes > m.minutes ? r : m, olculen[0]) : null;

    return {
      rows, totalMinutes:toplam, windowDays:n,
      untouched:dokunulmayan.map(r => r.disc),
      /* Dengesizlik: tek bir disiplin toplamin yarisindan fazlasini aliyor
         VE en az bir disiplin hic acilmamis. Tek basina hicbiri bulgu degil. */
      skewed:!!(enBuyuk && toplam && enBuyuk.minutes / toplam > 0.5 && dokunulmayan.length),
      top:enBuyuk ? enBuyuk.disc : null,
      cert:olculen.length ? 'measured' : 'missing',
    };
  }

  /* -------------------------------------------------------- haftalik rota

     Rota bir TAKVIM DEGILDIR: "sali 19:00'da gitar" demek sistemin isi
     degil. Rota, haftanin kalan gunlerine hangi disiplinin dusmesi
     gerektigini soyler ve sirayi oncelik kurallarindan alir.

     Odak (profile.focus) yalnizca ESIT skorlu iki is arasinda sirayi
     belirler; olculmus bir ihtiyaci ezmez. */
  function weeklyRoute(todayISO){
    const today = todayISO || U.todayISO();
    const denge = balance(BALANCE_WINDOW, today);
    const odak = (S.profile && S.profile.focus) || 'balanced';

    const puanli = ESP.DISCIPLINES.map(d => {
      const row = denge.rows.find(r => r.disc.id === d.id);
      let puan = 0;
      /* Hic dokunulmamis disiplin en yuksek puani alir: denge sistemin amaci. */
      if(!row || row.cert === 'missing') puan += 100;
      else puan += Math.max(0, 60 - row.minutes / 3);
      /* Tikanma varsa o disiplin one gecer. */
      if(blockedCore(today).some(b => b.disc === d.id)) puan += 80;
      /* Yaklasan hedef. */
      if(deadlines(today).some(x => x.urgent && x.goal.disc === d.id)) puan += 90;
      /* Odak yalnizca esitligi bozar — bir puan degil yarim puan. */
      if(odak === d.id) puan += 0.5;
      return { disc:d, score:puan };
    }).sort((a, b) => b.score - a.score);

    return {
      rows:puanli,
      focus:odak,
      cert:denge.cert,
      note:denge.cert === 'missing'
        ? 'Son ' + BALANCE_WINDOW + ' günde hiç kayıt yok; rota yalnızca disiplin '
          + 'listesinden kuruldu.'
        : null,
    };
  }

  /* ------------------------------------------------------- capraz bulgular

     Iki AYRI masanin verisi birlikte anlam kazandiginda cikan bulgu.
     Korelasyon nedensellik gibi yazilmaz: "birlikte hareket ediyor" denir.

     Her bulgu hangi iki masadan geldigini tasir; Patron bunlari devre
     cevirir (bkz. core/office.js). */
  function crossFindings(todayISO){
    const today = todayISO || U.todayISO();
    const out = [];

    /* Dil ↔ okuma: kelime calisiliyor ama yabanci dilde okuma yok.
       Ikisinin birlikte gitmesi retansiyonun en ucuz kaynagidir. */
    const dil = ESP.Intellect.hoursOf('lang', 14);
    const okuma = ESP.Intellect.hoursOf('reading', 14);
    if(dil.cert !== 'missing' && okuma.cert === 'missing'){
      out.push({ id:'lang-no-reading', from:'polyglot', to:'aristoteles',
        text:'Son 14 günde ' + U.fmtMin(dil.minutes) + ' dil çalışması var, '
           + 'okuma hiç girilmemiş. Kartlar bağlamda görülmediğinde retansiyon '
           + 'daha hızlı düşüyor.',
        route:'library' });
    }

    /* Okuma ↔ yazi: not birikiyor ama taslak yok. */
    const ss = ESP.Intellect.syntopic();
    const yazi = ESP.Intellect.hoursOf('writing', 14);
    if(ss.total >= 5 && yazi.cert === 'missing'){
      out.push({ id:'notes-no-writing', from:'aristoteles', to:'montaigne',
        text:ss.total + ' atomik not var ama son 14 günde yazı oturumu yok. '
           + 'Not yığını, yazılana kadar sermaye sayılmıyor.',
        route:'writing' });
    }

    /* Muzik ↔ diksiyon: ayni akustik katmani paylasan iki disiplinden biri
       tamamen kapali. Diksiyon en kolay ertelenen disiplindir. */
    const muzik = ESP.Intellect.hoursOf('music', 14);
    const diksiyon = ESP.Intellect.hoursOf('diction', 14);
    if(muzik.cert !== 'missing' && diksiyon.cert === 'missing'){
      out.push({ id:'music-no-diction', from:'maestro', to:'demosthenes',
        text:'Enstrüman çalışılıyor, diksiyon hiç açılmamış. İkisi de aynı '
           + 'zamanlama duyusunu kullanıyor; biri ötekini ucuza taşıyor.',
        route:'studio' });
    }

    /* Felsefe ↔ yazi: acik tez var, yazi yok. */
    const acikTezler = ESP.Intellect.stalledArguments(14, today);
    if(acikTezler.length && yazi.cert === 'missing'){
      out.push({ id:'args-no-writing', from:'socrates', to:'montaigne',
        text:acikTezler.length + ' tez 14+ gündür açık ve yazı oturumu yok. '
           + 'Bir tez çoğu zaman yazılırken kapanır.',
        route:'writing' });
    }

    /* SRS ↔ seri: kart birikiyor ve gunluk kayit da kopmus. */
    const o = overdue(today);
    const seri = ESP.Model.streak();
    if(o.overdue.length >= 10 && seri === 0){
      out.push({ id:'overdue-no-streak', from:'polyglot', to:'patron',
        text:o.overdue.length + ' kart gecikmiş ve seri kopmuş. Asgari gün '
           + '(vadesi gelen kartlar + 10 dakika okuma) borcu büyütmeden kapatır.',
        route:'today' });
    }

    return out;
  }

  return {
    RETENTION_FLOOR, RETENTION_MIN_CARDS, DEADLINE_DAYS, BALANCE_WINDOW,
    blockedCore, deadlines, overdue, synthesisGap,
    nextAction, balance, weeklyRoute, crossFindings,
  };
})();

/* ==== js/core/parse.js ==== */
/* Serbest metin ayristiricilari.

   Uc kazanilmis ders bu dosyanin tamamini belirler (devir notu §11):

     1. INSANLAR FIIL SOYLER, ISIM DEGIL. "Shadowing oturumu" degil
        "shadowing yaptim". Her disiplin takma ad listesi tasir.

     2. TAKMA AD DIZINI UZUNDAN KISAYA SIRALANIR. Yoksa "okuma" kelimesi
        "derin okuma"dan once eslesir ve yanlis disipline yazilir.

     3. SAYI ICINDEKI VIRGUL CUMLE AYRACI DEGILDIR. "7,5 saat" tek
        parcadir; "7" ve "5 saat" degil.

   Ve degismez kural: EMIN OLUNAMAYAN SATIR ATILMAZ VE UYDURULMAZ.
   "Eşleşmedi" olarak isaretlenir, kullanici elle baglar. Sessizce atilan
   bir satir, kullanicinin girdigini sandigi ama sistemde olmayan bir veri
   demektir — en pahali hata turu. */

window.ESP = window.ESP || {};

ESP.Parse = (function(){
  const U = ESP.U;

  /* Cumle ayraci. Virgul YALNIZCA ardindan rakam GELMEDIGINDE ayracdir:
     "7,5 saat" tek parcadir, "7" ve "5 saat" degil. */
  const AYRAC = /\s+(?:ve|ayrıca|bir de|sonra|artı)\s+|[;]|,(?!\d)/gi;

  /* ---------------------------------------------------- disiplin takma adlari

     Her disiplin icin kullanicinin gercekte soyleyecegi sozler. Liste
     uzundan kisaya siralanir (asagida) ve normalize edilmis halde aranir. */
  const ALIASES = {
    lang:['dil çalıştım', 'kelime çalıştım', 'shadowing yaptım', 'shadowing',
      'kart çözdüm', 'tekrar yaptım', 'ingilizce çalıştım', 'almanca çalıştım',
      'fransızca çalıştım', 'dil', 'kelime'],
    philo:['felsefe okudum', 'felsefe çalıştım', 'tez yazdım', 'argüman kurdum',
      'primer metin okudum', 'felsefe', 'argüman', 'tez'],
    music:['gitar çalıştım', 'gitar çaldım', 'metronomla çalıştım', 'gam çalıştım',
      'parça çalıştım', 'enstrüman çalıştım', 'gitar', 'müzik'],
    diction:['diksiyon çalıştım', 'tekerleme söyledim', 'nefes çalıştım',
      'sunum provası yaptım', 'yüksek sesle okudum', 'diksiyon', 'tekerleme'],
    reading:['derin okuma yaptım', 'kitap okudum', 'not çıkardım', 'okuma yaptım',
      'derin okuma', 'okudum', 'okuma'],
    writing:['yazı yazdım', 'taslak yazdım', 'deneme yazdım', 'revize ettim',
      'yazdım', 'yazı'],
  };

  /* Uzundan kisaya: "derin okuma" once denenir, "okuma" sonra.
     Tersi olsaydi her derin okuma kaydi genel okumaya duserdi. */
  const INDEX = (function(){
    const rows = [];
    Object.keys(ALIASES).forEach(disc => {
      ALIASES[disc].forEach(a => rows.push({ disc, alias:U.norm(a), len:a.length }));
    });
    return rows.sort((a, b) => b.len - a.len);
  })();

  /* Birim kaliplari. Sira ozgulden genele: "45 dakika" once, "45" sonra. */
  const SURE = [
    { re:/(\d+(?:[.,]\d+)?)\s*(?:saat|sa)\b/i, carpan:60 },
    { re:/(\d+(?:[.,]\d+)?)\s*(?:dakika|dk|dak)\b/i, carpan:1 },
  ];

  const SAYIM = [
    { re:/(\d+)\s*(?:kelime)\b/i, field:'count', what:'kelime' },
    { re:/(\d+)\s*(?:kart)\b/i, field:'count', what:'kart' },
    { re:/(\d+)\s*(?:sayfa)\b/i, field:'count', what:'sayfa' },
    { re:/(\d+)\s*(?:tekrar)\b/i, field:'count', what:'tekrar' },
  ];

  function sayi(s){
    const n = Number(String(s).replace(',', '.'));
    return isFinite(n) ? n : null;
  }

  /* ---------------------------------------------------------- oturum ayristirma

     «bugün 45 dakika gitar çalıştım ve 20 dakika kelime tekrarı yaptım»
       → iki oturum: music 45 dk, lang 20 dk

     Donus: { rows:[…], unmatched:[…] }
     `unmatched` bos DEGILSE ekran onu gosterir ve kullanici elle baglar. */
  function parseSession(text){
    const ham = String(text || '').trim();
    if(!ham) return { rows:[], unmatched:[] };

    const parcalar = ham.split(AYRAC).map(p => p.trim()).filter(Boolean);
    const rows = [], unmatched = [];

    parcalar.forEach(parca => {
      const n = U.norm(parca);

      /* Disiplin — uzundan kisaya ilk eslesme. */
      const hit = INDEX.find(x => n.indexOf(x.alias) >= 0);

      /* Sure — saat once, dakika sonra. Ikisi de varsa toplanir
         ("1 saat 20 dakika"). */
      let dakika = null;
      SURE.forEach(s => {
        const m = parca.match(s.re);
        if(m){
          const v = sayi(m[1]);
          if(v != null) dakika = (dakika || 0) + v * s.carpan;
        }
      });

      /* Ikinci sayi — kelime / kart / sayfa / tekrar. */
      let count = null, countWhat = null;
      SAYIM.forEach(s => {
        if(count != null) return;
        const m = parca.match(s.re);
        if(m){ count = sayi(m[1]); countWhat = s.what; }
      });

      if(!hit && dakika == null){
        unmatched.push({ text:parca, why:'Ne disiplin ne süre tanındı.' });
        return;
      }
      if(!hit){
        unmatched.push({ text:parca, why:'Süre var ama hangi disiplin olduğu anlaşılmadı.',
          minutes:dakika });
        return;
      }
      if(dakika == null){
        /* Disiplin taniniyor ama sure yok: satir ATILMAZ, suresi eksik bir
           oneri olarak doner. Kullanici sureyi yazar. */
        unmatched.push({ text:parca, why:'Disiplin tanındı ama süre girilmemiş.',
          disc:hit.disc });
        return;
      }

      rows.push({
        disc:hit.disc,
        minutes:Math.round(dakika),
        count, countWhat,
        note:parca,
      });
    });

    return { rows, unmatched };
  }

  /* ------------------------------------------------------- kelime ayristirma

     Yapistirilan listeden SRS karti uretir. Uc yaygin bicim taninir
     (data/lexicon.js → VOCAB_SEPARATORS); taninmayan satir "eşleşmedi"
     olarak doner.

     Tek kelimelik satir da eslesmez: karsiligi olmayan bir kart soru
     soramaz. Bos birakip kullaniciya yazdirmak, yanlis karsilik uydurmaktan
     iyidir. */
  function parseVocab(text, lang){
    const satirlar = String(text || '').split(/\r?\n/).map(s => s.trim()).filter(Boolean);
    const rows = [], unmatched = [];

    satirlar.forEach(satir => {
      let bulundu = null;
      for(const sep of ESP.VOCAB_SEPARATORS){
        const m = satir.match(sep.re);
        if(m && m[1].trim() && m[2].trim()){
          bulundu = { front:m[1].trim(), back:m[2].trim(), via:sep.id };
          break;
        }
      }
      if(!bulundu){
        unmatched.push({ text:satir,
          why:satir.split(/\s+/).length === 1
            ? 'Karşılığı yok; tek kelimelik satırdan kart üretilmez.'
            : 'Ayraç bulunamadı (– , = ya da : bekleniyor).' });
        return;
      }
      rows.push({
        front:bulundu.front, back:bulundu.back,
        lang:lang || 'en',
        kind:bulundu.front.split(/\s+/).length > 1 ? 'phrase' : 'word',
        via:bulundu.via,
      });
    });

    /* Ayni on yuzden iki kart uretmek destede ikiz olusturur ve ikisi de
       ayri ayri sorulur. Ayikla, ama SESSIZCE DEGIL: kac tane atildigi
       doner. */
    const gorulen = {}, tekil = [], ikiz = [];
    rows.forEach(r => {
      const k = U.norm(r.front);
      if(gorulen[k]){ ikiz.push(r); return; }
      gorulen[k] = true; tekil.push(r);
    });

    return { rows:tekil, unmatched, duplicates:ikiz };
  }

  /* --------------------------------------------------------- tez ayristirma

     «X doğrudur çünkü Y. Ama Z olabilir.»
       tez     → X doğrudur
       destek  → Y
       itiraz  → Z

     Kaba bir ayirmadir ve oyle kalmalidir: sistem metni ANLAMAZ, yalnizca
     baglaclara bakar. Cikan sey bir ONERIDIR; kullanici duzeltir. */
  /* Baglaclar Turkce sinirla kurulur: /\bçünkü\b/ hicbir Turkce cumlede
     eslesmez cunku `ç` JavaScript'te kelime karakteri sayilmaz. Ayrintisi
     data/rules.js icindeki ESP.trRe yorumunda. */
  const DESTEK = ESP.trRe('çünkü|zira|nitekim|şu sebeple|dolayısıyla');
  const ITIRAZ = ESP.trRe('ama|fakat|ancak|oysa|ne var ki|buna karşın|yine de');

  function parseArgument(text){
    const ham = String(text || '').trim();
    if(!ham) return { thesis:'', supports:[], objections:[], unmatched:[] };

    const cumleler = ham.split(/(?<!\d)[.!?]+(?!\d)/).map(s => s.trim()).filter(Boolean);
    if(!cumleler.length) return { thesis:ham, supports:[], objections:[], unmatched:[] };

    const supports = [], objections = [], unmatched = [];
    let thesis = '';

    cumleler.forEach((c, i) => {
      if(ITIRAZ.test(c)){
        objections.push(c.replace(ITIRAZ, '').trim());
        return;
      }
      if(DESTEK.test(c)){
        /* split ayraci geri vermesi icin YAKALAYAN grup gerekir; trRe ic
           grubu yakalamaz, bu yuzden burada kendi desenimizi kurariz. */
        const parcali = c.split(new RegExp('(' + DESTEK.source + ')', 'i'));
        /* Ilk cumle hem tez hem destek tasiyabilir:
           "X doğrudur çünkü Y" → tez X, destek Y. */
        if(!thesis && parcali[0].trim()) thesis = parcali[0].trim();
        const d = parcali.slice(2).join(' ').trim() || parcali[parcali.length - 1].trim();
        if(d) supports.push(d);
        return;
      }
      if(!thesis && i === 0){ thesis = c; return; }
      /* Ne tez ne destek ne itiraz: kullaniciya sorulur. */
      unmatched.push({ text:c, why:'Tez, destek ya da itiraz olduğu anlaşılmadı.' });
    });

    return { thesis, supports, objections, unmatched };
  }

  /* ------------------------------------------------------- kavram ayikama

     Metindeki kanonik kavramlari bulur. Kanonda olmayan kelime UYDURULMAZ;
     yalnizca ESP.CONCEPTS listesindekiler doner. Kullanici kendi kavramini
     elle ekleyebilir. */
  function extractConcepts(text){
    const n = U.norm(text || '');
    if(!n) return [];
    const out = [];
    ESP.CONCEPTS.forEach(c => {
      const adaylar = [c.id, c.label].concat(c.same);
      if(adaylar.some(a => n.indexOf(U.norm(a)) >= 0)) out.push(c);
    });
    return out;
  }

  return { AYRAC, ALIASES, parseSession, parseVocab, parseArgument, extractConcepts };
})();

/* ==== js/core/voice.js ==== */
/* Ses ile dikte.

   Bu katman KONUSMA degil DIKTE yapar: ses metne cevrilir, metin var olan
   alana yazilir ve oradan sonra her sey yazarak girmisin gibi isler. Yeni
   bir ayristirici, yeni bir kesinlik etiketi, yeni bir kayit yolu yoktur.

   Bu kasitlidir. "Bir tabak etli kuru fasulye, bir bardak ayran" cumlesini
   coktan ayristirabiliyoruz (ESP.Parse.parseMeal). Sesin yapmasi gereken tek
   is o cumleyi klavye yerine uretmek. Sesli cevap (TTS) yoktur: kesinlik
   katmaz, bedel katar.

   Tarayicinin kendi konusma motoru kullanilir. Desteklenmeyen tarayicida
   katman sessizce yok olur -- mikrofon dugmesi hic cizilmez, elle giris
   yolu zaten her yerde durur. */

window.ESP = window.ESP || {};

ESP.Voice = (function(){

  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  /* Ayni anda tek bir oturum. Iki alan birden dinlerse hangi alana
     yazildigi belirsizlesir. */
  let active = null;

  function supported(){ return !!Rec; }

  /* Dikte oturumu.

     `opts.onText(text, final)` her tanima adiminda cagrilir; `final`
     false iken metin henuz degisebilir (ara sonuc), true olunca sabitlenir.
     Cagiran taraf ara sonuclari da yazar ki kullanici konusurken
     yazildigini gorsun. */
  function start(opts){
    const o = opts || {};
    if(!Rec){ if(o.onError) o.onError('unsupported'); return null; }
    stop();

    let rec;
    try{ rec = new Rec(); }
    catch(e){ if(o.onError) o.onError('unsupported'); return null; }

    rec.lang = o.lang || 'tr-TR';
    rec.continuous = o.continuous !== false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    /* Oturum boyunca sabitlenmis metin burada birikir; ara sonuc bunun
       ustune eklenir ama birikime yazilmaz. */
    let settled = '';

    rec.onresult = ev => {
      let interim = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const piece = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) settled += piece;
        else interim += piece;
      }
      const text = (settled + interim).replace(/\s+/g, ' ').trim();
      if(o.onText) o.onText(text, !interim);
    };

    rec.onerror = ev => {
      const code = ev && ev.error ? ev.error : 'error';
      /* "no-speech" bir hata degil, sessizliktir: kullaniciya hata
         gostermek yerine oturumu sessizce bitiririz. */
      if(code !== 'no-speech' && code !== 'aborted' && o.onError) o.onError(code);
    };

    rec.onend = () => {
      const was = active;
      active = null;
      if(was && o.onEnd) o.onEnd(settled.replace(/\s+/g, ' ').trim());
    };

    try{ rec.start(); }
    catch(e){ if(o.onError) o.onError('start'); return null; }

    active = { rec, target:o.target || null };
    return active;
  }

  function stop(){
    if(!active) return;
    const a = active;
    active = null;
    try{ a.rec.stop(); }catch(e){}
  }

  function isActive(){ return !!active; }
  function activeTarget(){ return active ? active.target : null; }

  /* Bir metin alanina baglanan dikte.

     Alandaki mevcut metin KORUNUR: dikte onun sonuna eklenir. Kullanici
     yarim yazip sonra konusmaya baslayabilsin diye. */
  function dictateInto(el, opts){
    const o = opts || {};
    if(!el) return null;
    const base = el.value ? el.value.replace(/\s+$/, '') + ' ' : '';

    return start({
      target:el.id || null,
      lang:o.lang,
      onText(text){
        el.value = base + text;
        /* Uzun metinde imlec sonda kalsin ki kullanici yazilani gorsun. */
        try{ el.selectionStart = el.selectionEnd = el.value.length; }catch(e){}
        if(o.onText) o.onText(el.value);
      },
      onEnd(final){
        if(o.onEnd) o.onEnd(base + final);
      },
      onError:o.onError,
    });
  }

  const MESSAGES = {
    unsupported:'Bu tarayıcı ses tanımayı desteklemiyor. Chrome ya da Edge dene.',
    'not-allowed':'Mikrofon izni verilmedi.',
    'service-not-allowed':'Mikrofon izni verilmedi.',
    'audio-capture':'Mikrofon bulunamadı.',
    network:'Ses tanıma için bağlantı gerekiyor.',
    start:'Mikrofon başlatılamadı.',
  };
  function message(code){ return MESSAGES[code] || 'Ses tanıma çalışmadı.'; }

  return { supported, start, stop, isActive, activeTarget, dictateInto, message };
})();

/* ==== js/core/speak.js ==== */
/* SESLİ CEVAP — ajanın kendi sesi.

   Bu katman bir karar değişikliğidir ve gerekçesi yazılı kalmalı.

   Önceki karar: «Sesli cevap (TTS) yoktur: kesinlik katmaz, bedel
   katar.» O gerekçe bir SAYIYI sesli okumak içindi ve hâlâ doğrudur —
   bir ferritin değerini duymak, okumaktan daha kesin yapmaz.

   Yeni gerekçe farklı: ses OKUMAMAK için değil, SIRA ALMAK için var.
   Elin doluyken, yürürken, mutfaktayken Patron'a bir şey sorup cevabı
   duymak; cevap bitince mikrofonun kendiliğinden açılması. Kesinlik
   değil SÜREKLİLİK kazandırıyor.

   ─────────────────────────────────────────────────────────────────

   DEĞİŞMEZ: ses, ekrandaki metinden BAŞKA bir şey söylemez.

   Konuşulan metin, kural motorundan geçmiş ve ekrana basılmış metnin
   ta kendisidir. Burada yeniden yazma, özetleme, "sesli için
   kısaltma" yoktur. Olsaydı duyduğun cümle ile gördüğün cümle
   ayrışırdı ve hangisinin doğru olduğu belirsizleşirdi.

   Yapılan tek şey TELAFFUZ hazırlığıdır: «%40» yazısını «yüzde 40»
   diye okutmak anlamı değiştirmez, yalnızca duyulur kılar.

   Desteklenmeyen tarayıcıda katman sessizce yok olur; hiçbir düğme
   çizilmez, yazılı akış olduğu gibi durur. */

window.ESP = window.ESP || {};

ESP.Speak = (function(){

  const API = window.speechSynthesis || null;
  const Utter = window.SpeechSynthesisUtterance || null;

  function supported(){ return !!(API && Utter); }

  /* ---------------------------------------------------------- sesler

     Tarayıcı ses listesini GEÇ yükler: ilk çağrıda boş dönebilir ve
     `voiceschanged` olayıyla dolar. Bu yüzden liste her istendiğinde
     yeniden okunur, önbelleğe alınmaz. */
  function voices(){
    if(!supported()) return [];
    try{ return API.getVoices() || []; }catch(e){ return []; }
  }

  function turkishVoices(){
    return voices().filter(v => /^tr([-_]|$)/i.test(v.lang || ''));
  }

  /* Türkçe ses yoksa katman yine çalışır ama bunu SÖYLER: yabancı bir
     sesle okunan Türkçe anlaşılmaz olabilir ve kullanıcı sebebini
     bilmelidir. */
  function ready(){
    return supported() && voices().length > 0;
  }
  function hasTurkish(){ return turkishVoices().length > 0; }

  /* ------------------------------------------------- ajan ses kimliği

     Beş ajanın sesi birbirinden AYRILMALI: toplantıyı dinlerken kimin
     konuştuğu duyulmadan anlaşılmalı.

     Tarayıcıda genelde bir ya da iki Türkçe ses bulunur — beş ayrı ses
     bulunmaz. Bu yüzden kimlik yalnız sese değil, KONUŞMA BİÇİMİNE de
     yazılır: hız ve perde. Tek sesle bile beş karakter ayrışır.

     Değerler karakterden çıkar, rastgele değil:
       Patron  — yavaş ve alçak: kararı o veriyor, acelesi yok
       Kerem   — nötr: ölçüm okuyor, yorum katmıyor
       Nesrin  — biraz daha canlı: mutfakta anlatıyor
       Barış   — hızlı: antrenman veriyor
       Sedef   — ölçülü: para konuşuyor, abartmıyor */
  const KIMLIK = {
    patron:{ rate:0.94, pitch:0.92 },
    lab:   { rate:1.00, pitch:1.00 },
    nutri: { rate:1.02, pitch:1.08 },
    move:  { rate:1.10, pitch:1.04 },
    money: { rate:0.98, pitch:0.96 },
  };

  /* Ses ataması KARARLI olmalı: aynı ajan her seferinde aynı sesle
     konuşur. Liste sırası tarayıcıya göre değişebildiği için ajanın
     kendi sırası kullanılır, ses listesinin sırası değil. */
  function voiceFor(agentId){
    const tr = turkishVoices();
    const havuz = tr.length ? tr : voices();
    if(!havuz.length) return null;
    const sira = ESP.AGENTS.findIndex(a => a.id === agentId);
    return havuz[(sira < 0 ? 0 : sira) % havuz.length];
  }

  function styleFor(agentId){
    return KIMLIK[agentId] || { rate:1, pitch:1 };
  }

  /* ------------------------------------------------------- telaffuz

     Anlam değişmez, yalnızca duyulur hale gelir. Her kural bir
     okunuş sorununu çözer; süs kural yoktur. */
  function konusulacak(text){
    let s = String(text == null ? '' : text);

    s = s.replace(/\*\*/g, '').replace(/[*_`#]/g, '');   /* işaretleme okunmaz */
    s = s.replace(/%\s*(\d)/g, 'yüzde $1');              /* %40 → yüzde 40 */
    s = s.replace(/(\d)\s*%/g, '$1 yüzde');              /* 40% → 40 yüzde */
    s = s.replace(/([A-Za-zµ])\/([A-Za-z])/g, '$1 $2');  /* ng/mL → ng mL */
    s = s.replace(/[·•]/g, ', ');                        /* ayraç → duraklama */
    s = s.replace(/\s[—–]\s/g, ', ');                    /* uzun tire → duraklama */
    s = s.replace(/→/g, ', ');
    /* Ayraç kendi boşluğunu getirdiği için önündeki boşluk artık
       fazladır: «A · B» → «A , B» diye okunuyordu. */
    s = s.replace(/\s+([,.;:])/g, '$1');
    s = s.replace(/\s+/g, ' ').trim();
    return s;
  }

  /* --------------------------------------------------------- söyleme

     Web Speech API'nin iki tuzağı buraya yazılı. İkisi de AYS'nin ses
     katmanında zor yoldan öğrenilmiş ve aynısı burada da geçerli:

     a) UZUN METİN SESSİZCE KESİLİR. Chrome yaklaşık 15 saniye sonra
        konuşmayı durdurur ve `onend` hiç gelmez. Dört cümlelik bir
        ajan cevabı tam olarak bu sınıra girer. Metin cümlelere
        bölünüp parça parça okunur; her parça kısadır.

     b) `onend` HİÇ GELMEYEBİLİR — sekme arka plana atılır, ses aygıtı
        düşer. Burası kritik: sıra alma döngüsü konuşmanın bitmesini
        BEKLİYOR. Söz çözülmezse mikrofon bir daha açılmaz ve kullanıcı
        neden cevap alamadığını anlamaz. Her parçaya uzunluğuna göre
        bir emniyet süresi konur; süre dolarsa konuşma bitmiş sayılır.

     Sonuç: `say()` HİÇBİR KOŞULDA asılı kalmaz. */

  const PARCA = 180;                 /* bir parçanın en fazla uzunluğu */
  const DUR = '.!?…:;';              /* cümle sonu sayılan noktalama */

  /* Cümlelere böler. «14,5 ng/mL» gibi sayıların içindeki nokta cümle
     sonu sayılmaz: noktalamadan sonra boşluk ya da metin sonu aranır. */
  function cumleler(s){
    const out = [];
    let bas = 0;
    for(let i = 0; i < s.length; i++){
      if(DUR.indexOf(s[i]) < 0) continue;
      let j = i;
      while(j + 1 < s.length && DUR.indexOf(s[j + 1]) >= 0) j++;
      const sonraki = s[j + 1];
      if(sonraki === undefined || /\s/.test(sonraki)){
        const p = s.slice(bas, j + 1).trim();
        if(p) out.push(p);
        bas = j + 1;
      }
      i = j;
    }
    const kuyruk = s.slice(bas).trim();
    if(kuyruk) out.push(kuyruk);
    return out;
  }

  /* Cümleleri PARCA sınırına kadar birleştirir; tek başına uzun olan
     cümle kelime sınırından bölünür. */
  function parcala(text){
    const s = String(text || '').trim();
    if(!s) return [];
    const out = [];
    const liste = cumleler(s).length ? cumleler(s) : [s];
    let tampon = '';
    liste.forEach(ham => {
      let p = ham.trim();
      if(!p) return;
      while(p.length > PARCA){
        const kes = p.lastIndexOf(' ', PARCA);
        const at = kes > PARCA * 0.5 ? kes : PARCA;
        if(tampon){ out.push(tampon); tampon = ''; }
        out.push(p.slice(0, at).trim());
        p = p.slice(at).trim();
      }
      if((tampon + ' ' + p).trim().length > PARCA){ out.push(tampon); tampon = p; }
      else tampon = (tampon ? tampon + ' ' : '') + p;
    });
    if(tampon) out.push(tampon);
    return out.filter(Boolean);
  }

  /* Emniyet süresi. Yavaş bir sesin saniyede ~10 karakter okuduğu
     varsayılır; üstüne üç saniye pay konur ve 45 saniyede tavanlanır. */
  function emniyetMs(text, rate){
    const r = Math.max(0.5, Number(rate) || 1);
    return Math.min(45000, 3000 + (String(text).length / (10 * r)) * 1000);
  }

  let simdiki = null;      /* { agentId, iptal } */

  function parcaSoyle(metin, ayar){
    return new Promise(resolve => {
      let bitti = false, saat = null;
      const bitir = neden => {
        if(bitti) return;
        bitti = true;
        clearTimeout(saat);
        resolve(neden);
      };

      let u;
      try{ u = new Utter(metin); }
      catch(e){ return bitir('hata'); }

      if(ayar.voice){ u.voice = ayar.voice; u.lang = ayar.voice.lang; }
      else u.lang = ayar.lang || 'tr-TR';
      u.rate = ayar.rate;
      u.pitch = ayar.pitch;
      u.volume = ayar.volume;

      u.onend = () => bitir('bitti');
      u.onerror = ev => {
        const kod = (ev && ev.error) || 'hata';
        bitir(kod === 'interrupted' || kod === 'canceled' ? 'iptal' : 'hata');
      };

      /* `onend` hiç gelmezse burası gelir; çağıran asılı kalmaz. */
      saat = setTimeout(() => bitir('zamanasimi'), emniyetMs(metin, u.rate));

      try{ API.speak(u); }
      catch(e){ bitir('hata'); }
    });
  }

  /* Bir cümleyi söyler ve BİTİNCE çözülen bir söz döndürür.

     Sözün bitmesi sıra alma döngüsünün tek tetikleyicisidir: mikrofon
     ancak ajan sustuğunda açılır. Bu yüzden hata, iptal ya da zaman
     aşımı — hepsinde söz MUTLAKA çözülür. */
  async function say(text, opts){
    const o = opts || {};
    const metin = konusulacak(text);
    if(!supported() || !metin) return { ok:false, reason:'bos' };

    const parcalar = parcala(metin);
    if(!parcalar.length) return { ok:false, reason:'bos' };

    stop();

    const stil = styleFor(o.agent);
    const ayar = {
      voice:o.voice || voiceFor(o.agent),
      lang:o.lang,
      rate:o.rate != null ? o.rate : stil.rate,
      pitch:o.pitch != null ? o.pitch : stil.pitch,
      volume:o.volume != null ? o.volume : 1,
    };

    simdiki = { agentId:o.agent || null };
    if(o.onStart) o.onStart();

    let zamanasimi = false;
    for(let i = 0; i < parcalar.length; i++){
      if(!simdiki) return { ok:false, reason:'iptal', iptal:true };
      const neden = await parcaSoyle(parcalar[i], ayar);
      if(neden === 'iptal'){ simdiki = null; return { ok:false, reason:'iptal', iptal:true }; }
      if(neden === 'hata'){ simdiki = null; return { ok:false, reason:'hata' }; }
      if(neden === 'zamanasimi') zamanasimi = true;
    }
    simdiki = null;
    return { ok:true, zamanasimi };
  }

  /* Sırayla söyler. Bir cümle iptal edilirse kalanlar SÖYLENMEZ:
     kullanıcı sözü kestiyse sırayı da kesmiştir. */
  async function sequence(parcalar, opts){
    const o = opts || {};
    for(let i = 0; i < parcalar.length; i++){
      const p = parcalar[i];
      if(o.onPart) o.onPart(p, i);
      const r = await say(p.text, Object.assign({}, o, { agent:p.agent }));
      if(!r.ok && r.iptal) return { ok:false, kesildi:true, kalan:parcalar.length - i };
      if(o.arasiMs) await new Promise(res => setTimeout(res, o.arasiMs));
    }
    return { ok:true, kesildi:false, kalan:0 };
  }

  function stop(){
    if(!supported()) return;
    try{ API.cancel(); }catch(e){}
    simdiki = null;
  }

  function isSpeaking(){
    if(!supported()) return false;
    try{ return API.speaking || API.pending; }catch(e){ return false; }
  }
  function speakingAgent(){ return simdiki ? simdiki.agentId : null; }

  /* Ses listesi geç yüklendiğinde haber ver: mikrofon düğmesi ilk
     çizimde gizli kalıp sonra görünmesin diye ekran tazelenir. */
  function onVoicesReady(fn){
    if(!supported()) return;
    if(voices().length){ fn(); return; }
    const el = () => { API.removeEventListener('voiceschanged', el); fn(); };
    try{ API.addEventListener('voiceschanged', el); }catch(e){}
  }

  return {
    supported, ready, hasTurkish, voices, turkishVoices,
    voiceFor, styleFor, konusulacak,
    say, sequence, stop, isSpeaking, speakingAgent, onVoicesReady,
    parcala, cumleler, emniyetMs,
    KIMLIK, PARCA,
  };
})();

/* ==== js/core/talk.js ==== */
/* SESLİ SOHBET — sıra alma döngüsü.

   Dikte ile sohbet arasındaki fark düğmedir. Dikte: mikrofona
   söylersin, alana yazılır, sen «Gönder»e basarsın, cevabı okursun.
   Sohbet: sen susarsın, sıra ajana geçer, o konuşur, susar, sıra
   sana döner. Arada düğme yoktur.

   Döngü dört durumdan geçer ve her zaman bu sırayla:

     dinliyor → düşünüyor → konuşuyor → dinliyor …

   ─────────────────────────────────────────────────────────────────

   AKUSTİK GERİ BESLEME — bu katmanın en önemli kısıtı

   Ajan konuşurken mikrofon AÇIK KALAMAZ. Kalırsa tanıyıcı ajanın
   kendi sesini duyar, metne çevirir ve ajan kendi cümlesine cevap
   vermeye başlar. Tarayıcının konuşma tanıma katmanında yankı
   engelleme yoktur.

   Bunun doğrudan sonucu: SESLE SÖZ KESİLEMEZ. «Dur» diye bağırmak
   çalışmaz, çünkü o anda seni duyan kimse yok.

   Söz kesme bu yüzden DOKUNMAYLA olur: bir düğme ya da boşluk tuşu.
   Ajan susar, mikrofon hemen açılır. Bu bir eksiklik değil, kısıtın
   dürüst karşılığıdır — sesle kesilebiliyormuş gibi yapmak, bağırıp
   cevap alamamaktan daha kötüdür.

   ─────────────────────────────────────────────────────────────────

   DEĞİŞMEZ: ses ikinci bir yol açmaz.

   Sesli sohbet `ESP.Office.send()` üzerinden geçer — yazarak sorduğun
   soruyla tamamen aynı yol. Aynı brifing, aynı ev kuralları denetimi,
   aynı kayıt. Ses yalnızca GİRİŞ ve ÇIKIŞ biçimidir; ayrı bir
   ayrıştırıcı, ayrı bir istem, ayrı bir kayıt yolu yoktur.

   Model kapalıyken de çalışır: kural motorunun cümlesi seslendirilir. */

window.ESP = window.ESP || {};

ESP.Talk = (function(){

  /* Kullanıcı sustu mu? Tanıyıcı bunu kendi söylemiyor; son metin
     değişiminden bu yana geçen süreyle karar veriyoruz.

     1.400 ms bilerek uzun: cümle ortasında düşünmek için bir saniye
     yetmiyor, iki saniye ise sohbeti ağırlaştırıyor. */
  const SESSIZLIK_MS = 1400;

  /* Ajan sustuktan sonra mikrofonu açmadan önceki bekleme. Sıfır
     olursa tarayıcı bazen konuşmanın son hecesini mikrofona
     düşürüyor. */
  const SIRA_GECIS_MS = 260;

  let oturum = null;

  function bosOturum(agentId, o){
    return {
      agentId,
      durum:'kapalı',        // kapalı | dinliyor | düşünüyor | konuşuyor
      metin:'',              // o anki duyulan metin (ara sonuç dahil)
      hata:null,
      sonCevap:null,
      sessizlikSaat:null,
      onChange:o.onChange || function(){},
      onTurn:o.onTurn || function(){},
      kapandi:false,
    };
  }

  function durumaGec(yeni, ek){
    if(!oturum) return;
    oturum.durum = yeni;
    if(ek) Object.assign(oturum, ek);
    try{ oturum.onChange(snapshot()); }catch(e){}
  }

  function snapshot(){
    if(!oturum) return { acik:false, durum:'kapalı', agentId:null, metin:'', hata:null };
    return {
      acik:!oturum.kapandi,
      durum:oturum.durum,
      agentId:oturum.agentId,
      metin:oturum.metin,
      hata:oturum.hata,
    };
  }

  function supported(){
    return ESP.Voice.supported();
  }
  /* Ses çıkışı olmadan da sohbet kurulabilir: sıra yine geçer, cevap
     yalnızca yazıyla görünür. Kullanıcıya bu SÖYLENİR. */
  function sesliCevapVar(){ return ESP.Speak.supported(); }

  /* ------------------------------------------------------ dinleme turu */

  function sessizlikSay(){
    if(!oturum) return;
    clearTimeout(oturum.sessizlikSaat);
    oturum.sessizlikSaat = setTimeout(() => {
      if(!oturum || oturum.durum !== 'dinliyor') return;
      ESP.Voice.stop();          /* onEnd tetiklenir, tur orada kapanır */
    }, SESSIZLIK_MS);
  }

  function dinle(){
    if(!oturum || oturum.kapandi) return;
    durumaGec('dinliyor', { metin:'', hata:null });

    ESP.Voice.start({
      continuous:true,
      onText(text){
        if(!oturum || oturum.durum !== 'dinliyor') return;
        oturum.metin = text;
        try{ oturum.onChange(snapshot()); }catch(e){}
        sessizlikSay();
      },
      onEnd(final){
        if(!oturum || oturum.kapandi) return;
        clearTimeout(oturum.sessizlikSaat);
        const soru = (final || oturum.metin || '').trim();
        if(!soru){
          /* Hiç konuşulmadı: döngü ölmez, yeniden dinler. */
          setTimeout(() => { if(oturum && !oturum.kapandi) dinle(); }, SIRA_GECIS_MS);
          return;
        }
        cevapla(soru);
      },
      onError(code){
        if(!oturum || oturum.kapandi) return;
        clearTimeout(oturum.sessizlikSaat);
        /* İzin sorunları döngüyü bitirir; geçici hatalar bitirmez. */
        if(code === 'not-allowed' || code === 'service-not-allowed' || code === 'unsupported'){
          durumaGec('kapalı', { hata:ESP.Voice.message(code) });
          stop();
          return;
        }
        durumaGec('dinliyor', { hata:ESP.Voice.message(code) });
        setTimeout(() => { if(oturum && !oturum.kapandi) dinle(); }, 500);
      },
    });
  }

  /* ------------------------------------------------------- cevap turu */

  async function cevapla(soru){
    if(!oturum || oturum.kapandi) return;
    const agentId = oturum.agentId;
    durumaGec('düşünüyor', { metin:soru });
    try{ oturum.onTurn({ role:'user', text:soru }); }catch(e){}

    let res;
    try{
      /* Yazarak sorulan soruyla AYNI yol: aynı brifing, aynı denetim,
         aynı kayıt. */
      res = await ESP.Office.send(agentId, soru);
    }catch(e){
      res = { text:'Cevap üretilemedi.', source:'rules', error:String(e && e.message || e) };
    }
    if(!oturum || oturum.kapandi) return;

    oturum.sonCevap = res;
    try{ oturum.onTurn({ role:'agent', text:res.text, source:res.source }); }catch(e){}

    if(!sesliCevapVar()){
      /* Ses çıkışı yok: sıra yine geçer, cevap yazıyla okunur. */
      setTimeout(() => { if(oturum && !oturum.kapandi) dinle(); }, SIRA_GECIS_MS);
      return;
    }

    durumaGec('konuşuyor');
    const sonuc = await ESP.Speak.say(res.text, { agent:agentId });
    if(!oturum || oturum.kapandi) return;

    /* Söz kesildiyse mikrofon HEMEN açılır: kullanıcı kesmişse
       söyleyecek bir şeyi var demektir. */
    const bekle = sonuc.iptal ? 0 : SIRA_GECIS_MS;
    setTimeout(() => { if(oturum && !oturum.kapandi) dinle(); }, bekle);
  }

  /* ----------------------------------------------------------- denetim */

  function start(agentId, opts){
    const o = opts || {};
    if(!supported()) return { ok:false, reason:'unsupported',
      message:ESP.Voice.message('unsupported') };
    stop();
    oturum = bosOturum(agentId || 'patron', o);
    durumaGec('dinliyor');
    dinle();
    return { ok:true };
  }

  /* Sözü kes: ajan susar, sıra hemen sana döner.

     Sesle değil DOKUNMAYLA çalışır — sebebi dosyanın başında. */
  function kes(){
    if(!oturum || oturum.kapandi) return false;
    if(oturum.durum !== 'konuşuyor') return false;
    ESP.Speak.stop();
    return true;
  }

  function stop(){
    const o = oturum;
    oturum = null;
    if(!o) return;
    o.kapandi = true;
    clearTimeout(o.sessizlikSaat);
    try{ ESP.Voice.stop(); }catch(e){}
    try{ ESP.Speak.stop(); }catch(e){}
    o.durum = 'kapalı';
    try{ o.onChange({ acik:false, durum:'kapalı', agentId:o.agentId, metin:'', hata:o.hata }); }catch(e){}
  }

  function isActive(){ return !!(oturum && !oturum.kapandi); }
  function durum(){ return snapshot(); }
  function agent(){ return oturum ? oturum.agentId : null; }

  return {
    supported, sesliCevapVar,
    start, stop, kes, isActive, durum, agent,
    SESSIZLIK_MS, SIRA_GECIS_MS,
  };
})();

        + '<line x1="2" y1="17" x2="150" y2="17"/><circle cx="52" cy="17" r="4.5" fill="var(--bg)"/>'
        + '<line x1="2" y1="27" x2="150" y2="27"/><circle cx="126" cy="27" r="4.5" fill="var(--bg)"/></svg>';
    },
  };

  function motif(sectionId){
    const fn = MOTIFS[sectionId];
    return fn ? fn() : '';
  }

  /* ---------- kucuk parcalar ----------
     Not: rozet/kart/tablo gibi bilesenler ESP.C icinde tek yerde durur.
     Burada yalnizca ESP.C'ye girmeyen, veriye bagli parcalar kalir. */

  /* Olcumun yonunu tek bakista veren ok. Yon iyi/kotu demek degildir;
     iyi/kotu yorumu daima kural motorundan (Calc) gelir. */
  function trend(dir){
    const map = { up:'&#9650;', down:'&#9660;', flat:'&#8212;' };
    return '<span class="trendmark trendmark--'+(dir||'flat')+'" aria-hidden="true">'
      + (map[dir] || map.flat) + '</span>';
  }

  /* ---------- kadran ----------

     Toparlanma skoru bir yuzde degil bir DURUMDUR; yatay bir cubuk onu
     "ne kadar dolduruldu" gibi okutuyordu. Yay, bir olcegin uzerindeki
     ibre gibi durur: sifir ve yuz uclarda, deger arada bir yerde.

     Bantlar (dusuk/orta/yuksek) yayin arkasinda soluk cizgilerle
     isaretlenir; skorun hangi banda dustugu renkten once KONUMDAN
     okunur. Renk tek basina anlam tasimaz. */
  function gauge(value, opts){
    const o = opts || {};
    const size = o.size || 132;
    const max = o.max || 100;
    const r = 54, cx = 60, cy = 60;
    /* 240 derecelik yay: alt taraf acik kalir, ibre orada baslar ve biter. */
    const START = 150, SWEEP = 240;
    const pt = deg => {
      const a = (deg * Math.PI) / 180;
      return [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
    };
    const arc = (from, to, w, cls2, extra) => {
      const [x1, y1] = pt(from), [x2, y2] = pt(to);
      const large = (to - from) > 180 ? 1 : 0;
      return '<path d="M' + x1 + ' ' + y1 + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 '
        + x2 + ' ' + y2 + '" class="' + cls2 + '" stroke-width="' + w + '" fill="none"'
        + ' stroke-linecap="round"' + (extra || '') + '/>';
    };

    const has = value != null && isFinite(value);
    const pct = has ? U.clamp(value / max, 0, 1) : 0;
    let out = '<div class="gauge" style="width:' + size + 'px">';
    out += '<svg viewBox="0 0 120 120" role="img" aria-label="'
      + (has ? 'Skor ' + Math.round(value) + ' / ' + max : 'Skor yok') + '">';
    out += arc(START, START + SWEEP, 7, 'gauge__track');
    /* Bant sinirlari — kadranin uzerindeki centikler. */
    (o.bands || []).forEach(b => {
      const d = START + SWEEP * U.clamp(b / max, 0, 1);
      const [ix, iy] = pt(d);
      const inner = r - 9;
      const a = (d * Math.PI) / 180;
      const x0 = (cx + inner * Math.cos(a)).toFixed(2);
      const y0 = (cy + inner * Math.sin(a)).toFixed(2);
      out += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + ix + '" y2="' + iy
        + '" class="gauge__band"/>';
    });
    if(has && pct > 0){
      out += arc(START, START + SWEEP * pct, 7, 'gauge__value gauge__value--' + (o.tone || ''));
    }
    out += '</svg>';
    out += '<div class="gauge__center">'
      + '<span class="gauge__num num">' + (has ? Math.round(value) : '&mdash;') + '</span>'
      + (o.label ? '<span class="gauge__label">' + esc(o.label) + '</span>' : '')
      + '</div>';
    out += '</div>';
    return out;
  }

  /* ---------- grafikler ---------- */
  /* Eksen adimini 1/2/5/10 ailesine oturtur ki etiketler yuvarlak sayi olsun. */
  function niceStep(raw){
    if(!isFinite(raw) || raw <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * mag;
  }

  /* ÇİZGİ GRAFİĞİ — sistemin en çok bakılan görseli.

     Beş şey eklendi ve hepsinin bir gerekçesi var:

       · SON NOKTA vurgulu ve DOĞRUDAN ETİKETLİ. Bir sağlık grafiğinde
         okunacak tek sayı «şu an neredeyim»dir; onu eksene bakarak
         tahmin ettirmek gereksiz iş. Her noktaya sayı yazmak ise
         grafiği tabloya çevirir — yalnızca sonuncusu yazılır.
       · HEDEF BANDI ADLANDIRILDI. Renkli bir dikdörtgen «bu ne?» diye
         sordurtuyordu.
       · IZGARA GERİ ÇEKİLDİ, taban çizgisi öne çıktı.
       · HER NOKTANIN kendi başlığı var: fareyle üstüne gelince tarih ve
         değer okunur. Kitaplık gerekmiyor — SVG `<title>` yeter.
       · NOKTALAR YÜZEY HALKASI taşır: üst üste binen iki nokta
         birbirine karışmaz. */
  function lineChart(series, opts){
    const o = opts || {};
    const w = 640, h = o.height || 190;
    const padL = 36, padT = 16, padB = 28;
    /* Son noktanın etiketi için sağda yer ayrılır; yoksa sayı grafiğin
       dışına taşar ve kırpılır. */
    const padR = o.endLabel === false ? 16 : 62;

    const all = series.reduce((acc, s2) => acc.concat(s2.data.filter(v => v != null)), []);
    if(!all.length) return '<p class="small dim">Grafik için henüz veri yok.</p>';

    const maxV = Math.max.apply(null, all), minV = Math.min.apply(null, all);
    const pad = Math.max(2, (maxV - minV) * 0.2);
    const step = niceStep((maxV + pad - Math.max(0, minV - pad)) / 4);
    const top = o.max != null ? o.max : Math.ceil((maxV + pad) / step) * step;
    const bottom = o.min != null ? o.min : Math.max(0, Math.floor((minV - pad) / step) * step);
    const n = Math.max.apply(null, series.map(s2 => s2.data.length));
    const X = i => padL + (w - padL - padR) * (n <= 1 ? 0.5 : i / (n - 1));
    const Y = v => h - padB - (h - padT - padB) * ((v - bottom) / ((top - bottom) || 1));

    let svg = '<svg class="chart" viewBox="0 0 ' + w + ' ' + h + '" role="img"'
      + (o.title ? ' aria-label="' + U.esc(o.title) + '"' : '') + '>';

    /* Hedef bandı çizgilerin ALTINDA durur ve adı yazılır. */
    if(o.band){
      const y1 = Y(o.band[1]), y2 = Y(o.band[0]);
      const yh = Math.max(0, y2 - y1);
      svg += '<rect class="band" x="' + padL + '" y="' + y1 + '" width="'
        + (w - padL - padR) + '" height="' + yh + '"/>';
      if(yh > 14){
        svg += '<text class="bandlbl" x="' + (w - padR - 6) + '" y="' + (y1 + 11)
          + '" text-anchor="end">' + U.esc(o.bandLabel || 'hedef bandı') + '</text>';
      }
    }

    const ticks = 4;
    for(let i = 0; i <= ticks; i++){
      const v = bottom + (top - bottom) * i / ticks;
      const y = Y(v);
      svg += '<line class="' + (i === 0 ? 'axis axis--base' : 'axis') + '" x1="' + padL
        + '" x2="' + (w - padR) + '" y1="' + y + '" y2="' + y + '"/>';
      svg += '<text x="' + (padL - 6) + '" y="' + (y + 3) + '" text-anchor="end">'
        + U.fmtNum(Math.round(v * 10) / 10) + '</text>';
    }

    series.forEach(s2 => {
      const pts = s2.data.map((v, i) => v == null ? null : [X(i), Y(v), v, i]).filter(Boolean);
      if(!pts.length) return;
      const d = 'M' + pts.map(p2 => p2[0].toFixed(1) + ' ' + p2[1].toFixed(1)).join(' L ');
      if(pts.length > 1 && o.area !== false){
        svg += '<path class="area' + (s2.accent ? ' area--accent' : '') + '" d="' + d
          + ' L ' + pts[pts.length - 1][0].toFixed(1) + ' ' + (h - padB)
