  /* Tek cagri. cfg: { provider, model, endpoint } — anahtar depodan okunur.
     req: { system, messages:[{role,text}], maxTokens, temperature, signal, onText } */
  async function chat(cfg, req){
    const provider = ESP.PROVIDERS[cfg && cfg.provider];
    if(!provider) throw fail('no_provider');
    if(!cfg.model && provider.kind !== 'builtin') throw fail('no_model');

    /* Cevrimdisiyken hic deneme: kota harcanmaz, sebep dogru soylenir. */
    if(provider.kind !== 'builtin' && offline()) throw fail('offline');

    const started = Date.now();
    const baseMessages = (req && req.messages) || [];
    /* Yanit token sinirina carparsa devam istegiyle tamamlanir. Kapatmak
       icin continue:false, sayiyi degistirmek icin maxContinuations. */
    const limit = (req && req.continue === false) ? 0
      : (req && req.maxContinuations != null ? req.maxContinuations : MAX_CONTINUATIONS);

    let text = '';
    let finish = '';
    let rounds = 0;
    let waited = 0;
    let slot = null;
    let picked = null;

    for(let round = 0; round <= limit; round++){
      /* Cok anahtarli havuz: kotasi musait anahtar HER turda yeniden
         secilir — ilk anahtarin gunu devam isteginde dolmus olabilir. */
      picked = null;
      if(provider.needsKey){
        if(!getKeys(provider.id).length) throw fail('no_key');
        picked = pickKey(cfg);
        /* Devam turunda kota bittiyse elde saglam bir metin var: onunla yetin. */
        if(!picked){
          if(round > 0) break;
          throw Object.assign(new Error('gunluk kota doldu'), { code:'daily_quota' });
        }
      }
      const quotaCfg = picked ? Object.assign({}, cfg, { keyId:picked.index }) : cfg;

      /* Devam turunda yarim kalmis son kelime atilir ve model oradan
         surdurur. Kirpma YALNIZ bu turun tabanina uygulanir; elde duran
         metne dokunulmaz, cunku devam istegi duserse onu dondurecegiz. */
      const prefix = round === 0 ? '' : dropLastWord(text);
      const messages = round === 0 ? baseMessages : baseMessages.concat([
        { role:'assistant', text:prefix },
        { role:'user', text:continueAsk(prefix.slice(-120)) },
      ]);

      const payload = Object.assign({}, req, {
        messages,
        model:cfg.model,
        endpoint:cfg.endpoint,
        key:picked ? picked.key : null,
        keyId:picked ? picked.index : null,
        /* Akis kullaniciya kesintisiz gorunmeli: parca degil birikmis
           metin yayinlanir. */
        onText:(req && req.onText)
          ? ev => req.onText({ text:joinContinuation(prefix, ev.text), delta:ev.delta })
          : undefined,
      });

      /* Sira: kota yoneticisi izin verene kadar bekle. Boylece dakikalik
         sinir HIC asilmaz; gun dolduysa beklemek yerine acikca soylenir. */
      slot = await ESP.Quota.acquire(quotaCfg, { signal:req && req.signal, onWait:req && req.onWait });
      waited += slot.waited || 0;

      let out;
      try{
        if(provider.kind === 'builtin') out = await callBuiltin(payload);
        else if(provider.kind === 'gemini') out = await callGemini(payload, provider);
        else out = await callOpenAI(payload, provider);
      }catch(err){
        /* Istek hic gonderilemediyse gunluk hakki tuketmis sayma. */
        if(err && (err.code === 'cancelled' || err.code === 'sandboxed'
                || err.code === 'no_key' || err.code === 'offline')){
          ESP.Quota.release(quotaCfg);
        }
        if(err && err.code === 'cancelled') throw err;
        /* Devam istegi duserse ilk turun metni durur: hata gostermektense
           eksik cumleyi kirpip eldekini vermek daha iyidir. */
        if(round > 0) break;
        throw err;
      }

      rounds++;
      text = round === 0 ? out.text : joinContinuation(prefix, out.text);
      finish = out.finish;
      if(!truncated(finish)) break;
    }

    /* Devam haklari bittigi hâlde hâlâ kesikse yarim cumle atilir. */
    const cut = truncated(finish);
    if(cut) text = trimToSentence(text);
    text = text.trim();
    if(!text) throw fail('empty');

    return {
      text, provider:provider.id, model:cfg.model || 'yerleşik',
      keyIndex:picked ? picked.index : null,
      ms:Date.now() - started, waited,
      usedToday:slot && slot.usedToday, rpd:slot && slot.rpd,
      rounds, truncated:cut,
    };
  }

  /* Yedekli cagri: zincirdeki ilk calisani kullanir.
     Ucretsiz modeller sik sik sinira takilir; tek model yerine sira denenir.
     Iptal ve anahtar hatalarinda zincir kirilir — beklemek anlamsizdir. */
  async function complete(chain, req){
    const list = (chain || []).filter(c => c && c.provider);
    if(!list.length) throw fail('no_provider');
    let last = fail('no_provider');
    for(let i = 0; i < list.length; i++){
      try{
        const res = await chat(list[i], req);
        if(i > 0) res.fellBack = true;
        return res;
      }catch(err){
        last = err;
        const code = err && err.code;
        if(code === 'cancelled') throw err;
        if(code === 'daily_quota'){
          /* Gunluk hak modele ozeldir: ayni saglayicinin baska modeli de
             ayni havuzu paylasiyor olabilir, yine de denemeye deger. */
          continue;
        }
        if(!retryable(code)){
          /* Anahtar/adres/kum havuzu hatasi zincirin geri kalanini da
             vurabilir: farkli saglayici varsa dene, ayni saglayiciysa dur. */
          const next = list[i+1];
          if(!next || next.provider === list[i].provider) throw err;
        }
      }
    }
    throw last;
  }

  /* Baglanti sinamasi — ayar ekraninda "Bağlantıyı dene" icin.
     Gercek bir istek yapar; bu yuzden gunluk haktan bir tane harcar. */
  async function test(cfg){
    const started = Date.now();
    const res = await chat(cfg, {
      system:'Yalnızca istenen kelimeyi yaz, başka hiçbir şey yazma.',
      messages:[{ role:'user', text:'Tek kelimeyle yanıtla: hazır' }],
      maxTokens:16,
      temperature:0,
      timeout:30000,
      /* Sinama kasten dar butceli: kesilme beklenen sonuctur, devam
         istegiyle bosuna kota harcanmaz. */
      continue:false,
    });
    return { ok:true, text:res.text.slice(0, 60), ms:Date.now() - started, model:res.model };
  }

  /* Bir yapilandirmanin kullanilabilir olup olmadigi (cagri yapmadan). */
  function ready(cfg){
    const provider = ESP.PROVIDERS[cfg && cfg.provider];
    if(!provider) return false;
    if(provider.kind === 'builtin') return builtinReady();
    if(provider.needsKey && !getKeys(provider.id).length) return false;
    if(provider.editableEndpoint && !(cfg.endpoint || '').trim()) return false;
    return !!cfg.model;
  }

  return {
    initBuiltin, builtinReady,
    getKey, getKeys, setKey, addKey, removeKeyAt, clearKeys, maskKey, maskKeys, pickKey,
    chat, complete, test, ready,
    errorText, retryable, resumable, offline, onceOnline, inSandbox, KEY_STORE,
    truncated, trimToSentence, joinContinuation, dropLastWord, DEFAULT_MAX_TOKENS,
  };
})();

/* ==== js/core/office.js ==== */
/* Ofis — yedi ajanin calisma duzeni.

   Akis her zaman ayni yonde gider:

     Intellect / SRS / Acoustic / Planner  →  brief(agentId)  →  model  →  ekran
          (skor, esik, siradaki adim)           (rapor, JSON)     (yorum)

   Kural motoru otoritedir. Ajan hesap yapmaz; brifingdeki sayiyi oldugu gibi
   kullanir. Model yoksa ofis kapanmaz: brifing dogrudan cumleye cevrilir
   (ruleText) ve ajanlar "kural motoru" rozetiyle konusur.

   Modele giden sey de sinirlidir (ESP.PRIVACY.model): yalnizca olculmus
   metrikler ve durum etiketleri. Ham ses kaydi, tam taslak metni ve atomik
   notun kendi cumlesi brifinge GIRMEZ — bu bir testle denetlenir.

   Tek istisna kullanicinin ACIKCA paylastigi parcadir: Sempozyum ekraninda
   bir teze tiklayip "Socrates'e sor" dendiginde tezin metni SORUNUN icinde
   gider, brifingin icinde degil. Fark onemli: brifing her cagride otomatik
   gider, soru yalnizca kullanici istediginde. */

window.ESP = window.ESP || {};

ESP.Office = (function(){
  const U = ESP.U;
  const S = ESP.S;

  /* --------------------------------------------------------------- ayarlar */

  function defaults(){
    return {
      provider:'builtin', model:'default',
      perAgent:{},            // agentId -> { provider, model }
      autoBriefing:true,
      temperature:0.4,
    };
  }

  function settings(){
    if(!S.office) S.office = defaults();
    return S.office;
  }

  async function saveSettings(patch){
    S.office = Object.assign(defaults(), settings(), patch || {});
    await ESP.Store.set('office', S.office);
    return S.office;
  }

  function cfgFor(agentId){
    const s = settings();
    const own = s.perAgent && s.perAgent[agentId];
    return own && own.provider ? own : { provider:s.provider, model:s.model };
  }

  function ready(agentId){
    return ESP.LLM.ready(cfgFor(agentId));
  }

  /* --------------------------------------------------------------- brifing

     Her brifing SAF bir nesnedir: ekranda da, modelde de, testte de ayni
     sey okunur. Icinde cumle degil olcum vardir.

     Her sayinin yaninda kesinlik etiketi durur. Bu sus degil: model
     "retansiyon %38" ile "retansiyon olculemedi" arasindaki farki gormek
     zorunda, yoksa olmayan bir dususu yorumlar. */

  function langBrief(){
    const d = ESP.SRS.deckStatus();
    const h = ESP.Intellect.hoursOf('lang', 14);
    return {
      agent:'polyglot',
      cards:{ total:d.total, active:d.active, cert:d.total ? 'measured' : 'missing' },
      due:{ value:d.due, overdue:d.overdue, maxOverdueDays:d.maxOverdueDays, cert:'measured' },
      retention:{ value:d.retention.value, cert:d.retention.cert,
        n:d.retention.n, of:d.retention.total },
      practice:{ minutes:h.minutes, enteredDays:h.enteredDays, windowDays:h.windowDays,
        cert:h.cert },
      boxes:d.boxes,
      answered7:ESP.SRS.answeredIn(7),
    };
  }

  function philoBrief(){
    const acik = ESP.Intellect.openArguments();
    const tikanan = ESP.Intellect.stalledArguments();
    const h = ESP.Intellect.hoursOf('philo', 14);
    const primer = (S.books || []).filter(b => b.kind === 'primary');
    /* Itiraz sayilari taşinir, itirazin METNI tasinmaz. */
    const acikItiraz = acik.reduce((a, x) =>
      a + (x.objections || []).filter(o => !o.answered).length, 0);
    return {
      agent:'socrates',
      arguments:{ open:acik.length, stalled:tikanan.length,
        closed:(S.args || []).filter(a => a.status === 'closed').length,
        cert:(S.args || []).length ? 'measured' : 'missing' },
      objections:{ unanswered:acikItiraz, cert:acik.length ? 'measured' : 'missing' },
      primaryTexts:{ value:primer.length, cert:(S.books || []).length ? 'measured' : 'missing' },
      practice:{ minutes:h.minutes, enteredDays:h.enteredDays, windowDays:h.windowDays,
        cert:h.cert },
    };
  }

  function musicBrief(){
    const m = ESP.Acoustic.musicStatus();
    const h = ESP.Intellect.hoursOf('music', 14);
    return {
      agent:'maestro',
      pieces:{ total:m.n || 0, measured:m.measured || 0, cert:m.cert },
      /* Parca adi bir olcum degil bir etikettir; ad olmadan "hangi parca
         platoda" cumlesi kurulamaz, bu yuzden AD gider, kayit gitmez. */
      plateaus:(m.plateaus || []).map(p => ({ name:p.piece.name, days:p.days, bpm:p.bpm })),
      progress:{ value:m.progress ? m.progress.value : null,
        cert:m.progress ? m.progress.cert : 'missing',
        reached:m.progress ? m.progress.reached : 0, n:m.progress ? m.progress.n : 0 },
      thresholds:(m.rows || []).filter(r => r.t.cert !== 'missing')
        .map(r => ({ name:r.piece.name, bpm:r.t.value, target:r.piece.targetBpm || null })),
      practice:{ minutes:h.minutes, enteredDays:h.enteredDays, windowDays:h.windowDays,
        cert:h.cert },
    };
  }

  function dictionBrief(){
    const d = ESP.Acoustic.dictionStatus(30);
    const t = ESP.Acoustic.dictionTrend();
    const h = ESP.Intellect.hoursOf('diction', 14);
    return {
      agent:'demosthenes',
      recordings:{ value:d.n || 0, windowDays:d.windowDays || 30, cert:d.cert },
      wpm:d.wpm || { value:null, cert:'missing' },
      errorRate:d.errorRate || { value:null, cert:'missing' },
      band:ESP.Acoustic.WPM_BAND,
      trend:{ direction:t.direction || null, cert:t.cert },
      practice:{ minutes:h.minutes, enteredDays:h.enteredDays, windowDays:h.windowDays,
        cert:h.cert },
    };
  }

  function readingBrief(){
    const ss = ESP.Intellect.syntopic();
    const h = ESP.Intellect.hoursOf('reading', 14);
    return {
      agent:'aristoteles',
      notes:{ total:ss.total, linked:ss.linked, unlinked:ss.total - ss.linked,
        cert:ss.total ? 'measured' : 'missing' },
      books:{ value:ss.books, authors:ss.authors, cert:ss.books ? 'measured' : 'missing' },
      ssk:{ value:ss.value, cert:ss.cert, why:ss.why || null },
      suggestions:ESP.Intellect.linkSuggestions(3).length,
      practice:{ minutes:h.minutes, enteredDays:h.enteredDays, windowDays:h.windowDays,
        cert:h.cert },
    };
  }

  function writingBrief(){
    const w = ESP.Intellect.wordsWritten(7);
    const r = ESP.Intellect.draftRatio();
    const h = ESP.Intellect.hoursOf('writing', 14);
    /* Taslak METNI gitmez; yalnizca son taslagin OLCUMU gider. */
    const son = (S.drafts || [])[0];
    const ok = son ? ESP.Intellect.readability(son.text) : { value:null, cert:'missing' };
    return {
      agent:'montaigne',
      words7:{ value:w.value, cert:w.cert, enteredDays:w.enteredDays },
      drafts:{ value:r.drafts, revisions:r.revisions, ratio:r.value, cert:r.cert },
      readability:{ value:ok.value, cert:ok.cert,
        band:ok.band ? ok.band.label : null,
        wordsPerSentence:ok.wordsPerSentence || null },
      practice:{ minutes:h.minutes, enteredDays:h.enteredDays, windowDays:h.windowDays,
        cert:h.cert },
    };
  }

  function patronBrief(){
    const next = ESP.Planner.nextAction();
    const ehs = ESP.Intellect.ehs(14);
    const denge = ESP.Planner.balance(7);
    return {
      agent:'patron',
      lang:langBrief(), philo:philoBrief(), music:musicBrief(),
      diction:dictionBrief(), reading:readingBrief(), writing:writingBrief(),
      ehs:{ value:ehs.value, cert:ehs.cert, windowDays:ehs.windowDays,
        enteredDays:ehs.enteredDays, untouched:ehs.untouched },
      balance:{ cert:denge.cert, skewed:denge.skewed,
        top:denge.top ? denge.top.label : null,
        untouched:denge.untouched.map(d => d.label) },
      streak:ESP.Model.streak(),
      cross:ESP.Planner.crossFindings().map(c => ({ id:c.id, from:c.from, to:c.to, text:c.text })),
      next:{ rank:next.rank, title:next.title, why:next.why, agent:next.agent },
      openDecisions:ESP.Model.openDecisions().length,
    };
  }

  const BRIEFS = {
    polyglot:langBrief, socrates:philoBrief, maestro:musicBrief,
    demosthenes:dictionBrief, aristoteles:readingBrief, montaigne:writingBrief,
    patron:patronBrief,
  };

  function brief(agentId){
    const fn = BRIEFS[agentId] || patronBrief;
    return fn();
  }

  /* ------------------------------------------------------------- kural dili

     Model kapaliyken ajanin konustugu dil. Brifingdeki sayilar dogrudan
     cumleye cevrilir; yorum yoktur, YALNIZCA OLCUM vardir.

     Bu fonksiyon sistemin yedegi degil VARSAYILANIDIR: model bir
     iyilestirmedir. Bu yuzden ciktisi "gecici bir sey" gibi degil, bitmis
     bir cumle gibi yazilir. */
  function pct(v){ return v == null ? null : '%' + Math.round(v * 100); }

  function ruleText(agentId, b){
    const brf = b || brief(agentId);
    const cumle = [];

    if(agentId === 'polyglot'){
      if(brf.cards.cert === 'missing') return 'Henüz kart yok. İlk kartı eklediğinde retansiyon ölçülmeye başlar.';
      cumle.push(brf.cards.total + ' kart var, ' + brf.cards.active + ' tanesi üretimde kullanılmış.');
      if(brf.due.overdue) cumle.push(brf.due.overdue + ' kartın vadesi geçti (en çok geciken ' + brf.due.maxOverdueDays + ' gün).');
      else if(brf.due.value) cumle.push(brf.due.value + ' kart bugün vadeli.');
      else cumle.push('Bugün vadesi gelen kart yok.');
      cumle.push(brf.retention.cert === 'missing'
        ? 'Retansiyon henüz ölçülemedi: hiç cevaplanmış kart yok.'
        : 'Retansiyon ' + pct(brf.retention.value) + ' (' + brf.retention.n + ' karttan hesaplandı).');
      return cumle.join(' ');
    }

    if(agentId === 'socrates'){
      if(brf.arguments.cert === 'missing') return 'Henüz tez girilmemiş. Tek cümlelik bir tez yazmak yeterli; gerisini sorularla açarız.';
      cumle.push(brf.arguments.open + ' tez açık, ' + brf.arguments.closed + ' tez kapandı.');
      if(brf.objections.unanswered) cumle.push(brf.objections.unanswered + ' itiraz cevaplanmayı bekliyor.');
      if(brf.arguments.stalled) cumle.push(brf.arguments.stalled + ' tez 14 günden uzun süredir dokunulmamış.');
      cumle.push(brf.primaryTexts.cert === 'missing'
        ? 'Kaynak listesi boş.'
        : brf.primaryTexts.value + ' primer metin kayıtlı.');
      return cumle.join(' ');
    }

    if(agentId === 'maestro'){
      if(brf.pieces.cert === 'missing') return 'Henüz parça ya da teknik girilmemiş. Bir tane ekleyip tempo kaydetmeye başlayabilirsin.';
      cumle.push(brf.pieces.total + ' parça var, ' + brf.pieces.measured + ' tanesinin temiz tempo eşiği ölçüldü.');
      if(brf.plateaus.length){
        const p = brf.plateaus[0];
        cumle.push(p.name + ' ' + p.days + ' gündür ' + p.bpm + ' BPM\'de duruyor.');
      }
      if(brf.progress.cert !== 'missing'){
        cumle.push('Hedefi olan ' + brf.progress.n + ' parçanın ' + brf.progress.reached + ' tanesi hedef tempoda.');
      }
      return cumle.join(' ');
    }

    if(agentId === 'demosthenes'){
      if(brf.recordings.cert === 'missing') return 'Son 30 günde diksiyon kaydı yok. Bir tekerleme, bir süre ve kendi işaretlediğin hata sayısı yeter.';
      cumle.push('Son ' + brf.recordings.windowDays + ' günde ' + brf.recordings.value + ' kayıt var.');
      if(brf.wpm.cert !== 'missing'){
        const bant = brf.wpm.value >= brf.band.min && brf.wpm.value <= brf.band.max
          ? 'bandın içinde' : 'bandın dışında';
        cumle.push('Konuşma hızı medyanı ' + brf.wpm.value + ' kelime/dakika — ' + brf.band.min + '–' + brf.band.max + ' bandına göre ' + bant + '.');
      }
      if(brf.errorRate.cert !== 'missing'){
        cumle.push('Kendi işaretlediğin hata oranı ' + pct(brf.errorRate.value) + ' (tahmin).');
      }
      return cumle.join(' ');
    }

    if(agentId === 'aristoteles'){
      if(brf.notes.cert === 'missing') return 'Henüz atomik not yok. Tek fikir taşıyan tek cümlelik bir notla başlanır.';
      cumle.push(brf.notes.total + ' not var, ' + brf.notes.linked + ' tanesi bağlı, ' + brf.notes.unlinked + ' tanesi bağsız.');
      cumle.push(brf.ssk.cert === 'missing'
        ? 'Sentez katsayısı hesaplanamadı: ' + (brf.ssk.why || 'kaynak yok') + '.'
        : 'Sentez katsayısı ' + U.fmtNum(Math.round(brf.ssk.value * 100) / 100)
          + ' (' + brf.books.value + ' kaynak, ' + brf.books.authors + ' yazar).');
      if(brf.suggestions) cumle.push(brf.suggestions + ' bağ önerisi bekliyor.');
      return cumle.join(' ');
    }

    if(agentId === 'montaigne'){
      if(brf.drafts.cert === 'missing') return 'Henüz taslak yok. Bir başlık ve bir paragraf yeter; ölçüm oradan başlar.';
      cumle.push(brf.drafts.value + ' taslak, toplam ' + brf.drafts.revisions + ' revizyon.');
      cumle.push(brf.words7.cert === 'missing'
        ? 'Son 7 günde yazı oturumu girilmemiş.'
        : 'Son 7 günde ' + U.fmtNum(brf.words7.value) + ' kelime yazıldı.');
      if(brf.readability.cert !== 'missing'){
        cumle.push('Son taslağın okunabilirliği ' + brf.readability.value + ' (' + brf.readability.band + '), cümle başına ' + U.fmtNum(brf.readability.wordsPerSentence) + ' kelime.');
      }
      return cumle.join(' ');
    }

    /* Patron — kotu haber once. Iyi haberi kotu haberin arkasina saklamaz. */
    const p = brf;
    cumle.push(p.next.title + '.');
    if(p.balance.skewed && p.balance.untouched.length){
      cumle.push('Haftanın pratiği ' + p.balance.top + ' tarafına yığılmış; '
        + p.balance.untouched.join(' ve ') + ' hiç açılmamış.');
    }
    cumle.push(p.ehs.cert === 'missing'
      ? 'Entelektüel hacim hesaplanamadı: son ' + p.ehs.windowDays + ' günde ölçülmüş pratik yok.'
      : 'Entelektüel hacim ' + U.fmtNum(Math.round(p.ehs.value * 10) / 10)
        + ' (' + p.ehs.windowDays + ' günün ' + p.ehs.enteredDays + '\'inden hesaplandı).');
    if(p.streak) cumle.push('Seri ' + p.streak + ' gün.');
    if(p.openDecisions) cumle.push(p.openDecisions + ' karar takipte.');
    return cumle.join(' ');
  }

  /* --------------------------------------------------------------- model */

  function systemPrompt(agentId, b){
    const a = ESP.AGENT_BY_ID[agentId] || ESP.AGENT_BY_ID.patron;
    return [
      'Sen ' + a.name + ' adında bir entelektüel pratik ajanısın. Rolün: ' + a.role + '.',
      'Alanın: ' + a.scope,
      'Alanın DIŞI: ' + a.notScope + ' Alan dışı bir soru gelirse kısaca ilgili uzmana yönlendir.',
      '',
      'KURALLAR (bunlar tartışılmaz):',
      '1. Sayı üretme. Bütün sayılar aşağıdaki brifingden gelir. Brifingde olmayan bir sayıyı yazma.',
      '2. Sertifika ya da resmî seviye verme. Seviye etiketini kişiye değil ÜRETİME ver ve '
        + 'daima tarih aralığıyla birlikte: «son 30 günlük üretimin şu bandın kriterlerini karşılıyor».',
      '3. Mutlak yetenek yargısı kurma («yeteneklisin / yeteneksizsin»). Yalnızca süreç hakkında konuş.',
      '4. Sonuç garantisi verme. Yön ve olasılık söylenir, garanti verilmez.',
      '5. Estetik otorite iddia etme («kusursuz», «yayımlanmaya hazır»).',
      '6. Bir metrik «veri yok» ise onu sıfır gibi yorumlama; ölçülmediğini söyle.',
      '',
      'ÜSLUP: Türkçe, kısa, somut. En fazla üç cümle. Kötü haberi iyi haberin arkasına saklama.',
      'Soru sorabilirsin ama aynı anda en fazla bir tane.',
      '',
      'BRİFİNG (tek veri kaynağın):',
      JSON.stringify(b || brief(agentId)),
    ].join('\n');
  }

  /* ---------------------------------------------------------------- denetim

     Model ciktisi ev kurallarina karsi denetlenir.

     KRITIK: `validate` metni YENIDEN YAZMAZ, ISARETLER. Sessizce duzeltmek
     anlami tersine cevirebilir — "kesinlikle basaramazsin" cumlesindeki
     "kesinlikle"yi silmek cumleyi duzeltmez, gizler. Cagiran taraf ya
     uyariyi gosterir ya kural motorunun cumlesine duser.

     Uc sey aranir:
       banned       yasak kalip (ESP.GROUNDING.banned)
       scope        ajanin alani disina cikma
       unsupported  brifingde gecmeyen sayi */
  function validate(text, opts){
    const o = opts || {};
    const s = String(text || '');

    const hits = ESP.GROUNDING.banned.filter(b => b.re.test(s))
      .map(b => ({ id:b.id, why:b.why }));

    /* Alan ihlali: ajanin `notScope` alaninda gecen anahtar kelimeler.
       Kaba bir denetim ve oyle kalmali — dar tutulmazsa dogru cumleyi de
       yakalar ve ajan susar. Yalnizca BASKA bir disiplinin adi gecerse
       ve kendi disiplininin adi hic gecmezse isaretlenir. */
    const scope = [];
    const a = ESP.AGENT_BY_ID[o.agentId];
    if(a && a.owns){
      const kendi = ESP.DISCIPLINES.filter(d => d.agent === a.id);
      const baskasi = ESP.DISCIPLINES.filter(d => d.agent !== a.id && d.agent !== 'patron');
      const kendiGecti = kendi.some(d => new RegExp('\\b' + d.short + '', 'i').test(s));
      baskasi.forEach(d => {
        if(!kendiGecti && new RegExp('\\b' + d.short + '\\b', 'i').test(s)){
          scope.push({ id:'scope:' + d.id, why:d.label + ' alanı bu masaya ait değil' });
        }
      });
    }

    /* Desteksiz sayi: metinde gecen ama brifingde bulunmayan sayilar.
       Kucuk sayilar (esik alti) sayilmaz: "iki itiraz" ya da "3 gün" bir
       olcum iddiasi degil dilin kendisidir. */
    const unsupported = [];
    if(o.brief){
      const havuz = JSON.stringify(o.brief);
      const sayilar = s.match(/\d+(?:[.,]\d+)?/g) || [];
      const gorulen = {};
      sayilar.forEach(n => {
        const sayi = Number(String(n).replace(',', '.'));
        if(!isFinite(sayi) || sayi < ESP.GROUNDING.numberFloor) return;
        if(gorulen[n]) return;
        gorulen[n] = true;
        /* Yuvarlanmis hali de kabul edilir: brifingde 0.384 varsa metinde
           "%38" yazmasi uydurma degildir. */
        const yakin = [n, String(Math.round(sayi)), String(Math.round(sayi * 100) / 100),
          String(sayi / 100)];
        if(!yakin.some(v => havuz.indexOf(v) >= 0)){
          unsupported.push(n);
        }
      });
    }

    const warnings = hits.concat(scope);
    return {
      text:s,                       // METIN DEGISTIRILMEZ
      ok:warnings.length === 0 && unsupported.length === 0,
      violations:hits,
      scopeBreaches:scope,
      unsupported,
      warnings,
      note:warnings.length
        ? warnings.map(h => h.why).join(', ') + ' tespit edildi.'
        : (unsupported.length ? 'Brifingde geçmeyen sayı: ' + unsupported.join(', ') + '.' : ''),
    };
  }

  /* ------------------------------------------------------------- konusma */

  const HAFIZA_TUR = 8;

  function historyFor(agentId, extra){
    const list = (extra && extra.length ? extra : (S.officeChats[agentId] || []));
    return list.slice(-HAFIZA_TUR).map(m => ({
      role:m.role === 'user' ? 'user' : 'assistant',
      text:String(m.text || ''),
    })).filter(m => m.text);
  }

  async function ask(agentId, question, opts){
    const o = opts || {};
    const b = o.brief || brief(agentId);
    const fallback = { text:ruleText(agentId, b), source:'rules', brief:b };

    const cfg = cfgFor(agentId);
    if(!ESP.LLM.ready(cfg)) return fallback;

    /* Gecmis acikca kapatilabilir: toplantida her ajan gundeme TEK basina
       cevap verir, sohbet gecmisi oraya karismaz. */
    const gecmis = o.history === false ? [] : historyFor(agentId, o.history);

    try{
      const res = await ESP.LLM.chat(cfg, {
        system:systemPrompt(agentId, b),
        messages:gecmis.concat([{ role:'user', text:question || 'Durumu özetle.' }]),
        temperature:settings().temperature,
        maxTokens:o.maxTokens || 600,
      });
      const check = validate(res.text, { agentId, brief:b });
      if(!check.ok){
        return { text:fallback.text, source:'rules', brief:b,
          blocked:check, note:'Model çıktısı ev kurallarına takıldı: ' + check.note };
      }
      return { text:res.text.trim(), source:'model', brief:b, model:cfg.model };
    }catch(e){
      return Object.assign({}, fallback, {
        error:ESP.LLM.errorText ? ESP.LLM.errorText(e) : String(e && e.message || e) });
    }
  }

  /* Kullanicinin sorusunu ajana gonderir ve iki mesaji da gecmise yazar.

     Tuzak (devir notu §8.3): gecmisi ONCE yakala, sonra ekle. Soru once
     gecmise eklenip ask() sonra cagrilirsa soru sohbet gecmisinde iki kez
     gorunur ve model kendi kendine cevap vermis gibi olur. */
  async function send(agentId, question){
    const onceki = (S.officeChats[agentId] || []).slice();
    const res = await ask(agentId, question, { history:onceki });

    const liste = (S.officeChats[agentId] || []).concat([
      { role:'user', text:question, at:new Date().toISOString() },
      { role:'agent', text:res.text, source:res.source, at:new Date().toISOString(),
        blocked:res.blocked ? res.blocked.note : null, error:res.error || null },
    ]);
    S.officeChats[agentId] = liste.slice(-40);
    await ESP.Store.set('chats/' + agentId, { agentId, messages:S.officeChats[agentId] });
    return res;
  }

  async function clearChat(agentId){
    S.officeChats[agentId] = [];
    await ESP.Store.set('chats/' + agentId, { agentId, messages:[] });
  }

  /* ---------------------------------------------------------- masa notlari

     Not bir tavsiye degil BULGU'dur: kosul saglandiginda kendiliginden
     birakilir, kosul gectiginde kendiliginden kalkar. Kullanici silmez.

     Ayni masaya ayni cumleyle giden uc bulgu uc satir yazmaz: bilgi ayni,
     satir tek. Bes masa ayni notlari uretip kendi satirlarini suzuyordu;
     kare onbellegi bunu bire indirir. */
  function notes(agentId){
    const hepsi = ESP.Memo.of('office.notes', notesRaw);
    return agentId ? hepsi.filter(n => n.agent === agentId) : hepsi;
  }

  function notesRaw(){
    const out = [];
    const add = (agent, kind, text, route) => {
      const k = ESP.NOTE_TYPES.find(x => x.id === kind) || ESP.NOTE_TYPES[3];
      const a = ESP.AGENT_BY_ID[agent];
      out.push({ agent, name:a ? (a.short || a.name) : agent,
        kind, tone:k.tone, label:k.label, text, route:route || null });
    };

    /* --- dil --- */
    const d = ESP.SRS.deckStatus();
    if(d.overdue) add('polyglot', 'overdue',
      d.overdue + ' kartın vadesi geçti; en çok geciken ' + d.maxOverdueDays + ' gün.', 'lang');
    if(d.retention.cert !== 'missing'
       && d.retention.n >= ESP.Planner.RETENTION_MIN_CARDS
       && d.retention.value < ESP.Planner.RETENTION_FLOOR){
      add('polyglot', 'blocked',
        'Retansiyon ' + pct(d.retention.value) + ' — tabanın altında. Yeni kelime eklemek bunu daha da düşürür.', 'lang');
    }
    if(d.total && !d.due && d.retention.cert !== 'missing' && d.retention.value >= 0.8){
      add('polyglot', 'win', 'Vadesi gelen kart yok ve retansiyon ' + pct(d.retention.value) + '.', 'lang');
    }

    /* --- felsefe --- */
    const tikanan = ESP.Intellect.stalledArguments();
    if(tikanan.length === 1){
      add('socrates', 'blocked', 'Bir tez 14+ gündür açık ve dokunulmamış.', 'symposium');
    }else if(tikanan.length > 1){
      add('socrates', 'blocked', tikanan.length + ' tez 14+ gündür açık ve dokunulmamış.', 'symposium');
    }

    /* --- muzik --- */
    ESP.Acoustic.plateaus().slice(0, 3).forEach(p => {
      add('maestro', 'blocked', p.piece.name + ' ' + p.days + ' gündür '
        + p.bpm + ' BPM\'de duruyor.', 'studio');
    });
    (S.pieces || []).forEach(p => {
      if(p.targetBpm && p.cleanBpm && p.cleanBpm >= p.targetBpm
         && p.thresholdAt && U.diffDays(p.thresholdAt, U.todayISO()) <= 7){
        add('maestro', 'win', p.name + ' hedef tempoya ulaştı: ' + p.cleanBpm + ' BPM.', 'studio');
      }
    });

    /* --- diksiyon --- */
    const dik = ESP.Acoustic.dictionStatus(30);
    if(dik.cert === 'missing'){
      add('demosthenes', 'overdue', 'Son 30 günde diksiyon kaydı yok.', 'studio');
    }else{
      const t = ESP.Acoustic.dictionTrend();
      if(t.cert !== 'missing' && t.direction === 'iyi'){
        add('demosthenes', 'win', 'Hata oranı iki hafta öncesine göre düşüyor.', 'studio');
      }
    }

    /* --- okuma --- */
    const ss = ESP.Intellect.syntopic();
    const bagsiz = ss.total - ss.linked;
    if(bagsiz >= 3){
      add('aristoteles', 'overdue', bagsiz + ' not hiçbir yere bağlı değil.', 'library');
    }
    const oneri = ESP.Intellect.linkSuggestions(3);
    if(oneri.length){
      add('aristoteles', 'info', oneri.length + ' bağ önerisi bekliyor: ortak kavramı '
        + 'olan notlar var.', 'library');
    }

    /* --- yazi --- */
    const w = ESP.Intellect.wordsWritten(7);
    if(w.cert === 'missing'){
      add('montaigne', 'overdue', 'Son 7 günde yazı oturumu girilmemiş.', 'writing');
    }
    const dr = ESP.Intellect.draftRatio();
    if(dr.cert !== 'missing' && dr.drafts >= 3 && dr.value < 0.5){
      add('montaigne', 'info', dr.drafts + ' taslak var ama taslak başına '
        + U.fmtNum(Math.round(dr.value * 10) / 10) + ' revizyon düşüyor.', 'writing');
    }

    /* --- patron --- */
    const denge = ESP.Planner.balance(7);
    if(denge.skewed){
      add('patron', 'info', 'Haftanın pratiği ' + denge.top.label + ' tarafına yığılmış; '
        + denge.untouched.map(x => x.label).join(', ') + ' hiç açılmamış.', 'analytics');
    }
    ESP.Model.openDecisions().forEach(dec => {
      const gun = U.diffDays(dec.openedAt.slice(0, 10), U.todayISO());
      if(gun >= 2) add('patron', 'overdue', 'Karar ' + gun + ' gündür açık: ' + dec.text, 'meeting');
    });
    const seri = ESP.Model.streak();
    if(seri >= 7) add('patron', 'win', 'Seri ' + seri + ' gün.', 'today');

    return out;
  }

  /* ------------------------------------------------------ masalar arasi devir

     Bir masanin BULGUSU baska bir masanin ISI olabilir. Patron'un tek isi o
     devri gormek ve siraya koymaktir.

     Uc kural devri durust tutar:
       1. Devir bir tavsiye degildir — "su olculdu, su masaya dusuyor" der.
       2. Olculmemis bir sey devredilemez. Tahmin devir uretmez.
       3. Her satir tiklanabilir: bulgunun dustugu ekrani acar. */
  function handoffs(){
    return ESP.Memo.of('office.handoffs', handoffsRaw);
  }

  function handoffsRaw(){
    return ESP.Planner.crossFindings().map(c => {
      const from = ESP.AGENT_BY_ID[c.from], to = ESP.AGENT_BY_ID[c.to];
      return {
        id:c.id,
        from:c.from, fromName:from ? (from.short || from.name) : c.from,
        to:c.to, toName:to ? (to.short || to.name) : c.to,
        finding:c.text,
        route:c.route,
        tone:'info',
      };
    });
  }

  function handoffsFor(agentId){
    const hepsi = handoffs();
    return {
      out:hepsi.filter(h => h.from === agentId),
      in:hepsi.filter(h => h.to === agentId),
    };
  }

  /* ------------------------------------------------------------- gundem

     Gundem MODEL tarafindan secilmez: puanlama secer. Model yalnizca
     secilen gundemi konusur. */
  function agendaCandidates(){
    const out = [];
    const add = (id, puan, detay) => {
      const t = ESP.AGENDA_TYPES.find(x => x.id === id);
      if(t) out.push({ id, label:t.label, lead:t.lead, score:puan, detail:detay || '' });
    };

    const tikanan = ESP.Planner.blockedCore();
    if(tikanan.length) add('blocked', 100 + tikanan.length, tikanan[0].label);

    const r = ESP.SRS.retention();
    if(r.cert !== 'missing' && r.n >= ESP.Planner.RETENTION_MIN_CARDS
       && r.value < ESP.Planner.RETENTION_FLOOR){
      add('retention', 90, 'Retansiyon ' + pct(r.value) + ' (' + r.n + ' karttan).');
    }

    const acil = ESP.Planner.deadlines().filter(x => x.urgent);
    if(acil.length) add('deadline', 85, acil[0].goal.label + ' — ' + acil[0].daysLeft + ' gün.');

    const denge = ESP.Planner.balance(7);
    if(denge.skewed) add('balance', 60, denge.top.label + ' tarafına yığılma.');

    const ss = ESP.Intellect.syntopic();
    if(ss.total - ss.linked >= 3) add('synthesis', 50, (ss.total - ss.linked) + ' bağsız not.');

    add('review', 10, 'Haftalık gözden geçirme.');
    return out.sort((a, b) => b.score - a.score);
  }

  /* ------------------------------------------------------- gunluk brifing

     Gunde TEK model cagrisi. Sonuc gune yazilir; ayni gun tekrar cagrilmaz.
     Model kapaliysa brifing yine uretilir — kural motorunun cumlesiyle. */
  async function dailyBriefing(dateISO){
    const gun = dateISO || U.todayISO();
    if(S.officeBriefings[gun]) return S.officeBriefings[gun];

    const b = patronBrief();
    const res = await ask('patron', 'Günün brifingini yaz. Önce bekleyen iş, sonra '
      + 'varsa dengesizlik, en son kazanım.', { brief:b, history:false, maxTokens:300 });

    const rec = { date:gun, text:res.text, source:res.source,
      at:new Date().toISOString(), next:b.next };
    S.officeBriefings[gun] = rec;
    await ESP.Store.set('briefings/' + gun, rec);
    return rec;
  }

  /* ------------------------------------------------------------- toplanti

     Gundem secilir, alti uzman sirayla konusur, Patron kapatir. Her tur ayri
     bir cagridir ve GELDIGI ANDA ekrana basilir — hepsinin bitmesi
     beklenmez. Uzun suren bir toplantida kullanici ilerlemeyi gorur.

     Kapanistaki karar ESP.Planner.nextAction()'dan gelir; Patron onu
     degistiremez, yalnizca gerekcelendirir. */
  async function runMeeting(agendaId, onTurn){
    const gundem = agendaCandidates().find(a => a.id === agendaId) || agendaCandidates()[0];
    const turlar = [];
    const uzmanlar = ESP.AGENTS.filter(a => a.id !== 'patron');

    for(const a of uzmanlar){
      const b = brief(a.id);
      const res = await ask(a.id, 'Toplantı gündemi: ' + gundem.label + '. ' + gundem.lead
        + ' Kendi masandan tek paragrafla katkı ver.',
        { brief:b, history:false, maxTokens:260 });
      const tur = { agentId:a.id, name:a.name, text:res.text, source:res.source,
        blocked:res.blocked ? res.blocked.note : null };
      turlar.push(tur);
      if(typeof onTurn === 'function') onTurn(tur);
    }

    const karar = ESP.Planner.nextAction();
    const pb = patronBrief();
    const kapanis = await ask('patron',
      'Uzmanların katkısını okudun. Çelişki varsa ESP.PRECEDENCE sırasına göre çöz. '
      + 'Kararı DEĞİŞTİRME, gerekçelendir. Karar: «' + karar.title + '» — ' + karar.why,
      { brief:pb, history:false, maxTokens:300 });

    const rec = {
      id:U.uid('mtg'), at:new Date().toISOString(),
      agenda:gundem.id, agendaLabel:gundem.label,
      turns:turlar,
      closing:{ text:kapanis.text, source:kapanis.source },
      decision:{ id:karar.id, title:karar.title, why:karar.why,
        route:karar.route, rank:karar.rank },
    };
    S.officeMeetings.unshift(rec);
    await ESP.Store.set('meetings/' + rec.id, rec);
    if(typeof onTurn === 'function') onTurn({ agentId:'patron', name:'Patron',
      text:kapanis.text, source:kapanis.source, closing:true });
    return rec;
  }

  /* ------------------------------------------------------------- yukleme */

  async function load(){
    S.office = Object.assign(defaults(), await ESP.Store.get('office'));
    S.officeChats = {};
    ((await ESP.Store.list('chats')) || []).forEach(row => {
      S.officeChats[row.agentId || row.id] = row.messages || [];
    });
    S.officeMeetings = ((await ESP.Store.list('meetings')) || [])
      .sort((a, b) => (a.at || '') < (b.at || '') ? 1 : -1);
    S.officeBriefings = {};
    ((await ESP.Store.list('briefings')) || []).forEach(row => {
      S.officeBriefings[row.date || row.id] = row;
    });
    return S.office;
  }

  return {
    defaults, settings, saveSettings, cfgFor, ready,
    brief, langBrief, philoBrief, musicBrief, dictionBrief, readingBrief,
    writingBrief, patronBrief,
    ruleText, systemPrompt, validate, ask, historyFor, HAFIZA_TUR,
    notes, handoffs, handoffsFor, agendaCandidates, dailyBriefing, runMeeting,
    send, clearChat, load,
  };
})();

/* ==== js/core/palette.js ==== */
/* Komut paleti — Ctrl+K.

   Her ekran, her hizli eylem ve her ajan tek bir aramadan ulasilir olsun
   diye vardir. Fare ile gezinmek zorunda kalmadan sistemin herhangi bir
   yerine gitmek, gunluk kullanimin surtunmesini belirgin dusurur.

   Palet ayni zamanda EN HIZLI VERI GIRISIDIR: «45 dk gitar» yazip Enter'a
   basmak bir oturum kaydeder. Yazilan sey kullanicinin kendi cumlesidir,
   modelin degil — bu yuzden onay kutusundan gecmez; ama YAZILMADAN ONCE
   ne kaydedilecegi gosterilir. */

window.ESP = window.ESP || {};

ESP.Palette = (function(){
  const U = ESP.U;

  let open = false;
  let query = '';
  let index = 0;
  let bekleyen = null;      // ayristirilmis ama henuz yazilmamis oturumlar

  function commands(){
    const out = [];

    /* ekranlar */
    (ESP.App ? ESP.App.SECTIONS : []).forEach(sec => {
      sec.views.forEach(v => {
        out.push({ id:'go:' + v.route, kind:'Sayfa', label:v.label, hint:sec.label,
          run:() => ESP.App.go(v.route) });
      });
    });

    /* hizli eylemler */
    out.push({ id:'act:review', kind:'Eylem', label:'Kart çalışmasına başla',
      hint:'Dil', run:() => { ESP.S.ui.langTab = 'calis'; ESP.App.go('lang'); } });
    out.push({ id:'act:card', kind:'Eylem', label:'Kelime listesi yapıştır',
      hint:'Dil', run:() => { ESP.S.ui.langTab = 'ekle'; ESP.App.go('lang');
        setTimeout(() => { const el = document.getElementById('vocab-text'); if(el) el.focus(); }, 160); } });
    out.push({ id:'act:arg', kind:'Eylem', label:'Yeni tez yaz',
      hint:'Felsefe', run:() => { ESP.S.ui.philoTab = 'ekle'; ESP.App.go('symposium');
        setTimeout(() => { const el = document.getElementById('arg-text'); if(el) el.focus(); }, 160); } });
    out.push({ id:'act:metro', kind:'Eylem', label:'Metronomu aç',
      hint:'Ses', run:() => { ESP.S.ui.studioTab = 'muzik'; ESP.App.go('studio'); } });
    out.push({ id:'act:note', kind:'Eylem', label:'Atomik not ekle',
      hint:'Okuma', run:() => { ESP.S.ui.readTab = 'notlar'; ESP.App.go('library');
        setTimeout(() => { const el = document.getElementById('note-text'); if(el) el.focus(); }, 160); } });
    out.push({ id:'act:draft', kind:'Eylem', label:'Yeni taslak aç',
      hint:'Yazı', run:() => { ESP.S.ui.writeTab = 'taslaklar'; ESP.App.go('writing'); } });
    out.push({ id:'act:meeting', kind:'Eylem', label:'Ofis toplantısı başlat',
      hint:'Ofis', run:() => ESP.App.go('meeting') });
    out.push({ id:'act:backup', kind:'Eylem', label:'Yedek indir',
      hint:'Veri', run:() => { ESP.S.ui.guideTab = 'veri'; ESP.App.go('guide'); } });

    /* disiplinler — dogrudan kendi tezgahina */
    ESP.DISCIPLINES.forEach(d => {
      out.push({ id:'disc:' + d.id, kind:'Disiplin', label:d.label, hint:d.short,
        run:() => ESP.App.go(d.route) });
    });

    /* ajanlar */
    ESP.AGENTS.forEach(a => {
      out.push({ id:'agent:' + a.id, kind:'Ajan', label:a.name + ' — ' + a.role,
        hint:a.title, run:() => { ESP.S.ui.officeAgent = a.id; ESP.App.go('team'); } });
    });

    return out;
  }

  function iconFor(kind){
    if(kind === 'Sayfa') return 'list';
    if(kind === 'Eylem') return 'zap';
    if(kind === 'Disiplin') return 'target';
    if(kind === 'Ajan') return 'users';
    return 'search';
  }

  /* ---------------------------------------------------------- hizli giris

     Yazilan sey bir komuta benzemiyorsa oturum cumlesi olarak denenir.
     Ayristirilan sey EN USTTE bir satir olarak durur ve Enter onu calistirir:
     kullanici yazdiktan sonra fareye uzanmak zorunda kalmaz. */
  function quickCommand(){
    const s = query.trim();
    if(s.length < 4) return null;
    /* Ic e rakam gecmiyorsa oturum cumlesi olma ihtimali dusuk; arama
       sonuclarinin onune gecmesin. */
    if(!/\d/.test(s)) return null;

    const res = ESP.Parse.parseSession(s);
    if(!res.rows.length) return null;

    const ozet = res.rows.map(r => {
      const d = ESP.DISCIPLINE_BY_ID[r.disc];
      return (d ? d.short : r.disc) + ' ' + U.fmtMin(r.minutes);
    }).join(' · ');

    return {
      id:'quick:save', kind:'Kayıt', label:ozet + ' kaydet',
      hint:res.unmatched.length ? res.unmatched.length + ' satır eşleşmedi' : 'Bugüne yazılır',
      run:() => { bekleyen = res; onayGoster(res); },
    };
  }

  /* Yazmadan once ne yazilacagini gosterir. Kayit, kullanici onaylayana
     kadar YAPILMAZ — palet kendiliginden kaydetmez. */
  function onayGoster(res){
    const K = ESP.C;
    const satirlar = res.rows.map(r => {
      const d = ESP.DISCIPLINE_BY_ID[r.disc];
      return [d ? d.label : r.disc, U.fmtMin(r.minutes),
        r.count != null ? U.fmtNum(r.count) + ' ' + (r.countWhat || '') : '—'];
    });
    ESP.UI.sheet({
      title:'Bugüne yazılacak',
      body:String(K.Table({ tight:true, headers:['Disiplin', 'Süre', 'Sayım'], rows:satirlar }))
        + (res.unmatched.length
          ? String(K.Notice({ tone:'warn', title:'Eşleşmeyen satır',
              body:res.unmatched.map(u => u.text + ' — ' + u.why).join('<br/>')
                + '<br/><br/>Bu satırlar yazılmayacak; elle girebilirsin.' }))
          : ''),
      footer:String(K.Button({ label:'Kaydet', tone:'primary', act:'quick-save' }))
        + String(K.Button({ label:'Vazgeç', act:'sheet-close' })),
    });
  }

  async function saveQuick(){
    if(!bekleyen){ ESP.UI.closeSheet(); return; }
    const bugun = U.todayISO();
    let yazilan = 0;
    for(const r of bekleyen.rows){
      await ESP.Model.addSession(bugun, {
        disc:r.disc, minutes:r.minutes, count:r.count, note:'',
      });
      yazilan++;
    }
    bekleyen = null;
    ESP.Memo.bitir();
    ESP.UI.closeSheet();
    ESP.UI.toast(yazilan + ' oturum bugüne yazıldı');
    ESP.App.go('today');
  }

  function filtered(){
    const q = U.norm(query);
    const all = commands();
    const hizli = quickCommand();
    if(!q) return all.slice(0, 30);
    const liste = all
      .filter(c => U.norm(c.label + ' ' + c.kind + ' ' + (c.hint || '')).indexOf(q) >= 0)
      .slice(0, 30);
    /* Hizli giris her zaman EN USTTE: Enter'a basan onu bekler. */
    return hizli ? [hizli].concat(liste) : liste;
  }

  function draw(){
    const root = document.getElementById('overlay-root');
    let el = document.getElementById('cmdk');
    if(!el){
      el = document.createElement('div');
      el.className = 'cmdk';
      el.id = 'cmdk';
      el.addEventListener('mousedown', e => { if(e.target === el) close(); });
      root.appendChild(el);
    }
    const rows = filtered();
    index = Math.max(0, Math.min(index, rows.length - 1));

    el.innerHTML = '<div class="cmdk__box" role="dialog" aria-modal="true" aria-label="Komut paleti">'
      + '<input class="cmdk__input" id="cmdk-input" placeholder="Ara ya da yaz: 45 dk gitar · 20 dakika kelime · tez" '
      + 'value="' + U.esc(query) + '" aria-label="Komut ara"/>'
      + '<div class="cmdk__list" role="listbox">'
      + (rows.length ? rows.map((c, i) =>
          '<button class="cmdk__item' + (i === index ? ' is-active' : '') + '" role="option"'
          + ' aria-selected="' + (i === index ? 'true' : 'false') + '"'
          + ' data-act="cmdk-run" data-id="' + U.esc(c.id) + '">'
          + ESP.UI.icon(iconFor(c.kind))
          + '<span class="cmdk__text"><span class="cmdk__label">' + U.esc(c.label) + '</span>'
          + '<span class="cmdk__sub">' + U.esc(c.kind) + '</span></span>'
          + '<span class="cmdk__hintrow">' + U.esc(c.hint || '') + '</span></button>').join('')
        : '<p class="cmdk__empty">Eşleşen komut yok.</p>')
      + '</div>'
      + '<div class="cmdk__foot"><span>↑↓ gez · Enter aç · Esc kapat</span>'
      + '<span class="cmdk__tip">Veri de yazabilirsin: «45 dk gitar»</span></div>'
      + '</div>';

    const input = document.getElementById('cmdk-input');
    if(input){
      input.oninput = e => { query = e.target.value; index = 0; draw(); };
      input.onkeydown = e => {
        const list = filtered();
        if(e.key === 'ArrowDown'){ e.preventDefault(); index = Math.min(index + 1, list.length - 1); draw(); }
        else if(e.key === 'ArrowUp'){ e.preventDefault(); index = Math.max(index - 1, 0); draw(); }
        else if(e.key === 'Enter'){ e.preventDefault(); run(list[index]); }
      };
      input.focus();
      try{ input.setSelectionRange(query.length, query.length); }catch(err){}
    }
  }

  function run(cmd){
    if(!cmd) return;
    close();
    try{ cmd.run(); }catch(e){ console.error('Komut hatası:', e); }
  }

  function openPalette(){
    open = true;
    query = '';
    index = 0;
    draw();
  }

  function close(){
    open = false;
    const el = document.getElementById('cmdk');
    if(el) el.remove();
  }

  function isOpen(){ return open; }

  function runById(id){
    const hizli = quickCommand();
    if(hizli && hizli.id === id) return run(hizli);
    run(commands().find(c => c.id === id));
  }

  function showShortcuts(){
    ESP.UI.sheet({
      title:'Klavye kısayolları',
      body:String(ESP.C.Table({ tight:true, headers:['Tuş', 'İş'], rows:[
        ['Ctrl / ⌘ + K', 'Komut paletini aç'],
        ['?', 'Bu listeyi aç'],
        ['Esc', 'Sırayla: palet → ipucu → alt sayfa → kenar çubuğu'],
        ['↑ ↓', 'Palette gez'],
        ['Enter', 'Seçili komutu çalıştır'],
        ['j / k', 'Listede satır satır gez'],
        ['45 dk gitar', 'Palete oturum da yazabilirsin'],
      ] })),
      footer:String(ESP.C.Button({ label:'Kapat', act:'sheet-close' })),
      noFocus:true,
    });
  }

  return { open:openPalette, close, isOpen, runById, showShortcuts, commands,
    quickCommand, saveQuick };
})();

/* ==== js/core/setup.js ==== */
/* Kurulum — ilk acilista sorulan en az soru.

   ESP'nin sordugu sey SPI'den az: burada hicbir hesap kisisel olcuye
   dayanmaz. Retansiyon, temiz BPM ve okunabilirlik yastan ya da kilodan
   bagimsizdir; sorulmasi gereken tek sey NE CALISILDIGIDIR.

   Uc alan: ad, odak, hangi dil. Gerisi zamanla dolar ve olmadan da sistem
   calisir. Sihirbaz atlanabilir; atlandiginda ekranlar bos kalmaz. */

window.ESP = window.ESP || {};

ESP.Setup = (function(){
  const U = ESP.U;
  const K = ESP.C;
  const { html } = ESP.h;

  /* Sihirbaz yalnizca ad yoksa gerekir. Odak ve dilin varsayilani vardir ve
     varsayilan dogru calisir — zorunlu soru sayisi bir tutulur. */
  function needed(){
    const p = ESP.S.profile;
    return !p || !p.name;
  }

  function open(){
    const p = ESP.S.profile || {};

    ESP.UI.sheet({
      title:'ESP', subtitle:'entelektüel seviye planlayıcı',
      wide:true, noClose:true,
      body:String(html`<div class="setup">

        <div class="setup__hero">
          <p class="setup__kicker">İlk kurulum</p>
          <h2 class="setup__h">Üç alan yeter. Gerisi çalıştıkça dolar.</h2>
          <p class="setup__lede">Bu sistem senin girdiğin pratiği okur ve ondan
            hesap yapar. Sınav yapmaz, seviye vermez, yetenek yargısı kurmaz —
            ve bilmediği hiçbir şeyi tahmin etmez.</p>
        </div>

        <div class="setup__rules">
          <div class="setup__rule">
            <b>Girilmemiş gün sıfır sayılmaz.</b>
            <span>Çalışmadığın gün hesaba «0 dakika» diye girmez; o gün hiç
              sayılmaz ve kaç günden hesaplandığı ekranda yazar.</span>
          </div>
          <div class="setup__rule">
            <b>Tahmin, ölçüm gibi gösterilmez.</b>
            <span>Her sayının yanında nereden geldiği durur: ölçüldü,
              hesaplandı, tahmin.</span>
          </div>
          <div class="setup__rule">
            <b>Ses kaydı tutulmaz.</b>
            <span>Diksiyonda saklanan şey süre ve kendi işaretlediğin hata
              sayısıdır; ses dosyası hiç oluşmaz.</span>
          </div>
        </div>

        <div class="setup__form">
          ${K.Field({ label:'Ad', hint:'yalnızca sana seslenmek için — modele gitmez',
            input:K.Input({ id:'su-name', value:p.name || '',
              placeholder:'Sana nasıl seslenelim?' }) })}
          ${K.Field({ label:'Odak', hint:'eşit skorlu iki iş çıkarsa sırayı belirler',
            input:K.Select({ id:'su-focus', value:p.focus || 'balanced',
              options:ESP.FOCUS.map(f => ({ value:f.id, label:f.label })) }) })}
          ${K.Field({ label:'Çalışılan dil', hint:'sonradan eklenebilir',
            input:K.Select({ id:'su-lang', value:(p.langs && p.langs[0]) || 'en',
              options:ESP.LANGS.map(l => ({ value:l.id, label:l.label })) }) })}
          ${K.Field({ label:'Enstrüman', hint:'metronom ve tempo eşiği bunun için',
            input:K.Input({ id:'su-instrument', value:p.instrument || 'gitar',
              placeholder:'gitar' }) })}
          ${K.Field({ label:'Günlük pratik tabanı (dakika)',
            hint:'hedef değil ölçüt: rota bunu taban alır',
            input:K.Input({ id:'su-minutes', type:'number', numeric:true,
              min:10, max:600, value:p.dailyMinutes || 60, placeholder:'60' }) })}
        </div>

        <div class="setup__unlock">
          <p class="setup__kicker">Bu alanlar neyi açar</p>
          <ul class="setup__list">
            <li><b>Sıradaki tek iş</b> — altı disiplin arasında önceliği kural motoru seçer</li>
            <li><b>Aralıklı tekrar</b> — kart eklediğinde retansiyon ölçülmeye başlar</li>
            <li><b>Haftalık rota</b> — hiç açılmayan disiplin öne alınır</li>
            <li><b>Yedi ajanlı ofis</b> — her masa yalnızca kendi ölçümüne bakar</li>
          </ul>
        </div>

        ${K.Notice({ tone:'warn', title:'Sınır:', body:ESP.PEDAGOGIC.disclaimer })}
      </div>`),
      footer:String(html`${K.Button({ label:'Şimdilik atla', act:'setup-skip' })}
        ${K.Button({ label:'Başla', tone:'primary', act:'setup-save' })}`),
    });
  }

  async function save(){
    const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const numOr = v => v === '' ? null : Number(String(v).replace(',', '.'));

    const ad = get('su-name');
    if(!ad){
      ESP.UI.toast('Eksik: ad');
      return false;
    }

    await ESP.Model.saveProfile({
      name:ad,
      focus:get('su-focus') || 'balanced',
      langs:[get('su-lang') || 'en'],
      instrument:get('su-instrument') || 'gitar',
      dailyMinutes:numOr(get('su-minutes')) || 60,
    });

    ESP.UI.closeSheet();
    ESP.UI.toast('Hazır — ilk oturumu girince ölçüm başlar');
    ESP.App.render();
    return true;
  }

  function skip(){
    ESP.UI.closeSheet();
    ESP.UI.toast('Atlandı — Profil ekranından istediğin zaman doldurabilirsin');
  }

  return { needed, open, save, skip };
})();

/* ==== js/screens/today.js ==== */
/* Bugün — günün pratiği girilir, karşılığı aynı sayfada görünür.

   Bu sayfaya girmenin sebebi çoğu zaman okumak değil YAZMAKTIR; bu yüzden
   varsayılan sekme Giriş'tir ve Özet ikinci sıradadır. Sonuç girdiden önce
   gelmez.

   Üç sekme: Giriş · Özet · Geçmiş. Önceden iki ayrı ekran (bugünün özeti ve
   oturum girişi) düşünülmüştü; ikisi de aynı günü anlatıyordu ve kullanıcı
   her seferinde hangisine gireceğini düşünmek zorunda kalıyordu. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.today = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C;

  function gun(){ return S.ui.dayDate || U.todayISO(); }

  const TABS = [
    { id:'giris',  label:'Giriş' },
    { id:'ozet',   label:'Özet' },
    { id:'gecmis', label:'Geçmiş' },
  ];

  /* ------------------------------------------------------------ siradaki is */

  function nextCard(){
    const n = ESP.Planner.nextAction();
    return K.Entry({
      label:'SIRADAKİ İŞ', hint:'next-action',
      meta:n.rank ? 'Öncelik ' + n.rank : 'Bekleyen yok',
      note:n.why,
      body:K.NextUp({
        icon:n.rank ? 'zap' : 'check',
        calm:!n.rank,
        label:n.rank ? 'Kural motorunun seçtiği tek iş' : 'Bekleyen iş yok',
        title:n.title,
        why:n.detail,
        action:n.route && n.route !== 'today'
          ? K.Button({ label:'Aç', tone:'primary', size:'sm', act:'go',
              data:{ 'data-route':n.route } })
          : '',
      }),
    });
  }

  /* ------------------------------------------------------------ oturum girisi */

  function entryForm(){
    const d = S.ui.sessionDisc || 'lang';
    const disc = ESP.DISCIPLINE_BY_ID[d];

    return K.Entry({
      label:'OTURUM EKLE', hint:'practice-log',
      meta:U.fmtDate(gun()),
      note:'Süre ölçümdür: saatine bakıp yazdığın dakika da «ölçüldü» sayılır. '
         + 'Boş bıraktığın alan sıfır değil, «veri yok» olur.',
      body:html`
        <div class="picks picks--disc">
          ${map(ESP.DISCIPLINES, x => K.PickCard({
            on:x.id === d, act:'pick-disc', data:{ 'data-disc':x.id },
            title:x.short, note:x.unit,
          }))}
        </div>

        <div class="cols-3 mt-10">
          ${K.Field({ label:'Süre (dakika)',
            input:K.Input({ id:'s-min', type:'number', numeric:true, min:1, max:600,
              placeholder:'45', aria:'Oturum süresi dakika' }) })}
          ${K.Field({ label:countLabel(d), hint:'isteğe bağlı',
            input:K.Input({ id:'s-count', type:'number', numeric:true, min:0,
              placeholder:countPlaceholder(d), aria:countLabel(d) }) })}
          ${K.Field({ label:'Not', hint:'isteğe bağlı',
            input:K.Input({ id:'s-note', placeholder:'ne çalıştın?' }) })}
        </div>

        <div class="row mt-10">
          ${K.Button({ label:'Oturumu kaydet', tone:'primary', act:'add-session' })}
          ${when(disc, () => K.Button({ label:disc.label + ' ekranını aç', act:'go',
            data:{ 'data-route':disc.route } }))}
        </div>

        <p class="small muted mt-10">${disc ? disc.note : ''}</p>`,
    });
  }

  function countLabel(discId){
    if(discId === 'lang') return 'Çözülen kart';
    if(discId === 'writing') return 'Kelime';
    if(discId === 'reading') return 'Sayfa';
    if(discId === 'music' || discId === 'diction') return 'Temiz tekrar';
    return 'Sayım';
  }

  function countPlaceholder(discId){
    if(discId === 'writing') return '600';
    if(discId === 'reading') return '24';
    return '12';
  }

  /* Serbest metin girisi — palet disinda da kullanilabilsin diye burada da var. */
  function quickForm(){
    return K.Entry({
      label:'KONUŞARAK GİR',
      meta:'tek satır',
      note:'«45 dakika gitar çalıştım ve 20 dakika kelime tekrarı yaptım» gibi '
         + 'yazabilirsin. Anlaşılmayan satır atılmaz, sana geri gösterilir.',
      body:html`
        <div class="row">
          ${K.Input({ id:'quick-text', placeholder:'45 dk gitar, 20 dakika kelime',
            aria:'Serbest metin oturum girişi', class:'grow' })}
          ${K.Mic({ target:'quick-text' })}
          ${K.Button({ label:'Çöz', act:'parse-quick' })}
        </div>
        ${when(S.ui.quickParsed, () => quickPreview(S.ui.quickParsed))}`,
    });
  }

  function quickPreview(res){
    return html`
      <div class="mt-10">
        ${when(res.rows.length, () => html`
          ${K.Table({ tight:true, headers:['Disiplin', 'Süre', 'Sayım'],
            rows:res.rows.map(r => {
              const d = ESP.DISCIPLINE_BY_ID[r.disc];
              return [d ? d.label : r.disc, U.fmtMin(r.minutes),
                r.count != null ? U.fmtNum(r.count) + ' ' + (r.countWhat || '') : '—'];
            }) })}
          <div class="row mt-8">
            ${K.Button({ label:'Hepsini kaydet', tone:'primary', size:'sm', act:'save-quick' })}
            ${K.Button({ label:'Vazgeç', size:'sm', act:'clear-quick' })}
          </div>`)}
        ${when(res.unmatched.length, () => K.Notice({ tone:'warn', title:'Eşleşmedi',
          body:res.unmatched.map(u => '«' + U.esc(u.text) + '» — ' + u.why).join('<br/>')
             + '<br/><br/>Bu satırlar kaydedilmeyecek; yukarıdaki formdan elle girebilirsin.' }))}
      </div>`;
  }

  /* ------------------------------------------------------------- gunun listesi */

  function sessionList(){
    const rows = M.sessionsOf(gun());
    if(!rows.length){
      return K.Entry({
        label:'BUGÜN', meta:'kayıt yok',
        body:K.Empty({ text:'Bu güne henüz oturum girilmedi. '
          + 'Girilmemiş gün sıfır sayılmaz — hiçbir ortalamaya katılmaz.' }),
      });
    }
    const toplam = rows.reduce((a, s) => a + (s.minutes || 0), 0);
    return K.Entry({
      label:'BUGÜNÜN OTURUMLARI',
      meta:rows.length + ' oturum · ' + U.fmtMin(toplam),
      body:K.Table({ tight:true,
        headers:['Disiplin', 'Süre', 'Sayım', 'Not', ''],
        rows:rows.map(s => {
          const d = ESP.DISCIPLINE_BY_ID[s.disc];
          return [
            d ? d.label : s.disc,
            s.minutes != null ? U.fmtMin(s.minutes) : raw(String(P_cert('missing'))),
            s.count != null ? U.fmtNum(s.count) : raw(String(P_cert('missing'))),
            s.note || '—',
            K.Button({ label:'Sil', size:'sm', act:'del-session', data:{ 'data-id':s.id } }),
          ];
        }) }),
    });
  }

  /* Kesinlik rozeti — ekrana ozel kucuk parca. */
  function P_cert(cert){
    const c = ESP.CERTAINTY[cert] || ESP.CERTAINTY.missing;
    return K.Badge({ label:c.label, tone:c.tone, icon:false });
  }

  /* ------------------------------------------------------------------ ozet */

  function summaryRows(){
    const bugun = gun();
    const rows = M.sessionsOf(bugun);
    const toplam = rows.reduce((a, s) => a + (s.minutes || 0), 0);
    const taban = (S.profile && S.profile.dailyMinutes) || 60;
    const ehs = ESP.Intellect.ehs(14);
    const denge = ESP.Planner.balance(7);

    return [
      K.Entry({
        label:'GÜNÜN TOPLAMI',
        meta:rows.length ? U.fmtMin(toplam) : 'veri yok',
        note:'Taban ' + U.fmtMin(taban) + '. Taban bir hedef değil bir ölçüttür: '
           + 'altında kalmak başarısızlık değil, rotayı daraltan bir olgudur.',
        body:rows.length
          ? K.Meter({ label:'Taban doluluğu', value:Math.min(100, toplam / taban * 100),
              text:U.fmtMin(toplam) + ' / ' + U.fmtMin(taban) })
          : K.Notice({ tone:'info',
              body:'Bugüne hiç oturum girilmedi. Bu gün ortalamaya katılmaz.' }),
      }),

      K.Entry({
        label:'ASGARİ GÜN', hint:'minimum-day',
        meta:'kötü günün alt sınırı',
        note:ESP.MINIMUM_DAY.note,
        body:html`<ul class="setup__list">
          <li>${ESP.MINIMUM_DAY.srs}</li>
          <li>${ESP.MINIMUM_DAY.read}</li>
          <li>${ESP.MINIMUM_DAY.practice}</li>
        </ul>`,
      }),

      K.Entry({
        label:'ENTELEKTÜEL HACİM', hint:'ehs',
        meta:ehs.cert === 'missing' ? 'veri yok'
          : U.fmtNum(Math.round(ehs.value * 10) / 10),
        note:ehs.cert === 'missing'
          ? 'Son ' + ehs.windowDays + ' günde ölçülmüş pratik yok; hacim hesaplanmadı.'
          : ehs.windowDays + ' günün ' + ehs.enteredDays + '\'inden hesaplandı.',
        body:ehs.cert === 'missing'
          ? K.Empty({ text:'İlk oturumu girdiğinde hacim ölçülmeye başlar.' })
          : K.Table({ tight:true,
              headers:['Disiplin', { label:'Süre', num:true }, { label:'Katsayı', num:true }, 'Kaynak'],
              rows:ehs.rows.map(r => [
                r.disc.label,
                r.cert === 'missing' ? P_cert('missing') : U.fmtMin(Math.round(r.hours * 60)),
                r.cert === 'missing' ? '—' : U.fmtNum(Math.round(r.k * 100) / 100),
                r.kWhy,
              ]) }),
      }),

      K.Entry({
        label:'HAFTANIN DAĞILIMI',
        meta:denge.cert === 'missing' ? 'veri yok' : U.fmtMin(denge.totalMinutes),
        note:denge.skewed
          ? 'Pratik ' + denge.top.label + ' tarafına yığılmış ve '
            + denge.untouched.map(d => d.label).join(', ') + ' hiç açılmamış.'
          : 'Son ' + denge.windowDays + ' gün.',
        body:denge.cert === 'missing'
          ? K.Empty({ text:'Son yedi günde kayıt yok.' })
          : html`${map(denge.rows, r => html`
              <div class="mt-8">
                ${K.Meter({ label:r.disc.label,
                  value:r.share == null ? 0 : r.share * 100,
                  text:r.cert === 'missing' ? 'veri yok' : U.fmtMin(r.minutes) })}
              </div>`)}`,
      }),
    ];
  }

  /* ---------------------------------------------------------------- gecmis */

  function historyRows(){
    const gunler = U.lastDays(14).slice().reverse();
    const dolu = gunler.filter(d => M.dayHasEntry(S.days[d]));
    return [
      K.Entry({
        label:'SON 14 GÜN', hint:'streak',
        meta:dolu.length + ' günde kayıt · seri ' + M.streak() + ' gün',
        note:'Boş gün «0 dakika» değil «veri yok» sayılır. İkisi ayrı renkte durur.',
        wide:true,
        body:html`<div class="daystrip">
          ${map(gunler, d => {
            const gecti = M.dayHasEntry(S.days[d]);
            const dk = gecti ? M.minutesOf(d) : null;
            return html`<button class="${ESP.h.cls('daycell', gecti && 'is-on',
                d === gun() && 'is-sel')}"
              data-act="pick-day" data-date="${d}"
              title="${U.fmtDate(d) + (gecti ? ' · ' + U.fmtMin(dk || 0) : ' · veri yok')}">
              <span class="daycell__d">${d.slice(8)}</span>
              <span class="daycell__v">${gecti ? U.fmtNum(dk || 0) : '—'}</span>
            </button>`;
          })}
        </div>`,
      }),
      K.Entry({
        label:'SEÇİLİ GÜN',
        meta:U.fmtDate(gun()),
        action:gun() !== U.todayISO()
          ? K.Button({ label:'Bugüne dön', size:'sm', act:'today-back' }) : '',
        body:M.dayHasEntry(S.days[gun()])
          ? K.Table({ tight:true, headers:['Disiplin', 'Süre', 'Not'],
              rows:M.sessionsOf(gun()).map(s => {
                const d = ESP.DISCIPLINE_BY_ID[s.disc];
                return [d ? d.label : s.disc,
                  s.minutes != null ? U.fmtMin(s.minutes) : P_cert('missing'),
                  s.note || '—'];
              }) })
          : K.Empty({ text:'Bu güne kayıt girilmemiş.' }),
      }),
    ];
  }

  /* ------------------------------------------------------------------ cizim */

  function render(){
    const tab = S.ui.dayTab || 'giris';
    const rows = tab === 'ozet' ? summaryRows()
      : tab === 'gecmis' ? historyRows()
      : [nextCard(), entryForm(), quickForm(), sessionList()];

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'day-tab', aria:'Günlük sekmeleri',
          items:TABS.map(t => Object.assign({}, t,
            t.id === 'giris' ? { count:M.sessionsOf(gun()).length || null } : {})) }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  const handle = {
    async 'day-tab'(el){ S.ui.dayTab = el.dataset.tab; ESP.App.render(); },

    async 'pick-disc'(el){ S.ui.sessionDisc = el.dataset.disc; ESP.App.render(); },

    async 'add-session'(){
      const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const dakika = val('s-min');
      if(!dakika){ ESP.UI.toast('Süre girilmedi'); return; }
      await M.addSession(gun(), {
        disc:S.ui.sessionDisc || 'lang',
        minutes:dakika,
        count:val('s-count'),
        note:val('s-note'),
      });
      ESP.Memo.bitir();
      ESP.UI.toast('Oturum kaydedildi');
      ESP.App.render();
    },

    async 'del-session'(el){
      await M.deleteSession(gun(), el.dataset.id);
      ESP.Memo.bitir();
      ESP.App.render();
    },

    async 'parse-quick'(){
      const el = document.getElementById('quick-text');
      const res = ESP.Parse.parseSession(el ? el.value : '');
      if(!res.rows.length && !res.unmatched.length){
        ESP.UI.toast('Bir şey anlaşılmadı');
        return;
      }
      S.ui.quickParsed = res;
      ESP.App.render();
    },

    async 'save-quick'(){
      const res = S.ui.quickParsed;
      if(!res) return;
      for(const r of res.rows){
        await M.addSession(gun(), { disc:r.disc, minutes:r.minutes, count:r.count, note:'' });
      }
      S.ui.quickParsed = null;
      ESP.Memo.bitir();
      ESP.UI.toast(res.rows.length + ' oturum kaydedildi');
      ESP.App.render();
    },

    async 'clear-quick'(){ S.ui.quickParsed = null; ESP.App.render(); },

    async 'pick-day'(el){ S.ui.dayDate = el.dataset.date; ESP.App.render(); },
    async 'today-back'(){ S.ui.dayDate = null; ESP.App.render(); },
  };

  const change = {};

  return {
    id:'today',
    title:'Bugün',
    headline(){
      const n = ESP.Planner.nextAction();
      return n.rank ? n.title : 'Bugün için bekleyen bir iş yok.';
    },
    lede(){
      const rows = M.sessionsOf(gun());
      if(!rows.length){
        return 'Bu güne henüz oturum girilmedi. Girilmemiş gün sıfır sayılmaz; '
             + 'hiçbir ortalamaya katılmaz.';
      }
      const toplam = rows.reduce((a, s) => a + (s.minutes || 0), 0);
      return rows.length + ' oturum, toplam ' + U.fmtMin(toplam) + '. '
           + 'Karşılığı Özet sekmesinde.';
    },
    stats(){
      const rows = M.sessionsOf(gun());
      const toplam = rows.reduce((a, s) => a + (s.minutes || 0), 0);
      const d = ESP.SRS.deckStatus();
      const ehs = ESP.Intellect.ehs(14);
      return [
        { value:rows.length ? U.fmtNum(toplam) : '—', unit:'dk', label:'bugün' },
        { value:String(d.due), label:'vadeli kart' },
        { value:String(M.streak()), unit:'gün', label:'seri' },
        { value:ehs.cert === 'missing' ? '—' : U.fmtNum(Math.round(ehs.value)), label:'hacim' },
      ];
    },
    subtitle(){ return U.fmtDate(gun()); },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/lang.js ==== */
/* Dil Stüdyosu — aralıklı tekrar, deste ve üretim.

   Dört sekme: Çalış · Kartlar · Ekle · İlerleme.

   Çalış varsayılandır çünkü bu ekrana girmenin sebebi çoğu zaman kart
   eklemek değil, vadesi gelenleri kapatmaktır. Unutma eğrisi beklemez.

   Ekranda hiçbir yerde «şu kadar kelime biliyorsun» yazmaz: bilinen kelime
   ölçülemez, hatırlanan kelime ölçülür. Bu yüzden her sayının yanında
   nereden geldiği durur. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.lang = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map, cls } = ESP.h;
  const K = ESP.C;

  const TABS = [
    { id:'calis',    label:'Çalış' },
    { id:'kartlar',  label:'Kartlar' },
    { id:'ekle',     label:'Ekle' },
    { id:'ilerleme', label:'İlerleme' },
  ];

  function aktifDil(){
    return S.ui.langDeck && S.ui.langDeck !== 'all'
      ? S.ui.langDeck
      : ((S.profile && S.profile.langs && S.profile.langs[0]) || 'en');
  }

  function cert(c){
    const x = ESP.CERTAINTY[c] || ESP.CERTAINTY.missing;
    return K.Badge({ label:x.label, tone:x.tone, icon:false });
  }

  /* ------------------------------------------------------------------ çalış

     Kuyruk durumu `S.ui.reviewQueue` içinde durur: { ids, pos, shown }.
     Kart listesi oturumun BAŞINDA dondurulur — çalışırken cevaplanan kartın
     vadesi ileri gider ve kuyruk canlı hesaplansaydı kart ortadan kaybolur,
     kullanıcı ilerlemeyi göremezdi. */

  function queueStart(){
    const due = ESP.SRS.dueCards().filter(c => c.lang === aktifDil());
    return { ids:due.map(c => c.id), pos:0, shown:false, correct:0, again:0 };
  }

  function reviewRows(){
    const q = S.ui.reviewQueue;
    const d = ESP.SRS.deckStatus(aktifDil());

    if(!q){
      if(!d.total){
        return [K.Entry({
          label:'ÇALIŞMA', meta:'deste boş',
          body:K.Empty({ text:'Bu dilde hiç kart yok. Ekle sekmesinden bir liste '
            + 'yapıştırabilir ya da tek tek yazabilirsin.',
            action:K.Button({ label:'Kart ekle', tone:'primary', act:'tab-ekle' }) }),
        })];
      }
      if(!d.due){
        return [K.Entry({
          label:'ÇALIŞMA', hint:'srs',
          meta:'vadesi gelen kart yok',
          note:'Aralıklı tekrarın amacı her gün çalışmak değil, doğru günde '
             + 'çalışmaktır. Bugün sırası gelen kart yok.',
          body:K.Notice({ tone:'ok', title:'Bugünlük bitti',
            body:d.total + ' kartın hepsi ileri tarihli. Erken çalışmak aralığı '
              + 'kısaltır ve tekrar sayısını artırır — kazanç getirmez.' }),
        })];
      }
      return [K.Entry({
        label:'ÇALIŞMA', hint:'srs',
        meta:d.due + ' kart vadeli' + (d.overdue ? ' · ' + d.overdue + ' gecikmiş' : ''),
        note:d.overdue
          ? 'En çok geciken kart ' + d.maxOverdueDays + ' gündür bekliyor.'
          : 'Bugün sırası gelenler.',
        body:html`
          ${K.Button({ label:d.due + ' kartı çalış', tone:'primary', act:'start-review' })}
          <p class="small muted mt-10">Oturum başladığında liste dondurulur:
            çalışırken cevapladığın kartın vadesi ileri gitse de kuyruktan düşmez,
            ilerlemeyi görebilirsin.</p>`,
      })];
    }

    const kart = S.cards.find(c => c.id === q.ids[q.pos]);
    if(!kart){
      return [finishRow(q)];
    }

    const gecikme = ESP.SRS.overdueDays(kart);
    return [K.Entry({
      label:'KART ' + (q.pos + 1) + '/' + q.ids.length,
      meta:(ESP.LANG_BY_ID[kart.lang] || {}).label || kart.lang,
      note:gecikme ? gecikme + ' gündür bekliyor.' : 'Bugün vadeli.',
      action:K.Button({ label:'Oturumu bitir', size:'sm', act:'end-review' }),
      wide:true,
      body:html`
        <div class="srscard">
          <div class="srscard__front">${kart.front}</div>
          ${when(kart.context, () => html`<p class="srscard__ctx">${kart.context}</p>`)}
          ${q.shown
            ? html`<div class="srscard__back">${kart.back}</div>`
            : html`<button class="srscard__reveal" data-act="reveal-card">Karşılığı göster</button>`}
        </div>
        ${when(q.shown, () => html`
          <div class="row wrap mt-12">
            ${map(ESP.SRS.GRADES, g => {
              const next = ESP.SRS.schedule(kart, g.id);
              return K.Button({
                label:g.label + ' · ' + (next.interval ? next.interval + ' gün' : 'bugün'),
                tone:g.id === 'again' ? '' : (g.id === 'good' ? 'primary' : ''),
                size:'sm', act:'grade-card', data:{ 'data-grade':g.id },
                title:g.note,
              });
            })}
          </div>
          <p class="small muted mt-8">Kutu ${kart.box} · kolaylık
            ${U.fmtNum(Math.round(kart.ease * 100) / 100)} · ${kart.reps} tekrar,
            ${kart.lapses} unutma</p>`)}`,
    })];
  }

  function finishRow(q){
    return K.Entry({
      label:'OTURUM BİTTİ',
      meta:q.ids.length + ' kart',
      note:'Cevapladığın her kart yeni vadesine taşındı.',
      body:html`
        ${K.Notice({ tone:'ok', title:'Tamamlandı',
          body:q.correct + ' kart hatırlandı, ' + q.again + ' kart başa döndü.' })}
        <div class="row mt-10">
          ${K.Button({ label:'Kapat', tone:'primary', act:'end-review' })}
          ${K.Button({ label:'Bugüne oturum yaz', act:'log-review',
            data:{ 'data-count':String(q.ids.length) } })}
        </div>`,
    });
  }

  /* ---------------------------------------------------------------- kartlar */

  function cardRows(){
    const q = U.norm(S.ui.cardQuery || '');
    const hepsi = M.cardsOf(aktifDil())
      .filter(c => !q || U.norm(c.front + ' ' + c.back).indexOf(q) >= 0)
      .sort((a, b) => (a.due || '').localeCompare(b.due || ''));

    return [K.Entry({
      label:'DESTE',
      meta:hepsi.length + ' kart',
      note:'Vadesi yakın olan üstte. «Aktif» işareti kartın üretimde '
         + 'kullanıldığını söyler; tanımak ile kullanmak ayrı şeylerdir.',
      action:html`${K.Input({ id:'card-q', value:S.ui.cardQuery || '',
        placeholder:'Kart ara…', change:'card-query', size:'sm', aria:'Kart ara' })}`,
      wide:true,
      body:hepsi.length
        ? K.Table({ tight:true,
            headers:['Ön yüz', 'Karşılık', 'Kutu', 'Vade', 'Aktif', ''],
            rows:hepsi.slice(0, 200).map(c => [
              c.front, c.back,
              String(c.box),
              c.due === U.todayISO() ? 'bugün' : U.fmtShort(c.due),
              K.Checkbox({ checked:!!c.active, act:'toggle-active',
                data:{ 'data-id':c.id }, label:'' }),
              K.Button({ label:'Sil', size:'sm', act:'del-card', data:{ 'data-id':c.id } }),
            ]) })
        : K.Empty({ text:q ? 'Aramaya uyan kart yok.' : 'Deste boş.' }),
    })];
  }

  /* ------------------------------------------------------------------ ekle */

  function addRows(){
    const res = S.ui.vocabParsed;
    return [
      K.Entry({
        label:'LİSTE YAPIŞTIR',
        meta:'kelime – karşılık',
        note:'Üç ayraç tanınır: tire, eşittir, iki nokta. Tanınmayan satır '
           + 'atılmaz — sana geri gösterilir ve elle bağlarsın.',
        body:html`
          ${K.Textarea({ id:'vocab-text', rows:6, aria:'Kelime listesi',
            placeholder:'nevertheless – yine de\nto grasp = kavramak\nmake a point: bir noktaya değinmek' })}
          <div class="row mt-10">
            ${K.Select({ id:'vocab-lang', value:aktifDil(), change:'pick-lang',
              aria:'Kartların dili',
              options:ESP.LANGS.map(l => ({ value:l.id, label:l.label })) })}
            ${K.Button({ label:'Çöz', tone:'primary', act:'parse-vocab' })}
          </div>
          ${when(res, () => vocabPreview(res))}`,
      }),

      K.Entry({
        label:'TEK KART',
        meta:'elle',
        body:html`
          <div class="cols-3">
            ${K.Field({ label:'Ön yüz', input:K.Input({ id:'c-front', placeholder:'nevertheless' }) })}
            ${K.Field({ label:'Karşılık', input:K.Input({ id:'c-back', placeholder:'yine de' }) })}
            ${K.Field({ label:'Bağlam', hint:'isteğe bağlı',
              input:K.Input({ id:'c-ctx', placeholder:'örnek cümle' }) })}
          </div>
          ${K.Button({ label:'Kart ekle', tone:'primary', act:'add-card', class:'mt-10' })}`,
      }),

      K.Entry({
        label:'TOHUM DESTE',
        meta:'başlangıç için',
        note:'Bu kartlar senin ölçümün değildir; ilk ekranı boş bırakmamak için '
           + 'vardır ve istediğin zaman silinir.',
        body:ESP.SEED_CARDS[aktifDil()]
          ? html`${K.Button({ label:'Tohum desteyi ekle', act:'seed-cards' })}
              <p class="small muted mt-8">${ESP.SEED_CARDS[aktifDil()].length} kart</p>`
          : K.Notice({ tone:'info', body:'Bu dil için tohum deste yok; kendi listeni yapıştırabilirsin.' }),
      }),
    ];
  }

  function vocabPreview(res){
    return html`
      <div class="mt-10">
        ${when(res.rows.length, () => html`
          ${K.Table({ tight:true, headers:['Ön yüz', 'Karşılık', 'Tür'],
            rows:res.rows.slice(0, 20).map(r => [r.front, r.back,
              (ESP.CARD_KINDS.find(k => k.id === r.kind) || {}).label || r.kind]) })}
          ${when(res.rows.length > 20, () => html`<p class="small muted">
            …ve ${res.rows.length - 20} kart daha.</p>`)}
          <div class="row mt-8">
            ${K.Button({ label:res.rows.length + ' kartı ekle', tone:'primary',
              size:'sm', act:'save-vocab' })}
            ${K.Button({ label:'Vazgeç', size:'sm', act:'clear-vocab' })}
          </div>`)}
        ${when(res.duplicates.length, () => K.Notice({ tone:'info',
          body:res.duplicates.length + ' satır aynı ön yüze sahip olduğu için '
            + 'bir kez alındı. İkiz kart destede iki ayrı soru üretir.' }))}
        ${when(res.unmatched.length, () => K.Notice({ tone:'warn', title:'Eşleşmedi',
          body:res.unmatched.slice(0, 8).map(u => '«' + U.esc(u.text) + '» — ' + u.why).join('<br/>') }))}
      </div>`;
  }

  /* -------------------------------------------------------------- ilerleme */

  function progressRows(){
    const d = ESP.SRS.deckStatus(aktifDil());
    const bant = ESP.cefrOf(d.active, d.retention.value);

    return [
      K.Entry({
        label:'RETANSİYON', hint:'retention',
        meta:d.retention.cert === 'missing' ? 'veri yok'
          : '%' + Math.round(d.retention.value * 100),
        note:d.retention.cert === 'missing'
          ? 'Hiç cevaplanmış kart yok; ortalama üretilmedi.'
          : d.retention.total + ' kartın ' + d.retention.n + '\'inden hesaplandı. '
            + 'Hiç sorulmamış kart bu ortalamaya girmez.',
        body:d.retention.cert === 'missing'
          ? K.Empty({ text:'İlk çalışma oturumundan sonra ölçülmeye başlar.' })
          : html`${K.Meter({ label:'Ortalama hatırlama olasılığı',
              value:d.retention.value * 100,
              text:'%' + Math.round(d.retention.value * 100),
              tone:d.retention.value < ESP.Planner.RETENTION_FLOOR ? 'danger' : '' })}
            <p class="small muted mt-8">Taban %${Math.round(ESP.Planner.RETENTION_FLOOR * 100)}:
              altına inerse yeni kart eklemek önceliği kaybeder.</p>`,
      }),

      K.Entry({
        label:'KUTU DAĞILIMI', hint:'srs',
        meta:d.total + ' kart',
        note:'Kutu kaba sınıftır: bir kart doğru cevaplandıkça yukarı çıkar, '
           + 'unutulduğunda başa döner.',
        body:d.total
          ? html`${map(d.boxes, b => K.Meter({
              label:'Kutu ' + b.box + ' · ' + b.label,
              value:d.total ? b.count / d.total * 100 : 0,
              text:String(b.count) }))}`
          : K.Empty({ text:'Deste boş.' }),
