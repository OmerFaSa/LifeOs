.deskstat__label{ display:block; font-size:var(--fs-xs); color:var(--text-3); }
.deskstat__value{ display:block; font-size:var(--fs-md); font-weight:700; margin-top:1px; }
.deskstat__value.is-ok{ color:var(--primary); }
.deskstat__value.is-warn{ color:var(--accent); }
.deskstat__value.is-danger{ color:var(--danger); }
.deskstat__note{ display:block; font-size:var(--fs-xs); color:var(--text-3); margin-top:1px; }

/* Bulgu satırı — nokta rengi metindeki durumu tekrarlar, tek başına anlam taşımaz. */
.finding{ display:grid; grid-template-columns:8px minmax(0,1fr); gap:10px; align-items:start;
  font-size:var(--fs-sm); line-height:1.5; color:var(--text-2); }
.finding__dot{ width:8px; height:8px; border-radius:50%; margin-top:6px; background:var(--text-3); }
.finding__dot--ok{ background:var(--primary); }
.finding__dot--warn{ background:var(--accent); }
.finding__dot--danger{ background:var(--danger); }
.finding__dot--info{ background:var(--info); }

.agentrow{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:8px 10px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface);
}
.agentrow:hover{ background:var(--surface-2); }
.agentrow b{ display:block; }
.agentrow span span{ display:block; }

/* ---------- ekip sohbeti ---------- */
.msg--agent{ align-self:flex-start; }
.msg--agent .msg__body{ border-bottom-left-radius:5px; }
.msg__who{
  display:flex; align-items:center; gap:7px; margin-bottom:5px;
  font-size:var(--fs-xs); color:var(--text-2);
}

/* ---------- toplantı tutanağı ---------- */
.meet{ display:flex; flex-direction:column; gap:12px; }
.meetturn{
  padding:12px 14px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2);
}
.meetturn__who{ display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  margin-bottom:6px; font-size:var(--fs-xs); color:var(--text-2); }
.meetturn__body{ font-size:var(--fs-base); line-height:1.55; }
.meetturn--closing{ background:var(--primary-soft); border-color:var(--primary); }
.meetturn.is-live{ border-style:dashed; }

/* ---------- ofis panosu ---------- */
/* Girişte asılı tahta: gün, kalan süre, toplantı ve açık karar sayısı. */
.board__row{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; }
.board__cell{ min-width:0; }
.board__label{ display:block; font-size:var(--fs-xs); color:var(--text-3); text-transform:uppercase;
  letter-spacing:.04em; }
.board__value{ display:block; font-family:var(--font-display); font-size:var(--fs-lg);
  line-height:1.2; margin-top:2px; }
.board__value.is-warn{ color:var(--accent); }
.board__note{ display:block; font-size:var(--fs-xs); color:var(--text-3); }
@media (max-width:560px){
  .board__row{ grid-template-columns:repeat(2, minmax(0,1fr)); }
}

/* ---------- masa durumu ---------- */
/* Ofis hissini veren satır: herkesin ne yaptığı bir bakışta belli. */
.deskstate{ display:flex; align-items:center; gap:7px; margin-top:8px;
  font-size:var(--fs-xs); color:var(--text-3); }
.deskstate__dot{ width:7px; height:7px; border-radius:50%; flex:none; background:var(--text-3); }
.deskstate--ok .deskstate__dot{ background:var(--primary); }
.deskstate--warn{ color:var(--accent); }
.deskstate--warn .deskstate__dot{ background:var(--accent); }
.deskstate--danger{ color:var(--danger); }
.deskstate--danger .deskstate__dot{ background:var(--danger); }

/* ---------- takipteki kararlar ---------- */
.decisionrow{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 12px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2);
}
.decisionrow b{ display:block; }
.decisionrow span{ display:block; }

/* ---------- toplantı denetimi ---------- */
.meetbar{
  display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
  padding:10px 12px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2);
}
.meetbar__state{ display:flex; align-items:center; gap:8px; font-size:var(--fs-sm); }
/* Sabit nokta: yanıp sönmez — dikkat çekmek için animasyon kullanılmaz. */
.meetbar__live{ width:8px; height:8px; border-radius:50%; background:var(--primary); flex:none; }

.meetplan{ padding:12px 14px; border-radius:var(--r-sm); background:var(--surface-2); }
.meetplan__list{ margin:8px 0 8px 18px; padding:0; font-size:var(--fs-sm); color:var(--text-2); }
.meetplan__list li{ margin:3px 0; }

/* Toplantıda kullanıcının kendi sözü */
.meetturn--me{ background:var(--surface); border-style:dashed; }
.meetturn__round{
  font-size:var(--fs-xs); color:var(--text-3);
  padding:1px 8px; border-radius:20px; background:var(--surface-3);
}

/* ---------- toplantı raporu ---------- */
.reportrow{ padding:10px 12px; border-radius:var(--r-sm); background:var(--surface-2); }
.reportrow__list{ margin:6px 0 0 18px; padding:0; font-size:var(--fs-sm);
  color:var(--text-2); line-height:1.5; }
.reportrow__list li{ margin:3px 0; }

/* ---------- çoklu API anahtarı ---------- */
.keyrow{
  display:flex; align-items:center; gap:10px;
  padding:7px 10px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface-2);
}
.keyrow__mask{ font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:var(--fs-sm); flex:1; min-width:0; }
.keyrow__q{ font-size:var(--fs-xs); color:var(--text-3); white-space:nowrap; }

/* ---------- masa notları (proaktif uyarılar) ---------- */
.notes{ display:flex; flex-direction:column; gap:6px; }
.note{
  /* İlk sütun ya küçük bir nokta ya da bir ajan avatarı taşır; bu yüzden
     sabit değil içeriğe göre genişler. */
  display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:9px; align-items:center;
  padding:8px 10px; border-radius:10px;
  background:var(--surface-2); font-size:var(--fs-sm); line-height:1.45;
}
.note__dot{ width:8px; height:8px; border-radius:50%; background:var(--text-3); }
.note--danger{ background:var(--danger-soft); }
.note--danger .note__dot{ background:var(--danger); }
.note--warn{ background:var(--accent-soft); }
.note--warn .note__dot{ background:var(--accent); }
.note--ok{ background:var(--primary-soft); }
.note--ok .note__dot{ background:var(--primary); }

/* ---------- doğrudan hitap ---------- */
/* Ajan adı konuşma metninde geçtiğinde o masaya gitmek için tıklanabilir. */
.agentref{
  font: inherit; font-weight:700; padding:0 1px;
  border:0; background:none; cursor:pointer;
  border-bottom:1px dashed currentColor;
}
.agentref--patron { color:var(--agent-patron); }
.agentref--lab    { color:var(--agent-lab); }
.agentref--nutri  { color:var(--agent-nutri); }
.agentref--move   { color:var(--agent-move); }
.agentref--money  { color:var(--agent-money); }
.agentref:hover{ border-bottom-style:solid; }

/* Çapraz soru — Patron’un tur arasında sorduğu takip sorusu */
.meetturn--cross{ border-left:1px solid var(--accent); background:var(--accent-soft); }

/* ---------- toplantı: dar ekran ---------- */
@media (max-width:720px){
  /* Denetim çubuğu tek elle erişilebilsin diye üstte sabit durur. */
  .meetbar{
    position:sticky; top:0; z-index:var(--z-topbar);
    flex-direction:column; align-items:stretch; gap:8px;
  }
  .meetbar .row{ justify-content:space-between; }
  .meetbar .btn{ flex:1 1 auto; justify-content:center; }
  .meetturn{ padding:10px 11px; }
  .meetturn__who{ font-size:var(--fs-xs); }
  .meetturn__body{ font-size:var(--fs-sm); }
  .meet{ gap:9px; }
  .reportrow__list{ margin-left:14px; }
}

/* ---------- ekip sohbeti: ajan sekmesi ----------
   Sekmede avatar durur; kat planındaki kimlik rengi burada tekrarlanır. */
.agenttab{ display:inline-flex; align-items:center; gap:7px; min-width:0; }
.agentav--xs{ width:20px; height:20px; font-size:10px; }
.agenttab__name{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width:640px){
  .agenttab__name{ display:none; }
}

/* ====================================================================
   SPİ'YE ÖZEL YAPILAR

   Buradan aşağısı bu uygulamanın kendi bileşenleridir. Hepsi tokens.css
   değişkenlerini kullanır; ham renk yazılmaz. Ekrana özel yapılar
   bileşene çevrilmez, CSS'te adlandırılır (bkz. src/STIL.md).
   ==================================================================== */

/* ---------- referans aralığı çubuğu ----------
   Bir tahlil değerinin nerede durduğunu gösterir. Üç katman:
   referans aralığı (geniş, nötr) · hedef bant (dar, birincil) · değer (işaret).
   Renk tek başına anlam taşımaz: işaretin yanında daima sayı ve rozet durur. */
/* ================= ölçüm cetveli =================

   Sistemin imza bileşeni. Bir ilerleme çubuğu değildir: dolu bir kutu
   «ne kadar tamamlandı» der, burada sorulan o değil — «değer nerede
   duruyor». Bu yüzden zemin boştur, referans aralığı ince bir bant,
   hedef bandı bir alt çizgi, değer ise tek bir hassas ibredir. */
.scale{ min-width:0; }
.scale__axis{
  position:relative; height:20px;
}
/* Ekseni taşıyan çizgi tam ortadan geçer. */
.scale__axis::before{
  content:''; position:absolute; left:0; right:0; top:50%;
  height:1px; background:var(--rule); transform:translateY(-.5px);
}
.scale__ref{
  position:absolute; top:50%; height:6px; transform:translateY(-3px);
  background:var(--surface-3); border-radius:3px;
}
.scale__opt{
  position:absolute; top:50%; height:6px; transform:translateY(-3px);
  background:var(--primary); opacity:.34; border-radius:3px;
}
/* Referans aralığının uçlarındaki çentikler: aralık renkle değil,
   çizgiyle de okunur. */
.scale__tick{
  position:absolute; top:50%; width:1px; height:11px;
  transform:translate(-.5px, -5.5px);
  background:var(--border-strong);
}
/* İbre. Ölçüm dışarı taştığında incelmez, renk değiştirir ve uzar. */
.scale__mark{
  position:absolute; top:50%; width:2px; height:16px;
  transform:translate(-1px, -8px);
  background:var(--text); border-radius:1px;
  transition:left var(--dur-lg) var(--ease);
}
.scale__mark::after{
  content:''; position:absolute; left:50%; top:-4px;
  width:5px; height:5px; border-radius:50%;
  background:var(--text); transform:translateX(-2.5px);
}
.scale__mark.is-out{ background:var(--danger); height:20px; transform:translate(-1px, -10px); }
.scale__mark.is-out::after{ background:var(--danger); }

.scale__legend{
  display:flex; justify-content:space-between; align-items:baseline; gap:10px;
  margin-top:5px;
  font-size:11px; color:var(--text-3);
}
.scale__mid{ letter-spacing:.03em; }
.scale__mid b{ font-weight:600; color:var(--text-2); }
.scale__end{ font-variant-numeric:tabular-nums; }
.scale--bare .scale__axis{ height:18px; }

/* Eğilim oku — yön bildirir, iyi/kötü bildirmez. */
.trendmark{ font-size:11px; line-height:1; }
.trendmark--up{ color:var(--text-2); }
.trendmark--down{ color:var(--text-2); }
.trendmark--flat{ color:var(--text-3); }

/* ---------- ölçüm satırı (tahlil panelleri) ---------- */
.markerrow{
  display:grid; grid-template-columns:1fr auto; gap:4px 12px;
  padding:12px 0; border-bottom:1px solid var(--border);
}
.markerrow:last-child{ border-bottom:0; }
.markerrow__head{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; min-width:0; }
.markerrow__name{ font-weight:600; font-size:var(--fs-base); }
.markerrow__val{
  font-family:var(--font-display); font-weight:800; font-size:var(--fs-md);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.markerrow__val small{ font-weight:600; font-size:var(--fs-xs); color:var(--text-3); margin-left:3px; }
.markerrow__bar{ grid-column:1 / -1; }
.markerrow__note{ grid-column:1 / -1; font-size:var(--fs-sm); color:var(--text-2); }
.markerrow--empty{ padding:7px 0; }
.markerrow--empty .markerrow__name{ color:var(--text-2); font-weight:550; }
.markerrow--empty .markerrow__val{ color:var(--text-3); font-weight:600; font-size:var(--fs-base); }

/* ---------- kırmızı bayrak ---------- */
.flagcard{
  border:1px solid var(--danger); border-radius:var(--r);
  background:var(--danger-soft); padding:var(--sp-4);
}
.flagcard__head{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.flagcard__head svg{ width:18px; height:18px; color:var(--danger); flex:none; }
.flagcard__title{ font-weight:800; color:var(--danger); }
.flagcard__body{ font-size:var(--fs-sm); color:var(--text); }
.flagcard__foot{ margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }

/* ---------- öğün kartı ---------- */
.mealcard{
  border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); padding:var(--sp-4); margin-bottom:var(--sp-3);
}
.mealcard__head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.mealcard__slot{ font-weight:700; font-size:var(--fs-base); }
.mealcard__kcal{
  margin-left:auto; font-family:var(--font-display); font-weight:800;
  font-variant-numeric:tabular-nums;
}
.mealitem{
  display:flex; align-items:baseline; gap:8px; padding:5px 0;
  border-top:1px solid var(--border); font-size:var(--fs-sm);
}
.mealitem:first-of-type{ border-top:0; }
.mealitem__g{ color:var(--text-3); font-variant-numeric:tabular-nums; white-space:nowrap; }
.mealitem__name{ flex:1; min-width:0; }

/* Emilim rozetleri: öğün içindeki artıran/bozan etkiler. */
.absorb{
  display:flex; gap:8px; align-items:flex-start; padding:8px 10px;
  border-radius:var(--r-sm); font-size:var(--fs-sm); margin-top:8px;
}
.absorb--boost{ background:var(--primary-soft); color:var(--text); }
.absorb--block{ background:var(--accent-soft); color:var(--text); }
.absorb__mark{ font-weight:800; flex:none; }

/* ---------- besin arama satırı ---------- */
.foodrow{
  display:flex; align-items:center; gap:10px; width:100%; text-align:left;
  padding:9px 10px; border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); cursor:pointer; font:inherit; color:inherit;
}
.foodrow:hover{ background:var(--surface-2); }
.foodrow__name{ flex:1; min-width:0; font-weight:600; font-size:var(--fs-sm); }
.foodrow__meta{
  font-size:var(--fs-xs); color:var(--text-3); white-space:nowrap;
  font-variant-numeric:tabular-nums;
}

/* ---------- hane paylaştırma ---------- */
.splitrow{
  display:grid; grid-template-columns:1fr auto auto; gap:6px 14px;
  align-items:baseline; padding:12px 0; border-bottom:1px solid var(--border);
}
.splitrow:last-child{ border-bottom:0; }
.splitrow__name{ font-weight:600; }
.splitrow__g{
  font-family:var(--font-display); font-weight:800; font-size:var(--fs-md);
  font-variant-numeric:tabular-nums;
}
.splitrow__note{ grid-column:1 / -1; font-size:var(--fs-sm); color:var(--text-2); }

/* ---------- fiyat satırı ---------- */
.pricerow{
  display:grid; grid-template-columns:1fr auto auto; gap:8px 12px;
  align-items:center; padding:9px 0; border-bottom:1px solid var(--border);
}
.pricerow:last-child{ border-bottom:0; }
.pricerow__tl{ font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
.pricerow .input{ width:96px; }

/* ---------- asgari gün ---------- */
.minrow{
  display:flex; align-items:center; gap:10px; padding:7px 0;
  border-top:1px solid var(--border); font-size:var(--fs-sm);
  /* Kalıp dengesinde satır bir düğmedir; tarayıcı varsayılanları sıfırlanır. */
  background:none; border-left:0; border-right:0; border-bottom:0;
  color:inherit; font-family:inherit; text-align:left; width:100%;
}
button.minrow{ cursor:pointer; border-radius:8px; padding:7px 6px; }
button.minrow:hover{ background:var(--surface-2); }
.minrow:first-child{ border-top:0; }
.minrow__mark{
  width:20px; height:20px; border-radius:50%; flex:none;
  display:grid; place-items:center; font-size:11px; font-weight:800;
  background:var(--surface-3); color:var(--text-3);
}
.minrow.is-done .minrow__mark{ background:var(--primary); color:var(--primary-ink); }
.minrow__label{ flex:1; min-width:0; line-height:1.35; }
.minrow__detail{ color:var(--text-3); font-variant-numeric:tabular-nums; white-space:nowrap; }

/* ---------- toparlanma bileşenleri ---------- */
.readypart{
  display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px;
  align-items:center; padding:8px 0; border-top:1px solid var(--border);
}
.readypart:first-child{ border-top:0; }
.readypart__label{ font-size:var(--fs-sm); font-weight:600; }
.readypart__score{ font-variant-numeric:tabular-nums; font-weight:700; }
.readypart--off{ opacity:.55; }
.readypart__note{ grid-column:1 / -1; font-size:var(--fs-xs); color:var(--text-3); }

/* ---------- ilerleme merdiveni ---------- */
.ladder{ display:flex; flex-direction:column; gap:2px; margin-top:10px; }
.ladderstep{
  display:flex; align-items:center; gap:10px; padding:7px 10px;
  border-radius:var(--r-sm); font-size:var(--fs-sm); background:var(--surface-2);
}
.ladderstep__no{
  width:20px; height:20px; border-radius:50%; flex:none; display:grid;
  place-items:center; font-size:11px; font-weight:800;
  background:var(--surface-3); color:var(--text-3);
}
.ladderstep.is-done{ opacity:.6; }
/* Merdivendeki basamak bir DURUM değil bir KONUMdur; o yüzden bölümün
   rengini alır, durum renklerini değil. */
.ladderstep.is-done .ladderstep__no{ background:var(--sec); color:var(--primary-ink); }
.ladderstep.is-current{ background:var(--sec-soft); font-weight:600; }
.ladderstep.is-current .ladderstep__no{ background:var(--sec); color:var(--primary-ink); }
.ladderstep__to{ margin-left:auto; color:var(--text-3); font-size:var(--fs-xs); white-space:nowrap; }

/* ---------- hızlı giriş çubuğu ----------
   Sıfır sürtünmenin arayüz karşılığı: tek satır, tek Enter. */
.quick{
  display:flex; gap:8px; align-items:stretch; flex-wrap:wrap;
}
.quick .input{ flex:1; min-width:200px; }
.quick__hint{
  flex-basis:100%; font-size:var(--fs-xs); color:var(--text-3);
}

/* ---------- yapıştırılan tahlil önizlemesi ---------- */
.pasterow{
  display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px;
  align-items:center; padding:8px 0; border-top:1px solid var(--border);
}
.pasterow:first-child{ border-top:0; }
.pasterow__val{ font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }
.pasterow__src{
  grid-column:1 / -1; font-size:var(--fs-xs); color:var(--text-3);
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pasterow--off{ opacity:.5; }

/* ---------- besin öğesi ölçeri ---------- */
.nutgrid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(148px, 1fr));
  gap:var(--sp-3);
}
.nutcell{
  border:1px solid var(--border); border-radius:var(--r-sm);
  padding:10px; background:var(--surface);
}
.nutcell__label{ font-size:var(--fs-xs); color:var(--text-2); }
.nutcell__val{
  font-family:var(--font-display); font-weight:800; font-size:var(--fs-md);
  font-variant-numeric:tabular-nums; margin:2px 0 6px;
}
.nutcell__val small{ font-size:var(--fs-xs); font-weight:600; color:var(--text-3); }
.nutcell__pct{
  display:flex; justify-content:space-between; gap:8px; margin-top:5px;
  font-size:var(--fs-xs); color:var(--text-3); font-variant-numeric:tabular-nums;
}
.nutcell__over{ color:var(--danger); font-weight:700; }

/* ---------- görünüm paneli ----------
   Tema ve palet seçimi üst çubuktan tek dokunuşla açılır. Ayarların içine
   gömülü bir tercih, hiç kullanılmayan bir tercihtir. */
.appear{
  position:absolute; z-index:var(--z-overlay);
  width:308px; padding:14px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:14px; box-shadow:var(--shadow-lg);
}
.appear__label{
  font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-3); margin-bottom:7px;
}
.appear__label:not(:first-child){ margin-top:16px; }
.appear__themes{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.themebtn{
  display:flex; flex-direction:column; align-items:center; gap:6px;
  padding:10px 6px; border-radius:11px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text-2); font-size:var(--fs-xs); font-weight:650;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.themebtn svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; }
.themebtn:hover{ background:var(--surface-2); }
.themebtn.is-on{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary); }

.appear__palettes{ display:grid; grid-template-columns:repeat(2,1fr); gap:6px; }
.palbtn{
  display:flex; align-items:center; gap:7px;
  padding:7px 8px; border-radius:10px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text-2); font-size:var(--fs-xs); font-weight:650;
  min-width:0;
}
.palbtn:hover{ background:var(--surface-2); }
.palbtn.is-on{ border-color:var(--primary); background:var(--primary-soft); color:var(--primary); }
.palbtn__dot{
  width:14px; height:14px; border-radius:50%; flex:none;
  border:1px solid rgba(0,0,0,.12);
}
.palbtn span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.appear__designs{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
.appear__note{ margin-top:12px; font-size:var(--fs-xs); color:var(--text-3); line-height:1.45; }

/* ---------- seçilebilir kart ----------
   Antrenman hareketleri, seans şablonları ve porsiyon seçimi gibi
   "birden çoğunu işaretle" durumları için. Onay kutusu bir satırda
   kaybolur; kart tıklanabilir bir hedeftir ve seçili olduğu bellidir. */
.picks{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(210px,1fr));
  gap:8px;
}
.pickcard{
  position:relative; text-align:left; width:100%;
  display:flex; align-items:flex-start; gap:10px;
  padding:11px 12px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface);
  color:inherit; font:inherit;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.pickcard:hover{ background:var(--surface-hover); border-color:var(--border-strong); }
.pickcard.is-on{ border-color:var(--primary); background:var(--primary-soft); }
.pickcard__box{
  width:18px; height:18px; flex:none; margin-top:1px;
  border-radius:6px; border:1.5px solid var(--border-strong);
  display:grid; place-items:center;
  color:transparent; font-size:11px; font-weight:800;
}
.pickcard.is-on .pickcard__box{
  background:var(--primary); border-color:var(--primary); color:var(--primary-ink);
}
.pickcard__body{ min-width:0; flex:1; }
.pickcard__name{ display:block; font-size:var(--fs-sm); font-weight:650; line-height:1.3; }
.pickcard__meta{ display:block; font-size:var(--fs-xs); color:var(--text-3); margin-top:2px; line-height:1.35; }

/* ---------- ekran araç şeridi ----------
   Sekme şeridi ile o bölüme ait eylemi aynı satırda tutar. */
.toolbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-bottom:2px;
}
.toolbar__tabs{ flex:1 1 320px; min-width:0; }
.toolbar__actions{ display:flex; align-items:center; gap:7px; flex-wrap:wrap; }

/* ---------- büyük ölçüm ----------
   Ekranın tek ana sayısı: toparlanma skoru, haftalık maliyet, seri. */
.kpi{ display:flex; align-items:baseline; gap:8px; }
.kpi__value{
  font-family:var(--font-display); font-size:var(--fs-hero); font-weight:800;
  font-variant-numeric:tabular-nums; line-height:1; letter-spacing:-.03em;
}
.kpi__unit{ font-size:var(--fs-sm); font-weight:650; color:var(--text-3); }

/* ---------- danışma sohbeti ----------
   Baloncuk düzeni: kullanıcı sağda, ajan solda. Ajan balonunun altında
   cümlenin nereden geldiğini söyleyen rozet durur. */
.chat{ display:flex; flex-direction:column; gap:10px; max-height:52vh; overflow-y:auto; }
.msg{ display:flex; gap:8px; align-items:flex-start; max-width:92%; }
.msg__body{
  padding:10px 13px; border-radius:var(--r); background:var(--surface-2);
  border:1px solid var(--border); min-width:0;
}
.msg--me{ align-self:flex-end; flex-direction:row-reverse; }
.msg--me .msg__body{
  background:var(--primary-soft); border-color:var(--primary-soft);
  border-bottom-right-radius:5px;
}
.msg--agent{ align-self:flex-start; }
.msg--agent .msg__body{ border-bottom-left-radius:5px; }

/* Ajan sekmesi şeridi */
.agenttabs{ display:flex; gap:8px; flex-wrap:wrap; }
.agenttabs .agenttab{
  padding:7px 11px; border-radius:var(--r-sm);
  border:1px solid var(--border); background:var(--surface);
  cursor:pointer; font:inherit; color:inherit;
}
.agenttabs .agenttab:hover{ background:var(--surface-2); }
.agenttabs .agenttab.is-on{ border-color:var(--primary); background:var(--primary-soft); }

/* Ham veri gösterimi — brifing JSON'u */
.codeblock{
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:var(--fs-xs); line-height:1.5;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:var(--r-sm); padding:11px; margin:0;
  max-height:320px; overflow:auto; white-space:pre-wrap; word-break:break-word;
}

/* Alt sayfa içindeki bölüm başlığı */
.section-h{
  font-family:var(--font-display); font-size:var(--fs-base); font-weight:700;
  margin:0 0 6px;
}

/* ---------- eksik tamamlayıcılar ---------- */
/* Not tonları: masa notları beş tonda gelir, üçü ortak dosyada tanımlı. */
.note--info{ background:var(--info-soft); }
.note--info .note__dot{ background:var(--info); }
.note--muted{ background:var(--surface-2); }
.note--muted .note__dot{ background:var(--text-3); }

/* Form ızgarası: dar ekranda tek sütuna iner. */
.grid-form{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr));
  gap:var(--sp-3);
}

/* Tablo içinde satır açan düğme — görünüşü bağlantı, davranışı düğme. */
.linkbtn{
  background:none; border:0; padding:0; font:inherit; color:var(--primary);
  cursor:pointer; text-align:left; text-decoration:underline;
  text-underline-offset:2px;
}
.linkbtn:hover{ color:var(--primary-hover); }

/* ---------- dar ekran ---------- */
@media (max-width:640px){
  .markerrow{ grid-template-columns:1fr auto; }
  .splitrow, .pricerow{ grid-template-columns:1fr auto; }
  .quick .input{ min-width:100%; }
}

/* ================= boşluk yardımcıları (site düzeni) ================= */
.mt-20{ margin-top:20px; } .mt-24{ margin-top:24px; } .mt-32{ margin-top:32px; }
.mb-16{ margin-bottom:16px; } .mb-20{ margin-bottom:20px; } .mb-24{ margin-bottom:24px; }

/* ================= sonuç listesi =================

   Ölçümler organa göre kutulanmaz; tek düz listede durur. Her satır bir
   düğmedir ve ayrıntıyı açar. Sol kenardaki nokta durumu RENKLE değil,
   yanındaki rozetle birlikte söyler: renk tek başına anlam taşımaz. */
/* Liste bir kutu değil, bir CETVELDIR: çerçevesi yok, satırları ince
   çizgiyle ayrılır. On beş satırı kutuya almak sayfayı ağırlaştırıyordu. */
.reslist{ border-top:1px solid var(--border); }
.resrow{
  width:100%;
  display:grid;
  grid-template-columns:3px minmax(150px,1.4fr) 128px minmax(110px,1fr) 104px 78px;
  align-items:center; gap:16px;
  padding:14px 10px 14px 0;
  border:none; border-bottom:1px solid var(--border);
  background:none; color:var(--text); text-align:left;
  transition:background var(--dur) var(--ease);
}
.resrow:hover{ background:var(--surface-hover); }

.resrow__dot{ width:3px; height:26px; border-radius:2px; background:var(--surface-3); }
.resrow__dot--ok{ background:var(--primary); }
.resrow__dot--info{ background:var(--info); }
.resrow__dot--warn{ background:var(--accent); }
.resrow__dot--danger{ background:var(--danger); }

.resrow__name{ min-width:0; display:flex; flex-direction:column; gap:2px; }
.resrow__name b{ font-size:15px; font-weight:550; line-height:1.3; letter-spacing:-.003em; }
.resrow__panel{ font-size:11.5px; color:var(--text-3); letter-spacing:.02em; }
.resrow__val{
  font-family:var(--font-display); font-size:19px; font-weight:600;
  letter-spacing:-.02em; white-space:nowrap;
}
.resrow__val small{ font-size:11.5px; font-weight:500; color:var(--text-3); margin-left:4px; }
.resrow__bar{ min-width:0; }
.resrow__status{ justify-self:start; }
/* Listede rozetler yan yana on beş kez tekrarlanır; orada çerçeveli ve
   ikonlu bir rozet gürültü üretir. Satır içindeki rozet düz metne iner. */
.resrow__status .badge{
  background:none; border:none; padding:0;
  font-size:12px; font-weight:550; letter-spacing:.01em;
}
.resrow__status .badge svg{ display:none; }
.resrow__trend{ justify-self:end; white-space:nowrap; }

@media (max-width:900px){
  .resrow{ grid-template-columns:6px minmax(0,1fr) auto; row-gap:6px; }
  .resrow__bar{ grid-column:2 / -1; }
  .resrow__status{ grid-column:2; }
  .resrow__trend{ grid-column:3; }
}

/* ================= kapsamlı test girişi =================

   Tek formda bütün ölçümler. Panel seçimi yoktur; arama daraltır.
   Dolu satır işaretlenir ki uzun listede ne yazıldığı görünsün. */
.entryhead{
  display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:12px;
  padding:16px;
  border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface);
}
.entrygrid{
  display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:8px;
}
.entryrow{
  display:flex; align-items:center; gap:10px;
  padding:8px 10px 8px 12px;
  border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface);
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.entryrow:focus-within{ border-color:var(--primary); box-shadow:0 0 0 3px var(--ring); }
.entryrow.is-filled{ border-color:var(--primary); background:var(--primary-soft); }
.entryrow__name{
  flex:1; min-width:0;
  font-size:var(--fs-sm); font-weight:600; line-height:1.25; color:var(--text-2);
}
.entryrow__unit{ display:block; font-size:10.5px; font-weight:600; color:var(--text-3); }
.entryrow__in{
  width:78px; flex:none;
  border:none; background:none;
  font-family:var(--font-display); font-size:var(--fs-md); font-weight:700;
  color:var(--text); text-align:right;
  padding:2px 0;
}
.entryrow__in:focus{ outline:none; }
.entryrow__in::placeholder{ color:var(--text-3); font-weight:600; }

/* Uzun formun kaydetme çubuğu içeriğin altına yapışır: yüzlerce satır
   yazdıktan sonra kaydetmek için başa dönmek gerekmez. */
.entrybar{
  position:sticky; bottom:0;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap;
  margin-top:16px; padding:12px 16px;
  border:1px solid var(--border); border-radius:var(--r);
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:saturate(1.5) blur(10px);
  box-shadow:var(--shadow);
}

@media (max-width:640px){
  .entryhead{ grid-template-columns:1fr; }
}

/* ================= etiket bulutu ================= */
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip--muted{
  display:inline-flex; align-items:center;
  padding:3px 9px; border-radius:var(--r-pill);
  background:var(--surface-2); color:var(--text-3);
  font-size:var(--fs-xs); font-weight:600;
}

/* ================= enerji zinciri =================

   Bazal metabolizmadan hedefe giden yol adım adım yazılır. Tek bir "hedef:
   2100 kcal" satırı tartışılamaz; zincir tartışılabilir. */
.chain{
  display:flex; align-items:stretch; gap:10px; flex-wrap:wrap;
}
.chain__step{
  flex:1 1 150px; min-width:0;
  display:flex; flex-direction:column; gap:3px;
  padding:12px 14px;
  border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface-2);
}
.chain__step--end{ background:var(--primary-soft); border-color:var(--primary); }
.chain__label{
  font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
  color:var(--text-3);
}
.chain__value{
  font-family:var(--font-display); font-size:var(--fs-xl); font-weight:800;
  letter-spacing:-.02em; line-height:1.1; color:var(--text);
}
.chain__value small{ font-size:var(--fs-xs); font-weight:700; color:var(--text-3); margin-left:3px; }
.chain__note{ font-size:var(--fs-xs); color:var(--text-3); line-height:1.35; }
.chain__op{
  flex:0 0 auto; align-self:center;
  font-family:var(--font-display); font-size:var(--fs-sm); font-weight:800;
  color:var(--text-3);
}
@media (max-width:760px){
  .chain{ flex-direction:column; }
  .chain__op{ align-self:flex-start; padding-left:14px; }
}

/* ================= koçlar arası bağ =================

   Bir tahlil bulgusunun bir beslenme hedefini nasıl değiştirdiği. Ok tek
   yönlüdür: ölçüm hedefi değiştirir, hedef ölçümü değiştirmez. */
.link{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center; gap:10px;
  padding:12px 0;
  border-top:1px solid var(--border);
}
.link:first-child{ border-top:none; padding-top:2px; }
.link__from, .link__to{ display:flex; align-items:center; gap:7px; min-width:0; flex-wrap:wrap; }
.link__arrow{ color:var(--text-3); font-size:var(--fs-md); }
.link__why{
  grid-column:1 / -1; margin:2px 0 0;
  font-size:var(--fs-sm); color:var(--text-2); line-height:1.45;
}
@media (max-width:560px){
  .link{ grid-template-columns:1fr; }
  .link__arrow{ transform:rotate(90deg); justify-self:start; }
}

/* ================= gıda önerisi ================= */
.sugg{ padding:14px 0; border-top:1px solid var(--border); }
.sugg:first-child{ border-top:none; padding-top:2px; }
.sugg__head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:10px; }
.sugg__foods{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:8px; }
.suggfood{
  display:flex; flex-direction:column; gap:3px; align-items:flex-start;
  padding:9px 11px;
  border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text); text-align:left;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.suggfood:hover{ border-color:var(--primary); background:var(--surface-hover); }
.suggfood b{ font-size:var(--fs-sm); font-weight:650; }
.suggfood .num{ font-size:var(--fs-xs); color:var(--text-2); font-weight:600; }
.sugg__why{ margin:9px 0 0; font-size:var(--fs-xs); color:var(--text-3); line-height:1.45; }

/* ================= bütçe talebi =================

   Her satır bir koçun talebidir. Fiyatı bilinmeyen kalem boş bırakılmaz,
   «veri yok» yazar: sıfır sayılan bir kalem bütçeyi olduğundan küçük
   gösterir. */
.demand{
  display:grid;
  grid-template-columns:1fr auto auto;
  align-items:center; gap:12px;
  padding:12px 0;
  border-top:1px solid var(--border);
}
.demand:first-child{ border-top:none; padding-top:2px; }
.demand__who{ display:flex; align-items:center; gap:9px; min-width:0; }
.demand__cost{
  font-family:var(--font-display); font-size:var(--fs-md); font-weight:700;
  white-space:nowrap;
}
.demand__cost small{ font-size:var(--fs-xs); font-weight:600; color:var(--text-3); margin-left:3px; }
.demand__note{
  grid-column:1 / -1; margin:0;
  font-size:var(--fs-xs); color:var(--text-3); line-height:1.45;
}
@media (max-width:520px){
  .demand{ grid-template-columns:1fr auto; }
  .demand__cert{ grid-column:2; justify-self:end; }
}
.minw0{ min-width:0; }


/* ================= kayan şeritlerin kenarı =================

   Taşan bir sekme şeridinin sağ kenarında öge yarım kesilir ve bu bir
   çizim hatası gibi durur. Kenara doğru solan bir maske, kesilmenin
   kasıtlı olduğunu ve devamının bulunduğunu söyler. */
.subtabs, .pagenav__in, .navlinks{
  -webkit-mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%);
  mask-image:linear-gradient(90deg, #000 0, #000 calc(100% - 28px), transparent 100%);
}
/* Taşma yoksa maske de gerekmez; `scroll-timeline` yok, bu yüzden ölçüyü
   şerit kendi genişliğinden anlayamaz. Maske zararsızdır: taşmayan
   şeritte son 28px zaten boştur. */

/* ================= kadran =================

   Toparlanma bir yüzde değil bir DURUMDUR; yatay bir çubuk onu «ne kadar
   dolduruldu» gibi okutuyordu. Yay, bir ölçeğin üzerindeki ibre gibi
   durur: sıfır ve yüz uçlarda, değer arada bir yerde.

   Bant sınırları yayın üzerinde çentiklerle işaretlidir — skorun hangi
   banda düştüğü renkten önce KONUMDAN okunur. */
.gauge{ position:relative; aspect-ratio:1; flex:none; }
.gauge svg{ width:100%; height:100%; display:block; overflow:visible; }
.gauge__track{ stroke:var(--surface-3); }
.gauge__band{ stroke:var(--border-strong); stroke-width:1.5; }
.gauge__value{ stroke:var(--text-3); transition:stroke-dashoffset var(--dur-lg) var(--ease); }
.gauge__value--ok{ stroke:var(--primary); }
.gauge__value--warn{ stroke:var(--accent); }
.gauge__value--danger{ stroke:var(--danger); }
.gauge__value--info{ stroke:var(--info); }
.gauge__center{
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; pointer-events:none;
}
.gauge__num{
  font-family:var(--font-display); font-size:34px; font-weight:600;
  letter-spacing:-.035em; line-height:1; color:var(--text);
}
.gauge__label{
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3);
}

/* ================= dikte (mikrofon) =================

   Bir ANAHTAR düğmedir: açıkken basınca kapanır. Dinlerken çevresinde
   yavaş bir halka genişler — «çalışıyor» demenin en sessiz yolu. */
.mic{
  flex:none;
  width:38px; height:38px; border-radius:50%;
  display:inline-grid; place-items:center;
  position:relative;
  border:1px solid var(--border-strong);
  background:var(--surface); color:var(--text-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease),
             border-color var(--dur) var(--ease);
}
.mic svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; }
.mic:hover{ color:var(--text); border-color:var(--text-3); }
.mic--sm{ width:32px; height:32px; }
.mic--sm svg{ width:15px; height:15px; }
.mic.is-on{
  background:var(--sec); border-color:var(--sec); color:var(--primary-ink);
}
.mic__pulse{
  position:absolute; inset:-4px; border-radius:50%;
  border:2px solid var(--sec);
  animation:mic-pulse 1.6s var(--ease) infinite;
  pointer-events:none;
}
@keyframes mic-pulse{
  0%{ transform:scale(.9); opacity:.7; }
  100%{ transform:scale(1.35); opacity:0; }
}
@media (prefers-reduced-motion:reduce){ .mic__pulse{ animation:none; opacity:.5; } }

/* Metin alanının yanındaki mikrofon: alan büyür, düğme sabit kalır. */
.withmic{ display:flex; align-items:flex-start; gap:8px; }
.withmic > :first-child{ flex:1; min-width:0; }

/* ================= dosya bırakma alanı =================

   Hem tıklanır hem üzerine bırakılır. Sürükleme başladığında sayfadaki
   TEK bırakma alanı belirginleşir; kullanıcı küçük bir kutuya nişan
   almak zorunda kalmaz, dosyayı sayfanın herhangi bir yerine bırakır. */
.drop{
  position:relative; display:flex; align-items:center; gap:14px;
  padding:18px 20px;
  border:1.5px dashed var(--border-strong); border-radius:var(--r);
  background:var(--surface-hover);
  cursor:pointer;
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease);
}
.drop:hover{ border-color:var(--sec); background:var(--surface); }
.drop__input{
  position:absolute; inset:0; opacity:0; width:100%; height:100%; cursor:pointer;
}
.drop__icon{
  flex:none; width:40px; height:40px; border-radius:50%;
  display:grid; place-items:center;
  background:var(--sec-soft); color:var(--sec);
}
.drop__icon svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.7; }
.drop__text{ display:flex; flex-direction:column; gap:3px; min-width:0; }
.drop__text b{ font-size:var(--fs-base); font-weight:600; }
.drop__text span{ font-size:var(--fs-sm); color:var(--text-3); line-height:1.4; }

/* Sürükleme sırasında: sayfa sakinleşir, hedef belirginleşir. */
body.is-dragging .drop{
  border-color:var(--sec); background:var(--sec-soft);
}
body.is-dragging .drop.is-over{
  border-style:solid;
  box-shadow:0 0 0 4px var(--sec-soft);
}

/* ================= geri alma bildirimi ================= */
.toast--undo{ display:flex; align-items:center; gap:14px; padding-right:8px; }
.toast__undo{
  flex:none;
  border:none; background:none;
  color:var(--bg); opacity:.85;
  font-size:var(--fs-sm); font-weight:700; letter-spacing:.02em;
  text-decoration:underline; text-underline-offset:3px;
  padding:4px 8px;
  pointer-events:auto;
}
.toast__undo:hover{ opacity:1; }
.toast-root{ pointer-events:none; }
.toast{ pointer-events:auto; }

/* ================= hareket merdiveni bloğu =================

   Kart değil: ince çizgiyle ayrılan bir blok. On bir hareket on bir
   beyaz kutuya konduğunda sayfa bir tepsiye dönüyordu. */
.ladders{ display:flex; flex-direction:column; }
.ladderblk{
  padding-block:20px;
  border-top:1px solid var(--border);
}
.ladders > .ladderblk:first-child{ border-top:none; padding-top:4px; }
.ladderblk__head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  margin-bottom:6px;
}
.ladderblk__name{
  font-family:var(--font-serif); font-size:18px; font-weight:500;
  letter-spacing:-.004em; margin-right:8px;
}
.ladderblk__foot{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  flex-wrap:wrap; margin-top:12px;
}

/* Defter kipindeki katlanır bölüm: kutu yok, yalnız satır. */
.collapse--bare .collapse__btn{ padding-inline:0; }

/* ==== css/designs.css ==== */
/* DÜZENLER — dört seçilebilir tasarım dili.

   Bir düzen bir renk değişikliği değildir. Dördü de şunların hepsine
   dokunur: yazı ailesi, ölçek, gezinmenin biçimi, hero'nun ağırlığı,
   satırın kutu mu çizgi mi olduğu, köşe yarıçapı, gölge, zemin.
   Kullanıcı düzeni değiştirdiğinde farkı görmüyorsa o düzen yok
   demektir.

   Kural 1: bu dosya yalnız `:root[data-design="…"]` altında yazar.
   Seçili düzen yoksa (varsayılan «defter») burada hiçbir şey uygulanmaz.

   Kural 2: ham renk yazılmaz. Dördü de yedi palet ve karanlık tema
   altında çalışmak zorunda; renk her zaman jetondan türetilir.

   Kural 3: durum renkleri (--danger/--accent/--primary) hiçbir düzende
   yeniden tanımlanmaz. Bir tahlil sonucunun rengi düzene göre değişemez.

   Kural 4: bir düzen seçimi ağ isteği doğurmaz. Yeni yazı tipi
   indirilmez; yalnız yüklü üç aile ve sistemin tek aralıklı yazısı
   kullanılır. */


/* ════════════════════════════════════════════════════════════════
   ODAK — sayfada tek bir şey bağırır

   Fikir: her ekranın bir baş aktörü vardır ve gerisi ona hizmet eder.
   Bu düzen sayfayı DARALTIR (tek sütun, 880 piksel), başlığı ve ilk
   özet sayıyı büyütür, başka ne varsa küçültüp susturur. Kutu yok,
   gölge yok, yuvarlak köşe yok — yalnız tipografi ve boşluk.
   ════════════════════════════════════════════════════════════════ */

:root[data-design="odak"]{
  --content-max:880px;
  --fs-display:74px;
  --fs-base:14.5px;
  --fs-sm:12px;
  --gutter:0px;            /* künye sütunu kalkar: tek sütun kalır */
  --gutter-gap:0px;
  --r:0px; --r-sm:0px; --r-pill:0px;
  --shadow:none;
  --surface:var(--bg);     /* yüzey yok: her şey aynı kâğıdın üstünde */
  --surface-2:color-mix(in oklab, var(--bg) 92%, var(--text));
}

/* Gezinme fısıldar: numara yok, çizgi yok, yalnız ad. */
:root[data-design="odak"] .sitenav{ border-block:none; background:transparent; backdrop-filter:none; }
:root[data-design="odak"] .navlinks{ justify-content:center; }
:root[data-design="odak"] .navlink__num{ display:none; }
:root[data-design="odak"] .navlink{ padding:16px 0; margin-right:26px; }
:root[data-design="odak"] .navlink:last-child{ margin-right:0; }
:root[data-design="odak"] .navlink__label{ font-size:12.5px; letter-spacing:.04em; }
:root[data-design="odak"] .navlink.is-active::after{
  left:50%; right:auto; width:4px; height:4px; bottom:8px;
  border-radius:50%; transform:translateX(-50%);
}
:root[data-design="odak"] .masthead__in{ height:72px; }
:root[data-design="odak"] .masthead__date{ display:none; }

/* Hero: sayfanın yarısı. Başlık serifle çok büyük, altında tek cümle. */
:root[data-design="odak"] .hero{ border-bottom:none; }
:root[data-design="odak"] .hero::before{ display:none; }
:root[data-design="odak"] .hero__in{
  grid-template-columns:minmax(0,1fr);
  padding-block:72px 0;
  gap:0;
}
:root[data-design="odak"] .hero__eyebrow{ margin-bottom:30px; justify-content:center; }
:root[data-design="odak"] .hero__main{ text-align:center; }
:root[data-design="odak"] .hero__title{
  letter-spacing:-.04em; line-height:1.02; max-width:none;
}
:root[data-design="odak"] .hero__lede{
  margin:26px auto 0; max-width:44ch; font-size:16px; color:var(--text-3);
}
:root[data-design="odak"] .hero__actions{ justify-content:center; margin-top:34px; }

/* Özet sayılar: ilki devasa ve ortada, diğerleri altında minicik. */
:root[data-design="odak"] .hero__side{
  grid-column:1;
  display:flex; justify-content:center; flex-wrap:wrap;
  padding:58px 0 0; margin-top:44px;
  border-top:1px solid var(--border);
}
:root[data-design="odak"] .herostat{ border-left:none; padding:0 30px; text-align:center; }
:root[data-design="odak"] .herostat:first-child{
  flex-basis:100%; padding:0 0 34px;
}
:root[data-design="odak"] .herostat:first-child .herostat__value{
  font-family:var(--font-serif);
  font-size:clamp(96px, 17vw, 188px); font-weight:400;
  letter-spacing:-.055em; line-height:.82;
}
:root[data-design="odak"] .herostat:first-child .herostat__value small{
  font-size:26px; letter-spacing:0; margin-left:8px;
}
:root[data-design="odak"] .herostat:first-child .herostat__label{
  margin-top:22px; font-size:11px; letter-spacing:.28em; color:var(--text-2);
}
:root[data-design="odak"] .herostat:not(:first-child) .herostat__value{
  font-size:17px; font-weight:600; color:var(--text-2);
}
:root[data-design="odak"] .herostat:not(:first-child) .herostat__label{
  margin-top:6px; font-size:9px; letter-spacing:.16em;
}
:root[data-design="odak"] .hero__motif{
  grid-column:1; justify-self:center; margin-top:40px; height:26px; opacity:.3;
}

/* Gövde: künye sütunu üste çıkar, satır tek sütun olur, aralar açılır. */
:root[data-design="odak"] .content{ padding-block:20px 110px; }
:root[data-design="odak"] .lrow{
  grid-template-columns:minmax(0,1fr);
  gap:20px; padding-block:64px;
}
:root[data-design="odak"] .ledger > .lrow:first-child{ padding-top:56px; }
:root[data-design="odak"] .lrow__side{
  position:static;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
:root[data-design="odak"] .lrow__label{
  font-size:10px; letter-spacing:.3em; color:var(--text-3); font-weight:600;
}
:root[data-design="odak"] .lrow__meta{ margin-top:0; font-size:12px; }
:root[data-design="odak"] .lrow__note{ margin-top:0; max-width:60ch; flex-basis:100%; }
:root[data-design="odak"] .lrow__act{
  margin-top:0; margin-left:auto; flex-direction:row;
}
:root[data-design="odak"] .lrow__act .btn{ width:auto; }
:root[data-design="odak"] .lrow__main > * + *{ margin-top:30px; }

/* Kutu dili tamamen kalkar. */
:root[data-design="odak"] .card{
  border:none; background:none; padding:0; box-shadow:none;
}
:root[data-design="odak"] .card--flat{ background:none; }
:root[data-design="odak"] .btn{ border-radius:2px; }
:root[data-design="odak"] .seg{ border-radius:0; background:none; border:none; padding:0; gap:18px; }
:root[data-design="odak"] .seg button{ border-radius:0; padding:5px 0; font-weight:500; }
:root[data-design="odak"] .seg button.is-on{
  background:none; box-shadow:inset 0 -2px 0 var(--sec);
}
:root[data-design="odak"] .sect__h h2{ font-size:30px; }

@media (max-width:860px){
  :root[data-design="odak"]{ --fs-display:38px; }
  :root[data-design="odak"] .hero__in{ padding-block:44px 0; }
  :root[data-design="odak"] .hero__side{ padding-top:38px; margin-top:32px; }
  :root[data-design="odak"] .lrow{ padding-block:40px; }
}


/* ════════════════════════════════════════════════════════════════
   KRAFT — daktilo edilmiş kâğıt

   Fikir: ekranda bir yazılım değil, doldurulmuş bir kâğıt dursun.
   Bu yüzden değişen şey renk değil YAZI: gövde, sayı ve etiketlerin
   hepsi tek aralıklı olur. Sadece başlıklar seriflerini korur — daktilo
   metninin üstündeki matbu başlık gibi.

   Yeni yazı tipi indirilmez: sistemin kendi tek aralıklı ailesi
   kullanılır. Bir düzen seçimi ağ isteği doğurmamalıdır.
   ════════════════════════════════════════════════════════════════ */

:root[data-design="kraft"]{
  --font-mono:ui-monospace, 'SFMono-Regular', 'Menlo', 'Courier New', monospace;
  --font-body:var(--font-mono);
  --font-display:var(--font-mono);
  --fs-base:13px;
  --fs-sm:11.5px;
  --fs-xs:10.5px;
  --r:0px; --r-sm:0px; --r-pill:0px;
  --shadow:none;
  --gutter:172px;
  /* Kâğıt: sıcak, doygunluğu düşük, hafif koyu.

     Hepsi TEK bir hedef renkten (`--kraft-kagit`) ve kraft'ın kendi
     yeniden tanımlamadığı jetonlardan (`--surface-3`, `--border-strong`)
     türer. Bu zorunluluktur: bir jeton kendi türevine dayanırsa CSS
     özel değişken DÖNGÜSÜ oluşur ve zincirdeki her değer geçersiz olur.
     Nitekim oluyordu — koyu temada kâğıt paletinde `--bg` çözülemediği
     için metin zeminle aynı renge düşüyordu (kontrast 1.00). Karanlıkta
     yalnız hedef renk ile yüzey değişir, gerisi kendiliğinden gelir. */
  --kraft-kagit:#EFE1C2;
  --surface:color-mix(in oklab, var(--surface-3) 14%, #FFFDF6);
  --bg:color-mix(in oklab, var(--surface) 84%, var(--kraft-kagit));
  --surface-2:color-mix(in oklab, var(--surface) 56%, var(--kraft-kagit));
  --border:color-mix(in oklab, var(--border-strong) 74%, var(--kraft-kagit));
}
@media (prefers-color-scheme:dark){
  :root[data-design="kraft"]:not([data-theme="light"]){
    --kraft-kagit:#0D0B05;
    --surface:color-mix(in oklab, var(--surface-3) 30%, #1F1A12);
  }
}
:root[data-design="kraft"][data-theme="dark"]{
  --kraft-kagit:#0D0B05;
  --surface:color-mix(in oklab, var(--surface-3) 30%, #1F1A12);
}

/* Doku KABUĞA çizilir: `.site` zemini gövdeyi tamamen örttüğü için
   dokuyu gövdeye koymak onu görünmez kılıyordu. İki katman lif; üçüncü
   bir katman moiré üretiyor. Doku sayfayla birlikte kayar — `fixed`
   verilseydi kâğıt yerinde durur, yazı üstünden akardı. */
:root[data-design="kraft"] .site{
  background-color:var(--bg);
  background-image:
    repeating-linear-gradient(104deg,
      color-mix(in srgb, var(--text) 4%, transparent) 0 1px, transparent 1px 4px),
    repeating-linear-gradient(31deg,
      color-mix(in srgb, var(--text) 2.6%, transparent) 0 1px, transparent 1px 7px);
}

/* Başlıklar matbu kalır; okunacak uzun metnin dışındaki her şey daktilo. */
:root[data-design="kraft"] .hero__title,
:root[data-design="kraft"] .sect__h h2,
:root[data-design="kraft"] .brand__text b{ font-family:var(--font-serif); }

/* Gezinme: köşeli parantez içinde etkin bölüm — terminal değil, daktilo. */
:root[data-design="kraft"] .sitenav{
  border-block:1px solid var(--border-strong);
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  backdrop-filter:none;
}
:root[data-design="kraft"] .navlink__label{ font-size:12.5px; letter-spacing:0; }
:root[data-design="kraft"] .navlink.is-active::after{ display:none; }
:root[data-design="kraft"] .navlink.is-active .navlink__label::before{ content:'['; margin-right:3px; }
:root[data-design="kraft"] .navlink.is-active .navlink__label::after{ content:']'; margin-left:3px; }
:root[data-design="kraft"] .hero{ border-bottom:1px dashed var(--border-strong); }
:root[data-design="kraft"] .hero::before{ opacity:.09; }
:root[data-design="kraft"] .hero__lede{ font-size:13.5px; line-height:1.75; }

/* Künye sütunu: solda kısa bir tırnak, altında daktilo satırı. */
:root[data-design="kraft"] .lrow{ border-top-style:dashed; }
:root[data-design="kraft"] .lrow__label{
  font-size:11px; font-weight:700; letter-spacing:.05em;
}
:root[data-design="kraft"] .lrow__label::before{
  content:''; width:14px; height:1px; background:var(--sec); flex:none; margin-right:2px;
}
/* Defterin kenar çizgisi: künye ile içeriğin arasında, bölümün renginde
   soluk bir dikey çizgi. Okul defterinin marj çizgisinin karşılığı. */
@media (min-width:901px){
  :root[data-design="kraft"] .lrow{ position:relative; }
  :root[data-design="kraft"] .lrow::before{
    content:''; position:absolute; top:0; bottom:0;
    left:calc(var(--gutter) + var(--gutter-gap) / 2);
    width:1px; background:var(--sec); opacity:.24;
  }
  :root[data-design="kraft"] .lrow--wide::before{ display:none; }
}

/* Kutular kâğıda iğnelenmiş fişler: gölge değil, sert bir kayma. */
:root[data-design="kraft"] .card{
  border:1px solid var(--border-strong);
  box-shadow:3px 3px 0 color-mix(in srgb, var(--text) 9%, transparent);
}
:root[data-design="kraft"] .btn{
  border:1px solid var(--border-strong);
  box-shadow:2px 2px 0 color-mix(in srgb, var(--text) 12%, transparent);
  font-weight:700; letter-spacing:.02em;
}
:root[data-design="kraft"] .btn:active{ box-shadow:none; transform:translate(2px, 2px); }
:root[data-design="kraft"] .input, :root[data-design="kraft"] .select,
:root[data-design="kraft"] .textarea{ border-color:var(--border-strong); }
:root[data-design="kraft"] .seg{ border-color:var(--border-strong); }
:root[data-design="kraft"] .seg button.is-on{ box-shadow:2px 2px 0 color-mix(in srgb, var(--text) 10%, transparent); }
:root[data-design="kraft"] .table td{ border-bottom-style:dashed; }


/* ════════════════════════════════════════════════════════════════
   KATMANLI — solda koyu raf, sağda çalışma yüzeyi

   Fikir: yatay şerit gazetenin dilidir, dikey raf bir masaüstü
   yazılımının. Raf KOYU olur ve çalışma alanı temiz yüzeye oturur;
   ikisi arasındaki ton farkı «burası menü, şurası iş» ayrımını tek
   bakışta kurar.

   Raf yalnız 900 pikselin üstünde çizilir; altında layout.css'in mobil
   menüsü geçerlidir.
   ════════════════════════════════════════════════════════════════ */

:root[data-design="katmanli"]{
  --r:8px; --r-sm:6px;
}
/* Çalışma yüzeyi kâğıt değil beyaz: işin yapıldığı yer öne çıksın. */
:root[data-design="katmanli"] .site__body,
:root[data-design="katmanli"] .hero,
:root[data-design="katmanli"] .pagenav,
:root[data-design="katmanli"] .masthead{ background:var(--surface); }

@media (min-width:901px){
  :root[data-design="katmanli"]{
    --rail-w:228px;
    --nav-h:0px;              /* üstte yapışan şerit kalmadı */
    --content-max:1060px;
  }
  :root[data-design="katmanli"] .site{
    display:grid;
    grid-template-columns:var(--rail-w) minmax(0,1fr);
    grid-template-rows:auto auto auto 1fr auto;
  }

  /* Raf hücrenin TAMAMINI kaplar (zemin sayfanın sonuna kadar iner),
     içindeki liste yapışır. Rafa 100vh verip yapıştırmak uzun
     sayfalarda rafın bitip zeminin kesildiği bir sınır üretiyordu. */
  :root[data-design="katmanli"] .sitenav{
    grid-column:1; grid-row:1 / -1;
    position:static; align-self:stretch;
    border:none;
    background:var(--ink); color:var(--ink-on);
    backdrop-filter:none;
  }
  :root[data-design="katmanli"] .navlinks{
    position:sticky; top:0;
    max-height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; align-items:stretch;
    max-width:none; padding:20px 12px 28px; gap:2px;
  }
  /* Rafın başlığı listenin ilk ögesidir: kaydırmayla birlikte hareket
     eder, mutlak konumlu bir etiket gibi zeminle çakışmaz. */
  :root[data-design="katmanli"] .navlinks::before{
    content:'SPİ · Bölümler';
    padding:10px 12px 18px;
    font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:color-mix(in srgb, var(--ink-on) 52%, var(--ink));
  }
  :root[data-design="katmanli"] .navlink{
    display:grid; grid-template-columns:24px minmax(0,1fr) auto;
    align-items:center; gap:10px;
    padding:11px 12px; margin:0;
    border-radius:var(--r-sm);
    text-align:left;
    color:color-mix(in srgb, var(--ink-on) 74%, var(--ink));
  }
  :root[data-design="katmanli"] .navlink__num{
    color:color-mix(in srgb, var(--ink-on) 48%, var(--ink)); opacity:1;
  }
  :root[data-design="katmanli"] .navlink__label{ white-space:normal; font-size:13.5px; }
  :root[data-design="katmanli"] .navlink:hover{
    background:color-mix(in srgb, var(--ink-on) 9%, transparent);
    color:var(--ink-on);
  }
  :root[data-design="katmanli"] .navlink.is-active{
    background:color-mix(in srgb, var(--ink-on) 15%, transparent);
    color:var(--ink-on);
  }
  :root[data-design="katmanli"] .navlink.is-active .navlink__num{ color:var(--ink-on); }
  :root[data-design="katmanli"] .navlink.is-active::after{ display:none; }
  :root[data-design="katmanli"] .navlink__badge.is-quiet{
    background:color-mix(in srgb, var(--ink-on) 20%, transparent); color:var(--ink-on);
  }

  :root[data-design="katmanli"] .masthead,
  :root[data-design="katmanli"] .hero,
  :root[data-design="katmanli"] .pagenav,
  :root[data-design="katmanli"] .site__body,
  :root[data-design="katmanli"] .sitefoot{ grid-column:2; }
  :root[data-design="katmanli"] .masthead{ grid-row:1; border-bottom:1px solid var(--border); }
  :root[data-design="katmanli"] .hero{ grid-row:2; }
  :root[data-design="katmanli"] .pagenav{ grid-row:3; top:0; background:var(--surface); }
  :root[data-design="katmanli"] .site__body{ grid-row:4; }
  :root[data-design="katmanli"] .sitefoot{ grid-row:5; }

  /* Marka rafta yazılı; künyede tekrar edilmez. */
  :root[data-design="katmanli"] .masthead .brand__text{ display:none; }
  :root[data-design="katmanli"] .masthead__date{ justify-content:flex-start; }
  :root[data-design="katmanli"] .wrapc{ padding-inline:36px; }
  :root[data-design="katmanli"] .hero__in{ padding-block:34px 26px; }
  :root[data-design="katmanli"] .hero::before{ font-size:108px; }

  /* Defter satırının künye sütunu bir panele döner: soldaki dolu şerit
     «bu blok burada başlıyor» der, liste/ayrıntı ilişkisi okunur olur. */
  :root[data-design="katmanli"] .lrow{ gap:0 32px; padding-block:28px; }
  :root[data-design="katmanli"] .lrow__side{
    top:24px;
    border-left:2px solid var(--sec);
    padding-left:14px;
  }
  :root[data-design="katmanli"] .lrow--wide .lrow__side{
    border-left:none; padding-left:0;
    border-top:2px solid var(--sec); padding-top:12px;
  }
}


/* ════════════════════════════════════════════════════════════════
   HARİTA — noktalı tuval üstünde düğüm kartlar

   Fikir: defter satırı okumak için iyidir ama ilişkiyi göstermez.
   Haritada her satır kendi kartına çekilir, kartlar noktalı bir
   tuvale dizilir, her kartın tepesinde bölümün renginde bir künye
   şeridi durur. Sayfa daha geniştir; tuvalin yayılacak yeri olur.

   Geniş satırlar (grafik, uzun cetvel) tuvalin tamamını kaplar —
   daralan bir grafik saçmadır.
   ════════════════════════════════════════════════════════════════ */

:root[data-design="harita"]{
  --content-max:1380px;
  --r:14px; --r-sm:9px;
  --gutter-gap:0px;
}

/* Tuval: nokta ızgarası. Rengini kenarlıktan alır, yani her palette ve
   karanlık temada kendi doğru tonunu bulur. */
:root[data-design="harita"] .site__body{
  background-color:color-mix(in oklab, var(--bg) 88%, var(--surface-3));
  background-image:radial-gradient(var(--border-strong) 1.2px, transparent 1.2px);
  background-size:24px 24px;
  background-position:-1px -1px;
  border-top:1px solid var(--border);
}
:root[data-design="harita"] .content{ padding-block:32px 80px; }

/* Gezinme tuvalin üstünde yüzen haplar. */
:root[data-design="harita"] .navlinks{ gap:4px; padding-block:7px; }
:root[data-design="harita"] .navlink{
  padding:8px 14px; margin:0; border-radius:var(--r-pill);
  align-items:center;
}
:root[data-design="harita"] .navlink:hover{ background:var(--surface-hover); }
:root[data-design="harita"] .navlink.is-active{
  background:var(--ink); color:var(--ink-on);
}
:root[data-design="harita"] .navlink.is-active .navlink__num{ color:var(--ink-on); opacity:.72; }
:root[data-design="harita"] .navlink.is-active::after{ display:none; }

:root[data-design="harita"] .ledger{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(352px, 1fr));
  gap:20px;
  align-items:start;
}

/* Satır artık kart: ızgara değil blok, çizgi değil çerçeve. */
:root[data-design="harita"] .lrow,
:root[data-design="harita"] .ledger > .lrow:first-child,
:root[data-design="harita"] .ledger > .lrow:last-child{
  display:block;
  padding:0;
  border:1px solid var(--border);
  border-radius:var(--r);
  background:var(--surface);
  box-shadow:0 1px 2px rgba(16,18,27,.05), 0 8px 22px rgba(16,18,27,.06);
  overflow:hidden;
  transition:box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
:root[data-design="harita"] .lrow--wide{ grid-column:1 / -1; }
:root[data-design="harita"] .lrow:hover{
  border-color:color-mix(in oklab, var(--sec) 36%, var(--border));
  box-shadow:0 2px 4px rgba(16,18,27,.06), 0 14px 32px rgba(16,18,27,.10);
}
@media (prefers-reduced-motion:reduce){
  :root[data-design="harita"] .lrow{ transition:none; }
}

/* Kart başlığı: bölüm renginde bir düğüm işareti ve künye. */
:root[data-design="harita"] .lrow__side{
  position:static; display:block;
  padding:13px 18px 12px;
  border-bottom:1px solid var(--border);
  background:color-mix(in oklab, var(--sec) 8%, var(--surface));
}
:root[data-design="harita"] .lrow__label{ font-size:10.5px; letter-spacing:.15em; }
:root[data-design="harita"] .lrow__label::before{
  content:''; width:7px; height:7px; border-radius:2px;
  background:var(--sec); flex:none;
}
:root[data-design="harita"] .lrow__meta{ margin-top:5px; font-size:12px; }
:root[data-design="harita"] .lrow__note{ margin-top:9px; max-width:none; font-size:12.75px; }
:root[data-design="harita"] .lrow__act{ margin-top:12px; flex-direction:row; flex-wrap:wrap; }
:root[data-design="harita"] .lrow__act .btn{ width:auto; }
:root[data-design="harita"] .lrow__main{ padding:18px; }
:root[data-design="harita"] .lrow__main > * + *{ margin-top:16px; }

/* Kartın içindeki kart çerçevesiz olur: iki çerçeve iç içe çizilmez. */
:root[data-design="harita"] .lrow .card{
  border-color:transparent; box-shadow:none; background:var(--surface-2);
}

/* Dar kartta blok sekme çubuğu: düğmeler sıkışıp iki satıra kırılmasın,
   gerekiyorsa çubuğun kendisi alt satıra sarsın. */
:root[data-design="harita"] .seg--block{ flex-wrap:wrap; }
:root[data-design="harita"] .seg--block button{ flex:1 1 auto; white-space:nowrap; }

:root[data-design="harita"] .hero::before{ opacity:.05; }

@media (max-width:720px){
  :root[data-design="harita"] .ledger{ grid-template-columns:minmax(0,1fr); }
}


/* ────────────────────────────────────────────────────────────────
   Görünüm kâğıdındaki düzen düğmeleri — her düzen kendi minyatürünü
   çizer. Ad yeterli değil: «Katmanlı»nın ne demek olduğu ancak
   görülünce anlaşılır.
   ──────────────────────────────────────────────────────────────── */
.desbtn{
  display:flex; flex-direction:column; align-items:stretch; gap:7px;
  padding:8px; border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text-2); text-align:left;
  transition:border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.desbtn:hover{ border-color:var(--border-strong); color:var(--text); }
.desbtn.is-on{ border-color:var(--primary); color:var(--text); }
.desbtn__name{ font-size:11.5px; font-weight:600; }
.desbtn__mini{
  height:34px; border-radius:2px; background:var(--surface-2);
  display:grid; gap:2px; padding:4px; overflow:hidden;
}
.desbtn__mini i{ display:block; background:var(--text-3); opacity:.5; border-radius:1px; }

/* defter: künye sütunu + içerik */
.desbtn__mini--lines{ grid-template-columns:9px 1fr; align-content:start; gap:3px 5px; }
.desbtn__mini--lines i:nth-child(odd){ height:3px; }
.desbtn__mini--lines i:nth-child(even){ height:3px; opacity:.28; }

/* odak: tek büyük blok + iki ince satır */
.desbtn__mini--single{ grid-template-rows:1fr auto auto; }
.desbtn__mini--single i:first-child{ opacity:.72; border-radius:2px; }
.desbtn__mini--single i:not(:first-child){ height:2px; opacity:.28; }

/* kraft: kesikli satırlar */
.desbtn__mini--paper i{
  height:3px; background:none; opacity:.55;
  border-top:2px dashed var(--text-3);
}

/* katmanlı: solda koyu raf */
.desbtn__mini--rail{ grid-template-columns:10px 1fr; gap:3px 4px; align-content:start; }
.desbtn__mini--rail i:first-child{ grid-row:1 / span 4; opacity:.8; border-radius:2px; }

   Uc alan birbirine karistirilmamalidir:

     ref      Laboratuvarin "normal" dedigi genis aralik. Disina cikmak
              incelenmesi gereken bir bulgudur.
     optimal  Hedef bant. Referans araligi icinde ama hedefin disindaysa

     red      Kirmizi bayrak. Bu esigin otesinde sistem yorum yapmaz;
              dogrudan hekime yonlendirir.

   degismeyenler duz dizi olarak yazilir. Okuma daima SP.Bio.refFor() ile
   yapilir, dogrudan alan okunmaz.

   `dir` degerin hangi yonde iyi oldugunu soyler:
     'mid'   bandin ortasi iyi (cogu olcum)
     'low'   dusuk olmasi iyi (LDL, trigliserit, CRP)
     'high'  yuksek olmasi iyi (HDL, D vitamini, HRV)

/* Hizli erisim tablolari — ekranlar ve ayristirici id ile arar. */
SP.BIO_BY_ID = SP.BIOMARKERS.reduce(function(acc, b){ acc[b.id] = b; return acc; }, {});
SP.PANEL_BY_ID = SP.PANELS.reduce(function(acc, p){ acc[p.id] = p; return acc; }, {});

/* Turetilmis olcumlerin formulleri.
   Her biri girdi id'lerini ve hesabi tasir; girdi eksikse null doner ve
   olcum hic yazilmaz — tahmin uretilmez. */
SP.DERIVED = {
  homa:{
    inputs:['glucose', 'insulin'],
    /* HOMA-IR = (aclik glukozu mg/dL x aclik insulini) / 405 */
    calc:function(v){ return (v.glucose * v.insulin) / 405; },
    note:'Açlık glukozu × açlık insülini ÷ 405',
  },
  nonhdl:{
    inputs:['chol', 'hdl'],
    calc:function(v){ return v.chol - v.hdl; },
    note:'Total kolesterol − HDL',
  },
  tsat:{
    inputs:['iron_s', 'tibc'],
    calc:function(v){ return v.tibc ? (100 * v.iron_s / v.tibc) : null; },
    note:'Serum demir ÷ demir bağlama kapasitesi × 100',
  },
};
