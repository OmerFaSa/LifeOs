            ${when(week && week.signedAt, () => K.Badge({ label:'imzalı', tone:'muted' }))}</div>
          <div class="tiny dim mt-2">${c.topics.join(' · ')}</div>
          <div class="tiny dim mt-2">Deneme: ${c.exam}</div>
        </div>
        <div class="tlweek__right right">
          <div class="num small strong">${c.q} soru</div>
          ${comp != null
            ? html`<div class="mt-5">${K.Bar({ value:comp })}</div>
                   <div class="tiny dim">%${comp} tamamlandı</div>`
            : html`<div class="tiny dim">planlandı</div>`}
        </div>
      </div>`;
  }

  /* Faz aralıkları: üretilmiş plan varsa ondan, yoksa sabit fazlardan. */
  function phaseRanges(){
    const total = R.PLAN.totalWeeks;
    const plan = M.activePlan();

    if(plan){
      const out = [];
      plan.weeks.forEach(w => {
        const last = out[out.length-1];
        if(last && last.phase.key === w.phase){ last.to = w.n; return; }
        out.push({ phase:{ key:w.phase, label:w.phaseLabel, theme:w.theme }, from:w.n, to:w.n });
      });
      return out;
    }

    const full = R.PROGRAM.totalWeeks;
    if(total >= full) return R.PHASES.map(p => ({ phase:p, from:p.weeks[0], to:p.weeks[1] }));
    const scale = total / full;
    let prev = 0;
    return R.PHASES.map(p => {
      const to = Math.min(total, Math.max(prev+1, Math.round(p.weeks[1]*scale)));
      const range = { phase:p, from:prev+1, to };
      prev = to;
      return range;
    }).filter(r => r.from <= r.to && r.from <= total);
  }

  function PhaseBlock(range){
    const { phase, from, to } = range;
    const weeks = [];
    let totalQ = 0;
    for(let n = from; n <= to; n++){ weeks.push(n); totalQ += M.curriculumFor(n).q; }
    return html`
      <div class="tlmonth">
        <div class="tlmonth__head"><h3>${phase.label}</h3>
          <span class="small muted">${phase.theme}</span>
          <span class="tiny dim ml-auto">H${from}${to > from ? '–H'+to : ''} · ${U.fmtNum(totalQ)} soru</span></div>
        ${map(weeks, WeekRow)}
      </div>`;
  }

  function planCard(){
    const plan = M.activePlan();
    if(!plan) return K.Card({ title:'Program', sub:'Sabit müfredat kullanılıyor',
      body:K.Notice({ tone:'info', body:'Kişisel plan henüz üretilmedi. Rehber → Ayarlar’dan '
        + 'takvimini ve kapasiteni gir; program sana göre yeniden dizilir.' }) });

    const m = plan.meta;
    const lv = R.Planner.level(m.level);
    const dropped = m.dropped || [];
    const byFreq = {};
    dropped.forEach(d => { byFreq[d.freq] = (byFreq[d.freq] || 0) + 1; });

    return K.Card({
      title:'Bu plan sana göre üretildi', hint:'intensity',
      sub:m.total+' hafta · haftada '+m.perWeek+' ana konu · '+lv.name.toLowerCase(),
      actions:K.Button({ label:'Yeniden hesapla', icon:'refresh', size:'sm', act:'auto-replan' }),
      body:html`
        ${K.Cols(4, [
          K.Stat({ label:'Kapsama', value:'%'+m.coverage, tone:m.coverage >= 80 ? 'ok' : 'warn',
            note:m.placed+' / '+m.poolSize+' konu' }),
          K.Stat({ label:'Kapasite', value:m.capacityHoursPerWeek, unit:' sa', note:'haftalık' }),
          K.Stat({ label:'Karar kapısı', value:(m.gates || []).length, note:'H'+(m.gates || []).join(' · H') }),
          K.Stat({ label:'Konu işlenen', value:m.productive, unit:' hafta', note:'prova hariç' }),
        ])}

        ${when(dropped.length, () => K.Notice({ tone:'warn',
          title:dropped.length+' konu plana yazılmadı.',
          body:html`Takvimin ve haftalık ${m.capacityHoursPerWeek} saatlik kapasiten
            ${m.placed} konuya yetiyor. Düşenler ${byFreq.low || 0} düşük, ${byFreq.mid || 0} orta frekanslı;
            ${byFreq.high
              ? html`<b>${byFreq.high} yüksek frekanslı konu da düşmek zorunda kaldı</b> —
                     takvim gerçekten dar, hedefi gözden geçir.`
              : html`<b>yüksek frekanslı hiçbir konu düşmedi</b>.`} Bu konular silinmedi — Dersler ekranında
            öncelik sırasına göre duruyor, boşluk buldukça çalışırsın.
            Tam kapsama için haftalık kapasite ~${m.capacityForFull} saat olmalıydı.` }))}

        ${when(!dropped.length, () => K.Notice({ tone:'ok',
          body:'Takvimin tüm konulara yetiyor; plan müfredatın tamamını kapsıyor.' }))}

        <p class="tiny dim mt-10">Plan sabit değildir: takvimi, kapasiteyi ya da seviyeni değiştirirsen
          yeniden üretilir. Geride kalırsan “Yeniden hesapla” kapanmamış konuları öne alır.</p>`,
    });
  }

  function droppedCard(){
    const plan = M.activePlan();
    const dropped = plan && plan.meta.dropped ? plan.meta.dropped : [];
    if(!dropped.length) return null;
    const bySubject = {};
    dropped.forEach(d => { (bySubject[d.subjectName] = bySubject[d.subjectName] || []).push(d); });
    return K.Collapsible({
      title:'Plana girmeyen konular', meta:dropped.length+' konu',
      act:'toggle-dropped', open:!!S.ui.droppedOpen,
      body:html`<div class="stack-xs mt-10">${map(Object.keys(bySubject), name => html`
        <div><span class="mono-label">${name}</span>
          ${K.Row(map(bySubject[name], d => K.Chip({
            label:d.name, act:'open-dropped',
            data:{ 'data-subject':d.subjectId, 'data-topic':d.topicId },
          })), { wrap:true })}
        </div>`)}</div>`,
    });
  }

  async function render(){
    const cur = M.currentWeek();
    let totalQ = 0, doneQ = 0;
    for(let i = 1; i <= R.PLAN.totalWeeks; i++){
      const q = M.curriculumFor(i).q;
      totalQ += q;
      if(i < cur) doneQ += q;
    }
    const plan = M.activePlan();
    const scale = R.PLAN.totalWeeks / R.PROGRAM.totalWeeks;
    const gateWeeks = (plan && plan.meta.gates && plan.meta.gates.length)
      ? plan.meta.gates
      : [11, 16, 20, 29, 33].map(w => Math.max(1, Math.round(w*scale)))
          .filter((w, i, a) => a.indexOf(w) === i);
    const grid = C.intensityGrid();

    return String(K.Grid([
      K.Span(12, K.Cols(4, [
        K.Stat({ label:'Program ilerlemesi', value:'%'+M.programProgress(), note:'Hafta '+cur+' / '+R.PLAN.totalWeeks }),
        K.Stat({ label:'Planlanan toplam soru', value:U.fmtNum(totalQ), note:'yeni ve bağımsız sorular' }),
        K.Stat({ label:'Bugüne kadar planlanan', value:U.fmtNum(doneQ), note:'ilk '+Math.max(0, cur-1)+' hafta' }),
        K.Stat({ label:'Sınava kalan', value:U.fmtNum(U.diffDays(U.todayISO(), R.PLAN.examTytISO)),
          unit:' gün', note:'TYT tahmini' }),
      ])),

      K.Span(12, planCard()),
      K.Span(12, droppedCard()),

      K.Span(12, K.Card({
        title:'Çalışma yoğunluğu', hint:'intensity', sub:R.PLAN.totalWeeks+' hafta × 7 gün',
        body:html`
          ${raw(UI.heatmap(grid.cells, { cols:R.PLAN.totalWeeks, monthTicks:grid.ticks }))}
          ${raw(UI.legend([
            { label:'çalışıldı — koyuluk yükü gösterir', color:'var(--primary)' },
            { label:'kayıt yok', color:'color-mix(in srgb, var(--danger) 30%, transparent)' },
            { label:'gelecek', color:'var(--surface-2)' },
          ]))}`,
      })),

      K.Span(12, K.Card({
        title:'Program zaman çizgisi',
        sub:U.fmtDate(R.PLAN.startISO)+' – '+U.fmtDate(U.iso(M.weekEnd(R.PLAN.totalWeeks)))+' · '+R.PLAN.totalWeeks+' hafta',
        actions:html`<span class="small dim">Karar kapıları: H${gateWeeks.join(' · H')}</span>`,
        body:html`<div class="timeline">${map(phaseRanges(), PhaseBlock)}</div>`,
      })),
    ]));
  }

  const handle = {
    async 'toggle-dropped'(){ S.ui.droppedOpen = !S.ui.droppedOpen; R.App.render(); },
    async 'open-dropped'(el){
      S.ui.subjectOpen = el.dataset.subject;
      R.App.go('subjects');
      setTimeout(() => R.Screens.subjects.handle['open-topic']({
        dataset:{ subject:el.dataset.subject, topic:el.dataset.topic } }), 100);
    },
    async 'open-week'(el){
      S.ui.weekView = Number(el.dataset.n);
      await M.ensureWeek(S.ui.weekView);
      R.App.go('week');
    },
  };

  return {
    id:'plan',
    title:'Program',
    subtitle(){
      return 'Hafta '+M.currentWeek()+' / '+R.PLAN.totalWeeks+' · '
        + U.fmtDate(R.PLAN.startISO)+' – '+U.fmtDate(U.iso(M.weekEnd(R.PLAN.totalWeeks)));
    },
    actions(){
      return String(K.Button({ label:'Bu haftayı aç', size:'sm', act:'go', data:{ 'data-route':'week' } }));
    },
    render, handle,
  };
})();

/* ==== js/screens/target.js ==== */
/* Hedef — siralar, net matrisi, OBP ve 24 tercih mimarisi.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.target = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  /* ---------- hedef katmanlari ---------- */

  function tierTable(){
    const tyt = C.medianTrend('TYT').last3;
    const ayt = C.medianTrend('AYT').last3;
    const rows = R.TARGET_TIERS.map(t => {
      const tytOk = tyt != null && tyt >= t.tytNum;
      const aytOk = ayt != null && ayt >= t.aytNum;
      const status = (tyt == null && ayt == null) ? K.Badge({ label:'veri yok', tone:'muted' })
        : (tytOk && aytOk) ? K.Badge({ label:'bantta', tone:'ok' })
        : (tytOk || aytOk) ? K.Badge({ label:'kısmen', tone:'warn' })
        : K.Badge({ label:'altında', tone:'muted' });
      return [
        html`<b>${t.name}</b><div class="tiny dim">${t.note}</div>`,
        html`<span class="num">${t.rank}</span>`,
        html`<span class="num">${t.tyt}</span>`,
        html`<span class="num">${t.ayt}</span>`,
        status,
      ];
    });
    return K.Table({ rows, headers:['Katman', { label:'Sıra hedefi', num:true },
      { label:'TYT net', num:true }, { label:'AYT net', num:true }, 'Durum'] });
  }

  /* ---------- net matrisi ---------- */

  function netMatrix(){
    const rows = R.TEST_BANDS.map(b => {
      const med = C.testMedian(b.testKey, b.exam);
      const status = med == null ? K.Badge({ label:'veri yok', tone:'muted' })
        : med >= b.high ? K.Badge({ label:'üst bant', tone:'ok' })
        : med >= b.low ? K.Badge({ label:'bantta', tone:'ok' })
        : med >= b.low*0.7 ? K.Badge({ label:'yaklaşıyor', tone:'warn' })
        : K.Badge({ label:'altında', tone:'danger' });
      return [
        b.test,
        html`<span class="num">${b.low}–${b.high}</span>`,
        html`<span class="num strong">${med == null ? '—' : U.fmtNet(med)}</span>`,
        html`<div class="mw-70">${K.Bar({ value:med == null ? 0 : U.clamp(100*med/b.high, 0, 100),
          tone:med != null && med < b.low ? 'warn' : '' })}</div>`,
        status,
      ];
    });
    return K.Table({ rows, headers:['Test', { label:'Hedef bant', num:true },
      { label:'Son 4 medyan', num:true }, '', 'Durum'] });
  }

  /* ---------- tahmini puan ve sıra ---------- */

  function estimateCard(){
    const est = C.estimateScore();

    if(!est.ok){
      return K.Card({
        title:'Tahmini sıra', hint:'rank', sub:'Kural motorunun ürettiği bant',
        badge:raw(UI.certainty('estimate')),
        body:K.Empty({ icon:'target', text:est.why,
          action:K.Button({ label:'Deneme ekle', size:'sm', tone:'primary',
            act:'go', data:{ 'data-route':'exams' } }) }),
      });
    }

    const gap = C.netGapToTarget();
    const tone = est.meta.tone;
    const scaleMax = Math.max(est.rankWorst, est.targetRank) * 1.15;
    const pos = v => U.clamp(100 * (1 - Math.log(Math.max(1, v)) / Math.log(Math.max(2, scaleMax))), 0, 100);

    return K.Card({
      title:'Tahmini sıra', hint:'rank',
      sub:est.samples+' tam denemenin medyanından · '+(est.kind === 'SAY' ? 'SAY' : 'yalnız TYT'),
      badge:raw(UI.certainty('estimate')),
      body:html`
        <div class="estimate">
          <div class="estimate__rank">${U.fmtNum(est.rankBest)} – ${U.fmtNum(est.rankWorst)}</div>
          <div class="estimate__band">${U.fmtNet(est.scoreLow)} – ${U.fmtNet(est.scoreHigh)} puan
            (±${est.halfWidth})</div>
          ${K.Badge({ label:est.meta.label, tone })}
        </div>

        <div class="estimate__scale">
          ${K.Bar({ value:pos(est.rank), tone:tone === 'ok' ? '' : 'warn' })}
          <div class="row between mt-4">
            <span class="tiny dim">geniş sıra</span>
            <span class="tiny dim num">hedef ${U.fmtNum(est.targetRank)}</span>
          </div>
        </div>

        <div class="mt-12">${K.Notice({ tone:tone === 'ok' ? 'ok' : 'info', body:est.meta.note })}</div>

        ${K.Cols(3, [
          K.Stat({ label:'TYT medyan', value:U.fmtNet(est.tytMedian) }),
          K.Stat({ label:'AYT medyan', value:est.aytMedian == null ? '—' : U.fmtNet(est.aytMedian) }),
          K.Stat({ label:'OBP katkısı', value:'+'+U.fmtNet(est.obp), tone:'ok' }),
        ])}

        ${when(gap && !gap.reached, () => html`<p class="small muted mt-10">
          Hedef bandı tutmak için tahmini <b>${U.fmtNet(gap.netDiff)} net</b> daha gerekiyor
          (${U.fmtNet(gap.scoreDiff)} puan). Bu sayı bir hedef değil, mesafe göstergesidir.</p>`)}
        ${when(gap && gap.reached, () => html`<p class="small muted mt-10">
          Tahmini puanın hedef sıranın gerektirdiği bandın üstünde. Şimdi yapılacak iş
          net artırmak değil, bandı düşürmemek.</p>`)}

        <p class="tiny dim mt-10">Bu bir ÖSYM hesabı değildir. Puan standart sapmaya göre
          normalize edilir ve aday dağılımı her yıl değişir; buradaki aralık son yılların
          sonuçlarından çıkarılmış koçluk bandıdır.</p>`,
    });
  }

  /* ---------- OBP ---------- */

  function obpCard(){
    const o = C.obp();
    const p = S.profile;
    return K.Card({
      title:'OBP katkısı', hint:'obp', sub:'Diploma notu × 5, ardından × katsayı',
      badge:raw(UI.certainty('estimate')),
      body:html`
        ${K.Cols(2, [
          K.Field({ label:'Diploma notu',
            input:K.Input({ id:'tg-diploma', type:'number', numeric:true, min:0, max:100,
              value:p.diplomaGrade, change:'diploma' }) }),
          html`<label class="check check--bottom">
            <input type="checkbox" ${p.previouslyPlaced ? raw('checked') : ''} data-act="toggle-placed"/>
            <span class="small">Daha önce merkezî yerleştirmeyle yerleştim</span></label>`,
        ])}
        ${K.Cols(3, [
          K.Stat({ label:'OBP', value:U.fmtNum(o.value), note:'250–500 aralığı' }),
          K.Stat({ label:'Katsayı', value:o.coef, note:p.previouslyPlaced ? 'tekrar yerleşme' : 'ilk yerleştirme' }),
          K.Stat({ label:'Puana katkı', value:'+'+U.fmtNet(o.contribution), tone:'ok' }),
        ])}
        <p class="tiny dim mt-10">Bu katkı net hedefini mekanik olarak azaltmaz; standartlaştırma ve aday dağılımı
          nedeniyle sonuç yıldan yıla değişir. 2027 kılavuzu yayımlandığında katsayı yeniden doğrulanmalıdır.</p>`,
    });
  }

  /* ---------- 24 tercih ---------- */

  function prefsCard(){
    const prefs = S.prefs;
    const tierOf = no => R.PREFERENCE_TIERS.find(t => no >= t.range[0] && no <= t.range[1]);
    const filled = prefs.rows.filter(r => r.program).length;

    return K.Card({
      title:'24 tercih mimarisi', hint:'preferences',
      sub:'Tercihler puana değil başarı sırasına göre yapılır; liste gerçekten istenen program sırasıdır',
      actions:html`<span class="small dim">${filled} / 24 dolu</span>`,
      body:html`
        <div class="stack-xs">${map(R.PREFERENCE_TIERS, t => html`
          <div class="row-top gap-8">
            <span class="badge badge--muted mw-74">${t.name} ${t.range[0]}–${t.range[1]}</span>
            <span class="small muted">${t.detail}</span></div>`)}</div>

        <div class="stack-xs mt-12">${map(prefs.rows, r => {
          const t = tierOf(r.no);
          const ph = r.no <= 8 ? 'agresif' : r.no <= 16 ? 'gerçekçi' : 'güvenli';
          return html`<div class="pref pref--${t.key}">
            <span class="pref__no">${r.no}</span>
            ${K.Input({ size:'sm', value:r.program, aria:r.no+'. tercih programı',
              placeholder:ph+' — üniversite / program', change:'pref-program', data:{ 'data-i':r.no-1 } })}
            ${K.Input({ size:'sm', numeric:true, class:'input--rank', value:r.rank, aria:r.no+'. tercih sırası',
              placeholder:'sıra', change:'pref-rank', data:{ 'data-i':r.no-1 } })}
          </div>`;
        })}</div>`,
      foot:html`<p class="tiny dim">Her satırda kontrol edilir: ${R.PREFERENCE_CHECKS.join(' · ')}.
        “Güvenli” program, adayın gitmeyeceği bölüm değildir; yerleşince kayıt yaptırmaya razı olunan programdır.</p>`,
    });
  }

  /* ---------- ekran ---------- */

  function certaintyLegend(){
    return K.Span(12, html`<div class="row wrap gap-6">
      <span class="mono-label as-center">Kesinlik</span>
      ${map(Object.keys(R.CERTAINTY), k => K.Badge({ label:R.CERTAINTY[k].label, tone:R.CERTAINTY[k].tone }))}
      ${raw(UI.hint('certainty'))}</div>`);
  }

  async function render(){
    const p = S.profile;
    const tyt = C.medianTrend('TYT'), ayt = C.medianTrend('AYT');

    return String(K.Grid([
      certaintyLegend(),

      K.Span(6, K.Stack([
        K.Card({
          title:'Hedef katmanları', hint:'tiers',
          sub:p.program+' — 2026 taban başarı sırası '+U.fmtNum(R.PROGRAM.refRank)
            + ' ('+R.PROGRAM.refQuota+'/'+R.PROGRAM.refQuota+' doluluk)',
          badge:raw(UI.certainty('ref2026')),
          body:html`${tierTable()}
            <p class="tiny dim mt-10">Puan yerine başarı sırası izlenir; standartlaştırma nedeniyle
              aynı net ve puan farklı yıllarda farklı sıraya dönüşebilir.</p>`,
        }),
        K.Card({
          title:'Net matrisi', hint:'net-matrix',
          sub:'Hedef bant ile son 4 tam denemenin test bazlı medyanı',
          badge:raw(UI.certainty('coaching')),
          body:netMatrix(),
        }),
        prefsCard(),
      ])),

      K.Span(4, K.Stack([
        estimateCard(),
        K.Cols(2, [
          K.Stat({ label:'TYT medyanı', value:tyt.last3 == null ? '—' : U.fmtNet(tyt.last3), note:'son 3 tam deneme' }),
          K.Stat({ label:'AYT medyanı', value:ayt.last3 == null ? '—' : U.fmtNet(ayt.last3), note:'son 3 tam deneme' }),
        ]),
        obpCard(),
        K.Card({
          title:'2026 sıra referansları', badge:raw(UI.certainty('ref2026')),
          body:html`
            ${K.Table({ tight:true, headers:['Program', { label:'Taban sıra', num:true }],
              rows:R.RANK_REFS.map(r => [r.uni,
                html`<span class="num">${typeof r.rank === 'number' ? U.fmtNum(r.rank) : r.rank}</span>`]) })}
            <p class="tiny dim mt-8">2027 tercih döneminde YÖK Atlas ve kılavuzdan güncellenmelidir.</p>`,
        }),
        K.Card({
          title:'2024 yerleşen profilleri', sub:'Gerçek yerleşme verisi',
          body:map(R.PLACEMENT_PROFILES, pr => html`
            <div class="stack-xs mb-12">
              <span class="mono-label">${pr.uni}</span>
              ${map(pr.rows, row => html`<div class="row between small">
                <span class="muted">${row[0]}</span><b class="num">${row[1]}</b></div>`)}
              ${when(pr.note, () => html`<p class="tiny dim">${pr.note}</p>`)}
            </div>`),
        }),
      ])),

      /* Aciklama paneli her zaman EN SONDA durur: tam genislik oldugu
         icin araya girerse kendinden sonraki kolonlari alt satira iter. */
      K.Span(12, raw(UI.rail(['rank', 'tiers', 'net-matrix', 'obp', 'preferences', 'certainty']))),
    ]));
  }

  const handle = {
    async 'toggle-placed'(el){
      S.profile.previouslyPlaced = el.checked;
      await M.saveProfile();
      R.App.render();
    },
  };

  const change = {
    async 'pref-program'(el){
      S.prefs.rows[Number(el.dataset.i)].program = el.value;
      S.prefs.updatedAt = new Date().toISOString();
      await M.savePrefs();
    },
    async 'pref-rank'(el){ S.prefs.rows[Number(el.dataset.i)].rank = el.value; await M.savePrefs(); },
    async 'diploma'(el){
      S.profile.diplomaGrade = U.clamp(Number(el.value) || 0, 0, 100);
      await M.saveProfile();
      R.App.render();
    },
  };

  return {
    id:'target',
    title:'Hedef',
    subtitle(){ return R.PROGRAM.program+' · 2026 sırası '+U.fmtNum(R.PROGRAM.refRank); },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/progress.js ==== */
/* Ilerleme — KPI panosu, grafikler ve aylik karar kapisi.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.progress = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const FAMILIES = [{ value:'TYT', label:'TYT' }, { value:'AYT', label:'AYT' }];

  const GATE_STATUS = {
    safe:'güvenli bantta', inband:'gözlenen bantta', above:'bandın üstünde',
    below:'bandın ALTINDA', unknown:'veri yok',
  };

  /* ---------- KPI panosu ---------- */

  function kpiValues(){
    const cur = M.currentWeek();
    const comp = C.planCompletion(cur);
    const qr = C.questionRealization(cur);
    const closure = C.overallClosure();
    const tyt = C.medianTrend('TYT');
    const base = C.examBase('TYT');
    const pareto = C.errorPareto();
    const debt = C.cardDebt();
    const history = C.completionHistory(8).map(h => h.value);

    const timeDrift = (function(){
      const withTime = C.fullExams('TYT').slice(-3).filter(e => e.tests.some(t => t.minutes != null));
      if(!withTime.length) return null;
      const last = withTime[withTime.length-1];
      return U.sum(last.tests.map(t => t.minutes || 0)) - (last.duration || 165);
    })();

    return [
      { key:'planCompletion', value:comp == null ? '—' : '%'+comp, spark:history, note:'bu hafta',
        progress:comp, target:85,
        tone:comp == null ? null : comp >= 85 ? 'ok' : comp >= 70 ? 'warn' : 'danger' },
      { key:'questionRate', value:qr ? '%'+qr.pct : '—', note:qr ? qr.solved+' / '+qr.target+' soru' : 'hedef girilmemiş',
        progress:qr ? qr.pct : null, target:90,
        tone:qr && qr.pct >= 90 ? 'ok' : qr && qr.pct >= 70 ? 'warn' : null },
      { key:'topicClosure', value:'%'+closure.pct, tone:closure.pct >= 55 ? 'ok' : 'warn',
        progress:closure.pct, target:55,
        note:closure.closed+' / '+closure.total+' konu' },
      { key:'netTrend', spark:tyt.series,
        value:tyt.delta == null ? '—' : (tyt.delta > 0 ? '+' : '')+U.fmtNet(tyt.delta),
        tone:tyt.delta == null ? null : tyt.delta > 0 ? 'ok' : tyt.delta < -1 ? 'danger' : 'warn',
        note:tyt.last3 == null ? 'en az 3 tam TYT gerekir'
          : 'son3 '+U.fmtNet(tyt.last3)+(tyt.prev3 != null ? ' · önceki3 '+U.fmtNet(tyt.prev3) : '') },
      { key:'examBase', value:base == null ? '—' : U.fmtNet(base), note:'son 4 denemenin en düşüğü' },
      { key:'errorMix', value:pareto[0] && pareto[0].count ? pareto[0].tag : '—',
        note:pareto[0] && pareto[0].count ? R.ERROR_TAGS[pareto[0].tag].name+' · %'+pareto[0].pct : 'hata kaydı yok' },
      { key:'timeDrift', value:timeDrift == null ? '—' : (timeDrift > 0 ? '+' : '')+timeDrift,
        unit:timeDrift == null ? '' : ' dk', note:'son tam TYT',
        tone:timeDrift == null ? null : timeDrift > 5 ? 'warn' : 'ok' },
      { key:'cardDebt', value:'%'+debt, tone:debt > 10 ? 'danger' : 'ok',
        progress:debt, target:10,
        note:C.overdueCards().length+' gecikmiş kart' },
    ];
  }

  function KpiTile(c){
    const def = R.KPI_DEFS.find(d => d.key === c.key);
    const hasSpark = c.spark && c.spark.filter(v => v != null).length > 1;
    return html`
      <div class="${c.tone ? 'stat stat--'+c.tone : 'stat'}" title="${def.formula}">
        <div class="row between"><span class="stat__label">${def.name}</span>
          <span class="tiny dim">${def.target}</span></div>
        <span class="stat__value">${c.value}${when(c.unit, () => html`<small>${c.unit}</small>`)}</span>
        ${when(hasSpark, () => raw(UI.sparkline(c.spark)))}
        ${when(c.progress != null, () => html`<span class="stat__bar" aria-hidden="true">
          <i style="width:${Math.max(0, Math.min(100, c.progress))}%"></i>
          ${when(c.target != null, () => html`<b style="left:${Math.max(0, Math.min(100, c.target))}%"></b>`)}
        </span>`)}
        <span class="stat__note">${c.note || ''}</span>
      </div>`;
  }

  /* ---------- trend ---------- */

  function trendCard(){
    const tyt = C.medianTrend('TYT'), ayt = C.medianTrend('AYT');
    const gate = C.currentGate();

    if(!tyt.series.length && !ayt.series.length){
      return K.Card({ title:'Deneme net trendi', body:K.Empty({ icon:'chart',
        text:'Tam deneme girildikçe medyan trendi burada oluşur. Karar tek denemeyle değil, son üç denemenin medyanıyla verilir.',
        action:K.Button({ label:'Deneme ekle', tone:'primary', act:'go', data:{ 'data-route':'exams' } }) }) });
    }

    const delta = (fam, t) => when(t.delta != null, () =>
      K.Badge({ label:fam+' '+(t.delta > 0 ? '+' : '')+U.fmtNet(t.delta), tone:t.delta > 0 ? 'ok' : 'warn' }));

    return K.Card({
      title:'Deneme net trendi', sub:'Yalnız tam denemeler',
      actions:html`<div class="row-sm">${delta('TYT', tyt)}${delta('AYT', ayt)}</div>`,
      body:html`
        ${raw(UI.lineChart([{ data:tyt.series }, { data:ayt.series, accent:true }],
          { labels:C.fullExams('TYT').map(e => U.fmtShort(e.date)), band:gate ? gate.tyt : null, height:210 }))}
        ${raw(UI.legend([
          { label:'TYT tam deneme', color:'var(--primary)' },
          { label:'AYT tam deneme', color:'var(--accent)' },
          { label:'bu ayın gözlenen bandı', color:'var(--c-band)' },
        ]))}
        <div class="cols-4 mt-12">
          ${K.Stat({ label:'TYT son 3 medyan', value:tyt.last3 == null ? '—' : U.fmtNet(tyt.last3) })}
          ${K.Stat({ label:'TYT tabanı', value:C.examBase('TYT') == null ? '—' : U.fmtNet(C.examBase('TYT')) })}
          ${K.Stat({ label:'AYT son 3 medyan', value:ayt.last3 == null ? '—' : U.fmtNet(ayt.last3) })}
          ${K.Stat({ label:'AYT tabanı', value:C.examBase('AYT') == null ? '—' : U.fmtNet(C.examBase('AYT')) })}
        </div>`,
    });
  }

  /* ---------- karar kapisi ---------- */

  function gateCard(){
    const gate = C.currentGate();
    if(!gate) return raw('');
    const key = U.monthKey(U.today());
    const decision = S.decisions[key];
    const g = C.gateSuggestions(gate);

    const meter = (fam, status, value, band, safe) => html`
      <div class="stack-xs">
        <div class="row between"><span class="mono-label">${fam} · ${GATE_STATUS[status]}</span>
          <b class="num">${value == null ? '—' : U.fmtNet(value)}</b></div>
        ${raw(UI.gauge(value, band, safe, ''))}
      </div>`;

    const choice = decision
      ? html`
        ${K.Notice({ tone:'ok', title:'Seçilen müdahale:', body:html`${decision.action}
          <div class="small muted">Veri dönemi: ${decision.window} · Yeniden değerlendirme: ${U.fmtDate(decision.reevaluateAt)}</div>` })}
        ${K.Button({ label:'Müdahaleyi değiştir', size:'sm', act:'clear-decision', data:{ 'data-key':key } })}`
      : html`
        <div class="stack-xs"><span class="mono-label">En fazla üç öneri — yalnız biri seçilir</span>
          ${map(g.suggestions, (s, i) => html`
            <label class="check"><input type="radio" name="gate-opt" value="${i}"/>
              <span>${s.text}<br/><span class="tiny dim">${s.why}</span></span></label>`)}
        </div>
        ${K.Button({ label:'Ana müdahaleyi kaydet', tone:'primary', act:'save-decision' })}`;

    return K.Card({
      title:'Aylık karar kapısı — '+gate.month,
      sub:'Son 3 denemenin medyanı vs bu ayın bandı',
      badge:decision ? K.Badge({ label:'karar verildi', tone:'ok' }) : K.Badge({ label:'karar bekliyor', tone:'warn' }),
      body:K.Stack([
        meter('TYT', g.tytStatus, g.tyt.last3, gate.tyt, gate.tytSafe),
        when(gate.ayt, () => meter('AYT', g.aytStatus, g.ayt.last3, gate.ayt, gate.aytSafe)),
        K.Notice({ tone:'info', title:'Bu ayın kuralı:', body:gate.note }),
        choice,
      ]),
      foot:html`<span class="mono-label">Karar kapısı algoritması</span>
        <ol class="bullets small muted mt-6">${map(R.GATE_ALGORITHM, s => html`<li>${s}</li>`)}</ol>`,
    });
  }

  /* ---------- test bazli trend ---------- */

  function testTrendCard(){
    const fam = S.ui.trendFamily || 'TYT';
    const series = C.testSeries(fam);
    const seg = K.Segmented({ items:FAMILIES, value:fam, act:'trend-family', aria:'Deneme ailesi' });

    if(!series.length){
      return K.Card({ title:'Test bazlı trend', actions:seg,
        body:K.Empty({ icon:'chart', text:'Tam deneme girildikçe her test için ayrı trend burada oluşur.' }) });
    }

    const rows = series.map(s => {
      const vals = s.data.filter(v => v != null);
      const last = vals.length ? vals[vals.length-1] : null;
      const first = vals.length ? vals[0] : null;
      const med = U.median(vals.slice(-4));
      const band = R.TEST_BANDS.find(b => b.testKey === s.name && b.exam === fam);
      const change = (first != null && last != null) ? U.round(last-first, 1) : null;
      const status = (!band || med == null) ? K.Badge({ label:'—', tone:'muted' })
        : med >= band.high ? K.Badge({ label:'üst bant', tone:'ok' })
        : med >= band.low ? K.Badge({ label:'bantta', tone:'ok' })
        : K.Badge({ label:'altında', tone:'warn' });
      return [
        html`<b class="small">${s.name}</b>${when(band, () => html`<div class="tiny dim">hedef ${band.low}–${band.high}</div>`)}`,
        raw(UI.sparkline(s.data)),
        html`<span class="num">${med == null ? '—' : U.fmtNet(med)}</span>`,
        html`<span class="${change > 0 ? 'num is-up' : change < 0 ? 'num is-down' : 'num dim'}">${change == null ? '—' : (change > 0 ? '+' : '')+U.fmtNet(change)}</span>`,
        status,
      ];
    });

    return K.Card({
      title:'Test bazlı trend', sub:'Test başına seyir', actions:seg,
      body:K.Table({ tight:true, rows,
        headers:['Test', 'Seyir', { label:'Son 4 medyan', num:true }, { label:'İlk→son', num:true }, 'Durum'] }),
    });
  }

  /* ---------- katlanir referanslar ---------- */

  function monthCurveCard(){
    const now = U.monthName(U.today());
    const rows = Object.keys(R.MONTH_GATES).map(m => {
      const g = R.MONTH_GATES[m];
      const range = b => b ? b[0]+'–'+b[1] : '—';
      return [
        m === now ? html`<b>${m}</b> ${K.Badge({ label:'şimdi', tone:'ok' })}` : m,
        html`<span class="num">${range(g.tyt)}</span>`,
        html`<span class="num dim">${range(g.tytSafe)}</span>`,
        html`<span class="num">${range(g.ayt)}</span>`,
        html`<span class="num dim">${range(g.aytSafe)}</span>`,
        html`<span class="small muted">${g.note}</span>`,
      ];
    });
    return K.Collapsible({
      title:'Aylık net gelişim eğrisi', meta:'koçluk bandı', act:'toggle-month-curve', open:!!S.ui.monthCurveOpen,
      body:K.Table({ tight:true, rows, headers:['Ay', { label:'TYT gözlenen', num:true }, { label:'TYT güvenli', num:true },
        { label:'AYT gözlenen', num:true }, { label:'AYT güvenli', num:true }, 'Karar kapısı'] }),
    });
  }

  function kpiReference(){
    return K.Collapsible({
      title:'KPI sözlüğü', meta:'formül ve müdahale', act:'toggle-kpi-ref', open:!!S.ui.kpiRefOpen,
      body:K.Table({ tight:true, headers:['KPI', 'Formül', 'Hedef', 'Sapmada'],
        rows:R.KPI_DEFS.map(d => [
          html`<b class="small">${d.name}</b>`,
          html`<span class="small dim">${d.formula}</span>`,
          K.Badge({ label:d.target, tone:'muted' }),
          html`<span class="small muted">${d.action}</span>`,
        ]) }),
    });
  }

  /* ---------- ekran ---------- */

  async function render(){
    const pareto = C.errorPareto();
    const history = C.completionHistory(8).map(h => ({ label:'H'+h.n, value:h.value }));
    const sleep = C.sleepAverage(7);
    const debt = C.cardDebt();
    const closure = C.overallClosure().pct;

    return String(K.Grid([
      K.Span(12, html`<div class="kpigrid">${map(kpiValues(), KpiTile)}</div>`),

      K.Span(6, K.Stack([
        trendCard(),
        testTrendCard(),
        K.Card({ title:'Plan tamamlama — son 8 hafta', sub:'Hedef %85',
          body:raw(UI.barChart(history, { targetLine:85, goodAt:85 })) }),
        monthCurveCard(),
        kpiReference(),
      ])),

      K.Span(4, K.Stack([
        gateCard(),
        K.Card({ title:'Hata paretosu', sub:'Son haftaların hata dağılımı', body:html`
          ${raw(UI.paretoBars(pareto))}
          ${when(pareto[0] && pareto[0].count, () => html`<div class="mt-10">${K.Notice({ tone:'info',
            body:'Reçete: '+R.ERROR_TAGS[pareto[0].tag].recipe })}</div>`)}` }),
        K.Card({ title:'Süreç göstergeleri', sub:'Nete değil sürece bakar', body:K.Stack([
          K.Meter({ label:'Tekrar borcu', value:debt, text:'%'+debt, tone:debt > 10 ? 'danger' : '' }),
          K.Meter({ label:'Konu kapanışı', value:closure, text:'%'+closure }),
          when(sleep != null, () => K.Meter({ label:'Uyku (7 gün ort.)',
            value:U.pct(sleep, S.profile.sleepTarget), text:sleep+' / '+S.profile.sleepTarget+' sa' })),
        ], 'sm') }),
      ])),

      K.Span(12, raw(UI.rail(['median', 'base-score', 'bands', 'gate', 'pareto', 'plan-completion', 'test-trend']))),
    ]));
  }

  const handle = {
    async 'trend-family'(el){ S.ui.trendFamily = el.dataset.value; R.App.render(); },
    async 'toggle-kpi-ref'(){ S.ui.kpiRefOpen = !S.ui.kpiRefOpen; R.App.render(); },
    async 'toggle-month-curve'(){ S.ui.monthCurveOpen = !S.ui.monthCurveOpen; R.App.render(); },
    async 'save-decision'(){
      const sel = document.querySelector('input[name="gate-opt"]:checked');
      if(!sel){ UI.toast('Bir müdahale seç'); return; }
      const gate = C.currentGate();
      const g = C.gateSuggestions(gate);
      const chosen = g.suggestions[Number(sel.value)];
      const key = U.monthKey(U.today());
      const dataWindow = C.fullExams('TYT').slice(-3).map(e => U.fmtShort(e.date)).join(', ') || 'deneme verisi yok';
      await M.saveDecision(key, {
        month:gate.month,
        action:chosen.text,
        why:chosen.why,
        threshold:gate.note,
        window:dataWindow,
        createdAt:new Date().toISOString(),
        reevaluateAt:U.iso(U.addDays(U.today(), 21)),
      });
      UI.toast('Müdahale kaydedildi · 21 gün sonra yeniden değerlendirilecek');
      R.App.render();
    },
    async 'clear-decision'(el){
      UI.confirmSheet('Müdahaleyi değiştir', 'Bu ayın seçili müdahalesi silinecek ve yeniden seçebileceksin.', async () => {
        delete S.decisions[el.dataset.key];
        await R.Store.remove('decisions/'+el.dataset.key);
        UI.closeSheet();
        R.App.render();
      });
    },
  };

  return {
    id:'progress',
    title:'İlerleme',
    subtitle(){
      const t = C.medianTrend('TYT');
      return t.last3 == null ? 'Henüz tam deneme medyanı yok'
        : 'TYT medyanı '+U.fmtNet(t.last3)+' · taban '+U.fmtNet(C.examBase('TYT'));
    },
    actions(){ return ''; },
    render, handle,
  };
})();

/* ==== js/screens/analytics.js ==== */
/* Analiz — türetilmiş okumalar tek yerde.

   İlerleme ekranı karar verir (KPI, kapı); bu ekran soru sorar:
   ne değişti, hangi konu hangi hatayı üretiyor, hız mı isabet mi,
   uyku ne yapıyor, söylenen kapasite gerçek mi.

   Yazim bicimi: STIL.md. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.analytics = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const A = () => R.Analytics;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const TABS = [
    { id:'compare', label:'Karşılaştırma' },
    { id:'errors',  label:'Hata haritası' },
    { id:'rank',    label:'Sıra geçmişi' },
    { id:'speed',   label:'Hız ve isabet' },
    { id:'value',   label:'Konu değeri' },
    { id:'habits',  label:'Alışkanlık' },
  ];

  function empty(text, action){
    return K.Card({ body:K.Empty({ icon:'chart', text, action }) });
  }
  const addExam = K.Button({ label:'Deneme ekle', size:'sm', tone:'primary',
    act:'go', data:{ 'data-route':'exams' } });

  /* ---------- karşılaştırma ---------- */

  function compareTab(){
    const list = S.exams.slice().sort((a, b) => b.date.localeCompare(a.date));
    if(list.length < 2) return empty('Karşılaştırma için en az iki deneme gerekir.', addExam);

    const opts = list.map(e => ({ value:e.id, label:U.fmtShort(e.date)+' · '+e.type }));
    const a = S.ui.compareA || list[1].id;
    const b = S.ui.compareB || list[0].id;
    const cmp = A().compareExams(a, b);

    return K.Grid([
      K.Span(8, K.Stack([
        K.Card({ title:'İki denemeyi yan yana koy', sub:'Toplam net değil, test bazında ne değişti',
          body:html`
            ${K.Cols(2, [
              K.Field({ label:'Önceki', input:K.Select({ options:opts, value:a, change:'cmp-a' }) }),
              K.Field({ label:'Sonraki', input:K.Select({ options:opts, value:b, change:'cmp-b' }) }),
            ])}` }),

        when(cmp, () => K.Card({
          title:cmp.delta > 0 ? 'Net arttı' : cmp.delta < 0 ? 'Net düştü' : 'Net aynı',
          sub:U.fmtShort(cmp.a.date)+' → '+U.fmtShort(cmp.b.date),
          badge:K.Badge({ label:(cmp.delta > 0 ? '+' : '')+U.fmtNet(cmp.delta)+' net',
            tone:cmp.delta > 0 ? 'ok' : cmp.delta < 0 ? 'danger' : 'muted' }),
          body:html`
            ${K.Table({ tight:true,
              headers:['Test', { label:'Önce', num:true }, { label:'Sonra', num:true },
                { label:'Fark', num:true }, { label:'Doğruluk', num:true }, { label:'Boş', num:true }],
              rows:cmp.rows.map(r => [
                r.name,
                html`<span class="num">${r.netA == null ? '—' : U.fmtNet(r.netA)}</span>`,
                html`<span class="num">${r.netB == null ? '—' : U.fmtNet(r.netB)}</span>`,
                html`<span class="${r.delta > 0 ? 'num is-up' : r.delta < 0 ? 'num is-down' : 'num dim'}">${
                  r.delta == null ? '—' : (r.delta > 0 ? '+' : '')+U.fmtNet(r.delta)}</span>`,
                html`<span class="num dim">${r.accA == null ? '—' : '%'+r.accA} → ${r.accB == null ? '—' : '%'+r.accB}</span>`,
                html`<span class="num dim">${r.blankA == null ? '—' : r.blankA} → ${r.blankB == null ? '—' : r.blankB}</span>`,
              ]) })}
            <div class="mt-12">${K.Notice({ tone:'info', body:cmp.note })}</div>` })),
      ])),
      K.Span(4, K.Stack([blankCard(), publisherCard(), raw(UI.rail(['median', 'base-score', 'net']))])),
    ]);
  }

  function blankCard(){
    const b = A().blankStrategy('TYT');
    if(!b.ok) return K.Card({ title:'Boş bırakma', body:K.Notice({ tone:'info', body:b.why }) });
    return K.Card({
      title:'Boş bırakma stratejisi', sub:'Boş sayısı ile net arasındaki ilişki',
      badge:K.Badge({ label:'ort. '+b.avgBlank+' boş', tone:'muted' }),
      body:html`
        ${K.Cols(2, [
          K.Stat({ label:'En iyi deneme', value:U.fmtNet(b.best.net), note:b.best.blank+' boş' }),
          K.Stat({ label:'En düşük', value:U.fmtNet(b.worst.net), note:b.worst.blank+' boş' }),
        ])}
        <div class="mt-12">${K.Notice({ tone:b.dir === 'same' ? 'info' : 'ok', body:b.note })}</div>`,
    });
  }

  function publisherCard(){
    const p = A().publisherAdjust('TYT');
    if(!p.ok) return K.Card({ title:'Yayın etkisi', body:K.Notice({ tone:'info', body:p.why }) });
    return K.Card({
      title:'Yayın zorluk farkı', sub:'Kolay yayından gelen yükseliş yanıltır',
      badge:K.Badge({ label:'fark '+U.fmtNet(p.spread), tone:p.spread >= 6 ? 'warn' : 'muted' }),
      body:html`
        ${K.Table({ tight:true, headers:['Yayın', { label:'Deneme', num:true },
          { label:'Medyan', num:true }, { label:'Sapma', num:true }],
          rows:p.rows.map(r => [r.publisher, r.count,
            html`<span class="num">${U.fmtNet(r.median)}</span>`,
            html`<span class="${r.offset > 0 ? 'num is-up' : r.offset < 0 ? 'num is-down' : 'num dim'}">${
              (r.offset > 0 ? '+' : '')+U.fmtNet(r.offset)}</span>`]) })}
        <p class="tiny dim mt-10">${p.note}</p>`,
    });
  }

  /* ---------- hata haritası ---------- */

  function errorsTab(){
    const h = A().errorHeatmap(14);
    if(!h.rows.length) return empty('Yanlış defterine kayıt girildikçe konu × hata haritası burada oluşur.',
      K.Button({ label:'Yanlış defterine git', size:'sm', tone:'primary', act:'go', data:{ 'data-route':'cards' } }));

    const cell = (v) => {
      if(!v) return html`<span class="heat heat--0">·</span>`;
      const lvl = h.max <= 1 ? 3 : Math.max(1, Math.min(4, Math.ceil(4 * v / h.max)));
      return html`<span class="heat heat--${lvl}">${v}</span>`;
    };

    return K.Grid([
      K.Span(8, K.Card({
        title:'Konu × hata tipi', sub:'Aynı konu farklı hata üretiyorsa reçete de farklıdır',
        body:html`
          ${K.Table({ tight:true,
            headers:['Konu'].concat(h.tags.map(t => ({ label:t, num:true })))
              .concat([{ label:'Toplam', num:true }]),
            rows:h.rows.map(r => [
              html`<span class="small">${r.topic}</span>`,
            ].concat(h.tags.map(t => cell(r.cells[t])))
              .concat([html`<b class="num">${r.total}</b>`])) })}
          <div class="mt-12">${K.Notice({ tone:'info',
            body:'K kavram, İ işlem, Y yorum, S süre, D dikkat. Bir konuda İ baskınsa çözüm '
               + 'daha çok konu tekrarı değil, işlem rutini kurmaktır.' })}</div>`,
      })),
      K.Span(4, K.Stack([leechCard(), raw(UI.rail(['pareto', 'error-tags', 'notebook']))])),
    ]);
  }

  function leechCard(){
    const rows = A().leechCards(4);
    return K.Card({
      title:'Yapışkan kartlar', sub:'Dört kez üst üste unutulan kart kötü yazılmıştır',
      badge:rows.length ? K.Badge({ label:String(rows.length), tone:'warn' }) : null,
      body:rows.length
        ? html`<div class="stack-xs">${map(rows.slice(0, 8), c => html`
            <div class="row between">
              <span class="small truncate">${c.front}</span>
              <span class="tiny dim num">${c.forgot}× unutuldu</span>
            </div>`)}</div>
          <p class="tiny dim mt-10">Bu kartları yeniden yaz: tek şey sorsun, cevabı tek cümle olsun.</p>`
        : K.Empty({ icon:'cards', text:'Yapışkan kart yok. Kartların iyi yazılmış.' }),
    });
  }

  /* ---------- sıra geçmişi ---------- */

  function rankTab(){
    const hist = A().rankHistory();
    if(hist.length < 2) return empty('Sıra geçmişi için en az dört tam deneme gerekir.', addExam);

    const target = (S.profile && S.profile.targetRank) || R.PROGRAM.refRank;
    const series = hist.map(h => h.score);
    const labels = hist.map(h => U.fmtShort(h.date));
    const last = hist[hist.length-1];
    const first = hist[0];
    const moved = last.rank && first.rank ? first.rank - last.rank : 0;

    return K.Grid([
      K.Span(8, K.Stack([
        K.Card({
          title:'Tahmini sıra zaman içinde', hint:'estimate',
          sub:'Her noktada son 3 denemenin medyanı — tek fotoğraf değil film',
          badge:raw(UI.certainty('estimate')),
          body:html`
            ${raw(UI.lineChart([{ data:series }], { labels, height:210 }))}
            ${K.Cols(3, [
              K.Stat({ label:'İlk tahmin', value:U.fmtNum(first.rank), note:U.fmtShort(first.date) }),
              K.Stat({ label:'Son tahmin', value:U.fmtNum(last.rank), note:U.fmtShort(last.date),
                tone:last.rank <= target ? 'ok' : null }),
              K.Stat({ label:'Değişim', value:(moved > 0 ? '−' : '+')+U.fmtNum(Math.abs(moved)),
                note:moved > 0 ? 'sıra iyileşti' : 'sıra geriledi',
                tone:moved > 0 ? 'ok' : moved < 0 ? 'warn' : null }),
            ])}` }),

        K.Card({ title:'Bant tablosu', sub:'Her denemeden sonraki iyimser–kötümser aralık',
          body:K.Table({ tight:true,
            headers:['Tarih', { label:'Puan', num:true }, { label:'İyimser sıra', num:true },
              { label:'Kötümser sıra', num:true }],
            rows:hist.slice().reverse().map(h => [
              U.fmtShort(h.date),
              html`<span class="num">${U.fmtNet(h.score)}</span>`,
              html`<span class="num">${U.fmtNum(h.rankBest)}</span>`,
              html`<span class="num dim">${U.fmtNum(h.rankWorst)}</span>`,
            ]) }) }),
      ])),
      K.Span(4, K.Stack([
        K.Notice({ tone:'warn', title:'Bu bir ÖSYM hesabı değildir.',
          body:'Puan standart sapmaya göre normalize edilir ve aday dağılımı her yıl değişir. '
             + 'Buradaki aralık son yılların sonuçlarından çıkarılmış koçluk bandıdır.' }),
        raw(UI.rail(['rank', 'tiers', 'certainty'])),
      ])),
    ]);
  }

  /* ---------- hız ve isabet ---------- */

  function speedTab(){
    const sp = A().speedAccuracy('TYT');
    const w = A().warmup();

    return K.Grid([
      K.Span(7, K.Stack([
        sp.ok
          ? K.Card({ title:'Hız–isabet dengesi', sub:'Soru başına saniye ve doğruluk',
              body:html`
                ${K.Table({ tight:true, headers:['Test', { label:'sn/soru', num:true },
                  { label:'Doğruluk', num:true }, 'Profil'],
                  rows:sp.rows.map(r => [
                    r.test,
                    html`<span class="num">${r.secPerQ}</span>`,
                    html`<span class="${r.accuracy >= 70 ? 'num' : 'num is-down'}">%${r.accuracy}</span>`,
                    K.Badge({ label:r.profile === 'ideal' ? 'dengede'
                        : r.profile === 'fast-wrong' ? 'hızlı–isabetsiz'
                        : r.profile === 'slow-right' ? 'doğru–yavaş' : 'karışık',
                      tone:r.profile === 'ideal' ? 'ok' : r.profile === 'mixed' ? 'muted' : 'warn' }),
                  ]) })}
                <div class="stack-xs mt-12">${map(sp.rows.filter(r => r.profile !== 'ideal'), r => html`
                  <div class="small muted"><b>${r.test}:</b> ${r.note}</div>`)}</div>` })
          : empty(sp.why, addExam),

        K.Card({ title:'Isınma', hint:'quiz', sub:'İlk 20 dakika ile kalanı arasındaki fark',
          body:w.ok
            ? html`${K.Cols(3, [
                K.Stat({ label:'İlk 20 dk', value:'%'+w.early }),
                K.Stat({ label:'Sonrası', value:'%'+w.late }),
                K.Stat({ label:'Fark', value:(w.diff > 0 ? '+' : '')+w.diff, tone:w.diff >= 15 ? 'warn' : 'ok' }),
              ])}
              <div class="mt-12">${K.Notice({ tone:w.diff >= 15 ? 'warn' : 'ok', body:w.note })}</div>`
            : K.Empty({ icon:'clock', text:w.why,
                action:K.Button({ label:'Süreli deneme başlat', size:'sm', tone:'primary',
                  act:'go', data:{ 'data-route':'exams' } }) }) }),
      ])),
      K.Span(5, K.Stack([sessionsCard(), raw(UI.rail(['time-drift', 'net']))])),
    ]);
  }

  function sessionsCard(){
    const list = S.sessions.filter(s => s.status === 'done');
    if(!list.length){
      return K.Card({ title:'Süreli oturumlar',
        body:K.Empty({ icon:'clock', text:'Henüz süreli deneme oturumu yok. '
          + 'Deneme ekranından “Süreli oturum” ile başlatabilirsin.' }) });
    }
    return K.Card({
      title:'Süreli oturumlar', sub:list.length+' prova',
      body:html`<div class="stack-sm">${map(list.slice(0, 6), s => html`
        <div class="row between">
          <div class="minw0">
            <b class="small">${U.fmtShort(s.date)}</b>
            <div class="tiny dim">${U.fmtClock(s.totalSeconds)} · ${s.marks ? s.marks.length : 0} işaret</div>
          </div>
          ${K.Badge({ label:(s.overtime > 0 ? '+' : '')+Math.round(s.overtime/60)+' dk',
            tone:s.overtime > 300 ? 'danger' : s.overtime > 0 ? 'warn' : 'ok' })}
        </div>`)}</div>`,
    });
  }

  /* ---------- konu değeri ---------- */

  function valueTab(){
    const rows = A().topicValue(16);
    const totalGap = U.round(U.sum(rows.map(r => r.gap)), 1);
    return K.Grid([
      K.Span(8, K.Card({
        title:'Konu net katkısı', sub:'Bu konu kapanırsa yaklaşık kaç net gelir',
        badge:K.Badge({ label:'~'+U.fmtNet(totalGap)+' net açık', tone:'warn' }),
        body:html`
          ${K.Table({ tight:true,
            headers:['Konu', 'Ders', { label:'Potansiyel', num:true },
              { label:'Kazanılan', num:true }, { label:'Açık', num:true }],
            rows:rows.map(r => [
              html`<span class="small">${r.topicName}</span>`,
              html`<span class="tiny dim">${r.subjectName}</span>`,
              html`<span class="num dim">${U.fmtNet(r.potential)}</span>`,
              html`<span class="num">${U.fmtNet(r.earned)}</span>`,
              html`<b class="num ${r.gap > 1 ? 'is-down' : ''}">${U.fmtNet(r.gap)}</b>`,
            ]) })}
          <div class="mt-12">${K.Notice({ tone:'info',
            body:'Potansiyel, dersin soru sayısı ile konunun frekans payından çıkar. '
               + 'Kazanılan, kapanış durumu ve gerçek çözüm doğruluğundan gelir. '
               + 'Aradaki fark, o konuya ayrılacak zamanın karşılığıdır.' })}</div>`,
      })),
      K.Span(4, raw(UI.rail(['closure', 'risk', 'second-check']))),
    ]);
  }

  /* ---------- alışkanlık ---------- */

  function habitsTab(){
    const sleep = A().sleepImpact();
    const cap = A().capacityReality();
    const curve = A().forgettingCurve();
    const dist = A().distractionTrend();

    return K.Grid([
      K.Span(6, K.Stack([
        K.Card({ title:'Uyku ve net', hint:'sleep', sub:'Genel tavsiye değil, senin verin',
          body:sleep.ok
            ? html`${K.Cols(3, [
                K.Stat({ label:'Yeterli uyku', value:U.fmtNet(sleep.goodMedian), note:sleep.goodCount+' deneme' }),
                K.Stat({ label:'Yetersiz uyku', value:U.fmtNet(sleep.badMedian), note:sleep.badCount+' deneme' }),
                K.Stat({ label:'Fark', value:(sleep.diff > 0 ? '+' : '')+U.fmtNet(sleep.diff),
                  tone:sleep.diff >= 2 ? 'ok' : null }),
              ])}
              <div class="mt-12">${K.Notice({ tone:'info', body:sleep.note })}</div>`
            : K.Empty({ icon:'moon', text:sleep.why }) }),

        K.Card({ title:'Unutma eğrisi', hint:'srs', sub:'Hangi aralıkta gerçekten hatırlıyorsun',
          body:curve.ok
            ? html`
              ${K.Table({ tight:true, headers:['Aralık', { label:'Tekrar', num:true }, { label:'Hatırlama', num:true }],
                rows:curve.rows.map(r => [r.gap, r.total,
                  html`<span class="${r.rate >= 70 ? 'num' : 'num is-down'}">%${r.rate}</span>`]) })}
              <p class="tiny dim mt-10">${curve.note}</p>`
            : K.Empty({ icon:'cards', text:curve.note }) }),
      ])),

      K.Span(6, K.Stack([
        K.Card({ title:'Kapasite gerçeklik kontrolü', sub:'Söylenen saat ile çalışılan saat',
          badge:cap.ok ? K.Badge({ label:'%'+cap.ratio,
            tone:cap.status === 'gercekci' ? 'ok' : cap.status === 'iyimser' ? 'warn' : 'danger' }) : null,
          body:cap.ok
            ? html`${K.Cols(2, [
                K.Stat({ label:'Yazdığın', value:cap.claimed, unit:' sa' }),
                K.Stat({ label:'Çalıştığın', value:cap.actualAvg, unit:' sa',
                  tone:cap.ratio >= 85 ? 'ok' : 'warn' }),
              ])}
              <div class="mt-12">${K.Notice({ tone:cap.status === 'gercekci' ? 'ok' : 'warn', body:cap.note })}</div>
              ${when(cap.status !== 'gercekci', () => K.Button({ label:'Kapasiteyi düzelt', size:'sm',
                class:'mt-10', act:'setup-open' }))}`
            : K.Empty({ icon:'clock', text:cap.why }) }),

        K.Card({ title:'Dikkat dağılması', sub:'Blok sırasında kaç kez bölündün',
          body:dist.ok
            ? html`${raw(UI.barChart(dist.rows.map(r => ({ label:U.fmtShort(r.date).split(' ')[0], value:r.count })),
                { goodAt:0 }))}
              <div class="mt-12">${K.Notice({ tone:dist.avg >= 5 ? 'warn' : 'info', body:dist.note })}</div>`
            : K.Empty({ icon:'warn', text:dist.why }) }),
      ])),
    ]);
  }

  const BODIES = { compare:compareTab, errors:errorsTab, rank:rankTab,
    speed:speedTab, value:valueTab, habits:habitsTab };

  async function render(){
    const tab = S.ui.analyticsTab || 'compare';
    return String(K.Stack([
      K.Subtabs({ items:TABS, value:tab, act:'analytics-tab', aria:'Analiz bölümleri' }),
      (BODIES[tab] || compareTab)(),
    ]));
  }

  const handle = {
    async 'analytics-tab'(el){ S.ui.analyticsTab = el.dataset.tab; R.App.render(); },
  };

  const change = {
    async 'cmp-a'(el){ S.ui.compareA = el.value; R.App.render(); },
    async 'cmp-b'(el){ S.ui.compareB = el.value; R.App.render(); },
  };

  return {
    id:'analytics',
    title:'Analiz',
    subtitle(){
      const tab = TABS.find(t => t.id === (S.ui.analyticsTab || 'compare'));
      return (tab ? tab.label : 'Analiz') + ' · türetilmiş okumalar';
    },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/protocols.js ==== */
/* Telafi — durum tespiti, protokol baslatma ve takip.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.protocols = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  function isOpen(bag, key){ return !!((S.ui[bag] || {})[key]); }

  /* ---------- protokol karti ---------- */

  function stepList(def, active){
    const done = (active && active.steps) || {};
    if(!active) return html`<div class="steps mt-12">${map(def.steps, s => html`
      <div class="step"><div class="step__no"></div><div class="step__body"><p class="small">${s}</p></div></div>`)}</div>`;
    return html`<div class="steps mt-12">${map(def.steps, (s, i) => K.Checkbox({ label:s, checked:!!done[i],
      act:'proto-step', data:{ 'data-id':active.id, 'data-i':i } }))}</div>`;
  }

  function protocolCard(def, trigger, active){
    const steps = (active && active.steps) || {};
    const doneCount = active ? Object.keys(steps).filter(k => steps[k]).length : 0;
    const expanded = !!active || isOpen('protoOpen', def.id);

    return K.Card({
      class:active ? 'card--primary' : trigger ? 'card--accent' : null,
      title:def.title,
      sub:'Tetik: '+def.trigger+' · süre '+def.durationDays+' gün',
      badge:active ? K.Badge({ label:doneCount+'/'+def.steps.length+' adım', tone:'ok' })
        : trigger ? K.Badge({ label:'tetiklendi', tone:'warn' })
        : K.Badge({ label:'hazır', tone:'muted' }),
      body:html`
        ${when(trigger && !active, () => K.Notice({ tone:'warn', title:'Şu an geçerli:', body:trigger.detail }))}
        ${when(active, () => K.Notice({ tone:'ok', body:U.fmtDate(active.startedAt)+' tarihinde başladı · '
          + U.fmtDate(active.endsAt)+' tarihinde değerlendirilecek' }))}
        ${when(!expanded, () => K.Button({ label:def.steps.length+' adımı gör', size:'sm', class:'mt-10',
          act:'toggle-proto', data:{ 'data-key':def.id } }))}
        ${when(expanded, () => stepList(def, active))}`,
      foot:K.Row(active
        ? html`${K.Button({ label:'Protokolü kapat', size:'sm', act:'proto-finish', data:{ 'data-id':active.id } })}
               <span class="small dim">Kapatırken sonucu yaz — sonraki kapıda karşılaştırılır.</span>`
        : K.Button({ label:'Protokolü başlat', size:'sm', tone:trigger ? 'primary' : null,
            act:'proto-start', data:{ 'data-id':def.id } }),
        { wrap:true }),
    });
  }

  /* Uzun madde listeleri varsayilan olarak kapali. */
  function routineCard(title, items, key){
    return K.Collapsible({
      title, meta:items.length+' kural', act:'toggle-routine', data:{ 'data-key':key },
      open:isOpen('routineOpen', key),
      body:html`<ul class="bullets small muted mt-10">${map(items, m => html`<li>${m}</li>`)}</ul>`,
    });
  }

  function historyCard(){
    const past = S.protocols.filter(p => p.status !== 'active');
    if(!past.length) return null;
    return K.Card({ title:'Geçmiş protokoller', sub:past.length+' kapanmış kayıt',
      body:html`<div class="list">${map(past, p => html`
        <div class="listitem">
          <div class="grow"><b class="small">${p.title}</b>
            <div class="tiny dim">${U.fmtShort(p.startedAt)} – ${U.fmtShort(p.closedAt ? p.closedAt.slice(0, 10) : p.endsAt)}</div>
            ${when(p.outcome, () => html`<div class="tiny">${p.outcome}</div>`)}</div>
          ${K.Badge({ label:'kapandı', tone:'muted' })}
        </div>`)}</div>` });
  }

  /* ---------- ekran ---------- */

  function minimumDayCard(){
    const md = R.ROUTINES.minimumDay;
    const cells = [[md.minutes, 'dakika'], [md.paragraphs, 'paragraf'], [C.dueCards().length, 'due kart']];
    return K.Card({
      title:'Minimum gün standardı', hint:'minimum-day', sub:'Kötü günün alt sınırı',
      body:html`
        <div class="minday">${map(cells, c => html`
          <div><div class="stat__value num">${c[0]}</div><div class="tiny dim">${c[1]}</div></div>`)}</div>
        <p class="small muted mt-10">${md.note}</p>`,
    });
  }

  function sleepCard(){
    const avg = C.sleepAverage(7);
    const target = R.ROUTINES.sleep;
    return K.Card({
      title:'Uyku', hint:'sleep', sub:'Hedef '+target.targetLow+'–'+target.targetHigh+' saat',
      badge:avg != null ? K.Badge({ label:'7 gün ort. '+avg+' sa', tone:avg >= 7 ? 'ok' : 'warn' }) : null,
      body:K.Meter({ label:'Son 7 gün', value:avg == null ? 0 : U.pct(avg, S.profile.sleepTarget),
        text:avg == null ? 'kayıt yok' : avg+' sa', tone:avg != null && avg < 7 ? 'warn' : '' }),
    });
  }

  async function render(){
    const triggers = C.protocolTriggers();
    const active = M.activeProtocols();
    const triggerMap = {}; triggers.forEach(t => { triggerMap[t.id] = t; });
    const activeMap = {}; active.forEach(a => { activeMap[a.protoId] = a; });

    return String(K.Grid([
      K.Span(12, triggers.length
        ? K.Notice({ tone:'warn', title:triggers.length+' tetikleyici aktif.',
            body:triggers.map(t => t.detail).join(' · ')+' — aşağıdaki protokoller öneriliyor.' })
        : K.Notice({ tone:'ok', body:'Şu an telafi gerektiren bir sapma yok. '
            + 'Protokoller ihtiyaç doğduğunda otomatik olarak burada işaretlenir.' })),

      K.Span(8, K.Stack([
        K.SectionTitle('Telafi protokolleri',
          html`<span class="small dim">Kural motoru öneri verir, uygulama kararı sende</span>`),
        map(R.RECOVERY_PROTOCOLS, def => protocolCard(def, triggerMap[def.id], activeMap[def.id])),
        historyCard(),
      ])),

      K.Span(4, K.Stack([
        minimumDayCard(),
        sleepCard(),
        routineCard('Motivasyon ve dalgalanma', R.ROUTINES.motivation, 'motivation'),
        routineCard('Sınav kaygısı', R.ROUTINES.anxiety, 'anxiety'),
      ])),

      K.Span(12, raw(UI.rail(['protocol', 'trigger', 'minimum-day', 'sleep', 'anxiety']))),
    ]));
  }

  const handle = {
    async 'toggle-proto'(el){
      S.ui.protoOpen = S.ui.protoOpen || {};
      S.ui.protoOpen[el.dataset.key] = !S.ui.protoOpen[el.dataset.key];
      R.App.render();
    },
    async 'toggle-routine'(el){
      S.ui.routineOpen = S.ui.routineOpen || {};
      S.ui.routineOpen[el.dataset.key] = !S.ui.routineOpen[el.dataset.key];
      R.App.render();
    },
    async 'proto-start'(el){
      const rec = await M.startProtocol(el.dataset.id);
      UI.toast(rec.title+' başlatıldı');
      R.App.render();
    },
    async 'proto-step'(el){
      const rec = S.protocols.find(p => p.id === el.dataset.id);
      rec.steps = rec.steps || {};
      rec.steps[el.dataset.i] = el.checked;
      await M.saveProtocol(rec);
      R.App.render();
    },
    async 'proto-finish'(el){
      const rec = S.protocols.find(p => p.id === el.dataset.id);
      UI.sheet({
        title:'Protokolü kapat',
        subtitle:rec.title,
        body:String(K.Field({ label:'Sonuç', input:K.Textarea({ id:'proto-outcome', rows:3,
          placeholder:'Ne değişti? Plan tamamlama, net veya davranış olarak ölç.' }) })),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Kapat', tone:'primary', act:'proto-finish-save', data:{ 'data-id':rec.id } })}`),
      });
    },
    async 'proto-finish-save'(el){
      const rec = S.protocols.find(p => p.id === el.dataset.id);
      rec.status = 'closed';
      rec.closedAt = new Date().toISOString();
      rec.outcome = document.getElementById('proto-outcome').value.trim();
      await M.saveProtocol(rec);
      UI.closeSheet();
      UI.toast('Protokol kapatıldı');
      R.App.render();
    },
  };

  return {
    id:'protocols',
    title:'Telafi',
    subtitle(){
      const a = M.activeProtocols().length, t = C.protocolTriggers().length;
      return a ? a+' protokol aktif' : t ? t+' tetikleyici bekliyor' : 'Aktif telafi yok';
    },
    actions(){ return ''; },
    render, handle,
  };
})();

/* ==== js/screens/guide.js ==== */
/* Rehber — protokoller, kontrol listeleri, resmî takvim ve ayarlar.

   Yazim bicimi: STIL.md. Metin h`` icinde otomatik kacirilir; yapisal
   parcalar C.* bilesenlerinden gelir. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.guide = (function(){

  const TABS = [
    { id:'analysis',  label:'Analiz protokolü' },
    { id:'checklist', label:'Kontrol listeleri' },
    { id:'calendar',  label:'Resmî takvim' },
    { id:'istisna',   label:'Takvim istisnaları' },
    { id:'examweek',  label:'Sınav haftası' },
    { id:'settings',  label:'Ayarlar' },
  ];

  /* ---------- analiz protokolu ---------- */

  function Steps(list){
    return html`<div class="steps">${map(list, p => html`
      <div class="step">
        <div class="step__no"></div>
        <div class="step__body">
          <b>${p.title}${when(p.time !== '—', () => html` <span class="tiny dim">${p.time}</span>`)}</b>
          <p>${p.detail}</p>
        </div>
      </div>`)}</div>`;
  }

  function ErrorTagTable(){
    const rows = Object.keys(R.ERROR_TAGS).map(k => {
      const t = R.ERROR_TAGS[k];
      return [
        html`<span class="row-sm"><span class="tagdot" style="background:${t.color}"></span><b>${k}</b></span>`,
        t.name,
        html`<span class="small muted">${t.recipe}</span>`,
      ];
    });
    return K.Table({ headers:['Kod', 'Anlam', 'Varsayılan reçete'], rows });
  }

  function analysisTab(){
    return K.Grid([
      K.Span(7, K.Stack([
        K.Card({ title:'Deneme analizi protokolü', sub:'Toplam 60–80 dakika · en geç 24 saat içinde',
          body:Steps(R.ANALYSIS_PROTOCOL) }),
        K.Card({ title:'Hata etiketleri ve reçeteler', sub:'Her yanlış bir etiketle kapanır',
          body:ErrorTagTable() }),
      ])),
      K.Span(5, K.Stack([
        K.Card({ title:'Yanlış defteri tasarımı',
          body:K.Table({ tight:true, headers:['Alan', 'Yazılacak bilgi'],
            rows:R.NOTEBOOK_FIELDS.map(f => [html`<b class="small">${f[0]}</b>`, html`<span class="small muted">${f[1]}</span>`]) }) }),
        K.Card({ title:'Aralıklı tekrar', sub:'Kendini sınama ve dağıtılmış çalışma',
          body:html`
            <div class="stack-xs">${map(R.SRS_PROTOCOL, p => html`
              <div class="row-top"><b class="small mw-66">${p.day}</b>
                <span class="small muted">${p.detail}</span></div>`)}</div>
            <p class="tiny dim mt-10">Kart geri çağırma gerektirmelidir: “Mitokondri nedir?” yerine
              “Oksijenli solunum basamaklarını yer ve ürünle eşleştir”.</p>` }),
        K.Card({ title:'Hesap verebilirlik',
          body:html`<ul class="bullets small muted">${map(R.ACCOUNTABILITY, a => html`<li>${a}</li>`)}</ul>` }),
      ])),
    ]);
  }

  /* ---------- kontrol listeleri ---------- */

  const RITUAL_KEY = { monday:'contract', saturday:'exam', sunday:'review' };

  function ChecklistCard(key){
    const list = R.CHECKLISTS[key];
    const rk = RITUAL_KEY[key] || 'monthly';
    const day = S.days[U.todayISO()];
    const state = (day && day.checklist) || {};
    const done = list.items.filter((_, i) => state[rk+'-'+i]).length;
    const full = done === list.items.length;

    return K.Card({
      title:list.label,
      sub:done+' / '+list.items.length+' tamam',
      badge:full ? K.Badge({ label:'tamam', tone:'ok' }) : null,
      body:html`
        ${K.Bar({ value:U.pct(done, list.items.length) })}
        <div class="checklist stack-xs mt-10">
          ${map(list.items, (it, i) => K.Checkbox({ label:it, checked:!!state[rk+'-'+i],
            act:'guide-check', data:{ 'data-key':rk+'-'+i } }))}
        </div>`,
    });
  }

  function checklistTab(){
    return K.Grid([
      K.Span(12, K.Notice({ tone:'info',
        body:'Kontrol listeleri bugünün kaydına işlenir; Bugün ekranındaki ritüel kartıyla aynı veriyi paylaşır.' })),
      map(Object.keys(R.CHECKLISTS), key => K.Span(6, ChecklistCard(key))),
    ]);
  }

  /* ---------- resmi takvim ---------- */

  function calendarTab(){
    const counters = [
      ['TYT (tahmin)', U.diffDays(U.todayISO(), R.PLAN.examTytISO), U.fmtDate(R.PLAN.examTytISO)],
      ['AYT (tahmin)', U.diffDays(U.todayISO(), R.PLAN.examAytISO), U.fmtDate(R.PLAN.examAytISO)],
      ['Program bitişi', U.diffDays(U.todayISO(), U.iso(M.weekEnd(R.PLAN.totalWeeks))), 'Hafta '+R.PLAN.totalWeeks+' sonu'],
    ];
    return K.Grid([
      K.Span(8, K.Card({
        title:'2027 kritik işlemler', sub:'Sıra / panik takvimi',
        badge:raw(UI.certainty('estimate')),
        body:html`<div class="list">${map(R.OFFICIAL_CALENDAR, r => html`
          <div class="listitem">
            <div class="mw-150"><b class="small">${r.when}</b>
              <div>${K.Badge({ label:r.status, tone:r.status === 'Tahmin' ? 'warn' : 'muted' })}</div></div>
            <span class="small muted grow">${r.what}</span>
          </div>`)}</div>`,
        foot:K.Notice({ tone:'warn', title:'Panik önleme kuralı:', body:R.CALENDAR_RULE }),
      })),
      K.Span(4, K.Stack([
        K.Card({ title:'Sayaçlar', sub:'Bugünden itibaren',
          body:K.Stack(map(counters, c => K.Stat({ label:c[0], value:U.fmtNum(c[1]), unit:' gün', note:c[2] })), 'sm') }),
        raw(UI.rail(['certainty', 'rank'])),
      ])),
    ]);
  }

  /* ---------- takvim istisnaları ----------
     Tatil, okul sınavı ya da yoğun gün: plan bu günleri görmezden gelmez,
     haftanın yükünü otomatik düşürür. */

  function exceptionRow(x){
    const kind = M.CALENDAR_KINDS[x.kind] || M.CALENDAR_KINDS.tatil;
    const days = U.diffDays(x.from, x.to || x.from) + 1;
    return html`
      <div class="listitem">
        <div class="grow">
          <div class="row-sm wrap"><b class="small">${kind.label}</b>
            ${K.Badge({ label:'yük %' + Math.round(x.load * 100), tone:kind.tone })}</div>
          <div class="tiny dim">${U.fmtRange(x.from, x.to || x.from)} · ${U.plural(days, 'gün', 'gün')}${x.note ? ' · ' + x.note : ''}</div>
        </div>
        ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'kaldır',
          act:'cal-del', data:{ 'data-id':x.id } })}
      </div>`;
  }

  function istisnaTab(){
    const list = S.calendar.slice();
    const kinds = Object.keys(M.CALENDAR_KINDS).map(k => ({ value:k, label:M.CALENDAR_KINDS[k].label }));
    const cur = M.currentWeek();
    const weekRows = [];
    for(let n = cur; n < Math.min(R.PLAN.totalWeeks, cur + 8); n++){
      const load = M.weekLoad(n);
      if(load !== 1) weekRows.push({ n, load, from:U.iso(M.weekStart(n)), to:U.iso(M.weekEnd(n)) });
    }

    return K.Grid([
      K.Span(7, K.Stack([
        K.Card({ title:'İstisna ekle', sub:'Tatil, okul sınavı ya da yoğun gün',
          body:html`
            ${K.Cols(3, [
              K.Field({ label:'Tür', input:K.Select({ id:'cal-kind', options:kinds, value:'tatil' }) }),
              K.Field({ label:'Başlangıç', input:K.Input({ id:'cal-from', type:'date', value:U.todayISO() }) }),
              K.Field({ label:'Bitiş', hint:'tek günse boş bırak', input:K.Input({ id:'cal-to', type:'date' }) }),
            ])}
            ${K.Field({ label:'Not', input:K.Input({ id:'cal-note', placeholder:'ör. dönem sonu sınavları' }) })}
            ${K.Button({ label:'Ekle', icon:'plus', tone:'primary', class:'mt-12', act:'cal-add' })}` }),

        K.Card({ title:'Kayıtlı istisnalar', sub:U.plural(list.length, 'kayıt', 'kayıt'),
          body:list.length
            ? html`<div class="list">${map(list, exceptionRow)}</div>`
            : K.Empty({ icon:'week', text:'İstisna yok. Tatil ya da okul sınavı eklersen plan o haftaların yükünü kendiliğinden düşürür.' }) }),
      ])),

      K.Span(5, K.Stack([
        K.Card({ title:'Etkilenen haftalar', sub:'Önümüzdeki 8 hafta',
          body:weekRows.length
            ? K.Table({ tight:true, headers:['Hafta', 'Tarih', { label:'Yük', num:true }],
                rows:weekRows.map(r => ['H' + r.n, U.fmtRange(r.from, r.to),
                  html`<span class="${r.load < 1 ? 'num is-down' : 'num is-up'}">%${Math.round(r.load * 100)}</span>`]) })
            : K.Empty({ icon:'check', text:'Önümüzdeki sekiz hafta tam yükte.' }) }),
        K.Notice({ tone:'info', body:'Yük çarpanı haftalık soru hedefini doğrudan etkiler. '
          + 'Plan yeniden hesaplandığında bu istisnalar da hesaba katılır.' }),
        K.Button({ label:'Planı yeniden hesapla', icon:'refresh', act:'auto-replan' }),
      ])),
    ]);
  }

  /* ---------- sinav haftasi ---------- */

  const TAPER = [
    ['Pazartesi','Kısa TYT'], ['Salı','Kısa AYT'], ['Çarşamba','Kart turu, tam deneme yok'],
    ['Perşembe','Kolay-orta güven setleri'], ['Cuma','Evrak, rota provası, erken uyku'],
    ['Cumartesi','TYT oturumu'], ['Pazar','AYT oturumu'],
  ];

  function examWeekTab(){
    return K.Grid([
      K.Span(7, K.Card({ title:'Sınav haftası ve sınav günü', sub:'Son hafta · yeni konu yok',
        body:html`<ul class="bullets small">${map(R.EXAM_WEEK_OPS, o => html`<li>${o}</li>`)}</ul>` })),
      K.Span(5, K.Stack([

        K.Card({ title:'Kaygı azaltma',

      ])),
    ]);

  const THEMES = [{ value:'system', label:'Sistem' }, { value:'light', label:'Açık' }, { value:'dark', label:'Koyu' }];

    return K.Card({
      title:'Profil', sub:'Yalnız bu cihazda tutulur; koça gönderilmez',
      body:html`
        ${K.Cols(2, [f('Ad', 'st-name', { value:p.name }), f('Şehir', 'st-city', { value:p.city })])}
        ${K.Cols(2, [
          f('Haftalık kapasite (saat)', 'st-cap', { type:'number', step:0.5, value:p.capacityHoursPerWeek, numeric:true }),

          f('Hedef başarı sırası', 'st-rank', { type:'number', value:p.targetRank, numeric:true }),
        ])}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-profile', class:'mt-12' })}`,
    });

  function calendarCard(){
    return K.Card({
      title:'Takvim', sub:'Program başlangıcı ve sınav tarihi',
      body:html`
        ${K.Cols(2, [
          K.Stat({ label:'Başlangıç', value:U.fmtShort(R.PLAN.startISO), note:U.fmtDate(R.PLAN.startISO) }),
          K.Stat({ label:'Süre', value:R.PLAN.totalWeeks, unit:' hafta',
            note:R.PLAN.compressed ? 'sıkıştırılmış plan' : 'tam program' }),
        ])}
        ${K.Button({ label:'Takvimi değiştir', act:'setup-open', icon:'week', class:'mt-12' })}`,
    });

  function dataCard(){
    const counts = [
      ['Deneme', S.exams.length], ['Hata kaydı', S.errors.length],
      ['Kart', S.cards.length], ['Kayıtlı gün', Object.keys(S.days).length],
    ];
    const age = M.backupAgeDays();
    const due = M.backupDue();

    const store = R.Store.mode === 'cloud' ? 'Hesabına bağlı (cihazlar arası) + yerel kopya' : 'Bu tarayıcıda yerel';

    return K.Card({
      title:'Veri', sub:store,
      badge:age === null ? K.Badge({ label:'hiç yedek alınmadı', tone:'warn' })

      body:html`
        ${K.Cols(4, map(counts, c => K.Stat({ label:c[0], value:U.fmtNum(c[1]) })))}
        ${when(due, () => html`<div class="mt-12">${K.Notice({ tone:'warn',
          body:'Son yedekten bu yana '+(age === null ? 'hiç yedek alınmadı' : age+' gün geçti')
             + '. Tarayıcı verisi silinirse çalışma geçmişin kaybolur — şimdi bir yedek al.' })}</div>`)}

        <p class="tiny dim mt-10">Uygulama çevrimdışı çalışır: her kayıt önce cihaza yazılır,
          bağlantı varsa hesabına eşlenir. Yerel kullanım: ${sizeKb} KB (%${q.pct}) · şema sürümü ${R.SCHEMA_VERSION}.</p>`,

  /* Yedek dosyasinin yapisi — disariya acik tek bicim.
     Kullanici dosyayi acip ne oldugunu gorebilmeli; bu tablo o sozlesmedir. */
  const BACKUP_SHAPE = [
    ['__meta.app', '“rota-84285” — dosyanın bu uygulamaya ait olduğunu gösterir'],
    ['__meta.schemaVersion', 'Veri şeması sürümü; daha yeni bir yedek eski sürüme yüklenmez'],
    ['__meta.exportedAt', 'Yedeğin alındığı an (ISO 8601, UTC)'],
    ['__meta.mode', 'Yedek alınırken depolama kipi: “local” veya “cloud”'],
    ['data', 'Tüm kayıtlar tek düzlem sözlük: anahtar “koleksiyon/kimlik”, değer kaydın kendisi'],
    ['data["weeks/12"]', 'Örnek: 12. haftanın sözleşmesi — ana konular, hedefler, imza'],
    ['data["days/2026-09-15"]', 'Örnek: o günün blokları, uyku ve ritüel kaydı'],
    ['data["exams/e…"]', 'Deneme: testler, doğru/yanlış/boş, süre, analiz protokolü'],
    ['data["errors/r…"]', 'Yanlış defteri kaydı: etiket, kök neden, ilke, reçete'],
    ['data["cards/c…"]', 'Tekrar kartı: ön/arka yüz, aşama, sonraki tarih'],
  ];

  /* Telefona kurulum ve yedek hatırlatması. */
  function installCard(){
    const standalone = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches;
    const can = R.App.canInstall && R.App.canInstall();
    const age = M.backupAgeDays();
    return K.Card({
      title:'Telefona kur ve yedekle', sub:'Uygulama zaten çevrimdışı çalışır',
      body:html`
        ${standalone
          ? K.Notice({ tone:'ok', body:'Uygulama olarak açıldın. Ana ekrandan tek dokunuşla girebilirsin.' })
          : can
          ? html`${K.Notice({ tone:'info', body:'Bu tarayıcı kurulumu destekliyor. Kurulunca ana ekranda '
              + 'kendi simgesiyle durur ve tarayıcı çubuğu olmadan açılır.' })}
            ${K.Button({ label:'Telefona kur', icon:'download', tone:'primary', class:'mt-10', act:'pwa-install' })}`
          : K.Notice({ tone:'info', body:'Tarayıcının menüsünden “Ana ekrana ekle” diyerek '
              + 'uygulama gibi kurabilirsin. Veriler zaten cihazda; internet gerekmez.' })}

        <div class="mt-12">${K.Row([
          K.Stat({ label:'Son yedek', value:age == null ? 'yok' : age + ' gün önce',
            tone:age == null || age >= 7 ? 'warn' : 'ok' }),
          K.Button({ label:'Şimdi yedek al', icon:'download', size:'sm', act:'export-data' }),
        ], { between:true, wrap:true })}</div>
        <p class="tiny dim mt-10">Haftada bir yedek al. Tarayıcı verisi silinirse çalışma geçmişin
          geri gelmez; yedek dosyası düz JSON’dur, herhangi bir cihazda açılır.</p>`,
    });
  }

  function backupShapeCard(){
    return K.Collapsible({
      title:'Yedek dosyası neyi içerir?', meta:'JSON yapısı',
      act:'toggle-backup-shape', open:!!S.ui.backupShapeOpen,
      body:html`
        <p class="small muted mt-10">Yedek düz bir JSON dosyasıdır; herhangi bir editörle açılıp okunabilir.
          Veri kilitli bir biçimde tutulmaz — istediğin an dışarı alabilirsin.</p>
        ${K.Table({ tight:true, headers:['Alan', 'Ne tutar'],
          rows:BACKUP_SHAPE.map(r => [html`<code class="tiny">${r[0]}</code>`, html`<span class="small muted">${r[1]}</span>`]) })}`,
    });
  }

  const SHORTCUTS = [
    ['Boşluk', 'Tekrar ekranında kartı çevir'],
    ['1 / 2 / 3', 'Hatırlamadım / Zorlandım / Hatırladım'],
    ['/ veya Ctrl+K', 'Komut paletini aç, her yeri ara'],
    ['Esc', 'Açık pencereyi kapat'],
  ];

  const NOT_THIS = [
    'Video ders veya soru bankası değildir; hangi kaynağı kullanırsan kullan süreci yönetir.',
    'Kural motoru tıbbi veya psikolojik tanı üretmez.',
    'Tahmini sıra tek ve kesin sayı olarak sunulmaz; bant ve etiketle verilir.',
    'Net düşüşü bildirim olarak gönderilmez; ödül davranışa bağlanır.',
  ];

  function settingsTab(){
    return K.Grid([
      K.Span(6, K.Stack([
        profileCard(),
        calendarCard(),
        K.Card({ title:'Koç üslubu', sub:'Aynı veri herkese aynı dille söylenmez',
          body:html`
            ${K.Segmented({ act:'set-tone', block:true, primary:true, aria:'Koç üslubu',
              value:S.profile.coachTone || 'dengeli',
              items:Object.keys(R.COACH_TONES).map(k => ({ value:k, label:R.COACH_TONES[k].name })) })}
            <p class="tiny dim mt-8">${(R.COACH_TONES[S.profile.coachTone || 'dengeli']).note}.
              Üslup ev kurallarını geçersiz kılmaz: garanti, tıbbi tavsiye ve uykudan feda
              her üslupta yasaktır.</p>` }),

        K.Card({ title:'Görünüm', sub:'Tema ve renk bu cihazda saklanır',
          body:html`
            ${K.Segmented({ items:THEMES, value:S.profile.theme || 'system', act:'set-theme',
              block:true, primary:true, aria:'Tema' })}

            <span class="mono-label palettes__label">Renk paleti</span>
            <div class="palettes">${map(R.PALETTES, p => html`
              <button class="${(S.profile.palette || R.DEFAULT_PALETTE) === p.id ? 'palettebtn is-on' : 'palettebtn'}"
                data-act="set-palette" data-palette="${p.id}"
                aria-pressed="${(S.profile.palette || R.DEFAULT_PALETTE) === p.id ? 'true' : 'false'}">
                <span class="palettebtn__dots">
                  <span style="background:${p.swatch[0]}"></span>
                  <span style="background:${p.swatch[1]}"></span>
                </span>
                <b>${p.name}</b><span class="tiny dim">${p.note}</span>
              </button>`)}</div>

            <p class="tiny dim mt-10">Koyu mod saf siyah üzerine saf beyaz kullanmaz;
              her palet iki temada da WCAG AA kontrastına göre ayarlanmıştır.</p>` }),
      ])),
      K.Span(6, K.Stack([
        dataCard(),
        backupShapeCard(),
        installCard(),
        K.Card({ title:'Klavye kısayolları',
          body:K.Table({ tight:true, headers:['Tuş', 'İşlev'],
            rows:SHORTCUTS.map(s => [html`<b class="small">${s[0]}</b>`, s[1]]) }) }),
        K.Card({ title:'Bu uygulama ne değildir', sub:'Sınırları bilmek beklentiyi doğru kurar',
          body:html`<ul class="bullets small muted">${map(NOT_THIS, t => html`<li>${t}</li>`)}</ul>` }),
      ])),
    ]);
  }

  const TAB_BODY = {
    analysis:analysisTab, checklist:checklistTab, calendar:calendarTab,
    istisna:istisnaTab, examweek:examWeekTab, settings:settingsTab,
  };

  async function render(){
    const tab = S.ui.guideTab || 'analysis';
    const body = (TAB_BODY[tab] || analysisTab)();
    return String(K.Stack([
      K.Subtabs({ items:TABS, value:tab, act:'guide-tab', aria:'Rehber bölümleri' }),
      html`<div id="pane-guide">${body}</div>`,
    ]));
  }

  const handle = {
    async 'guide-tab'(el){ S.ui.guideTab = el.dataset.tab; R.App.render(); },
    async 'toggle-backup-shape'(){ S.ui.backupShapeOpen = !S.ui.backupShapeOpen; R.App.render(); },
    async 'guide-check'(el){
      const day = await M.ensureDay(U.today());
      day.checklist = day.checklist || {};
      day.checklist[el.dataset.key] = el.checked;
      await M.saveDay(day.date);
      if(!R.App.patch('#pane-guide', checklistTab())) R.App.render();
    },
    async 'cal-add'(){
      const kind = document.getElementById('cal-kind').value;
      const from = document.getElementById('cal-from').value;
      const to = document.getElementById('cal-to').value;
      const note = document.getElementById('cal-note').value.trim();
      if(!from){ UI.toast('Başlangıç tarihi gerekli'); return; }
