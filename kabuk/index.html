<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>LifeOS</title>
<link rel="icon" href="../brand/life/favicon.png">
<!-- piksel yazı tipi gömülü (ağsız); brand/ salt okunur kullanılır -->
<link rel="stylesheet" href="../brand/ortak/piksel-yazi.css">
<link rel="stylesheet" href="kabuk.css">
<link rel="stylesheet" href="bilesen.css">
</head>
<body>
<a class="atla" href="#sayfa">İçeriğe geç</a>
<main id="sayfa" class="cerceve" tabindex="-1"></main>
<div id="perde" class="perde" hidden></div>
<div id="halka" class="halka" role="menu" aria-label="Yerler" hidden></div>
<div id="komut" class="komut" role="dialog" aria-modal="true" aria-label="Ara" hidden>
  <div class="komut__giris">
    <input type="text" role="combobox" aria-expanded="false" aria-controls="komut-liste" aria-autocomplete="list"
      aria-label="Bir yer, ayar ya da eylem ara" placeholder="Bir yer, ayar ya da eylem ara" autocomplete="off" spellcheck="false">
    <kbd>Esc</kbd>
  </div>
  <ul id="komut-liste" class="komut__liste" role="listbox" aria-label="Sonuçlar"></ul>
  <p id="komut-durum" class="gizli" aria-live="polite"></p>
</div>
<!-- motorlar: kural onlarda, kabuk çizer -->
<script src="../motor/yol.js"></script>
<script src="../motor/not.js"></script>
<script src="../motor/tekrar.js"></script>
<script src="../motor/kayit.js"></script>
<script src="../motor/plan.js"></script>
<script src="../motor/soru.js"></script>
<!-- ekranlar yalnız bu yapı taşlarından kurulur (A2) -->
<script src="bilesen.js"></script>
<script src="harita.js"></script>
<script src="ayar.js"></script>
<script src="depo.js"></script>
<script src="tasima.js"></script>
<script src="araclar.js"></script>
<script src="deneme.js"></script>
<script src="tanisma.js"></script>
<script src="onay.js"></script>
<script src="kabuk.js"></script>
</body>
</html>
