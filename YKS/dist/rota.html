      const j = JSON.parse(body);
      const e = j.error || j;
      return String(e.message || e.detail || e.type || '').slice(0, 240);
    }catch(e){ return body.slice(0, 240); }
  }

  /* ---------- yerlesik cagri ---------- */

  async function callBuiltin(req){
    if(!builtinReady()) throw fail('unavailable');
    const turns = [];
    if(req.system) turns.push({ role:'user', content:req.system });
    (req.messages || []).forEach(m => turns.push({ role:m.role, content:m.text }));
    const res = await sample(turns.length === 1 ? turns[0].content : turns, {
      modelTier:req.model === 'quick' ? 'quick' : 'default',
      signal:req.signal,
      onText:req.onText ? ev => req.onText({ text:ev.text, delta:'' }) : undefined,
    });
    const text = String((res && res.text) || '').trim();
    if(!text) throw fail('empty');
    return { text, finish:'' };
  }

  /* ---------- OpenAI uyumlu cagri ---------- */

  async function callOpenAI(req, provider){
    const key = req.key;
    if(!key) throw fail('no_key');
    const endpoint = req.endpoint || provider.endpoint;
    if(!endpoint) throw fail('no_endpoint');

    const messages = [];
    if(req.system) messages.push({ role:'system', content:req.system });
    (req.messages || []).forEach(m => messages.push({ role:m.role, content:m.text }));

    const headers = {
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + key,
    };
    /* OpenRouter kaynak basligi bekler; tarayicidan gonderilmesi serbesttir. */
    if(provider.id === 'openrouter'){
      headers['HTTP-Referer'] = location.origin || 'https://rota.local';
      headers['X-Title'] = 'Rota — YKS ofisi';
    }

    const stream = !!req.onText;
    const guard = withTimeout(req.signal, req.timeout);
    let response;
    try{
      response = await fetch(endpoint, {
        method:'POST',
        headers,
        signal:guard.signal,
        body:JSON.stringify({
          model:req.model,
          messages,
          max_tokens:req.maxTokens || DEFAULT_MAX_TOKENS,
          temperature:req.temperature == null ? 0.4 : req.temperature,
          stream,
        }),
      });
    }catch(e){
      guard.done();
      if(guard.timedOut()) throw fail('timeout');
      if(req.signal && req.signal.aborted) throw fail('cancelled');
      throw fail(networkCode(), e && e.message);
    }

    if(!response.ok){
      const detail = await errorMessage(response);
      const code = codeForStatus(response.status);
      guard.done();
      /* Saglayici bizim saydigimizdan daha siki davraniyor: pencereyi kapat. */
      if(code === 'rate_limited'){
        R.Quota.penalize({ provider:provider.id, model:req.model, keyId:req.keyId }, retryAfterSeconds(response));
      }
      throw fail(code, detail);
    }

    let text = '';
    let finish = '';
    try{
      const ctype = response.headers.get('content-type') || '';
      if(stream && ctype.indexOf('event-stream') >= 0){
        await readSSE(response, obj => {
          const ch = obj.choices && obj.choices[0];
          if(!ch) return;
          /* Bitis sebebi genelde SON karede, govdesi bos olarak gelir:
             delta kontrolunden ONCE okunmali, yoksa kesilme hic gorulmez. */
          if(ch.finish_reason) finish = String(ch.finish_reason);
          const delta = (ch.delta && ch.delta.content) || ch.text;
          if(!delta) return;
          text += delta;
          req.onText({ text, delta });
        });
      }else{
        /* Akis istendigi hâlde duz JSON dondu — ayni govdeden okunur. */
        const json = await response.json();
        const ch = json.choices && json.choices[0];
        if(ch && ch.finish_reason) finish = String(ch.finish_reason);
        text = String((ch && ch.message && ch.message.content) || (ch && ch.text) || '');
        if(req.onText && text) req.onText({ text, delta:text });
      }
    }catch(e){
      if(guard.timedOut()) { guard.done(); throw fail('timeout'); }
      if(req.signal && req.signal.aborted){ guard.done(); throw fail('cancelled'); }
      guard.done();
      throw fail('server', e && e.message);
    }
    guard.done();

    text = text.trim();
    if(!text) throw fail('empty');
    return { text, finish };
  }

  /* ---------- Gemini cagrisi ---------- */

  async function callGemini(req, provider){
    const key = req.key;
    if(!key) throw fail('no_key');
    const base = req.endpoint || provider.endpoint;
    const stream = !!req.onText;
    const path = base.replace(/\/$/, '') + '/' + encodeURIComponent(req.model) + ':'
      + (stream ? 'streamGenerateContent?alt=sse&key=' : 'generateContent?key=')
      + encodeURIComponent(key);

    const contents = (req.messages || []).map(m => ({
      role:m.role === 'assistant' ? 'model' : 'user',
      parts:[{ text:m.text }],
    }));

    const body = {
      contents,
      generationConfig:{
        maxOutputTokens:req.maxTokens || DEFAULT_MAX_TOKENS,
        temperature:req.temperature == null ? 0.4 : req.temperature,
      },
    };
    /* 2.5 ailesinde "dusunme" ayni butceden yer: acik birakilirsa model
       butceyi dusunerek harcar ve cevap YARIM ya da bos doner. Ofis
       ajanlari kisa konusur, dusunmeye ihtiyaclari yok — kapatilir.
       Alan yalniz destekleyen modele gonderilir; digerleri 400 verir. */
    if(/2\.5.*flash/i.test(String(req.model || ''))){
      body.generationConfig.thinkingConfig = { thinkingBudget:0 };
    }
    if(req.system) body.systemInstruction = { parts:[{ text:req.system }] };

    const guard = withTimeout(req.signal, req.timeout);
    let response;
    try{
      response = await fetch(path, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        signal:guard.signal,
        body:JSON.stringify(body),
      });
    }catch(e){
      guard.done();
      if(guard.timedOut()) throw fail('timeout');
      if(req.signal && req.signal.aborted) throw fail('cancelled');
      throw fail(networkCode(), e && e.message);
    }

    if(!response.ok){
      const detail = await errorMessage(response);
      const code = codeForStatus(response.status);
      guard.done();
      if(code === 'rate_limited'){
        R.Quota.penalize({ provider:provider.id, model:req.model, keyId:req.keyId }, retryAfterSeconds(response));
      }
      throw fail(code, detail);
    }

    function partsText(obj){
      const cand = obj.candidates && obj.candidates[0];
      const parts = cand && cand.content && cand.content.parts;
      /* Dusunme parcalari metin degildir; cevaba karistirilmaz. */
      return (parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    function finishOf(obj){
      const cand = obj.candidates && obj.candidates[0];
      return (cand && cand.finishReason) ? String(cand.finishReason) : '';
    }

    let text = '';
    let finish = '';
    try{
      const ctype = response.headers.get('content-type') || '';
      if(stream && ctype.indexOf('event-stream') >= 0){
        await readSSE(response, obj => {
          const f = finishOf(obj);
          if(f) finish = f;
          const delta = partsText(obj);
          if(!delta) return;
          text += delta;
          req.onText({ text, delta });
        });
      }else{
        const json = await response.json();
        const list = Array.isArray(json) ? json : [json];
        text = list.map(partsText).join('');
        list.forEach(o => { const f = finishOf(o); if(f) finish = f; });
        if(req.onText && text) req.onText({ text, delta:text });
      }
    }catch(e){
      if(guard.timedOut()){ guard.done(); throw fail('timeout'); }
      if(req.signal && req.signal.aborted){ guard.done(); throw fail('cancelled'); }
      guard.done();
      throw fail('server', e && e.message);
    }
    guard.done();

    text = text.trim();
    if(!text) throw fail('empty');
    return { text, finish };
  }

  /* ---------- kamu API ---------- */

  /* Tek cagri. cfg: { provider, model, endpoint } — anahtar depodan okunur.
     req: { system, messages:[{role,text}], maxTokens, temperature, signal, onText } */
  async function chat(cfg, req){
    const provider = R.PROVIDERS[cfg && cfg.provider];
    if(!provider) throw fail('no_provider');
    if(!cfg.model && provider.kind !== 'builtin') throw fail('no_model');

    /* Cevrimdisiyken hic deneme: kota harcanmaz, sebep dogru soylenir. */
    if(provider.kind !== 'builtin' && offline()) throw fail('offline');

    const started = Date.now();
    const baseMessages = (req && req.messages) || [];
    /* Yanit token sinirina carparsa devam istegiyle tamamlanir. Kapatmak
       icin continue:false, sayiyi degistirmek icin maxContinuations. */
    const limit = (req && req.continue === false) ? 0
      : (req && req.maxContinuations != null ? req.maxContinuations : MAX_CONTINUATIONS);

    let text = '';
    let finish = '';
    let rounds = 0;
    let waited = 0;
    let slot = null;
    let picked = null;

    for(let round = 0; round <= limit; round++){
      /* Cok anahtarli havuz: kotasi musait anahtar HER turda yeniden
         secilir — ilk anahtarin gunu devam isteginde dolmus olabilir. */
      picked = null;
      if(provider.needsKey){
        if(!getKeys(provider.id).length) throw fail('no_key');
        picked = pickKey(cfg);
        /* Devam turunda kota bittiyse elde saglam bir metin var: onunla yetin. */
        if(!picked){
          if(round > 0) break;
          throw Object.assign(new Error('gunluk kota doldu'), { code:'daily_quota' });
        }
      }
      const quotaCfg = picked ? Object.assign({}, cfg, { keyId:picked.index }) : cfg;

      /* Devam turunda yarim kalmis son kelime atilir ve model oradan
         surdurur. Kirpma YALNIZ bu turun tabanina uygulanir; elde duran
         metne dokunulmaz, cunku devam istegi duserse onu dondurecegiz. */
      const prefix = round === 0 ? '' : dropLastWord(text);
      const messages = round === 0 ? baseMessages : baseMessages.concat([
        { role:'assistant', text:prefix },
        { role:'user', text:continueAsk(prefix.slice(-120)) },
      ]);

      const payload = Object.assign({}, req, {
        messages,
        model:cfg.model,
        endpoint:cfg.endpoint,
        key:picked ? picked.key : null,
        keyId:picked ? picked.index : null,
        /* Akis kullaniciya kesintisiz gorunmeli: parca degil birikmis
           metin yayinlanir. */
        onText:(req && req.onText)
          ? ev => req.onText({ text:joinContinuation(prefix, ev.text), delta:ev.delta })
          : undefined,
      });

      /* Sira: kota yoneticisi izin verene kadar bekle. Boylece dakikalik
         sinir HIC asilmaz; gun dolduysa beklemek yerine acikca soylenir. */
      slot = await R.Quota.acquire(quotaCfg, { signal:req && req.signal, onWait:req && req.onWait });
      waited += slot.waited || 0;

      let out;
      try{
        if(provider.kind === 'builtin') out = await callBuiltin(payload);
        else if(provider.kind === 'gemini') out = await callGemini(payload, provider);
        else out = await callOpenAI(payload, provider);
      }catch(err){
        /* Istek hic gonderilemediyse gunluk hakki tuketmis sayma. */
        if(err && (err.code === 'cancelled' || err.code === 'sandboxed'
                || err.code === 'no_key' || err.code === 'offline')){
          R.Quota.release(quotaCfg);
        }
        if(err && err.code === 'cancelled') throw err;
        /* Devam istegi duserse ilk turun metni durur: hata gostermektense
           eksik cumleyi kirpip eldekini vermek daha iyidir. */
        if(round > 0) break;
        throw err;
      }

      rounds++;
      text = round === 0 ? out.text : joinContinuation(prefix, out.text);
      finish = out.finish;
      if(!truncated(finish)) break;
    }

    /* Devam haklari bittigi hâlde hâlâ kesikse yarim cumle atilir. */
    const cut = truncated(finish);
    if(cut) text = trimToSentence(text);
    text = text.trim();
    if(!text) throw fail('empty');

    return {
      text, provider:provider.id, model:cfg.model || 'yerleşik',
      keyIndex:picked ? picked.index : null,
      ms:Date.now() - started, waited,
      usedToday:slot && slot.usedToday, rpd:slot && slot.rpd,
      rounds, truncated:cut,
    };
  }

  /* Yedekli cagri: zincirdeki ilk calisani kullanir.
     Ucretsiz modeller sik sik sinira takilir; tek model yerine sira denenir.
     Iptal ve anahtar hatalarinda zincir kirilir — beklemek anlamsizdir. */
  async function complete(chain, req){
    const list = (chain || []).filter(c => c && c.provider);
    if(!list.length) throw fail('no_provider');
    let last = fail('no_provider');
    for(let i = 0; i < list.length; i++){
      try{
        const res = await chat(list[i], req);
        if(i > 0) res.fellBack = true;
        return res;
      }catch(err){
        last = err;
        const code = err && err.code;
        if(code === 'cancelled') throw err;
        if(code === 'daily_quota'){
          /* Gunluk hak modele ozeldir: ayni saglayicinin baska modeli de
             ayni havuzu paylasiyor olabilir, yine de denemeye deger. */
          continue;
        }
        if(!retryable(code)){
          /* Anahtar/adres/kum havuzu hatasi zincirin geri kalanini da
             vurabilir: farkli saglayici varsa dene, ayni saglayiciysa dur. */
          const next = list[i+1];
          if(!next || next.provider === list[i].provider) throw err;
        }
      }
    }
    throw last;
  }

  /* Baglanti sinamasi — ayar ekraninda "Bağlantıyı dene" icin.
     Gercek bir istek yapar; bu yuzden gunluk haktan bir tane harcar. */
  async function test(cfg){
    const started = Date.now();
    const res = await chat(cfg, {
      system:'Yalnızca istenen kelimeyi yaz, başka hiçbir şey yazma.',
      messages:[{ role:'user', text:'Tek kelimeyle yanıtla: hazır' }],
      maxTokens:16,
      temperature:0,
      timeout:30000,
      /* Sinama kasten dar butceli: kesilme beklenen sonuctur, devam
         istegiyle bosuna kota harcanmaz. */
      continue:false,
    });
    return { ok:true, text:res.text.slice(0, 60), ms:Date.now() - started, model:res.model };
  }

  /* Bir yapilandirmanin kullanilabilir olup olmadigi (cagri yapmadan). */
  function ready(cfg){
    const provider = R.PROVIDERS[cfg && cfg.provider];
    if(!provider) return false;
    if(provider.kind === 'builtin') return builtinReady();
    if(provider.needsKey && !getKeys(provider.id).length) return false;
    if(provider.editableEndpoint && !(cfg.endpoint || '').trim()) return false;
    return !!cfg.model;
  }

  return {
    initBuiltin, builtinReady,
    getKey, getKeys, setKey, addKey, removeKeyAt, clearKeys, maskKey, maskKeys, pickKey,
    chat, complete, test, ready,
    errorText, retryable, resumable, offline, onceOnline, inSandbox, KEY_STORE,
    truncated, trimToSentence, joinContinuation, dropLastWord, DEFAULT_MAX_TOKENS,
  };
})();

/* ==== js/core/journal.js ==== */
/* Ajan defteri — ajanlarin hatirladigi seyler.

   SORUN: bir ekip uyesini degerli yapan sey aylardir seni izliyor olmasidir
   ("sen pazartesileri hep atliyorsun"). Ama LLM'e "hatirla" demek, ona
   uydurma izni vermektir: model gecmiste olmayan bir sey soyler ve bunu
   kimse yakalayamaz.

   COZUM: hafiza LLM'in hatirladigi degil, VERININ DESTEKLEDIGI seydir.
   Iki yol vardir ve ikisi de kural motorundan gecer:

   1) BULUNAN gozlem (detect) — kural motoru gecmisi tarar ve oruntuyu
      kendisi bulur. Saklanmaz, her okumada yeniden hesaplanir; bu yuzden
      bayatlamaz ve dogrulugu tanim geregi kesindir.

   2) ONERILEN gozlem (record) — ajan yapisal bir olcut onerir
      ({olcut, karsilastirma, esik}), kural motoru bunu veri uzerinde
      calistirir. Dogrulanamayan gozlem deftere GIRMEZ. Deftere girmis
      gozlem de her okumada yeniden dogrulanir; artik dogru degilse duser.

   Serbest metin hicbir yolda hafizaya giremez. */

window.R = window.R || {};

R.Journal = (function(){
  const U = R.U, M = R.Model, C = R.Calc, S = R.S;

  const MAX_PER_AGENT = 12;

  /* ==================== dogrulanabilir olcutler ====================
     Bir gozlem ancak bu listedeki bir olcut uzerine kurulabilir.
     Liste kapalidir: ajan yeni olcut uyduramaz. */

  const METRICS = {
    planTamamlama:   { label:'plan tamamlama',   unit:'%',      agent:'rehber',
                       get:() => C.planCompletion(M.currentWeek()) },
    uykuOrtalamasi:  { label:'uyku ortalaması',  unit:' saat',  agent:'rehber',
                       get:() => C.sleepAverage(7) },
    enerjiOrtalamasi:{ label:'enerji ortalaması',unit:'/5',     agent:'rehber',
                       get:() => M.energyAverage(7) },
    davranisSerisi:  { label:'davranış serisi',  unit:' gün',   agent:'rehber',
                       get:() => C.behaviorStreak().streak },
    analizBorcu:     { label:'analiz borcu',     unit:' deneme',agent:'analist',
                       get:() => C.analysisDebt().length },
    tekrarBorcu:     { label:'tekrar borcu',     unit:'%',      agent:'analist',
                       get:() => C.cardDebt() },
    acikYanlis:      { label:'açık yanlış',      unit:' kayıt', agent:'analist',
                       get:() => C.openErrors().length },
    konuKapanisi:    { label:'konu kapanışı',    unit:'%',      agent:'analist',
                       get:() => C.overallClosure().pct },
    tytMedyan:       { label:'TYT medyanı',      unit:' net',   agent:'tyt',
                       get:() => C.medianTrend('TYT').last3 },
    tytKapanis:      { label:'TYT kapanışı',     unit:'%',      agent:'tyt',
                       get:() => C.examClosure('TYT').pct },
    aytMedyan:       { label:'AYT medyanı',      unit:' net',   agent:'ayt',
                       get:() => C.medianTrend('AYT').last3 },
    aytKapanis:      { label:'AYT kapanışı',     unit:'%',      agent:'ayt',
                       get:() => C.examClosure('AYT').pct },
  };

  const OPS = {
    lt:  { sign:'<',  test:(a, b) => a <  b },
    lte: { sign:'≤',  test:(a, b) => a <= b },
    gt:  { sign:'>',  test:(a, b) => a >  b },
    gte: { sign:'≥',  test:(a, b) => a >= b },
  };

  function metricList(){
    return Object.keys(METRICS).map(k => Object.assign({ key:k }, METRICS[k]));
  }

  /* Bir gozlemi veri uzerinde calistirir. */
  function verify(obs){
    if(!obs || !METRICS[obs.metric]) return { ok:false, why:'bilinmeyen ölçüt' };
    const op = OPS[obs.op];
    if(!op) return { ok:false, why:'bilinmeyen karşılaştırma' };
    const value = Number(obs.value);
    if(!Number.isFinite(value)) return { ok:false, why:'eşik sayı değil' };

    let actual;
    try{ actual = METRICS[obs.metric].get(); }
    catch(e){ return { ok:false, why:'ölçüt hesaplanamadı' }; }
    if(actual == null) return { ok:false, why:'bu ölçüt için henüz veri yok', actual:null };

    return { ok:op.test(actual, value), actual, metric:METRICS[obs.metric] };
  }

  /* Gozlemi okunur cumleye cevirir — metin kural motorundan uretilir,
     modelden gelmez. */
  function say(obs, actual){
    const m = METRICS[obs.metric];
    if(!m) return '';
    const op = OPS[obs.op];
    const val = a => (a == null ? '—' : U.fmtNet(a)) + (m.unit || '');
    return m.label + ' ' + op.sign + ' ' + val(obs.value)
      + (actual == null ? '' : ' (şu an ' + val(actual) + ')');
  }

  /* ==================== bulunan gozlemler ====================
     Kural motorunun tek bir anlik goruntude goremedigi oruntuler.
     Saklanmaz: her cagrida yeniden hesaplanir, bu yuzden bayatlamaz. */

  const TR_DAYS = ['Pazartesi', 'Salı', 'Çarşamba', 'Perşembe', 'Cuma', 'Cumartesi', 'Pazar'];

  /* Hangi gun daha cok blok atlaniyor? Tek haftadan degil, butun kayittan. */
  function weekdayMiss(){
    const stat = TR_DAYS.map(() => ({ done:0, total:0 }));
    Object.keys(S.days).forEach(iso => {
      const day = S.days[iso];
      if(!day || iso > U.todayISO()) return;
      const idx = U.weekdayIndex(iso);
      day.blocks.forEach(b => {
        if(b.slot === 'Dinlenme') return;
        stat[idx].total++;
        if(b.status === 'done') stat[idx].done++;
      });
    });
    const rows = stat.map((s, i) => ({ gun:TR_DAYS[i], ...s, pct:U.pct(s.done, s.total) }))
      .filter(r => r.total >= 3);
    if(rows.length < 3) return null;

    const worst = rows.slice().sort((a, b) => a.pct - b.pct)[0];
    const avg = U.pct(U.sum(rows.map(r => r.done)), U.sum(rows.map(r => r.total)));
    if(worst.pct >= avg - 15) return null;      // belirgin bir fark yoksa oruntu yok

    return {
      id:'weekday-miss', agent:'rehber', tone:'warn',
      text:worst.gun + ' günleri diğer günlerden belirgin olarak geride: '
        + 'bu günde blokların %' + worst.pct + '’i tamamlanmış, genel ortalama %' + avg + '.',
      evidence:{ gun:worst.gun, yuzde:worst.pct, ortalama:avg, blok:worst.total },
    };
  }

  /* Plan tamamlama kac haftadir hedefin altinda? */
  function planStreak(){
    const hist = C.completionHistory(8).filter(h => h.value != null);
    if(hist.length < 3) return null;
    let miss = 0;
    for(let i = hist.length - 1; i >= 0; i--){
      if(hist[i].value < 85) miss++; else break;
    }
    if(miss < 2) return null;
    return {
      id:'plan-streak', agent:'rehber', tone:miss >= 3 ? 'danger' : 'warn',
      text:miss + ' haftadır plan tamamlaması %85 hedefinin altında kalıyor '
        + '(son hafta %' + hist[hist.length - 1].value + ').',
      evidence:{ hafta:miss, sonDeger:hist[hist.length - 1].value },
    };
  }

  /* Ayni atlama nedeni haftalar boyu tekrar ediyor mu? */
  function repeatedSkip(){
    const cur = M.currentWeek();
    const totals = {};
    let weeks = 0;
    for(let n = Math.max(1, cur - 3); n <= cur; n++){
      const counts = C.skipReasonCounts(n);
      const keys = Object.keys(counts);
      if(!keys.length) continue;
      weeks++;
      keys.forEach(k => { totals[k] = (totals[k] || 0) + counts[k]; });
    }
    if(weeks < 2) return null;
    const top = Object.keys(totals).map(k => ({ neden:k, adet:totals[k] }))
      .sort((a, b) => b.adet - a.adet)[0];
    if(!top || top.adet < 3) return null;
    return {
      id:'repeated-skip', agent:'rehber', tone:'warn',
      text:'Son ' + weeks + ' haftada en sık atlama nedeni "' + top.neden + '" ('
        + top.adet + ' blok) — tek seferlik bir aksama değil, tekrar eden bir kalıp.',
      evidence:{ neden:top.neden, adet:top.adet, hafta:weeks },
    };
  }

  /* Uykunun deneme netine etkisi olculebiliyor mu? Belirgin degilse
     (|fark| < 2 net) gozlem uretilmez — zayif iliskiden cikarim yapilmaz. */
  function sleepLink(){
    const imp = R.Analytics.sleepImpact();
    if(!imp || !imp.ok || Math.abs(imp.diff) < 2) return null;
    return {
      id:'sleep-link', agent:'rehber', tone:imp.diff > 0 ? 'warn' : 'info',
      text:'Deneme öncesi yeterli uyunan günlerde medyanın '
        + U.fmtNet(Math.abs(imp.diff)) + ' net ' + (imp.diff > 0 ? 'yüksek' : 'düşük')
        + ' çıkıyor (' + imp.goodCount + ' yeterli, ' + imp.badCount + ' yetersiz uyku kaydı).',
      evidence:{ fark:imp.diff, yeterli:imp.goodCount, yetersiz:imp.badCount },
    };
  }

  /* Analiz borcu tekrar tekrar birikiyor mu? */
  function debtHabit(){
    const done = S.exams.filter(e => e.analysisCompletedAt);
    if(done.length < 4) return null;
    const late = done.filter(e => U.diffDays(e.date, e.analysisCompletedAt.slice(0, 10)) > 1);
    const pct = U.pct(late.length, done.length);
    if(pct < 50) return null;
    return {
      id:'debt-habit', agent:'analist', tone:'warn',
      text:'Analiz edilen denemelerin %' + pct + '’i 24 saatten geç çözümlenmiş ('
        + late.length + '/' + done.length + ') — borç birikmesi tek seferlik değil.',
      evidence:{ yuzde:pct, gec:late.length, toplam:done.length },
    };
  }

  /* Kapanan konular gercekten kapali kaliyor mu? */
  function reopenHabit(){
    let reopened = 0, closed = 0;
    R.SUBJECTS.forEach(s => s.topics.forEach(t => {
      const st = M.topicState(s.id, t.id);
      if(st.state === 'closed') closed++;
      if(st.state === 'reopened') reopened++;
    }));
    if(reopened < 2) return null;
    return {
      id:'reopen-habit', agent:'analist', tone:'warn',
      text:reopened + ' konu kapandıktan sonra yeniden açıldı; kapanış ölçütü '
        + 'erken uygulanıyor olabilir.',
      evidence:{ yenidenAcilan:reopened, kapali:closed },
    };
  }

  const DETECTORS = [weekdayMiss, planStreak, repeatedSkip, sleepLink, debtHabit, reopenHabit];

  /* Butun bulunan gozlemler. agentId verilirse yalniz o ajanin alanindakiler. */
  function detect(agentId){
    const out = [];
    DETECTORS.forEach(fn => {
      let obs = null;
      try{ obs = fn(); }catch(e){ obs = null; }
      if(obs) out.push(Object.assign({ kind:'bulunan' }, obs));
    });
    return agentId ? out.filter(o => o.agent === agentId) : out;
  }

  /* ==================== onerilen gozlemler ====================
     Ajan yapisal bir olcut onerir; kural motoru dogrular ve saklar. */

  function all(){ return S.journal || {}; }

  async function record(agentId, obs){
    if(!R.AGENT_BY_ID[agentId]) return { ok:false, why:'bilinmeyen ajan' };
    const check = verify(obs);
    if(!check.ok){
      return { ok:false, why:check.why || 'veri bu gözlemi desteklemiyor', actual:check.actual };
    }
    const entry = {
      id:U.uid('j'),
      agent:agentId,
      metric:obs.metric, op:obs.op, value:Number(obs.value),
      note:String(obs.note || '').slice(0, 160),
      at:new Date().toISOString(),
      seenAt:new Date().toISOString(),
      actual:check.actual,
    };
    S.journal = S.journal || {};
    const list = (S.journal[agentId] || []).filter(e =>
      !(e.metric === entry.metric && e.op === entry.op && e.value === entry.value));
    list.unshift(entry);
    S.journal[agentId] = list.slice(0, MAX_PER_AGENT);
    await R.Store.set('journal/' + agentId, { entries:S.journal[agentId] });
    return { ok:true, entry };
  }

  /* Saklanan gozlemler her okumada YENIDEN dogrulanir: veri degistiyse
     gozlem duser. Boylece defter bayat bilgi tasimaz. */
  function forAgent(agentId){
    const stored = (all()[agentId] || []).map(e => {
      const check = verify(e);
      return Object.assign({}, e, { kind:'önerilen', stillTrue:check.ok, actual:check.actual });
    });
    return stored.filter(e => e.stillTrue);
  }

  async function prune(agentId){
    const keep = forAgent(agentId).map(e => {
      const copy = Object.assign({}, e);
      delete copy.kind; delete copy.stillTrue;
      return copy;
    });
    S.journal = S.journal || {};
    S.journal[agentId] = keep;
    await R.Store.set('journal/' + agentId, { entries:keep });
    return keep;
  }

  async function clear(agentId){
    S.journal = S.journal || {};
    delete S.journal[agentId];
    await R.Store.remove('journal/' + agentId);
  }

  /* Bir ajanin defteri: bulunan + dogrulanmis onerilen gozlemler. */
  function forBrief(agentId){
    const found = detect(agentId).map(o => ({ kind:'bulunan', tone:o.tone, text:o.text }));
    const proposed = forAgent(agentId).map(e => ({
      kind:'önerilen', tone:'info', text:say(e, e.actual) + (e.note ? ' — ' + e.note : ''),
    }));
    return found.concat(proposed);
  }

  /* ==================== guven skoru ====================
     Bir ajanin alanina dusen kararlarin kaci uygulandi?
     Karar kural motorundan gelir (Calc.nextAction) ve is anahtari
     R.ACTION_OWNER ile bir ajana baglanir. */

  function ownerOf(decision){
    if(!decision) return null;
    if(decision.owner) return decision.owner;
    return R.ACTION_OWNER[decision.key] || null;
  }

  function trust(agentId){
    const rows = (S.officeMeetings || [])
      .map(m => m.decision)
      .filter(d => d && ownerOf(d) === agentId);
    const closed = rows.filter(d => d.state !== 'open');
    const done = rows.filter(d => d.state === 'done');
    return {
      toplam:rows.length,
      kapanan:closed.length,
      uygulanan:done.length,
      yuzde:closed.length ? U.pct(done.length, closed.length) : null,
    };
  }

  function trustAll(){
    const out = {};
    R.AGENT_IDS.forEach(id => { out[id] = trust(id); });
    return out;
  }

  /* ==================== yukleme ==================== */

  async function load(){
    const docs = await R.Store.list('journal');
    S.journal = {};
    (docs || []).forEach(d => {
      if(!R.AGENT_BY_ID[d.id]) return;
      S.journal[d.id] = Array.isArray(d.entries) ? d.entries.slice(0, MAX_PER_AGENT) : [];
    });
    return S.journal;
  }

  return {
    METRICS, OPS, metricList,
    verify, say, record, forAgent, forBrief, prune, clear, all,
    detect, DETECTORS,
    trust, trustAll, ownerOf,
    load, MAX_PER_AGENT,
  };
})();

/* ==== js/core/office.js ==== */
/* Ofis motoru — bes ajanin veri okumasi, konusmasi ve toplanti yapmasi.

   MIMARI ILKESI (koc katmaniyla ayni): kural motoru otoritedir.
   Her ajanin masasinda kural motorunun hesapladigi bir BRIFING durur;
   ajan yalnizca o brifingi yorumlar. Model yoksa brifing dogrudan
   cumleye cevrilir ve ofis cevrimdisi calismaya devam eder.

   Katmanlar:
     brief(agentId)     kural motoru → { headline, metrics, findings, suggestion, data }
     ask(agentId, soru) brifing + soru → ajanin yaniti
     meet(...)          gundem → sirayla konusma → Patron'un tek karari

   Yetki: her ajan yalnizca kendi brifingini gorur; ham veriye erisemez.
   Gizlilik: LLM'e giden her nesne R.Tools.sanitize'dan gecer. */

window.R = window.R || {};

R.Office = (function(){
  const U = R.U, M = R.Model, C = R.Calc, S = R.S;

  const CHAT_MAX = 30;        // ajan basina saklanan mesaj
  const MEETING_MAX = 20;     // saklanan toplanti kaydi
  const TURN_CONTEXT = 4;     // toplantida bir uzmana gosterilen onceki konusma

  /* Token butceleri — tek yerde, cunku hepsi ayni hataya acikti.
     Turkce ekli bir dildir ve genis alfabesiyle ayni cumleyi Ingilizceden
     belirgin daha cok token'a yazar: dort cumlelik bir uzman yaniti
     rahatlikla 250 token eder. Eski butceler (200-420) bu yuzden
     cumlenin ortasinda bitiyordu. Asagidaki degerler beklenen uzunlugun
     yaklasik uc kati: model erken bitirirse fazlasi harcanmaz, uzun
     yazarsa da kesilmez. */
  const BUDGET = {
    turn:900,       // toplantida bir uzmanin turu (en fazla 4-5 cumle)
    opening:700,    // Patron toplantiyi acar (3 cumle)
    closing:1000,   // Patron kapatir: celiski + oylama + gerekce (4 cumle)
    cross:500,      // Patron tek cumlelik capraz soru sorar
    answer:800,     // capraz soruya yanit
    daily:600,      // gunluk brifing (2 cumle)
    cards:1600,     // nottan kart uretimi — JSON, uzun
  };

  /* ==================== ayarlar ==================== */

  function defaultSettings(){
    return {
      provider:'builtin',
      model:'default',
      endpoint:'',
      fallback:true,          // ilk model dusunce sirayi dene
      autoBriefing:true,      // sabah gunun brifingini kendiliginden uret
      perAgent:{},            // agentId -> { provider, model }
      updatedAt:null,
      promptVersion:R.OFFICE_PROMPTS.version,
    };
  }

  function settings(){
    if(!S.office) S.office = defaultSettings();
    return S.office;
  }

  async function saveSettings(patch){
    const next = Object.assign(defaultSettings(), settings(), patch || {});
    next.updatedAt = new Date().toISOString();
    S.office = next;
    await R.Store.set('office/settings', next);
    return next;
  }

  /* Bir ajanin calisacagi yapilandirma: kendi secimi yoksa ofis varsayilani. */
  function agentConfig(agentId){
    const st = settings();
    const own = st.perAgent && st.perAgent[agentId];
    const provider = (own && own.provider) || st.provider;
    const model = (own && own.model) || (provider === st.provider ? st.model : firstModel(provider));
    return {
      provider,
      model,
      endpoint:(own && own.endpoint) || (provider === st.provider ? st.endpoint : ''),
    };
  }

  function firstModel(providerId){
    const p = R.PROVIDERS[providerId];
    return (p && p.models && p.models.length) ? p.models[0].id : '';
  }

  /* Yedek zinciri: ajanin yapilandirmasi → ofis varsayilani → ayni saglayicinin
     diger ucretsiz modelleri → yerlesik yetenek. Ucretsiz modeller sik sinira
     takildigi icin tek modele bagli kalinmaz. */
  function chainFor(agentId){
    const st = settings();
    const chain = [];
    const seen = {};
    const push = cfg => {
      if(!cfg || !cfg.provider || !R.LLM.ready(cfg)) return;
      const key = cfg.provider + '|' + cfg.model;
      if(seen[key]) return;
      seen[key] = true;
      chain.push(cfg);
    };

    push(agentConfig(agentId));
    push({ provider:st.provider, model:st.model, endpoint:st.endpoint });

    if(st.fallback){
      const main = agentConfig(agentId);
      const p = R.PROVIDERS[main.provider];
      if(p && p.models) p.models.forEach(m => push({ provider:p.id, model:m.id, endpoint:main.endpoint }));
      push({ provider:'builtin', model:'default' });
    }
    return chain;
  }

  function ready(agentId){ return chainFor(agentId || 'patron').length > 0; }

  /* 'llm' — model bagli; 'kural' — yalniz kural motoru. */
  function mode(){ return ready('patron') ? 'llm' : 'kural'; }

  function providerLabel(){
    const cfg = agentConfig('patron');
    const p = R.PROVIDERS[cfg.provider];
    if(!p) return 'tanımsız';
    if(p.kind === 'builtin') return p.label;
    const m = (p.models || []).find(x => x.id === cfg.model);
    return p.label + ' · ' + ((m && m.label) || cfg.model);
  }

  /* ==================== kural motoru brifingleri ==================== */

  function tone(pct, good, warn){
    if(pct == null) return 'muted';
    return pct >= good ? 'ok' : pct >= warn ? 'warn' : 'danger';
  }
  function num(x, d){ return x == null ? null : U.round(x, d == null ? 1 : d); }

  /* Bir brans (TYT/AYT) icin ortak brifing govdesi. */
  function branchBrief(agent, family){
    const closure = C.examClosure(family);
    const trend = C.medianTrend(family);
    const base = C.examBase(family);

    const subjects = R.SUBJECTS.filter(s => s.exam === family).map(s => {
      const c = C.subjectClosure(s.id);
      return { id:s.id, ders:s.name, kapanan:c.closed, baslanan:c.started, toplam:c.total,
        yuzde:c.pct, hedefBant:s.targetBand, soruSayisi:s.questions };
    }).sort((a, b) => a.yuzde - b.yuzde);

    const bands = R.TEST_BANDS.filter(b => b.exam === family).map(b => {
      const med = C.testMedian(b.testKey, b.exam);
      return { test:b.test, hedefAlt:b.low, hedefUst:b.high, medyan:num(med),
        fark:med == null ? null : num(med - b.low) };
    });

    const risks = C.riskRanking(40)
      .filter(r => { const s = R.SUBJECTS.find(x => x.id === r.subjectId); return s && s.exam === family; })
      .slice(0, 3)
      .map(r => ({ ders:r.subjectName, konu:r.topicName, risk:r.score, bant:r.label,
        durum:r.state, acikYanlis:r.errors }));

    const exams = S.exams.filter(e => e.family === family && e.kind === 'full').length;

    /* ---- bulgular: siraya sokulmus, cumle hâlinde ---- */
    const findings = [];
    const weakest = subjects[0];
    const gapBand = bands.filter(b => b.fark != null).sort((a, b) => a.fark - b.fark)[0];

    if(trend.last3 == null){
      findings.push({ tone:'info',
        text:family + ' medyanı için yeterli tam deneme yok (' + trend.count + '/3); '
          + 'şimdilik konu kapanışı tek ölçüt.' });
    }else if(trend.delta != null && trend.delta <= -1.5){
      findings.push({ tone:'danger',
        text:family + ' medyanı ' + U.fmtNet(trend.last3) + ' nete indi, önceki üçlüye göre '
          + U.fmtNet(Math.abs(trend.delta)) + ' net düşüş var.' });
    }else if(trend.delta != null && trend.delta >= 1.5){
      findings.push({ tone:'ok',
        text:family + ' medyanı ' + U.fmtNet(trend.last3) + ' nete çıktı, '
          + U.fmtNet(trend.delta) + ' net artış var.' });
    }else if(trend.last3 != null){
      findings.push({ tone:'info',
        text:family + ' medyanı ' + U.fmtNet(trend.last3) + ' netde duruyor; taban '
          + (base == null ? '—' : U.fmtNet(base)) + ' net.' });
    }

    if(gapBand && gapBand.fark < 0){
      findings.push({ tone:'warn',
        text:gapBand.test + ' medyanı ' + U.fmtNet(gapBand.medyan) + ', hedef bandın '
          + U.fmtNet(Math.abs(gapBand.fark)) + ' net altında.' });
    }

    if(weakest){
      findings.push({ tone:tone(weakest.yuzde, 70, 40),
        text:weakest.ders + ' kapanışı %' + weakest.yuzde + ' (' + weakest.kapanan + '/'
          + weakest.toplam + ' konu); ' + family + ' genelinde %' + closure.pct + '.' });
    }

    if(risks.length){
      findings.push({ tone:'warn',
        text:'En riskli konu ' + risks[0].konu + ' (' + risks[0].ders + ', risk '
          + risks[0].risk + '/100).' });
    }

    const suggestion = risks.length
      ? { text:risks[0].konu + ' konusuna dön: ' + risks[0].ders + ' içinde en yüksek riskli başlık.',
          route:'subjects', label:'Derslere git' }
      : { text:(weakest ? weakest.ders : family) + ' kapanışını ilerlet.', route:'subjects', label:'Derslere git' };

    return {
      agent:agent.id, name:agent.name, role:agent.role,
      headline:family + ' kapanışı %' + closure.pct
        + (trend.last3 != null ? ' · medyan ' + U.fmtNet(trend.last3) + ' net' : ''),
      metrics:[
        { label:family + ' kapanış', value:'%' + closure.pct, tone:tone(closure.pct, 70, 40),
          note:closure.closed + '/' + closure.total + ' konu' },
        { label:'Medyan (son 3)', value:trend.last3 == null ? '—' : U.fmtNet(trend.last3),
          tone:trend.delta == null ? 'muted' : trend.delta >= 0 ? 'ok' : 'danger',
          note:trend.delta == null ? trend.count + ' deneme' : (trend.delta >= 0 ? '+' : '') + U.fmtNet(trend.delta) },
        { label:'Taban', value:base == null ? '—' : U.fmtNet(base), tone:'muted', note:'son 4 denemenin en düşüğü' },
      ],
      findings,
      suggestion,
      data:{
        alan:family,
        kapanis:{ kapanan:closure.closed, toplam:closure.total, yuzde:closure.pct },
        medyan:{ son3:num(trend.last3), onceki3:num(trend.prev3), fark:num(trend.delta),
          denemeSayisi:trend.count, taban:num(base) },
        tamDenemeSayisi:exams,
        dersler:subjects,
        netMatrisi:bands,
        riskliKonular:risks,
      },
    };
  }

  const BRIEFS = {

    tyt(agent){ return branchBrief(agent, 'TYT'); },
    ayt(agent){ return branchBrief(agent, 'AYT'); },

    rehber(agent){
      const n = M.currentWeek();
      const comp = C.planCompletion(n);
      const qr = C.questionRealization(n);
      const sleep = C.sleepAverage(7);
      const energy = M.energyAverage(7);
      const streak = C.behaviorStreak();
      const flow = C.dailyFlow();
      const reasons = C.skipReasonCounts(n);
      const target = (S.profile && S.profile.sleepTarget) || 7.5;
      const health = M.planHealth();
      const review = S.reviews[M.weekId(n)];

      const topReason = Object.keys(reasons)
        .map(k => ({ neden:k, adet:reasons[k] }))
        .sort((a, b) => b.adet - a.adet)[0];

      const days = [];
      for(let i = 0; i < 7; i++){
        const iso = U.iso(U.addDays(U.today(), -i));
        const d = S.days[iso];
        if(!d) continue;
        const blocks = d.blocks.filter(b => b.slot !== 'Dinlenme');
        days.push({ tarih:iso, tamamlanan:blocks.filter(b => b.status === 'done').length,
          toplam:blocks.length, uyku:d.sleepHours, calisilanDakika:U.sum(blocks.map(b => b.actualMin || 0)) });
      }

      const findings = [];
      if(comp != null){
        findings.push({ tone:tone(comp, 85, 70),
          text:'Hafta ' + n + ' plan tamamlaması %' + comp + (comp < 85 ? ' — hedef %85’in altında.' : '.') });
      }
      if(sleep != null && sleep < target - 0.75){
        findings.push({ tone:'danger',
          text:'Son 7 günün uyku ortalaması ' + U.fmtNet(sleep) + ' saat; hedefin '
            + U.fmtNet(target - sleep) + ' saat altında.' });
      }else if(sleep != null){
        findings.push({ tone:'ok', text:'Uyku ortalaması ' + U.fmtNet(sleep) + ' saat, hedefin içinde.' });
      }
      if(topReason){
        findings.push({ tone:'warn',
          text:'Bu hafta en sık atlama nedeni "' + topReason.neden + '" (' + topReason.adet + ' blok).' });
      }
      findings.push({ tone:streak.streak >= 3 ? 'ok' : 'warn',
        text:'Davranış serisi ' + streak.streak + ' gün; bugünün akışında '
          + flow.done + '/' + flow.total + ' adım tamam.' });
      if(energy != null && energy <= 2.5){
        findings.push({ tone:'warn', text:'Enerji ortalaması ' + U.fmtNet(energy) + '/5 — yük fazla gelmiş olabilir.' });
      }
      if(health && health.status && health.status !== 'ok'){
        findings.push({ tone:'warn', text:'Plan sağlığı: ' + (health.note || health.status) + '' });
      }

      const suggestion = (comp != null && comp < 85)
        ? { text:'Haftalık sözleşmeyi gözden geçir: kapasitenin üstünde yük varsa tek konuyu devret.',
            route:'week', label:'Haftaya git' }
        : { text:'Bugünün akışında eksik kalan adımı tamamla.', route:'today', label:'Bugüne git' };

      return {
        agent:agent.id, name:agent.name, role:agent.role,
        headline:'Plan %' + (comp == null ? '—' : comp) + ' · seri ' + streak.streak + ' gün',
        metrics:[
          { label:'Plan tamamlama', value:comp == null ? '—' : '%' + comp, tone:tone(comp, 85, 70), note:'hedef %85' },
          { label:'Uyku (7 gün)', value:sleep == null ? '—' : U.fmtNet(sleep) + ' sa',
            tone:sleep == null ? 'muted' : sleep >= target - 0.75 ? 'ok' : 'danger', note:'hedef ' + U.fmtNet(target) },
          { label:'Davranış serisi', value:streak.streak + ' gün', tone:streak.streak >= 3 ? 'ok' : 'warn',
            note:C.minimumDayMet() ? 'bugün tutuldu' : 'bugün henüz yok' },
        ],
        findings,
        suggestion,
        data:{
          hafta:n,
          planTamamlama:comp,
          soruGerceklesme:qr,
          uykuOrtalamasi:num(sleep),
          uykuHedefi:target,
          enerjiOrtalamasi:num(energy),
          davranisSerisi:streak.streak,
          minimumGun:C.minimumDayMet(),
          gununAkisi:{ tamamlanan:flow.done, toplam:flow.total, yuzde:flow.pct },
          atlamaNedenleri:reasons,
          planSagligi:health ? { durum:health.status, yuzde:health.pct, geride:health.behind } : null,
          son7Gun:days,
          adayinYazdigi:review ? { neden:review.why, duzeltme:review.decision } : null,
        },
      };
    },

    analist(agent){
      const debt = C.analysisDebt();
      const pareto = C.errorPareto().filter(p => p.count);
      const due = C.dueCards();
      const overdue = C.overdueCards();
      const cardDebt = C.cardDebt();
      const open = C.openErrors();
      const risks = C.riskRanking(5);
      const tyt = C.medianTrend('TYT');
      const ayt = C.medianTrend('AYT');
      const est = C.estimateScore();
      const n = M.currentWeek();
      const qr = C.questionRealization(n);
      const closure = C.overallClosure();

      const findings = [];
      if(debt.length){
        findings.push({ tone:'danger',
          text:debt.length + ' denemenin analizi bitmemiş; analiz edilmemiş deneme ölçüm sayılmaz.' });
      }
      if(pareto.length){
        const top = pareto[0];
        findings.push({ tone:'warn',
          text:'Hata dağılımında ilk sırada ' + R.ERROR_TAGS[top.tag].name + ' var: '
            + top.count + ' kayıt (%' + top.pct + ').' });
      }else{
        findings.push({ tone:'info', text:'Yanlış defterinde kayıt yok; hata dağılımı hesaplanamıyor.' });
      }
      if(cardDebt > 10){
        findings.push({ tone:'warn',
          text:'Tekrar borcu %' + cardDebt + ' (' + overdue.length + ' gecikmiş kart); eşik %10.' });
      }
      if(risks.length){
        findings.push({ tone:'warn',
          text:'Risk sıralamasının başında ' + risks[0].topicName + ' (' + risks[0].subjectName
            + ') var, risk ' + risks[0].score + '/100.' });
      }
      if(est.ok){
        findings.push({ tone:'info',
          text:'Tahmini sıra bandı ' + U.fmtNum(est.rankBest) + '–' + U.fmtNum(est.rankWorst)
            + ' (' + est.samples + ' denemeden, koçluk bandı).' });
      }else{
        findings.push({ tone:'info', text:'Sıra tahmini için yeterli kayıt yok: ' + est.why });
      }

      const suggestion = debt.length
        ? { text:'En eski analiz borcunu kapat; ölçüm ancak analizle değer kazanır.',
            route:'exams', label:'Denemelere git' }
        : (cardDebt > 10
          ? { text:'Gecikmiş kartları sadeleştir, sonra yeni kart üret.', route:'cards', label:'Tekrara git' }
          : { text:'Hata dağılımının ilk etiketine bir blok ayır.', route:'analytics', label:'Analize git' });

      return {
        agent:agent.id, name:agent.name, role:agent.role,
        headline:(debt.length ? debt.length + ' analiz borcu' : 'Analiz borcu yok')
          + ' · kapanış %' + closure.pct,
        metrics:[
          { label:'Analiz borcu', value:String(debt.length), tone:debt.length ? 'danger' : 'ok',
            note:debt.length ? 'en geç 24 saatte' : 'temiz' },
          { label:'Tekrar borcu', value:'%' + cardDebt, tone:cardDebt > 10 ? 'warn' : 'ok',
            note:due.length + ' kart bugün' },
          { label:'Açık yanlış', value:String(open.length), tone:open.length >= 10 ? 'warn' : 'muted',
            note:pareto.length ? 'ilk etiket ' + pareto[0].tag : 'kayıt yok' },
        ],
        findings,
        suggestion,
        data:{
          analizBorcu:debt.map(e => ({ tarih:e.date, tur:e.type })),
          hataDagilimi:pareto.map(p => ({ etiket:p.tag, ad:R.ERROR_TAGS[p.tag].name, adet:p.count, yuzde:p.pct })),
          acikYanlis:open.length,
          tekrar:{ due:due.length, gecikmis:overdue.length, borcYuzdesi:cardDebt, toplamKart:S.cards.length },
          riskSiralamasi:risks.map(r => ({ ders:r.subjectName, konu:r.topicName, risk:r.score,
            durum:r.state, acikYanlis:r.errors, gunGecti:r.staleDays })),
          medyan:{ tyt:num(tyt.last3), tytFark:num(tyt.delta), ayt:num(ayt.last3), aytFark:num(ayt.delta) },
          soruGerceklesme:qr,
          konuKapanisi:{ kapanan:closure.closed, toplam:closure.total, yuzde:closure.pct },
          tahmin:est.ok ? { puan:est.score, siraBandi:[est.rankBest, est.rankWorst],
            hedefSira:est.targetRank, konum:est.meta.label } : null,
        },
      };
    },

    /* Patron kendi hesabini yapmaz: dort uzmanin brifingindeki ilk bulguyu
       toplar, kural motorunun sonraki hamlesini basa koyar. */
    patron(agent){
      const action = nextAction();
      const gate = C.currentGate();
      const health = M.planHealth();
      const est = C.estimateScore();
      const n = M.currentWeek();

      const reports = R.MEETING_ORDER.map(id => {
        const b = brief(id);
        return {
          ajan:b.name, alan:b.role,
          baslik:b.headline,
          enOnemliBulgu:b.findings.length ? b.findings[0].text : 'bulgu yok',
          onerisi:b.suggestion ? b.suggestion.text : null,
          _tone:b.findings.length ? b.findings[0].tone : 'muted',
        };
      });

      const findings = reports.map(r => ({
        tone:r._tone === 'danger' ? 'danger' : r._tone === 'ok' ? 'ok' : 'warn',
        text:r.ajan + ' (' + r.alan + '): ' + r.enOnemliBulgu,
      }));

      const data = {
        bugun:U.todayISO(),
        programHaftasi:n,
        toplamHafta:R.PLAN.totalWeeks,
        sinavaKalanGun:U.diffDays(U.todayISO(), R.PLAN.examTytISO),
        kuralMotorununSectigiIs:{ baslik:action.title, neden:action.why },
        ekipRaporlari:reports.map(r => ({ ajan:r.ajan, alan:r.alan, baslik:r.baslik,
          bulgu:r.enOnemliBulgu, onerisi:r.onerisi })),
        planSagligi:health ? { durum:health.status, yuzde:health.pct, geride:health.behind } : null,
        ayinKapisi:gate ? { ay:gate.month, tytBant:gate.tyt, kural:gate.note } : null,
        tahmin:est.ok ? { siraBandi:[est.rankBest, est.rankWorst], hedefSira:est.targetRank,
          konum:est.meta.label } : null,
      };

      return {
        agent:agent.id, name:agent.name, role:agent.role,
        headline:action.title,
        metrics:[
          { label:'Hafta', value:n + '/' + R.PLAN.totalWeeks, tone:'muted',
            note:U.diffDays(U.todayISO(), R.PLAN.examTytISO) + ' gün kaldı' },
          { label:'Odak', value:action.label || 'Bugün', tone:action.tone === 'urgent' ? 'danger' : 'ok',
            note:action.title },
          { label:'Sıra bandı', value:est.ok ? U.fmtNum(est.rankBest) + '–' + U.fmtNum(est.rankWorst) : '—',
            tone:'muted', note:est.ok ? est.meta.label : 'yeterli deneme yok' },
        ],
        findings,
        suggestion:{ text:action.title + ' — ' + action.why, route:action.route || 'today',
          label:'Şimdi yap' },
        data,
      };
    },
  };

  /* ==================== masa notlari (proaktiflik) ====================
     Ofis sen kapisini acinca degil, esik asilinca konusur. Notlar TAMAMEN
     kural motorundan uretilir: model gerektirmez, kota harcamaz, cevrimdisi
     calisir. Ajanin masasinda ve Bugun ekraninda gorunur. */

  const WATCHERS = [
    { id:'analiz-borcu', agent:'analist', tone:'danger', route:'exams',
      when(){ return C.analysisDebt().length >= 2; },
      text(){ return C.analysisDebt().length + ' deneme analizsiz bekliyor; ölçüm değerini yitiriyor.'; } },

    { id:'tekrar-borcu', agent:'analist', tone:'warn', route:'cards',
      when(){ return C.cardDebt() > 15; },
      text(){ return 'Tekrar borcu %' + C.cardDebt() + ' — eşik %10, borç birikiyor.'; } },

    { id:'acik-yanlis', agent:'analist', tone:'warn', route:'cards',
      when(){ return C.openErrors().length >= 12; },
      text(){ return C.openErrors().length + ' açık yanlış var; kök neden yazılmadan defter işe yaramaz.'; } },

    { id:'uyku', agent:'rehber', tone:'danger', route:'today',
      when(){
        const s = C.sleepAverage(7);
        const t = (S.profile && S.profile.sleepTarget) || 7.5;
        return s != null && s < t - 1;
      },
      text(){ return 'Uyku ortalaması ' + U.fmtNet(C.sleepAverage(7)) + ' saate düştü; hacim tartışmasından önce bu.'; } },

    { id:'plan', agent:'rehber', tone:'warn', route:'week',
      when(){ const c = C.planCompletion(M.currentWeek()); return c != null && c < 70; },
      text(){ return 'Plan tamamlaması %' + C.planCompletion(M.currentWeek()) + '; sözleşme kapasitenin üstünde olabilir.'; } },

    { id:'seri', agent:'rehber', tone:'ok', route:'today',
      when(){ return C.behaviorStreak().streak >= 7; },
      text(){ return 'Davranış serisi ' + C.behaviorStreak().streak + ' gün — bu düzen korunmaya değer.'; } },

    { id:'tyt-dusus', agent:'tyt', tone:'danger', route:'progress',
      when(){ const t = C.medianTrend('TYT'); return t.delta != null && t.delta <= -2; },
      text(){ return 'TYT medyanı ' + U.fmtNet(Math.abs(C.medianTrend('TYT').delta)) + ' net geriledi.'; } },

    { id:'ayt-dusus', agent:'ayt', tone:'danger', route:'progress',
      when(){ const t = C.medianTrend('AYT'); return t.delta != null && t.delta <= -2; },
      text(){ return 'AYT medyanı ' + U.fmtNet(Math.abs(C.medianTrend('AYT').delta)) + ' net geriledi.'; } },

    { id:'ikinci-olcum', agent:'tyt', tone:'warn', route:'subjects',
      when(){ return C.pendingSecondChecks().filter(p => p.overdue).length >= 2; },
      text(){ return C.pendingSecondChecks().filter(p => p.overdue).length
        + ' konu 7. gün testini bekliyor; ölçülmeyen konu kapanmış sayılmaz.'; } },

    { id:'karar', agent:'patron', tone:'warn', route:'office',
      when(){ return openDecisions().length > 0; },
      text(){
        const d = openDecisions()[0];
        const gun = U.diffDays(d.at.slice(0, 10), U.todayISO());
        return 'Karar ' + (gun > 0 ? gun + ' gündür ' : '') + 'açık: ' + d.title;
      } },
  ];

  /* Etkin notlar. agentId verilirse yalniz o masaninkiler. */
  function notes(agentId){
    const out = [];
    WATCHERS.forEach(w => {
      let on = false;
      try{ on = !!w.when(); }catch(e){ on = false; }
      if(!on) return;
      let text = '';
      try{ text = w.text(); }catch(e){ return; }
      const agent = R.AGENT_BY_ID[w.agent];
      out.push({ id:w.id, agent:w.agent, name:agent ? agent.name : '',
        tone:w.tone, text, route:w.route });
    });
    const rank = { danger:0, warn:1, ok:2, info:3 };
    out.sort((a, b) => (rank[a.tone] || 9) - (rank[b.tone] || 9));
    return agentId ? out.filter(n => n.agent === agentId) : out;
  }

  /* ==================== gunluk brifing ====================
     Sabah bir kez calisir ve gun boyu onbellekten okunur; ikinci bir model
     cagrisi yapilmaz. Model yoksa notlardan kural motoru metni uretilir. */

  /* Brifingin dayandigi not kumesinin parmak izi. Notlar gun icinde
     degisirse (deneme girildi, uyku kaydedildi) brifing BAYATLAR: aksi hâlde
     ayni ekranda "uyarı yok" yazarken iki uyari gorunur. */
  function noteFingerprint(){
    return notes().map(n => n.id).sort().join(',');
  }

  function briefingOf(dayISO){
    const b = (S.officeBriefings || {})[dayISO || U.todayISO()];
    if(!b) return null;
    return Object.assign({}, b, { stale:b.noteIds !== noteFingerprint() });
  }

  function ruleBriefingText(){
    const list = notes();
    const action = nextAction();
    if(!list.length) return 'Masalarda bekleyen bir uyarı yok. Bugünün işi: ' + action.title + '.';
    return list.slice(0, 2).map(n => n.name + ': ' + n.text).join(' ')
      + ' Bugünün işi: ' + action.title + '.';
  }

  async function dailyBriefing(opts){
    const o = opts || {};
    const id = U.todayISO();
    const cached = briefingOf(id);
    /* Bayat brifing kural motoru modunda kendiliginden tazelenir (bedava);
       model bagliyken kota harcamamak icin bayat isaretiyle birakilir ve
       tazeleme kullaniciya birakilir. */
    if(cached && !o.force && !(cached.stale && !ready('patron'))) return cached;

    const list = notes();
    let text, mode = 'kural';
    if(ready('patron') && !o.rulesOnly){
      const agent = R.AGENT_BY_ID.patron;
      const data = compactData(R.Tools.sanitize({
        masaNotlari:list.map(n => ({ ajan:n.name, not:n.text, onem:n.tone })),
        gununIsi:{ baslik:nextAction().title, neden:nextAction().why },
        acikKarar:openDecisions().map(d => d.title),
      }));
      const turn = await speak('patron', 'briefing', {
        messages:[{ role:'user', text:R.OFFICE_PROMPTS.daily(data) }],
        ctx:{},
      }, Object.assign({}, o, { maxTokens:BUDGET.daily }));
      text = turn.text;
      mode = turn.mode;
    }else{
      text = ruleBriefingText();
    }

    const payload = { id, at:new Date().toISOString(), text, mode,
      noteCount:list.length, noteIds:list.map(n => n.id).sort().join(','),
      action:nextAction().title };
    S.officeBriefings = S.officeBriefings || {};
    S.officeBriefings[id] = payload;
    await R.Store.set('briefings/' + id, payload);

    /* Eski brifingler birikmesin: son yedi gun yeter. */
    const keep = {};
    Object.keys(S.officeBriefings).sort().slice(-7).forEach(k => { keep[k] = S.officeBriefings[k]; });
    S.officeBriefings = keep;
    return payload;
  }

  /* nextAction() veri yokken null donebilir; ofis her zaman bir is gosterir. */
  function nextAction(){
    return C.nextAction() || {
      key:'today', icon:'today', label:'Bugün', title:'Bugünün akışını tamamla',
      why:'Ölçüm için önce düzenli kayıt gerekir.', route:'today', tone:'calm',
    };
  }

  /* ---------- brifing sikistirma ----------
     Brifing JSON'u oldugu gibi gidiyordu. Ucretsiz modellerin dakikalik JETON
     siniri (TPM) istek sinirindan once dolar; ayrica uzun istem yaniti
     yavaslatir ve modelin dikkatini dagitir. Budama SIRALIDIR: once en
     ayrintili diziler kirpilir, ozet alanlara hic dokunulmaz. */

  const BRIEF_BUDGET = 2600;      // karakter — yaklasik 900 jeton

  /* Once kirpilacak diziler: ayrintili, tekrarli ve yorum icin gereksiz olanlar. */
  const TRIM_ORDER = [
    ['son7Gun', 3], ['dersler', 4], ['netMatrisi', 4], ['riskliKonular', 2],
    ['riskSiralamasi', 3], ['analizBorcu', 3], ['hataDagilimi', 3],
  ];

  function compactData(data, budget){
    const cap = budget || BRIEF_BUDGET;
    let out = JSON.parse(JSON.stringify(data || {}));
    const size = () => JSON.stringify(out).length;
    if(size() <= cap) return out;

    for(const [field, keep] of TRIM_ORDER){
      const trim = node => {
        if(!node || typeof node !== 'object') return;
        Object.keys(node).forEach(k => {
          if(k === field && Array.isArray(node[k]) && node[k].length > keep){
            const dropped = node[k].length - keep;
            node[k] = node[k].slice(0, keep);
            node[k].push('… ' + dropped + ' kayıt daha (kısaltıldı)');
          }else if(node[k] && typeof node[k] === 'object'){
            trim(node[k]);
          }
        });
      };
      trim(out);
      if(size() <= cap) return out;
    }
    return out;
  }

  const briefCache = new Map();
  /* Ayni cizimde bes ajan da brifing ister; hesap bir kez yapilir.
     Brifinge ajanin DEFTERI de eklenir: kural motorunun gecmiste buldugu
     oruntuler ve dogrulanmis gozlemler. Bunlar veriden gelir, modelden degil. */
  function brief(agentId){
    const agent = R.AGENT_BY_ID[agentId];
    if(!agent) throw new Error('bilinmeyen ajan: ' + agentId);
    if(briefCache.has(agentId)) return briefCache.get(agentId);

    const out = BRIEFS[agentId](agent);
    let journal = [];
    try{ journal = R.Journal.forBrief(agentId); }catch(e){ journal = []; }
    out.journal = journal;
    if(journal.length){
      out.data = Object.assign({}, out.data, {
        defterim:journal.map(j => j.text),
      });
    }
    briefCache.set(agentId, out);
    return out;
  }
  function resetBriefs(){ briefCache.clear(); }

  /* Ekip ozeti — ofis ekraninin ust seridi. */
  function snapshot(){
    resetBriefs();
    return {
      mode:mode(),
      provider:providerLabel(),
      action:nextAction(),
      agents:R.AGENTS.map(a => {
        const b = brief(a.id);
        const worst = b.findings.reduce((acc, f) =>
          f.tone === 'danger' ? 'danger' : (acc === 'danger' ? acc : (f.tone === 'warn' ? 'warn' : acc)), 'ok');
        return { id:a.id, name:a.name, role:a.role, headline:b.headline, tone:worst,
          findings:b.findings.length };
      }),
    };
  }

  /* ==================== kural motoru metni (model yokken) ==================== */

  /* Brifingi cumleye cevirir. Model bagli degilken ofis bu metinlerle calisir;
     icerik ayni kural motorundan geldigi icin dogruluk degismez, yalniz
     anlatim sadelesir. */
  function ruleText(agentId, kind, ctx){
    const b = brief(agentId);
    const lines = b.findings.slice(0, kind === 'turn' ? 2 : 3).map(f => f.text);

    if(kind === 'opening'){
      return 'Gündem: ' + ctx.topic + '. ' + ctx.why + ' Sırayla dinliyorum.';
    }
    if(kind === 'closing'){
      return 'Ekipten çıkan tabloya göre bu haftanın tek işi: ' + ctx.action.title + '. '
        + (ctx.action.why || '') + ' Diğer başlıklar sıraya girer; aynı anda iki müdahale yapılmaz.';
    }

    /* Tur farkli sey soruyorsa cevap da farkli olmali. Model yokken ajanin
       elinde yalnizca brifing vardir; ucuncu turdan sonra soyleyecek YENI
       bir seyi yoktur ve bunu uydurmak yerine acikca soyler. */
    const round = (ctx && ctx.round && ctx.round.key) || null;
    let body;
    if(kind === 'turn' && round === 'fikir'){
      body = b.suggestion
        ? b.suggestion.text + ' Gerekçe: ' + (lines[0] || b.headline)
        : b.headline + '. Bu masadan çıkacak somut bir öneri yok.';
    }else if(kind === 'turn' && round === 'itiraz'){
      body = lines[1]
        ? 'Buna itirazım şu: ' + lines[1]
        : 'Kendi alanımdan itirazım yok; ' + (lines[0] || b.headline);
    }else if(kind === 'turn' && round === 'oylama'){
      /* Oy kural motoru modunda nextTurn icinde secilir; burada gerekce yazilir. */
      body = b.suggestion ? 'Kendi alanımdaki en somut iş bu: ' + b.suggestion.text
        : (lines[0] || b.headline);
    }else if(kind === 'turn' && (round === 'sentez' || round === 'serbest')){
      body = b.suggestion
        ? 'Bana düşen iş: ' + b.suggestion.text
        : 'Ekleyecek bir şeyim yok.';
    }else if(kind === 'answer'){
      body = 'Masamdaki veriye göre: ' + (lines[0] || b.headline)
        + (lines[1] ? ' ' + lines[1] : '');
    }else{
      body = lines.length
        ? lines.join(' ') + (b.suggestion ? ' ' + b.suggestion.text : '')
        : b.headline + '. Bu masada bugün ayrıca bildirilecek bir şey yok.';
    }

    /* Soruya yanit verirken durustluk: model bagli degilken ajan soruyu
       okuyamaz, yalnizca masasindaki tabloyu okur. Bunu saklamaz. */
    if(kind === 'chat'){
      return 'Masamdaki rapor şunu söylüyor. ' + body
        + ' Sorunun kendisini okuyabilmem için ofise bir model bağlaman gerekir;'
        + ' şimdilik yalnız bu tabloyu aktarabiliyorum.';
    }
    return body;
  }

  /* ==================== model cagrisi ==================== */

  function toneId(){ return (S.profile && S.profile.coachTone) || 'dengeli'; }

  /* ---------- kural motoru dogrulamasi ----------
     Model ne yazarsa yazsin cikti ev kurallarina karsi denetlenir.
     Gardlar veri katmanindan gelir (R.PROMPTS.forbidden); when() kural
     motorunu alir, yani yasak yalnizca veri onu destekliyorsa uygulanir. */

  /* Metindeki sayilari cikarir. Turkce yazimi tanir:
     "19,50" ondalik, "1.500" binlik, "%78" yuzde. */
  function numbersIn(text){
    const out = [];
    const re = /%?\s?\d{1,3}(?:\.\d{3})+(?:,\d+)?|%?\s?\d+(?:[.,]\d+)?/g;
    const raw = String(text || '');
    let m;
    while((m = re.exec(raw)) !== null){
      let t = m[0].replace(/%/g, '').trim();
      if(/^\d{1,3}(?:\.\d{3})+/.test(t)) t = t.replace(/\./g, '');   // binlik ayraci
      const n = Number(t.replace(',', '.'));
      if(Number.isFinite(n)) out.push({ raw:m[0].trim(), value:n });
    }
    return out;
  }

  /* Brifingdeki butun sayilar — hem ham veriden hem bulgu metinlerinden.
     Bulgu metni sayilari bicimlenmis hâlde tasidigi icin ikisi de gerekir. */
  function supportedNumbers(brief){
    const set = [];
    const walk = v => {
      if(v == null) return;
      if(typeof v === 'number'){ if(Number.isFinite(v)) set.push(v); return; }
      if(typeof v === 'string'){ numbersIn(v).forEach(x => set.push(x.value)); return; }
      if(Array.isArray(v)){ v.forEach(walk); return; }
      if(typeof v === 'object'){ Object.keys(v).forEach(k => walk(v[k])); }
    };
    walk(brief && brief.data);
    (brief && brief.findings || []).forEach(f => walk(f.text));
    if(brief && brief.headline) walk(brief.headline);
    if(brief && brief.metrics) walk(brief.metrics);
    return set;
  }

  /* Sayi sadakati: ajanin yazdigi her sayi brifingde var mi?

     Kucuk tam sayilar (≤12) elenir — "uc gun", "iki blok", "bir konu" gibi
     dogal dil sayilaridir ve brifingde karsiligi olmasi gerekmez. Yil da
     elenir. Kalan bir sayi brifingde yoksa model onu UYDURMUS demektir;
     bu, kural motoru otoritesinin en dogrudan ihlalidir. */
  function numberFidelity(text, brief){
    if(!brief) return [];
    const supported = supportedNumbers(brief);
    const near = n => supported.some(s => Math.abs(s - n) < 0.051);
    const bad = [];
    numbersIn(text).forEach(x => {
      const n = x.value;
      if(Number.isInteger(n) && n <= 12) return;          // dogal dil sayisi
      if(n >= 1900 && n <= 2100 && Number.isInteger(n)) return;  // yil
      if(near(n)) return;
      if(bad.indexOf(x.raw) < 0) bad.push(x.raw);
    });
    return bad;
  }

  /* Alan ihlali: ajan kendi masasinin disina cikti mi?
     Gardlar data/agents.js icinde ajanin yaninda durur. */
  function scopeBreaches(text, agent){
    if(!agent || !agent.taboo) return [];
    return agent.taboo.filter(t => t.re.test(text)).map(t => t.why);
  }

  /* ---------- kural motoru dogrulamasi ----------
     Model ne yazarsa yazsin cikti uc katmanda denetlenir:
       1) ev kurallari  — garanti, kaynak degistirme, uykudan feda, tibbi tavsiye
       2) sayi sadakati — brifingde olmayan sayi
       3) alan ihlali   — uzmanin kendi masasinin disina cikmasi
     Gardlar veri katmanindan gelir; when() kural motorunu alir, yani yasak
     yalnizca veri onu destekliyorsa uygulanir. */

  function validate(text, opts){
    const o = opts || {};
    const warnings = [];

    (R.PROMPTS.forbidden || []).forEach(rule => {
      try{ if(rule.re.test(text) && rule.when(C)) warnings.push(rule.why); }
      catch(e){ /* gard hesaplanamadiysa uyari uretme */ }
    });

    const agent = o.agentId ? R.AGENT_BY_ID[o.agentId] : null;
    scopeBreaches(text, agent).forEach(w => warnings.push(w));

    if(o.brief){
      const made = numberFidelity(text, o.brief);
      if(made.length){
        warnings.push('Bu sayılar raporda yok: ' + made.join(', ')
          + '. Kural motorunun hesabına bak, metne değil.');
      }
    }
    return { text, warnings, unsupported:o.brief ? numberFidelity(text, o.brief) : [] };
  }

  /* ---------- nottan kart uretimi ----------
     Once koc katmanindaydi; artik ofisin isi ve ucretsiz modellerle de
     calisir. LLM yalniz metin onerir, kart nesnesini kural motoru kurar:
     sema, uzunluk ve SRS asamalari uygulamada kalir. */

  function noteContext(noteId){
    const note = S.videoNotes.find(n => n.id === noteId);
    if(!note || !note.segments.length) return null;
    return {
      baslik:note.title,
      konu:M.noteTopicName(note),
      notlar:note.segments.slice(0, 40).map(s => ({
        saniye:s.ts, etiket:s.tag, metin:String(s.text).slice(0, 220),
      })),
      mevcutKartSayisi:S.cards.filter(c => c.source === 'note' && c.sourceRef === noteId).length,
    };
  }

  function validateCards(rawObj, note){
    const cfg = R.PROMPTS.cards;
    const list = (rawObj && Array.isArray(rawObj.cards)) ? rawObj.cards : [];
    const seen = {};
    const out = [];
    let dropped = 0;

    for(const c of list){
      const front = String((c && c.front) || '').trim();
      const back = String((c && c.back) || '').trim();
      if(!front || !back){ dropped++; continue; }
      if(front.length > cfg.frontMax || back.length > cfg.backMax){ dropped++; continue; }
      const key = front.toLowerCase();
      if(seen[key]){ dropped++; continue; }
      seen[key] = true;
      out.push(M.newCard({
        front, back,
        topic:String((c && c.topic) || M.noteTopicName(note)).slice(0, 80),
        subjectId:note.subjectId || null,
        source:'note', sourceRef:note.id,
      }));
      if(out.length >= cfg.max) break;
    }
    return { cards:out, dropped };
  }

  /* Ucretsiz modeller JSON'u kod cercevesi icinde dondurebiliyor;
     metinden ilk gecerli nesne cikarilir. */
  function parseJson(text){
    const raw = String(text || '').trim();
    const fence = raw.match(/```(?:json)?\s*([\s\S]*?)```/);
    const body = fence ? fence[1] : raw;
    try{ return JSON.parse(body); }catch(e){}
    const start = body.indexOf('{');
    const end = body.lastIndexOf('}');
    if(start >= 0 && end > start){
      try{ return JSON.parse(body.slice(start, end + 1)); }catch(e){}
    }
    return null;
  }

  async function generateCards(noteId, opts){
    const o = opts || {};
    const note = S.videoNotes.find(n => n.id === noteId);
    if(!note || !note.segments.length){
      throw Object.assign(new Error('Bu derste not yok'), { code:'no_data' });
    }
    const chain = chainFor('analist');
    if(!chain.length){
      throw Object.assign(new Error('Model bağlı değil'), { code:'unavailable' });
    }

    const cfg = R.PROMPTS.cards;
    const ctx = R.Tools.sanitize(noteContext(noteId));
    const res = await R.LLM.complete(chain, {
      system:cfg.system + '\nEn fazla ' + cfg.max + ' kart üret.',
      messages:[{ role:'user', text:'NOTLAR (JSON):\n' + JSON.stringify(ctx, null, 1) }],
      maxTokens:BUDGET.cards,
      temperature:0.2,
      signal:o.signal,
    });

    const parsed = parseJson(res.text);
    const checked = validateCards(parsed, note);
    if(!checked.cards.length){
      throw Object.assign(new Error('Geçerli kart üretilemedi'), { code:'empty' });
    }
    return checked;
  }

  /* Tek bir ajan konusturur. Model yoksa ya da cagri basarisiz olursa
     kural motoru metnine duser — ofis hicbir kosulda sessiz kalmaz. */
  async function speak(agentId, kind, payload, opts){
    const agent = R.AGENT_BY_ID[agentId];
    const o = opts || {};
    const chain = chainFor(agentId);

    if(!chain.length || o.rulesOnly){
      const text = ruleText(agentId, kind, payload.ctx || {});
      return { agent:agentId, name:agent.name, role:agent.role, text, warnings:[], mode:'kural' };
    }

    /* Ajan sisteme dokunmayi ONEREBILIR (sohbet ve toplanti turlarinda).
       Onerdigi sey dogrudan uygulanmaz: kapali katalogdan secilir, kural
       motorunda dogrulanir ve kullanicinin onayina duser. */
    const catalog = o.allowAction ? R.Proposals.catalogPrompt(agentId) : '';

    try{
      const res = await R.LLM.complete(chain, {
        system:R.OFFICE_PROMPTS.system(agent, toneId()) + (catalog ? '\n\n' + catalog : ''),
        messages:payload.messages,
        maxTokens:o.maxTokens || BUDGET.turn,
        temperature:agent.temperature,
        signal:o.signal,
        /* Akista JSON kuyrugu kullaniciya gorunmez. */
        onText:(o.onText && catalog)
          ? ev => o.onText({ text:R.Proposals.stripTrailingJson(ev.text), delta:ev.delta })
          : o.onText,
      });

      /* Eylem nesnesi metinden ayrilir: ekranda konusma kalir, oneri
         kutuya gider. */
      let said = res.text;
      let proposal = null;
      if(catalog){
        const split = R.Proposals.splitAction(said);
        if(split.obj){
          said = split.text || said;
          const p = R.Proposals.fromModel(agentId, split.obj);
          if(p) proposal = await R.Proposals.propose(p);
        }
      }

      /* Cikti kendi brifingine karsi denetlenir: uydurulmus sayi ve alan
         ihlali burada yakalanir. Patron'un brifingi dort raporu tasidigi
         icin onun sayilari da kapsanir. */
      let ownBrief = null;
      try{ ownBrief = brief(agentId); }catch(e){}
      const checked = validate(said, { agentId, brief:ownBrief });
      return { agent:agentId, name:agent.name, role:agent.role, text:checked.text,
        warnings:checked.warnings, mode:'llm', model:res.model, provider:res.provider,
        fellBack:!!res.fellBack, ms:res.ms,
        /* Devam istekleri de yetmediyse yanit kirpildi: ekran bunu soyler,
           kullanici eksik cumleyi sessizce okumaz. */
        truncated:!!res.truncated,
        proposal:proposal || null };
    }catch(err){
      if(err && err.code === 'cancelled') throw err;
      const text = ruleText(agentId, kind, payload.ctx || {});
      return { agent:agentId, name:agent.name, role:agent.role, text, warnings:[],
        mode:'kural', error:R.LLM.errorText(err && err.code) };
    }
  }

  /* ==================== sohbet ==================== */

  function chatOf(agentId){ return (S.officeChats && S.officeChats[agentId]) || []; }

  async function pushChat(agentId, role, text, meta){
    S.officeChats = S.officeChats || {};
    const list = (S.officeChats[agentId] || []).concat([Object.assign({
      role, text, at:new Date().toISOString(),
    }, meta || {})]).slice(-CHAT_MAX);
    S.officeChats[agentId] = list;
    await R.Store.set('office/chat-' + agentId, { messages:list });
    return list;
  }

  async function clearChat(agentId){
    S.officeChats = S.officeChats || {};
    S.officeChats[agentId] = [];
    await R.Store.remove('office/chat-' + agentId);
  }

  /* Bir ajana soru sorar. Sohbetin son turlari baglama eklenir. */
  async function ask(agentId, question, opts){
    const agent = R.AGENT_BY_ID[agentId];
    if(!agent) throw new Error('bilinmeyen ajan: ' + agentId);
    const q = String(question || '').trim();
    if(!q) throw Object.assign(new Error('boş soru'), { code:'empty' });

    resetBriefs();
    const data = compactData(R.Tools.sanitize(brief(agentId).data));
    const history = chatOf(agentId).slice(-4)
      .map(m => ({ role:m.role === 'user' ? 'user' : 'assistant', text:m.text }));

    const messages = history.concat([
      { role:'user', text:R.OFFICE_PROMPTS.chat(agent, data, q) },
    ]);

    /* Sohbette ajan bir duzeltme onerebilir; oneri onaya duser. */
    return speak(agentId, 'chat', { messages, ctx:{} },
      Object.assign({}, opts, { allowAction:true }));
  }

  /* Ajanin kendi alanini ozetlemesi (soru olmadan). */
  async function briefing(agentId, opts){
    const agent = R.AGENT_BY_ID[agentId];
    resetBriefs();
    const data = compactData(R.Tools.sanitize(brief(agentId).data));
    return speak(agentId, 'briefing', {
      messages:[{ role:'user', text:R.OFFICE_PROMPTS.briefing(agent, data) }],
      ctx:{},
    }, opts);
  }

  /* ==================== toplanti ==================== */

  /* Gundem kural motorundan gelir; LLM gundem secmez.
     Adaylar puanlanir, en yuksek puanli tek gundem toplantiya girer. */
  function agendaCandidates(){
    const n = M.currentWeek();
    const debt = C.analysisDebt();
    const comp = C.planCompletion(n);
    const cardDebt = C.cardDebt();
    const tyt = C.medianTrend('TYT');
    const ayt = C.medianTrend('AYT');
    const sleep = C.sleepAverage(7);
    const target = (S.profile && S.profile.sleepTarget) || 7.5;
    const gate = C.currentGate();
    const decided = gate ? S.decisions[U.monthKey(U.today())] : null;
    const closure = C.overallClosure();
    const risks = C.riskRanking(1);
    const out = [];

    /* Pazar aksami haftanin kapanisi gundemi one gecer: hafta bitiyor ve
       sozlesme degil GERCEKLESEN konusulur. */
    if(U.weekdayIndex(U.today()) === 6){
      out.push({ score:92, topic:'Haftanın kapanışı',
        why:'Hafta bitiyor. Planlanan ile gerçekleşen arasındaki farkı ekip birlikte okur.',
        data:{ hafta:n, tamamlama:comp, soruGerceklesme:C.questionRealization(n),
          atlamaNedenleri:C.skipReasonCounts(n),
          devir:(S.reviews[M.weekId(n)] || {}).carry || null } });
    }

    if(gate && !decided){
      out.push({ score:95, topic:'Bu ayın karar kapısı',
        why:'Ayda bir medyanın bandın neresinde olduğuna bakılır ve tek müdahale seçilir.',
        data:{ ay:gate.month, tytBant:gate.tyt, tytGuvenli:gate.tytSafe, aytBant:gate.ayt,
          kural:gate.note, tytMedyan:num(tyt.last3), aytMedyan:num(ayt.last3) } });
    }
    if(debt.length){
      out.push({ score:90, topic:debt.length + ' denemenin analiz borcu',
        why:'Analiz edilmemiş deneme ölçüm sayılmaz; ekip bu borcu konuşmadan başka karar veremez.',
        data:{ borc:debt.length, denemeler:debt.slice(0, 5).map(e => ({ tarih:e.date, tur:e.type })) } });
    }
    if(comp != null && comp < 80){
      out.push({ score:85, topic:'Plan tamamlaması %' + comp + ' — hedefin altında',
        why:'İki hafta üst üste %80 altı telafi tetikler; nedeni davranışta mı yükte mi ayrılmalı.',
        data:{ hafta:n, tamamlama:comp, atlamaNedenleri:C.skipReasonCounts(n) } });
    }
    if(tyt.delta != null && tyt.delta <= -1.5){
      out.push({ score:80, topic:'TYT medyanında ' + U.fmtNet(Math.abs(tyt.delta)) + ' net düşüş',
        why:'Düşüş tek denemeden değil medyandan geliyor; kaynağı konu mu süre mi diye ayrılmalı.',
        data:{ son3:num(tyt.last3), onceki3:num(tyt.prev3), fark:num(tyt.delta), taban:num(C.examBase('TYT')) } });
    }
    if(sleep != null && sleep < target - 1){
      out.push({ score:78, topic:'Uyku ortalaması ' + U.fmtNet(sleep) + ' saate düştü',
        why:'Uyku bellek pekişmesinin parçası; hacim tartışmasından önce bu konuşulur.',
        data:{ ortalama:num(sleep), hedef:target } });
    }
    if(cardDebt > 10){
      out.push({ score:70, topic:'Tekrar borcu %' + cardDebt,
        why:'Borç eşiği aşıldı; yeni kart üretimi azaltılmadan önce ekip sırayı belirlemeli.',
        data:{ borc:cardDebt, gecikmis:C.overdueCards().length, due:C.dueCards().length } });
    }
    if(ayt.delta != null && ayt.delta <= -1.5){
      out.push({ score:68, topic:'AYT medyanında ' + U.fmtNet(Math.abs(ayt.delta)) + ' net düşüş',
        why:'Alan derslerinde düşüş sıralamaya doğrudan yansır.',
        data:{ son3:num(ayt.last3), onceki3:num(ayt.prev3), fark:num(ayt.delta) } });
    }
    if(closure.pct < 55){
      out.push({ score:60, topic:'Konu kapanışı %' + closure.pct,
        why:'Kapanmamış konu net üretmez; hangi dersin öne alınacağı ekip kararıdır.',
        data:{ kapanan:closure.closed, toplam:closure.total, yuzde:closure.pct } });
    }
    if(risks.length){
      out.push({ score:50, topic:'En riskli konu: ' + risks[0].topicName,
        why:'Risk sıralamasının başındaki konu haftanın hedefini belirler.',
        data:{ ders:risks[0].subjectName, konu:risks[0].topicName, risk:risks[0].score,
          durum:risks[0].state, acikYanlis:risks[0].errors } });
    }
    out.push({ score:10, topic:'Haftanın genel durumu',
      why:'Acil bir başlık yok; ekip düzenli gözden geçirme yapar.',
      data:{ hafta:n, kapanis:closure.pct, planTamamlama:comp } });

    return out.sort((a, b) => b.score - a.score);
  }

  function agenda(){ return agendaCandidates()[0]; }

  /* Toplanti: Patron acar → uzmanlar sirayla konusur → Patron tek karar verir.
     onTurn her konusmadan sonra cagirilir (ekranda canli akis icin). */
  /* ---------- turlar ----------
     Toplanti tek turluk bir yoklama degil, tur tur ilerleyen bir fikir
     patlamasidir. Her turun AYRI bir sorusu vardir; boylece ajanlar ayni
     cumleyi tekrar etmez, tartisma derinlesir. */

  const ROUNDS = [
    { key:'durum',  title:'Durum tespiti',
      ask:'Kendi alanindan gundemle ilgili TEK bulgu bildir. Sayilari raporundan al.' },
    { key:'fikir',  title:'Fikir turu',
      ask:'Gundemi cozecek TEK somut fikir at. Baskasinin fikrini tekrarlama; '
        + 'senden onceki fikirlerden farkli bir sey soyle.' },
    { key:'itiraz', title:'İtiraz turu',
      ask:'Masadaki fikirlerden hangisi kendi alaninda TUTMAZ, nedenini veriyle soyle. '
        + 'Itirazin yoksa hangisini destekledigini ve neden oldugunu tek cumlede yaz.' },
    { key:'oylama', title:'Oylama turu', vote:true,
      ask:'Fikirlerden birini SEC. Yanitina o fikrin NUMARASIYLA basla, sonra tek cumlede '
        + 'neden onu sectigini soyle. Kendi fikrini de secebilirsin ama gerekcen veriye dayanmali.' },
    { key:'sentez', title:'Toparlama turu',
      ask:'Konusulanlardan kendi alanina dusen tek isi soyle: sen ne yapacaksin, '
        + 'aday senden ne bekleyecek.' },
  ];

  function roundDef(n){ return ROUNDS[Math.min(n, ROUNDS.length) - 1] || ROUNDS[ROUNDS.length - 1]; }

  /* Kac tur anlamli? Model bagliyken bes turun hepsi ayri bir soru sorar.

     Model yokken ajanin elinde yalnizca brifing vardir ve uc turdan sonra
     soyleyecek yeni bir seyi kalmaz. Oylama turu bunun istisnasidir: oyu
     model degil kural motoru verir ve tablo YENI bilgi uretir. Bu yuzden
     kural motoru modunda toplanti oylamayla biter, toparlama turu yapilmaz. */
  function maxRounds(){
    if(mode() === 'llm') return ROUNDS.length;
    const vote = ROUNDS.findIndex(r => r.vote);
    return vote >= 0 ? vote + 1 : 3;
  }

  /* ---------- canli oturum ----------
     Toplanti artik tek bir cagriyla bitmez: kullanici bitirene kadar
     tur tur ilerler. Her konusma bir model cagrisidir ve kota yoneticisi
     araya bosluk koyar; bu yuzden "hepsi aninda" degil sirayla akar. */

  function newSession(ag){
    return {
      id:U.uid('m'),
      at:new Date().toISOString(),
      topic:ag.topic, why:ag.why, agendaData:ag.data || {},
      round:0,
      turns:[],
      status:'live',
      promptVersion:R.OFFICE_PROMPTS.version,
    };
  }
