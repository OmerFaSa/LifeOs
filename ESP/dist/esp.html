ESP.Screens.team = (function(){
  const U = ESP.U, S = ESP.S;
  const { html, raw, when, map, cls } = ESP.h;
  const K = ESP.C;

  function agent(){
    return ESP.AGENT_BY_ID[S.ui.officeAgent] || ESP.AGENT_BY_ID.patron;
  }

  function avatar(a){
    return html`<span class="agentav" style="background:${a.color}"
      aria-hidden="true">${a.initial}</span>`;
  }

  function msgRow(m){
    const kaynak = m.role === 'user' ? null
      : (m.source === 'model' ? { label:'model', tone:'info' }
         : { label:'kural motoru', tone:'muted' });
    return html`
      <div class="${cls('msg', m.role === 'user' ? 'msg--me' : 'msg--agent')}">
        <p>${m.text}</p>
        <div class="msg__foot">
          ${when(kaynak, () => K.Badge({ label:kaynak.label, tone:kaynak.tone, icon:false }))}
          ${when(m.blocked, () => K.Badge({ label:'kurallara takıldı', tone:'warn' }))}
          ${when(m.error, () => K.Badge({ label:'hata', tone:'danger' }))}
          <span class="tiny dim">${U.fmtClock ? U.fmtClock(m.at) : ''}</span>
        </div>
      </div>`;
  }

  function render(){
    const a = agent();
    const brf = ESP.Office.brief(a.id);
    const mesajlar = S.officeChats[a.id] || [];
    const hazir = ESP.Office.ready(a.id);
    const devir = ESP.Office.handoffsFor(a.id);

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:a.id, act:'pick-agent', aria:'Ajan seçimi',
          items:ESP.AGENTS.map(x => ({ id:x.id, label:x.short || x.name })) }),
      }))}

      ${K.Span(12, K.Ledger(() => [

        K.Entry({
          label:'MASA',
          meta:a.role,
          note:a.notScope,
          action:K.Badge({ label:hazir ? 'model bağlı' : 'kural motoru',
            tone:hazir ? 'info' : 'muted' }),
          body:html`
            <div class="row">
              ${avatar(a)}
              <div>
                <b>${a.name}</b>
                <p class="small muted">${a.scope}</p>
              </div>
            </div>
            <p class="rulesay mt-10">${a.opening}</p>`,
        }),

        K.Entry({
          label:'KURAL MOTORUNUN CÜMLESİ', hint:'rule-engine',
          meta:'model olmadan',
          note:'Model kapalıyken ajanın konuştuğu dil budur. Yedek değil '
             + 'varsayılan: model bir iyileştirmedir.',
          body:html`<p class="rulesay">${ESP.Office.ruleText(a.id, brf)}</p>`,
        }),

        ...(devir.in.length || devir.out.length ? [K.Entry({
          label:'BU MASANIN DEFTERİ', hint:'handoff',
          meta:(devir.in.length + devir.out.length) + ' satır',
          body:html`
            ${map(devir.in, h => html`<div class="deskflow__row deskflow__row--in">
              <span class="deskflow__arrow">←</span>
              <span><b>${h.fromName}</b> ${h.finding}</span></div>`)}
            ${map(devir.out, h => html`<div class="deskflow__row deskflow__row--out">
              <span class="deskflow__arrow">→</span>
              <span><b>${h.toName}</b> ${h.finding}</span></div>`)}`,
        })] : []),

        K.Entry({
          label:'KONUŞMA',
          meta:mesajlar.length + ' mesaj',
          action:when(mesajlar.length, () => K.Button({ label:'Geçmişi temizle', size:'sm',
            act:'clear-chat' })),
          wide:true,
          body:html`
            <div class="chat">
              ${mesajlar.length
                ? map(mesajlar.slice(-20), msgRow)
                : html`<p class="small muted">Henüz konuşma yok.
                    ${hazir ? '' : 'Model bağlı değil: cevaplar kural motorundan gelir.'}</p>`}
            </div>
            <div class="composer mt-10">
              ${K.Textarea({ id:'chat-input', rows:2, class:'composer__input',
                aria:'Ajana sorun', placeholder:'Sorunu yaz…' })}
              ${K.Mic({ target:'chat-input' })}
              ${K.Button({ label:'Gönder', tone:'primary', act:'send-chat' })}
            </div>`,
        }),

        K.Entry({
          label:'BRİFİNG', hint:'brief',
          meta:'ajanın gördüğü tek şey',
          note:'Ham ses kaydı, tam taslak metni ve notun kendi cümlesi buraya '
             + 'girmez — yalnızca ölçülmüş metrikler ve durum etiketleri.',
          wide:true,
          body:K.Collapsible({
            title:'Ham brifing (JSON)',
            act:'toggle-brief',
            open:!!S.ui.briefOpen,
            body:html`<pre class="jsonbox">${JSON.stringify(brf, null, 2)}</pre>`,
          }),
        }),

      ]))}`);
  }

  const handle = {
    async 'pick-agent'(el){
      S.ui.officeAgent = el.dataset.tab;
      ESP.App.render();
    },

    async 'toggle-brief'(){ S.ui.briefOpen = !S.ui.briefOpen; ESP.App.render(); },

    async 'send-chat'(){
      const el = document.getElementById('chat-input');
      const soru = el ? el.value.trim() : '';
      if(!soru) return;
      if(el) el.value = '';
      const a = agent();
      await ESP.UI.withBusy(async () => {
        await ESP.Office.send(a.id, soru);
      }, 'Yanıt bekleniyor');
      ESP.App.render();
    },

    async 'clear-chat'(){
      await ESP.Office.clearChat(agent().id);
      ESP.App.render();
    },
  };

  const change = {};

  return {
    id:'team',
    title:'Danışma',
    headline(){
      const a = agent();
      return a.name + ' — ' + a.role.toLocaleLowerCase('tr-TR') + '.';
    },
    lede(){
      const a = agent();
      return ESP.Office.ready(a.id)
        ? 'Model bağlı. Her cümlenin altında kaynağı yazar.'
        : 'Model bağlı değil: cevaplar doğrudan kural motorundan gelir ve '
          + '«kural motoru» rozetiyle durur.';
    },
    stats(){
      const a = agent();
      const m = S.officeChats[a.id] || [];
      return [
        { value:String(m.length), label:'mesaj' },
        { value:String(ESP.Office.notes(a.id).length), label:'bulgu' },
        { value:String(ESP.Office.handoffsFor(a.id).in.length), label:'gelen devir' },
        { value:String(ESP.Office.handoffsFor(a.id).out.length), label:'giden devir' },
      ];
    },
    subtitle(){ return agent().title; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/meeting.js ==== */
/* Toplantı — gündem seçilir, altı uzman konuşur, Patron kapatır.

   Her tur AYRI bir çağrıdır ve geldiği anda ekrana basılır; hepsinin
   bitmesi beklenmez. Uzun süren bir toplantıda kullanıcı ilerlemeyi görür.

   Kapanıştaki karar ESP.Planner.nextAction()'dan gelir. Patron onu
   DEĞİŞTİREMEZ, yalnızca gerekçelendirir — model «bunun yerine şunu yap»
   derse tutanaktaki eylem yine kural motorununkidir.

   Gündemi de model seçmez: ESP.Office.agendaCandidates() içindeki puanlama
   seçer. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.meeting = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C;

  /* Devam eden toplantinin turlari burada birikir: gelen her tur hemen
     cizilir, tutanak sonda kaydedilir. */
  let canli = null;

  function agendaRows(){
    const adaylar = ESP.Office.agendaCandidates();
    const secili = S.ui.meetingAgenda || adaylar[0].id;

    return K.Entry({
      label:'GÜNDEM',
      meta:adaylar.length + ' aday',
      note:'Gündemi model seçmez: puanlama seçer. En yüksek puanlı aday '
         + 'varsayılan olarak işaretlidir.',
      body:html`
        <div class="picks">
          ${map(adaylar, a => K.PickCard({
            on:a.id === secili, act:'pick-agenda', data:{ 'data-id':a.id },
            title:a.label, note:a.detail || a.lead,
          }))}
        </div>
        <div class="row mt-12">
          ${K.Button({ label:'Toplantıyı başlat', tone:'primary', act:'run-meeting',
            disabled:!!canli })}
          ${when(canli, () => K.Badge({ label:'devam ediyor', tone:'info' }))}
        </div>`,
    });
  }

  function liveRows(){
    if(!canli) return [];
    return [K.Entry({
      label:'TOPLANTI',
      meta:canli.turns.length + '/' + (ESP.AGENTS.length - 1) + ' tur',
      note:'Her tur geldiği anda basılır; hepsinin bitmesi beklenmez.',
      wide:true,
      body:html`
        ${map(canli.turns, t => turnRow(t))}
        ${when(!canli.done, () => K.Skeleton({ rows:2 }))}`,
    })];
  }

  function turnRow(t){
    const a = ESP.AGENT_BY_ID[t.agentId];
    return html`
      <div class="meetturn">
        <div class="meetturn__head">
          <span class="agentav" style="background:${a ? a.color : 'var(--agent-patron)'}"
            aria-hidden="true">${a ? a.initial : '?'}</span>
          <b>${t.name}</b>
          ${K.Badge({ label:t.source === 'model' ? 'model' : 'kural motoru',
            tone:t.source === 'model' ? 'info' : 'muted', icon:false })}
          ${when(t.blocked, () => K.Badge({ label:'kurallara takıldı', tone:'warn' }))}
        </div>
        <p>${t.text}</p>
      </div>`;
  }

  function minutesRows(){
    const liste = S.officeMeetings || [];
    if(!liste.length){
      return [K.Entry({ label:'TUTANAKLAR', meta:'yok',
        body:K.Empty({ text:'Henüz toplantı yapılmadı.' }) })];
    }
    return liste.slice(0, 10).map(m => K.Entry({
      label:'TUTANAK',
      meta:U.fmtDate(m.at.slice(0, 10)) + ' · ' + m.agendaLabel,
      note:m.decision ? 'Karar: ' + m.decision.title : '',
      action:K.Button({ label:S.ui.meetingOpen === m.id ? 'Kapat' : 'Aç', size:'sm',
        act:'toggle-minutes', data:{ 'data-id':m.id } }),
      wide:true,
      body:S.ui.meetingOpen === m.id
        ? html`
          ${map(m.turns, turnRow)}
          ${when(m.closing, () => html`
            <div class="meetturn meetturn--close">
              <div class="meetturn__head"><b>Patron</b>
                ${K.Badge({ label:m.closing.source === 'model' ? 'model' : 'kural motoru',
                  tone:m.closing.source === 'model' ? 'info' : 'muted', icon:false })}</div>
              <p>${m.closing.text}</p>
            </div>`)}
          ${when(m.decision, () => html`
            <div class="row mt-10">
              ${K.Button({ label:'Kararı takibe al', size:'sm', act:'track-decision',
                data:{ 'data-id':m.id } })}
              ${when(m.decision.route, () => K.Button({ label:'Ekranı aç', size:'sm',
                act:'go', data:{ 'data-route':m.decision.route } }))}
            </div>`)}`
        : html`<p class="small muted">${m.turns.length} tur ·
            ${m.closing ? 'kapanış var' : 'kapanış yok'}</p>`,
    }));
  }

  function decisionRows(){
    const acik = M.openDecisions();
    if(!acik.length) return [];
    return [K.Entry({
      label:'TAKİPTEKİ KARARLAR',
      meta:acik.length + ' açık',
      note:'Karar vermek değil, kararın ne yaptığını görmek sistemi ilerletir. '
         + 'Bu yüzden kapatırken sonuç yazılır.',
      wide:true,
      body:html`${map(acik, d => html`
        <div class="decision">
          <p>${d.text}</p>
          <div class="row wrap mt-8">
            <span class="tiny dim">${U.fmtShort(d.openedAt.slice(0, 10))} tarihinde açıldı</span>
            ${K.Input({ id:'dec-' + d.id, placeholder:'Ne değişti? (ölçümle)', size:'sm' })}
            ${K.Button({ label:'Kapat', size:'sm', act:'close-decision',
              data:{ 'data-id':d.id } })}
          </div>
        </div>`)}`,
    })];
  }

  function render(){
    return K.Grid(html`
      ${K.Span(12, K.Ledger(() => [
        agendaRows(),
        ...liveRows(),
        ...decisionRows(),
        ...minutesRows(),
      ]))}`);
  }

  const handle = {
    async 'pick-agenda'(el){ S.ui.meetingAgenda = el.dataset.id; ESP.App.render(); },

    async 'run-meeting'(){
      if(canli) return;
      const adaylar = ESP.Office.agendaCandidates();
      const id = S.ui.meetingAgenda || adaylar[0].id;
      canli = { turns:[], done:false };
      ESP.App.render();

      try{
        const rec = await ESP.Office.runMeeting(id, tur => {
          canli.turns.push(tur);
          ESP.App.render();
        });
        canli.done = true;
        S.ui.meetingOpen = rec.id;
        ESP.UI.toast('Toplantı bitti');
      }catch(e){
        console.error(e);
        ESP.UI.toast('Toplantı tamamlanamadı');
      }finally{
        canli = null;
        ESP.App.render();
      }
    },

    async 'toggle-minutes'(el){
      S.ui.meetingOpen = S.ui.meetingOpen === el.dataset.id ? null : el.dataset.id;
      ESP.App.render();
    },

    async 'track-decision'(el){
      const m = (S.officeMeetings || []).find(x => x.id === el.dataset.id);
      if(!m || !m.decision) return;
      await M.saveDecision({ text:m.decision.title, agentId:'patron', source:'meeting' });
      ESP.Memo.bitir();
      ESP.UI.toast('Karar takibe alındı');
      ESP.App.render();
    },

    async 'close-decision'(el){
      const inp = document.getElementById('dec-' + el.dataset.id);
      const sonuc = inp ? inp.value.trim() : '';
      if(!sonuc){
        ESP.UI.toast('Sonuç yazılmadan karar kapanmaz');
        return;
      }
      await M.closeDecision(el.dataset.id, sonuc);
      ESP.Memo.bitir();
      ESP.App.render();
    },
  };

  const change = {};

  return {
    id:'meeting',
    title:'Toplantı',
    headline(){
      const a = ESP.Office.agendaCandidates()[0];
      return a ? 'Gündem: ' + a.label.toLocaleLowerCase('tr-TR') + '.' : 'Toplantı';
    },
    lede(){
      return 'Altı uzman sırayla konuşur, Patron kapatır. Kapanıştaki karar '
           + 'kural motorundan gelir; Patron onu değiştiremez, gerekçelendirir.';
    },
    stats(){
      return [
        { value:String((S.officeMeetings || []).length), label:'toplantı' },
        { value:String(M.openDecisions().length), label:'açık karar' },
        { value:String(ESP.Office.agendaCandidates().length), label:'gündem adayı' },
      ];
    },
    subtitle(){ return (S.officeMeetings || []).length + ' tutanak'; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/analytics.js ==== */
/* Analiz — entelektüel sermaye radarı, seriler ve haftalık rapor.

   Üç sekme: Radar · Seriler · Rapor.

   Burada tek bir kural her şeyi belirler: KORELASYON NEDENSELLİK GİBİ
   YAZILMAZ. Bulgu daima «birlikte hareket ediyor» diliyle kurulur ve
   ölçülmemiş bir eksen sıfıra çekilmez.

   Haftalık rapor iyi haberi kötü haberin arkasına saklamaz: kötü olan önce
   söylenir, sonra «fakat» gelir. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.analytics = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C, P = ESP.Parts;

  const TABS = [
    { id:'radar',   label:'Radar' },
    { id:'seriler', label:'Seriler' },
    { id:'rapor',   label:'Rapor' },
  ];

  /* ------------------------------------------------------------------ radar */

  function radarRows(){
    const pencere = S.ui.radarWindow || 14;
    const ehs = ESP.Intellect.ehs(pencere);
    const enBuyuk = ehs.rows.reduce((m, r) =>
      (r.score != null && r.score > m) ? r.score : m, 0);

    const eksenler = ehs.rows.map(r => ({
      label:r.disc.short,
      value:enBuyuk && r.score != null ? r.score / enBuyuk : null,
      cert:r.cert,
    }));

    return [
      K.Entry({
        label:'ENTELEKTÜEL SERMAYE', hint:'ehs',
        meta:ehs.cert === 'missing' ? 'veri yok'
          : U.fmtNum(Math.round(ehs.value * 10) / 10) + ' hacim',
        note:ehs.cert === 'missing'
          ? 'Son ' + pencere + ' günde ölçülmüş pratik yok.'
          : pencere + ' günün ' + ehs.enteredDays + '\'inden hesaplandı. '
            + 'Girilmemiş gün toplama girmez.',
        action:K.Select({ value:String(pencere), change:'radar-window', size:'sm',
          aria:'Ölçüm penceresi',
          options:[{ value:'7', label:'7 gün' }, { value:'14', label:'14 gün' },
            { value:'30', label:'30 gün' }] }),
        wide:true,
        body:html`
          ${P.radar(eksenler, { scale:'Dış halka = bu penceredeki en yüksek disiplin.' })}
          ${K.Table({ tight:true,
            headers:['Disiplin', { label:'Süre', num:true }, { label:'Gün', num:true },
              { label:'Katsayı', num:true }, 'Katsayının kaynağı'],
            rows:ehs.rows.map(r => [
              r.disc.label,
              r.cert === 'missing' ? P.cert('missing') : U.fmtMin(Math.round(r.hours * 60)),
              r.cert === 'missing' ? '—' : String(r.enteredDays),
              r.cert === 'missing' ? '—' : U.fmtNum(Math.round(r.k * 100) / 100),
              r.kWhy,
            ]) })}`,
      }),

      K.Entry({
        label:'DENGE',
        meta:(function(){
          const b = ESP.Planner.balance(7);
          return b.cert === 'missing' ? 'veri yok' : (b.skewed ? 'dengesiz' : 'dengeli');
        })(),
        note:'Yoğunlaşma kasıtlı olabilir; sistem yalnızca görünür kılar, '
           + 'suçlamaz.',
        body:(function(){
          const b = ESP.Planner.balance(7);
          if(b.cert === 'missing'){
            return K.Empty({ text:'Son yedi günde kayıt yok.' });
          }
          return html`
            ${map(b.rows, r => K.Meter({ label:r.disc.label,
              value:r.share == null ? 0 : r.share * 100,
              text:r.cert === 'missing' ? 'veri yok' : U.fmtMin(r.minutes) }))}
            ${when(b.skewed, () => K.Notice({ tone:'info',
              body:'Pratik ' + b.top.label + ' tarafına yığılmış ve '
                + b.untouched.map(d => d.label).join(', ') + ' hiç açılmamış. '
                + 'Bu bir bulgudur, bir hata değil.' }))}`;
        })(),
      }),

      K.Entry({
        label:'HAFTALIK ROTA',
        meta:'öncelik sırasına göre',
        note:'Rota bir takvim değildir: hangi disiplinin öne geçtiğini söyler, '
           + '«salı 19:00» demez. Odak yalnızca eşitliği bozar.',
        body:(function(){
          const r = ESP.Planner.weeklyRoute();
          return html`
            ${K.Table({ tight:true, headers:[{ label:'#', num:true }, 'Disiplin', 'Neden önde'],
              rows:r.rows.map((x, i) => [String(i + 1), x.disc.label,
                x.score >= 100 ? 'Son 7 günde hiç açılmadı'
                  : x.score >= 80 ? 'Tıkanma ya da yaklaşan hedef'
                  : 'Süre payı düşük']) })}
            ${when(r.note, () => K.Notice({ tone:'info', body:r.note }))}`;
        })(),
      }),
    ];
  }

  /* ---------------------------------------------------------------- seriler */

  function seriesRows(){
    const gunler = U.lastDays(30);
    const disipl = S.ui.seriesDisc || 'all';

    /* Girilmemis gun diziye SIFIR olarak girmez: `null` girer ve grafik
       orada kopar. Sifir girseydi "o gun hic calisilmadi" ile "o gun
       girilmedi" ayni gorunurdu. */
    const seri = gunler.map(d => {
      const v = M.minutesOf(d, disipl === 'all' ? null : disipl);
      return v == null ? null : v;
    });
    const olculen = seri.filter(v => v != null);

    return [
      K.Entry({
        label:'GÜNLÜK SÜRE',
        meta:olculen.length + '/' + gunler.length + ' günde kayıt',
        note:'Girilmemiş gün grafikte boşluktur, sıfır değildir. '
           + 'Ortalama yalnızca kayıtlı günlerden hesaplanır.',
        action:K.Select({ value:disipl, change:'series-disc', size:'sm',
          aria:'Disiplin süzgeci',
          options:[{ value:'all', label:'Tümü' }]
            .concat(ESP.DISCIPLINES.map(d => ({ value:d.id, label:d.short }))) }),
        wide:true,
        body:olculen.length
          ? html`
            ${raw(ESP.UI.barChart(
              seri.map((v, i) => ({ label:i % 3 ? '' : gunler[i].slice(5), value:v })),
              { max:Math.max(60, Math.ceil(Math.max.apply(null, olculen) / 30) * 30),
                goodAt:0 }))}
            <p class="small muted mt-8">
              Ortalama ${U.fmtMin(Math.round(olculen.reduce((a, b) => a + b, 0) / olculen.length))}
              — ${olculen.length} kayıtlı günden hesaplandı, 30 günden değil.</p>`
          : K.Empty({ text:'Son 30 günde kayıt yok.' }),
      }),

      K.Entry({
        label:'SERİ', hint:'streak',
        meta:M.streak() + ' gün',
        note:'Seri bir hedef değil bir gözlemdir. Hiç girilmemiş gün seriyi '
           + 'kırar; «0 dakika» girilen gün de kırar — ikisi ayrı şeydir.',
        body:html`
          ${K.Meter({ label:'Üst üste kayıtlı gün', value:Math.min(100, M.streak() / 30 * 100),
            text:M.streak() + ' gün' })}
          <p class="small muted mt-8">Bugün henüz girilmediyse seri kırılmış
            sayılmaz: gün bitmedi.</p>`,
      }),

      K.Entry({
        label:'RETANSİYON', hint:'retention',
        meta:(function(){
          const r = ESP.SRS.retention();
          return r.cert === 'missing' ? 'veri yok' : '%' + Math.round(r.value * 100);
        })(),
        note:'Hiç cevaplanmamış kart bu ortalamaya girmez.',
        body:(function(){
          const r = ESP.SRS.retention();
          if(r.cert === 'missing'){
            return K.Empty({ text:'Hiç cevaplanmış kart yok.' });
          }
          return html`${K.Meter({ label:r.n + '/' + r.total + ' karttan',
            value:r.value * 100, text:'%' + Math.round(r.value * 100),
            tone:r.value < ESP.Planner.RETENTION_FLOOR ? 'danger' : '' })}`;
        })(),
      }),
    ];
  }

  /* ------------------------------------------------------------------ rapor */

  function reportRows(){
    const cross = ESP.Planner.crossFindings();
    const brf = ESP.Office.patronBrief();
    const gunluk = S.officeBriefings[U.todayISO()];

    return [
      K.Entry({
        label:'HAFTALIK RAPOR',
        meta:'kural motorundan',
        note:'İyi haber kötü haberin arkasına saklanmaz: kötü olan önce söylenir.',
        wide:true,
        body:html`<p class="rulesay">${ESP.Office.ruleText('patron', brf)}</p>`,
      }),

      K.Entry({
        label:'ÇAPRAZ BULGULAR',
        meta:cross.length ? cross.length + ' bulgu' : 'yok',
        note:'İki AYRI masanın verisi birlikte anlam kazandığında çıkar. '
           + '«Birlikte hareket ediyor» denir, «sebep oldu» denmez.',
        wide:true,
        body:cross.length
          ? html`${map(cross, c => html`
              <div class="crossrow">
                <div class="crossrow__pair">
                  ${P.avatar(c.from, 'sm')}
                  <span class="crossrow__arrow">→</span>
                  ${P.avatar(c.to, 'sm')}
                </div>
                <p>${c.text}</p>
                ${when(c.route, () => K.Button({ label:'Aç', size:'sm', act:'go',
                  data:{ 'data-route':c.route } }))}
              </div>`)}`
          : K.Empty({ text:'İki masayı birbirine bağlayan ölçülmüş bir bulgu yok.' }),
      }),

      K.Entry({
        label:'GÜNÜN BRİFİNGİ',
        meta:gunluk ? (gunluk.source === 'model' ? 'model' : 'kural motoru') : 'üretilmedi',
        note:'Günde tek model çağrısı. Sonuç güne yazılır; aynı gün tekrar '
           + 'çağrılmaz.',
        action:K.Button({ label:gunluk ? 'Yeniden üret' : 'Üret', size:'sm',
          act:'gen-briefing' }),
        body:gunluk
          ? html`<p class="rulesay">${gunluk.text}</p>`
          : K.Empty({ text:'Bugün için brifing üretilmedi.' }),
      }),

      K.Entry({
        label:'SINIR', hint:'pedagogic',
        meta:'ne söylenmez',
        body:html`
          ${K.Notice({ tone:'info', body:ESP.PEDAGOGIC.disclaimer })}
          ${K.Table({ tight:true, headers:['Denetim', 'Ne arar'],
            rows:ESP.PEDAGOGIC.never.map(n => [n.label, n.note]) })}`,
      }),
    ];
  }

  /* ------------------------------------------------------------------ çizim */

  function render(){
    const tab = S.ui.analyticsTab || 'radar';
    const rows = tab === 'seriler' ? seriesRows()
      : tab === 'rapor' ? reportRows()
      : radarRows();

    return K.Grid(html`
      ${K.Span(12, K.Toolbar({
        tabs:K.Subtabs({ value:tab, act:'ana-tab', aria:'Analiz sekmeleri', items:TABS }),
      }))}
      ${K.Span(12, K.Ledger(() => rows))}`);
  }

  const handle = {
    async 'ana-tab'(el){ S.ui.analyticsTab = el.dataset.tab; ESP.App.render(); },

    async 'gen-briefing'(){
      delete S.officeBriefings[U.todayISO()];
      await ESP.UI.withBusy(async () => {
        await ESP.Office.dailyBriefing();
      }, 'Brifing üretiliyor');
      ESP.App.render();
    },
  };

  const change = {
    async 'radar-window'(el){ S.ui.radarWindow = Number(el.value) || 14; ESP.App.render(); },
    async 'series-disc'(el){ S.ui.seriesDisc = el.value; ESP.App.render(); },
  };

  return {
    id:'analytics',
    title:'Analiz',
    headline(){
      const b = ESP.Planner.balance(7);
      if(b.cert === 'missing') return 'Ölçülecek veri yok.';
      if(b.skewed) return 'Haftanın pratiği ' + b.top.label + ' tarafına yığılmış.';
      const c = ESP.Planner.crossFindings();
      if(c.length) return c.length + ' çapraz bulgu var.';
      return 'Dağılım dengeli.';
    },
    lede(){
      const ehs = ESP.Intellect.ehs(14);
      return ehs.cert === 'missing'
        ? 'Son 14 günde ölçülmüş pratik yok; hacim hesaplanmadı.'
        : 'Entelektüel hacim ' + U.fmtNum(Math.round(ehs.value * 10) / 10)
          + ' — 14 günün ' + ehs.enteredDays + '\'inden hesaplandı.';
    },
    stats(){
      const ehs = ESP.Intellect.ehs(14);
      const ss = ESP.Intellect.syntopic();
      const r = ESP.SRS.retention();
      return [
        { value:ehs.cert === 'missing' ? '—' : U.fmtNum(Math.round(ehs.value)), label:'hacim' },
        { value:ss.cert === 'missing' ? '—' : U.fmtNum(Math.round(ss.value * 100) / 100), label:'SSK' },
        { value:r.cert === 'missing' ? '—' : '%' + Math.round(r.value * 100), label:'retansiyon' },
        { value:String(ESP.Planner.crossFindings().length), label:'çapraz bulgu' },
      ];
    },
    subtitle(){ return 'son 14 gün'; },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/profile.js ==== */
/* Profil — kişi, odak, görünüm ve veri.

   Burada sorulan her alanın karşılığı vardır ve karşılığı yazar. Sorulmayan
   şey de kasıtlıdır: yaş, cinsiyet, kilo. Hiçbir hesap bunlara dayanmaz —
   retansiyon, temiz BPM ve okunabilirlik kişisel ölçüden bağımsızdır.

   Profil geçişi sayfayı yeniden yükler: yarım kalmış bir yazma işleminin
   yanlış profile düşmesi böylece imkânsızdır. */

window.ESP = window.ESP || {};
ESP.Screens = ESP.Screens || {};

ESP.Screens.profile = (function(){
  const U = ESP.U, M = ESP.Model, S = ESP.S;
  const { html, raw, when, map } = ESP.h;
  const K = ESP.C;

  function render(){
    const p = S.profile || {};
    const ayak = M.dataFootprint();
    const yedek = M.backupAgeDays();
    const profiller = M.profileList();

    return K.Grid(html`
      ${K.Span(12, K.Ledger(() => [

        K.Entry({
          label:'KİŞİ',
          meta:p.name || 'adsız',
          note:'Ad yalnızca sana seslenmek için tutulur ve hiçbir modele gönderilmez.',
          body:html`
            <div class="cols-3">
              ${K.Field({ label:'Ad',
                input:K.Input({ id:'pf-name', value:p.name || '' }) })}
              ${K.Field({ label:'Odak', hint:'eşit skorlu iki iş çıkarsa sırayı belirler',
                input:K.Select({ id:'pf-focus', value:p.focus || 'balanced',
                  options:ESP.FOCUS.map(f => ({ value:f.id, label:f.label })) }) })}
              ${K.Field({ label:'Enstrüman',
                input:K.Input({ id:'pf-instrument', value:p.instrument || '' }) })}
            </div>
            <div class="cols-2 mt-10">
              ${K.Field({ label:'Çalışılan dil',
                input:K.Select({ id:'pf-lang', value:(p.langs && p.langs[0]) || 'en',
                  options:ESP.LANGS.map(l => ({ value:l.id, label:l.label })) }) })}
              ${K.Field({ label:'Günlük pratik tabanı (dakika)',
                hint:'hedef değil ölçüt',
                input:K.Input({ id:'pf-minutes', type:'number', numeric:true, min:10, max:600,
                  value:p.dailyMinutes || 60 }) })}
            </div>
            ${K.Button({ label:'Kaydet', tone:'primary', act:'save-profile', class:'mt-10' })}
            <p class="small muted mt-10">
              ${(ESP.FOCUS.find(f => f.id === (p.focus || 'balanced')) || {}).note || ''}</p>`,
        }),

        K.Entry({
          label:'GÖRÜNÜM',
          meta:(S.prefs && S.prefs.palette) || 'kağıt',
          note:'Aynı üç tercih üst çubuktaki palet düğmesinden de açılır. '
             + 'Palet rengi, düzen iskeleti değiştirir; durum renkleri ikisinden de '
             + 'etkilenmez.',
          body:html`
            <div class="cols-3">
              ${K.Field({ label:'Tema',
                input:K.Select({ id:'pf-theme', value:(S.prefs && S.prefs.theme) || 'system',
                  options:[{ value:'system', label:'Sistem' }, { value:'light', label:'Açık' },
                    { value:'dark', label:'Koyu' }] }) })}
              ${K.Field({ label:'Palet',
                input:K.Select({ id:'pf-palette', value:(S.prefs && S.prefs.palette) || 'kagit',
                  options:(ESP.PALETTES || []).map(x => ({ value:x.id, label:x.label })) }) })}
              ${K.Field({ label:'Düzen',
                input:K.Select({ id:'pf-design', value:(S.prefs && S.prefs.design) || 'defter',
                  options:(ESP.DESIGNS || []).map(x => ({ value:x.id, label:x.label })) }) })}
            </div>
            ${K.Button({ label:'Uygula', act:'save-view', class:'mt-10' })}`,
        }),

        K.Entry({
          label:'PROFİLLER',
          meta:profiller.length + ' profil',
          note:'Her profil kendi depo anahtarında yaşar (esp.v1.<profil>). '
             + 'Profil geçişi sayfayı yeniden yükler.',
          body:html`
            ${K.Table({ tight:true, headers:['Profil', 'Durum', ''],
              rows:profiller.map(x => [
                x.name || x.id,
                x.id === M.activeProfileId() ? 'açık' : '—',
                html`${when(x.id !== M.activeProfileId(), () => html`
                  ${K.Button({ label:'Geç', size:'sm', act:'switch-profile',
                    data:{ 'data-id':x.id } })}
                  ${K.Button({ label:'Sil', size:'sm', act:'remove-profile',
                    data:{ 'data-id':x.id } })}`)}`,
              ]) })}
            <div class="row mt-10">
              ${K.Input({ id:'pf-new', placeholder:'Yeni profil adı',
                aria:'Yeni profil adı' })}
              ${K.Button({ label:'Ekle', act:'add-profile' })}
            </div>`,
        }),

        K.Entry({
          label:'MODEL',
          meta:ESP.Office.ready('patron') ? 'bağlı' : 'bağlı değil',
          note:'Model bir iyileştirmedir, gereklilik değil: kapalıyken ofis '
             + 'kural motorunun cümlesiyle çalışmaya devam eder.',
          action:K.Button({ label:'Rehberde ayarla', size:'sm', act:'go',
            data:{ 'data-route':'guide' } }),
          body:K.Notice({ tone:'info',
            body:'API anahtarı yalnızca tarayıcıda, uygulama verisinden ayrı bir '
              + 'anahtarda durur. Yedeğe girmez, buluta gitmez, modele gönderilmez.' }),
        }),

        K.Entry({
          label:'VERİ',
          meta:ayak.bytes ? Math.round(ayak.bytes / 1024) + ' KB' : '—',
          note:yedek == null ? 'Henüz yedek alınmadı.'
            : yedek + ' gün önce yedeklendi.',
          body:html`
            ${when(ayak.pct != null, () => K.Meter({ label:'Yerel kota',
              value:ayak.pct, text:'%' + ayak.pct }))}
            <div class="row wrap mt-10">
              ${K.Button({ label:'Yedek indir', act:'export-data' })}
              ${K.Button({ label:'Yedekten yükle', act:'import-data' })}
            </div>
            ${when(M.backupDue(), () => K.Notice({ tone:'warn',
              body:'Yedek otuz günden eski. Veri bu cihazda tutuluyor; '
                + 'cihaz kaybolursa veri de kaybolur.' }))}`,
        }),

        K.Entry({
          label:'SINIR', hint:'pedagogic',
          meta:'değişmez',
          body:html`
            ${K.Notice({ tone:'info', body:ESP.PEDAGOGIC.disclaimer })}
            <p class="small muted mt-8">${ESP.PEDAGOGIC.level}</p>`,
        }),

      ]))}`);
  }

  function val(id){ const el = document.getElementById(id); return el ? el.value.trim() : ''; }

  const handle = {
    async 'save-profile'(){
      const ad = val('pf-name');
      if(!ad){ ESP.UI.toast('Ad boş olamaz'); return; }
      await M.saveProfile({
        name:ad,
        focus:val('pf-focus') || 'balanced',
        instrument:val('pf-instrument'),
        langs:[val('pf-lang') || 'en'],
        dailyMinutes:Number(val('pf-minutes')) || 60,
      });
      ESP.Memo.bitir();
      ESP.UI.toast('Kaydedildi');
      ESP.App.render();
    },

    async 'save-view'(){
      await M.savePrefs({
        theme:val('pf-theme'), palette:val('pf-palette'), design:val('pf-design'),
      });
      ESP.App.applyTheme();
      ESP.UI.toast('Uygulandı');
      ESP.App.render();
    },

    async 'add-profile'(){
      const res = M.addProfile(val('pf-new'));
      if(!res.ok){ ESP.UI.toast(res.error); return; }
      ESP.UI.toast('Profil eklendi');
      ESP.App.render();
    },

    async 'switch-profile'(el){
      M.switchProfile(el.dataset.id);
    },

    async 'remove-profile'(el){
      const id = el.dataset.id;
      ESP.UI.confirmSheet('Profil silinsin mi?',
        'Bu profilin bütün verisi bu cihazdan kalkar ve geri alınamaz.',
        () => {
          const res = M.removeProfile(id);
          if(!res.ok){ ESP.UI.toast(res.error); return; }
          ESP.App.render();
        }, true);
    },

    async 'export-data'(){
      const veri = await ESP.Store.exportAll();
      const blob = new Blob([JSON.stringify(veri, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'esp-yedek-' + U.todayISO() + '.json';
      a.click();
      URL.revokeObjectURL(a.href);
      await M.markBackup();
      ESP.UI.toast('Yedek indirildi');
      ESP.App.render();
    },

    async 'import-data'(){
      ESP.UI.toast('Yedekten yükleme Rehber → Veri sekmesinde');
      S.ui.guideTab = 'veri';
      ESP.App.go('guide');
    },
  };

  const change = {};

  return {
    id:'profile',
    title:'Profil',
    headline(){
      const p = S.profile || {};
      return p.name ? p.name + ' — ' + ((ESP.FOCUS.find(f => f.id === p.focus) || {}).label
        || 'dengeli').toLocaleLowerCase('tr-TR') + ' odak.' : 'Profil henüz doldurulmadı.';
    },
    lede(){
      return 'Yaş, cinsiyet ve kilo sorulmaz: hiçbir hesap bunlara dayanmıyor. '
           + 'Sorulan tek şey ne çalıştığın.';
    },
    stats(){
      const ayak = M.dataFootprint();
      const yedek = M.backupAgeDays();
      return [
        { value:String(M.profileList().length), label:'profil' },
        { value:ayak.bytes ? String(Math.round(ayak.bytes / 1024)) : '—', unit:'KB', label:'veri' },
        { value:yedek == null ? '—' : String(yedek), unit:'gün', label:'son yedek' },
      ];
    },
    subtitle(){ return M.activeProfileId(); },
    actions(){ return ''; },
    render, handle, change,
  };
})();
