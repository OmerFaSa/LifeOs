     `python3 tools/seviye.py --yay` ile uretilir; ELLE DUZENLEME -->
<!-- MARKA GİRİŞİ — logo videosu, geçilebilir.

     Perde burada DURAĞAN durur; sayfanın ilk boyamasında görünür.
     JavaScript'i beklemek, açılışta bir kare boş ekran demekti.
     Davranışı (ses, «Geç» halkası, Esc, odak hapsi, hata durumunda
     kapanma) `js/core/perde.js` takar — seviye kutlamasıyla AYNI koddur.

     Gerçek açılışı (aşağıdaki .boot) ETKİLEMEZ: ayrı, üstte duran bir
     katmandır; ikisi paralel çalışır, biri diğerini beklemez.

     LOGO, VİDEO DEĞİL. Önce `img/brand/intro.mp4` oynuyordu; depo
     sahibi kaldırdı: «bölüm girişlerindeki o giriş videosunu kaldır,
     bu logolar sadece». Video sekiz saniye tutuyordu, logo ÜÇ saniye
     durur — bir açılış ekranı bilgilendirmez, yalnız kimliği söyler;
     üç saniye onu söylemeye yeter, sekiz saniye beklemeye başlar.

     Dosya `img/marka/kimlik-ays.webp` — her sistem kendi logosunu
     gösterir ve ad yer tutucudan gelir, üç yerde ayrı yazılmaz. -->
<div id="marka-perde" class="perde perde--marka" role="dialog" aria-modal="true"
  aria-label="Marka girişi">
  <!-- Bulanık arka kopya: logonun kendi rengi zemine sızsın, kenarı
       keskin bir daire gibi durmasın. -->
  <img class="perde__ortam" src="img/marka/kimlik-ays.webp" alt=""
    aria-hidden="true" onerror="this.remove()">
  <img class="perde__logo" src="img/marka/kimlik-ays.webp" alt=""
    aria-hidden="true" onerror="this.remove()">
  <div class="perde__araclar">
    <!-- Ses düğmesi YOK: logonun sesi yoktur. Video kalkınca onunla
         birlikte kalktı. -->
    <button class="perde__dugme perde__gec" type="button" aria-label="Geç (Esc)" title="Geç — Esc">
      <span class="perde__gec-halka" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle class="perde__gec-iz" cx="16" cy="16" r="14"/>
          <circle class="perde__gec-yol" cx="16" cy="16" r="14"/></svg>
        <span class="perde__gec-sayi">·</span></span>
      <span class="perde__gec-yazi">Geç</span>
    </button>
  </div>
</div>
<!-- Perde modulu markupin HEMEN ARDINDAN yuklenir. <head>'de blokleyici
     bir betik olarak durursa, durağan perdenin ilk boyamasını da o
     geciktirir — yani markupin durağan olmasinin sebebini ortadan
     kaldirirdi. -->
<script src="js/core/perde.js"></script>
<script>
(function(){
  var el = document.getElementById('marka-perde');
  if(!el) return;
  /* Hareket azaltma tercihinde marka girisi HIC gorunmez: videonun
     tasidigi bilgi yok, tercihe kurban edilecek bir sey de yok. */
  try{
    if(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches){
      if(el.parentNode) el.parentNode.removeChild(el);
      return;
    }
  }catch(e){}
  /* KURTARMA: Perde modulu hic yuklenmezse (betik hatasi, engellenmis
     dosya) perde uygulamayi rehin almasin. */
  var kurtarma = setTimeout(function(){
    if(el.parentNode) el.parentNode.removeChild(el);
  }, 14000);
  /* Kaynak surumde ustteki <script src> bu satira gelinmeden calismis
     olur ve dongu ILK denemede biter. TEK DOSYA surumunde (dist) ise
     build.py butun <script src>'leri govdenin ARDINA tasir: orada
     Perde bu betikten SONRA tanimlanir ve bekleme gercekten calisir.
     Iki surumun tek markupla yasamasinin bedeli bu kucuk dongudur. */
  var deneme = 0;
  (function bekle(){
    if(window.R && R.Perde){
      clearTimeout(kurtarma);
      R.Perde.baglan(el, { enAz:3000 });
      return;
    }
    if(++deneme > 400) return;   /* ~12 sn; kurtarma zamanlayicisi devrede */
    setTimeout(bekle, 30);
  })();
})();
</script>
