name: iOS uygulaması

# Telefon kabuğu (uygulama/ios): macOS makinesinde derlenir, iPhone
# simülatöründe sınanır, imzasız IPA üretilir. IPA'yı AltStore (ya da
# Sideloadly) kullanıcının kendi Apple kimliğiyle imzalar. Ayrıntı:
# belgeler/UYGULAMA.md. Depo herkese açık: macOS makinesi ücretsizdir.

on:
  push:
    branches: [main]
    paths:
      - 'uygulama/ios/**'
      # Telefonun giris sayfasi derlemede buradan uretilir (hazirla.py giris_html).
      - 'sistem/sunucu.py'
      - 'brand/ortak/hesap.js'
      - 'brand/ortak/hesap.css'
      - 'brand/ortak/animasyon.js'
      - 'AYS/dist/**'
      - 'SPI/dist/**'
      - 'ESP/dist/**'
      - 'brand/life/logo.png'
      - 'brand/seviye/medya/**'
      - 'brand/medya/**'
      - '.github/workflows/ios.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios
  cancel-in-progress: true

jobs:
  ios:
    name: iOS — derle, simülatörde sına, IPA üret
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen kur (yalnız derleme aracı)
        run: brew install xcodegen

      - name: Sayfaları uygulamaya hazırla (dist → Web, ortak görsel tek kopya)
        run: python3 uygulama/ios/hazirla.py

      - name: AltStore kaynağı üreticisi sınanır
        run: python3 uygulama/ios/kaynak_test.py

      - name: Xcode projesini üret
        working-directory: uygulama/ios
        run: xcodegen generate

      - name: Simülatör seç (en yeni iOS, ilk iPhone)
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          surum = lambda k: [int(x) for x in k.split("iOS-")[-1].split("-") if x.isdigit()]
          for k in sorted((k for k in d if "iOS" in k), key=surum, reverse=True):
              for c in d[k]:
                  if c["name"].startswith("iPhone"):
                      print(c["udid"]); sys.exit()
          ')
          echo "Simülatör: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Simülatörde testler (sunucu + üç modül açılır, köken güvenli)
        working-directory: uygulama/ios
        run: |
          set -o pipefail
          xcodebuild test -project LifeOS.xcodeproj -scheme LifeOS \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log \
            | grep -E "Test Case .*(passed|failed)|error:|XCTAssert|Executed|TEST (SUCCEEDED|FAILED)"

      # Günlük indirmek GitHub girişi ister; hata özetleri (annotation) ise
      # herkese açık API'den okunur. Kalan testin satırı oraya yazılır.
      - name: Kalan testleri özetle (herkese açık hata özeti)
        if: failure()
        working-directory: uygulama/ios
        run: |
          grep -E "error: -\[|: error: |Test Case .* failed|Testing failed|TEST FAILED|Fatal error|Crash" test.log \
            | head -20 | sed -e 's/%/%25/g' | while IFS= read -r s; do echo "::error title=iOS testi::${s}"; done
          true

      - name: Test günlüğü
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-gunlugu
          path: uygulama/ios/test.log

      - name: İmzasız IPA üret
        working-directory: uygulama/ios
        run: |
          set -o pipefail
          xcodebuild -project LifeOS.xcodeproj -scheme LifeOS -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            MARKETING_VERSION=0.1.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tail -5
          rm -rf Payload && mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/LifeOS.app Payload/
          zip -qry LifeOS.ipa Payload
          ls -lh LifeOS.ipa

      # AltStore kaynağı: telefonda «Güncelle» düğmesi. İzin metinleri ve sürüm
      # derlenmiş uygulamanın kendi Info.plist'inden okunur (uyuşmazsa AltStore
      # kurmayı reddeder); her derleme kendi numarasını taşır (run_number).
      - name: AltStore kaynağı üret
        working-directory: uygulama/ios
        run: |
          KAYNAK_ACIKLAMA="$(git log -1 --format=%s)" \
            python3 kaynak.py build/Build/Products/Release-iphoneos/LifeOS.app LifeOS.ipa altstore-kaynak.json

      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-ipa
          path: uygulama/ios/LifeOS.ipa
          retention-days: 30

      - name: Sürüm sayfasına koy (telefondan Safari ile indirilir)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOT="Son derleme: $(git rev-parse --short HEAD) · $(date -u +%Y-%m-%d) · derleme ${{ github.run_number }}. Kurulum: belgeler/UYGULAMA.md (AltStore). AltStore kaynağı: https://github.com/OmerFaSa/LifeOs/releases/download/ios-son/altstore-kaynak.json"
          gh release view ios-son >/dev/null 2>&1 \
            || gh release create ios-son --prerelease --title "LifeOS iOS — son derleme" --notes "$NOT"
          gh release upload ios-son uygulama/ios/LifeOS.ipa uygulama/ios/altstore-kaynak.json --clobber
          gh release edit ios-son --notes "$NOT"
