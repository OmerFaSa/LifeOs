  /* Fikir turunda ortaya atilan oneriler — oylamanin secenekleri. */
  function voteOptions(session){
    return (session.turns || [])
      .filter(t => t.roundKey === 'fikir' && t.agent !== 'aday')
      .map((t, i) => ({ n:i + 1, agent:t.agent, name:t.name, text:t.text }));
  }

  /* Ajanin yanitindan sectigi numarayi cikarir. Model numara yazmadiysa
     oy sayilmaz — uydurma bir oy tabloyu bozar. */
  function parseVote(text, count){
    const m = String(text || '').match(/\b([1-9])\b/);
    if(!m) return null;
    const n = Number(m[1]);
    return (n >= 1 && n <= count) ? n : null;
  }

  /* Oy tablosu. Agirlik ajanin GUVEN SKORUNDAN gelir: onerisi tutan ajanin
     oyu daha agir basar. Kural motoru sayar, model saymaz. */
  function tally(session){
    const options = voteOptions(session);
    if(!options.length) return null;
    const votes = (session.turns || []).filter(t => t.roundKey === 'oylama' && t.vote);
    if(!votes.length) return null;

    const rows = options.map(o => ({ n:o.n, agent:o.agent, name:o.name, text:o.text,
      oy:0, agirlik:0, verenler:[] }));
    votes.forEach(v => {
      const row = rows.find(r => r.n === v.vote);
      if(!row) return;
      let w = 1;
      try{
        const t = R.Journal.trust(v.agent);
        if(t.yuzde != null) w = 1 + t.yuzde / 100;
      }catch(e){}
      row.oy++;
      row.agirlik = U.round(row.agirlik + w, 2);
      row.verenler.push(v.name);
    });
    const sorted = rows.slice().sort((a, b) => b.agirlik - a.agirlik || b.oy - a.oy);
    return { rows:sorted, kazanan:sorted[0] && sorted[0].oy ? sorted[0] : null,
      oyVeren:votes.length };
  }

  /* ==================== capraz soru ====================
     Toplantiyi yoklamadan tartismaya cikaran sey: iki masanin verisi
     birbiriyle celisiyorsa Patron ilgili ajana TEK takip sorusu sorar.
     Celiskiyi KURAL MOTORU bulur; model celiski uyduramaz. */

  const CONFLICTS = [
    {
      id:'olcum-davranis', target:'rehber',
      when(){
        const c = C.planCompletion(M.currentWeek());
        return C.analysisDebt().length > 0 && c != null && c >= 85;
      },
      ask(){
        return 'Plan tamamlaması %' + C.planCompletion(M.currentWeek()) + ' ile tutmuş görünüyor '
          + 'ama ' + C.analysisDebt().length + ' deneme analizsiz duruyor. '
          + 'Plan gerçekten tuttu mu, yoksa analiz plana hiç yazılmadı mı?';
      },
    },
    {
      id:'kapanis-net', target:'tyt',
      when(){
        const t = C.medianTrend('TYT');
        return C.examClosure('TYT').pct >= 60 && t.delta != null && t.delta <= -1.5;
      },
      ask(){
        return 'TYT kapanışı %' + C.examClosure('TYT').pct + ' ama medyan '
          + U.fmtNet(Math.abs(C.medianTrend('TYT').delta)) + ' net geriledi. '
          + 'Kapanmış saydığımız konular gerçekten kapandı mı?';
      },
    },
    {
      id:'uyku-hacim', target:'rehber',
      when(){
        const s = C.sleepAverage(7);
        const t = (S.profile && S.profile.sleepTarget) || 7.5;
        const c = C.planCompletion(M.currentWeek());
        return s != null && s < t - 1 && c != null && c >= 85;
      },
      ask(){
        return 'Plan %' + C.planCompletion(M.currentWeek()) + ' tutmuş ama uyku '
          + U.fmtNet(C.sleepAverage(7)) + ' saate düşmüş. '
          + 'Bu tempo uykudan mı ödünç alıyor?';
      },
    },
    {
      id:'kart-borcu', target:'analist',
      when(){ return C.cardDebt() > 15 && C.overallClosure().pct >= 50; },
      ask(){
        return 'Konu kapanışı %' + C.overallClosure().pct + ' ama tekrar borcu %' + C.cardDebt() + '. '
          + 'Kapanan konular tekrar edilmiyorsa kapanış ne kadar gerçek?';
      },
    },
  ];

  function conflicts(){
    const out = [];
    CONFLICTS.forEach(c => {
      let on = false;
      try{ on = !!c.when(); }catch(e){ on = false; }
      if(!on) return;
      let question = '';
      try{ question = c.ask(); }catch(e){ return; }
      out.push({ id:c.id, target:c.target, question,
        name:(R.AGENT_BY_ID[c.target] || {}).name || c.target });
    });
    return out;
  }

  /* Toplantida henuz sorulmamis ilk celiski. */
  function nextConflict(session){
    const asked = (session.turns || []).filter(t => t.conflict).map(t => t.conflict);
    return conflicts().find(c => asked.indexOf(c.id) < 0) || null;
  }

  /* Bir uzmanin konusma sirasi. Toplantida herkes ayni tur icinde bir kez konusur. */
  function speakerAt(index){
    return R.MEETING_ORDER[index % R.MEETING_ORDER.length];
  }

  /* Toplantida o ana kadar soylenenlerin son N tanesi (ajanin baglamı). */
  function saidSoFar(session, limit){
    return session.turns.slice(-(limit || TURN_CONTEXT))
      .map(t => ({ name:t.name, role:t.role, text:t.text }));
  }

  /* Toplantiyi acar: gundem secilir, Patron soz alir. */
  async function openMeeting(opts){
    const o = opts || {};
    resetBriefs();
    const ag = o.agenda || agenda();
    const session = newSession(ag);

    const pending = pendingDecision();
    const turn = await speak('patron', 'opening', {
      messages:[{ role:'user', text:R.OFFICE_PROMPTS.opening(
        { topic:ag.topic, why:ag.why, data:R.Tools.sanitize(ag.data || {}) }, pending) }],
      ctx:{ topic:ag.topic, why:ag.why, pending },
    }, Object.assign({}, o, { maxTokens:BUDGET.opening }));

    turn.round = 0;
    turn.roundTitle = 'Açılış';
    session.turns.push(turn);
    return session;
  }

  /* Siradaki konusmaciyi konusturur. index tur icindeki sirayi verir. */
  async function nextTurn(session, index, opts){
    const o = opts || {};
    const roundNo = Math.floor(index / R.MEETING_ORDER.length) + 1;
    const def = roundDef(roundNo);
    const agentId = speakerAt(index);
    const agent = R.AGENT_BY_ID[agentId];

    resetBriefs();
    const data = compactData(R.Tools.sanitize(brief(agentId).data));
    const options = def.vote ? voteOptions(session) : null;

    const turn = await speak(agentId, 'turn', {
      messages:[{ role:'user', text:R.OFFICE_PROMPTS.turn(agent,
        { topic:session.topic }, data, saidSoFar(session), def, recentSaid(agentId), options) }],
      ctx:{ topic:session.topic, round:def, options },
      /* Toplanti turunda da oneri cikabilir: ofisin masada aldigi karar
         kullanicinin onayina duser, kendiliginden uygulanmaz. */
    }, Object.assign({}, o, { maxTokens:BUDGET.turn, allowAction:true }));

    turn.round = roundNo;
    turn.roundKey = def.key;
    turn.roundTitle = def.title;
    if(def.vote && options && options.length){
      turn.vote = parseVote(turn.text, options.length);
      /* Kural motoru modunda model yok: oy kural motorunun sectigi isin
         sahibine gider, o da yoksa ilk fikre. */
      if(turn.vote == null && turn.mode === 'kural'){
        const owner = R.ACTION_OWNER && R.ACTION_OWNER[nextAction().key];
        const match = options.find(x => x.agent === owner);
        turn.vote = match ? match.n : options[0].n;
        turn.text = turn.vote + '. seçeneği destekliyorum: ' + turn.text;
      }
    }
    session.round = roundNo;
    session.turns.push(turn);
    return turn;
  }

  /* Capraz soru: Patron celiskili masalardan birine takip sorusu sorar,
     o ajan yanitlar. Iki tur harcar; celiski yoksa hic calismaz. */
  async function askCross(session, opts){
    const o = opts || {};
    const conflict = nextConflict(session);
    if(!conflict) return null;

    const patron = R.AGENT_BY_ID.patron;
    const q = await speak('patron', 'cross', {
      messages:[{ role:'user', text:R.OFFICE_PROMPTS.cross(conflict) }],
      ctx:{ topic:session.topic, conflict },
    }, Object.assign({}, o, { maxTokens:BUDGET.cross }));
    q.round = session.round;
    q.roundKey = 'capraz';
    q.roundTitle = 'Çapraz soru';
    q.conflict = conflict.id;
    /* Model yoksa Patron soruyu kural motorunun yazdigi hâliyle sorar. */
    if(q.mode === 'kural') q.text = conflict.name + ', ' + conflict.question;
    session.turns.push(q);
    if(o.onTurn) await o.onTurn(q, session.turns);

    const agent = R.AGENT_BY_ID[conflict.target];
    resetBriefs();
    const data = compactData(R.Tools.sanitize(brief(conflict.target).data));
    const a = await speak(conflict.target, 'answer', {
      messages:[{ role:'user', text:R.OFFICE_PROMPTS.answer(agent, conflict, data,
        saidSoFar(session)) }],
      ctx:{ topic:session.topic, conflict },
    }, Object.assign({}, o, { maxTokens:BUDGET.answer }));
    a.round = session.round;
    a.roundKey = 'capraz';
    a.roundTitle = 'Yanıt';
    a.conflict = conflict.id;
    session.turns.push(a);
    if(o.onTurn) await o.onTurn(a, session.turns);

    return { conflict, question:q, answer:a };
  }

  /* Kullanici soz alir: konusma kaydina girer, sonraki ajanlar bunu gorur. */
  function userTurn(session, text){
    const turn = {
      agent:'aday', name:'Sen', role:'aday', text:String(text || '').trim(),
      warnings:[], mode:'kullanici', round:session.round, roundTitle:'Söz aldın',
    };
    if(!turn.text) return null;
    session.turns.push(turn);
    return turn;
  }

  /* Toplantiyi kapatir: Patron karari gerekcelendirir, rapor uretilir,
     karar takibe alinir ve tutanak kaydedilir. */
  async function closeMeeting(session, opts){
    const o = opts || {};
    resetBriefs();
    const action = nextAction();
    const said = session.turns.slice(1)
      .map(t => ({ name:t.name, role:t.role, text:t.text }));

    const vote = tally(session);
    const closing = await speak('patron', 'closing', {
      messages:[{ role:'user', text:R.OFFICE_PROMPTS.closing(
        { topic:session.topic }, said, action, vote) }],
      ctx:{ topic:session.topic, action, vote },
    }, Object.assign({}, o, { maxTokens:BUDGET.closing }));

    closing.closing = true;
    closing.round = session.round;
    closing.roundTitle = 'Karar';
    session.turns.push(closing);

    const modes = session.turns.filter(t => t.mode !== 'kullanici').map(t => t.mode);
    const meeting = {
      id:session.id,
      at:session.at,
      closedAt:new Date().toISOString(),
      topic:session.topic,
      why:session.why,
      rounds:session.round,
      status:'closed',
      mode:modes.every(m => m === 'llm') ? 'llm' : (modes.some(m => m === 'llm') ? 'karma' : 'kural'),
      promptVersion:R.OFFICE_PROMPTS.version,
      action:{ title:action.title, why:action.why, route:action.route || 'today',
        label:action.label || '' },
      decision:{
        id:session.id, title:action.title, why:action.why,
        route:action.route || 'today', state:'open', at:new Date().toISOString(),
        /* Isin hangi ajanin alanina dustugu: guven skoru bunun uzerinden
           hesaplanir. Kural motorunun is anahtari (Calc.nextAction) tasinir. */
        key:action.key || null,
        owner:(R.ACTION_OWNER && R.ACTION_OWNER[action.key]) || null,
      },
      vote,
      turns:session.turns.map(t => ({ agent:t.agent, name:t.name, role:t.role, text:t.text,
        warnings:t.warnings || [], mode:t.mode, round:t.round || 0,
        roundKey:t.roundKey || '', roundTitle:t.roundTitle || '',
        vote:t.vote || null, conflict:t.conflict || null,
        closing:!!t.closing, error:t.error || null })),
      report:buildReport(session, action, closing, vote),
    };

    await saveMeeting(meeting);
    await rememberTurns(meeting);
    return meeting;
  }

  /* ---------- rapor ----------
     Rapor kural motorunun urettigi bir belgedir: kim ne dedi, hangi tur,
     karar ne. Patron'un kapanis metni ozet olarak basa konur — LLM'e
     ayrica bir rapor yazdirilmaz, boylece fazladan kota harcanmaz. */

  function buildReport(session, action, closing, vote){
    const byAgent = {};
    session.turns.forEach(t => {
      if(t.agent === 'patron' || t.agent === 'aday') return;
      byAgent[t.agent] = byAgent[t.agent] || { name:t.name, role:t.role, lines:[] };
      byAgent[t.agent].lines.push({ round:t.round, roundTitle:t.roundTitle, text:t.text });
    });

    const warnings = [];
    session.turns.forEach(t => (t.warnings || []).forEach(w => {
      if(warnings.indexOf(w) < 0) warnings.push(w);
    }));

    const userSaid = session.turns.filter(t => t.agent === 'aday').map(t => t.text);

    const crossed = session.turns.filter(t => t.roundKey === 'capraz' && t.agent !== 'patron')
      .map(t => ({ ajan:t.name, yanit:t.text }));

    return {
      summary:closing ? closing.text : '',
      topic:session.topic,
      why:session.why,
      vote:vote || null,
      crossed,
      rounds:session.round,
      turnCount:session.turns.length,
      speakers:Object.keys(byAgent).length,
      byAgent,
      userSaid,
      warnings,
      decision:{ title:action.title, why:action.why, route:action.route || 'today' },
      /* Kararin dayandigi sayilar: rapor sonradan okundugunda baglam kalsin. */
      basis:(function(){
        const d = R.Tools.durum();
        return {
          hafta:d.programHaftasi,
          planTamamlama:d.planTamamlama,
          tytMedyan:d.tytMedyan,
          aytMedyan:d.aytMedyan,
          konuKapanisi:d.konuKapanisYuzdesi,
          analizBorcu:d.analizBorcu,
          tekrarBorcu:d.tekrarBorcuYuzdesi,
        };
      })(),
    };
  }

  /* Raporu duz metne cevirir — kopyalanip disariya tasinabilsin. */
  function reportText(meeting){
    const r = meeting.report || {};
    const out = [];
    out.push('TOPLANTI RAPORU — ' + new Date(meeting.at).toLocaleString('tr-TR'));
    out.push('Gündem: ' + meeting.topic);
    if(r.why) out.push('Neden: ' + r.why);
    out.push('');
    out.push('KARAR: ' + meeting.action.title);
    if(meeting.action.why) out.push(meeting.action.why);
    out.push('');
    if(r.summary){ out.push('PATRON’UN KAPANIŞI'); out.push(r.summary); out.push(''); }
    Object.keys(r.byAgent || {}).forEach(id => {
      const a = r.byAgent[id];
      out.push(a.name.toUpperCase() + ' — ' + a.role);
      a.lines.forEach(l => out.push('  · [' + (l.roundTitle || 'tur') + '] ' + l.text));
      out.push('');
    });
    if(r.vote && r.vote.kazanan){
      out.push('OYLAMA');
      r.vote.rows.forEach(row => out.push('  ' + row.n + '. ' + row.name + ' — '
        + row.oy + ' oy (ağırlık ' + row.agirlik + ')'
        + (row.verenler.length ? ' · ' + row.verenler.join(', ') : '')));
      out.push('  Kazanan: ' + r.vote.kazanan.name + ' — ' + r.vote.kazanan.text);
      out.push('');
    }
    if((r.crossed || []).length){
      out.push('ÇAPRAZ SORU');
      r.crossed.forEach(c => out.push('  · ' + c.ajan + ': ' + c.yanit));
      out.push('');
    }
    if((r.userSaid || []).length){
      out.push('SENİN SÖZLERİN');
      r.userSaid.forEach(t => out.push('  · ' + t));
      out.push('');
    }
    if((r.warnings || []).length){
      out.push('KURAL MOTORU UYARILARI');
      r.warnings.forEach(w => out.push('  ! ' + w));
      out.push('');
    }
    const b = r.basis || {};
    out.push('DAYANDIĞI VERİ');
    out.push('  hafta ' + b.hafta + ' · plan %' + (b.planTamamlama == null ? '—' : b.planTamamlama)
      + ' · kapanış %' + b.konuKapanisi
      + ' · analiz borcu ' + b.analizBorcu + ' · tekrar borcu %' + b.tekrarBorcu);
    return out.join('\n');
  }

  /* ---------- karar takibi ----------
     Ofisi "gercek" yapan sey: verilen karar unutulmaz. Bir sonraki
     toplantiyi Patron hesap sorarak acar. */

  function decisions(){
    return meetings()
      .filter(m => m.decision)
      .map(m => Object.assign({}, m.decision, { topic:m.topic, meetingId:m.id }));
  }
  function openDecisions(){ return decisions().filter(d => d.state === 'open'); }
  function pendingDecision(){ return openDecisions()[0] || null; }

  async function closeDecision(id, state){
    const m = (S.officeMeetings || []).find(x => x.id === id);
    if(!m || !m.decision) return null;
    m.decision.state = (state === 'done' || state === 'carried') ? state : 'open';
    /* Yeniden acilan karar kapanma zamanini da birakir: aksi hâlde acik
       ama "kapanmis" gorunen bir kayit kalirdi. */
    m.decision.closedAt = m.decision.state === 'open' ? null : new Date().toISOString();
    await R.Store.set('meetings/' + m.id, m);
    return m.decision;
  }

  /* ---------- ajan hafizasi ----------
     Ajan ayni cumleyi iki toplanti ust uste kurmasin diye son sozleri
     hatirlanir. Koc katmanindaki recentSaid ile ayni fikir. */

  function recentSaid(agentId, limit){
    const out = [];
    meetings().forEach(m => {
      (m.turns || []).forEach(t => {
        if(t.agent === agentId && t.text) out.push({ at:m.at, text:t.text });
      });
    });
    (chatOf(agentId) || []).forEach(msg => {
      if(msg.role !== 'user' && msg.text) out.push({ at:msg.at || '', text:msg.text });
    });
    return out.sort((a, b) => (b.at || '').localeCompare(a.at || ''))
      .slice(0, limit || 3)
      .map(x => String(x.text).slice(0, 180));
  }

  /* Tutanak kaydedildikten sonra hafiza zaten meetings() uzerinden okunur;
     ayrica bir yazma gerekmez. Kanca ileride genisletilebilir diye durur. */
  async function rememberTurns(){ return true; }

  /* ---------- kota ---------- */

  /* Bir ajanin siradaki cagrisi ne zaman yapilabilir? Ekran bunu gosterir. */
  function agentQuota(agentId){
    const chain = chainFor(agentId);
    if(!chain.length) return null;
    const state = R.Quota.check(chain[0]);
    const st = R.Quota.status(chain[0]);
    return {
      waitMs:state.waitMs || 0,
      full:!state.ok && state.reason === 'daily',
      usedToday:st.usedToday, rpd:st.rpd, rpm:st.rpm, known:st.known,
    };
  }

  /* Bir toplanti turu kac saniye surer (kota bosluklariyla)? */
  function roundEstimateMs(agentId){
    const chain = chainFor(agentId || 'patron');
    if(!chain.length) return 0;
    return R.Quota.estimateMs(chain[0], R.MEETING_ORDER.length);
  }

  /* ---------- tek cagriyla toplanti (test ve otomasyon icin) ----------
     Ekran turlu akisi kullanir; bu sarmalayici bir turu acar, kosar, kapatir. */
  async function meet(opts){
    const o = opts || {};
    const session = await openMeeting(o);
    if(o.onTurn) await o.onTurn(session.turns[0], session.turns);
    const count = (o.rounds || 1) * R.MEETING_ORDER.length;
    for(let i = 0; i < count; i++){
      const turn = await nextTurn(session, i, o);
      if(o.onTurn) await o.onTurn(turn, session.turns);
    }
    const meeting = await closeMeeting(session, o);
    if(o.onTurn) await o.onTurn(meeting.turns[meeting.turns.length - 1], session.turns);
    return meeting;
  }

  async function saveMeeting(meeting){
    S.officeMeetings = [meeting].concat((S.officeMeetings || []).filter(m => m.id !== meeting.id))
      .sort((a, b) => (b.at || '').localeCompare(a.at || ''));
    const drop = S.officeMeetings.slice(MEETING_MAX);
    S.officeMeetings = S.officeMeetings.slice(0, MEETING_MAX);
    await R.Store.set('meetings/' + meeting.id, meeting);
    for(const old of drop){
      try{ await R.Store.remove('meetings/' + old.id); }catch(e){}
    }
    return meeting;
  }

  async function deleteMeeting(id){
    S.officeMeetings = (S.officeMeetings || []).filter(m => m.id !== id);
    await R.Store.remove('meetings/' + id);
  }

  function meetings(){ return S.officeMeetings || []; }

  function lastMeeting(){ return meetings()[0] || null; }

  /* ==================== yukleme ==================== */

  async function load(){
    const [cfg, docs, mts] = await Promise.all([
      R.Store.get('office/settings'),
      R.Store.list('office'),
      R.Store.list('meetings'),
    ]);

    S.office = Object.assign(defaultSettings(), cfg || {});

    S.officeChats = {};
    (docs || []).forEach(d => {
      if(String(d.id).indexOf('chat-') !== 0) return;
      const agentId = String(d.id).slice(5);
      if(!R.AGENT_BY_ID[agentId]) return;
      S.officeChats[agentId] = Array.isArray(d.messages) ? d.messages.slice(-CHAT_MAX) : [];
    });

    S.officeMeetings = (mts || [])
      .filter(m => m && Array.isArray(m.turns))
      .sort((a, b) => (b.at || '').localeCompare(a.at || ''))
      .slice(0, MEETING_MAX);

    const briefs = await R.Store.list('briefings');
    S.officeBriefings = {};
    (briefs || []).forEach(b => { if(b && b.id) S.officeBriefings[b.id] = b; });

    await R.Journal.load();
    await R.Proposals.load();
    await R.LLM.initBuiltin();
    return S.office;
  }

  return {
    /* ayar */
    defaultSettings, settings, saveSettings, agentConfig, chainFor, ready, mode, providerLabel,
    /* brifing */
    brief, resetBriefs, snapshot, ruleText, nextAction, recentSaid, compactData,
    /* dogrulama ve kart uretimi (eski koc katmanindan devralindi) */
    validate, validateCards, generateCards, noteContext, parseJson,
    numbersIn, numberFidelity, scopeBreaches, supportedNumbers,
    /* sohbet */
    ask, briefing, chatOf, pushChat, clearChat,
    /* toplanti — turlu canli oturum */
    agenda, agendaCandidates, openMeeting, nextTurn, userTurn, closeMeeting, speakerAt, roundDef,
    /* tartisma */
    conflicts, nextConflict, askCross, CONFLICTS, voteOptions, parseVote, tally,
    meet, meetings, lastMeeting, saveMeeting, deleteMeeting, reportText, maxRounds,
    /* proaktiflik */
    notes, WATCHERS, dailyBriefing, briefingOf, ruleBriefingText, noteFingerprint,
    /* karar takibi */
    decisions, openDecisions, pendingDecision, closeDecision,
    /* kota */
    agentQuota, roundEstimateMs,
    /* yasam dongusu */
    load,
    /* sabitler */
    CHAT_MAX, MEETING_MAX, ROUNDS,
  };
})();

/* ==== js/core/proposals.js ==== */
/* Öneri kutusu — ofisin sisteme dokunabildiği tek kapı.

   Ofis bugüne kadar yalnizca okuyordu. Artik yazabilir, ama tek bir yoldan:

     ajan onerir → kural motoru DOGRULAR → kullanici ONAYLAR → motor uygular
                                                            → geri alinabilir

   Onaysiz hicbir sey degismez. Bu dosyada "otomatik uygula" diye bir yol
   YOKTUR ve olmamalidir: ofisin degeri onerisinde, yetkisinde degil.

   Iki oneri kaynagi vardir ve ikisi de ayni kapidan gecer:

     suggest()          kural motoru: veriden kendisi cikarir, model gerekmez,
                        cevrimdisi calisir, kota harcamaz
     fromModel(...)     ajanin onerisi: KAPALI katalogdan bir eylem + yapisal
                        parametre. Serbest metin eyleme donusmez; parametreler
                        gercek veriye karsi dogrulanir, uydurulan duser.

   Dogrulama (check) her zaman calisir — onerinin kaynagi ne olursa olsun.
   Model "kapanmis konuyu tekrara al" derken var olmayan bir konu kimligi
   uydurursa oneri kullaniciya hic gosterilmez.

   Uygulama sirasi kasitlidir: once anlik goruntu alinir (undo), sonra
   degisiklik yazilir. Boylece geri alma her zaman mumkundur. */

window.R = window.R || {};

R.Proposals = (function(){
  const U = R.U, M = R.Model, S = R.S;

  const MAX = 40;             // saklanan oneri (uygulanan + reddedilen dahil)
  const STORE = 'office/proposals';

  /* ==================== eylem uygulamalari ====================

     Her eylemin dort islevi vardir ve dordu de ayrilir:
       check   : uygulanabilir mi — hayirsa NEDEN (kullaniciya gosterilir)
       preview : ne degisecek — once/sonra satirlari
       apply   : degisikligi yazar, geri alma anlik goruntusunu DONDURUR
       revert  : o anlik goruntuden geri alir

     check her cagrida yeniden calisir: bekleyen bir oneri, arada veri
     degistigi icin gecersizlesmis olabilir. */

  function subjectOf(id){ return (R.SUBJECTS || []).find(s => s.id === id) || null; }
  function topicOf(subject, id){
    return subject ? (subject.topics || []).find(t => t.id === id) || null : null;
  }
  function stateLabel(id){
    const st = R.TOPIC_STATES[id];
    return st ? st.label : String(id || '—');
  }
  function fail(why){ return { ok:false, why }; }
  function pass(ctx){ return { ok:true, ctx:ctx || {} }; }

  const IMPL = {

    'topic-review':{
      check(p){
        const subject = subjectOf(p.subjectId);
        if(!subject) return fail('Bu ders sistemde yok.');
        const topic = topicOf(subject, p.topicId);
        if(!topic) return fail('Bu konu bu derste yok.');
        const st = M.topicState(p.subjectId, p.topicId);
        if(st.state !== 'closed' && st.state !== 'provisional'){
          return fail('Konu zaten kapalı sayılmıyor; tekrara almanın etkisi olmaz.');
        }
        return pass({ subject, topic, from:st.state });
      },
      preview(p, ctx){
        return [
          { label:'Konu', before:ctx.subject.name, after:ctx.topic.name },
          { label:'Durum', before:stateLabel(ctx.from), after:stateLabel('reopened') },
        ];
      },
      async apply(p, ctx){
        await M.setTopicState(p.subjectId, p.topicId, { state:'reopened' });
        return { subjectId:p.subjectId, topicId:p.topicId, state:ctx.from };
      },
      async revert(s){
        await M.setTopicState(s.subjectId, s.topicId, { state:s.state });
      },
    },

    'block-add':{
      check(p){
        const subject = subjectOf(p.subjectId);
        if(!subject) return fail('Bu ders sistemde yok.');
        const topic = topicOf(subject, p.topicId);
        if(!topic) return fail('Bu konu bu derste yok.');
        const min = Math.round(Number(p.minutes) || 0);
        if(!(min >= 15 && min <= 120)) return fail('Blok süresi 15–120 dakika arasında olmalı.');
        const day = M.dayOf(U.todayISO());
        if(!day) return fail('Bugünün planı henüz açılmadı.');
        return pass({ subject, topic, min, day });
      },
      preview(p, ctx){
        const blocks = ctx.day.blocks || [];
        const sum = blocks.reduce((a, b) => a + (Number(b.targetMin) || 0), 0);
        return [
          { label:'Eklenecek blok', before:'—', after:ctx.subject.name + ' · ' + ctx.topic.name },
          { label:'Bugünkü blok sayısı', before:String(blocks.length), after:String(blocks.length + 1) },
          { label:'Bugünkü hedef süre', before:sum + ' dk', after:(sum + ctx.min) + ' dk' },
        ];
      },
      async apply(p, ctx){
        const date = U.todayISO();
        const day = await M.ensureDay(date);
        const id = U.uid('b');
        day.blocks.push({
          id, slot:'Ek tekrar',
          subject:ctx.subject.name, topic:ctx.topic.name,
          targetMin:ctx.min, targetQ:0, status:'pending',
          subjectId:p.subjectId, topicId:p.topicId,
          actualMin:null, actualQ:null, correctQ:null,
          skipReason:null, startedAt:null,
        });
        await M.saveDay(date);
        return { date, blockId:id };
      },
      async revert(s){
        const day = M.dayOf(s.date);
        if(!day) return;
        day.blocks = (day.blocks || []).filter(b => b.id !== s.blockId);
        await M.saveDay(s.date);
      },
    },

    'cards-due-today':{
      check(p){
        const limit = Math.round(Number(p.limit) || 0);
        if(!(limit >= 1 && limit <= 50)) return fail('Kart sayısı 1–50 arasında olmalı.');
        const today = U.todayISO();
        const late = (S.cards || [])
          .filter(c => c.dueAt && c.dueAt < today)
          .sort((a, b) => String(a.dueAt).localeCompare(String(b.dueAt)))
          .slice(0, limit);
        if(!late.length) return fail('Geciken tekrar kartı yok.');
        return pass({ late, today });
      },
      preview(p, ctx){
        const oldest = ctx.late[0];
        return [
          { label:'Bugüne çekilecek kart', before:'—', after:ctx.late.length + ' kart' },
          { label:'En eski gecikme', before:U.fmtShort(oldest.dueAt), after:'bugün' },
        ];
      },
      async apply(p, ctx){
        const before = [];
        for(const c of ctx.late){
          before.push({ id:c.id, dueAt:c.dueAt });
          c.dueAt = ctx.today;
          await M.saveCard(c);
        }
        return { cards:before };
      },
      async revert(s){
        for(const row of (s.cards || [])){
          const c = (S.cards || []).find(x => x.id === row.id);
          if(!c) continue;
          c.dueAt = row.dueAt;
          await M.saveCard(c);
        }
      },
    },

    'card-from-error':{
      check(p){
        const err = (S.errors || []).find(e => e.id === p.errorId);
        if(!err) return fail('Bu yanlış kaydı bulunamadı.');
        if(err.closedAt) return fail('Bu yanlış zaten kapanmış.');
        const back = String(err.principle || err.recipe || '').trim();
        if(!back) return fail('Kayıtta ilke ya da reçete yazılmamış; karta dönüştürülemez.');
        const already = (S.cards || []).some(c => c.sourceRef === err.id);
        if(already) return fail('Bu yanlıştan zaten kart üretilmiş.');
        return pass({ err, back });
      },
      preview(p, ctx){
        const front = cardFront(ctx.err);
        return [
          { label:'Kartın ön yüzü', before:'—', after:front },
          { label:'Kartın arkası', before:'—', after:ctx.back.slice(0, 90) },
          { label:'İlk tekrar', before:'—', after:'yarın' },
        ];
      },
      async apply(p, ctx){
        const card = M.newCard({
          front:cardFront(ctx.err),
          back:ctx.back,
          topic:ctx.err.topic || ctx.err.testName || '',
          subjectId:ctx.err.subjectId || null,
          source:'office', sourceRef:ctx.err.id,
        });
        await M.saveCard(card);
        return { cardId:card.id };
      },
      async revert(s){ await M.deleteCard(s.cardId); },
    },

    'week-target':{
      check(p){
        const n = Math.round(Number(p.weekN) || 0);
        const q = Math.round(Number(p.questionTarget) || 0);
        if(!(n >= 1 && n <= R.PLAN.totalWeeks)) return fail('Hafta numarası plan dışında.');
        if(!(q >= 100 && q <= 3000)) return fail('Haftalık hedef 100–3000 soru arasında olmalı.');
        const week = S.weeks[M.weekId(n)];
        if(!week) return fail(n + '. hafta henüz açılmadı.');
        if(Number(week.questionTarget) === q) return fail('Hedef zaten bu değerde.');
        return pass({ week, n, q });
      },
      preview(p, ctx){
        return [
          { label:'Hafta', before:'—', after:ctx.n + '. hafta' },
          { label:'Soru hedefi', before:ctx.week.questionTarget + ' soru', after:ctx.q + ' soru' },
        ];
      },
      async apply(p, ctx){
        const before = ctx.week.questionTarget;
        ctx.week.questionTarget = ctx.q;
        await M.saveWeek(ctx.n);
        return { n:ctx.n, questionTarget:before };
      },
      async revert(s){
        const week = S.weeks[M.weekId(s.n)];
        if(!week) return;
        week.questionTarget = s.questionTarget;
        await M.saveWeek(s.n);
      },
    },

    'decision-close':{
      check(p){
        const state = p.state === 'carried' ? 'carried' : 'done';
        const d = R.Office.openDecisions().find(x => x.id === p.decisionId);
        if(!d) return fail('Bu karar açık değil ya da bulunamadı.');
        return pass({ d, state });
      },
      preview(p, ctx){
        return [
          { label:'Karar', before:'—', after:ctx.d.title },
          { label:'Durum', before:'açık', after:ctx.state === 'done' ? 'yapıldı' : 'devredildi' },
        ];
      },
      async apply(p, ctx){
        await R.Office.closeDecision(p.decisionId, ctx.state);
        return { id:p.decisionId };
      },
      async revert(s){ await R.Office.closeDecision(s.id, 'open'); },
    },
  };

  function cardFront(err){
    const head = err.topic || err.testName || 'Yanlış';
    const root = String(err.rootCause || '').trim();
    return root ? head + ' — ' + root : head;
  }

  /* ==================== dogrulama ==================== */

  /* Bir onerinin su anda uygulanabilir olup olmadigi. Bekleyen oneri de
     her cizimde yeniden gecer: arada veri degismis olabilir. */
  function check(p){
    const def = R.ACTION_BY_ID[p && p.action];
    if(!def) return fail('Bilinmeyen eylem.');
    if(def.agents.indexOf(p.agent) < 0){
      return fail(agentName(p.agent) + ' bu eylemi öneremez; alanı dışında.');
    }
    const impl = IMPL[def.id];
    if(!impl) return fail('Bu eylemin uygulaması yok.');
    try{ return impl.check(p.params || {}); }
    catch(e){ return fail('Öneri doğrulanamadı.'); }
  }

  /* Ne degisecek — onaydan ONCE gosterilir. */
  function preview(p){
    const res = check(p);
    if(!res.ok) return { ok:false, why:res.why, rows:[] };
    const impl = IMPL[p.action];
    try{ return { ok:true, rows:impl.preview(p.params || {}, res.ctx) || [] }; }
    catch(e){ return { ok:false, why:'Önizleme üretilemedi.', rows:[] }; }
  }

  function agentName(id){
    const a = R.AGENT_BY_ID[id];
    return a ? a.name : 'Bu ajan';
  }

  /* ==================== depo ==================== */

  function all(){ return (S.officeProposals || []).slice(); }
  function pending(){ return all().filter(p => p.status === 'pending'); }
  function applied(){ return all().filter(p => p.status === 'applied'); }

  /* Gecerliligini yitirmis bekleyen oneriler kullaniciya gosterilmez:
     veri degistiyse oneri de gecersizdir. */
  function actionable(){
    return pending().map(p => Object.assign({}, p, { preview:preview(p) }))
      .filter(p => p.preview.ok);
  }

  async function save(){
    S.officeProposals = (S.officeProposals || []).slice(-MAX);
    await R.Store.set(STORE, { items:S.officeProposals });
    return S.officeProposals;
  }

  async function load(){
    const doc = await R.Store.get(STORE);
    S.officeProposals = (doc && Array.isArray(doc.items)) ? doc.items : [];
    return S.officeProposals;
  }

  /* Ayni eylem+parametre ikinci kez kuyruga girmez. */
  function fingerprint(p){
    return p.action + '|' + JSON.stringify(p.params || {});
  }

  async function propose(p){
    const res = check(p);
    if(!res.ok) return null;
    S.officeProposals = S.officeProposals || [];
    const fp = fingerprint(p);
    if(S.officeProposals.some(x => x.status === 'pending' && fingerprint(x) === fp)) return null;

    const row = {
      id:U.uid('p'),
      action:p.action,
      agent:p.agent,
      params:p.params || {},
      reason:String(p.reason || '').slice(0, 240),
      source:p.source === 'llm' ? 'llm' : 'kural',
      at:new Date().toISOString(),
      status:'pending',
      appliedAt:null,
      undo:null,
    };
    S.officeProposals.push(row);
    await save();
    return row;
  }

  /* ==================== onay ==================== */

  async function approve(id){
    const row = (S.officeProposals || []).find(p => p.id === id);
    if(!row || row.status !== 'pending') return null;
    /* Onay anında yeniden dogrula: kullanici oneriyi gordukten sonra
       veri degismis olabilir, eski dogrulamaya guvenilmez. */
    const res = check(row);
    if(!res.ok){
      row.status = 'stale';
      row.why = res.why;
      await save();
      return { ok:false, why:res.why };
    }
    const impl = IMPL[row.action];
    /* Once anlik goruntu, sonra yazma: geri alma her zaman mumkun olmali. */
    row.undo = await impl.apply(row.params || {}, res.ctx);
    row.status = 'applied';
    row.appliedAt = new Date().toISOString();
    await save();
    return { ok:true, row };
  }

  async function reject(id){
    const row = (S.officeProposals || []).find(p => p.id === id);
    if(!row || row.status !== 'pending') return null;
    row.status = 'rejected';
    await save();
    return row;
  }

  async function undo(id){
    const row = (S.officeProposals || []).find(p => p.id === id);
    if(!row || row.status !== 'applied') return null;
    const impl = IMPL[row.action];
    await impl.revert(row.undo || {});
    row.status = 'undone';
    row.undoneAt = new Date().toISOString();
    await save();
    return row;
  }

  async function clearResolved(){
    S.officeProposals = (S.officeProposals || []).filter(p => p.status === 'pending');
    await save();
  }

  /* ==================== kural motoru onerileri ====================

     Model gerekmez, kota harcanmaz, cevrimdisi calisir. Masa notlariyla
     ayni doktrin: esik asilirsa oneri dogar, asilmazsa dogmaz. */

  function suggest(){
    const out = [];
    const today = U.todayISO();

    /* 1. Geciken tekrar borcu — analistin alani. */
    const late = (S.cards || []).filter(c => c.dueAt && c.dueAt < today);
    if(late.length >= 5){
      out.push({
        action:'cards-due-today', agent:'analist', source:'kural',
        params:{ limit:Math.min(late.length, 30) },
        reason:late.length + ' kartın tekrar tarihi geçmiş; borç ertelendikçe büyüyor.',
      });
    }

    /* 2. Kok nedeni yazilmis ama karta donmemis yanlis. */
    const orphan = (S.errors || []).find(e => !e.closedAt
      && String(e.principle || e.recipe || '').trim()
      && !(S.cards || []).some(c => c.sourceRef === e.id));
    if(orphan){
      out.push({
        action:'card-from-error', agent:'analist', source:'kural',
        params:{ errorId:orphan.id },
        reason:'Kök nedeni yazılmış bu yanlış karta dönmemiş; tekrar edilmezse yine yapılır.',
      });
    }

    /* 3. Kapali gorunen ama acik yanlisi olan konu — brans uzmaninin alani. */
    (R.SUBJECTS || []).forEach(subject => {
      const owner = subject.exam === 'TYT' ? 'tyt' : 'ayt';
      (subject.topics || []).forEach(topic => {
        const st = M.topicState(subject.id, topic.id);
        if(st.state !== 'closed' && st.state !== 'provisional') return;
        const openErrors = (S.errors || []).filter(e => !e.closedAt
          && e.subjectId === subject.id && e.topicId === topic.id).length;
        if(openErrors < 2) return;
        out.push({
          action:'topic-review', agent:owner, source:'kural',
          params:{ subjectId:subject.id, topicId:topic.id },
          reason:topic.name + ' kapalı görünüyor ama üzerinde ' + openErrors
            + ' açık yanlış var; kapanış gerçek değil.',
        });
      });
    });

    /* Dogrulanmayan oneri hic dogmaz. */
    return out.filter(p => check(p).ok);
  }

  /* Kural motorunun buldugu onerileri kuyruga alir; var olanlar tekrarlanmaz. */
  async function refresh(){
    const found = suggest();
    const added = [];
    for(const p of found){
      const row = await propose(p);
      if(row) added.push(row);
    }
    return added;
  }

  /* ==================== modelin onerisi ====================

     Ajan yaniti bir JSON nesnesi tasiyabilir. Nesne kapali kataloga ve
     yapisal parametreye uymuyorsa sessizce dusurulur — model bir eylem
     UYDURAMAZ, yalnizca var olanlardan birini secebilir. */

  function fromModel(agentId, obj){
    if(!obj || typeof obj !== 'object') return null;
    const def = R.ACTION_BY_ID[obj.eylem || obj.action];
    if(!def) return null;
    if(def.agents.indexOf(agentId) < 0) return null;

    /* Parametreler semadan okunur: fazladan alan tasinmaz. */
    const raw = obj.parametreler || obj.params || {};
    const params = {};
    let missing = false;
    Object.keys(def.params).forEach(key => {
      const want = def.params[key];
      const v = raw[key];
      if(v == null || v === ''){ missing = true; return; }
      if(want === 'number'){
        const n = Number(v);
        if(!Number.isFinite(n)){ missing = true; return; }
        params[key] = n;
      }else{
        params[key] = String(v).slice(0, 120);
      }
    });
    if(missing) return null;

    const p = {
      action:def.id, agent:agentId, params, source:'llm',
      reason:String(obj.gerekce || obj.reason || '').slice(0, 240),
    };
    return check(p).ok ? p : null;
  }

  /* Ajana katalogu anlatan istem parcasi. Ekran degil motor kurar:
     katalog degisirse istem kendiliginden degisir. */
  function catalogPrompt(agentId){
    const list = R.actionsFor(agentId);
    if(!list.length) return '';
    return 'SİSTEME MÜDAHALE (isteğe bağlı):\n'
      + 'Aşağıdaki eylemlerden biri durumu düzeltecekse yanıtının SONUNA tek bir '
      + 'JSON nesnesi ekleyebilirsin. Eylem uydurma, listede olmayanı yazma; '
      + 'yazdığın şey doğrudan uygulanmaz, kullanıcının onayına düşer.\n'
      + list.map(a => '- ' + a.id + ' (' + a.title + ') · parametreler: '
          + Object.keys(a.params).join(', ')).join('\n') + '\n'
      + 'Biçim: {"eylem":"<id>","parametreler":{…},"gerekce":"tek cümle"}\n'
      + 'Gerek yoksa JSON yazma.';
  }

  /* Akis sirasinda yarim kalmis JSON kullaniciya gorunmesin. Yalniz eylem
     nesnesine benzeyen kuyruk gizlenir; duz metindeki suslu parantez
     (nadir de olsa) kirpilmaz. */
  function stripTrailingJson(text){
    const s = String(text || '');
    const i = s.lastIndexOf('{');
    if(i < 0) return s;
    if(!/"(eylem|action)"/.test(s.slice(i))) return s;
    return s.slice(0, i).replace(/```(?:json)?\s*$/, '').trimEnd();
  }

  /* Ajan yanitinin sonundaki JSON'u ayirir: kullaniciya gosterilen metin
     JSON tasimaz, oneri ayri durur. */
  function splitAction(text){
    const s = String(text || '');
    const end = s.lastIndexOf('}');
    if(end < 0) return { text:s.trim(), obj:null };
    /* Nesne ic ice oldugunda SON '{' dis nesnenin basi degildir
       ("parametreler":{…} icerideki paranteze denk gelir). Bu yuzden
       gecerli ayrisan EN ERKEN baslangic aranir. */
    for(let i = s.indexOf('{'); i >= 0 && i <= end; i = s.indexOf('{', i + 1)){
      let obj = null;
      try{ obj = JSON.parse(s.slice(i, end + 1)); }catch(e){ continue; }
      if(!obj || (!obj.eylem && !obj.action)) continue;
      /* JSON'dan once kod cercevesi kalmis olabilir. */
      const head = s.slice(0, i).replace(/```(?:json)?\s*$/, '').trim();
      return { text:head, obj };
    }
    return { text:s.trim(), obj:null };
  }

  return {
    all, pending, applied, actionable, check, preview,
    propose, approve, reject, undo, clearResolved,
    suggest, refresh, fromModel, catalogPrompt, splitAction, stripTrailingJson,
    load, save, MAX,
  };
})();

    list.push({ group:'Kayıt', label:'Tekrar kartı ekle', icon:'plus', run(){ R.App.go('cards'); setTimeout(()=>R.Screens.cards.handle['new-card']({dataset:{}}), 60); } });
    list.push({ group:'Kayıt', label:'Ders ekle (video / not)', icon:'plus', run(){ R.App.go('learn'); setTimeout(()=>R.Screens.learn.handle['note-new']({dataset:{}}), 60); } });
    list.push({ group:'Kayıt', label:'Süreli deneme oturumu', icon:'clock', run(){ R.App.go('exams'); setTimeout(()=>R.Screens.exams.handle['run-open']({dataset:{}}), 60); } });
    list.push({ group:'Kayıt', label:'Sınamayı başlat', icon:'play', run(){ R.App.go('quiz'); setTimeout(()=>R.Screens.quiz.handle['quiz-start']({dataset:{}}), 60); } });
    list.push({ group:'Kayıt', label:'Weekly review’u aç', icon:'check', hint:'Paz', run(){ R.App.go('week'); setTimeout(()=>R.Screens.week.openReview(), 60); } });

    const day = S.days[U.todayISO()];
    if(day){
      const running = day.blocks.find(b => b.startedAt);
      if(running){

        list.push({ group:'Odak', label:'Bloğu bitir', icon:'stop', run(){ R.Screens.today.handle['timer-stop']({ dataset:{ block:running.id } }); } });
      }else{
        day.blocks.filter(b => b.status === 'pending' && b.slot !== 'Dinlenme').forEach(b => {
          list.push({ group:'Odak', label:'Başlat: '+b.topic, icon:'play', run(){
            R.App.go('today');
            setTimeout(()=>R.Screens.today.handle['timer-start']({ dataset:{ block:b.id } }), 60);
          }});
        });
      }
    }

    R.SUBJECTS.forEach(s => {
      list.push({ group:'Ders', label:s.name, icon:'book', run(){ S.ui.subjectOpen = s.id; R.App.go('subjects'); } });
    });

    R.Calc.riskRanking(5).forEach(r => {
      list.push({ group:'Öncelik', label:r.topicName+' — risk '+r.score, icon:'target',
        keywords:r.subjectName, weight:4,
        run(){ S.ui.subjectOpen = r.subjectId; R.App.go('subjects');
          setTimeout(()=>R.Screens.subjects.handle['open-topic']({ dataset:{ subject:r.subjectId, topic:r.topicId } }), 80); } });
    });

    const cur = M.currentWeek();
    [cur-1, cur, cur+1].forEach(n => {
      if(n < 1 || n > R.PLAN.totalWeeks) return;
      const c = R.Model.curriculumFor(n);
      list.push({ group:'Hafta', label:'Hafta '+n+' — '+c.title, icon:'week',
        run(){ S.ui.weekView = n; R.App.go('week'); } });
    });

    const theme = S.profile ? S.profile.theme : 'system';
    list.push({ group:'Sistem', label:'Tema: '+(theme === 'dark' ? 'açığa geç' : theme === 'light' ? 'sisteme geç' : 'koyuya geç'), icon:'moon',
      run(){
        const next = theme === 'dark' ? 'light' : theme === 'light' ? 'system' : 'dark';
        S.profile.theme = next;
        R.Model.saveProfile().then(() => { R.App.applyTheme(); R.App.render(); });
      }});
    list.push({ group:'Sistem', label:'Bugün olmuyor — minimum güne in', icon:'moon', run(){ R.Screens.today.handle['bad-day'](); } });
    list.push({ group:'Sistem', label:'Hafta özetini paylaş', icon:'upload', run(){ R.Screens.today.handle['share-week'](); } });
    list.push({ group:'Sistem', label:'Yedek al (JSON)', icon:'download', run(){ R.Screens.guide.handle['export-data']({dataset:{}}); } });
    list.push({ group:'Sistem', label:'Kısayolları göster', icon:'guide', run(){ showShortcuts(); } });

    return list;
  }

  /* Turkce karakterleri normalize eder: "ogrenme" ile "öğrenme" eslesir. */
  const norm = R.U.norm;
  const { html, raw, when, cls, map } = R.h;
  const K = R.C;

  function score(cmd, q){
    if(!q) return cmd.weight || 1;
    const label = norm(cmd.group+' '+cmd.label+' '+(cmd.keywords || ''));
    const needle = norm(q);
    const base = cmd.weight || 1;
    if(label.indexOf(needle) === 0) return 100 + base;          // bastan tam eslesme
    const wordStart = label.indexOf(' '+needle);
    if(wordStart >= 0) return 60 + base;                        // kelime basi
    if(label.indexOf(needle) >= 0) return 40 + base;            // icinde gecer
    // harf sirasi eslesmesi (fuzzy) — yakinlik kadar puan
    let i = 0, gaps = 0;
    for(const ch of needle){
      const next = label.indexOf(ch, i);
      if(next === -1) return 0;
      gaps += next - i;
      i = next + 1;
    }
    return Math.max(1, 20 - Math.min(18, gaps/2)) + base;
  }

  /* Arama sonuclarinda eslesen bolumu vurgular */
  function markMatch(text, q){
    if(!q) return U.esc(text);
    const nText = norm(text), nQ = norm(q);
    const at = nText.indexOf(nQ);
    if(at < 0) return U.esc(text);
    return U.esc(text.slice(0, at))
      + '<mark class="cmdk__mark">'+U.esc(text.slice(at, at+q.length))+'</mark>'
      + U.esc(text.slice(at+q.length));
  }

  /* Sorgu bazli icerik aramasi: konular, denemeler, hatalar, kartlar, haftalar */
  function searchContent(q){
    if(!q || q.length < 2) return [];
    const S2 = R.S, M2 = R.Model;
    const out = [];
    const nQ = norm(q);
    const hit = txt => txt && norm(txt).indexOf(nQ) >= 0;

    R.SUBJECTS.forEach(s => {
      s.topics.forEach(t => {
        if(hit(t.name) || hit(s.name)){
          const st = M2.topicState(s.id, t.id);
          out.push({ group:'Konu', label:t.name, sub:s.name+' · '+R.TOPIC_STATES[st.state].label,
            icon:'book', weight:6,
            run(){ S2.ui.subjectOpen = s.id; R.App.go('subjects'); setTimeout(()=>{
              const el = document.querySelector('[data-topic="'+t.id+'"]');
              if(el){ el.scrollIntoView({block:'center'}); el.click(); }
            }, 120); } });
        }
      });
    });

    S2.exams.forEach(e => {
      if(hit(e.type) || hit(e.publisher) || hit(e.date)){
        out.push({ group:'Deneme', label:e.type+' · '+U.fmtShort(e.date),
          sub:(e.publisher||'')+' · net '+U.fmtNet(M2.examNet(e)), icon:'exam', weight:5,
          run(){ S2.ui.examOpen = e.id; R.App.go('exams'); } });
      }
    });

    S2.errors.forEach(e => {
      if(hit(e.rootCause) || hit(e.topic) || hit(e.principle)){
        out.push({ group:'Yanlış', label:(e.topic || e.testName || 'Yanlış')+' — '+(e.rootCause||''),
          sub:e.tag+' · '+(e.closedAt ? 'kapandı' : 'açık'), icon:'edit', weight:4,
          run(){ S2.ui.cardTab = 'notebook'; R.App.go('cards'); } });
      }
    });

    S2.cards.forEach(c => {
      if(hit(c.front) || hit(c.topic)){
        out.push({ group:'Kart', label:c.front, sub:(c.topic||'')+' · '+U.fmtShort(c.dueAt),
          icon:'cards', weight:3,
          run(){ S2.ui.cardTab = 'all'; S2.ui.cardQuery = c.front.slice(0,24); R.App.go('cards'); } });
      }
    });

    S2.videoNotes.forEach(n => {
      const segHit = n.segments.find(seg => hit(seg.text));
      if(hit(n.title) || segHit){
        out.push({ group:'Ders notu', label:n.title || 'Adsız ders',
          sub:segHit ? M2.fmtTs(segHit.ts)+' · '+segHit.text.slice(0,60) : M2.noteTopicName(n),
          icon:'play', weight:5,
          run(){ S2.ui.noteOpen = n.id; R.App.go('learn'); } });
      }
    });

    for(let n = 1; n <= R.PLAN.totalWeeks; n++){
      const c = M2.curriculumFor(n);
      if(hit(c.title) || c.topics.some(hit)){
        out.push({ group:'Hafta', label:'Hafta '+n+' — '+c.title, sub:c.topics.join(' · '),
          icon:'week', weight:2,
          run(){ R.S.ui.weekView = n; R.App.go('week'); } });
      }
    }

    Object.keys(R.HINTS).forEach(k => {
      const h = R.HINTS[k];
      if(hit(h.t) || hit(h.b)){
        out.push({ group:'Bilgi', label:h.t, sub:h.b, icon:'guide', weight:1,
          run(){ R.App.render(); setTimeout(()=>{
            const btn = document.querySelector('[data-hint="'+k+'"]');
            if(btn) btn.click(); else R.UI.toast(h.t+' — '+h.b);
          }, 80); } });
      }
    });

    return out.slice(0, 30);
  }

  /* ---------- render ---------- */
  function open(){
    close();
    const el = document.createElement('div');
    el.className = 'cmdk';
    el.id = 'cmdk';
    el.innerHTML = String(html`
      <div class="cmdk__box" role="dialog" aria-label="Komut paleti">
        <input class="cmdk__input" id="cmdk-input" placeholder="Ne yapmak istiyorsun?" autocomplete="off"/>
        <div class="cmdk__list" id="cmdk-list"></div>
        <div class="cmdk__foot"><span><kbd>↑</kbd><kbd>↓</kbd> gez</span>
          <span><kbd>↵</kbd> seç</span><span><kbd>esc</kbd> kapat</span></div>
      </div>`);
    el.addEventListener('mousedown', e => { if(e.target === el) close(); });
    document.getElementById('overlay-root').appendChild(el);

    const input = document.getElementById('cmdk-input');
    input.addEventListener('input', () => { active = 0; renderList(input.value); });
    input.addEventListener('keydown', onKey);
    renderList('');
    setTimeout(() => input.focus(), 20);
  }

  function renderList(q){
    /* Komutlar ve icerik sonuclari ortak siralanir.
       Icerik sonuclari zaten gercek eslesmedir; bulanik komut eslesmesinin ustunde durur. */
    const scoredCommands = commands()
      .map(c => ({ c, s:score(c, q) }))
      .filter(x => x.s > 0);
    const scoredContent = searchContent(q)
      .map(c => ({ c, s:50 + (c.weight || 0) }));

    items = scoredCommands.concat(scoredContent)
      .sort((a,b) => b.s - a.s)
      .map(x => x.c)
      .slice(0, 40);
    active = Math.min(active, Math.max(0, items.length-1));

    const list = document.getElementById('cmdk-list');
    if(!items.length){
      list.innerHTML = String(html`<div class="cmdk__empty">“${q}” için sonuç yok.<br/>
        <span class="tiny">Konu, deneme, yanlış, kart ve hafta içinde de aranır.</span></div>`);
      return;
    }

    let lastGroup = null;
    list.innerHTML = String(map(items, (c, i) => {
      const head = c.group !== lastGroup ? html`<div class="cmdk__group">${c.group}</div>` : '';
      lastGroup = c.group;
      return html`${head}
        <button class="${cls('cmdk__item', i === active && 'is-active')}" data-cmd="${i}">
          ${raw(UI.icon(c.icon || 'right'))}
          <span class="cmdk__text"><span class="cmdk__label">${raw(markMatch(c.label, q))}</span>
            ${when(c.sub, () => html`<span class="cmdk__sub">${raw(markMatch(c.sub, q))}</span>`)}</span>
          ${when(c.hint, () => html`<span class="cmdk__hintrow">${c.hint}</span>`)}
        </button>`;
    }));

    list.querySelectorAll('[data-cmd]').forEach(btn => {
      btn.addEventListener('mousedown', e => { e.preventDefault(); pick(Number(btn.dataset.cmd)); });
      btn.addEventListener('mousemove', () => {
        const i = Number(btn.dataset.cmd);
        if(i !== active){ active = i; highlight(); }
      });
    });
  }

  function highlight(){
    const list = document.getElementById('cmdk-list');
    if(!list) return;
    list.querySelectorAll('[data-cmd]').forEach(b => {
      b.classList.toggle('is-active', Number(b.dataset.cmd) === active);
      if(Number(b.dataset.cmd) === active && b.scrollIntoView) b.scrollIntoView({ block:'nearest' });
    });
  }

  function onKey(e){
    if(e.key === 'ArrowDown'){ e.preventDefault(); active = Math.min(active+1, items.length-1); highlight(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); active = Math.max(active-1, 0); highlight(); }
    else if(e.key === 'Enter'){ e.preventDefault(); pick(active); }
    else if(e.key === 'Escape'){ e.preventDefault(); close(); }
  }

  function pick(i){
    const cmd = items[i];
    close();
    if(cmd) cmd.run();
  }

  function close(){
    const el = document.getElementById('cmdk');
    if(el) el.remove();
  }
  function isOpen(){ return !!document.getElementById('cmdk'); }

  const SHORTCUTS = [
    [['ctrl', 'k'], 'Komut paleti'],
    [['f'], 'Odak modu (blok çalışıyorsa)'],
    [['space'], 'Tekrar ekranında kartı çevir'],
    [['1', '2', '3'], 'Hatırlamadım / Zorlandım / Hatırladım'],
    [['?'], 'Bu listeyi aç'],
    [['esc'], 'Açık pencereyi kapat'],
  ];

  function showShortcuts(){
    UI.sheet({
      title:'Klavye kısayolları',
      body:String(K.Table({ tight:true, headers:['Tuş', 'İşlev'],
        rows:SHORTCUTS.map(s => [map(s[0], k => html`<kbd>${k}</kbd> `), s[1]]) })),
      noFocus:true,
      footer:String(K.Button({ label:'Kapat', act:'sheet-close' })),
    });
  }

  /* ---------- odak modu ---------- */
  let focusTick = null;

  function runningBlock(){
    const day = S.days[U.todayISO()];
    if(!day) return null;
    return day.blocks.find(b => b.startedAt) || null;
  }
  function elapsed(b){
    return b && b.startedAt ? Math.max(0, Math.floor((Date.now() - new Date(b.startedAt).getTime())/1000)) : 0;
  }

  function openFocus(){
    const b = runningBlock();
    if(!b){ UI.toast('Çalışan blok yok'); return; }
    closeFocus();
    const el = document.createElement('div');
    el.className = 'focusmode';
    el.id = 'focusmode';
    el.innerHTML = String(html`
      ${K.IconButton({ icon:'close', aria:'Odak modundan çık', act:'focus-close', class:'focusmode__esc' })}
      <div class="focusmode__slot">${b.slot}</div>
      <div class="focusmode__topic">${b.topic}</div>
      <div class="focusmode__clock" id="focus-clock">${U.fmtClock(elapsed(b))}</div>
      <div class="focusmode__ring" id="focus-ring"></div>
      <div class="focusmode__target" id="focus-target"></div>
      <div class="focusmode__actions">
        ${K.Button({ label:'Bloğu bitir', icon:'check', size:'lg', tone:'primary',
          act:'focus-finish', data:{ 'data-block':b.id } })}
        ${K.Button({ label:'Arkaplana al', size:'lg', act:'focus-close' })}
      </div>`);
    document.getElementById('overlay-root').appendChild(el);
    paintFocus();
    focusTick = setInterval(paintFocus, 1000);
  }

  function paintFocus(){
    const b = runningBlock();
    const clock = document.getElementById('focus-clock');
    if(!b || !clock){ closeFocus(); return; }
    const secs = elapsed(b);
    clock.textContent = U.fmtClock(secs);
    const pct = b.targetMin ? Math.min(100, 100*(secs/60)/b.targetMin) : 0;
    const ring = document.getElementById('focus-ring');
    if(ring) ring.innerHTML = String(K.Bar({ value:pct, large:true, tone:'' }));
    const target = document.getElementById('focus-target');
    if(target){
      const left = Math.max(0, b.targetMin - Math.floor(secs/60));
      target.textContent = left > 0
        ? 'hedefe '+left+' dakika'+(b.targetQ ? ' · '+b.targetQ+' soru' : '')
        : 'hedef süre doldu — dilediğin kadar devam edebilirsin';
    }
  }

  function closeFocus(){
    if(focusTick){ clearInterval(focusTick); focusTick = null; }
    const el = document.getElementById('focusmode');
    if(el) el.remove();
  }
  function isFocusOpen(){ return !!document.getElementById('focusmode'); }

  return { open, close, isOpen, openFocus, closeFocus, isFocusOpen, showShortcuts, runningBlock };
})();

/* ==== js/core/setup.js ==== */
/* Kurulum sihirbazı — sistemin kişiselleştiği yer.

   Beş adım: kim · hedef · takvim · kapasite · seviye.
   Sonunda plan üretilir; iki farklı aday aynı planı almaz.
   Sonradan Rehber → Ayarlar’dan tek tek değiştirilebilir. */

window.R = window.R || {};

R.Setup = (function(){
  const U = R.U, M = R.Model, UI = R.UI, S = R.S;
  const { html, when, map } = R.h;
  const K = R.C;

  const STEPS = [
    { id:'kim',      title:'Seni tanıyalım',     note:'Bu bilgiler cihazda kalır, koça gönderilmez' },
    { id:'hedef',    title:'Hedefin ne?',        note:'Program adı ve hedef başarı sırası' },
    { id:'takvim',   title:'Takvimin',           note:'Ne zaman başlıyorsun, sınav ne zaman' },
    { id:'kapasite', title:'Haftalık kapasiten', note:'Gerçekçi ol — plan buna göre kurulur' },
    { id:'seviye',   title:'Şu anki seviyen',    note:'Planın hızını belirler' },
  ];

  let step = 0;
  let draft = null;

  function needed(){ return !S.profile || !S.profile.setupDone; }

  /* ---------- takvim önizlemesi ---------- */

  function preview(startISO, examISO){
    const days = U.diffDays(startISO, examISO);
    const weeks = Math.max(0, Math.ceil((days + 1)/7));
    const capped = Math.min(R.PROGRAM.totalWeeks, weeks);
    return {
      days, weeks:capped, rawWeeks:weeks,
      compressed: capped < R.PROGRAM.totalWeeks,
      tooShort: capped < 4,
      startsInPast: U.diffDays(U.todayISO(), startISO) < 0,
    };
  }

  function previewHtml(startISO, examISO){
    const p = preview(startISO, examISO);
    if(p.days <= 0) return K.Notice({ tone:'danger', body:'Sınav tarihi başlangıçtan sonra olmalı.' });
    if(p.tooShort) return K.Notice({ tone:'warn', body:'Takvimde yalnız '+p.weeks+' hafta var. '
      + 'Plan bu süreye sıkıştırılır; yüksek frekanslı konular öne alınır, gerisi düşer.' });
    if(p.compressed) return K.Notice({ tone:'warn', title:p.weeks+' haftalık program.',
      body:'Tam müfredat '+R.PROGRAM.totalWeeks+' haftaya göre yazılmıştır. Bu takvimde plan '
        + 'sıkıştırılır: düşük frekanslı konular plana girmez, hangileri olduğunu Program ekranında görürsün.' });
    return K.Notice({ tone:'ok', body:p.weeks+' haftalık tam program. Haftalar '
      + U.fmtDate(startISO)+' gününden itibaren sayılır.' });
  }

  function nextMonday(fromISO){
    const d = U.parse(fromISO);
    const dow = U.weekdayIndex(d);
    return U.iso(dow === 0 ? d : U.addDays(d, 7-dow));
  }

  /* ---------- taslak ---------- */

  function startDraft(){
    const p = S.profile || M.defaultProfile();
    const todayMon = nextMonday(U.todayISO());
    draft = {
      name:p.name || '',
      city:p.city || '',
      program:p.program || '',
      targetRank:p.targetRank || '',
      startDate:p.startDate || todayMon,
      examTytISO:p.examTytISO || R.PROGRAM.examTytISO,
      capacityHoursPerWeek:p.capacityHoursPerWeek || 21,
      studyDaysPerWeek:p.studyDaysPerWeek || 6,
      sleepTarget:p.sleepTarget || 7.5,
      diplomaGrade:p.diplomaGrade || 70,
      level:p.level || 'orta',
      weakSubjects:(p.weakSubjects || []).slice(),
    };
  }

  function read(id){
    const el = document.getElementById(id);
    return el ? el.value : '';
  }
  function capture(){
    if(!draft) return;
    const s = STEPS[step].id;
    if(s === 'kim'){
      draft.name = read('sw-name').trim() || draft.name;
      draft.city = read('sw-city').trim();
    }else if(s === 'hedef'){
      draft.program = read('sw-program').trim() || draft.program;
      draft.targetRank = Number(read('sw-rank')) || draft.targetRank || null;
      draft.diplomaGrade = U.clamp(Number(read('sw-diploma')) || 0, 0, 100) || draft.diplomaGrade;
    }else if(s === 'takvim'){
      draft.startDate = read('sw-start') || draft.startDate;
      draft.examTytISO = read('sw-exam') || draft.examTytISO;
    }else if(s === 'kapasite'){
      draft.capacityHoursPerWeek = Number(read('sw-cap')) || draft.capacityHoursPerWeek;
      draft.studyDaysPerWeek = Number(read('sw-days')) || draft.studyDaysPerWeek;
      draft.sleepTarget = Number(read('sw-sleep')) || draft.sleepTarget;
    }
  }

  /* ---------- adım gövdeleri ---------- */

  function bodyKim(){
    return K.Stack([
      K.Notice({ tone:'info', body:'Ad ve şehir yalnız bu cihazda tutulur. '
        + 'AI koça gönderilen verilerden bu alanlar otomatik çıkarılır.' }),
      K.Cols(2, [
        K.Field({ label:'Ad', input:K.Input({ id:'sw-name', value:draft.name, placeholder:'adın' }) }),
        K.Field({ label:'Şehir', hint:'isteğe bağlı', input:K.Input({ id:'sw-city', value:draft.city }) }),
      ]),
    ]);
  }

  function bodyHedef(){
    return K.Stack([
      K.Field({ label:'Hedef program', hint:'üniversite ve bölüm',
        input:K.Input({ id:'sw-program', value:draft.program, placeholder:'ör. Çukurova Üniversitesi Hemşirelik' }) }),
      K.Cols(2, [
        K.Field({ label:'Hedef başarı sırası', hint:'geçen yılın taban sırası',
          input:K.Input({ id:'sw-rank', type:'number', numeric:true, value:draft.targetRank,
            placeholder:'ör. 84285' }) }),
        K.Field({ label:'Diploma notu', hint:'OBP hesabı için',
          input:K.Input({ id:'sw-diploma', type:'number', numeric:true, min:0, max:100, value:draft.diplomaGrade }) }),
      ]),
      K.Notice({ tone:'info', body:'Sıra hedefi puandan daha güvenilirdir: aynı net farklı yıllarda '
        + 'farklı puana döner ama sıra karşılaştırılabilir kalır. YÖK Atlas’tan bakabilirsin.' }),
    ]);
  }

  function bodyTakvim(){
    const todayMon = nextMonday(U.todayISO());
    const picks = [
      { start:todayMon, label:todayMon === U.todayISO() ? 'Bugün' : 'Bu pazartesi' },
      { start:U.iso(U.addDays(U.parse(todayMon), 7)), label:'Gelecek pazartesi' },
      { start:U.todayISO(), label:'Hemen bugünden' },
    ];
    return K.Stack([
      html`<div class="stack-xs"><span class="mono-label">Hızlı seçim</span>
        ${K.Row(map(picks, q => K.Button({ label:q.label, size:'sm', act:'setup-quick',
          data:{ 'data-start':q.start } })), { wrap:true })}</div>`,
      K.Cols(2, [
        K.Field({ label:'Başlangıç', hint:'pazartesi önerilir',
          input:K.Input({ id:'sw-start', type:'date', value:draft.startDate }) }),
        K.Field({ label:'TYT sınav tarihi', hint:'ÖSYM duyurusuyla güncelle',
          input:K.Input({ id:'sw-exam', type:'date', value:draft.examTytISO }) }),
      ]),
      html`<div id="su-preview">${previewHtml(draft.startDate, draft.examTytISO)}</div>`,
    ]);
  }

  function bodyKapasite(){
    const cap = draft.capacityHoursPerWeek;
    const perDay = U.round(cap / (draft.studyDaysPerWeek || 6), 1);
    return K.Stack([
      K.Cols(3, [
        K.Field({ label:'Haftalık saat', input:K.Input({ id:'sw-cap', type:'number', numeric:true,
          step:1, min:4, max:70, value:cap, change:'setup-cap' }) }),
        K.Field({ label:'Çalışma günü', input:K.Select({ id:'sw-days', change:'setup-cap',
          value:draft.studyDaysPerWeek,
          options:[4, 5, 6, 7].map(n => ({ value:n, label:n+' gün' })) }) }),
        K.Field({ label:'Uyku hedefi (saat)', input:K.Input({ id:'sw-sleep', type:'number',
          numeric:true, step:0.5, min:5, max:11, value:draft.sleepTarget }) }),
      ]),
      html`<div id="sw-caphint">${capacityHint(cap, draft.studyDaysPerWeek)}</div>`,
      K.Notice({ tone:'warn', body:'Kapasiteyi olduğundan yüksek yazma. Plan bu sayıya göre kurulur; '
        + 'gerçekçi olmayan kapasite, tamamlama oranını da anlamsız kılar.' }),
    ]);
  }

  function capacityHint(cap, days){
    const perDay = U.round(cap / (days || 6), 1);
    const tone = perDay > 7 ? 'danger' : perDay > 5.5 ? 'warn' : 'ok';
    const note = perDay > 7
      ? 'Günde '+perDay+' saat sürdürülebilir değil. İki hafta sonra plan çöker.'
      : perDay > 5.5
      ? 'Günde '+perDay+' saat yoğun. Okul ve dershane varsa gerçekçi mi, iki kez düşün.'
      : 'Günde '+perDay+' saat · '+days+' gün. Sürdürülebilir görünüyor.';
    return K.Notice({ tone, body:note });
  }

  function bodySeviye(){
    const levels = Object.keys(R.Planner.LEVELS).map(k => R.Planner.LEVELS[k]);
    return K.Stack([
      html`<div class="levelpick">${map(levels, lv => html`
        <button class="${draft.level === lv.id ? 'levelbtn is-on' : 'levelbtn'}"
          data-act="setup-level" data-level="${lv.id}"
          aria-pressed="${draft.level === lv.id ? 'true' : 'false'}">
          <b>${lv.name}</b><span class="tiny dim">${lv.note}</span>
        </button>`)}</div>`,
      html`<div class="stack-xs mt-12"><span class="mono-label">Zorlandığın dersler</span>
        <span class="tiny dim">Seçtiğin dersler plandan düşürülmez, öne alınır.</span>
        ${K.Row(map(R.SUBJECTS, s => K.Chip({
          label:s.name, on:draft.weakSubjects.indexOf(s.id) >= 0,
          act:'setup-weak', data:{ 'data-id':s.id },
        })), { wrap:true })}</div>`,
      html`<div id="sw-planpreview">${planPreview()}</div>`,
    ]);
  }

  /* Son adımda planın ne olacağını önceden göster. */
  function planPreview(){
    const p = preview(draft.startDate, draft.examTytISO);
    if(p.days <= 0) return K.Notice({ tone:'danger', body:'Takvim geçersiz; geri dönüp düzelt.' });
    const plan = R.Planner.generate(draft, p.weeks);
    const m = plan.meta;
    return K.Card({ flat:true, pad:'sm', body:html`
      <span class="mono-label">Planın böyle olacak</span>
      ${K.Cols(4, [
        K.Stat({ label:'Hafta', value:m.total }),
        K.Stat({ label:'Haftada konu', value:m.perWeek }),
        K.Stat({ label:'Kapsama', value:'%'+m.coverage, tone:m.coverage >= 80 ? 'ok' : 'warn' }),
        K.Stat({ label:'Karar kapısı', value:(m.gates || []).length }),
      ])}
      <p class="tiny dim mt-8">İlk hafta: ${plan.weeks[0].topics.join(' · ')}</p>` });
  }

  const BODIES = { kim:bodyKim, hedef:bodyHedef, takvim:bodyTakvim, kapasite:bodyKapasite, seviye:bodySeviye };

  /* ---------- sihirbaz ---------- */

  function open(opts){
    const o = opts || {};
    if(!draft) startDraft();
    if(o.step != null) step = o.step;
    if(o.calendarOnly){ step = 2; }
    render();
  }

  function render(){
    const s = STEPS[step];
    const first = step === 0;
    const last = step === STEPS.length - 1;
    const isFirstRun = needed();

    UI.sheet({
      title:s.title,
      subtitle:'Adım '+(step+1)+' / '+STEPS.length+' · '+s.note,
      wide:true,
      body:String(K.Stack([
        html`<div class="wizsteps">${map(STEPS, (x, i) => html`
          <span class="${i === step ? 'wizstep is-on' : i < step ? 'wizstep is-done' : 'wizstep'}"
            title="${x.title}"></span>`)}</div>`,
        BODIES[s.id](),
      ])),
      footer:String(html`
        ${when(!first, () => K.Button({ label:'Geri', act:'setup-back' }))}
        ${when(first && !isFirstRun, () => K.Button({ label:'Vazgeç', act:'sheet-close' }))}
        ${last
          ? K.Button({ label:isFirstRun ? 'Planı üret ve başla' : 'Kaydet ve planı güncelle',
              tone:'primary', act:'setup-save' })
          : K.Button({ label:'Devam', tone:'primary', act:'setup-next' })}`),
      noFocus:true,
    });

    ['sw-start', 'sw-exam'].forEach(id => {
      const el = document.getElementById(id);
      if(el) el.addEventListener('change', refreshPreview);
    });
  }

  function refreshPreview(){
    capture();
    const box = document.getElementById('su-preview');
    if(box) box.innerHTML = String(previewHtml(draft.startDate, draft.examTytISO));
    const cap = document.getElementById('sw-caphint');
    if(cap) cap.innerHTML = String(capacityHint(draft.capacityHoursPerWeek, draft.studyDaysPerWeek));
    const pp = document.getElementById('sw-planpreview');
    if(pp) pp.innerHTML = String(planPreview());
  }

  function next(){
    capture();
    if(STEPS[step].id === 'takvim'){
      const p = preview(draft.startDate, draft.examTytISO);
      if(p.days <= 0){ UI.toast('Sınav tarihi başlangıçtan sonra olmalı'); return; }
    }
    step = Math.min(step + 1, STEPS.length - 1);
    render();
  }
  function back(){
    capture();
    step = Math.max(0, step - 1);
    render();
  }
  function setLevel(id){
    capture();
    draft.level = id;
    render();
  }
  function toggleWeak(id){
    capture();
    const i = draft.weakSubjects.indexOf(id);
    if(i >= 0) draft.weakSubjects.splice(i, 1); else draft.weakSubjects.push(id);
    render();
  }
  function quick(startISO){
    const el = document.getElementById('sw-start');
    if(el){ el.value = startISO; refreshPreview(); }
  }

  async function save(){
    capture();
    if(U.diffDays(draft.startDate, draft.examTytISO) <= 0){
      UI.toast('Sınav tarihi başlangıçtan sonra olmalı');
      return;
    }
    if(!draft.targetRank){
      UI.toast('Hedef başarı sırası gerekli — 2. adıma dön');
      step = 1; render();
      return;
    }
    const p = S.profile;
    p.name = draft.name;
    p.city = draft.city;
    p.program = draft.program || p.program;
    p.targetRank = draft.targetRank;
    p.diplomaGrade = draft.diplomaGrade;
    p.startDate = draft.startDate;
    p.examTytISO = draft.examTytISO;
    p.examAytISO = U.iso(U.addDays(U.parse(draft.examTytISO), 1));
    p.capacityHoursPerWeek = draft.capacityHoursPerWeek;
    p.studyDaysPerWeek = draft.studyDaysPerWeek;
    p.sleepTarget = draft.sleepTarget;
    p.level = draft.level;
    p.weakSubjects = draft.weakSubjects;
    p.setupDone = true;
    await M.saveProfile();

    const plan = await M.ensurePlan(true);
    await M.ensureWeek(M.currentWeek());
    await M.ensureDay(U.today());
    await R.Auto.syncDayBlocks();

    draft = null;
    step = 0;
    UI.closeSheet();
    UI.toast(plan.meta.total+' haftalık plan üretildi · %'+plan.meta.coverage+' kapsama');
    R.App.render();
  }

  /* Bugün ekranındaki kurulum kartı */
  function card(){
    if(!needed()) return '';
    return String(K.NextUp({
      icon:'flag', label:'Kurulum', title:'Programını kuralım',
      why:'Beş kısa adım: hedef, takvim, kapasite ve seviye. Sonunda plan sana göre üretilir — '
        + 'kimsenin planı bir diğerininkiyle aynı olmaz.',
      action:K.Button({ label:'Başla', tone:'primary', act:'setup-open' }),
    }));
  }

  return { needed, open, render, next, back, save, quick, card, setLevel, toggleWeak,
    preview, previewHtml, nextMonday, refreshPreview, STEPS };
})();

/* ==== js/screens/today.js ==== */
/* Bugün — günlük operasyon ekranı.

   ŞABLON DÜZENİ (diğer ekranlar için referans):
   - Görünüm h.html`` ile yazılır; araya giren değerler otomatik kaçırılır.
   - Yapı parçaları C.* bileşenlerinden gelir (Card, Stat, Button, Notice…).
   - Yapısal HTML gerektiğinde h.raw() ile işaretlenir.
   - Etkileşim yalnız data-act / data-change ile bağlanır; inline onclick yok.
   - render() tek bir C.Grid döndürür; kolonlar C.Span ile verilir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.today = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const c = R.C;

  function todayDoc(){ return S.days[U.todayISO()]; }

  /* ---------- zamanlayici ---------- */
  let tickHandle = null;

  function runningBlock(){
    const day = todayDoc();
    return day ? (day.blocks.find(b => b.startedAt) || null) : null;
  }
  function elapsedSeconds(block){
    if(!block || !block.startedAt) return 0;
    return Math.max(0, Math.floor((Date.now() - new Date(block.startedAt).getTime())/1000));
  }
  function startTick(){
    stopTick();
    tickHandle = setInterval(() => {
      const b = runningBlock();
      const el = document.getElementById('timer-clock');
      if(!b || !el){ stopTick(); return; }
      el.textContent = U.fmtClock(elapsedSeconds(b));
    }, 1000);
  }
  function stopTick(){
    if(tickHandle){ clearInterval(tickHandle); tickHandle = null; }
  }

  /* ---------- parcalar ---------- */

  function AnchorTile(o){
    const pct = o.target ? Math.min(100, 100*o.actual/o.target) : 0;
    const step = d => c.Button({ label:d > 0 ? '+'+d : '−', size:'sm', class:'grow',
      aria:(d > 0 ? 'artır' : 'azalt'), act:'anchor', data:{ 'data-kind':o.kind, 'data-delta':d } });
    return c.Card({ pad:'sm', body:html`
      <div class="stack-xs">
        <div class="row between">
          <span class="stat__label">${o.label}</span>
          ${o.actual >= o.target ? c.Badge({ label:'tamam', tone:'ok' }) : html`<span class="tiny dim">${o.hint}</span>`}
        </div>
        <span class="anchor__value num">${o.actual}<span class="dim">/${o.target}</span></span>
        ${c.Bar({ value:pct, tone:'' })}
        <div class="row row--tight">${step(-1)}${step(1)}${step(5)}</div>
      </div>` });
  }

  function AnchorPane(day){
    return c.Cols(2, html`
      ${AnchorTile({ label:'Paragraf', actual:day.paragraphActual, target:day.paragraphTarget, kind:'paragraph', hint:'günlük 15–20' })}
      ${AnchorTile({ label:'Problem', actual:day.problemActual, target:day.problemTarget, kind:'problem', hint:'günlük 15–20' })}`);
  }

  function StatusBadge(status){
    const m = { done:['Tamamlandı','ok'], partial:['Yarım','warn'], skipped:['Atlandı','muted'], pending:['Bekliyor','muted'] };
    const [label, tone] = m[status] || m.pending;
    return c.Badge({ label, tone, icon:status === 'done' });
  }

  const STATUSES = [['pending','Bekliyor'],['done','Tamamlandı'],['partial','Yarım'],['skipped','Atlandı']];

  function BlockCard(b){
    const running = !!b.startedAt;
    const done = b.status === 'done' || b.status === 'partial';
    const acc = (b.actualQ && b.correctQ != null) ? U.pct(b.correctQ, b.actualQ) : null;

    const numField = (label, field, value) => c.Field({ label, input:c.Input({
      type:'number', min:0, size:'sm', numeric:true, value:value == null ? '' : value,
      change:'block-num', data:{ 'data-field':field, 'data-block':b.id } }) });

    return html`
      <article class="${R.h.cls('block', running && 'is-running', !running && b.status === 'done' && 'is-done',
        !running && b.status === 'partial' && 'is-partial', b.status === 'skipped' && 'is-skipped')}">
        <div class="row between block__top">
          <div class="grow">
            <div class="block__slot">${b.slot} · ${b.targetMin} dk${when(b.targetQ, () => html` · ${b.targetQ} soru`)}</div>
            ${c.Input({ class:'input--ghost block__topic', value:b.topic, aria:'blok konusu',
              change:'block-topic', data:{ 'data-block':b.id } })}
            <div class="tiny dim block__subject">${b.subject}</div>
          </div>
          ${running
            ? html`<div class="stack-xs block__timer-wrap">
                <span class="block__timer" id="timer-clock">${U.fmtClock(elapsedSeconds(b))}</span>
                ${c.Button({ label:'Bitir', icon:'stop', tone:'primary', size:'sm', act:'timer-stop', data:{ 'data-block':b.id } })}
              </div>`
            : b.status === 'pending'
              ? c.Button({ label:'Başlat', icon:'play', size:'sm', act:'timer-start', data:{ 'data-block':b.id } })
              : StatusBadge(b.status)}
        </div>

        ${c.Segmented({ items:STATUSES.map(s => ({ value:s[0], label:s[1] })), value:b.status,
          act:'block-status', block:true, primary:true, aria:'blok durumu', data:{ 'data-block':b.id } })}

        ${c.Cols(2, html`
          ${c.Field({ label:'Ders', input:c.Select({ size:'sm', value:b.subjectId || '',
            change:'block-subject', data:{ 'data-block':b.id },
            options:[{ value:'', label:'— bağlanmadı —' }].concat(R.SUBJECTS.map(s => ({ value:s.id, label:s.name }))) }) })}
          ${c.Field({ label:'Konu', input:c.Select({ size:'sm', value:b.topicId || '',
            change:'block-topic-ref', data:{ 'data-block':b.id },
            options:blockTopicOptions(b.subjectId) }) })}
        `)}

        ${when(done, () => html`
          <div class="cols-3">
            ${numField('Dakika','actualMin', b.actualMin)}
            ${numField('Soru','actualQ', b.actualQ)}
            ${numField('Doğru','correctQ', b.correctQ)}
          </div>
          ${when(acc != null, () => html`<div class="${acc >= 70 ? 'tiny dim' : 'tiny tone-warn'}">Doğruluk %${acc}${acc < 70 ? ' — hedef eşiğin altında' : ''}</div>`)}`)}

        ${when(b.status === 'skipped', () => html`
          <div class="stack-xs">
            <span class="mono-label">Neden atlandı?</span>
            <div class="row wrap row--tight">
              ${map(R.SKIP_REASONS, r => c.Chip({ label:r, on:b.skipReason === r, act:'skip-reason',
                data:{ 'data-block':b.id, 'data-reason':r } }))}
            </div>
          </div>`)}
      </article>`;
  }

  function blockTopicOptions(subjectId){
    const s = R.SUBJECTS.find(x => x.id === subjectId);
    if(!s) return [{ value:'', label:'— önce ders —' }];
    return [{ value:'', label:'— konu —' }].concat(s.topics.map(t => ({ value:t.id, label:t.name })));
  }

  function NextUpCard(){
    const a = C.nextAction();
    const clickable = a.route || a.act;
    return c.NextUp({
      icon:a.icon, label:a.label, title:a.title, why:a.why, hint:'next-action', calm:a.tone === 'calm',
      action:when(clickable, () => c.Button({ label:'Başla', tone:'primary', act:'next-action',
        data:{ 'data-route':a.route || '', 'data-next':a.act || '', 'data-block':a.blockId || '' } })),
    });
  }

  function StreakCard(){
    const s = C.behaviorStreak();
    return c.Card({ pad:'sm', body:html`
      <div class="row between">
        <span class="stat__label">Davranış serisi${raw(UI.hint('streak'))}</span>
        <b class="num">${s.streak}<span class="dim streak__unit"> gün</span></b>
      </div>
      <div class="streak">
        <div class="streak__dots">
          ${map(s.days, d => html`<span class="${R.h.cls('streak__dot', d.met && 'is-on', d.today && 'is-today')}"
            title="${U.fmtShort(d.iso)}${d.met ? ' · tamam' : ''}"></span>`)}
        </div>
      </div>
      <p class="tiny dim">${s.streak === 0 ? 'Minimum standardı tutturunca seri başlar.' : 'Ödül nete değil düzene bağlı.'}</p>` });
  }

  function SleepCard(day){
    const avg = C.sleepAverage(7);
    return c.Card({ pad:'sm', body:html`
      <div class="row between">
        <span class="stat__label">Uyku${raw(UI.hint('sleep'))}</span>
        ${when(avg != null, () => html`<span class="tiny dim">7 gün ort. ${avg} sa</span>`)}
      </div>
      <div class="row sleep__row">
        ${c.Input({ type:'number', step:0.5, min:0, max:14, size:'sm', numeric:true, class:'sleep__input',
          value:day.sleepHours == null ? '' : day.sleepHours, aria:'uyku saati', change:'sleep' })}
        <span class="small muted">saat · hedef ${S.profile.sleepTarget}</span>
      </div>
      ${when(day.sleepHours != null && day.sleepHours < 6.5,
        () => html`<p class="tiny tone-warn">Uyku bellek pekişmesinin parçasıdır — bugünkü hedefi hafiflet.</p>`)}` });
  }

  function RitualCard(day){
    const ritual = R.WEEKDAYS[day.dow].ritual;
    if(!ritual) return '';
    const list = R.CHECKLISTS[{ contract:'monday', exam:'saturday', review:'sunday' }[ritual]];
    const state = day.checklist || {};
    const cta = ritual === 'contract'
      ? c.Button({ label:'Haftalık sözleşmeyi aç', tone:'primary', block:true, act:'go', data:{ 'data-route':'week' } })
      : ritual === 'exam'
        ? c.Button({ label:'Deneme ekle', tone:'primary', block:true, act:'go', data:{ 'data-route':'exams' } })
        : c.Button({ label:'Weekly review’u aç', tone:'primary', block:true, act:'open-review' });
