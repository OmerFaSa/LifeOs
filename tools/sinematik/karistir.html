<!doctype html><html lang="tr"><head><meta charset="utf-8"><title>Tanıtım filmi sesi</title></head><body>
<button id="b" style="font-size:24px;padding:20px">Kaydet</button><pre id="o"></pre>
<script>
/* Tanıtım filminin sesi: müzik burada sentezlenir, anlatımla karıştırılır, WebCodecs ile AAC'ye kodlanır.
   Akor ve geçiş zamanları SURE = 64 sn kurguya göre yazıldı; kurgu değişirse AKOR_T ve GECIS de değişir. */
let SATIR = [];   // sinematik.js'ten okunur (tek kaynak)
const SURE = 65.5, HZ = 48000, log = s => (document.getElementById('o').textContent += s + '\n');
const nota = n => 440 * Math.pow(2, (n - 69) / 12);   // MIDI
// D majör: D Bm G A D Bm G A→D
// Gece: Bm koyu başlar; gün doğunca D; gün batınca yine yumuşar; son akor D.
const AKOR = [[47,62,66,69,71],[43,62,67,71,74],[50,62,66,69,73],[45,61,64,69,71],[50,62,66,69,74],[47,62,66,69,71],[43,62,67,71,74],[45,61,64,69,73],
              [50,62,66,69,73],[47,62,66,69,71],[43,62,67,71,74],[45,61,64,69,71],[43,59,62,67,71],[45,61,64,67,69],[47,62,66,69,74],[43,62,67,71,74],[50,62,66,69,74]];
const AKOR_T = [0,4.6,9.6,14.4,19.2,24.0,28.8,34.0,38.6,43.2,46.8,49.8,53.0,55.4,57.6,59.6,61.6];
const GECIS = [10.0, 14.4, 24.0, 34.0, 43.2, 49.8, 56.2];
function muzik(ctx, cikis){
  const ana = ctx.createGain(); ana.connect(cikis);
  // ana ses: anlatım sırasında kısılır
  ana.gain.setValueAtTime(0, 0); ana.gain.linearRampToValueAtTime(0.7, 3.0); ana.gain.linearRampToValueAtTime(1, 9.6);
  SATIR.forEach(([t, s]) => { ana.gain.setTargetAtTime(0.5, t - 0.2, 0.12); ana.gain.setTargetAtTime(1, t + s + 0.1, 0.35); });
  ana.gain.setTargetAtTime(0, 63.4, 0.7);
  const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1100; lp.Q.value = 0.3; lp.connect(ana);
  AKOR.forEach((a, i) => {
    const t0 = AKOR_T[i], t1 = (AKOR_T[i + 1] || SURE) + 1.4;
    a.forEach((n, j) => {
      [-5, 5].forEach(c => {
        const o = ctx.createOscillator(), g = ctx.createGain();
        o.type = j === 0 ? 'sine' : 'triangle'; o.frequency.value = nota(j === 0 ? n - 12 : n); o.detune.value = c;
        const v = j === 0 ? 0.07 : 0.022;
        g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + 1.4); g.gain.setValueAtTime(v, t1 - 1.4); g.gain.linearRampToValueAtTime(0, t1);
        o.connect(g); g.connect(lp); o.start(t0); o.stop(t1 + 0.1);
      });
    });
  });
  // müzik kutusu arpeji
  const desen = [1,0,1,1,0,1,0,1], adim = 60 / 84 / 2;
  const kutu = ctx.createGain(); kutu.gain.value = 1; kutu.connect(ana);
  for(let t = 9.6, k = 0; t < 62.0; t += adim, k++){
    if(!desen[k % 8]) continue;
    let i = AKOR_T.length - 1; while(AKOR_T[i] > t) i--;
    const a = AKOR[i].slice(1), n = a[(k * 3 + (k >> 3)) % a.length] + 12;
    const o = ctx.createOscillator(), o2 = ctx.createOscillator(), g = ctx.createGain(), p = ctx.createStereoPanner();
    o.type = 'sine'; o.frequency.value = nota(n); o2.type = 'sine'; o2.frequency.value = nota(n) * 2;
    const g2 = ctx.createGain(); g2.gain.value = 0.25;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0005, t + 1.1);
    p.pan.value = Math.sin(k * 1.3) * 0.5;
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(p); p.connect(kutu);
    o.start(t); o2.start(t); o.stop(t + 1.2); o2.stop(t + 1.2);
  }
  // başlıkta ve sonda yumuşak bir dalga: süzülmüş gürültü kabarır, söner
  const gb = ctx.createBuffer(1, HZ * 4, HZ), gd = gb.getChannelData(0); for(let i = 0; i < gd.length; i++) gd[i] = Math.random() * 2 - 1;
  [[8.4, 10.0], [60.0, 61.6]].forEach(([a, b]) => {
    const n = ctx.createBufferSource(), f = ctx.createBiquadFilter(), g = ctx.createGain();
    n.buffer = gb; f.type = 'bandpass'; f.frequency.setValueAtTime(400, a); f.frequency.exponentialRampToValueAtTime(3000, b); f.Q.value = 0.7;
    g.gain.setValueAtTime(0, a); g.gain.linearRampToValueAtTime(0.05, b); g.gain.exponentialRampToValueAtTime(0.0005, b + 2.2);
    n.connect(f); f.connect(g); g.connect(cikis); n.start(a); n.stop(b + 2.3);
  });
  // geçiş çanı
  GECIS.concat([61.6]).forEach((t, i) => {
    [[nota(86), 0.035], [nota(86) * 2.76, 0.012], [nota(93), 0.02]].forEach(([f, v], j) => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      const b = t + j * 0.09;
      g.gain.setValueAtTime(0, b); g.gain.linearRampToValueAtTime(v, b + 0.01); g.gain.exponentialRampToValueAtTime(0.0003, b + 2.2);
      o.connect(g); g.connect(cikis); o.start(b); o.stop(b + 2.3);
    });
  });
}
async function satirOku(){
  const k = await (await fetch('/sinematik.js')).text(), m = k.match(/const SATIR = Object\.freeze\((\[[\s\S]*?\])\);/);
  SATIR = JSON.parse(m[1]);
  const s = k.match(/SURE = ([\d.]+)/); return Number(s[1]);
}
async function karistir(){
  const filmSure = await satirOku(); log('film ' + filmSure + ' sn, ' + SATIR.length + ' satir');
  const ctx = new OfflineAudioContext(2, Math.ceil(SURE * HZ), HZ);
  const ust = ctx.createGain(); ust.gain.value = 0.9; ust.connect(ctx.destination);
  const mb = ctx.createGain(); mb.gain.value = 0.85; mb.connect(ust);
  muzik(ctx, mb);
  for(let i = 0; i < SATIR.length; i++){
    const r = await fetch('/ses/' + String(i).padStart(2, '0') + '.wav');
    const buf = await ctx.decodeAudioData(await r.arrayBuffer());
    const s = ctx.createBufferSource(), g = ctx.createGain(); g.gain.value = 1.15;
    s.buffer = buf; s.connect(g); g.connect(ust); s.start(SATIR[i][0]);
    log(i + ' ' + buf.duration.toFixed(2));
  }
  const out = await ctx.startRendering();
  let tepe = 0; for(let c = 0; c < 2; c++){ const d = out.getChannelData(c); for(let i = 0; i < d.length; i++) tepe = Math.max(tepe, Math.abs(d[i])); }
  const k = 0.89 / tepe; for(let c = 0; c < 2; c++){ const d = out.getChannelData(c); for(let i = 0; i < d.length; i++) d[i] *= k; }
  log('tepe ' + tepe.toFixed(3));
  return out;
}
document.getElementById('b').onclick = async () => {
  const buf = await karistir();
  const parca = [];
  const enc = new AudioEncoder({ output:c => { const b = new Uint8Array(c.byteLength); c.copyTo(b); parca.push(b); }, error:e => log('HATA ' + e) });
  const cfg = { codec:'mp4a.40.2', sampleRate:HZ, numberOfChannels:2, bitrate:96000, aac:{ format:'adts' } };
  log('destek ' + JSON.stringify((await AudioEncoder.isConfigSupported(cfg)).supported));
  enc.configure(cfg);
  const L = buf.getChannelData(0), R = buf.getChannelData(1), N = 4800;
  for(let i = 0; i < L.length; i += N){
    const n = Math.min(N, L.length - i), d = new Float32Array(n * 2);
    d.set(L.subarray(i, i + n), 0); d.set(R.subarray(i, i + n), n);
    enc.encode(new AudioData({ format:'f32-planar', sampleRate:HZ, numberOfFrames:n, numberOfChannels:2, timestamp:Math.round(i / HZ * 1e6), data:d }));
  }
  await enc.flush();
  const b = new Blob(parca);
  await fetch('/kaydet', { method:'POST', body:b });
  log('KAYDEDILDI ' + parca.length + ' ' + b.size);
};
</script></body></html>
