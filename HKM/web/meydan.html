<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Meydan · HKM</title>
<style>
/* MEYDAN — sistemin kendi akisi, mini uygulama (core/meydan.py).

   Bu sayfa HICBIR sayi hesaplamaz ve hicbir cumle kurmaz: gonderinin
   cumlesi, sayisi, kesinligi, sirasi ve tekrar araliklari daemon'dan
   geldigi gibi yazilir. Tek dosyadir, ortak dosya yuklemez; HKM yuzunun
   jetonunu (`hkm.token`) ve temasini (`hkm.tema`) okur. HKM yuzunde
   ortada acilan pencerenin icinde (`?uygulama=1`) ya da tek basina acilir.

   Renk sahipligi: AYS mavi, SPİ yesil, ESP turuncu, Merkez mor; mor ayrica
   yalniz kullanicinin karar verecegi yerde. Avatarin SEKLI de modulu
   soyler (AYS kare, SPİ daire, ESP karo, Merkez altigen). Begeni sayisi,
   izlenme, seri yoktur; hikaye kendiliginden ilerlemez. */
:root{
  --bg:#F3F4F7; --yuzey:#FFFFFF; --yuzey-2:#F1F2F5; --yuzey-3:#E9EBEF; --fg:#0F1115; --dim:#5E6572; --soluk:#626873;
  --line:#E6E8EC; --line-strong:#D3D7DE;
  --ok:#17784A; --warn:#8C6400; --danger:#C0372F;
  --accent:#7453D4; --on-accent:#FFFFFF; --mer-t:#F1EEFB;
  --ays:#2D5BE3; --spi:#0A7A69; --esp:#A65B0F; --mer:#7453D4; --sen:#5E6572; --av-yazi:#FFFFFF;
  --golge:0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.04);
  --golge-2:0 10px 30px rgba(16,24,40,.12), 0 2px 6px rgba(16,24,40,.06);
  --font:Inter, "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  --mono:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --ust-h:60px; --alt-h:64px;
}
@media (prefers-color-scheme: dark){
  html:not([data-tema="acik"]){
    --bg:#0A0A0D; --yuzey:#141519; --yuzey-2:#1B1C21; --yuzey-3:#23252B; --fg:#EDEEF0; --dim:#A3A9B4; --soluk:#8C929D;
    --line:#24262C; --line-strong:#33363D;
    --ok:#3FBF7F; --warn:#D9A441; --danger:#F06A62;
    --accent:#9A86FF; --on-accent:#0A0A0D; --mer-t:#1C1733;
    --ays:#4F86FF; --spi:#2EC4A9; --esp:#F2A93B; --mer:#9A86FF; --sen:#A3A9B4; --av-yazi:#0A0A0D;
    --golge:0 1px 2px rgba(0,0,0,.4); --golge-2:0 14px 40px rgba(0,0,0,.5); }
}
html[data-tema="koyu"]{
  --bg:#0A0A0D; --yuzey:#141519; --yuzey-2:#1B1C21; --yuzey-3:#23252B; --fg:#EDEEF0; --dim:#A3A9B4; --soluk:#8C929D;
  --line:#24262C; --line-strong:#33363D;
  --ok:#3FBF7F; --warn:#D9A441; --danger:#F06A62;
  --accent:#9A86FF; --on-accent:#0A0A0D; --mer-t:#1C1733;
  --ays:#4F86FF; --spi:#2EC4A9; --esp:#F2A93B; --mer:#9A86FF; --sen:#A3A9B4; --av-yazi:#0A0A0D;
  --golge:0 1px 2px rgba(0,0,0,.4); --golge-2:0 14px 40px rgba(0,0,0,.5);
}
*{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; height:100%; }
body{ background:var(--yuzey-3); color:var(--fg); font:15px/1.5 var(--font); -webkit-font-smoothing:antialiased; overflow:hidden; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--accent); outline-offset:2px; border-radius:10px; }
a{ color:inherit; }
.num{ font-variant-numeric:tabular-nums; }
svg{ display:block; }

/* ---------------- kabuk: tek sutunlu uygulama */
.kabuk{ position:relative; height:100%; max-width:520px; margin:0 auto; display:flex; flex-direction:column;
  background:var(--bg); box-shadow:0 0 0 1px var(--line); overflow:hidden; }
.uygulama body{ background:var(--bg); }
.uygulama .kabuk{ max-width:none; box-shadow:none; }
.ust{ flex:none; height:calc(var(--ust-h) + env(safe-area-inset-top,0px)); padding:env(safe-area-inset-top,0px) 12px 0 16px;
  display:flex; align-items:center; gap:12px; background:color-mix(in srgb, var(--bg) 86%, transparent);
  backdrop-filter:saturate(160%) blur(14px); border-bottom:1px solid var(--line); position:relative; z-index:4; }
.tutma{ display:none; position:absolute; top:6px; left:50%; width:38px; height:4px; margin-left:-19px; border-radius:2px; background:var(--line-strong); }
.isaret{ width:32px; height:32px; border-radius:10px; flex:none; display:grid; grid-template-columns:1fr 1fr; gap:3px; padding:7px;
  background:linear-gradient(145deg, #1B1C22, #2B2D36); box-shadow:inset 0 0 0 1px rgba(255,255,255,.08); }
.isaret i{ border-radius:2px; }
.isaret i:nth-child(1){ background:#4F86FF; } .isaret i:nth-child(2){ background:#2EC4A9; border-radius:50%; }
.isaret i:nth-child(3){ background:#F2A93B; transform:rotate(45deg) scale(.82); } .isaret i:nth-child(4){ background:#9A86FF; border-radius:50%; }
.ust .ad{ flex:1; min-width:0; }
.ust .ad b{ display:block; font-size:18px; font-weight:750; letter-spacing:-.02em; line-height:1.15; }
.ust .ad small{ display:block; font-size:12.5px; color:var(--dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.hap{ display:inline-flex; align-items:center; gap:6px; height:32px; padding:0 12px; border-radius:16px;
  background:var(--mer-t); color:var(--accent); font-size:13px; font-weight:700; white-space:nowrap; }
.kapat{ width:34px; height:34px; border-radius:17px; display:grid; place-items:center; background:var(--yuzey-2); color:var(--fg); flex:none; }
.kapat:hover{ background:var(--line); }
.kapat svg{ width:16px; height:16px; }
.ust a.hkm{ font-size:13px; font-weight:700; text-decoration:none; padding:7px 12px; border-radius:16px; background:var(--yuzey-2); }
.kabuk.u .ust a.hkm{ display:none; }
.kabuk:not(.u) #kapat{ display:none; }
.kabuk.u .tutma{ display:block; }

.govde{ flex:1; overflow-y:auto; overscroll-behavior:contain; }
.alt{ flex:none; height:calc(var(--alt-h) + env(safe-area-inset-bottom,0px)); padding:0 6px env(safe-area-inset-bottom,0px);
  display:grid; grid-template-columns:repeat(5, 1fr); align-items:center; background:color-mix(in srgb, var(--yuzey) 92%, transparent);
  backdrop-filter:saturate(160%) blur(14px); border-top:1px solid var(--line); position:relative; z-index:4; }
.sekme{ display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0; color:var(--soluk); font-size:11px;
  font-weight:650; position:relative; min-width:0; }
.sekme svg{ width:22px; height:22px; }
.sekme[aria-current="page"]{ color:var(--fg); }
.sekme .rozet{ position:absolute; top:0; left:calc(50% + 6px); min-width:18px; height:18px; padding:0 5px; border-radius:9px;
  background:var(--accent); color:var(--on-accent); font-size:10.5px; font-weight:700; line-height:18px; text-align:center; font-style:normal;
  box-shadow:0 0 0 2px var(--yuzey); }
.arti{ justify-self:center; width:48px; height:40px; border-radius:14px; background:var(--fg); color:var(--bg); display:grid; place-items:center; box-shadow:var(--golge-2); }
.arti svg{ width:22px; height:22px; }

/* ---------------- hikayeler */
.hikayeler{ display:flex; gap:14px; overflow-x:auto; padding:16px 16px 12px; scrollbar-width:none; }
.hikayeler::-webkit-scrollbar{ display:none; }
.hk{ display:flex; flex-direction:column; align-items:center; gap:6px; width:68px; flex:none; }
.halka{ width:66px; height:66px; padding:2.5px; border-radius:50%;
  background:conic-gradient(from 210deg, var(--c), color-mix(in srgb, var(--c) 35%, #fff), var(--c)); transition:transform .15s; }
.hk:active .halka{ transform:scale(.95); }
.hk.gordu .halka{ background:var(--line-strong); }
.halka .ic{ width:100%; height:100%; border-radius:50%; background:var(--bg); display:grid; place-items:center; }
.halka .av{ width:52px; height:52px; font-size:17px; }
.hk .ad{ font-size:11.5px; color:var(--dim); max-width:68px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hk.yeni .halka{ background:none; border:1.5px dashed var(--line-strong); padding:2px; }
.hk.yeni .ic{ background:var(--yuzey); color:var(--fg); }
.hk.yeni svg{ width:22px; height:22px; }

/* ---------------- avatar: sekil modulu soyler */
.av{ width:40px; height:40px; display:grid; place-items:center; color:var(--av-yazi); font-weight:700; font-size:14px; flex:none;
  background:linear-gradient(145deg, color-mix(in srgb, var(--c) 88%, #fff), color-mix(in srgb, var(--c) 78%, #000)); }
.av.ays{ border-radius:11px; } .av.spi, .av.sen{ border-radius:50%; }
.av.esp{ clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%); }
.av.merkez{ clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%); }
.c-ays{ --c:var(--ays); } .c-spi{ --c:var(--spi); } .c-esp{ --c:var(--esp); } .c-merkez{ --c:var(--mer); } .c-sen{ --c:var(--sen); }

/* ---------------- suzgec */
.suzgec{ display:flex; gap:6px; overflow-x:auto; padding:2px 16px 12px; scrollbar-width:none; }
.suzgec::-webkit-scrollbar{ display:none; }
.cip{ display:inline-flex; align-items:center; gap:7px; height:34px; padding:0 14px; border-radius:17px; background:var(--yuzey);
  box-shadow:inset 0 0 0 1px var(--line); font-size:13.5px; font-weight:650; white-space:nowrap; color:var(--dim); }
.cip[aria-pressed="true"]{ background:var(--fg); color:var(--bg); box-shadow:none; }
.cip .sekil{ width:9px; height:9px; }

/* ---------------- akis ve kart */
.akis{ display:flex; flex-direction:column; gap:10px; padding:0 12px 20px; }
.g{ background:var(--yuzey); border-radius:20px; box-shadow:var(--golge), inset 0 0 0 1px var(--line); padding:14px 14px 6px; animation:gel .3s ease both; }
@keyframes gel{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }
.g.bekliyor{ border:1.5px solid color-mix(in srgb, var(--accent) 55%, transparent); box-shadow:var(--golge); padding:12.5px 12.5px 4.5px; }
.serit{ display:flex; align-items:center; gap:8px; margin:-12.5px -12.5px 12px; padding:9px 14px; border-radius:18.5px 18.5px 0 0;
  background:var(--mer-t); color:var(--accent); font-size:12.5px; font-weight:700; }
.serit::before{ content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
.gb{ display:flex; align-items:center; gap:10px; }
.gb .kim{ flex:1; min-width:0; }
.gb .kim b{ font-size:14.5px; font-weight:700; }
.gb .kim .alt-satir{ display:flex; align-items:center; gap:6px; font-size:12px; color:var(--soluk); margin-top:1px; }
.mr{ font-size:10.5px; font-weight:750; letter-spacing:.04em; color:color-mix(in srgb, var(--c) 78%, var(--fg)); background:color-mix(in srgb, var(--c) 12%, transparent); border-radius:6px; padding:2px 6px; }
.tur{ font-size:11px; font-weight:700; color:var(--dim); background:var(--yuzey-2); border-radius:8px; padding:4px 8px; white-space:nowrap; }
.tur.u{ color:var(--warn); background:color-mix(in srgb, var(--warn) 12%, transparent); }
.cumle{ margin:10px 0 0; font-size:15px; line-height:1.5; overflow-wrap:anywhere; }
.seviye{ display:inline-flex; margin-top:8px; font-size:11.5px; font-weight:700; color:color-mix(in srgb, var(--c) 78%, var(--fg)); background:color-mix(in srgb, var(--c) 11%, transparent); border-radius:7px; padding:3px 8px; }
.sayilar{ display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:8px; margin-top:12px; }
.sayi{ background:var(--yuzey-2); border-radius:14px; padding:10px 12px; display:flex; flex-direction:column; gap:2px; min-width:0; }
.sayi b{ font-size:20px; font-weight:750; letter-spacing:-.02em; line-height:1.1; font-variant-numeric:tabular-nums; }
.sayi.t b{ text-decoration:underline dashed 1.5px; text-underline-offset:4px; }
.sayi.y b{ color:var(--soluk); }
.sayi span{ font-size:12px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.kes{ display:inline-flex; align-items:center; gap:4px; font:600 10.5px/1 var(--mono); color:var(--soluk); }
.kes i{ width:7px; height:7px; display:inline-block; flex:none; border-radius:50%; }
.kes.o i{ background:currentColor; }
.kes.h i{ background:linear-gradient(90deg, currentColor 50%, transparent 50%); box-shadow:inset 0 0 0 1.5px currentColor; }
.kes.t i{ border:1.5px dashed currentColor; }
.kes.y i{ height:1.5px; border-radius:0; background:currentColor; }
.eylem{ display:flex; gap:2px; margin:10px -6px 0; border-top:1px solid var(--line); padding-top:2px; }
.ey{ display:inline-flex; align-items:center; gap:6px; color:var(--dim); font-size:12.5px; font-weight:650; padding:9px 10px; border-radius:10px; }
.ey svg{ width:16px; height:16px; }
.ey:hover{ background:var(--yuzey-2); color:var(--fg); }
.ey[aria-pressed="true"]{ color:var(--fg); }
.ey[aria-pressed="true"] svg{ fill:currentColor; }
.ey.sag{ margin-left:auto; }
.nereden{ margin-top:10px; font-size:12.5px; color:var(--dim); background:var(--yuzey-2); border-radius:12px; padding:10px 12px; display:grid; gap:3px; }
.nereden b{ color:var(--fg); font-weight:650; }
.dolu{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 16px; border-radius:12px;
  background:var(--fg); color:var(--bg); font-weight:700; font-size:14px; }
.dolu.mor{ background:var(--accent); color:var(--on-accent); }
.ince{ display:inline-flex; align-items:center; justify-content:center; gap:8px; height:40px; padding:0 14px; border-radius:12px;
  background:var(--yuzey-2); color:var(--fg); font-weight:650; font-size:14px; }
.karar{ display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:12px; }
.karar small{ flex-basis:100%; font-size:12px; color:var(--dim); }
.kutu{ margin-top:12px; border-radius:16px; overflow:hidden; background:var(--yuzey-2); }

/* sinav */
.sinav{ padding:12px; display:grid; gap:8px; }
.sinav .s{ font-weight:650; font-size:15px; padding:2px 2px 4px; }
.sec{ display:flex; align-items:center; gap:12px; text-align:left; background:var(--yuzey); border-radius:12px; padding:11px 12px;
  box-shadow:inset 0 0 0 1px var(--line); font-weight:550; transition:box-shadow .15s, background .15s; width:100%; }
button.sec:hover{ box-shadow:inset 0 0 0 1.5px var(--fg); }
.sec em{ width:26px; height:26px; flex:none; border-radius:8px; display:grid; place-items:center; background:var(--yuzey-2);
  font:700 12px var(--mono); font-style:normal; color:var(--dim); }
.sec.dogru{ box-shadow:inset 0 0 0 1.5px var(--ok); background:color-mix(in srgb, var(--ok) 8%, var(--yuzey)); }
.sec.dogru em{ background:var(--ok); color:#fff; }
.sec.yanlis{ box-shadow:inset 0 0 0 1.5px var(--danger); background:color-mix(in srgb, var(--danger) 7%, var(--yuzey)); }
.sec.yanlis em{ background:var(--danger); color:#fff; }
.aciklama{ border-radius:12px; background:var(--yuzey); padding:11px 12px; font-size:14px; box-shadow:inset 0 0 0 1px var(--line); }
.aciklama b{ display:block; margin-bottom:2px; }

/* kart: cevrilen */
.kartlar{ display:grid; gap:8px; padding:12px; }
.kart{ perspective:900px; cursor:pointer; text-align:left; width:100%; display:block; }
.kart .ic, .buyuk-kart .ic{ display:grid; transition:transform .5s cubic-bezier(.2,.8,.2,1); transform-style:preserve-3d; }
.kart.cevrik .ic, .buyuk-kart.cevrik .ic{ transform:rotateY(180deg); }
.yuz{ grid-area:1/1; backface-visibility:hidden; -webkit-backface-visibility:hidden; min-height:92px; border-radius:14px; padding:14px;
  display:flex; flex-direction:column; justify-content:center; gap:4px; background:var(--yuzey); box-shadow:inset 0 0 0 1px var(--line); }
.yuz.arka{ transform:rotateY(180deg); background:color-mix(in srgb, var(--c) 9%, var(--yuzey)); box-shadow:inset 0 0 0 1px color-mix(in srgb, var(--c) 30%, transparent); }
.yuz small{ font-size:10.5px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--soluk); }
.yuz .y{ font-size:18px; font-weight:750; letter-spacing:-.01em; overflow-wrap:anywhere; }
.yuz.arka .y{ color:var(--c); }
.kalt{ display:flex; align-items:center; gap:8px; padding:0 12px 12px; flex-wrap:wrap; }
.kalt span{ margin-right:auto; font-size:12.5px; color:var(--dim); }
.kalt .dolu, .kalt .ince{ height:36px; }

/* urunler */
.gorsel img{ display:block; width:100%; height:auto; background:#F7F4EE; }
.gorsel .yer{ padding:30px; text-align:center; color:var(--dim); font-size:13.5px; }
.slaytlar{ display:flex; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none; }
.slaytlar::-webkit-scrollbar{ display:none; }
.slayt{ flex:0 0 100%; scroll-snap-align:start; padding:20px 20px 24px; min-height:210px; color:#fff;
  background:radial-gradient(120% 90% at 100% 0, color-mix(in srgb, var(--c) 55%, #fff) 0, transparent 55%),
             linear-gradient(160deg, var(--c), color-mix(in srgb, var(--c) 55%, #000)); }
.slayt small{ font:600 11.5px var(--mono); opacity:.9; letter-spacing:.06em; }
.slayt h3{ margin:8px 0 10px; font-size:22px; line-height:1.2; letter-spacing:-.02em; }
.slayt ul{ margin:0; padding-left:18px; display:grid; gap:4px; font-size:14.5px; }
.belge{ display:grid; grid-template-columns:78px minmax(0,1fr); gap:14px; padding:12px; align-items:center; }
.kagit{ height:96px; border-radius:8px; background:#fff; box-shadow:0 6px 16px rgba(16,24,40,.12), inset 0 0 0 1px #E6E8EC;
  padding:12px 10px; display:flex; flex-direction:column; gap:6px; }
.kagit i{ height:4px; border-radius:2px; background:#DDE0E6; }
.kagit i:first-child{ height:6px; width:70%; background:var(--c); }
.kagit i:nth-child(3){ width:85%; } .kagit i:nth-child(5){ width:60%; }
.belge .bilgi{ display:flex; flex-direction:column; gap:4px; min-width:0; }
.belge .bilgi b{ font-size:14.5px; overflow-wrap:anywhere; }
.belge .bilgi small{ font-size:12px; color:var(--dim); }
.belge .dug{ display:flex; gap:6px; margin-top:6px; flex-wrap:wrap; }
.belge .dug .dolu, .belge .dug .ince{ height:34px; font-size:13px; padding:0 12px; border-radius:10px; }
.belge .dug .ince{ background:var(--yuzey); }

.katli{ width:100%; min-height:44px; border-radius:14px; background:var(--yuzey); box-shadow:inset 0 0 0 1px var(--line); font-size:13px;
  font-weight:650; color:var(--dim); padding:10px 14px; }
.son{ text-align:center; padding:18px 16px 26px; color:var(--dim); font-size:13px; }
.son .tik{ width:44px; height:44px; margin:0 auto 10px; border-radius:22px; display:grid; place-items:center; background:var(--yuzey); box-shadow:var(--golge); color:var(--ok); }
.son .tik svg{ width:22px; height:22px; }
.son b{ display:block; color:var(--fg); font-size:15px; margin-bottom:4px; }
.bosdurum{ border-radius:20px; border:1.5px dashed var(--line-strong); padding:28px 20px; text-align:center; color:var(--dim); font-size:14px; }
.bosdurum b{ display:block; color:var(--fg); font-size:16px; margin-bottom:4px; }
.tekrar-seridi{ display:flex; align-items:center; gap:12px; background:var(--fg); color:var(--bg); border-radius:20px; padding:14px 14px 14px 16px; }
.tekrar-seridi .n{ font-size:28px; font-weight:800; letter-spacing:-.03em; font-variant-numeric:tabular-nums; }
.tekrar-seridi .m{ flex:1; font-size:13px; line-height:1.35; opacity:.9; }
.tekrar-seridi .m b{ display:block; font-size:14.5px; opacity:1; }
.tekrar-seridi .dolu{ background:var(--bg); color:var(--fg); height:36px; }
.baslik{ padding:18px 16px 6px; }
.baslik h1{ margin:0; font-size:24px; font-weight:800; letter-spacing:-.03em; }
.baslik p{ margin:4px 0 0; color:var(--dim); font-size:13.5px; }

/* tekrar */
.tk{ padding:6px 16px 20px; display:grid; gap:14px; }
.ilerle{ height:6px; border-radius:3px; background:var(--yuzey-3); overflow:hidden; }
.ilerle i{ display:block; height:100%; border-radius:3px; background:var(--fg); transition:width .4s; }
.buyuk-kart{ perspective:1200px; }
.buyuk-kart .yuz{ min-height:230px; border-radius:24px; padding:22px 20px; gap:10px; justify-content:flex-start; box-shadow:var(--golge-2), inset 0 0 0 1px var(--line); }
.buyuk-kart .yuz .y{ font-size:26px; line-height:1.2; margin-top:auto; margin-bottom:auto; }
.buyuk-kart .yuz p{ margin:0; color:var(--dim); font-size:14.5px; }
.buyuk-kart .yuz .soru{ font-size:14px; font-weight:600; color:var(--dim); }
.ust-bilgi{ display:flex; justify-content:space-between; gap:8px; font-size:11.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; color:var(--soluk); }
.dereceler{ display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
.dereceler button{ border-radius:14px; padding:10px 4px; display:flex; flex-direction:column; align-items:center; gap:3px; font-weight:750;
  font-size:14px; background:var(--yuzey); box-shadow:inset 0 0 0 1px var(--line); }
.dereceler button small{ font:600 11px var(--mono); color:var(--dim); }
.dereceler [data-derece="tekrar"]{ color:var(--danger); } .dereceler [data-derece="zor"]{ color:var(--warn); }
.dereceler [data-derece="iyi"]{ color:var(--ok); }
.tk-dug{ display:flex; gap:8px; }
.tk-dug .dolu{ flex:1; height:48px; border-radius:14px; font-size:15px; }
.tk-dug .ince{ height:48px; border-radius:14px; }
.liste{ background:var(--yuzey); border-radius:18px; box-shadow:inset 0 0 0 1px var(--line); padding:4px 14px; }
.liste h2{ margin:10px 0 4px; font-size:13px; font-weight:750; color:var(--dim); letter-spacing:.02em; }
.satir{ display:flex; align-items:center; gap:10px; padding:10px 0; border-top:1px solid var(--line); font-size:14px; }
.liste h2 + .satir{ border-top:0; }
.satir .av{ width:26px; height:26px; font-size:10.5px; }
.satir span{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.satir small{ font:600 11.5px var(--mono); color:var(--dim); white-space:nowrap; }
details.kendi{ background:var(--yuzey); border-radius:18px; box-shadow:inset 0 0 0 1px var(--line); padding:12px 14px; }
details.kendi summary{ cursor:pointer; font-weight:700; font-size:14.5px; }
.form{ display:grid; gap:10px; margin-top:10px; }
.alan{ width:100%; border:0; border-radius:12px; background:var(--yuzey-2); color:var(--fg); padding:12px 14px; font:inherit; box-shadow:inset 0 0 0 1px var(--line); }
textarea.alan{ resize:none; min-height:120px; font-size:16px; line-height:1.45; }
.kural{ font-size:12px; color:var(--dim); line-height:1.5; margin:0; }

/* ---------------- alt sayfa */
.perde{ position:absolute; inset:0; z-index:20; background:rgba(8,10,12,.42); opacity:0; transition:opacity .2s; }
.perde.acik{ opacity:1; }
.sayfa{ position:absolute; left:0; right:0; bottom:0; z-index:21; max-height:calc(100% - 40px); display:flex; flex-direction:column;
  background:var(--yuzey); border-radius:22px 22px 0 0; box-shadow:0 -10px 40px rgba(0,0,0,.18);
  transform:translateY(100%); transition:transform .28s cubic-bezier(.2,.9,.25,1); padding-bottom:env(safe-area-inset-bottom,0px); }
.sayfa.acik{ transform:none; }
.sayfa .bas{ display:flex; align-items:center; gap:10px; padding:18px 16px 8px; position:relative; }
.sayfa .bas::before{ content:""; position:absolute; top:7px; left:50%; width:36px; height:4px; margin-left:-18px; border-radius:2px; background:var(--line-strong); }
.sayfa .bas h2{ flex:1; margin:0; font-size:17px; font-weight:750; letter-spacing:-.01em; }
.sayfa .sy{ padding:4px 16px 18px; overflow-y:auto; display:grid; gap:12px; }
.sayfa iframe{ width:100%; height:62vh; border:0; border-radius:14px; background:#fff; box-shadow:inset 0 0 0 1px var(--line); }
.secenek{ display:flex; gap:6px; flex-wrap:wrap; }

/* ---------------- hikaye izleyici: sen gecersin */
.izle{ position:absolute; inset:0; z-index:30; display:flex; flex-direction:column; color:#fff;
  background:radial-gradient(120% 80% at 100% 0, color-mix(in srgb, var(--c) 55%, #fff) 0, transparent 50%),
             linear-gradient(165deg, var(--c), color-mix(in srgb, var(--c) 45%, #000)); animation:belir .2s ease; }
@keyframes belir{ from{ opacity:0; transform:scale(.98); } }
.cubuk{ display:flex; gap:4px; padding:calc(env(safe-area-inset-top,0px) + 12px) 12px 0; }
.cubuk span{ flex:1; height:3px; border-radius:2px; background:rgba(255,255,255,.35); }
.cubuk span.on{ background:#fff; }
.izb{ display:flex; align-items:center; gap:10px; padding:12px; position:relative; z-index:2; }
.izb .av{ width:36px; height:36px; background:#fff; color:var(--c); }
.izb .kim{ flex:1; min-width:0; }
.izb .kim b{ display:block; font-size:14.5px; }
.izb .kim small{ display:block; font-size:12px; opacity:.85; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.izb .kapat{ background:rgba(255,255,255,.18); color:#fff; }
.izg{ flex:1; display:flex; flex-direction:column; justify-content:center; gap:14px; padding:20px 28px; }
.izg small{ font:600 12px var(--mono); letter-spacing:.08em; text-transform:uppercase; opacity:.9; }
.izg .buyuk{ font-size:clamp(64px, 18vh, 120px); font-weight:800; line-height:.9; letter-spacing:-.04em; font-variant-numeric:tabular-nums; overflow-wrap:anywhere; }
.izg .buyuk-ad{ font-size:22px; font-weight:650; }
.izg .cm{ font-size:24px; font-weight:750; line-height:1.28; letter-spacing:-.01em; }
.izg .kes{ color:rgba(255,255,255,.92); }
.dokun{ position:absolute; top:80px; bottom:80px; width:40%; z-index:1; }
.dokun.sol{ left:0; } .dokun.sag{ right:0; }
.izalt{ display:flex; justify-content:space-between; gap:8px; padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 14px); position:relative; z-index:2; }
.izalt button{ height:40px; padding:0 16px; border-radius:20px; background:rgba(255,255,255,.18); font-weight:650; }

.tost{ position:absolute; left:50%; bottom:calc(var(--alt-h) + env(safe-area-inset-bottom,0px) + 12px); transform:translateX(-50%); z-index:25;
  width:max-content; max-width:calc(100% - 32px); display:flex; align-items:center; gap:14px; padding:11px 16px; border-radius:14px;
  background:var(--fg); color:var(--bg); font-size:13.5px; font-weight:550; box-shadow:var(--golge-2); }
.tost button{ font-weight:750; text-decoration:underline; }
.sakin{ background:var(--yuzey); border-radius:20px; padding:18px; box-shadow:inset 0 0 0 1px var(--line); }
.sakin b{ display:block; margin-bottom:10px; }

@media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<script>if(/[?&]uygulama=1/.test(location.search)) document.documentElement.classList.add('uygulama');</script>
<div class="kabuk" id="kabuk">
  <header class="ust" id="ust">
    <span class="tutma" aria-hidden="true"></span>
    <span class="isaret" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
    <div class="ad"><b>Meydan</b><small id="altbaslik">Dört sistemin akışı</small></div>
    <button class="hap" id="tekrar-hap" data-gorunum="tekrar" hidden><span class="num" id="tekrar-sayi"></span> tekrar</button>
    <a class="hkm" href="/">HKM</a>
    <button class="kapat" id="kapat" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
  </header>

  <main class="govde" id="govde">
    <section id="g-akis">
      <div class="hikayeler" id="hikayeler" aria-label="Günün özetleri"></div>
      <div class="suzgec" id="kapsam" role="group" aria-label="Kapsam"></div>
      <div class="akis" id="akis" aria-live="polite"></div>
    </section>
    <section id="g-tekrar" hidden>
      <div class="baslik"><h1>Tekrar</h1><p id="tk-alt">Kartı çevir, ne kadar hatırladığını seç.</p></div>
      <div id="tekrar"></div>
    </section>
    <section id="g-kayit" hidden>
      <div class="baslik"><h1>Kaydedilenler</h1><p>Gönderinin kaydettiğin andaki hali.</p></div>
      <div class="akis" id="kayit"></div>
    </section>
  </main>

  <nav class="alt" aria-label="Meydan">
    <button class="sekme" data-gorunum="akis" aria-current="page">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 10.5 12 4l8.5 6.5V20h-5.5v-5.5h-6V20H3.5z"/></svg>Akış</button>
    <button class="sekme" data-gorunum="tekrar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.7"/><path d="M20 4v4.7h-4.7"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.3"/><path d="M4 20v-4.7h4.7"/></svg>Tekrar<em class="rozet num" data-rozet hidden></em></button>
    <button class="arti" data-not aria-label="Not yaz">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="sekme" data-gorunum="kayit">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg>Kaydedilenler</button>
    <button class="sekme" data-duzen>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Düzen</button>
  </nav>

  <div class="perde" id="perde" hidden></div>
  <section class="sayfa" id="sayfa" role="dialog" aria-modal="true" aria-labelledby="sy-baslik" hidden>
    <div class="bas"><h2 id="sy-baslik"></h2><button class="kapat" id="sy-kapat" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="sy" id="sy-govde"></div>
  </section>

  <section class="izle" id="izle" hidden role="dialog" aria-modal="true" aria-label="Günün özeti">
    <div class="cubuk" id="cubuk"></div>
    <div class="izb"><div class="av" id="iz-av"></div><div class="kim"><b id="iz-ad"></b><small id="iz-rol"></small></div>
      <button class="kapat" id="iz-kapat" aria-label="Kapat"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>
    <div class="izg" id="izg"></div>
    <div class="dokun sol" id="iz-dokun-geri" aria-hidden="true"></div><div class="dokun sag" id="iz-dokun-ileri" aria-hidden="true"></div>
    <div class="izalt"><button type="button" id="iz-geri">Önceki</button><button type="button" id="iz-ileri">Sonraki</button></div>
  </section>

  <div class="tost" id="tost" hidden role="status"><span id="tost-metin"></span><button type="button" id="tost-geri" hidden>Geri al</button></div>
</div>

<script>
(function(){
  'use strict';
  var TOKEN_KEY = 'hkm.token', TEMA_KEY = 'hkm.tema', DUZEY_KEY = 'hkm.meydan.duzey';
  var UYGULAMA = document.documentElement.classList.contains('uygulama') && window.parent !== window;
  var token = null;
  try{ token = localStorage.getItem(TOKEN_KEY); }catch(e){ token = null; }
  try{ var t0 = localStorage.getItem(TEMA_KEY); if(t0 === 'acik' || t0 === 'koyu') document.documentElement.setAttribute('data-tema', t0); }catch(e){}

  var $ = function(id){ return document.getElementById(id); };
  if(UYGULAMA) $('kabuk').classList.add('u');
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' })[c];
    });
  }
  var KES = { 'ölçüldü':'o', 'hesaplandı':'h', 'tahmin':'t', 'veri yok':'y' };
  var MOD_AD = { ays:'AYS', spi:'SPİ', esp:'ESP', merkez:'Merkez', sen:'Sen' };
  var KAPSAM = [['hepsi','Hepsi'], ['ays','AYS'], ['spi','SPİ'], ['esp','ESP'], ['merkez','Merkez']];
  var DUZEY = [['sade','Sade'], ['dengeli','Dengeli'], ['tam','Tam']];
  var SVG = {
    faydali:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M7 11v9H4v-9zM7 11l4-7c1.6 0 2.5 1.1 2.2 2.6L12.6 10H19a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 17.8 20H7"/></svg>',
    kaydet:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M6.5 3.5h11v17l-5.5-3.8-5.5 3.8z"/></svg>',
    nereden:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></svg>',
    kaldir:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/></svg>',
    tik:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
    arti:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
    ses:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="width:16px;height:16px"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>'
  };
  var st = { gorunum:'akis', kapsam:'hepsi', duzey:'dengeli', veri:null, deste:null, kayit:null,
    cevir:{}, acikKatli:false, nereden:{}, sinavSonuc:{}, iz:null, onayla:null, cevapGoster:false, oturum:0 };
  try{ var d0 = localStorage.getItem(DUZEY_KEY); if(d0 === 'sade' || d0 === 'dengeli' || d0 === 'tam') st.duzey = d0; }catch(e){}

  async function api(yol, opt){
    var o = Object.assign({ headers:{} }, opt || {});
    o.headers = Object.assign({ 'Authorization':'Bearer ' + token, 'Content-Type':'application/json' }, o.headers);
    var r;
    try{ r = await fetch(yol, o); }catch(e){ return { status:0, body:null }; }
    var g = null;
    try{ g = await r.json(); }catch(e){ g = null; }
    return { status:r.status, body:g };
  }
  function yolla(yol, govde){ return api(yol, { method:'POST', body:JSON.stringify(govde || {}) }); }

  /* ---------------- ortak parcalar */
  function hesap(h){ return (st.veri && st.veri.hesaplar[h]) || { ad:h, modul:'merkez', bas:'?', rol:'' }; }
  function modulOf(h){ return hesap(h).modul || 'sen'; }
  function av(h){ var m = modulOf(h); return '<div class="av ' + m + ' c-' + m + '" aria-hidden="true">' + esc(hesap(h).bas) + '</div>'; }
  function kes(k){ return '<span class="kes ' + (KES[k] || 'y') + '"><i></i>' + esc(k) + '</span>'; }
  function sayilar(l){
    if(!l || !l.length) return '';
    return '<div class="sayilar">' + l.map(function(s){
      return '<div class="sayi ' + (KES[s[2]] || 'y') + '"><b>' + esc(s[0]) + '</b><span>' + esc(s[1]) + '</span>' + kes(s[2]) + '</div>';
    }).join('') + '</div>';
  }
  function zaman(z){ var s = String(z || ''); return s.length > 10 ? s.slice(11, 16) : s; }
  function sekil(m){
    var r = { ays:'<rect x="2" y="2" width="12" height="12" rx="2.5"/>', spi:'<circle cx="8" cy="8" r="6.5"/>',
      esp:'<rect x="3.2" y="3.2" width="9.6" height="9.6" rx="1.6" transform="rotate(45 8 8)"/>',
      merkez:'<path d="M8 1.2l5.9 3.4v6.8L8 14.8l-5.9-3.4V4.6z"/>' }[m];
    return r ? '<svg class="sekil c-' + m + '" viewBox="0 0 16 16" fill="var(--c)" aria-hidden="true">' + r + '</svg>' : '';
  }

  /* ---------------- gonderi govdeleri */
  function govde(g){
    var h = '', m = modulOf(g.hesap);
    if(g.tur === 'teklif' && g.eylem){
      if(g.eylem.tur === 'oneri'){
        h += st.onayla === g.id
          ? '<div class="karar"><button class="dolu mor" data-karar="accept" data-oneri="' + g.eylem.id + '">Kabulü onayla</button>' +
            '<button class="ince" data-karar="decline" data-oneri="' + g.eylem.id + '">Reddi onayla</button>' +
            '<button class="ince" data-vazgec>Vazgeç</button><small>Onaylar’daki kararın aynısı; reddedilen öneri silinmez.</small></div>'
          : '<div class="karar"><button class="dolu mor" data-onayla="' + esc(g.id) + '">Karar ver</button><small>Orta seviye: önce ne olacağını gösterir, sonra tek onay.</small></div>';
      } else if(g.eylem.tur === 'emir'){
        h += '<div class="karar"><a class="dolu mor" href="/" target="_top" style="text-decoration:none">HKM’de incele</a><small>Ücretli iş teklifi; seçenekleri ve maliyeti orada.</small></div>';
      }
    }
    if(g.tur === 'sinav' && g.sinav){
      var s = g.sinav, son = st.sinavSonuc[g.id];
      h += '<div class="kutu c-' + m + '"><div class="sinav">';
      if(son){
        h += '<div class="s">' + esc(son.soru) + '</div>' + son.secenekler.map(function(o, i){
          var c = i === son.dogru ? 'dogru' : (i === son.secim ? 'yanlis' : '');
          return '<div class="sec ' + c + '"><em>' + 'ABCDE'[i] + '</em><span>' + esc(o) + '</span></div>';
        }).join('') + '<div class="aciklama"><b>' + esc(son.cumle) + '</b>' + esc(son.cozum || '') + '</div>' +
          '<button class="dolu" data-sonraki="' + esc(g.id) + '">' + (s.bitti ? 'Sonucu gör' : 'Sıradaki soru') + '</button>';
      } else if(s.bitti){
        h += '<div class="aciklama"><b>Tamamlandı</b>' + esc(g.cumle) + '</div>';
      } else {
        h += '<div class="s">' + esc(s.soru) + '</div>' + s.secenekler.map(function(o, i){
          return '<button class="sec" data-cevap="' + esc(g.id) + '" data-no="' + s.no + '" data-i="' + i + '"><em>' + 'ABCDE'[i] + '</em><span>' + esc(o) + '</span></button>';
        }).join('');
      }
      h += '</div></div>';
    }
    if(g.tur === 'kart' && g.kartlar){
      h += '<div class="kutu c-' + m + '"><div class="kartlar">' + g.kartlar.map(function(k, i){
        var key = g.id + ':' + i;
        return '<button class="kart' + (st.cevir[key] ? ' cevrik' : '') + '" data-cevir="' + esc(key) + '" aria-label="Kartı çevir: ' + esc(k.on) + '"><span class="ic">' +
          '<span class="yuz"><small>Ön yüz · dokun, çevir</small><span class="y">' + esc(k.on) + '</span></span>' +
          '<span class="yuz arka"><small>Arka yüz</small><span class="y">' + esc(k.arka) + '</span></span></span></button>';
      }).join('') + '</div><div class="kalt"><span class="num">' + esc(g.kart_sayisi) + ' kart</span>' +
        (g.ses && g.kartlar.length ? '<button class="ince" style="background:var(--yuzey)" data-soyle="' + esc(g.kartlar[0].on) + '" data-dil="' + esc(g.ses) + '">' + SVG.ses + 'Dinle</button>' : '') +
        '<button class="dolu" data-desteye="' + esc(g.id) + '">Destene ekle</button></div></div>';
    }
    if(g.tur === 'urun'){
      if(g.alt === 'gorsel'){
        h += '<figure class="kutu gorsel" style="margin-inline:0;margin-bottom:0" data-svg="' + g.kayit_id + '"><div class="yer">Görsel yükleniyor…</div></figure>';
      } else if(g.alt === 'ders' && g.slaytlar){
        h += '<div class="kutu c-' + m + '"><div class="slaytlar">' + g.slaytlar.map(function(sl, i){
          return '<div class="slayt"><small>' + (i + 1) + ' / ' + g.slaytlar.length + '</small><h3>' + esc(sl.baslik) + '</h3>' +
            (sl.maddeler.length ? '<ul>' + sl.maddeler.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') + '</div>';
        }).join('') + '</div><div class="kalt" style="padding-top:12px"><span>Yana kaydır</span><button class="ince" style="background:var(--yuzey)" data-rapor="' + g.kayit_id + '">Belge olarak aç</button></div></div>';
      } else {
        h += '<div class="kutu belge c-' + m + '"><div class="kagit" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="bilgi">' +
          '<b>' + esc(g.cumle.split(':')[0]) + '</b><small>BAM kaydı · ' + esc(g.dogruluk) + '</small><div class="dug">' +
          '<button class="dolu" data-rapor="' + g.kayit_id + '">Raporu aç</button><button class="ince" data-pdf="' + g.kayit_id + '">PDF indir</button></div></div></div>';
      }
    }
    return h;
  }
  function gonderi(g){
    var hs = hesap(g.hesap), m = modulOf(g.hesap);
    var sev = g.seviye || (g.sinav && g.sinav.seviye), ner = st.nereden[g.id];
    return '<article class="g c-' + m + (g.bekliyor ? ' bekliyor' : '') + '" data-g="' + esc(g.id) + '">' +
      (g.bekliyor ? '<div class="serit">Senden karar bekliyor</div>' : '') +
      '<div class="gb">' + av(g.hesap) + '<div class="kim"><b>' + esc(hs.ad) + '</b><div class="alt-satir">' +
        '<span class="mr">' + esc(MOD_AD[m] || '') + '</span><span class="num">' + esc(zaman(g.zaman)) + '</span></div></div>' +
        '<span class="tur' + (g.uyari ? ' u' : '') + '">' + esc(g.uyari ? 'Uyarı' : g.tur_ad) + '</span></div>' +
      '<p class="cumle">' + esc(g.cumle) + '</p>' + (sev ? '<span class="seviye">Seviye: ' + esc(sev.metin) + '</span>' : '') +
      sayilar(g.sayilar) + govde(g) +
      (ner ? '<div class="nereden">' + (hs.rol ? '<span><b>' + esc(hs.ad) + ':</b> ' + esc(hs.rol) + '</span>' : '') +
        '<span><b>Olay:</b> ' + esc((g.kaynak || {}).olay || '—') + '</span><span><b>Kural:</b> ' + esc((g.kaynak || {}).kural || '—') + '</span>' +
        (g.dogruluk ? '<span><b>Doğruluk:</b> ' + esc(g.dogruluk) + '</span>' : '') + (sev ? '<span><b>Seviye:</b> ' + esc(sev.metin) + ' · ' + esc(sev.kaynak) + '</span>' : '') +
        (g.onem != null ? '<span class="num"><b>Sıra puanı:</b> ' + esc(g.onem) + '</span>' : '') + '</div>' : '') +
      '<div class="eylem">' +
        (g.hesap === 'sen' ? '<button class="ey" data-notsil="' + esc(g.id) + '">' + SVG.kaldir + 'Kaldır</button>'
          : '<button class="ey" data-isaret="faydali" data-id="' + esc(g.id) + '" aria-pressed="' + !!g.faydali + '">' + SVG.faydali + 'Faydalı</button>') +
        '<button class="ey" data-isaret="kaydet" data-id="' + esc(g.id) + '" aria-pressed="' + !!g.kayitli + '">' + SVG.kaydet + 'Kaydet</button>' +
        '<button class="ey sag" data-nereden="' + esc(g.id) + '" aria-expanded="' + !!ner + '">' + SVG.nereden + 'Nereden?</button>' +
      '</div></article>';

  /* ---------------- gorunumler */
  function cizCipler(){
    $('kapsam').innerHTML = KAPSAM.map(function(k){
      return '<button class="cip" data-kapsam="' + k[0] + '" aria-pressed="' + (st.kapsam === k[0]) + '">' + sekil(k[0]) + esc(k[1]) + '</button>';
    }).join('');
  }
  function gorduler(){ try{ return JSON.parse(sessionStorage.getItem('hkm.meydan.gordu') || '{}'); }catch(e){ return {}; } }
  function cizHikayeler(){
    var l = (st.veri && st.veri.hikayeler) || [], gd = gorduler();
    $('hikayeler').innerHTML = '<button class="hk yeni" data-not aria-label="Not yaz"><span class="halka"><span class="ic">' + SVG.arti + '</span></span><span class="ad">Not yaz</span></button>' +
      l.map(function(h, i){
        var m = modulOf(h.hesap);
        return '<button class="hk c-' + m + (gd[h.hesap] ? ' gordu' : '') + '" data-hikaye="' + i + '" aria-label="' + esc(hesap(h.hesap).ad) + ' özeti">' +
          '<span class="halka"><span class="ic">' + av(h.hesap) + '</span></span><span class="ad">' + esc(hesap(h.hesap).ad) + '</span></button>';
      }).join('');
  }
  function cizAkis(){
    var v = st.veri;
    if(!v) return;
    $('altbaslik').textContent = v.gun + (v.bekleyen ? ' · ' + v.bekleyen + ' karar bekliyor' : ' · dört sistemin akışı');
    var acik = v.gonderiler.filter(function(g){ return !g.katli; }), katli = v.gonderiler.filter(function(g){ return g.katli; });
    var h = '';
    if(v.tekrar && v.tekrar.vadeli){
      h += '<div class="tekrar-seridi"><span class="n">' + esc(v.tekrar.vadeli) + '</span><div class="m"><b>Tekrar zamanı</b>' + esc(v.tekrar.cumle) + '</div>' +
        '<button class="dolu" data-gorunum="tekrar">Başla</button></div>';
    }
    h += acik.map(gonderi).join('');
    if(katli.length){
      if(st.acikKatli) h += katli.map(gonderi).join('');
      else h += '<button class="katli" data-katli>' + esc(v.katlanan.map(function(k){ return k.cumle; }).join(' ')) + ' · Göster</button>';
    }
    h += v.gonderiler.length
      ? '<div class="son"><div class="tik">' + SVG.tik + '</div><b>' + esc(v.son) + '</b>' + esc(v.not) + '</div>'
      : '<div class="bosdurum"><b>Meydan bugün sessiz</b>' + esc(v.son) + '</div>';
    $('akis').innerHTML = h;
    gorselleriYukle();
  }
  function cizPanel(){
    var t = (st.deste && st.deste.ozet) || (st.veri && st.veri.tekrar);
    if(!t) return;
    document.querySelectorAll('[data-rozet]').forEach(function(e){ e.textContent = t.vadeli || ''; e.hidden = !t.vadeli; });
    $('tekrar-sayi').textContent = t.vadeli; $('tekrar-hap').hidden = !t.vadeli || st.gorunum === 'tekrar';
    yuzeSoyle({ meydan:'tekrar', vadeli:t.vadeli });
  }
  function cizTekrar(){
    var d = st.deste;
    if(!d){ $('tekrar').innerHTML = '<div class="tk"><p class="kural">Yükleniyor…</p></div>'; return; }
    $('tk-alt').textContent = d.ozet.cumle;
    var h = '<div class="tk">', toplam = d.vadeli.length + st.oturum;
    if(toplam) h += '<div class="ilerle" role="progressbar" aria-valuemin="0" aria-valuemax="' + toplam + '" aria-valuenow="' + st.oturum + '" aria-label="Bu oturumun ilerlemesi"><i style="width:' + Math.round(st.oturum * 100 / toplam) + '%"></i></div>';
    if(d.vadeli.length){
      var k = d.vadeli[0], m = k.modul && k.modul !== 'merkez' ? k.modul : (k.hesap === 'sen' ? 'sen' : 'merkez');
      h += '<div class="buyuk-kart c-' + m + (st.cevapGoster ? ' cevrik' : '') + '"><div class="ic">' +
        '<div class="yuz"><div class="ust-bilgi"><span>' + (k.yeni ? 'Yeni kart' : 'Tekrar') + '</span><span>' + esc(hesap(k.hesap).ad) + '</span></div><div class="y">' + esc(k.on_yuz) + '</div></div>' +
        '<div class="yuz arka"><div class="ust-bilgi"><span>Cevap</span><span>' + esc(hesap(k.hesap).ad) + '</span></div><div class="soru">' + esc(k.on_yuz) + '</div><div class="y">' + esc(k.arka_yuz) + '</div>' + (k.aciklama ? '<p>' + esc(k.aciklama) + '</p>' : '') + '</div>' +
        '</div></div>';
      h += st.cevapGoster
        ? '<div class="dereceler">' + k.secenekler.map(function(s){
            return '<button data-puan="' + k.id + '" data-derece="' + s.derece + '">' + esc(s.ad) + '<small>' + esc(s.sure) + '</small></button>';
          }).join('') + '</div>'
        : '<div class="tk-dug">' + (k.ses ? '<button class="ince" data-soyle="' + esc(k.on_yuz) + '" data-dil="' + esc(k.ses) + '">' + SVG.ses + 'Dinle</button>' : '') +
          '<button class="ince" data-cikar="' + k.id + '">Çıkar</button><button class="dolu" data-goster>Cevabı göster</button></div>';
    } else {
      h += '<div class="bosdurum"><b>' + (d.ozet.toplam ? 'Bugünlük bitti' : 'Deste boş') + '</b>' + esc(d.ozet.cumle) + '</div>';
    }
    h += '<div class="liste"><h2>Sırada</h2>' + (d.sirada.length ? d.sirada.map(function(x){
      return '<div class="satir">' + av(x.hesap) + '<span>' + esc(x.on_yuz) + '</span><small>' + esc(x.sonraki) + '</small></div>';
    }).join('') : '<p class="kural" style="margin:4px 0 12px">Sırada kart yok.</p>') + '</div>';
    h += '<details class="kendi"><summary>Kendi kartını yaz</summary><form class="form" id="kartyap">' +
      '<input class="alan" id="ky-on" maxlength="120" placeholder="Ön yüz (örnek: 1453)" aria-label="Ön yüz">' +
      '<input class="alan" id="ky-arka" maxlength="120" placeholder="Arka yüz (örnek: İstanbul’un fethi)" aria-label="Arka yüz">' +
      '<button class="dolu">Destene ekle</button></form></details>';
    h += '<p class="kural">' + esc(d.kural) + '</p></div>';
    $('tekrar').innerHTML = h;
  }
  function cizKayit(){
    var k = st.kayit;
    if(!k){ $('kayit').innerHTML = '<p class="kural">Yükleniyor…</p>'; return; }
    $('kayit').innerHTML = k.gonderiler.length ? k.gonderiler.map(gonderi).join('') + '<div class="son">' + esc(k.son) + '</div>'
      : '<div class="bosdurum"><b>Henüz kaydettiğin yok</b>' + esc(k.son) + '</div>';
  }
  function sakin(yer, durum){
    var m = durum === 0 ? 'HKM’ye ulaşılamadı. Açık olduğundan emin ol; veri kaybolmadı.' : 'Meydan şu an yüklenemedi (' + durum + ').';
    $(yer).innerHTML = '<div class="sakin"><b>' + esc(m) + '</b><button class="dolu" data-yenile>Yeniden dene</button></div>';
  }

  /* ---------------- yukleme */
  async function yukleAkis(){
    var r = await api('/api/meydan?kapsam=' + st.kapsam + '&duzey=' + st.duzey);
    if(r.status === 401) return jetonSor();
    if(r.status !== 200) return sakin('akis', r.status);
    st.veri = r.body; cizHikayeler(); cizAkis(); cizPanel();
  }
  async function yukleDeste(){
    var r = await api('/api/meydan/deste');
    if(r.status === 401) return jetonSor();
    if(r.status !== 200) return sakin('tekrar', r.status);
    st.deste = r.body; cizTekrar(); cizPanel();
  }
  async function yukleDesteSessiz(){ var r = await api('/api/meydan/deste'); if(r.status === 200){ st.deste = r.body; cizPanel(); } }
  async function yukleKayit(){
    var r = await api('/api/meydan/kaydedilenler');
    if(r.status === 401) return jetonSor();
    if(r.status !== 200) return sakin('kayit', r.status);
    st.kayit = r.body; cizKayit();
  }
  function gorunum(v){
    st.gorunum = v;
    ['akis', 'tekrar', 'kayit'].forEach(function(k){ $('g-' + k).hidden = k !== v; });
    document.querySelectorAll('.sekme[data-gorunum]').forEach(function(b){
      if(b.dataset.gorunum === v) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    $('govde').scrollTop = 0;
    if(v === 'akis') yukleAkis();
    if(v === 'tekrar'){ st.cevapGoster = false; yukleDeste(); }
    if(v === 'kayit') yukleKayit();
    cizPanel();
  }

  /* gorsel ve belge: bayt jetonla alinir, blob olarak gosterilir. SVG <img>
     icinde calisir (betik calismaz); HTML belge betiksiz, kum havuzlu
     bir cercevede acilir. */
  async function blobAl(id, bicim){
    try{
      var r = await fetch('/api/bam/kayit/' + id + '/cikti?bicim=' + bicim, { headers:{ 'Authorization':'Bearer ' + token } });
      return r.ok ? await r.blob() : null;
    }catch(e){ return null; }
  }
  function gorselleriYukle(){
    document.querySelectorAll('[data-svg]').forEach(async function(f){
      if(f.dataset.yuklendi) return;
      f.dataset.yuklendi = '1';
      var b = await blobAl(f.dataset.svg, 'svg');
      f.innerHTML = b ? '<img alt="BAM görseli" src="' + URL.createObjectURL(b) + '">' : '<div class="yer">Görsel alınamadı.</div>';
    });
  }
  async function raporAc(id){
    sayfaAc('BAM kaydı', '<p class="kural">Yükleniyor…</p>');
    var b = await blobAl(id, 'html');
    $('sy-govde').innerHTML = b ? '<iframe sandbox="" title="BAM belgesi" src="' + URL.createObjectURL(b) + '"></iframe>' : '<p>Belge alınamadı.</p>';
  }
  async function pdfIndir(id){
    var b = await blobAl(id, 'pdf');
    if(!b) return tost('PDF alınamadı.');
    var a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'bam-' + id + '.pdf';
    document.body.appendChild(a); a.click(); a.remove();
  }

  /* ---------------- alt sayfa, tost */
  var sonOdak = null, sayfaZaman = null;
  function sayfaAc(baslik, html){
    clearTimeout(sayfaZaman); sonOdak = document.activeElement;
    $('sy-baslik').textContent = baslik; $('sy-govde').innerHTML = html;
    $('perde').hidden = false; $('sayfa').hidden = false;
    void $('sayfa').offsetWidth;
    $('perde').classList.add('acik'); $('sayfa').classList.add('acik');
    setTimeout(function(){ var i = $('sy-govde').querySelector('textarea,input'); (i || $('sy-kapat')).focus(); }, 60);
  }
  function sayfaKapat(){
    $('perde').classList.remove('acik'); $('sayfa').classList.remove('acik');
    sayfaZaman = setTimeout(function(){ $('perde').hidden = true; $('sayfa').hidden = true; $('sy-govde').innerHTML = ''; }, 260);
    if(sonOdak && sonOdak.focus) sonOdak.focus();
  }
  var tz = null, tg = null;
  function tost(m, geri){
    $('tost-metin').textContent = m; $('tost-geri').hidden = !geri; tg = geri || null;
    $('tost').hidden = false; clearTimeout(tz); tz = setTimeout(function(){ $('tost').hidden = true; }, 5000);
  }
  function jetonSor(){
    sayfaAc('HKM jetonu', '<form class="form" id="jetonform" style="margin:0"><p class="kural">Meydan HKM yüzünün jetonunu kullanır. Yüzde giriş yaptıysan bu tarayıcıda zaten kayıtlıdır; değilse buraya yapıştır.</p>' +
      '<input class="alan" id="jeton" type="password" autocomplete="off" aria-label="Jeton"><button class="dolu">Bağlan</button></form>');
  }
  var notModul = '';
  function notYaz(){
    notModul = '';
    sayfaAc('Not yaz', '<form class="form" id="notform" style="margin:0"><div class="secenek" role="group" aria-label="Dal">' +
      [['','Genel'], ['ays','AYS'], ['spi','SPİ'], ['esp','ESP']].map(function(x){
        return '<button type="button" class="cip" data-notmod="' + x[0] + '" aria-pressed="' + (x[0] === '') + '">' + sekil(x[0]) + x[1] + '</button>';
      }).join('') + '</div>' +
      '<textarea class="alan" id="not-metin" maxlength="280" placeholder="Bugün ne öğrendin, neye takıldın?" aria-label="Not"></textarea>' +
      '<div style="display:flex;align-items:center;gap:10px"><p class="kural" style="flex:1">Not olarak durur; kayıt ya da ölçüm olmaz, hiçbir modüle gitmez.</p>' +
      '<span class="kural num" id="not-say">280</span><button class="dolu">Paylaş</button></div></form>');
  }
  function duzenAc(){
    sayfaAc('Düzen', '<div class="secenek" role="group" aria-label="Düzey">' + DUZEY.map(function(k){
      return '<button class="cip" data-duzey="' + k[0] + '" aria-pressed="' + (st.duzey === k[0]) + '">' + esc(k[1]) + '</button>';
    }).join('') + '</div><p class="kural">Sade yalnız karar ve uyarıları gösterir; Dengeli her hesaptan üç gönderi; Tam hepsini. Hiçbir şey silinmez; görünmeyen modülde durur.</p>' +
      '<p class="kural">Sayıları kod üretir; cümleleri kural motoru kurar. Model kapalıyken de aynıdır. Meydan hiçbir modüle yazmaz. SPİ teşhis koymaz, doz önermez; AYS ve ESP sertifika ya da yetenek yargısı vermez.</p>' +
      (UYGULAMA ? '<a class="ince" href="/meydan" target="_blank" rel="noopener" style="text-decoration:none">Tam sayfada aç</a>' : ''));
  }

  /* ---------------- hikaye izleyici: sen gecersin */
  function izAc(i){ st.iz = { a:i, k:0 }; $('izle').hidden = false; izCiz(); $('iz-ileri').focus(); }
  function izKapat(){ $('izle').hidden = true; st.iz = null; cizHikayeler(); }
  function izCiz(){
    var h = st.veri.hikayeler[st.iz.a], k = h.kareler[st.iz.k], m = modulOf(h.hesap), gd = gorduler();
    gd[h.hesap] = 1; try{ sessionStorage.setItem('hkm.meydan.gordu', JSON.stringify(gd)); }catch(e){}
    $('izle').className = 'izle c-' + m;
    $('cubuk').innerHTML = h.kareler.map(function(_, i){ return '<span class="' + (i <= st.iz.k ? 'on' : '') + '"></span>'; }).join('');
    $('iz-av').outerHTML = av(h.hesap).replace('class="av', 'id="iz-av" class="av');
    $('iz-ad').textContent = hesap(h.hesap).ad; $('iz-rol').textContent = hesap(h.hesap).rol || '';
    $('izg').innerHTML = k.tur === 'sayi'
      ? '<small>' + esc(MOD_AD[m] || '') + '</small><div class="buyuk">' + esc(k.deger) + '</div><div class="buyuk-ad">' + esc(k.ad) + '</div>' + kes(k.kesinlik)
      : '<small>' + esc(k.ust) + '</small><div class="cm">' + esc(k.metin) + '</div>';
  }
  function izIleri(){ var h = st.veri.hikayeler[st.iz.a]; if(st.iz.k < h.kareler.length - 1){ st.iz.k++; return izCiz(); } if(st.iz.a < st.veri.hikayeler.length - 1){ st.iz = { a:st.iz.a + 1, k:0 }; return izCiz(); } izKapat(); }
  function izGeri(){ if(st.iz.k > 0){ st.iz.k--; return izCiz(); } if(st.iz.a > 0){ st.iz = { a:st.iz.a - 1, k:0 }; return izCiz(); } izCiz(); }

  /* ---------------- ses: telaffuz tarayicida, dis kaynak yok */
  function soyle(metin, dil){
    try{
      if(!('speechSynthesis' in window)) throw 0;
      var u = new SpeechSynthesisUtterance(metin); u.lang = dil; u.rate = .9;
      speechSynthesis.cancel(); speechSynthesis.speak(u);
    }catch(e){ tost('Bu tarayıcı sesli okumayı desteklemiyor.'); }
  }

  /* ---------------- tiklamalar */
  document.addEventListener('click', async function(e){
    var b = e.target.closest('button, [data-cevir]');
    if(!b) return;
    var d = b.dataset;
    if(b.id === 'kapat'){ return yuzeSoyle({ meydan:'kapat' }); }
    if(b.id === 'sy-kapat'){ return sayfaKapat(); }
    if(b.id === 'tost-geri'){ if(tg) await tg(); $('tost').hidden = true; return; }
    if(b.id === 'iz-kapat'){ return izKapat(); }
    if(b.id === 'iz-ileri'){ return izIleri(); }
    if(b.id === 'iz-geri'){ return izGeri(); }
    if(d.gorunum){ return gorunum(d.gorunum); }
    if(b.hasAttribute('data-not')){ return notYaz(); }
    if(b.hasAttribute('data-duzen')){ return duzenAc(); }
    if(b.hasAttribute('data-yenile')){ return gorunum(st.gorunum); }
    if(d.notmod != null){ notModul = d.notmod; document.querySelectorAll('[data-notmod]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); }); return; }
    if(d.kapsam){ st.kapsam = d.kapsam; cizCipler(); return yukleAkis(); }
    if(d.duzey){
      st.duzey = d.duzey; try{ localStorage.setItem(DUZEY_KEY, d.duzey); }catch(er){}
      document.querySelectorAll('[data-duzey]').forEach(function(x){ x.setAttribute('aria-pressed', String(x === b)); });
      return yukleAkis();
    }
    if(d.hikaye != null){ return izAc(Number(d.hikaye)); }
    if(b.hasAttribute('data-katli')){ st.acikKatli = true; return cizAkis(); }
    if(d.nereden){ st.nereden[d.nereden] = !st.nereden[d.nereden]; return st.gorunum === 'kayit' ? cizKayit() : cizAkis(); }
    if(d.cevir){ st.cevir[d.cevir] = !st.cevir[d.cevir]; b.classList.toggle('cevrik', !!st.cevir[d.cevir]); return; }
    if(d.onayla){ st.onayla = d.onayla; return cizAkis(); }
    if(b.hasAttribute('data-vazgec')){ st.onayla = null; return cizAkis(); }
    if(d.karar){
      var r0 = await yolla('/api/decision/' + d.oneri + '/' + d.karar, {});
      st.onayla = null;
      tost(r0.status === 200 ? (d.karar === 'accept' ? 'Kabul edildi.' : 'Reddedildi; öneri silinmedi.') : ((r0.body && r0.body.error) || 'Karar kaydedilemedi.'));
      return yukleAkis();
    }
    if(d.isaret){
      var acik = b.getAttribute('aria-pressed') !== 'true';
      var r1 = await yolla('/api/meydan/isaret', { gonderi:d.id, tur:d.isaret, acik:acik, gun:(st.veri && st.veri.gun) });
      if(r1.status !== 200) return tost((r1.body && r1.body.note) || 'İşaret kaydedilemedi.');
      b.setAttribute('aria-pressed', String(acik));
      if(acik && r1.body.note) tost(r1.body.note);
      return st.gorunum === 'kayit' ? yukleKayit() : yukleAkis();
    }
    if(d.cevap){
      var g = st.veri.gonderiler.filter(function(x){ return x.id === d.cevap; })[0];
      var r2 = await yolla('/api/meydan/cevap', { gonderi:d.cevap, no:Number(d.no), secim:Number(d.i) });
      if(r2.status !== 200) return tost((r2.body && r2.body.note) || 'Cevap kaydedilemedi.');
      st.sinavSonuc[d.cevap] = { soru:g.sinav.soru, secenekler:g.sinav.secenekler, secim:Number(d.i), dogru:r2.body.dogru, cumle:r2.body.cumle, cozum:r2.body.cozum };
      cizAkis(); yukleDesteSessiz(); return;
    }
    if(d.sonraki){ delete st.sinavSonuc[d.sonraki]; return yukleAkis(); }
    if(d.desteye){
      var r3 = await yolla('/api/meydan/deste', { gonderi:d.desteye });
      tost(r3.status === 200 ? r3.body.cumle : ((r3.body && r3.body.note) || 'Eklenemedi.'));
      if(r3.status === 200 && r3.body.tekrar){ st.veri.tekrar = r3.body.tekrar; st.deste = null; cizAkis(); cizPanel(); }
      return;
    }
    if(d.soyle){ return soyle(d.soyle, d.dil); }
    if(d.rapor){ return raporAc(d.rapor); }
    if(d.pdf){ return pdfIndir(d.pdf); }
    if(b.hasAttribute('data-goster')){
      st.cevapGoster = true;
      var bk = document.querySelector('.buyuk-kart'); if(bk) bk.classList.add('cevrik');
      setTimeout(cizTekrar, 420); return;
    }
    if(d.puan){
      var kid = d.puan;
      var r4 = await yolla('/api/meydan/deste/' + kid + '/puan', { derece:d.derece });
      if(r4.status !== 200) return tost((r4.body && r4.body.note) || 'Kaydedilemedi.');
      st.oturum++; st.cevapGoster = false;
      tost(r4.body.cumle, async function(){ await yolla('/api/meydan/deste/' + kid + '/geri', {}); st.oturum = Math.max(0, st.oturum - 1); yukleDeste(); });
      return yukleDeste();
    }
    if(d.cikar){
      var r5 = await yolla('/api/meydan/deste/' + d.cikar + '/cikar', {});
      tost(r5.status === 200 ? r5.body.cumle : 'Çıkarılamadı.');
      return yukleDeste();
    }
    if(d.notsil){
      var r6 = await yolla('/api/meydan/not/' + d.notsil.replace('not-', '') + '/sil', {});
      tost((r6.body && r6.body.cumle) || 'Kaldırılamadı.');
      return yukleAkis();
    }
  });
  document.addEventListener('keydown', function(e){
    if(!$('izle').hidden){
      if(e.key === 'Escape') izKapat();
      if(e.key === 'ArrowRight') izIleri();
      if(e.key === 'ArrowLeft') izGeri();
      return;
    }
    if(e.key === 'Escape'){
      if(!$('sayfa').hidden) return sayfaKapat();
      yuzeSoyle({ meydan:'kapat' });
    }
  });
  document.addEventListener('submit', async function(e){
    var f = e.target;
    e.preventDefault();
    if(f.id === 'jetonform'){
      token = $('jeton').value.trim(); if(!token) return;
      try{ localStorage.setItem(TOKEN_KEY, token); }catch(er){}
      sayfaKapat(); return gorunum(st.gorunum);
    }
    if(f.id === 'notform'){
      var r = await yolla('/api/meydan/not', { metin:$('not-metin').value, modul:notModul || null });
      if(r.status !== 200) return tost((r.body && r.body.note) || 'Not kaydedilemedi.');
      sayfaKapat(); tost(r.body.cumle); return gorunum('akis');
    }
    if(f.id === 'kartyap'){
      var r2 = await yolla('/api/meydan/deste', { on:$('ky-on').value, arka:$('ky-arka').value });
      tost(r2.status === 200 ? r2.body.cumle : ((r2.body && r2.body.note) || 'Kart eklenemedi.'));
      if(r2.status === 200) yukleDeste();
    }
  });
  document.addEventListener('input', function(e){
    if(e.target.id === 'not-metin'){ $('not-say').textContent = 280 - e.target.value.length; }
  });
  $('perde').addEventListener('click', sayfaKapat);
  $('iz-dokun-ileri').addEventListener('click', izIleri);
  $('iz-dokun-geri').addEventListener('click', izGeri);

  /* ---------------- uygulama: HKM yuzunde ortada acilan pencere.
     Ileti yalniz ayni kaynaktan ve yalniz ust pencereyle alinip verilir. */
  function yuzeSoyle(v){ if(UYGULAMA){ try{ window.parent.postMessage(v, location.origin); }catch(e){} } }
  window.addEventListener('message', function(e){
    if(!UYGULAMA || e.origin !== location.origin || e.source !== window.parent || !e.data) return;
    if(e.data.meydan === 'tema'){
      if(e.data.tema === 'acik' || e.data.tema === 'koyu') document.documentElement.setAttribute('data-tema', e.data.tema);
      else document.documentElement.removeAttribute('data-tema');
    }
    if(e.data.meydan === 'yenile') gorunum(st.gorunum);
  });
  if(UYGULAMA){
    /* Ust cubuktan asagi cekince (telefonda) pencere kapanir. */
    var y0 = null;
    $('ust').addEventListener('touchstart', function(e){ y0 = e.touches.length === 1 ? e.touches[0].clientY : null; }, { passive:true });
    $('ust').addEventListener('touchend', function(e){
      if(y0 == null) return;
      var dy = e.changedTouches[0].clientY - y0; y0 = null;
      if(dy > 70) yuzeSoyle({ meydan:'kapat' });
    }, { passive:true });
  }

  cizCipler();
  if(!token){ jetonSor(); } else { yukleAkis(); yukleDesteSessiz(); }
})();
</script>
</body>
</html>
