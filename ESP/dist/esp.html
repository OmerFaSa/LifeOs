  content:''; width:14px; height:1px; background:var(--sec); flex:none; margin-right:2px;
}
/* Defterin kenar çizgisi: künye ile içeriğin arasında, bölümün renginde
   soluk bir dikey çizgi. Okul defterinin marj çizgisinin karşılığı. */
@media (min-width:901px){
  :root[data-design="kraft"] .lrow{ position:relative; }
  :root[data-design="kraft"] .lrow::before{
    content:''; position:absolute; top:0; bottom:0;
    left:calc(var(--gutter) + var(--gutter-gap) / 2);
    width:1px; background:var(--sec); opacity:.24;
  }
  :root[data-design="kraft"] .lrow--wide::before{ display:none; }
}

/* Kutular kâğıda iğnelenmiş fişler: gölge değil, sert bir kayma. */
:root[data-design="kraft"] .card{
  border:1px solid var(--border-strong);
  box-shadow:3px 3px 0 color-mix(in srgb, var(--text) 9%, transparent);
}
:root[data-design="kraft"] .btn{
  border:1px solid var(--border-strong);
  box-shadow:2px 2px 0 color-mix(in srgb, var(--text) 12%, transparent);
  font-weight:700; letter-spacing:.02em;
}
:root[data-design="kraft"] .btn:active{ box-shadow:none; transform:translate(2px, 2px); }
:root[data-design="kraft"] .input, :root[data-design="kraft"] .select,
:root[data-design="kraft"] .textarea{ border-color:var(--border-strong); }
:root[data-design="kraft"] .seg{ border-color:var(--border-strong); }
:root[data-design="kraft"] .seg button.is-on{ box-shadow:2px 2px 0 color-mix(in srgb, var(--text) 10%, transparent); }
:root[data-design="kraft"] .table td{ border-bottom-style:dashed; }


/* ════════════════════════════════════════════════════════════════
   KATMANLI — solda koyu raf, sağda çalışma yüzeyi

   Fikir: yatay şerit gazetenin dilidir, dikey raf bir masaüstü
   yazılımının. Raf KOYU olur ve çalışma alanı temiz yüzeye oturur;
   ikisi arasındaki ton farkı «burası menü, şurası iş» ayrımını tek
   bakışta kurar.

   Raf yalnız 900 pikselin üstünde çizilir; altında layout.css'in mobil
   menüsü geçerlidir.
   ════════════════════════════════════════════════════════════════ */

:root[data-design="katmanli"]{
  --r:8px; --r-sm:6px;
}
/* Çalışma yüzeyi kâğıt değil beyaz: işin yapıldığı yer öne çıksın. */
:root[data-design="katmanli"] .site__body,
:root[data-design="katmanli"] .hero,
:root[data-design="katmanli"] .pagenav,
:root[data-design="katmanli"] .masthead{ background:var(--surface); }

/* Rafın eşiği 1100 px'dir, 900 değil. 980 px'lik bir ekranda 228 px'lik
   raf içeriğe ~720 px bırakıyor; ekranlar ise kendi duyarlı kurallarını
   PENCERE genişliğine göre uyguladığı için masaüstü düzeninde kalıp
   taşıyordu. Raf, ancak kendisine yer kalınca çizilir. */
@media (min-width:1100px){
  :root[data-design="katmanli"]{
    --rail-w:228px;
    --nav-h:0px;              /* üstte yapışan şerit kalmadı */
    --content-max:1060px;
  }
  :root[data-design="katmanli"] .site{
    display:grid;
    grid-template-columns:var(--rail-w) minmax(0,1fr);
    grid-template-rows:auto auto auto 1fr auto;
  }

  /* Raf hücrenin TAMAMINI kaplar (zemin sayfanın sonuna kadar iner),
     içindeki liste yapışır. Rafa 100vh verip yapıştırmak uzun
     sayfalarda rafın bitip zeminin kesildiği bir sınır üretiyordu. */
  :root[data-design="katmanli"] .sitenav{
    grid-column:1; grid-row:1 / -1;
    position:static; align-self:stretch;
    border:none;
    background:var(--ink); color:var(--ink-on);
    backdrop-filter:none;
  }
  :root[data-design="katmanli"] .navlinks{
    position:sticky; top:0;
    max-height:100vh; overflow-y:auto;
    display:flex; flex-direction:column; align-items:stretch;
    max-width:none; padding:20px 12px 28px; gap:2px;
  }
  /* Rafın başlığı listenin ilk ögesidir: kaydırmayla birlikte hareket
     eder, mutlak konumlu bir etiket gibi zeminle çakışmaz. */
  :root[data-design="katmanli"] .navlinks::before{
    content:'SPİ · Bölümler';
    padding:10px 12px 18px;
    font-size:10px; font-weight:700; letter-spacing:.2em; text-transform:uppercase;
    color:color-mix(in srgb, var(--ink-on) 52%, var(--ink));
  }
  :root[data-design="katmanli"] .navlink{
    display:grid; grid-template-columns:24px minmax(0,1fr) auto;
    align-items:center; gap:10px;
    padding:11px 12px; margin:0;
    border-radius:var(--r-sm);
    text-align:left;
    color:color-mix(in srgb, var(--ink-on) 74%, var(--ink));
  }
  :root[data-design="katmanli"] .navlink__num{
    color:color-mix(in srgb, var(--ink-on) 48%, var(--ink)); opacity:1;
  }
  :root[data-design="katmanli"] .navlink__label{ white-space:normal; font-size:13.5px; }
  :root[data-design="katmanli"] .navlink:hover{
    background:color-mix(in srgb, var(--ink-on) 9%, transparent);
    color:var(--ink-on);
  }
  :root[data-design="katmanli"] .navlink.is-active{
    background:color-mix(in srgb, var(--ink-on) 15%, transparent);
    color:var(--ink-on);
  }
  :root[data-design="katmanli"] .navlink.is-active .navlink__num{ color:var(--ink-on); }
  :root[data-design="katmanli"] .navlink.is-active::after{ display:none; }
  :root[data-design="katmanli"] .navlink__badge.is-quiet{
    background:color-mix(in srgb, var(--ink-on) 20%, transparent); color:var(--ink-on);
  }

  :root[data-design="katmanli"] .masthead,
  :root[data-design="katmanli"] .hero,
  :root[data-design="katmanli"] .pagenav,
  :root[data-design="katmanli"] .site__body,
  :root[data-design="katmanli"] .sitefoot{ grid-column:2; }
  :root[data-design="katmanli"] .masthead{ grid-row:1; border-bottom:1px solid var(--border); }
  :root[data-design="katmanli"] .hero{ grid-row:2; }
  :root[data-design="katmanli"] .pagenav{ grid-row:3; top:0; background:var(--surface); }
  :root[data-design="katmanli"] .site__body{ grid-row:4; }
  :root[data-design="katmanli"] .sitefoot{ grid-row:5; }

  /* Marka rafta yazılı; künyede tekrar edilmez. */
  :root[data-design="katmanli"] .masthead .brand__text{ display:none; }
  :root[data-design="katmanli"] .masthead__date{ justify-content:flex-start; }
  :root[data-design="katmanli"] .wrapc{ padding-inline:36px; }
  :root[data-design="katmanli"] .hero__in{ padding-block:34px 26px; }
  :root[data-design="katmanli"] .hero::before{ font-size:108px; }

  /* Defter satırının künye sütunu bir panele döner: soldaki dolu şerit
     «bu blok burada başlıyor» der, liste/ayrıntı ilişkisi okunur olur. */
  :root[data-design="katmanli"] .lrow{ gap:0 32px; padding-block:28px; }
  :root[data-design="katmanli"] .lrow__side{
    top:24px;
    border-left:2px solid var(--sec);
    padding-left:14px;
  }
  :root[data-design="katmanli"] .lrow--wide .lrow__side{
    border-left:none; padding-left:0;
    border-top:2px solid var(--sec); padding-top:12px;
  }
}


/* ════════════════════════════════════════════════════════════════
   HARİTA — noktalı tuval üstünde düğüm kartlar

   Fikir: defter satırı okumak için iyidir ama ilişkiyi göstermez.
   Haritada her satır kendi kartına çekilir, kartlar noktalı bir
   tuvale dizilir, her kartın tepesinde bölümün renginde bir künye
   şeridi durur. Sayfa daha geniştir; tuvalin yayılacak yeri olur.

   Geniş satırlar (grafik, uzun cetvel) tuvalin tamamını kaplar —
   daralan bir grafik saçmadır.
   ════════════════════════════════════════════════════════════════ */

:root[data-design="harita"]{
  --content-max:1380px;
  --r:14px; --r-sm:9px;
  --gutter-gap:0px;
}

/* Tuval: nokta ızgarası. Rengini kenarlıktan alır, yani her palette ve
   karanlık temada kendi doğru tonunu bulur. */
:root[data-design="harita"] .site__body{
  background-color:color-mix(in oklab, var(--bg) 88%, var(--surface-3));
  background-image:radial-gradient(var(--border-strong) 1.2px, transparent 1.2px);
  background-size:24px 24px;
  background-position:-1px -1px;
  border-top:1px solid var(--border);
}
:root[data-design="harita"] .content{ padding-block:32px 80px; }

/* Gezinme tuvalin üstünde yüzen haplar. */
:root[data-design="harita"] .navlinks{ gap:4px; padding-block:7px; }
:root[data-design="harita"] .navlink{
  padding:8px 14px; margin:0; border-radius:var(--r-pill);
  align-items:center;
}
:root[data-design="harita"] .navlink:hover{ background:var(--surface-hover); }
:root[data-design="harita"] .navlink.is-active{
  background:var(--ink); color:var(--ink-on);
}
:root[data-design="harita"] .navlink.is-active .navlink__num{ color:var(--ink-on); opacity:.72; }
:root[data-design="harita"] .navlink.is-active::after{ display:none; }

/* Kart içeriği kendi enini bilir (layout.css'teki `satir` kapsayıcısı),
   yani tablo benzeri satırlar kartın içinde kendiliğinden dar kalıba
   geçer.

   Akış ızgara değil SÜTUNDUR. Izgarada her satır en uzun kartı kadar
   yer kaplıyor ve kısa kartın altında koca bir delik kalıyordu; tuval
   deliklerle dolunca harita olmaktan çıkıyor. Çok sütunlu akışta
   kartlar boşluk bırakmadan diziliyor ve geniş satırlar `column-span`
   ile bütün tuvali kaplayabiliyor. */
:root[data-design="harita"] .ledger{
  display:block;
  columns:420px;
  column-gap:20px;
}

/* Satır artık kart: ızgara değil blok, çizgi değil çerçeve. */
:root[data-design="harita"] .lrow,
:root[data-design="harita"] .ledger > .lrow:first-child,
:root[data-design="harita"] .ledger > .lrow:last-child{
  display:block;
  padding:0;
  border:1px solid var(--border);
  border-radius:var(--r);
  background:var(--surface);
  box-shadow:0 1px 2px rgba(16,18,27,.05), 0 8px 22px rgba(16,18,27,.06);
  overflow:hidden;
  transition:box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
:root[data-design="harita"] .lrow{
  break-inside:avoid;
  margin-bottom:20px;
}
:root[data-design="harita"] .lrow--wide{ column-span:all; }
:root[data-design="harita"] .lrow:hover{
  border-color:color-mix(in oklab, var(--sec) 36%, var(--border));
  box-shadow:0 2px 4px rgba(16,18,27,.06), 0 14px 32px rgba(16,18,27,.10);
}
@media (prefers-reduced-motion:reduce){
  :root[data-design="harita"] .lrow{ transition:none; }
}

/* Kart başlığı: bölüm renginde bir düğüm işareti ve künye. */
:root[data-design="harita"] .lrow__side{
  position:static; display:block;
  padding:13px 18px 12px;
  border-bottom:1px solid var(--border);
  background:color-mix(in oklab, var(--sec) 8%, var(--surface));
}
:root[data-design="harita"] .lrow__label{ font-size:10.5px; letter-spacing:.15em; }
:root[data-design="harita"] .lrow__label::before{
  content:''; width:7px; height:7px; border-radius:2px;
  background:var(--sec); flex:none;
}
:root[data-design="harita"] .lrow__meta{ margin-top:5px; font-size:12px; }
:root[data-design="harita"] .lrow__note{ margin-top:9px; max-width:none; font-size:12.75px; }
:root[data-design="harita"] .lrow__act{ margin-top:12px; flex-direction:row; flex-wrap:wrap; }
:root[data-design="harita"] .lrow__act .btn{ width:auto; }
/* Emniyet kemeri: bir satır yine de sığmazsa kırpılmaz, kaydırılır.
   Kaybolan veriyle kaydırılabilir veri aynı şey değildir. */
:root[data-design="harita"] .lrow__main{ padding:18px; overflow-x:auto; }
:root[data-design="harita"] .lrow__main > * + *{ margin-top:16px; }

/* Kartın içindeki kart çerçevesiz olur: iki çerçeve iç içe çizilmez. */
:root[data-design="harita"] .lrow .card{
  border-color:transparent; box-shadow:none; background:var(--surface-2);
}

/* Dar kartta blok sekme çubuğu: düğmeler sıkışıp iki satıra kırılmasın,
   gerekiyorsa çubuğun kendisi alt satıra sarsın. */
:root[data-design="harita"] .seg--block{ flex-wrap:wrap; }
:root[data-design="harita"] .seg--block button{ flex:1 1 auto; white-space:nowrap; }

:root[data-design="harita"] .hero::before{ opacity:.05; }

@media (max-width:720px){
  :root[data-design="harita"] .ledger{ columns:1; }
}


/* ────────────────────────────────────────────────────────────────
   Görünüm kâğıdındaki düzen düğmeleri — her düzen kendi minyatürünü
   çizer. Ad yeterli değil: «Katmanlı»nın ne demek olduğu ancak
   görülünce anlaşılır.
   ──────────────────────────────────────────────────────────────── */
.desbtn{
  display:flex; flex-direction:column; align-items:stretch; gap:7px;
  padding:8px; border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text-2); text-align:left;
  transition:border-color var(--dur) var(--ease), color var(--dur) var(--ease);
}
.desbtn:hover{ border-color:var(--border-strong); color:var(--text); }
.desbtn.is-on{ border-color:var(--primary); color:var(--text); }
.desbtn__name{ font-size:11.5px; font-weight:600; }
.desbtn__mini{
  height:34px; border-radius:2px; background:var(--surface-2);
  display:grid; gap:2px; padding:4px; overflow:hidden;
}
.desbtn__mini i{ display:block; background:var(--text-3); opacity:.5; border-radius:1px; }

/* defter: künye sütunu + içerik */
.desbtn__mini--lines{ grid-template-columns:9px 1fr; align-content:start; gap:3px 5px; }
.desbtn__mini--lines i:nth-child(odd){ height:3px; }
.desbtn__mini--lines i:nth-child(even){ height:3px; opacity:.28; }

/* odak: tek büyük blok + iki ince satır */
.desbtn__mini--single{ grid-template-rows:1fr auto auto; }
.desbtn__mini--single i:first-child{ opacity:.72; border-radius:2px; }
.desbtn__mini--single i:not(:first-child){ height:2px; opacity:.28; }

/* kraft: kesikli satırlar */
.desbtn__mini--paper i{
  height:3px; background:none; opacity:.55;
  border-top:2px dashed var(--text-3);
}

/* katmanlı: solda koyu raf */
.desbtn__mini--rail{ grid-template-columns:10px 1fr; gap:3px 4px; align-content:start; }
.desbtn__mini--rail i:first-child{ grid-row:1 / span 4; opacity:.8; border-radius:2px; }
.desbtn__mini--rail i:not(:first-child){ height:3px; opacity:.3; }

/* harita: dört küçük kutu */
.desbtn__mini--nodes{ grid-template-columns:1fr 1fr; grid-auto-rows:1fr; gap:3px; }
.desbtn__mini--nodes i{ opacity:.42; border-radius:2px; }

/* ==== css/esp.css ==== */
/* ESP'ye ozel katman.

   Alti ortak dosya (tokens · palettes · base · layout · components · designs)
   AYS ve SPI ile AYNI kalir ve elle duzenlenmez; bir gun `LifeOs/ortak/`
   altinda tek nusha durup her build.py tarafindan derleme aninda cekilecekler.
   Uygulamaya ozgu ne varsa bu dosyada yasar — AYS'de `rota.css`, SPI'de
   `components.css`in alt yarisi ne yapiyorsa o.

   Iki sey burada:

     1. BOLUM KIMLIKLERI. palettes.css SPI'nin bolum adlarini tasir
        (testler, besin, hareket, finans). ESP'nin bolum adlari baska;
        eslesmeyen her bolum ana renkte kalirdi. Bu, devir notundaki
        "kopyalanan palettes.css yanlis bolum adlarini tasiyordu" hatasinin
        tekrari olurdu. Burada ESP'nin sekiz bolumu tanimlanir ve dosya
        sirasi geregi (esp.css en son yuklenir) SPI'nin satirlarini ezer.

     2. AJAN RENKLERI. tokens.css bes SPI ajani tanimlar; ESP'nin alti
        uzmani + Patron'u var. Patron ortak jetondan gelir, alti uzman
        burada.

   Ekrana ozel yapilar (metronom gostergesi, sentopik matris, argüman agaci,
   SRS karti) da burada; bilesen sozlugune (`C.*`) girmezler cunku alana
   bagimlidirlar. */

/* ------------------------------------------------------- bolum kimlikleri

   Sekiz bolum, sekiz imza. Renkler ayni doygunluk ailesinden secildi:
   yan yana konduklarinda gokkusagi degil tek bir palet gibi okunurlar.

   `--sec` yalniz bes yerde gorunur: bolum numarasi, etkin sekme cizgisi,
   bolum basliginin ustundeki kisa cizgi, ana dugme ve bolum imzasi.
   Durum renkleri (ok/warn/danger) buna KARISMAZ. */
:root[data-section="gunluk"]  { --sec-base:#2F6B52; }  /* adaçayı */
:root[data-section="dil"]     { --sec-base:#2F5A8A; }  /* mürekkep mavisi */
:root[data-section="felsefe"] { --sec-base:#6B3F63; }  /* erik */
:root[data-section="ses"]     { --sec-base:#9A4A2F; }  /* kiremit */
:root[data-section="okuma"]   { --sec-base:#8A5A18; }  /* kehribar */
:root[data-section="yazi"]    { --sec-base:#5E6B2A; }  /* zeytin */
:root[data-section="ofis"]    { --sec-base:#4A5570; }  /* çivit grisi */
:root[data-section="ayarlar"] { --sec-base:#5A5750; }  /* taş */

/* Koyu temada ayni sekiz ton acilir: koyu zeminde doygun ton okunmaz.
   Harmanlama kurali ayni kalir, yalniz taban renk degisir. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"])[data-section="gunluk"]  { --sec-base:#79C09C; }
  :root:not([data-theme="light"])[data-section="dil"]     { --sec-base:#86AEDC; }
  :root:not([data-theme="light"])[data-section="felsefe"] { --sec-base:#C193BA; }
  :root:not([data-theme="light"])[data-section="ses"]     { --sec-base:#DF9376; }
  :root:not([data-theme="light"])[data-section="okuma"]   { --sec-base:#D6A961; }
  :root:not([data-theme="light"])[data-section="yazi"]    { --sec-base:#AFBF74; }
  :root:not([data-theme="light"])[data-section="ofis"]    { --sec-base:#A3AECB; }
  :root:not([data-theme="light"])[data-section="ayarlar"] { --sec-base:#AFAAA0; }
}
:root[data-theme="dark"][data-section="gunluk"]  { --sec-base:#79C09C; }
:root[data-theme="dark"][data-section="dil"]     { --sec-base:#86AEDC; }
:root[data-theme="dark"][data-section="felsefe"] { --sec-base:#C193BA; }
:root[data-theme="dark"][data-section="ses"]     { --sec-base:#DF9376; }
:root[data-theme="dark"][data-section="okuma"]   { --sec-base:#D6A961; }
:root[data-theme="dark"][data-section="yazi"]    { --sec-base:#AFBF74; }
:root[data-theme="dark"][data-section="ofis"]    { --sec-base:#A3AECB; }
:root[data-theme="dark"][data-section="ayarlar"] { --sec-base:#AFAAA0; }

/* ---------------------------------------------------------- ajan renkleri

   Kimlik tasir, durum degil. Yalnizca avatarda kullanilir; ajanin durumu
   her zaman ayrica rozetle verilir. Her uzmanin rengi kendi disiplininin
   bolum rengiyle ayni aileden gelir — masa hangi bolume bakiyorsa oradan. */
:root{
  --agent-lang:#2F5A8A;
  --agent-philo:#6B3F63;
  --agent-music:#9A4A2F;
  --agent-diction:#7A4A5E;
  --agent-reading:#8A5A18;
  --agent-writing:#4F5C24;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --agent-lang:#86AEDC;
    --agent-philo:#C193BA;
    --agent-music:#DF9376;
    --agent-diction:#D39BB4;
    --agent-reading:#D6A961;
    --agent-writing:#AFBF74;
  }
}
:root[data-theme="dark"]{
  --agent-lang:#86AEDC;
  --agent-philo:#C193BA;
  --agent-music:#DF9376;
  --agent-diction:#D39BB4;
  --agent-reading:#D6A961;
  --agent-writing:#AFBF74;
}

/* ===================================================== ekrana ozel yapilar

   Bilesen sozlugune (`C.*`) girmeyen, alana bagli parcalar. Hepsi jetondan
   beslenir: ham renk yazilmaz, yoksa yedi palet ve karanlik tema altinda
   biri mutlaka bozulur.

   Olculer 8px ritmine uyar (4 · 8 · 12 · 16 · 24), yaricap uc seviyededir
   (--r-sm kontrol, --r kart, --r-pill rozet). */

/* ------------------------------------------------------------ gun seridi

   On dort gunun tek bakista okunmasi. Dolu gun ile BOS gun ayri gorunur:
   bos gun "0 dakika" degil "veri yok"tur ve bu ayrim rengin degil ICERIGIN
   isidir — hucrede sayi yerine tire durur. */
.daystrip{
  display:flex; gap:4px; overflow-x:auto; padding-bottom:4px;
  scrollbar-width:thin;
}
.daycell{
  flex:0 0 auto; width:46px; min-height:52px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
  border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface); color:var(--text-3);
  font-size:var(--fs-xs); cursor:pointer;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.daycell:hover{ background:var(--surface-hover); }
.daycell.is-on{ color:var(--text); border-color:var(--border-strong); }
.daycell.is-sel{ border-color:var(--sec); box-shadow:inset 0 0 0 1px var(--sec); }
.daycell__d{ font-family:var(--font-display); font-weight:600; }
.daycell__v{ font-family:var(--font-display); font-variant-numeric:tabular-nums; }

/* --------------------------------------------------------- kesinlik rozeti

   Her sayinin yaninda durur. Kucuk ve sakindir: on bes kez tekrarlanan bir
   rozetin cercevesi gurultu uretir, bu yuzden cerceve yok — yalniz renk ve
   punto farki. */
.cert{
  font-size:var(--fs-xs); letter-spacing:.02em;
  color:var(--text-3); white-space:nowrap;
}
.cert--measured{ color:var(--primary); }
.cert--estimated{ color:var(--accent); }
.cert--derived{ color:var(--info); }
.cert--missing{ color:var(--text-3); font-style:italic; }

.measure{ display:inline-flex; align-items:baseline; gap:4px; }
.measure b{ font-family:var(--font-display); font-variant-numeric:tabular-nums; }
.measure small{ color:var(--text-2); font-size:var(--fs-xs); }
.measure--none{ color:var(--text-3); }

/* ------------------------------------------------------------- SRS karti

   Ekranin en buyuk nesnesi odur cunku o anda yapilan tek is odur. Karsilik
   ACILMADAN once gorunmez: gorunuyorsa hatirlama denenmemis olur. */
.srscard{
  border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); padding:var(--sp-6) var(--sp-5);
  text-align:center; min-height:132px;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:var(--sp-3);
}
.srscard__front{ font-family:var(--font-serif); font-size:var(--fs-xl); line-height:1.25; }
.srscard__ctx{ color:var(--text-2); font-size:var(--fs-sm); max-width:46ch; }
.srscard__back{
  font-size:var(--fs-md); color:var(--text);
  padding-top:var(--sp-3); border-top:1px solid var(--rule); width:100%;
  max-width:46ch;
}
.srscard__reveal{
  border:1px dashed var(--border-strong); border-radius:var(--r-pill);
  background:transparent; color:var(--text-2);
  padding:var(--sp-2) var(--sp-5); cursor:pointer; font:inherit;
}
.srscard__reveal:hover{ background:var(--surface-hover); color:var(--text); }

/* ------------------------------------------------------------- arguman

   Tez serifle yazilir: okunacak bir cumledir, bir veri degeri degil.
   Destek ve itiraz iki sutun; dar kutuda alt alta iner — pencereye gore
   degil KENDI KUTUSUNA gore (bkz. STIL kurali 7). */
.thesis{
  font-family:var(--font-serif); font-size:var(--fs-lg); line-height:1.4;
  text-wrap:pretty;
}
.argcols{ display:grid; gap:var(--sp-5); }
@container satir (min-width:560px){ .argcols{ grid-template-columns:1fr 1fr; } }
.argcol__h{
  font-size:var(--fs-xs); letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-3); margin-bottom:var(--sp-2);
}
.argcol__list{ list-style:none; display:flex; flex-direction:column; gap:var(--sp-3); }
.argcol__list li{
  padding-left:var(--sp-3); border-left:2px solid var(--rule);
  font-size:var(--fs-sm);
}
.argcol__list li.is-answered{ border-left-color:var(--primary); color:var(--text-2); }
.argcol__ans{ display:block; color:var(--text-3); font-size:var(--fs-xs); margin-top:2px; }

/* ------------------------------------------------------------- metronom

   Sayi sayfanin en buyuk nesnesidir: metronom acikken bakilan tek sey odur. */
.metro{
  display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
  gap:var(--sp-4);
  border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); padding:var(--sp-4) var(--sp-5);
}
.metro__bpm{ display:flex; align-items:center; gap:var(--sp-4); }
.metro__val{
  font-family:var(--font-display); font-size:var(--fs-hero); font-weight:700;
  font-variant-numeric:tabular-nums; min-width:3ch; text-align:center;
}
.metro__step{
  width:38px; height:38px; border-radius:var(--r-pill);
  border:1px solid var(--border-strong); background:transparent;
  color:var(--text-2); font:inherit; cursor:pointer;
}
.metro__step:hover{ background:var(--surface-hover); color:var(--text); }
.metro__ctrl{ display:flex; gap:var(--sp-2); align-items:center; }

.twister{
  font-family:var(--font-serif); font-size:var(--fs-lg); line-height:1.5;
  padding:var(--sp-4) var(--sp-5);
  border-left:2px solid var(--sec); background:var(--surface-2);
  border-radius:0 var(--r-sm) var(--r-sm) 0;
  text-wrap:pretty;
}

/* --------------------------------------------------------------- notlar */

.noterow{ padding:var(--sp-4) 0; border-bottom:1px solid var(--rule); }
.noterow:last-child{ border-bottom:0; }
.noterow__text{ font-size:var(--fs-base); line-height:1.5; text-wrap:pretty; }
.noterow__meta{
  display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
  margin-top:var(--sp-2);
}
.noterow__links{ list-style:none; margin-top:var(--sp-3); display:flex;
  flex-direction:column; gap:var(--sp-2); }
.noterow__links li{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2);
  font-size:var(--fs-sm); color:var(--text-2);
  padding-left:var(--sp-4); border-left:2px solid var(--rule);
}
.noterow__links em{ color:var(--text-3); font-size:var(--fs-xs); }
.linkform{
  display:flex; flex-wrap:wrap; gap:var(--sp-2); align-items:center;
  margin-top:var(--sp-3); padding:var(--sp-3);
  background:var(--surface-2); border-radius:var(--r-sm);
}

/* Bag onerisi — iki not ve aralarindaki isaret. */
.sugg__pair{ display:grid; gap:var(--sp-2); align-items:center; }
@container satir (min-width:560px){
  .sugg__pair{ grid-template-columns:1fr auto 1fr; }
}
.sugg__pair p{ font-size:var(--fs-sm); line-height:1.45; }
.sugg__op{ color:var(--text-3); text-align:center; font-size:var(--fs-lg); }
.sugg__meta{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
  margin-top:var(--sp-2); }

/* ---------------------------------------------------------------- ofis */

.desknotes{ list-style:none; display:flex; flex-direction:column; gap:var(--sp-2); }
.desknote{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2);
  font-size:var(--fs-sm); padding-left:var(--sp-3);
  border-left:2px solid var(--border);
}
.desknote--danger{ border-left-color:var(--danger); }
.desknote--warn{ border-left-color:var(--accent); }
.desknote--ok{ border-left-color:var(--primary); }
.desknote--info{ border-left-color:var(--info); }
.desknote__label{
  font-size:var(--fs-xs); letter-spacing:.05em; text-transform:uppercase;
  color:var(--text-3); flex:0 0 auto;
}
.desknote__text{ color:var(--text-2); flex:1 1 12ch; min-width:0; }

/* Kimlik seridi: masanin KIME ait oldugunu soyler, durumunu degil.
   Durum renkleri bu seride asla kullanilmaz. */
.desk--polyglot{ --desk-ink:var(--agent-lang); }
.desk--socrates{ --desk-ink:var(--agent-philo); }
.desk--maestro{ --desk-ink:var(--agent-music); }
.desk--demosthenes{ --desk-ink:var(--agent-diction); }
.desk--aristoteles{ --desk-ink:var(--agent-reading); }
.desk--montaigne{ --desk-ink:var(--agent-writing); }
.desk--patron{ --desk-ink:var(--agent-patron); }
.desk[class*="desk--"]{ border-left:3px solid var(--desk-ink, var(--border)); }

.handoff{
  display:flex; flex-wrap:wrap; align-items:baseline; gap:var(--sp-2);
  width:100%; text-align:left; font:inherit; cursor:pointer;
  background:transparent; border:0; border-bottom:1px solid var(--rule);
  padding:var(--sp-3) 0; color:var(--text);
}
.handoff:hover{ background:var(--surface-hover); }
.handoff__from, .handoff__to{ font-weight:600; font-size:var(--fs-sm); }
.handoff__arrow{ color:var(--text-3); }
.handoff__text{ flex:1 1 20ch; min-width:0; color:var(--text-2); font-size:var(--fs-sm); }

.crossrow{
  display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-3);
  padding:var(--sp-3) 0; border-bottom:1px solid var(--rule);
}
.crossrow:last-child{ border-bottom:0; }
.crossrow__pair{ display:flex; align-items:center; gap:4px; flex:0 0 auto; }
.crossrow__arrow{ color:var(--text-3); }
.crossrow p{ flex:1 1 24ch; min-width:0; font-size:var(--fs-sm); color:var(--text-2); }

/* Kural motorunun cumlesi — ajanin modelsiz konustugu dil.
   Serif degil gövde yazisi: bu bir baslik degil bir RAPORDUR. */
.rulesay{
  font-size:var(--fs-base); line-height:1.55; color:var(--text);
  text-wrap:pretty;
}

/* --------------------------------------------------------------- sohbet */

.chat{ display:flex; flex-direction:column; gap:var(--sp-3); max-height:420px;
  overflow-y:auto; padding-right:var(--sp-2); }
.msg__foot{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
  margin-top:var(--sp-2); }
.composer{ display:flex; gap:var(--sp-2); align-items:flex-end; }
.composer__input{ flex:1 1 auto; min-width:0; }

.meetturn--close{ border-left:3px solid var(--agent-patron); padding-left:var(--sp-3); }
.meetturn__head{ display:flex; flex-wrap:wrap; align-items:center; gap:var(--sp-2);
  margin-bottom:var(--sp-2); }

.decision{ padding:var(--sp-3) 0; border-bottom:1px solid var(--rule); }
.decision:last-child{ border-bottom:0; }

.jsonbox{
  font-family:ui-monospace, SFMono-Regular, Menlo, monospace;
  font-size:var(--fs-xs); line-height:1.5;
  background:var(--surface-2); border-radius:var(--r-sm);
  padding:var(--sp-3); overflow-x:auto; max-height:360px; overflow-y:auto;
  color:var(--text-2); white-space:pre;
}

/* ---------------------------------------------------------------- radar

   Olculmemis eksen SIFIRA CEKILMEZ: poligona hic girmez, yerine eksenin
   dibinde kucuk kesik bir nokta durur. Sifira cekmek "hic calisilmadi"
   demek olurdu; oysa soylenen sey "olculmedi". */
.radar{ display:flex; flex-direction:column; align-items:center; gap:var(--sp-2); }
.radar svg{ width:100%; max-width:340px; height:auto; overflow:visible; }
.radar__ring{ fill:none; stroke:var(--rule); stroke-width:1; }
.radar__axis{ stroke:var(--rule); stroke-width:1; }
.radar__shape{
  fill:color-mix(in oklab, var(--sec) 22%, transparent);
  stroke:var(--sec); stroke-width:1.5; stroke-linejoin:round;
}
.radar__dot{ fill:var(--sec); }
.radar__dot--none{ fill:none; stroke:var(--text-3); stroke-width:1; stroke-dasharray:2 2; }
.radar__label{ fill:var(--text-2); font-size:9px; font-family:var(--font-body); }
.radar__cap{
  font-size:var(--fs-xs); color:var(--text-3); text-align:center;
  display:flex; flex-direction:column; gap:2px;
}
.radar__none{ color:var(--text-3); font-style:italic; }

/* --------------------------------------------------------- disiplin secimi

   Alti kutu; secim onay kutusuyla degil KART'la yapilir — dokunmatikte
   onay kutusunun hedef alani belirsizdir. */
.picks--disc{
  display:grid; gap:var(--sp-2);
  grid-template-columns:repeat(auto-fit, minmax(104px, 1fr));
}

/* Hareket azaltilmis tercihinde gecisler durur; STIL'deki genel kural
   burada da gecerlidir. */
@media (prefers-reduced-motion:reduce){
  .daycell, .srscard__reveal, .metro__step, .handoff{ transition:none; }
}

/* Bir serbest metin etiketini kanonik kavrama cevirir. Bulamazsa `null`
   doner — UYDURMAZ. Eslesmeyen etiket kullanicinin kendi kavrami olarak
   durur, sisteme yamanmaz. */
ESP.conceptOf = function(text){
  const t = String(text || '').toLocaleLowerCase('tr-TR').trim();
  if(!t) return null;
  for(const c of ESP.CONCEPTS){
    if(c.id === t) return c;
    if(c.label.toLocaleLowerCase('tr-TR') === t) return c;
    if(c.same.some(s => s.toLocaleLowerCase('tr-TR') === t)) return c;
  }
  return null;
};

/* Olculmus destenin hangi bandin kriterlerini KARSILADIGINI soyler.

   Donusteki dil kasitlidir: "B2'sin" degil "B2 bandinin kriterlerini
   karsiliyor". Bu cumle degistirilirse pedagojik sinir ihlal edilir ve
   ESP.Office.validate ciktiyi isaretler. */
ESP.cefrOf = function(activeWords, retention){
  if(activeWords == null || retention == null){
    return { band:null, cert:'missing',
      why:'Bant için hem aktif kelime sayısı hem retansiyon ölçülmüş olmalı.' };
  }
  let bulunan = null;
  ESP.CEFR.forEach(function(b){
    if(activeWords >= b.activeWords && retention >= b.retention) bulunan = b;
  });
  return {
    band:bulunan, cert:'derived',
    text:bulunan
      ? 'Ölçülen üretimin ' + bulunan.label + ' bandının kriterlerini karşılıyor '
        + '— bu bir öz-değerlendirmedir, resmî sınav yerine geçmez.'
      : 'Henüz A1 bandının ölçülebilir kriterleri karşılanmadı.',
  };
};

/* ==== js/core/utils.js ==== */
/* Tarih, sayi ve metin yardimcilari. */

window.ESP = window.ESP || {};

ESP.U = (function(){
  const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const MONTHS_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const DAY_MS = 86400000;

  function pad2(n){ return String(n).padStart(2,'0'); }

  function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

  function parse(s){
    if(s instanceof Date) return s;
    const parts = String(s).slice(0,10).split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function today(){
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function todayISO(){ return iso(today()); }

  function addDays(d, n){
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate()+n);
    return r;
  }

  function diffDays(a, b){
    return Math.round((parse(b) - parse(a)) / DAY_MS);
  }

  /* 0 = Pazartesi ... 6 = Pazar */
  function weekdayIndex(d){ return (parse(d).getDay()+6)%7; }

  function fmtDate(d){
    const x = parse(d);
    return x.getDate()+' '+MONTHS[x.getMonth()]+' '+x.getFullYear();
  }
  function fmtShort(d){
    const x = parse(d);
    return x.getDate()+' '+MONTHS_SHORT[x.getMonth()];
  }
  function fmtRange(a, b){
    const x = parse(a), y = parse(b);
    if(x.getMonth() === y.getMonth()) return x.getDate()+'–'+y.getDate()+' '+MONTHS_SHORT[y.getMonth()];
    return fmtShort(x)+' – '+fmtShort(y);
  }
  function monthName(d){ return MONTHS[parse(d).getMonth()]; }
  function monthKey(d){ const x = parse(d); return x.getFullYear()+'-'+pad2(x.getMonth()+1); }

  function relativeDay(dateISO){
    const n = diffDays(todayISO(), dateISO);
    if(n === 0) return 'bugün';
    if(n === 1) return 'yarın';
    if(n === -1) return 'dün';
    if(n < 0) return Math.abs(n)+' gün gecikmiş';
    return n+' gün sonra';
  }

  /* --- sayi --- */
  function median(arr){
    const s = arr.filter(v => typeof v === 'number' && !isNaN(v)).sort((a,b)=>a-b);
    if(!s.length) return null;
    const m = Math.floor(s.length/2);
    return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
  }
  function round(x, digits){
    if(!isFinite(x)) return 0;
    const f = Math.pow(10, digits==null?1:digits);
    return Math.round(x*f)/f;
  }
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
  function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0), 0); }
  function pct(part, whole){
    if(!whole || !isFinite(whole) || !isFinite(part)) return 0;
    return round(100*part/whole, 0);
  }

  function fmtNet(x){
    if(x == null || (typeof x === 'number' && !isFinite(x))) return '—';
    return (Math.round(x*100)/100).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtNum(x){
    if(x == null || (typeof x === 'number' && !isFinite(x))) return '—';
    return Number(x).toLocaleString('tr-TR');
  }
  function fmtMin(mins){
    if(mins == null) return '—';
    const h = Math.floor(mins/60), m = Math.round(mins%60);
    if(h && m) return h+' sa '+m+' dk';
    if(h) return h+' sa';
    return m+' dk';
  }
  function fmtClock(seconds){
    const m = Math.floor(seconds/60), s = Math.floor(seconds%60);
    return pad2(m)+':'+pad2(s);
  }

  /* --- metin --- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function uid(prefix){
    return (prefix||'id') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function slug(s){
    return String(s).toLowerCase()
      .replace(/[ığüşöç]/g, c => ({'ı':'i','ğ':'g','ü':'u','ş':'s','ö':'o','ç':'c'}[c]))
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }
  function plural(n, one, many){ return n+' '+(n===1?one:many); }

  /* Arama normalizasyonu: "ogrenme" ile "öğrenme" eslesir.
     Once Turkce harfler sadelestirilir — "İ".toLowerCase() birlesik nokta
     uretir, bu yuzden kucultme sonra yapilir. */
  const COMBINING = /[\u0300-\u036f]/g;   // birlesik aksan isaretleri
  function norm(s){
    return String(s == null ? '' : s)
      .replace(/[ıİI]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
      .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
      .toLowerCase()
      .replace(COMBINING, '');   // artakalan birlesik isaretler
  }

  function debounce(fn, wait){
    let t;
    return function(){
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(ctx, args), wait||250);
    };
  }

  /* Son n gunun ISO tarihleri, ESKIDEN YENIYE. Bir pencereyi gezerken
     sirali olmasi onemli: ilk yarisi gecen hafta, ikinci yarisi bu hafta
     gibi karsilastirmalar bu siraya dayanir. */
  function lastDays(n, endISO){
    const end = parse(endISO || todayISO());
    const out = [];
    for(let i = n - 1; i >= 0; i--) out.push(iso(addDays(end, -i)));
    return out;
  }

  return {
    MONTHS, MONTHS_SHORT, DAY_MS,
    pad2, iso, parse, today, todayISO, addDays, diffDays, weekdayIndex, lastDays,
    fmtDate, fmtShort, fmtRange, monthName, monthKey, relativeDay,
    median, round, clamp, sum, pct, fmtNet, fmtNum, fmtMin, fmtClock,
    esc, uid, slug, plural, norm, debounce,
  };
})();

/* ==== js/core/memo.js ==== */
/* ÇİZİM ÖNBELLEĞİ — bir karede aynı hesabı iki kez yapma.

   Sorun ölçülerek bulundu. Beş yıllık veriyle ofis ekranı 996 ms
   sürüyordu ve sebep ağır bir fonksiyon değildi: AYNI fonksiyonun
   tek çizimde defalarca çağrılmasıydı.

     Bio.attention()        12 kez
     Bio.overdue()          11 kez
     Calc.crossFindings()    9 kez
     Office.notes()          9 kez

   Bunlar birbirini çağırıyor: her masa kendi notunu süzmek için
   notes()'un TAMAMINI üretiyor, patron brifingi crossFindings()'i
   yeniden hesaplıyor, başlık/istatistik/alt başlık üçlüsü aynı şeyi
   bir kez daha istiyor. Boş veriyle hiçbiri görünmüyordu; denetim
   koşumları sekiz ölçümle çalışıyor, beş yılla değil.

   ─────────────────────────────────────────────────────────────

   ÇÖZÜMÜN SINIRI ÖNEMLİ: önbellek YALNIZCA bir çizim boyunca yaşar.
   Çizim başlarken açılır, biterken kapanır ve boşaltılır. Kare
   dışında `of()` hiçbir şey saklamaz, doğrudan hesabı çağırır.

   Bu bilerek seçildi. Kalıcı bir önbellek "durum değişti mi?"
   sorusunu sormak zorundadır ve o soru yanlış cevaplanırsa sistem
   ESKİ SAYIYI gösterir — bu sistemde bir sayının yanlış olması, geç
   gelmesinden çok daha kötüdür. Kare önbelleğinde böyle bir soru
   yoktur: veri kare içinde değişmez.

   KURAL: buraya konan bir değer PAYLAŞILIR. Çağıran onu
   değiştiremez. Diziyi sıralamak, itmek, eleman silmek yasaktır;
   `filter`/`map`/`slice` zaten kopya döndürür. */

window.ESP = window.ESP || {};

ESP.Memo = (function(){
  let acik = false;
  const kutu = new Map();

  /* Kare başladı: önbellek açılır ve boş başlar. */
  function baslat(){ acik = true; kutu.clear(); }

  /* Kare bitti: önbellek kapanır ve boşalır. Kapalıyken `of()`
     saklamaz — testler ve kare dışı çağrılar hep taze hesap alır. */
  function bitir(){ acik = false; kutu.clear(); }

  function of(anahtar, uret){
    if(!acik) return uret();
    if(kutu.has(anahtar)) return kutu.get(anahtar);
    const v = uret();
    kutu.set(anahtar, v);
    return v;
  }

  /* Ölçüm için: kare içinde kaç ayrı hesap saklandı? */
  function boyut(){ return kutu.size; }
  function acikMi(){ return acik; }

  return { of, baslat, bitir, boyut, acikMi };
})();

/* ==== js/core/h.js ==== */
/* Sablon katmani.

   html`` etiketli sablonu: araya giren her deger varsayilan olarak KAÇIRILIR.
   Yapisal HTML raw() ile isaretlenir; ic ice html`` cagrilari zaten raw doner.

     h.html`<p>${kullaniciMetni}</p>`            → kacirilir
     h.html`<div>${h.raw(baskaHtml)}</div>`      → oldugu gibi
     h.html`${liste.map(x => h.html`<li>${x}</li>`)}`  → dizi otomatik birlesir

   Kural: kullanici verisi ve metin daima kaçırılır, yapısal HTML raw. */

window.ESP = window.ESP || {};

ESP.h = (function(){
  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function Raw(s){ this.s = s; }
  Raw.prototype.toString = function(){ return this.s; };

  function raw(s){ return s instanceof Raw ? s : new Raw(s == null ? '' : String(s)); }
  function isRaw(v){ return v instanceof Raw; }

  /* Bir degeri HTML metnine cevirir. */
  function val(v){
    if(v == null || v === false || v === true) return '';
    if(v instanceof Raw) return v.s;
    if(Array.isArray(v)) return v.map(val).join('');
    if(typeof v === 'number') return String(v);
    return esc(v);
  }

  function html(strings, ...vals){
    let out = strings[0];
    for(let i = 0; i < vals.length; i++) out += val(vals[i]) + strings[i+1];
    return new Raw(out);
  }

  /* Kosullu parca: yanlissa hicbir sey uretmez. */
  function when(cond, node){
    if(!cond) return raw('');
    return raw(val(typeof node === 'function' ? node() : node));
  }

  /* Sinif adlarini birlestirir: cls('card', aktif && 'is-active') */
  function cls(){
    return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');
  }

  /* Nitelik sozlugu: attrs({ 'data-act':'go', disabled:true, title:null }) */
  function attrs(map){
    const out = [];
    Object.keys(map || {}).forEach(k => {
      const v = map[k];
      if(v == null || v === false) return;
      if(v === true) out.push(k);
      else out.push(k + '="' + esc(v) + '"');
    });
    return raw(out.join(' '));
  }

  /* Liste: map(dizi, fn) — bos dizide bos doner */
  function map(list, fn){
    return raw((list || []).map((item, i) => val(fn(item, i))).join(''));
  }

  return { html, raw, isRaw, val, when, cls, attrs, map, esc };
})();

/* ==== js/core/store.js ==== */
/* Kalici depolama.
   Once Artifact "db" yetenegi denenir (cihazlar arasi), yoksa localStorage'a duser.
   Her iki durumda da yerel kopya tutulur; boylece cevrimdisi calisir.
   Hatalar yutulmaz: onError kancasi uzerinden arayuze bildirilir. */

window.ESP = window.ESP || {};

ESP.SCHEMA_VERSION = 1;

ESP.Store = (function(){
  /* Hane halki: her profil kendi anahtarinda durur. Tahlil ve olcum verisi
     profiller arasinda karismaz; 'ben' varsayilan birincil profildir. */
  function activeProfile(){
    try{ return localStorage.getItem('esp.activeProfile') || 'ben'; }
    catch(e){ return 'ben'; }
  }
  const PROFILE = activeProfile();
  const LOCAL_KEY = 'esp.v1.' + PROFILE;
  let db = null;
  let mode = 'local';

  const health = {
    cloud:'off',        // 'off' | 'ok' | 'error'
    local:'ok',         // 'ok' | 'error'
    lastError:null,     // { scope, code, message, at }
    pendingCloudWrites:0,
  };

  let onError = null;   // app.js tarafindan baglanir

  function report(scope, err, userMessage){
    const code = (err && err.code) || (err && err.name) || 'unknown';
    health.lastError = {
      scope, code,
      message: userMessage || (err && err.message) || String(err),
      at: new Date().toISOString(),
    };
    console.error('[Store:'+scope+']', err);
    if(typeof onError === 'function'){
      try{ onError(health.lastError, health); }catch(e){}
    }
  }

  function isQuotaError(e){
    if(!e) return false;
    return e.name === 'QuotaExceededError'
      || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
      || e.code === 22 || e.code === 1014
      || /quota|storage.*full/i.test(e.message || '');
  }

  /* ---------- ayrıştırılmış kopya ----------

     HER YAZMA TÜM DEPOYU AYRIŞTIRIYORDU. `lSet` önce `localAll()` ile
     bütün kaydı JSON'dan çözüyor, tek anahtarı değiştirip yeniden
     serileştiriyordu; yani bir ölçüm girmenin maliyeti, o güne kadar
     girilmiş HER ŞEYİN boyutuyla büyüyordu.

     Ölçüldü: 50 kayıtta yazma başına 0,17 ms, 1000 kayıtta 5,00 ms —
     yirmi dokuz kat. Dokuz aylık kullanımda (günde ~10 kayıt) her
     dokunuş fark edilir bir gecikmeye dönüşürdü.

     Çözüm ayrıştırılmış kopyayı bellekte tutmaktır. Serileştirme
     KALIR — yazma yine anında diske iner, ertelenmez. Ertelenen bir
     yazma, sekmesini kapatan kullanıcının verisini kaybeder ve burası
     verinin kaybolabileceği tek yerdir; hız için o riski almayız.

     Kopya BAŞKA BİR SEKME yazdığında geçersizleşir: `storage` olayı
     yalnızca diğer sekmelerde tetiklenir, tam da bize gereken şey. */
  let kopya = null;

  function localAll(){
    if(kopya) return kopya;
    try{
      kopya = JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}');
      return kopya;
    }catch(e){
      report('local-read', e, 'Yerel kayıt okunamadı; veriler geçici olarak bellekte tutuluyor.');
      health.local = 'error';
      kopya = {};
      return kopya;
    }
  }

  /* Başka sekme yazdıysa bellekteki kopya eskimiştir. */
  try{
    window.addEventListener('storage', e => {
      if(!e || e.key === null || e.key === LOCAL_KEY) kopya = null;
    });
  }catch(e){ /* olay bağlanamadıysa kopya yalnız bu sekmede yaşar */ }
  function localWrite(all){
    kopya = all;
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
      if(health.local === 'error'){ health.local = 'ok'; }
      return true;
    }catch(e){
      health.local = 'error';
      report('local-write', e, isQuotaError(e)
        ? 'Tarayıcı depolama alanı doldu. Ayarlar → Rehber → Veri bölümünden yedek alıp eski kayıtları temizle.'
        : 'Değişiklik bu cihaza kaydedilemedi.');
      return false;
    }
  }

  function lGet(path){
    const all = localAll();
    return all[path] === undefined ? null : all[path];
  }
  function lSet(path, data){
    const all = localAll();
    all[path] = data;
    return localWrite(all);
  }
  function lDel(path){
    const all = localAll();
    delete all[path];
    localWrite(all);
  }
  /* Birden çok yolu TEK yazmayla kaydeder.

     Bulut listesi geldiğinde her satır ayrı ayrı `lSet` ile yazılıyordu:
     yüz kayıtlık bir koleksiyon, yüz kez tam serileştirme demekti. */
  function lSetMany(pairs){
    if(!pairs.length) return true;
    const all = localAll();
    pairs.forEach(([path, data]) => { all[path] = data; });
    return localWrite(all);
  }

  function lList(prefix){
    const all = localAll();
    const p = prefix.endsWith('/') ? prefix : prefix + '/';
    const out = [];
    Object.keys(all).forEach(k => {
      if(k.indexOf(p) === 0){
        const rest = k.slice(p.length);
        if(rest && rest.indexOf('/') === -1) out.push(Object.assign({ id:rest }, all[k]));
      }
    });
    return out;
  }

  async function init(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const api = await window.claude.use('db');
        if(api){ db = api; mode = 'cloud'; health.cloud = 'ok'; }
      }
    }catch(e){
      db = null;
      health.cloud = 'error';
      report('cloud-init', e, 'Hesaba bağlı senkronizasyon açılamadı; uygulama bu cihazda çalışmaya devam ediyor.');
    }
    return mode;
  }

  async function get(path){
    if(db){
      try{
        const snap = await db.doc(path).get();
        health.cloud = 'ok';
        if(snap.exists){
          const data = snap.data();
          lSet(path, data);
          return data;
        }
        return lGet(path);
      }catch(e){
        health.cloud = 'error';
        report('cloud-read', e, 'Buluttan okunamadı; bu cihazdaki kopya kullanılıyor.');
        return lGet(path);
      }
    }
    return lGet(path);
  }

  async function set(path, data){
    const localOk = lSet(path, data);
    if(db){
      health.pendingCloudWrites++;
      try{
        await db.doc(path).set(data);
        health.cloud = 'ok';
      }catch(e){
        health.cloud = 'error';
        report('cloud-write', e, localOk
          ? 'Değişiklik bu cihaza kaydedildi ama buluta gönderilemedi. Bağlantı gelince tekrar dene.'
          : 'Değişiklik kaydedilemedi.');
      }finally{
        health.pendingCloudWrites--;
      }
    }
    return localOk;
  }

  async function remove(path){
    lDel(path);
    if(db){
      try{ await db.doc(path).delete(); }
      catch(e){
        health.cloud = 'error';
        report('cloud-delete', e, 'Kayıt buluttan silinemedi.');
      }
    }
  }

  async function list(collection){
    if(db){
      try{
        const snap = await db.collection(collection).get();
        health.cloud = 'ok';
        const rows = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
        lSetMany(rows.map(r => [collection+'/'+r.id, r]));
        if(rows.length) return rows;
        return lList(collection);
      }catch(e){
        health.cloud = 'error';
        report('cloud-list', e, 'Bulut verisi okunamadı; bu cihazdaki kopya kullanılıyor.');
        return lList(collection);
      }
    }
    return lList(collection);
  }

  /* ---------- yedekleme ---------- */

  function exportAll(){
    return {
      __meta:{
        app:'esp-entelektuel',
        schemaVersion:ESP.SCHEMA_VERSION,
        exportedAt:new Date().toISOString(),
        mode,
      },
      data:localAll(),
    };
  }

  /* Hem yeni ({__meta,data}) hem eski (duz sozluk) bicimi kabul eder. */
  function readBackup(obj){
    if(!obj || typeof obj !== 'object') return { ok:false, error:'Dosya okunamadı.' };
    if(obj.__meta && obj.data){
      if(obj.__meta.schemaVersion > ESP.SCHEMA_VERSION){
        return { ok:false, error:'Bu yedek daha yeni bir sürümle alınmış (şema '+obj.__meta.schemaVersion+'). Önce uygulamayı güncelle.' };
      }
      return { ok:true, data:obj.data, meta:obj.__meta };
    }
    const keys = Object.keys(obj);
    const looksLegacy = keys.some(k => k.indexOf('/') > 0);
    if(!looksLegacy) return { ok:false, error:'Bu dosya bir ESP yedeği değil.' };
    return { ok:true, data:obj, meta:{ schemaVersion:1, legacy:true } };
  }

  async function importAll(obj){
    const parsed = readBackup(obj);
    if(!parsed.ok) throw new Error(parsed.error);
    localWrite(parsed.data);
    if(db){
      for(const k of Object.keys(parsed.data)){
        try{ await db.doc(k).set(parsed.data[k]); }
        catch(e){ health.cloud = 'error'; }
      }
    }
    return parsed.meta;
  }

  async function clear(){
    const all = localAll();
    kopya = {};
    try{ localStorage.removeItem(LOCAL_KEY); }catch(e){}
    if(db){
      for(const k of Object.keys(all)){
        try{ await db.doc(k).delete(); }catch(e){}
      }
    }
  }

  /* Kabaca kullanilan yerel alan (byte) */
  function localSize(){
    try{ return (localStorage.getItem(LOCAL_KEY) || '').length; }
    catch(e){ return 0; }
  }

  /* Tarayicilarin localStorage siniri genelde ~5 MB'tir (kaynak basina).
     Kesin deger okunamaz; bu yuzden 5 MB varsayilip doluluk yuzdesi tahmin edilir.
     %75 uzerinde kullaniciyi uyarmak icin `near` isaretlenir. */
  const LOCAL_QUOTA = 5 * 1024 * 1024;
  function localQuota(){
    const bytes = localSize();
    const pct = Math.min(100, Math.round(100*bytes/LOCAL_QUOTA));
    return { bytes, limit:LOCAL_QUOTA, pct, near:pct >= 75, full:pct >= 92 };
  }

  return {
    init, get, set, remove, list,
    /* Aktif profilin kimligi. state.js varsayilan profili kurarken buna
       ihtiyac duyar; depo anahtarini uretmis olan katman soylesin diye
       disari acilir. */
    activeProfileId(){ return PROFILE; },
    exportAll, importAll, readBackup, clear, localSize, localQuota,
    health(){ return Object.assign({ mode }, health); },
    set onError(fn){ onError = fn; },
    get mode(){ return mode; },
  };
})();

   ESP.S calisma anindaki durumu tutar; ESP.Model onu depoyla (core/store.js)

   yazar — hicbir ekran dogrudan depoya dokunmaz.

   Depolama yollari:
     profile              aktif profilin kimligi ve odagi
     prefs                tercihler (tema, palet, duzen, ofis ayarlari)

     cards/<id>           bir SRS karti (dil)

   `dayHasEntry` (hic girildi mi) ile `minutesOf` (kac dakika) ayri sorulardir. */

ESP.Model = (function(){
  const U = ESP.U;
  const S = ESP.S;

  /* ---------------------------------------------------------- yardimcilar */

  /* Bos nesne ve diziler depolama katmanindan geri gelmeyebilir; okunan her
     belge kullanilmadan once eksik kaplari tamamlanir. Eksik kap yuzunden
     cizim sirasinda patlayan bir ekran, kabugu da kapatmasa bile o bolumu
     kullanilamaz hale getirir. */
  function arr(v){ return Array.isArray(v) ? v : []; }
  function obj(v){ return (v && typeof v === 'object') ? v : {}; }

  /* Bir sayiyi kesinlik etiketiyle birlikte okur.

     Devir notundaki en pahali hata buydu: `Number(x) || 0` bos alani sifir
     yapar ve uydurulmus sifir ortalamaya girer. Burada bos alan `null`
     doner ve etiketi `missing` olur. */
  function numCert(raw, cert){
    const yazildi = raw != null && String(raw).trim() !== '';
    if(!yazildi) return { value:null, cert:'missing' };
    const n = Number(String(raw).replace(',', '.'));
    if(!isFinite(n) || n < 0) return { value:null, cert:'missing' };
    return { value:n, cert:cert || 'measured' };
  }

  /* --------------------------------------------------------------- profil */

  function defaultProfile(){
    return {
      id:ESP.Store.activeProfileId ? ESP.Store.activeProfileId() : 'ben',
      name:'',
      focus:'balanced',            // ESP.FOCUS
      langs:['en'],                // calisilan diller
      instrument:'gitar',
      dailyMinutes:60,             // hedef degil, olcut: gunun plan tabani

  /* ------------------------------------------------------- profil listesi

     Cihazdaki profiller tek bir localStorage anahtarinda durur; her profilin
     VERISI ise kendi depo anahtarinda (esp.v1.<profil>) yasar. Profil gecisi
     sayfayi yeniden yukler: yarim kalmis bir yazma isleminin yanlis profile
     dusmesi boylece imkansizdir. */
  const LIST_KEY = 'esp.profiles';

  function profileList(){
    try{ return JSON.parse(localStorage.getItem(LIST_KEY) || '[]'); }
    catch(e){ return []; }
  }

  function writeProfileList(list){
    try{ localStorage.setItem(LIST_KEY, JSON.stringify(list)); }catch(e){}
    S.profiles = list;
  }

  function activeProfileId(){
    try{ return localStorage.getItem('esp.activeProfile') || 'ben'; }
    catch(e){ return 'ben'; }
  }

  async function touchProfileList(){
    const id = activeProfileId();
    const list = profileList();
    const row = list.find(x => x.id === id);
    const name = (S.profile && S.profile.name) || '';
    if(row){ row.name = name; }
    else list.push({ id, name });
    writeProfileList(list);
  }

  function addProfile(name){
    const clean = String(name || '').trim();
    if(!clean) return { ok:false, error:'Profil adı boş olamaz.' };
    const id = U.slug(clean) || ('p' + Date.now().toString(36));
    const list = profileList();
    if(list.some(x => x.id === id)) return { ok:false, error:'Bu adla bir profil zaten var.' };
    list.push({ id, name:clean });
    writeProfileList(list);
    return { ok:true, id };
  }

  function removeProfile(id){
    if(id === activeProfileId()) return { ok:false, error:'Açık olan profil silinemez.' };
    writeProfileList(profileList().filter(x => x.id !== id));
    try{ localStorage.removeItem('esp.v1.' + id); }catch(e){}
    return { ok:true };
  }

  function switchProfile(id){
    try{ localStorage.setItem('esp.activeProfile', id); }catch(e){}
    location.reload();
  }

  /* ----------------------------------------------------------- gun kaydi

     Bir gun oturumlardan olusur. Oturum = bir disiplinde gecirilen olculmus
     sure. Gunun kendisi bir skor tasimaz: skoru kural motoru hesaplar.

     `dayHasEntry` ile `minutesOf` ayri sorulardir ve ayri kalmalidir:
     birincisi "bu gune hic dokunuldu mu", ikincisi "kac dakika". Bir gun
     acilip hicbir oturum girilmemisse birincisi de yanlistir — kayit
     yalnizca oturum eklendiginde olusur. */

  function newDay(dateISO){
    return { date:dateISO, sessions:[], note:'', updatedAt:new Date().toISOString() };
  }

  function normDay(doc){
    const d = obj(doc);
    return {
      date:d.date,
      sessions:arr(d.sessions).map(normSession),
      note:d.note || '',
      updatedAt:d.updatedAt || null,
    };
  }

  function normSession(s){
    const r = obj(s);
    return {
      id:r.id || U.uid('s'),
      disc:r.disc || 'lang',
      minutes:(typeof r.minutes === 'number' && isFinite(r.minutes)) ? r.minutes : null,
      minutesCert:r.minutesCert || (r.minutes == null ? 'missing' : 'measured'),
      /* Kalite kullanicinin kendi degerlendirmesidir ve DAIMA tahmindir.
         Olculmus bir sey gibi gosterilmesi doktrin ihlali olurdu. */
      quality:(typeof r.quality === 'number' && isFinite(r.quality)) ? r.quality : null,
      qualityCert:r.quality == null ? 'missing' : 'estimated',
      /* Disipline ozel olculmus ikinci sayi. Yazida kelime, dilde cozulen
         kart, muzikte temiz tekrar. Tek alan tutulur cunku ekranlarin
         hepsinde "sure + bir sayi" kalibi var; ucuncu bir sayi isteyen
         disiplin cikmadi. */
      count:(typeof r.count === 'number' && isFinite(r.count)) ? r.count : null,
      countCert:r.count == null ? 'missing' : 'measured',
      ref:r.ref || null,        // hangi karta/parcaya/kaynaga baglandi
      note:r.note || '',
      at:r.at || null,
    };
  }

  function dayOf(dateISO){ return S.days[dateISO] || null; }

  function ensureDay(dateISO){
    if(!S.days[dateISO]) S.days[dateISO] = newDay(dateISO);
    return S.days[dateISO];
  }

  /* Bir gune hic dokunuldu mu? Bos bir gun kaydi "dokunuldu" sayilmaz:
     ortalamaya girecek olan sey oturumdur, kaydin varligi degil. */
  function dayHasEntry(day){
    const d = obj(day);
    return arr(d.sessions).length > 0;
  }

  function sessionsOf(dateISO){ return arr((S.days[dateISO] || {}).sessions); }

  /* Bir gunde bir disiplinde gecen olculmus dakika.

     Donus `null` ise o gun o disipline HIC dokunulmamistir — sifir degil.
     Cagiran taraf ikisini ayirmak zorundadir; bu yuzden 0 donmuyoruz. */
  function minutesOf(dateISO, discId){
    const rows = sessionsOf(dateISO)
      .filter(s => (!discId || s.disc === discId) && s.minutesCert !== 'missing' && s.minutes != null);
    if(!rows.length) return null;
    return rows.reduce((a, s) => a + s.minutes, 0);
  }

  async function saveDay(dateISO){
    const rec = ensureDay(dateISO);
    rec.updatedAt = new Date().toISOString();
    /* Bos gun kaydi depoya YAZILMAZ: yazilsaydi "dokunulmus gun" sayisi
       kullanicinin acip kapattigi her gunle sisecekti. */
    if(!dayHasEntry(rec) && !rec.note){
      delete S.days[dateISO];
      await ESP.Store.remove('days/' + dateISO);
      return null;
    }
    await ESP.Store.set('days/' + dateISO, rec);
    return rec;
  }

  async function addSession(dateISO, patch){
    const day = ensureDay(dateISO);
    const m = numCert(patch && patch.minutes, 'measured');
    const c = numCert(patch && patch.count, 'measured');
    const s = normSession(Object.assign({}, patch, {
      id:U.uid('s'),
      minutes:m.value, minutesCert:m.cert,
      count:c.value, countCert:c.cert,
      at:new Date().toISOString(),
    }));
    day.sessions.push(s);
    await saveDay(dateISO);
    return s;
  }

  async function updateSession(dateISO, id, patch){
    const day = ensureDay(dateISO);
    const i = day.sessions.findIndex(s => s.id === id);
    if(i < 0) return null;
    const merged = Object.assign({}, day.sessions[i], patch || {});
    if(patch && 'minutes' in patch){
      const m = numCert(patch.minutes, 'measured');
      merged.minutes = m.value; merged.minutesCert = m.cert;
    }
    if(patch && 'count' in patch){
      const c = numCert(patch.count, 'measured');
      merged.count = c.value; merged.countCert = c.cert;
    }
    day.sessions[i] = normSession(merged);
    await saveDay(dateISO);
    return day.sessions[i];
  }

  async function deleteSession(dateISO, id){
    const day = ensureDay(dateISO);
    day.sessions = day.sessions.filter(s => s.id !== id);
    await saveDay(dateISO);
  }

  /* Son N gunun kayitli gunleri — girilmemis gunler DIZIDE YOKTUR.
     Cagiran "kac gun girildi" ile "kac gun gecti" farkini gorebilsin diye. */
  function recentDays(n){
    return U.lastDays(n || 30)
      .map(d => S.days[d])
      .filter(d => d && dayHasEntry(d));
  }

  /* Seri: bugunden geriye dogru, oturumu olan ust uste gun sayisi.

     Bugun henuz girilmemisse seri KIRILMIS sayilmaz — gun bitmedi.
     Sayim dunden baslar, bugun varsa ona eklenir. */
  function streak(){
    let n = 0;
    const bugun = U.todayISO();
    if(dayHasEntry(S.days[bugun])) n = 1;
    for(let i = 1; i < 400; i++){
      const d = U.iso(U.addDays(U.parse(bugun), -i));
      if(dayHasEntry(S.days[d])) n++;
      else break;
    }
    return n;
  }

  /* ------------------------------------------------------------ SRS karti

     Kartin SRS alanlari (box, ease, interval, due) core/srs.js tarafindan

  function newCard(patch){

  /* ----------------------------------------------------------- arguman

     Bir tez ACIK kalir: cevaplanmamis itirazi varsa kapanmaz. Acik tez bir
     eksiklik degildir — calisan bir dusuncedir. Yalnizca 14 gunden uzun
     dokunulmadiysa masa notu duser. */

  function newArgument(patch){
    return Object.assign({
      id:U.uid('a'),
      thesis:'', supports:[], objections:[],
      sourceId:null,           // hangi kaynaktan (books/<id>)
      concepts:[],
      status:'open',           // open | closed | abandoned
      createdAt:new Date().toISOString(),
      updatedAt:new Date().toISOString(),
    }, patch || {});
  }

  function normArgument(doc){
    const a = obj(doc);
    return Object.assign(newArgument(), a, {
      supports:arr(a.supports),
      objections:arr(a.objections).map(o => ({
        id:o.id || U.uid('o'), text:o.text || '',
        answered:!!o.answered, answer:o.answer || '',
      })),
      concepts:arr(a.concepts),
    });
  }

  /* Cevaplanmamis itirazi olan tez kapanamaz. Bunu model zorlar, ekran
     degil: ayni kural iki ekrandan da gecerli olsun diye. */
  function argumentOpen(a){
    return arr(a && a.objections).some(o => !o.answered);
  }

  async function saveArgument(rec){
    const a = normArgument(rec);
    if(a.status === 'closed' && argumentOpen(a)) a.status = 'open';
    a.updatedAt = new Date().toISOString();
    const i = S.args.findIndex(x => x.id === a.id);
    if(i >= 0) S.args[i] = a; else S.args.unshift(a);
    await ESP.Store.set('args/' + a.id, a);
    return a;
  }

    await ESP.Store.remove('args/' + id);

  /* ------------------------------------------------------- atomik not ve kaynak */

  function newNote(patch){

      id:U.uid('n'),

      bookId:null,
      concepts:[],
      links:[],                // [{ to:noteId, why:'' }]
      createdAt:new Date().toISOString(),
    }, patch || {});
  }

  function normNote(doc){
    const n = obj(doc);
    return Object.assign(newNote(), n, {
      concepts:arr(n.concepts),
      links:arr(n.links).map(l => ({ to:l.to, why:l.why || '' })),
    });
  }

  async function saveNote(rec){
    const n = normNote(rec);
    const i = S.notes.findIndex(x => x.id === n.id);
    if(i >= 0) S.notes[i] = n; else S.notes.unshift(n);

  async function deleteNote(id){
    S.notes = S.notes.filter(n => n.id !== id);
    /* Silinen nota giden baglar da kalkar; yoksa matris olmayan bir
       dugume isaret eden ok cizer. */
    const etkilenen = S.notes.filter(n => n.links.some(l => l.to === id));
    for(const n of etkilenen){
      n.links = n.links.filter(l => l.to !== id);
      await ESP.Store.set('notes/' + n.id, n);
    }
    await ESP.Store.remove('notes/' + id);
  }

  /* Iki notu birbirine baglar. Bag CIFT YONLUDUR: sentopik okuma "A, B'yi
     soyle goruyor" degil "A ile B su kavramda bulusuyor" der. */
  async function linkNotes(aId, bId, why){
    if(aId === bId) return { ok:false, error:'Bir not kendine bağlanmaz.' };
    const a = S.notes.find(n => n.id === aId), b = S.notes.find(n => n.id === bId);
    if(!a || !b) return { ok:false, error:'Not bulunamadı.' };
    if(a.links.some(l => l.to === bId)) return { ok:false, error:'Bu bağ zaten var.' };
    a.links.push({ to:bId, why:why || '' });
    b.links.push({ to:aId, why:why || '' });
    await saveNote(a); await saveNote(b);
    return { ok:true };
  }

  async function unlinkNotes(aId, bId){
    const a = S.notes.find(n => n.id === aId), b = S.notes.find(n => n.id === bId);
    if(a){ a.links = a.links.filter(l => l.to !== bId); await saveNote(a); }
    if(b){ b.links = b.links.filter(l => l.to !== aId); await saveNote(b); }
  }

  /* -------------------------------------------------------------- sistem */

  async function markBackup(){
    S.meta = Object.assign({ schemaVersion:ESP.SCHEMA_VERSION }, S.meta,
      { lastBackup:new Date().toISOString() });
    await ESP.Store.set('meta', S.meta);
  }

  function backupAgeDays(){
    const at = S.meta && S.meta.lastBackup;
    if(!at) return null;
    return Math.floor((Date.now() - new Date(at).getTime()) / U.DAY_MS);
  }

  function backupDue(){
    const n = backupAgeDays();
    return n == null ? true : n >= 30;
  }

  function dataFootprint(){
    const bytes = ESP.Store.localSize();
    const quota = ESP.Store.localQuota();
    return { bytes, quota, pct:quota ? Math.round(bytes / quota * 100) : null };

  /* ------------------------------------------------------------------ goc

     Yikici degildir: yeni koleksiyonlar bos baslar, ilk yazmada olusur.
     Bir goc yalnizca KENDINI ELE VEREN veriyi onarir; emin olunamayan
     kayda dokunmaz. */
  function migrate(meta){
    const m = Object.assign({ schemaVersion:0 }, obj(meta));
    if(m.schemaVersion < 1){
      m.schemaVersion = 1;
      m.migratedAt = new Date().toISOString();
    }
    return m;
  }

  /* ------------------------------------------------------------- yukleme */

  async function loadAll(){
    await ESP.Store.init();

    S.meta = migrate(await ESP.Store.get('meta') || { schemaVersion:ESP.SCHEMA_VERSION });
    await ESP.Store.set('meta', S.meta);

    S.profile = Object.assign(defaultProfile(), await ESP.Store.get('profile'));
    S.prefs = Object.assign(defaultPrefs(), await ESP.Store.get('prefs'));
    S.profiles = profileList();
    if(!S.profiles.length) await touchProfileList();

    S.days = {};
    ((await ESP.Store.list('days')) || []).forEach(row => {
      const d = normDay(row);
      if(d.date) S.days[d.date] = d;
    });

    S.cards = ((await ESP.Store.list('cards')) || []).map(normCard);
    S.args = ((await ESP.Store.list('args')) || []).map(normArgument)
      .sort((a, b) => (b.updatedAt || '') < (a.updatedAt || '') ? -1 : 1);
    S.notes = ((await ESP.Store.list('notes')) || []).map(normNote);
    S.books = ((await ESP.Store.list('books')) || []).map(b => Object.assign(newBook(), b));
    S.pieces = ((await ESP.Store.list('pieces')) || []).map(normPiece);
    S.recordings = ((await ESP.Store.list('recordings')) || [])
      .map(r => Object.assign(newRecording(), r));
    S.drafts = ((await ESP.Store.list('drafts')) || [])
      .map(d => Object.assign(newDraft(), d));
    S.goals = ((await ESP.Store.list('goals')) || []).map(g => Object.assign(newGoal(), g));
    S.decisions = ((await ESP.Store.list('decisions')) || []);

    S.storeHealth = ESP.Store.health();
    S.ready = true;
  }

  return {
    /* profil */
    defaultProfile, saveProfile, defaultPrefs, savePrefs,
    profileList, addProfile, removeProfile, switchProfile, activeProfileId,
    /* gun ve oturum */
    newDay, dayOf, ensureDay, saveDay, dayHasEntry, sessionsOf, minutesOf,
    addSession, updateSession, deleteSession, recentDays, streak,
    /* dil */
    newCard, saveCard, deleteCard, cardsOf,

/* ==== js/core/srs.js ==== */
/* Arali tekrar motoru — Leitner kutulari, SM-2 ile yumusatilmis.

   Tek is: bir karti TAM UNUTULMADAN HEMEN ONCE sormak. Amac tekrar sayisini
   azaltmak degil, ayni hatirlamayi daha az tekrarla elde etmektir.

   Iki yapi birlikte calisir:

     KUTU (box 1..5)  kaba siniftir; "bu karti ne kadar taniyorum".
     EASE (1.3..2.8)  ince ayardir; ayni kutudaki iki kart ayni hizda uzamaz.

   Neden ikisi birden? Saf Leitner cok kaba: kolay ve zor kart ayni araligi
   alir. Saf SM-2 ise cok kirilgan: tek bir yanlis cevap araligi sifirlar ve
   kullanici ayni kartla gunlerce bogusur. Kutu bir taban verir, ease o
   tabani kartin kendi zorluguna gore kaydirir.

   R(t) = e^(−t/S) — kavramsal retansiyon. S kartin kararliligidir ve her
   dogru cevapta buyur. Bu fonksiyon `intellect.js` tarafindan degil burada
   tanimlidir cunku S'yi ureten sey SRS gecmisidir.

   DOKTRIN: hic calisilmamis kart ortalamaya GIRMEZ. Bir gun ara vermek
   retansiyonu cokmus gibi gosterirdi; oysa hic sorulmamis kart hakkinda
   soylenecek sey "veri yok"tur, "sifir" degil. */

window.ESP = window.ESP || {};

ESP.SRS = (function(){
  const U = ESP.U;
  const S = ESP.S;

  /* Kutu araliklari (gun). Ilk iki basamak kasitli olarak kisadir: yeni bir
     kartin ilk yirmi dort saatteki kaybi en buyuktur. */
  const BOXES = [
    { box:1, days:0,  label:'Yeni' },
    { box:2, days:1,  label:'Taze' },
    { box:3, days:3,  label:'Oturuyor' },
    { box:4, days:7,  label:'Yerleşti' },
    { box:5, days:21, label:'Sağlam' },
  ];

  const EASE_MIN = 1.3;
  const EASE_MAX = 2.8;
  const EASE_START = 2.5;

  /* Cevap kalitesi — dort dugme. Bes ve uzeri secenek kullaniciyi karsilastirma
     yapmaya zorluyor ve cevap suresini uzatiyordu; dordu yeter. */
  const GRADES = [
    { id:'again', label:'Yine',  quality:0, note:'Hatırlamadım. Kart başa döner.' },
    { id:'hard',  label:'Zor',   quality:3, note:'Hatırladım ama zorlandım. Aralık az uzar.' },
    { id:'good',  label:'İyi',   quality:4, note:'Hatırladım. Aralık normal uzar.' },
    { id:'easy',  label:'Kolay', quality:5, note:'Anında geldi. Aralık daha çok uzar.' },
  ];

  const GRADE_BY_ID = GRADES.reduce(function(m, g){ m[g.id] = g; return m; }, {});

  function boxDays(box){
    const row = BOXES.find(b => b.box === box);
    return row ? row.days : 0;
  }

  function clampEase(e){ return Math.min(EASE_MAX, Math.max(EASE_MIN, e)); }

  /* ---------------------------------------------------------- zamanlama */

  /* Bir cevabin karta ne yaptigi. SAF fonksiyon: kart nesnesini degistirmez,
     yeni alanlari doner. Boylece test tek satirda yazilir ve onizleme
     ("bu dugmeye basarsam ne olur") ayni hesabi kullanir. */
  function schedule(card, gradeId, todayISO){
    const g = GRADE_BY_ID[gradeId];
    if(!g) return null;
    const today = todayISO || U.todayISO();
    const c = card || {};
    const ease = clampEase(typeof c.ease === 'number' ? c.ease : EASE_START);
    const box = Math.min(5, Math.max(1, c.box || 1));

    /* Yanlis cevap: kutu basa doner ama ease TAMAMEN sifirlanmaz.
       Sifirlansaydi bir kez unutulan kart, hic ogrenilmemis kartla ayni
       muameleyi gorurdu — oysa gecmisi var. */
    if(g.quality === 0){
      return {
        box:1,
        ease:clampEase(ease - 0.2),
        interval:0,
        due:today,                       // aynı oturumda tekrar sorulur
        reps:(c.reps || 0) + 1,
        lapses:(c.lapses || 0) + 1,
      };
    }

    const yeniKutu = Math.min(5, box + (g.quality >= 4 ? 1 : 0));
    /* Zor cevap kutuyu yukseltmez ama araligi da tamamen dondurmaz:
       kartin bir onceki araligina gore kucuk bir ilerleme verir. */
    const taban = boxDays(yeniKutu) || 1;
    const carpan = g.quality === 3 ? 0.6 : (g.quality === 5 ? ease / 2 + 0.5 : 1);
    const interval = Math.max(1, Math.round(taban * carpan));

    return {
      box:yeniKutu,
      ease:clampEase(ease + (g.quality === 5 ? 0.10 : g.quality === 3 ? -0.12 : 0)),
      interval,
      due:U.iso(U.addDays(U.parse(today), interval)),
      reps:(c.reps || 0) + 1,
      lapses:(c.lapses || 0),
    };
  }

  /* Bir cevabi karta ISLER ve kaydeder. Gecmise tek satir duser; gecmis
     retansiyon hesabinin tek girdisidir. */
  async function answer(cardId, gradeId){
    const card = S.cards.find(c => c.id === cardId);
    if(!card) return { ok:false, error:'Kart bulunamadı.' };
    const next = schedule(card, gradeId);
    if(!next) return { ok:false, error:'Böyle bir cevap yok.' };

    const onceki = { box:card.box, ease:card.ease, due:card.due };
    Object.assign(card, next);
    card.history = (card.history || []).concat([{
      at:new Date().toISOString(), grade:gradeId, box:next.box, interval:next.interval,
    }]);
    /* Gecmis sinirsiz buyumesin: retansiyon hesabi son 50 cevabi kullanir,
       fazlasi depoyu sisirir ve hicbir soruyu daha iyi cevaplamaz. */
    if(card.history.length > 50) card.history = card.history.slice(-50);

    await ESP.Model.saveCard(card);
    return { ok:true, card, before:onceki, after:next };
  }

  /* ------------------------------------------------------------- kuyruk */

  /* Vadesi gelmis kartlar. Bugun ve oncesi — geciken kart once gelir.

     `null` donmez, bos dizi doner: "vadesi gelen kart yok" olculmus bir
     sonuctur, eksik veri degil. */
  function dueCards(todayISO){
    const today = todayISO || U.todayISO();
    return S.cards
      .filter(c => (c.due || today) <= today)
      .sort((a, b) => {
        const d = (a.due || '').localeCompare(b.due || '');
        if(d !== 0) return d;                    // en cok geciken once
        return (a.box || 1) - (b.box || 1);      // sonra en zayif kutu
      });
  }

  /* Kac gun gecikmis. Kart bugun vadeliyse 0 doner. */
  function overdueDays(card, todayISO){
    const today = todayISO || U.todayISO();
    if(!card || !card.due) return 0;
    return Math.max(0, U.diffDays(card.due, today));
  }

  /* -------------------------------------------------------- retansiyon

     R(t) = e^(−t/S)

     S (kararlilik) kartin son araligindan gelir: bir kart 21 gun sonra
     soruldugunda dogru cevaplaniyorsa kararliligi kabaca o aralik kadardir.
     Yeni kartta aralik 0'dir; bu yuzden hic cevaplanmamis kart hesaba
     GIRMEZ — sifir bir olcum degil, olcumun yoklugudur. */
  function stabilityOf(card){
    const c = card || {};
    if(!c.reps) return null;                      // hic sorulmamis
    const taban = Math.max(1, c.interval || boxDays(c.box) || 1);
    /* Ease kararliligi olceklendirir: ayni araligi kolay bulan kart daha
       kararlidir. */
    return taban * (typeof c.ease === 'number' ? c.ease : EASE_START) / 2;
  }

  function retentionOf(card, todayISO){
    const s = stabilityOf(card);
    if(s == null) return null;
    const today = todayISO || U.todayISO();
    /* Gecen sure: kart en son ne zaman sorulduysa oradan. `due - interval`
       son cevap gunudur. */
    const sonCevap = card.due && card.interval
      ? U.iso(U.addDays(U.parse(card.due), -card.interval))
      : (card.history && card.history.length
          ? card.history[card.history.length - 1].at.slice(0, 10) : null);
    if(!sonCevap) return null;
    const t = Math.max(0, U.diffDays(sonCevap, today));
    return Math.exp(-t / s);
  }

  /* Destenin ortalama retansiyonu.

     Donus `{ value, cert, n, total }`. `cert` daima soylenir:
       measured   en az bir kart cevaplanmis
       missing    hic cevaplanmis kart yok — ORTALAMA URETILMEZ

     Hic cevaplanmamis kartlar `total`da gorunur ama `value`ya girmez.
     Kapsam ekranda yazilir: "12 karttan 9'undan hesaplandi". */
  function retention(lang, todayISO){
    const kartlar = ESP.Model.cardsOf(lang);
    const olculen = kartlar
      .map(c => retentionOf(c, todayISO))
      .filter(r => r != null);
    if(!olculen.length){
      return { value:null, cert:'missing', n:0, total:kartlar.length };
    }
    const ort = olculen.reduce((a, b) => a + b, 0) / olculen.length;
    return { value:ort, cert:'derived', n:olculen.length, total:kartlar.length };
  }

  /* --------------------------------------------------------------- ozet */

  /* Kutu dagilimi — hangi kart nerede. Ilerleme ekrani bunu cizer. */
  function boxCounts(lang){
    const kartlar = ESP.Model.cardsOf(lang);
    return BOXES.map(b => ({
      box:b.box, label:b.label,
      count:kartlar.filter(c => (c.box || 1) === b.box).length,
    }));
  }

  /* Aktif kelime: uretimde kullanildigini kullanicinin isaretledigi kart.

     Tanimak (pasif) ile cumlede kullanmak (aktif) ayri seylerdir ve ayri
     sayilir. Bir kartin kutusunun yuksek olmasi onu aktif yapmaz. */
  function activeCount(lang){
    return ESP.Model.cardsOf(lang).filter(c => c.active).length;
  }

  /* Destenin durumu — brifingin dil bolumu buradan beslenir. */
  function deckStatus(lang, todayISO){
    const today = todayISO || U.todayISO();
    const kartlar = ESP.Model.cardsOf(lang);
    const due = dueCards(today).filter(c => !lang || c.lang === lang);
    const r = retention(lang, today);
    const geciken = due.filter(c => overdueDays(c, today) > 0);
    return {
      total:kartlar.length,
      due:due.length,
      overdue:geciken.length,
      maxOverdueDays:geciken.reduce((m, c) => Math.max(m, overdueDays(c, today)), 0),
      retention:r,
      active:activeCount(lang),
      boxes:boxCounts(lang),
    };
  }

  /* Son N gunde cevaplanan kart sayisi. Gun basina degil TOPLAM doner;
     "gunde ortalama" hesabini cagiran yapar ve paydasini kendi soyler. */
  function answeredIn(days, todayISO){
    const today = todayISO || U.todayISO();
    const sinir = U.iso(U.addDays(U.parse(today), -(days || 7)));
    let n = 0;
    S.cards.forEach(c => {
      (c.history || []).forEach(h => { if(h.at.slice(0, 10) >= sinir) n++; });
    });
    return n;
  }

  return {
    BOXES, GRADES, GRADE_BY_ID, EASE_START, EASE_MIN, EASE_MAX,
    boxDays, schedule, answer,
    dueCards, overdueDays,
    stabilityOf, retentionOf, retention,
    boxCounts, activeCount, deckStatus, answeredIn,
  };
})();

/* ==== js/core/intellect.js ==== */
/* Entelektuel skor motoru — EHS, SSK, okunabilirlik ve arguman denetimi.

   Uc metrik ve iki denetim burada, TEK KAYNAKTAN hesaplanir. Ekranlar ve
   ajan brifingleri ayni fonksiyonu cagirir; kopya hesap yapmaz. Bir formul
   degisecekse burada degisir ve her yerde ayni anda degisir.

   Her fonksiyon sonucu KESINLIK ETIKETIYLE doner. Bir skorun "hesaplandi"
   olmasi onun guvenilir oldugunu degil, girilmis olculerden turetildigini
   soyler; "veri yok" ise hesabin hic yapilamadigini. Ikisi ayri seydir ve
   ekranda ayri gorunur. */

window.ESP = window.ESP || {};

ESP.Intellect = (function(){
  const U = ESP.U;
  const S = ESP.S;

  /* ==================================================================== EHS

     Entelektuel Hacim Skoru:  EHS = Σ (D_i × H_i × K_i)

       D_i  disiplin agirligi — data/rules.js icindeki sabit
       H_i  OLCULEN pratik saati. "Veri yok" gunler toplama GIRMEZ.
       K_i  kalite katsayisi — asagida.

     H_i'nin "olculen" olmasi sartinin sebebi doktrindir: bir haftalik
     bosluk "0 saat" diye toplama girseydi EHS duserdi ve sistem calisilmis
     ama girilmemis bir haftayi gerileme gibi gosterirdi. Girilmemis gun
     paydada da yoktur; EHS bir ORTALAMA degil bir HACIM olcusudur.

     Bu yuzden EHS tek basina okunmaz: yaninda daima kac gunden hesaplandigi
     yazar. "40 EHS" bir sey soylemez; "14 gunun 9'undan hesaplandi, 40 EHS"
     soyler. */

  /* Kalite katsayisi.

     Disiplinin kendi OLCULMUS kalite sinyalinden gelir; olculemiyorsa 1.0
     kalir ve bunu soyler. Kullanicinin "bugun iyiydi" degerlendirmesi buraya
     GIRMEZ: o bir tahmindir ve tahmin, olculmus bir hacmi buyutemez.

     Aralik [0.85, 1.15] ile sinirlidir. Genis birakilsaydi kalite hacmi
     ezer ve az ama iyi calisan biri cok calisan birinden yuksek hacim
     gosterirdi — oysa olculen sey hacim. */
  function qualityCoef(discId){
    const yok = { k:1, cert:'missing', why:'Bu disiplinde ölçülmüş kalite sinyali yok; katsayı 1,0 alındı.' };

    if(discId === 'lang'){
      const r = ESP.SRS.retention();
      if(r.cert === 'missing') return yok;
      /* %80 retansiyon notrdur: SRS'in hedefledigi bant odur. */
      return { k:clampK(0.85 + (r.value - 0.5) * 0.6), cert:'derived',
        why:'Retansiyon %' + Math.round(r.value * 100) + ' (' + r.n + ' karttan).' };
    }

    if(discId === 'reading'){
      const ss = syntopic();
      if(ss.cert === 'missing') return yok;
      const oran = ss.linkedRatio;
