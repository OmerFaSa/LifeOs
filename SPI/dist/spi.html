                          : 'Sınırın altında.');
      }
      if(d.estimatePct >= 50) lines.push('Hesabın %' + d.estimatePct + '\'i hâlâ tahmin fiyatıyla; kendi fişini gir.');
      if(d.coverageGaps.length){
        lines.push('Sepet ' + d.coverageGaps[0].nutrient + ' ihtiyacının yalnızca %'
          + d.coverageGaps[0].pct + '\'ini karşılıyor.');
      }
      if(d.swaps.length){
        const s = d.swaps[0];
        lines.push(s.from + ' yerine ' + s.to + ': haftada ' + U.fmtNum(Math.round(s.saveTotal))
          + ' TL tasarruf, ' + s.keeps.join(' ve ') + ' korunur'
          + (s.loses.length ? ', ' + s.loses.join(' ve ') + ' düşer' : '') + '.');
      }
      return lines.join(' ');
    }

    /* patron */
    lines.push(d.headline);
    if(d.next && !d.next.calm){
      lines.push('Sıradaki hamle: ' + d.next.title + '. ' + d.next.why);
    }
    if(d.cross.length) lines.push(d.cross[0].text);
    lines.push('Asgari gün ' + d.minimum.done + '/' + d.minimum.total
      + ', seri ' + d.streak + ' gün.');
    if(d.openDecisions.length) lines.push(d.openDecisions.length + ' karar takipte.');
    return lines.join(' ');
  }

  /* ------------------------------------------------------------- denetim

     Model ciktisi ev kurallarina karsi denetlenir. Ihlal varsa cikti
     BASILMAZ; yerine kural motorunun cumlesi gecer. */
  function validate(text){
    const s = String(text || '');
    const hits = SP.GROUNDING.banned.filter(b => b.re.test(s));
    return {
      ok:hits.length === 0,
      violations:hits.map(h => ({ id:h.id, why:h.why })),
      note:hits.length ? hits.map(h => h.why).join(', ') + ' tespit edildi.' : '',
    };
  }

  /* --------------------------------------------------------------- model */

  function systemPrompt(agentId, b){
    const a = SP.AGENT_BY_ID[agentId] || SP.AGENT_BY_ID.patron;
    return [
      'Sen ' + a.name + ' adında bir sağlık asistanı ajanısın. Rolün: ' + a.role + '.',
      'Alanın: ' + a.scope,
      'Alanın DIŞI: ' + a.notScope + ' Alan dışı bir soru gelirse kısaca ilgili uzmana yönlendir.',
      '',
      'KURALLAR (bunlar tartışılmaz):',
      '1. Sayı üretme. Bütün sayılar aşağıdaki brifingden gelir. Brifingde olmayan bir sayıyı yazma.',
      '2. Teşhis koyma. İlaç ya da doz önerme. Tedaviyi bırakmayı önerme. Sonuç garantisi verme.',
      '3. ' + SP.CLINICAL.disclaimer,
      '4. Türkçe yaz. Kısa cümle kur. En fazla 4 cümle.',
      '5. Bilmediğin bir şey sorulursa "bu benim alanımda değil" ya da "bu veri girilmemiş" de.',
      '',
      'BRİFİNG (JSON, kural motorundan geldi):',
      JSON.stringify(b),
    ].join('\n');
  }

  /* Ajan yaniti. Model yoksa ya da cagri basarisiz olursa kural motorunun
     cumlesi doner — ofis hicbir kosulda sessiz kalmaz. */
  async function ask(agentId, question, opts){
    const o = opts || {};
    const b = o.brief || brief(agentId);
    const fallback = { text:ruleText(agentId, b), source:'rules', brief:b };

    const cfg = cfgFor(agentId);
    if(!SP.LLM.ready(cfg)) return fallback;

    try{
      const res = await SP.LLM.chat(cfg, {
        system:systemPrompt(agentId, b),
        messages:[{ role:'user', text:question || 'Durumu özetle.' }],
        temperature:settings().temperature,
        maxTokens:o.maxTokens || 600,
      });
      const check = validate(res.text);
      if(!check.ok){
        return { text:fallback.text, source:'rules', brief:b,
          blocked:check, note:'Model çıktısı ev kurallarına takıldı: ' + check.note };
      }
      return { text:res.text.trim(), source:'model', brief:b, model:cfg.model };
    }catch(e){
      return Object.assign({}, fallback, {
        error:SP.LLM.errorText ? SP.LLM.errorText(e) : String(e && e.message || e) });
    }
  }

  /* ---------------------------------------------------------- masa notlari

     Not bir tavsiye degil BULGU'dur: kosul saglandiginda kendiliginden
     birakilir, kosul gectiginde kendiliginden kalkar. Kullanici silmez. */
  function notes(){
    const out = [];
    const add = (agent, kind, text) => {
      const k = SP.NOTE_KINDS.find(x => x.id === kind) || SP.NOTE_KINDS[4];
      const a = SP.AGENT_BY_ID[agent];
      out.push({ agent, name:a ? a.name : agent, kind, tone:k.tone, label:k.label, text });
    };

    SP.Model.openFlags().forEach(f => add('lab', 'flag', f.label + ' — ' + f.detail));
    /* Panel adi zaten "Demir paneli" gibi olabilir; "paneli" iki kez yazilmaz. */
    SP.Bio.overdue().forEach(o => {
      const name = o.panel.name;
      const label = /paneli$/i.test(name) ? name : name + ' paneli';
      add('lab', 'gap', label + ' ' + o.note.toLocaleLowerCase('tr-TR'));
    });

    const g = SP.Nutri.gaps(7);
    if(g.ok) g.rows.slice(0, 2).forEach(r => {
      add('nutri', 'gap', (r.nutrient ? r.nutrient.name : r.id) + ' son 7 günde hedefin %' + r.pct + '\'inde.');
    });
    const today = SP.Nutri.dayTotals(U.todayISO());
    today.notes.filter(n => n.kind === 'block').slice(0, 1).forEach(n => add('nutri', 'info', n.text));

    const rx = SP.Move.prescription();
    if(rx.acwr.ok && rx.acwr.zone === 'high') add('move', 'debt', rx.acwr.note);
    if(rx.deload.due) add('move', 'info', rx.deload.week + '. hafta — yük indirme haftası.');
    SP.EXERCISES.forEach(e => {
      const p = SP.Move.progressionCheck(e.id);
      if(p.ok && p.ready) add('move', 'win', p.exercise.name + ': üst basamak açık (' + p.next.name + ').');
    });

    const m = SP.Money.status();
    if(m.basket.over) add('money', 'debt', m.text);
    if(m.stale && m.basket.rows.length) add('money', 'info',
      'Sepetin %' + m.basket.estimate.pct + '\'i tahmin fiyatıyla hesaplandı.');
    SP.Money.swapOpportunities().slice(0, 1).forEach(s => add('money', 'win',
      s.from.name + ' yerine ' + s.to.name + ': haftada ' + U.fmtNum(Math.round(s.saveTotal)) + ' TL.'));

    const streak = SP.Calc.streak();
    if(streak >= 7) add('patron', 'win', 'Asgari gün serisi ' + streak + ' gün.');
    SP.Model.openDecisions().forEach(d => {
      const age = U.diffDays(d.at.slice(0, 10), U.todayISO());
      if(age >= 2) add('patron', 'debt', 'Karar ' + age + ' gündür açık: ' + d.title);
    });

    return out;
  }

  /* -------------------------------------------------------------- gundem

     Puanlama kural motorundan gelir; model gundem secmez. */
  function agendaCandidates(){
    const out = [];
    const push = (kindId, detail, extra) => {
      const k = SP.AGENDA_KINDS.find(x => x.id === kindId);
      if(!k) return;
      out.push(Object.assign({ id:kindId, label:k.label, owner:k.owner,
        score:k.weight, note:k.note, detail }, extra || {}));
    };

    SP.Model.openFlags().forEach(f => push('red-flag', f.label + ' — ' + f.detail));
    SP.Bio.attention().filter(a => a.verdict.tone === 'warn').slice(0, 2)
      .forEach(a => push('lab-trend', a.marker.name + ': ' + a.verdict.text));
    const g = SP.Nutri.gaps(14);
    if(g.ok) g.rows.filter(r => r.pct < 80).slice(0, 2)
      .forEach(r => push('nutri-gap', (r.nutrient ? r.nutrient.name : r.id) + ' hedefin %' + r.pct + '\'inde'));
    const a = SP.Move.acwr();
    if(a.ok && a.zone === 'high') push('overreach', 'Oran ' + U.fmtNet(a.ratio) + '. ' + a.note);
    const rec = [];
    for(let i = 0; i < 5; i++){
      const r = SP.Move.readiness(U.iso(U.addDays(U.today(), -i)));
      if(r.ok) rec.push(r.score);
    }
    if(rec.length >= 3 && U.sum(rec) / rec.length < 55){
      push('recovery-debt', 'Son ' + rec.length + ' günün toparlanma ortalaması '
        + Math.round(U.sum(rec) / rec.length) + '.');
    }
    const m = SP.Money.status();
    if(m.basket.over) push('budget-over', m.text);
    if(m.stale && m.basket.rows.length) push('price-stale',
      'Sepetin %' + m.basket.estimate.pct + '\'i tahmin fiyatıyla.');
    if(!out.length) push('goal-review', 'Açık bir sorun yok; hedefler gözden geçirilebilir.');

    return out.sort((x, y) => y.score - x.score);
  }

  /* -------------------------------------------------------- gunluk brifing

     Gunde tek model cagrisi. Sonuc gune yazilir; ayni gun tekrar cagrilmaz. */
  async function dailyBriefing(force){
    const d = U.todayISO();
    if(!force && SP.S.officeBriefings[d]) return SP.S.officeBriefings[d];

    const b = patronBrief();
    const res = await ask('patron',
      'Bugünün durumunu dört masadan gelen rapora göre özetle. Çelişki varsa hangi kuralın '
      + 'öncelikli olduğunu söyle. En fazla dört cümle.', { brief:b });

    const rec = { date:d, text:res.text, source:res.source, at:new Date().toISOString(),
      headline:b.headline, next:b.next };
    SP.S.officeBriefings[d] = rec;
    await SP.Store.set('briefings/' + d, rec);
    return rec;
  }

  /* ------------------------------------------------------------- toplanti

     Gundem secilir, dort uzman sirayla konusur, Patron kapatir. Her tur
     ayri bir model cagrisidir; model yoksa hepsi kural motoru cumlesidir. */
  async function runMeeting(agendaId, onTurn){
    const agenda = agendaCandidates().find(a => a.id === agendaId) || agendaCandidates()[0];
    const turns = [];
    const order = ['lab', 'nutri', 'move', 'money'];

    for(const id of order){
      const b = brief(id);
      const res = await ask(id,
        'Gündem: ' + agenda.label + ' — ' + agenda.detail + '\n'
        + 'Kendi alanından bu gündeme ne söylüyorsun? Alanın dışına çıkma. En fazla 3 cümle.',
        { brief:b, maxTokens:400 });
      const turn = { agent:id, name:SP.AGENT_BY_ID[id].name, text:res.text, source:res.source };
      turns.push(turn);
      if(onTurn) onTurn(turn);
    }

    const pb = patronBrief();
    const closing = await ask('patron',
      'Gündem: ' + agenda.label + '\n'
      + 'Uzmanların söyledikleri:\n'
      + turns.map(t => '- ' + t.name + ': ' + t.text).join('\n') + '\n\n'
      + 'Çelişki varsa öncelik sırasına göre çöz (kırmızı bayrak > güvenlik > laboratuvar > '
      + 'beslenme > antrenman > bütçe) ve TEK bir karar yaz. Kararı gerekçelendir.',
      { brief:pb, maxTokens:500 });

    const rec = {
      id:U.uid('mt'), at:new Date().toISOString(), date:U.todayISO(),
      agenda:{ id:agenda.id, label:agenda.label, detail:agenda.detail },
      turns, closing:closing.text, source:closing.source,
      decision:SP.Calc.nextAction(),
    };
    SP.S.officeMeetings.unshift(rec);
    await SP.Store.set('meetings/' + rec.id, rec);
    return rec;
  }

  /* ----------------------------------------------------------------- sohbet */

  async function send(agentId, text){
    const list = SP.S.officeChats[agentId] || (SP.S.officeChats[agentId] = []);
    list.push({ role:'user', text, at:new Date().toISOString() });
    const res = await ask(agentId, text);
    list.push({ role:'agent', text:res.text, source:res.source, at:new Date().toISOString(),
      blocked:res.blocked || null, error:res.error || null });
    await SP.Store.set('chats/' + agentId, { agentId, messages:list });
    return res;
  }

  async function clearChat(agentId){
    SP.S.officeChats[agentId] = [];
    await SP.Store.set('chats/' + agentId, { agentId, messages:[] });
  }

  /* ----------------------------------------------------------------- acilis */

  async function load(){
    SP.S.office = Object.assign(defaults(), await SP.Store.get('office'));
    SP.S.officeChats = {};
    ((await SP.Store.list('chats')) || []).forEach(row => {
      SP.S.officeChats[row.agentId || row.id] = row.messages || [];
    });
    SP.S.officeMeetings = ((await SP.Store.list('meetings')) || [])
      .sort((a, b) => (a.at || '') < (b.at || '') ? 1 : -1);
    SP.S.officeBriefings = {};
    ((await SP.Store.list('briefings')) || []).forEach(row => {
      SP.S.officeBriefings[row.date || row.id] = row;
    });
    return SP.S.office;
  }

  return {
    defaults, settings, saveSettings, cfgFor, ready,
    brief, labBrief, nutriBrief, moveBrief, moneyBrief, patronBrief,
    ruleText, systemPrompt, validate, ask,
    notes, agendaCandidates, dailyBriefing, runMeeting,
    send, clearChat, load,
  };
})();

/* ==== js/core/palette.js ==== */
/* Komut paleti — Ctrl+K.

   Her ekran, her hızlı eylem ve her ölçüm tek bir aramadan ulaşılır olsun
   diye vardır. Fare ile gezinmek zorunda kalmadan sistemin herhangi bir
   yerine gitmek, günlük kullanımın sürtünmesini belirgin düşürür. */

window.SP = window.SP || {};

SP.Palette = (function(){
  const U = SP.U;

  let open = false;
  let query = '';
  let index = 0;

  function commands(){
    const out = [];

    /* ekranlar */
    (SP.App ? SP.App.SECTIONS : []).forEach(sec => {
      sec.views.forEach(v => {
        out.push({ id:'go:' + v.route, kind:'Sayfa', label:v.label, hint:sec.label,
          run:() => SP.App.go(v.route) });
      });
    });

    /* hizli eylemler */
    out.push({ id:'act:paste', kind:'Eylem', label:'Tahlil raporu yapıştır',
      hint:'Modül 1', run:() => { SP.App.go('labs'); setTimeout(() => {
        const fn = SP.Screens.labs.handle['open-paste']; if(fn) fn({ dataset:{} }); }, 120); } });
    out.push({ id:'act:meal', kind:'Eylem', label:'Öğün ekle',
      hint:'Modül 2', run:() => { SP.App.go('meals'); setTimeout(() => {
        const el = document.getElementById('meal-text'); if(el) el.focus(); }, 160); } });
    out.push({ id:'act:vitals', kind:'Eylem', label:'Günün ölçümünü gir',
      hint:'Toparlanma', run:() => SP.App.go('today') });
    out.push({ id:'act:session', kind:'Eylem', label:'Antrenman seansı ekle',
      hint:'Modül 3', run:() => { SP.App.go('move'); setTimeout(() => {
        const fn = SP.Screens.move.handle['start-session'];
        if(fn) fn({ dataset:{ id:'' } }); }, 120); } });
    out.push({ id:'act:meeting', kind:'Eylem', label:'Ofis toplantısı başlat',
      hint:'Ofis', run:() => SP.App.go('meeting') });
    out.push({ id:'act:backup', kind:'Eylem', label:'Yedek indir',
      hint:'Veri', run:() => { SP.App.go('guide'); SP.S.ui.guideTab = 'veri'; } });

    /* olcumler — dogrudan egilim ekranina goturur */
    SP.BIOMARKERS.forEach(b => {
      out.push({ id:'bio:' + b.id, kind:'Ölçüm', label:b.name, hint:b.unit,
        run:() => { SP.S.ui.trendMarker = b.id; SP.S.ui.labTab = 'trend'; SP.App.go('labs'); } });
    });

    /* ajanlar */
    SP.AGENTS.forEach(a => {
      out.push({ id:'agent:' + a.id, kind:'Ajan', label:a.name + ' — ' + a.role,
        hint:a.title, run:() => { SP.S.ui.officeAgent = a.id; SP.App.go('team'); } });
    });

    return out;
  }

  function iconFor(kind){
    return ({ 'Ekran':'layers', 'Eylem':'zap', 'Ölçüm':'flask', 'Ajan':'users' })[kind] || 'list';
  }

  function filtered(){
    const q = U.norm(query);
    const all = commands();
    if(!q) return all.slice(0, 30);
    return all.filter(c => U.norm(c.label + ' ' + c.kind + ' ' + (c.hint || '')).indexOf(q) >= 0)
      .slice(0, 30);
  }

  function draw(){
    const root = document.getElementById('overlay-root');
    let el = document.getElementById('cmdk');
    if(!el){
      el = document.createElement('div');
      el.className = 'cmdk';
      el.id = 'cmdk';
      el.addEventListener('mousedown', e => { if(e.target === el) close(); });
      root.appendChild(el);
    }
    const rows = filtered();
    index = Math.max(0, Math.min(index, rows.length - 1));

    el.innerHTML = '<div class="cmdk__box" role="dialog" aria-modal="true" aria-label="Komut paleti">'
      + '<input class="cmdk__input" id="cmdk-input" placeholder="Ara: ferritin, öğün, toplantı…" '
      + 'value="' + U.esc(query) + '" aria-label="Komut ara"/>'
      + '<div class="cmdk__list" role="listbox">'
      + (rows.length ? rows.map((c, i) =>
          '<button class="cmdk__item' + (i === index ? ' is-active' : '') + '" role="option"'
          + ' aria-selected="' + (i === index ? 'true' : 'false') + '"'
          + ' data-act="cmdk-run" data-id="' + U.esc(c.id) + '">'
          + SP.UI.icon(iconFor(c.kind))
          + '<span class="cmdk__text"><span class="cmdk__label">' + U.esc(c.label) + '</span>'
          + '<span class="cmdk__sub">' + U.esc(c.kind) + '</span></span>'
          + '<span class="cmdk__hintrow">' + U.esc(c.hint || '') + '</span></button>').join('')
        : '<p class="cmdk__empty">Eşleşen komut yok.</p>')
      + '</div>'
      + '<div class="cmdk__foot"><span>↑↓ gez · Enter aç · Esc kapat</span></div>'
      + '</div>';

    const input = document.getElementById('cmdk-input');
    if(input){
      input.oninput = e => { query = e.target.value; index = 0; draw(); };
      input.onkeydown = e => {
        const list = filtered();
        if(e.key === 'ArrowDown'){ e.preventDefault(); index = Math.min(index + 1, list.length - 1); draw(); }
        else if(e.key === 'ArrowUp'){ e.preventDefault(); index = Math.max(index - 1, 0); draw(); }
        else if(e.key === 'Enter'){ e.preventDefault(); run(list[index]); }
      };
      input.focus();
      /* imleci sona al */
      try{ input.setSelectionRange(query.length, query.length); }catch(err){}
    }
  }

  function run(cmd){
    if(!cmd) return;
    close();
    try{ cmd.run(); }catch(e){ console.error('Komut hatası:', e); }
  }

  function openPalette(){
    open = true;
    query = '';
    index = 0;
    draw();
  }

  function close(){
    open = false;
    const el = document.getElementById('cmdk');
    if(el) el.remove();
  }

  function isOpen(){ return open; }

  function runById(id){
    run(commands().find(c => c.id === id));
  }

  function showShortcuts(){
    SP.UI.sheet({
      title:'Klavye kısayolları',
      body:String(SP.C.Table({ tight:true, headers:['Tuş', 'İş'], rows:[
        ['Ctrl / ⌘ + K', 'Komut paletini aç'],
        ['?', 'Bu listeyi aç'],
        ['Esc', 'Sırayla: palet → ipucu → alt sayfa → kenar çubuğu'],
        ['↑ ↓', 'Palette gez'],
        ['Enter', 'Seçili komutu çalıştır'],
      ] })),
      footer:String(SP.C.Button({ label:'Kapat', act:'sheet-close' })),
      noFocus:true,
    });
  }

  return { open:openPalette, close, isOpen, runById, showShortcuts, commands };
})();

/* ==== js/core/setup.js ==== */
/* Kurulum — ilk açılışta sorulan en az soru.

   Yalnızca hesabın yapılabilmesi için gereken beş alan sorulur: ad, doğum
   yılı, cinsiyet, boy, kilo. Geri kalan her şey (hedef, hane, sepet)
   sonradan doldurulur ve olmadan da sistem çalışır.

   Sihirbaz atlanabilir. Atlandığında ekranlar boş kalmaz; "profil eksik"
   diyen ve nereye gidileceğini söyleyen kartlar görünür. */

window.SP = window.SP || {};

SP.Setup = (function(){
  const U = SP.U;
  const K = SP.C;
  const { html } = SP.h;

  /* Profilde hesap icin gereken alanlar eksikse sihirbaz gerekir. */
  function needed(){
    const p = SP.S.profile;
    if(!p) return true;
    return !p.name || !p.birthYear || !p.heightCm || !p.weightKg;
  }

  function open(){
    const p = SP.S.profile || {};
    SP.UI.sheet({
      title:'SPİ — ilk kurulum',
      subtitle:'Beş alan yeter; gerisi sonra',
      wide:true,
      body:String(K.Stack([
        K.Notice({ tone:'info', body:'Bu beş alan olmadan kalori ve protein hedefi hesaplanmaz. '
          + 'Sistem eksik veriyi tahmin etmez, boş bırakır ve nedenini söyler.' }),
        html`<div class="grid-form">
          ${K.Field({ label:'Ad', input:K.Input({ id:'su-name', value:p.name || '',
            placeholder:'Sana nasıl seslenelim?' }) })}
          ${K.Field({ label:'Doğum yılı', input:K.Input({ id:'su-birth', type:'number',
            numeric:true, min:1900, max:2026, value:p.birthYear || '' }) })}
          ${K.Field({ label:'Cinsiyet', input:K.Select({ id:'su-sex', value:p.sex || 'male',
            options:[{ value:'male', label:'Erkek' }, { value:'female', label:'Kadın' }] }) })}
          ${K.Field({ label:'Boy (cm)', input:K.Input({ id:'su-height', type:'number',
            numeric:true, min:80, max:230, value:p.heightCm || '' }) })}
          ${K.Field({ label:'Kilo (kg)', input:K.Input({ id:'su-weight', type:'number',
            numeric:true, step:'0.1', min:20, max:250, value:p.weightKg || '' }) })}
          ${K.Field({ label:'Hareket düzeyi', input:K.Select({ id:'su-activity',
            value:p.activity || 'moderate',
            options:SP.ACTIVITY_LEVELS.map(a => ({ value:a.id, label:a.label })) }) })}
          ${K.Field({ label:'Hedef', input:K.Select({ id:'su-goal', value:p.goal || 'health',
            options:SP.GOALS.map(g => ({ value:g.id, label:g.label })) }) })}
        </div>`,
        K.Notice({ tone:'warn', title:'Sınır:', body:SP.CLINICAL.disclaimer }),
      ])),
      footer:String(html`${K.Button({ label:'Şimdilik atla', act:'setup-skip' })}
        ${K.Button({ label:'Başla', tone:'primary', act:'setup-save' })}`),
    });
  }

  async function save(){
    const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
    const numOr = v => v === '' ? null : Number(String(v).replace(',', '.'));

    const patch = {
      name:get('su-name'),
      birthYear:numOr(get('su-birth')),
      sex:get('su-sex') || 'male',
      heightCm:numOr(get('su-height')),
      weightKg:numOr(get('su-weight')),
      activity:get('su-activity') || 'moderate',
      goal:get('su-goal') || 'health',
    };

    const missing = [];
    if(!patch.name) missing.push('ad');
    if(!patch.birthYear) missing.push('doğum yılı');
    if(!patch.heightCm) missing.push('boy');
    if(!patch.weightKg) missing.push('kilo');
    if(missing.length){
      SP.UI.toast('Eksik: ' + missing.join(', '));
      return false;
    }

    await SP.Model.saveProfile(patch);
    await SP.Model.saveVitals(U.todayISO(), { weight:patch.weightKg });
    SP.UI.closeSheet();
    SP.UI.toast('Hazır — hedefler hesaplandı');
    SP.App.render();
    return true;
  }

  function skip(){
    SP.UI.closeSheet();
    SP.UI.toast('Atlandı — Hane ekranından istediğin zaman doldurabilirsin');
  }

  return { needed, open, save, skip };
})();

/* ==== js/screens/today.js ==== */
/* Günlük — sistemin ilk ve tek günlük sayfası.

   Önceden iki ayrı ekran vardı: "Bugün" (özet) ve "Günlük ölçüm" (giriş).
   İkisi de aynı günü anlatıyordu ve kullanıcı hangisine gireceğini
   düşünmek zorunda kalıyordu. Şimdi tek sayfa, üç sekme:

     Giriş    günün verisi buraya yazılır — sayfanın VARSAYILANI budur
     Özet     yazılanın karşılığı: toparlanma, beslenme, asgari gün, bütçe
     Geçmiş   son iki hafta ve kişisel taban çizgi

   Giriş önce gelir çünkü bu sayfaya girmenin sebebi çoğu zaman okumak
   değil YAZMAKtır. Özet, yazılanın sonucudur; sonuç girdiden önce
   gelmez.

   Hiçbir alan zorunlu değildir: eksik girdi sıfır sayılmaz, ağırlığı
   kalan girdilere dağıtılır. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.today = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  function shownDate(){ return S.ui.mealDate || U.todayISO(); }

  /* Girilecek alanlar tek yerde tanimlanir; form da, kaydetme de bunu okur. */
  const FIELDS = [
    { id:'sleep',    label:'Uyku (saat)',        step:'0.5', min:0,  max:16,  marker:'sleep' },
    { id:'rhr',      label:'İstirahat nabzı',    step:'1',   min:30, max:140, marker:'rhr' },
    { id:'hrv',      label:'HRV (ms)',           step:'1',   min:5,  max:250, marker:'hrv' },
    { id:'sbp',      label:'Büyük tansiyon',     step:'1',   min:60, max:250, marker:'sbp' },
    { id:'dbp',      label:'Küçük tansiyon',     step:'1',   min:30, max:160, marker:'dbp' },
    { id:'spo2',     label:'Oksijen (%)',        step:'1',   min:70, max:100, marker:'spo2' },
    { id:'temp',     label:'Ateş (°C)',          step:'0.1', min:33, max:43,  marker:'temp' },
    { id:'weight',   label:'Kilo (kg)',          step:'0.1', min:20, max:250, marker:'weight' },
    { id:'waist',    label:'Bel çevresi (cm)',   step:'0.5', min:40, max:200, marker:'waist' },
    { id:'bodyfat',  label:'Yağ oranı (%)',      step:'0.1', min:3,  max:60,  marker:'bodyfat' },
    { id:'water',    label:'Su (ml)',            step:'100', min:0,  max:8000, marker:null },
  ];

  const SORENESS = [
    { value:1, label:'1 · bitkin' }, { value:2, label:'2 · yorgun' },
    { value:3, label:'3 · normal' }, { value:4, label:'4 · iyi' },
    { value:5, label:'5 · zinde' },
  ];

  function formEntry(){
    const d = shownDate();
    const v = M.vitalsOf(d) || M.defaultVitals(d);
    return K.Entry({
      label:'Günün ölçümü',
      meta:U.fmtDate(d),
      note:'Boş bıraktığın alan sıfır sayılmaz — hesaba hiç girmez. Uyku '
        + 'süresini yazman bile anlamlı bir sonuç üretir.',
      action:html`${K.Segmented({ act:'shift-day', value:'', aria:'Gün değiştir', items:[
          { value:'-1', label:'‹' }, { value:'0', label:'bugün' }, { value:'1', label:'›' },
        ] })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-vitals' })}`,
      body:html`
        <div class="grid-form">${map(FIELDS, f => K.Field({
          label:f.label,
          input:K.Input({ id:'v-' + f.id, type:'number', numeric:true, step:f.step,
            min:f.min, max:f.max, value:v[f.id] == null ? '' : v[f.id] }),
        }))}</div>
        ${K.Field({ label:'Bugün nasıl hissediyorsun?',
          hint:'cihazın göremediği tek girdi',
          input:K.Segmented({ act:'set-soreness', value:v.soreness == null ? '' : String(v.soreness),
            items:SORENESS, block:true, aria:'Günün hissi' }) })}
        ${K.Field({ label:'Not',
          input:html`<div class="withmic">
            ${K.Textarea({ id:'v-note', rows:2, value:v.note || '',
              placeholder:'Hastalık, ilaç değişikliği, olağandışı bir gün…' })}
            ${K.Mic({ target:'v-note' })}
          </div>` })}`,
    });
  }

  function quickEntry(){
    return K.Entry({
      label:'Öğün ekle', hint:'portion',
      meta:'tek satır, tek Enter',
      note:'Ev ölçüsünden gelen gramaj «tahmin» olarak işaretlenir. '
        + 'Tarttıysan «150 g tavuk» yaz, «ölçüldü» olur.',
      action:K.Button({ label:'Bütün öğünler', act:'go', data:{ 'data-route':'meals' } }),
      body:html`
        <div class="quick">
          ${K.Mic({ target:'quick-meal' })}
          ${K.Input({ id:'quick-meal', placeholder:'1 tabak etli kuru fasulye, 1 bardak ayran',
            aria:'Öğün metni' })}
          ${K.Button({ label:'Öğüne ekle', tone:'primary', act:'quick-meal' })}
        </div>`,
    });
  }

  function statusEntry(){
    const d = shownDate();
    const v = M.vitalsOf(d);
    if(!v) return '';
    const rows = FIELDS.filter(f => f.marker && v[f.id] != null).map(f => {
      const b = SP.BIO_BY_ID[f.marker];
      const r = SP.Bio.refFor(f.marker);
      return { marker:b, value:v[f.id], at:d, cert:'measured',
        status:SP.Bio.statusOf(f.marker, v[f.id]), ref:r.ref, optimal:r.optimal };
    });
    if(!rows.length) return '';
    return K.Entry({
      label:'Girilen değerler', hint:'ref-range',
      meta:rows.length + ' ölçüm',
      note:'Referans aralığı laboratuvarın normal saydığı yer; hedef bandı '
        + 'bu sistemin istediği daha dar yer.',
      body:html`${map(rows, r => P.markerRow(r, {}))}`,
    });
  }

  function whyEntry(){
    return K.Entry({
      label:'Neden bunlar?',
      meta:'toparlanmanın girdileri',
      body:html`<ul class="bullets small muted">
        ${map(SP.READINESS_INPUTS, i => html`<li><b>${i.label}</b> — ${i.note}</li>`)}
      </ul>`,
    });
  }

  function baselineEntry(){
    const rows = [['hrv', 'HRV'], ['rhr', 'İstirahat nabzı'], ['sleep', 'Uyku'], ['weight', 'Kilo']]
      .map(([key, label]) => {
        const b = SP.Move.baseline(key);
        return [label, b ? html`<b class="num">${U.fmtNet(b.mean)}</b>` : html`<span class="dim">—</span>`,
          b ? b.n + ' gün' : 'en az 3 gün gerekir'];
      });
    return K.Entry({
      label:'Taban çizgin',
      meta:'son 30 gün, bugün hariç',
      note:'HRV ve nabız mutlak değil kişisel ölçektir: kendi ortalamana göre '
        + 'okunur, başkasınınkiyle karşılaştırılmaz.',
      body:K.Table({ tight:true, headers:['Ölçüm', { label:'Ortalama', num:true }, 'Kapsam'], rows }),
    });
  }

  function historyEntry(){
    const days = [];
    for(let i = 13; i >= 0; i--) days.push(U.iso(U.addDays(U.today(), -i)));
    const rows = days.filter(d => S.vitals[d]).reverse().map(d => {
      const v = S.vitals[d];
      const r = SP.Move.readiness(d);
      return [
        html`<button class="linkbtn" data-act="open-day" data-date="${d}">${U.fmtShort(d)}</button>`,
        v.sleep == null ? '—' : U.fmtNet(v.sleep),
        v.rhr == null ? '—' : U.fmtNum(v.rhr),
        v.hrv == null ? '—' : U.fmtNum(v.hrv),
        r.ok ? K.Badge({ label:String(r.score), tone:r.band.tone }) : html`<span class="dim">—</span>`,
      ];
    });
    if(!rows.length){
      return K.Entry({ label:'Son iki hafta', meta:'kayıt yok',
        body:P.empty('Bu aralıkta ölçüm girilmemiş.') });
    }
    return K.Entry({
      label:'Son iki hafta', meta:rows.length + ' gün',
      body:K.Table({ tight:true,
        headers:['Gün', { label:'Uyku', num:true }, { label:'Nabız', num:true },
          { label:'HRV', num:true }, 'Toparlanma'],
        rows }),
    });
  }

  /* ---------------------------------------------------------- kartlar */  /* ---------------------------------------------------------- kartlar */

  function minimumEntry(){
    const m = SP.Calc.minimumDay();
    const streak = SP.Calc.streak();
    return K.Entry({
      label:'Asgari gün', hint:'minimum-day',
      meta:m.done + ' / ' + m.total + ' · seri ' + streak + ' gün',
      note:m.note,
      body:html`<div class="mt-2">${map(m.rows, P.minRow)}</div>`,
    });
  }

  function readinessEntry(){
    const rx = SP.Move.prescription();
    const r = rx.readiness;
    if(!r.ok){
      return K.Entry({
        label:'Toparlanma', hint:'readiness', meta:'ölçüm bekliyor',
        note:r.note,
        action:K.Button({ label:'Veri gir', tone:'primary',
          act:'day-tab', data:{ 'data-tab':'giris' } }),
        body:P.empty('Bugünün ölçümü girilmedi.'),
      });
    }
    return K.Entry({
      label:'Toparlanma', hint:'readiness',
      meta:r.band.label,
      note:r.missing.length
        ? 'Girilmeyen: ' + r.missing.join(', ') + ' — ağırlığı kalanlara dağıtıldı.'
        : null,
      action:K.Button({ label:'Hareketi aç', act:'go', data:{ 'data-route':'move' } }),
      body:html`
        <div class="row wrap" style="gap:26px">
          ${raw(UI.gauge(r.score, { tone:r.band.tone, label:r.band.label, size:126,
            bands:SP.READINESS_BANDS.map(b => b.min).filter(x => x > 0) }))}
          <div class="grow" style="min-width:210px">${map(r.parts, p => html`
            <div class="${p.score == null ? 'readypart readypart--off' : 'readypart'}">
              <span class="readypart__label">${p.label}</span>
              <span class="small dim">${p.score == null ? 'girilmedi' : U.fmtNum(U.round(p.value, 1))}</span>
              <span class="readypart__score num">${p.score == null ? '—' : Math.round(p.score)}</span>
            </div>`)}</div>
        </div>
        ${K.Notice({ tone:r.band.tone === 'ok' ? 'ok' : r.band.tone, body:r.band.order })}`,
    });
  }

  function nutritionEntry(){
    const d = U.todayISO();
    const t = SP.Nutri.dayTotals(d);
    const tg = SP.Nutri.targets();

    if(!tg.ok){
      return K.Entry({
        label:'Beslenme', meta:'hedef yok',
        note:'Profilde ' + tg.missing.join(', ') + ' eksik. Bu üçü olmadan kalori ve '
          + 'protein hedefi tahmin edilmez.',
        action:K.Button({ label:'Profili tamamla', tone:'primary',
          act:'go', data:{ 'data-route':'family' } }),
        body:P.empty('Hedef hesaplanamıyor.'),
      });
    }
    if(t.empty){
      return K.Entry({
        label:'Beslenme', meta:'hedef ' + U.fmtNum(tg.kcal) + ' kcal',
        action:K.Button({ label:'Öğün ekle', tone:'primary',
          act:'go', data:{ 'data-route':'meals' } }),
        body:P.empty('Bugün hiç öğün girilmedi.'),
      });
    }
    return K.Entry({
      label:'Beslenme',
      meta:t.meals + ' öğün · ' + Math.round(t.kcal) + ' / ' + tg.kcal + ' kcal',
      action:K.Button({ label:'Öğünleri aç', act:'go', data:{ 'data-route':'meals' } }),
      body:html`
        ${raw(UI.macroSplit({ protein:t.protein * 4, fat:t.fat * 9, carb:t.carb * 4 }))}
        <div class="nutgrid">
          ${P.nutCell({ label:'Protein', got:t.protein, target:tg.protein.min, unit:'g' })}
          ${P.nutCell({ label:'Lif', got:t.fiber, target:tg.fiber, unit:'g' })}
          ${P.nutCell({ label:'Yağ', got:t.fat, target:tg.fat.min, unit:'g' })}
        </div>
        ${map(t.notes.slice(0, 1), P.absorbNote)}`,
    });
  }

  function officeEntry(){
    const d = U.todayISO();
    const b = S.officeBriefings[d];
    const notes = SP.Office.notes().slice(0, 3);
    return K.Entry({
      label:'Ofisten', hint:'office',
      meta:'beş ajan · günün notu',
      action:html`${K.Button({ label:'Ofisi aç', act:'go', data:{ 'data-route':'office' } })}
        ${K.Button({ label:'Tazele', act:'refresh-briefing' })}`,
      body:html`
        ${when(b, () => html`<p class="small">${b.text}</p>`)}
        ${when(!b, () => html`<p class="small dim">Günün brifingi henüz üretilmedi.</p>`)}
        ${when(notes.length, () => html`<div class="notes">${map(notes, n => html`
          <div class="note note--${n.tone}">
            ${P.avatar(n.agent, 'sm')}
            <div><b class="tiny">${n.name}</b> <span class="small">${n.text}</span></div>
          </div>`)}</div>`)}`,
    });
  }

  function moneyEntry(){
    const m = SP.Money.status();
    return K.Entry({
      label:'Bütçe', hint:'budget-rank',
      meta:m.tone === 'ok' ? 'uyumlu' : m.tone === 'muted' ? 'boş' : 'gözden geçir',
      action:K.Button({ label:'Finansı aç', act:'go', data:{ 'data-route':'basket' } }),
      body:html`<p class="small">${m.text}</p>
        ${when(m.basket.limit != null && m.basket.rows.length,
          () => K.Meter({ label:'Haftalık sınır', value:Math.min(100, m.basket.pct || 0),
            text:U.fmtNum(Math.round(m.basket.total)) + ' / ' + U.fmtNum(m.basket.limit) + ' TL',
            tone:m.basket.over ? 'danger' : '' }))}`,
    });
  }

  const TABS = [
    { id:'giris',  label:'Giriş',  icon:'pulse' },
    { id:'ozet',   label:'Özet',   icon:'today' },
    { id:'gecmis', label:'Geçmiş', icon:'clock' },
  ];

  function tabs(){
    const v = M.vitalsOf(shownDate());
    const n = v ? Object.keys(v).filter(k => v[k] != null && k !== 'date').length : 0;
    const items = TABS.map(t => Object.assign({}, t,
      t.id === 'giris' && n ? { count:n } : {}));
    return K.Subtabs({ items, value:S.ui.dayTab || 'giris', act:'day-tab',
      aria:'Günlük görünümü' });
  }

  async function render(){
    const tab = S.ui.dayTab || 'giris';
    const flags = M.openFlags();

    const head = html`
      ${when(flags.length, () => html`<div class="stack-sm mb-16">${map(flags, P.flagCard)}</div>`)}
      <div class="mb-8">${tabs()}</div>`;

    if(tab === 'ozet'){
      return String(html`${head}${K.Ledger([
        readinessEntry(), nutritionEntry(), minimumEntry(), officeEntry(), moneyEntry(),
      ])}
      <div class="mt-24">${raw(UI.rail(['next-action', 'minimum-day', 'readiness', 'certainty']))}</div>`);
    }

    if(tab === 'gecmis'){
      return String(html`${head}${K.Ledger([historyEntry(), baselineEntry()])}
      <div class="mt-24">${raw(UI.rail(['readiness', 'certainty']))}</div>`);
    }

    return String(html`${head}${K.Ledger([
      formEntry(), quickEntry(), statusEntry(), whyEntry(),
    ])}
    <div class="mt-24">${raw(UI.rail(['readiness', 'ref-range', 'certainty']))}</div>`);
  }

  const handle = {
    async 'day-tab'(el){ S.ui.dayTab = el.dataset.tab; SP.App.render(); },
    async 'shift-day'(el){
      const n = Number(el.dataset.value);
      S.ui.mealDate = n === 0 ? null : U.iso(U.addDays(U.parse(shownDate()), n));
      if(S.ui.mealDate === U.todayISO()) S.ui.mealDate = null;
      SP.App.render();
    },
    async 'open-day'(el){
      S.ui.mealDate = el.dataset.date === U.todayISO() ? null : el.dataset.date;
      SP.App.render();
    },
    async 'set-soreness'(el){
      await M.saveVitals(shownDate(), { soreness:Number(el.dataset.value) });
      SP.App.render();
    },
    async 'save-vitals'(){
      const patch = {};
      FIELDS.forEach(f => {
        const el = document.getElementById('v-' + f.id);
        if(!el) return;
        const raw = el.value.trim();
        patch[f.id] = raw === '' ? null : Number(raw.replace(',', '.'));
      });
      const note = document.getElementById('v-note');
      if(note) patch.note = note.value.trim();
      await M.saveVitals(shownDate(), patch);
      const flags = M.openFlags().filter(f => !f.ack);
      UI.toast(flags.length ? 'Kaydedildi — ' + flags.length + ' kırmızı bayrak açık' : 'Kaydedildi');
      SP.App.render();
    },
  
    async 'flag-ack'(el){
      await M.ackFlag(el.dataset.id);
      UI.toast('İşaretlendi — kayıt geçmişte duruyor');
      SP.App.render();
    },
    async 'refresh-briefing'(){
      UI.toast('Brifing üretiliyor…');
      await SP.Office.dailyBriefing(true);
      SP.App.render();
    },
    async 'quick-meal'(){
      const el = document.getElementById('quick-meal');
      if(!el || !el.value.trim()) return;
      const parsed = SP.Parse.parseMeal(el.value);
      if(!parsed.items.length){ UI.toast(parsed.note); return; }
      const slot = SP.Screens.meals.guessSlot();
      const meal = M.newMeal(slot);
      meal.items = parsed.items.map(i => ({ foodId:i.foodId, g:i.g, cert:i.cert, portion:i.portion }));
      meal.note = el.value.trim();
      await M.addMeal(U.todayISO(), meal);
      el.value = '';
      UI.toast(parsed.items.length + ' gıda eklendi'
        + (parsed.unmatched.length ? ' · ' + parsed.unmatched.length + ' parça eşleşmedi' : ''));
      SP.App.render();
    },
  };

  return {
    id:'today',
    title:'Günlük',
    /* Bu sayfanın başlığı BUGÜNÜ anlatır. Sıradaki hamle başka bir
       bölüme aitse (tahlil, sepet) onu buraya başlık yapmak kafa
       karıştırıyordu: kullanıcı günlük sayfasını açıp tahlil cümlesi
       okuyordu. Hamle artık düğme olarak duruyor, başlık olarak değil. */
    headline(){
      const d = shownDate();
      const r = SP.Move.readiness(d);
      if(!r.ok) return 'Bugünün verisi henüz girilmedi.';
      const m = SP.Calc.minimumDay();
      if(m.complete) return 'Bugün tamam — toparlanma '
        + r.band.label.toLocaleLowerCase('tr-TR') + '.';
      return 'Toparlanma ' + r.band.label.toLocaleLowerCase('tr-TR') + '.';
    },
    lede(){
      const d = shownDate();
      const r = SP.Move.readiness(d);
      if(!r.ok){
        return 'Uyku süresini yazman bile yeter: tek girdiyle anlamlı bir sonuç '
          + 'çıkar. Boş bıraktığın alan sıfır sayılmaz, hesaba hiç girmez.';
      }
      const m = SP.Calc.minimumDay();
      const eksik = m.rows.filter(x => !x.ok).map(x => x.label.toLocaleLowerCase('tr-TR'));
      return r.band.order
        + (eksik.length ? ' Asgari gün için kalan: ' + eksik.join(', ') + '.' : '');
    },
    stats(){
      const m = SP.Calc.minimumDay();
      const r = SP.Move.readiness(shownDate());
      const out = [];
      if(r.ok) out.push({ value:r.score, unit:'/100', label:'toparlanma' });
      out.push({ value:m.done + '/' + m.total, label:'asgari gün' });
      out.push({ value:SP.Calc.streak(), label:'gün seri' });
      const f = M.openFlags().filter(x => !x.ack).length;
      if(f) out.push({ value:f, label:'kırmızı bayrak' });
      return out.slice(0, 4);
    },
    subtitle(){
      const d = shownDate();
      const r = SP.Move.readiness(d);
      return U.fmtDate(d) + (r.ok ? ' · toparlanma ' + r.score : ' · veri bekliyor');
    },
    actions(){
      const n = SP.Calc.nextAction();
      return String(html`${K.Button({ label:'Veri gir', tone:'primary', size:'sm', icon:'pulse',
        act:'day-tab', data:{ 'data-tab':'giris' } })}
        ${when(!n.calm && n.route !== 'today', () => K.Button({ label:n.action || 'Aç',
          size:'sm', act:'go', data:{ 'data-route':n.route } }))}`);
    },
    render, handle,
  };
})();

/* ==== js/screens/labs.js ==== */
/* Testler — Modül 1'in ekranı.

   Önceki düzen ölçümleri ORGANA göre kutuluyordu: on iki panel, her biri
   açılır bir kutu, her kutunun içinde birkaç satır. Kullanıcı elinde tek
   bir hastane raporuyla gelir; o rapor organa göre değil, tek seferde
   çıkar. Panel panel gezinmek zorunda kalmak işi zorlaştırıyordu.

   Yeni düzen dört sayfadır:

     Sonuçlar  bütün ölçümler TEK düz listede, önem sırasına göre
     Test gir  kapsamlı bir hastane testinin tamamı tek formda
     Geçmiş    girilen test oturumları
     Eğilim    tek bir ölçümün kendi geçmişindeki yönü

   Panel artık bir yapı değil, bir SÜZGEÇtir: listeyi daraltır, listeyi
   bölmez. Girişte ise hiç yoktur — arama kutusu onun yerini alır. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.labs = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map, cls } = SP.h;
  const K = SP.C, P = SP.Parts;

  const TABS = [
    { id:'sonuc',  label:'Sonuçlar', icon:'layers' },
    { id:'giris',  label:'Test gir', icon:'flask' },
    { id:'gecmis', label:'Geçmiş',   icon:'clock' },
    { id:'trend',  label:'Eğilim',   icon:'chart' },
  ];

  /* Yapistirma onizlemesi oturum boyunca burada durur; kaydedilene kadar
     hicbir sey depoya yazilmaz. */
  let preview = null;

  /* Girise yazilan ama henuz kaydedilmemis degerler. Sekme degistirip
     geri donunce kaybolmasin diye ekranin disinda tutulur. */
  let draft = { date:U.todayISO(), lab:'', values:{} };

  function tabs(){
    const items = TABS.map(t => {
      if(t.id === 'gecmis' && S.labs.length) return Object.assign({}, t, { count:S.labs.length });
      const n = Object.keys(draft.values).length;
      if(t.id === 'giris' && n) return Object.assign({}, t, { count:n });
      return t;
    });
    return K.Subtabs({ items, value:S.ui.labTab, act:'lab-tab', aria:'Test görünümü' });
  }

  /* ------------------------------------------------------------ süzgeç */

  /* Ölçümü olan panel yoksa süzgeç çizilmez: boş bir süzgeç şeridi
     kullanıcıya seçenek değil, iş verir. */
  function panelFilter(){
    const counts = {};
    SP.BIOMARKERS.forEach(b => {
      if(!M.latestOf(b.id)) return;
      counts[b.panel] = (counts[b.panel] || 0) + 1;
    });
    const used = SP.PANELS.filter(p => counts[p.id]);
    if(used.length < 2) return '';

    const items = [{ id:'all', label:'Tümü', count:SP.Bio.summary().measured }]
      .concat(used.map(p => ({ id:p.id, label:p.name.replace(/\s*paneli$/i, ''), count:counts[p.id] })));
    return K.Subtabs({ items, value:S.ui.labFilter, act:'lab-filter', aria:'Panel süzgeci' });
  }

  /* ---------------------------------------------------------- sonuçlar */

  /* Tek düz liste. Sıra: kırmızı bayrak → referans dışı → hedef dışı →
     hedefte. İçinde arama yapılır, panele göre daraltılır. */
  function resultRows(){
    const q = (S.ui.labQuery || '').trim().toLocaleLowerCase('tr-TR');
    const filter = S.ui.labFilter || 'all';
    const rank = { danger:0, warn:1, info:2, ok:3, muted:4 };

    return SP.BIOMARKERS
      .map(b => {
        const last = M.latestOf(b.id);
        if(!last) return null;
        return { marker:b, value:last.v, at:last.date, cert:last.cert,
          status:SP.Bio.statusOf(b.id, last.v), ref:SP.Bio.refFor(b.id) };
      })
      .filter(Boolean)
      .filter(r => filter === 'all' || r.marker.panel === filter)
      .filter(r => !q || r.marker.name.toLocaleLowerCase('tr-TR').indexOf(q) >= 0
        || (r.marker.aliases || []).some(a => a.toLocaleLowerCase('tr-TR').indexOf(q) >= 0))
      .sort((a, b) => (rank[a.status.tone] ?? 9) - (rank[b.status.tone] ?? 9)
        || a.marker.name.localeCompare(b.marker.name, 'tr'));
  }

  function resultsView(){
    const rows = resultRows();
    const total = SP.Bio.summary().measured;

    if(!total){
      return K.Ledger([K.Entry({
        label:'Sonuçlar', meta:'kayıt yok',
        note:'Elindeki hastane raporunu yapıştır ya da dosyasını bırak; '
          + 'değerler kendiliğinden şemaya oturur.',
        action:K.Button({ label:'Rapor yapıştır', tone:'primary', act:'open-paste' }),
        body:P.empty('Henüz hiç test girilmedi.'),
      })]);
    }

    const missing = SP.BIOMARKERS.filter(b => !M.latestOf(b.id));
    const s = SP.Bio.summary();
    const last = S.labs.length ? S.labs[S.labs.length - 1] : null;

    return K.Ledger([
      K.Entry({
        label:'Sonuçlar',
        meta:total + ' ölçüm' + (last ? ' · ' + U.fmtDate(last.date) : ''),
        note:'Önem sırasına göre: önce bandın dışındakiler. Bir satıra '
          + 'tıklayınca referans aralığı, hedef bandı ve beslenme bağı açılır.',
        action:html`${K.Input({ id:'lab-q', value:S.ui.labQuery || '',
          placeholder:'Ölçüm ara…', aria:'Ölçüm ara', change:'lab-query', debounce:200 })}
          ${K.Button({ label:'Test gir', tone:'primary', act:'lab-tab',
            data:{ 'data-tab':'giris' } })}`,
        body:html`
          ${when(panelFilter(), () => raw(String(panelFilter())))}
          ${when(!rows.length, () => K.Notice({ tone:'info',
            body:'Bu süzgeçle eşleşen ölçüm yok.' }))}
          ${when(rows.length, () => html`<div class="reslist">${map(rows, r => {
            const tr = SP.Bio.trendOf(r.marker.id);
            return html`
              <button class="resrow" data-act="open-marker" data-id="${r.marker.id}">
                <span class="resrow__dot resrow__dot--${r.status.tone}" aria-hidden="true"></span>
                <span class="resrow__name">
                  <b>${r.marker.name}</b>
                  <span class="resrow__panel">${SP.PANEL_BY_ID[r.marker.panel]
                    ? SP.PANEL_BY_ID[r.marker.panel].name.replace(/\s*paneli$/i, '') : ''}</span>
                </span>
                <span class="resrow__val num">${U.fmtNum(r.value)}<small>${r.marker.unit}</small></span>
                <span class="resrow__bar">${when(r.ref,
                  () => raw(UI.rangeBar(r.value, r.ref.ref, r.ref.optimal, r.marker.unit, { bare:true })))}</span>
                <span class="resrow__status">${K.Badge({ label:r.status.label, tone:r.status.tone })}</span>
                <span class="resrow__trend tiny dim">${when(tr.ok,
                  () => html`${raw(UI.trend(tr.dir))}`)} ${r.at ? U.fmtShort(r.at) : ''}</span>
              </button>`;
          })}</div>`)}`,
      }),

      K.Entry({
        label:'Dağılım', meta:'durum sayımı',
        note:'Referans aralığı laboratuvarın normal saydığı yer; hedef bandı '
          + 'ise bu sistemin istediği daha dar yer. İkisi aynı şey değildir.',
        body:html`<div class="pair">
          <div>
            <div class="sidestat"><span class="sidestat__v">${s.measured}</span>
              <span class="sidestat__k">ölçüldü</span></div>
            <div class="sidestat"><span class="sidestat__v">${s.out}</span>
              <span class="sidestat__k">referans dışı</span></div>
          </div>
          <div>
            <div class="sidestat"><span class="sidestat__v">${s.offTarget}</span>
              <span class="sidestat__k">hedef dışı</span></div>
            <div class="sidestat"><span class="sidestat__v">${S.labs.length}</span>
              <span class="sidestat__k">test oturumu</span></div>
          </div>
        </div>`,
      }),

      when(missing.length, () => K.Entry({
        label:'Ölçülmemiş', meta:missing.length + ' ölçüm',
        note:'Bu ölçümler için hiç değer girilmedi. Eksik veri sıfır sayılmaz; '
          + 'hesaplarda yok kabul edilir.',
        body:html`<div class="chips">${map(missing, b => html`
          <span class="chip chip--muted">${b.name}</span>`)}</div>`,
      })),
    ]);
  }

  /* ---------------------------------------------------------- test gir

     Kapsamlı bir hastane testi tek formda girilir. Panel seçimi yoktur:
     rapor elinde nasıl duruyorsa öyle, yukarıdan aşağı yazılır. Arama
     kutusu uzun listeyi anında daraltır. */

  function entryView(){
    const q = (S.ui.labQuery || '').trim().toLocaleLowerCase('tr-TR');
    const list = SP.BIOMARKERS.filter(b => !SP.DERIVED[b.id]).filter(b => !q
      || b.name.toLocaleLowerCase('tr-TR').indexOf(q) >= 0
      || (b.aliases || []).some(a => a.toLocaleLowerCase('tr-TR').indexOf(q) >= 0));

    const filled = Object.keys(draft.values).length;

    return K.Ledger([
      K.Entry({
        label:'Oturum', meta:'tarih ve laboratuvar',
        note:'Aynı tarihe ikinci kez girilen değerler o oturumun üstüne yazılır.',
        action:K.Button({ label:'Rapor yapıştır', icon:'flask', tone:'primary',
          act:'open-paste' }),
        body:html`<div class="pair">
          ${K.Field({ label:'Test tarihi',
            input:K.Input({ id:'entry-date', type:'date', value:draft.date, change:'entry-date' }) })}
          ${K.Field({ label:'Laboratuvar', hint:'isteğe bağlı',
            input:K.Input({ id:'entry-lab', value:draft.lab, placeholder:'Hangi laboratuvar?',
              change:'entry-lab' }) })}
        </div>`,
      }),

      K.Entry({
        label:'Değerler', meta:list.length + ' satır',
        note:'Elindeki rapordaki bütün değerleri tek seferde yaz. Boş bıraktığın '
          + 'satır yok sayılır — sıfır olarak kaydedilmez.',
        action:K.Input({ id:'entry-q', value:S.ui.labQuery || '',
          placeholder:'Ölçüm ara…', change:'lab-query', debounce:200 }),
        body:html`
          ${when(!list.length, () => K.Notice({ tone:'info',
            body:'Bu adla bir ölçüm bulunamadı.' }))}
          <div class="entrygrid">${map(list, b => {
            const has = draft.values[b.id] != null;
            const lastv = M.latestOf(b.id);
            return html`
              <label class="${cls('entryrow', has && 'is-filled')}">
                <span class="entryrow__name">${b.name}
                  <span class="entryrow__unit">${b.unit}</span></span>
                <input class="entryrow__in num" type="number" step="any" inputmode="decimal"
                  id="e-${b.id}" data-change="entry-val" data-id="${b.id}"
                  value="${has ? draft.values[b.id] : ''}"
                  placeholder="${lastv ? U.fmtNum(lastv.v) : '—'}"
                  aria-label="${b.name + ' (' + b.unit + ')'}"/>
              </label>`;
          })}</div>
          <div class="entrybar">
            <span class="small">${filled ? filled + ' değer yazıldı' : 'Henüz değer yazılmadı'}
              ${when(filled, () => html`<span class="dim"> · kaydedilene kadar hiçbir şey yazılmaz</span>`)}</span>
            <span class="row-sm">
              ${when(filled, () => K.Button({ label:'Temizle', size:'sm', act:'entry-clear' }))}
              ${K.Button({ label:'Testi kaydet', tone:'primary', act:'entry-save', disabled:!filled })}
            </span>
          </div>`,
      }),
    ]);
  }

  /* ------------------------------------------------------------- eğilim */

  function trendView(){
    const id = S.ui.trendMarker;
    const b = SP.BIO_BY_ID[id];
    const series = M.seriesOf(id);
    const tr = SP.Bio.trendOf(id);
    const vd = SP.Bio.trendVerdict(id, tr);
    const r = SP.Bio.refFor(id);

    const measured = SP.BIOMARKERS.filter(x => M.seriesOf(x.id).length);
    const options = (measured.length ? measured : SP.BIOMARKERS)
      .map(x => ({ value:x.id, label:x.name }));

    return K.Ledger([
      K.Entry({
        wide:true,
        label:b ? b.name : 'Eğilim',
        meta:series.length + ' ölçüm',
        note:'Bir ölçüm başkasıyla değil, KENDİ geçmişiyle kıyaslanır. '
          + 'Yön en az ' + SP.Bio.MIN_POINTS + ' ölçümle söylenir.',
        action:K.Select({ value:id, change:'pick-marker', options }),
        body:html`
          ${when(series.length < 2, () => K.Notice({ tone:'info',
            body:'Grafik için en az iki ölçüm gerekir. Şu an ' + series.length + ' var.' }))}
          ${when(series.length >= 2, () => html`
            ${raw(UI.lineChart([{ data:series.map(s2 => s2.v) }], {
              labels:series.map(s2 => U.fmtShort(s2.date)),
              band:r && r.optimal ? r.optimal : (r ? r.ref : null),
              height:230,
            }))}
            <div class="pair">
              <div>
                <div class="sidestat"><span class="sidestat__v">${U.fmtNum(series[series.length - 1].v)}<small>${b.unit}</small></span>
                  <span class="sidestat__k">son değer</span></div>
              </div>
              <div>
                <div class="sidestat"><span class="sidestat__v">${tr.ok ? (tr.pct > 0 ? '+' : '') + U.fmtNet(tr.pct) : '—'}<small>%</small></span>
                  <span class="sidestat__k">90 günde</span></div>
              </div>
            </div>
            ${K.Notice({ tone:vd.tone === 'muted' ? 'info' : vd.tone,
              body:tr.ok ? vd.text : tr.note })}
            ${when(r && r.ref, () => raw(UI.rangeBar(series[series.length - 1].v, r.ref, r.optimal, b.unit)))}
            <p class="small muted">${b.note}</p>`)}`,
      }),
    ]);
  }

  function markerSheetBody(id){
    const b = SP.BIO_BY_ID[id];
    const series = M.seriesOf(id);
    const r = SP.Bio.refFor(id);
    const tr = SP.Bio.trendOf(id);
    const vd = SP.Bio.trendVerdict(id, tr);
    const last = series.length ? series[series.length - 1] : null;

    return String(K.Stack([
      when(last, () => html`<div class="markerrow">
        <div class="markerrow__head"><span class="markerrow__name">${b.name}</span>
          ${K.Badge({ label:SP.Bio.statusOf(id, last.v).label, tone:SP.Bio.statusOf(id, last.v).tone })}</div>
        <div class="markerrow__val num">${U.fmtNum(last.v)}<small>${b.unit}</small></div>
        <div class="markerrow__bar">${raw(UI.rangeBar(last.v, r.ref, r.optimal, b.unit))}</div>
        <p class="markerrow__note">${SP.Bio.statusNote(id, last.v)}</p>
      </div>`),
      K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
        ['Referans aralığı', r.ref ? U.fmtNum(r.ref[0]) + ' – ' + U.fmtNum(r.ref[1]) + ' ' + b.unit : '—'],
        ['Hedef bant', r.optimal ? U.fmtNum(r.optimal[0]) + ' – ' + U.fmtNum(r.optimal[1]) + ' ' + b.unit : 'tanımlı değil'],
        ['Kırmızı bayrak', [r.red.below != null ? '< ' + r.red.below : null,
          r.red.above != null ? '> ' + r.red.above : null].filter(Boolean).join(' · ') || 'tanımlı değil'],
        ['Eğilim', tr.ok ? vd.text : tr.note],
        ['Ölçüm sayısı', String(series.length)],
      ] }),
      when(b.nutrients && b.nutrients.length, () => K.Notice({ tone:'info',
        title:'Beslenme bağı:',
        body:b.nutrients.map(n => SP.NUTRI_BY_ID[n] ? SP.NUTRI_BY_ID[n].name : n).join(', ')
          + ' bu ölçümle ilişkilidir. Ölçüm hedefin altındaysa beslenme hedefi kendiliğinden yükselir.' })),
      html`<p class="small muted">${b.note}</p>`,
      when(b.derived, () => K.Notice({ tone:'info', title:'Hesaplanan ölçüm:',
        body:SP.DERIVED[b.derived].note + '. Girdilerden biri eksikse hiç yazılmaz.' })),
    ]));
  }

  /* -------------------------------------------------------------- geçmiş */

  function historyView(){
    if(!S.labs.length){
      return K.Ledger([K.Entry({
        label:'Geçmiş', meta:'kayıt yok',
        action:K.Button({ label:'Rapor yapıştır', tone:'primary', act:'open-paste' }),
        body:P.empty('Henüz test girilmedi.'),
      })]);
    }
    return K.Ledger([K.Entry({
      label:'Geçmiş', meta:S.labs.length + ' oturum',
      note:'Her satır bir test oturumudur. Aynı güne ikinci kez girilen '
        + 'değerler o oturumun üstüne yazılır.',
      body:html`<div class="list">${map(S.labs.slice().reverse(), l => html`
        <div class="listitem">
          <div class="grow">
            <b class="small">${U.fmtDate(l.date)}</b>
            ${when(l.lab, () => html`<span class="tiny dim"> · ${l.lab}</span>`)}
            <div class="tiny dim">${Object.keys(l.values).length} değer
              · ${l.source === 'paste' ? 'yapıştırıldı' : 'elle girildi'}</div>
          </div>
          ${K.Button({ label:'Aç', size:'sm', act:'open-lab', data:{ 'data-id':l.id } })}
          ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'Sil',
            act:'del-lab', data:{ 'data-id':l.id } })}
        </div>`)}</div>`,
    })]);
  }

  function labSheetBody(l){
    const rows = Object.keys(l.values).map(id => {
      const b = SP.BIO_BY_ID[id];
      if(!b) return null;
      const cell = l.values[id];
      const st = SP.Bio.statusOf(id, cell.v);
      return [b.name, html`<b class="num">${U.fmtNum(cell.v)}</b> <span class="tiny dim">${b.unit}</span>`,
        K.Badge({ label:st.label, tone:st.tone }), P.cert(cell.cert)];
    }).filter(Boolean);
    return String(K.Stack([
      K.Table({ tight:true, headers:['Ölçüm', { label:'Değer', num:true }, 'Durum', 'Kaynak'], rows }),
      when(l.note, () => html`<p class="small">${l.note}</p>`),
    ]));
  }

  /* ---------------------------------------------------------- yapistirma */

  function pasteSheet(){
    UI.sheet({
      title:'Test raporunu yapıştır',
      subtitle:'Metni olduğu gibi yapıştır — değerler ayıklanıp şemaya oturur',
      wide:true,
      body:String(K.Stack([
        K.Drop({ act:'lab-file', label:'Rapor dosyası ya da fotoğrafı',
          icon:'file', accept:'.txt,.csv,.md,image/*',
          hint:'Metin dosyası modelsiz okunur · fotoğraf için model gerekir' }),
        K.Notice({ tone:'info', body:'Ayıklayıcı emin olamadığı satırı atmaz. '
          + 'Eşleşmeyen satırlar aşağıda listelenir; istersen elle bağlarsın.' }),
        html`<div class="cols-2">
          ${K.Field({ label:'Test tarihi',
            input:K.Input({ id:'paste-date', type:'date', value:draft.date }) })}
          ${K.Field({ label:'Laboratuvar (isteğe bağlı)',
            input:K.Input({ id:'paste-lab', placeholder:'Hangi laboratuvar?' }) })}
        </div>`,
        K.Field({ label:'Rapor metni',
          input:html`<div class="withmic">
            ${K.Textarea({ id:'paste-text', rows:9,
              placeholder:'Hemoglobin      14,2   g/dL    13.5 - 17.5\nFerritin        28     ng/mL   30 - 400\n…' })}
            ${K.Mic({ target:'paste-text' })}
          </div>` }),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Ayıkla', tone:'primary', act:'run-paste' })}`),
    });
  }

  function previewSheet(){
    const p = preview;
    return UI.sheet({
      title:'Ayıklanan değerler', subtitle:p.note, wide:true,
      body:String(K.Stack([
        when(p.rows.length, () => html`<div>${map(p.rows, (r, i) => html`
          <div class="${r.skip ? 'pasterow pasterow--off' : 'pasterow'}">
            ${K.Checkbox({ label:'', checked:!r.skip, act:'toggle-row', data:{ 'data-i':i } })}
            <span><b class="small">${r.marker.name}</b>
              ${when(r.converted, () => html` <span class="tiny dim">${r.from} → ${r.to} çevrildi</span>`)}
              ${when(r.mismatch, () => html` <span class="tiny">${K.Badge({ label:'birim ' + r.mismatch, tone:'warn' })}</span>`)}
            </span>
            <span class="pasterow__val num">${U.fmtNum(r.value)} ${r.marker.unit}</span>
            <span class="pasterow__src">${r.line}</span>
          </div>`)}</div>`),
        when(!p.rows.length, () => K.Notice({ tone:'warn', body:p.note })),
        when(p.unmatched.length, () => K.Collapsible({
          title:'Eşleşmeyen satırlar', meta:p.unmatched.length + ' satır',
          act:'toggle-unmatched', open:!!S.ui.pasteUnmatchedOpen,
          body:html`<ul class="bullets small muted mt-10">
            ${map(p.unmatched.slice(0, 40), x => html`<li>${x.line}</li>`)}</ul>
            <p class="small muted">Bu satırlarda bilinen bir ölçüm adı bulunamadı.
              Değerleri «Test gir» sayfasından elle yazabilirsin.</p>` })),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-paste',
          disabled:!p.rows.filter(r => !r.skip).length })}`),
      noFocus:true,
    });
  }

  /* --------------------------------------------------------------- ekran */

  async function render(){
    const tab = S.ui.labTab;
    const flags = M.openFlags();

    return String(html`
      ${when(flags.length, () => html`<div class="stack-sm mb-16">${map(flags, P.flagCard)}</div>`)}
      <div class="mb-20">${tabs()}</div>
      ${tab === 'giris' ? entryView()
        : tab === 'gecmis' ? historyView()
        : tab === 'trend' ? trendView()
        : resultsView()}
      ${when(tab === 'sonuc', () => html`<div class="mt-24">
        ${P.clinicalNote()}</div>`)}
      <div class="mt-24">${raw(UI.rail(['ref-range', 'optimal-band', 'trend', 'red-flag', 'derived', 'lab-paste']))}</div>`);
  }

  const handle = {
    async 'lab-tab'(el){ S.ui.labTab = el.dataset.tab; S.ui.labQuery = ''; SP.App.render(); },
    async 'lab-filter'(el){ S.ui.labFilter = el.dataset.tab; SP.App.render(); },
    async 'toggle-empty'(){ S.ui.labShowEmpty = !S.ui.labShowEmpty; SP.App.render(); },
    async 'open-marker'(el){
      const b = SP.BIO_BY_ID[el.dataset.id];
      UI.sheet({ title:b.name, subtitle:b.unit, wide:true,
        body:markerSheetBody(b.id), noFocus:true,
        footer:String(html`${K.Button({ label:'Kapat', act:'sheet-close' })}
          ${K.Button({ label:'Eğilimi aç', tone:'primary', act:'goto-trend', data:{ 'data-id':b.id } })}`) });
    },
    async 'goto-trend'(el){
      S.ui.trendMarker = el.dataset.id;
      S.ui.labTab = 'trend';
      UI.closeSheet();
      SP.App.render();
    },
    async 'open-lab'(el){
      const l = S.labs.find(x => x.id === el.dataset.id);
      if(!l) return;
      UI.sheet({ title:U.fmtDate(l.date), subtitle:l.lab || 'test oturumu',
        wide:true, body:labSheetBody(l), noFocus:true,
        footer:String(K.Button({ label:'Kapat', act:'sheet-close' })) });
    },
    /* Onay kagidi yerine GERI ALMA: silinen oturum bellekte tutulur ve
       bildirimdeki dugmeyle geri yazilir. Daha hizli ve daha nazik. */
    async 'del-lab'(el){
      const id = el.dataset.id;
      const rec = S.labs.find(x => x.id === id);
      if(!rec) return;
      const copy = JSON.parse(JSON.stringify(rec));
      await M.deleteLab(id);
      S.ui.undo = { restore:() => M.saveLab(copy) };
      UI.toast(U.fmtDate(copy.date) + ' testi silindi', { undo:true });
      SP.App.render();
    },

    /* ---- kapsamlı giriş ---- */
    async 'entry-clear'(){
      draft.values = {};
      UI.toast('Giriş temizlendi');
      SP.App.render();
    },
    async 'entry-save'(){
      const ids = Object.keys(draft.values);
      if(!ids.length){ UI.toast('Hiç değer yazılmadı'); return; }
      /* Ayni tarihte oturum varsa ustune yazilir; bir gunun testi tek kayittir. */
      const existing = S.labs.find(l => l.date === draft.date);
      const rec = existing || M.newLab(draft.date);
      if(draft.lab) rec.lab = draft.lab;
      ids.forEach(id => {
        const b = SP.BIO_BY_ID[id];
        if(!b) return;
        rec.values[id] = { v:draft.values[id], cert:'measured', unit:b.unit };
      });
      await M.saveLab(rec);
      draft = { date:U.todayISO(), lab:'', values:{} };
      S.ui.labTab = 'sonuc';
      const flags = M.openFlags().filter(f => !f.ack);
      UI.toast(ids.length + ' değer kaydedildi'
        + (flags.length ? ' · ' + flags.length + ' kırmızı bayrak' : ''));
      SP.App.render();
    },

    /* ---- yapıştırma ---- */
    async 'open-paste'(){ pasteSheet(); },
    async 'run-paste'(){
      const text = (document.getElementById('paste-text') || {}).value || '';
      const date = (document.getElementById('paste-date') || {}).value || U.todayISO();
      const lab = (document.getElementById('paste-lab') || {}).value || '';
      preview = SP.Parse.parseLab(text);
      preview.date = date; preview.lab = lab;
      previewSheet();
    },
    async 'toggle-row'(el){
      const i = Number(el.dataset.i);
      if(!preview || !preview.rows[i]) return;
      preview.rows[i].skip = !el.checked;
      previewSheet();
    },
    async 'toggle-unmatched'(){
      S.ui.pasteUnmatchedOpen = !S.ui.pasteUnmatchedOpen;
      previewSheet();
    },
    async 'save-paste'(){
      if(!preview) return;
      const rec = SP.Parse.toLabRecord(preview, preview.date, { lab:preview.lab });
      const n = Object.keys(rec.values).length;
      if(!n){ UI.toast('Kaydedilecek değer yok'); return; }
      await M.saveLab(rec);
      preview = null;
      UI.closeSheet();
      S.ui.labTab = 'sonuc';
      const flags = M.openFlags().filter(f => !f.ack);
      UI.toast(n + ' değer kaydedildi' + (flags.length ? ' · ' + flags.length + ' kırmızı bayrak' : ''));
      SP.App.render();
    },
  };

  const change = {
    /* Dosya hem tiklayarak hem surukleyerek gelir; ikisi de buraya duser. */
    async 'lab-file'(el){
      const file = el.files && el.files[0];
      if(!file) return;
      UI.toast('Okunuyor…');
      preview = await SP.Extract.fromLabFile(file);
      preview.date = (document.getElementById('paste-date') || {}).value || U.todayISO();
      preview.lab = (document.getElementById('paste-lab') || {}).value || '';
      if(!preview.rows.length){ UI.toast(preview.note); return; }
      previewSheet();
    },
    async 'pick-marker'(el){ S.ui.trendMarker = el.value; SP.App.render(); },
    async 'lab-query'(el){ S.ui.labQuery = el.value; SP.App.render(); },
    async 'entry-date'(el){ draft.date = el.value || U.todayISO(); },
    async 'entry-lab'(el){ draft.lab = el.value; },
    /* Her tuşta yeniden çizmez: değer taslakta durur, sayaç kaydetmede
       güncellenir. Uzun formda her hanede sayfayı çizmek yazmayı bozar. */
    async 'entry-val'(el){
      const id = el.dataset.id;
      const raw0 = String(el.value || '').trim().replace(',', '.');
      if(raw0 === ''){ delete draft.values[id]; }
      else{
        const n = Number(raw0);
        if(!isFinite(n)) return;
        draft.values[id] = n;
      }
      el.closest('.entryrow').classList.toggle('is-filled', draft.values[id] != null);
      const bar = document.querySelector('.entrybar .small');
      const n2 = Object.keys(draft.values).length;
      if(bar) bar.textContent = n2 ? n2 + ' değer yazıldı' : 'Henüz değer yazılmadı';
      const save = document.querySelector('[data-act="entry-save"]');
      if(save) save.disabled = !n2;
    },
  };

  return {
    id:'labs',
    title:'Testler',

    /* Başlık durumun kendisidir: ekranın adı zaten üstte yazıyor. */
    headline(){
      const f = M.openFlags().filter(x => !x.ack).length;
      if(f) return f + ' kırmızı bayrak açık.';
      const s = SP.Bio.summary();
      if(!s.measured) return 'Henüz test girilmedi.';
      if(s.out) return s.out + ' ölçüm referans aralığının dışında.';
      if(s.offTarget) return s.offTarget + ' ölçüm hedef bandın dışında.';
      return 'Ölçümlerin tamamı hedef bandın içinde.';
    },
    lede(){
      const s = SP.Bio.summary();
      if(!s.measured){
        return 'Herhangi bir kapsamlı hastane testinin sonucunu tek seferde girebilirsin. '
          + 'Raporun metnini yapıştırman yeterli; değerler kendiliğinden şemaya oturur.';
      }
      return s.measured + ' ölçüm kayıtlı. Değerler organa göre bölünmez; '
        + 'tek listede, önem sırasına göre durur.';
    },
    stats(){
      const s = SP.Bio.summary();
      if(!s.measured) return [];
      return [
        { value:s.measured, label:'ölçüm' },
        { value:s.out, label:'referans dışı' },
        { value:s.offTarget, label:'hedef dışı' },
        { value:S.labs.length, label:'test' },
      ];
    },
    subtitle(){
      const s = SP.Bio.summary();
      return s.measured + ' ölçüm · ' + s.out + ' referans dışı';
    },
    actions(){
      return String(html`${K.Button({ label:'Test gir', icon:'flask', tone:'primary', size:'sm',
        act:'lab-tab', data:{ 'data-tab':'giris' } })}
        ${K.Button({ label:'Rapor yapıştır', size:'sm', act:'open-paste' })}`);
    },
    render, handle, change,
  };
})();

/* ==== js/screens/meals.js ==== */
/* Öğünler — Modül 2'nin ekranı.

   Giriş sıfır sürtünmelidir: tek satır yazılır, gramaj ev ölçüsünden gelir
   ve «tahmin» olarak işaretlenir. Tartan kullanıcı gramı yazar, «ölçüldü» olur.

   Ekranın ayırt edici tarafı emilim sütunudur: aynı öğünde çay varsa demir
   emilimi yarıya iner ve bu ekranda görünür. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.meals = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  function shownDate(){ return S.ui.mealDate || U.todayISO(); }

  /* Saate gore makul ogun secimi — kullaniciya sormadan dogru tahmin. */
  function guessSlot(){
    const h = new Date().getHours();
    if(h < 10) return 'kahvalti';
    if(h < 12) return 'ara1';
    if(h < 15) return 'ogle';
    if(h < 18) return 'ara2';
    if(h < 22) return 'aksam';
    return 'gece';
  }

  /* ---------------------------------------------------------- giris */

  function quickEntry(){
    return K.Entry({
      label:'Öğün ekle', hint:'portion',
      meta:'tek satır, tek Enter',
      note:'Ev ölçüsü tanınır: tabak · kase · dilim · bardak · avuç · kaşık. '
        + 'Tarttıysan «150 g tavuk göğsü» yaz.',
      action:html`${K.Button({ label:'Besin ara', act:'open-search' })}
        ${K.Button({ label:'Fotoğraftan', icon:'camera', act:'open-photo' })}`,
      body:html`
        <div class="quick">
          ${K.Select({ id:'meal-slot', value:S.ui.mealSlot,
            options:SP.MEAL_SLOTS.map(s => ({ value:s.id, label:s.label })), change:'pick-slot' })}
          ${K.Mic({ target:'meal-text' })}
          ${K.Input({ id:'meal-text', placeholder:'1 tabak etli kuru fasulye, 2 dilim ekmek, 1 bardak ayran',
            aria:'Öğün metni' })}
          ${K.Button({ label:'Ekle', tone:'primary', act:'add-meal' })}
        </div>`,
    });
  }

  /* ---------------------------------------------------------- fotograf

     Fotograf tek basina zayif bir kaynaktir: porsiyon buyuklugu
     fotograftan guvenilir cikmaz. Bu yuzden UC KISA NOT sorulur.
     Serbest bir "not" alani degil uc alan -- tahmini guclendiren sey
     tam olarak bu uc bilgidir ve sorulmadan verilmez. */

  let photoFile = null;

  const AMOUNTS = [
    { value:'tamamı',   label:'Tamamı' },
    { value:'yarısı',   label:'Yarısı' },
    { value:'çeyreği',  label:'Çeyreği' },
    { value:'iki tabak',label:'İki tabak' },
  ];

  function photoSheet(){
    UI.sheet({
      title:'Fotoğraftan öğün', subtitle:'Üç kısa not tahmini belirgin ölçüde güçlendirir',
      wide:true,
      body:String(K.Stack([
        when(!SP.Extract.modelReady(), () => K.Notice({ tone:'warn',
          title:'Model bağlı değil.',
          body:'Fotoğraftan öğün okumak için Ayarlar → Rehber → Model bölümünden '
            + 'görüntü destekleyen bir sağlayıcı seç. Öğünü tek satır yazarak '
            + 'modelsiz de girebilirsin.' })),
        K.Drop({ act:'meal-photo', label:'Yemek fotoğrafı', icon:'camera',
          accept:'image/*', hint:'Fotoğrafı buraya bırak ya da seçmek için tıkla' }),
        html`<div id="photo-name" class="small dim">${photoFile ? photoFile.name : ''}</div>`,
        html`<div class="cols-2">
          ${K.Field({ label:'Ne kadarı yendi?',
            input:K.Select({ id:'ph-amount', options:AMOUNTS }) })}
          ${K.Field({ label:'Kabın ölçüsü', hint:'isteğe bağlı',
            input:K.Input({ id:'ph-vessel', placeholder:'24 cm tabak, çay bardağı…' }) })}
        </div>`,
        K.Field({ label:'Gizli malzeme', hint:'fotoğrafta görünmeyen şeyler',
          input:html`<div class="withmic">
            ${K.Input({ id:'ph-extra', placeholder:'zeytinyağlı, şekerli, tereyağında kavrulmuş…' })}
            ${K.Mic({ target:'ph-extra' })}
          </div>` }),
        K.Notice({ tone:'info', body:'Fotoğraftan gelen gramaj her zaman «tahmin» '
          + 'olarak işaretlenir. Tartıp düzeltirsen «ölçüldü» olur.' }),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Oku', tone:'primary', act:'run-photo',
          disabled:!photoFile || !SP.Extract.modelReady() })}`),
      noFocus:true,
    });
  }

  function photoPreviewSheet(res){
    UI.sheet({
      title:'Fotoğraftan okunanlar', subtitle:res.note, wide:true,
      body:String(K.Stack([
        when(res.items.length, () => html`<div>${map(res.items, (it, i) => {
          const f = SP.FOOD_BY_ID[it.foodId];
          return html`<div class="pasterow">
            ${K.Checkbox({ label:'', checked:!it.skip, act:'toggle-photo-row', data:{ 'data-i':i } })}
            <span><b class="small">${f ? f.name : it.foodId}</b>
              ${P.cert('estimated')}</span>
            <span class="pasterow__val num">${it.g} g</span>
            <span class="pasterow__src">fotoğraftan tahmin</span>
          </div>`;
        })}</div>`),
        when(!res.items.length, () => K.Notice({ tone:'warn', body:res.note })),
        when(res.unmatched.length, () => K.Notice({ tone:'info',
          title:'Eşleşmeyenler:',
          body:res.unmatched.map(x => x.line).join(' · ')
            + ' — bunlar gıda listemizde yok, kaydedilmedi.' })),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Öğüne ekle', tone:'primary', act:'save-photo',
          disabled:!res.items.filter(x => !x.skip).length })}`),
      noFocus:true,
    });
  }

  let photoRes = null;

  /* ---------------------------------------------------------- ogunler */

  function mealCard(meal){
    const a = SP.Nutri.absorbMeal(meal.items || []);
    const slot = SP.MEAL_SLOTS.find(s => s.id === meal.slot);
    return html`
      <div class="mealcard">
        <div class="mealcard__head">
          ${raw(UI.icon(slot ? slot.icon : 'meal'))}
          <span class="mealcard__slot">${slot ? slot.label : meal.slot}</span>
          <span class="mealcard__kcal num">${Math.round(a.raw.kcal)} kcal</span>
          ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'Öğünü sil',
            act:'del-meal', data:{ 'data-id':meal.id } })}
        </div>
        ${map(meal.items || [], (it, i) => {
          const f = SP.FOOD_BY_ID[it.foodId];
          if(!f) return '';
          return html`<div class="mealitem">
            <span class="mealitem__g num">${it.g} g</span>
            <span class="mealitem__name">${f.name}
              ${when(it.portion, () => html`<span class="tiny dim"> · ${it.portion}</span>`)}</span>
            ${P.cert(it.cert)}
            ${K.IconButton({ icon:'close', size:'sm', plain:true, aria:'Çıkar',
              act:'del-item', data:{ 'data-id':meal.id, 'data-i':i } })}
          </div>`;
        })}
        <div class="row wrap mt-8">
          <span class="tiny dim">Protein ${Math.round(a.raw.protein)} g ·
            yağ ${Math.round(a.raw.fat)} g · karbonhidrat ${Math.round(a.raw.carb)} g ·
            lif ${Math.round(a.raw.fiber)} g</span>
        </div>
        ${map(a.notes, P.absorbNote)}
      </div>`;
  }

  function dayCard(){
    const d = shownDate();
    const rows = M.mealsOf(d);
    const order = SP.MEAL_SLOTS.map(s => s.id);
    const sorted = rows.slice().sort((x, y) => order.indexOf(x.slot) - order.indexOf(y.slot));

    return K.Card({
      title:U.fmtDate(d),
      sub:rows.length ? rows.length + ' öğün' : 'kayıt yok',
      actions:K.Segmented({ act:'shift-day', value:'', aria:'Gün değiştir', items:[
        { value:'-1', label:'‹' }, { value:'0', label:'bugün' }, { value:'1', label:'›' },
      ] }),
      body:rows.length
        ? html`${map(sorted, mealCard)}`
        : P.empty('Bu güne henüz öğün girilmedi.', 'Öğün ekle', 'focus-meal'),
    });
  }

  /* ---------------------------------------------------------- hedefler */

  function targetCard(){
    const d = shownDate();
    const t = SP.Nutri.targets();
    const tot = SP.Nutri.dayTotals(d);

    if(!t.ok){
      return K.Card({ title:'Günlük hedef',
        body:K.Notice({ tone:'warn', title:'Hesaplanamıyor.',
          body:'Profilde ' + t.missing.join(', ') + ' eksik. Bu üçü olmadan kalori '
             + 've protein hedefi tahmin edilmez.' }),
        foot:K.Button({ label:'Profili aç', size:'sm', tone:'primary',
          act:'go', data:{ 'data-route':'family' } }) });
    }

    return K.Card({
      title:'Günlük hedef', hint:'macro-target',
      sub:t.goal.label + ' · ' + U.fmtNum(t.tdee) + ' kcal ihtiyaç',
      badge:K.Badge({ label:U.fmtNum(t.kcal) + ' kcal', tone:'info' }),
      body:html`
        <div class="nutgrid">
          ${P.nutCell({ label:'Kalori', got:tot.kcal, target:t.kcal, unit:'kcal' })}
          ${P.nutCell({ label:'Protein', got:tot.protein, target:t.protein.min, unit:'g',
            note:t.protein.min + '–' + t.protein.max + ' g bandı' })}
          ${P.nutCell({ label:'Yağ', got:tot.fat, target:t.fat.min, unit:'g',
            note:t.fat.min + '–' + t.fat.max + ' g bandı' })}
          ${P.nutCell({ label:'Karbonhidrat', got:tot.carb, target:t.carb.min, unit:'g' })}
          ${P.nutCell({ label:'Lif', got:tot.fiber, target:t.fiber, unit:'g' })}
        </div>
        ${when(Object.keys(t.adjustments).length, () => K.Notice({ tone:'info', class:'mt-12',
          title:'Laboratuvara göre yükseltilen hedefler:',
          body:html`<ul class="bullets small mt-4">${map(Object.keys(t.adjustments), k => html`
            <li><b>${SP.NUTRI_BY_ID[k] ? SP.NUTRI_BY_ID[k].name : k}</b>
              ×${U.fmtNet(t.adjustments[k].mult)} — ${t.adjustments[k].why}</li>`)}</ul>` }))}`,
    });
  }

  function microCard(){
    const d = shownDate();
    const t = SP.Nutri.targets();
    const tot = SP.Nutri.dayTotals(d);
    if(!t.ok || tot.empty) return null;

    return K.Card({
      title:'Mikro besinler', hint:'bioavailability',
      sub:'Alınan ve emilen ayrı gösterilir',
      body:K.Table({ tight:true,
        headers:['Öğe', { label:'Alınan', num:true }, { label:'Emilen', num:true },
          { label:'Hedef', num:true }, 'Durum'],
        rows:Object.keys(t.micro).map(id => {
          const n = SP.NUTRI_BY_ID[id];
          const tg = t.micro[id];
          const got = tot.micro[id] || 0;
          const abs = tot.absorbed[id] || 0;
          const pct = U.pct(got, tg.target);
          const tone = tg.limit ? (pct > 100 ? 'danger' : 'ok')
            : pct >= 100 ? 'ok' : pct >= 70 ? 'warn' : 'danger';
          return [
            html`<button class="linkbtn" data-act="open-nutrient" data-id="${id}">${n.name}</button>`,
            U.fmtNum(U.round(got, id === 'omega3' ? 2 : 0)),
            U.fmtNum(U.round(abs, id === 'omega3' ? 2 : 1)),
            U.fmtNum(tg.target) + ' ' + n.unit,
            K.Badge({ label:'%' + pct, tone }),
          ];
        }) }),
      foot:html`<span class="small dim">Emilen sütunu öğün içeriğine göre hesaplanır:
        aynı öğündeki C vitamini, çay, kalsiyum ve yağ emilimi değiştirir.</span>`,
    });
  }

  function gapCard(){
    const g = SP.Nutri.gaps(7);
    if(!g.ok){
      return K.Card({ title:'Son 7 gün', hint:'nutri-gap',
        body:K.Notice({ tone:'info', body:'Son 7 günde hiç öğün girilmemiş; açık hesaplanamıyor. '
          + 'Girilmemiş gün sıfır sayılmaz, ortalamaya katılmaz.' }) });
    }
    if(!g.rows.length){
      return K.Card({ title:'Son 7 gün', hint:'nutri-gap',
        badge:K.Badge({ label:g.avg.days + ' gün kayıt', tone:'ok' }),
        body:K.Notice({ tone:'ok', body:'Son 7 günün ortalaması bütün hedefleri karşılıyor.' }) });
    }
    return K.Card({
      title:'Açıklar', hint:'nutri-gap',
      sub:'Son 7 günün ortalaması · ' + g.avg.days + ' gün kayıt',
