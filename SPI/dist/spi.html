      UI.toast(v === '' ? 'Fiyat kaldırıldı' : 'Fiyat kaydedildi · ölçüldü');
      SP.App.render();
    },
    async 'price-query'(el){ S.ui.foodQuery = el.value; S.ui.foodPage = 1; SP.App.render(); },
    async 'add-query'(el){ S.ui.foodQuery = el.value; S.ui.foodPage = 1; addSheet(); },
  };

  return {
    id:'basket',
    title:'Finans',
    headline(){
      const b = SP.Money.budget();
      if(!b.rows.filter(r => r.monthly).length) return 'Bütçe için henüz veri yok.';
      if(b.over) return 'Talep aylık sınırın üstünde.';
      if(b.limit != null) return 'Talep aylık sınırın içinde.';
      return 'Aylık talep ' + U.fmtNum(b.total) + ' TL.';
    },
    lede(){
      const b = SP.Money.budget();
      const est = SP.Money.estimateShare();
      const base = 'Bütçe tek başına üretilmez: Nesrin gıdayı, Kerem testi, '
        + 'Barış ekipmanı ister; Sedef toplar.';
      if(b.unknown) return base + ' Şu an ' + b.unknown + ' kalemin fiyatı bilinmiyor '
        + 've toplamın dışında duruyor — sıfır sayılmadı.';
      return base + (est.pct ? ' Hesabın %' + est.pct + '\u2019i tahmin fiyatıyla.' : '');
    },
    stats(){
      const b = SP.Money.budget();
      const w = SP.Money.basketTotal();
      const out = [{ value:U.fmtNum(b.total), label:'aylık talep (TL)' }];
      if(b.limit != null) out.push({ value:U.fmtNum(b.limit), label:'aylık sınır (TL)' });
      if(w.rows.length) out.push({ value:U.fmtNum(Math.round(w.total)), label:'haftalık sepet (TL)' });
      if(b.unknown) out.push({ value:b.unknown, label:'fiyatı yok' });
      return out;
    },
    subtitle(){
      const st = SP.Money.status();
      return st.text;
    },
    actions(){
      return String(html`${K.Button({ label:'Kalem ekle', icon:'plus', size:'sm', tone:'primary',
        act:'open-add' })}
        ${K.Button({ label:'Fiş oku', size:'sm', icon:'camera', act:'open-receipt' })}
        ${K.Button({ label:'Sınır ve ücretler', size:'sm', act:'open-limits' })}`);
    },
    render, handle, change,
  };
})();

/* ==== js/screens/analytics.js ==== */
/* Analiz — alanlar arası bağlar ve haftalık konsolide rapor.

   Bu ekranın tek dürüstlük kuralı: KORELASYON NEDENSELLİK DEĞİLDİR.
   Bulgu daima «birlikte hareket ediyor» diliyle yazılır, «sebep oldu»
   diliyle değil. Ortak gün sayısı yetersizse bulgu hiç üretilmez. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.analytics = (function(){
  const U = SP.U, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  const TABS = [
    { id:'capraz', label:'Çapraz bağlar',  icon:'layers' },
    { id:'hafta',  label:'Haftalık rapor', icon:'list' },
    { id:'seri',   label:'Seriler',        icon:'chart' },
  ];

  /* --------------------------------------------------------------- capraz */

  function crossCard(){
    const rows = SP.Calc.crossFindings(60);
    const strong = rows.filter(r => r.ok && !r.weak);
    return K.Card({
      title:'Çapraz bağlar',
      sub:'Son 60 gün · aynı günde ölçülmüş veriler',
      badge:K.Badge({ label:strong.length + ' belirgin bağ', tone:strong.length ? 'info' : 'muted' }),
      body:html`
        ${K.Notice({ tone:'info', body:'Katsayı iki ölçümün birlikte hareket edip etmediğini söyler. '
          + 'Birinin diğerine sebep olduğunu söylemez — bunu ancak deneyerek anlarsın.' })}
        <div class="list mt-12">${map(rows, r => html`
          <div class="listitem">
            <div class="grow">
              <b class="small">${r.link.title}</b>
              ${when(r.ok && !r.weak, () => K.Badge({ label:'r = ' + U.fmtNet(r.r), tone:r.tone }))}
              ${when(r.ok && r.weak, () => K.Badge({ label:'zayıf', tone:'muted' }))}
              ${when(!r.ok, () => K.Badge({ label:'veri yetersiz', tone:'muted' }))}
              <div class="tiny dim mt-2">${r.ok ? r.text : r.note}</div>
            </div>
          </div>`)}</div>`,
    });
  }

  function pairCard(){
    const a = S.ui.pairA || 'sleep';
    const b = S.ui.pairB || 'readiness';
    const pairs = SP.Calc.pairsFor(a, b, 90);
    const c = SP.Calc.correlate(pairs);
    const opts = Object.keys(SP.Calc.SERIES).map(id => ({ value:id, label:seriesLabel(id) }));

    return K.Card({
      title:'Kendi bağını kur',
      sub:'İki ölçümü seç, birlikte hareket edip etmediklerine bak',
      body:html`
        <div class="cols-2">
          ${K.Field({ label:'Birinci ölçüm', input:K.Select({ value:a, change:'pair-a', options:opts }) })}
          ${K.Field({ label:'İkinci ölçüm', input:K.Select({ value:b, change:'pair-b', options:opts }) })}
        </div>
        <div class="mt-12">
          ${when(c.ok, () => html`
            ${K.Stat({ label:'Katsayı', value:U.fmtNet(c.r),
              note:c.n + ' ortak gün · ' + (c.strength >= 0.6 ? 'güçlü' : c.strength >= 0.3 ? 'orta' : 'zayıf') })}
            ${raw(UI.lineChart([
              { data:pairs.map(p => p[0]) },
              { data:pairs.map(p => p[1]), accent:true },
            ], { height:170, area:false }))}
            ${UI.legend([{ label:seriesLabel(a), color:'var(--primary)' },
              { label:seriesLabel(b), color:'var(--accent)' }])}`)}
          ${when(!c.ok, () => K.Notice({ tone:'info',
            body:'Ortak gün sayısı yetersiz (' + c.n + '/' + SP.Calc.MIN_PAIRS + '). '
              + 'İki ölçüm de aynı günlerde girilmiş olmalı.' }))}
        </div>`,
    });
  }

  function seriesLabel(id){
    return ({ sleep:'Uyku', hrv:'HRV', rhr:'İstirahat nabzı', weight:'Kilo', sbp:'Büyük tansiyon',
      readiness:'Toparlanma', load:'Antrenman yükü', protein:'Protein', kcal:'Kalori',
      fiber:'Lif', sodium:'Sodyum' })[id] || id;
  }

  /* ---------------------------------------------------------------- hafta */

  function reportCard(){
    const r = SP.Calc.weeklyReport();
    return K.Card({
      title:'Haftalık konsolide rapor',
      sub:U.fmtRange(r.start, r.end),
      badge:K.Badge({ label:r.discipline.minDays + '/7 asgari gün',
        tone:r.discipline.minDays >= 5 ? 'ok' : 'warn' }),
      body:html`
        ${K.Notice({ tone:'info', body:SP.Calc.headline(r) })}
        <div class="cols-4 mt-12">
          ${K.Stat({ label:'Toparlanma', value:r.readiness.avg == null ? '—' : String(r.readiness.avg),
            note:r.readiness.n + ' gün ölçüldü' })}
          ${K.Stat({ label:'Seans', value:String(r.movement.sessions),
            note:U.fmtNum(r.movement.load) + ' yük' })}
          ${K.Stat({ label:'Öğün kaydı', value:r.nutrition.loggedDays + '/7',
            note:r.nutrition.proteinPct != null ? 'protein %' + r.nutrition.proteinPct : 'hedef yok' })}
          ${K.Stat({ label:'Sepet', value:r.money.rows.length ? U.fmtNum(Math.round(r.money.total)) : '—',
            unit:r.money.rows.length ? 'TL' : '', note:r.money.over ? 'sınır aşıldı' : 'sınır içinde' })}
        </div>
        ${when(r.flags.length, () => html`<div class="mt-12">${map(r.flags, P.flagCard)}</div>`)}
        ${when(r.attention.length, () => html`<div class="mt-12">
          <h3 class="section-h">Dikkat isteyen ölçümler</h3>
          ${K.Table({ tight:true, headers:['Ölçüm', { label:'Değer', num:true }, 'Durum'],
            rows:r.attention.map(a => [a.marker.name, U.fmtNum(a.value) + ' ' + a.marker.unit,
              K.Badge({ label:a.status.label, tone:a.status.tone })]) })}</div>`)}
        ${when(r.gaps.length, () => html`<div class="mt-12">
          <h3 class="section-h">Beslenme açıkları</h3>
          ${K.Table({ tight:true, headers:['Öğe', { label:'Kapsama', num:true }],
            rows:r.gaps.map(g => [g.nutrient ? g.nutrient.name : g.id, '%' + g.pct]) })}</div>`)}`,
      foot:K.Button({ label:'Ofiste konuş', size:'sm', act:'go', data:{ 'data-route':'meeting' } }),
    });
  }

  function disciplineCard(){
    const days = [];
    for(let i = 27; i >= 0; i--){
      const d = U.iso(U.addDays(U.today(), -i));
      const m = SP.Calc.minimumDay(d);
      days.push({ label:U.fmtShort(d), value:U.pct(m.done, m.total) });
    }
    return K.Card({
      title:'Asgari gün tutturma', hint:'minimum-day',
      sub:'Son 28 gün',
      badge:K.Badge({ label:SP.Calc.streak() + ' gün seri', tone:'info' }),
      body:raw(UI.barChart(days, { max:100, height:150, goodAt:100 })),
    });
  }

  /* ---------------------------------------------------------------- seri */

  function seriesCard(){
    const id = S.ui.trendMarker;
    const b = SP.BIO_BY_ID[id];
    const series = SP.Model.seriesOf(id);
    const r = SP.Bio.refFor(id);
    const tr = SP.Bio.trendOf(id);
    const vd = SP.Bio.trendVerdict(id, tr);
    const measured = SP.BIOMARKERS.filter(x => SP.Model.seriesOf(x.id).length);

    return K.Card({
      title:'Ölçüm serisi', hint:'trend',
      sub:b ? b.name : '',
      actions:K.Select({ value:id, change:'pick-series',
        options:(measured.length ? measured : SP.BIOMARKERS).map(x => ({ value:x.id, label:x.name })) }),
      body:html`
        ${when(series.length < 2, () => K.Notice({ tone:'info',
          body:'En az iki ölçüm gerekir; şu an ' + series.length + ' var.' }))}
        ${when(series.length >= 2, () => html`
          ${raw(UI.lineChart([{ data:series.map(s => s.v) }], {
            labels:series.map(s => U.fmtShort(s.date)),
            band:r && r.optimal ? r.optimal : (r ? r.ref : null), height:210 }))}
          ${K.Notice({ tone:vd.tone === 'muted' ? 'info' : vd.tone, class:'mt-12',
            body:tr.ok ? vd.text : tr.note })}
          ${K.Table({ tight:true, headers:['Tarih', { label:'Değer', num:true }, 'Durum', 'Kaynak'],
            rows:series.slice().reverse().map(s => [U.fmtDate(s.date), U.fmtNum(s.v) + ' ' + b.unit,
              K.Badge({ label:SP.Bio.statusOf(id, s.v).label, tone:SP.Bio.statusOf(id, s.v).tone }),
              P.cert(s.cert)]) })}`)}`,
    });
  }

  /* --------------------------------------------------------------- ekran */

  async function render(){
    const tab = S.ui.analyticsTab;
    const head = html`<div class="mb-8">${K.Subtabs({ items:TABS, value:tab,
      act:'an-tab', aria:'Analiz görünümü' })}</div>`;

    if(tab === 'hafta'){
      return String(html`${head}
        ${K.Ledger(() => [reportCard(), disciplineCard(),
          K.Entry({ label:'Raporun mantığı', meta:'sayı nereden gelir',
            note:'Sayılar kural motorundan gelir; Patron ajan yalnızca cümleye çevirir. '
              + 'Çelişki varsa öncelik sırası uygulanır ve hangi kuralın kazandığı yazılır.',
            body:K.Table({ tight:true, headers:['Sıra', 'Kural'],
              rows:SP.PRECEDENCE.map(p => [String(p.rank), p.label]) }) }),
        ])}
        <div class="mt-24">${raw(UI.rail(['grounding', 'decision', 'minimum-day']))}</div>`);
    }
    if(tab === 'seri'){
      return String(html`${head}
        ${K.Ledger(() => [seriesCard()])}
        <div class="mt-24">${raw(UI.rail(['trend', 'ref-range', 'certainty']))}</div>`);
    }
    return String(html`${head}
      ${K.Ledger(() => [crossCard(), pairCard()])}
      <div class="mt-24">${raw(UI.rail(['correlation', 'trend', 'certainty']))}</div>`);
  }

  const handle = {
    async 'an-tab'(el){ S.ui.analyticsTab = el.dataset.tab; SP.App.render(); },
  };

  const change = {
    async 'pair-a'(el){ S.ui.pairA = el.value; SP.App.render(); },
    async 'pair-b'(el){ S.ui.pairB = el.value; SP.App.render(); },
    async 'pick-series'(el){ S.ui.trendMarker = el.value; SP.App.render(); },
  };

  return {
    id:'analytics',
    title:'Analiz',
    headline(){
      const rows = SP.Calc.crossFindings(60).filter(r => r.ok && !r.weak);
      if(!rows.length) return 'Belirgin bir bağ bulunamadı.';
      return rows.length + ' belirgin bağ bulundu.';
    },
    lede(){
      return 'Birlikte hareket eden iki ölçüm, birinin diğerine sebep olduğu '
        + 'anlamına gelmez. Bağ en az ' + SP.Calc.MIN_PAIRS + ' eşleşen gün olduğunda '
        + 'yazılır; altında hiç yazılmaz.';
    },
    subtitle(){
      const rows = SP.Calc.crossFindings(60).filter(r => r.ok && !r.weak);
      return rows.length ? rows.length + ' belirgin bağ bulundu' : 'Belirgin bağ yok';
    },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/office.js ==== */
/* Ofis — beş masa.

   Her masada bir ajan oturur ve YALNIZCA kendi brifingini görür. Masayı
   açtığında ajanın kural motorundan gelen raporu ve kendi cümlesi görünür.

   Rozet önemlidir: cümle modelden mi geldi yoksa kural motorundan mı?
   Model kapalıyken ofis kapanmaz, yalnızca rozet değişir. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.office = (function(){
  const U = SP.U, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  /* Masa satirlari: her ajanin kendi kural motoru cumlesi. */
  function deskCard(agent){
    const open = S.ui.officeDesk === agent.id;
    const b = SP.Office.brief(agent.id);
    const line = SP.Office.ruleText(agent.id, b);
    const notes = SP.Office.notes().filter(n => n.agent === agent.id);

    return K.Card({
      box:true, class:'desk',
      body:html`
        <div class="desk__head">
          ${P.avatar(agent.id)}
          <div class="grow minw0">
            <b class="desk__name">${agent.name}</b>
            <span class="desk__role">${agent.role}</span>
          </div>
          ${when(notes.length, () => K.Badge({ label:String(notes.length),
            tone:notes.some(n => n.tone === 'danger') ? 'danger' : 'warn' }))}
          ${SP.Office.ready(agent.id) ? K.Badge({ label:'model açık', tone:'info' })
            : K.Badge({ label:'kural motoru', tone:'muted', icon:false })}
        </div>
        <p class="desk__line">${line}</p>
        ${when(notes.length, () => html`<div class="notes mt-10">${map(notes, n => html`
          <div class="note note--${n.tone}"><span class="note__dot"></span>
            <span class="small">${n.text}</span></div>`)}</div>`)}
        ${when(open, () => html`<div class="desk__open">
          ${deskDetail(agent, b)}
        </div>`)}
        <div class="row wrap mt-12">
          ${K.Button({ label:open ? 'Raporu kapat' : 'Raporu aç', size:'sm',
            act:'toggle-desk', data:{ 'data-id':agent.id } })}
          ${K.Button({ label:'Soru sor', size:'sm', tone:'primary',
            act:'ask-agent', data:{ 'data-agent':agent.id } })}
        </div>`,
    });
  }

  /* Ajanin brifinginin okunabilir hali — sayilar aynen, yorum yok. */
  function deskDetail(agent, b){
    if(agent.id === 'lab'){
      return html`
        ${K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
          ['Girilmiş ölçüm', b.summary.measured + ' / ' + b.summary.total],
          ['Referans dışı', String(b.summary.out)],
          ['Hedef bandın dışı', String(b.summary.offTarget)],
          ['Açık kırmızı bayrak', String(b.flags.length)],
          ['Son tahlil', b.lastLab ? U.fmtDate(b.lastLab) : 'yok'],
        ] })}
        ${when(b.attention.length, () => html`<div class="mt-10">
          ${K.Table({ tight:true, headers:['Ölçüm', { label:'Değer', num:true }, 'Durum'],
            rows:b.attention.map(a => [a.marker, U.fmtNum(a.value) + ' ' + a.unit,
              K.Badge({ label:a.statusLabel, tone:a.status === 'red' ? 'danger'
                : a.status === 'low' || a.status === 'high' ? 'warn' : 'info' })]) })}</div>`)}`;
    }
    if(agent.id === 'nutri'){
      if(!b.targetsOk) return K.Notice({ tone:'warn', body:'Profilde ' + b.missingProfile.join(', ') + ' eksik.' });
      return html`
        ${K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
          ['Günlük kalori hedefi', U.fmtNum(b.kcal) + ' kcal'],
          ['Protein bandı', b.protein.min + '–' + b.protein.max + ' g'],
          ['Lif hedefi', b.fiber + ' g'],
          ['Kayıtlı gün (7 gün)', String(b.loggedDays)],
          ['Bugün', b.todayMeals + ' öğün · ' + U.fmtNum(b.todayKcal) + ' kcal'],
        ] })}
        ${when(b.gaps.length, () => html`<div class="mt-10">
          ${K.Table({ tight:true, headers:['Açık', { label:'Kapsama', num:true }, { label:'Emilen', num:true }],
            rows:b.gaps.map(g => [g.nutrient, '%' + g.pct, U.fmtNum(g.absorbed)]) })}</div>`)}`;
    }
    if(agent.id === 'move'){
      return html`
        ${K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
          ['Toparlanma', b.readiness == null ? 'ölçüm yok' : b.readiness + '/100 · ' + b.band],
          ['Yük çarpanı', '×' + U.fmtNet(b.factor)],
          ['Son hafta / son ay', b.acwr.ratio != null ? U.fmtNet(b.acwr.ratio) + ' · ' + b.acwr.zone : b.acwr.note],
          ['Bu hafta yük', U.fmtNum(b.week)],
          ['Bugün', b.doneToday + ' seans · ' + U.fmtNum(b.loadToday) + ' yük'],
          ['Eksik kalıp', b.balance.length ? b.balance.join(', ') : 'yok'],
        ] })}
        ${when(b.progressionReady.length, () => html`<div class="mt-10">
          ${K.Table({ tight:true, headers:['Hareket', 'Basamak'],
            rows:b.progressionReady.map(p => [p.exercise, p.from + ' → ' + p.to]) })}</div>`)}`;
    }
    if(agent.id === 'money'){
      return html`
        ${K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
          ['Sepet', b.itemCount + ' kalem · ' + U.fmtNum(Math.round(b.total)) + ' TL'],
          ['Sınır', b.limit == null ? 'konmadı' : U.fmtNum(b.limit) + ' TL' + (b.over ? ' · aşıldı' : '')],
          ['Kişi başı', U.fmtNum(Math.round(b.perPerson)) + ' TL'],
          ['Tahmin payı', '%' + b.estimatePct],
        ] })}
        ${when(b.swaps.length, () => html`<div class="mt-10">
          ${K.Table({ tight:true, headers:['İkame', { label:'Tasarruf', num:true }, 'Korunan'],
            rows:b.swaps.map(s => [s.from + ' → ' + s.to, U.fmtNum(Math.round(s.saveTotal)) + ' TL',
              s.keeps.join(', ')]) })}</div>`)}`;
    }
    /* patron */
    return html`
      ${K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
        ['Hafta', U.fmtRange(b.week.start, b.week.end)],
        ['Toparlanma ortalaması', b.week.readiness == null ? '—' : String(b.week.readiness)],
        ['Asgari gün', b.week.minDays + '/7'],
        ['Seans', String(b.week.sessions)],
        ['Öğün kaydı', b.week.loggedMeals + ' gün'],
        ['Davranış serisi', b.streak + ' gün'],
        ['Açık karar', String(b.openDecisions.length)],
      ] })}
      ${when(b.cross.length, () => html`<div class="mt-10">
        ${K.Table({ tight:true, headers:['Çapraz bağ', 'Bulgu'],
          rows:b.cross.map(c => [c.title, html`<span class="small">${c.text}</span>`]) })}</div>`)}`;
  }

  function briefingCard(){
    const d = U.todayISO();
    const b = S.officeBriefings[d];
    return K.Card({
      title:'Günün brifingi', hint:'office',
      sub:U.fmtDate(d),
      badge:b ? P.sourceBadge(b.source) : K.Badge({ label:'üretilmedi', tone:'muted' }),
      body:html`
        ${when(b, () => html`<p class="small">${b.text}</p>
          ${when(b.headline, () => html`<p class="small dim mt-8">${b.headline}</p>`)}`)}
        ${when(!b, () => K.Notice({ tone:'info',
          body:'Brifing günde bir kez üretilir ve tek model çağrısı harcar. '
             + 'Model kapalıysa kural motorunun cümlesi yazılır.' }))}`,
      foot:K.Button({ label:'Tazele', size:'sm', act:'refresh-briefing' }),
    });
  }

  function decisionCard(){
    const open = SP.Model.openDecisions();
    const closed = S.decisions.filter(d => d.status === 'closed').slice(0, 5);
    return K.Card({
      title:'Takipteki kararlar', hint:'decision',
      badge:K.Badge({ label:String(open.length), tone:open.length ? 'warn' : 'muted' }),
      body:html`
        ${when(!open.length && !closed.length, () => K.Empty({ text:'Henüz karar kaydı yok.' }))}
        ${when(open.length, () => html`<div class="list">${map(open, d => html`
          <div class="listitem">
            <div class="grow"><b class="small">${d.title}</b>
              <div class="tiny dim">${U.relativeDay(d.at.slice(0, 10))} · ${d.why || ''}</div></div>
            ${K.Button({ label:'Kapat', size:'sm', act:'close-decision', data:{ 'data-id':d.id } })}
          </div>`)}</div>`)}
        ${when(closed.length, () => html`<div class="mt-12">
          <h3 class="section-h">Kapanan kararlar</h3>
          <div class="list">${map(closed, d => html`
            <div class="listitem"><div class="grow"><b class="small">${d.title}</b>
              <div class="tiny dim">${d.outcome || 'sonuç yazılmadı'}</div></div>
              ${K.Badge({ label:'kapandı', tone:'muted' })}</div>`)}</div></div>`)}`,
      foot:K.Button({ label:'Karar ekle', size:'sm', act:'add-decision' }),
    });
  }

  function agendaCard(){
    const rows = SP.Office.agendaCandidates().slice(0, 5);
    return K.Card({
      title:'Gündem adayları',
      sub:'Puanlama kural motorundan gelir',
      body:html`<div class="list">${map(rows, (a, i) => html`
        <div class="listitem">
          <div class="grow"><b class="small">${a.label}</b>
            ${K.Badge({ label:String(a.score), tone:a.score >= 65 ? 'danger' : a.score >= 40 ? 'warn' : 'muted' })}
            <div class="tiny dim">${a.detail}</div></div>
          ${P.avatar(a.owner, 'sm')}
        </div>`)}</div>`,
      foot:K.Button({ label:'Toplantıyı başlat', size:'sm', tone:'primary',
        act:'go', data:{ 'data-route':'meeting' } }),
    });
  }

  async function render(){
    const flags = SP.Model.openFlags();
    return String(html`
      ${when(flags.length, () => html`<div class="stack-sm mb-16">${map(flags, P.flagCard)}</div>`)}
      ${K.Ledger(() => [
        briefingCard(),
        K.Entry({ wide:true, label:'Masalar', meta:SP.AGENTS.length + ' ajan',
          note:'Her ajan yalnız kendi alanına bakar. Yetki dışına çıkmaz; '
            + 'çıkarsa çıktısı basılmaz.',
          body:html`<div class="desks">${map(SP.AGENTS, deskCard)}</div>` }),
        agendaCard(), decisionCard(),
        K.Entry({ label:'Yetki ayrımı', hint:'office', meta:'kim neye bakar',
          body:html`<ul class="bullets small muted">${map(SP.AGENTS, a => html`
            <li><b>${a.name}</b> — ${a.scope}</li>`)}</ul>` }),
      ])}
      <div class="mt-24">${raw(UI.rail(['office', 'grounding', 'no-model', 'privacy', 'decision']))}</div>`);
  }

  const handle = {
    async 'toggle-desk'(el){
      S.ui.officeDesk = S.ui.officeDesk === el.dataset.id ? null : el.dataset.id;
      SP.App.render();
    },
    async 'refresh-briefing'(){
      UI.toast('Brifing üretiliyor…');
      await SP.Office.dailyBriefing(true);
      SP.App.render();
    },
    async 'add-decision'(){
      UI.sheet({
        title:'Karar ekle',
        body:String(K.Stack([
          K.Field({ label:'Karar', input:K.Input({ id:'dec-title',
            placeholder:'Örnek: iki hafta boyunca çayı öğünden bir saat sonraya al' }) }),
          K.Field({ label:'Gerekçe', input:K.Textarea({ id:'dec-why', rows:2,
            placeholder:'Hangi bulguya dayanıyor?' }) }),
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Kaydet', tone:'primary', act:'save-decision' })}`),
      });
    },
    async 'save-decision'(){
      const t = document.getElementById('dec-title');
      const w = document.getElementById('dec-why');
      if(!t || !t.value.trim()){ UI.toast('Karar metni gerekli'); return; }
      await SP.Model.saveDecision({ title:t.value.trim(), why:w ? w.value.trim() : '' });
      UI.closeSheet();
      UI.toast('Karar takibe alındı');
      SP.App.render();
    },
    async 'close-decision'(el){
      const id = el.dataset.id;
      UI.sheet({
        title:'Kararı kapat',
        body:String(K.Field({ label:'Sonuç', input:K.Textarea({ id:'dec-out', rows:3,
          placeholder:'Ne değişti? Ölçümle, hisle değil.' }) })),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Kapat', tone:'primary', act:'save-close', data:{ 'data-id':id } })}`),
      });
    },
    async 'save-close'(el){
      const out = document.getElementById('dec-out');
      await SP.Model.closeDecision(el.dataset.id, out ? out.value.trim() : '');
      UI.closeSheet();
      UI.toast('Karar kapatıldı');
      SP.App.render();
    },
  };

  return {
    id:'office',
    title:'Ofis',
    headline(){
      const notes = SP.Office.notes();
      const loud = notes.filter(n => n.tone === 'danger' || n.tone === 'warn').length;
      if(!notes.length) return 'Masalar sessiz.';
      if(loud) return loud + ' masada dikkat isteyen not var.';
      return 'Masalarda ' + notes.length + ' not var.';
    },
    lede(){
      return 'Patron ekibi yönetir; Kerem laboratuvara, Nesrin beslenmeye, '
        + 'Barış harekete, Sedef ekonomiye bakar. Her not önce kural motorundan '
        + 'çıkar — model varsa onu yeniden yazar, yerine geçmez.';
    },
    stats(){
      const notes = SP.Office.notes();
      const open = SP.Model.openDecisions().length;
      const out = [{ value:notes.length, label:'masa notu' }];
      if(open) out.push({ value:open, label:'karar takipte' });
      return out;
    },
    subtitle(){
      const n = SP.Office.notes();
      const open = SP.Model.openDecisions().length;
      return n.length + ' masa notu' + (open ? ' · ' + open + ' karar takipte' : '');
    },
    actions(){
      return String(K.Button({ label:'Toplantı', size:'sm', icon:'users', class:'btn--screen',
        act:'go', data:{ 'data-route':'meeting' } }));
    },
    render, handle,
  };
})();

/* ==== js/screens/team.js ==== */
/* Danışma — bir ajana doğrudan soru sormak.

   Ajan yalnızca kendi brifingini görür ve alan dışına çıkmaz. Cevabın
   altındaki rozet cümlenin nereden geldiğini söyler: model mi, kural motoru mu.

   Model çıktısı ev kurallarına takılırsa cümle basılmaz; yerine kural
   motorunun cümlesi geçer ve neden engellendiği yazılır. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.team = (function(){
  const U = SP.U, S = SP.S, UI = SP.UI;
  const { html, raw, when, map, cls } = SP.h;
  const K = SP.C, P = SP.Parts;

  let busy = false;

  function current(){
    return SP.AGENT_BY_ID[S.ui.officeAgent] || SP.AGENT_BY_ID.patron;
  }

  function tabsCard(){
    return html`<div class="agenttabs">${map(SP.AGENTS, a => html`
      <button class="${cls('agenttab', a.id === S.ui.officeAgent && 'is-on')}"
        data-act="pick-agent" data-id="${a.id}" aria-pressed="${a.id === S.ui.officeAgent}">
        ${P.avatar(a.id, 'sm')}
        <span><b>${a.name}</b><span class="tiny dim"> ${a.title}</span></span>
      </button>`)}</div>`;
  }

  function chatCard(){
    const a = current();
    const msgs = S.officeChats[a.id] || [];
    return K.Card({
      title:a.name, sub:a.role,
      badge:SP.Office.ready(a.id) ? K.Badge({ label:'model açık', tone:'info' })
        : K.Badge({ label:'kural motoru', tone:'muted', icon:false }),
      body:html`
        <div class="chat">
          <div class="msg msg--agent">
            ${P.avatar(a.id, 'sm')}
            <div class="msg__body"><p class="small">${a.opening}</p></div>
          </div>
          ${map(msgs, m => html`
            <div class="${cls('msg', m.role === 'user' ? 'msg--me' : 'msg--agent')}">
              ${when(m.role !== 'user', () => P.avatar(a.id, 'sm'))}
              <div class="msg__body">
                <p class="small">${m.text}</p>
                ${when(m.role !== 'user', () => html`<div class="row-sm mt-4">
                  ${P.sourceBadge(m.source)}
                  ${when(m.blocked, () => K.Badge({ label:'kurallara takıldı', tone:'warn' }))}
                  ${when(m.error, () => K.Badge({ label:'bağlantı hatası', tone:'danger' }))}
                </div>`)}
              </div>
            </div>`)}
          ${when(busy, () => html`<div class="msg msg--agent">${P.avatar(a.id, 'sm')}
            <div class="msg__body">${K.Skeleton({ rows:2 })}</div></div>`)}
        </div>`,
      foot:html`
        <div class="quick">
          ${K.Mic({ target:'chat-text' })}
          ${K.Input({ id:'chat-text', placeholder:'Sorunu yaz ya da mikrofona söyle…', aria:'Soru' })}
          ${K.Button({ label:'Gönder', tone:'primary', act:'send-chat', disabled:busy })}
        </div>`,
    });
  }

  function scopeCard(){
    const a = current();
    return K.Card({
      title:'Bu ajan neye bakar?',
      body:html`
        ${K.Table({ tight:true, headers:['Alan', 'Kapsam'], rows:[
          ['Bakar', a.scope],
          ['Bakmaz', a.notScope],
          ['Alan dışında', a.redirect],
        ] })}
        ${K.Notice({ tone:'info', class:'mt-10', title:'Modele ne gider?',
          body:SP.PRIVACY.model })}`,
      foot:K.Button({ label:'Sohbeti temizle', size:'sm', act:'clear-chat' }),
    });
  }

  function briefCard(){
    const a = current();
    const b = SP.Office.brief(a.id);
    return K.Collapsible({
      title:'Ajanın gördüğü brifing', meta:'JSON', act:'toggle-brief',
      open:!!S.ui.briefOpen,
      body:html`<pre class="codeblock">${JSON.stringify(b, null, 2)}</pre>
        <p class="small muted mt-8">Ajan hesap yapmaz: bütün sayılar bu brifingden gelir.
          Brifingde olmayan bir sayıyı yazamaz.</p>`,
    });
  }

  function suggestCard(){
    const a = current();
    const qs = ({
      patron:['Bu hafta neye odaklanmalıyım?', 'Çelişki varsa hangisi öncelikli?',
        'Bütçe ile sağlık hedefi çakışıyor mu?'],
      lab:['Hangi ölçümüm en çok dikkat istiyor?', 'Eğilimi kötüye giden bir değer var mı?',
        'Hangi paneli yenilemeliyim?'],
      nutri:['En büyük açığım hangisi?', 'Demir emilimimi ne bozuyor?',
        'Bugünkü öğünlerim hedefi tutturdu mu?'],
      move:['Bugün ne kadar yüklenmeliyim?', 'Aşırı yükleniyor muyum?',
        'Hangi harekette üst basamağa geçebilirim?'],
      money:['Nereden tasarruf edebilirim?', 'Sepetim besin ihtiyacımı karşılıyor mu?',
        'Toplu alım yapmalı mıyım?'],
    })[a.id] || [];
    return K.Card({
      title:'Sorabileceklerin',
      body:html`<div class="stack-xs">${map(qs, q => K.Button({ label:q, size:'sm', block:true,
        act:'quick-ask', data:{ 'data-q':q } }))}</div>`,
    });
  }

  async function render(){
    return String(html`
      <div class="mb-8">${tabsCard()}</div>
      ${K.Ledger(() => [chatCard(), scopeCard(), suggestCard(), briefCard()])}
      <div class="mt-24">${raw(UI.rail(['office', 'grounding', 'no-model', 'privacy']))}</div>`);
  }

  async function send(text){
    if(busy || !text.trim()) return;
    busy = true;
    SP.App.render();
    try{
      await SP.Office.send(current().id, text.trim());
    }finally{
      busy = false;
      SP.App.render();
    }
  }

  const handle = {
    async 'pick-agent'(el){ S.ui.officeAgent = el.dataset.id; SP.App.render(); },
    async 'toggle-brief'(){ S.ui.briefOpen = !S.ui.briefOpen; SP.App.render(); },
    async 'send-chat'(){
      const el = document.getElementById('chat-text');
      if(!el) return;
      const text = el.value;
      el.value = '';
      await send(text);
    },
    async 'quick-ask'(el){ await send(el.dataset.q); },
    async 'clear-chat'(){
      await SP.Office.clearChat(current().id);
      UI.toast('Sohbet temizlendi');
      SP.App.render();
    },
  };

  return {
    id:'team',
    title:'Danışma',
    subtitle(){
      const a = current();
      return a.name + ' · ' + a.title;
    },
    actions(){ return ''; },
    render, handle,
  };
})();

/* ==== js/screens/meeting.js ==== */
/* Toplantı — dört uzman konuşur, Patron kapatır.

   Gündem kural motorunun puanlamasından gelir; model gündem seçmez.
   Her tur ayrı bir çağrıdır ve ekrana geldiği anda basılır, hepsi bitmeyi
   beklemez: uzun süren bir toplantıda kullanıcı ilerlemeyi görür.

   Kapanışta Patron çelişkiyi SP.PRECEDENCE sırasına göre çözer ve tek bir
   karar yazar. Kararın kendisi kural motorundan gelir; Patron gerekçelendirir. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.meeting = (function(){
  const U = SP.U, S = SP.S, UI = SP.UI;
  const { html, raw, when, map, cls } = SP.h;
  const K = SP.C, P = SP.Parts;

  let running = false;
  let live = null;     /* devam eden toplantının şu ana kadarki turları */

  function agendaCard(){
    const rows = SP.Office.agendaCandidates();
    const sel = Math.min(S.ui.meetingAgenda, rows.length - 1);
    return K.Card({
      title:'Gündem',
      sub:'Puanlama kural motorundan gelir; model gündem seçmez',
      body:html`<div class="list">${map(rows, (a, i) => html`
        <button class="${cls('listitem', 'listitem--tap', i === sel && 'is-on')}"
          data-act="pick-agenda" data-i="${i}">
          <div class="grow">
            <b class="small">${a.label}</b>
            ${K.Badge({ label:String(a.score),
              tone:a.score >= 65 ? 'danger' : a.score >= 40 ? 'warn' : 'muted' })}
            <div class="tiny dim">${a.detail}</div>
            <div class="tiny dim">${a.note}</div>
          </div>
          ${P.avatar(a.owner, 'sm')}
        </button>`)}</div>`,
      foot:html`${K.Button({ label:running ? 'Toplantı sürüyor…' : 'Toplantıyı başlat',
        tone:'primary', size:'sm', act:'run-meeting', disabled:running })}
        <span class="small dim">Beş çağrı harcanır: dört uzman ve kapanış.
          Model kapalıysa hepsi kural motoru cümlesidir.</span>`,
    });
  }

  function turnBlock(t, closing){
    const a = SP.AGENT_BY_ID[t.agent];
    return html`
      <div class="${cls('meetturn', closing && 'meetturn--closing')}">
        <div class="meetturn__who">
          ${P.avatar(t.agent, 'sm')}
          <b>${t.name}</b>
          <span class="dim">${a ? a.title : ''}</span>
          ${P.sourceBadge(t.source)}
        </div>
        <div class="meetturn__body">${t.text}</div>
      </div>`;
  }

  function liveCard(){
    if(!live) return null;
    return K.Card({
      title:'Toplantı sürüyor', sub:live.agenda.label,
      body:html`<div class="meet">
        ${map(live.turns, t => turnBlock(t, false))}
        ${when(running, () => html`<div class="meetturn is-live">
          ${K.Skeleton({ rows:2 })}</div>`)}
      </div>`,
    });
  }

  function minutesCard(rec){
    return K.Card({
      title:'Tutanak', sub:rec.agenda.label + ' · ' + U.fmtDate(rec.date),
      badge:P.sourceBadge(rec.source),
      body:html`
        <p class="small dim">${rec.agenda.detail}</p>
        <div class="meet mt-12">
          ${map(rec.turns, t => turnBlock(t, false))}
          ${turnBlock({ agent:'patron', name:'Patron', text:rec.closing, source:rec.source }, true)}
        </div>
        ${when(rec.decision && !rec.decision.calm, () => K.Notice({ tone:'info', class:'mt-12',
          title:'Kural motorunun kararı:',
          body:rec.decision.title + ' — ' + rec.decision.why }))}`,
      foot:html`${K.Button({ label:'Kararı takibe al', size:'sm', tone:'primary',
        act:'track-decision', data:{ 'data-id':rec.id } })}`,
    });
  }

  function historyCard(){
    const rows = S.officeMeetings;
    if(!rows.length){
      return K.Card({ title:'Geçmiş toplantılar',
        body:K.Empty({ text:'Henüz toplantı yapılmadı.' }) });
    }
    return K.Card({
      title:'Geçmiş toplantılar', sub:rows.length + ' tutanak',
      body:html`<div class="list">${map(rows.slice(0, 12), m => html`
        <div class="listitem">
          <div class="grow"><b class="small">${m.agenda.label}</b>
            <div class="tiny dim">${U.fmtDate(m.date)} · ${m.turns.length + 1} tur</div></div>
          ${K.Button({ label:S.ui.meetingOpen === m.id ? 'Kapat' : 'Aç', size:'sm',
            act:'open-minutes', data:{ 'data-id':m.id } })}
        </div>`)}</div>`,
    });
  }

  async function render(){
    const open = S.officeMeetings.find(m => m.id === S.ui.meetingOpen);
    return String(html`
      ${K.Ledger(() => [
        agendaCard(), liveCard(), open ? minutesCard(open) : null, historyCard(),
        K.Entry({ label:'Çelişki nasıl çözülür?', hint:'office', meta:'öncelik sırası',
          note:'Üstteki sıra alttakini her zaman yener. Bu tartışmaya açık değildir; '
            + 'Patron da buna uyar.',
          body:K.Table({ tight:true, headers:['Sıra', 'Kural', 'Neden'],
            rows:SP.PRECEDENCE.map(p => [String(p.rank), html`<b>${p.label}</b>`,
              html`<span class="small">${p.note}</span>`]) }) }),
      ])}
      <div class="mt-24">${raw(UI.rail(['office', 'grounding', 'decision', 'no-model']))}</div>`);
  }

  const handle = {
    async 'pick-agenda'(el){ S.ui.meetingAgenda = Number(el.dataset.i); SP.App.render(); },
    async 'run-meeting'(){
      if(running) return;
      const rows = SP.Office.agendaCandidates();
      const pick = rows[Math.min(S.ui.meetingAgenda, rows.length - 1)];
      running = true;
      live = { agenda:pick, turns:[] };
      SP.App.render();
      try{
        const rec = await SP.Office.runMeeting(pick.id, turn => {
          live.turns.push(turn);
          SP.App.render();
        });
        S.ui.meetingOpen = rec.id;
        UI.toast('Toplantı tamamlandı');
      }catch(e){
        UI.toast('Toplantı tamamlanamadı: ' + (e && e.message ? e.message : e));
      }finally{
        running = false;
        live = null;
        SP.App.render();
      }
    },
    async 'open-minutes'(el){
      S.ui.meetingOpen = S.ui.meetingOpen === el.dataset.id ? null : el.dataset.id;
      SP.App.render();
    },
    async 'track-decision'(el){
      const rec = S.officeMeetings.find(m => m.id === el.dataset.id);
      if(!rec) return;
      const d = rec.decision;
      await SP.Model.saveDecision({
        title:d && !d.calm ? d.title : rec.agenda.label,
        why:d && !d.calm ? d.why : rec.agenda.detail,
      });
      UI.toast('Karar takibe alındı');
      SP.App.render();
    },
  };

  return {
    id:'meeting',
    title:'Toplantı',
    subtitle(){
      if(running) return 'Toplantı sürüyor…';
      const rows = SP.Office.agendaCandidates();
      return rows.length ? 'Gündem: ' + rows[0].label : 'Gündem yok';
    },
    actions(){ return ''; },
    render, handle,
  };
})();

/* ==== js/screens/family.js ==== */
/* Hane — profiller ve kişisel hedefler.

   Her profil kendi depo anahtarında yaşar; tahlil ve ölçüm verisi profiller
   arasında karışmaz. Hane listesi yalnızca ad, rol ve temel ölçüleri taşır —
   ham sağlık verisi listeye hiç girmez.

   Profil geçişi sayfayı yeniden yükler: yarım kalmış bir yazma işleminin
   yanlış profile düşmesi böylece imkânsızdır. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.family = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  function profileCard(){
    const p = S.profile;
    const t = SP.Nutri.targets();
    return K.Card({
      title:'Profilin', hint:'profiles',
      sub:p.name || 'adsız profil',
      badge:t.ok ? K.Badge({ label:'hedefler hazır', tone:'ok' })
        : K.Badge({ label:t.missing.length + ' alan eksik', tone:'warn' }),
      body:html`
        <div class="grid-form">
          ${K.Field({ label:'Ad', input:K.Input({ id:'p-name', value:p.name || '' }) })}
          ${K.Field({ label:'Doğum yılı',
            input:K.Input({ id:'p-birth', type:'number', numeric:true, min:1900, max:2026,
              value:p.birthYear || '' }) })}
          ${K.Field({ label:'Cinsiyet',
            input:K.Select({ id:'p-sex', value:p.sex, options:[
              { value:'male', label:'Erkek' }, { value:'female', label:'Kadın' }] }) })}
          ${K.Field({ label:'Boy (cm)',
            input:K.Input({ id:'p-height', type:'number', numeric:true, min:80, max:230,
              value:p.heightCm || '' }) })}
          ${K.Field({ label:'Kilo (kg)',
            input:K.Input({ id:'p-weight', type:'number', numeric:true, step:'0.1', min:20, max:250,
              value:p.weightKg || '' }) })}
          ${K.Field({ label:'Hareket düzeyi',
            input:K.Select({ id:'p-activity', value:p.activity,
              options:SP.ACTIVITY_LEVELS.map(a => ({ value:a.id, label:a.label })) }) })}
          ${K.Field({ label:'Hedef',
            input:K.Select({ id:'p-goal', value:p.goal,
              options:SP.GOALS.map(g => ({ value:g.id, label:g.label })) }) })}
        </div>
        ${when(!t.ok, () => K.Notice({ tone:'warn', class:'mt-12',
          body:'Eksik alan: ' + t.missing.join(', ') + '. Bunlar olmadan kalori ve protein '
             + 'hedefi hesaplanmaz — tahmin edilmez.' }))}`,
      foot:K.Button({ label:'Kaydet', tone:'primary', act:'save-profile' }),
    });
  }

  function targetCard(){
    const t = SP.Nutri.targets();
    if(!t.ok) return null;
    const lvl = SP.ACTIVITY_LEVELS.find(a => a.id === S.profile.activity);
    return K.Card({
      title:'Hesaplanan hedefler', hint:'macro-target',
      sub:t.goal.label,
      body:html`
        ${K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
          ['Bazal metabolizma', U.fmtNum(t.bmr) + ' kcal'],
          ['Hareket çarpanı', '×' + U.fmtNet(SP.Nutri.activityFactor()) + (lvl ? ' — ' + lvl.note : '')],
          ['Günlük ihtiyaç', U.fmtNum(t.tdee) + ' kcal'],
          ['Hedef kalori', U.fmtNum(t.kcal) + ' kcal' + (t.goal.deficit ? ' · ' + t.goal.note : '')],
          ['Protein', t.protein.min + '–' + t.protein.max + ' g'],
          ['Yağ', t.fat.min + '–' + t.fat.max + ' g'],
          ['Karbonhidrat', t.carb.min + '–' + t.carb.max + ' g'],
          ['Lif', t.fiber + ' g'],
        ] })}
        ${when(Object.keys(t.adjustments).length, () => K.Notice({ tone:'info', class:'mt-12',
          title:'Laboratuvara göre yükseltilenler:',
          body:html`<ul class="bullets small mt-4">${map(Object.keys(t.adjustments), k => html`
            <li><b>${SP.NUTRI_BY_ID[k] ? SP.NUTRI_BY_ID[k].name : k}</b> ×${U.fmtNet(t.adjustments[k].mult)}
              — ${t.adjustments[k].why}</li>`)}</ul>` }))}
        <p class="small muted mt-10">${SP.MACRO_RULES.protein.note}</p>`,
    });
  }

  function householdCard(){
    const list = M.householdList();
    const active = M.activeProfileId();
    return K.Card({
      title:'Hanedeki profiller', hint:'profiles',
      sub:list.length + ' profil',
      body:html`
        ${K.Notice({ tone:'info', body:'Her profil kendi depo anahtarında durur. '
          + 'Profil değiştirdiğinde bütün veri seti değişir; veriler karışmaz.' })}
        <div class="list mt-12">${map(list, row => html`
          <div class="listitem">
            <div class="grow">
              <b class="small">${row.name || 'Adsız'}</b>
              ${when(row.id === active, () => K.Badge({ label:'açık', tone:'ok' }))}
              <div class="tiny dim">${row.role === 'self' ? 'birincil' : 'aile'}
                ${when(row.birthYear, () => html`· ${new Date().getFullYear() - row.birthYear} yaşında`)}
                ${when(row.seenAt, () => html`· son ${U.fmtShort(row.seenAt.slice(0, 10))}`)}</div>
            </div>
            ${when(row.id !== active, () => K.Button({ label:'Geç', size:'sm',
              act:'switch-profile', data:{ 'data-id':row.id } }))}
            ${when(row.id !== active, () => K.IconButton({ icon:'trash', size:'sm', plain:true,
              aria:'Listeden çıkar', act:'remove-profile', data:{ 'data-id':row.id } }))}
          </div>`)}</div>`,
      foot:K.Button({ label:'Profil ekle', size:'sm', tone:'primary', act:'add-profile' }),
    });
  }

  /* Görünüm tercihleri ANINDA uygulanır, «Kaydet»i beklemez.

     Beklemesi hataydı: kullanıcı listeden «Harita»yı seçiyor, ekranda
     hiçbir şey değişmiyor ve düzenin çalışmadığını sanıyordu. Bir
     görünüm tercihinin karşılığı ancak görülerek anlaşılır; onay
     düğmesinin arkasına saklanamaz.

     Kaydet düğmesi yalnız hane sayısı için kalır. */
  function prefCard(){
    const p = S.prefs || M.defaultPrefs();
    const design = S.profile.design || SP.DEFAULT_DESIGN;
    return K.Card({
      title:'Görünüm ve hane ayarı',
      body:html`
        <div class="grid-form">
          ${K.Field({ label:'Tema',
            input:K.Select({ id:'pref-theme', change:'set-look', value:S.profile.theme, options:[
              { value:'system', label:'Sistem' }, { value:'light', label:'Açık' },
              { value:'dark', label:'Koyu' }] }) })}
          ${K.Field({ label:'Palet',
            input:K.Select({ id:'pref-palette', change:'set-look',
              value:S.profile.palette || SP.DEFAULT_PALETTE,
              options:SP.PALETTES.map(x => ({ value:x.id, label:x.name })) }) })}
          ${K.Field({ label:'Düzen', hint:SP.DESIGN_BY_ID[design].note,
            input:K.Select({ id:'pref-design', change:'set-look', value:design,
              options:SP.DESIGNS.map(x => ({ value:x.id, label:x.name })) }) })}
          ${K.Field({ label:'Hanedeki kişi sayısı', hint:'sepet hesabı için',
            input:K.Input({ id:'pref-size', type:'number', numeric:true, min:1, max:20,
              value:p.householdSize || 1 }) })}
        </div>
        ${K.Notice({ tone:'info', class:'mt-10',
          body:'Tema, palet ve düzen seçildiği anda uygulanır. «Kaydet» yalnız '
            + 'hanedeki kişi sayısı için.' })}`,
      foot:K.Button({ label:'Kaydet', size:'sm', tone:'primary', act:'save-prefs' }),
    });
  }

  async function render(){
    return String(html`
      ${K.Ledger(() => [profileCard(), targetCard(), householdCard(), prefCard()])}
      <div class="mt-24">${raw(UI.rail(['profiles', 'macro-target', 'lab-linked-food', 'privacy']))}</div>`);
  }

  /* Üç görünüm listesi de tek bir değişiklik işlevine bağlanır: hangisi
     değiştiyse o okunur, profile yazılır ve kök hemen güncellenir. */
  const change = {
    async 'set-look'(){
      const val = id => { const el = document.getElementById(id); return el ? el.value : null; };
      const patch = {};
      const theme = val('pref-theme');
      const palette = val('pref-palette');
      const design = val('pref-design');
      if(theme) patch.theme = theme;
      if(palette) patch.palette = palette;
      if(design && SP.DESIGN_BY_ID[design]) patch.design = design;
      await M.saveProfile(patch);
      SP.App.applyTheme();
      SP.App.render();
    },
  };

  const handle = {
    async 'save-profile'(){
      const get = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const numOr = v => v === '' ? null : Number(String(v).replace(',', '.'));
      await M.saveProfile({
        name:get('p-name'),
        birthYear:numOr(get('p-birth')),
        sex:get('p-sex') || 'male',
        heightCm:numOr(get('p-height')),
        weightKg:numOr(get('p-weight')),
        activity:get('p-activity') || 'moderate',
        goal:get('p-goal') || 'health',
      });
      /* Kilo profilde tutulur ama gunluk olcum de ayni gun kaydini besler:
         tek yerde yazilir, iki yerde okunur diye ikisi de guncellenir. */
      const w = numOr(get('p-weight'));
      if(w) await M.saveVitals(U.todayISO(), { weight:w });
      UI.toast('Profil kaydedildi');
      SP.App.render();
    },
    async 'save-prefs'(){
      const size = (document.getElementById('pref-size') || {}).value;
      await M.savePrefs({ householdSize:Math.max(1, Number(size) || 1) });
      UI.toast('Kaydedildi');
      SP.App.render();
    },
    async 'add-profile'(){
      UI.sheet({
        title:'Profil ekle', subtitle:'Aile bireyi ya da ikinci profil',
        body:String(K.Stack([
          K.Field({ label:'Ad', input:K.Input({ id:'np-name', placeholder:'Örnek: Ayşe' }) }),
          K.Field({ label:'Cinsiyet', input:K.Select({ id:'np-sex', value:'female', options:[
            { value:'female', label:'Kadın' }, { value:'male', label:'Erkek' }] }) }),
          K.Field({ label:'Doğum yılı',
            input:K.Input({ id:'np-birth', type:'number', numeric:true, min:1900, max:2026 }) }),
          K.Notice({ tone:'info', body:'Profil eklendikten sonra ona geçip kilo, boy ve hedefini '
            + 'girmen gerekir. Eksik profil porsiyon paylaştırmasına girmez.' }),
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Ekle', tone:'primary', act:'save-new-profile' })}`),
      });
    },
    async 'save-new-profile'(){
      const name = (document.getElementById('np-name') || {}).value || '';
      if(!name.trim()){ UI.toast('Ad gerekli'); return; }
      const res = M.addHouseholdMember(name.trim(), {
        sex:(document.getElementById('np-sex') || {}).value,
        birthYear:Number((document.getElementById('np-birth') || {}).value) || null,
      });
      if(!res.ok){ UI.toast(res.error); return; }
      UI.closeSheet();
      UI.toast('Profil eklendi');
      SP.App.render();
    },
    async 'switch-profile'(el){
      const id = el.dataset.id;
      UI.confirmSheet('Profili değiştir',
        'Sayfa yeniden yüklenir ve bu profilin verileri açılır. Kaydedilmemiş bir alan varsa kaybolur.',
        () => M.switchProfile(id));
    },
    async 'remove-profile'(el){
      const id = el.dataset.id;
      UI.confirmSheet('Listeden çıkar',
        'Profil listeden çıkar ama VERİSİ SİLİNMEZ; kendi anahtarında durmaya devam eder. '
        + 'Aynı adla yeniden eklersen veriler geri gelir.',
        async () => {
          const res = M.removeHouseholdMember(id);
          UI.closeSheet();
          UI.toast(res.ok ? 'Listeden çıkarıldı' : res.error);
          SP.App.render();
        });
    },
  };

  return {
    id:'family',
    title:'Hane',
    headline(){
      const t = SP.Nutri.targets();
      if(!t.ok) return 'Profil eksik.';
      const list = M.householdList();
      return list.length > 1 ? list.length + ' kişilik hane.' : 'Profil hazır.';
    },
    lede(){
      const t = SP.Nutri.targets();
      if(!t.ok) return 'Kilo, boy ve doğum yılı girilince bütün hedefler '
        + 'kendiliğinden hesaplanır. Bu üçü olmadan hiçbir sayı tahmin edilmez.';
      return 'Hedefler, görünüm ve hane üyeleri burada. Her profil kendi '
        + 'temasını ve hedefini taşır.';
    },
    subtitle(){
      const list = M.householdList();
      const t = SP.Nutri.targets();
      return list.length + ' profil · ' + (t.ok ? 'hedefler hazır' : 'profil eksik');
    },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/guide.js ==== */
/* Rehber ve ayarlar.

   Dört sekme: kullanım, model ayarları, veri (yedek) ve sınırlar.
   Sınırlar sekmesi süs değildir: sistemin ne yapmayacağı, verinin nereye
   gittiği ve kırmızı bayrak protokolü orada açıkça yazar. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.guide = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  const TABS = [
    { id:'kullanim', label:'Kullanım', icon:'guide' },
    { id:'model',    label:'Model',    icon:'zap' },
    { id:'veri',     label:'Veri',     icon:'layers' },
    { id:'sinir',    label:'Sınırlar', icon:'shield' },
  ];

  /* ------------------------------------------------------------ kullanim */

  function howCard(){
    const rows = [
      ['Öğün girmek', 'Besin → Öğünler sayfasında tek satır yaz: «1 tabak etli kuru fasulye, 1 bardak ayran». '
        + 'Ev ölçüsü tanınır ve gramaj tahmin olarak işaretlenir.'],
      ['Test girmek', 'Testler → Rapor yapıştır ya da Test gir. Laboratuvar metnini olduğu gibi yapıştır; '
        + 'eşleşen değerler listelenir, eşleşmeyen satırlar da gösterilir.'],
      ['Günlük ölçüm', 'Günlük ölçüm ekranında uyku, nabız ve hissettiğin hâl. '
        + 'Hepsi zorunlu değil: eksik girdi sıfır sayılmaz.'],
      ['Antrenman', 'Hareket bölümü kardiyo, kuvvet, esneklik ve dinlenme sayfalarına ayrılır; Bugün sayfası günün yük emrini verir. Emri toparlanma belirler, istek değil.'],
      ['Bütçe', 'Finans → Sepet sayfasına haftalık alışverişi gir; Bütçe sayfası koçların talebini toplar. Fiyatı kendi fişinden düzeltince '
        + 'hesap tahminden ölçüme geçer.'],
      ['Ofis', 'Beş ajan kendi alanına bakar. Danışma ekranından birine doğrudan soru sorabilirsin.'],
    ];
    return K.Card({ title:'Nasıl kullanılır', body:K.Table({ tight:true,
      headers:['İş', 'Yol'], rows:rows.map(r => [html`<b>${r[0]}</b>`, html`<span class="small">${r[1]}</span>`]) }) });
  }

  function moduleCard(){
    return K.Card({
      title:'Beş modül',
      body:html`<div class="list">${map(SP.AGENTS, a => html`
        <div class="listitem">
          ${P.avatar(a.id, 'sm')}
          <div class="grow">
            <b class="small">${a.title} — ${a.name}</b>
            <div class="tiny dim">${a.scope}</div>
            <div class="tiny dim">Bakmaz: ${a.notScope}</div>
          </div>
        </div>`)}</div>`,
    });
  }

  function precedenceCard(){
    return K.Card({
      title:'Öncelik sırası', hint:'office',
      sub:'Üstteki alttakini her zaman yener',
      body:K.Table({ tight:true, headers:['Sıra', 'Kural', 'Neden'],
        rows:SP.PRECEDENCE.map(p => [String(p.rank), html`<b>${p.label}</b>`,
          html`<span class="small">${p.note}</span>`]) }),
    });
  }

  /* --------------------------------------------------------------- model */

  function modelCard(){
    const s = SP.Office.settings();
    const provider = SP.PROVIDERS[s.provider];
    const models = provider ? provider.models : [];
    return K.Card({
      title:'Model ayarları', hint:'no-model',
      sub:'Ofis modelsiz de çalışır',
      badge:SP.LLM.ready({ provider:s.provider, model:s.model })
        ? K.Badge({ label:'hazır', tone:'ok' }) : K.Badge({ label:'kapalı', tone:'muted' }),
      body:html`
        ${K.Notice({ tone:'info', body:SP.GROUNDING.noModel + ' ' + SP.GROUNDING.authority })}
        <div class="grid-form mt-12">
          ${K.Field({ label:'Sağlayıcı',
            input:K.Select({ id:'m-provider', value:s.provider, change:'pick-provider',
              options:Object.keys(SP.PROVIDERS).map(id => ({ value:id, label:SP.PROVIDERS[id].label })) }) })}
          ${K.Field({ label:'Model',
            input:K.Select({ id:'m-model', value:s.model,
              options:models.map(m => ({ value:m.id, label:m.label })) }) })}
        </div>
        ${when(provider && provider.note, () => html`<p class="small muted mt-8">${provider.note}</p>`)}
        ${when(provider && provider.needsKey, () => html`<div class="mt-12">
          ${K.Field({ label:'API anahtarı', hint:provider.keyHint || '',
            input:K.Input({ id:'m-key', type:'password',
              placeholder:SP.LLM.getKeys(provider.id).length
                ? SP.LLM.maskKeys(provider.id).join(', ') : 'anahtar yapıştır' }) })}
          <p class="small muted mt-4">Anahtar yalnızca bu tarayıcıda, uygulama verisinden ayrı bir
            anahtarda durur. Yedeğe girmez, buluta gitmez, modele gönderilmez.</p>
        </div>`)}`,
      foot:html`${K.Button({ label:'Kaydet', size:'sm', tone:'primary', act:'save-model' })}
        ${K.Button({ label:'Bağlantıyı dene', size:'sm', act:'test-model' })}`,
    });
  }

  function quotaCard(){
    const s = SP.Office.settings();
    const st = SP.Quota.status({ provider:s.provider, model:s.model });
    if(!st) return null;
    return K.Card({
      title:'Kullanım hakkı',
      body:K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
        ['Son dakikada', String(st.lastMinute)],
        ['Bugün kullanılan', String(st.usedToday)],
        ['Bugün kalan', st.remainingToday == null ? 'sınırsız' : String(st.remainingToday)],
      ] }),
      foot:html`<span class="small dim">Ofis günde bir brifing, toplantı başına beş çağrı harcar.</span>`,
    });
  }

  /* ---------------------------------------------------------------- veri */

  function dataCard(){
    const f = M.dataFootprint();
    const age = M.backupAgeDays();
    return K.Card({
      title:'Veri ve yedek', hint:'backup',
      badge:M.backupDue() ? K.Badge({ label:'yedek gerekiyor', tone:'warn' })
        : K.Badge({ label:'yedek güncel', tone:'ok' }),
      body:html`
        ${K.Table({ tight:true, headers:['Kayıt', { label:'Adet', num:true }], rows:[
          ['Tahlil oturumu', String(f.labs)],
          ['Ölçüm günü', String(f.vitalDays)],
          ['Öğün günü', String(f.mealDays)],
          ['Antrenman', String(f.workouts)],
          ['Kapladığı alan', U.fmtNum(Math.round(f.bytes / 1024)) + ' KB · %' + f.pct],
        ] })}
        ${when(f.near, () => K.Notice({ tone:'warn', class:'mt-10',
          body:'Tarayıcı depolama alanının %' + f.pct + '\'i dolu. Yedek al ve eski kayıtları temizle.' }))}
        ${K.Notice({ tone:'info', class:'mt-10',
          body:age == null ? 'Henüz yedek alınmadı.' : 'Son yedek ' + age + ' gün önce.' })}`,
      foot:html`${K.Button({ label:'Yedek indir', size:'sm', tone:'primary', act:'backup' })}
        ${K.Button({ label:'Yedek yükle', size:'sm', act:'restore' })}
        ${K.Button({ label:'Bütün veriyi sil', size:'sm', tone:'danger', act:'wipe' })}`,
    });
  }

  function storageCard(){
    const h = SP.Store.health();
    return K.Card({
      title:'Kayıt durumu',
      body:K.Table({ tight:true, headers:['Alan', 'Durum'], rows:[
        ['Kip', h.mode === 'cloud' ? 'hesaba bağlı kopya açık' : 'bu cihaz'],
        ['Bu cihaz', h.local === 'ok' ? K.Badge({ label:'çalışıyor', tone:'ok' })
          : K.Badge({ label:'hata', tone:'danger' })],
        ['Bulut', h.cloud === 'ok' ? K.Badge({ label:'çalışıyor', tone:'ok' })
          : h.cloud === 'off' ? K.Badge({ label:'kapalı', tone:'muted' })
          : K.Badge({ label:'hata', tone:'danger' })],
        ['Profil anahtarı', M.activeProfileId()],
      ] }),
    });
  }

  /* -------------------------------------------------------------- sinirlar */

  function clinicalCard(){
    return K.Card({
      title:'Klinik sınır',
      body:html`
        ${K.Notice({ tone:'warn', body:SP.CLINICAL.disclaimer })}
        <h3 class="section-h mt-12">Sistemin asla yapmayacağı şeyler</h3>
        <div class="list">${map(SP.CLINICAL.never, n => html`
          <div class="listitem"><div class="grow"><b class="small">${n.label}</b>
            <div class="tiny dim">${n.note}</div></div></div>`)}</div>
        <p class="small muted mt-10">${SP.CLINICAL.supplement}</p>`,
    });
  }

  function redFlagCard(){
    return K.Card({
      title:'Kırmızı bayrak protokolü', hint:'red-flag',
      body:html`
        <p class="small">${SP.RED_FLAGS.lead}</p>
        <h3 class="section-h mt-12">Birden fazla ölçümle tetiklenen örüntüler</h3>
        ${K.Table({ tight:true, headers:['Örüntü', 'Ne demek'],
          rows:SP.RED_FLAGS.patterns.map(p => [html`<b>${p.label}</b>`,
            html`<span class="small">${p.detail}</span>`]) })}
        <p class="small muted mt-10">Tek ölçümle tetiklenen eşikler her biyobelirtecin kendi
          tanımındadır ve Testler bölümünde görülebilir. Bayrak
          ${SP.RED_FLAGS.window} gün açık kalır; kapansa da kayıtta durur.</p>`,
    });
  }

  function privacyCard(){
    return K.Card({
      title:'Veri mahremiyeti', hint:'privacy',
      body:K.Table({ tight:true, headers:['Alan', 'Kural'], rows:[
        ['Saklama', SP.PRIVACY.storage],
        ['Model eğitimi', SP.PRIVACY.training],
        ['Modele giden', SP.PRIVACY.model],
        ['Yedek dosyası', SP.PRIVACY.export],
      ] }),
    });
  }

  function groundingCard(){
    return K.Card({
      title:'Halüsinasyon engeli', hint:'grounding',
      body:html`
        ${K.Table({ tight:true, headers:['Alan', 'Kural'], rows:[
          ['Otorite', SP.GROUNDING.authority],
          ['Karar', SP.GROUNDING.decision],
          ['Kaynak', SP.GROUNDING.sources],
          ['Model yoksa', SP.GROUNDING.noModel],
        ] })}
        <h3 class="section-h mt-12">Çıktı denetimi</h3>
        <p class="small muted">Model çıktısı basılmadan önce aşağıdaki desenlere karşı denetlenir.
          Bir ihlal bulunursa çıktı basılmaz; yerine kural motorunun cümlesi geçer.</p>
        ${K.Table({ tight:true, headers:['Denetim', 'Ne arar'],
          rows:SP.GROUNDING.banned.map(b => [html`<b>${b.why}</b>`,
            html`<code class="tiny">${String(b.re)}</code>`]) })}`,
    });
  }

  /* --------------------------------------------------------------- ekran */

  async function render(){
    const tab = S.ui.guideTab;
    const head = html`<div class="mb-8">${K.Subtabs({ items:TABS, value:tab,
      act:'guide-tab', aria:'Rehber görünümü' })}</div>`;

    if(tab === 'model'){
      return String(html`${head}
        ${K.Ledger(() => [modelCard(), quotaCard()])}
        <div class="mt-24">${raw(UI.rail(['no-model', 'grounding', 'privacy']))}</div>`);
    }
    if(tab === 'veri'){
      return String(html`${head}
        ${K.Ledger(() => [dataCard(), storageCard()])}
        <div class="mt-24">${raw(UI.rail(['backup', 'privacy', 'profiles']))}</div>`);
    }
    if(tab === 'sinir'){
      return String(html`${head}
        ${K.Ledger(() => [clinicalCard(), redFlagCard(), privacyCard(), groundingCard()])}
        <div class="mt-24">${raw(UI.rail(['red-flag', 'grounding', 'privacy', 'certainty']))}</div>`);
    }
    return String(html`${head}
      ${K.Ledger(() => [howCard(), moduleCard(), precedenceCard(),
        K.Entry({ label:'Asgari gün', hint:'minimum-day', meta:'kötü günün alt sınırı',
          body:html`<ul class="bullets small muted">
            <li>${SP.MINIMUM_DAY.protein}</li><li>${SP.MINIMUM_DAY.water}</li>
            <li>${SP.MINIMUM_DAY.move}</li><li>${SP.MINIMUM_DAY.sleep}</li></ul>` }),
      ])}
      <div class="mt-24">${raw(UI.rail(['minimum-day', 'next-action', 'certainty']))}</div>`);
  }

  const handle = {
    async 'guide-tab'(el){ S.ui.guideTab = el.dataset.tab; SP.App.render(); },
    async 'save-model'(){
      const provider = (document.getElementById('m-provider') || {}).value;
      const model = (document.getElementById('m-model') || {}).value;
      const key = (document.getElementById('m-key') || {}).value;
      if(key && key.trim()) SP.LLM.addKey(provider, key.trim());
      await SP.Office.saveSettings({ provider, model });
      UI.toast('Kaydedildi');
      SP.App.render();
    },
    async 'test-model'(){
      const s = SP.Office.settings();
      UI.toast('Deneniyor…');
      try{
        const res = await SP.LLM.test({ provider:s.provider, model:s.model });
        UI.toast(res && res.ok !== false ? 'Bağlantı çalışıyor' : 'Bağlantı kurulamadı');
      }catch(e){
        UI.toast('Hata: ' + (SP.LLM.errorText ? SP.LLM.errorText(e) : String(e && e.message || e)));
      }
      SP.App.render();
    },
    async backup(){
      const data = SP.Store.exportAll();
      const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'spi-yedek-' + U.todayISO() + '.json';
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 2000);
      await M.markBackup();
      UI.toast('Yedek indirildi');
      SP.App.render();
    },
    async restore(){
      const input = document.createElement('input');
      input.type = 'file';
      input.accept = 'application/json';
      input.onchange = async () => {
        const file = input.files && input.files[0];
        if(!file) return;
        try{
          const text = await file.text();
          const meta = await SP.Store.importAll(JSON.parse(text));
          UI.toast('Yedek yüklendi (şema ' + meta.schemaVersion + ') — sayfa yenileniyor');
          setTimeout(() => location.reload(), 900);
        }catch(e){
          UI.toast(e && e.message ? e.message : 'Yedek okunamadı');
        }
      };
      input.click();
    },
    async wipe(){
      UI.confirmSheet('Bütün veriyi sil',
        'Bu profildeki tahliller, ölçümler, öğünler ve antrenmanlar silinir. '
        + 'Geri alınamaz. Önce yedek al.',
        async () => {
          await SP.Store.clear();
          UI.closeSheet();
          location.reload();
        }, true);
    },
  };

  const change = {
    async 'pick-provider'(el){
      const p = SP.PROVIDERS[el.value];
      const first = p && p.models && p.models[0] ? p.models[0].id : '';
      await SP.Office.saveSettings({ provider:el.value, model:first });
      SP.App.render();
    },
  };

  return {
    id:'guide',
    title:'Rehber',
    subtitle(){
      const s = SP.Office.settings();
      return SP.LLM.ready({ provider:s.provider, model:s.model })
        ? 'Model açık · ' + (SP.PROVIDERS[s.provider] || {}).label
        : 'Model kapalı · kural motoru çalışıyor';
    },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/app.js ==== */
/* Uygulama kabuğu: gezinme, yönlendirme, olay dağıtımı ve açılış.

   Ekranlar birbirini tanımaz; hepsi bu kabuğun içinde yaşar ve yalnızca
   SP.S'yi okur. Bir ekranın çizilirken hata vermesi diğerlerini kapatmaz:
   hata paneline düşer, kenar çubuğu açılmaya devam eder. */

window.SP = window.SP || {};

SP.App = (function(){
  const U = SP.U, M = SP.Model, UI = SP.UI, S = SP.S;
  const { html, raw, when, map, cls, attrs } = SP.h;

  /* Yedi bölüm.

     Kullanıcı bu sistemi "tahlil mi hareket mi" diye değil, hayatının hangi
     alanına baktığına göre açar. Bölümler o alanlardır ve sırası kasıtlıdır:
     önce ölçülen (test), sonra ölçüme göre karar verilen (besin, hareket),
     sonra bunların bedeli (finans), sonra günün kaydı, sonra danışma, en
     sonda ayar.

     `views` bir bölümün sayfalarıdır. Tek sayfalı bölümde sayfa şeridi
     çizilmez: tek sekmelik bir sekme çubuğu gürültüden başka bir şey
     değildir. */
  const SECTIONS = [
    { id:'gunluk', num:'01', icon:'pulse', label:'Günlük',
      note:'Günün verisini gir, karşılığını gör',
      views:[{ route:'today', label:'Günlük', icon:'pulse' }] },

    { id:'testler', num:'02', icon:'flask', label:'Testler',
      note:'Hastane testini gir, sonucu izle',
      views:[{ route:'labs', label:'Testler', icon:'flask' }] },

    { id:'besin', num:'03', icon:'meal', label:'Besin',
      note:'Bazal metabolizma, hedef ve öğün önerisi',
      views:[
        { route:'meals',   label:'Öğünler', icon:'meal' },
        { route:'kitchen', label:'Mutfak',  icon:'leaf' },
      ] },

    { id:'hareket', num:'04', icon:'dumbbell', label:'Hareket',
      note:'Kardiyo, kuvvet, esneklik ve dinlenme',
      views:[{ route:'move', label:'Hareket', icon:'dumbbell' }] },

    { id:'finans', num:'05', icon:'wallet', label:'Finans',
      note:'Bu işin bütçesi',
      views:[{ route:'basket', label:'Finans', icon:'wallet' }] },

    { id:'ofis', num:'06', icon:'users', label:'Ofis',
      note:'Patron ve dört koç',
      views:[
        { route:'office',    label:'Masalar',  icon:'users' },
        { route:'team',      label:'Danışma',  icon:'zap' },
        { route:'meeting',   label:'Toplantı', icon:'list' },
        { route:'analytics', label:'Analiz',   icon:'chart' },
      ] },

    { id:'ayarlar', num:'07', icon:'sliders', label:'Ayarlar',
      note:'Hane, görünüm, veri ve rehber',
      views:[
        { route:'family', label:'Hane',   icon:'heart' },
        { route:'guide',  label:'Rehber', icon:'guide' },
      ] },
  ];

  /* Yönlendirme kimlikleri değişmedi; değişen yalnızca kullanıcıya görünen
     gruplama. Bu sayede komut paleti, testler ve derin bağlantılar bozulmaz. */
  const SECTION_OF = (function(){
    const m = {};
    SECTIONS.forEach(sec => sec.views.forEach(v => { m[v.route] = sec; }));
    return m;
  })();

  function sectionOf(route){ return SECTION_OF[route] || SECTIONS[0]; }


  function screen(){ return SP.Screens[S.route] || SP.Screens.today; }

  /* Kenar çubuğundaki sayaçlar — bekleyen işi gizlemez. */
  function badgeFor(id){
    if(id === 'labs'){
      const f = M.openFlags().filter(x => !x.ack).length;
      if(f) return { text:String(f), quiet:false };
      const due = SP.Bio.overdue().length;
      return due ? { text:String(due), quiet:true } : null;
    }
    if(id === 'today'){
      const v = S.vitals[U.todayISO()];
      return (!v || v.sleep == null) ? { text:'!', quiet:true } : null;
    }
    if(id === 'meals'){
      const g = SP.Nutri.gaps(7);
      return g.ok && g.rows.length ? { text:String(g.rows.length), quiet:true } : null;
    }
    if(id === 'office'){
      const n = SP.Office.notes().filter(x => x.tone === 'danger' || x.tone === 'warn').length;
      return n ? { text:String(n), quiet:true } : null;
    }
    if(id === 'basket'){
      const m = SP.Money.basketTotal();
      return m.over ? { text:'!', quiet:false } : null;
    }
    return null;
  }

  /* Marka satırı profilden gelir; sabit bir slogan yoktur. */
  function brandLine(){
    const p = S.profile;
    if(!p || !p.name) return 'kişisel sağlık sistemi';
    const goal = SP.GOALS.find(g => g.id === p.goal);
    return p.name + (goal ? ' · ' + goal.label.toLocaleLowerCase('tr-TR') : '');
  }

  function safe(fn, fallback){
    try{ return fn(); }
    catch(e){ console.error(e); return fallback || ''; }
  }

  /* Bölümün rozeti: içindeki sayfaların bekleyen işlerinin toplamı.
     Sesli olan (kırmızı) sessiz olanı yutar. */
  function sectionBadge(sec){
    let quiet = 0, loud = 0;
    sec.views.forEach(v => {
      const b = safe(() => badgeFor(v.route), null);
      if(!b) return;
      const n = b.text === '!' ? 1 : Number(b.text) || 1;
      if(b.quiet) quiet += n; else loud += n;
    });
    if(loud) return { text:String(loud), quiet:false };
    if(quiet) return { text:String(quiet), quiet:true };
    return null;
  }

  /* ---------- üst gezinme ----------

     Sabit sol menü yerine ince bir site çubuğu. Yedi bölüm tek satırda
     durur; dar ekranda menüye iner. Sağdaki üç araç her yerde aynı yerde
     kalır: arama, görünüm, ayarlar. */
  /* ---------- künye ----------

     Uygulama çubuğu değil KÜNYE. İki satır:

       1. kimlik · tarih · araçlar   — sayfayla birlikte yukarı kayar
       2. numaralı bölümler          — kaydırınca üstte yapışır

     İlk satırın kaymasına izin vermek kasıtlıdır: okurken kimliğe
     ihtiyaç yoktur, gezinmeye vardır. Böylece sabit kalan çubuk yarı
     yüksekliğe iner ve içerik nefes alır. */
  function mastheadHtml(sc){
    const now = new Date();
    const gun = now.toLocaleDateString('tr-TR', { weekday:'long' });
    return html`
      <div class="masthead">
        <div class="wrapc masthead__in">
          <button class="brand" data-act="go" data-route="today" aria-label="Günlük bölümüne git">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span class="brand__text"><b>SPİ</b><span>${brandLine()}</span></span>
          </button>

          <div class="masthead__date">
            <span class="masthead__day">${U.fmtDate(U.todayISO())}</span>
            <span class="masthead__wd">${gun}</span>
          </div>

          <div class="navtools">
            ${SP.C.IconButton({ icon:'search', aria:'Komut paleti (Ctrl+K)', title:'Ctrl+K', act:'open-palette' })}
            ${SP.C.IconButton({ icon:'palette', aria:'Görünüm', title:'Tema ve palet',
              act:'open-appearance', data:{ id:'appearance-btn' } })}
            ${SP.C.IconButton({ icon:'sliders', aria:'Ayarlar', act:'go', data:{ 'data-route':'family' } })}
            ${SP.C.IconButton({ icon:'menu', aria:'Bölümler', act:'toggle-menu', class:'sitenav__menu' })}
          </div>
        </div>
      </div>`;
  }

  /* Numaralı bölüm şeridi. Numara bir süs değil: yedi bölümün SIRASI
     anlamlıdır (önce yazılan, sonra okunan) ve numara o sırayı görünür
     kılar. */
  function sitenavHtml(sc){
    const active = sectionOf(sc.id);
    return html`
      <nav class="sitenav" aria-label="Bölümler">
        <div class="wrapc navlinks">${map(SECTIONS, sec => {
          const on = sec.id === active.id;
          const b = sectionBadge(sec);
          return html`<button class="${cls('navlink', on && 'is-active')}"
            data-act="go" data-route="${sec.views[0].route}"
            ${when(on, () => attrs({ 'aria-current':'page' }))}>
            <span class="navlink__num" aria-hidden="true">${sec.num}</span>
            <span class="navlink__label">${sec.label}</span>
            ${when(b, () => html`<span class="${cls('navlink__badge', b.quiet && 'is-quiet')}"
              aria-label="${b.text + ' bekleyen'}">${b.text}</span>`)}
          </button>`;
        })}</div>
      </nav>`;
  }

  /* ---------- alt bant ----------

     Her sayfa bir yerde biter. Koyu bant hem sayfayı sonlandırır hem de
     sistemin iki değişmez cümlesini —klinik sınır ve mahremiyet— her
     ekranda bir kez söyler. Bunları kart olarak sayfanın ortasına koymak
     her seferinde içeriği bölüyordu. */
  function footerHtml(){
    return html`
      <footer class="sitefoot">
        <div class="wrapc sitefoot__in">
          <div class="sitefoot__brand">
            <span class="brand__mark" aria-hidden="true">S</span>
            <div>
              <b>Sağlık Performans İzleyicisi</b>
              <span>Kişisel ve aile odaklı sağlık sistemi</span>
            </div>
          </div>
          <div class="sitefoot__notes">
            <p><span class="sitefoot__k">Sınır</span> ${SP.CLINICAL.disclaimer}</p>
            <p><span class="sitefoot__k">Mahremiyet</span> Veriler bu cihazda tutulur.
              Ad ve doğum yılı hiçbir modele gönderilmez.</p>
          </div>
        </div>
      </footer>`;
  }

  /* Dar ekranda bölümler tam ekran menüye açılır. Alt sekme çubuğu bir
     panel dilidir; site dilinde karşılığı budur. */
  function navsheetHtml(sc){
    const active = sectionOf(sc.id);
    return html`
      <div class="navsheet" role="dialog" aria-label="Bölümler">
        <div class="navsheet__head">
          <div class="brand">
            <span class="brand__mark" aria-hidden="true">S</span>
            <span class="brand__text"><b>SPİ</b><span>${brandLine()}</span></span>
          </div>
          ${SP.C.IconButton({ icon:'close', aria:'Kapat', act:'toggle-menu' })}
        </div>
        <div class="navsheet__body">
          <div class="navsheet__grid">${map(SECTIONS, sec => html`
            <button class="${cls('navsheet__item', sec.id === active.id && 'is-active')}"
              data-act="go" data-route="${sec.views[0].route}" data-num="${sec.num}">
              <b>${sec.label}</b>
              <span>${sec.note}</span>
            </button>`)}
          </div>
          ${storeHealthHtml()}
        </div>
      </div>`;
  }

  /* ---------- hero ----------

     Her bölüm bir cümleyle açılır. Panel dilinde ekranın adı yazardı
     ("Tahliller") ve durumu okumak için aşağı bakmak gerekirdi; burada
     BAŞLIK durumun kendisidir, alt satır ne yapılacağını söyler.

     `headline` ve `lede` ekranın kendi sözleşmesindendir; vermeyen ekran
     için başlık ve alt başlık kullanılır. */
  function heroHtml(sc){
    const sec = sectionOf(sc.id);
    const headline = safe(() => sc.headline ? sc.headline() : '') || sc.title;
    const lede = safe(() => sc.lede ? sc.lede() : '') || safe(() => sc.subtitle());
    const stats = safe(() => sc.stats ? sc.stats() : [], []) || [];
    const actions = safe(() => sc.actions ? sc.actions() : '');

    return html`
      <div class="hero" data-num="${sec.num}">
        <div class="wrapc hero__in">
          <div class="hero__main">
            <div class="hero__eyebrow">
              <span class="hero__num">${sec.num}</span>
              ${raw(UI.icon(sec.icon))}
              <span>${sec.label}</span>
            </div>
            <h1 class="hero__title">${headline}</h1>
            ${when(lede, () => html`<p class="hero__lede">${raw(lede)}</p>`)}
            ${when(actions, () => html`<div class="hero__actions">${raw(actions)}</div>`)}
          </div>
          ${when(stats.length, () => html`<div class="hero__side">${map(stats, st => html`
            <div class="herostat">
              <span class="herostat__value">${st.value}${when(st.unit,
                () => html`<small>${st.unit}</small>`)}</span>
              <span class="herostat__label">${st.label}</span>
            </div>`)}</div>`)}
          <div class="hero__motif" aria-hidden="true">${raw(UI.motif(sec.id))}</div>
        </div>
      </div>`;
  }

  /* Bölümün sayfaları. Tek sayfalıysa çizilmez. */
  function pagenavHtml(sc){
    const sec = sectionOf(sc.id);
    if(sec.views.length < 2) return '';
    return html`
      <nav class="pagenav" aria-label="${sec.label + ' sayfaları'}">
        <div class="wrapc pagenav__in">${map(sec.views, v => {
          const on = v.route === sc.id;
          const b = safe(() => badgeFor(v.route), null);
          return html`<button class="${cls('pagelink', on && 'is-active')}"
            data-act="go" data-route="${v.route}"
            ${when(on, () => attrs({ 'aria-current':'page' }))}>
            ${raw(UI.icon(v.icon))}<span>${v.label}</span>
            ${when(b, () => html`<span class="pagelink__count">${b.text}</span>`)}
          </button>`;
        })}</div>
      </nav>`;
  }

  /* ------------------------------------------------------------- görünüm

     Tema ve palet üst çubuktan tek dokunuşla değişir. Ayarların dördüncü
     sekmesine gömülü bir tercih, hiç kullanılmayan bir tercihtir.

     Seçim profile yazılır; yani cihaz değil KİŞİ hatırlanır ve hane
     profilleri arasında geçerken herkesin kendi görünümü gelir. */
  const THEMES = [
    { id:'system', icon:'monitor', label:'Sistem' },
    { id:'light',  icon:'sun',     label:'Açık' },
    { id:'dark',   icon:'moon2',   label:'Koyu' },
  ];

  function appearanceHtml(){
    const p = S.profile || {};
    const theme = p.theme || 'system';
    const palette = p.palette || SP.DEFAULT_PALETTE;
    const design = p.design || SP.DEFAULT_DESIGN;
    return String(html`
      <div class="appear" id="appearance" role="dialog" aria-label="Görünüm">
        <div class="appear__label">Tema</div>
        <div class="appear__themes">${map(THEMES, t => html`
          <button class="${cls('themebtn', t.id === theme && 'is-on')}"
            data-act="set-theme" data-theme="${t.id}"
            aria-pressed="${t.id === theme ? 'true' : 'false'}">
            ${raw(UI.icon(t.icon))}<span>${t.label}</span>
          </button>`)}
        </div>

        <div class="appear__label">Palet</div>
        <div class="appear__palettes">${map(SP.PALETTES, pal => html`
          <button class="${cls('palbtn', pal.id === palette && 'is-on')}"
            data-act="set-palette" data-palette="${pal.id}" title="${pal.note}"
            aria-pressed="${pal.id === palette ? 'true' : 'false'}">
            <span class="palbtn__dot" style="background:${pal.swatch[0]}"></span>
            <span>${pal.name}</span>
          </button>`)}
        </div>

        <div class="appear__label">Düzen</div>
        <div class="appear__designs">${map(SP.DESIGNS, d => html`
          <button class="${cls('desbtn', d.id === design && 'is-on')}"
            data-act="set-design" data-design="${d.id}" title="${d.note}"
            aria-pressed="${d.id === design ? 'true' : 'false'}">
            <span class="${'desbtn__mini desbtn__mini--' + d.swatch}" aria-hidden="true"
              >${raw('<i></i>'.repeat(d.swatch === 'nodes' ? 4 : 5))}</span>
            <span class="desbtn__name">${d.name}</span>
          </button>`)}
        </div>

        <p class="appear__note">Tema, palet ve düzen bu profile kaydedilir.
          «Sistem» seçiliyken cihazın açık/koyu tercihi izlenir. Düzen yalnız
          iskeleti değiştirir: durum renkleri ve kesinlik etiketleri
          hiçbir düzende değişmez.</p>
      </div>`);
  }

  function openAppearance(anchor){
    closeAppearance();
    const root = document.getElementById('overlay-root');
    const el = document.createElement('div');
    el.innerHTML = appearanceHtml();
    const panel = el.firstElementChild;
    root.appendChild(panel);
