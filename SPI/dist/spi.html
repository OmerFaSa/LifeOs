  const ADVANCE_WINDOW = 14;

  function progressionCheck(exId){
    const ex = SP.EX_BY_ID[exId];
    if(!ex) return { ok:false };
    const levelId = SP.Model.currentLevel(exId);
    const i = SP.Model.levelIndex(exId);
    const level = ex.levels[i];
    const next = ex.levels[i + 1] || null;

    const cutoff = U.iso(U.addDays(U.today(), -ADVANCE_WINDOW));
    const hits = SP.S.workouts.filter(w => w.date >= cutoff)
      .reduce((n, w) => n + (w.items || []).filter(it => it.exId === exId && it.levelId === levelId).length, 0);

    return {
      ok:true, exercise:ex, level, next, levelId,
      sessions:hits, needed:ADVANCE_SESSIONS, window:ADVANCE_WINDOW,
      ready:!!next && hits >= ADVANCE_SESSIONS,
      note:!next ? 'Bu merdivenin son basamağındasın.'
        : hits >= ADVANCE_SESSIONS
          ? level.name + ' basamağında son ' + ADVANCE_WINDOW + ' günde ' + hits + ' seans var — üst basamak açık.'
          : 'Üst basamak için ' + ADVANCE_WINDOW + ' gün içinde ' + ADVANCE_SESSIONS + ' seans gerekir; ' + hits + ' var.',
    };
  }

  /* Haftalik hareket kalibi dengesi — her kalip haftada en az bir kez. */
  function patternBalance(endISO){
    const end = endISO || U.todayISO();
    const cutoff = U.iso(U.addDays(U.parse(end), -6));
    const seen = {};
    SP.S.workouts.filter(w => w.date >= cutoff && w.date <= end).forEach(w => {
      (w.items || []).forEach(it => {
        const ex = SP.EX_BY_ID[it.exId];
        if(ex && ex.pattern) seen[ex.pattern] = (seen[ex.pattern] || 0) + 1;
      });
    });
    return SP.PATTERNS.map(p => ({ pattern:p, count:seen[p.id] || 0, missing:!seen[p.id] }));
  }

  /* Son 30 gunun gunluk yuku — grafik icin. */
  function loadSeries(days){
    const n = days || 30;
    const out = [];
    for(let i = n - 1; i >= 0; i--){
      const d = U.iso(U.addDays(U.today(), -i));
      out.push({ date:d, value:loadOn(d) });
    }
    return out;
  }

  return {
    baseline, sleepScore, hrvScore, rhrScore, sorenessScore, readiness,
    sessionLoad, loadOn, loadWindow, acwr, deloadWeek, weeklyGrowth, prescription,
    progressionCheck, patternBalance, loadSeries,
    ADVANCE_SESSIONS, ADVANCE_WINDOW,
  };
})();

/* ==== js/core/money.js ==== */
/* Modul 4'un kural motoru — fiyat, sepet ve esdeger ikame.

   Bu modulun tek etik kurali vardir: TAHMIN, OLCUM GIBI GOSTERILMEZ.
   Uygulama market taramaz; seed fiyatlari yalnizca sepetin bos kalmamasi
   icindir ve her ekranda "tahmin" olarak isaretlenir. Kullanicinin fisinden
   girdigi fiyat tahmini ezer ve "olculdu" olur.

   Ikinci kural: butce saglik hedefini indirmez. Sedef'in isi hedefi bozmadan
   en ucuz yolu bulmaktir — hedefi kucultmek degil. Bunun kod karsiligi
   costPerNutrient(): "bu ogeyi en ucuz hangi gidadan alirim" sorusudur. */

window.SP = window.SP || {};

SP.Money = (function(){
  const U = SP.U;

  /* ------------------------------------------------------------------ fiyat */

  function monthsSince(dateISO){
    if(!dateISO) return null;
    const d = String(dateISO).length === 7 ? dateISO + '-01' : dateISO;
    return Math.max(0, Math.round(U.diffDays(d, U.todayISO()) / 30));
  }

  function ageBand(months){
    if(months == null) return SP.PRICE_AGE[SP.PRICE_AGE.length - 1];
    return SP.PRICE_AGE.find(a => months <= a.maxMonths) || SP.PRICE_AGE[SP.PRICE_AGE.length - 1];
  }

  /* Bir gidanin kilogram fiyati. Kullanici degeri her zaman kazanir. */
  function priceOf(foodId){
    const own = SP.S.prices ? SP.S.prices[foodId] : null;
    if(own && own.tl){
      const months = monthsSince(own.at);
      return { tl:own.tl, source:'user', at:own.at, months, age:ageBand(months),
        cert:'measured', label:'kendi fişin' };
    }
    const seed = SP.PRICE_SEED.perKg[foodId];
    if(seed == null) return { tl:null, source:'none', cert:'missing', label:'fiyat yok' };
    const months = monthsSince(SP.PRICE_SEED.seededAt);
    return { tl:seed, source:'seed', at:SP.PRICE_SEED.seededAt, months, age:ageBand(months),
      cert:'estimated', label:'tahmin' };
  }

  function costOf(foodId, kg){
    const p = priceOf(foodId);
    if(p.tl == null) return null;
    return U.round(p.tl * (Number(kg) || 0), 2);
  }

  /* Sepetin ne kadari hala tahmine dayaniyor? Bu oran ekranda gorunur;
     yuksekse hesap "yaklasik" olarak sunulur. */
  function estimateShare(){
    const items = (SP.S.basket && SP.S.basket.items) || [];
    if(!items.length) return { pct:0, estimated:0, total:0 };
    let est = 0, tot = 0;
    items.forEach(it => {
      const c = costOf(it.foodId, it.kg);
      if(c == null) return;
      tot += c;
      if(priceOf(it.foodId).source !== 'user') est += c;
    });
    return { pct:U.pct(est, tot), estimated:U.round(est, 2), total:U.round(tot, 2) };
  }

  /* ------------------------------------------------------------------ sepet */

  function basketRows(){
    const items = (SP.S.basket && SP.S.basket.items) || [];
    return items.map(it => {
      const f = SP.FOOD_BY_ID[it.foodId];
      const p = priceOf(it.foodId);
      return { item:it, food:f, price:p, cost:costOf(it.foodId, it.kg) };
    }).filter(r => r.food).sort((a, b) => (b.cost || 0) - (a.cost || 0));
  }

  function basketTotal(){
    const rows = basketRows();
    const total = U.sum(rows.map(r => r.cost || 0));
    const limit = SP.S.basket ? SP.S.basket.weeklyLimit : null;
    const size = (SP.S.prefs && SP.S.prefs.householdSize) || 1;
    return {
      rows, total:U.round(total, 2), limit,
      perPerson:U.round(total / Math.max(1, size), 2), householdSize:size,
      over:limit != null && total > limit,
      pct:limit ? U.pct(total, limit) : null,
      estimate:estimateShare(),
      missing:rows.filter(r => r.cost == null).length,
    };
  }

  /* Sepetin haftalik besin kapsamasi — para ile saglik arasindaki kopru.
     Sepetteki gidalarin toplam besin degeri, hanenin haftalik hedefine
     bolunur. %100'un altinda kalan ogeler "sepet bunu karsilamiyor" demektir. */
  function basketCoverage(profile){
    const t = SP.Nutri.targets(profile);
    if(!t.ok) return { ok:false, note:'Kapsama hesabı için profilde kilo, boy ve doğum yılı gerekir.' };
    const size = (SP.S.prefs && SP.S.prefs.householdSize) || 1;
    const rows = basketRows();
    if(!rows.length) return { ok:false, note:'Sepet boş.' };

    const got = {};
    SP.Nutri.MICROS.forEach(id => { got[id] = 0; });
    let kcal = 0, protein = 0, fiber = 0;

    rows.forEach(r => {
      const c = SP.Nutri.contribution(r.item.foodId, (Number(r.item.kg) || 0) * 1000);
      if(!c) return;
      kcal += c.kcal; protein += c.protein; fiber += c.fiber;
      SP.Nutri.MICROS.forEach(id => { if(c.micro[id] != null) got[id] += c.micro[id]; });
    });

    const weekFactor = 7 * size;
    const out = { ok:true, kcal:{ got:Math.round(kcal), need:Math.round(t.kcal * weekFactor) },
      protein:{ got:Math.round(protein), need:Math.round(t.protein.min * weekFactor) },
      fiber:{ got:Math.round(fiber), need:Math.round(t.fiber * weekFactor) },
      micro:{}, weekFactor, householdSize:size };

    out.kcal.pct = U.pct(out.kcal.got, out.kcal.need);
    out.protein.pct = U.pct(out.protein.got, out.protein.need);
    out.fiber.pct = U.pct(out.fiber.got, out.fiber.need);

    Object.keys(t.micro).forEach(id => {
      const need = t.micro[id].target * weekFactor;
      out.micro[id] = { got:U.round(got[id], 1), need:U.round(need, 1), pct:U.pct(got[id], need),
        limit:t.micro[id].limit };
    });
    out.gaps = Object.keys(out.micro)
      .filter(id => !out.micro[id].limit && out.micro[id].pct < 80)
      .sort((a, b) => out.micro[a].pct - out.micro[b].pct);
    return out;
  }

  /* ------------------------------------------------------------------ ikame

     Oneri her zaman NEYI KORUDUGUNU ve NEYI KAYBETTIGINI birlikte soyler.
     Bu, "ucuz olan iyidir" tuzagina dusmemek icindir: sardalya somonun
     omega-3'unu korur ama D vitamini icerigi ucte biridir. */
  function substitutesFor(foodId){
    return SP.SUBSTITUTES.filter(s => s.forId === foodId).map(s => {
      const from = SP.FOOD_BY_ID[s.forId], to = SP.FOOD_BY_ID[s.withId];
      const pf = priceOf(s.forId), pt = priceOf(s.withId);
      const saveKg = (pf.tl != null && pt.tl != null) ? U.round(pf.tl - pt.tl, 2) : null;
      return {
        sub:s, from, to, priceFrom:pf, priceTo:pt, saveKg,
        savePct:(pf.tl && saveKg != null) ? U.pct(saveKg, pf.tl) : null,
        keeps:s.keeps.map(id => SP.NUTRI_BY_ID[id]).filter(Boolean),
        loses:(s.loses || []).map(id => SP.NUTRI_BY_ID[id]).filter(Boolean),
      };
    }).filter(r => r.from && r.to);
  }

  /* Sepetteki kalemler icin en buyuk tasarruf firsatlari. */
  function swapOpportunities(){
    const rows = basketRows();
    const out = [];
    rows.forEach(r => {
      substitutesFor(r.item.foodId).forEach(s => {
        if(s.saveKg == null || s.saveKg <= 0) return;
        out.push(Object.assign({}, s, {
          kg:r.item.kg,
          saveTotal:U.round(s.saveKg * r.item.kg, 2),
        }));
      });
    });
    return out.sort((a, b) => b.saveTotal - a.saveTotal);
  }

  /* --------------------------------------------------------- besin basina maliyet

     "Bu ogeyi en ucuz hangi gidadan alirim?" — butce ile saglik hedefini
     ayni tabloda bulusturur. Birim: bir birim besin ogesi basina TL. */
  function costPerNutrient(nutrientId, limit){
    const rows = SP.FOODS.map(f => {
      const per100 = f.micro ? f.micro[nutrientId] : null;
      if(per100 == null || per100 <= 0) return null;
      const p = priceOf(f.id);
      if(p.tl == null) return null;
      /* 1 kg gidada bulunan oge miktari = per100 x 10 */
      const perKg = per100 * 10;
      return { food:f, price:p, per100, perKg,
        tlPerUnit:U.round(p.tl / perKg, 3),
        cert:p.cert };
    }).filter(Boolean);
    rows.sort((a, b) => a.tlPerUnit - b.tlPerUnit);
    return rows.slice(0, limit || 8);
  }

  /* ------------------------------------------------------------- toplu alim

     Yalnizca bozulmadan saklanabilen ve hane genelinde tuketilen kalemler.
     Taze uründe toplu alim tasarruf degil israf uretir; bu yuzden liste
     data/prices.js icinde acikca sinirlidir. */
  function bulkOpportunities(){
    const size = (SP.S.prefs && SP.S.prefs.householdSize) || 1;
    const inBasket = {};
    ((SP.S.basket && SP.S.basket.items) || []).forEach(it => { inBasket[it.foodId] = it.kg; });

    return SP.BULK_ITEMS.map(b => {
      const f = SP.FOOD_BY_ID[b.id];
      const p = priceOf(b.id);
      if(!f || p.tl == null) return null;
      const weekly = inBasket[b.id] || 0;
      /* Hane ne kadar surede minimum alimi tuketir? */
      const weeksToUse = weekly > 0 ? U.round(b.minKg / weekly, 1) : null;
      return {
        item:b, food:f, price:p, weeklyKg:weekly, weeksToUse, householdSize:size,
        saveTl:U.round(p.tl * b.minKg * b.saving, 2),
        newTl:U.round(p.tl * (1 - b.saving), 2),
        worth:weekly > 0 && weeksToUse != null && weeksToUse <= 12,
      };
    }).filter(Boolean).sort((a, b) => (b.worth ? 1 : 0) - (a.worth ? 1 : 0) || b.saveTl - a.saveTl);
  }

  /* ---------------------------------------------------------------- durum */

  /* Modulun tek cumlelik ozeti — Bugun ekrani ve ofis brifingi icin. */
  function status(profile){
    const b = basketTotal();
    const stale = b.estimate.pct >= 50;
    const cov = basketCoverage(profile);

    let tone = 'ok', text;
    if(!b.rows.length){
      tone = 'muted';
      text = 'Sepet boş. Haftalık alışverişi girince maliyet ve besin kapsaması hesaplanır.';
    }else if(b.over){
      tone = 'warn';
      text = 'Haftalık sepet ' + U.fmtNum(Math.round(b.total)) + ' TL — sınırın '
        + U.fmtNum(Math.round(b.total - b.limit)) + ' TL üstünde.';
    }else if(cov.ok && cov.gaps.length){
      tone = 'warn';
      text = 'Sepet bütçeye uyuyor ama ' + cov.gaps.length + ' besin öğesini karşılamıyor.';
    }else{
      text = 'Sepet ' + U.fmtNum(Math.round(b.total)) + ' TL'
        + (b.limit ? ' · sınırın altında' : '') + '.';
    }
    if(stale && b.rows.length){
      text += ' Hesabın %' + b.estimate.pct + '\'i hâlâ tahmin fiyatıyla.';
    }
    return { tone, text, basket:b, coverage:cov, stale };
  }

  /* ------------------------------------------------------------- butce

     Sedef tek basina butce yapmaz: diger uc kocun TALEBINI toplar. Talep
     kural motorlarindan gelir, tahminden degil —

       Nesrin  haftalik sepet maliyeti (gida fiyatlarindan)
       Kerem   vadesi gecmis panellerin test ucreti
       Baris   eksik ekipman

     Fiyati bilinmeyen kalem SIFIR sayilmaz. "veri yok" olarak durur ve
     toplama girmez; toplamin yaninda kac kalemin disarida kaldigi yazar.
     Bilinmeyeni sifir sayan bir butce, gercek butceden hep kucuk cikar. */

  function budget(profile){
    const rows = [];
    const b = basketTotal();

    /* --- Nesrin: gida --- */
    rows.push({
      id:'gida', agent:'nutri', label:'Gıda',
      detail:b.rows.length
        ? b.rows.length + ' kalem haftalık sepet'
        : 'Sepet boş — haftalık alışveriş girilmedi',
      monthly:b.rows.length ? U.round(b.total * 4.33, 0) : null,
      cert:!b.rows.length ? 'missing' : (b.estimate.pct >= 50 ? 'estimated' : 'measured'),
      note:b.rows.length && b.estimate.pct
        ? 'Hesabın %' + b.estimate.pct + '\'i tahmin fiyatıyla.' : null,
      route:'basket',
    });

    /* --- Kerem: test --- */
    const overdue = SP.Bio.overdue();
    const testFee = SP.S.basket && SP.S.basket.testFee != null ? Number(SP.S.basket.testFee) : null;
    rows.push({
      id:'test', agent:'lab', label:'Test',
      detail:overdue.length
        ? overdue.length + ' panelin ölçüm borcu var'
        : 'Vadesi geçmiş panel yok',
      monthly:overdue.length && testFee != null ? U.round(overdue.length * testFee / 6, 0) : null,
      cert:!overdue.length ? 'measured' : (testFee == null ? 'missing' : 'estimated'),
      note:overdue.length && testFee == null
        ? 'Panel ücreti girilmedi; bu kalem toplama katılmadı.'
        : (overdue.length ? 'Altı ayda bir tekrarlanacak varsayımıyla aylığa bölündü.' : null),
      route:'labs',
    });

    /* --- Baris: ekipman --- */
    const owned = (SP.S.basket && SP.S.basket.equipment) || [];
    const needed = [];
    SP.EXERCISES.forEach(e => {
      if(!e.equip || e.equip === 'yok') return;
      if(needed.indexOf(e.equip) < 0 && owned.indexOf(e.equip) < 0) needed.push(e.equip);
    });
    rows.push({
      id:'ekipman', agent:'move', label:'Ekipman',
      detail:needed.length ? 'Eksik: ' + needed.join(', ') : 'Ek ekipman gerekmiyor',
      monthly:needed.length ? null : 0,
      cert:needed.length ? 'missing' : 'measured',
      note:needed.length
        ? 'Ekipman fiyatı sistemde tutulmaz. Vücut ağırlığı hareketleri ekipmansız çalışır.'
        : null,
      route:'move',
    });

    const known = rows.filter(r => r.monthly != null);
    const unknown = rows.filter(r => r.monthly == null);
    const total = U.round(U.sum(known.map(r => r.monthly)), 0);
    const limit = SP.S.basket && SP.S.basket.monthlyLimit != null
      ? Number(SP.S.basket.monthlyLimit) : null;

    return {
      rows, total, unknown:unknown.length,
      limit, over:limit != null && total > limit,
      pct:limit ? U.pct(total, limit) : null,
      coverage:basketCoverage(profile),
    };
  }

  return {
    priceOf, costOf, monthsSince, ageBand, estimateShare, budget,
    basketRows, basketTotal, basketCoverage,
    substitutesFor, swapOpportunities, costPerNutrient, bulkOpportunities,
    status,
  };
})();

/* ==== js/core/calc.js ==== */
/* Orkestratorun kural motoru — capraz cikarim ve siradaki hamle.

   Dort uzman kendi alanini hesaplar; bu dosya onlari BIR ARAYA getirir.
   Patron ajan buradan beslenir ve buradaki karari degistiremez, yalnizca
   gerekcelendirir.

   Iki temel cikti vardir:

     nextAction()     Tek bir oncelik. Sira SP.PRECEDENCE ile aynidir ve
                      tartisilmaz: kirmizi bayrak → guvenlik → olcum borcu →
                      besin acigi → antrenman → butce.

     crossFindings()  Alanlar arasi baglar. PDF'teki ornek burada yasar:
                      "Butceyi %10 astik fakat protein tutarliligi ve
                      toparlanma skoru son iki ayin zirvesinde."

   Korelasyon nedensellik degildir ve oyle sunulmaz: bulgu daima "birlikte
   hareket ediyor" diliyle yazilir, "sebep oldu" diliyle degil. */

window.SP = window.SP || {};

SP.Calc = (function(){
  const U = SP.U;

  /* --------------------------------------------------------------- gunluk */

  /* Asgari gun standardi — kotu gunun alt siniri.
     Dordunu tutturan gun kayipsiz sayilir. */
  function minimumDay(dateISO){
    const d = dateISO || U.todayISO();
    const v = SP.S.vitals[d] || {};
    const totals = SP.Nutri.dayTotals(d);
    const p = SP.S.profile;
    const proteinFloor = p && p.weightKg ? Math.round(1.2 * p.weightKg) : null;
    const moveMin = U.sum(SP.Model.workoutsOf(d).map(w => w.minutes || 0));

    const rows = [
      { id:'protein', label:SP.MINIMUM_DAY.protein,
        ok:proteinFloor != null && totals.protein >= proteinFloor,
        known:proteinFloor != null && !totals.empty,
        detail:proteinFloor == null ? 'Profilde kilo yok'
          : Math.round(totals.protein) + ' / ' + proteinFloor + ' g' },
      { id:'water', label:SP.MINIMUM_DAY.water,
        ok:(v.water || 0) >= 2000, known:v.water != null,
        detail:U.fmtNum(v.water || 0) + ' / 2.000 ml' },
      { id:'move', label:SP.MINIMUM_DAY.move,
        ok:moveMin >= SP.LOAD_RULES.minDay.minutes, known:true,
        detail:moveMin + ' / ' + SP.LOAD_RULES.minDay.minutes + ' dk' },
      { id:'sleep', label:SP.MINIMUM_DAY.sleep,
        ok:v.sleep != null && v.sleep >= 7, known:v.sleep != null,
        detail:v.sleep != null ? U.fmtNet(v.sleep) + ' / 7 sa' : 'girilmedi' },
    ];
    const done = rows.filter(r => r.ok).length;
    return { rows, done, total:rows.length, complete:done === rows.length, note:SP.MINIMUM_DAY.note };
  }

  /* Davranis serisi — asgari gunu ust uste kac gun tutturdun.
     Odul olcume degil DAVRANISA baglidir: tek gunun iyi tahlili degil,
     surdurulen duzen odullendirilir. */
  function streak(){
    let n = 0;
    for(let i = 0; i < 365; i++){
      const d = U.iso(U.addDays(U.today(), -i));
      /* Bugun henuz bitmedi: tamamlanmamis olmasi seriyi kirmaz. */
      if(i === 0 && !minimumDay(d).complete) continue;
      if(minimumDay(d).complete) n++;
      else break;
    }
    return n;
  }

  /* Gunun butun modullerden ozeti. */
  function dayStatus(dateISO){
    const d = dateISO || U.todayISO();
    return {
      date:d,
      vitals:SP.S.vitals[d] || null,
      nutrition:SP.Nutri.dayTotals(d),
      targets:SP.Nutri.targets(),
      prescription:SP.Move.prescription(d),
      minimum:minimumDay(d),
      flags:SP.Model.openFlags(),
      money:SP.Money.status(),
    };
  }

  /* ---------------------------------------------------------- siradaki hamle

     Sira SP.PRECEDENCE'tir. Ilk eslesen doner; digerleri beklemeye gecer.
     Her hamle nereye gidecegini (route) ve NEDEN geldigini (why) tasir —
     gerekcesiz bir emir sistemin isi degildir. */
  function nextAction(){
    const d = U.todayISO();

    /* 1 — kirmizi bayrak */
    const flags = SP.Model.openFlags().filter(f => !f.ack);
    if(flags.length){
      return { id:'flag', rank:1, tone:'danger', icon:'warn',
        label:'Kırmızı bayrak', title:flags[0].label,
        why:flags[0].detail, route:'labs',
        action:'Hekime başvur ve bayrağı gördüğünü işaretle.' };
    }

    /* 2 — guvenlik: asiri yuklenme ve ates */
    const rx = SP.Move.prescription(d);
    if(rx.readiness.ok && rx.readiness.override){
      return { id:'override', rank:2, tone:'danger', icon:'heart',
        label:'Güvenlik', title:'Bugün antrenman yok',
        why:rx.readiness.override.why, route:'move',
        action:'Yükü sıfırla, dinlen.' };
    }
    if(rx.acwr.ok && rx.acwr.zone === 'high'){
      return { id:'overreach', rank:2, tone:'warn', icon:'dumbbell',
        label:'Güvenlik', title:'Yük alıştığının üstünde',
        why:rx.acwr.note + ' Oran ' + U.fmtNet(rx.acwr.ratio) + '.', route:'move',
        action:'Bu hafta yükü indir.' };
    }

    /* 3 — olcum borcu */
    const v = SP.S.vitals[d];
    if(!v || v.sleep == null){
      return { id:'vitals', rank:3, tone:'info', icon:'pulse',
        label:'Ölçüm', title:'Bugünün ölçümü girilmedi',
        why:'Toparlanma skoru en az uyku süresiyle hesaplanır; onsuz günün yükü körlemesine verilir.',
        route:'today', action:'Uyku ve nabzı gir.' };
    }
    const due = SP.Bio.overdue();
    if(due.length){
      return { id:'panel', rank:3, tone:'info', icon:'flask',
        label:'Ölçüm', title:(/paneli$/i.test(due[0].panel.name)
          ? due[0].panel.name : due[0].panel.name + ' paneli') + ' bekliyor',
        why:due[0].note + ' Eğilim okumak için düzenli aralık gerekir.',
        route:'labs', action:'Tahlil sonucunu gir.' };
    }

    /* 4 — besin acigi */
    const g = SP.Nutri.gaps(7);
    if(g.ok && g.rows.length){
      const worst = g.rows[0];
      return { id:'gap', rank:4, tone:'warn', icon:'leaf',
        label:'Beslenme', title:worst.nutrient.name + ' hedefin %' + worst.pct + '\'inde',
        why:(worst.why ? worst.why + ' ' : '') + 'Son 7 günün ortalaması hedefin altında.',
        route:'meals', action:'Kaynakları gör ve öğüne ekle.' };
    }
    if(!SP.Model.mealsOf(d).length){
      return { id:'meal', rank:4, tone:'info', icon:'meal',
        label:'Beslenme', title:'Bugün hiç öğün girilmedi',
        why:'Girilmemiş gün ortalamaya katılmaz; kayıt olmadan açık da görülmez.',
        route:'meals', action:'Öğünü sesli ya da yazarak ekle.' };
    }

    /* 5 — antrenman */
    if(rx.kind !== 'rest' && !rx.done){
      const t = rx.suggest[0];
      return { id:'workout', rank:5, tone:'ok', icon:'dumbbell',
        label:'Hareket', title:t ? t.name : 'Bugünün antrenmanı',
        why:rx.reasons.length ? rx.reasons[0].text : 'Toparlanma uygun.',
        route:'move', action:'Seansı başlat.' };
    }

    /* 6 — butce */
    const m = SP.Money.status();
    if(m.tone === 'warn'){
      return { id:'budget', rank:6, tone:'warn', icon:'wallet',
        label:'Bütçe', title:'Sepet gözden geçirilmeli',
        why:m.text, route:'basket', action:'İkame önerilerine bak.' };
    }

    return { id:'calm', rank:99, tone:'ok', icon:'check', calm:true,
      label:'Bugün', title:'Sıradaki hamle yok',
      why:'Bayrak yok, ölçüm güncel, açık yok ve günün yükü tamam.',
      route:'today', action:'' };
  }

  /* ------------------------------------------------------------- korelasyon

     Pearson katsayisi. Iki seri ayni gunlerde olculmus olmali; eslesmeyen
     gunler atilir. En az 10 ortak gun sarti vardir — daha azindan cikan
     katsayi rastlantiyi olcer. */
  const MIN_PAIRS = 10;

  function correlate(pairs){
    const xs = pairs.map(p => p[0]), ys = pairs.map(p => p[1]);
    const n = xs.length;
    if(n < MIN_PAIRS) return { ok:false, n };
    const mx = U.sum(xs) / n, my = U.sum(ys) / n;
    let num = 0, dx = 0, dy = 0;
    for(let i = 0; i < n; i++){
      const a = xs[i] - mx, b = ys[i] - my;
      num += a * b; dx += a * a; dy += b * b;
    }
    if(!dx || !dy) return { ok:false, n, note:'Serilerden biri hiç değişmiyor.' };
    const r = num / Math.sqrt(dx * dy);
    return { ok:true, n, r:U.round(r, 2), strength:Math.abs(r) };
  }

  /* Gunluk seri ureticiler — korelasyon icin ortak arayuz. */
  const SERIES = {
    sleep:d => { const v = SP.S.vitals[d]; return v ? v.sleep : null; },
    hrv:d => { const v = SP.S.vitals[d]; return v ? v.hrv : null; },
    rhr:d => { const v = SP.S.vitals[d]; return v ? v.rhr : null; },
    weight:d => { const v = SP.S.vitals[d]; return v ? v.weight : null; },
    sbp:d => { const v = SP.S.vitals[d]; return v ? v.sbp : null; },
    readiness:d => { const r = SP.Move.readiness(d); return r.ok ? r.score : null; },
    load:d => { const n = SP.Model.workoutsOf(d).length; return n ? SP.Move.loadOn(d) : null; },
    protein:d => { const t = SP.Nutri.dayTotals(d); return t.empty ? null : t.protein; },
    kcal:d => { const t = SP.Nutri.dayTotals(d); return t.empty ? null : t.kcal; },
    fiber:d => { const t = SP.Nutri.dayTotals(d); return t.empty ? null : t.fiber; },
    sodium:d => { const t = SP.Nutri.dayTotals(d); return t.empty ? null : t.micro.sodium; },
  };

  function pairsFor(aKey, bKey, days){
    const n = days || 60;
    const out = [];
    for(let i = 0; i < n; i++){
      const d = U.iso(U.addDays(U.today(), -i));
      const a = SERIES[aKey] ? SERIES[aKey](d) : null;
      const b = SERIES[bKey] ? SERIES[bKey](d) : null;
      if(a != null && b != null) out.push([Number(a), Number(b)]);
    }
    return out;
  }

  /* Aranan baglar. Her biri hangi iki seriyi karsilastirdigini, beklenen
     yonu ve bulgunun nasil yazilacagini tasir. */
  const LINKS = [
    { id:'sleep-hrv', a:'sleep', b:'hrv', expect:'+',
      title:'Uyku ve toparlanma',
      pos:'Uzun uyuduğun günlerde HRV yükseliyor.',
      neg:'Uyku süresiyle HRV ters hareket ediyor; ölçüm saatini kontrol et.' },
    { id:'load-readiness', a:'load', b:'readiness', expect:'-',
      title:'Yük ve ertesi gün toparlanması',
      pos:'Ağır yüklenilen günlerde toparlanma skoru da yüksek — yük taşınıyor.',
      neg:'Ağır günlerde toparlanma belirgin düşüyor; yük bandın üstünde.' },
    { id:'protein-readiness', a:'protein', b:'readiness', expect:'+',
      title:'Protein ve toparlanma',
      pos:'Protein aldığın günlerde toparlanma daha iyi.',
      neg:'Protein ile toparlanma arasında ters bir hareket var.' },
    { id:'sodium-bp', a:'sodium', b:'sbp', expect:'+',
      title:'Sodyum ve tansiyon',
      pos:'Tuz alımının yüksek olduğu günlerde sistolik tansiyon da yükseliyor.',
      neg:'Sodyum ile tansiyon arasında beklenen yönde bir hareket görünmüyor.' },
    { id:'kcal-weight', a:'kcal', b:'weight', expect:'+',
      title:'Kalori ve kilo',
      pos:'Kalori alımı ile kilo aynı yönde hareket ediyor.',
      neg:'Kalori ile kilo ters hareket ediyor; tartım koşulları değişiyor olabilir.' },
    { id:'sleep-kcal', a:'sleep', b:'kcal', expect:'-',
      title:'Uyku ve iştah',
      pos:'Az uyuduğun günlerde kalori alımı artıyor.',
      neg:'Uyku ile kalori arasında belirgin bir bağ yok.' },
  ];

  function crossFindings(days){
    return LINKS.map(link => {
      const pairs = pairsFor(link.a, link.b, days || 60);
      const c = correlate(pairs);
      if(!c.ok){
        return { link, ok:false, n:c.n,
          note:'Ortak gün sayısı yetersiz (' + c.n + '/' + MIN_PAIRS + '). '
             + 'İki ölçüm de aynı günlerde girilmeli.' };
      }
      /* Zayif katsayi bulgu sayilmaz. */
      if(c.strength < 0.3){
        return { link, ok:true, weak:true, r:c.r, n:c.n,
          tone:'muted', text:'Belirgin bir birliktelik yok (r=' + U.fmtNet(c.r) + ', ' + c.n + ' gün).' };
      }
      const matches = link.expect === '+' ? c.r > 0 : c.r < 0;
      return {
        link, ok:true, weak:false, r:c.r, n:c.n,
        tone:matches ? 'ok' : 'warn',
        text:(matches ? link.pos : link.neg)
          + ' (r=' + U.fmtNet(c.r) + ', ' + c.n + ' gün — birliktelik, nedensellik değil.)',
      };
    });
  }

  /* --------------------------------------------------------- haftalik rapor

     PDF'teki konsolide raporun kural motoru tarafi. Patron bunu cumleye
     cevirir; sayilar buradan cikar. */
  function weeklyReport(endISO){
    const end = endISO || U.todayISO();
    const start = U.iso(U.addDays(U.parse(end), -6));

    const days = [];
    for(let i = 6; i >= 0; i--) days.push(U.iso(U.addDays(U.parse(end), -i)));

    const readiness = days.map(d => SP.Move.readiness(d)).filter(r => r.ok).map(r => r.score);
    const nutri = SP.Nutri.windowAverage(7);
    const t = SP.Nutri.targets();
    const money = SP.Money.basketTotal();
    const load = SP.Move.loadWindow(7, end);
    const growth = SP.Move.weeklyGrowth(end);
    const minDays = days.filter(d => minimumDay(d).complete).length;

    return {
      start, end, days,
      readiness:{ avg:readiness.length ? Math.round(U.sum(readiness) / readiness.length) : null,
        n:readiness.length, min:readiness.length ? Math.min.apply(null, readiness) : null },
      nutrition:{ avg:nutri, targets:t, loggedDays:nutri.days,
        proteinPct:t.ok && !nutri.empty ? U.pct(nutri.protein, t.protein.min) : null,
        fiberPct:t.ok && !nutri.empty ? U.pct(nutri.fiber, t.fiber) : null },
      movement:{ load, growth, sessions:SP.S.workouts.filter(w => w.date >= start && w.date <= end).length,
        balance:SP.Move.patternBalance(end) },
      money,
      discipline:{ minDays, of:7, streak:streak() },
      flags:SP.Model.openFlags(),
      gaps:SP.Nutri.gaps(7).rows.slice(0, 3),
      attention:SP.Bio.attention().slice(0, 3),
    };
  }

  /* Raporun tek cumlelik basligi — celiskiyi de tasir.
     PDF'teki ornek cumle bicimi burada uretilir. */
  function headline(report){
    const r = report || weeklyReport();
    const wins = [], losses = [];

    if(r.readiness.avg != null){
      (r.readiness.avg >= 70 ? wins : losses).push('toparlanma ortalaması ' + r.readiness.avg);
    }
    if(r.nutrition.proteinPct != null){
      (r.nutrition.proteinPct >= 95 ? wins : losses).push('protein hedefin %' + r.nutrition.proteinPct + '\'i');
    }
    if(r.money.limit != null){
      (r.money.over ? losses : wins).push(r.money.over
        ? 'bütçe %' + Math.max(0, r.money.pct - 100) + ' aşıldı'
        : 'bütçe sınırın altında');
    }
    (r.discipline.minDays >= 5 ? wins : losses).push('asgari gün ' + r.discipline.minDays + '/7');

    if(!wins.length && !losses.length) return 'Hafta için yeterli kayıt yok.';
    if(wins.length && losses.length){
      /* Celiskiyi tek cumlede tut: once kaybedilen, sonra "fakat" ile kazanilan.
         Rapor iyi haberi kotu haberin arkasina saklamaz. */
      const lead = losses[0].charAt(0).toLocaleUpperCase('tr-TR') + losses[0].slice(1);
      return lead + ' fakat ' + wins.join(' ve ') + '.';
    }
    if(wins.length) return 'Hafta temiz: ' + wins.join(' · ') + '.';
    return 'Hafta zorlandı: ' + losses.join(' · ') + '.';
  }

  return {
    minimumDay, streak, dayStatus, nextAction,
    correlate, pairsFor, crossFindings, SERIES, LINKS, MIN_PAIRS,
    weeklyReport, headline,
  };
})();

/* ==== js/core/parse.js ==== */
/* Sifir surtunmeli giris — serbest metni yapiya cevirir.

   PDF'in "Zorluk Alani" tablosunun kod karsiligi burasidir:

     Onlarca parametreyi elle forma yazmak   →  raporu yapistir, ayiklansin
     Her lokmayi tartip gramaj girmek        →  "1 tabak etli kuru fasulye" yaz

   Iki ayristirici da AYNI ILKEYE uyar: emin olamadigi satiri sessizce ATMAZ
   ve uydurmaz. Eslesmeyen satir "eslesmedi" olarak geri doner, kullanici
   elle baglar. Sistemin en tehlikeli hatasi yanlis veriyi dogru sanmaktir. */

window.SP = window.SP || {};

SP.Parse = (function(){
  const U = SP.U;

  /* ------------------------------------------------------------ ortak yardim */

  /* Turkce sayilar hem "12,5" hem "12.5" yazilir. Ikisi de kabul edilir.
     Binlik ayraci olarak nokta kullanilan "1.200" gibi degerler
     laboratuvar raporlarinda nadirdir; virgul varsa nokta binlik sayilir. */
  function num(raw){
    if(raw == null) return null;
    let s = String(raw).trim();
    if(!s) return null;
    if(s.indexOf(',') >= 0 && s.indexOf('.') >= 0){
      s = s.replace(/\./g, '').replace(',', '.');
    }else{
      s = s.replace(',', '.');
    }
    const v = parseFloat(s);
    return isFinite(v) ? v : null;
  }

  /* ---------------------------------------------------------- tahlil metni

     Bir laboratuvar raporunun metni satir satir okunur. Her satirda once
     bilinen bir belirtec adi aranir, sonra o adin SAGINDA kalan ilk sayi
     alinir. Referans araligi da ayni satirda oldugu icin ("12,5  13.5-17.5")
     birden fazla sayi bulunur; ilki sonuc, kalani referanstir. */

  /* Aramayi hizlandirmak icin takma adlar tek tabloda toplanir.
     Uzun ad kisa adi gizlemesin diye uzunluga gore sirali aranir:
     "serbest t4" once denenir, "t4" sonra. */
  const ALIAS_INDEX = (function(){
    const rows = [];
    SP.BIOMARKERS.forEach(b => {
      const names = [b.name].concat(b.aliases || []);
      names.forEach(n => rows.push({ id:b.id, alias:U.norm(n), len:U.norm(n).length }));
    });
    return rows.sort((a, b) => b.len - a.len);
  })();

  /* Birim donusumleri. Laboratuvarlar ayni olcumu farkli birimde verebilir;
     bilinen donusumler uygulanir, BILINMEYEN birim donusturulmez ve
     kullaniciya bildirilir. */
  const CONVERT = {
    vitd:{ 'nmol/l':v => v / 2.496 },
    glucose:{ 'mmol/l':v => v * 18.016 },
    chol:{ 'mmol/l':v => v * 38.67 },
    ldl:{ 'mmol/l':v => v * 38.67 },
    hdl:{ 'mmol/l':v => v * 38.67 },
    trig:{ 'mmol/l':v => v * 88.57 },
    creat:{ 'µmol/l':v => v / 88.4, 'umol/l':v => v / 88.4 },
    b12:{ 'pmol/l':v => v / 0.738 },
    ferritin:{ 'µg/l':v => v, 'ug/l':v => v },   /* ng/mL ile ayni buyukluk */
    iron_s:{ 'µmol/l':v => v * 5.587, 'umol/l':v => v * 5.587 },
  };

  function convert(markerId, value, unitRaw){
    const b = SP.BIO_BY_ID[markerId];
    if(!b || value == null) return { value, converted:false };
    const unit = String(unitRaw || '').trim().toLowerCase();
    if(!unit) return { value, converted:false };
    const want = String(b.unit || '').toLowerCase();
    if(unit === want) return { value, converted:false };
    const table = CONVERT[markerId];
    if(table && table[unit]){
      return { value:U.round(table[unit](value), 3), converted:true, from:unitRaw, to:b.unit };
    }
    return { value, converted:false, mismatch:unit !== want ? unitRaw : null };
  }

  /* Bir satirda gecen belirteci bulur. En uzun eslesme kazanir. */
  function matchMarker(line){
    const n = U.norm(line);
    for(let i = 0; i < ALIAS_INDEX.length; i++){
      const row = ALIAS_INDEX[i];
      if(row.alias.length < 2) continue;
      const at = n.indexOf(row.alias);
      if(at < 0) continue;
      /* Kelime siniri: "hb" ararken "hba1c" icindeki hb eslesmemeli. */
      const before = at === 0 ? ' ' : n[at - 1];
      const after = n[at + row.alias.length] || ' ';
      if(/[a-z0-9]/.test(before) || /[a-z0-9]/.test(after)) continue;
      return { id:row.id, at, alias:row.alias };
    }
    return null;
  }

  const NUM_RE = /(-?\d+(?:[.,]\d+)?)/g;
  const UNIT_RE = /(mg\/dl|g\/dl|ng\/ml|pg\/ml|µg\/dl|ug\/dl|µg\/l|ug\/l|miu\/l|mIU\/L|µiu\/ml|uiu\/ml|mmol\/l|µmol\/l|umol\/l|pmol\/l|nmol\/l|mm\/saat|u\/l|mmhg|10\^3\/µl|10\^3\/ul|fl|%|ms|°c)/i;

  function parseLab(text){
    const lines = String(text || '').split(/\r?\n/);
    const rows = [], unmatched = [];

    lines.forEach((line, i) => {
      const trimmed = line.trim();
      if(!trimmed) return;

      const m = matchMarker(trimmed);
      if(!m){
        /* Sayi iceren ama eslesmeyen satirlar kullaniciya gosterilir;
           icinde hic sayi olmayan basliklar sessizce gecilir. */
        if(NUM_RE.test(trimmed)){ NUM_RE.lastIndex = 0; unmatched.push({ line:trimmed, i }); }
        NUM_RE.lastIndex = 0;
        return;
      }

      /* Sayi, eslesen adin SONRASINDA aranir. Adin kendisinde rakam
         gecebilir ("25-OH D", "B12", "hs-CRP") ve o rakam sonuc sanilirdi. */
      const tail = trimmed.slice(Math.min(trimmed.length, m.at + m.alias.length));
      NUM_RE.lastIndex = 0;
      const nums = (tail.match(NUM_RE) || []).map(num).filter(v => v != null);
      if(!nums.length){ unmatched.push({ line:trimmed, i, marker:m.id }); return; }

      const unitHit = tail.match(UNIT_RE);
      const conv = convert(m.id, nums[0], unitHit ? unitHit[1] : null);
      const b = SP.BIO_BY_ID[m.id];

      rows.push({
        markerId:m.id, marker:b,
        value:conv.value, raw:nums[0],
        unit:unitHit ? unitHit[1] : null,
        converted:!!conv.converted, from:conv.from, to:conv.to,
        mismatch:conv.mismatch || null,
        /* Referans araligi satirda genelde ikinci ve ucuncu sayidir;
           yalnizca bilgi olarak tasinir, hesaba girmez. */
        othersInLine:nums.slice(1),
        line:trimmed, i,
      });
    });

    /* Ayni belirtec birden fazla satirda gectiyse ilki tutulur;
       raporlarda ozet tablo ve ayrinti tablosu ayni degeri tekrarlar. */
    const seen = {}, unique = [];
    rows.forEach(r => {
      if(seen[r.markerId]) { r.duplicate = true; return; }
      seen[r.markerId] = true;
      unique.push(r);
    });

    return {
      rows:unique, duplicates:rows.filter(r => r.duplicate).length,
      unmatched, lines:lines.length,
      note:unique.length
        ? unique.length + ' değer eşleşti'
          + (unmatched.length ? ', ' + unmatched.length + ' satır eşleşmedi' : '') + '.'
        : 'Hiçbir değer eşleşmedi. Rapor metnini olduğu gibi yapıştırdığından emin ol.',
    };
  }

  /* ------------------------------------------------------------- ogun metni

     "1 tabak etli kuru fasulye, 2 dilim ekmek ve 1 bardak ayran"

     Parcalara ayrilir, her parcada miktar + ev olcusu + gida aranir.
     Gramaj dogrudan yazildiysa ("150 g tavuk") olcum kesinligi "olculdu",
     ev olcusunden geldiyse "tahmin" olur. */

  const WORD_NUM = {
    'yarim':0.5, 'yarım':0.5, 'bir':1, 'iki':2, 'uc':3, 'üç':3, 'dort':4, 'dört':4,
    'bes':5, 'beş':5, 'alti':6, 'altı':6, 'yedi':7, 'sekiz':8, 'dokuz':9, 'on':10,
  };

  const FOOD_ALIAS = (function(){
    const rows = [];
    SP.FOODS.forEach(f => {
      const names = [f.name].concat(f.aliases || []);
      names.forEach(n => rows.push({ id:f.id, alias:U.norm(n), len:U.norm(n).length }));
    });
    return rows.sort((a, b) => b.len - a.len);
  })();

  const PORTION_ALIAS = (function(){
    /* Butun gidalarin ev olculeri tek tabloda; "tabak", "kase", "dilim" gibi
       sozcukler gidaya gore farkli gram tasir. */
    const rows = [];
    SP.FOODS.forEach(f => {
      (f.portions || []).forEach(p => {
        /* "1 tabak" -> olcunun sozcuk kismi */
        const word = U.norm(p.label).replace(/^\d+\s*/, '').replace(/\s*\(.*\)$/, '');
        rows.push({ foodId:f.id, word, g:p.g, label:p.label });
      });
    });
    return rows;
  })();

  function matchFood(chunk){
    const n = U.norm(chunk);
    for(let i = 0; i < FOOD_ALIAS.length; i++){
      const row = FOOD_ALIAS[i];
      if(row.alias.length < 3) continue;
      if(n.indexOf(row.alias) >= 0) return row.id;
    }
    return null;
  }

  function matchPortion(chunk, foodId){
    const n = U.norm(chunk);
    const own = PORTION_ALIAS.filter(p => p.foodId === foodId);
    for(let i = 0; i < own.length; i++){
      if(own[i].word && n.indexOf(own[i].word) >= 0) return own[i];
    }
    return null;
  }

  function parseMeal(text){
    const raw = String(text || '').trim();
    if(!raw) return { items:[], unmatched:[], note:'Metin boş.' };

    /* Ayiraclar: virgul, "ve", "+", satir sonu, noktali virgul.
       Ondalik virgul ayirac DEGILDIR: "0,2 kg" tek parcadir. Bolmeden once
       iki rakam arasindaki virgul gecici olarak korunur. */
    const GUARD = '\u0000';
    const guarded = raw.replace(/(\d),(\d)/g, '$1' + GUARD + '$2');
    const chunks = guarded.split(/\s*(?:,|;|\+|\bve\b|\n)\s*/i)
      .map(s => s.split(GUARD).join(',').trim()).filter(Boolean);

    const items = [], unmatched = [];

    chunks.forEach(chunk => {
      const foodId = matchFood(chunk);
      if(!foodId){ unmatched.push(chunk); return; }
      const food = SP.FOOD_BY_ID[foodId];

      /* miktar: once rakam, yoksa sayi sozcugu, yoksa 1 */
      let qty = null;
      const digit = chunk.match(/(\d+(?:[.,]\d+)?)/);
      if(digit) qty = num(digit[1]);
      if(qty == null){
        const words = U.norm(chunk).split(/\s+/);
        for(let i = 0; i < words.length; i++){
          if(WORD_NUM[words[i]] != null){ qty = WORD_NUM[words[i]]; break; }
        }
      }
      if(qty == null) qty = 1;

      /* Dogrudan gram yazilmis mi? "150 g", "200 gram", "0,3 kg" */
      const gramHit = chunk.match(/(\d+(?:[.,]\d+)?)\s*(kg|gr|gram|g)\b/i);
      if(gramHit){
        const v = num(gramHit[1]);
        const g = /kg/i.test(gramHit[2]) ? v * 1000 : v;
        items.push({ foodId, food, g:Math.round(g), qty:null, portion:null,
          cert:'measured', source:chunk });
        return;
      }

      /* Ev olcusu */
      const p = matchPortion(chunk, foodId);
      if(p){
        items.push({ foodId, food, g:Math.round(p.g * qty), qty, portion:p.label,
          cert:'estimated', source:chunk });
        return;
      }

      /* Olcu yoksa gidanin ilk ev olcusu varsayilir ve tahmin isaretlenir. */
      const first = (food.portions || [])[0];
      if(first){
        items.push({ foodId, food, g:Math.round(first.g * qty), qty, portion:first.label,
          cert:'estimated', assumed:true, source:chunk });
        return;
      }
      items.push({ foodId, food, g:Math.round(100 * qty), qty, portion:'100 g',
        cert:'estimated', assumed:true, source:chunk });
    });

    return {
      items, unmatched,
      note:items.length
        ? items.length + ' gıda eşleşti'
          + (unmatched.length ? ', ' + unmatched.length + ' parça eşleşmedi' : '') + '.'
        : 'Hiçbir gıda eşleşmedi. "1 tabak mercimek çorbası" gibi yazmayı dene.',
    };
  }

  /* Ayristirilmis satirlari bir tahlil oturumuna yazar. */
  function toLabRecord(parsed, dateISO, meta){
    const rec = SP.Model.newLab(dateISO);
    rec.source = 'paste';
    if(meta && meta.lab) rec.lab = meta.lab;
    parsed.rows.forEach(r => {
      if(r.skip) return;
      rec.values[r.markerId] = { v:r.value, cert:'measured',
        unit:r.unit || (r.marker ? r.marker.unit : null),
        converted:r.converted || false };
    });
    return rec;
  }

  return { num, parseLab, parseMeal, matchMarker, matchFood, matchPortion,
    convert, toLabRecord, ALIAS_INDEX, FOOD_ALIAS, WORD_NUM };
})();

/* ==== js/core/voice.js ==== */
/* Ses ile dikte.

   Bu katman KONUSMA degil DIKTE yapar: ses metne cevrilir, metin var olan
   alana yazilir ve oradan sonra her sey yazarak girmisin gibi isler. Yeni
   bir ayristirici, yeni bir kesinlik etiketi, yeni bir kayit yolu yoktur.

   Bu kasitlidir. "Bir tabak etli kuru fasulye, bir bardak ayran" cumlesini
   coktan ayristirabiliyoruz (SP.Parse.parseMeal). Sesin yapmasi gereken tek
   is o cumleyi klavye yerine uretmek. Sesli cevap (TTS) yoktur: kesinlik
   katmaz, bedel katar.

   Tarayicinin kendi konusma motoru kullanilir. Desteklenmeyen tarayicida
   katman sessizce yok olur -- mikrofon dugmesi hic cizilmez, elle giris
   yolu zaten her yerde durur. */

window.SP = window.SP || {};

SP.Voice = (function(){

  const Rec = window.SpeechRecognition || window.webkitSpeechRecognition || null;

  /* Ayni anda tek bir oturum. Iki alan birden dinlerse hangi alana
     yazildigi belirsizlesir. */
  let active = null;

  function supported(){ return !!Rec; }

  /* Dikte oturumu.

     `opts.onText(text, final)` her tanima adiminda cagrilir; `final`
     false iken metin henuz degisebilir (ara sonuc), true olunca sabitlenir.
     Cagiran taraf ara sonuclari da yazar ki kullanici konusurken
     yazildigini gorsun. */
  function start(opts){
    const o = opts || {};
    if(!Rec){ if(o.onError) o.onError('unsupported'); return null; }
    stop();

    let rec;
    try{ rec = new Rec(); }
    catch(e){ if(o.onError) o.onError('unsupported'); return null; }

    rec.lang = o.lang || 'tr-TR';
    rec.continuous = o.continuous !== false;
    rec.interimResults = true;
    rec.maxAlternatives = 1;

    /* Oturum boyunca sabitlenmis metin burada birikir; ara sonuc bunun
       ustune eklenir ama birikime yazilmaz. */
    let settled = '';

    rec.onresult = ev => {
      let interim = '';
      for(let i = ev.resultIndex; i < ev.results.length; i++){
        const piece = ev.results[i][0].transcript;
        if(ev.results[i].isFinal) settled += piece;
        else interim += piece;
      }
      const text = (settled + interim).replace(/\s+/g, ' ').trim();
      if(o.onText) o.onText(text, !interim);
    };

    rec.onerror = ev => {
      const code = ev && ev.error ? ev.error : 'error';
      /* "no-speech" bir hata degil, sessizliktir: kullaniciya hata
         gostermek yerine oturumu sessizce bitiririz. */
      if(code !== 'no-speech' && code !== 'aborted' && o.onError) o.onError(code);
    };

    rec.onend = () => {
      const was = active;
      active = null;
      if(was && o.onEnd) o.onEnd(settled.replace(/\s+/g, ' ').trim());
    };

    try{ rec.start(); }
    catch(e){ if(o.onError) o.onError('start'); return null; }

    active = { rec, target:o.target || null };
    return active;
  }

  function stop(){
    if(!active) return;
    const a = active;
    active = null;
    try{ a.rec.stop(); }catch(e){}
  }

  function isActive(){ return !!active; }
  function activeTarget(){ return active ? active.target : null; }

  /* Bir metin alanina baglanan dikte.

     Alandaki mevcut metin KORUNUR: dikte onun sonuna eklenir. Kullanici
     yarim yazip sonra konusmaya baslayabilsin diye. */
  function dictateInto(el, opts){
    const o = opts || {};
    if(!el) return null;
    const base = el.value ? el.value.replace(/\s+$/, '') + ' ' : '';

    return start({
      target:el.id || null,
      lang:o.lang,
      onText(text){
        el.value = base + text;
        /* Uzun metinde imlec sonda kalsin ki kullanici yazilani gorsun. */
        try{ el.selectionStart = el.selectionEnd = el.value.length; }catch(e){}
        if(o.onText) o.onText(el.value);
      },
      onEnd(final){
        if(o.onEnd) o.onEnd(base + final);
      },
      onError:o.onError,
    });
  }

  const MESSAGES = {
    unsupported:'Bu tarayıcı ses tanımayı desteklemiyor. Chrome ya da Edge dene.',
    'not-allowed':'Mikrofon izni verilmedi.',
    'service-not-allowed':'Mikrofon izni verilmedi.',
    'audio-capture':'Mikrofon bulunamadı.',
    network:'Ses tanıma için bağlantı gerekiyor.',
    start:'Mikrofon başlatılamadı.',
  };
  function message(code){ return MESSAGES[code] || 'Ses tanıma çalışmadı.'; }

  return { supported, start, stop, isActive, activeTarget, dictateInto, message };
})();

/* ==== js/core/extract.js ==== */
/* Belge ve fotograftan veri cikarma.

   Ekranlar modeli TANIMAZ. Hepsi bu modulden gecer; saglayici degisince,
   model kapaliyken ya da cevrimdisiyken ekranlara dokunulmaz.

   Uc degismez:

     1. Uygulama modelsiz calismaya devam eder. Metin dosyasi ve
        yapistirilan metin modelsiz ayristirilir; model yalnizca metin
        ayristiricinin cozemedigi yerde devreye girer.

     2. Model dogrudan depoya YAZMAZ. Cikan her sonuc, tahlil
        yapistirmadaki "ayiklandi -> gozden gecir -> kaydet" adimina
        baglanir. Kullanici gormeden hicbir sey kaydedilmez.

     3. Model uydurma kimlik dondurmez. Cikti bizim tablolarimiza
        (SP.BIOMARKERS, SP.FOODS) eslenir; eslesmeyen satir atilmaz,
        "eslesmedi" olarak gosterilir.

   Kesinlik eslemesi yeni etiket icat etmez:

     tahlil belgesi -> olculdu   (laboratuvar olctu, biz okuduk)
     market fisi    -> olculdu   (fiyat fiste yazili)
     yemek fotografi-> tahmin    (porsiyonu model tahmin ediyor)

   MAHREMIYET DIKISI: disari cikan her istek `send()` icinden gecer.
   Sistem su an aile ici kullanildigi icin arindirma yapilmiyor; genele
   acilirken PDF'ten kimlik alanlarini kesme ve fotograftan EXIF silme
   adimi TEK BIR YERE, oraya takilir. */

window.SP = window.SP || {};

SP.Extract = (function(){
  const U = SP.U;

  const MAX_BYTES = 8 * 1024 * 1024;   /* 8 MB: buyuk dosya modele gitmez */

  function isImage(file){ return /^image\//.test(file.type); }
  function isPdf(file){ return file.type === 'application/pdf' || /\.pdf$/i.test(file.name); }
  function isText(file){
    return /^text\//.test(file.type)
      || /\.(txt|csv|md|json)$/i.test(file.name)
      || file.type === 'application/json';
  }

  function readText(file){
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('Dosya okunamadı.'));
      fr.readAsText(file, 'utf-8');
    });
  }

  function readDataUrl(file){
    return new Promise((resolve, reject) => {
      const fr = new FileReader();
      fr.onload = () => resolve(String(fr.result || ''));
      fr.onerror = () => reject(new Error('Dosya okunamadı.'));
      fr.readAsDataURL(file);
    });
  }

  /* data:image/png;base64,XXXX  ->  { mime, b64 } */
  function splitDataUrl(url){
    const m = /^data:([^;,]+)(?:;base64)?,(.*)$/.exec(url || '');
    if(!m) return null;
    return { mime:m[1], b64:m[2] };
  }

  function modelReady(){
    try{
      const s = SP.Office.settings();
      return SP.LLM.ready({ provider:s.provider, model:s.model });
    }catch(e){ return false; }
  }

  /* ---------------------------------------------------------- gonderim

     Disari cikan TEK nokta. Arindirma buraya takilacak. */
  async function send(req){
    const s = SP.Office.settings();
    return SP.LLM.chat(Object.assign({
      provider:s.provider,
      model:s.model,
      temperature:0,
      maxTokens:2000,
    }, req));
  }

  /* Modelin JSON dondurmesi istenir ama dondurmeyebilir; metnin icindeki
     ilk JSON blogu ayiklanir. Bulunamazsa hata degil BOS sonuc doner:
     kullanici elle girmeye devam eder. */
  function parseJson(text){
    if(!text) return null;
    const fenced = /```(?:json)?\s*([\s\S]*?)```/.exec(text);
    const body = fenced ? fenced[1] : text;
    const start = body.search(/[[{]/);
    if(start < 0) return null;
    const end = Math.max(body.lastIndexOf(']'), body.lastIndexOf('}'));
    if(end <= start) return null;
    try{ return JSON.parse(body.slice(start, end + 1)); }
    catch(e){ return null; }
  }

  /* ------------------------------------------------------------ tahlil

     Once METIN ayristiricisi denenir (modelsiz, aninda, bedava). Yalniz
     o hicbir sey bulamazsa ve elimizde bir goruntu varsa model devreye
     girer. Bu sira kasitlidir: calisan bir ayristiriciyi varken modele
     para ve saniye harcamak dogru degil. */
  const LAB_PROMPT =
    'Asagidaki tahlil raporundan olcum adi, degeri ve birimini cikar. '
    + 'Yalniz JSON dizisi dondur, baska hicbir sey yazma. Bicim: '
    + '[{"ad":"Ferritin","deger":26,"birim":"ng/mL"}]. '
    + 'Emin olmadigin satiri ATLA. Deger okunamiyorsa o satiri hic yazma. '
    + 'Tarihi, hasta bilgisini ve yorumu dondurme.';

  async function fromLabFile(file){
    if(!file) return empty('Dosya seçilmedi.');
    if(file.size > MAX_BYTES) return empty('Dosya çok büyük (en fazla 8 MB).');

    /* 1. Metin dosyasi: dogrudan ayristirici. */
    if(isText(file)){
      const text = await readText(file);
      const res = SP.Parse.parseLab(text);
      res.source = 'file';
      return res;
    }

    /* 2. Goruntu ya da PDF: model gerekir. */
    if(!isImage(file) && !isPdf(file)){
      return empty('Bu dosya türü okunamıyor. PDF, görüntü ya da metin dosyası ver.');
    }
    if(!modelReady()){
      return empty('Görüntü ve PDF okumak için Ayarlar → Rehber → Model bölümünden '
        + 'bir model bağlaman gerekiyor. Rapor metnini yapıştırarak modelsiz de girebilirsin.');
    }
    if(isPdf(file)){
      return empty('PDF doğrudan okunamıyor. Raporun ekran görüntüsünü ver ya da '
        + 'metnini yapıştır.');
    }

    const parts = splitDataUrl(await readDataUrl(file));
    if(!parts) return empty('Görüntü okunamadı.');

    let out;
    try{
      out = await send({
        system:'Sen bir tahlil raporu okuyucususun. Yalniz JSON dondurursun.',
        messages:[{ role:'user', text:LAB_PROMPT, images:[parts] }],
      });
    }catch(e){
      return empty('Model yanıt vermedi: ' + (e && e.message ? e.message : 'bilinmeyen hata'));
    }

    const rows = parseJson(out && out.text);
    if(!Array.isArray(rows) || !rows.length){
      return empty('Görüntüden ölçüm çıkarılamadı. Rapor metnini yapıştırmayı dene.');
    }

    /* Model satirlarini BIZIM ayristiricimiza geri veriyoruz: takma ad
       eslemesi, birim cevirimi ve esiklerin hepsi orada tanimli. Boylece
       modelin ciktisi da ayni denetimden geciyor. */
    const text = rows
      .map(r => [r.ad, r.deger, r.birim].filter(x => x != null && x !== '').join(' '))
      .join('\n');
    const res = SP.Parse.parseLab(text);
    res.source = 'photo';
    res.note = res.note + ' · görüntüden okundu';
    return res;
  }

  /* ------------------------------------------------------------- ogun

     Fotograf tek basina zayif bir kaynaktir: porsiyon buyuklugu
     fotograftan guvenilir cikmaz. Bu yuzden uc kisa not sorulur --
     ne kadari yendi, kabin olcusu, gizli malzeme. Tahmini guclendiren
     sey bu uc bilgidir ve sorulmadan verilmez. */
  function mealPrompt(hints){
    const names = SP.FOODS.map(f => f.id + '=' + f.name).join(', ');
    let p = 'Fotograftaki yemegi asagidaki listeden SEC ve gram olarak tahmin et. '
      + 'Yalniz JSON dizisi dondur: [{"id":"pilav","gram":180}]. '
      + 'Listede olmayan bir sey icin id yerine ad yaz: [{"ad":"lahmacun","gram":120}]. '
      + 'Emin olmadigin seyi yazma.\n\nListe: ' + names;
    const h = [];
    if(hints && hints.amount) h.push('Tabagin ' + hints.amount + ' kadari yendi.');
    if(hints && hints.vessel) h.push('Kabin olcusu: ' + hints.vessel + '.');
    if(hints && hints.extra)  h.push('Ek bilgi: ' + hints.extra + '.');
    if(h.length) p += '\n\nKullanicinin notu: ' + h.join(' ');
    return p;
  }

  async function fromMealPhoto(file, hints){
    if(!file) return { ok:false, items:[], unmatched:[], note:'Fotoğraf seçilmedi.' };
    if(file.size > MAX_BYTES){
      return { ok:false, items:[], unmatched:[], note:'Fotoğraf çok büyük (en fazla 8 MB).' };
    }
    if(!isImage(file)){
      return { ok:false, items:[], unmatched:[], note:'Bu bir görüntü dosyası değil.' };
    }
    if(!modelReady()){
      return { ok:false, items:[], unmatched:[],
        note:'Fotoğraftan öğün okumak için bir model bağlaman gerekiyor. '
          + 'Öğünü tek satır yazarak modelsiz de girebilirsin.' };
    }

    const parts = splitDataUrl(await readDataUrl(file));
    if(!parts) return { ok:false, items:[], unmatched:[], note:'Fotoğraf okunamadı.' };

    let out;
    try{
      out = await send({
        system:'Sen bir yemek fotografi okuyucususun. Yalniz JSON dondurursun.',
        messages:[{ role:'user', text:mealPrompt(hints), images:[parts] }],
      });
    }catch(e){
      return { ok:false, items:[], unmatched:[],
        note:'Model yanıt vermedi: ' + (e && e.message ? e.message : 'bilinmeyen hata') };
    }

    const rows = parseJson(out && out.text);
    if(!Array.isArray(rows) || !rows.length){
      return { ok:false, items:[], unmatched:[],
        note:'Fotoğraftan yemek çıkarılamadı. Öğünü yazarak girebilirsin.' };
    }

    /* Kimlik eslemesi: model uydurursa oraya DUSMEZ, "eslesmedi" olur. */
    const items = [], unmatched = [];
    rows.forEach(r => {
      const g = Number(r.gram);
      if(!isFinite(g) || g <= 0){ unmatched.push({ line:String(r.ad || r.id || '') }); return; }
      let food = r.id ? SP.FOOD_BY_ID[r.id] : null;
      if(!food && r.ad){
        const q = U.norm(String(r.ad));
        food = SP.FOODS.find(f => U.norm(f.name) === q)
          || SP.FOODS.find(f => (f.aliases || []).some(a => U.norm(a) === q));
      }
      if(!food){ unmatched.push({ line:String(r.ad || r.id || '') + ' · ' + g + ' g' }); return; }
      /* Fotograftan gelen gramaj her zaman TAHMINDIR. Kullanici tartip
         duzeltirse "olculdu" olur; bu zaten var olan davranis. */
      items.push({ foodId:food.id, g:Math.round(g), cert:'estimated', portion:'fotoğraf' });
    });

    return {
      ok:items.length > 0, items, unmatched,
      note:items.length
        ? items.length + ' gıda tanındı · gramaj tahmin'
        : 'Tanınan gıda listemizde yok.',
    };
  }

  /* -------------------------------------------------------------- fis

     Market fisi fiyat tablosunun curumesini cozer: tohum tahminler
     kullanicinin gercek fiyatiyla degisir ve "olculdu" olur. */
  const RECEIPT_PROMPT =
    'Asagidaki market fisinden urun adi ve KILOGRAM BASINA fiyati cikar. '
    + 'Yalniz JSON dizisi dondur: [{"ad":"kuru fasulye","tlKg":120}]. '
    + 'Fis toplam fiyat ve agirlik veriyorsa kilogram fiyatini hesapla. '
    + 'Emin olmadigin satiri atla. Toplam, kdv ve kasa satirlarini yazma.';

  async function fromReceipt(file){
    if(!file) return { ok:false, rows:[], unmatched:[], note:'Dosya seçilmedi.' };
    if(file.size > MAX_BYTES){
      return { ok:false, rows:[], unmatched:[], note:'Dosya çok büyük (en fazla 8 MB).' };
    }

    let userText = null;
    if(isText(file)) userText = await readText(file);
    else if(!isImage(file)){
      return { ok:false, rows:[], unmatched:[],
        note:'Fiş için görüntü ya da metin dosyası ver.' };
    }
    if(!modelReady()){
      return { ok:false, rows:[], unmatched:[],
        note:'Fiş okumak için bir model bağlaman gerekiyor. Fiyatları Finans → Fiyat '
          + 'sayfasından elle de girebilirsin.' };
    }

    const msg = { role:'user', text:RECEIPT_PROMPT + (userText ? '\n\n' + userText : '') };
    if(!userText){
      const parts = splitDataUrl(await readDataUrl(file));
      if(!parts) return { ok:false, rows:[], unmatched:[], note:'Görüntü okunamadı.' };
      msg.images = [parts];
    }

    let out;
    try{
      out = await send({ system:'Sen bir market fisi okuyucususun. Yalniz JSON dondurursun.',
        messages:[msg] });
    }catch(e){
      return { ok:false, rows:[], unmatched:[],
        note:'Model yanıt vermedi: ' + (e && e.message ? e.message : 'bilinmeyen hata') };
    }

    const parsed = parseJson(out && out.text);
    if(!Array.isArray(parsed) || !parsed.length){
      return { ok:false, rows:[], unmatched:[], note:'Fişten fiyat çıkarılamadı.' };
    }

    const rows = [], unmatched = [];
    parsed.forEach(r => {
      const tl = Number(r.tlKg);
      if(!isFinite(tl) || tl <= 0){ unmatched.push({ line:String(r.ad || '') }); return; }
      const q = U.norm(String(r.ad || ''));
      const food = SP.FOODS.find(f => U.norm(f.name) === q)
        || SP.FOODS.find(f => (f.aliases || []).some(a => U.norm(a) === q))
        || SP.FOODS.find(f => U.norm(f.name).indexOf(q) >= 0 && q.length >= 4);
      if(!food){ unmatched.push({ line:String(r.ad || '') + ' · ' + tl + ' TL/kg' }); return; }
      rows.push({ food, tl:Math.round(tl * 100) / 100, skip:false });
    });

    return {
      ok:rows.length > 0, rows, unmatched,
      note:rows.length ? rows.length + ' ürün eşleşti' : 'Eşleşen ürün yok.',
    };
  }

  function empty(note){
    return { rows:[], unmatched:[], note, date:U.todayISO(), lab:'' };
  }

  return {
    supported:modelReady, modelReady,
    isImage, isPdf, isText,
    readText, readDataUrl,
    fromLabFile, fromMealPhoto, fromReceipt,
    parseJson, send, MAX_BYTES,
  };
})();

  function icon(name, cls){
    const p = PATHS[name] || PATHS.info;
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"'
      + (cls ? ' class="'+cls+'"' : '') + '>' + p + '</svg>';

  /* ---------- bölüm imzaları ----------

     Her bölümün hero'sunda duran ince, tek renkli işaret. Süs değil:
     bölümün NE ÖLÇTÜĞÜNÜ soyutlar ve kullanıcı sayfayı okumadan hangi
     bölümde olduğunu çevresel görüşle anlar.

     Hepsi aynı dille çizilir: 34px yükseklik, 1.5px çizgi, tek renk,
     dolgu yok. Farklı kalınlıkta ya da renkli bir imza, tek tasarım
     kuralını bozardı. */
  const MOTIFS = {
    /* Günlük — bir günün yirmi dört çentiği, biri işaretli. */
    gunluk:function(){
      let d = '';
      for(let i = 0; i < 24; i++){
        const x = i * 11 + 1;
        const h = i % 6 === 0 ? 22 : 12;
        d += '<line x1="' + x + '" y1="' + (28 - h) + '" x2="' + x + '" y2="28"/>';
      }
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5"'
        + ' stroke-linecap="round" aria-hidden="true">' + d
        + '<circle cx="133" cy="7" r="3.5" fill="currentColor" stroke="none"/></svg>';
    },
    /* Testler — bir ölçüm cetveli: referans aralığı ve içindeki değer. */
    testler:function(){
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5"'
        + ' stroke-linecap="round" aria-hidden="true">'
        + '<line x1="2" y1="20" x2="263" y2="20"/>'
        + '<line x1="2" y1="14" x2="2" y2="26"/><line x1="263" y1="14" x2="263" y2="26"/>'
        + '<rect x="86" y="16" width="94" height="8" rx="4" fill="currentColor" stroke="none" opacity=".28"/>'
        + '<line x1="118" y1="8" x2="118" y2="32" stroke-width="2.5"/></svg>';
    },
    /* Besin — bir tabakta üç makro dilimi. */
    besin:function(){
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'
        + '<circle cx="17" cy="17" r="14"/>'
        + '<path d="M17 3a14 14 0 0 1 12.1 21"/>'
        + '<line x1="42" y1="11" x2="150" y2="11"/>'
        + '<line x1="42" y1="20" x2="205" y2="20"/>'
        + '<line x1="42" y1="29" x2="118" y2="29"/></svg>';
    },
    /* Hareket — bir efor eğrisi ve toparlanma. */
    hareket:function(){
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5"'
        + ' stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
        + '<path d="M2 26c14 0 18-16 30-16s16 16 30 16 18-20 30-20 16 20 30 20"/>'
        + '<path d="M152 26h18" stroke-dasharray="1 6"/>'
        + '<path d="M178 26c12 0 14-12 24-12s14 8 24 8 12-6 22-6h15" opacity=".55"/></svg>';
    },
    /* Finans — bir defter sütunu: kalemler ve toplam çizgisi. */
    finans:function(){
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5"'
        + ' stroke-linecap="round" aria-hidden="true">'
        + '<line x1="2" y1="7" x2="120" y2="7"/><line x1="178" y1="7" x2="215" y2="7"/>'
        + '<line x1="2" y1="16" x2="98" y2="16"/><line x1="178" y1="16" x2="228" y2="16"/>'
        + '<line x1="2" y1="25" x2="134" y2="25"/><line x1="178" y1="25" x2="206" y2="25"/>'
        + '<line x1="170" y1="31" x2="240" y2="31" stroke-width="2"/></svg>';
    },
    /* Ofis — patron ve dört koç. */
    ofis:function(){
      let d = '<circle cx="17" cy="17" r="9"/>';
      for(let i = 0; i < 4; i++){
        const x = 62 + i * 34;
        d += '<circle cx="' + x + '" cy="17" r="6.5"/>'
           + '<line x1="' + (x - 28) + '" y1="17" x2="' + (x - 8) + '" y2="17" opacity=".45"/>';
      }
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">'
        + d + '</svg>';
    },
    /* Ayarlar — üç sürgü. */
    ayarlar:function(){
      return '<svg viewBox="0 0 265 34" fill="none" stroke="currentColor" stroke-width="1.5"'
        + ' stroke-linecap="round" aria-hidden="true">'
        + '<line x1="2" y1="7" x2="150" y2="7"/><circle cx="104" cy="7" r="4.5" fill="var(--bg)"/>'
        + '<line x1="2" y1="17" x2="150" y2="17"/><circle cx="52" cy="17" r="4.5" fill="var(--bg)"/>'
        + '<line x1="2" y1="27" x2="150" y2="27"/><circle cx="126" cy="27" r="4.5" fill="var(--bg)"/></svg>';

  function motif(sectionId){
    const fn = MOTIFS[sectionId];
    return fn ? fn() : '';
  }

  /* ---------- kucuk parcalar ----------
     Not: rozet/kart/tablo gibi bilesenler SP.C icinde tek yerde durur.
     Burada yalnizca SP.C'ye girmeyen, veriye bagli parcalar kalir. */

  /* Olcumun yonunu tek bakista veren ok. Yon iyi/kotu demek degildir;
     iyi/kotu yorumu daima kural motorundan (Calc) gelir. */
  function trend(dir){
    const map = { up:'&#9650;', down:'&#9660;', flat:'&#8212;' };
    return '<span class="trendmark trendmark--'+(dir||'flat')+'" aria-hidden="true">'
      + (map[dir] || map.flat) + '</span>';
  }

  /* ---------- kadran ----------

     Toparlanma skoru bir yuzde degil bir DURUMDUR; yatay bir cubuk onu
     "ne kadar dolduruldu" gibi okutuyordu. Yay, bir olcegin uzerindeki
     ibre gibi durur: sifir ve yuz uclarda, deger arada bir yerde.

     Bantlar (dusuk/orta/yuksek) yayin arkasinda soluk cizgilerle
     isaretlenir; skorun hangi banda dustugu renkten once KONUMDAN
     okunur. Renk tek basina anlam tasimaz. */
  function gauge(value, opts){
    const o = opts || {};
    const size = o.size || 132;
    const max = o.max || 100;
    const r = 54, cx = 60, cy = 60;
    /* 240 derecelik yay: alt taraf acik kalir, ibre orada baslar ve biter. */
    const START = 150, SWEEP = 240;
    const pt = deg => {
      const a = (deg * Math.PI) / 180;
      return [(cx + r * Math.cos(a)).toFixed(2), (cy + r * Math.sin(a)).toFixed(2)];
    };
    const arc = (from, to, w, cls2, extra) => {
      const [x1, y1] = pt(from), [x2, y2] = pt(to);
      const large = (to - from) > 180 ? 1 : 0;
      return '<path d="M' + x1 + ' ' + y1 + ' A' + r + ' ' + r + ' 0 ' + large + ' 1 '
        + x2 + ' ' + y2 + '" class="' + cls2 + '" stroke-width="' + w + '" fill="none"'
        + ' stroke-linecap="round"' + (extra || '') + '/>';
    };

    const has = value != null && isFinite(value);
    const pct = has ? U.clamp(value / max, 0, 1) : 0;
    let out = '<div class="gauge" style="width:' + size + 'px">';
    out += '<svg viewBox="0 0 120 120" role="img" aria-label="'
      + (has ? 'Skor ' + Math.round(value) + ' / ' + max : 'Skor yok') + '">';
    out += arc(START, START + SWEEP, 7, 'gauge__track');
    /* Bant sinirlari — kadranin uzerindeki centikler. */
    (o.bands || []).forEach(b => {
      const d = START + SWEEP * U.clamp(b / max, 0, 1);
      const [ix, iy] = pt(d);
      const inner = r - 9;
      const a = (d * Math.PI) / 180;
      const x0 = (cx + inner * Math.cos(a)).toFixed(2);
      const y0 = (cy + inner * Math.sin(a)).toFixed(2);
      out += '<line x1="' + x0 + '" y1="' + y0 + '" x2="' + ix + '" y2="' + iy
        + '" class="gauge__band"/>';
    });
    if(has && pct > 0){
      out += arc(START, START + SWEEP * pct, 7, 'gauge__value gauge__value--' + (o.tone || ''));
    }
    out += '</svg>';
    out += '<div class="gauge__center">'
      + '<span class="gauge__num num">' + (has ? Math.round(value) : '&mdash;') + '</span>'
      + (o.label ? '<span class="gauge__label">' + esc(o.label) + '</span>' : '')
      + '</div>';
    out += '</div>';
    return out;
  }

  /* ---------- grafikler ---------- */
  /* Eksen adimini 1/2/5/10 ailesine oturtur ki etiketler yuvarlak sayi olsun. */
  function niceStep(raw){
    if(!isFinite(raw) || raw <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * mag;
  }

  function lineChart(series, opts){
    const o = opts || {};
    const w = 640, h = o.height || 190, padL = 34, padR = 14, padT = 14, padB = 26;
    const all = series.reduce((acc,s) => acc.concat(s.data.filter(v => v != null)), []);
    if(!all.length) return '<p class="small dim">Grafik için henüz veri yok.</p>';

    const maxV = Math.max.apply(null, all), minV = Math.min.apply(null, all);
    const pad = Math.max(2, (maxV-minV)*0.2);
    const step = niceStep((maxV+pad - Math.max(0, minV-pad)) / 4);
    const top = o.max != null ? o.max : Math.ceil((maxV+pad) / step) * step;
    const bottom = o.min != null ? o.min : Math.max(0, Math.floor((minV-pad) / step) * step);
    const n = Math.max.apply(null, series.map(s => s.data.length));
    const X = i => padL + (w-padL-padR) * (n <= 1 ? 0.5 : i/(n-1));
    const Y = v => h-padB - (h-padT-padB) * ((v-bottom)/((top-bottom)||1));

    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img">';
    const ticks = 4;
    for(let i = 0; i <= ticks; i++){
      const v = bottom + (top-bottom)*i/ticks;
      const y = Y(v);
      svg += '<line class="axis" x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(v)+'</text>';
    }
    if(o.band){
      const y1 = Y(o.band[1]), y2 = Y(o.band[0]);
      svg += '<rect class="band" x="'+padL+'" y="'+y1+'" width="'+(w-padL-padR)+'" height="'+Math.max(0,y2-y1)+'" opacity=".5"/>';
    }
    series.forEach(s => {
      const pts = s.data.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
      if(!pts.length) return;
      const d = 'M' + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
      if(pts.length > 1 && o.area !== false){
        svg += '<path class="area'+(s.accent?' area--accent':'')+'" d="'+d+' L '+pts[pts.length-1][0].toFixed(1)+' '+(h-padB)+' L '+pts[0][0].toFixed(1)+' '+(h-padB)+' Z"/>';
      }
      svg += '<path class="line'+(s.accent?' line--accent':'')+'" d="'+d+'"/>';
      pts.forEach((p,i) => {
        const last = i === pts.length-1;
        svg += '<circle class="pt'+(s.accent?' pt--accent':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?4:2.6)+'"/>';
      });
    });
    if(o.labels){
      o.labels.forEach((lb,i) => {
        if(n > 8 && i % 2) return;
        svg += '<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle">'+U.esc(lb)+'</text>';
      });
    }
    svg += '</svg>';
    return svg;
  }

  function barChart(rows, opts){
    const o = opts || {};
    const w = 640, h = o.height || 150, padL = 30, padR = 10, padT = 12, padB = 26;
    if(!rows.length) return '<p class="small dim">Veri yok.</p>';
    const top = o.max || 100;
    const bw = (w-padL-padR) / rows.length;
    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img">';
    [0, 0.5, 1].forEach(f => {
      const y = padT + (h-padT-padB)*f;
      svg += '<line class="axis" x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(top*(1-f))+'</text>';
    });
    if(o.targetLine != null){
      const y = padT + (h-padT-padB)*(1 - o.targetLine/top);
      svg += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4"/>';
    }
    rows.forEach((r,i) => {
      const v = r.value == null ? 0 : U.clamp(r.value, 0, top);
      const bh = (h-padT-padB) * (v/top);
      const x = padL + bw*i + bw*0.18;
      const y = h-padB-bh;
      const cls = r.value == null ? 'barfill--muted' : (r.value >= (o.goodAt||85) ? 'barfill' : 'barfill--muted');
      svg += '<rect class="'+cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="3"'
        + (r.value != null && r.value < (o.goodAt||85) ? ' fill="var(--accent)"' : '') + '/>';
      svg += '<text x="'+(padL+bw*i+bw/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+U.esc(r.label)+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  /* Referans araligi cubugu — bir tahlil degerinin nerede durdugunu gosterir.
     Uc bolge vardir: laboratuvar referans araligi (genis, notr), hedef bant
     (dar, birincil renk) ve degerin kendisi (isaret). Renk tek basina anlam
     tasimaz: isaretin yaninda daima sayi ve durum rozeti bulunur.

       ref     [low, high]  laboratuvarin referans araligi
       optimal [low, high]  kisisel hedef bant (varsa)
       value   olculen deger  */
  /* `opts.bare` verilirse yalnizca cubuk cizilir, altindaki sayi satiri
     cizilmez. Uzun bir listede her satirin altinda "30 · referans · hedef
     80-250 · 400 ng/mL" yazmak satiri okunmaz hale getiriyordu; o ayrinti
     satira tiklayinca acilan kagitta zaten tam haliyle duruyor. */
  function rangeBar(value, ref, optimal, unit, opts){
    if(!ref || ref.length !== 2) return '';
    const lo = Number(ref[0]), hi = Number(ref[1]);
    const span = hi - lo;
    if(!isFinite(span) || span <= 0) return '';
    /* Eksen referans araligindan %60 daha genis cizilir ki disari tasan
       degerler de cubugun icinde kalsin ve ne kadar tastigi gorunsun. */
    const axisLo = lo - span * 0.6;
    const axisHi = hi + span * 0.6;
    const p = v => U.clamp(100 * (v - axisLo) / (axisHi - axisLo), 0, 100);
    const o = opts || {};

    /* Cetvel bir ilerleme cubugu degil, bir OLCU ALETIDIR: dolu bir kutu
       "ne kadar tamamlandi" der; burada sorulan o degil, "deger nerede
       duruyor". Bu yuzden zemin bos, referans araligi ince bir bant,
       hedef bandi bir alt cizgi, deger ise tek bir hassas ibredir. */
    let out = '<div class="scale' + (o.bare ? ' scale--bare' : '') + '">';
    out += '<div class="scale__axis">';
    out += '<div class="scale__ref" style="left:' + p(lo).toFixed(1) + '%;width:'
      + (p(hi) - p(lo)).toFixed(1) + '%"></div>';
    if(optimal && optimal.length === 2){
      out += '<div class="scale__opt" style="left:' + p(optimal[0]).toFixed(1) + '%;width:'
        + Math.max(1.5, p(optimal[1]) - p(optimal[0])).toFixed(1) + '%"></div>';
    }
    /* Referans araliginin iki ucunda birer centik: aralik nerede baslayip
       nerede bittigi cizgiyle de okunur, yalniz renkle degil. */
    out += '<i class="scale__tick" style="left:' + p(lo).toFixed(1) + '%"></i>';
    out += '<i class="scale__tick" style="left:' + p(hi).toFixed(1) + '%"></i>';
    if(value != null && isFinite(value)){
      const outside = value < lo || value > hi;
      out += '<div class="scale__mark' + (outside ? ' is-out' : '') + '" style="left:'
        + p(value).toFixed(1) + '%"></div>';
    }
    out += '</div>';
    if(o.bare){ out += '</div>'; return out; }
    out += '<div class="scale__legend">'
      + '<span class="scale__end num">' + U.fmtNum(lo) + '</span>'
      + '<span class="scale__mid">referans'
      + (optimal ? ' <b>&middot; hedef ' + U.fmtNum(optimal[0]) + '&ndash;' + U.fmtNum(optimal[1]) + '</b>' : '')
      + '</span>'
      + '<span class="scale__end num">' + U.fmtNum(hi) + (unit ? ' ' + esc(unit) : '') + '</span>'
      + '</div>';
    out += '</div>';
    return out;
  }

  /* Makro dagilimi — protein/yag/karbonhidrat oranini tek seritte verir.
     Segment renkleri kimliktir (hangi makro), durum degil.

     Girdi KALORI cinsindendir ama efsanede YUZDE yazar: "Protein 384" gibi
     bir sayi okuyucuya hicbir sey soylemez, "Protein %28" soyler. */
  function macroSplit(macros){
    const p = Math.max(0, macros.protein || 0);
    const f = Math.max(0, macros.fat || 0);
    const c = Math.max(0, macros.carb || 0);
    const total = p + f + c;
    if(!total) return '<p class="small dim">Makro dağılımı için öğün gerekir.</p>';
    const seg = (label, v, color) => ({ label:label + ' %' + Math.round(100 * v / total), value:v, color });
    return stackBar([
      seg('Protein', p, 'var(--macro-protein)'),
      seg('Yağ', f, 'var(--macro-fat)'),
      seg('Karbonhidrat', c, 'var(--macro-carb)'),
    ]);
  }

  function donut(pct, label, size){
    const s = size || 92, r = (s/2) - 8, c = 2*Math.PI*r;
    const off = c * (1 - U.clamp(pct, 0, 100)/100);
    return '<div class="donut" style="width:'+s+'px;height:'+s+'px">'
      + '<svg viewBox="0 0 '+s+' '+s+'" width="'+s+'" height="'+s+'" role="img" aria-label="%'+Math.round(pct)+'">'
      + '<circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="8"/>'
      + '<circle class="donut__arc" cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"'
      + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+s/2+' '+s/2+')"/>'
      + '</svg>'
      + '<div class="donut__center"><div>'
      + '<div class="num donut__pct">%'+Math.round(pct)+'</div>'
      + (label ? '<div class="tiny dim">'+U.esc(label)+'</div>' : '')
      + '</div></div></div>';
  }

  function sparkline(values, opts){
    const o = opts || {};
    const vals = values.filter(v => v != null);
    if(vals.length < 2) return '';
    const w = 100, h = 26;
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const X = i => (w) * (i/(values.length-1));
    const Y = v => h - 3 - (h-6) * ((v-min)/((max-min)||1));
    const pts = values.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    /* Kivilcim cizgisi kutusunu doldurmak icin gerilir; `non-scaling-stroke`
       olmadan cizgi yatayda incelip dikeyde kalinlasiyordu. */
    return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:26px">'
      + '<path vector-effect="non-scaling-stroke" class="line'+(o.accent?' line--accent':'')+'" style="stroke-width:1.6" d="M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+'"/></svg>';
  }

  function stackBar(segments){
    const total = U.sum(segments.map(s => s.value));
    if(!total) return '<p class="small dim">Veri yok.</p>';
    return '<div class="stackbar">'
      + segments.filter(s => s.value).map(s => '<div class="stackbar__seg" style="width:'+(100*s.value/total)+'%;background:'+s.color+'" title="'+U.esc(s.label)+'"></div>').join('')
      + '</div>'
      + '<div class="legend">' + segments.map(s => '<span class="legend__item"><span class="legend__swatch" style="background:'+s.color+'"></span>'+U.esc(s.label)+' '+s.value+'</span>').join('') + '</div>';
  }

  /* 40 hafta x 7 gun calisma yogunlugu — hucre degeri 0..1 */
  function heatmap(cells, opts){
    const o = opts || {};
    const cols = o.cols || 40, rows = 7;
    const cell = 11, gap = 2, padL = 26, padT = 14;
    const w = padL + cols*(cell+gap), h = padT + rows*(cell+gap) + 14;
    const dayLabels = ['Pzt','','Çar','','Cum','','Paz'];

    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" style="min-width:'+Math.min(w, 760)+'px">';
    for(let r = 0; r < rows; r++){
      if(dayLabels[r]) svg += '<text x="0" y="'+(padT + r*(cell+gap) + cell - 1)+'" style="font-size:8.5px">'+dayLabels[r]+'</text>';
    }
    for(let c = 0; c < cols; c++){
      for(let r = 0; r < rows; r++){
        const item = cells[c*rows + r];
        const v = item ? item.value : null;
        const x = padL + c*(cell+gap), y = padT + r*(cell+gap);
        let fill = 'var(--surface-3)', op = '1';
        if(v != null && v > 0){ fill = 'var(--primary)'; op = String(0.25 + 0.75*Math.min(1, v)); }
        else if(item && item.future){ fill = 'var(--surface-2)'; }
        else if(item && item.missed){ fill = 'var(--danger)'; op = '0.22'; }
        svg += '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="2.5" fill="'+fill+'" opacity="'+op+'">'
          + (item ? '<title>'+esc(item.label)+'</title>' : '') + '</rect>';
      }
    }
    (o.monthTicks || []).forEach(t => {
      svg += '<text x="'+(padL + t.col*(cell+gap))+'" y="'+(padT-4)+'" style="font-size:8.5px">'+esc(t.label)+'</text>';
    });
    svg += '</svg>';
    return '<div style="overflow-x:auto">'+svg+'</div>';
  }
  function esc(s){ return SP.U.esc(s); }

  function legend(items){
    return '<div class="legend">'+items.map(i => '<span class="legend__item"><span class="legend__swatch" style="background:'+i.color+'"></span>'+U.esc(i.label)+'</span>').join('')+'</div>';
  }

  /* ---------- ipucu (ⓘ) ve kenar bilgi rayi ---------- */

  /* Baslik yaninda kucuk bir ⓘ; tiklayinca balon acar. */
  function hint(key){
    const h = SP.HINTS[key];
    if(!h) return '';
    return '<button class="hint" data-act="hint" data-hint="'+key+'" aria-label="'+U.esc(h.t)+' hakkında bilgi">i</button>';
  }

  /* Bolum kenarinda duran kisa aciklama kartlari — uzun metin yerine. */
  /* Ekran acıklamaları. Eskiden her ekranın altında acık duran bir metin
     duvariydi ve sayfanin sonunu bozuyordu; artik katlanir bir panel:
