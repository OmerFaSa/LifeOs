    markBackup, backupAgeDays, backupDue, dataFootprint,
    migrate, loadAll,
  };
})();

/* ==== js/core/planner.js ==== */
/* Plan üreteci — 40 haftalık sabit müfredatın yerine kişiye özel program.

   Girdi tamamen profilden gelir: başlangıç, sınav tarihi, haftalık kapasite,
   çalışma günü sayısı, seviye ve zayıf dersler. Aynı iki aday aynı planı almaz.

   Çıktı R.CURRICULUM ile aynı şekildedir:
     { n, title, topics:[ad], q, exam, check, phase, items:[{subjectId, topicId}] }
   Böylece plan ekranı, hafta ekranı ve gün üreteci değişmeden çalışır.

   Kural motoru otoritedir: plan burada üretilir, LLM plana karışmaz. */

window.R = window.R || {};

R.Planner = (function(){
  const U = R.U;

  /* Seviye: konu başına gereken süreyi ve soru hacmini ölçekler. */
  const LEVELS = {
    baslangic: { id:'baslangic', name:'Sıfırdan', pace:1.35, qScale:0.85,
      note:'Konuların çoğu yeni. Temel önce, hız sonra.' },
    orta:      { id:'orta', name:'Temeli var', pace:1.0, qScale:1.0,
      note:'Konuların bir kısmı tanıdık; tekrar + eksik kapatma.' },
    ileri:     { id:'ileri', name:'Tekrar ediyorum', pace:0.75, qScale:1.2,
      note:'Konular biliniyor; hız, hata ve deneme ağırlıklı.' },
  };

  /* Faz modeli — takvimin yüzdesine göre yerleşir, hafta sayısından bağımsız. */
  const PHASES = [
    { key:'kalibrasyon', to:0.08, label:'Kalibrasyon', theme:'Tanı ve sistem kurulumu',
      focus:['tyt-turkce', 'tyt-matematik'], exam:'1 tam TYT (tanı) + süresiz AYT denemesi',
      check:'Başlangıç netleri, süreler ve hata envanteri kaydedildi mi?', qFactor:0.55, aytRatio:0 },
    { key:'tyt-temel', to:0.28, label:'TYT temeli', theme:'Türkçe + Temel Matematik çekirdeği',
      focus:['tyt-turkce', 'tyt-matematik'], exam:'Haftada 1 branş denemesi',
      check:'Konu sonrası doğruluk %60’ın üzerinde mi?', qFactor:0.75, aytRatio:0 },
    { key:'tyt-cekirdek', to:0.45, label:'TYT çekirdeği', theme:'Problem, geometri ve fen bloğu',
      focus:['tyt-matematik', 'tyt-fen', 'tyt-turkce'], exam:'2 haftada 1 tam TYT + branş',
      check:'Problem doğruluğu %55’i geçti mi?', qFactor:0.9, aytRatio:0.1 },
    { key:'ayt-kopru', to:0.60, label:'AYT köprüsü', theme:'AYT Matematik önkoşulları açılıyor',
      focus:['ayt-matematik', 'tyt-matematik', 'tyt-fen'], exam:'Haftada 1 tam TYT + AYT branş',
      check:'AYT fonksiyon/polinom temelinde %60 doğruluk var mı?', qFactor:1.0, aytRatio:0.4 },
    { key:'cift-kulvar', to:0.78, label:'Çift kulvar', theme:'AYT ana blok + TYT koruma',
      focus:['ayt-matematik', 'ayt-fizik', 'ayt-kimya', 'ayt-biyoloji'], exam:'Haftada 1 TYT + 1 AYT',
      check:'TYT medyanı düşmeden AYT netleri yükseliyor mu?', qFactor:1.0, aytRatio:0.65 },
    { key:'tamamlama', to:0.90, label:'Tamamlama', theme:'Kalan konular ve ikinci tur',
      focus:['ayt-matematik', 'ayt-fizik', 'ayt-kimya', 'ayt-biyoloji', 'tyt-sosyal'], exam:'Haftada 2 tam deneme',
      check:'Konu kapanışı %75’i geçti mi?', qFactor:0.95, aytRatio:0.6 },
    { key:'prova', to:0.97, label:'Prova', theme:'Sınav koşullarında tekrar',
      focus:[], exam:'Haftada 2 tam deneme + analiz', qFactor:0.7, aytRatio:0.5,
      check:'Süre yönetimi ve taban skor sabitlendi mi?' },
    { key:'taper', to:1.01, label:'Sprint ve azaltma', theme:'Hacim düşer, ritim korunur',
      focus:[], exam:'Kısa oturumlar, tam deneme yok', qFactor:0.4, aytRatio:0.4,
      check:'Uyku sınav saatine ayarlandı mı, evrak hazır mı?' },
  ];

  function levels(){ return LEVELS; }
  function level(id){ return LEVELS[id] || LEVELS.orta; }

  function phaseAt(n, total){
    const ratio = total <= 1 ? 1 : n / total;
    return PHASES.find(p => ratio <= p.to) || PHASES[PHASES.length-1];
  }

  /* "3–4 gün" gibi metni sayıya çevirir; "sürekli" tekrarlayan konudur. */
  function topicDays(text){
    const s = String(text || '');
    if(/sürekli|surekli/i.test(s)) return 0;
    const nums = s.match(/\d+/g);
    if(!nums) return 2;
    const vals = nums.map(Number);
    return vals.reduce((a, b) => a + b, 0) / vals.length;
  }

  /* Konu havuzu: ders içi önkoşul sırası korunur, frekans önceliği eklenir. */
  function pool(profile){
    const weak = (profile && profile.weakSubjects) || [];
    const out = [];
    R.SUBJECTS.forEach(sub => {
      sub.topics.forEach(t => {
        out.push({
          subjectId:sub.id, subjectName:sub.name, exam:sub.exam,
          topicId:t.id, name:t.name, order:t.order, freq:t.freq,
          days:topicDays(t.days),
          recurring:topicDays(t.days) === 0,
          weak:weak.indexOf(sub.id) >= 0,
        });
      });
    });
    return out;
  }

  /* Haftalık soru hedefi: kapasite × seviye × faz katsayısı × takvim yükü.
     Tatil ya da okul sınavı olan hafta hedefi otomatik düşer. */
  function weeklyQuestions(profile, phase, loadFactor){
    const cap = Number(profile.capacityHoursPerWeek) || 21;
    const lv = level(profile.level);
    const perHour = 22;
    const load = loadFactor == null ? 1 : loadFactor;
    return Math.round(cap * perHour * phase.qFactor * lv.qScale * load / 10) * 10;
  }

  /* Bir haftaya kaç konu sığar? Kapasite ve seviyeye göre 1–3. */
  function topicsPerWeek(profile){
    const cap = Number(profile.capacityHoursPerWeek) || 21;
    const lv = level(profile.level);
    const budget = (cap / 3.5) / lv.pace;          // kabaca "kaç gün konu işlenebilir"
    return U.clamp(Math.round(budget / 2.2), 1, 5);
  }

  /* Karar kapısı haftaları — takvimin yüzdesine oturur. */
  function gateWeeks(total){
    return [0.28, 0.42, 0.55, 0.74, 0.86]
      .map(r => Math.max(1, Math.round(total * r)))
      .filter((w, i, a) => a.indexOf(w) === i && w <= total);
  }

  /* ---------- ana üreteç ---------- */

  /* Takvim tüm konulara yetmiyorsa hangileri düşer?
     Önce düşük frekans, sonra orta; yüksek frekanslı konu asla düşmez.
     Zayıf işaretlenen ders korunur. Düşenler gizlenmez, rapor edilir. */
  function fitPool(queue, slots){
    if(queue.length <= slots) return { kept:queue, dropped:[] };
    const rank = { low:0, mid:1, high:2 };
    const sorted = queue.slice().sort((a, b) => {
      if(a.weak !== b.weak) return a.weak ? 1 : -1;          // zayıf ders sona düşmez
      if(rank[a.freq] !== rank[b.freq]) return rank[a.freq] - rank[b.freq];
      return b.order - a.order;                               // geç sıradaki önce düşer
    });
    const dropCount = queue.length - slots;
    const dropSet = {};
    sorted.slice(0, dropCount).forEach(t => { dropSet[t.subjectId + ':' + t.topicId] = true; });
    return {
      kept:queue.filter(t => !dropSet[t.subjectId + ':' + t.topicId]),
      dropped:queue.filter(t => dropSet[t.subjectId + ':' + t.topicId]),
    };
  }

  function generate(profile, totalWeeks){
    const p = profile || {};
    const total = Math.max(1, totalWeeks || 40);
    const perWeek = topicsPerWeek(p);
    const gates = gateWeeks(total);

    const all = pool(p);
    const recurring = all.filter(t => t.recurring);
    const rawQueue = all.filter(t => !t.recurring);

    /* Konu işlenebilen hafta sayısı (prova ve taper hariç). */
    let productive = 0;
    for(let n = 1; n <= total; n++){
      if(phaseAt(n, total).focus.length) productive++;
    }
    const fitted = fitPool(rawQueue, productive * perWeek);
    const queue = fitted.kept;

    /* Ders içi sıra korunur; dersler faz odağına göre sıraya girer. */
    const bySubject = {};
    queue.forEach(t => {
      (bySubject[t.subjectId] = bySubject[t.subjectId] || []).push(t);
    });
    Object.keys(bySubject).forEach(k => {
      bySubject[k].sort((a, b) => {
        if(a.order !== b.order) return a.order - b.order;
        return 0;
      });
    });

    const taken = {};
    const weeks = [];

    for(let n = 1; n <= total; n++){
      const phase = phaseAt(n, total);
      const items = [];

      if(phase.focus.length){
        /* Faz odağındaki derslerden sırayla al; biten dersin yerine
           aynı sınav ailesinden kalan en yüksek frekanslı konu gelir. */
        const order = phase.focus.slice();
        let guard = 0;
        while(items.length < perWeek && guard++ < 40){
          let placed = false;
          for(const sid of order){
            if(items.length >= perWeek) break;
            const list = bySubject[sid] || [];
            const next = list.find(t => !taken[t.subjectId + ':' + t.topicId]);
            if(!next) continue;
            taken[next.subjectId + ':' + next.topicId] = true;
            items.push(next);
            placed = true;
          }
          if(!placed) break;
        }
        /* Odak dersleri bittiyse kalan havuzdan frekansa göre doldur. */
        if(items.length < perWeek){
          /* Yedek doldurma: her dersten YALNIZ sıradaki konu alınabilir,
             böylece ders içi önkoşul sırası hiçbir durumda bozulmaz. */
          const wantAyt = phase.aytRatio >= 0.5;
          const heads = Object.keys(bySubject)
            .map(sid => (bySubject[sid] || []).find(t => !taken[t.subjectId + ':' + t.topicId]))
            .filter(Boolean)
            .sort((a, b) => {
              const fam = (wantAyt ? (b.exam === 'AYT') - (a.exam === 'AYT')
                                   : (b.exam === 'TYT') - (a.exam === 'TYT'));
              if(fam) return fam;
              const fw = { high:0, mid:1, low:2 };
              if(fw[a.freq] !== fw[b.freq]) return fw[a.freq] - fw[b.freq];
              return a.order - b.order;
            });
          for(const t of heads){
            if(items.length >= perWeek) break;
            if(taken[t.subjectId + ':' + t.topicId]) continue;
            taken[t.subjectId + ':' + t.topicId] = true;
            items.push(t);
          }
        }
      }

      const load = (R.Model && R.Model.weekLoad) ? R.Model.weekLoad(n) : 1;
      const isGate = gates.indexOf(n) >= 0;
      const names = items.map(t => t.name);
      const title = items.length
        ? (phase.label + ' — ' + items[0].subjectName.replace(/^TYT |^AYT /, ''))
        : phase.label;

      weeks.push({
        n,
        phase:phase.key,
        phaseLabel:phase.label,
        theme:phase.theme,
        title,
        topics:names.length ? names : [phase.theme],
        items:items.map(t => ({ subjectId:t.subjectId, topicId:t.topicId, name:t.name })),
        recurring:recurring.map(t => t.name),
        q:weeklyQuestions(p, phase, load),
        load:U.round(load, 2),
        exam:phase.exam,
        check:isGate
          ? 'KARAR KAPISI: ' + phase.check + ' Son 3 denemenin medyanına bak, tek müdahale seç.'
          : phase.check,
        gate:isGate,
      });
    }

    const placed = Object.keys(taken).length;
    return {
      weeks,
      meta:{
        total, perWeek, gates, productive,
        level:level(p.level).id,
        capacityHoursPerWeek:Number(p.capacityHoursPerWeek) || 21,
        placed,
        poolSize:rawQueue.length,
        leftover:queue.length - placed,
        dropped:fitted.dropped.map(t => ({
          subjectId:t.subjectId, subjectName:t.subjectName,
          topicId:t.topicId, name:t.name, freq:t.freq,
        })),
        coverage:U.pct(placed, rawQueue.length),
        /* Tam kapsama için gereken haftalık saat — dürüst kapasite tavsiyesi. */
        capacityForFull:(function(){
          const need = productive ? Math.ceil(rawQueue.length / productive) : perWeek;
          const cap = Number(p.capacityHoursPerWeek) || 21;
          return need <= perWeek ? cap : Math.ceil(cap * need / Math.max(1, perWeek));
        })(),
        generatedAt:new Date().toISOString(),
        version:1,
      },
    };
  }

  /* Planın gerçeklikle uyumu — otomasyon bunu okuyup yeniden planlar. */
  function health(plan, currentWeek){
    if(!plan || !plan.weeks.length) return null;
    const M = R.Model, C = R.Calc;
    const past = plan.weeks.filter(w => w.n < currentWeek);
    let expected = 0, closed = 0;

    past.forEach(w => {
      (w.items || []).forEach(it => {
        expected++;
        const st = M.topicState(it.subjectId, it.topicId);
        if(st.state === 'closed' || st.state === 'provisional') closed++;
      });
    });

    const pct = expected ? U.pct(closed, expected) : null;
    const behind = expected - closed;
    const weeksLeft = Math.max(0, plan.meta.total - currentWeek + 1);
    const perWeek = plan.meta.perWeek || 2;
    const behindWeeks = perWeek ? U.round(behind / perWeek, 1) : 0;

    return {
      expected, closed, behind, pct, weeksLeft, behindWeeks,
      leftover:plan.meta.leftover,
      status: pct == null ? 'yeni'
        : pct >= 85 ? 'saglikli'
        : pct >= 60 ? 'sapma'
        : 'geride',
      note: pct == null ? 'Henüz geçmiş hafta yok; plan ilk haftasında.'
        : pct >= 85 ? 'Plan gerçeklikle uyumlu. Devam.'
        : pct >= 60 ? behind+' konu geride kaldı (~'+behindWeeks+' hafta). Hedef hacmi bir tık kısmak yeter.'
        : behind+' konu geride kaldı (~'+behindWeeks+' hafta). Plan sıkıştırılmalı: düşük frekanslı konular çıkarılır.',
    };
  }

  /* Kalan haftaları bugünden itibaren yeniden üretir; geçmiş haftalar korunur.
     Kapanmış konular havuzdan düşer, kapanmayanlar öne alınır. */
  function replan(plan, profile, currentWeek){
    const M = R.Model;
    const fresh = generate(profile, plan.meta.total);
    const kept = plan.weeks.filter(w => w.n < currentWeek);

    const done = {};
    R.SUBJECTS.forEach(s => s.topics.forEach(t => {
      const st = M.topicState(s.id, t.id);
      if(st.state === 'closed') done[s.id + ':' + t.id] = true;
    }));

    /* Kapanmamış ama geçmişte planlanmış konuları öne al. */
    const carry = [];
    kept.forEach(w => (w.items || []).forEach(it => {
      if(!done[it.subjectId + ':' + it.topicId]) carry.push(it);
    }));

    const rest = fresh.weeks.filter(w => w.n >= currentWeek);
    const seen = {};
    carry.forEach(it => { seen[it.subjectId + ':' + it.topicId] = true; });

    /* Devredilen konular sıradaki haftaların başına yerleşir. */
    let ci = 0;
    rest.forEach(w => {
      const items = [];
      while(items.length < (fresh.meta.perWeek || 2) && ci < carry.length){
        items.push(carry[ci++]);
      }
      (w.items || []).forEach(it => {
        if(items.length >= (fresh.meta.perWeek || 2)) return;
        if(seen[it.subjectId + ':' + it.topicId]) return;
        items.push(it);
      });
      if(items.length){
        w.items = items;
        w.topics = items.map(i => i.name);
      }
    });

    return {
      weeks:kept.concat(rest),
      meta:Object.assign({}, fresh.meta, {
        replannedAt:new Date().toISOString(),
        replannedFrom:currentWeek,
        carried:carry.length,
      }),
    };
  }


  /* Senaryo karşılaştırma: "günde 1 saat daha çalışsam ne olur?"
     Kapasite kararını hisle değil sayıyla verdirir. */
  function scenarios(profile, total, deltas){
    const base = generate(profile, total);
    const list = (deltas || [-5, 0, 5, 10]).map(d => {
      const cap = Math.max(4, (Number(profile.capacityHoursPerWeek) || 21) + d);
      const p = Object.assign({}, profile, { capacityHoursPerWeek:cap });
      const plan = generate(p, total);
      return {
        delta:d, capacity:cap,
        perWeek:plan.meta.perWeek,
        coverage:plan.meta.coverage,
        dropped:plan.meta.dropped.length,
        weeklyQ:plan.weeks[Math.min(10, plan.weeks.length-1)].q,
        gain:plan.meta.coverage - base.meta.coverage,
        perDay:U.round(cap / (Number(profile.studyDaysPerWeek) || 6), 1),
      };
    });
    return { base:base.meta, rows:list };
  }

  /* Önkoşul denetimi: bir konu, aynı dersteki daha erken sıralı konudan
     önce planlanmış mı? Üreteç bunu bozmaz; bu fonksiyon güvence katmanıdır. */
  function checkPrerequisites(plan){
    const last = {};
    const issues = [];
    plan.weeks.forEach(w => {
      (w.items || []).forEach(it => {
        const sub = R.SUBJECTS.find(x => x.id === it.subjectId);
        const t = sub && sub.topics.find(x => x.id === it.topicId);
        if(!t) return;
        if(last[it.subjectId] != null && t.order < last[it.subjectId]){
          issues.push({ week:w.n, subjectId:it.subjectId, topic:t.name,
            order:t.order, after:last[it.subjectId] });
        }
        last[it.subjectId] = t.order;
      });
    });
    return { ok:issues.length === 0, issues };
  }

  /* Enerjiye göre gün dağılımı: zor konu yüksek enerjili güne.
     Son 4 haftanın enerji ortalamasından haftanın günleri sıralanır. */
  function energyByWeekday(days){
    const n = days || 28;
    const buckets = {};
    for(let i = 0; i < n; i++){
      const iso = U.iso(U.addDays(U.today(), -i));
      const rec = R.S.mood[iso];
      if(!rec) continue;
      const dow = U.weekdayIndex(iso);
      buckets[dow] = buckets[dow] || { dow, vals:[] };
      buckets[dow].vals.push(rec.energy);
    }
    const rows = Object.keys(buckets).map(k => {
      const b = buckets[k];
      return {
        dow:Number(k),
        label:R.WEEKDAYS[Number(k)].short,
        avg:U.round(U.sum(b.vals) / b.vals.length, 1),
        n:b.vals.length,
      };
    }).sort((a, b) => b.avg - a.avg);
    return {
      ok:rows.length >= 3, rows,
      best:rows[0] || null,
      worst:rows[rows.length-1] || null,
      note:rows.length < 3
        ? 'Enerji kaydı yetersiz; birkaç gün giriş yapınca öneri çıkar.'
        : 'En yüksek enerji ' + rows[0].label + ', en düşük ' + rows[rows.length-1].label
          + '. Zor konuyu ' + rows[0].label + ' gününe koy.',
    };
  }

  return { LEVELS, PHASES, levels, level, phaseAt, topicDays, pool,
    weeklyQuestions, topicsPerWeek, gateWeeks, generate, health, replan,
    scenarios, checkPrerequisites, energyByWeekday };
})();

/* ==== js/core/calc.js ==== */
/* KPI hesaplari, karar kapisi mantigi ve tetikleyiciler. */

window.R = window.R || {};

R.Calc = (function(){
  const U = R.U, M = R.Model, S = R.S;

  /* ---------- deneme ---------- */
  function fullExams(family){
    return S.exams
      .filter(e => e.family === family && e.kind === 'full')
      .sort((a,b) => a.date.localeCompare(b.date));
  }
  function comparableNets(family){
    return fullExams(family).map(M.examNet);
  }
  function medianTrend(family){
    const list = comparableNets(family);
    const last3 = list.length >= 3 ? U.median(list.slice(-3)) : null;
    const prev3 = list.length >= 6 ? U.median(list.slice(-6,-3)) : null;
    return {
      count:list.length,
      last3: last3 == null ? null : U.round(last3,1),
      prev3: prev3 == null ? null : U.round(prev3,1),
      delta: (last3 != null && prev3 != null) ? U.round(last3-prev3,1) : null,
      series:list.map(v => U.round(v,1)),
    };
  }
  function examBase(family){
    const list = comparableNets(family);
    if(!list.length) return null;
    return U.round(Math.min.apply(null, list.slice(-4)), 1);
  }
  /* Test bazli medyan — net matrisi icin */
  function testMedian(testName, family){
    const vals = fullExams(family)
      .slice(-4)
      .map(e => (e.tests || []).find(t => t.name === testName))
      .filter(Boolean)
      .map(M.testNet);
    const m = U.median(vals);
    return m == null ? null : U.round(m, 2);
  }
  function analysisDebt(){
    return S.exams.filter(e => {
      if(e.analysisCompletedAt) return false;
      return U.diffDays(e.date, U.todayISO()) >= 1;
    });
  }
  function examVolumeProgress(){
    return R.EXAM_VOLUME.map(row => {
      const from = M.weekStart(row.weeks[0]);
      const to = U.addDays(M.weekStart(row.weeks[1]), 6);
      const inRange = e => {
        const d = U.parse(e.date);
        return d >= from && d <= to;
      };
      const tyt = S.exams.filter(e => inRange(e) && e.family === 'TYT' && e.kind === 'full').length;
      const ayt = S.exams.filter(e => inRange(e) && e.family === 'AYT' && e.kind === 'full').length;
      const branch = S.exams.filter(e => inRange(e) && (e.kind === 'branch' || e.kind === 'mini' || e.kind === 'partial')).length;
      return Object.assign({}, row, { actual:{ tyt, ayt, branch }, from:U.iso(from), to:U.iso(to) });
    });
  }

  /* ---------- hata ---------- */
  function errorDistribution(sinceISO){
    const counts = { K:0, 'İ':0, Y:0, S:0, D:0 };
    S.errors.forEach(e => {
      if(sinceISO && e.createdAt && e.createdAt.slice(0,10) < sinceISO) return;
      if(counts[e.tag] !== undefined) counts[e.tag]++;
    });
    return counts;
  }
  function errorPareto(sinceISO){
    const dist = errorDistribution(sinceISO);
    const total = U.sum(Object.values(dist));
    return Object.keys(dist)
      .map(k => ({ tag:k, count:dist[k], pct: total ? U.pct(dist[k], total) : 0 }))
      .sort((a,b) => b.count - a.count);
  }
  function topTags(n){
    return errorPareto().filter(r => r.count > 0).slice(0, n || 2);
  }
  function openErrors(){ return S.errors.filter(e => !e.closedAt); }

  /* ---------- kartlar ---------- */
  function dueCards(dateISO){
    const day = dateISO || U.todayISO();
    return S.cards.filter(c => c.dueAt <= day);
  }
  function overdueCards(){
    const t = U.todayISO();
    return S.cards.filter(c => c.dueAt < t);
  }
  function cardDebt(){
    const due = dueCards();
    if(!due.length) return 0;
    return U.pct(overdueCards().length, due.length);
  }

  /* ---------- plan ve sorular ---------- */
  function weekBlocks(n, onlyPast){
    const out = [];
    M.weekDates(n).forEach(d => {
      const iso = U.iso(d);
      if(onlyPast && iso > U.todayISO()) return;
      const day = S.days[iso];
      if(!day) return;
      day.blocks.forEach(b => {
        if(b.slot === 'Dinlenme') return;
        out.push(Object.assign({ dayISO:iso }, b));
      });
    });
    return out;
  }
  function planCompletion(n){
    const blocks = weekBlocks(n, true).filter(b => b.status !== 'pending' || b.dayISO < U.todayISO());
    if(!blocks.length) return null;
    const score = blocks.reduce((s,b) => s + (b.status === 'done' ? 1 : b.status === 'partial' ? 0.5 : 0), 0);
    return U.pct(score, blocks.length);
  }
  function questionRealization(n){
    const week = S.weeks[M.weekId(n)];
    if(!week) return null;
    const solved = U.sum(weekBlocks(n).map(b => b.actualQ || 0));
    return { solved, target:week.questionTarget, pct:U.pct(solved, week.questionTarget) };
  }
  function timeRealization(n){
    const blocks = weekBlocks(n);
    const target = U.sum(blocks.map(b => b.targetMin || 0));
    const actual = U.sum(blocks.map(b => b.actualMin || 0));
    return { target, actual, pct:U.pct(actual, target) };
  }
  function plannedMinutes(n){
    return U.sum(weekBlocks(n).map(b => b.targetMin || 0));
  }
  function capacityLoad(n){
    const week = S.weeks[M.weekId(n)];
    if(!week) return null;
    const planned = plannedMinutes(n);
    return { planned, capacity:week.capacityMin, pct:U.pct(planned, week.capacityMin) };
  }
  function completionHistory(count){
    const cur = M.currentWeek();
    const out = [];
    for(let n = Math.max(1, cur - (count||8) + 1); n <= cur; n++){
      out.push({ n, value:planCompletion(n) });
    }
    return out;
  }
  function skipReasonCounts(n){
    const counts = {};
    weekBlocks(n).forEach(b => {
      if(b.skipReason) counts[b.skipReason] = (counts[b.skipReason] || 0) + 1;
    });
    return counts;
  }

  /* ---------- konu kapanisi ---------- */
  function subjectClosure(subjectId){
    const subject = R.SUBJECTS.find(s => s.id === subjectId);
    if(!subject) return { closed:0, total:0, pct:0 };
    let closed = 0, started = 0;
    subject.topics.forEach(t => {
      const st = M.topicState(subjectId, t.id);
      if(st.state === 'closed') closed++;
      if(st.state !== 'not_started') started++;
    });
    return { closed, started, total:subject.topics.length, pct:U.pct(closed, subject.topics.length) };
  }
  function overallClosure(){
    let closed = 0, total = 0;
    R.SUBJECTS.forEach(s => {
      const c = subjectClosure(s.id);
      closed += c.closed; total += c.total;
    });
    return { closed, total, pct:U.pct(closed, total) };
  }
  function examClosure(examKind){
    let closed = 0, total = 0;
    R.SUBJECTS.filter(s => s.exam === examKind).forEach(s => {
      const c = subjectClosure(s.id);
      closed += c.closed; total += c.total;
    });
    return { closed, total, pct:U.pct(closed, total) };
  }
  /* 7 gun sonraki ikinci olcumu bekleyen konular */
  function pendingSecondChecks(){
    const out = [];
    R.SUBJECTS.forEach(s => {
      s.topics.forEach(t => {
        const st = M.topicState(s.id, t.id);
        if(st.first != null && st.second == null && st.firstAt){
          const dueISO = U.iso(U.addDays(U.parse(st.firstAt), R.CLOSURE_RULE.gapDays));
          out.push({ subjectId:s.id, subjectName:s.name, topicId:t.id, topicName:t.name, dueISO,
            overdue: dueISO <= U.todayISO() });
        }
      });
    });
    return out.sort((a,b) => a.dueISO.localeCompare(b.dueISO));
  }

  /* ---------- uyku ---------- */
  function sleepAverage(days){
    const n = days || 7;
    const vals = [];
    for(let i = 0; i < n; i++){
      const d = S.days[U.iso(U.addDays(U.today(), -i))];
      if(d && d.sleepHours) vals.push(Number(d.sleepHours));
    }
    if(!vals.length) return null;
    return U.round(U.sum(vals)/vals.length, 1);
  }

  /* ---------- karar kapisi ---------- */
  function currentGate(){
    const month = U.monthName(U.today());
    const gate = R.MONTH_GATES[month];
    if(!gate) return null;
    return Object.assign({ month }, gate);
  }
  function gateStatus(value, band, safeBand){
    if(value == null) return 'unknown';
    if(safeBand && value >= safeBand[0]) return 'safe';
    if(value >= band[0] && value <= band[1]) return 'inband';
    if(value > band[1]) return 'above';
    return 'below';
  }
  /* En fazla 3 oneri; ilki tetiklenen esik kurali */
  function gateSuggestions(gate){
    const out = [];
    const tyt = medianTrend('TYT'), ayt = medianTrend('AYT');
    const tytStatus = gateStatus(tyt.last3, gate.tyt, gate.tytSafe);
    const aytStatus = gate.ayt ? gateStatus(ayt.last3, gate.ayt, gate.aytSafe) : 'unknown';

    out.push({
      id:'gate-rule',
      text:gate.note,
      why:'Bu ayın kapı kuralı' + (tytStatus === 'below' ? ' — TYT medyanı gözlenen bandın altında.' : '.'),
    });

    const tags = topTags(2);
    if(tags.length){
      const t = tags[0];
      out.push({
        id:'tag-block',
        text:'En baskın hata etiketi '+t.tag+' ('+R.ERROR_TAGS[t.tag].name+', '+t.count+' kayıt, %'+t.pct+') → gelecek haftaya 2 ek blok: '+R.ERROR_TAGS[t.tag].recipe+'.',
        why:'Hata paretosunun ilk sırası',
      });
    }

    const closure = overallClosure();
    const base = examBase('TYT');
    if(closure.pct < 55 && closure.total){
      out.push({ id:'closure', text:'Konu kapanışı %'+closure.pct+' — yeni kaynak açma; açık konuları plana taşı ve ikinci ölçümleri tamamla.', why:'Konu kapanış oranı düşük' });
    }else if(base != null && tyt.last3 != null && base < tyt.last3 - 6){
      out.push({ id:'base', text:'Taban skor medyanın belirgin altında ('+base+' / '+tyt.last3+') — bir hafta hacmi %20 azalt, uyku ve analiz kalitesini düzelt.', why:'Kötü gün dayanıklılığı zayıf' });
    }else{
      out.push({ id:'volume', text:'Kaynak değiştirmeden mevcut hata paretosuna göre bir hafta hacmi %20 azalt ve analiz kalitesini artır.', why:'Varsayılan güvenli müdahale' });
    }

    return { suggestions:out.slice(0,3), tytStatus, aytStatus, tyt, ayt };
  }

  /* ---------- telafi tetikleyicileri ---------- */
  function protocolTriggers(){
    // Program baslamadan sapma olcumu anlamli degildir.
    if(M.daysUntilStart() > 0) return [];
    const hits = [];
    const cur = M.currentWeek();

    const p1 = planCompletion(cur-1), p2 = planCompletion(cur-2);
    if(p1 != null && p2 != null && p1 < 80 && p2 < 80){
      hits.push({ id:'two-weeks-behind', detail:'Son iki hafta: %'+p1+' ve %'+p2+' plan tamamlama.' });
    }

    const ayt = medianTrend('AYT');
    const month = U.monthName(U.today());
    if((month === 'Mart' || month === 'Nisan') && ayt.last3 != null && ayt.last3 < 20){
      hits.push({ id:'ayt-late', detail:'AYT medyanı '+ayt.last3+' — 20 netin altında.' });
    }

    const tytMath = testMedian('Temel Matematik','TYT');
    const aytMath = testMedian('Matematik','AYT');
    if((month === 'Ekim' || month === 'Kasım') && tytMath != null && tytMath < 8){
      hits.push({ id:'math-weak', detail:'TYT Matematik medyanı '+U.fmtNet(tytMath)+' — 8 netin altında.' });
    }else if((month === 'Mart' || month === 'Nisan') && aytMath != null && aytMath < 10){
      hits.push({ id:'math-weak', detail:'AYT Matematik medyanı '+U.fmtNet(aytMath)+' — 10 netin altında.' });
    }

    const tyt = medianTrend('TYT');
    if(tyt.count >= 4 && tyt.delta != null && Math.abs(tyt.delta) < 1.5){
      hits.push({ id:'flat-nets', detail:'Son 3 medyan ile önceki 3 medyan farkı '+tyt.delta+' net.' });
    }

    let gap = 0;
    for(let i = 1; i <= 7; i++){
      const dayISO = U.iso(U.addDays(U.today(), -i));
      if(dayISO < R.PLAN.startISO) break;
      const d = S.days[dayISO];
      const touched = d && (d.blocks.some(b => b.status !== 'pending') || d.paragraphActual > 0);
      if(touched) break;
      gap++;
    }
    if(gap >= 3) hits.push({ id:'illness-break', detail:gap+' gündür kayıt yok.' });

    const active = M.activeProtocols().map(p => p.protoId);
    return hits.filter(h => active.indexOf(h.id) === -1);
  }

  /* ---------- calisma yogunlugu (heatmap) ---------- */
  /* Her gun icin 0..1 arasi yogunluk: gerceklesen dakika / hedef dakika */
  function intensityGrid(){
    const cells = [];
    const ticks = [];
    let lastMonth = null;
    for(let n = 1; n <= R.PLAN.totalWeeks; n++){
      const start = M.weekStart(n);
      const month = start.getMonth();
      if(month !== lastMonth){
        ticks.push({ col:n-1, label:U.MONTHS_SHORT[month] });
        lastMonth = month;
      }
      M.weekDates(n).forEach(d => {
        const iso = U.iso(d);
        const day = S.days[iso];
        const future = iso > U.todayISO();
        let value = null, missed = false;
        if(day){
          const target = U.sum(day.blocks.filter(b => b.slot !== 'Dinlenme').map(b => b.targetMin || 0));
          const actual = U.sum(day.blocks.map(b => b.actualMin || 0));
          if(actual > 0) value = target ? U.clamp(actual/target, 0, 1) : 1;
          else if(!future && day.blocks.some(b => b.status === 'skipped')) missed = true;
        }else if(!future && iso >= R.PLAN.startISO){
          missed = true;
        }
        cells.push({
          value, future, missed, iso,
          label:U.fmtDate(iso) + (value != null ? ' · %'+Math.round(value*100)+' yük' : future ? ' · planlandı' : missed ? ' · kayıt yok' : ''),
        });
      });
    }
    return { cells, ticks };
  }

  /* Test bazli net serisi — her test icin ayri trend */
  function testSeries(family){
    const exams = fullExams(family);
    const names = [];
    exams.forEach(e => (e.tests || []).forEach(t => { if(names.indexOf(t.name) === -1) names.push(t.name); }));
    return names.map(name => ({
      name,
      data:exams.map(e => {
        const t = (e.tests || []).find(x => x.name === name);
        return t ? U.round(M.testNet(t), 2) : null;
      }),
      labels:exams.map(e => U.fmtShort(e.date)),
    }));
  }

  /* ---------- gunluk minimum ---------- */
  function minimumDayMet(dayISO){
    const day = S.days[dayISO || U.todayISO()];
    if(!day) return false;
    const mins = U.sum(day.blocks.map(b => b.actualMin || 0));
    const due = dueCards().length;
    const reviewedToday = S.cards.filter(c => c.lastReviewedAt === (dayISO || U.todayISO())).length;
    return mins >= R.ROUTINES.minimumDay.minutes
      && day.paragraphActual >= R.ROUTINES.minimumDay.paragraphs
      && (due === 0 || reviewedToday > 0);
  }

  /* ---------- siradaki hamle ----------
     Karar yorgunlugunu azaltmak icin tek bir oncelik dondurur.
     Sira sabittir: borc > gecikme > gunun rituali > olcum > blok > cipa. */
  function nextAction(){
    const todayISO = U.todayISO();
    const day = S.days[todayISO];
    const n = M.currentWeek();
    const week = S.weeks[M.weekId(n)];
    const dow = U.weekdayIndex(U.today());
    const beforeStart = M.daysUntilStart() > 0;

    const debt = analysisDebt();
    if(debt.length){
      return { key:'analysis', icon:'exam', label:'Analiz borcu',
        title:debt.length === 1 ? 'Denemenin analizini bitir' : debt.length+' denemenin analizini bitir',
        why:'Analiz edilmemiş deneme, analiz edilenden daha düşük değerlidir.',
        route:'exams', tone:'urgent' };
    }

    const overdue = overdueCards();
    if(overdue.length >= 5 || cardDebt() > 10){
      return { key:'cards', icon:'cards', label:'Tekrar borcu',
        title:overdue.length+' gecikmiş kartı çöz',
        why:'Borç %10’u aştı; yeni kart üretmeden önce borcu sadeleştir.',
        route:'cards', tone:'urgent' };
    }

    if(!beforeStart && dow === 0 && week && !week.signedAt){
      return { key:'contract', icon:'week', label:'Pazartesi ritüeli',
        title:'Haftalık sözleşmeyi imzala',
        why:'Geçen haftanın verisi görülmeden yeni hedef yazılmaz — 15 dakika.',
        route:'week', tone:'ritual' };
    }
    if(!beforeStart && dow === 6 && !S.reviews[M.weekId(n)]){
      return { key:'review', icon:'check', label:'Pazar ritüeli',
        title:'Weekly review’u doldur',
        why:'Planlandı / yapıldı / neden sapıldı / düzeltme — 30–40 dakika.',
        route:'week', act:'open-review', tone:'ritual' };
    }
    if(!beforeStart && dow === 5 && !S.exams.some(e => e.date === todayISO)){
      return { key:'exam', icon:'exam', label:'Cumartesi ritüeli',
        title:'Bugünün denemesini gir',
        why:'Deneme yalnız skor üretmez; gelecek haftanın ders dağılımını belirler.',
        route:'exams', act:'new-exam', tone:'ritual' };
    }

    const pending = pendingSecondChecks().filter(p => p.overdue);
    if(pending.length){
      return { key:'second-check', icon:'book', label:'Bekleyen ölçüm',
        title:pending[0].topicName+' için 7. gün testi',
        why:'İkinci ölçüm yapılmadan konu kapanmaz'+(pending.length > 1 ? ' — '+pending.length+' konu bekliyor.' : '.'),
        route:'subjects', tone:'normal' };
    }

    if(day){
      const running = day.blocks.find(b => b.startedAt);
      if(running){
        return { key:'running', icon:'clock', label:'Devam eden blok',
          title:running.topic, why:'Zamanlayıcı çalışıyor — odak modunda kal.',
          act:'focus-open', tone:'active' };
      }
      const next = day.blocks.find(b => b.status === 'pending' && b.slot !== 'Dinlenme');
      if(next){
        return { key:'block', icon:'play', label:'Sıradaki blok',
          title:next.topic,
          why:next.slot+' · '+next.targetMin+' dakika'+(next.targetQ ? ' · '+next.targetQ+' soru hedefi' : ''),
          act:'timer-start', blockId:next.id, tone:'normal' };
      }
      if(day.paragraphActual < day.paragraphTarget){
        return { key:'anchor', icon:'book', label:'Günlük çıpa',
          title:'Paragraf çıpasını tamamla',
          why:(day.paragraphTarget - day.paragraphActual)+' paragraf kaldı — çıpa konudan bağımsız düşmez.',
          tone:'normal' };
      }
      if(day.problemActual < day.problemTarget){
        return { key:'anchor2', icon:'chart', label:'Günlük çıpa',
          title:'Problem çıpasını tamamla',
          why:(day.problemTarget - day.problemActual)+' soru kaldı.',
          tone:'normal' };
      }
    }

    const due = dueCards();
    if(due.length){
      return { key:'due', icon:'cards', label:'Tekrar', title:due.length+' kart seni bekliyor',
        why:'Günün son işi: due kartlar.', route:'cards', tone:'normal' };
    }

    return { key:'done', icon:'check', label:'Bugün', title:'Günün işi tamam',
      why:'Bloklar, çıpalar ve kartlar kapandı. Erken uyku bugünün son maddesi.', tone:'calm' };
  }

  /* ---------- davranis serisi ----------
     Odul nete degil davranisa baglanir: minimum gun standardini tutturdugun
     ardisik gun sayisi. Pazar dinlenme gunu seriyi kirmaz. */
  function behaviorStreak(){
    let streak = 0;
    let checking = 0;
    const days = [];
    for(let i = 0; i < 60; i++){
      const iso = U.iso(U.addDays(U.today(), -i));
      if(iso < R.PLAN.startISO) break;
      const met = minimumDayMet(iso);
      const isSunday = U.weekdayIndex(iso) === 6;
      if(i < 14) days.unshift({ iso, met, isSunday, today:i === 0 });
      if(i === 0 && !met) { checking = 1; continue; }   // bugun henuz bitmedi, seriyi kirma
      if(met) streak++;
      else if(isSunday) continue;                       // pazar dinlenme
      else break;
    }
    return { streak, days, pendingToday:checking === 1 };
  }

  /* ---------- OBP ---------- */
  function obp(profile){
    const p = profile || S.profile;
    const value = U.clamp(p.diplomaGrade * R.OBP.multiplier, R.OBP.min, R.OBP.max);
    const coef = p.previouslyPlaced ? R.OBP.coefRepeat : R.OBP.coefFirst;
    return { value:U.round(value,0), coef, contribution:U.round(value*coef, 1) };
  }

  /* ==================== puan ve sıra tahmini ====================
     Kural: tek denemeyle konusulmaz, medyan esas alinir; sonuc her zaman
     bant + kesinlik etiketiyle doner. Tek sayi vaadi verilmez. */

  function bandWidth(sampleCount){
    const w = R.SCORING.bandHalfWidth;
    if(sampleCount >= 8) return w.many;
    if(sampleCount >= 5) return w.some;
    return w.few;
  }

  /* Ham net → 500'luk olcekte yaklasik puan (OBP haric). */
  function rawScore(tytNet, aytNet){
    const S1 = R.SCORING;
    const tytPart = S1.base + (Number(tytNet) || 0) * S1.tyt.perNet;
    if(aytNet == null) return { kind:'TYT', value:U.clamp(tytPart, S1.base, S1.tyt.maxRaw) };
    const aytPart = S1.base + (Number(aytNet) || 0) * S1.ayt.perNet;
    const mixed = S1.ayt.tytWeight * tytPart + S1.ayt.aytWeight * aytPart;
    return { kind:'SAY', value:U.clamp(mixed, S1.base, S1.tyt.maxRaw) };
  }

  /* Puan → sira: referans noktalari arasinda log-lineer aradeger. */
  function rankForScore(score){
    const t = R.SCORING.sayRankTable;
    if(!isFinite(score)) return null;
    if(score >= t[0].score) return t[0].rank;
    if(score <= t[t.length-1].score) return t[t.length-1].rank;
    for(let i = 0; i < t.length-1; i++){
      const hi = t[i], lo = t[i+1];
      if(score <= hi.score && score >= lo.score){
        const ratio = (score - lo.score) / (hi.score - lo.score);
        const logRank = Math.log(lo.rank) + ratio * (Math.log(hi.rank) - Math.log(lo.rank));
        return Math.round(Math.exp(logRank));
      }
    }
    return null;
  }

  /* Adayin su anki tahmini puan ve sira bandi.
     Girdi: son 3 tam denemenin medyani (tek deneme kullanilmaz). */
  function estimateScore(){
    const tyt = medianTrend('TYT');
    const ayt = medianTrend('AYT');
    const samples = fullExams('TYT').length;
    const o = obp();

    if(tyt.last3 == null){
      return {
        ok:false, position:'unknown', samples,
        why:'En az 3 tam TYT denemesi gerekir; öncesinde tahmin yanıltıcı olur.',
      };
    }

    const raw = rawScore(tyt.last3, ayt.last3);
    const score = U.round(raw.value + o.contribution, 1);
    const half = bandWidth(samples);
    const low = U.round(score - half, 1);
    const high = U.round(score + half, 1);

    // Sira bandi ters yonludur: yuksek puan kucuk sira.
    const rankBest = rankForScore(high);
    const rankWorst = rankForScore(low);
    const rankMid = rankForScore(score);

    const target = (S.profile && S.profile.targetRank) || R.PROGRAM.refRank;
    const position = rankWorst == null ? 'unknown'
      : rankWorst <= target ? 'above'
      : rankBest <= target ? 'inband'
      : rankBest <= target * 1.35 ? 'near'
      : 'below';

    return {
      ok:true, samples, kind:raw.kind,
      tytMedian:tyt.last3, aytMedian:ayt.last3,
      obp:o.contribution,
      score, scoreLow:low, scoreHigh:high, halfWidth:half,
      rank:rankMid, rankBest, rankWorst,
      targetRank:target,
      position,
      meta:R.SCORING.positions.find(p => p.key === position) || R.SCORING.positions[4],
    };
  }

  /* Hedef siraya ulasmak icin gereken net farki — yon gostergesi.
     "Su kadar net daha" demek yerine "bu bandi tutmak icin" dili kullanilir. */
  function netGapToTarget(){
    const est = estimateScore();
    if(!est.ok) return null;
    const target = est.targetRank;
    const t = R.SCORING.sayRankTable;
    // Hedef siraya karsilik gelen puani ters aradegerle bul.
    let needScore = null;
    for(let i = 0; i < t.length-1; i++){
      const hi = t[i], lo = t[i+1];
      if(target >= hi.rank && target <= lo.rank){
        const ratio = (Math.log(target) - Math.log(lo.rank)) / (Math.log(hi.rank) - Math.log(lo.rank));
        needScore = lo.score + ratio * (hi.score - lo.score);
        break;
      }
    }
    if(needScore == null) return null;
    const diff = needScore - est.score;
    const perNet = est.kind === 'SAY'
      ? R.SCORING.ayt.perNet * R.SCORING.ayt.aytWeight + R.SCORING.tyt.perNet * R.SCORING.ayt.tytWeight
      : R.SCORING.tyt.perNet;
    return {
      needScore:U.round(needScore, 1),
      scoreDiff:U.round(diff, 1),
      netDiff:U.round(diff / perNet, 1),
      reached:diff <= 0,
    };
  }

  /* ==================== konu risk skoru ====================
     "Once neye calisayim?" sorusunu veriyle cevaplar. Tek bir sezgiye degil,
     bes olculebilir girdiye bakar: frekans, kapanis, hata, kart, tazelik. */

  const FREQ_SCORE = { high:1, mid:0.55, low:0.25 };

  /* Konuya bagli bloklardan gercek soru cozum dogrulugu.
     Bu, kapanis olcumunden bagimsiz ikinci bir kanittir: aday konuyu
     "kapali" isaretlemis olabilir ama pratikte dogrulugu dusuk olabilir. */
  function topicPractice(subjectId, topicId, days){
    const back = days || 45;
    let solved = 0, correct = 0, sessions = 0, lastISO = null;
    for(let i = 0; i < back; i++){
      const iso = U.iso(U.addDays(U.today(), -i));
      const day = S.days[iso];
      if(!day) continue;
      day.blocks.forEach(b => {
        if(b.subjectId !== subjectId) return;
        if(topicId && b.topicId !== topicId) return;
        if(!b.actualQ) return;
        solved += b.actualQ;
        correct += (b.correctQ || 0);
        sessions++;
        if(!lastISO || iso > lastISO) lastISO = iso;
      });
    }
    return {
      solved, correct, sessions, lastISO,
      accuracy: solved ? U.pct(correct, solved) : null,
    };
  }

  function topicRisk(subjectId, topicId){
    const subject = R.SUBJECTS.find(s => s.id === subjectId);
    const topic = subject ? subject.topics.find(t => t.id === topicId) : null;
    if(!topic) return null;

    const w = R.SCORING.riskWeights;
    const st = M.topicState(subjectId, topicId);

    // 1) frekans: sinavdaki agirlik
    const freq = FREQ_SCORE[topic.freq] != null ? FREQ_SCORE[topic.freq] : 0.55;

    // 2) kapanis: kapali konu risk uretmez
    const closureScore = st.state === 'closed' ? 0
      : st.state === 'provisional' ? 0.35
      : st.state === 'reopened' ? 1
      : st.state === 'practicing' ? 0.6
      : st.state === 'learning' ? 0.75
      : 1;                                    // not_started

    // 3) hata: bu konudan gelen acik yanlislar (3+ hata tavana yakin)
    const errs = S.errors.filter(e => !e.closedAt && e.subjectId === subjectId && e.topicId === topicId).length;
    const errorScore = U.clamp(errs / 3, 0, 1);

    // 4) kart: bu konunun gecikmis tekrar kartlari
    const late = overdueCards().filter(c => c.subjectId === subjectId).length;
    const cardScore = U.clamp(late / 5, 0, 1);

    // 5) tazelik: son olcumden bu yana gecen sure
    const lastAt = st.secondAt || st.firstAt || null;
    const staleDays = lastAt ? U.diffDays(lastAt, U.todayISO()) : null;
    const staleScore = st.state === 'not_started' ? 0.5
      : staleDays == null ? 0.5
      : U.clamp(staleDays / R.SCORING.staleDays, 0, 1);

    const practice = topicPractice(subjectId, topicId);
    // Pratikte dusuk dogruluk kapanisi gecersiz kilmaz ama riski geri yukseltir.
    const practicePenalty = (practice.accuracy != null && practice.accuracy < 70)
      ? U.clamp((70 - practice.accuracy) / 70, 0, 1) : 0;

    const base = freq*w.freq + closureScore*w.closure + errorScore*w.errors +
      cardScore*w.cards + staleScore*w.stale;
    const score = U.clamp(U.round(base + practicePenalty*w.errors, 0), 0, 100);

    const band = R.SCORING.riskBands.find(b => score >= b.min) || R.SCORING.riskBands[2];

    return {
      subjectId, topicId,
      subjectName:subject.name, topicName:topic.name,
      score, band:band.key, label:band.label, tone:band.tone,
      state:st.state, freq:topic.freq, errors:errs, staleDays,
      practice,
      parts:{ freq, closure:closureScore, errors:errorScore, cards:cardScore,
        stale:staleScore, practice:practicePenalty },
    };
  }

  /* Tum konularin risk siralamasi. limit verilirse kirpilir. */
  function riskRanking(limit){
    const out = [];
    R.SUBJECTS.forEach(s => {
      s.topics.forEach(t => {
        const r = topicRisk(s.id, t.id);
        if(r && r.score > 0) out.push(r);
      });
    });
    out.sort((a, b) => b.score - a.score);
    return limit ? out.slice(0, limit) : out;
  }

  /* ==================== günün akışı ====================
     Bugunun sirasi: izle → not → soru → kart → mola.
     nextAction() tek bir "sonraki hamle" verir; bu ise gunun tamamini
     adim adim gosterir ve her adimin neden orada oldugunu soyler. */

  function dailyFlow(){
    const todayISO = U.todayISO();
    const day = S.days[todayISO];
    const steps = [];

    const openNotes = S.videoNotes.filter(n => !n.done);
    const noteNoCards = S.videoNotes.filter(n =>
      n.segments.length && !S.cards.some(c => c.source === 'note' && c.sourceRef === n.id));

    // 1) izle / not al
    if(openNotes.length){
      steps.push({ key:'watch', icon:'play', route:'learn', label:'İzle ve not al',
        title:openNotes[0].title || 'Devam eden ders',
        why:'Yarım kalan ders, kapanmamış konu demektir.', done:false });
    }
    // 2) nottan kart
    if(noteNoCards.length){
      steps.push({ key:'note-cards', icon:'cards', route:'learn', label:'Nottan kart üret',
        title:noteNoCards.length+' dersin notu karta dönüşmedi',
        why:'Not tek başına tekrar değildir; geri çağırma kartı olmadan unutulur.', done:false });
    }
    // 3) bloklar
    const blocks = day ? day.blocks.filter(b => b.slot !== 'Dinlenme') : [];
    const doneBlocks = blocks.filter(b => b.status === 'done').length;
    if(blocks.length){
      steps.push({ key:'blocks', icon:'today', route:'today', label:'Soru çöz',
        title:doneBlocks+'/'+blocks.length+' blok tamam',
        why:'Konuyu bilmek ile soruda tanımak farklı becerilerdir.',
        done:doneBlocks >= blocks.length });
    }
    // 4) due kartlar
    const due = dueCards().length;
    steps.push({ key:'cards', icon:'cards', route:'cards', label:'Tekrarı kapat',
      title:due ? due+' kart bekliyor' : 'Bugünün kartları bitti',
      why:'Aralıklı tekrar, konu kapanışının tek ucuz yoludur.', done:due === 0 });
    // 5) analiz borcu
    const debt = analysisDebt();
    if(debt.length){
      steps.push({ key:'analysis', icon:'exam', route:'exams', label:'Analizi bitir',
        title:debt.length+' deneme analiz bekliyor',
        why:'Analiz edilmemiş deneme, analiz edilenden daha az değerlidir.', done:false });
    }
    // 6) mola
    const taken = M.breaksOf(todayISO).length;
    steps.push({ key:'break', icon:'moon', route:'today', label:'Mola ver',
      title:taken ? taken+' mola alındı' : 'Bugün mola alınmadı',
      why:'Mola dinlenme değil, pekişme aralığıdır. Blok arası 5–15 dakika.',
      done:taken > 0 });

    const doneCount = steps.filter(s => s.done).length;
    return { steps, done:doneCount, total:steps.length, pct:U.pct(doneCount, steps.length) };
  }

  /* ==================== mola önerisi ====================
     Enerjiye, saate ve gunun yukune gore mesgale onerir.
     Uykudan feda eden veya "sonra telafi et" diyen oneri uretmez. */

  function suggestBreak(){
    const todayISO = U.todayISO();
    const taken = M.breaksOf(todayISO);
    const mood = M.moodOf(todayISO);
    const energy = mood ? mood.energy : null;
    const hour = new Date().getHours();
    const day = S.days[todayISO];
    const running = day ? day.blocks.find(b => b.startedAt) : null;

    if(taken.length >= R.BREAK_RULE.maxPerDay){
      return { ok:false, reason:'Bugün '+taken.length+' mola verildi. Bundan sonrası mola değil kaçınmadır.' };
    }

    const longBlock = running && running.targetMin >= R.BREAK_RULE.shortAfterMin;
    const minutes = longBlock ? R.BREAK_RULE.longMin : R.BREAK_RULE.shortMin;

    // Enerji dusukse enerji isteyen mesgale onerilmez.
    let pool = M.activityCatalog().filter(a => a.minutes <= minutes + 10);
    if(energy != null && energy <= 2) pool = pool.filter(a => a.energy === 'low');
    else if(energy != null && energy >= 4) pool = pool.filter(a => a.energy !== 'low');

    // Gec saatte uyandiran mesgale onerilmez.
    if(hour >= 21) pool = pool.filter(a => a.kind !== 'beden' || a.energy === 'low');
    // Ayni gun tekrar eden oneriyi ele.
    const usedIds = taken.map(b => b.activityId);
    const fresh = pool.filter(a => usedIds.indexOf(a.id) < 0);
    const list = (fresh.length ? fresh : pool);

    if(!list.length) return { ok:false, reason:'Uygun meşgale bulunamadı.' };

    // Gunun tarihine gore dondur — her acilista degismesin, gunluk sabit kalsin.
    const seed = (U.diffDays('2026-01-01', todayISO) + taken.length) % list.length;
    const picks = [list[seed], list[(seed+1) % list.length], list[(seed+2) % list.length]]
      .filter((a, i, arr) => a && arr.indexOf(a) === i);

    return {
      ok:true, minutes, energy,
      picks,
      why:longBlock
        ? 'Uzun blok sonrası '+minutes+' dakikalık mola pekişmeyi artırır.'
        : 'Kısa blok sonrası '+minutes+' dakika yeter; uzun mola ritmi kırar.',
    };
  }

  /* Bugunun odulu — nete degil davranisa baglidir. */
  function todayReward(){
    const todayISO = U.todayISO();
    const min = minimumDayMet();
    const streak = behaviorStreak();
    const day = S.days[todayISO];
    const sleep = day && day.sleepHours != null ? day.sleepHours : null;
    const target = (S.profile && S.profile.sleepTarget) || 7.5;
    const analysisClean = analysisDebt().length === 0;
    const cardsClean = dueCards().length === 0;

    const earned = [];
    if(min) earned.push({ key:'minimum', label:'Minimum gün tutuldu', icon:'check' });
    if(sleep != null && sleep >= target - 0.5) earned.push({ key:'sleep', label:'Uyku hedefi tutuldu', icon:'moon' });
    if(analysisClean) earned.push({ key:'analysis', label:'Analiz borcu yok', icon:'exam' });
    if(cardsClean) earned.push({ key:'cards', label:'Tekrar kapandı', icon:'cards' });

    const all = earned.length >= 4;
    return {
      earned, streak, all,
      title: all ? 'Gün tam kapandı' : earned.length ? 'Bugün kazanılan' : 'Henüz kazanılmadı',
      note: all
        ? 'Dört davranışın dördü de tuttu. Ödül nete değil bu düzene bağlıdır.'
        : 'Ödül nete değil davranışa bağlıdır: düzen, analizin zamanında bitmesi, uyku.',
    };
  }

  /* Sinav haftasi modu: son iki haftada arayuz sadelesir, yeni konu acilmaz. */
  function examWeekMode(){
    const left = U.diffDays(U.todayISO(), R.PLAN.examTytISO);
    const weeks = Math.ceil(left / 7);
    return {
      active:left >= 0 && weeks <= R.EXAM_WEEK_MODE.weeksBefore,
      weeksLeft:weeks, daysLeft:left, note:R.EXAM_WEEK_MODE.note,
    };
  }

  /* Odul esigi — nete degil davranis serisine bagli. */
  function rewardTier(){
    const streak = behaviorStreak().streak;
    const reached = R.REWARD_TIERS.filter(t => streak >= t.days);
    const next = R.REWARD_TIERS.find(t => streak < t.days);
    return {
      streak,
      current:reached.length ? reached[reached.length-1] : null,
      next:next || null,
      toNext:next ? next.days - streak : 0,
    };
  }

  return {
    fullExams, comparableNets, medianTrend, examBase, testMedian, analysisDebt, examVolumeProgress,
    errorDistribution, errorPareto, topTags, openErrors,
    dueCards, overdueCards, cardDebt,
    weekBlocks, planCompletion, questionRealization, timeRealization, plannedMinutes, capacityLoad,
    completionHistory, skipReasonCounts,
    subjectClosure, overallClosure, examClosure, pendingSecondChecks,
    sleepAverage, intensityGrid, testSeries,
    currentGate, gateStatus, gateSuggestions,
    protocolTriggers, minimumDayMet, obp, nextAction, behaviorStreak,
    rawScore, rankForScore, estimateScore, netGapToTarget,
    topicRisk, riskRanking, topicPractice,
    dailyFlow, suggestBreak, todayReward, examWeekMode, rewardTier,
  };
})();

/* ==== js/core/analytics.js ==== */
/* Derin analiz katmanı.

   R.Calc karar verir (eşik, bant, kapı). Buradaki fonksiyonlar karar vermez;
   var olan kaydı sorgulayıp okunabilir hale getirir. Yeni veri istemezler.

   Hepsi saf okuma: hiçbiri state değiştirmez. */

window.R = window.R || {};

R.Analytics = (function(){
  const U = R.U, M = R.Model, S = R.S;
  const C = () => R.Calc;

  /* ---------- deneme karşılaştırma ---------- */
  function compareExams(idA, idB){
    const a = S.exams.find(e => e.id === idA);
    const b = S.exams.find(e => e.id === idB);
    if(!a || !b) return null;

    const names = {};
    (a.tests || []).forEach(t => { names[t.name] = true; });
    (b.tests || []).forEach(t => { names[t.name] = true; });

    const acc = t => (t && (t.correct + t.wrong)) ? U.pct(t.correct, t.correct + t.wrong) : null;
    const rows = Object.keys(names).map(name => {
      const ta = (a.tests || []).find(t => t.name === name);
      const tb = (b.tests || []).find(t => t.name === name);
      const na = ta ? U.round(M.testNet(ta), 2) : null;
      const nb = tb ? U.round(M.testNet(tb), 2) : null;
      return {
        name, netA:na, netB:nb,
        delta:(na != null && nb != null) ? U.round(nb - na, 2) : null,
        blankA:ta ? ta.blank : null, blankB:tb ? tb.blank : null,
        accA:acc(ta), accB:acc(tb),
        minA:ta ? ta.minutes : null, minB:tb ? tb.minutes : null,
      };
    });

    const totalA = U.round(M.examNet(a), 2);
    const totalB = U.round(M.examNet(b), 2);
    const moved = rows.filter(r => r.delta != null)
      .sort((x, y) => Math.abs(y.delta) - Math.abs(x.delta));

    return {
      a:{ id:a.id, date:a.date, type:a.type, publisher:a.publisher, net:totalA },
      b:{ id:b.id, date:b.date, type:b.type, publisher:b.publisher, net:totalB },
      rows, delta:U.round(totalB - totalA, 2),
      biggest:moved[0] || null,
      note:moved.length
        ? 'En büyük değişim ' + moved[0].name + ': '
          + (moved[0].delta > 0 ? '+' : '') + U.fmtNet(moved[0].delta) + ' net.'
        : 'Karşılaştırılabilir test yok.',
    };
  }

  /* ---------- boş bırakma stratejisi ---------- */
  function blankStrategy(family){
    const list = C().fullExams(family || 'TYT');
    if(list.length < 3) return { ok:false, why:'En az 3 tam deneme gerekir.' };

    const points = list.map(e => ({
      date:e.date,
      blank:U.sum((e.tests || []).map(t => t.blank || 0)),
      wrong:U.sum((e.tests || []).map(t => t.wrong || 0)),
      net:U.round(M.examNet(e), 2),
    }));
    const avgBlank = U.round(U.sum(points.map(p => p.blank)) / points.length, 1);
    const sorted = points.slice().sort((a, b) => b.net - a.net);
    const best = sorted[0], worst = sorted[sorted.length-1];

    const dir = best.blank < avgBlank - 1 ? 'less'
      : best.blank > avgBlank + 1 ? 'more' : 'same';

    return {
      ok:true, points, avgBlank, best, worst, dir,
      note:dir === 'less'
        ? 'En iyi denemende ortalamadan az boş bıraktın. Daha çok soruya girmek sana net kazandırıyor.'
        : dir === 'more'
        ? 'En iyi denemende ortalamadan çok boş bıraktın. Emin olmadığını boş bırakmak sana yarıyor.'
        : 'Boş sayısı ile net arasında belirgin ilişki yok; sorun hızda ya da isabette olabilir.',
    };
  }

  /* ---------- konu × hata tipi ısı haritası ---------- */
  function errorHeatmap(limit){
    const tags = Object.keys(R.ERROR_TAGS);
    const byTopic = {};
    S.errors.forEach(e => {
      const key = e.topic || e.testName || 'Etiketsiz';
      if(!byTopic[key]){
        byTopic[key] = { topic:key, total:0, cells:{} };
        tags.forEach(t => { byTopic[key].cells[t] = 0; });
      }
      if(byTopic[key].cells[e.tag] != null){
        byTopic[key].cells[e.tag]++;
        byTopic[key].total++;
      }
    });
    const rows = Object.keys(byTopic).map(k => byTopic[k])
      .filter(r => r.total > 0)
      .sort((a, b) => b.total - a.total);
    const max = rows.length
      ? Math.max.apply(null, rows.map(r => Math.max.apply(null, tags.map(t => r.cells[t]))))
      : 0;
    return { tags, rows:limit ? rows.slice(0, limit) : rows, max };
  }

  /* ---------- tahmini sıra geçmişi ---------- */
  function rankHistory(){
    const calc = C();
    const list = calc.fullExams('TYT');
    if(list.length < 3) return [];
    const nets = list.map(M.examNet);
    const o = calc.obp();
    const out = [];
    for(let i = 2; i < nets.length; i++){
      const med = U.median(nets.slice(Math.max(0, i-2), i+1));
      const raw = calc.rawScore(med, null);
      const score = U.round(raw.value + o.contribution, 1);
      const half = i + 1 >= 8 ? R.SCORING.bandHalfWidth.many
        : i + 1 >= 5 ? R.SCORING.bandHalfWidth.some
        : R.SCORING.bandHalfWidth.few;
      out.push({
        date:list[i].date, score,
        rank:calc.rankForScore(score),
        rankBest:calc.rankForScore(score + half),
        rankWorst:calc.rankForScore(score - half),
      });
    }
    return out;
  }

  /* ---------- yayın zorluk düzeltmesi ---------- */
  function publisherAdjust(family){
    const list = C().fullExams(family || 'TYT');
    if(list.length < 4) return { ok:false, why:'En az 4 tam deneme gerekir.' };

    const nets = list.map(M.examNet);
    const overall = U.median(nets);
    const byPub = {};
    list.forEach((e, i) => {
      const key = e.publisher || 'belirtilmedi';
      byPub[key] = byPub[key] || { publisher:key, nets:[] };
      byPub[key].nets.push(nets[i]);
    });

    const rows = Object.keys(byPub).map(k => {
      const med = U.median(byPub[k].nets);
      return {
        publisher:k, count:byPub[k].nets.length,
        median:U.round(med, 2), offset:U.round(med - overall, 2),
      };
    }).sort((a, b) => b.count - a.count);

    const spread = rows.length > 1
      ? U.round(Math.max.apply(null, rows.map(r => r.median)) - Math.min.apply(null, rows.map(r => r.median)), 2)
      : 0;

    return {
      ok:true, overall:U.round(overall, 2), rows, spread,
      note:spread >= 6
        ? 'Yayınlar arası fark ' + U.fmtNet(spread) + ' net. Trendi tek yayın içinde okumak daha güvenilir.'
        : 'Yayınlar arası fark küçük; netler karşılaştırılabilir.',
    };
  }

  /* ---------- hız–isabet dengesi ---------- */
  function speedAccuracy(family){
    const list = C().fullExams(family || 'TYT').filter(e => (e.tests || []).some(t => t.minutes != null));
    if(!list.length) return { ok:false, why:'Süre kaydı olan tam deneme gerekir.' };

    const byTest = {};
    list.slice(-4).forEach(e => {
      (e.tests || []).forEach(t => {
        if(t.minutes == null) return;
        const answered = t.correct + t.wrong;
        if(!answered) return;
        byTest[t.name] = byTest[t.name] || { test:t.name, sec:[], acc:[] };
        byTest[t.name].sec.push(t.minutes * 60 / answered);
        byTest[t.name].acc.push(U.pct(t.correct, answered));
      });
    });

    const keys = Object.keys(byTest);
    if(!keys.length) return { ok:false, why:'Süre kaydı olan test yok.' };

    const rows = keys.map(k => {
      const sec = U.median(byTest[k].sec);
      const acc = U.median(byTest[k].acc);
      const profile = acc >= 75 && sec <= 60 ? 'ideal'
        : acc < 65 && sec <= 45 ? 'fast-wrong'
        : acc >= 75 && sec > 75 ? 'slow-right'
        : 'mixed';
      return {
        test:k, secPerQ:U.round(sec, 1), accuracy:Math.round(acc), profile,
        note:profile === 'fast-wrong' ? 'Hızlı ama isabetsiz — okuma ve kontrol adımı ekle.'
          : profile === 'slow-right' ? 'Doğru ama yavaş — süre baskısı altında çalış.'
          : profile === 'ideal' ? 'Hız ve isabet dengede.'
          : 'Karışık; daha çok süre kaydı gerek.',
      };
    }).sort((a, b) => a.accuracy - b.accuracy);

    return { ok:true, rows };
  }

  /* ---------- konu net katkısı ---------- */
  function topicValue(limit){
    const calc = C();
    const out = [];
    const W = { high:1, mid:0.55, low:0.25 };
    R.SUBJECTS.forEach(sub => {
      const weightSum = sub.topics.reduce((a, x) => a + (W[x.freq] || 0.55), 0) || 1;
      sub.topics.forEach(t => {
        const st = M.topicState(sub.id, t.id);
        const potential = U.round((sub.questions || 0) * ((W[t.freq] || 0.55) / weightSum), 2);
        const practice = calc.topicPractice(sub.id, t.id);
        const earned = st.state === 'closed' ? potential
          : practice.accuracy != null ? U.round(potential * practice.accuracy / 100, 2)
          : 0;
        out.push({
          subjectId:sub.id, subjectName:sub.name, topicId:t.id, topicName:t.name,
          freq:t.freq, state:st.state,
          potential, earned, gap:U.round(potential - earned, 2),
        });
      });
    });
    out.sort((a, b) => b.gap - a.gap);
    return limit ? out.slice(0, limit) : out;
  }

  /* ---------- unutma eğrisi ---------- */
  function forgettingCurve(){
    const buckets = {};
    S.cards.forEach(c => {
      (c.history || []).forEach(h => {
        if(h.gapDays == null || !h.result) return;
        const b = h.gapDays <= 1 ? '1g'
          : h.gapDays <= 3 ? '3g'
          : h.gapDays <= 7 ? '1h'
          : h.gapDays <= 30 ? '1a' : '1a+';
        buckets[b] = buckets[b] || { gap:b, total:0, remembered:0 };
        buckets[b].total++;
        if(h.result === 'remembered') buckets[b].remembered++;
      });
    });
    const order = ['1g', '3g', '1h', '1a', '1a+'];
    const rows = order.filter(k => buckets[k]).map(k => ({
      gap:k, total:buckets[k].total, rate:U.pct(buckets[k].remembered, buckets[k].total),
    }));
    const weak = rows.find(r => r.rate < 70);
    return {
      ok:rows.length > 0, rows,
      note:!rows.length
        ? 'Yeterli tekrar geçmişi yok; birkaç hafta sonra anlamlı olur.'
        : weak
        ? weak.gap + ' aralığında hatırlama %' + weak.rate + '. Bu aralıktaki kartlar yeniden yazılmalı olabilir.'
        : 'Tüm aralıklarda hatırlama %70 üzerinde; tekrar takvimi sana uyuyor.',
    };
  }

  /* ---------- uyku ile net ilişkisi ---------- */
  function sleepImpact(){
    const list = C().fullExams('TYT');
    if(list.length < 4) return { ok:false, why:'En az 4 tam deneme gerekir.' };

    const points = [];
    list.forEach(e => {
      const prev = S.days[U.iso(U.addDays(U.parse(e.date), -1))];
      if(!prev || prev.sleepHours == null) return;
      points.push({ date:e.date, sleep:Number(prev.sleepHours), net:U.round(M.examNet(e), 2) });
    });
    if(points.length < 4) return { ok:false, why:'Deneme öncesi uyku kaydı yetersiz.' };

    const target = (S.profile && S.profile.sleepTarget) || 7.5;
    const good = points.filter(p => p.sleep >= target - 0.5);
    const bad = points.filter(p => p.sleep < target - 0.5);
    if(!good.length || !bad.length){
      return { ok:false, why:'Karşılaştırma için hem yeterli hem yetersiz uyku günü gerekir.' };
    }

    const gm = U.median(good.map(p => p.net));
    const bm = U.median(bad.map(p => p.net));
    const diff = U.round(gm - bm, 2);
    return {
      ok:true, points, goodMedian:U.round(gm, 2), badMedian:U.round(bm, 2), diff,
      goodCount:good.length, badCount:bad.length,
      note:diff >= 2
        ? 'Yeterli uyuduğun denemelerde medyanın ' + U.fmtNet(diff) + ' net yüksek. Bu senin verin.'
        : diff <= -2
        ? 'Bu veri setinde beklenen ilişki görünmüyor; örnek sayısı az olabilir.'
        : 'Fark ' + U.fmtNet(diff) + ' net — belirgin değil. Daha çok kayıt gerek.',
    };
  }

  /* ---------- kapasite gerçeklik kontrolü ---------- */
  function capacityReality(weeks){
    const calc = C();
    const n = weeks || 4;
    const cur = M.currentWeek();
    const rows = [];
    for(let w = Math.max(1, cur - n); w < cur; w++){
      const t = calc.timeRealization(w);
      if(!t.target) continue;
      rows.push({ week:w, planned:t.target, actual:t.actual, pct:t.pct });
    }
    if(!rows.length) return { ok:false, why:'Henüz tamamlanmış hafta yok.' };

    const claimed = (S.profile && S.profile.capacityHoursPerWeek) || 21;
    const actualAvg = U.round(U.sum(rows.map(r => r.actual)) / rows.length / 60, 1);
    const ratio = claimed ? U.pct(actualAvg, claimed) : 0;
    return {
      ok:true, rows, claimed, actualAvg, ratio,
      status:ratio >= 85 ? 'gercekci' : ratio >= 60 ? 'iyimser' : 'hayali',
      note:ratio >= 85
        ? 'Girdiğin kapasite gerçeğe uyuyor.'
        : 'Kapasiteyi haftada ' + claimed + ' saat yazdın, fiilen ' + actualAvg + ' saat çalışıyorsun (%'
          + ratio + '). Planı gerçek sayıya göre kurmak tamamlama oranını anlamlı kılar.',
    };
  }

  /* ---------- leech kartlar ---------- */
  function leechCards(threshold){
    const min = threshold || 4;
    return S.cards
      .map(c => ({
        id:c.id, front:c.front, topic:c.topic, subjectId:c.subjectId, stage:c.stage,
        forgot:(c.history || []).filter(h => h.result === 'forgot').length,
      }))
      .filter(c => c.forgot >= min)
      .sort((a, b) => b.forgot - a.forgot);
  }

  /* ---------- ilk 20 dakika / ısınma ---------- */
  function warmup(){
    const rows = S.sessions.filter(s => s.earlyRate != null && s.lateRate != null);
    if(!rows.length) return { ok:false, why:'Süreli deneme oturumu gerekir.' };
    const early = U.round(U.sum(rows.map(r => r.earlyRate)) / rows.length, 0);
    const late = U.round(U.sum(rows.map(r => r.lateRate)) / rows.length, 0);
    return {
      ok:true, sessions:rows.length, early, late, diff:late - early,
      note:late - early >= 15
        ? 'İlk 20 dakikada isabet %' + early + ', sonrasında %' + late + '. Isınma sorunu var: '
          + 'denemeye başlamadan 5 dakikalık kolay set çöz.'
        : 'Isınma sorunu görünmüyor; deneme boyunca isabet dengeli.',
    };
  }

  /* ---------- dikkat dağılması ---------- */
  function distractionTrend(days){
    const n = days || 14;
    const rows = [];
    for(let i = n - 1; i >= 0; i--){
      const iso = U.iso(U.addDays(U.today(), -i));
      const d = S.days[iso];
      if(!d) continue;
      rows.push({ date:iso, count:d.distractions || 0 });
    }
    if(!rows.length) return { ok:false, why:'Gün kaydı yok.' };
    const avg = U.round(U.sum(rows.map(r => r.count)) / rows.length, 1);
    return {
      ok:true, rows, avg,
      note:avg >= 5
        ? 'Günde ortalama ' + avg + ' bölünme. Telefonu başka odaya koymak tek en etkili müdahale.'
        : avg >= 2
        ? 'Günde ortalama ' + avg + ' bölünme. Blok başında bildirimleri kapatmak yeterli olabilir.'
        : 'Bölünme düşük; odak sorunu görünmüyor.',
    };
  }

  return {
    compareExams, blankStrategy, errorHeatmap, rankHistory, publisherAdjust,
    speedAccuracy, topicValue, forgettingCurve, sleepImpact, capacityReality,
    leechCards, warmup, distractionTrend,
  };
})();

  /* ---------- grafikler ---------- */
  /* Eksen adimini 1/2/5/10 ailesine oturtur ki etiketler yuvarlak sayi olsun. */
  function niceStep(raw){
    if(!isFinite(raw) || raw <= 0) return 1;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const norm = raw / mag;
    const step = norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10;
    return step * mag;
  }

  function lineChart(series, opts){
    const o = opts || {};
    const w = 640, h = o.height || 190, padL = 34, padR = 14, padT = 14, padB = 26;
    const all = series.reduce((acc,s) => acc.concat(s.data.filter(v => v != null)), []);
    if(!all.length) return '<p class="small dim">Grafik için henüz veri yok.</p>';

    const maxV = Math.max.apply(null, all), minV = Math.min.apply(null, all);
    const pad = Math.max(2, (maxV-minV)*0.2);
    const step = niceStep((maxV+pad - Math.max(0, minV-pad)) / 4);
    const top = o.max != null ? o.max : Math.ceil((maxV+pad) / step) * step;
    const bottom = o.min != null ? o.min : Math.max(0, Math.floor((minV-pad) / step) * step);
    const n = Math.max.apply(null, series.map(s => s.data.length));
    const X = i => padL + (w-padL-padR) * (n <= 1 ? 0.5 : i/(n-1));
    const Y = v => h-padB - (h-padT-padB) * ((v-bottom)/((top-bottom)||1));

    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" role="img">';
    const ticks = 4;
    for(let i = 0; i <= ticks; i++){
      const v = bottom + (top-bottom)*i/ticks;
      const y = Y(v);
      svg += '<line class="axis" x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(v)+'</text>';
    }
    if(o.band){
      const y1 = Y(o.band[1]), y2 = Y(o.band[0]);
      svg += '<rect class="band" x="'+padL+'" y="'+y1+'" width="'+(w-padL-padR)+'" height="'+Math.max(0,y2-y1)+'" opacity=".5"/>';
    }
    series.forEach(s => {
      const pts = s.data.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
      if(!pts.length) return;
      const d = 'M' + pts.map(p => p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ');
      if(pts.length > 1 && o.area !== false){
        svg += '<path class="area'+(s.accent?' area--accent':'')+'" d="'+d+' L '+pts[pts.length-1][0].toFixed(1)+' '+(h-padB)+' L '+pts[0][0].toFixed(1)+' '+(h-padB)+' Z"/>';
      }
      svg += '<path class="line'+(s.accent?' line--accent':'')+'" d="'+d+'"/>';
      pts.forEach((p,i) => {
        const last = i === pts.length-1;
        svg += '<circle class="pt'+(s.accent?' pt--accent':'')+'" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="'+(last?4:2.6)+'"/>';
      });
    });
    if(o.labels){
      o.labels.forEach((lb,i) => {
        if(n > 8 && i % 2) return;
        svg += '<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle">'+U.esc(lb)+'</text>';
      });
    }
    svg += '</svg>';
    return svg;
  }

    if(!rows.length) return '<p class="small dim">Veri yok.</p>';

    [0, 0.5, 1].forEach(f => {

      svg += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(top*(1-f))+'</text>';

    }
    rows.forEach((r,i) => {
      const v = r.value == null ? 0 : U.clamp(r.value, 0, top);

  function donut(pct, label, size){
    const s = size || 92, r = (s/2) - 8, c = 2*Math.PI*r;

      + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+s/2+' '+s/2+')"/>'
      + '</svg>'
