    + '- Kısa yaz: en fazla 6 cümle. Liste gerekiyorsa en fazla 4 madde.\n'
    + '- Somut ol: hangi konu, hangi gün, kaç soru.\n',

  /* Yasak kalıplar — çıktı bunlara karşı doğrulanır.
     when() doğruysa ve regex eşleşirse kullanıcıya düzeltme notu gösterilir. */
  forbidden: [
    { id:'new-source',
      re:/(yeni|başka|farklı)\s+(bir\s+)?(kaynak|yayın|kitap|banka)/i,
      why:'Kural motoru kaynak değişimine izin vermiyor (konu kapanışı %55 altında veya netler düz).',
      when:C => C.overallClosure().pct < 55
        || (C.medianTrend('TYT').delta != null && Math.abs(C.medianTrend('TYT').delta) < 1.5) },

    { id:'guarantee',
      re:/(kesinlikle kazan|garanti|kesin olarak yerleş|mutlaka kazan)/i,
      why:'Yerleşme garantisi verilemez; hedefler koçluk bandıdır.',
      when:() => true },

    { id:'night-study',
      re:/(gece boyunca|sabaha kadar|uykudan feda|uykunu böl|gece(leri)?\s+çalış)/i,
      why:'Uykudan feda ederek çalışma önerilemez; uyku bellek pekişmesinin parçasıdır.',
      when:() => true },

    { id:'medical',
      re:/(ilaç|antidepresan|takviye kullan|doz|teşhis|depresyon(dasın| olmuşsun)|hastalığın var)/i,
      why:'Koç tıbbi veya psikiyatrik değerlendirme yapamaz; gerekiyorsa rehber öğretmen ya da hekime başvurulur.',
      when:() => true },

    { id:'rank-promise',
      re:/(\b\d{1,3}\.?\d{3}\b\s*(sıraya|sırada)\s*(gireceksin|olacaksın|çıkarsın))/i,
      why:'Kesin sıra tahmini verilemez; sıra bant ve kesinlik etiketiyle sunulur.',
      when:() => true },
  ],

  /* Çevrimdışıyken kullanıcıya gösterilen kopyalanabilir şablon. */
  offlineTemplate(ctx){
    return [
      'YKS koçluk verisi — yorum istiyorum.',
      '',
      'Kurallar: tek denemeyle karar verme (son 3 medyanı esas al), tek müdahale öner,',
      'kaynak değiştirmeyi önerme, garanti verme, tıbbi tavsiye verme.',

      'VERİ:',
      JSON.stringify(ctx, null, 1),
      '',
      'Soru: Bu veriye göre gelecek hafta tek bir somut davranış değişikliği öner ve nedenini yaz.',
    ].join('\n');

  turn(agent, agenda, brief, said, round, memory, options){
    const r = round || { title:'Tur', ask:'Kendi alanından tek bulgu bildir.' };
    return 'GÜNDEM: ' + agenda.topic + '\n'
      + 'TUR: ' + r.title + '\n\n'
      + (options && options.length
          ? 'OYLANACAK FİKİRLER:\n'
            + options.map(o => o.n + '. ' + o.name + ': ' + o.text).join('\n') + '\n\n'
          : '')
      + 'MASANDAKİ RAPOR (JSON):\n' + JSON.stringify(brief, null, 1) + '\n\n'
      + (said && said.length
          ? 'TOPLANTIDA ŞU ANA KADAR SÖYLENENLER:\n'
            + said.map(s => s.name + ' (' + s.role + '): ' + s.text).join('\n') + '\n\n'
          : '')
      + (memory && memory.length
          ? 'DAHA ÖNCE SENİN SÖYLEDİKLERİN (tekrarlama, yenisini söyle):\n'
            + memory.map(t => '- ' + t).join('\n') + '\n\n'
          : '')
      + 'GÖREV: ' + r.ask + ' Söylenenleri tekrarlama; katılmıyorsan nedenini veriyle söyle. '
      + 'Alanın dışına çıkma. En fazla ' + agent.maxSentences + ' cümle.';
  },

  /* Toplanti — Patron celiskili masaya takip sorusu sorar.
     Celiskiyi kural motoru bulur; soru metni de ondan gelir. */
  cross(conflict){
    return 'KURAL MOTORU İKİ MASA ARASINDA ÇELİŞKİ BULDU.\n'
      + 'Sorulacak kişi: ' + conflict.name + '\n'
      + 'Sorulacak soru: ' + conflict.question + '\n\n'
      + 'GÖREV: Bu soruyu kendi ağzınla, adıyla hitap ederek sor. Soruyu DEĞİŞTİRME, '
      + 'cevabını da sen verme. Tek cümle.';
  },

  /* Toplanti — capraz soruya yanit. */
  answer(agent, conflict, brief, said){
    return 'PATRON SANA SORDU: ' + conflict.question + '\n\n'
      + 'MASANDAKİ RAPOR (JSON):\n' + JSON.stringify(brief, null, 1) + '\n\n'
      + (said && said.length
          ? 'TOPLANTIDA SÖYLENENLER:\n'
            + said.map(s => s.name + ': ' + s.text).join('\n') + '\n\n'
          : '')
      + 'GÖREV: Soruya doğrudan yanıt ver. Savunma yapma, veriye bak: '
      + 'çelişki gerçekse kabul et, değilse nedenini sayıyla göster. '
      + 'En fazla ' + agent.maxSentences + ' cümle.';
  },

  /* Toplanti — Patron kapatir. Eylem kural motorundan gelir, uydurulmaz. */
  closing(agenda, said, action, vote){
    return 'GÜNDEM: ' + agenda.topic + '\n\n'
      + 'EKİBİN SÖYLEDİKLERİ:\n'
      + said.map(s => s.name + ' (' + s.role + '): ' + s.text).join('\n') + '\n\n'
      + (vote && vote.kazanan
          ? 'OYLAMA SONUCU (kural motoru saydı, güven skoruyla ağırlıklı):\n'
            + vote.rows.map(r => r.n + '. ' + r.name + ' — ' + r.oy + ' oy, ağırlık ' + r.agirlik).join('\n')
            + '\nEn çok destek: ' + vote.kazanan.name + ' — ' + vote.kazanan.text + '\n\n'
          : '')
      + 'KURAL MOTORUNUN BELİRLEDİĞİ EYLEM: ' + action.title
      + (action.why ? ' — ' + action.why : '') + '\n\n'
      + 'GÖREV: Toplantıyı kapat. Ekipte çelişki varsa hangisinin haklı olduğunu söyle, '
      + (vote && vote.kazanan ? 'oylamanın sonucunu da an, ' : '')
      + 'sonra yukarıdaki eylemi kendi cümlenle gerekçelendir. Eylemi DEĞİŞTİRME, '
      + 'yerine başka iş önerme. En fazla 4 cümle.';
  },
};

/* ==== js/core/utils.js ==== */
/* Tarih, sayi ve metin yardimcilari. */

window.R = window.R || {};

R.U = (function(){
  const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const MONTHS_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const DAY_MS = 86400000;

  function pad2(n){ return String(n).padStart(2,'0'); }

  function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

  function parse(s){
    if(s instanceof Date) return s;
    const parts = String(s).slice(0,10).split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function today(){
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function todayISO(){ return iso(today()); }

  function addDays(d, n){
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate()+n);
    return r;
  }

  function diffDays(a, b){
    return Math.round((parse(b) - parse(a)) / DAY_MS);
  }

  /* 0 = Pazartesi ... 6 = Pazar */
  function weekdayIndex(d){ return (parse(d).getDay()+6)%7; }

  function fmtDate(d){
    const x = parse(d);
    return x.getDate()+' '+MONTHS[x.getMonth()]+' '+x.getFullYear();
  }
  function fmtShort(d){
    const x = parse(d);
    return x.getDate()+' '+MONTHS_SHORT[x.getMonth()];
  }
  function fmtRange(a, b){
    const x = parse(a), y = parse(b);
    if(x.getMonth() === y.getMonth()) return x.getDate()+'–'+y.getDate()+' '+MONTHS_SHORT[y.getMonth()];
    return fmtShort(x)+' – '+fmtShort(y);
  }
  function monthName(d){ return MONTHS[parse(d).getMonth()]; }
  function monthKey(d){ const x = parse(d); return x.getFullYear()+'-'+pad2(x.getMonth()+1); }

  function relativeDay(dateISO){
    const n = diffDays(todayISO(), dateISO);
    if(n === 0) return 'bugün';
    if(n === 1) return 'yarın';
    if(n === -1) return 'dün';
    if(n < 0) return Math.abs(n)+' gün gecikmiş';
    return n+' gün sonra';
  }

  /* --- sayi --- */
  function median(arr){
    const s = arr.filter(v => typeof v === 'number' && !isNaN(v)).sort((a,b)=>a-b);
    if(!s.length) return null;
    const m = Math.floor(s.length/2);
    return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
  }
  function round(x, digits){
    if(!isFinite(x)) return 0;
    const f = Math.pow(10, digits==null?1:digits);
    return Math.round(x*f)/f;
  }
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
  function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0), 0); }
  function pct(part, whole){
    if(!whole || !isFinite(whole) || !isFinite(part)) return 0;
    return round(100*part/whole, 0);
  }

  function fmtNet(x){
    if(x == null || (typeof x === 'number' && !isFinite(x))) return '—';
    return (Math.round(x*100)/100).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtNum(x){
    if(x == null || (typeof x === 'number' && !isFinite(x))) return '—';
    return Number(x).toLocaleString('tr-TR');
  }
  function fmtMin(mins){
    if(mins == null) return '—';
    const h = Math.floor(mins/60), m = Math.round(mins%60);
    if(h && m) return h+' sa '+m+' dk';
    if(h) return h+' sa';
    return m+' dk';
  }
  function fmtClock(seconds){
    const m = Math.floor(seconds/60), s = Math.floor(seconds%60);
    return pad2(m)+':'+pad2(s);
  }

  /* --- metin --- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function uid(prefix){
    return (prefix||'id') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function slug(s){
    return String(s).toLowerCase()
      .replace(/[ığüşöç]/g, c => ({'ı':'i','ğ':'g','ü':'u','ş':'s','ö':'o','ç':'c'}[c]))
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }
  function plural(n, one, many){ return n+' '+(n===1?one:many); }

  /* Arama normalizasyonu: "ogrenme" ile "öğrenme" eslesir.
     Once Turkce harfler sadelestirilir — "İ".toLowerCase() birlesik nokta
     uretir, bu yuzden kucultme sonra yapilir. */
  const COMBINING = /[\u0300-\u036f]/g;   // birlesik aksan isaretleri
  function norm(s){
    return String(s == null ? '' : s)
      .replace(/[ıİI]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
      .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
      .toLowerCase()
      .replace(COMBINING, '');   // artakalan birlesik isaretler
  }

  function debounce(fn, wait){
    let t;
    return function(){
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(ctx, args), wait||250);
    };
  }

  return {
    MONTHS, MONTHS_SHORT, DAY_MS,
    pad2, iso, parse, today, todayISO, addDays, diffDays, weekdayIndex,
    fmtDate, fmtShort, fmtRange, monthName, monthKey, relativeDay,
    median, round, clamp, sum, pct, fmtNet, fmtNum, fmtMin, fmtClock,
    esc, uid, slug, plural, norm, debounce,
  };
})();

/* ==== js/core/h.js ==== */
/* Sablon katmani.

   html`` etiketli sablonu: araya giren her deger varsayilan olarak KAÇIRILIR.
   Yapisal HTML raw() ile isaretlenir; ic ice html`` cagrilari zaten raw doner.

     h.html`<p>${kullaniciMetni}</p>`            → kacirilir
     h.html`<div>${h.raw(baskaHtml)}</div>`      → oldugu gibi
     h.html`${liste.map(x => h.html`<li>${x}</li>`)}`  → dizi otomatik birlesir

   Kural: kullanici verisi ve metin daima kaçırılır, yapısal HTML raw. */

window.R = window.R || {};

R.h = (function(){
  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function Raw(s){ this.s = s; }
  Raw.prototype.toString = function(){ return this.s; };

  function raw(s){ return s instanceof Raw ? s : new Raw(s == null ? '' : String(s)); }
  function isRaw(v){ return v instanceof Raw; }

  /* Bir degeri HTML metnine cevirir. */
  function val(v){
    if(v == null || v === false || v === true) return '';
    if(v instanceof Raw) return v.s;
    if(Array.isArray(v)) return v.map(val).join('');
    if(typeof v === 'number') return String(v);
    return esc(v);
  }

  function html(strings, ...vals){
    let out = strings[0];
    for(let i = 0; i < vals.length; i++) out += val(vals[i]) + strings[i+1];
    return new Raw(out);
  }

  /* Kosullu parca: yanlissa hicbir sey uretmez. */
  function when(cond, node){
    if(!cond) return raw('');
    return raw(val(typeof node === 'function' ? node() : node));
  }

  /* Sinif adlarini birlestirir: cls('card', aktif && 'is-active') */
  function cls(){
    return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');
  }

  /* Nitelik sozlugu: attrs({ 'data-act':'go', disabled:true, title:null }) */
  function attrs(map){
    const out = [];
    Object.keys(map || {}).forEach(k => {
      const v = map[k];
      if(v == null || v === false) return;
      if(v === true) out.push(k);
      else out.push(k + '="' + esc(v) + '"');
    });
    return raw(out.join(' '));
  }

  /* Liste: map(dizi, fn) — bos dizide bos doner */
  function map(list, fn){
    return raw((list || []).map((item, i) => val(fn(item, i))).join(''));
  }

  return { html, raw, isRaw, val, when, cls, attrs, map, esc };
})();

/* ==== js/core/store.js ==== */
/* Kalici depolama.
   Once Artifact "db" yetenegi denenir (cihazlar arasi), yoksa localStorage'a duser.
   Her iki durumda da yerel kopya tutulur; boylece cevrimdisi calisir.
   Hatalar yutulmaz: onError kancasi uzerinden arayuze bildirilir. */

window.R = window.R || {};

R.SCHEMA_VERSION = 4;

R.Store = (function(){
  /* Cok kullanicili kullanim: her profil kendi anahtarinda durur.
     'main' geriye donuk uyum icin eski anahtari kullanmaya devam eder. */
  function activeProfile(){
    try{ return localStorage.getItem('rota.activeProfile') || 'main'; }
    catch(e){ return 'main'; }
  }
  const PROFILE = activeProfile();
  const LOCAL_KEY = PROFILE === 'main' ? 'rota84285.v2' : 'rota84285.v2.' + PROFILE;
  let db = null;
  let mode = 'local';

  const health = {
    cloud:'off',        // 'off' | 'ok' | 'error'
    local:'ok',         // 'ok' | 'error'
    lastError:null,     // { scope, code, message, at }
    pendingCloudWrites:0,
  };

  let onError = null;   // app.js tarafindan baglanir

  function report(scope, err, userMessage){
    const code = (err && err.code) || (err && err.name) || 'unknown';
    health.lastError = {
      scope, code,
      message: userMessage || (err && err.message) || String(err),
      at: new Date().toISOString(),
    };
    console.error('[Store:'+scope+']', err);
    if(typeof onError === 'function'){
      try{ onError(health.lastError, health); }catch(e){}
    }
  }

  function isQuotaError(e){
    if(!e) return false;
    return e.name === 'QuotaExceededError'
      || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
      || e.code === 22 || e.code === 1014
      || /quota|storage.*full/i.test(e.message || '');
  }

  function localAll(){
    try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); }
    catch(e){
      report('local-read', e, 'Yerel kayıt okunamadı; veriler geçici olarak bellekte tutuluyor.');
      health.local = 'error';
      return {};
    }
  }
  function localWrite(all){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
      if(health.local === 'error'){ health.local = 'ok'; }
      return true;
    }catch(e){
      health.local = 'error';
      report('local-write', e, isQuotaError(e)
        ? 'Tarayıcı depolama alanı doldu. Ayarlar → Veri bölümünden yedek alıp eski kayıtları temizle.'
        : 'Değişiklik bu cihaza kaydedilemedi.');
      return false;
    }
  }

  function lGet(path){
    const all = localAll();
    return all[path] === undefined ? null : all[path];
  }
  function lSet(path, data){
    const all = localAll();
    all[path] = data;
    return localWrite(all);
  }
  function lDel(path){
    const all = localAll();
    delete all[path];
    localWrite(all);
  }
  function lList(prefix){
    const all = localAll();
    const p = prefix.endsWith('/') ? prefix : prefix + '/';
    const out = [];
    Object.keys(all).forEach(k => {
      if(k.indexOf(p) === 0){
        const rest = k.slice(p.length);
        if(rest && rest.indexOf('/') === -1) out.push(Object.assign({ id:rest }, all[k]));
      }
    });
    return out;
  }

  async function init(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const api = await window.claude.use('db');
        if(api){ db = api; mode = 'cloud'; health.cloud = 'ok'; }
      }
    }catch(e){
      db = null;
      health.cloud = 'error';
      report('cloud-init', e, 'Hesaba bağlı senkronizasyon açılamadı; uygulama bu cihazda çalışmaya devam ediyor.');
    }
    return mode;
  }

  async function get(path){
    if(db){
      try{
        const snap = await db.doc(path).get();
        health.cloud = 'ok';
        if(snap.exists){
          const data = snap.data();
          lSet(path, data);
          return data;
        }
        return lGet(path);
      }catch(e){
        health.cloud = 'error';
        report('cloud-read', e, 'Buluttan okunamadı; bu cihazdaki kopya kullanılıyor.');
        return lGet(path);
      }
    }
    return lGet(path);
  }

  async function set(path, data){
    const localOk = lSet(path, data);
    if(db){
      health.pendingCloudWrites++;
      try{
        await db.doc(path).set(data);
        health.cloud = 'ok';
      }catch(e){
        health.cloud = 'error';
        report('cloud-write', e, localOk
          ? 'Değişiklik bu cihaza kaydedildi ama buluta gönderilemedi. Bağlantı gelince tekrar dene.'
          : 'Değişiklik kaydedilemedi.');
      }finally{
        health.pendingCloudWrites--;
      }
    }
    return localOk;
  }

  async function remove(path){
    lDel(path);
    if(db){
      try{ await db.doc(path).delete(); }
      catch(e){
        health.cloud = 'error';
        report('cloud-delete', e, 'Kayıt buluttan silinemedi.');
      }
    }
  }

  async function list(collection){
    if(db){
      try{
        const snap = await db.collection(collection).get();
        health.cloud = 'ok';
        const rows = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
        rows.forEach(r => lSet(collection+'/'+r.id, r));
        if(rows.length) return rows;
        return lList(collection);
      }catch(e){
        health.cloud = 'error';
        report('cloud-list', e, 'Bulut verisi okunamadı; bu cihazdaki kopya kullanılıyor.');
        return lList(collection);
      }
    }
    return lList(collection);
  }

  /* ---------- yedekleme ---------- */

  function exportAll(){
    return {
      __meta:{
        app:'rota-84285',
        schemaVersion:R.SCHEMA_VERSION,
        exportedAt:new Date().toISOString(),
        mode,
      },
      data:localAll(),
    };
  }

  /* Hem yeni ({__meta,data}) hem eski (duz sozluk) bicimi kabul eder. */
  function readBackup(obj){
    if(!obj || typeof obj !== 'object') return { ok:false, error:'Dosya okunamadı.' };
    if(obj.__meta && obj.data){
      if(obj.__meta.schemaVersion > R.SCHEMA_VERSION){
        return { ok:false, error:'Bu yedek daha yeni bir sürümle alınmış (şema '+obj.__meta.schemaVersion+'). Önce uygulamayı güncelle.' };
      }
      return { ok:true, data:obj.data, meta:obj.__meta };
    }
    const keys = Object.keys(obj);
    const looksLegacy = keys.some(k => k.indexOf('/') > 0);
    if(!looksLegacy) return { ok:false, error:'Bu dosya bir Rota yedeği değil.' };
    return { ok:true, data:obj, meta:{ schemaVersion:1, legacy:true } };
  }

  async function importAll(obj){
    const parsed = readBackup(obj);
    if(!parsed.ok) throw new Error(parsed.error);
    localWrite(parsed.data);
    if(db){
      for(const k of Object.keys(parsed.data)){
        try{ await db.doc(k).set(parsed.data[k]); }
        catch(e){ health.cloud = 'error'; }
      }
    }
    return parsed.meta;
  }

  async function clear(){
    const all = localAll();
    try{ localStorage.removeItem(LOCAL_KEY); }catch(e){}
    if(db){
      for(const k of Object.keys(all)){
        try{ await db.doc(k).delete(); }catch(e){}
      }
    }
  }

  /* Kabaca kullanilan yerel alan (byte) */
  function localSize(){
    try{ return (localStorage.getItem(LOCAL_KEY) || '').length; }
    catch(e){ return 0; }
  }

  /* Tarayicilarin localStorage siniri genelde ~5 MB'tir (kaynak basina).
     Kesin deger okunamaz; bu yuzden 5 MB varsayilip doluluk yuzdesi tahmin edilir.
     %75 uzerinde kullaniciyi uyarmak icin `near` isaretlenir. */
  const LOCAL_QUOTA = 5 * 1024 * 1024;
  function localQuota(){
    const bytes = localSize();
    const pct = Math.min(100, Math.round(100*bytes/LOCAL_QUOTA));
    return { bytes, limit:LOCAL_QUOTA, pct, near:pct >= 75, full:pct >= 92 };
  }

  return {
    init, get, set, remove, list,
    exportAll, importAll, readBackup, clear, localSize, localQuota,
    health(){ return Object.assign({ mode }, health); },
    set onError(fn){ onError = fn; },
    get mode(){ return mode; },
  };
})();

R.Model = (function(){

  function normDay(doc){

  function weekStart(n){ return U.addDays(U.parse(R.PLAN.startISO), (n-1)*7); }

  function weekDates(n){

  }
  function weekOf(dateLike){

    return U.clamp(Math.floor(diff/7)+1, 1, R.PLAN.totalWeeks);
  }
  function currentWeek(){ return weekOf(U.today()); }
  function daysUntilStart(){ return U.diffDays(U.todayISO(), R.PLAN.startISO); }
  function programProgress(){
    const total = R.PLAN.totalWeeks * 7;
    const done = U.clamp(U.diffDays(R.PLAN.startISO, U.todayISO()), 0, total);

  /* Takvim 40 haftadan kisaysa mufredat orantili sikistirilir:

  function activePlan(){
    const plan = R.S.plan;
    if(plan && plan.weeks && plan.weeks.length) return plan;
    return null;
  }

  async function ensurePlan(force){
    const total = R.PLAN.totalWeeks;
    const cur = activePlan();
    const fresh = !cur
      || force
      || cur.meta.total !== total
      || cur.meta.capacityHoursPerWeek !== (Number(R.S.profile.capacityHoursPerWeek) || 21)
      || cur.meta.level !== R.Planner.level(R.S.profile.level).id;
    if(!fresh) return cur;

    const plan = R.Planner.generate(R.S.profile, total);
    R.S.plan = plan;
    await R.Store.set('plan/main', plan);
    return plan;
  }

  async function replanFrom(n){
    const plan = activePlan();
    if(!plan) return await ensurePlan(true);
    const next = R.Planner.replan(plan, R.S.profile, n || currentWeek());
    R.S.plan = next;
    await R.Store.set('plan/main', next);
    return next;
  }

  function planHealth(){
    const plan = activePlan();
    return plan ? R.Planner.health(plan, currentWeek()) : null;
  }

  function curriculumFor(n){
    const plan = activePlan();
    if(plan){
      const idx = U.clamp(n, 1, plan.weeks.length) - 1;
      return plan.weeks[idx];
    }
    const total = R.PLAN.totalWeeks;
    const full = R.PROGRAM.totalWeeks;
    if(total >= full) return R.CURRICULUM[U.clamp(n,1,full)-1];
    if(total <= 1) return R.CURRICULUM[full-1];
    const idx = Math.round((n-1) * (full-1) / (total-1));
    return R.CURRICULUM[U.clamp(idx, 0, full-1)];
  }

  function phaseOf(n){
    const plan = activePlan();
    if(plan){
      const w = curriculumFor(n);
      const total = plan.meta.total;
      const p = R.Planner.PHASES.find(x => x.key === w.phase);
      if(p){
        const from = R.Planner.PHASES.indexOf(p) === 0 ? 1
          : Math.max(1, Math.round(total * R.Planner.PHASES[R.Planner.PHASES.indexOf(p)-1].to) + 1);
        const to = Math.min(total, Math.round(total * p.to));
        return { key:p.key, label:p.label, theme:p.theme, weeks:[from, to] };
      }
    }
    return R.PHASES.find(p => n >= p.weeks[0] && n <= p.weeks[1]) || R.PHASES[0];
  }

  function defaultWeek(n){
    const c = curriculumFor(n);

  /* ---------- gun ---------- */
  function defaultDay(dateObj, week){

  function topicState(subjectId, topicId){

  async function setTopicState(subjectId, topicId, patch){

    doc.states = doc.states || {};
    const cur = doc.states[topicId] || { state:'not_started', first:null, firstAt:null, second:null, secondAt:null, note:'' };
    const next = Object.assign({}, cur, patch);

    // Kapanis kurali: ilk test >=75 ve 7 gun sonraki test >=70
    const rule = R.CLOSURE_RULE;
    if(next.first != null && next.second != null){
      next.state = (next.first >= rule.first && next.second >= rule.second) ? 'closed' : 'practicing';
    }else if(next.first != null){
      next.state = next.first >= rule.first ? 'provisional' : 'practicing';
    }
    if(patch.state) next.state = patch.state;   // acik secim onceliklidir

    doc.states[topicId] = next;
    R.S.topics[subjectId] = doc;

  /* ---------- deneme ---------- */
  function examNet(exam){

  }

  async function saveExam(exam){

  /* ---------- tekrar kartlari ---------- */
  function newCard(fields){
    return Object.assign({
      id:U.uid('c'),
      front:'', back:'', topic:'', subjectId:null,
      source:'manual', sourceRef:null,
      stage:0,
      dueAt:U.iso(U.addDays(U.today(), 1)),

    }, fields || {});
  }
  async function saveCard(card){
    const i = R.S.cards.findIndex(c => c.id === card.id);
    if(i >= 0) R.S.cards[i] = card; else R.S.cards.push(card);

  }
  async function deleteCard(id){
    R.S.cards = R.S.cards.filter(c => c.id !== id);
    await R.Store.remove('cards/'+id);
  }
  /* 1g / 3g / 1h / 1a — "hatirlamadim" donguyu +1 gunden baslatir,
     "zorlandim" bir sonraki araligi acmaz (ayni araligi tekrarlar). */
  function schedule(card, rating){
    let stage = card.stage || 0;
    if(rating === 'forgot') stage = 1;
    else if(rating === 'hard') stage = Math.max(1, stage);
    else stage = Math.min(R.SRS_INTERVALS.length, stage + 1);

    /* Gerçek aralık: son tekrardan bu yana geçen gün. Unutma eğrisi bunu okur;
       planlanan aralık ile fiilen beklenen süre çoğu zaman aynı değildir. */
    const gapDays = card.lastReviewedAt ? U.diffDays(card.lastReviewedAt, U.todayISO()) : null;
    const result = rating === 'remembered' ? 'remembered' : rating === 'hard' ? 'hard' : 'forgot';

    const days = R.SRS_INTERVALS[stage-1] || 1;
    card.stage = stage;
    card.dueAt = U.iso(U.addDays(U.today(), days));
    card.lastResult = rating;
    card.lastReviewedAt = U.todayISO();
    card.history = (card.history || [])
      .concat([{ at:U.todayISO(), rating, result, stage, gapDays }])
      .slice(-40);
    return card;
  }

  /* Kart öncelik sırası: due kartlar rastgele değil, riskli konudan başlar. */
  function prioritizedDue(dateISO){
    const due = R.Calc.dueCards(dateISO);
    const risk = {};
    R.Calc.riskRanking().forEach(r => { risk[r.subjectId + ':' + r.topicName] = r.score; });
    const today = dateISO || U.todayISO();
    return due.slice().sort((a, b) => {
      const lateA = U.diffDays(a.dueAt, today);
      const lateB = U.diffDays(b.dueAt, today);
      if(lateA !== lateB) return lateB - lateA;                   // en gecikmiş önce
      const ra = risk[(a.subjectId || '') + ':' + (a.topic || '')] || 0;
      const rb = risk[(b.subjectId || '') + ':' + (b.topic || '')] || 0;
      if(ra !== rb) return rb - ra;                               // riskli konu önce
      return (a.stage || 0) - (b.stage || 0);                     // yeni kart önce
    });
  }

  /* ---------- weekly review ---------- */

  async function startProtocol(protoId){

    const rec = {
      id:U.uid('p'), protoId, title:def.title,
      startedAt:U.todayISO(),

    R.S.protocols.push(rec);
    await R.Store.set('protocols/'+rec.id, rec);

  async function saveProtocol(rec){
    const i = R.S.protocols.findIndex(p => p.id === rec.id);
    if(i >= 0) R.S.protocols[i] = rec; else R.S.protocols.push(rec);
    await R.Store.set('protocols/'+rec.id, rec);

     Not bir derse ve konuya baglanir; oradan SRS kartina kopru kurulur.

  const YT_PATTERNS = [
    /youtube\.com\/watch\?[^#]*\bv=([\w-]{11})/i,
    /youtu\.be\/([\w-]{11})/i,
    /youtube\.com\/embed\/([\w-]{11})/i,
    /youtube\.com\/shorts\/([\w-]{11})/i,
    /youtube\.com\/live\/([\w-]{11})/i,
  ];

  /* URL'den saglayici ve video kimligi cikarilir; taninmazsa 'other' doner
     ve gomulu oynatici yerine dis baglanti gosterilir. */
  function parseVideoUrl(url){
    const raw = String(url || '').trim();
    if(!raw) return { provider:'other', videoId:null, url:'' };
    for(const re of YT_PATTERNS){
      const m = raw.match(re);
      if(m) return { provider:'youtube', videoId:m[1], url:raw };
    }
    return { provider:'other', videoId:null, url:raw };
  }

    const parsed = parseVideoUrl(patch && patch.url);
    return Object.assign({

      page:'',

  /* Zaman damgasi "mm:ss" veya "hh:mm:ss" olarak girilir, saniyeye cevrilir. */
  function parseTs(text){
    const raw = String(text == null ? '' : text).trim();
    if(!raw) return null;
    // Bos parca ("12:") Number ile 0'a duser; once bicimi dogrula.
    const chunks = raw.split(':');
    if(chunks.length > 3 || chunks.some(c => !/^\d+(\.\d+)?$/.test(c.trim()))) return null;
    const parts = chunks.map(c => Number(c));
    if(parts.some(x => !isFinite(x) || x < 0)) return null;
    if(parts.length === 1) return Math.round(parts[0]);
    if(parts.length === 2) return Math.round(parts[0]*60 + parts[1]);
    if(parts.length === 3) return Math.round(parts[0]*3600 + parts[1]*60 + parts[2]);
    return null;
  }
  function fmtTs(seconds){
    const s = Math.max(0, Math.round(Number(seconds) || 0));
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
    return (h ? h+':'+U.pad2(m) : String(m)) + ':' + U.pad2(sec);
  }
  /* Zaman damgali baglanti — video disaridan da acilabilsin. */
  function tsUrl(note, seconds){
    if(!note || note.provider !== 'youtube' || !note.videoId) return note ? note.url : '';
    return 'https://www.youtube.com/watch?v='+note.videoId+'&t='+Math.round(seconds || 0)+'s';
  }

     paralel bir tekrar sistemi kurulmaz. Kaynak 'note', referans not id'sidir.
     AI koc ayni kopruden gecer; boylece uretim yolu tek kalir. */
  const SEGMENT_TAGS = {
    not:   { label:'Not',   tone:'muted'  },
    kural: { label:'Kural', tone:'ok'     },
    ornek: { label:'Örnek', tone:'info'   },
    tuzak: { label:'Tuzak', tone:'warn'   },
    soru:  { label:'Soru',  tone:'danger' },
  };

  function noteTopicName(note){
    const s = R.SUBJECTS.find(x => x.id === note.subjectId);
    if(!s) return note.title || '';
    const t = s.topics.find(x => x.id === note.topicId);
    return t ? t.name : s.name;
  }

  function cardFromSegment(note, seg, patch){
    const tag = (SEGMENT_TAGS[seg.tag] || SEGMENT_TAGS.not).label.toLowerCase();
    const topic = noteTopicName(note);
    return newCard(Object.assign({
      front:(topic ? topic + ' — ' : '') + tag + ': bu ne diyordu?',
      back:seg.text,

  /* Transcript'i cümlelere bölüp zaman damgası önerir.
     Otomatik çekilmez — aday metni yapıştırır, sistem böler, aday onaylar.
     Süre bilinmiyorsa eşit dağıtılır; bilinen süre varsa ona oranlanır. */
  function splitTranscript(text, totalSeconds){
    const raw = String(text || '').replace(/\s+/g, ' ').trim();
    if(!raw) return [];

    /* Zaman damgası zaten varsa ([12:30] ya da 12:30) onu kullan. */
    const stamped = raw.match(/(\[?\d{1,2}:\d{2}(?::\d{2})?\]?)/g);
    if(stamped && stamped.length >= 3){
      const parts = raw.split(/\[?\d{1,2}:\d{2}(?::\d{2})?\]?/).slice(1);
      return stamped.map((ts, i) => ({
        ts:parseTs(ts.replace(/[\[\]]/g, '')) || 0,
        text:(parts[i] || '').trim().slice(0, 240),
        tag:'not',
      })).filter(x => x.text.length > 8);
    }

    /* Damga yoksa cümlelere böl, süreyi orantılı dağıt. */
    const sentences = raw.split(/(?<=[.!?…])\s+/)
      .map(x => x.trim())
      .filter(x => x.length > 25);
    if(!sentences.length) return [];

    const total = Number(totalSeconds) || sentences.length * 25;
    const chars = sentences.reduce((a, x) => a + x.length, 0) || 1;
    let acc = 0;
    return sentences.slice(0, 60).map(x => {
      const at = Math.round(total * acc / chars);
      acc += x.length;
      return { ts:at, text:x.slice(0, 240), tag:guessTag(x) };
    });
  }

  /* Cümlenin biçiminden etiket tahmini — aday değiştirebilir. */
  function guessTag(text){
    const t = String(text).toLowerCase();
    if(/dikkat|tuzak|karıştır|sanılır|yanılg/.test(t)) return 'tuzak';
    if(/örneğin|örnek|mesela/.test(t)) return 'ornek';
    if(/kural|formül|tanım|eşittir|olur|gerekir/.test(t)) return 'kural';
    if(/\?$/.test(text.trim())) return 'soru';
    return 'not';
  }

  /* Not kalitesi: geri çağırma üretmeyen not, kart olarak da işe yaramaz. */
  function noteQuality(text){
    const t = String(text || '');
    const issues = R.NOTE_QUALITY.rules.filter(r => r.test(t));
    return {
      ok:issues.length === 0,
      issues:issues.map(r => ({ id:r.id, why:r.why })),
      length:t.trim().length,
    };
  }

  /* ---------- takvim istisnalari ----------
     Tatil, okul sinavi ya da yogun gun: plan bu gunleri gormezden gelmez,
     yuku komsu gunlere dagitir. load 0..1 = o gun calisilabilecek oran. */
  const CALENDAR_KINDS = {
    tatil:      { label:'Tatil / izin',   load:0,    tone:'muted' },
    okulSinavi: { label:'Okul sınavı',    load:0.35, tone:'warn'  },
    yogun:      { label:'Yoğun gün',      load:0.5,  tone:'warn'  },
    ekstra:     { label:'Ekstra çalışma', load:1.5,  tone:'ok'    },
  };

  async function saveCalendar(rec){
    const doc = Object.assign({ id:U.uid('k'), kind:'tatil', note:'' }, rec);
    if(doc.load == null) doc.load = (CALENDAR_KINDS[doc.kind] || CALENDAR_KINDS.tatil).load;
    const i = R.S.calendar.findIndex(x => x.id === doc.id);
    if(i >= 0) R.S.calendar[i] = doc; else R.S.calendar.push(doc);
    R.S.calendar.sort((a, b) => (a.from || '').localeCompare(b.from || ''));
    await R.Store.set('calendar/' + doc.id, doc);
    return doc;
  }
  async function deleteCalendar(id){
    R.S.calendar = R.S.calendar.filter(x => x.id !== id);
    await R.Store.remove('calendar/' + id);
  }
  /* Bir gunun calisma carpani: istisna yoksa 1. */
  function dayLoad(dateISO){
    const iso = dateISO || U.todayISO();
    const hit = R.S.calendar.find(x => iso >= x.from && iso <= (x.to || x.from));
    return hit ? { load:hit.load, kind:hit.kind, note:hit.note, id:hit.id } : { load:1, kind:null, note:'', id:null };
  }
  /* Haftanin kapasite carpani — plan ureteci ve otomasyon okur. */
  function weekLoad(n){
    const dates = weekDates(n).map(U.iso);
    const sum = dates.reduce((a, iso) => a + dayLoad(iso).load, 0);
    return U.round(sum / dates.length, 2);
  }
  function calendarInWeek(n){
    const from = U.iso(weekStart(n)), to = U.iso(weekEnd(n));
    return R.S.calendar.filter(x => (x.to || x.from) >= from && x.from <= to);
  }

  /* ---------- kotu gun protokolu ----------
     Sistem cokmesin diye tek dugmelik inis: hedef minimum gune duser,
     kalan bloklar "kotu gun" nedeniyle atlanir, seri korunur. */
  async function badDay(dateISO){
    const iso = dateISO || U.todayISO();
    const day = await ensureDay(iso);
    day.badDay = true;
    day.paragraphTarget = Math.min(day.paragraphTarget, R.ROUTINES.minimumDay.paragraphs);
    day.problemTarget = Math.min(day.problemTarget, R.ROUTINES.minimumDay.paragraphs);
    day.blocks.forEach(b => {
      if(b.slot === 'Dinlenme') return;
      if(b.status === 'pending'){
        b.status = 'skipped';
        b.skipReason = R.BAD_DAY.reason;
      }
    });
    await saveDay(iso);
    return day;
  }
  async function undoBadDay(dateISO){
    const iso = dateISO || U.todayISO();
    const day = R.S.days[iso];
    if(!day) return null;
    day.badDay = false;
    day.blocks.forEach(b => {
      if(b.skipReason === R.BAD_DAY.reason && b.status === 'skipped'){
        b.status = 'pending';
        b.skipReason = null;
      }
    });
    await saveDay(iso);
    return day;
  }

  async function migrate(){
    const from = (R.S.meta && R.S.meta.schemaVersion) || 1;
    if(from >= R.SCHEMA_VERSION) return { from, to:R.SCHEMA_VERSION, changed:false };

    // v2 → v3: ogrenme akisi varliklari (videoNotes, activities, mood, breaks).
    // v3 → v4: takvim istisnalari, sureli oturumlar, profiller, kotu gun alanlari.
    // Goc yikici degildir; yeni koleksiyonlar bos baslar, ilk yazmada olusur.
    R.S.meta = R.S.meta || {};
    R.S.meta.schemaVersion = R.SCHEMA_VERSION;
    R.S.meta.migratedAt = new Date().toISOString();
    await R.Store.set('meta/backup', R.S.meta);
    return { from, to:R.SCHEMA_VERSION, changed:true };
  }

  async function loadAll(){
    await R.Store.init();

    let profile = await R.Store.get('profile/main');
    if(!profile){ profile = defaultProfile(); await R.Store.set('profile/main', profile); }
    R.S.profile = profile;

    R.S.meta = (await R.Store.get('meta/backup')) || { lastBackupAt:null, schemaVersion:R.SCHEMA_VERSION };

    const [weeks, days, exams, errors, cards, reviews, decisions, protocols, prefs,
           videoNotes, activities, mood, breaks, plan, calendar, sessions, profiles] = await Promise.all([
      R.Store.list('weeks'),
      R.Store.list('days'),
      R.Store.list('exams'),
      R.Store.list('errors'),
      R.Store.list('cards'),
      R.Store.list('reviews'),
      R.Store.list('decisions'),
      R.Store.list('protocols'),
      R.Store.get('prefs/main'),
      R.Store.list('videoNotes'),
      R.Store.list('activities'),
      R.Store.list('mood'),
      R.Store.list('breaks'),
      R.Store.get('plan/main'),
      R.Store.list('calendar'),
      R.Store.list('sessions'),
      R.Store.list('profiles'),
    ]);

    weeks.forEach(w => { R.S.weeks[w.id] = normWeek(w); });
    days.forEach(d => { R.S.days[d.id] = normDay(d); });
    R.S.exams = exams.map(normExam);
    R.S.errors = errors;
    R.S.cards = cards.map(normCard);
    reviews.forEach(r => { R.S.reviews[r.id] = r; });
    decisions.forEach(d => { R.S.decisions[d.id] = d; });
    R.S.protocols = protocols.map(normProtocol);
    R.S.prefs = (prefs && Array.isArray(prefs.rows) && prefs.rows.length === 24) ? prefs : defaultPrefs();

    R.S.videoNotes = videoNotes.map(normVideoNote)
      .sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    R.S.activities = activities;
    R.S.mood = {};
    mood.forEach(m => { R.S.mood[m.id] = normMood(m); });
    R.S.breaks = breaks.map(normBreak)
      .sort((a, b) => (b.at || '').localeCompare(a.at || ''));

    R.S.plan = (plan && plan.weeks && plan.weeks.length) ? plan : null;
    R.S.calendar = calendar.map(normCalendar).sort((a, b) => (a.from || '').localeCompare(b.from || ''));
    R.S.sessions = sessions.map(normSession).sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    R.S.profiles = profiles;

    await migrate();

    for(const s of R.SUBJECTS){ await ensureTopics(s.id); }

    if(R.S.profile.setupDone) await ensurePlan();

    const cw = currentWeek();
    await ensureWeek(cw);
    await ensureDay(U.today());
    R.S.ui.weekView = cw;
    R.S.ready = true;
  }
