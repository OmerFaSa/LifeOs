          + ' L ' + pts[0][0].toFixed(1) + ' ' + (h - padB) + ' Z"/>';
      }
      svg += '<path class="line' + (s2.accent ? ' line--accent' : '') + '" d="' + d + '"/>';

      pts.forEach((p2, i) => {
        const sonNokta = i === pts.length - 1;
        const etiket = (o.labels && o.labels[p2[3]]) ? o.labels[p2[3]] + ' · ' : '';
        svg += '<circle class="pt' + (s2.accent ? ' pt--accent' : '')
          + (sonNokta ? ' pt--last' : '') + '" cx="' + p2[0].toFixed(1) + '" cy="'
          + p2[1].toFixed(1) + '" r="' + (sonNokta ? 5 : 3) + '">'
          + '<title>' + U.esc(etiket + U.fmtNum(p2[2]) + (o.unit ? ' ' + o.unit : ''))
          + '</title></circle>';
      });

      /* Son değer doğrudan yazılır: okunacak tek sayı odur. */
      if(o.endLabel !== false){
        const sp = pts[pts.length - 1];
        svg += '<text class="endlbl" x="' + (sp[0] + 10).toFixed(1) + '" y="'
          + (sp[1] + 4).toFixed(1) + '">' + U.esc(U.fmtNum(sp[2])) + '</text>';
        if(o.unit){
          svg += '<text class="endunit" x="' + (sp[0] + 10).toFixed(1) + '" y="'
            + (sp[1] + 17).toFixed(1) + '">' + U.esc(o.unit) + '</text>';
        }
      }
    });

    if(o.labels){
      o.labels.forEach((lb, i) => {
        if(n > 8 && i % 2) return;
        svg += '<text x="' + X(i) + '" y="' + (h - 8) + '" text-anchor="middle">'
          + U.esc(lb) + '</text>';
      });
    }
    svg += '</svg>';
    return svg;
  }
  function barChart(rows, opts){
    const o = opts || {};
    const w = 640, h = o.height || 150, padL = 30, padR = 10, padT = 12, padB = 26;
    if(!rows.length) return '<p class="small dim">Veri yok.</p>';
    const top = o.max || 100;
    const bw = (w-padL-padR) / rows.length;
    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" role="img">';
    [0, 0.5, 1].forEach(f => {
      const y = padT + (h-padT-padB)*f;
      svg += '<line class="axis" x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'"/>';
      svg += '<text x="'+(padL-6)+'" y="'+(y+3)+'" text-anchor="end">'+Math.round(top*(1-f))+'</text>';
    });
    if(o.targetLine != null){
      const y = padT + (h-padT-padB)*(1 - o.targetLine/top);
      svg += '<line x1="'+padL+'" x2="'+(w-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--accent)" stroke-width="1.4" stroke-dasharray="5 4"/>';
    }
    rows.forEach((r,i) => {
      const v = r.value == null ? 0 : U.clamp(r.value, 0, top);
      const bh = (h-padT-padB) * (v/top);
      const x = padL + bw*i + bw*0.18;
      const y = h-padB-bh;
      const cls = r.value == null ? 'barfill--muted' : (r.value >= (o.goodAt||85) ? 'barfill' : 'barfill--muted');
      svg += '<rect class="'+cls+'" x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+(bw*0.64).toFixed(1)+'" height="'+Math.max(1,bh).toFixed(1)+'" rx="3"'
        + (r.value != null && r.value < (o.goodAt||85) ? ' fill="var(--accent)"' : '') + '/>';
      svg += '<text x="'+(padL+bw*i+bw/2).toFixed(1)+'" y="'+(h-8)+'" text-anchor="middle">'+U.esc(r.label)+'</text>';
    });
    svg += '</svg>';
    return svg;
  }

  /* Referans araligi cubugu — bir tahlil degerinin nerede durdugunu gosterir.
     Uc bolge vardir: laboratuvar referans araligi (genis, notr), hedef bant
     (dar, birincil renk) ve degerin kendisi (isaret). Renk tek basina anlam
     tasimaz: isaretin yaninda daima sayi ve durum rozeti bulunur.

       ref     [low, high]  laboratuvarin referans araligi
       optimal [low, high]  kisisel hedef bant (varsa)
       value   olculen deger  */
  /* `opts.bare` verilirse yalnizca cubuk cizilir, altindaki sayi satiri
     cizilmez. Uzun bir listede her satirin altinda "30 · referans · hedef
     80-250 · 400 ng/mL" yazmak satiri okunmaz hale getiriyordu; o ayrinti
     satira tiklayinca acilan kagitta zaten tam haliyle duruyor. */
  function rangeBar(value, ref, optimal, unit, opts){
    if(!ref || ref.length !== 2) return '';
    const lo = Number(ref[0]), hi = Number(ref[1]);
    const span = hi - lo;
    if(!isFinite(span) || span <= 0) return '';
    /* Eksen referans araligindan %60 daha genis cizilir ki disari tasan
       degerler de cubugun icinde kalsin ve ne kadar tastigi gorunsun. */
    const axisLo = lo - span * 0.6;
    const axisHi = hi + span * 0.6;
    const p = v => U.clamp(100 * (v - axisLo) / (axisHi - axisLo), 0, 100);
    const o = opts || {};

    /* Cetvel bir ilerleme cubugu degil, bir OLCU ALETIDIR: dolu bir kutu
       "ne kadar tamamlandi" der; burada sorulan o degil, "deger nerede
       duruyor". Bu yuzden zemin bos, referans araligi ince bir bant,
       hedef bandi bir alt cizgi, deger ise tek bir hassas ibredir. */
    let out = '<div class="scale' + (o.bare ? ' scale--bare' : '') + '">';
    out += '<div class="scale__axis">';
    out += '<div class="scale__ref" style="left:' + p(lo).toFixed(1) + '%;width:'
      + (p(hi) - p(lo)).toFixed(1) + '%"></div>';
    if(optimal && optimal.length === 2){
      out += '<div class="scale__opt" style="left:' + p(optimal[0]).toFixed(1) + '%;width:'
        + Math.max(1.5, p(optimal[1]) - p(optimal[0])).toFixed(1) + '%"></div>';
    }
    /* Referans araliginin iki ucunda birer centik: aralik nerede baslayip
       nerede bittigi cizgiyle de okunur, yalniz renkle degil. */
    out += '<i class="scale__tick" style="left:' + p(lo).toFixed(1) + '%"></i>';
    out += '<i class="scale__tick" style="left:' + p(hi).toFixed(1) + '%"></i>';
    if(value != null && isFinite(value)){
      const outside = value < lo || value > hi;
      out += '<div class="scale__mark' + (outside ? ' is-out' : '') + '" style="left:'
        + p(value).toFixed(1) + '%"></div>';
    }
    out += '</div>';
    if(o.bare){ out += '</div>'; return out; }
    out += '<div class="scale__legend">'
      + '<span class="scale__end num">' + U.fmtNum(lo) + '</span>'
      + '<span class="scale__mid">referans'
      + (optimal ? ' <b>&middot; hedef ' + U.fmtNum(optimal[0]) + '&ndash;' + U.fmtNum(optimal[1]) + '</b>' : '')
      + '</span>'
      + '<span class="scale__end num">' + U.fmtNum(hi) + (unit ? ' ' + esc(unit) : '') + '</span>'
      + '</div>';
    out += '</div>';
    return out;
  }

  /* Makro dagilimi — protein/yag/karbonhidrat oranini tek seritte verir.
     Segment renkleri kimliktir (hangi makro), durum degil.

     Girdi KALORI cinsindendir ama efsanede YUZDE yazar: "Protein 384" gibi
     bir sayi okuyucuya hicbir sey soylemez, "Protein %28" soyler. */
  function macroSplit(macros){
    const p = Math.max(0, macros.protein || 0);
    const f = Math.max(0, macros.fat || 0);
    const c = Math.max(0, macros.carb || 0);
    const total = p + f + c;
    if(!total) return '<p class="small dim">Makro dağılımı için öğün gerekir.</p>';
    const seg = (label, v, color) => ({ label:label + ' %' + Math.round(100 * v / total), value:v, color });
    return stackBar([
      seg('Protein', p, 'var(--macro-protein)'),
      seg('Yağ', f, 'var(--macro-fat)'),
      seg('Karbonhidrat', c, 'var(--macro-carb)'),
    ]);
  }

  function donut(pct, label, size){
    const s = size || 92, r = (s/2) - 8, c = 2*Math.PI*r;
    const off = c * (1 - U.clamp(pct, 0, 100)/100);
    return '<div class="donut" style="width:'+s+'px;height:'+s+'px">'
      + '<svg viewBox="0 0 '+s+' '+s+'" width="'+s+'" height="'+s+'" role="img" aria-label="%'+Math.round(pct)+'">'
      + '<circle cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="var(--surface-3)" stroke-width="8"/>'
      + '<circle class="donut__arc" cx="'+s/2+'" cy="'+s/2+'" r="'+r+'" fill="none" stroke="var(--primary)" stroke-width="8" stroke-linecap="round"'
      + ' stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'" transform="rotate(-90 '+s/2+' '+s/2+')"/>'
      + '</svg>'
      + '<div class="donut__center"><div>'
      + '<div class="num donut__pct">%'+Math.round(pct)+'</div>'
      + (label ? '<div class="tiny dim">'+U.esc(label)+'</div>' : '')
      + '</div></div></div>';
  }

  function sparkline(values, opts){
    const o = opts || {};
    const vals = values.filter(v => v != null);
    if(vals.length < 2) return '';
    const w = 100, h = 26;
    const min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    const X = i => (w) * (i/(values.length-1));
    const Y = v => h - 3 - (h-6) * ((v-min)/((max-min)||1));
    const pts = values.map((v,i) => v == null ? null : [X(i), Y(v)]).filter(Boolean);
    /* Kivilcim cizgisi kutusunu doldurmak icin gerilir; `non-scaling-stroke`
       olmadan cizgi yatayda incelip dikeyde kalinlasiyordu. */
    return '<svg class="chart" viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" style="height:26px">'
      + '<path vector-effect="non-scaling-stroke" class="line'+(o.accent?' line--accent':'')+'" style="stroke-width:1.6" d="M'+pts.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' L ')+'"/></svg>';
  }

  function stackBar(segments){
    const total = U.sum(segments.map(s => s.value));
    if(!total) return '<p class="small dim">Veri yok.</p>';
    return '<div class="stackbar">'
      + segments.filter(s => s.value).map(s => '<div class="stackbar__seg" style="width:'+(100*s.value/total)+'%;background:'+s.color+'" title="'+U.esc(s.label)+'"></div>').join('')
      + '</div>'
      + '<div class="legend">' + segments.map(s => '<span class="legend__item"><span class="legend__swatch" style="background:'+s.color+'"></span>'+U.esc(s.label)+' '+s.value+'</span>').join('') + '</div>';
  }

  /* 40 hafta x 7 gun calisma yogunlugu — hucre degeri 0..1 */
  function heatmap(cells, opts){
    const o = opts || {};
    const cols = o.cols || 40, rows = 7;
    const cell = 11, gap = 2, padL = 26, padT = 14;
    const w = padL + cols*(cell+gap), h = padT + rows*(cell+gap) + 14;
    const dayLabels = ['Pzt','','Çar','','Cum','','Paz'];

    let svg = '<svg class="chart" viewBox="0 0 '+w+' '+h+'" style="min-width:'+Math.min(w, 760)+'px">';
    for(let r = 0; r < rows; r++){
      if(dayLabels[r]) svg += '<text x="0" y="'+(padT + r*(cell+gap) + cell - 1)+'" style="font-size:8.5px">'+dayLabels[r]+'</text>';
    }
    for(let c = 0; c < cols; c++){
      for(let r = 0; r < rows; r++){
        const item = cells[c*rows + r];
        const v = item ? item.value : null;
        const x = padL + c*(cell+gap), y = padT + r*(cell+gap);
        let fill = 'var(--surface-3)', op = '1';
        if(v != null && v > 0){ fill = 'var(--primary)'; op = String(0.25 + 0.75*Math.min(1, v)); }
        else if(item && item.future){ fill = 'var(--surface-2)'; }
        else if(item && item.missed){ fill = 'var(--danger)'; op = '0.22'; }
        svg += '<rect x="'+x+'" y="'+y+'" width="'+cell+'" height="'+cell+'" rx="2.5" fill="'+fill+'" opacity="'+op+'">'
          + (item ? '<title>'+esc(item.label)+'</title>' : '') + '</rect>';
      }
    }
    (o.monthTicks || []).forEach(t => {
      svg += '<text x="'+(padL + t.col*(cell+gap))+'" y="'+(padT-4)+'" style="font-size:8.5px">'+esc(t.label)+'</text>';
    });
    svg += '</svg>';
    return '<div style="overflow-x:auto">'+svg+'</div>';
  }
  function esc(s){ return ESP.U.esc(s); }

  function legend(items){
    return '<div class="legend">'+items.map(i => '<span class="legend__item"><span class="legend__swatch" style="background:'+i.color+'"></span>'+U.esc(i.label)+'</span>').join('')+'</div>';
  }

  /* ---------- ipucu (ⓘ) ve kenar bilgi rayi ---------- */

  /* Baslik yaninda kucuk bir ⓘ; tiklayinca balon acar. */
  function hint(key){
    const h = ESP.HINTS[key];
    if(!h) return '';
    return '<button class="hint" data-act="hint" data-hint="'+key+'" aria-label="'+U.esc(h.t)+' hakkında bilgi">i</button>';
  }

  /* Bolum kenarinda duran kisa aciklama kartlari — uzun metin yerine. */
  /* Ekran acıklamaları. Eskiden her ekranın altında acık duran bir metin
     duvariydi ve sayfanin sonunu bozuyordu; artik katlanir bir panel:
     varsayilan kapali, tek dokunusla acilir, tercih oturumda hatirlanir. */
  function rail(keys, title){
    const list = keys.filter(k => ESP.HINTS[k]);
    if(!list.length) return '';
    const open = !!(ESP.S.ui && ESP.S.ui.railOpen);
    const label = title === false ? 'Bu ekran nasıl okunur' : (title || 'Bu ekran nasıl okunur');

    const cards = list.map(k => {
      const h = ESP.HINTS[k];
      return '<button class="railcard" data-act="hint" data-hint="'+k+'">'
        + '<span class="railcard__t">'+U.esc(h.t)+'</span>'
        + '<span class="railcard__b">'+U.esc(h.b)+'</span>'
        + '</button>';
    }).join('');

    return '<section class="rail'+(open ? ' is-open' : '')+'">'
      + '<button class="rail__toggle" data-act="rail-toggle" aria-expanded="'+(open ? 'true' : 'false')+'">'
      +   icon('guide', 'rail__icon')
      +   '<span class="rail__label">'+U.esc(label)+'</span>'
      +   '<span class="rail__count">'+list.length+'</span>'
      +   '<span class="rail__chev">'+icon('down')+'</span>'
      + '</button>'
      + '<div class="rail__body"'+(open ? '' : ' hidden')+'>'+cards+'</div>'
      + '</section>';
  }

  function openHint(key, anchorEl){
    closeHint();
    const h = ESP.HINTS[key];
    if(!h) return;
    const el = document.createElement('div');
    el.className = 'popover';
    el.id = 'popover';
    el.setAttribute('role','dialog');
    el.innerHTML = '<div class="popover__title">'+U.esc(h.t)+'</div>'
      + '<div class="popover__body">'+U.esc(h.b)+'</div>'
      + (h.more ? '<div class="popover__more">'+U.esc(h.more)+'</div>' : '');
    document.getElementById('overlay-root').appendChild(el);

    const r = anchorEl.getBoundingClientRect();
    const w = el.offsetWidth, hgt = el.offsetHeight;
    let left = r.left + r.width/2 - w/2;
    left = Math.max(12, Math.min(left, window.innerWidth - w - 12));
    let top = r.bottom + 8;
    if(top + hgt > window.innerHeight - 12) top = Math.max(12, r.top - hgt - 8);
    el.style.left = left+'px';
    el.style.top = top+'px';
  }
  function closeHint(){
    const el = document.getElementById('popover');
    if(el) el.remove();
  }
  function isHintOpen(){ return !!document.getElementById('popover'); }

  /* ---------- alt sayfa ---------- */
  /* Alt sayfa ODAGI HAPSEDER. Once etmiyordu: Tab ile arkadaki sayfaya
     cikilabiliyor, gorunmeyen bir dugmeye basilabiliyordu — bir kipli
     pencere icin bu bir hata degil, bir yaniltmadir. Kapaninca odak
     acan ogeye geri doner ki klavyeyle calisan kullanici yerini
     kaybetmesin. */
  const ODAKLANABILIR = 'a[href], button:not([disabled]), input:not([disabled]),'
    + ' select:not([disabled]), textarea:not([disabled]), [tabindex]:not([tabindex="-1"])';

  let sheetOpener = null;
  let sheetScroll = '';

  function sheet(opts){
    closeSheet();
    sheetOpener = document.activeElement;
    const root = document.getElementById('overlay-root');
    const el = document.createElement('div');
    el.className = 'overlay';
    el.id = 'sheet';
    const { html, when } = ESP.h;
    el.innerHTML = String(html`
      <div class="${opts.wide ? 'sheet sheet--wide' : 'sheet'}" role="dialog" aria-modal="true" aria-label="${opts.title}">
        <div class="sheet__head">
          <div><h3>${opts.title}</h3>${when(opts.subtitle, () => html`<p>${opts.subtitle}</p>`)}</div>
          ${ESP.C.IconButton({ icon:'close', plain:true, aria:'Kapat', act:'sheet-close' })}
        </div>
        <div class="sheet__body">
          ${when(opts.note, () => html`<p class="sheet__note">${opts.note}</p>`)}
          ${raw(opts.body)}</div>
        ${when(opts.footer, () => html`<div class="sheet__foot">${raw(opts.footer)}</div>`)}
      </div>`);
    el.addEventListener('mousedown', e => { if(e.target === el) closeSheet(); });

    /* Tab dongusu alt sayfanin icinde kalir. */
    el.addEventListener('keydown', e => {
      if(e.key !== 'Tab') return;
      const list = Array.prototype.filter.call(
        el.querySelectorAll(ODAKLANABILIR), n => n.offsetParent !== null);
      if(!list.length) return;
      const ilk = list[0], son = list[list.length - 1];
      if(e.shiftKey && document.activeElement === ilk){ e.preventDefault(); son.focus(); }
      else if(!e.shiftKey && document.activeElement === son){ e.preventDefault(); ilk.focus(); }
    });

    root.appendChild(el);

    /* Arkadaki sayfa KAYMAZ: alt sayfa acikken tekerlek arkayi
       kaydiriyordu ve kapaninca baska bir yerde kaliniyordu. */
    sheetScroll = document.body.style.overflow;
    document.body.style.overflow = 'hidden';

    /* ...ve arkadaki sayfa OKUNMAZ. Odagi hapsetmek yalnizca klavyeyi
       durdurur; ekran okuyucunun sanal imleci alt sayfayi hic gormeden
       arkadaki tabloyu okumaya devam edebiliyordu. `inert` ikisini
       birden keser: odak da, erisilebilirlik agaci da. */
    const kabuk = document.querySelector('.site');
    if(kabuk){ kabuk.setAttribute('inert', ''); kabuk.setAttribute('aria-hidden', 'true'); }

    const first = el.querySelector('input, textarea, select')
      || el.querySelector(ODAKLANABILIR);
    if(first && !opts.noFocus) setTimeout(()=>first.focus(), 40);
  }
  function closeSheet(){
    const el = document.getElementById('sheet');
    if(!el) return;
    el.remove();
    document.body.style.overflow = sheetScroll;
    const kabuk = document.querySelector('.site');
    if(kabuk){ kabuk.removeAttribute('inert'); kabuk.removeAttribute('aria-hidden'); }
    if(sheetOpener && document.contains(sheetOpener)){
      try{ sheetOpener.focus(); }catch(e){ /* odak geri verilemedi */ }
    }
    sheetOpener = null;
  }
  function isSheetOpen(){ return !!document.getElementById('sheet'); }

  /* Bildirim. `undo` verilirse bildirimin icinde bir "geri al" dugmesi
     cikar ve bildirim daha uzun durur: kullanicinin okuyup karar vermesi
     icin 1,5 saniye yetmez. */
  /* ---------------------------------------------------------- bekleme

     Model cagrisi saniyeler suruyor ve geri bildirim tek bir bildirimdi:
     iki saniye sonra kayboluyor, kullanici donduğunu saniyordu.

     Bu serit isin SONUNA KADAR durur ve ne beklendigini yazar. Sayfanin
     en ustunde, icerigin akisini bozmadan. */

  let busyCount = 0;

  function busy(label, hint){
    busyCount++;
    const root = document.getElementById('overlay-root');
    let el = document.getElementById('busybar');
    if(!el){
      el = document.createElement('div');
      el.id = 'busybar';
      el.className = 'busybar';
      el.setAttribute('role', 'status');
      el.setAttribute('aria-live', 'polite');
      root.appendChild(el);
    }
    el.innerHTML = '<span class="busybar__spin" aria-hidden="true"></span>'
      + '<span class="busybar__t">' + ESP.U.esc(label || 'İşleniyor…') + '</span>'
      + (hint ? '<span class="busybar__hint">' + ESP.U.esc(hint) + '</span>' : '');
    return el;
  }

  /* Ic ice cagrilarda erken kapanmasin: sayac sifirlaninca kalkar. */
  function idle(){
    busyCount = Math.max(0, busyCount - 1);
    if(busyCount) return;
    const el = document.getElementById('busybar');
    if(el) el.remove();
  }

  /* Bir isi serit acikken kosturur ve her durumda kapatir. */
  async function withBusy(label, hint, fn){
    busy(label, hint);
    try{ return await fn(); }
    finally{ idle(); }
  }

  function toast(text, opts){
    const o = opts || {};
    const root = document.getElementById('toast-root');
    const el = document.createElement('div');
    el.className = 'toast' + (o.undo ? ' toast--undo' : '');
    const span = document.createElement('span');
    span.textContent = text;
    el.appendChild(span);
    if(o.undo){
      const btn = document.createElement('button');
      btn.className = 'toast__undo';
      btn.textContent = 'Geri al';
      btn.setAttribute('data-act', 'undo');
      btn.addEventListener('click', () => { el.remove(); });
      el.appendChild(btn);
    }
    root.appendChild(el);
    const life = o.undo ? 6000 : 1500;
    setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity .25s'; }, life);
    setTimeout(() => el.remove(), life + 300);
    return el;
  }

  function confirmSheet(title, message, onConfirm, danger){
    sheet({
      title,
      body:String(ESP.h.html`<p>${message}</p>`),
      footer:String(ESP.h.html`${ESP.C.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${ESP.C.Button({ label:'Evet, devam et', tone:danger ? 'danger' : 'primary', act:'confirm-yes' })}`),
      noFocus:true,
    });
    ESP.UI._confirm = onConfirm;
  }

  return {
    icon, trend, motif, gauge,
    lineChart, barChart, donut, sparkline, stackBar, heatmap, legend,
    rangeBar, macroSplit,
    hint, rail, openHint, closeHint, isHintOpen,
    sheet, closeSheet, isSheetOpen, toast, confirmSheet,
    busy, idle, withBusy,
  };
})();

/* ==== js/core/components.js ==== */
/* Deklaratif bilesen seti.

   Her bilesen tek ve net bir API'ye sahiptir; varyantlar acik "modifier"
   alanlariyla gelir (ornegin tone:'ok'). Hepsi h.raw doner, ic ice gecebilir.

   Kullanim:
     C.Card({ title:'Deneme hacmi', sub:'Plan / gerçekleşen', body: C.Table(...) })
     C.Button({ label:'Kaydet', tone:'primary', act:'save-exam' })

   Not: eski ESP.UI yardimcilari bu setin ustune ince sarmalayici olarak durur;
   ekranlar kademeli olarak C.* API'sine gecirilir. */

window.ESP = window.ESP || {};

ESP.C = (function(){
  const { html, raw, when, cls, attrs, map } = ESP.h;
  const icon = name => raw(ESP.UI.icon(name));

  /* ---------- yapisal ---------- */

  /* Card: tek kart stili. Vurgu icin renkli kenarlik yerine rozet kullanilir. */
  /* Defter kipi.

     `Ledger` bir islev alirsa, o islev calisirken bu bayrak aciktir ve
     `Card` kendini KUTU olarak degil DEFTER SATIRI olarak cizer. Boylece
     ekranlar tek satirlik bir degisiklikle defter duzenine gecer ve iki
     ayri bilesen sozlugu tasimak gerekmez.

     Bayrak yalnizca senkron cagri boyunca aciktir; render sonrasi
     kapanir. */
  let ledgerMode = false;

  function Card(o){
    /* `box:true` defter kipinden KACISTIR. Bir kartin govdesinin icinde
       duran kartlar (ofis masalari, ogun kartlari) defter satirina
       donusmemeli: onlar okunacak bir bolum degil, yan yana dizilen
       nesnelerdir. */
    if(ledgerMode && !o.box){
      const meta = [o.sub, o.badge ? null : null].filter(Boolean).join(' · ');
      return Entry({
        label:o.title, hint:o.hint,
        meta:o.sub || null,
        note:o.note || null,
        wide:o.wide,
        action:o.actions || o.foot || null,
        body:html`${o.body}${when(o.badge && o.foot, () => html`<div class="mt-8">${o.badge}</div>`)}`,
      });
    }
    const head = (o.title || o.sub || o.badge || o.actions) ? html`
      <div class="card__head">
        <div>
          ${when(o.title, () => html`<h3>${o.title}${when(o.hint, () => raw(ESP.UI.hint(o.hint)))}</h3>`)}
          ${when(o.sub, () => html`<p>${o.sub}</p>`)}
        </div>
        ${when(o.badge, o.badge)}
        ${when(o.actions, o.actions)}
      </div>` : '';
    return html`
      <section class="${cls('card', o.flat && 'card--flat', o.pad === 'sm' && 'card--pad-sm', o.class)}"
               ${when(o.id, () => attrs({ id:o.id }))}>
        ${head}
        ${o.body}
        ${when(o.foot, () => html`<div class="card__foot">${o.foot}</div>`)}
      </section>`;
  }

  /* Katlanir kart: uzun referans metinleri varsayilan olarak kapali tutar. */
  function Collapsible(o){
    /* Defter kipinde katlanir bolum de kutu cizmez: satirin govdesine
       cerceve olmadan yerlesir. */
    if(ledgerMode && !o.box){
      return Entry({
        label:o.title, meta:o.meta || null,
        body:html`<div class="collapse--bare">
          <button class="collapse__btn" data-act="${o.act}" ${attrs(o.data || {})}
                  aria-expanded="${o.open ? 'true' : 'false'}">
            <span class="row-sm"><b class="collapse__title">${o.title}</b>
              ${when(o.meta, () => html`<span class="tiny dim">${o.meta}</span>`)}</span>
            <span class="${cls('collapse__chev', o.open && 'is-open')}">${icon('down')}</span>
          </button>
          ${when(o.open, o.body)}
        </div>`,
      });
    }
    return html`
      <section class="${cls('card', o.class)}">
        <button class="collapse__btn" data-act="${o.act}" ${attrs(o.data || {})}
                aria-expanded="${o.open ? 'true' : 'false'}">
          <span class="row-sm"><h3 class="collapse__title">${o.title}</h3>${when(o.meta, () => html`<span class="tiny dim">${o.meta}</span>`)}</span>
          <span class="${cls('collapse__chev', o.open && 'is-open')}">${icon('down')}</span>
        </button>
        ${when(o.open, o.body)}
      </section>`;
  }

  /* ---------- olcum ---------- */

  /* progress: 0–100. Sayinin yaninda "hedefin neresindeyim" seridi cizer —
     ciplak bir sayi ile dolulugu gorunen bir sayi ayni sey degildir.
     Deger anlamsizsa (hesaplanamiyorsa) alan hic verilmez, serit cizilmez. */
  function Stat(o){
    const pct = o.progress == null ? null : Math.max(0, Math.min(100, Number(o.progress) || 0));
    return html`
      <div class="${cls('stat', o.tone && 'stat--'+o.tone)}">
        <span class="stat__label">${o.label}${when(o.hint, () => raw(ESP.UI.hint(o.hint)))}</span>
        <span class="stat__value">${o.value}${when(o.unit, () => html`<small>${o.unit}</small>`)}</span>
        ${when(o.spark, o.spark)}
        ${when(pct != null, () => html`<span class="stat__bar" aria-hidden="true">
          <i style="width:${pct}%"></i></span>`)}
        ${when(o.note, () => html`<span class="stat__note">${o.note}</span>`)}
      </div>`;
  }

  /* Doluluk seridi.

     Ton ACIKCA verilir. Eskiden %60 altindaki her deger kendiliginden
     kirmiziya boyaniyordu; ogle saatinde gunluk hedefin yarisinda olmak
     bir hata degildir ve arayuzu bos yere alarma cevirir. Esige gore
     renklendirme isteniyorsa `auto:true` ile acikca istenir. */
  function Bar(o){
    const pct = Math.max(0, Math.min(100, Number(o.value) || 0));
    const tone = o.tone != null && o.tone !== ''
      ? o.tone
      : (o.auto ? (pct >= 85 ? '' : pct >= 60 ? 'warn' : 'danger') : '');
    return html`<div class="${cls('bar', o.large && 'bar--lg')}">
      <div class="${cls('bar__fill', tone && 'bar__fill--'+tone)}" style="width:${pct}%"></div>
    </div>`;
  }

  function Meter(o){
    const pct = Math.max(0, Math.min(100, Number(o.value) || 0));
    return html`
      <div class="meter">
        <div class="meter__top"><span class="muted">${o.label}</span><b class="num">${o.text != null ? o.text : '%'+Math.round(o.value)}</b></div>
        ${Bar({ value:pct, tone:o.tone, large:o.large })}
        ${when(o.note, () => html`<span class="tiny dim">${o.note}</span>`)}
      </div>`;
  }

  /* ---------- etiket ---------- */

  function Badge(o){
    const ICONS = { ok:'check', warn:'warn', danger:'warn', info:'info' };
    return html`<span class="${cls('badge', 'badge--'+(o.tone || 'muted'))}">${when(o.icon !== false && ICONS[o.tone], () => icon(ICONS[o.tone]))}${o.label}</span>`;
  }

  function Chip(o){
    if(typeof o === 'string') o = { label:o };
    return html`<span class="${cls('chip', o.act && 'chip--tap', o.on && 'chip--on')}"
      ${when(o.act, () => attrs(Object.assign(
        { 'data-act':o.act, role:'button', tabindex:'0' }, o.data || {})))}>${o.label}</span>`;
  }

  /* ---------- etkilesim ---------- */

  /* Etiket ayri bir span icinde durur: dar ekranda yazi gizlenip ikon
     kalabilsin diye. Ikonu olmayan dugmede etiket her zaman gorunur. */
  function Button(o){
    return html`<button
      class="${cls('btn', o.tone && 'btn--'+o.tone, o.size && 'btn--'+o.size, o.block && 'btn--block', o.class)}"
      ${attrs(Object.assign({ 'data-act':o.act, disabled:o.disabled, 'aria-label':o.aria, title:o.title }, o.data || {}))}
    >${when(o.icon, () => icon(o.icon))}<span class="btn__label">${o.label}</span></button>`;
  }

  function IconButton(o){
    return html`<button class="${cls('iconbtn', o.plain && 'iconbtn--plain', o.size === 'sm' && 'iconbtn--sm', o.class)}"
      ${attrs(Object.assign({ 'data-act':o.act, 'aria-label':o.aria || o.label, title:o.title }, o.data || {}))}
    >${icon(o.icon)}</button>`;
  }

  /* Segmented: [{value,label}] + aktif deger */
  function Segmented(o){
    return html`<div class="${cls('seg', o.block && 'seg--block', o.primary && 'seg--primary')}" role="group" ${attrs({ 'aria-label':o.aria })}>
      ${map(o.items, it => html`<button class="${cls(String(it.value) === String(o.value) && 'is-on')}"
        ${attrs(Object.assign({ 'data-act':o.act, 'data-value':it.value }, o.data || {}))}
        aria-pressed="${String(it.value) === String(o.value) ? 'true' : 'false'}">${it.label}</button>`)}
    </div>`;
  }

  /* Ekran ici sekmeler: [{id, label, icon?, count?}] + aktif id.

     Ince alt cizgi yerine secilebilir hap seridi: bir ekranin kac bolume
     ayrildigi ve hangisinde oldugun tek bakista gorunur. Sayac verilirse
     sekmenin sagina yazilir — hangi bolumde is bekledigi gizlenmez. */
  function Subtabs(o){
    return html`<div class="subtabs" role="tablist" ${attrs({ 'aria-label':o.aria })}>
      ${map(o.items, t => html`<button class="${cls('subtab', t.id === o.value && 'is-active')}"
        role="tab" aria-selected="${t.id === o.value ? 'true' : 'false'}"
        ${attrs({ 'data-act':o.act, 'data-tab':t.id })}
      >${when(t.icon, () => icon(t.icon))}${t.label}${when(t.count,
        () => html`<span class="subtab__count">${t.count}</span>`)}</button>`)}
    </div>`;
  }

  /* Secilebilir kart — "birden cogunu isaretle" durumlari icin.
     Onay kutusu uzun listede kaybolur; kartin tamami dokunma hedefidir. */
  function PickCard(o){
    return html`<button class="${cls('pickcard', o.on && 'is-on')}"
      ${attrs(Object.assign({ 'data-act':o.act, 'aria-pressed':o.on ? 'true' : 'false' }, o.data || {}))}>
      <span class="pickcard__box" aria-hidden="true">&#10003;</span>
      <span class="pickcard__body">
        <span class="pickcard__name">${o.label}</span>
        ${when(o.meta, () => html`<span class="pickcard__meta">${o.meta}</span>`)}
      </span>
    </button>`;
  }

  /* Ekran arac seridi: sekme seridi ile o bolume ait eylemi ayni satirda tutar. */
  function Toolbar(o){
    return html`<div class="toolbar">
      <div class="toolbar__tabs">${o.tabs}</div>
      ${when(o.actions, () => html`<div class="toolbar__actions">${o.actions}</div>`)}
    </div>`;
  }

  /* ---------- defter satiri ----------

     Sistemin ana duzen birimi. Kart DEGILDIR ve bilincli olarak kutu
     cizmez.

     Kart dili bir yonetim panelinin dilidir: her sey esit agirlikta beyaz
     bir dikdortgene konur, on bes dikdortgen yan yana dizilir ve sayfa
     bir tepsiye doner. Gunde birkac kez acilip aylarca okunacak bir
     sistemde bu dil yorar.

     Defter satiri bunun yerine kitaplarin, defterlerin ve teknik
     belgelerin yuzyillardir kullandigi duzeni kurar:

       solda  dar bir kunye sutunu -- bolum adi, olcu, eylem
       sagda  icerigin kendisi, tam genislikte akan
       arada  ince bir cizgi

     Kutu yalnizca SECILEBILIR ya da YUZEN seylerde kalir: secim karti,
     alt sayfa, uyari. Okunacak bir sey kutuya konmaz.

     Kunye sutunu uzun icerikte YAPISIR: yuz satirlik bir listeyi
     kaydirirken hangi bolumde oldugunu unutmayasin diye.

     KUNYEYE KOYACAK BIR SEY YOKSA SUTUN HIC ACILMAZ. Bos bir kunye
     sutunu 196 piksellik bir bosluk birakir ve icerigi saga sikistirir;
     kunyesi olmayan sey GENIS satirdir. */
  function Entry(o){
    return html`
      <section class="${cls('lrow', o.wide && 'lrow--wide', o.class)}"
        ${when(o.id, () => attrs({ id:o.id }))}
        ${when(o.hint, () => attrs({ 'data-hint':o.hint }))}>
        ${when(o.label || o.meta || o.note || o.action, () => html`
        <div class="lrow__side">
          ${when(o.label, () => html`<div class="lrow__label">${o.label}${raw(ESP.UI.hint(o.hint || ''))}</div>`)}
          ${when(o.meta, () => html`<div class="lrow__meta">${o.meta}</div>`)}
          ${when(o.note, () => html`<p class="lrow__note">${o.note}</p>`)}
          ${when(o.action, () => html`<div class="lrow__act">${o.action}</div>`)}
        </div>`)}
        <div class="lrow__main">${o.body}</div>
      </section>`;
  }

  /* Defter: satirlarin kabi. Ilk satirin ust cizgisi yoktur -- hero'nun
     alt cizgisi zaten oradadir ve iki cizgi ust uste gelmez. */
  function Ledger(rows){
    if(typeof rows === 'function'){
      ledgerMode = true;
      try{ rows = rows(); }
      finally{ ledgerMode = false; }
    }
    return html`<div class="ledger">${rows}</div>`;
  }

  /* ---------- dikte ve dosya ----------

     Ikisi de KOSULLUDUR: tarayici ses tanimayi desteklemiyorsa mikrofon
     dugmesi hic cizilmez, dosya alani her zaman cizilir cunku metin
     dosyasi modelsiz de okunur. Calismayan bir dugme gostermek
     kullaniciya secenek degil, hayal kirikligi verir. */
  function Mic(o){
    if(!ESP.Voice || !ESP.Voice.supported()) return raw('');
    const on = ESP.Voice.isActive() && ESP.Voice.activeTarget() === o.target;
    return html`<button type="button"
      class="${cls('mic', on && 'is-on', o.size === 'sm' && 'mic--sm')}"
      data-act="dictate" data-target="${o.target}"
      aria-label="${on ? 'Dinlemeyi durdur' : 'Sesle yaz'}"
      aria-pressed="${on ? 'true' : 'false'}"
      title="${on ? 'Dinliyor — durdurmak için tıkla' : 'Sesle yaz'}">
      ${raw(ESP.UI.icon('mic'))}
      ${when(on, () => html`<span class="mic__pulse" aria-hidden="true"></span>`)}
    </button>`;
  }

  /* Dosya birakma alani. Tiklayinca dosya secici acilir, uzerine
     birakinca da alir. Iki yol da ayni eylemi tetikler. */
  function Drop(o){
    return html`<label class="drop" data-drop="${o.act}">
      <input type="file" class="drop__input" accept="${o.accept || ''}"
        data-change="${o.act}" ${when(o.id, () => attrs({ id:o.id }))}/>
      <span class="drop__icon" aria-hidden="true">${raw(ESP.UI.icon(o.icon || 'upload'))}</span>
      <span class="drop__text">
        <b>${o.label}</b>
        <span>${o.hint || 'Dosyayı buraya bırak ya da seçmek için tıkla'}</span>
      </span>
    </label>`;
  }

  function Field(o){
    return html`<label class="field">
      <span>${o.label}${when(o.hint, () => html` <span class="hint-text">${o.hint}</span>`)}</span>
      ${o.input}
    </label>`;
  }

  function Input(o){
    return html`<input class="${cls('input', o.size === 'sm' && 'input--sm', o.numeric && 'input--num', o.class)}"
      ${attrs(Object.assign({
        id:o.id, type:o.type || 'text', value:o.value == null ? null : o.value,
        placeholder:o.placeholder, min:o.min, max:o.max, step:o.step,
        disabled:o.disabled, 'aria-label':o.aria, 'data-change':o.change,
        'data-debounce':o.debounce,
      }, o.data || {}))}/>`;
  }

  /* `class` ve `aria` SESSIZCE DUSUYORDU: iki cagri yeri
     `class:'composer__input'` geciyor ve o sinif hicbir zaman yazilmiyordu,
     bu yuzden sohbet kutusu satiri doldurmuyordu. Yer tutucu da etiket
     yerine gecmez — ekran okuyucu yalnizca "metin alani" der. */
  function Textarea(o){
    return html`<textarea class="${cls('textarea', o.class)}"
      ${attrs(Object.assign({ id:o.id, rows:o.rows || 3, placeholder:o.placeholder,
        'aria-label':o.aria, 'data-change':o.change }, o.data || {}))}
    >${o.value || ''}</textarea>`;
  }

  /* `aria` alani `Input`'ta vardi, `Select`'te yoktu: etiketsiz bir
     secici ekran okuyucuda yalnizca "acilir liste" diye anilir. */
  function Select(o){
    return html`<select class="${cls('select', o.size === 'sm' && 'input--sm')}"
      ${attrs(Object.assign({ id:o.id, disabled:o.disabled, 'aria-label':o.aria,
        'data-change':o.change }, o.data || {}))}>
      ${map(o.options, op => {
        const v = op.value != null ? op.value : op;
        const l = op.label != null ? op.label : op;
        return html`<option value="${v}" ${String(v) === String(o.value) ? raw('selected') : ''}>${l}</option>`;
      })}
    </select>`;
  }

  function Checkbox(o){
    return html`<label class="${cls('check', o.checked && 'is-done')}">
      <input type="checkbox" ${o.checked ? raw('checked') : ''}
        ${attrs(Object.assign({ 'data-act':o.act }, o.data || {}))}/>
      <span>${o.label}</span>
    </label>`;
  }

  /* ---------- bilgi ---------- */

  function Notice(o){
    const tone = o.tone || 'info';
    return html`<div class="${cls('notice', 'notice--'+tone, o.class)}" ${when(tone === 'danger', () => attrs({ role:'alert' }))}>
      ${icon(tone === 'warn' || tone === 'danger' ? 'warn' : 'info')}
      <div>${when(o.title, () => html`<span class="notice__title">${o.title}</span> `)}${o.body}</div>
    </div>`;
  }

  /* Boş durum, jenerik bir ikon yerine BÖLÜMÜN İMZASINI taşır: boş
     ekran da tasarımın parçasıdır ve hangi bölümde olunduğunu söyler.
     `icon` verilirse eski davranış korunur. */
  function Empty(o){
    const sec = (ESP.App && ESP.App.sectionOf && ESP.S)
      ? ESP.App.sectionOf(ESP.S.route) : null;
    const mark = o.icon ? icon(o.icon)
      : (sec && ESP.UI.motif ? '<div class="empty__motif">' + ESP.UI.motif(sec.id) + '</div>'
         : icon('list'));
    return html`<div class="empty">
      ${raw(mark)}
      <p>${o.text}</p>
      ${when(o.action, o.action)}
    </div>`;
  }

  /* Yukleniyor: spinner degil iskelet */
  /* BEKLEME. Model çağrısı saniyeler sürüyor ve iskelet ekran
     tasarlanmamıştı: kullanıcı donduğunu sanıyordu.

     İki şey eklendi. Birincisi: iskelet artık NE BEKLENDİĞİNİ söyler —
     boş gri çubuklar «bir şey oluyor» der, «ne olduğunu» değil.
     İkincisi: bir ışık şeridi sayfanın donmadığını gösterir; hareketi
     azaltılmış tercihinde şerit durur, metin kalır. */
  function Skeleton(o){
    const c = o || {};
    const n = c.rows || 3;
    return html`<div class="${cls('skeleton', c.label && 'skeleton--labeled')}"
      aria-busy="true" aria-live="polite">
      ${when(c.label, () => html`<div class="skeleton__label">
        <span class="skeleton__spin" aria-hidden="true"></span>
        <span>${c.label}</span>
        ${when(c.hint, () => html`<span class="skeleton__hint">${c.hint}</span>`)}
      </div>`)}
      ${map(Array.from({ length:n }), (_, i) => html`<div class="skeleton__row"
        style="width:${[92, 74, 84, 62][i % 4]}%"></div>`)}
    </div>`;
  }

  /* Kısa işlemler için tek satırlık şerit — iskelet çizmeye değmeyen
     yerlerde (düğmenin altında, alt sayfanın başında) kullanılır. */
  function Busy(o){
    const c = typeof o === 'string' ? { label:o } : (o || {});
    return html`<div class="busy" role="status" aria-live="polite">
      <span class="busy__spin" aria-hidden="true"></span>
      <span class="busy__t">${c.label || 'İşleniyor…'}</span>
      ${when(c.hint, () => html`<span class="busy__hint">${c.hint}</span>`)}
    </div>`;
  }

  /* Siradaki hamle — her ekranda ayni merkez kart */
  function NextUp(o){
    return html`
      <div class="${cls('nextup', o.calm && 'nextup--calm')}">
        <div class="nextup__icon">${icon(o.icon)}</div>
        <div class="nextup__body">
          <div class="nextup__label">${o.label}${when(o.hint, () => raw(ESP.UI.hint(o.hint)))}</div>
          <div class="nextup__title">${o.title}</div>
          ${when(o.why, () => html`<div class="nextup__why">${o.why}</div>`)}
        </div>
        ${when(o.action, o.action)}
      </div>`;
  }

  /* ---------- tablo ---------- */

  /* headers: ['Ad', {label:'Net', num:true}] · rows: [[hucre, ...]] */
  function Table(o){
    return html`<div class="tablewrap"><table class="${cls(o.tight && 'table--tight')}">
      <thead><tr>${map(o.headers, hd => html`<th class="${cls(hd && hd.num && 'num')}">${hd && hd.label != null ? hd.label : hd}</th>`)}</tr></thead>
      <tbody>${map(o.rows, r => html`<tr>${map(r, (cell, i) => {
        const hd = o.headers[i];
        return html`<td class="${cls(hd && hd.num && 'num')}">${cell}</td>`;
      })}</tr>`)}</tbody>
    </table></div>`;
  }

  /* Sayfalama: uzun listelerde tum DOM'u cizmemek icin.
     paginate(list, page, size) -> { items, page, pages, total } */
  function paginate(list, page, size){
    const per = size || 25;
    const total = list.length;
    const pages = Math.max(1, Math.ceil(total/per));
    const p = Math.min(Math.max(1, page || 1), pages);
    return { items:list.slice((p-1)*per, p*per), page:p, pages, total, per };
  }

  function Pager(o){
    if(o.pages <= 1) return raw('');
    return html`
      <div class="pager" role="navigation" aria-label="Sayfalama">
        ${Button({ label:'Önceki', size:'sm', act:o.act, disabled:o.page <= 1,
          data:{ 'data-page':o.page-1 } })}
        <span class="pager__info num">${o.page} / ${o.pages}
          <span class="dim">· ${o.total} kayıt</span></span>
        ${Button({ label:'Sonraki', size:'sm', act:o.act, disabled:o.page >= o.pages,
          data:{ 'data-page':o.page+1 } })}
      </div>`;
  }

  /* ---------- duzen ---------- */

  const Grid = body => html`<div class="grid">${body}</div>`;
  const Span = (n, body) => html`<div class="span-${n}">${body}</div>`;
  const Stack = (body, gap) => html`<div class="${cls('stack', gap === 'sm' && 'stack-sm', gap === 'xs' && 'stack-xs')}">${body}</div>`;
  const Cols = (n, body) => html`<div class="cols-${n}">${body}</div>`;
  const Row = (body, o) => html`<div class="${cls('row', o && o.between && 'between', o && o.wrap && 'wrap', o && o.sm && 'row-sm')}">${body}</div>`;
  const SectionTitle = (title, right) => html`<div class="section-title"><h2>${title}</h2>${when(right, right)}</div>`;

  return {
    Card, Collapsible, Stat, Bar, Meter, Badge, Chip, Button, IconButton, Segmented, Subtabs,
    Entry, Ledger,
    PickCard, Toolbar,
    Field, Input, Textarea, Select, Checkbox, Notice, Empty, Skeleton, Busy, NextUp, Table, Pager, paginate,
    Mic, Drop,
    Grid, Span, Stack, Cols, Row, SectionTitle,
  };
})();

/* ==== js/core/parts.js ==== */
/* ESP'ye ozel, veriye bagli parcalar.

   Ayrim korunur: `C.*` (core/components.js) uygulamadan BAGIMSIZDIR ve
   icine entelektuel alan sizmaz; `P.*` ise alana baglidir ve icine genel
   bilesen girmez. Ikisi karisirsa bilesen sozlugu kardes projelere
   tasinamaz hale gelir.

   Burada dort sey var: kesinlik rozeti, ajan avatari, disiplin seridi ve
   radar grafigi. Radar `core/ui.js` icinde degil burada cunku eksenleri
   ESP'nin alti disiplinidir — jenerik bir grafik degil, alana bagli bir
   sekildir. */

window.ESP = window.ESP || {};

ESP.Parts = (function(){
  const U = ESP.U;
  const { html, raw, when, map, cls } = ESP.h;
  const K = ESP.C;

  /* Kesinlik rozeti — bir sayinin nereden geldigi.

     Her sayinin yaninda durur ve DEGISTIRILEMEZ: bu, sistemin en onemli
     kuralinin gorunen yuzudur. */
  function cert(kind, opts){
    const c = ESP.CERTAINTY[kind] || ESP.CERTAINTY.missing;
    const o = opts || {};
    return html`<span class="${cls('cert', 'cert--' + kind)}"
      ${o.title === false ? '' : ESP.h.attrs({ title:c.note })}>${c.label}</span>`;
  }

  /* Bir olcumu kesinligiyle birlikte yazar. `value` null ise sayi HIC
     yazilmaz — "0" gostermek yerine etiket gosterilir. */
  function measure(value, unit, kind){
    if(value == null || kind === 'missing'){
      return html`<span class="measure measure--none">${cert('missing')}</span>`;
    }
    return html`<span class="measure"><b class="num">${U.fmtNum(value)}</b>${when(unit,
      () => html`<small>${unit}</small>`)}${cert(kind || 'measured')}</span>`;
  }

  function avatar(agentId, size){
    const a = ESP.AGENT_BY_ID[agentId];
    if(!a) return raw('');
    return html`<span class="${cls('agentav', size === 'sm' && 'agentav--sm')}"
      style="background:${a.color}" title="${a.name}" aria-hidden="true">${a.initial}</span>`;
  }

  function discChip(discId, opts){
    const d = ESP.DISCIPLINE_BY_ID[discId];
    if(!d) return raw('');
    const o = opts || {};
    return K.Chip({ label:o.long ? d.label : d.short, act:o.act,
      data:o.act ? { 'data-disc':d.id } : null, on:o.on });
  }

  /* ---------------------------------------------------------------- radar

     Alti eksen, alti disiplin. Radar burada bir SUS DEGIL: altı sayıyı yan
     yana okumanin en hizli yolu, aralarindaki DENGEYI gostermektir — ve
     sistemin bulgusu tam olarak dengedir ("bir disipline yigilmis, biri hic
     acilmamis").

     Iki kural:

       1. Olculmemis eksen SIFIRA CEKILMEZ. Sifir "hic calisilmadi" gibi
          gorunurdu; oysa "veri yok" ayri bir durumdur. Olculmemis eksen
          kesikli cizilir ve merkeze degil EKSENIN DIBINDEKI kucuk bir
          isarete duser.
       2. Olcek daima yazilir. Radar bir oran gosterir; oranin neye gore
          oldugu gorunmezse sekil yaniltir.

     `rows`: [{ label, value(0..1)|null, cert }] */
  function radar(rows, opts){
    const o = opts || {};
    const n = (rows || []).length;
    if(n < 3) return K.Empty({ text:'Radar için en az üç eksen gerekir.' });

    const R = 76, cx = 100, cy = 92;
    const nokta = (i, r) => {
      const a = -Math.PI / 2 + i * 2 * Math.PI / n;
      return [cx + Math.cos(a) * r, cy + Math.sin(a) * r];
    };

    const halkalar = [0.25, 0.5, 0.75, 1].map(f => {
      const p = rows.map((_, i) => nokta(i, R * f).map(v => Math.round(v * 10) / 10).join(','));
      return '<polygon class="radar__ring" points="' + p.join(' ') + '"/>';
    }).join('');

    const eksenler = rows.map((r, i) => {
      const [x, y] = nokta(i, R);
      return '<line class="radar__axis" x1="' + cx + '" y1="' + cy + '" x2="'
        + Math.round(x * 10) / 10 + '" y2="' + Math.round(y * 10) / 10 + '"/>';
    }).join('');

    /* Olculmus eksenlerden coken poligon. Olculmemis eksen poligona
       KATILMAZ: katilsaydi sifir gibi girer ve sekli iceri ceker. */
    const olculen = rows.map((r, i) => ({ r, i })).filter(x => x.r.cert !== 'missing'
      && x.r.value != null);
    const poly = olculen.length >= 3
      ? '<polygon class="radar__shape" points="'
        + olculen.map(x => nokta(x.i, R * Math.max(0.04, Math.min(1, x.r.value)))
            .map(v => Math.round(v * 10) / 10).join(',')).join(' ') + '"/>'
      : '';

    const isaretler = rows.map((r, i) => {
      const olcum = r.cert !== 'missing' && r.value != null;
      const [x, y] = nokta(i, olcum ? R * Math.max(0.04, Math.min(1, r.value)) : 6);
      return '<circle class="' + (olcum ? 'radar__dot' : 'radar__dot radar__dot--none')
        + '" cx="' + Math.round(x * 10) / 10 + '" cy="' + Math.round(y * 10) / 10
        + '" r="' + (olcum ? 3 : 2.4) + '"><title>' + U.esc(r.label) + ': '
        + (olcum ? Math.round(r.value * 100) + '%' : 'veri yok') + '</title></circle>';
    }).join('');

    const etiketler = rows.map((r, i) => {
      const [x, y] = nokta(i, R + 14);
      const anchor = Math.abs(x - cx) < 6 ? 'middle' : (x > cx ? 'start' : 'end');
      return '<text class="radar__label" x="' + Math.round(x) + '" y="'
        + Math.round(y + 3) + '" text-anchor="' + anchor + '">' + U.esc(r.label) + '</text>';
    }).join('');

    return html`
      <figure class="radar">
        ${raw('<svg viewBox="0 0 200 184" role="img" aria-label="'
          + U.esc(o.aria || 'Disiplin dengesi radarı') + '">'
          + halkalar + eksenler + poly + isaretler + etiketler + '</svg>')}
        <figcaption class="radar__cap">
          ${o.scale || 'Dış halka = penceredeki en yüksek değer.'}
          ${when(rows.some(r => r.cert === 'missing'), () => html`
            <span class="radar__none">Kesikli nokta: ölçülmemiş eksen — sıfır değil.</span>`)}
        </figcaption>
      </figure>`;
  }

  /* Bos durum — bolumun kendi imzasiyla. */
  function empty(text, action){
    return K.Empty({ text, action });
  }

  return { cert, measure, avatar, discChip, radar, empty };
})();

/* ==== js/core/quota.js ==== */
/* Istek sinir yoneticisi — ucretsiz modellerin kotasi asilmaz.

   Ucretsiz saglayicilarin uc sinirı vardir ve ucu de asilirsa istek reddedilir:
     RPM  dakikada istek     (asilirsa 429; birkac saniye beklemek yeter)
     RPD  gunde istek        (asilirsa gun bitene kadar kapali; beklemek anlamsiz)
     TPM  dakikada jeton     (buyuk istemlerde binder; ofis istemleri kucuk)

   Bu modul iki sey yapar:

   1) ARALIK KOYAR. Ard arda gelen iki istek arasina en az 60000/RPM ms boşluk
      birakir. Boylece patlama (burst) hic olusmaz; toplanti da bu sayede
      "sirayla konusuluyor" ritmine kavusur.

   2) GUNU SAYAR. Gunluk sayac localStorage'da durur; sayfa yenilense de
      kaybolmaz. Gun dolduysa beklemek yerine acik bir hata dondurur.

   Sayaclar saglayici+model basina ayri tutulur: Groq'ta sinira takilmak
   Gemini'yi durdurmaz. */

window.ESP = window.ESP || {};

ESP.Quota = (function(){

  const STORE = 'esp.llm.quota';
  /* Saglayicinin bildirdigi sinirin tamami kullanilmaz: saat farki, ayni
     anahtarla acilmis baska sekme ve saglayicinin kendi yuvarlamasi icin pay. */
  const SAFETY = 0.85;
  /* Bir istegin kuyrukta bekleyebilecegi en uzun sure. Daha uzunu kullaniciyi
     bekletmek yerine acikca soylenir. */
  const MAX_WAIT_MS = 75000;

  /* ---------- kalici gunluk sayac ---------- */

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function readStore(){
    try{
      const raw = JSON.parse(localStorage.getItem(STORE) || '{}');
      if(raw.day !== todayKey()) return { day:todayKey(), used:{} };
      return { day:raw.day, used:raw.used || {} };
    }catch(e){ return { day:todayKey(), used:{} }; }
  }

  let daily = readStore();

  function persist(){
    try{ localStorage.setItem(STORE, JSON.stringify(daily)); }catch(e){}
  }

  function rollDay(){
    if(daily.day !== todayKey()){ daily = { day:todayKey(), used:{} }; persist(); }
  }

  /* ---------- dakikalik pencere (bellekte) ---------- */

  /* key -> { times:[ms], nextFreeAt:ms } */
  const minute = new Map();

  function bucket(key){
    if(!minute.has(key)) minute.set(key, { times:[], nextFreeAt:0 });
    return minute.get(key);
  }

  function prune(b, now){
    while(b.times.length && now - b.times[0] >= 60000) b.times.shift();
  }

  /* ---------- sinirlarin okunmasi ---------- */

  /* Sayac anahtari saglayici + model + ANAHTAR kimligidir: ayni saglayiciya
     iki API anahtari verildiginde kota ayri sayilir ve gunluk hak katlanir. */
  function key(cfg){
    const k = (cfg && cfg.keyId != null) ? '#' + cfg.keyId : '';
    return (cfg && cfg.provider) + '|' + (cfg && cfg.model) + k;
  }

  /* ---------- kullanici duzeltmesi ----------
     Gunluk hak hesaba bagli olabilir (OpenRouter'da kredi yuklediysen 50 yerine
     1000). Kullanici gercek sinirini ayarlardan yazar; katalog degismez. */

  const OVERRIDE_STORE = 'esp.llm.limits';

  function readOverrides(){
    try{ return JSON.parse(localStorage.getItem(OVERRIDE_STORE) || '{}'); }
    catch(e){ return {}; }
  }
  let overrides = readOverrides();

  function setOverride(providerId, patch){
    const next = Object.assign({}, overrides[providerId] || {});
    Object.keys(patch || {}).forEach(k => {
      const v = Number(patch[k]);
      if(Number.isFinite(v) && v > 0) next[k] = v; else delete next[k];
    });
    if(Object.keys(next).length) overrides[providerId] = next;
    else delete overrides[providerId];
    try{ localStorage.setItem(OVERRIDE_STORE, JSON.stringify(overrides)); }catch(e){}
    return next;
  }
  function getOverride(providerId){ return overrides[providerId] || {}; }
  function clearOverrides(){
    overrides = {};
    try{ localStorage.removeItem(OVERRIDE_STORE); }catch(e){}
  }

  /* Modelin kendi siniri yoksa saglayicinin varsayilanina duser;
     kullanici duzeltmesi ikisinin de ustundedir. */
  function limitsFor(cfg){
    const p = ESP.PROVIDERS[cfg && cfg.provider];
    if(!p) return null;
    const m = (p.models || []).find(x => x.id === cfg.model);
    const l = Object.assign({}, p.limits || {}, (m && m.limits) || {}, getOverride(p.id));
    if(l.rpm == null && l.rpd == null) return null;   // sinirsiz sayilir (yerlesik, ozel uc)
    return l;
  }

  /* Etkin sinirlar.

     Pay YALNIZ dakikalik sinira uygulanir: orada saatin kaymasi ve
     saglayicinin kendi yuvarlamasi bizi sinirin ustune tasiyabilir.

     Gunluk sayacta pay YOKTUR ve olmamalidir: bu bir zamanlama sorunu degil
     duz bir sayimdir; pay dusmek kullanicinin ucretsiz hakkinin bir kismini
     harcamadan curutur. Sayimimiz saglayicininkinden ancak DUSUK olabilir
     (baska bir sekme ayni anahtari kullaniyorsa); o durumda gercek 429 gelir
     ve penalize() devreye girer. */
  function effective(cfg){
    const l = limitsFor(cfg);
    if(!l) return null;
    const rpm = l.rpm ? Math.max(1, Math.floor(l.rpm * SAFETY)) : null;
    return {
      rpm,
      rpd: l.rpd || null,
      gapMs: rpm ? Math.ceil(60000 / rpm) : 0,
    };
  }

  /* ---------- sorgu ---------- */

  /* Simdi istek yapilsa ne olurdu: hemen mi, ne kadar bekleyerek mi, yoksa
     gun dolduğu icin hic mi? UI bunu cagirarak "3 sn sonra" yazabilir. */
  function check(cfg, now){
    const eff = effective(cfg);
    if(!eff) return { ok:true, waitMs:0, limited:false };

    const t = now == null ? Date.now() : now;
    rollDay();

    const k = key(cfg);
    const usedToday = daily.used[k] || 0;
    if(eff.rpd && usedToday >= eff.rpd){
      return { ok:false, reason:'daily', waitMs:0, limited:true, usedToday, rpd:eff.rpd };
    }

    const b = bucket(k);
    prune(b, t);

    let waitMs = Math.max(0, b.nextFreeAt - t);
    if(eff.rpm && b.times.length >= eff.rpm){
      waitMs = Math.max(waitMs, 60000 - (t - b.times[0]) + 50);
    }
    return { ok:waitMs === 0, waitMs, limited:waitMs > 0, usedToday, rpd:eff.rpd, rpm:eff.rpm };
  }

  /* ---------- ayirma ---------- */

  function sleep(ms, signal){
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => { cleanup(); resolve(); }, ms);
      const onAbort = () => { cleanup(); reject(Object.assign(new Error('iptal'), { code:'cancelled' })); };
      function cleanup(){
        clearTimeout(timer);
        if(signal) signal.removeEventListener('abort', onAbort);
      }
      if(signal){
        if(signal.aborted){ cleanup(); reject(Object.assign(new Error('iptal'), { code:'cancelled' })); return; }
        signal.addEventListener('abort', onAbort);
      }
    });
  }

  /* Bir istek icin sira bekler ve yerini ayirir.
     opts.onWait(ms) beklemeden once cagirilir; ekran "3 sn" yazabilir.
     Gun dolduysa beklemez, 'daily_quota' hatasi atar. */
  async function acquire(cfg, opts){
    const o = opts || {};
    const eff = effective(cfg);
    if(!eff){ return { waited:0 }; }

    const state = check(cfg);
    if(!state.ok && state.reason === 'daily'){
      throw Object.assign(new Error('gunluk kota doldu'), {
        code:'daily_quota', usedToday:state.usedToday, rpd:state.rpd,
      });
    }
    if(state.waitMs > MAX_WAIT_MS){
      throw Object.assign(new Error('sira cok uzun'), {
        code:'rate_wait', waitMs:state.waitMs,
      });
    }

    if(state.waitMs > 0){
      if(o.onWait) o.onWait(state.waitMs);
      await sleep(state.waitMs, o.signal);
    }

    /* Yeri simdi ayir: ayni anda baslayan iki cagri ayni yuvayi kapmasin. */
    const now = Date.now();
    const k = key(cfg);
    const b = bucket(k);
    prune(b, now);
    b.times.push(now);
    b.nextFreeAt = now + eff.gapMs;
    daily.used[k] = (daily.used[k] || 0) + 1;
    persist();

    return { waited:state.waitMs, usedToday:daily.used[k], rpd:eff.rpd };
  }

  /* Saglayici yine de 429 dondurduyse: sayilan sinir gercekte daha dusuk.
     Pencereyi doldur ve bir sonraki denemeyi bir sonraki dakikaya at. */
  function penalize(cfg, seconds){
    const eff = effective(cfg);
    if(!eff) return;
    const b = bucket(key(cfg));
    const now = Date.now();
    b.nextFreeAt = Math.max(b.nextFreeAt, now + (seconds ? seconds*1000 : 60000));
  }

  /* Basarisiz istek gunluk kotadan dusulmez mi? OpenRouter'da DUSULUR:
     429 alan istek de gunu tuketir. Bu yuzden acquire'da sayilir ve
     burada geri alinmaz. Yalniz istek hic gonderilmediyse geri alinir. */
  function release(cfg){
    const k = key(cfg);
    if(daily.used[k]) { daily.used[k]--; persist(); }
    const b = bucket(k);
    if(b.times.length) b.times.pop();
  }

  /* ---------- ekran icin ozet ---------- */

  function status(cfg){
    const eff = effective(cfg);
    const k = key(cfg);
    rollDay();
    const usedToday = daily.used[k] || 0;
    if(!eff) return { known:false, usedToday };
    const b = bucket(k);
    prune(b, Date.now());
    return {
      known:true,
      rpm:eff.rpm, rpd:eff.rpd, gapMs:eff.gapMs,
      lastMinute:b.times.length,
      usedToday,
      remainingToday:eff.rpd ? Math.max(0, eff.rpd - usedToday) : null,
      full:!!(eff.rpd && usedToday >= eff.rpd),
    };
  }

  /* Bir dizi cagri (ornegin toplanti) kac saniye surer? */
  function estimateMs(cfg, calls){
    const eff = effective(cfg);
    if(!eff || !eff.gapMs) return 0;
    return Math.max(0, (calls - 1)) * eff.gapMs;
  }

  function reset(){
    minute.clear();
    daily = { day:todayKey(), used:{} };
    persist();
    overrides = readOverrides();
  }

  return { acquire, release, penalize, check, status, estimateMs, effective, limitsFor, reset,
    setOverride, getOverride, clearOverrides,
    SAFETY, MAX_WAIT_MS, STORE, OVERRIDE_STORE };
})();

/* ==== js/core/llm.js ==== */
/* Model tasima katmani — ofis ajanlarini ucretsiz LLM uclarina baglar.

   Ilke: bu modul YALNIZCA tasir. Ne istem kurar, ne veri secer, ne karar verir.
   Istemler core/office.js'te, kural motoru calc/analytics'te durur.

   Uc bicim desteklenir:
     builtin  window.claude.use('sample')      — Artifact icinde, anahtarsiz
     openai   POST /chat/completions (SSE)     — OpenRouter, Groq, ozel uc
     gemini   POST /models/x:streamGenerateContent — Google AI Studio

   Anahtarlar 'esp.llm.keys' altinda, uygulama verisinden AYRI durur:
   yedege girmez (Store.exportAll baska bir anahtari okur), buluta gitmez. */

window.ESP = window.ESP || {};

ESP.LLM = (function(){

  const KEY_STORE = 'esp.llm.keys';
  const TIMEOUT_MS = 90000;

  /* Turkce ayni cumleyi Ingilizceden belirgin daha cok token'la yazar:
     ekler ve genis alfabe yuzunden bes cumlelik bir ajan yaniti rahatlikla
     300 token eder. Eski 700'luk tavan uzun yanitlari cumle ortasinda
     kesiyordu ve kesildigi hicbir yerde fark edilmiyordu. */
  const DEFAULT_MAX_TOKENS = 1200;

  /* Yanit yine de kesilirse kac ek istekle tamamlanmaya calisilir.
     Her devam bir kota hakki harcar; ucretsiz katmanda ikiden fazlasi
     pahaliya gelir. */
  const MAX_CONTINUATIONS = 2;

  /* Saglayicilar "token siniri doldu"yu farkli adlandirir. */
  const TRUNCATED_FINISH = ['length', 'max_tokens', 'MAX_TOKENS'];
  function truncated(finish){
    return TRUNCATED_FINISH.indexOf(String(finish || '')) >= 0;
  }

  /* Devam istekleri de yetmediyse yarim kalan son cumle atilir: kesik bir
     cumle gostermek, bir cumle eksik gostermekten kotudur. Sayi icindeki
     nokta (1.500) cumle sonu sayilmaz — noktalamayi bosluk ya da metin
     sonu izlemelidir. */
  function trimToSentence(text){
    const s = String(text || '').trim();
    const m = s.match(/^[\s\S]*[.!?…](?=\s|$)/);
    if(!m) return s;                        // hic tam cumle yok: dokunma
    const head = m[0].trim();
    /* Yalniz SARKAN bir parca kirpilir. Kesilen cumle metnin govdesiyse
       (geriye yarisindan azi kaliyorsa) atmak yerine eksik hâliyle
       gosterilir: yarim cumle kotudur, bos ekran daha kotudur. */
    return head.length >= s.length * 0.4 ? head : s;
  }

  /* Kesilen metnin son kelimesi yarim kalmis olabilir ("kaybı" degil
     "kayb"). Devam istemeden once o kelime atilir ve modelden kaldigi
     noktadan sonrasi istenir: boylece birlestirme ne kelime boler ne de
     kelime kaybeder — atilan kelimeyi model yeniden yazar. */
  function dropLastWord(s){
    const t = String(s || '').trimEnd();
    const i = t.search(/\s\S*$/);
    return i <= 0 ? t : t.slice(0, i);
  }

  /* Kesilen yaniti tamamlatma istemi. Tekrar, kesik cumleden daha kotu
     bir bozulmadir; acikca yasaklanir. */
  function continueAsk(tail){
    return 'Yanıtın uzunluk sınırı yüzünden yarıda kesildi. Yukarıdaki metnin '
      + 'DEVAMINI yaz: baştan başlama, yazdıklarını tekrar etme, selamlama ekleme. '
      + 'Yalnızca eksik kalan kısmı yaz ve cümleyi tamamla.\n\n'
      + 'KESİLDİĞİ YER: …' + tail;
  }

  /* Devam parcasini birlestirir. Model uyariya ragmen sondan bir parcayi
     tekrarlamis olabilir: ortusen en uzun ek bir kez yazilir. */
  function joinContinuation(prev, piece){
    if(!piece) return prev;
    if(!prev) return piece;
    const max = Math.min(prev.length, piece.length, 240);
    for(let n = max; n >= 12; n--){
      if(prev.slice(-n).toLowerCase() === piece.slice(0, n).toLowerCase()){
        return prev + piece.slice(n);
      }
    }
    return prev + (/\s$/.test(prev) ? '' : ' ') + piece;
  }

  /* ---------- anahtar deposu ---------- */

  function readKeys(){
    try{ return JSON.parse(localStorage.getItem(KEY_STORE) || '{}'); }
    catch(e){ return {}; }
  }

  /* Bir saglayiciya BIRDEN COK anahtar verilebilir. Kota anahtar basina
     sayildigi icin ikinci anahtar gunluk hakki ikiye katlar — ucretsiz
     katmanda en ucuz buyume yolu budur.
     Eski bicim (tek dize) okunmaya devam eder. */
  function getKeys(providerId){
    const v = readKeys()[providerId];
    const list = Array.isArray(v) ? v : (typeof v === 'string' ? [v] : []);
    return list.map(k => String(k || '').trim()).filter(Boolean);
  }
  function getKey(providerId){ return getKeys(providerId)[0] || ''; }

  /* value: dize (tek anahtar) ya da dizi. Bos deger anahtarlari siler. */
  function setKey(providerId, value){
    const all = readKeys();
    const list = (Array.isArray(value) ? value : [value])
      .map(k => String(k || '').trim()).filter(Boolean);
    /* Ayni anahtar iki kez sayilmasin: kota anahtar kimligine bagli. */
    const uniq = list.filter((k, i) => list.indexOf(k) === i);
    if(uniq.length) all[providerId] = uniq; else delete all[providerId];
    try{ localStorage.setItem(KEY_STORE, JSON.stringify(all)); return true; }
    catch(e){ return false; }
  }

  function addKey(providerId, value){
    const v = String(value || '').trim();
    if(!v) return getKeys(providerId);
    const list = getKeys(providerId);
    if(list.indexOf(v) < 0) list.push(v);
    setKey(providerId, list);
    return list;
  }
  function removeKeyAt(providerId, index){
    const list = getKeys(providerId);
    list.splice(index, 1);
    setKey(providerId, list);
    return list;
  }
  function clearKeys(){
    try{ localStorage.removeItem(KEY_STORE); }catch(e){}
  }

  function mask(k){
    if(!k) return '';
    return k.length <= 10 ? '••••' : k.slice(0, 6) + '…' + k.slice(-4);
  }
  /* Ayar ekraninda gosterilecek maskeli hâl — tam anahtar hicbir yerde cizilmez. */
  function maskKey(providerId){ return mask(getKey(providerId)); }
  function maskKeys(providerId){ return getKeys(providerId).map(mask); }

  /* Kotasi musait olan anahtari secer; hepsi doluysa en az bekleyeni.
     Donen index kota sayacinin anahtarina girer. */
  function pickKey(cfg){
    const keys = getKeys(cfg.provider);
    if(!keys.length) return null;
    let best = null;
    for(let i = 0; i < keys.length; i++){
      const state = ESP.Quota.check(Object.assign({}, cfg, { keyId:i }));
      if(state.ok) return { key:keys[i], index:i, waitMs:0 };
      if(state.reason === 'daily') continue;              // bu anahtarin gunu bitti
      if(!best || state.waitMs < best.waitMs) best = { key:keys[i], index:i, waitMs:state.waitMs };
    }
    return best;   // hepsinin gunu bittiyse null → daily_quota
  }

  /* ---------- yerlesik yetenek ---------- */

  let sample = null;
  let builtinState = 'unknown';   // 'unknown' | 'ready' | 'unavailable'

  async function initBuiltin(){
    if(builtinState !== 'unknown') return builtinState === 'ready';
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const api = await window.claude.use('sample');
        if(api){ sample = api; builtinState = 'ready'; return true; }
      }
    }catch(e){ /* sessizce dus */ }
    builtinState = 'unavailable';
    return false;
  }
  function builtinReady(){ return builtinState === 'ready'; }

  /* ---------- hata ---------- */

  function fail(code, message){
    return Object.assign(new Error(message || code), { code });
  }

  /* Yayimlanmis bir Artifact icinde disariya fetch CSP ile engellenir ve
     tarayici bunu ayirt edilemeyen bir TypeError olarak verir. Ayni hata
     cevrimdisiyken de olusur; window.claude varsa neden neredeyse kesin
     kum havuzudur ve kullaniciya bu soylenir. */
  function inSandbox(){
    return !!(window.claude && typeof window.claude.use === 'function');
  }
  function networkCode(){ return inSandbox() ? 'sandboxed' : 'network'; }

  function retryAfterSeconds(response){
    const raw = response.headers && response.headers.get('retry-after');
    const n = Number(raw);
    return Number.isFinite(n) && n > 0 ? Math.min(n, 300) : null;
  }

  function codeForStatus(status){
    if(status === 401 || status === 403) return 'unauthorized';
    if(status === 402) return 'no_credit';
    if(status === 404) return 'bad_model';
    if(status === 408) return 'timeout';
    if(status === 429) return 'rate_limited';
    if(status >= 500) return 'server';
    return 'bad_request';
  }

  /* Tarayici cevrimdisi oldugunu biliyorsa istek hic gonderilmez: kota
     harcanmaz, kullaniciya dogru sebep soylenir, baglanti gelince devam edilir. */
  function offline(){
    return typeof navigator !== 'undefined' && navigator.onLine === false;
  }

  const ERRORS = {
    no_provider:'Model sağlayıcı seçilmedi. Ofis → Ayarlar bölümünden bir sağlayıcı seç.',
    no_key:'Bu sağlayıcı için API anahtarı girilmedi.',
    no_model:'Model seçilmedi.',
    no_endpoint:'Özel uç için adres girilmedi.',
    unauthorized:'API anahtarı kabul edilmedi. Anahtarı kontrol et ya da yenisini üret.',
    no_credit:'Bu hesapta kredi kalmamış. Ücretsiz bir model seç ya da başka sağlayıcı ekle.',
    bad_model:'Model bulunamadı. Model kimliği değişmiş olabilir; listeden başka bir model seç.',
    rate_limited:'İstek sınırına takıldın. Birkaç dakika bekle ya da başka sağlayıcı dene.',
    server:'Sağlayıcı şu an yanıt vermiyor. Biraz sonra tekrar dene.',
    bad_request:'İstek reddedildi. Model kimliği ya da uç adresi hatalı olabilir.',
    network:'Bağlantı kurulamadı. İnternetini ve uç adresini kontrol et.',
    timeout:'Yanıt zaman aşımına uğradı. Daha hızlı bir model dene.',
    cancelled:'İptal edildi.',
    empty:'Model boş yanıt döndürdü. Tekrar dene.',
    no_vision:'Yerleşik model görüntü okuyamıyor. Ayarlar → Rehber → Model '
      + 'bölümünden görüntü destekleyen bir sağlayıcı seç.',
    unavailable:'Yerleşik model bu ortamda kapalı. Ofis → Ayarlar’dan ücretsiz bir sağlayıcı bağla.',
    offline:'Bağlantı yok. Çevrimiçi olunca kaldığın yerden devam edersin; kural motoru bu sırada çalışmayı sürdürüyor.',
    daily_quota:'Bu modelin günlük ücretsiz hakkı doldu. Yarın sıfırlanır; o zamana kadar başka bir sağlayıcı kullanabilirsin.',
    rate_wait:'Dakikalık sıra çok uzun. Birkaç dakika sonra tekrar dene ya da dakikalık sınırı daha yüksek bir sağlayıcı seç.',
    sandboxed:'Bu ortam dış servislere bağlanmaya izin vermiyor. Uygulama Claude içinde yayımlanmış bir sayfa olarak '
      + 'çalışırken dış API çağrıları engellenir: burada yerleşik modeli kullan, ücretsiz sağlayıcılar için uygulamayı '
      + 'kendi tarayıcında (dosyadan ya da kendi sunucundan) aç.',
  };
  function errorText(code){ return ERRORS[code] || 'Model şu an yanıt veremedi.'; }

  /* Yeniden denenebilir hatalar: yedek modele gecmek anlamli olanlar. */
  const RETRYABLE = ['rate_limited', 'server', 'bad_model', 'timeout', 'empty'];
  /* Baglanti gelince kaldigi yerden devam edilebilecek hatalar. */
  const RESUMABLE = ['offline', 'network', 'server', 'timeout'];
  function retryable(code){ return RETRYABLE.indexOf(code) >= 0; }
  function resumable(code){ return RESUMABLE.indexOf(code) >= 0; }

  /* Baglanti geri gelince haber verir; toplanti kaldigi yerden devam eder. */
  function onceOnline(fn){
    if(!offline()){ fn(); return function(){}; }
    const h = function(){ window.removeEventListener('online', h); fn(); };
    window.addEventListener('online', h);
    return function(){ window.removeEventListener('online', h); };
  }

  /* ---------- ortak yardimcilar ---------- */

  /* Cagiranin signal'i ile zaman asimini tek denetleyicide birlestirir. */
  function withTimeout(signal, ms){
    const ctrl = new AbortController();
    let timedOut = false;
    const timer = setTimeout(() => { timedOut = true; ctrl.abort(); }, ms || TIMEOUT_MS);
    const onAbort = () => ctrl.abort();
    if(signal){
      if(signal.aborted) ctrl.abort();
      else signal.addEventListener('abort', onAbort);
    }
    return {
      signal:ctrl.signal,
      timedOut(){ return timedOut; },
      done(){
        clearTimeout(timer);
        if(signal) signal.removeEventListener('abort', onAbort);
      },
    };
  }

  /* SSE govdesini satir satir okur; her 'data:' satirini fn'e verir.

     Iki kapanis tuzagi vardir ve ikisi de yanitin SONUNU goturur:
     akis son 'data:' satirini yeni satirla kapatmadan bitebilir, ve cok
     baytli bir karakter (Turkce ç/ğ/ş/ü hepsi iki bayt) son parcaya
     bolunmus olabilir. Bu yuzden bitiste hem cozucu hem tampon bosaltilir. */
  async function readSSE(response, fn){
    const reader = response.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let closed = false;

    /* true donerse akis kapanmistir ([DONE]) ve okuma biter. */
    function handle(line){
      const s = line.trim();
      if(!s || s.indexOf(':') === 0) return false;          // yorum / keep-alive
      if(s.indexOf('data:') !== 0) return false;
      const payload = s.slice(5).trim();
      if(payload === '[DONE]'){ closed = true; return true; }
      try{ fn(JSON.parse(payload)); }
      catch(e){ /* parcali kare — bir sonraki satirda tamamlanir */ }
      return false;
    }

    try{
      for(;;){
        const { done, value } = await reader.read();
        if(done){
          buffer += decoder.decode();                       // yarim kalan cok baytli karakter
          break;
        }
        buffer += decoder.decode(value, { stream:true });
        let nl;
        while((nl = buffer.indexOf('\n')) >= 0){
          const line = buffer.slice(0, nl);
          buffer = buffer.slice(nl + 1);
          if(handle(line)) return;
        }
      }
      /* Kapanis satiri yeni satirla bitmediyse elde kalan HÂLÂ veridir. */
      if(!closed && buffer) handle(buffer);
    }finally{
      try{ reader.cancel(); }catch(e){}
    }
  }

  /* Hata govdesinden okunabilir mesaj cikarir (saglayicilar farkli sarar). */
  async function errorMessage(response){
    let body = '';
    try{ body = await response.text(); }catch(e){ return ''; }
    try{
      const j = JSON.parse(body);
      const e = j.error || j;
      return String(e.message || e.detail || e.type || '').slice(0, 240);
    }catch(e){ return body.slice(0, 240); }
  }

  /* ---------- yerlesik cagri ---------- */

  async function callBuiltin(req){
    if(!builtinReady()) throw fail('unavailable');
    const turns = [];
    if(req.system) turns.push({ role:'user', content:req.system });
    (req.messages || []).forEach(m => {
      /* Yerlesik saglayici goruntu almaz. Sessizce dusurmek yerine
         cagirana bildiririz: ekran "model goruntu okuyamiyor" der. */
      if(m.images && m.images.length) throw fail('no_vision');
      turns.push({ role:m.role, content:m.text });
    });
    const res = await sample(turns.length === 1 ? turns[0].content : turns, {
      modelTier:req.model === 'quick' ? 'quick' : 'default',
      signal:req.signal,
      onText:req.onText ? ev => req.onText({ text:ev.text, delta:'' }) : undefined,
    });
    const text = String((res && res.text) || '').trim();
    if(!text) throw fail('empty');
    return { text, finish:'' };
  }

  /* ---------- OpenAI uyumlu cagri ---------- */

  async function callOpenAI(req, provider){
    const key = req.key;
    if(!key) throw fail('no_key');
    const endpoint = req.endpoint || provider.endpoint;
    if(!endpoint) throw fail('no_endpoint');

    const messages = [];
    if(req.system) messages.push({ role:'system', content:req.system });
    /* Goruntu tasiyan mesaj, OpenAI uyumlu icerik dizisine cevrilir.
       Goruntu yoksa duz metin kalir: eski saglayicilar dizi bicimini
       kabul etmeyebilir, gereksiz yere riske girilmez. */
    (req.messages || []).forEach(m => {
      if(m.images && m.images.length){
        const content = [{ type:'text', text:m.text || '' }];
        m.images.forEach(img => {
          const url = img.url || ('data:' + (img.mime || 'image/jpeg') + ';base64,' + img.b64);
          content.push({ type:'image_url', image_url:{ url } });
        });
        messages.push({ role:m.role, content });
      }else{
        messages.push({ role:m.role, content:m.text });
      }
    });

    const headers = {
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + key,
    };
    /* OpenRouter kaynak basligi bekler; tarayicidan gonderilmesi serbesttir. */
    if(provider.id === 'openrouter'){
      headers['HTTP-Referer'] = location.origin || 'https://esp.local';
      headers['X-Title'] = 'ESP — entelektüel ofis';
    }

    const stream = !!req.onText;
    const guard = withTimeout(req.signal, req.timeout);
    let response;
    try{
      response = await fetch(endpoint, {
        method:'POST',
        headers,
        signal:guard.signal,
        body:JSON.stringify({
          model:req.model,
          messages,
          max_tokens:req.maxTokens || DEFAULT_MAX_TOKENS,
          temperature:req.temperature == null ? 0.4 : req.temperature,
          stream,
        }),
      });
    }catch(e){
      guard.done();
      if(guard.timedOut()) throw fail('timeout');
      if(req.signal && req.signal.aborted) throw fail('cancelled');
      throw fail(networkCode(), e && e.message);
    }

    if(!response.ok){
      const detail = await errorMessage(response);
      const code = codeForStatus(response.status);
      guard.done();
      /* Saglayici bizim saydigimizdan daha siki davraniyor: pencereyi kapat. */
      if(code === 'rate_limited'){
        ESP.Quota.penalize({ provider:provider.id, model:req.model, keyId:req.keyId }, retryAfterSeconds(response));
      }
      throw fail(code, detail);
    }

    let text = '';
    let finish = '';
    try{
      const ctype = response.headers.get('content-type') || '';
      if(stream && ctype.indexOf('event-stream') >= 0){
        await readSSE(response, obj => {
          const ch = obj.choices && obj.choices[0];
          if(!ch) return;
          /* Bitis sebebi genelde SON karede, govdesi bos olarak gelir:
             delta kontrolunden ONCE okunmali, yoksa kesilme hic gorulmez. */
          if(ch.finish_reason) finish = String(ch.finish_reason);
          const delta = (ch.delta && ch.delta.content) || ch.text;
          if(!delta) return;
          text += delta;
          req.onText({ text, delta });
        });
      }else{
        /* Akis istendigi hâlde duz JSON dondu — ayni govdeden okunur. */
        const json = await response.json();
        const ch = json.choices && json.choices[0];
        if(ch && ch.finish_reason) finish = String(ch.finish_reason);
        text = String((ch && ch.message && ch.message.content) || (ch && ch.text) || '');
        if(req.onText && text) req.onText({ text, delta:text });
      }
    }catch(e){
      if(guard.timedOut()) { guard.done(); throw fail('timeout'); }
      if(req.signal && req.signal.aborted){ guard.done(); throw fail('cancelled'); }
      guard.done();
      throw fail('server', e && e.message);
    }
    guard.done();

    text = text.trim();
    if(!text) throw fail('empty');
    return { text, finish };
  }

  /* ---------- Gemini cagrisi ---------- */

  async function callGemini(req, provider){
    const key = req.key;
    if(!key) throw fail('no_key');
    const base = req.endpoint || provider.endpoint;
    const stream = !!req.onText;
    const path = base.replace(/\/$/, '') + '/' + encodeURIComponent(req.model) + ':'
      + (stream ? 'streamGenerateContent?alt=sse&key=' : 'generateContent?key=')
      + encodeURIComponent(key);

    const contents = (req.messages || []).map(m => ({
      role:m.role === 'assistant' ? 'model' : 'user',
      parts:[{ text:m.text }],
    }));

    const body = {
      contents,
      generationConfig:{
        maxOutputTokens:req.maxTokens || DEFAULT_MAX_TOKENS,
        temperature:req.temperature == null ? 0.4 : req.temperature,
      },
    };
    /* 2.5 ailesinde "dusunme" ayni butceden yer: acik birakilirsa model
       butceyi dusunerek harcar ve cevap YARIM ya da bos doner. Ofis
       ajanlari kisa konusur, dusunmeye ihtiyaclari yok — kapatilir.
       Alan yalniz destekleyen modele gonderilir; digerleri 400 verir. */
    if(/2\.5.*flash/i.test(String(req.model || ''))){
      body.generationConfig.thinkingConfig = { thinkingBudget:0 };
    }
    if(req.system) body.systemInstruction = { parts:[{ text:req.system }] };

    const guard = withTimeout(req.signal, req.timeout);
    let response;
    try{
      response = await fetch(path, {
        method:'POST',
        headers:{ 'Content-Type':'application/json' },
        signal:guard.signal,
        body:JSON.stringify(body),
      });
    }catch(e){
      guard.done();
      if(guard.timedOut()) throw fail('timeout');
      if(req.signal && req.signal.aborted) throw fail('cancelled');
      throw fail(networkCode(), e && e.message);
    }

    if(!response.ok){
      const detail = await errorMessage(response);
      const code = codeForStatus(response.status);
      guard.done();
      if(code === 'rate_limited'){
        ESP.Quota.penalize({ provider:provider.id, model:req.model, keyId:req.keyId }, retryAfterSeconds(response));
      }
      throw fail(code, detail);
    }

    function partsText(obj){
      const cand = obj.candidates && obj.candidates[0];
      const parts = cand && cand.content && cand.content.parts;
      /* Dusunme parcalari metin degildir; cevaba karistirilmaz. */
      return (parts || []).filter(p => !p.thought).map(p => p.text || '').join('');
    }
    function finishOf(obj){
      const cand = obj.candidates && obj.candidates[0];
      return (cand && cand.finishReason) ? String(cand.finishReason) : '';
    }

    let text = '';
    let finish = '';
    try{
      const ctype = response.headers.get('content-type') || '';
      if(stream && ctype.indexOf('event-stream') >= 0){
        await readSSE(response, obj => {
          const f = finishOf(obj);
          if(f) finish = f;
          const delta = partsText(obj);
          if(!delta) return;
          text += delta;
          req.onText({ text, delta });
        });
      }else{
        const json = await response.json();
        const list = Array.isArray(json) ? json : [json];
        text = list.map(partsText).join('');
        list.forEach(o => { const f = finishOf(o); if(f) finish = f; });
        if(req.onText && text) req.onText({ text, delta:text });
      }
    }catch(e){
      if(guard.timedOut()){ guard.done(); throw fail('timeout'); }
      if(req.signal && req.signal.aborted){ guard.done(); throw fail('cancelled'); }
      guard.done();
      throw fail('server', e && e.message);
    }
    guard.done();

    text = text.trim();
    if(!text) throw fail('empty');
    return { text, finish };
  }

  /* ---------- kamu API ---------- */
