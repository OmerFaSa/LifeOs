     `python3 tools/seviye.py --yay` ile uretilir; ELLE DUZENLEME -->
<!-- MARKA GİRİŞİ — logo videosu, geçilebilir.

     Perde burada DURAĞAN durur; sayfanın ilk boyamasında görünür.
     JavaScript'i beklemek, açılışta bir kare boş ekran demekti.
     Davranışı (ses, «Geç» halkası, Esc, odak hapsi, hata durumunda
     kapanma) `js/core/perde.js` takar — seviye kutlamasıyla AYNI koddur.

     Gerçek açılışı (aşağıdaki .boot) ETKİLEMEZ: ayrı, üstte duran bir
     katmandır; ikisi paralel çalışır, biri diğerini beklemez.

     LOGO, VİDEO DEĞİL. Önce `img/brand/intro.mp4` oynuyordu; depo
     sahibi kaldırdı: «bölüm girişlerindeki o giriş videosunu kaldır,
     bu logolar sadece». Video sekiz saniye tutuyordu, logo ÜÇ saniye
     durur — bir açılış ekranı bilgilendirmez, yalnız kimliği söyler;
     üç saniye onu söylemeye yeter, sekiz saniye beklemeye başlar.

     Dosya `img/marka/kimlik-esp.webp` — her sistem kendi logosunu
     gösterir ve ad yer tutucudan gelir, üç yerde ayrı yazılmaz. -->
<!-- KARŞILAMA (kullanıcı, 2026-10-18): logonun yerine italik selam ve altında
     küçük yazıyla bölümün o anki notu (brand/ortak/karsilama.js). Selam ve not
     karsilama.js yüklenince yazılır; yüklenmezse 0,7 sn sonra varsayılan selam
     görünür. Not modülün KENDİ kural cümlesidir ya da kullanıcının notu. -->
<div id="marka-perde" class="perde perde--marka perde--karsilama" role="dialog" aria-modal="true"
  aria-label="Karşılama">
  <div class="karsilama" aria-live="polite">
    <p class="karsilama__selam">Hoş geldin</p>
    <span class="karsilama__cizgi" aria-hidden="true"></span>
    <p class="karsilama__not" hidden></p>
  </div>
  <div class="perde__araclar">
    <!-- Ses düğmesi YOK: logonun sesi yoktur. Video kalkınca onunla
         birlikte kalktı. -->
    <button class="perde__dugme perde__gec" type="button" aria-label="Geç (Esc)" title="Geç — Esc">
      <span class="perde__gec-halka" aria-hidden="true">
        <svg viewBox="0 0 32 32"><circle class="perde__gec-iz" cx="16" cy="16" r="14"/>
          <circle class="perde__gec-yol" cx="16" cy="16" r="14"/></svg>
        <span class="perde__gec-sayi">·</span></span>
      <span class="perde__gec-yazi">Geç</span>
    </button>
  </div>
</div>
<!-- Perde modulu markupin HEMEN ARDINDAN yuklenir. <head>'de blokleyici
     bir betik olarak durursa, durağan perdenin ilk boyamasını da o
     geciktirir — yani markupin durağan olmasinin sebebini ortadan
     kaldirirdi. -->
<script src="js/core/perde.js"></script>
<script>
(function(){
  var el = document.getElementById('marka-perde');
  if(!el) return;
  /* Hareket azaltma tercihinde marka girisi HIC gorunmez. Karar LifeOS'un
     KENDI Animasyonlar ayaridir (brand/ortak/animasyon.js: depo, sonra cerez,
     yoksa Tam), tarayicinin «azalt» cevabi degil: Windows'ta animasyon
     kapaliyken tarayici hep «azalt» der. Tek dosya surumunde (dist) betikler
     sayfanin sonundadir; burasi animasyon.js'ten ONCE calisir ve tarayicinin
     cevabini goruyordu — LifeOS.exe'de perde hic acilmiyordu (2026-10-18,
     kullanici: «AYS'ye gectigimde hala ikon geliyor, merhaba yazmiyor»). */
  try{
    var kip = null;
    try{ kip = localStorage.getItem('lifeos.hareket'); }catch(e){}
    if(!/^(tam|az|sistem)$/.test(kip || '')){ var cm = /(?:^|;\s*)lifeos_hareket=(tam|az|sistem)/.exec(document.cookie || ''); kip = cm ? cm[1] : null; }
    if(!kip){ var wd = false; try{ wd = !!navigator.webdriver; }catch(e){} kip = wd ? 'sistem' : 'tam'; }
    var az = kip === 'az' || (kip === 'sistem' && window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
    if(az){
      if(el.parentNode) el.parentNode.removeChild(el);
      return;
    }
  }catch(e){}
  /* KURTARMA: Perde modulu hic yuklenmezse (betik hatasi, engellenmis
     dosya) perde uygulamayi rehin almasin. */
  var kurtarma = setTimeout(function(){
    if(el.parentNode) el.parentNode.removeChild(el);
  }, 14000);
  /* Kaynak surumde ustteki <script src> bu satira gelinmeden calismis
     olur ve dongu ILK denemede biter. TEK DOSYA surumunde (dist) ise
     build.py butun <script src>'leri govdenin ARDINA tasir: orada
     Perde bu betikten SONRA tanimlanir ve bekleme gercekten calisir.
     Iki surumun tek markupla yasamasinin bedeli bu kucuk dongudur. */
  var deneme = 0, kars = el.querySelector('.karsilama'), yazildi = false;
  /* Karşılama yazılamazsa (betik yok) varsayılan selam görünür. */
  setTimeout(function(){ if(kars && !yazildi) kars.classList.add('is-yedek'); }, 700);
  /* Selam ayrı bekler: kaynak sürümde perde.js hemen, karsilama.js sayfanın
     aşağısında yüklenir; tek dosya sürümünde ikisi de sonda. */
  var kDeneme = 0;
  (function selamBekle(){
    if(!kars || yazildi) return;
    if(window.LIFEOS && LIFEOS.KARSILAMA){
      try{ yazildi = LIFEOS.KARSILAMA.perdeyeYaz(kars, 'esp'); }catch(e){ yazildi = true; kars.classList.add('is-yedek'); }
      return;
    }
    if(++kDeneme > 100) return;   /* ~3 sn; yedek selam devrede */
    setTimeout(selamBekle, 30);
  })();
  (function bekle(){
    if(window.ESP && ESP.Perde){
      clearTimeout(kurtarma);
      /* Geçişle gelindiyse kısa (perde.js markaSuresi). */
      ESP.Perde.baglan(el, { enAz:ESP.Perde.markaSuresi ? ESP.Perde.markaSuresi() : 3000 });
      return;
    }
    if(++deneme > 400) return;   /* ~12 sn; kurtarma zamanlayicisi devrede */
    setTimeout(bekle, 30);
  })();
})();
</script>
