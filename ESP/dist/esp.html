/* ==== css/tokens.css ==== */
/* TEK TASARIM TOKEN KAYNAĞI.

   Kategoriler: surface · text · primary/accent/danger/info · border · shadow
   · radius · spacing · type-scale · motion · z-index

   Kural: bileşenler yalnız bu değişkenleri kullanır; ham renk/ölçü yazılmaz.
   Ayrıntı ve gerekçe için src/STIL.md.

   KOYU PALET TEK YERDE. Aşağıdaki `--d-*` jetonları koyu temanın renklerini
   bir kez tanımlar; iki uygulama bloğu (sistem tercihi ve açık seçim) yalnız
   eşlemeyi tekrarlar. Böylece bir rengi değiştirmek için tek satır yeter ve
   iki blok birbirinden kayamaz. */

:root{
  /* ---- yüzeyler ---- */
  /* Notrler saf gri degil, cok hafif sicak. Saf gri ekranda klinik ve
     ucuz durur; bir derece sicaklik ayni duzeni pahali gosterir. */
  /* Zemin kâğıt gibi: hafif sıcak, kırık beyaz. Saf gri bir zemin
     ekranda klinik ve ucuz durur; bir derece sıcaklık aynı düzeni
     pahalı gösterir. */
  --bg:#F7F5F1;
  --surface:#FFFFFF;
  --surface-2:#F2EFE9;
  --surface-3:#E7E2D9;
  --sidebar:#FFFFFF;
  --sidebar-active:#E3EBE6;

  /* Fare üstü yüzeyi TÜRETİLİR: yüzey ile zemin arasında bir adım.
     Elle yazılsaydı yedi paletin her birinde ayrıca tanımlanması
     gerekirdi ve biri unutulduğunda o palette sıcak/soğuk kayması
     olurdu — nitekim oluyordu. */
  --surface-hover:color-mix(in oklab, var(--surface) 58%, var(--bg));

  /* ---- metin ---- */
  --text:#191815;
  --text-2:#54524C;   /* AA: --bg üzerinde 7.1:1 */
  --text-3:#6E6B63;   /* AA: 4.9:1 — küçük ikincil metin */

  /* ---- anlam renkleri (dört tane; gerisi nötr) ----
     Ana renk derin yeşil: sağlıkla ilişkili, doygun ama bağırmayan bir
     renk. Mavi-mor bir arayüz her yönetim panelinin varsayılanıdır ve
     kimlik taşımaz. */
  --primary:#1F4E3D;       /* AA: beyaz üzerinde 8.9:1 */
  --primary-hover:#173E30;
  --primary-ink:#FFFFFF;
  --accent:#8A5A18;        /* AA: beyaz üzerinde 5.7:1 */

  /* Durum renkleri PALETE GÖRE DEĞİŞMEZ. Bir tahlil sonucunun rengi
     hangi tema seçildiğine göre değişemez — sağlık verisinde bu kabul
     edilemez. */
  --danger:#9B3327;        /* AA: beyaz üzerinde 6.6:1 */
  --info:#3A5468;          /* AA: beyaz üzerinde 8.0:1 */

  /* ---- yumuşak zeminler: TÜRETİLİR ----

     Bir uyarı kutusunun zemini, rengin KENDİ yüzeyine karışmış hâlidir.
     Elle yazıldığında her palette ayrıca tanımlanması gerekiyordu ve
     unutuluyordu: bordo temada bilgi kutuları varsayılan paletin soğuk
     gri-mavisini alıyor, sıcak bir sayfada yabancı bir beyaz gibi
     duruyordu. Türetince her palet kendi doğru tonunu alıyor. */
  --primary-soft:color-mix(in oklab, var(--primary) 13%, var(--surface));
  --accent-soft:color-mix(in oklab, var(--accent) 13%, var(--surface));
  --danger-soft:color-mix(in oklab, var(--danger) 12%, var(--surface));
  --info-soft:color-mix(in oklab, var(--info) 11%, var(--surface));

  /* ---- mürekkep ----
     Sayfayı sonlandıran koyu bant ve marka işareti. Saf siyah değil:
     paletin ANA RENGİYLE tonlanmış çok koyu bir renk. Böylece hangi
     palet seçilirse seçilsin alt bant o paletin ailesinden olur —
     sabit bir koyu yeşil, mavi bir palette yabancı duruyordu. */
  --ink:color-mix(in oklab, var(--primary) 24%, #0C0C0A);
  --ink-2:color-mix(in oklab, var(--ink) 84%, var(--text));
  --ink-on:color-mix(in oklab, var(--bg) 88%, #FFFFFF);
  --ink-on-2:color-mix(in oklab, var(--ink-on) 58%, var(--ink));

  /* ---- çizgi ---- */
  --border:#E7E2D9;
  --border-strong:#CDC6B8;
  /* Cetvelin ekseni kenarlıkla aynı aileden olmalı; ayrı bir sabit
     renk yazmak paletler arasında kayma üretiyordu. */
  --rule:var(--border-strong);

  /* ---- odak halkası: her temada görünür kalır ---- */
  --ring:color-mix(in srgb, var(--primary) 45%, transparent);

  /* ---- makro renkleri ----
     Kimlik taşır, durum değil: protein/yağ/karbonhidrat şeridinde hangi
     dilimin ne olduğunu söyler. Şeridin yanında her zaman yazılı etiket durur,
     çünkü renk tek başına anlam taşımaz. */
  --macro-protein:#1F4E3D;
  --macro-fat:#8A5A18;
  --macro-carb:#3A5468;

  /* ---- ofis ajanları: beş ayırt edici kimlik rengi ----
     Avatar zemini olarak kullanılır, harf --agent-ink ile yazılır.
     Ölçülen kontrast (beyaz harf üzerinde): 5,3–8,9:1 — hepsi AA. */
  --agent-patron:#1F4E3D;
  --agent-lab:#2F5D7C;
  --agent-nutri:#8A5A12;
  --agent-move:#4A6B2C;
  --agent-money:#8C3B62;
  --agent-ink:#FFFFFF;
  --c-grid:#E7E2D9;
  --c-band:#E0E9E4;

  /* ---- gölge: iki seviye, ikisi de yumuşak ----
     Kart gölgesi bir kenarlık kadar sessizdir; derinliği kenarlık değil
     iki katmanlı çok düşük opaklık verir. */
  --shadow:0 1px 2px rgba(16,18,27,.04), 0 4px 12px rgba(16,18,27,.045);
  --shadow-lg:0 20px 52px rgba(16,18,27,.18);

  /* ---- yarıçap: iki seviye + hap ---- */
  --r-sm:9px;
  --r:16px;
  --r-pill:999px;

  /* ---- boşluk: 8px ritmi ---- */
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px;
  --sp-6:24px; --sp-8:32px; --sp-10:40px;

  /* ---- tipografi: 3 aile, her birinin tek işi var ----

     serif    yalnız BAŞLIK (hero h1, bölüm h2). Editoryal ağırlık verir
              ve arayüzü bir panelden çok bir yayına benzetir.
     display  yalnız SAYI ve kart başlığı. Tabular rakamlar hizalanır.
     body     geri kalan her şey.

     Kural: serif hiçbir yerde sayı taşımaz, display hiçbir yerde
     paragraf taşımaz. Karıştırıldığında ikisi de amatörleşir. */
  --font-serif:'Newsreader', Georgia, 'Times New Roman', serif;
  --font-display:'Manrope', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-body:'Inter', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  --fs-xs:11.5px;
  --fs-sm:12.75px;
  --fs-base:14px;
  --fs-md:15.5px;
  --fs-lg:19px;
  --fs-xl:24px;
  --fs-hero:30px;     /* yalnız KPI sayısı */
  --fs-display:40px;  /* yalnız bölüm başlığı (hero) */

  /* ---- hareket: tek easing, iki süre ---- */
  --ease:cubic-bezier(.2,.7,.3,1);
  --dur:160ms;
  --dur-lg:220ms;

  /* Katman perdesi: açık ve koyu temada aynı koyulukta okunur. */
  --scrim:rgba(14,15,22,.46);

  /* ---- katman ---- */
  --z-nav:30; --z-topbar:25; --z-overlay:60; --z-toast:80;

  /* ---- düzen ---- */
  --sidebar-w:236px;
  --nav-h:47px;   /* yalnız numaralı bölüm şeridi yapışır */
  --topbar-h:60px;
  --content-max:1180px;

  /* Defter düzeninin künye sütunu. Ölçü sabittir: sayfadan sayfaya
     kayan bir sol sütun, defter hissini bozar. */
  --gutter:196px;
  --gutter-gap:52px;

  /* ================= KOYU PALET — tek tanım =================
     Buradaki değerler yalnızca aşağıdaki iki blokta kullanılır. */
  --d-bg:#12120F;
  --d-surface:#1A1A16;
  --d-surface-2:#21211C;
  --d-surface-3:#2A2A24;
  --d-surface-hover:#1F1F1A;
  --d-sidebar:#161612;
  --d-sidebar-active:#1E2C25;

  --d-text:#EFEDE7;
  --d-text-2:#ACA89E;
  --d-text-3:#8B877D;

  --d-primary:#7FBFA0;
  --d-primary-hover:#95CFB2;
  --d-primary-ink:#0E1611;
  --d-accent:#D6A961;
  --d-danger:#E28C7C;
  --d-info:#8FADC2;

  --d-border:#2B2B25;
  --d-border-strong:#3B3B33;
  --d-rule:var(--d-border-strong);

  --d-macro-protein:#7FBFA0;
  --d-macro-fat:#D6A961;
  --d-macro-carb:#8FADC2;

  --d-agent-patron:#7FBFA0;
  --d-agent-lab:#8FADC2;
  --d-agent-nutri:#D6A961;
  --d-agent-move:#B6CE7E;
  --d-agent-money:#DE9CC0;
  --d-agent-ink:#0E1611;
  --d-c-grid:#2B2B25;
  --d-c-band:#1E2C25;

  --d-shadow:0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3);
  --d-shadow-lg:0 22px 60px rgba(0,0,0,.62);
  --d-scrim:rgba(0,0,0,.64);
}

/* Koyu eşleme — iki blok, aynı liste. Renkler yukarıda tek yerde durur. */
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:var(--d-bg);
    --surface:var(--d-surface);
    --surface-2:var(--d-surface-2);
    --surface-3:var(--d-surface-3);
    --sidebar:var(--d-sidebar);
    --sidebar-active:var(--d-sidebar-active);
    --text:var(--d-text);
    --text-2:var(--d-text-2);
    --text-3:var(--d-text-3);
    --primary:var(--d-primary);
    --primary-hover:var(--d-primary-hover);
    --primary-ink:var(--d-primary-ink);
    --accent:var(--d-accent);
    --danger:var(--d-danger);
    --info:var(--d-info);
    --border:var(--d-border);
    --border-strong:var(--d-border-strong);
    --rule:var(--d-rule);
    /* Koyu temada mürekkep zeminden DAHA koyudur; ana renk açık
       olduğu için ondan türetilemez. */
    --ink:color-mix(in oklab, var(--bg) 74%, #000000);
    --ink-2:color-mix(in oklab, var(--ink) 82%, var(--text));
    --ink-on:var(--text);
    --ink-on-2:var(--text-3);
    --macro-protein:var(--d-macro-protein);
    --macro-fat:var(--d-macro-fat);
    --macro-carb:var(--d-macro-carb);
    --agent-patron:var(--d-agent-patron);
    --agent-lab:var(--d-agent-lab);
    --agent-nutri:var(--d-agent-nutri);
    --agent-move:var(--d-agent-move);
    --agent-money:var(--d-agent-money);
    --agent-ink:var(--d-agent-ink);
    --c-grid:var(--d-c-grid);
    --c-band:var(--d-c-band);
    --shadow:var(--d-shadow);
    --shadow-lg:var(--d-shadow-lg);
    --scrim:var(--d-scrim);
  }
}

:root[data-theme="dark"]{
  --bg:var(--d-bg);
  --surface:var(--d-surface);
  --surface-2:var(--d-surface-2);
  --surface-3:var(--d-surface-3);
  --sidebar:var(--d-sidebar);
  --sidebar-active:var(--d-sidebar-active);
  --text:var(--d-text);
  --text-2:var(--d-text-2);
  --text-3:var(--d-text-3);
  --primary:var(--d-primary);

/* ================= BÖLÜM KİMLİKLERİ =================

   Tek tasarım, yedi imza. Düzen, tipografi, boşluk ve bileşenler her
   bölümde AYNIDIR; değişen tek şey `--sec` — bölümün kendi rengi.

   Renk iki parçadan gelir:

     --sec-base   bölümün kendi tonu (adaçayı, klinik mavi, kehribar…)
     --sec        o tonun, SEÇİLİ PALETİN ana rengiyle harmanlanmışı

   Harmanlama kasıtlıdır. Sabit yedi renk, bordo ya da okyanus paleti
   seçildiğinde o paletle kavga ediyordu: sayfa iki ayrı tasarımdan
   yapılmış gibi duruyordu. Harmanlanan tonlar hem birbirinden ayrılır
   hem de seçili paletin ailesinden olur.

   Oran %70/%30: bölüm kimliği baskın kalır, palet yalnız tonlar.

   `--sec` yalnız beş yerde görünür — bölüm numarası, etkin sekme
   çizgisi, bölüm başlığının üstündeki kısa çizgi, ana düğme ve bölüm
   imzası. Renk içeriğe bulaşmaz; durum renkleri (ok/warn/danger) her
   bölümde ve her palette aynıdır. Aksi hâlde bir tahlil sonucunun rengi
   hangi bölümde olduğuna göre değişirdi ve bu, sağlık verisinde kabul
   edilemez. */

:root{
  --sec-base:var(--primary);
  --sec:color-mix(in oklab, var(--sec-base) 70%, var(--primary));
  --sec-soft:color-mix(in oklab, var(--sec) 14%, var(--surface));
}

:root[data-section="gunluk"]  { --sec-base:#2F6B52; }
:root[data-section="testler"] { --sec-base:#2E5A73; }
:root[data-section="besin"]   { --sec-base:#8A5A18; }
:root[data-section="hareket"] { --sec-base:#9A4A2F; }
:root[data-section="finans"]  { --sec-base:#5E6B2A; }
:root[data-section="ofis"]    { --sec-base:#6B3F63; }
:root[data-section="ayarlar"] { --sec-base:#5A5750; }

/* Koyu temada aynı yedi ton açılır: koyu zeminde doygun ton okunmaz.
   Harmanlama kuralı aynı kalır, yalnız taban renk değişir. */

}

/* ==== css/base.css ==== */
/* Sifirlama, tipografi ve erisilebilirlik temelleri (WCAG 2.2 AA hedefi). */

*, *::before, *::after{ box-sizing:border-box; }

html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  font-size:var(--fs-base);
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}

@media (max-width:640px){
  body{ font-size:15px; }
}

h1,h2,h3,h4,h5{
  font-family:var(--font-display);
  margin:0;
  line-height:1.25;
  text-wrap:balance;
  letter-spacing:-0.011em;
}
h1{ font-size:var(--fs-xl); font-weight:800; }
h2{ font-size:var(--fs-lg); font-weight:700; }
h3{ font-size:var(--fs-md); font-weight:700; }
h4{ font-size:var(--fs-base); font-weight:700; }

p{ margin:0; }
ul,ol{ margin:0; padding-left:1.15em; }
li{ margin:2px 0; }

button, input, select, textarea{
  font-family:inherit;
  font-size:inherit;
  color:inherit;
}
button{ cursor:pointer; }

a{ color:var(--primary); text-decoration-thickness:1px; text-underline-offset:2px; }
a:hover{ color:var(--primary-hover); }

:focus-visible{
  outline:2px solid var(--primary);
  outline-offset:2px;
  border-radius:4px;
}

::selection{ background:var(--primary); color:var(--primary-ink); }

hr{ border:none; border-top:1px solid var(--border); margin:var(--sp-4) 0; }

/* sayisal veride hizali rakam (plan 8.2) */
.num{ font-variant-numeric:tabular-nums; font-feature-settings:"tnum"; }

.mono-label{
  font-size:var(--fs-xs);
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  color:var(--text-3);
}

.muted{ color:var(--text-2); }
.dim{ color:var(--text-3); }
.small{ font-size:var(--fs-sm); }
.tiny{ font-size:var(--fs-xs); }
.strong{ font-weight:700; }
.center{ text-align:center; }
.right{ text-align:right; }
.nowrap{ white-space:nowrap; }
.truncate{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hidden{ display:none !important; }

/* Klavye kullanicisi icin icerige atlama baglantisi */
.skiplink{
  position:fixed; top:8px; left:8px; z-index:calc(var(--z-toast) + 1);
  padding:9px 14px; border-radius:var(--r-sm);
  background:var(--primary); color:var(--primary-ink);
  font-weight:700; font-size:var(--fs-sm); text-decoration:none;
  transform:translateY(-160%);
  transition:transform var(--dur) var(--ease);
}
.skiplink:focus{ transform:translateY(0); color:var(--primary-ink); }

.sr-only{
  position:absolute; width:1px; height:1px; padding:0; margin:-1px;
  overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0;
}

/* ince kaydirma cubugu */
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{ background:var(--border-strong); border-radius:8px; border:3px solid var(--bg); }
*::-webkit-scrollbar-thumb:hover{ background:var(--text-3); }

@media (prefers-reduced-motion:reduce){
  *, *::before, *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}

/* acilis ekrani */
.boot{
  min-height:100vh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:var(--sp-4); color:var(--text-2);
}
.boot__mark{
  width:46px; height:46px; border-radius:14px;
  background:var(--primary); color:var(--primary-ink);
  display:grid; place-items:center;
  font-family:var(--font-display); font-weight:800; font-size:22px;
}
.boot__bar{ width:180px; height:3px; border-radius:3px; background:var(--surface-3); overflow:hidden; }
.boot__bar span{ display:block; width:40%; height:100%; background:var(--primary); animation:boot-slide 1.1s ease-in-out infinite; }
@keyframes boot-slide{ 0%{transform:translateX(-100%);} 100%{transform:translateX(350%);} }
.boot__text{ font-size:var(--fs-sm); }


/* ================= zanaat detayları =================

   Bu blok yeni bir bileşen eklemez; var olanların okunuşunu düzeltir.
   Bir arayüzü "yapılmış" değil "tasarlanmış" gösteren şey bunlardır. */

/* Değişken serif'in optik boyutu: büyük puntoda ince ve zarif, küçük
   puntoda kalın ve okunur çizilir. Sabit bir kesim her iki boyutta da
   ödün verir. */
.hero__title, .sect__h h2, .card__head h3, .brand__text b, .navsheet__item b{
  font-optical-sizing:auto;
  font-variation-settings:'opsz' 40;
}
.card__head h3, .brand__text b{ font-variation-settings:'opsz' 20; }

/* Sayılar: tabular genişlik + çizgili sıfır. Bir ölçüm listesinde 0 ile
   O'nun karışması kabul edilemez. */
.num, .herostat__value, .kpi__value, .resrow__val, .entryrow__in,
table td, table th{
  font-variant-numeric:tabular-nums slashed-zero;
  font-feature-settings:'tnum' 1, 'zero' 1;
}

/* Uzun cümleler dengeli sarar: son satırda tek kelime kalmaz. */
.hero__lede, .sect__h p, .card__head p{ text-wrap:pretty; }

/* Odak halkası bölümün renginde ve gövdeden ayrık. Tarayıcı
   varsayılanı kalın ve kutu biçimlidir; burada ince ve boşluklu. */
:where(a, button, input, select, textarea, [tabindex]):focus-visible{
  outline:2px solid var(--sec);
  outline-offset:2px;
  border-radius:var(--r-sm);
}

/* Seçim rengi de bölümden gelir. */
::selection{ background:var(--sec-soft); color:var(--text); }

/* Kaydırma çubuğu içeriğin bir parçası gibi durur, sistem eklentisi
   gibi değil. */
* { scrollbar-width:thin; scrollbar-color:var(--border-strong) transparent; }
*::-webkit-scrollbar{ width:10px; height:10px; }
*::-webkit-scrollbar-track{ background:transparent; }
*::-webkit-scrollbar-thumb{
  background:var(--border-strong); border-radius:10px;
  border:3px solid var(--bg);
}
*::-webkit-scrollbar-thumb:hover{ background:var(--text-3); }

/* Sayfanın en üstünde bölümün renginde çok ince bir şerit. Hangi
   bölümde olunduğunu, gezinmeye bakmadan, kenardan söyler. */
.site::before{
  content:''; position:fixed; top:0; left:0; right:0; height:2px;
  background:var(--sec); z-index:calc(var(--z-nav) + 1);
}

/* Sayfa değişiminde içerik altı piksel yükselerek gelir. Geçişin
   kendisi görünmez; görünen tek şey, sayfanın "yerleşmiş" olmasıdır. */
@keyframes content-in{
  from{ opacity:0; transform:translateY(6px); }
  to{ opacity:1; transform:none; }
}
.content{ animation:content-in var(--dur-lg) var(--ease); }

/* ---------- görünüm geçişi ----------

   Tarayıcı destekliyorsa bölümler arası geçiş tarayıcının kendi
   katmanında yapılır: eski sayfa söner, yeni sayfa hafifçe yükselerek
   gelir. Künye ve gezinme geçişe KATILMAZ — yerinde duran bir çerçeve
   sayfanın değiştiğini daha net anlatır, her şeyin birden kaybolması
   ise yön duygusunu siler. */
::view-transition-old(root){ animation:vt-out 160ms var(--ease) both; }
::view-transition-new(root){ animation:vt-in 240ms var(--ease) both; }
@keyframes vt-out{ to{ opacity:0; } }
@keyframes vt-in{ from{ opacity:0; transform:translateY(8px); } }

/* Düğmeye basınca hafif çöker: dokunmanın karşılığı görünür olur. */
.btn:active, .subtab:active, .navlink:active, .pagelink:active,
.iconbtn:active, .mic:active{ transform:translateY(.5px) scale(.985); }

/* Kart, fare üstündeyken kenarlığını belirginleştirir — gölge değil.
   Yalnız TIKLANABILIR kartlarda; okunacak bir kart fareye tepki vermez. */
.pickcard, .resrow, .suggfood, .navsheet__item, .listitem button{
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease),
             transform var(--dur) var(--ease);
}

@media (prefers-reduced-motion:reduce){
  .content{ animation:none; }
  ::view-transition-old(root), ::view-transition-new(root){ animation:none; }
  .btn:active, .subtab:active, .navlink:active, .pagelink:active,
  .iconbtn:active, .mic:active{ transform:none; }
}

/* ==== css/layout.css ==== */
/* Uygulama kabuğu — panel değil SİTE düzeni.

   Önceki düzen bir yönetim panelinin diliyle konuşuyordu: solda sabit bir
   menü sütunu, üstte bir başlık çubuğu, altta üst üste yığılmış kartlar.
   O dil bir araç kutusuna yakışır; günde birkaç kez açılıp okunan kişisel
   bir sağlık sistemine değil.

   Yeni düzen üç parçadır:

     sitenav   ince, yapışkan üst gezinme — yedi bölüm, tek satır
     hero      her bölümün açılış bandı: ne olduğu tek cümlede yazar
     sect      içeriğin nefes alan bölümleri, kart yığını değil

   Kural: içerik ORTALANIR ve genişliği sınırlıdır (--content-max). Ekran
   büyüdükçe satırlar uzamaz, kenar boşluğu büyür. Uzun satır okunmaz. */

/* ---------- kabuk ---------- */
.site{
  min-height:100vh;
  display:flex; flex-direction:column;
  background:var(--bg);
}
.site__body{ flex:1; min-width:0; }

/* Ortalayıcı: her bant kendi zeminini tam genişlikte boyar, içeriğini
   ortada tutar. Böylece hero'nun zemini kenara kadar gider ama yazısı
   içerikle aynı hizada başlar. */
.wrapc{
  width:100%;
  max-width:var(--content-max);
  margin-inline:auto;
  padding-inline:32px;
}

/* ---------- künye: kimlik satırı ----------

   Bu satır YAPIŞMAZ. Okurken kimliğe ihtiyaç yoktur, gezinmeye vardır;
   kimlik satırının kaymasına izin vermek sabit çubuğu yarı yüksekliğe
   indirir ve içeriğe yer açar. */
.masthead{ background:var(--bg); }
.masthead__in{
  height:64px;
  display:flex; align-items:center; gap:20px;
}

.brand{
  display:flex; align-items:center; gap:11px;
  border:none; background:none; padding:0;
  min-width:0; flex:none;
}
.brand__mark{
  width:30px; height:30px; border-radius:50%; flex:none;
  background:var(--ink); color:var(--ink-on);
  display:grid; place-items:center;
  font-family:var(--font-serif); font-weight:500; font-size:15px;
  letter-spacing:0; line-height:1;
}
.brand__text{ display:flex; flex-direction:column; line-height:1.1; min-width:0; text-align:left; }
.brand__text b{
  font-family:var(--font-serif); font-size:19px; font-weight:500;
  letter-spacing:.015em; color:var(--text);
}
.brand__text span{
  font-size:10px; font-weight:500; letter-spacing:.09em; text-transform:uppercase;
  color:var(--text-3); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

/* Tarih künyenin ortasında durur — bir gazetenin tarih satırı gibi. */
.masthead__date{
  flex:1; min-width:0;
  display:flex; align-items:baseline; justify-content:center; gap:9px;
  white-space:nowrap; overflow:hidden;
}
.masthead__day{
  font-family:var(--font-serif); font-size:14px; color:var(--text-2);
}
.masthead__wd{
  font-size:10px; font-weight:500; letter-spacing:.11em; text-transform:uppercase;
  color:var(--text-3);
}

/* Araçlar HER ZAMAN sağ uçta durur. Aradaki tarih esneyen ögedir ve
   dar ekranda (ya da «Odak» düzeninde) gizleniyor; o zaman itecek bir
   şey kalmadığı için araçlar markanın dibine yığılıyordu. `auto` kenar
   boşluğu bunu esneyen ögeye bağlı olmaktan çıkarır. */
.navtools{ display:flex; align-items:center; gap:2px; flex:none; margin-left:auto; }
.navtools__sep{ width:1px; height:20px; background:var(--border); margin:0 4px; flex:none; }
.sitenav__menu{ display:none; }

/* ---------- künye: numaralı bölüm şeridi ----------

   Yapışan tek parça budur. Numara süs değil: yedi bölümün SIRASI
   anlamlıdır (önce yazılan, sonra okunan) ve numara o sırayı görünür
   kılar. */
.sitenav{
  position:sticky; top:0; z-index:var(--z-nav);
  background:color-mix(in srgb, var(--bg) 96%, transparent);
  backdrop-filter:saturate(1.3) blur(16px);
  border-block:1px solid var(--border);
}
.navlinks{
  display:flex; align-items:stretch; gap:0;
  overflow-x:auto; scrollbar-width:none;
}
.navlinks::-webkit-scrollbar{ display:none; }

.navlink{
  position:relative;
  flex:0 0 auto;
  display:inline-flex; align-items:baseline; gap:8px;
  padding:13px 22px 13px 0;
  margin-right:6px;
  border:none; background:none;
  color:var(--text-3);
  transition:color var(--dur) var(--ease);
}
.navlink svg{ display:none; }
.navlink__num{
  font-family:var(--font-display); font-size:10px; font-weight:600;
  letter-spacing:.06em; font-variant-numeric:tabular-nums;
  color:var(--text-3); opacity:.7;
}
.navlink__label{
  font-size:13.5px; font-weight:500; letter-spacing:.005em; white-space:nowrap;
}
.navlink:hover{ color:var(--text-2); }
.navlink:hover .navlink__num{ opacity:1; }
.navlink.is-active{ color:var(--text); }
.navlink.is-active .navlink__label{ font-weight:600; }
.navlink.is-active .navlink__num{ color:var(--primary); opacity:1; }
/* Etkin bölümün altındaki çizgi numarayı da kapsar. */
.navlink.is-active::after{
  content:''; position:absolute; left:0; right:22px; bottom:-1px; height:2px;
  background:var(--primary);
}
.navlink__badge{
  align-self:center;
  min-width:16px; height:16px; padding:0 5px; border-radius:var(--r-pill);
  background:var(--danger); color:#fff;
  font-size:10px; font-weight:700; line-height:16px; text-align:center;
}
.navlink__badge.is-quiet{ background:var(--surface-3); color:var(--text-2); }

/* ---------- hero ----------

   Sayfanın açılışı: bölüm imzası, tek cümlelik durum, ne yapılacağı ve
   özet sayılar. Zemin yok — tek ayırıcı ince çizgidir. */
/* Hero'nun sağ üst köşesinde bölüm numarası, çok soluk ve çok büyük.
   Bir yayının bölüm sayfalarındaki numara gibi: okunmak için değil,
   sayfaya ağırlık ve yer duygusu vermek için. */
.hero{ position:relative; border-bottom:1px solid var(--border); overflow:hidden; }
.hero::before{
  content:attr(data-num);
  position:absolute; top:-14px; right:max(32px, calc((100% - var(--content-max)) / 2 + 32px));
  font-family:var(--font-serif); font-size:150px; font-weight:500;
  line-height:1; letter-spacing:-.045em;
  color:var(--sec); opacity:.06;
  pointer-events:none; user-select:none;
}
@media (max-width:1060px){ .hero::before{ font-size:118px; top:-8px; right:20px; } }
@media (max-width:560px){ .hero::before{ display:none; } }
.hero__in{
  padding-block:46px 34px;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  align-items:end; gap:24px 56px;
}
.hero__main{ min-width:0; }

/* Bölüm imzası: numara, ince çizgi, ad. Numara bölümün kendi renginde. */
.hero__eyebrow{
  display:flex; align-items:center; gap:11px;
  font-family:var(--font-body);
  font-size:10.5px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
  color:var(--text-3);
  margin-bottom:20px;
}
.hero__eyebrow svg{ display:none; }
.hero__num{
  color:var(--sec); font-variant-numeric:tabular-nums; font-weight:700;
  font-size:11px;
}
.hero__num::after{
  content:''; display:inline-block; vertical-align:middle;
  width:26px; height:1.5px; background:var(--sec); margin:0 0 3px 11px;
  opacity:.55;
}

.hero__title{
  font-family:var(--font-serif);
  font-size:var(--fs-display); font-weight:500; line-height:1.1;
  letter-spacing:-.018em; color:var(--text);
  margin:0;
  text-wrap:balance;
}
.hero__lede{
  margin:16px 0 0;
  max-width:52ch;
  font-size:15.5px; line-height:1.62; color:var(--text-2);
}
.hero__actions{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:24px; }

/* Özet sayılar. Kart değil: aralarında ince dikey çizgi var. */
.hero__side{ display:flex; align-items:flex-end; padding-bottom:4px; }
.herostat{ min-width:74px; padding:0 20px; border-left:1px solid var(--border); }
.herostat:first-child{ border-left:none; padding-left:0; }
.herostat:last-child{ padding-right:0; }
.herostat__value{
  display:block;
  font-family:var(--font-display); font-size:28px; font-weight:600;
  letter-spacing:-.03em; line-height:1;
  color:var(--text); font-variant-numeric:tabular-nums;
}
.herostat__value small{ font-size:13px; font-weight:500; color:var(--text-3); margin-left:2px; }
.herostat__label{
  display:block; margin-top:10px;
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3); white-space:nowrap;
}

/* Bölüm imzası — her bölümün kendine ait ince işareti. Sayfayı
   süslemez; hangi bölümde olunduğunu çevresel görüşle bildirir.
   Sayıların altında, sağ sütunda durur: metin solda, sayı sağda,
   imza sayının altında — kompozisyon böylece dengelenir. */
.hero__motif{
  grid-column:2; justify-self:end;
  height:38px; margin-top:22px;
  color:var(--sec); opacity:.55;
}
.hero__motif svg{ height:100%; width:auto; display:block; }

/* ---------- sayfa sekmeleri ---------- */
.pagenav{
  position:sticky; top:var(--nav-h); z-index:calc(var(--z-nav) - 1);
  background:color-mix(in srgb, var(--bg) 96%, transparent);
  backdrop-filter:saturate(1.3) blur(14px);
  border-bottom:1px solid var(--border);
}
.pagenav__in{ display:flex; align-items:center; gap:2px; overflow-x:auto; scrollbar-width:none; }
.pagenav__in::-webkit-scrollbar{ display:none; }
.pagelink{
  position:relative; flex:0 0 auto;
  display:inline-flex; align-items:center; gap:7px;
  padding:12px 14px;
  border:none; background:none;
  color:var(--text-3); font-size:13px; font-weight:500;
  white-space:nowrap;
  transition:color var(--dur) var(--ease);
}
.pagelink svg{ display:none; }
.pagelink:hover{ color:var(--text-2); }
.pagelink.is-active{ color:var(--text); font-weight:600; }
.pagelink.is-active::after{
  content:''; position:absolute; left:14px; right:14px; bottom:-1px; height:1.5px;
  background:var(--sec);
}
.pagelink__count{
  font-size:10.5px; font-weight:600; color:var(--text-3);
  background:var(--surface-2); border-radius:var(--r-pill); padding:1px 6px;
}

/* ---------- içerik ---------- */
.content{ padding-block:40px 88px; }

.sect{ margin-bottom:56px; }
.sect:last-child{ margin-bottom:0; }
.sect__h{
  position:relative;
  display:flex; align-items:flex-end; justify-content:space-between; gap:16px;
  flex-wrap:wrap;
  padding-top:16px;
  margin-bottom:22px;
}
/* Bölüm başlığının üstünde bölümün renginde kısa bir çizgi. */
.sect__h::before{
  content:''; position:absolute; top:0; left:0; width:34px; height:2px;
  background:var(--sec);
}
.sect__ht{ min-width:0; }
.sect__eyebrow{ display:none; }
.sect__h h2{
  font-family:var(--font-serif);
  font-size:24px; font-weight:500; letter-spacing:-.012em; line-height:1.24;
  margin:0; color:var(--text);
}
.sect__h p{ margin:8px 0 0; font-size:var(--fs-base); line-height:1.55;
  color:var(--text-2); max-width:62ch; }
.sect__actions{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }

/* ---------- alt bant ----------

   Sayfayı sonlandırır ve sistemin iki değişmez cümlesini her ekranda bir
   kez söyler. Bunları kart olarak içeriğin ortasına koymak her seferinde
   okumayı bölüyordu. */
.sitefoot{
  margin-top:auto;
  background:var(--ink); color:var(--ink-on);
}
.sitefoot__in{
  padding-block:36px 40px;
  display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);
  gap:28px 56px; align-items:start;
}
.sitefoot__brand{ display:flex; align-items:flex-start; gap:12px; }
.sitefoot__brand .brand__mark{
  background:transparent; color:var(--ink-on);
  border:1px solid color-mix(in srgb, var(--ink-on) 34%, transparent);
}
.sitefoot__brand b{
  display:block;
  font-family:var(--font-serif); font-size:17px; font-weight:500;
  color:var(--ink-on); line-height:1.25;
}
.sitefoot__brand span{
  display:block; margin-top:4px;
  font-size:11.5px; color:var(--ink-on-2); line-height:1.45;
}
.sitefoot__notes{ display:grid; gap:14px; }
.sitefoot__notes p{
  margin:0; font-size:12.5px; line-height:1.6; color:var(--ink-on-2);
  max-width:62ch;
}
.sitefoot__k{
  display:inline-block; margin-right:8px;
  font-size:9.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--ink-on);
}

/* ---------- ızgara yardımcıları ---------- */
.grid{
  display:grid;
  grid-template-columns:repeat(12, minmax(0,1fr));
  gap:18px;
  align-items:start;
}
.span-2{ grid-column:span 2; }
.span-3{ grid-column:span 3; }
.span-4{ grid-column:span 4; }
.span-5{ grid-column:span 5; }
.span-6{ grid-column:span 6; }
.span-7{ grid-column:span 7; }
.span-8{ grid-column:span 8; }
.span-9{ grid-column:span 9; }
.span-10{ grid-column:span 10; }
.span-12{ grid-column:span 12; }

.stack{ display:flex; flex-direction:column; gap:18px; }
.stack-sm{ display:flex; flex-direction:column; gap:8px; }
.stack-xs{ display:flex; flex-direction:column; gap:5px; }
.row{ display:flex; align-items:center; gap:10px; }
.row-sm{ display:flex; align-items:center; gap:6px; }
.row-top{ display:flex; align-items:flex-start; gap:10px; }
.between{ justify-content:space-between; }
.wrap{ flex-wrap:wrap; }
.grow{ flex:1; min-width:0; }
.cols-2{ display:grid; grid-template-columns:1fr 1fr; gap:14px; }
.cols-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
.cols-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.auto-fit{ display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:14px; }

/* ---------- duyarlı ---------- */
@media (max-width:1060px){
  .span-2, .span-3, .span-4, .span-5{ grid-column:span 6; }
  .span-6, .span-7, .span-8, .span-9, .span-10{ grid-column:span 12; }
  .cols-4{ grid-template-columns:repeat(2,1fr); }
  :root{ --fs-display:35px; }
  .hero__in{ grid-template-columns:minmax(0,1fr); gap:26px; }
  .hero__side{ align-items:flex-start; }
  .hero__motif{ grid-column:1; justify-self:start; margin-top:4px; }
  .sitefoot__in{ grid-template-columns:minmax(0,1fr); }
}

@media (max-width:860px){
  .wrapc{ padding-inline:20px; }
  .masthead__in{ height:58px; gap:14px; }
  .masthead__date{ display:none; }
  .hero__in{ padding-block:32px 26px; gap:22px; }
  .hero__motif{ height:28px; margin-top:20px; }
  .herostat{ padding:0 16px; }
  .herostat__value{ font-size:24px; }
  :root{ --fs-display:31px; }
  .hero__lede{ font-size:15px; }
  .sect__h h2{ font-size:21px; }
  .navlinks{ display:none; }
  .sitenav{ display:none; }
  .sitenav__menu{ display:inline-flex; }
  .content{ padding-block:28px 72px; }
  .sect{ margin-bottom:40px; }
}

@media (max-width:720px){
  .cols-3, .cols-4{ grid-template-columns:repeat(2,1fr); }
  .span-2, .span-3, .span-4, .span-5{ grid-column:span 12; }
}

@media (max-width:560px){
  .wrapc{ padding-inline:16px; }
  :root{ --fs-display:27px; }
  .cols-2, .cols-3, .cols-4{ grid-template-columns:1fr; }
  .brand__text span{ display:none; }
  .hero__in{ padding-block:26px 22px; }
  .hero__side{ flex-wrap:wrap; row-gap:18px; }
  .herostat{ padding:0 14px; }
  .herostat__value{ font-size:21px; }
  .sitefoot__in{ padding-block:28px 32px; }
}

/* ---------- mobil bölüm menüsü ---------- */
.navsheet{
  position:fixed; inset:0; z-index:var(--z-overlay);
  background:var(--bg);
  display:flex; flex-direction:column;
  animation:navsheet-in var(--dur-lg) var(--ease);
}
@keyframes navsheet-in{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:none; } }
.navsheet__head{
  height:64px; flex:none;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding-inline:20px;
  border-bottom:1px solid var(--border);
}
.navsheet__body{ flex:1; overflow-y:auto; padding:8px 20px 24px; }
.navsheet__grid{ display:grid; gap:0; }
.navsheet__item{
  position:relative;
  display:grid; grid-template-columns:34px 1fr; align-items:baseline;
  gap:4px 12px;
  padding:18px 4px;
  border:none; border-bottom:1px solid var(--border);
  background:none; color:var(--text);
  text-align:left;
}
.navsheet__item svg{ display:none; }
.navsheet__item::before{
  content:attr(data-num);
  font-family:var(--font-display); font-size:11px; font-weight:600;
  letter-spacing:.06em; color:var(--text-3); font-variant-numeric:tabular-nums;
}
.navsheet__item b{
  font-family:var(--font-serif); font-size:21px; font-weight:500; letter-spacing:-.01em;
}
.navsheet__item span{
  grid-column:2; font-size:13px; color:var(--text-3); line-height:1.4;
}
.navsheet__item.is-active b{ color:var(--sec); }
.navsheet__item.is-active::before{ color:var(--sec); }

@media (prefers-reduced-motion:reduce){
  .navsheet{ animation:none; }
}

/* ================= DEFTER DÜZENİ =================

   Sistemin ana düzen birimi. Kart değil.

   Kart dili bir yönetim panelinin dilidir: her şey eşit ağırlıkta beyaz
   bir dikdörtgene konur, on beş dikdörtgen yan yana dizilir ve sayfa bir
   tepsiye döner. Günde birkaç kez açılıp aylarca okunacak bir sistemde
   bu dil yorar — çünkü hiçbir şey öne çıkmaz ve göz dinlenecek yer
   bulamaz.

   Defter satırı bunun yerine kitapların, defterlerin ve teknik belgelerin
   yüzyıllardır kullandığı düzeni kurar: solda dar bir künye sütunu,
   sağda içeriğin kendisi, arada ince bir çizgi.

   Kutu yalnız SEÇİLEBİLİR ya da YÜZEN şeylerde kalır. Okunacak bir şey
   kutuya konmaz. */

.ledger{ display:flex; flex-direction:column; }

.lrow{
  display:grid;
  grid-template-columns:var(--gutter) minmax(0,1fr);
  gap:0 var(--gutter-gap);
  padding-block:38px;
  border-top:1px solid var(--border);
}
/* İlk satırın üst çizgisi yoktur: hero'nun alt çizgisi zaten oradadır ve
   iki çizgi üst üste gelmez. */
.ledger > .lrow:first-child{ border-top:none; padding-top:30px; }
.ledger > .lrow:last-child{ padding-bottom:8px; }

/* Künye sütunu uzun içerikte YAPIŞIR: yüz satırlık bir listeyi
   kaydırırken hangi bölümde olduğunu unutmayasın diye. */
.lrow__side{
  position:sticky;
  top:calc(var(--nav-h) + 26px);
  align-self:start;
  min-width:0;
}
.lrow__label{
  display:flex; align-items:center; gap:6px;
  font-size:11px; font-weight:600; letter-spacing:.13em; text-transform:uppercase;
  color:var(--text);
  line-height:1.4;
}
.lrow__meta{
  margin-top:7px;
  font-size:var(--fs-sm); color:var(--text-3);
  font-variant-numeric:tabular-nums;
  line-height:1.5;
}
.lrow__note{
  margin:12px 0 0;
  font-size:var(--fs-sm); line-height:1.6; color:var(--text-2);
  max-width:34ch;
}
.lrow__act{ margin-top:16px; display:flex; flex-direction:column; align-items:flex-start;
  gap:8px; min-width:0; max-width:100%; }
.lrow__act .btn{ width:100%; justify-content:center; }

/* Defter satırının içeriği KENDİ kutusunun enini bilir.

   Bileşenler duyarlı kurallarını pencere genişliğine göre uyguluyordu;
   oysa asıl soru «pencere kaç piksel» değil «bu satıra kaç piksel
   kaldı». İkisi «Katmanlı» düzeninde ayrışıyor (raf 228 px alıyor) ve
   «Harita» düzeninde büsbütün ayrışıyor (satır bir karta giriyor):
   masaüstü genişliğinde bir pencerede satır 570 px'lik bir kutuda
   duruyor ama hâlâ masaüstü kalıbını kullanıyor, taşıyordu.

   `container-type:inline-size` güvenlidir: bu kutunun eni ızgara
   parçasından gelir, içeriğinden değil. */
.lrow__main{ min-width:0; container-type:inline-size; container-name:satir; }
/* Defter satırının içinde ARDIŞIK bloklar arasında da ritim olsun. */
.lrow__main > * + *{ margin-top:20px; }

/* Geniş satır: künye üstte, içerik tam genişlikte. Bir grafiğin ya da
   uzun bir cetvelin künye sütunu kadar daralması saçmadır. */
.lrow--wide{ grid-template-columns:minmax(0,1fr); gap:18px; }
.lrow--wide .lrow__side{
  position:static;
  display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
}
.lrow--wide .lrow__meta{ margin-top:0; }
.lrow--wide .lrow__note{ flex-basis:100%; margin-top:0; max-width:70ch; }
.lrow--wide .lrow__act{ margin-top:0; margin-left:auto; flex-direction:row; }
.lrow--wide .lrow__act .btn{ width:auto; }

@media (max-width:900px){
  .lrow{
    grid-template-columns:minmax(0,1fr);
    gap:16px;
    padding-block:30px;
  }
  .lrow__side{
    position:static;
    display:flex; align-items:baseline; gap:14px; flex-wrap:wrap;
  }
  .lrow__meta{ margin-top:0; }
  .lrow__note{ flex-basis:100%; margin-top:0; max-width:none; }
  .lrow__act{ margin-top:0; margin-left:auto; flex-direction:row; }
  .lrow__act .btn{ width:auto; }
}

/* İki sütunlu içerik — defterin içinde, kart olmadan. */
.pair{ display:grid; grid-template-columns:repeat(auto-fit, minmax(240px,1fr)); gap:28px 40px; }
.pair > *{ min-width:0; }

/* Künye sütununun içindeki mini ölçü listesi. */
.sidestat{ display:flex; flex-direction:column; gap:2px; margin-top:14px; }
.sidestat__v{
  font-family:var(--font-display); font-size:22px; font-weight:600;
  letter-spacing:-.025em; line-height:1; color:var(--text);
  font-variant-numeric:tabular-nums;
}
.sidestat__v small{ font-size:12px; font-weight:500; color:var(--text-3); margin-left:2px; }
.sidestat__k{
  font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-3);
}

/* Derleme damgası — hangi sürümün ekranda olduğunu söyler. Alt bandın
   en sessiz satırı: aranınca bulunur, okunurken rahatsız etmez. */
.sitefoot__build{
  margin:0; font-size:11px; color:var(--ink-on-2);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}
/* Sürüm kimliği git'ten gelir ve KÜÇÜK harflidir; büyük harfe çevirmek
   onu tanınmaz kılar. Bu yüzden .mono-label kullanılmaz. */
.sitefoot__sha{
  font-family:ui-monospace, 'SFMono-Regular', 'Courier New', monospace;
  font-size:11px; letter-spacing:.02em; color:var(--ink-on);
}
/* DOKUNMA ALANI GORSEL BOYUTTAN BUYUK OLABILIR.

   Bu dugme kunyenin icinde bir hap kadar yer kaplamali: 50x17. Ama
   WCAG'in asgari dokunma hedefi 24x24 ve parmak pikseli gormez,
   alani hisseder. Gorunmez bir ::after ile alan buyutulur; hap oldugu
   yerde kalir. */
.sitefoot__reload{
  position:relative;
  border:1px solid color-mix(in srgb, var(--ink-on) 30%, transparent);
  background:none; color:var(--ink-on-2);
  border-radius:var(--r-pill); padding:1px 9px; font-size:10.5px;
  transition:color var(--dur) var(--ease), border-color var(--dur) var(--ease);
}
.sitefoot__reload::after{
  content:''; position:absolute; left:0; right:0;
  top:50%; transform:translateY(-50%);
  height:24px; min-height:24px;
}
.sitefoot__reload:hover{ color:var(--ink-on); border-color:var(--ink-on); }

/* ================= telefonda alt gezinme =================

   Telefonda her şey hamburger menüden geçiyordu. Veri girişinin çoğu
   telefonda yapılacak; en çok kullanılan dört yol başparmağın altında
   durur, beşinci yuva tam listeyi açar.

   Yalnız 860 pikselin altında çizilir. */
.tabbar{ display:none; }

@media (max-width:860px){
  .tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:var(--z-nav);
    display:grid; grid-template-columns:repeat(5, 1fr);
    background:color-mix(in srgb, var(--bg) 94%, transparent);
    backdrop-filter:saturate(1.3) blur(16px);
    border-top:1px solid var(--border);
    /* Ekranın alt kenarındaki sistem çubuğu düğmeleri yutmasın. */
    padding-bottom:env(safe-area-inset-bottom, 0px);
  }
  .tabbtn{
    position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:3px; padding:9px 2px 8px;
    border:none; background:none; color:var(--text-3);
    min-height:56px;
    transition:color var(--dur) var(--ease);
  }
  .tabbtn__ic{ display:block; line-height:0; }
  .tabbtn__ic svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.7; }
  .tabbtn__t{ font-size:10.5px; font-weight:550; letter-spacing:.01em; }
  .tabbtn.is-active{ color:var(--sec); }
  .tabbtn.is-active .tabbtn__t{ font-weight:650; }
  /* Etkin yuvanın üstünde bölüm renginde kısa bir çizgi: hangi
     bölümde olunduğu renkle değil KONUMLA da söylenir. */
  .tabbtn.is-active::before{
    content:''; position:absolute; top:0; left:22%; right:22%; height:2px;
    background:var(--sec);
  }
  .tabbtn__b{
    position:absolute; top:5px; left:calc(50% + 9px);
    min-width:15px; height:15px; padding:0 4px; border-radius:var(--r-pill);
    background:var(--danger); color:#fff;
    font-size:9.5px; font-weight:700; line-height:15px; text-align:center;
  }
  .tabbtn__b.is-quiet{ background:var(--surface-3); color:var(--text-2); }

  /* Alt bandın ve içeriğin sonu çubuğun altında kalmasın. */
  .sitefoot__in{ padding-bottom:calc(40px + 56px + env(safe-area-inset-bottom, 0px)); }
}

/* ==== css/components.css ==== */
/* Bilesen stilleri.

   Ilk bolum ortak tasarim sistemidir ve AYS ile aynidir: ayni jetonlar, ayni
   kart/dugme/tablo dili. Ikisi kardes uygulamadir; ortak bir gorsel dili
   paylasmalari kasitlidir.

   Ikinci bolum (SPI'ye ozel) bu uygulamanin kendi yapilaridir: referans
   araligi cubugu, olcum satiri, ogun karti, porsiyon paylastirma, fiyat
   satiri ve emilim rozetleri.

   Kural: bilesenler yalniz tokens.css degiskenlerini kullanir; ham renk
   ya da olcu yazilmaz. Ayrinti icin src/STIL.md. */


/* ---------- kart ----------
   Tek kart stili. Vurgu için renkli kenarlık kullanılmaz; başlığın yanına
   rozet konur. Gölge bir kenarlık kadar sessizdir — kart sayfadan kopmaz,
   yalnızca zemininden bir kâğıt kalınlığı ayrılır. */
/* Kart bir kutu degil, bir YUZEYDIR. Golge kaldirildi: on onbes kartin
   yan yana golge dusurdugu bir sayfa, kagit yigini gibi durur ve
   ucuzlar. Derinlik yalnizca ince kenarlikla anlatilir. */
.card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r);
  padding:20px 22px;
}
.card--flat{ box-shadow:none; background:var(--surface-2); border-color:transparent; }
.card--pad-sm{ padding:14px 16px; }
/* Eski sinif adlari geriye donuk uyum icin durur ama gorsel etkisi yoktur. */
.card--accent, .card--primary, .card--danger{ border-left:1px solid var(--border); }
.card__head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px;
  flex-wrap:wrap;
  margin-bottom:14px;
}
.card__head > div:first-child{ min-width:min(100%, 180px); flex:1 1 auto; }
/* Kart başlığı da serif. Bölüm başlığıyla aynı ailede olması sayfayı
   tek bir yayın gibi okutur; sans bir kart başlığı serif bir bölüm
   başlığının altında yabancı durur. */
.card__head h3{
  font-family:var(--font-serif);
  font-size:18px; font-weight:500; letter-spacing:-.004em; line-height:1.3;
  display:flex; align-items:center; gap:6px;
}
.card__head p{ font-size:var(--fs-sm); color:var(--text-3); margin-top:3px; line-height:1.45; }
.card__foot{
  margin-top:14px; padding-top:12px; border-top:1px solid var(--border);
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
}

.section-title{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  margin:4px 0 0;
}
.section-title h2{ font-size:var(--fs-lg); font-weight:800; letter-spacing:-.015em; }

/* ---------- dugme ---------- */
/* Düğme hap biçiminde ve gölgesiz. Köşeli ve gölgeli düğme bir yönetim
   panelinin dilidir; hap biçimi arayüzü yumuşatır ve dokunma hedefini
   büyütür. */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:9px 17px;
  border-radius:var(--r-pill);
  border:1px solid var(--border-strong);
  background:var(--surface);
  color:var(--text);
  font-size:13px; font-weight:550; letter-spacing:.005em;
  white-space:nowrap;
  transition:background var(--dur) var(--ease), border-color var(--dur) var(--ease),
             color var(--dur) var(--ease);
}
.btn svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.9; flex:none; }
.btn:hover{ background:var(--surface-2); border-color:var(--text-3); }
/* Ana düğme BÖLÜMÜN rengindedir. Düğme bir durum değil bir eylemdir;
   bölüm kimliğini taşıyabilir. Durum renkleri (hedefte / referans dışı /
   kırmızı bayrak) buna karışmaz — onlar her bölümde aynı kalır, aksi
   hâlde bir tahlil sonucunun rengi hangi sayfada olduğuna göre değişirdi. */
.btn--primary{
  background:var(--sec); border-color:var(--sec); color:var(--primary-ink);
}
.btn--primary:hover{
  background:color-mix(in srgb, var(--sec) 86%, #000);
  border-color:color-mix(in srgb, var(--sec) 86%, #000);
}
.btn--danger{ color:var(--danger); border-color:color-mix(in srgb, var(--danger) 45%, var(--border)); background:transparent; }
.btn--danger:hover{ background:var(--danger-soft); }
.btn--ghost{ border-color:transparent; background:transparent; color:var(--text-2); }
.btn--ghost:hover{ background:var(--surface-2); color:var(--text); }
.btn--sm{ padding:5px 10px; font-size:var(--fs-sm); border-radius:9px; }
.btn--lg{ padding:11px 18px; font-size:var(--fs-md); border-radius:12px; }
.btn--block{ width:100%; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }

.iconbtn{
  width:34px; height:34px; flex:none;
  display:inline-grid; place-items:center;
  border-radius:10px; border:1px solid var(--border);
  background:var(--surface); color:var(--text-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.iconbtn svg{ width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; }
.iconbtn:hover{ background:var(--surface-2); color:var(--text); border-color:var(--border-strong); }
.iconbtn.is-on{ background:var(--primary-soft); color:var(--primary); border-color:transparent; }
.iconbtn--plain{ border-color:transparent; background:transparent; }
.iconbtn--sm{ width:26px; height:26px; border-radius:var(--r-sm); }
.iconbtn--sm svg{ width:14px; height:14px; }

/* ---------- form ---------- */
.field{ display:flex; flex-direction:column; gap:5px; min-width:0; }
.field > span{ font-size:var(--fs-sm); font-weight:600; color:var(--text-2); }
.field .hint{ font-size:var(--fs-xs); color:var(--text-3); font-weight:400; }
.input, .select, .textarea{
  width:100%;
  padding:10px 13px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface-hover);
  color:var(--text);
  font-size:var(--fs-base);
  transition:border-color var(--dur) var(--ease), background var(--dur) var(--ease),
             box-shadow var(--dur) var(--ease);
}
.input:hover, .select:hover, .textarea:hover{ border-color:var(--border-strong); }
.input::placeholder, .textarea::placeholder{ color:var(--text-3); }
.input:focus, .select:focus, .textarea:focus{
  outline:none; background:var(--surface); border-color:var(--primary);
  box-shadow:0 0 0 3px var(--ring);
}
.textarea{ resize:vertical; min-height:72px; line-height:1.45; }
.input--sm{ padding:5px 8px; font-size:var(--fs-sm); border-radius:var(--r-sm); }
.input--num{ text-align:right; font-variant-numeric:tabular-nums; }
.input--ghost{ border-color:transparent; background:transparent; padding-left:6px; }
.input--ghost:hover{ background:var(--surface-2); }

.check{ display:flex; align-items:flex-start; gap:8px; font-size:var(--fs-base); line-height:1.4; padding:3px 0; }
.check input{ margin-top:3px; accent-color:var(--primary); flex:none; width:15px; height:15px; }
.check.is-done > span{ color:var(--text-3); text-decoration:line-through; }

.seg{
  display:inline-flex; padding:3px; gap:2px;
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:11px;
}
.seg button{
  border:none; background:none; border-radius:8px;
  padding:5px 11px; font-size:var(--fs-sm); font-weight:650; color:var(--text-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.seg button:hover{ color:var(--text); }
.seg button.is-on{
  background:var(--surface); color:var(--text);
  box-shadow:0 1px 2px rgba(16,18,27,.08);
}
.seg--block{ display:flex; }
.seg--block button{ flex:1; }
.seg--primary button.is-on{ background:var(--primary); color:var(--primary-ink); }

/* ---------- rozet / etiket ---------- */
/* Rozet küçük ve sakin: kalın harf ve dar yükseklik onu bir etikete
   çevirir, bir düğmeye değil. */
.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:3px 9px; border-radius:var(--r-pill);
  font-size:11.5px; font-weight:600; letter-spacing:.012em;
  white-space:nowrap; line-height:1.5;
}
.badge svg{ width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2.2; }
.badge--ok{ background:var(--primary-soft); color:var(--primary); }
.badge--warn{ background:var(--accent-soft); color:var(--accent); }
.badge--danger{ background:var(--danger-soft); color:var(--danger); }
.badge--info{ background:var(--info-soft); color:var(--info); }
.badge--muted{ background:var(--surface-3); color:var(--text-2); }

.chip{
  display:inline-flex; align-items:center; gap:6px;
  padding:4px 10px; border-radius:var(--r-pill);
  border:1px solid var(--border); background:var(--surface-2);
  font-size:var(--fs-sm); font-weight:600; color:var(--text-2);
}
.chip--tap:hover{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); cursor:pointer; }
.chip--on{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }


/* ---------- olcum ---------- */
.stat{
  display:flex; flex-direction:column; gap:3px;
  padding:13px 15px;
  background:var(--surface); border:1px solid var(--border); border-radius:var(--r-sm);
}
.stat__label{ font-size:var(--fs-xs); font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--text-3); }
.stat__value{ font-family:var(--font-display); font-size:var(--fs-xl); font-weight:800; font-variant-numeric:tabular-nums; line-height:1.1; letter-spacing:-.02em; }
.stat__value small{ font-size:var(--fs-md); font-weight:700; color:var(--text-3); }
.stat__note{ font-size:var(--fs-xs); color:var(--text-2); }
.stat--ok .stat__value{ color:var(--primary); }
.stat--warn .stat__value{ color:var(--accent); }
.stat--danger .stat__value{ color:var(--danger); }

/* Hedefe doluluk şeridi — sayının yanında "neresindeyim" bilgisi.
   İnce tutulur: ölçüm kutusunun ana işi hâlâ sayıyı okutmak. */
.stat__bar{
  position:relative; display:block; height:4px; margin-top:6px;
  border-radius:3px; background:var(--surface-3);
}
.stat__bar i{
  display:block; height:100%; border-radius:3px;
  background:var(--text-3);
  transition:width var(--dur-lg) var(--ease);
}
/* Hedef çizgisi: doluluk şeridin neresinde bitmeli. */
.stat__bar b{
  position:absolute; top:-3px; height:10px; width:2px;
  margin-left:-1px; border-radius:1px; background:var(--text-2);
}
.stat--ok .stat__bar i{ background:var(--primary); }
.stat--warn .stat__bar i{ background:var(--accent); }
.stat--danger .stat__bar i{ background:var(--danger); }

.bar{ height:7px; border-radius:5px; background:var(--surface-3); overflow:hidden; }
.bar__fill{ height:100%; border-radius:5px; background:var(--primary); transition:width var(--dur-lg) var(--ease); }
.bar__fill--warn{ background:var(--accent); }
.bar__fill--danger{ background:var(--danger); }
.bar--lg{ height:10px; }

.meter{ display:flex; flex-direction:column; gap:5px; }
.meter__top{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:var(--fs-sm); }
.meter__top b{ font-variant-numeric:tabular-nums; }

/* ---------- tablo ---------- */
.tablewrap{ overflow-x:auto; margin:0 -4px; padding:0 4px; }
table{ width:100%; border-collapse:collapse; font-size:var(--fs-base); }
th, td{ text-align:left; padding:11px 12px 11px 0; border-bottom:1px solid var(--border); vertical-align:top; }
th:last-child, td:last-child{ padding-right:0; }
/* Başlık satırı bir sınıflandırmadır, bir başlık değil: küçük, harf
   aralıklı, sessiz. Altındaki çizgi gövdedekilerden bir ton koyu. */
th{
  font-size:10.5px; font-weight:600; letter-spacing:.11em; text-transform:uppercase;
  color:var(--text-3); white-space:nowrap;
  padding-bottom:9px; border-bottom-color:var(--border-strong);
}
tbody tr:last-child td{ border-bottom:none; }
/* Zebra yok. Satır ayrımı çizgiyle yapılır; dolgulu satırlar tabloyu
   bir elektronik tabloya çevirir. */
tbody tr:hover td{ background:var(--surface-hover); }
td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
.table--tight th, .table--tight td{ padding:8px 10px 8px 0; font-size:var(--fs-sm); }
.table--tight th:last-child, .table--tight td:last-child{ padding-right:0; }

/* ---------- listeler ---------- */
.list{ display:flex; flex-direction:column; }
.listitem{
  display:flex; align-items:center; gap:12px;
  padding:11px 4px;
  border-bottom:1px solid var(--border);
}
.listitem:last-child{ border-bottom:none; }
.listitem--tap{ cursor:pointer; border-radius:var(--r-sm); padding:11px 10px; }
.listitem--tap:hover{ background:var(--surface-2); }

/* ---------- bildirim / uyari ---------- */
.notice{
  display:flex; gap:10px; align-items:flex-start;
  padding:11px 13px; border-radius:var(--r); border:1px solid;
  font-size:var(--fs-base); line-height:1.45;
}
.notice svg{ width:17px; height:17px; flex:none; margin-top:2px; stroke:currentColor; fill:none; stroke-width:1.9; }
.notice--info{ background:var(--info-soft); border-color:color-mix(in srgb, var(--info) 28%, var(--border)); color:var(--text); }
.notice--warn{ background:var(--accent-soft); border-color:color-mix(in srgb, var(--accent) 35%, var(--border)); color:var(--text); }
.notice--danger{ background:var(--danger-soft); border-color:color-mix(in srgb, var(--danger) 32%, var(--border)); color:var(--text); }
.notice--ok{ background:var(--primary-soft); border-color:color-mix(in srgb, var(--primary) 32%, var(--border)); color:var(--text); }
.notice__title{ font-weight:700; }

/* Boş durum da tasarımın parçasıdır: jenerik bir ikon yerine bölümün
   kendi imzası durur ve ekran boşken bile hangi bölümde olunduğu
   bellidir. */
.empty{
  display:flex; flex-direction:column; align-items:center; gap:14px;
  padding:44px 18px 38px; text-align:center; color:var(--text-2);
}
.empty svg{ width:26px; height:26px; stroke:var(--text-3); fill:none; stroke-width:1.5; }
.empty__motif{ color:var(--sec); opacity:.4; height:44px; }
.empty__motif svg{ width:auto; height:100%; stroke-width:1.5; stroke:currentColor; }
.empty p{ max-width:46ch; line-height:1.55; }

/* ---------- alt sayfa / modal ---------- */
.overlay{
  position:fixed; inset:0; z-index:var(--z-overlay);
  background:var(--scrim);
  display:flex; align-items:flex-end; justify-content:center;
}
@media (min-width:680px){ .overlay{ align-items:center; } }
.sheet{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--r) var(--r) 0 0;
  width:100%; max-width:640px; max-height:90vh;
  display:flex; flex-direction:column;
  box-shadow:var(--shadow-lg);
}
.sheet--wide{ max-width:920px; }
@media (min-width:680px){ .sheet{ border-radius:var(--r); } }
.sheet__head{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:16px 18px; border-bottom:1px solid var(--border);
}
.sheet__head h3{ font-size:var(--fs-lg); }
.sheet__head p{ font-size:var(--fs-sm); color:var(--text-2); margin-top:2px; }
.sheet__body{ padding:18px; overflow-y:auto; display:flex; flex-direction:column; gap:14px; }
/* Formun NEDEN doldurulacagi formun kendisinden once gelir. Bir alan
   listesi ne ise yaradigini soylemez; bu satir soyler. */
.sheet__note{
  font-size:var(--fs-sm); color:var(--text-2); line-height:1.5;
  padding-left:11px; border-left:2px solid var(--border-strong);
}
.sheet__foot{
  padding:14px 18px; border-top:1px solid var(--border);
  display:flex; gap:8px; justify-content:flex-end;
}

/* Bekleyen öneri şeridi — Günlük'ün en üstünde.

   Onaylanmamış bir kayıt, unutulmuş bir kayıttır. Şerit bir uyarı
   değil bir HATIRLATMA olduğu için durum renklerinden birini almaz;
   kenarındaki çizgi yalnızca «burada bekleyen bir iş var» der. */
.bekleyen{
  border:1px solid var(--border-strong); border-left:3px solid var(--sec);
  border-radius:var(--r-sm); background:var(--surface); padding:13px 15px;
}
.bekleyen__bas{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;
  margin-bottom:9px; }
.bekleyen__bas b{ font-size:var(--fs-sm); }
.bekleyen__satir{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  padding:7px 0; border-top:1px solid var(--border);
}
.bekleyen__ne{ font-size:var(--fs-sm); font-weight:650; flex:none; }
.bekleyen__ne2{ font-size:var(--fs-sm); color:var(--text-2); flex:1 1 180px; min-width:0; }
.bekleyen__dug{ display:flex; gap:6px; flex:none; }

/* Hızlı giriş önizlemesi — palette açılan alt sayfa.

   Her blok bir kayıt adayıdır ve ne değişeceğini önce/sonra yazar.
   Bileşik cümle birden çok blok üretir; hepsi bir arada onaylanır. */
.qebloklar{ display:flex; flex-direction:column; gap:10px; }
.qeblok{
  border:1px solid var(--border); border-radius:var(--r-sm);
  background:var(--surface-2); padding:11px 13px;
}
.qeblok__bas{ display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; }
.qeblok__bas b{ font-size:var(--fs-sm); }
.qeblok__satirlar{ display:flex; flex-direction:column; gap:4px; margin-top:8px; }
.qeblok__satir{
  display:grid; grid-template-columns:minmax(0,1fr) auto 14px auto;
  gap:4px 9px; align-items:baseline; font-size:var(--fs-sm);
}
.qeblok__satir b,.qeblok__satir .dim{
  font-family:var(--font-display); font-variant-numeric:tabular-nums; white-space:nowrap;
}
@media (max-width:520px){
  .qeblok__satir{ grid-template-columns:minmax(0,1fr); }
  .qeblok__satir [aria-hidden]{ display:none; }
}

/* ---- öneri kutusu --------------------------------------------------

   Bir öneri bir KAYIT DEĞİL, bir teklifitir. Bu yüzden sohbet balonu
   gibi değil, bir form gibi durur: ne değişeceği önce/sonra olarak
   yazılır ve iki düğme bekler. Onaysız hiçbir şey yazılmaz. */
.oneriler{ display:flex; flex-direction:column; gap:8px; margin-top:12px; }
.oneri{
  border:1px solid var(--border-strong); border-radius:var(--r-sm);
  background:var(--surface); padding:12px 14px;
}
.oneri--applied{ border-color:var(--border); background:var(--surface-2); }
.oneri--rejected,.oneri--undone{ opacity:.6; }
.oneri--stale{ border-left:3px solid var(--accent); }
.oneri__bas{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.oneri__ne{ font-size:var(--fs-sm); font-weight:650; letter-spacing:-.005em; }
.oneri__hata{ margin:8px 0 0; font-size:var(--fs-sm); color:var(--accent); }
.oneri__satirlar{ display:flex; flex-direction:column; gap:4px; margin-top:9px; }
.oneri__satir{
  display:grid; grid-template-columns:minmax(0,1fr) auto 14px auto;
  gap:4px 9px; align-items:baseline; font-size:var(--fs-sm);
}
.oneri__alan{ color:var(--text-2); min-width:0; overflow-wrap:anywhere; }
.oneri__once{ color:var(--text-3); font-family:var(--font-display);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.oneri__ok{ color:var(--text-3); text-align:center; }
.oneri__sonra{ color:var(--text); font-weight:650; font-family:var(--font-display);
  font-variant-numeric:tabular-nums; white-space:nowrap; }
.oneri__dug{ display:flex; gap:7px; flex-wrap:wrap; margin-top:11px; }
.oneri__dug:empty{ display:none; }
@container satir (max-width:460px){
  .oneri__satir{ grid-template-columns:minmax(0,1fr); }
  .oneri__ok{ display:none; }
  .oneri__once::after{ content:' →'; color:var(--text-3); }
}

/* Tutanak dinlenirken O ANKİ tur işaretlenir: gözle kulak aynı yerde
   olsun diye. İşaret bir durum değil bir KONUM bildirir, bu yüzden
   durum renklerinden birini kullanmaz. */
.meetturn.is-calan{
  background:var(--surface-2);
  box-shadow:inset 3px 0 0 var(--sec);
}

/* Devir düğmesi: ajan «bu Nesrin'in alanında» dediğinde oraya GİDEN
   bir yol. Cümlenin altında durur, cümlenin yerine geçmez. */
.devirdug{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  margin-top:9px; padding-top:9px; border-top:1px solid var(--border);
}

/* ---- sesli sohbet ---------------------------------------------------

   Panelin tek isi ŞU AN SIRA KİMDE sorusunu cevaplamak. Üç durum var
   ve üçü de bir bakışta ayrılmalı: renk tek başına yetmez, ışığın
   davranışı da farklıdır — dinlerken nabız gibi atar, düşünürken
   söner, konuşurken sabit durur. */
.ses{
  display:flex; flex-direction:column; gap:9px;
  padding:14px 15px; border-radius:var(--r-sm);
  background:var(--surface-2); min-width:0;
}
.ses__hal{ display:flex; align-items:center; gap:11px; min-width:0; }
.ses__isik{
  width:11px; height:11px; border-radius:50%; flex:none;
  background:var(--text-3);
}
.ses__t{ display:block; font-size:var(--fs-md); font-weight:650; letter-spacing:-.005em; }
.ses__a{ display:block; font-size:var(--fs-xs); color:var(--text-3); margin-top:1px; }
.ses__metin{
  margin:0; font-size:var(--fs-sm); color:var(--text-2); line-height:1.5;
  min-height:1.5em; overflow-wrap:anywhere;
}
.ses__metin:empty::before{ content:'…'; color:var(--text-3); }

.ses[data-durum="dinliyor"] .ses__isik{
  background:var(--primary); animation:sesnabiz 1.5s var(--ease) infinite;
}
.ses[data-durum="düşünüyor"] .ses__isik{
  background:var(--accent); animation:sessonuk 1.1s var(--ease) infinite;
}
.ses[data-durum="konuşuyor"] .ses__isik{
  background:var(--sec);
  box-shadow:0 0 0 4px color-mix(in srgb, var(--sec) 22%, transparent);
}
@keyframes sesnabiz{
  0%,100%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--primary) 45%, transparent); }
  60%{ box-shadow:0 0 0 7px color-mix(in srgb, var(--primary) 0%, transparent); }
}
@keyframes sessonuk{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
@media (prefers-reduced-motion:reduce){
  .ses__isik{ animation:none !important; }
}

/* ---------- bildirim balonu ---------- */
.toast-root{
  position:fixed; left:50%; bottom:22px; transform:translateX(-50%);
  z-index:var(--z-toast);
  display:flex; flex-direction:column; gap:8px; align-items:center;
  pointer-events:none;
  max-width:calc(100vw - 24px);
}
/* Telefonda alt gezinme çubuğu var: bildirim onun ÜSTÜNDE durur,
   altında kalıp görünmez olmaz. */
@media (max-width:860px){
  .toast-root{ bottom:calc(16px + 56px + env(safe-area-inset-bottom, 0px)); }
}
.toast{
  background:var(--text); color:var(--bg);
  padding:9px 16px; border-radius:20px;
  font-size:var(--fs-sm); font-weight:600;
  box-shadow:var(--shadow-lg);
  animation:toast-in var(--dur) var(--ease);
}
@keyframes toast-in{ from{ opacity:0; transform:translateY(8px);} to{ opacity:1; transform:none;} }

/* ---------- alt sekmeler ----------
   İnce bir alt çizgi yerine SEÇİLEBİLİR hap şeridi. Bir ekranın kaç bölüme
   ayrıldığı ve hangisinde olduğun tek bakışta görünür; dokunma hedefi de
   çizginin değil hapın tamamıdır.

   Şerit yatayda kaydırılabilir: dar ekranda sekmeler alt satıra sarmaz,
   çünkü sarılan bir sekme şeridi hangi bölümde olduğunu gizler. */
/* Sekme şeridi hap biçiminde ve zemini kâğıt rengi. Köşeli bir kutu
   içinde köşeli sekmeler bir araç çubuğu gibi durur. */
.subtabs{
  display:inline-flex; gap:2px;
  max-width:100%;
  padding:4px;
  border:1px solid var(--border);
  border-radius:var(--r-pill);
  overflow-x:auto;
  scrollbar-width:none;
  -webkit-overflow-scrolling:touch;

  /* KAYAN ŞERİT KENDİNİ SÖYLER. Tablet genişliğinde yedi sekmelik bir
     şerit kelimenin ortasından kesiliyor ve kaydırılabildiğine dair
     hiçbir işaret vermiyordu: kullanıcı orada başka sekme olduğunu
     bilmiyordu.

     İki katman örtü (`local` — içerikle birlikte kayar), iki katman
     gölge (`scroll` — kutuya sabit). Şerit bir uca dayandığında örtü
     gölgenin üstüne gelir ve gölge kaybolur. Saf CSS: hangi uçta
     olduğunu tarayıcı bilir, JavaScript'e sormaya gerek yok. */
  background:
    linear-gradient(to right, var(--surface-2) 40%, transparent) left / 26px 100% no-repeat local,
    linear-gradient(to left,  var(--surface-2) 40%, transparent) right / 26px 100% no-repeat local,
    linear-gradient(to right, color-mix(in srgb, var(--text) 17%, transparent), transparent)
      left / 16px 100% no-repeat scroll,
    linear-gradient(to left,  color-mix(in srgb, var(--text) 17%, transparent), transparent)
      right / 16px 100% no-repeat scroll,
    var(--surface-2);
}
.subtabs::-webkit-scrollbar{ display:none; }
.subtab{
  flex:0 0 auto;
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  border:none; background:none; border-radius:var(--r-pill);
  padding:8px 17px; white-space:nowrap;
  font-size:13px; font-weight:500; letter-spacing:.005em; color:var(--text-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.subtab svg{ display:none; }
.subtab:hover{ color:var(--text); }
.subtab.is-active{
  background:var(--surface); color:var(--text); font-weight:600;
}
.subtab__count{
  min-width:18px; padding:0 5px; border-radius:var(--r-pill);
  background:var(--surface-3); color:var(--text-3);
  font-size:10.5px; font-weight:700; line-height:17px; text-align:center;
}
.subtab.is-active .subtab__count{ background:var(--primary-soft); color:var(--primary); }
/* Dar ekranda şerit genişliği doldurur ve sekmeler eşit paylaşır. */
@media (max-width:720px){
  .subtabs{ display:flex; width:100%; }
  .subtab{ flex:1 1 auto; padding:8px 10px; }
}

/* ---------- grafik ---------- */
/* Grafik oranını korur. Önceden `preserveAspectRatio="none"` ile
   geriliyordu: çizgi kalınlıkları, noktalar ve yazılar yatayda ezilip
   dikeyde inceliyordu — grafiğin kendisi doğruydu ama ucuz duruyordu. */
.chart{ width:100%; height:auto; display:block; }
.chart text{
  fill:var(--text-3); font-family:var(--font-body); font-size:10px;
  font-variant-numeric:tabular-nums;
}
/* Izgara yalnız yataydır ve çok soluktur: veriyi kafeslemek yerine
   göze yükseklik duygusu verir. */
/* Izgara GERİ ÇEKİLİR, taban çizgisi öne çıkar: veri okunur, ızgara
   değil. */
.chart .axis{ stroke:var(--border); stroke-width:1; opacity:.7; }
.chart .axis--base{ stroke:var(--border-strong); opacity:1; }
.chart .band{ fill:var(--sec); opacity:.1; }
/* Hedef bandı ADLANDIRILIR: renkli bir dikdörtgen «bu ne?» diye
   sordurtuyordu. */
.chart .bandlbl{
  font-size:9.5px; font-weight:600; letter-spacing:.06em;
  fill:var(--sec); opacity:.85;
}
/* Son değer doğrudan yazılır — okunacak tek sayı odur. */
.chart .endlbl{
  font-family:var(--font-display); font-size:15px; font-weight:700;
  fill:var(--text); font-variant-numeric:tabular-nums;
}
.chart .endunit{ font-size:9.5px; font-weight:600; fill:var(--text-3); }
.chart .line{
  fill:none; stroke:var(--sec); stroke-width:2;
  stroke-linejoin:round; stroke-linecap:round;
}
.chart .line--accent{ stroke:var(--accent); }
.chart .area{ fill:var(--sec); opacity:.09; }
.chart .area--accent{ fill:var(--accent); opacity:.09; }
/* Yüzey halkası: üst üste binen iki nokta birbirine karışmaz. */
.chart .pt{ fill:var(--sec); stroke:var(--surface); stroke-width:2; }
/* Son nokta «şu an neredeyim» demektir; vurgulu durur. */
.chart .pt--last{ stroke-width:2.5; }
.chart circle{ cursor:default; }
.chart .pt--accent{ fill:var(--accent); }
.chart .barfill{ fill:var(--sec); }
.chart .barfill--muted{ fill:var(--surface-3); }
.legend{ display:flex; flex-wrap:wrap; gap:12px; margin-top:8px; font-size:var(--fs-xs); color:var(--text-2); }
.legend__item{ display:flex; align-items:center; gap:6px; }
.legend__swatch{ width:9px; height:9px; border-radius:3px; flex:none; }

.stackbar{ display:flex; height:24px; border-radius:var(--r-sm); overflow:hidden; background:var(--surface-3); }
.stackbar__seg{ height:100%; }

/* ---------- adim listesi (protokol) ---------- */
.steps{ counter-reset:step; display:flex; flex-direction:column; gap:10px; }
.step{ display:grid; grid-template-columns:26px minmax(0,1fr); gap:11px; align-items:start; }
.step__no{
  counter-increment:step;
  width:24px; height:24px; border-radius:50%;
  background:var(--primary-soft); color:var(--primary);
  display:grid; place-items:center; font-size:var(--fs-xs); font-weight:700;
}
.step__no::before{ content:counter(step); }
.step__body b{ display:block; font-size:var(--fs-base); }
.step__body p{ font-size:var(--fs-sm); color:var(--text-2); }

/* ---------- ipucu (ⓘ) ve balon ---------- */
/* İpucu düğmesi bir başlığın yanında bir nokta kadar yer kaplar; 16×16
   görsel boyut kasıtlıdır. Dokunma alanı ayrı bir meseledir ve parmak
   pikseli görmez: görünmez bir ::after alanı 24×24'e çıkarır. Halka
   olduğu yerde kalır. */
.hint{
  position:relative;
  width:16px; height:16px; flex:none;
  border:1px solid var(--border-strong); background:none;
  border-radius:50%; padding:0;
  font-size:10px; font-weight:700; line-height:1;
  color:var(--text-3);
  display:inline-grid; place-items:center;
  vertical-align:middle; margin-left:5px;
}
.hint::after{
  content:''; position:absolute;
  left:50%; top:50%; transform:translate(-50%,-50%);
  width:24px; height:24px; border-radius:50%;
}
.hint:hover{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); }

.popover{
  position:fixed; z-index:var(--z-overlay);
  width:min(300px, calc(100vw - 24px));
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r);
  box-shadow:var(--shadow-lg);
  padding:13px 15px;
  animation:pop-in var(--dur) var(--ease);
}
@keyframes pop-in{ from{ opacity:0; transform:translateY(-4px);} to{ opacity:1; transform:none;} }
.popover__title{ font-family:var(--font-display); font-weight:700; font-size:var(--fs-base); margin-bottom:4px; }
.popover__body{ font-size:var(--fs-sm); color:var(--text-2); line-height:1.5; }
.popover__more{ font-size:var(--fs-sm); color:var(--text-2); line-height:1.5; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }

/* ---------- ekran açıklamaları paneli ----------
   Eskiden her ekranın altında açık duran bir metin duvarıydı ve sayfanın
   sonunu bozuyordu. Artık katlanır bir panel: kapalı hâlde tek satırlık
   sakin bir çubuk, açılınca kartlar ızgaraya yayılır. */

.rail{
  border:1px solid var(--border); border-radius:var(--r);
  background:var(--surface); overflow:hidden;
}
.rail__toggle{
  display:flex; align-items:center; gap:10px; width:100%;
  padding:11px 14px; border:0; background:none; cursor:pointer;
  text-align:left; color:var(--text-2);
  transition:background var(--dur) var(--ease), color var(--dur) var(--ease);
}
.rail__toggle:hover{ background:var(--surface-2); color:var(--text); }
.rail__toggle:focus-visible{ outline:2px solid var(--primary); outline-offset:-2px; }
.rail__icon{ width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; color:var(--text-3); }
.rail__label{
  flex:1; min-width:0;
  font-size:var(--fs-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase;
  /* Dar bir kolonda dört satıra bölünmesin. */
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.rail__count{
  flex:none; min-width:19px; padding:1px 6px; border-radius:20px;
  background:var(--surface-3); color:var(--text-3);
  font-size:10px; font-weight:700; text-align:center;
}
.rail__chev{ flex:none; display:grid; place-items:center; color:var(--text-3);
  transition:transform var(--dur) var(--ease); }
.rail__chev svg{ width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:1.9; }
.rail.is-open .rail__chev{ transform:rotate(180deg); }

.rail__body{
  display:grid; gap:14px 20px;
  padding:2px 14px 14px;
  border-top:1px solid var(--border);
  /* min() olmadan dar bir kapta 210px sabit kalıp taşıyordu. */
  grid-template-columns:repeat(auto-fit, minmax(min(210px, 100%), 1fr));
}
/* display:grid, tarayıcının [hidden] kuralını ezer — kapalıyken de
   görünüyordu. Sınıf seçicisiyle geri alınır. */
.rail__body[hidden]{ display:none; }
.railcard{
  border-left:2px solid var(--border-strong);
  padding:2px 0 2px 11px;
  cursor:pointer; background:none; border-top:none; border-right:none; border-bottom:none;
  text-align:left; width:100%;
  transition:border-color var(--dur) var(--ease);
}
.railcard:hover{ border-left-color:var(--primary); }
.railcard__t{
  font-size:var(--fs-xs); font-weight:700; letter-spacing:.03em;
  color:var(--text-2); display:block; margin-bottom:2px;
}
.railcard:hover .railcard__t{ color:var(--primary); }
.railcard__b{ font-size:var(--fs-sm); color:var(--text-3); line-height:1.45; display:block; }

/* ---------- siradaki hamle ---------- */
.nextup{
  display:flex; align-items:center; gap:14px;
  padding:15px 17px;
  border-radius:var(--r);
  background:linear-gradient(100deg, var(--primary-soft), color-mix(in srgb, var(--primary-soft) 40%, var(--surface)));
  border:1px solid color-mix(in srgb, var(--primary) 28%, var(--border));
}
.nextup__icon{
  width:38px; height:38px; flex:none; border-radius:var(--r-sm);
  background:var(--primary); color:var(--primary-ink);
  display:grid; place-items:center;
}
.nextup__icon svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.9; }
.nextup__body{ min-width:0; flex:1; }
.nextup__label{ font-size:var(--fs-xs); font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--primary); }
.nextup__title{ font-family:var(--font-display); font-weight:700; font-size:var(--fs-lg); line-height:1.25; margin-top:1px; }
.nextup__why{ font-size:var(--fs-sm); color:var(--text-2); margin-top:2px; }
.nextup--calm{ background:var(--surface); border-color:var(--border); }
.nextup--calm .nextup__icon{ background:var(--surface-3); color:var(--text-2); }
.nextup--calm .nextup__label{ color:var(--text-3); }
/* Dar ekranda eylem düğmesi gövdeyi sıkıştırmasın: alt satıra iner. */
@media (max-width:640px){
  .nextup{ flex-wrap:wrap; }
  .nextup__body{ flex:1 1 100%; }
  .nextup .btn{ width:100%; }
}

/* ---------- davranis serisi ---------- */
.streak{ display:flex; align-items:center; gap:9px; }
.streak__dots{ display:flex; gap:3px; }
.streak__dot{ width:9px; height:16px; border-radius:3px; background:var(--surface-3); }
.streak__dot.is-on{ background:var(--primary); }
.streak__dot.is-today{ box-shadow:0 0 0 2px var(--primary-soft); }

/* ---------- komut paleti ---------- */
.cmdk{
  position:fixed; inset:0; z-index:var(--z-toast);
  background:var(--scrim);
  display:flex; align-items:flex-start; justify-content:center;
  padding:12vh 16px 16px;
}
.cmdk__box{
  width:min(560px, 100%);
  background:var(--surface);
  border:1px solid var(--border-strong);
  border-radius:var(--r);
  box-shadow:var(--shadow-lg);
  overflow:hidden;
  display:flex; flex-direction:column;
  max-height:70vh;
}
.cmdk__input{
  border:none; outline:none; background:none;
  padding:15px 17px; font-size:var(--fs-lg);
  border-bottom:1px solid var(--border);
}
.cmdk__list{ overflow-y:auto; padding:6px; }
.cmdk__group{
  font-size:var(--fs-xs); font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--text-3); padding:8px 11px 4px;
}
.cmdk__item{
  display:flex; align-items:center; gap:11px;
  width:100%; padding:9px 11px; border-radius:var(--r-sm);
  border:none; background:none; text-align:left;
  font-size:var(--fs-base); color:var(--text);
}
.cmdk__item svg{ width:16px; height:16px; flex:none; stroke:currentColor; fill:none; stroke-width:1.8; color:var(--text-3); }
.cmdk__item.is-active{ background:var(--primary-soft); }
.cmdk__item.is-active svg{ color:var(--primary); }
.cmdk__text{ min-width:0; display:flex; flex-direction:column; gap:1px; }
.cmdk__label{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cmdk__sub{ font-size:var(--fs-xs); color:var(--text-3); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.cmdk__mark{ background:color-mix(in srgb, var(--accent) 32%, transparent); color:inherit; border-radius:3px; padding:0 1px; }
.cmdk__hintrow{ margin-left:auto; font-size:var(--fs-xs); color:var(--text-3); flex:none; }
.cmdk__empty{ padding:22px; text-align:center; color:var(--text-3); font-size:var(--fs-sm); }
.cmdk__foot{
  border-top:1px solid var(--border); padding:8px 14px;
  display:flex; gap:14px; font-size:var(--fs-xs); color:var(--text-3);
}
kbd{
  font-family:var(--font-body); font-size:10.5px; font-weight:700;
  border:1px solid var(--border-strong); border-bottom-width:2px;
  border-radius:5px; padding:1px 5px; background:var(--surface-2); color:var(--text-2);
}

/* ---------- yardimci siniflar (inline style yerine) ---------- */
.row--tight{ gap:6px; }
.tone-warn{ color:var(--accent); }
.tone-danger{ color:var(--danger); }
.tone-ok{ color:var(--primary); }
.anchor__value{
  font-family:var(--font-display); font-size:24px; font-weight:800; line-height:1.1;
}
.anchor__value .dim{ font-size:14px; }
.block__top{ align-items:flex-start; }
.block__topic{ font-weight:600; margin-top:2px; }
.block__subject{ padding-left:6px; }
.block__timer-wrap{ align-items:flex-end; }
.streak__unit{ font-weight:600; font-size:12px; }
.sleep__row{ gap:8px; margin-top:6px; }
.sleep__input{ width:80px; }
.ritual__cta{ margin-top:12px; }
.due__actions{ margin-top:10px; }
.due__hint{ margin-top:8px; }
.flashcard--sm{ min-height:120px; padding:20px; }

.errorpanel__actions{ gap:var(--sp-2); margin-top:var(--sp-3); }

/* ---------- sayfalama ---------- */
.pager{
  display:flex; align-items:center; justify-content:space-between; gap:var(--sp-3);
  margin-top:var(--sp-3); padding-top:var(--sp-3);
  border-top:1px solid var(--border);
}
.pager__info{ font-size:var(--fs-sm); color:var(--text-2); }

/* ---------- katlanir kart ---------- */
.collapse__btn{
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  width:100%; border:none; background:none; padding:0; text-align:left;
}
.collapse__title{ font-size:var(--fs-md); }
.collapse__chev{
  display:inline-grid; place-items:center; width:26px; height:26px;
  color:var(--text-3); transition:transform var(--dur) var(--ease);
}
.collapse__chev svg{ width:14px; height:14px; stroke:currentColor; fill:none; stroke-width:1.8; }
.collapse__chev.is-open{ transform:rotate(180deg); }

/* ---------- iskelet (yukleniyor) ---------- */
.skeleton{ display:flex; flex-direction:column; gap:9px; padding:4px 0; }
.skeleton__row{
  height:12px; border-radius:6px;
  background:linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 37%, var(--surface-2) 63%);
  background-size:400% 100%;
  animation:skeleton 1.3s ease infinite;
}
