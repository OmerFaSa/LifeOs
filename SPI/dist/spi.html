      badge:K.Badge({ label:g.rows.length + ' açık', tone:'warn' }),
      body:html`<div class="list">${map(g.rows.slice(0, 8), r => html`
        <div class="listitem">
          <div class="grow">
            <b class="small">${r.nutrient ? r.nutrient.name : r.id}</b>
            ${K.Badge({ label:r.kind === 'over' ? 'sınır aşıldı' : '%' + r.pct,
              tone:r.kind === 'over' ? 'danger' : r.pct >= 70 ? 'warn' : 'danger' })}
            <div class="tiny dim">${U.fmtNum(U.round(r.got, 1))} / ${U.fmtNum(r.target)}
              ${r.nutrient ? r.nutrient.unit : ''}${r.why ? ' · ' + r.why : ''}</div>
          </div>
          ${K.Button({ label:'Kaynaklar', size:'sm', act:'open-nutrient', data:{ 'data-id':r.id } })}
        </div>`)}</div>`,
    });
  }

  /* ------------------------------------------------------------ sheet'ler */

  function nutrientSheet(id){
    const n = SP.NUTRI_BY_ID[id];
    if(!n) return;
    const sources = SP.Nutri.sourcesFor(id, 8);
    const cheap = SP.Money.costPerNutrient(id, 6);
    const t = SP.Nutri.targets();
    const tg = t.ok ? t.micro[id] : null;

    UI.sheet({
      title:n.name, subtitle:n.note, wide:true,
      body:String(K.Stack([
        when(tg, () => K.Table({ tight:true, headers:['Alan', 'Değer'], rows:[
          ['Günlük hedef', U.fmtNum(tg.target) + ' ' + n.unit],
          ['Taban referans', U.fmtNum(tg.base) + ' ' + n.unit],
          ['Çarpan', tg.mult === 1 ? 'yok' : '×' + U.fmtNet(tg.mult) + (tg.why ? ' — ' + tg.why : '')],
          ['Üst sınır', n.ul ? U.fmtNum(n.ul) + ' ' + n.unit : 'tanımlı değil'],
          ['İlgili ölçüm', n.marker && SP.BIO_BY_ID[n.marker] ? SP.BIO_BY_ID[n.marker].name : '—'],
        ] })),
        K.Notice({ tone:'info', title:'Emilim:', body:n.absorb.note }),
        html`<h3 class="section-h">En yoğun kaynaklar</h3>`,
        K.Table({ tight:true, headers:['Gıda', { label:'100 g\'da', num:true }, 'Porsiyon'],
          rows:sources.map(s => [s.food.name, U.fmtNum(U.round(s.per100, 2)) + ' ' + n.unit,
            (s.food.portions || [])[0] ? (s.food.portions[0].label + ' = ' + s.food.portions[0].g + ' g') : '—']) }),
        when(cheap.length, () => html`<h3 class="section-h">En ucuz kaynaklar</h3>`),
        when(cheap.length, () => K.Table({ tight:true,
          headers:['Gıda', { label:'Birim başı', num:true }, 'Fiyat'],
          rows:cheap.map(c => [c.food.name,
            U.fmtNet(c.tlPerUnit) + ' TL / ' + n.unit,
            html`${U.fmtNum(c.price.tl)} TL/kg ${P.cert(c.cert)}`]) })),
      ])),
      footer:String(K.Button({ label:'Kapat', act:'sheet-close' })),
      noFocus:true,
    });
  }

  function searchSheet(){
    const q = S.ui.foodQuery;
    const cat = S.ui.foodCat;
    let list = SP.FOODS;
    if(cat !== 'all') list = list.filter(f => f.cat === cat);
    if(q) list = list.filter(f => U.norm(f.name + ' ' + (f.aliases || []).join(' ')).indexOf(U.norm(q)) >= 0);
    const page = SP.C.paginate(list, S.ui.foodPage, 12);

    UI.sheet({
      title:'Besin ara', subtitle:list.length + ' gıda', wide:true,
      body:String(K.Stack([
        K.Input({ id:'food-q', value:q, placeholder:'Ara: mercimek, somon, yoğurt…',
          change:'food-query', data:{ 'data-debounce':'200' } }),
        K.Select({ value:cat, change:'food-cat',
          options:[{ value:'all', label:'Tüm kategoriler' }]
            .concat(SP.FOOD_CATS.map(c => ({ value:c.id, label:c.label }))) }),
        html`<div class="stack-xs">${map(page.items, f => html`
          <button class="foodrow" data-act="pick-food" data-id="${f.id}">
            <span class="foodrow__name">${f.name}</span>
            <span class="foodrow__meta num">${f.kcal} kcal · P ${U.fmtNet(f.p)} g</span>
          </button>`)}</div>`,
        when(!page.items.length, () => K.Empty({ text:'Eşleşen gıda yok.' })),
        K.Pager({ page:page.page, pages:page.pages, total:page.total, act:'food-page' }),
      ])),
      footer:String(K.Button({ label:'Kapat', act:'sheet-close' })),
      noFocus:true,
    });
  }

  function portionSheet(foodId){
    const f = SP.FOOD_BY_ID[foodId];
    if(!f) return;
    UI.sheet({
      title:f.name, subtitle:'Porsiyon seç',
      body:String(K.Stack([
        html`<div class="row wrap">${map(f.portions || [], p => K.Button({
          label:p.label + ' (' + p.g + ' g)', size:'sm',
          act:'add-portion', data:{ 'data-id':f.id, 'data-g':p.g, 'data-label':p.label } }))}</div>`,
        K.Field({ label:'Ya da gram gir (tarttıysan)',
          input:K.Input({ id:'portion-g', type:'number', numeric:true, min:1, step:'1', placeholder:'150' }) }),
        K.Table({ tight:true, headers:['100 gramda', { label:'Değer', num:true }], rows:[
          ['Kalori', f.kcal + ' kcal'], ['Protein', U.fmtNet(f.p) + ' g'],
          ['Yağ', U.fmtNet(f.f) + ' g'], ['Karbonhidrat', U.fmtNet(f.c) + ' g'],
          ['Lif', U.fmtNet(f.fib || 0) + ' g'],
        ] }),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Gram ile ekle', tone:'primary', act:'add-grams', data:{ 'data-id':f.id } })}`),
    });
  }

  /* --------------------------------------------------------------- ekran */

  /* ------------------------------------------------------------- öneri

     Bu sayfa yeni bir kural icat etmez. Nesrin'in (beslenme) hedefi zaten
     Kerem'in (laboratuvar) bulgusundan besleniyor: SP.Nutri.labAdjust bir
     tahlil sonucu hedef bandın dışındaysa ilgili besin öğesinin hedefini
     yükseltir. Burada o zincir GÖRÜNÜR hale gelir — hangi ölçüm, hangi
     hedefi, ne kadar değiştirdi ve bunun karşılığı hangi yemektir.

     Zincir: ölçüm → hedef çarpanı → eksik öğe → o öğeyi taşıyan gıda. */

  const TABS = [
    { id:'gunluk', label:'Öğünler',      icon:'meal' },
    { id:'oneri',  label:'Öneri',        icon:'target' },
    { id:'deger',  label:'Besin değeri', icon:'layers' },
  ];

  function tabs(){
    const rows = M.mealsOf(shownDate());
    const items = TABS.map(t => Object.assign({}, t,
      t.id === 'gunluk' && rows.length ? { count:rows.length } : {}));
    return K.Subtabs({ items, value:S.ui.mealTab || 'gunluk', act:'meal-tab',
      aria:'Besin görünümü' });
  }

  /* Bazal metabolizma → hareket → hedef. Her adım ayrı yazılır ki
     çıkan sayının nereden geldiği tartışılabilir olsun. */
  function energyCard(){
    const tg = SP.Nutri.targets();
    const p = S.profile || {};
    if(!tg.ok){
      return K.Card({ title:'Günlük enerji',
        body:K.Notice({ tone:'warn', title:'Hesaplanamıyor.',
          body:'Profilde ' + tg.missing.join(', ') + ' eksik. Bu üçü olmadan bazal '
             + 'metabolizma tahmin edilmez; uydurulmuş bir sayı yazılmaz.' }),
        foot:K.Button({ label:'Profili tamamla', size:'sm', tone:'primary',
          act:'go', data:{ 'data-route':'family' } }) });
    }
    /* Gosterilen carpan, HESAPTA kullanilan carpanin ta kendisidir.
       Profilde hareket duzeyi secilmemisse motor varsayilana duser; kart
       da o varsayilani yazar, yoksa zincir kendi sayisini yalanlar. */
    const factor = SP.Nutri.activityFactor(p);
    const act = SP.ACTIVITY_LEVELS.find(a => a.factor === factor && a.id === p.activity)
      || SP.ACTIVITY_LEVELS.find(a => a.factor === factor);
    const guessed = !SP.ACTIVITY_LEVELS.some(a => a.id === p.activity);
    return K.Card({
      title:'Günlük enerji', hint:'macro-target',
      sub:'Bazal metabolizmadan hedefe',
      badge:K.Badge({ label:tg.goal.label, tone:'info' }),
      body:html`
        <div class="chain">
          <div class="chain__step">
            <span class="chain__label">Bazal metabolizma</span>
            <span class="chain__value num">${U.fmtNum(tg.bmr)}<small>kcal</small></span>
            <span class="chain__note">Mifflin-St Jeor · kilo, boy, yaş ve cinsiyet</span>
          </div>
          <div class="chain__op">×${U.fmtNet(factor)}</div>
          <div class="chain__step">
            <span class="chain__label">Hareketle</span>
            <span class="chain__value num">${U.fmtNum(tg.tdee)}<small>kcal</small></span>
            <span class="chain__note">${act ? act.label : 'varsayılan'}${when(guessed,
              () => html` <b>(profilde seçilmedi)</b>`)} — ${act ? act.note : ''}</span>
          </div>
          <div class="chain__op">${tg.goal.deficit === 0 ? '=' :
            (tg.goal.deficit > 0 ? '+' : '−') + '%' + Math.abs(Math.round(tg.goal.deficit * 100))}</div>
          <div class="chain__step chain__step--end">
            <span class="chain__label">Hedef</span>
            <span class="chain__value num">${U.fmtNum(tg.kcal)}<small>kcal</small></span>
            <span class="chain__note">${tg.goal.note}</span>
          </div>
        </div>
        <div class="cols-3 mt-16">
          ${K.Stat({ label:'Protein', value:tg.protein.min + '–' + tg.protein.max, unit:'g' })}
          ${K.Stat({ label:'Yağ', value:tg.fat.min + '–' + tg.fat.max, unit:'g' })}
          ${K.Stat({ label:'Lif', value:String(tg.fiber), unit:'g' })}
        </div>`,
      foot:html`<span class="small dim">Hedef değiştirmek için Hane ekranındaki
        amaç alanını değiştir.</span>`,
    });
  }

  /* Koçlar arası bağ: Kerem'in bulgusu Nesrin'in hedefini değiştirdiyse
     burada satır satır yazar. Değiştirmediyse bu kart hiç çizilmez —
     olmayan bir bağ için boş kutu göstermek gürültüdür. */
  function labLinkCard(){
    const tg = SP.Nutri.targets();
    const adj = tg.adjustments || {};
    const ids = Object.keys(adj);
    if(!ids.length){
      return K.Card({ title:'Tahlil bağı', hint:'lab-linked-food',
        body:K.Notice({ tone:'info',
          body:SP.Bio.summary().measured
            ? 'Şu an hiçbir tahlil sonucu beslenme hedefini değiştirmiyor. '
              + 'Ölçümler hedef bandın içinde.'
            : 'Henüz test girilmedi. Tahlil sonucu girildiğinde beslenme hedefi '
              + 'kendiliğinden ona göre ayarlanır.' }),
        foot:K.Button({ label:'Testler bölümüne git', size:'sm',
          act:'go', data:{ 'data-route':'labs' } }) });
    }
    return K.Card({
      title:'Tahlil bağı', hint:'lab-linked-food',
      sub:'Laboratuvar bulgusu beslenme hedefini değiştirdi',
      badge:K.Badge({ label:ids.length + ' hedef', tone:'warn' }),
      body:html`${map(ids, id => {
        const a = adj[id];
        const n = SP.NUTRI_BY_ID[id];
        const b = SP.BIO_BY_ID[a.marker];
        const last = M.latestOf(a.marker);
        return html`
          <div class="link">
            <div class="link__from">
              ${P.avatar('lab', 'sm')}
              <button class="linkbtn" data-act="open-marker-x" data-id="${a.marker}">
                ${b ? b.name : a.marker}</button>
              ${when(last, () => html`<b class="num small">${U.fmtNum(last.v)}
                <span class="dim">${b ? b.unit : ''}</span></b>`)}
            </div>
            <div class="link__arrow" aria-hidden="true">→</div>
            <div class="link__to">
              ${P.avatar('nutri', 'sm')}
              <b class="small">${n ? n.name : id}</b>
              ${K.Badge({ label:'hedef ×' + U.fmtNet(a.mult),
                tone:a.mult > 1 ? 'warn' : 'info' })}
            </div>
            <p class="link__why">${a.why}</p>
          </div>`;
      })}`,
    });
  }

  /* Eksik öğeyi hangi yemek kapatır? Öneri gıda listesinden gelir,
     modelden değil: kural motoru burada da otoritedir. */
  function suggestCard(){
    const g = SP.Nutri.gaps(7);
    if(!g.ok){
      return K.Card({ title:'Bugün ne yenmeli?',
        body:K.Notice({ tone:'info',
          body:'Öneri için en az birkaç günlük öğün kaydı gerekir. '
            + 'Kayıt yoksa eksik hesaplanamaz — sıfır sayılmaz.' }),
        foot:K.Button({ label:'Öğün ekle', size:'sm', tone:'primary',
          act:'meal-tab', data:{ 'data-tab':'gunluk' } }) });
    }
    const under = g.rows.filter(r => r.kind === 'under').slice(0, 4);
    if(!under.length){
      return K.Card({ title:'Bugün ne yenmeli?',
        body:K.Notice({ tone:'ok', body:'Son yedi günün ortalaması bütün besin '
          + 'öğelerinde hedefi karşılıyor. Öneri üretilmedi.' }) });
    }
    return K.Card({
      title:'Bugün ne yenmeli?', hint:'nutri-gap',
      sub:'Son yedi günün en büyük eksikleri ve onları taşıyan gıdalar',
      body:html`${map(under, r => html`
        <div class="sugg">
          <div class="sugg__head">
            <b class="small">${r.nutrient.name}</b>
            ${K.Badge({ label:'%' + Math.round(r.pct), tone:r.pct < 60 ? 'danger' : 'warn' })}
            <span class="tiny dim">${U.fmtNum(U.round(r.gap, 1))} ${r.nutrient.unit} eksik</span>
          </div>
          <div class="sugg__foods">${map(SP.Nutri.sourcesFor(r.id, 4), sr => html`
            <button class="suggfood" data-act="pick-food" data-id="${sr.food.id}">
              <b>${sr.food.name}</b>
              <span class="num">${U.fmtNum(U.round(sr.per100, 1))} ${r.nutrient.unit}
                <span class="dim">/100 g</span></span>
            </button>`)}</div>
          ${when(r.why, () => html`<p class="sugg__why">${r.why}</p>`)}
        </div>`)}`,
      foot:html`<span class="small dim">Bir gıdaya dokunarak porsiyonuyla öğüne ekleyebilirsin.</span>`,
    });
  }

  function adviceView(){
    return html`
      <section class="sect">
        <div class="sect__h"><div class="sect__ht">
          <div class="sect__eyebrow">Hedef</div>
          <h2>Enerji ve öneri</h2>
          <p>Bazal metabolizmadan hedefe, tahlil bulgusundan tabağa. Her adımın
            gerekçesi yazar; hiçbir sayı kaynağı olmadan görünmez.</p>
        </div></div>
        <div class="grid">
          <div class="span-7"><div class="stack">${[energyCard(), suggestCard()]}</div></div>
          <div class="span-5"><div class="stack">${[labLinkCard(), P.clinicalNote()]}</div></div>
        </div>
      </section>`;
  }

  async function render(){
    const tab = S.ui.mealTab || 'gunluk';
    const head = html`<div class="mb-8">${tabs()}</div>`;

    if(tab === 'oneri'){
      return String(html`${head}${K.Ledger(() => [
        energyCard(), labLinkCard(), suggestCard(),
      ])}
      <div class="mt-24">${raw(UI.rail(['macro-target', 'lab-linked-food', 'nutri-gap']))}</div>`);
    }

    if(tab === 'deger'){
      return String(html`${head}${K.Ledger(() => [microCard(), gapCard()])}
      <div class="mt-24">${raw(UI.rail(['bioavailability', 'nutri-gap']))}</div>`);
    }

    return String(html`${head}${K.Ledger(() => [
      quickEntry(), dayCard(), targetCard(),
    ])}
    <div class="mt-24">${raw(UI.rail(['portion', 'bioavailability', 'macro-target']))}</div>`);
  }

  /* Metinden gelen kalemleri secili ogune yazar. */
  async function pushItems(items, note){
    const d = shownDate();
    const slot = S.ui.mealSlot || guessSlot();
    const rows = M.mealsOf(d).slice();
    let meal = rows.find(m => m.slot === slot);
    if(!meal){ meal = M.newMeal(slot); rows.push(meal); }
    meal.items = (meal.items || []).concat(items);
    if(note) meal.note = [meal.note, note].filter(Boolean).join(' · ');
    await M.saveMeals(d, rows);
  }

  const handle = {
    async 'open-photo'(){ photoFile = null; photoRes = null; photoSheet(); },
    async 'run-photo'(){
      if(!photoFile) return;
      const hints = {
        amount:(document.getElementById('ph-amount') || {}).value || '',
        vessel:(document.getElementById('ph-vessel') || {}).value || '',
        extra:(document.getElementById('ph-extra') || {}).value || '',
      };
      UI.toast('Fotoğraf okunuyor…');
      photoRes = await SP.Extract.fromMealPhoto(photoFile, hints);
      photoPreviewSheet(photoRes);
    },
    async 'toggle-photo-row'(el){
      const i = Number(el.dataset.i);
      if(!photoRes || !photoRes.items[i]) return;
      photoRes.items[i].skip = !el.checked;
      photoPreviewSheet(photoRes);
    },
    async 'save-photo'(){
      if(!photoRes) return;
      const items = photoRes.items.filter(x => !x.skip);
      if(!items.length) return;
      await pushItems(items.map(i => ({ foodId:i.foodId, g:i.g, cert:'estimated',
        portion:'fotoğraf' })), 'fotoğraftan');
      photoRes = null; photoFile = null;
      UI.closeSheet();
      UI.toast(items.length + ' gıda eklendi · tahmin');
      SP.App.render();
    },
    async 'meal-tab'(el){ S.ui.mealTab = el.dataset.tab; SP.App.render(); },
    /* Tahlil bagindan olcume gitmek: Testler bolumu o olcumun egilimini acar. */
    async 'open-marker-x'(el){
      S.ui.trendMarker = el.dataset.id;
      S.ui.labTab = 'trend';
      SP.App.go('labs');
    },
    async 'shift-day'(el){
      const n = Number(el.dataset.value);
      S.ui.mealDate = n === 0 ? null : U.iso(U.addDays(U.parse(shownDate()), n));
      if(S.ui.mealDate === U.todayISO()) S.ui.mealDate = null;
      SP.App.render();
    },
    async 'focus-meal'(){
      const el = document.getElementById('meal-text');
      if(el) el.focus();
    },
    async 'add-meal'(){
      const el = document.getElementById('meal-text');
      if(!el || !el.value.trim()) return;
      const parsed = SP.Parse.parseMeal(el.value);
      if(!parsed.items.length){ UI.toast(parsed.note); return; }
      await pushItems(parsed.items.map(i => ({ foodId:i.foodId, g:i.g, cert:i.cert, portion:i.portion })),
        el.value.trim());
      el.value = '';
      UI.toast(parsed.note);
      SP.App.render();
    },
    async 'del-meal'(el){
      await M.deleteMeal(shownDate(), el.dataset.id);
      SP.App.render();
    },
    async 'del-item'(el){
      const rows = M.mealsOf(shownDate()).slice();
      const meal = rows.find(m => m.id === el.dataset.id);
      if(!meal) return;
      meal.items.splice(Number(el.dataset.i), 1);
      await M.saveMeals(shownDate(), rows);
      SP.App.render();
    },
    async 'open-search'(){ S.ui.foodPage = 1; searchSheet(); },
    async 'food-page'(el){ S.ui.foodPage = Number(el.dataset.page); searchSheet(); },
    async 'pick-food'(el){ portionSheet(el.dataset.id); },
    async 'add-portion'(el){
      await pushItems([{ foodId:el.dataset.id, g:Number(el.dataset.g),
        cert:'estimated', portion:el.dataset.label }]);
      UI.closeSheet();
      UI.toast('Eklendi');
      SP.App.render();
    },
    async 'add-grams'(el){
      const input = document.getElementById('portion-g');
      const g = input ? Number(input.value) : 0;
      if(!g){ UI.toast('Gram gir'); return; }
      await pushItems([{ foodId:el.dataset.id, g, cert:'measured', portion:null }]);
      UI.closeSheet();
      UI.toast('Eklendi · ölçüldü');
      SP.App.render();
    },
    async 'open-nutrient'(el){ nutrientSheet(el.dataset.id); },
  };

  const change = {
    async 'meal-photo'(el){
      photoFile = (el.files && el.files[0]) || null;
      const n = document.getElementById('photo-name');
      if(n) n.textContent = photoFile ? photoFile.name : '';
      const run = document.querySelector('[data-act="run-photo"]');
      if(run) run.disabled = !photoFile || !SP.Extract.modelReady();
    },
    async 'pick-slot'(el){ S.ui.mealSlot = el.value; },
    async 'food-query'(el){ S.ui.foodQuery = el.value; S.ui.foodPage = 1; searchSheet(); },
    async 'food-cat'(el){ S.ui.foodCat = el.value; S.ui.foodPage = 1; searchSheet(); },
  };

  return {
    id:'meals',
    title:'Öğünler',
    headline(){
      const tg = SP.Nutri.targets();
      if(!tg.ok) return 'Hedef için profil eksik.';
      const t = SP.Nutri.dayTotals(shownDate());
      if(t.empty) return 'Bugün hiç öğün girilmedi.';
      const pct = U.pct(t.kcal, tg.kcal);
      if(pct > 115) return 'Bugün hedefin üstündesin.';
      if(pct >= 85) return 'Bugün hedefin içindesin.';
      return 'Günün ' + Math.round(pct) + '%\u2019i tamam.';
    },
    lede(){
      const tg = SP.Nutri.targets();
      if(!tg.ok){
        return 'Profilde ' + tg.missing.join(', ') + ' girilince bazal metabolizma ve '
          + 'hedef hesaplanır. Eksik veriden sayı uydurulmaz.';
      }
      const adj = Object.keys(tg.adjustments || {}).length;
      return tg.goal.label.toLocaleLowerCase('tr-TR') + ' hedefi için günde '
        + U.fmtNum(tg.kcal) + ' kcal ve ' + tg.protein.min + ' g protein.'
        + (adj ? ' ' + adj + ' hedef, tahlil sonucuna göre yükseltildi.' : '');
    },
    stats(){
      const tg = SP.Nutri.targets();
      if(!tg.ok) return [];
      const t = SP.Nutri.dayTotals(shownDate());
      return [
        { value:U.fmtNum(tg.bmr), label:'bazal (kcal)' },
        { value:U.fmtNum(tg.kcal), label:'hedef (kcal)' },
        { value:t.empty ? '0' : U.fmtNum(Math.round(t.kcal)), label:'bugün alınan' },
        { value:t.empty ? '0' : Math.round(t.protein), unit:'g', label:'protein' },
      ];
    },
    subtitle(){
      const t = SP.Nutri.dayTotals(shownDate());
      const tg = SP.Nutri.targets();
      if(t.empty) return U.fmtDate(shownDate()) + ' · kayıt yok';
      return Math.round(t.kcal) + ' kcal · protein ' + Math.round(t.protein) + ' g'
        + (tg.ok ? ' / ' + tg.protein.min + ' g' : '');
    },
    actions(){
      return String(html`${K.Button({ label:'Öğün ekle', icon:'plus', size:'sm', tone:'primary',
        act:'meal-tab', data:{ 'data-tab':'gunluk' } })}
        ${K.Button({ label:'Öneriyi aç', size:'sm', act:'meal-tab', data:{ 'data-tab':'oneri' } })}`);
    },
    render, handle, change, guessSlot,
  };
})();

/* ==== js/screens/kitchen.js ==== */
/* Mutfak — hane uyumu.

   Sistemin en pratik iddiası burada durur: evde tek tencere yemek pişer ve
   herkes kendi hedefine göre pay alır. Herkese ayrı diyet yemeği pişirmek
   sürdürülebilir değildir; sürdürülemeyen sistem uygulanmaz.

   Porsiyon çarpanı gizli bir sabit değildir: bu öğünün günlük hedefin
   yüzde kaçını taşıdığı ekranda yazar ve değiştirilebilir. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.kitchen = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  /* Hane profillerinin tam kaydini okur. Kendi profilimiz depoda, digerleri
     hane listesinde ozet olarak durur — ozet porsiyon hesabina yetmez, bu
     yuzden eksik olanlar acikca bildirilir. */
  function members(){
    const list = M.householdList();
    const me = S.profile;
    return list.map(row => {
      if(row.id === me.id) return Object.assign({}, me, { self:true });
      return Object.assign({ self:false, weightKg:null, heightCm:null }, row);
    });
  }

  function dishOptions(){
    return SP.FOODS.filter(f => f.cat === 'yemek' || f.cat === 'et' || f.cat === 'balik')
      .map(f => ({ value:f.id, label:f.name }));
  }

  function setupCard(){
    const dishId = S.ui.kitchenDish || 'kuru-fasulye-etli';
    return K.Card({
      title:'Pişen yemek', hint:'household',
      sub:'Tencerenin tamamı',
      body:html`
        <div class="cols-2">
          ${K.Field({ label:'Yemek',
            input:K.Select({ value:dishId, change:'pick-dish', options:dishOptions() }) })}
          ${K.Field({ label:'Toplam gram',
            input:K.Input({ id:'kitchen-g', type:'number', numeric:true, step:'50', min:100,
              value:S.ui.kitchenGrams, change:'set-grams' }) })}
        </div>
        <p class="small muted mt-10">Tencerede kaç gram olduğunu bilmiyorsan kaba bir tahmin yeter:
          paylaştırma oranları değişmez, yalnızca mutlak gramlar ölçeklenir.</p>`,
    });
  }

  function splitCard(){
    const dishId = S.ui.kitchenDish || 'kuru-fasulye-etli';
    const res = SP.Nutri.householdSplit(dishId, S.ui.kitchenGrams, members());

    if(!res.ok){
      return K.Card({ title:'Paylaştırma',
        body:K.Notice({ tone:'warn', body:res.error }),
        foot:K.Button({ label:'Profilleri aç', size:'sm', tone:'primary',
          act:'go', data:{ 'data-route':'family' } }) });
    }

    return K.Card({
      title:'Tabağa paylaştırma',
      sub:res.food.name + ' · ' + U.fmtNum(res.totalGrams) + ' g',
      badge:res.short ? K.Badge({ label:res.short + ' g eksik', tone:'warn' })
        : K.Badge({ label:'yeterli', tone:'ok' }),
      body:html`
        ${map(res.rows, r => html`
          <div class="splitrow">
            <span class="splitrow__name">${r.member.name || 'Adsız'}
              ${when(r.member.self, () => html`<span class="tiny dim"> · sen</span>`)}</span>
            <span class="tiny dim">${U.fmtNum(r.kcalNeed)} kcal hedef</span>
            <span class="splitrow__g num">${U.fmtNum(r.share)} g</span>
            <span class="splitrow__note">
              ${when(r.gets, () => html`Bu porsiyon ${Math.round(r.gets.kcal)} kcal,
                ${Math.round(r.gets.protein)} g protein taşır.`)}
              ${map(r.addons, a => html` <b>${a.text}</b>`)}
            </span>
          </div>`)}
        ${when(res.short, () => K.Notice({ tone:'warn', class:'mt-12',
          body:'Tencere hanenin bu öğün için ihtiyacının altında: yaklaşık '
            + res.short + ' gram daha gerekiyor. Yan gıda (yoğurt, salata, ekmek) farkı kapatır.' }))}
        ${K.Notice({ tone:'info', class:'mt-10',
          body:'Bu öğün günlük hedefin %' + Math.round(res.mealShare * 100)
            + '\'i sayıldı. Ana öğün varsayımıdır; kahvaltı için pay daha küçüktür.' })}`,
    });
  }

  function memberCard(){
    const list = members();
    const missing = list.filter(m => !m.weightKg || !m.heightCm || !m.birthYear);
    return K.Card({
      title:'Hane', hint:'profiles',
      sub:list.length + ' profil',
      body:html`
        ${K.Table({ tight:true, headers:['Kişi', 'Kilo', 'Boy', 'Hedef'],
          rows:list.map(m => [
            html`${m.name || 'Adsız'}${m.self ? html` <span class="tiny dim">· sen</span>` : ''}`,
            m.weightKg ? U.fmtNum(m.weightKg) + ' kg' : html`<span class="dim">—</span>`,
            m.heightCm ? U.fmtNum(m.heightCm) + ' cm' : html`<span class="dim">—</span>`,
            m.goal ? (SP.GOALS.find(g => g.id === m.goal) || {}).label || '—' : html`<span class="dim">—</span>`,
          ]) })}
        ${when(missing.length, () => K.Notice({ tone:'info', class:'mt-10',
          body:missing.length + ' profilde kilo, boy ya da doğum yılı eksik. '
            + 'Eksik profiller paylaştırmaya girmez — tahmin edilmez.' }))}`,
      foot:K.Button({ label:'Profilleri düzenle', size:'sm', act:'go', data:{ 'data-route':'family' } }),
    });
  }

  function dishInfoCard(){
    const f = SP.FOOD_BY_ID[S.ui.kitchenDish || 'kuru-fasulye-etli'];
    if(!f) return null;
    const c = SP.Nutri.contribution(f.id, 100);
    return K.Card({
      title:f.name, sub:'100 gramda',
      body:html`
        ${raw(UI.macroSplit({ protein:c.protein * 4, fat:c.fat * 9, carb:c.carb * 4 }))}
        <div class="nutgrid mt-12">
          ${P.nutCell({ label:'Kalori', got:c.kcal, target:c.kcal, unit:'kcal' })}
          ${P.nutCell({ label:'Protein', got:c.protein, target:c.protein, unit:'g', digits:1 })}
          ${P.nutCell({ label:'Lif', got:c.fiber, target:c.fiber, unit:'g', digits:1 })}
          ${P.nutCell({ label:'Demir', got:c.micro.iron || 0, target:c.micro.iron || 1, unit:'mg', digits:1 })}
        </div>
        ${when((f.flags || []).length, () => html`<div class="mt-10">${map(f.flags, fl => {
          const a = SP.ABSORB_FACTORS[fl];
          return a ? P.absorbNote({ kind:a.kind, text:a.name + ' — ' + a.text }) : '';
        })}</div>`)}`,
    });
  }

  async function render(){
    return String(html`
      ${K.Ledger(() => [setupCard(), splitCard(), memberCard(), dishInfoCard()])}
      <div class="mt-24">${raw(UI.rail(['household', 'portion', 'profiles']))}</div>`);
  }

  const handle = {};

  const change = {
    async 'pick-dish'(el){ S.ui.kitchenDish = el.value; SP.App.render(); },
    async 'set-grams'(el){
      const v = Number(el.value);
      S.ui.kitchenGrams = isFinite(v) && v > 0 ? v : 1000;
      SP.App.render();
    },
  };

  return {
    id:'kitchen',
    title:'Mutfak',
    headline(){
      const list = SP.Model.householdList();
      if(list.length < 2) return 'Tek tencere, tek porsiyon.';
      return 'Tek tencere, ' + list.length + ' ayrı porsiyon.';
    },
    lede(){
      return 'Aynı yemek herkese pişer; kimin tabağına ne kadar gireceği '
        + 'hedeflerden hesaplanır. Herkese ayrı yemek pişirme zorunluluğu kalkar.';
    },
    subtitle(){
      const f = SP.FOOD_BY_ID[S.ui.kitchenDish || 'kuru-fasulye-etli'];
      return (f ? f.name : '') + ' · ' + U.fmtNum(S.ui.kitchenGrams) + ' g';
    },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/move.js ==== */
/* Hareket — Modül 3'ün ekranı.

   Ekran ALANLARA ayrılır. Kullanıcı gününü planlarken "bugün hangi kalıbı
   çalışayım" diye değil, "kardiyo mu yapayım, kuvvet mi, yoksa dinleneyim
   mi" diye düşünür. Sekmeler o soruyu karşılar:

     Bugün      toparlanmaya göre günün yük emri ve seans kaydı
     Kardiyo    yürüyüş, koşu, evde sprint
     Kuvvet     vücut ağırlığıyla altı kalıp — kendi içinde ikinci şeritle ayrılır
     Esneklik   mobilite akışları
     Dinlenme   yükün diğer yarısı: indirme haftası, boş gün, uyku
     İlerleme   yük eğrisi, son hafta / son ay oranı

   Dinlenmenin kendi sayfası olması kasıtlıdır. Antrenman programlarında
   dinlenme çoğu zaman "yapılmayan şey" olarak geçer ve görünmez olur;
   burada görünür, çünkü yük yönetiminin yarısı odur.

   Ekranın kuralı: sistem yükü kendiliğinden azaltabilir ama asla
   kendiliğinden artıramaz. Artırma kararı hep kullanıcınındır. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.move = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map, cls } = SP.h;
  const K = SP.C, P = SP.Parts;

  /* Sekmeler: iki genel görünüm ve arada dört faaliyet alanı. */
  const TABS = [{ id:'bugun', label:'Bugün', icon:'today' }]
    .concat(SP.AREAS.map(a => ({ id:a.id, label:a.label, icon:a.icon })))
    .concat([{ id:'ilerleme', label:'İlerleme', icon:'chart' }]);

  /* Kuvvet alanının ikinci şeridi: hareket kalıpları. Yalnız kuvvette
     çizilir — kardiyoda ve esneklikte kalıp yoktur, orada şerit çizmek
     boş bir seçim sunmak olurdu. */
  function patternTabs(){
    const rows = SP.Move.patternBalance();
    const byId = {};
    rows.forEach(r => { byId[r.pattern.id] = r.count; });
    return [{ id:'all', label:'Tümü', count:SP.EXERCISES.filter(e => e.kind === 'strength').length }]
      .concat(SP.PATTERNS.map(p => ({ id:p.id, label:p.label, count:byId[p.id] || null })));
  }

  function exercisesOfArea(areaId){
    const area = SP.AREA_BY_ID[areaId];
    if(!area || !area.kind) return [];
    const list = SP.EXERCISES.filter(e => e.kind === area.kind);
    if(areaId !== 'kuvvet') return list;
    const pat = S.ui.movePattern || 'all';
    return pat === 'all' ? list : list.filter(e => e.pattern === pat);
  }

  /* --------------------------------------------------------------- bugün */

  function orderEntry(){
    const rx = SP.Move.prescription();
    const r = rx.readiness;
    return K.Entry({
      label:'Günün yük emri', hint:'recovery-order',
      meta:rx.factor >= 1 ? 'tam yük' : 'yükün %' + Math.round(rx.factor * 100) + '\u2019i',
      note:'Emri toparlanma belirler, istek değil. Sistem yükü kendiliğinden '
        + 'azaltabilir ama asla kendiliğinden artıramaz.',
      action:when(!r.ok, () => K.Button({ label:'Veri gir', tone:'primary',
        act:'go', data:{ 'data-route':'today' } })),
      body:html`
        ${when(r.ok, () => html`<div class="row wrap" style="gap:26px">
          ${raw(UI.gauge(r.score, { tone:r.band.tone, label:r.band.label, size:122,
            bands:SP.READINESS_BANDS.map(b => b.min).filter(x => x > 0) }))}
          <p class="grow small" style="min-width:210px">${r.band.order}</p>
        </div>`)}
        ${map(rx.reasons, x => K.Notice({ tone:x.kind === 'muted' ? 'info' : x.kind,
          body:(r.ok && x.id === 'readiness') ? x.short : x.text }))}
        ${when(rx.kind === 'rest', () => K.Notice({ tone:'info',
          body:'Bu bir geri adım değil, planın parçası. Asgari gün yine geçerli: '
            + SP.LOAD_RULES.minDay.minutes + ' dakika yürüyüş.' }))}`,
    });
  }

  function pickSessionEntry(){
    const rx = SP.Move.prescription();
    const suggested = rx.suggest.map(t => t.id);
    return K.Entry({
      label:'Seans seç',
      meta:SP.SESSION_TEMPLATES.length + ' şablon',
      note:'Öneri toparlanma bandından gelir; istediğini seçebilirsin.',
      body:html`<div class="picks">${map(SP.SESSION_TEMPLATES, t => html`
        <button class="${cls('pickcard', suggested[0] === t.id && 'is-on')}"
          data-act="start-session" data-id="${t.id}">
          <span class="pickcard__box" aria-hidden="true">${suggested[0] === t.id ? '★' : ''}</span>
          <span class="pickcard__body">
            <span class="pickcard__name">${t.name}
              ${when(suggested.indexOf(t.id) >= 0, () => html`<span class="tiny dim"> · önerilen</span>`)}</span>
            <span class="pickcard__meta">${t.minutes} dk · ${t.items.length} hareket — ${t.note}</span>
          </span>
        </button>`)}
        <button class="pickcard" data-act="start-session" data-id="">
          <span class="pickcard__box" aria-hidden="true"></span>
          <span class="pickcard__body">
            <span class="pickcard__name">Serbest seans</span>
            <span class="pickcard__meta">Hareketleri kendin seç</span>
          </span>
        </button>
      </div>`,
    });
  }

  function todaySessionsEntry(){
    const d = U.todayISO();
    const rows = M.workoutsOf(d);
    if(!rows.length){
      return K.Entry({ label:'Bugünün seansları', meta:'kayıt yok',
        body:P.empty('Bugün henüz seans kaydı yok. Yukarıdan bir seans seç.') });
    }
    return K.Entry({
      label:'Bugünün seansları',
      meta:rows.length + ' seans · ' + U.sum(rows.map(SP.Move.sessionLoad)) + ' yük',
      body:html`<div class="list">${map(rows, w => html`
        <div class="listitem">
          <div class="grow">
            <b class="small">${w.name}</b>
            <div class="tiny dim">${w.minutes} dk
              ${when(w.rpe, () => html`· zorluk ${w.rpe}/10`)}
              · yük ${SP.Move.sessionLoad(w)}
              · ${(w.items || []).length} hareket</div>
          </div>
          ${K.Button({ label:'Düzenle', size:'sm', act:'edit-session', data:{ 'data-id':w.id } })}
          ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'Sil',
            act:'del-session', data:{ 'data-id':w.id } })}
        </div>`)}</div>`,
    });
  }

  function balanceBody(){
    const rows = SP.Move.patternBalance();
    return html`${map(rows, r => html`
      <button class="${cls('minrow', !r.missing && 'is-done')}" style="width:100%"
        data-act="pick-pattern" data-id="${r.pattern.id}">
        <span class="minrow__mark">${r.missing ? '' : '✓'}</span>
        <span class="minrow__label"><b>${r.pattern.label}</b>
          <span class="tiny dim"> · ${r.pattern.note}</span></span>
        <span class="minrow__detail num">${r.count}</span>
      </button>`)}`;
  }

  /* Merdiven artık kart değil: ince çizgiyle ayrılan bir blok. */
  function ladderBlock(ex){
    const pr = SP.Move.progressionCheck(ex.id);
    const cur = M.levelIndex(ex.id);
    const pattern = SP.PATTERNS.find(x => x.id === ex.pattern);
    return html`
      <div class="ladderblk">
        <div class="ladderblk__head">
          <div class="minw0">
            <b class="ladderblk__name">${ex.name}</b>
            <span class="tiny dim">${pattern ? pattern.label
              : ex.kind === 'cardio' ? 'Dayanıklılık' : 'Mobilite'}
              · ${ex.equip === 'yok' ? 'ekipmansız' : ex.equip}</span>
          </div>
          ${pr.ready ? K.Badge({ label:'üst basamak açık', tone:'ok' })
            : K.Badge({ label:pr.sessions + '/' + pr.needed + ' seans', tone:'muted' })}
        </div>
        <p class="small muted">${ex.cue}</p>
        <div class="ladder">${map(ex.levels, (l, i) => html`
          <div class="${cls('ladderstep', i < cur && 'is-done', i === cur && 'is-current')}">
            <span class="ladderstep__no">${i + 1}</span>
            <span>${l.name}</span>
            <span class="ladderstep__to">${l.to}</span>
          </div>`)}</div>
        <div class="ladderblk__foot">
          <span class="small dim">${pr.note}</span>
          <span class="row-sm">
            ${when(pr.ready, () => K.Button({ label:'Üst basamağa geç', size:'sm', tone:'primary',
              act:'advance', data:{ 'data-id':ex.id } }))}
            ${K.Button({ label:'Basamak seç', size:'sm', act:'pick-level', data:{ 'data-id':ex.id } })}
          </span>
        </div>
      </div>`;
  }

  /* ---------------------------------------------------------- alanlar */

  /* Bir faaliyet alanının sayfası: alanın ne olduğu, o alandaki hareket
     merdivenleri ve alana özel kural. */
  function areaView(areaId){
    const area = SP.AREA_BY_ID[areaId];
    const list = exercisesOfArea(areaId);
    const rx = SP.Move.prescription();

    return K.Ledger([
      when(areaId === 'kardiyo', () => K.Entry({
        label:'Haftalık süre', hint:'load', meta:'%10 kuralı',
        note:area.note, body:cardioBody(),
      })),

      when(areaId === 'esneklik' && rx.kind !== 'full', () => K.Entry({
        label:'Bugün için', meta:'toparlanma bandı',
        body:K.Notice({ tone:'info',
          body:'Toparlanma ' + (rx.readiness.ok ? rx.readiness.band.label.toLocaleLowerCase('tr-TR')
            : 'ölçülmedi') + '. Esneklik akışı ağır antrenmanın yerine geçebilir; '
            + 'yük üretmez ama zinciri kırmaz.' }),
      })),

      K.Entry({
        label:area.label,
        meta:list.length + ' hareket',
        note:area.note,
        action:K.Button({ label:'Seans ekle', icon:'plus', tone:'primary',
          act:'start-area', data:{ 'data-area':areaId } }),
        body:html`
          ${when(areaId === 'kuvvet', () => K.Subtabs({ items:patternTabs(),
            value:S.ui.movePattern || 'all', act:'pick-pattern-tab', aria:'Hareket kalıbı' }))}
          ${when(!list.length, () => P.empty('Bu kalıpta tanımlı hareket yok.'))}
          <div class="ladders">${map(list, ladderBlock)}</div>`,
      }),

      when(areaId === 'kuvvet', () => K.Entry({
        label:'Kalıp dengesi', meta:'haftalık', body:balanceBody(),
      })),

      K.Entry({
        label:'İlerleme kuralı', hint:'progression',
        meta:SP.Move.ADVANCE_SESSIONS + ' seans / ' + SP.Move.ADVANCE_WINDOW + ' gün',
        body:html`<p class="small muted">Bir üst basamak, mevcut basamakta son
          ${SP.Move.ADVANCE_WINDOW} günde ${SP.Move.ADVANCE_SESSIONS} seans yapıldığında açılır.
          Sistem basamak atlatmaz: aşırı yüklenmenin en yaygın sebebi budur.</p>`,
      }),
    ]);
  }

  function cardioBody(){
    const ids = SP.EXERCISES.filter(e => e.kind === 'cardio').map(e => e.id);
    const days = U.lastDays(14);
    let thisWeek = 0, lastWeek = 0;
    days.forEach((d, i) => {
      const mins = M.workoutsOf(d).filter(w => (w.items || []).some(it => ids.indexOf(it.exId) >= 0))
        .reduce((a, w) => a + (w.minutes || 0), 0);
      if(i >= 7) thisWeek += mins; else lastWeek += mins;
    });
    const cap = Math.round(lastWeek * 1.1);
    return html`
      <div class="cols-3">
        ${K.Stat({ label:'Bu hafta', value:String(thisWeek), unit:'dk' })}
        ${K.Stat({ label:'Geçen hafta', value:String(lastWeek), unit:'dk' })}
        ${K.Stat({ label:'Bu haftanın tavanı', value:lastWeek ? String(cap) : '—', unit:'dk',
          note:lastWeek ? '%10 kuralı' : 'geçen hafta veri yok' })}
      </div>
      ${K.Notice({ tone:lastWeek && thisWeek > cap ? 'warn' : 'info',
        body:lastWeek
          ? (thisWeek > cap
            ? 'Bu hafta geçen haftanın %10 üstünü aştı. Süreyi artırmak yerine tempoyu koru.'
            : SP.LOAD_RULES.weeklyGrowth.note)
          : 'Geçen hafta kardiyo kaydı yok; tavan hesaplanmadı. Eksik veri sıfır sayılmaz.' })}`;
  }

  /* ---------------------------------------------------------- dinlenme

     Dinlenme sayfası yeni bir kural icat etmez; var olan kuralların
     dinlenmeye bakan yüzünü tek yerde toplar: toparlanma bandı, indirme
     haftası, son hafta / son ay oranı, uyku ve boş gün sayısı. */
  function restView(){
    const r = SP.Move.readiness();
    const rx = SP.Move.prescription();
    const dl = SP.Move.deloadWeek();
    const a = SP.Move.acwr();
    const days = U.lastDays(7);
    const off = days.filter(d => !M.workoutsOf(d).length).length;
    const sleepVals = days.map(d => (S.vitals[d] || {}).sleep).filter(v => v != null);
    const avgSleep = sleepVals.length ? U.round(U.sum(sleepVals) / sleepVals.length, 1) : null;

    return K.Ledger([
      K.Entry({
        label:'Bugün dinlenmeli misin?', hint:'recovery-order',
        meta:rx.kind === 'rest' ? 'evet' : rx.kind === 'full' ? 'hayır' : 'hafiflet',
        note:SP.AREA_BY_ID.dinlenme.note + ' Kazanç antrenmanda değil, antrenmandan '
          + 'sonraki toparlanmada oluşur.',
        action:when(!r.ok, () => K.Button({ label:'Veri gir', tone:'primary',
          act:'go', data:{ 'data-route':'today' } })),
        body:html`
          ${when(r.ok, () => html`<div class="row wrap" style="gap:26px">
            ${raw(UI.gauge(r.score, { tone:r.band.tone, label:r.band.label, size:122,
              bands:SP.READINESS_BANDS.map(b => b.min).filter(x => x > 0) }))}
            <p class="grow small" style="min-width:210px">${r.band.order}</p>
          </div>`)}
          ${when(!r.ok, () => K.Notice({ tone:'info', body:r.note }))}
          ${when(rx.kind === 'rest', () => K.Notice({ tone:'info',
            body:'Tam dinlenme günü de boş değildir: asgari gün geçerli — '
              + SP.LOAD_RULES.minDay.minutes + ' dakika yürüyüş ve bir mobilite akışı.' }))}`,
      }),

      K.Entry({
        label:'İndirme haftası', hint:'deload',
        meta:!dl.started ? 'başlamadı' : dl.due ? 'bu hafta' : dl.inCycle + '/' + dl.every,
        note:SP.LOAD_RULES.deload.note,
        body:html`<p class="small">${dl.note}</p>`,
      }),

      K.Entry({
        label:'Son yedi gün', meta:off + ' boş gün',
        note:'Yük eğrisi yalnız yapılan işi değil, yapılmayanı da sayar. Üst üste '
          + 'boş geçen günler kondisyonu düşürür; hiç boş geçmeyen haftalar son '
          + 'haftayı son aya göre şişirir. İkisi de aynı ölçüde izlenir.',
        body:html`<div class="cols-3">
          ${K.Stat({ label:'Boş gün', value:String(off), unit:'/ 7',
            note:off === 0 ? 'hiç boş gün yok' : off >= 5 ? 'çok az seans' : 'dengeli' })}
          ${K.Stat({ label:'Ortalama uyku',
            value:avgSleep == null ? '—' : U.fmtNum(avgSleep), unit:'saat',
            note:avgSleep == null ? 'girilmedi' : sleepVals.length + ' gün girildi' })}
          ${K.Stat({ label:'Son hafta / son ay', value:a.ok ? U.fmtNet(a.ratio) : '—',
            tone:a.ok ? (a.zone === 'ok' ? 'ok' : a.zone === 'high' ? 'danger' : 'warn') : null,
            note:a.ok ? (a.zone === 'ok' ? 'normal' : a.zone === 'high' ? 'ağır' : 'hafif')
              : 'veri yetersiz' })}
        </div>`,
      }),
    ]);
  }

  /* ------------------------------------------------------------ ilerleme */

  function loadBody(){
    const series = SP.Move.loadSeries(30);
    const a = SP.Move.acwr();
    const g = SP.Move.weeklyGrowth();
    const dl = SP.Move.deloadWeek();
    const top = Math.max(100, Math.max.apply(null, series.map(s2 => s2.value)) * 1.1);

    return html`
      ${raw(UI.barChart(series.map(s2 => ({ label:U.fmtShort(s2.date), value:s2.value })),
        { max:top, height:170, goodAt:0 }))}
      <div class="cols-3">
        ${K.Stat({ label:'Bu hafta', value:U.fmtNum(SP.Move.loadWindow(7)), unit:'yük' })}
        ${K.Stat({ label:'Son hafta / son ay', value:a.ok ? U.fmtNet(a.ratio) : '—',
          tone:a.ok ? (a.zone === 'ok' ? 'ok' : a.zone === 'high' ? 'danger' : 'warn') : null,
          note:a.ok ? (a.zone === 'ok' ? 'normal' : a.zone === 'high' ? 'ağır' : 'hafif')
            : 'veri yetersiz' })}
        ${K.Stat({ label:'Döngü haftası', value:dl.started ? String(dl.week) : '—',
          note:!dl.started ? 'başlamadı' : dl.due ? 'indirme haftası' : dl.inCycle + '/' + dl.every })}
      </div>
      ${K.Notice({ tone:a.ok ? a.tone : 'info', body:a.note })}
      ${when(g.ok, () => K.Notice({ tone:g.over ? 'warn' : 'info',
        body:'Geçen haftaya göre değişim %' + Math.round(g.growth * 100) + '. ' + g.note }))}
      ${when(dl.due, () => K.Notice({ tone:'warn', body:dl.note }))}`;
  }

  function historyBody(){
    const rows = S.workouts.slice(-20).reverse();
    if(!rows.length) return P.empty('Henüz seans kaydı yok.');
    return K.Table({ tight:true,
      headers:['Tarih', 'Seans', { label:'Dakika', num:true }, { label:'Yük', num:true }],
      rows:rows.map(w => [U.fmtShort(w.date), w.name, String(w.minutes),
        String(SP.Move.sessionLoad(w))]) });
  }

  /* -------------------------------------------------------------- sheet'ler */

  /* Düzenlenen seans kaydedilene kadar burada bekler. */
  let draft = null;

  function sessionSheet(rec){
    const isNew = !S.workouts.some(w => w.id === rec.id);
    const chosen = (rec.items || []).map(i => i.exId);
    UI.sheet({
      title:isNew ? 'Seans ekle' : 'Seansı düzenle', subtitle:rec.name, wide:true,
      body:String(K.Stack([
        html`<div class="cols-2">
          ${K.Field({ label:'Süre (dakika)',
            input:K.Input({ id:'w-min', type:'number', numeric:true, min:1, step:'5', value:rec.minutes }) })}
          ${K.Field({ label:'Algılanan zorluk (1–10)', hint:'boş bırakılırsa MET değerinden hesaplanır',
            input:K.Input({ id:'w-rpe', type:'number', numeric:true, min:1, max:10, step:'1',
              value:rec.rpe == null ? '' : rec.rpe }) })}
        </div>`,
        html`<h3 class="section-h">Hareketler
          <span class="tiny dim">· ${chosen.length} seçili</span></h3>`,
        /* Uzun bir onay listesi yerine seçilebilir kartlar. Kalıp her kartın
           kendi satırında yazar: kalıba göre ayrı ayrı bölmek on bir hareket
           için gereksiz yere uzun bir kağıt üretiyordu. */
        html`<div class="picks">${map(SP.EXERCISES, ex => {
          const lvl = SP.EX_BY_ID[ex.id].levels.find(l => l.id === M.currentLevel(ex.id));
          const pattern = SP.PATTERNS.find(x => x.id === ex.pattern);
          const group = pattern ? pattern.label
            : ex.kind === 'cardio' ? 'Dayanıklılık' : 'Mobilite';
          return K.PickCard({
            label:ex.name,
            meta:group + ' · ' + (lvl ? lvl.name : '') + ' · hedef ' + (lvl ? lvl.to : '—'),
            on:chosen.indexOf(ex.id) >= 0,
            act:'toggle-ex', data:{ 'data-id':rec.id, 'data-ex':ex.id },
          });
        })}</div>`,
        K.Field({ label:'Not', input:K.Textarea({ id:'w-note', rows:2, value:rec.note || '' }) }),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-session', data:{ 'data-id':rec.id } })}`),
      noFocus:true,
    });
  }

  /* --------------------------------------------------------------- ekran */

  function tabs(tab){
    const done = M.workoutsOf(U.todayISO()).length;
    const items = TABS.map(t => Object.assign({}, t,
      t.id === 'bugun' && done ? { count:done } : {}));
    return K.Subtabs({ items, value:tab, act:'move-tab', aria:'Hareket görünümü' });
  }

  async function render(){
    const tab = S.ui.moveTab;
    const head = html`<div class="mb-8">${tabs(tab)}</div>`;

    if(SP.AREA_BY_ID[tab]){
      return String(html`${head}
        ${tab === 'dinlenme' ? restView() : areaView(tab)}
        <div class="mt-24">${raw(UI.rail(tab === 'dinlenme'
          ? ['recovery-order', 'deload', 'load']
          : ['progression', 'load', 'deload']))}</div>`);
    }

    if(tab === 'ilerleme'){
      return String(html`${head}${K.Ledger([
        K.Entry({ wide:true, label:'Yük eğrisi', hint:'load', meta:'son 30 gün',
          note:'Seans yükü süre × zorluktur. Zorluk önce senin bildirdiğin algılanan '
            + 'zorluktan, yoksa hareketlerin MET ortalamasından gelir. İkisi de yoksa '
            + 'seans yük üretmez — uydurulmuş yük yazılmaz.',
          body:loadBody() }),
        K.Entry({ label:'Kalıp dengesi', meta:'her kalıp haftada en az bir kez',
          body:balanceBody() }),
        K.Entry({ label:'Seans geçmişi', meta:S.workouts.length + ' kayıt',
          body:historyBody() }),
      ])}
      <div class="mt-24">${raw(UI.rail(['load', 'deload', 'recovery-order']))}</div>`);
    }

    return String(html`${head}${K.Ledger([
      orderEntry(), pickSessionEntry(), todaySessionsEntry(),
      K.Entry({ label:'Kalıp dengesi', meta:'haftalık', body:balanceBody() }),
    ])}
    <div class="mt-24">${raw(UI.rail(['recovery-order', 'readiness', 'load', 'progression']))}</div>`);
  }

  const handle = {
    async 'move-tab'(el){ S.ui.moveTab = el.dataset.tab; SP.App.render(); },
    async 'pick-pattern-tab'(el){ S.ui.movePattern = el.dataset.tab; SP.App.render(); },
    async 'pick-pattern'(el){
      S.ui.moveTab = 'kuvvet';
      S.ui.movePattern = el.dataset.id;
      SP.App.render();
    },
    /* Alandan seans: o alanın şablonu varsa onunla, yoksa serbest başlar. */
    async 'start-area'(el){
      const area = SP.AREA_BY_ID[el.dataset.area];
      const tpl = area && area.kind
        ? SP.SESSION_TEMPLATES.find(t => t.kind === area.kind) : null;
      draft = M.newWorkout(U.todayISO(), tpl ? tpl.id : null);
      sessionSheet(draft);
    },
    async 'start-session'(el){
      draft = M.newWorkout(U.todayISO(), el.dataset.id || null);
      sessionSheet(draft);
    },
    async 'edit-session'(el){
      draft = S.workouts.find(w => w.id === el.dataset.id);
      if(draft) sessionSheet(draft);
    },
    async 'toggle-ex'(el){
      if(!draft) return;
      const exId = el.dataset.ex;
      draft.items = draft.items || [];
      const i = draft.items.findIndex(x => x.exId === exId);
      if(i >= 0) draft.items.splice(i, 1);
      else draft.items.push({ exId, levelId:M.currentLevel(exId), sets:3, reps:null, minutes:null });
      /* Kağıdı yeniden çiz ki seçim anında görünsün; girilen süre ve zorluk
         kaybolmasın diye önce okunur. */
      const min = document.getElementById('w-min');
      const rpe = document.getElementById('w-rpe');
      const note = document.getElementById('w-note');
      if(min) draft.minutes = Number(min.value) || draft.minutes;
      if(rpe) draft.rpe = rpe.value.trim() === '' ? null : Number(rpe.value);
      if(note) draft.note = note.value;
      sessionSheet(draft);
    },
    async 'save-session'(el){
      if(!draft) return;
      const min = document.getElementById('w-min');
      const rpe = document.getElementById('w-rpe');
      const note = document.getElementById('w-note');
      draft.minutes = min ? Number(min.value) || 0 : draft.minutes;
      draft.rpe = rpe && rpe.value.trim() !== '' ? Number(rpe.value) : null;
      draft.note = note ? note.value.trim() : '';
      if(!draft.minutes){ UI.toast('Süre gir'); return; }
      await M.saveWorkout(draft);
      draft = null;
      UI.closeSheet();
      UI.toast('Seans kaydedildi');
      SP.App.render();
    },
    async 'del-session'(el){
      const id = el.dataset.id;
      UI.confirmSheet('Seansı sil', 'Bu seans ve ürettiği yük kaydından silinir.',
        async () => { await M.deleteWorkout(id); UI.closeSheet(); SP.App.render(); }, true);
    },
    async advance(el){
      const res = await M.advanceLevel(el.dataset.id);
      UI.toast(res.ok ? 'Yeni basamak: ' + res.level.name : res.error);
      SP.App.render();
    },
    async 'pick-level'(el){
      const ex = SP.EX_BY_ID[el.dataset.id];
      const cur = M.currentLevel(ex.id);
      UI.sheet({ title:ex.name, subtitle:'Basamak seç', wide:true,
        body:String(html`
          <p class="small muted">${ex.cue}</p>
          <div class="picks mt-12">${map(ex.levels, (l, i) => K.PickCard({
            label:(i + 1) + '. ' + l.name, meta:'hedef ' + l.to,
            on:l.id === cur,
            act:'set-level', data:{ 'data-id':ex.id, 'data-level':l.id },
          }))}</div>`),
        footer:String(K.Button({ label:'Kapat', act:'sheet-close' })), noFocus:true });
    },
    async 'set-level'(el){
      await M.setLevel(el.dataset.id, el.dataset.level);
      UI.closeSheet();
      UI.toast('Basamak güncellendi');
      SP.App.render();
    },
  };

  return {
    id:'move',
    title:'Hareket',
    headline(){
      const rx = SP.Move.prescription();
      if(!rx.readiness.ok) return 'Toparlanma ölçümü bekliyor.';
      if(rx.kind === 'rest') return 'Bugün dinlenme günü.';
      if(rx.kind === 'full') return 'Bugün tam yük yapılabilir.';
      return 'Bugün yük hafifletilmeli.';
    },
    lede(){
      const rx = SP.Move.prescription();
      if(!rx.readiness.ok){
        return 'Uyku ve nabız girilince günün yük emri hesaplanır. '
          + 'Ölçüm olmadan yük körlemesine verilmez.';
      }
      return rx.readiness.band.order
        + ' Kardiyo, kuvvet, esneklik ve dinlenme ayrı sayfalardır.';
    },
    stats(){
      const rx = SP.Move.prescription();
      const out = [];
      if(rx.readiness.ok){
        out.push({ value:rx.readiness.score, unit:'/100', label:'toparlanma' });
        out.push({ value:rx.factor >= 1 ? '%100' : '%' + Math.round(rx.factor * 100),
          label:'bugünkü yük' });
      }
      out.push({ value:SP.Move.loadWindow(7), label:'haftalık yük' });
      const a = SP.Move.acwr();
      if(a.ok) out.push({ value:U.fmtNet(a.ratio), label:'hafta / ay' });
      return out;
    },
    subtitle(){
      const rx = SP.Move.prescription();
      if(!rx.readiness.ok) return 'Ölçüm bekliyor';
      return rx.readiness.band.label + (rx.factor >= 1 ? ' · tam yük'
        : ' · yükün %' + Math.round(rx.factor * 100) + '\u2019i');
    },
    actions(){
      return String(K.Button({ label:'Seans ekle', icon:'plus', size:'sm', tone:'primary',
        act:'start-session', data:{ 'data-id':'' } }));
    },
    render, handle,
  };
})();

/* ==== js/screens/basket.js ==== */
/* Sepet — Modül 4'ün ekranı.

   Üç sekme:
     Sepet   haftalık alışveriş, maliyet ve besin kapsaması
     İkame   eşdeğer ucuz muadiller — neyi koruyup neyi kaybettiğiyle
     Fiyat   kendi fişinden fiyat girme (tahmini ezer)

   Ekranın etik kuralı görünürdür: tahmin fiyatı her yerde «tahmin» rozetiyle
   durur ve hesabın yüzde kaçının tahmine dayandığı yazılır. */

window.SP = window.SP || {};
SP.Screens = SP.Screens || {};

SP.Screens.basket = (function(){
  const U = SP.U, M = SP.Model, S = SP.S, UI = SP.UI;
  const { html, raw, when, map } = SP.h;
  const K = SP.C, P = SP.Parts;

  const TABS = [
    { id:'butce', label:'Bütçe', icon:'target' },
    { id:'sepet', label:'Sepet', icon:'wallet' },
    { id:'ikame', label:'İkame', icon:'refresh' },
    { id:'fiyat', label:'Fiyat', icon:'list' },
  ];

  function toolbar(tab){
    const n = ((S.basket && S.basket.items) || []).length;
    const items = TABS.map(t => Object.assign({}, t, t.id === 'sepet' && n ? { count:n } : {}));
    /* Eylemler hero'da duruyor; burada tekrar etmek aynı düğmeyi iki kez
       göstermek olurdu. */
    return K.Subtabs({ items, value:tab, act:'basket-tab', aria:'Sepet görünümü' });
  }

  /* ---------------------------------------------------------------- sepet */

  function totalCard(){
    const b = SP.Money.basketTotal();
    return K.Card({
      title:'Haftalık sepet', hint:'price-estimate',
      sub:b.rows.length + ' kalem' + (b.householdSize > 1 ? ' · ' + b.householdSize + ' kişilik hane' : ''),
      badge:b.limit != null
        ? K.Badge({ label:b.over ? 'sınır aşıldı' : 'sınırın altında', tone:b.over ? 'danger' : 'ok' })
        : null,
      body:html`
        <div class="cols-3">
          ${K.Stat({ label:'Toplam', value:U.fmtNum(Math.round(b.total)), unit:'TL' })}
          ${K.Stat({ label:'Kişi başı', value:U.fmtNum(Math.round(b.perPerson)), unit:'TL' })}
          ${K.Stat({ label:'Tahmin payı', value:'%' + b.estimate.pct,
            note:b.estimate.pct >= 50 ? 'kendi fişini gir' : 'çoğu ölçülü' })}
        </div>
        ${when(b.limit != null, () => html`<div class="mt-12">
          ${K.Meter({ label:'Haftalık sınır', value:Math.min(100, b.pct || 0),
            text:U.fmtNum(Math.round(b.total)) + ' / ' + U.fmtNum(b.limit) + ' TL',
            tone:b.over ? 'danger' : '' })}</div>`)}
        ${when(b.estimate.pct >= 50 && b.rows.length, () => K.Notice({ tone:'warn', class:'mt-12',
          body:'Bu hesabın %' + b.estimate.pct + '\'i başlangıç tahminiyle yapıldı. '
            + 'Uygulama market taramaz; gerçeğe yaklaşmak için kendi fişindeki fiyatı gir.' }))}`,
      foot:html`${K.Button({ label:'Kalem ekle', size:'sm', tone:'primary', act:'open-add' })}
        ${K.Button({ label:'Haftalık sınır', size:'sm', act:'open-limit' })}`,
    });
  }

  function itemsCard(){
    const b = SP.Money.basketTotal();
    if(!b.rows.length){
      return K.Card({ title:'Kalemler',
        body:P.empty('Sepet boş.', 'Kalem ekle', 'open-add') });
    }
    return K.Card({
      title:'Kalemler', sub:'Maliyete göre sıralı',
      body:html`${map(b.rows, r => html`
        <div class="pricerow">
          <span><b class="small">${r.food.name}</b>
            <span class="tiny dim"> · ${U.fmtNet(r.item.kg)} kg</span>
            ${P.cert(r.price.cert)}</span>
          <span class="pricerow__tl num">${r.cost == null ? '—' : U.fmtNum(Math.round(r.cost)) + ' TL'}</span>
          ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'Çıkar',
            act:'del-item', data:{ 'data-id':r.item.foodId } })}
        </div>`)}`,
    });
  }

  function coverageCard(){
    const c = SP.Money.basketCoverage();
    if(!c.ok) return K.Card({ title:'Besin kapsaması',
      body:K.Notice({ tone:'info', body:c.note }) });

    const macro = [
      { label:'Kalori', o:c.kcal, unit:'kcal' },
      { label:'Protein', o:c.protein, unit:'g' },
      { label:'Lif', o:c.fiber, unit:'g' },
    ];
    return K.Card({
      title:'Besin kapsaması',
      sub:'Sepet ' + c.householdSize + ' kişinin 7 günlük ihtiyacına göre',
      badge:c.gaps.length ? K.Badge({ label:c.gaps.length + ' öğe eksik', tone:'warn' })
        : K.Badge({ label:'kapsıyor', tone:'ok' }),
      body:html`
        <div class="nutgrid">
          ${map(macro, m => P.nutCell({ label:m.label, got:m.o.got, target:m.o.need, unit:m.unit }))}
        </div>
        ${when(c.gaps.length, () => html`<div class="mt-12">
          ${K.Table({ tight:true, headers:['Karşılanmayan öğe', { label:'Kapsama', num:true }, ''],
            rows:c.gaps.map(id => [
              SP.NUTRI_BY_ID[id] ? SP.NUTRI_BY_ID[id].name : id,
              '%' + c.micro[id].pct,
              K.Button({ label:'En ucuz kaynak', size:'sm', act:'open-cheap', data:{ 'data-id':id } }),
            ]) })}</div>`)}
        ${when(!c.gaps.length, () => K.Notice({ tone:'ok', class:'mt-10',
          body:'Sepetteki gıdalar hanenin haftalık besin hedeflerini karşılıyor.' }))}`,
    });
  }

  /* ---------------------------------------------------------------- ikame */

  function swapCard(){
    const rows = SP.Money.swapOpportunities();
    if(!rows.length){
      return K.Card({ title:'İkame fırsatları', hint:'substitute',
        body:K.Notice({ tone:'info', body:'Sepetteki kalemler için tanımlı bir ikame yok. '
          + 'Somon, badem, ceviz, dana eti ve süzme yoğurt gibi kalemlerde öneri çıkar.' }) });
    }
    return K.Card({
      title:'İkame fırsatları', hint:'substitute',
      sub:'Sepetindeki kalemler için',
      body:html`${map(rows, s => html`
        <div class="listitem">
          <div class="grow">
            <b class="small">${s.from.name} → ${s.to.name}</b>
            ${K.Badge({ label:U.fmtNum(Math.round(s.saveTotal)) + ' TL', tone:'ok' })}
            <div class="tiny dim mt-2">${s.sub.note}</div>
            <div class="tiny mt-2">
              <b>Korunan:</b> ${s.keeps.map(k => k.name).join(', ') || '—'}
              ${when(s.loses.length, () => html` · <b>Düşen:</b> ${s.loses.map(k => k.name).join(', ')}`)}
            </div>
          </div>
          ${K.Button({ label:'Değiştir', size:'sm', act:'do-swap',
            data:{ 'data-from':s.from.id, 'data-to':s.to.id, 'data-kg':s.kg } })}
        </div>`)}`,
      foot:html`<span class="small dim">Öneri neyi koruduğunu ve neyi kaybettiğini birlikte söyler.
        «Ucuz olan iyidir» diye bir kural yoktur.</span>`,
    });
  }

  function bulkCard(){
    const rows = SP.Money.bulkOpportunities();
    return K.Card({
      title:'Toplu alım', hint:'bulk',
      sub:'Bozulmadan saklanan kalemler',
      body:K.Table({ tight:true,
        headers:['Kalem', { label:'En az', num:true }, { label:'Tasarruf', num:true }, 'Durum'],
        rows:rows.map(b => [
          html`<b>${b.food.name}</b> <span class="tiny dim">${b.item.note}</span>`,
          U.fmtNet(b.item.minKg) + ' kg',
          U.fmtNum(Math.round(b.saveTl)) + ' TL',
          b.worth ? K.Badge({ label:U.fmtNet(b.weeksToUse) + ' haftada biter', tone:'ok' })
            : b.weeklyKg ? K.Badge({ label:'yavaş tüketim', tone:'warn' })
            : K.Badge({ label:'sepette yok', tone:'muted' }),
        ]) }),
      foot:html`<span class="small dim">Yalnızca kuru bakliyat, yağ ve konserve gibi kalemler listede.
        Taze üründe toplu alım tasarruf değil israf üretir.</span>`,
    });
  }

  /* ---------------------------------------------------------------- fiyat */

  function priceCard(){
    const q = S.ui.foodQuery;
    let list = SP.FOODS.filter(f => SP.PRICE_SEED.perKg[f.id] != null || S.prices[f.id]);
    if(q) list = list.filter(f => U.norm(f.name).indexOf(U.norm(q)) >= 0);
    const page = K.paginate(list, S.ui.foodPage, 20);

    return K.Card({
      title:'Fiyat listesi', hint:'price-estimate',
      sub:'Kendi fişindeki fiyat tahmini ezer',
      actions:K.Input({ id:'price-q', value:q, size:'sm', placeholder:'Ara…',
        change:'price-query', data:{ 'data-debounce':'200' } }),
      body:html`
        ${K.Notice({ tone:'info',
          body:SP.PRICE_SEED.note + ' Başlangıç tahminleri ' + SP.PRICE_SEED.seededAt
            + ' ayına ait; üzerinden ' + (SP.Money.monthsSince(SP.PRICE_SEED.seededAt) || 0) + ' ay geçti.' })}
        <div class="mt-12">${map(page.items, f => {
          const p = SP.Money.priceOf(f.id);
          return html`<div class="pricerow">
            <span><b class="small">${f.name}</b> ${P.cert(p.cert)}
              ${when(p.source === 'seed', () => html`<span class="tiny dim"> · ${p.age.label}</span>`)}</span>
            <span class="pricerow__tl num">${p.tl == null ? '—' : U.fmtNum(p.tl) + ' TL/kg'}</span>
            ${K.Input({ type:'number', numeric:true, size:'sm', step:'1', min:0,
              placeholder:'TL/kg', change:'set-price', data:{ 'data-id':f.id } })}
          </div>`;
        })}</div>
        ${K.Pager({ page:page.page, pages:page.pages, total:page.total, act:'price-page' })}`,
    });
  }

  /* -------------------------------------------------------------- sheet'ler */

  function addSheet(){
    const q = S.ui.foodQuery;
    let list = SP.FOODS;
    if(q) list = list.filter(f => U.norm(f.name + ' ' + (f.aliases || []).join(' ')).indexOf(U.norm(q)) >= 0);
    const page = K.paginate(list, S.ui.foodPage, 12);

    UI.sheet({
      title:'Sepete kalem ekle', wide:true,
      body:String(K.Stack([
        K.Input({ id:'add-q', value:q, placeholder:'Ara: mercimek, tavuk, zeytinyağı…',
          change:'add-query', data:{ 'data-debounce':'200' } }),
        html`<div class="stack-xs">${map(page.items, f => {
          const p = SP.Money.priceOf(f.id);
          return html`<button class="foodrow" data-act="pick-basket" data-id="${f.id}">
            <span class="foodrow__name">${f.name}</span>
            <span class="foodrow__meta num">${p.tl == null ? 'fiyat yok' : U.fmtNum(p.tl) + ' TL/kg'}</span>
          </button>`;
        })}</div>`,
        K.Pager({ page:page.page, pages:page.pages, total:page.total, act:'add-page' }),
      ])),
      footer:String(K.Button({ label:'Kapat', act:'sheet-close' })),
      noFocus:true,
    });
  }

  function kgSheet(foodId){
    const f = SP.FOOD_BY_ID[foodId];
    const cur = ((S.basket.items || []).find(x => x.foodId === foodId) || {}).kg;
    UI.sheet({
      title:f.name, subtitle:'Haftalık miktar',
      body:String(K.Field({ label:'Kilogram',
        input:K.Input({ id:'basket-kg', type:'number', numeric:true, step:'0.1', min:0,
          value:cur == null ? '' : cur, placeholder:'1,5' }) })),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-kg', data:{ 'data-id':foodId } })}`),
    });
  }

  function cheapSheet(nutrientId){
    const n = SP.NUTRI_BY_ID[nutrientId];
    const rows = SP.Money.costPerNutrient(nutrientId, 10);
    UI.sheet({
      title:'En ucuz ' + n.name.toLocaleLowerCase('tr-TR') + ' kaynağı', wide:true,
      subtitle:'Bir birim öğe başına maliyet',
      body:String(K.Stack([
        K.Table({ tight:true,
          headers:['Gıda', { label:'Birim başı', num:true }, { label:'100 g\'da', num:true }, 'Fiyat'],
          rows:rows.map(r => [r.food.name, U.fmtNet(r.tlPerUnit) + ' TL',
            U.fmtNum(U.round(r.per100, 2)) + ' ' + n.unit,
            html`${U.fmtNum(r.price.tl)} TL/kg ${P.cert(r.cert)}`]) }),
        K.Notice({ tone:'info', body:'Bu tablo bütçe ile sağlık hedefini aynı yerde buluşturur: '
          + 'hedefi indirmeden, aynı öğeyi daha ucuz taşıyan gıdayı gösterir.' }),
      ])),
      footer:String(K.Button({ label:'Kapat', act:'sheet-close' })),
      noFocus:true,
    });
  }

  /* -------------------------------------------------------------- bütçe

     Sedef'in sayfası. Bütçe tek başına üretilmez: diğer üç koçun talebi
     toplanır (SP.Money.budget). Fiyatı bilinmeyen kalem sıfır sayılmaz —
     "veri yok" olarak durur ve toplamın dışında kalır. */

  function budgetView(){
    const b = SP.Money.budget();
    const st = SP.Money.status();

    return html`
      <section class="sect">
        <div class="sect__h">
          <div class="sect__ht">
            <div class="sect__eyebrow">Sedef</div>
            <h2>Aylık bütçe</h2>
            <p>Bütçe diğer koçların talebinden çıkar: Nesrin gıdayı, Kerem testi,
              Barış ekipmanı ister. Fiyatı bilinmeyen kalem toplama katılmaz.</p>
          </div>
        </div>

        <div class="grid">
          <div class="span-7"><div class="stack">
            ${K.Card({
              title:'Talep tablosu', hint:'budget-rank',
              badge:K.Badge({ label:U.fmtNum(b.total) + ' TL / ay',
                tone:b.over ? 'warn' : 'info' }),
              body:html`${map(b.rows, r => html`
                <div class="demand">
                  <div class="demand__who">
                    ${P.avatar(r.agent, 'sm')}
                    <div class="minw0">
                      <b class="small">${r.label}</b>
                      <div class="tiny dim">${r.detail}</div>
                    </div>
                  </div>
                  <div class="demand__cost num">
                    ${r.monthly == null ? html`<span class="dim">veri yok</span>`
                      : html`${U.fmtNum(r.monthly)}<small>TL</small>`}
                  </div>
                  <div class="demand__cert">${when(r.monthly != null, () => P.cert(r.cert))}</div>
                  ${when(r.note, () => html`<p class="demand__note">${r.note}</p>`)}
                </div>`)}`,
              foot:html`
                ${when(b.unknown, () => html`<span class="small">
                  <b>${b.unknown}</b> kalem fiyatı bilinmediği için toplamın dışında.</span>`)}
                ${when(!b.unknown, () => html`<span class="small dim">
                  Bütün kalemlerin karşılığı hesaplandı.</span>`)}`,
            })}

            ${when(b.limit != null, () => K.Card({
              title:'Aylık sınır',
              body:html`${K.Meter({ label:'Kullanılan',
                value:Math.min(100, b.pct || 0),
                text:U.fmtNum(b.total) + ' / ' + U.fmtNum(b.limit) + ' TL',
                tone:b.over ? 'danger' : '' })}
                ${K.Notice({ tone:b.over ? 'warn' : 'ok', class:'mt-12',
                  body:b.over
                    ? 'Talep sınırın ' + U.fmtNum(b.total - b.limit) + ' TL üstünde. '
                      + 'Sıralama gereği önce güvenlik ve tahlil korunur; kısıntı '
                      + 'gıda kaleminde ikame ile yapılır.'
                    : 'Talep aylık sınırın içinde.' })}` }))}
          </div></div>

          <div class="span-5"><div class="stack">
            ${K.Card({ title:'Sedef\'in notu', hint:'budget-rank',
              badge:K.Badge({ label:'kural motoru', tone:'muted', icon:false }),
              body:html`<p class="small">${st.text}</p>`,
              foot:K.Button({ label:'Sedef\'e sor', size:'sm',
                act:'ask-agent', data:{ 'data-agent':'money' } }) })}

            ${K.Card({ title:'Bütçenin yeri', hint:'budget-rank',
              body:html`<p class="small">${SP.PRECEDENCE[5].note}</p>
                <div class="mt-10">${K.Table({ tight:true, headers:['Sıra', 'Kural'],
                  rows:SP.PRECEDENCE.map(p => [String(p.rank), p.label]) })}</div>` })}

            ${K.Card({ title:'Fiyatlar nereden geliyor?', hint:'price-estimate',
              body:html`<p class="small muted">Fiyatlar internetten çekilmez —
                bu uygulama çevrimdışı çalışır ve sağlık verisi dışarı çıkmaz.
                Başlangıçta tohum fiyat listesi kullanılır ve açıkça «tahmin»
                olarak işaretlenir. Fişten girdiğin her fiyat tohumun üstüne
                yazılır ve «ölçüldü» olur.</p>`,
              foot:K.Button({ label:'Fiyat gir', size:'sm',
                act:'basket-tab', data:{ 'data-tab':'fiyat' } }) })}
          </div></div>
        </div>
      </section>`;
  }

  function limitsSheet(){
    const bk = S.basket || {};
    UI.sheet({
      title:'Sınır ve ücretler',
      subtitle:'Girilmeyen alan «sınır yok» demektir, sıfır değil',
      body:String(K.Stack([
        K.Field({ label:'Haftalık sepet sınırı (TL)',
          input:K.Input({ id:'lim-week', type:'number', numeric:true, step:'any',
            value:bk.weeklyLimit == null ? '' : bk.weeklyLimit }) }),
        K.Field({ label:'Aylık toplam sağlık bütçesi (TL)',
          input:K.Input({ id:'lim-month', type:'number', numeric:true, step:'any',
            value:bk.monthlyLimit == null ? '' : bk.monthlyLimit }) }),
        K.Field({ label:'Tek panel test ücreti (TL)',
          hint:'ölçüm borcu olan panellerin maliyeti bundan hesaplanır',
          input:K.Input({ id:'lim-test', type:'number', numeric:true, step:'any',
            value:bk.testFee == null ? '' : bk.testFee }) }),
        K.Notice({ tone:'info', body:'Bu üç sayı yalnız bu cihazda tutulur ve '
          + 'hiçbir modele gönderilmez.' }),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-limits' })}`),
    });
  }

  /* ---------------------------------------------------------------- fiş

     Fiş okuma, fiyat tablosunun çürümesini çözer: tohum tahminler
     kullanıcının gerçek fiyatıyla değişir ve «ölçüldü» olur. Sistem
     market taramaz; fiyat hep kullanıcının elindeki belgeden gelir. */

  let receiptFile = null;
  let receiptRes = null;

  function receiptSheet(){
    UI.sheet({
      title:'Fiş oku', subtitle:'Fiyatlar tahminden ölçüme geçer',
      wide:true,
      body:String(K.Stack([
        when(!SP.Extract.modelReady(), () => K.Notice({ tone:'warn',
          title:'Model bağlı değil.',
          body:'Fiş okumak için Ayarlar → Rehber → Model bölümünden bir sağlayıcı '
            + 'seç. Fiyatları Fiyat sayfasından elle de girebilirsin.' })),
        K.Drop({ act:'receipt-file', label:'Fiş fotoğrafı ya da metni',
          icon:'file', accept:'image/*,.txt,.csv',
          hint:'Fişi buraya bırak ya da seçmek için tıkla' }),
        html`<div id="receipt-name" class="small dim">${receiptFile ? receiptFile.name : ''}</div>`,
        K.Notice({ tone:'info', body:'Okunan fiyat kilogram başınadır. Fişte toplam '
          + 'fiyat ve ağırlık varsa kilogram fiyatı hesaplanır.' }),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Oku', tone:'primary', act:'run-receipt',
          disabled:!receiptFile || !SP.Extract.modelReady() })}`),
      noFocus:true,
    });
  }

  function receiptPreviewSheet(res){
    UI.sheet({
      title:'Fişten okunanlar', subtitle:res.note, wide:true,
      body:String(K.Stack([
        when(res.rows.length, () => html`<div>${map(res.rows, (r, i) => html`
          <div class="${r.skip ? 'pasterow pasterow--off' : 'pasterow'}">
            ${K.Checkbox({ label:'', checked:!r.skip, act:'toggle-receipt-row',
              data:{ 'data-i':i } })}
            <span><b class="small">${r.food.name}</b>
              ${when(SP.Money.priceOf(r.food.id).cert === 'estimated',
                () => html` <span class="tiny dim">tahmini eziyor</span>`)}</span>
            <span class="pasterow__val num">${U.fmtNum(r.tl)} TL/kg</span>
            <span class="pasterow__src">fişten</span>
          </div>`)}</div>`),
        when(!res.rows.length, () => K.Notice({ tone:'warn', body:res.note })),
        when(res.unmatched.length, () => K.Notice({ tone:'info', title:'Eşleşmeyenler:',
          body:res.unmatched.map(x => x.line).join(' · ')
            + ' — bu ürünler gıda listemizde yok.' })),
      ])),
      footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Fiyatları kaydet', tone:'primary', act:'save-receipt',
          disabled:!res.rows.filter(r => !r.skip).length })}`),
      noFocus:true,
    });
  }

  /* --------------------------------------------------------------- ekran */

  async function render(){
    const tab = S.ui.basketTab;
    if(tab === 'butce'){
      return String(html`
        <div class="mb-8">${toolbar(tab)}</div>
        ${budgetView()}
        <div class="mt-24">${raw(UI.rail(['budget-rank', 'price-estimate', 'certainty']))}</div>`);
    }
    if(tab === 'ikame'){
      return String(html`
        <div class="mb-8">${toolbar(tab)}</div>
        ${K.Ledger(() => [swapCard(), bulkCard(),
          K.Entry({ label:'Bütçenin yeri', hint:'budget-rank', meta:'öncelik sırası',
            note:SP.PRECEDENCE[5].note,
            body:K.Table({ tight:true, headers:['Sıra', 'Kural'],
              rows:SP.PRECEDENCE.map(p => [String(p.rank), p.label]) }) }),
        ])}
        <div class="mt-24">${raw(UI.rail(['substitute', 'bulk', 'budget-rank']))}</div>`);
    }
    if(tab === 'fiyat'){
      return String(html`
        <div class="mb-8">${toolbar(tab)}</div>
        ${K.Ledger(() => [priceCard()])}
        <div class="mt-24">${raw(UI.rail(['price-estimate', 'certainty']))}</div>`);
    }
    return String(html`
      <div class="mb-8">${toolbar(tab)}</div>
      ${K.Ledger(() => [totalCard(), itemsCard(), coverageCard()])}
      <div class="mt-24">${raw(UI.rail(['price-estimate', 'substitute', 'bulk', 'budget-rank']))}</div>`);
  }

  const handle = {
    async 'open-receipt'(){ receiptFile = null; receiptRes = null; receiptSheet(); },
    async 'run-receipt'(){
      if(!receiptFile) return;
      UI.toast('Fiş okunuyor…');
      receiptRes = await SP.Extract.fromReceipt(receiptFile);
      receiptPreviewSheet(receiptRes);
    },
    async 'toggle-receipt-row'(el){
      const i = Number(el.dataset.i);
      if(!receiptRes || !receiptRes.rows[i]) return;
      receiptRes.rows[i].skip = !el.checked;
      receiptPreviewSheet(receiptRes);
    },
    async 'save-receipt'(){
      if(!receiptRes) return;
      const rows = receiptRes.rows.filter(r => !r.skip);
      if(!rows.length) return;
      for(const r of rows) await M.setPrice(r.food.id, r.tl);
      receiptRes = null; receiptFile = null;
      UI.closeSheet();
      UI.toast(rows.length + ' fiyat kaydedildi · ölçüldü');
      SP.App.render();
    },
    async 'open-limits'(){ limitsSheet(); },
    async 'save-limits'(){
      const num = id => {
        const el = document.getElementById(id);
        if(!el || String(el.value).trim() === '') return null;
        const n = Number(String(el.value).replace(',', '.'));
        return isFinite(n) ? n : null;
      };
      await M.saveBasket({ weeklyLimit:num('lim-week'), monthlyLimit:num('lim-month'),
        testFee:num('lim-test') });
      UI.closeSheet();
      UI.toast('Kaydedildi');
      SP.App.render();
    },
    async 'basket-tab'(el){ S.ui.basketTab = el.dataset.tab; S.ui.foodPage = 1; SP.App.render(); },
    async 'open-add'(){ S.ui.foodPage = 1; addSheet(); },
    async 'add-page'(el){ S.ui.foodPage = Number(el.dataset.page); addSheet(); },
    async 'pick-basket'(el){ kgSheet(el.dataset.id); },
    async 'save-kg'(el){
      const input = document.getElementById('basket-kg');
      const kg = input ? Number(String(input.value).replace(',', '.')) : 0;
      await M.setBasketItem(el.dataset.id, kg);
      UI.closeSheet();
      UI.toast(kg > 0 ? 'Sepete eklendi' : 'Sepetten çıkarıldı');
      SP.App.render();
    },
    async 'del-item'(el){
      await M.setBasketItem(el.dataset.id, 0);
      SP.App.render();
    },
    async 'open-limit'(){
      UI.sheet({
        title:'Haftalık sınır',
        body:String(K.Stack([
          K.Field({ label:'Haftalık sepet sınırı (TL)',
            input:K.Input({ id:'limit-tl', type:'number', numeric:true, step:'50', min:0,
              value:S.basket.weeklyLimit == null ? '' : S.basket.weeklyLimit }) }),
          K.Field({ label:'Hanedeki kişi sayısı',
            input:K.Input({ id:'limit-size', type:'number', numeric:true, step:'1', min:1,
              value:(S.prefs && S.prefs.householdSize) || 1 }) }),
          K.Notice({ tone:'info', body:'Sınır aşıldığında sistem sağlık hedefini indirmez; '
            + 'ikame önerisi çıkarır. Bütçe öncelik sırasında en sonda gelir.' }),
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Kaydet', tone:'primary', act:'save-limit' })}`),
      });
    },
    async 'save-limit'(){
      const tl = document.getElementById('limit-tl');
      const size = document.getElementById('limit-size');
      await M.saveBasket({ weeklyLimit:tl && tl.value.trim() !== '' ? Number(tl.value) : null });
      await M.savePrefs({ householdSize:size ? Math.max(1, Number(size.value) || 1) : 1 });
      UI.closeSheet();
      UI.toast('Kaydedildi');
      SP.App.render();
    },
    async 'do-swap'(el){
      const kg = Number(el.dataset.kg);
      await M.setBasketItem(el.dataset.from, 0);
      await M.setBasketItem(el.dataset.to, kg);
      UI.toast('Sepette değiştirildi');
      SP.App.render();
    },
    async 'open-cheap'(el){ cheapSheet(el.dataset.id); },
    async 'price-page'(el){ S.ui.foodPage = Number(el.dataset.page); SP.App.render(); },
  };

  const change = {
    async 'receipt-file'(el){
      receiptFile = (el.files && el.files[0]) || null;
      const n = document.getElementById('receipt-name');
      if(n) n.textContent = receiptFile ? receiptFile.name : '';
      const run = document.querySelector('[data-act="run-receipt"]');
      if(run) run.disabled = !receiptFile || !SP.Extract.modelReady();
    },
    async 'set-price'(el){
      const v = String(el.value).trim();
      await M.setPrice(el.dataset.id, v === '' ? null : Number(v.replace(',', '.')));
