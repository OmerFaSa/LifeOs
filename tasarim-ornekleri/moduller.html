<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AYS · SPİ · ESP bölümleri</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
:root{--ink:#0B0D12;--ink2:#4B5262;--ink3:#8E95A3;--cizgi:#EEF0F3;--zemin:#F6F7F9;--r:#2F6FEB;--r2:#7FA6FF;--rs:47,111,235;
  --iyi:#1A7F52;--iyiz:#E8F6EF;--kotu:#C23A3A;--kotuz:#FDECEC;--uy:#9A5B00;--uyz:#FDF3E3;--mor:#7A5CF0}
body{background:#fff;color:var(--ink);font:14px/1.45 "Geist",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.mono{font-family:"Geist Mono",monospace}
.ekran{min-height:100vh;padding:22px 0 64px;background:#fff;
  background-image:radial-gradient(900px 480px at 88% -12%,rgba(var(--rs),.10),transparent 70%),radial-gradient(700px 380px at -8% 105%,rgba(var(--rs),.05),transparent 70%)}
.ekran+.ekran{border-top:8px solid #E9ECF1}
.kap{width:1240px;margin:0 auto}

/* ust bar */
.ust{display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.marka{display:flex;align-items:center;gap:10px}
.marka .lg{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--r2),var(--r));color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 8px 18px -8px rgba(var(--rs),.8)}
.marka b{font-size:15px;font-weight:600;display:block;line-height:1.1}
.marka span{font-size:12px;color:var(--ink3)}
.nav{display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(243,244,246,.85);box-shadow:inset 0 0 0 1px rgba(0,0,0,.03)}
.nav span{height:36px;padding:0 16px;border-radius:999px;display:inline-flex;align-items:center;font-weight:500;color:var(--ink2)}
.nav span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06),0 6px 16px -8px rgba(0,0,0,.18)}
.nav span.on::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--r);margin-right:8px}
.sagu{display:flex;justify-content:flex-end;align-items:center;gap:10px}
.yuv{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--ink2);background:#fff;box-shadow:0 0 0 1px var(--cizgi);position:relative}
.yuv .n{position:absolute;top:8px;right:9px;width:7px;height:7px;border-radius:50%;background:#E5484D;box-shadow:0 0 0 2px #fff}
.rutbe{display:flex;align-items:center;gap:10px;height:40px;padding:0 14px 0 5px;border-radius:999px;background:#fff;box-shadow:0 0 0 1px var(--cizgi),0 6px 18px -10px rgba(0,0,0,.2)}
.rutbe .md{width:30px;height:30px;border-radius:50%;position:relative;display:grid;place-items:center}
.rutbe .md svg{position:absolute;inset:0;transform:rotate(-90deg)}
.rutbe .md i{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 30%,var(--k1),var(--k2) 72%)}
.rutbe b{font-size:13px;font-weight:600}
.rutbe span{font-size:11px;color:var(--ink3);margin-left:2px}

/* sayfa basi */
.sb{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;margin-top:44px}
.sb .ey{font:500 12px "Geist Mono",monospace;color:var(--ink3);letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.sb .ey::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--r);box-shadow:0 0 0 4px rgba(var(--rs),.15)}
.sb h1{font-size:36px;font-weight:600;letter-spacing:-.035em;margin-top:10px;display:flex;align-items:center;gap:12px}
.sb .ey2{color:var(--ink3);font-size:15px;margin-top:4px}
.eyl{display:flex;gap:8px;align-items:center}
.btn{height:40px;padding:0 16px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.btn.a{background:linear-gradient(135deg,var(--r2),var(--r) 55%);color:#fff;box-shadow:0 10px 22px -10px rgba(var(--rs),.8),inset 0 1px 0 rgba(255,255,255,.25)}
.btn.b{background:#fff;box-shadow:0 0 0 1px var(--cizgi);color:var(--ink)}
.btn.c{background:var(--zemin);color:var(--ink2)}
.seg{display:flex;padding:3px;border-radius:12px;background:var(--zemin)}
.seg span{height:34px;padding:0 14px;border-radius:9px;display:inline-flex;align-items:center;font-weight:500;color:var(--ink3)}
.seg span.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.06)}

/* kutular */
.izg{display:grid;gap:16px;margin-top:24px}
.k{border-radius:24px;background:#fff;box-shadow:0 0 0 1px var(--cizgi);padding:22px;position:relative}
.k.one{box-shadow:0 0 0 1px rgba(0,0,0,.04),0 2px 4px rgba(0,0,0,.03),0 40px 80px -34px rgba(var(--rs),.45)}
.k.z{background:var(--zemin);box-shadow:none}
.kb{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.kb h3{font-size:15px;font-weight:600}
.kb .s{margin-left:auto;font:12px "Geist Mono",monospace;color:var(--ink3)}
.cip{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;background:rgba(var(--rs),.1);color:var(--r);font-weight:600;font-size:12px;white-space:nowrap}
.cip.g{background:var(--zemin);color:var(--ink2)}
.cip.kt{background:var(--kotuz);color:var(--kotu)}.cip.uy{background:var(--uyz);color:var(--uy)}.cip.iy{background:var(--iyiz);color:var(--iyi)}
.cip.m{background:#F1EDFE;color:var(--mor)}
.cip i{width:6px;height:6px;border-radius:50%;background:currentColor}
.bi{width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;font:600 11px "Geist",sans-serif;color:var(--ink3);box-shadow:inset 0 0 0 1.3px #D3D7DE;position:relative;flex:none;letter-spacing:0}
.bi.acik{color:#fff;background:var(--ink);box-shadow:none}
.ipucu{position:absolute;z-index:5;left:calc(100% + 14px);top:50%;transform:translateY(-50%);width:300px;padding:12px 14px;border-radius:14px;background:var(--ink);color:#fff;font:400 12.5px/1.45 "Geist",sans-serif;text-align:left;box-shadow:0 20px 40px -12px rgba(0,0,0,.4)}
.ipucu b{display:block;font-weight:600;margin-bottom:3px;font-size:12.5px}
.ipucu em{font-style:normal;display:block;margin-top:6px;font:11px "Geist Mono",monospace;color:#A9B0BE}
.ipucu::after{content:"";position:absolute;right:100%;top:50%;transform:translateY(-50%);border:7px solid transparent;border-right-color:var(--ink)}
.ipucu.alt{left:auto;right:-10px;top:calc(100% + 12px);transform:none}
.ipucu.sol{left:auto;right:calc(100% + 14px)}
.ipucu.sol::after{right:auto;left:100%;border-right-color:transparent;border-left-color:var(--ink)}
.ipucu.alt::after{right:14px;top:auto;bottom:100%;transform:none;border-right-color:transparent;border-bottom-color:var(--ink)}
.bar{height:6px;border-radius:3px;background:var(--cizgi);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,var(--r2),var(--r))}
.kisa{display:flex;gap:14px;font-size:12px;color:var(--ink3);margin-top:16px}
.kisa kbd{font:500 11px "Geist Mono",monospace;color:var(--ink2);background:#fff;box-shadow:0 0 0 1px var(--cizgi),0 1px 0 var(--cizgi);border-radius:5px;padding:1px 6px;margin-right:4px}
.sat{display:grid;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--cizgi)}
.sat:first-of-type{border-top:0}
.v{font:500 13px "Geist Mono",monospace}
.soluk{color:var(--ink3)}

/* avatar */
.av{width:40px;height:40px;border-radius:50%;object-fit:cover;object-position:50% 18%;flex:none;background:var(--zemin);box-shadow:0 0 0 2px #fff,0 0 0 3px var(--cizgi)}
.av.b{width:52px;height:52px}
.av.sm{width:28px;height:28px}
.av.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--r)}
.kisi{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px;border-radius:16px}
.kisi b{display:block;font-weight:600}
.kisi span{font-size:12px;color:var(--ink3)}
.kisi.sec{background:#fff;box-shadow:0 0 0 1px var(--cizgi),0 14px 30px -18px rgba(0,0,0,.25)}
.nokta{width:8px;height:8px;border-radius:50%;background:#C9CED6}
.nokta.y{background:#22B573;box-shadow:0 0 0 3px rgba(34,181,115,.18)}
.nokta.a{background:#E0A030;box-shadow:0 0 0 3px rgba(224,160,48,.2)}

/* sohbet */
.sohbet{display:flex;flex-direction:column;gap:14px}
.msj{max-width:78%;padding:12px 16px;border-radius:18px;font-size:14px;line-height:1.5}
.msj.ben{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msj.o{background:var(--zemin);border-bottom-left-radius:6px}
.msj-s{display:flex;gap:10px;align-items:flex-end}
.msj .say{font-weight:600;background:#fff;border-radius:6px;padding:0 5px;box-shadow:0 0 0 1px var(--cizgi)}
.kaynak{display:flex;align-items:center;gap:6px;margin-top:8px;font:11px "Geist Mono",monospace;color:var(--ink3)}
.teklif{margin-left:38px;border-radius:18px;padding:16px;background:#fff;box-shadow:0 0 0 1px var(--cizgi),0 24px 48px -26px rgba(var(--rs),.5);max-width:84%}
.teklif .u{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--ink3)}
.teklif h4{font-size:16px;font-weight:600;margin-top:8px}
.teklif .fark{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.teklif .fark span{height:26px;padding:0 10px;border-radius:8px;background:var(--zemin);font-size:12px;display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.teklif .d{display:flex;gap:8px;margin-top:14px}
.yaz{display:flex;align-items:center;gap:10px;height:52px;padding:0 8px 0 16px;border-radius:16px;background:#fff;box-shadow:0 0 0 1px var(--cizgi),0 10px 24px -16px rgba(0,0,0,.3);margin-top:18px;color:var(--ink3)}
.yaz .ml{margin-left:auto;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--zemin);color:var(--ink2)}
.yaz .gn{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--r);color:#fff}
.not{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:12px 0;border-top:1px solid var(--cizgi)}
.not:first-of-type{border-top:0;padding-top:0}
.not b{font-weight:600}
.not p{font-size:13px;color:var(--ink2);margin-top:2px}

/* soru */
.soru-m{font-size:19px;line-height:1.6;color:var(--ink);margin-top:18px;max-width:62ch}
.secenek{display:flex;flex-direction:column;gap:10px;margin-top:22px}
.secenek div{display:flex;align-items:center;gap:14px;height:54px;padding:0 16px;border-radius:16px;background:var(--zemin);font-size:16px;font-weight:500}
.secenek div i{width:30px;height:30px;border-radius:10px;background:#fff;display:grid;place-items:center;font:600 13px "Geist",sans-serif;font-style:normal;color:var(--ink2);box-shadow:0 0 0 1px var(--cizgi)}
.secenek div.sec{background:#fff;box-shadow:0 0 0 2px var(--r),0 16px 32px -18px rgba(var(--rs),.7)}
.secenek div.sec i{background:var(--r);color:#fff;box-shadow:none}
.secenek div span.kb2{margin-left:auto;font:11px "Geist Mono",monospace;color:var(--ink3)}
.seritler{display:flex;gap:3px;margin-top:16px}
.seritler i{flex:1;height:6px;border-radius:3px;background:var(--cizgi)}
.seritler i.d{background:#2FB67C}.seritler i.y{background:#E5484D}.seritler i.s{background:var(--r);box-shadow:0 0 0 3px rgba(var(--rs),.18)}
.halka{position:relative;width:120px;height:120px}
.halka svg{width:100%;height:100%;transform:rotate(-90deg)}
.halka b{position:absolute;inset:0;display:grid;place-items:center;font-size:28px;font-weight:600;letter-spacing:-.03em}
.uc{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.uc div{border-radius:14px;background:var(--zemin);padding:12px}
.uc b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em}
.uc span{font-size:12px;color:var(--ink3)}

/* grafik */
svg text{font-family:"Geist Mono",monospace;font-size:11px;fill:var(--ink3)}
svg text.d{font-family:"Geist",sans-serif;font-size:14px;font-weight:600;fill:var(--ink)}
.hata{display:flex;flex-wrap:wrap;gap:8px}
.hata span{height:34px;padding:0 12px;border-radius:10px;display:inline-flex;align-items:center;gap:8px;font-weight:500;font-size:13px}
.hata span b{font:600 12px "Geist Mono",monospace}

/* tahlil */
.th{display:grid;grid-template-columns:120px 1fr 110px 120px 40px;gap:16px;align-items:center;padding:14px 16px;border-radius:16px}
.th.sec{background:#fff;box-shadow:0 0 0 1px var(--cizgi),0 18px 40px -22px rgba(var(--rs),.55)}
.th b{font-weight:600}
.aral{position:relative;height:8px;border-radius:4px;background:#F0F1F4}
.aral .rf{position:absolute;top:0;bottom:0;border-radius:4px;background:rgba(26,127,82,.16)}
.aral .hd{position:absolute;top:0;bottom:0;border-radius:4px;background:rgba(26,127,82,.36)}
.aral .nk{position:absolute;top:50%;width:14px;height:14px;border-radius:50%;background:var(--ink2);transform:translate(-50%,-50%);box-shadow:0 0 0 3px #fff}
.aral .nk.d{background:var(--kotu)}
.egilim{font:13px "Geist Mono",monospace;text-align:right}

/* beslenme */
.ogun{display:grid;grid-template-columns:64px 1fr auto;gap:16px;padding:16px 0;border-top:1px solid var(--cizgi);align-items:start}
.ogun:first-of-type{border-top:0;padding-top:0}
.ogun time{font:13px "Geist Mono",monospace;color:var(--ink3);padding-top:2px}
.ogun b{font-weight:600;font-size:15px}
.ogun .yiy{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.ogun .yiy span{height:26px;padding:0 10px;border-radius:8px;background:var(--zemin);font-size:12px;display:inline-flex;align-items:center;color:var(--ink2)}
.ogun .sg{text-align:right}
.ogun .sg b{display:block;font-size:16px}
.ogun .sg span{font:12px "Geist Mono",monospace;color:var(--ink3)}
.ogun.bos{opacity:1}
.ogun.bos .kutu{border:1.5px dashed #D6DAE0;border-radius:14px;padding:12px 14px;color:var(--ink3);display:flex;justify-content:space-between;align-items:center}
.makro{display:flex;justify-content:space-between;gap:10px}
.makro div{display:flex;flex-direction:column;align-items:center;gap:8px}
.makro .halka{width:104px;height:104px}
.makro .halka b{font-size:20px}
.makro span{font-size:12px;color:var(--ink3);text-align:center}
.su{display:flex;gap:6px}
.su i{flex:1;height:44px;border-radius:10px;background:var(--zemin);position:relative;overflow:hidden}
.su i.d::after{content:"";position:absolute;inset:auto 0 0 0;height:78%;background:linear-gradient(180deg,#8FE3D3,var(--r));border-radius:10px 10px 0 0}

/* kart tekrari */
.deste{position:relative;height:430px;margin-top:8px;margin-bottom:44px}
.deste .arka{position:absolute;left:40px;right:40px;top:26px;bottom:-14px;border-radius:30px;background:#fff;box-shadow:0 0 0 1px var(--cizgi);transform:rotate(-2.2deg)}
.deste .arka.b{left:70px;right:70px;top:40px;bottom:-26px;transform:rotate(1.8deg);opacity:.7}
.deste .on{position:absolute;inset:0 0 18px 0;border-radius:30px;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.04),0 50px 90px -40px rgba(var(--rs),.55);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:36px}
.deste .kelime{font-size:64px;font-weight:600;letter-spacing:-.04em}
.deste .ipa{font:15px "Geist Mono",monospace;color:var(--ink3);margin-top:6px}
.deste .cizgi{width:60px;height:2px;border-radius:1px;background:var(--cizgi);margin:24px 0}
.deste .anlam{font-size:22px;font-weight:500}
.deste .ornek{font-size:15px;color:var(--ink3);margin-top:8px;font-style:italic}
.not-dugme{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:22px}
.not-dugme div{height:64px;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;background:#fff;box-shadow:0 0 0 1px var(--cizgi)}
.not-dugme div span{font:11px "Geist Mono",monospace;color:var(--ink3);font-weight:400}
.not-dugme div.t{color:var(--kotu)}.not-dugme div.z{color:var(--uy)}
.not-dugme div.i{background:linear-gradient(135deg,var(--r2),var(--r) 60%);color:#fff;box-shadow:0 14px 28px -12px rgba(var(--rs),.8)}
.not-dugme div.i span{color:rgba(255,255,255,.8)}
.not-dugme div.k{color:var(--iyi)}

/* merdiven */
.matris{display:grid;grid-template-columns:150px repeat(6,1fr);gap:6px;align-items:center}
.matris .bas{font:11px "Geist Mono",monospace;color:var(--ink3);text-align:center;padding-bottom:4px}
.matris .ad{font-weight:500}
.matris .h{height:40px;border-radius:10px;background:var(--zemin)}
.matris .h.d{background:rgba(var(--rs),.22)}
.matris .h.d2{background:rgba(var(--rs),.42)}
.matris .h.su{background:linear-gradient(135deg,var(--r2),var(--r));box-shadow:0 10px 20px -10px rgba(var(--rs),.9)}
.matris .h.sec{box-shadow:0 0 0 2px var(--ink),0 10px 20px -10px rgba(var(--rs),.9)}
.kapi{display:grid;grid-template-columns:24px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--cizgi)}
.kapi:first-of-type{border-top:0}
.kapi .t{width:22px;height:22px;border-radius:7px;display:grid;place-items:center;background:var(--r);color:#fff}
.kapi .t.b{background:none;box-shadow:inset 0 0 0 1.5px #D0D4DB}
.kapi span{font:12px "Geist Mono",monospace;color:var(--ink3)}
.kor{margin-top:16px;border-radius:16px;padding:14px;background:var(--zemin);display:flex;gap:12px;align-items:flex-start;font-size:13px;color:var(--ink2)}
.kor b{color:var(--ink)}

.yuzen{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);display:flex;align-items:center;gap:16px;padding:10px 10px 10px 18px;border-radius:999px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 0 0 1px rgba(0,0,0,.05),0 24px 60px -18px rgba(40,30,90,.35);white-space:nowrap}
.yuzen .mk{width:30px;height:30px;border-radius:50%;background:linear-gradient(145deg,#A48BFF,#7A5CF0);display:grid;place-items:center;color:#fff}
.yuzen b{font-weight:600}
.yuzen .s{color:var(--ink3);font-size:13px}
.yuzen .ev{height:38px;padding:0 18px;border-radius:999px;background:var(--mor);color:#fff;font-weight:600;display:inline-flex;align-items:center}
.ekran{position:relative}
.g{animation:gir .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes gir{from{opacity:0;transform:translateY(14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <symbol id="ara" viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
  <symbol id="zil" viewBox="0 0 16 16"><path d="M4 11V7a4 4 0 0 1 8 0v4l1 1.5H3zM6.5 14h3" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></symbol>
  <symbol id="oyn" viewBox="0 0 16 16"><path d="M5 3v10l8-5z" fill="currentColor"/></symbol>
  <symbol id="tik" viewBox="0 0 16 16"><path d="M3.5 8.5l3 3 6-7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="yil" viewBox="0 0 16 16"><path d="M8 2l1.5 4.5L14 8l-4.5 1.5L8 14l-1.5-4.5L2 8l4.5-1.5z" fill="currentColor"/></symbol>
