        ${K.Input({ class:'input--search', placeholder:'Kartlarda ara…', value:S.ui.cardQuery || '',
          aria:'kartlarda ara', change:'card-search', data:{ 'data-debounce':220 } })}
        <span class="small dim">${list.length} / ${S.cards.length} kart</span>
      </div>
      ${list.length
        ? html`${K.Table({ tight:true, rows, headers:['Kart', 'Aşama', 'Sonraki', ''] })}
               ${K.Pager({ page:pg.page, pages:pg.pages, total:pg.total, act:'card-page' })}`
        : K.Empty({ icon:'search', text:'“'+(S.ui.cardQuery || '')+'” için kart bulunamadı.',
            action:K.Button({ label:'Aramayı temizle', size:'sm', act:'card-search-clear' }) })}`;

    return K.Card({ body });
  }

  /* ---------- yanlis defteri ---------- */

  function NotebookItem(e){
    const exam = S.exams.find(x => x.id === e.examId);
    const base = e.createdAt ? e.createdAt.slice(0, 10) : U.todayISO();
    const dueDates = R.SRS_INTERVALS.map(d => U.fmtShort(U.addDays(U.parse(base), d))).join(' · ');
    const source = exam ? exam.type+' · '+U.fmtShort(e.examDate || exam.date) : '—';

    return K.Card({ flat:true, pad:'sm', class:'stack-xs', body:html`
      <div class="row between wrap gap-6">
        <div class="row-sm">${raw(UI.tagDot(e.tag))}<b class="small">${e.topic || e.testName || 'Yanlış'}</b>
          ${K.Badge({ label:e.tag+' · '+R.ERROR_TAGS[e.tag].name, tone:'muted' })}
          ${when(e.status, () => K.Badge({ label:e.status, tone:'muted' }))}</div>
        <span class="tiny dim">${source}${e.questionNo ? ' · soru '+e.questionNo : ''}</span>
      </div>
      ${when(e.rootCause, () => html`<div class="small"><span class="dim">Kök neden:</span> ${e.rootCause}</div>`)}
      ${when(e.principle, () => html`<div class="small"><span class="dim">Doğru ilke:</span> ${e.principle}</div>`)}
      ${K.Row([
        K.Chip('Reçete: ' + (e.recipe || '—')),
        when(e.similar, () => K.Chip('Benzer: ' + e.similar)),
        when(e.seconds, () => K.Chip(e.seconds + ' sn')),
      ], { wrap:true })}
      <div class="tiny dim">Tekrar tarihleri: ${dueDates}</div>
      <div class="row between mt-4">
        ${e.repairDoneAt
          ? K.Badge({ label:'reçete yapıldı', tone:'ok' })
          : K.Button({ label:'Reçeteyi tamamla', size:'sm', act:'repair-done', data:{ 'data-id':e.id } })}
        ${e.closedAt
          ? K.Badge({ label:'kapandı · '+U.fmtShort(e.closedAt.slice(0, 10)), tone:'ok' })
          : K.Button({ label:'Kapat (çözümsüz doğru)', size:'sm', tone:'primary', act:'close-error', data:{ 'data-id':e.id } })}
      </div>` });
  }

  function notebook(){
    const showClosed = !!S.ui.notebookClosed;
    const all = S.errors.slice().sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || ''));
    const open = all.filter(e => !e.closedAt);
    const closed = all.filter(e => e.closedAt);
    const list = showClosed ? closed : open;
    const pg = K.paginate(list, S.ui.nbPage || 1, 20);

    return K.Grid([
      K.Span(8, K.Stack([
        K.Segmented({ act:'notebook-filter', value:showClosed ? '1' : '0', aria:'Yanlış defteri süzgeci',
          items:[{ value:'0', label:'Açık ('+open.length+')' }, { value:'1', label:'Kapanmış ('+closed.length+')' }] }),
        list.length
          ? html`${K.Stack(map(pg.items, NotebookItem), 'sm')}
                 ${K.Pager({ page:pg.page, pages:pg.pages, total:pg.total, act:'nb-page' })}`
          : K.Card({ body:K.Empty({ icon:'list',
              text:showClosed ? 'Henüz kapanmış kayıt yok.'
                : 'Açık yanlış yok. Deneme analizinde etiketlenen her hata buraya düşer.' }) }),
      ])),
      K.Span(4, K.Stack([
        K.Card({ title:'Defter alanları', hint:'notebook', sub:'Her kayıtta doldurulacak alanlar',
          body:K.Table({ tight:true, headers:['Alan', 'Yazılacak bilgi'],
            rows:R.NOTEBOOK_FIELDS.map(f => [html`<b class="small">${f[0]}</b>`, html`<span class="small muted">${f[1]}</span>`]) }) }),
        K.Card({ title:'Kapanış ölçütü', body:html`<p class="small muted">Soru, çözüme bakılmadan doğru
          yapıldıysa ve süre uygunsa kapanır. Çözüme bakılarak yapılan soru “doğru” değil,
          “öğrenme sorusu” sayılır.</p>` }),
      ])),
    ]);
  }

  /* ---------- kart formu ---------- */

  function cardSheet(cardId){
    const card = cardId ? S.cards.find(c => c.id === cardId) : null;
    const subjectOptions = [{ value:'', label:'— ders —' }].concat(R.SUBJECTS.map(s => ({ value:s.id, label:s.name })));

    const body = K.Stack([
      K.Notice({ tone:'info', body:'Kart geri çağırma gerektirmeli: “Mitokondri nedir?” yerine '
        + '“Oksijenli solunum basamaklarını yer ve ürünle eşleştir”.' }),
      K.Field({ label:'Ön yüz — soru',
        input:K.Textarea({ id:'cf-front', rows:2, value:card ? card.front : '', placeholder:'Geri çağırma gerektiren soru' }) }),
      K.Field({ label:'Arka yüz — cevap / ilke',
        input:K.Textarea({ id:'cf-back', rows:2, value:card ? card.back : '', placeholder:'Kısa ve genellenebilir' }) }),
      K.Cols(2, [
        K.Field({ label:'Konu', input:K.Input({ id:'cf-topic', value:card ? card.topic : '' }) }),
        K.Field({ label:'Ders', input:K.Select({ id:'cf-subject', options:subjectOptions, value:card ? card.subjectId : '' }) }),
      ]),
      when(card, () => K.Cols(2, [
        K.Field({ label:'Aşama', input:K.Select({ id:'cf-stage', value:card.stage,
          options:STAGES.map((label, value) => ({ value, label })) }) }),
        K.Field({ label:'Sonraki tekrar', input:K.Input({ id:'cf-due', type:'date', value:card.dueAt }) }),
      ])),
    ]);

    UI.sheet({
      title:card ? 'Kartı düzenle' : 'Kart oluştur',
      body:String(body),
      footer:String(html`
        ${when(card, () => K.Button({ label:'Sil', tone:'danger', act:'delete-card', data:{ 'data-id':card.id } }))}
        ${K.Button({ label:'Vazgeç', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-card', data:card ? { 'data-id':card.id } : {} })}`),
    });
  }

  /* ---------- ekran ---------- */

  function header(){
    const debt = C.cardDebt();
    const overdue = C.overdueCards().length;
    const tabs = [
      { id:'due', label:'Bugün due ('+C.dueCards().length+')' },
      { id:'all', label:'Tüm kartlar ('+S.cards.length+')' },
      { id:'notebook', label:'Yanlış defteri ('+C.openErrors().length+')' },
    ];
    return K.Span(12, K.Stack([
      K.Subtabs({ items:tabs, value:tab(), act:'card-tab', aria:'Tekrar bölümleri' }),
      when(debt > 10, () => K.Notice({ tone:'warn', title:'Tekrar borcu %'+debt+'.',
        body:'Gecikmiş '+overdue+' kart var. %10 üzerindeki borçta yeni kart üretimi azaltılır; önce borcu sadeleştir.' })),
    ], 'sm'));
  }

  function sidebar(){
    const debt = C.cardDebt();
    const due = C.dueCards().length;
    return K.Span(4, K.Stack([
      K.Cols(2, [
        K.Stat({ label:'Due', value:due, tone:due ? null : 'ok' }),
        K.Stat({ label:'Borç', value:'%'+debt, tone:debt > 10 ? 'warn' : 'ok',
          progress:debt, note:'hedef ≤%10' }),
      ]),
      /* Aciklama tek satira sigmiyordu ve yarida kesiliyordu; gun etiketi
         ustte, aciklama altinda tam metin olarak durur. */
      K.Card({ title:'Tekrar takvimi', hint:'srs', sub:'Aralıklar sabittir',
        body:html`<div class="srslist">${map(R.SRS_PROTOCOL, p => html`
          <div class="srsrow">
            <b class="srsrow__day">${p.day}</b>
            <span class="srsrow__detail">${p.detail}</span>
          </div>`)}</div>` }),
    ]));
  }

  async function render(){
    if(tab() === 'notebook') return String(html`${K.Grid(header())}${notebook()}`);
    return String(K.Grid([
      header(),
      K.Span(6, K.Stack(tab() === 'due' ? dueSession() : allCards())),
      sidebar(),
      K.Span(12, raw(UI.rail(['srs', 'card-debt', 'recall', 'notebook']))),
    ]));
  }

  const handle = {
    async 'card-tab'(el){ S.ui.cardTab = el.dataset.tab; R.App.render(); },
    async 'card-page'(el){ S.ui.cardPage = Number(el.dataset.page); R.App.render(); },
    async 'nb-page'(el){ S.ui.nbPage = Number(el.dataset.page); R.App.render(); },
    async 'notebook-filter'(el){ S.ui.notebookClosed = el.dataset.value === '1'; S.ui.nbPage = 1; R.App.render(); },
    async 'card-search-clear'(){ S.ui.cardQuery = ''; S.ui.cardPage = 1; R.App.render(); },
    async flip(el){
      const id = el.dataset.id;
      S.ui.flipped[id] = !S.ui.flipped[id];
      R.App.render();
    },
    async rate(el){
      const card = S.cards.find(c => c.id === el.dataset.id);
      M.schedule(card, el.dataset.rating);
      await M.saveCard(card);
      delete S.ui.flipped[card.id];
      UI.toast('Sonraki tekrar: '+U.fmtShort(card.dueAt));
      R.App.render();
    },
    async 'new-card'(){ cardSheet(); },
    async 'edit-card'(el){ cardSheet(el.dataset.id); },
    async 'save-card'(el){
      const id = el.dataset.id;
      const existing = id ? S.cards.find(c => c.id === id) : null;
      const front = document.getElementById('cf-front').value.trim();
      if(!front){ UI.toast('Ön yüz boş olamaz'); return; }
      const card = existing || M.newCard({});
      card.front = front;
      card.back = document.getElementById('cf-back').value.trim();
      card.topic = document.getElementById('cf-topic').value.trim();
      card.subjectId = document.getElementById('cf-subject').value || null;
      if(existing){
        card.stage = Number(document.getElementById('cf-stage').value) || 0;
        card.dueAt = document.getElementById('cf-due').value || card.dueAt;
      }
      await M.saveCard(card);
      UI.closeSheet();
      UI.toast(existing ? 'Kart güncellendi' : 'Kart eklendi');
      R.App.render();
    },
    async 'delete-card'(el){
      await M.deleteCard(el.dataset.id);
      UI.closeSheet();
      UI.toast('Kart silindi');
      R.App.render();
    },
    async 'close-error'(el){
      const err = S.errors.find(e => e.id === el.dataset.id);
      err.closedAt = new Date().toISOString();
      await M.saveError(err);
      UI.toast('Yanlış kapatıldı');
      R.App.render();
    },
    async 'repair-done'(el){
      const err = S.errors.find(e => e.id === el.dataset.id);
      err.repairDoneAt = new Date().toISOString();
      await M.saveError(err);
      R.App.render();
    },
  };

  const change = {
    async 'card-search'(el){ S.ui.cardQuery = el.value; S.ui.cardPage = 1; R.App.render(); },
  };

  /* klavye: bosluk cevir, 1/2/3 degerlendir */
  function onKey(e){
    if(R.S.route !== 'cards' || tab() !== 'due' || UI.isSheetOpen()) return;
    if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    const due = C.dueCards().sort((a, b) => a.dueAt.localeCompare(b.dueAt));
    if(!due.length) return;
    const card = due[0];
    if(e.code === 'Space'){
      e.preventDefault();
      S.ui.flipped[card.id] = !S.ui.flipped[card.id];
      R.App.render();
    }else if(S.ui.flipped[card.id] && ['1', '2', '3'].indexOf(e.key) >= 0){
      const byKey = { '1':'forgot', '2':'hard', '3':'remembered' };
      handle.rate({ dataset:{ id:card.id, rating:byKey[e.key] } });
    }
  }

  return {
    id:'cards',
    title:'Tekrar',
    subtitle(){
      return C.dueCards().length+' kart due · borç %'+C.cardDebt()+' · '+C.openErrors().length+' açık yanlış';
    },
    actions(){
      return String(K.Button({ label:'Kart ekle', icon:'plus', size:'sm', act:'new-card' }));
    },
    render, handle, change, onKey,
  };
})();

/* ==== js/screens/learn.js ==== */
/* Öğrenme — ders videosu, zaman damgalı not ve nottan tekrar kartı.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz.

   Teknik sinirlar (bilerek):
   - Transcript otomatik cekilmez. CORS ve kullanim kosullari buna izin vermez;
     aday isterse metni kendisi yapistirir.
   - Zaman damgasi elle "mm:ss" girilir ya da calisan blogun sayacindan onerilir.
     YouTube iframe'inden currentTime okumak IFrame API gerektirir; 3. parti
     script yuklemiyoruz, bu yuzden denenmez.
   - Gomulu oynatici acilmayabilir (CSP / ag). Bu durumda not editoru calismaya
     devam eder ve videoyu tarayicida acan bir baglanti gosterilir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.learn = (function(){
  const U = R.U, M = R.Model, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  /* Not etiketleri modelde tanimli; kart koprusu de oradan gecer. */
  const SEG_TAGS = M.SEGMENT_TAGS;
  const TAG_OPTIONS = Object.keys(SEG_TAGS).map(k => ({ value:k, label:SEG_TAGS[k].label }));

  let pendingCards = [];
  let pendingSplit = [];
  let listening = false;
  let recognition = null;

  /* Sesli not: tarayıcının kendi ses tanıması. Yoksa düğme hiç görünmez. */
  function startVoice(){
    const Rec = window.SpeechRecognition || window.webkitSpeechRecognition;
    if(!Rec){ UI.toast('Bu tarayıcı ses tanımayı desteklemiyor'); return; }
    if(listening && recognition){ recognition.stop(); return; }
    try{
      recognition = new Rec();
      recognition.lang = 'tr-TR';
      recognition.interimResults = false;
      recognition.maxAlternatives = 1;
      recognition.onresult = ev => {
        const text = ev.results[0][0].transcript;
        const box = document.getElementById('nf-text');
        if(box){ box.value = text; box.focus(); }
      };
      recognition.onend = () => { listening = false; R.App.render(); };
      recognition.onerror = () => { listening = false; UI.toast('Ses alınamadı'); R.App.render(); };
      recognition.start();
      listening = true;
      R.App.render();
    }catch(e){ listening = false; UI.toast('Ses tanıma başlatılamadı'); }
  }

  const FILTERS = [
    { value:'all',  label:'Tümü' },
    { value:'open', label:'Devam eden' },
    { value:'done', label:'Bitmiş' },
  ];

  function openNote(){
    return S.ui.noteOpen ? S.videoNotes.find(n => n.id === S.ui.noteOpen) : null;
  }

  function subjectOptions(){
    return [{ value:'', label:'— ders —' }].concat(R.SUBJECTS.map(s => ({ value:s.id, label:s.name })));
  }
  function topicOptions(subjectId){
    const s = R.SUBJECTS.find(x => x.id === subjectId);
    if(!s) return [{ value:'', label:'— önce ders seç —' }];
    return [{ value:'', label:'— konu —' }].concat(s.topics.map(t => ({ value:t.id, label:t.order+'. '+t.name })));
  }
  function topicLabel(note){
    const s = R.SUBJECTS.find(x => x.id === note.subjectId);
    if(!s) return 'Ders bağlanmadı';
    const t = s.topics.find(x => x.id === note.topicId);
    return t ? s.name+' · '+t.name : s.name;
  }

  /* Calisan blok varsa zaman damgasi icin bir baslangic onerisi verir. */
  function suggestedTs(){
    const day = S.days[U.todayISO()];
    const b = day ? day.blocks.find(x => x.startedAt) : null;
    if(!b) return null;
    return Math.max(0, Math.floor((Date.now() - new Date(b.startedAt).getTime())/1000));
  }

  /* ---------- liste ---------- */

  function NoteRow(note){
    const segs = note.segments.length;
    const cards = S.cards.filter(c => c.source === 'note' && c.sourceRef === note.id).length;
    const meta = [note.series || topicLabel(note), U.plural(segs, 'not', 'not'),
      cards ? cards+' kart' : null].filter(Boolean).join(' · ');
    return html`
      <div class="listitem listitem--tap" data-act="note-open" data-id="${note.id}">
        <span class="notedot ${note.done ? 'is-done' : ''}">${raw(UI.icon(note.done ? 'check' : 'play'))}</span>
        <div class="grow">
          <div class="row-sm wrap"><b>${note.title || 'Adsız ders'}</b>
            ${when(note.provider === 'youtube', () => K.Badge({ label:'video', tone:'muted' }))}
            ${when(note.transcript, () => K.Badge({ label:'metin var', tone:'muted' }))}</div>
          <div class="tiny dim">${meta}</div>
        </div>
        <span class="tiny dim">${U.fmtShort(note.createdAt.slice(0, 10))}</span>
      </div>`;
  }

  function listView(){
    const filter = S.ui.learnFilter || 'all';
    const q = U.norm(S.ui.learnQuery || '');
    let list = S.videoNotes.slice();
    if(filter === 'open') list = list.filter(n => !n.done);
    else if(filter === 'done') list = list.filter(n => n.done);
    if(q) list = list.filter(n => U.norm(n.title+' '+topicLabel(n)+' '+n.segments.map(s => s.text).join(' ')).indexOf(q) >= 0);

    const pg = K.paginate(list, S.ui.learnPage || 1, 20);
    const totalSegs = S.videoNotes.reduce((a, n) => a + n.segments.length, 0);
    const noteCards = S.cards.filter(c => c.source === 'note').length;

    const body = S.videoNotes.length
      ? (list.length
          ? html`<div class="list">${map(pg.items, NoteRow)}</div>
                 ${K.Pager({ page:pg.page, pages:pg.pages, total:pg.total, act:'note-page' })}`
          : K.Empty({ icon:'search', text:'Bu süzgece uyan ders yok.',
              action:K.Button({ label:'Süzgeci sıfırla', size:'sm', act:'learn-reset' }) }))
      : K.Empty({ icon:'play',
          text:'Henüz ders eklenmedi. Bir video izlerken buraya zaman damgalı not düşersin; '
             + 'not konuya bağlanır ve oradan tekrar kartına dönüşür.',
          action:K.Button({ label:'İlk dersi ekle', icon:'plus', tone:'primary', act:'note-new' }) });

    return K.Grid([
      K.Span(8, K.Stack([
        K.Row([
          K.Segmented({ items:FILTERS, value:filter, act:'learn-filter', aria:'Ders süzgeci' }),
          K.Input({ class:'input--search', placeholder:'Derslerde ve notlarda ara…',
            value:S.ui.learnQuery || '', aria:'derslerde ara',
            change:'learn-search', data:{ 'data-debounce':220 } }),
        ], { between:true, wrap:true }),
        K.Card({ body }),
      ])),
      K.Span(4, K.Stack([
        K.Cols(3, [
          K.Stat({ label:'Ders', value:U.fmtNum(S.videoNotes.length) }),
          K.Stat({ label:'Not', value:U.fmtNum(totalSegs) }),
          K.Stat({ label:'Kart', value:U.fmtNum(noteCards), tone:noteCards ? 'ok' : null }),
        ]),
        K.Card({ title:'Nasıl çalışır?', sub:'Dört adım, tek yolculuk', body:html`
          <ol class="bullets small muted">
            <li>Videoyu ekle, dersi ve konuyu bağla.</li>
            <li>İzlerken durakla, <b>mm:ss</b> ve tek cümle not düş.</li>
            <li>Notu etiketle: kural, örnek, tuzak, soru.</li>
            <li>“Kart yap” ile notu tekrar takvimine sok (1g→3g→1h→1a).</li>
          </ol>
          <p class="tiny dim mt-10">Transcript otomatik çekilmez; istersen metni yapıştırabilirsin.
            Zaman damgası elle girilir ya da çalışan bloğun sayacından önerilir.</p>` }),
        raw(UI.rail(['recall', 'srs', 'closure'])),
      ])),
    ]);
  }

  /* ---------- oynatici ---------- */

  function player(note){
    if(note.provider !== 'youtube' || !note.videoId){
      return K.Notice({ tone:'info', title:'Gömülü oynatıcı yok.',
        body:html`Bu bağlantı tanınan bir video sağlayıcısına ait değil.
          ${when(note.url, () => html`<a href="${note.url}" target="_blank" rel="noopener">Videoyu tarayıcıda aç</a>.`)}
          Not editörü yine de çalışır.` });
    }
    const src = 'https://www.youtube-nocookie.com/embed/' + note.videoId + '?rel=0&modestbranding=1';
    return html`
      <div class="player">
        <iframe class="player__frame" src="${src}" title="${note.title || 'Ders videosu'}"
          loading="lazy" allow="accelerometer; encrypted-media; picture-in-picture"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
      </div>
      <p class="tiny dim mt-6">Video açılmıyorsa
        <a href="${M.tsUrl(note, 0)}" target="_blank" rel="noopener">tarayıcıda aç</a> —
        not almaya buradan devam edebilirsin.</p>`;
  }

  /* ---------- not editoru ---------- */

  function segmentRow(note, seg, i){
    const t = SEG_TAGS[seg.tag] || SEG_TAGS.not;
    return html`
      <div class="seg-row">
        <a class="seg-row__ts num" href="${M.tsUrl(note, seg.ts)}" target="_blank" rel="noopener"
           title="videoda bu ana git">${M.fmtTs(seg.ts)}</a>
        <div class="grow">
          <div class="row-sm wrap">${K.Badge({ label:t.label, tone:t.tone })}</div>
          <div class="small mt-2">${seg.text}</div>
        </div>
        <div class="row-sm">
          ${K.Button({ label:'Kart yap', size:'sm', act:'note-seg-card', data:{ 'data-i':i } })}
          ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'notu sil',
            act:'note-seg-del', data:{ 'data-i':i } })}
        </div>
      </div>`;
  }

  function editor(note){
    const sug = suggestedTs();
    const tag = S.ui.noteTag || 'not';
    const tmpl = R.NOTE_TEMPLATES[tag] || R.NOTE_TEMPLATES.not;
    return K.Card({
      title:'Not al', hint:'notebook',
      sub:'Durakla, tek cümle yaz. Uzun not değil, geri çağırmayı tetikleyen cümle.',
      actions:when(window.SpeechRecognition || window.webkitSpeechRecognition,
        () => K.Button({ label:listening ? 'Dinleniyor…' : 'Sesle yaz', icon:'zap', size:'sm',
          tone:listening ? 'primary' : null, act:'note-voice' })),
      body:html`
        <div class="noteform">
          ${K.Field({ label:'Zaman', hint:note.source === 'kitap' ? 'sayfa' : 'mm:ss',
            input:K.Input({ id:'nf-ts', placeholder:note.source === 'kitap' ? '' : '12:30',
              aria:'zaman damgası', value:sug == null ? '' : M.fmtTs(sug) }) })}
          ${K.Field({ label:'Etiket',
            input:K.Select({ id:'nf-tag', options:TAG_OPTIONS, value:tag, change:'note-tag' }) })}
          ${K.Field({ label:'Not', input:K.Input({ id:'nf-text',
            placeholder:'ör. paydayı eşitlemeden sadeleştirme yapılmaz' }) })}
          ${K.Button({ label:'Ekle', icon:'plus', tone:'primary', act:'note-seg-add' })}
        </div>

        <div class="row wrap gap-6 mt-8">
          <span class="tiny dim">Kalıp:</span>
          ${map(tmpl, t => K.Chip({ label:t, act:'note-template', data:{ 'data-t':t } }))}
        </div>

        <div id="note-quality"></div>

        ${when(sug != null, () => html`<p class="tiny dim mt-6">Çalışan bloğun sayacı
          ${M.fmtTs(sug)} gösteriyor; zaman alanı bununla dolduruldu, değiştirebilirsin.</p>`)}`,
    });
  }

  function detailView(note){
    const segs = note.segments.slice().sort((a, b) => a.ts - b.ts);
    const cards = S.cards.filter(c => c.source === 'note' && c.sourceRef === note.id);

    return K.Grid([
      K.Span(12, K.Row([
        K.Button({ label:'Dersler', icon:'left', size:'sm', tone:'ghost', act:'note-back' }),
        html`<div class="row-sm">
          ${note.done ? K.Badge({ label:'bitti', tone:'ok' }) : K.Badge({ label:'devam ediyor', tone:'muted' })}
          ${K.Button({ label:note.done ? 'Yeniden aç' : 'Bitti işaretle', size:'sm', act:'note-toggle-done' })}
          ${K.IconButton({ icon:'trash', size:'sm', aria:'dersi sil', act:'note-delete', data:{ 'data-id':note.id } })}
        </div>`,
      ], { between:true, wrap:true })),

      K.Span(7, K.Stack([
        K.Card({ title:note.title || 'Adsız ders', sub:topicLabel(note), body:player(note) }),
        editor(note),
        K.Card({
          title:'Notlar', sub:U.plural(segs.length, 'kayıt', 'kayıt'),
          actions:when(segs.length, () => K.Button({ label:'Tümünden kart üret', icon:'cards',
            size:'sm', act:'note-cards-all' })),
          body:segs.length
            ? html`<div class="seglist">${map(segs, (s, i) => segmentRow(note, s, note.segments.indexOf(s)))}</div>`
            : K.Empty({ icon:'edit', text:'Henüz not yok. Videoyu durakla, zaman ve tek cümle gir.' }),
        }),
      ])),

      K.Span(5, K.Stack([
        K.Card({ title:'Ders bağlantısı', sub:'Not hangi konuya ait?', body:html`
          ${K.Field({ label:'Başlık', input:K.Input({ id:'nd-title', value:note.title,
            placeholder:'ör. Paragrafta ana düşünce', change:'note-title' }) })}
          ${K.Cols(2, [
            K.Field({ label:'Ders', input:K.Select({ id:'nd-subject', options:subjectOptions(),
              value:note.subjectId || '', change:'note-subject' }) }),
            K.Field({ label:'Konu', input:K.Select({ id:'nd-topic', options:topicOptions(note.subjectId),
              value:note.topicId || '', change:'note-topic' }) }),
          ])}
          ${K.Cols(2, [
            K.Field({ label:'Kaynak türü', input:K.Select({ id:'nd-source', change:'note-source',
              value:note.source || 'video',
              options:[{ value:'video', label:'Video' }, { value:'kitap', label:'Kitap / PDF' },
                { value:'ders', label:'Canlı ders' }] }) }),
            K.Field({ label:'Seri', hint:'aynı seriyi bir arada tut',
              input:K.Input({ id:'nd-series', value:note.series, placeholder:'ör. Paragraf kampı',
                change:'note-series' }) }),
          ])}
          ${note.source === 'kitap'
            ? K.Field({ label:'Kaynak / sayfa', input:K.Input({ id:'nd-page', value:note.page,
                placeholder:'ör. 345 TYT Matematik s.128', change:'note-page' }) })
            : K.Field({ label:'Video bağlantısı', hint:'YouTube bağlantısı gömülü açılır',
                input:K.Input({ id:'nd-url', value:note.url, placeholder:'https://…', change:'note-url' }) })}` }),

        when(R.Office.mode() === 'llm' && note.segments.length, () => K.Card({
          title:'Ofisten kart üret', sub:'Notlardan geri çağırma kartı önerir; sen onaylarsın',
          body:html`
            <p class="small muted">Ajan yalnız metin önerir. Kart nesnesini kural motoru kurar:
              aşama 0, ilk tekrar yarın, konu bu derse bağlı.</p>
            ${K.Button({ label:'Kart önerileri getir', icon:'zap', tone:'primary', block:true,
              class:'mt-10', act:'note-ai-cards', data:{ 'data-id':note.id } })}
            <div id="ai-cards"></div>` })),

        K.Collapsible({
          title:'Metin (transcript)', meta:note.transcript ? U.fmtNum(note.transcript.length)+' karakter' : 'boş',
          act:'note-toggle-transcript', open:!!S.ui.transcriptOpen,
          body:html`
            ${K.Notice({ tone:'info', body:'Otomatik çekilmez. Videonun altyazısını kopyalayıp buraya '
              + 'yapıştır; sistem cümlelere bölüp zaman damgası önerir, sen onaylarsın.' })}
            ${K.Textarea({ id:'nd-transcript', rows:8, value:note.transcript,
              placeholder:'Altyazı metnini buraya yapıştır (isteğe bağlı)', change:'note-transcript' })}
            ${when(note.transcript, () => K.Row([
              K.Field({ label:'Video süresi (dk)', input:K.Input({ id:'nd-dur', type:'number',
                numeric:true, class:'input--cell', placeholder:'—' }) }),
              K.Button({ label:'Cümlelere böl', icon:'zap', tone:'primary', class:'mt-12',
                act:'note-split' }),
            ], { wrap:true }))}`,
        }),

        when(cards.length, () => K.Card({ title:'Bu dersten üretilen kartlar', sub:U.plural(cards.length, 'kart', 'kart'),
          body:html`<div class="stack-xs">${map(cards.slice(0, 8), c => html`
            <div class="row between"><span class="small truncate">${c.front}</span>
              <span class="tiny dim">${U.fmtShort(c.dueAt)}</span></div>`)}</div>
            ${K.Button({ label:'Tekrar ekranına git', size:'sm', class:'mt-10', act:'go',
              data:{ 'data-route':'cards' } })}` })),
      ])),
    ]);
  }

  async function render(){
    const note = openNote();
    return String(note ? detailView(note) : listView());
  }

  const handle = {
    async 'learn-filter'(el){ S.ui.learnFilter = el.dataset.value; S.ui.learnPage = 1; R.App.render(); },
    async 'learn-reset'(){ S.ui.learnFilter = 'all'; S.ui.learnQuery = ''; S.ui.learnPage = 1; R.App.render(); },
    async 'note-page'(el){ S.ui.learnPage = Number(el.dataset.page); R.App.render(); },
    async 'note-open'(el){ S.ui.noteOpen = el.dataset.id; R.App.render(); },
    async 'note-back'(){ S.ui.noteOpen = null; R.App.render(); },
    async 'note-toggle-transcript'(){ S.ui.transcriptOpen = !S.ui.transcriptOpen; R.App.render(); },
    async 'note-tag'(el){ S.ui.noteTag = el.value; R.App.render(); },
    async 'note-template'(el){
      const box = document.getElementById('nf-text');
      if(box){ box.value = el.dataset.t; box.focus(); }
    },
    async 'note-voice'(){ startVoice(); },
    async 'note-split'(){
      const note = openNote();
      if(!note || !note.transcript){ UI.toast('Önce metni yapıştır'); return; }
      const durEl = document.getElementById('nd-dur');
      const secs = durEl && durEl.value ? Number(durEl.value) * 60 : null;
      const parts = M.splitTranscript(note.transcript, secs);
      if(!parts.length){ UI.toast('Bölünecek cümle bulunamadı'); return; }
      pendingSplit = parts;
      UI.sheet({
        title:'Bölünen cümleler', subtitle:parts.length+' öneri · onayladıkların not olur', wide:true,
        body:String(K.Stack([
          K.Notice({ tone:'info', body:'Zaman damgaları tahmindir. Video süresini girdiysen '
            + 'orantılı dağıtıldı; girmediysen cümle uzunluğuna göre yerleştirildi.' }),
          html`<div class="stack-xs">${map(parts, (x, i) => html`
            <label class="check">
              <input type="checkbox" checked data-split="${i}"/>
              <span><b class="tiny num">${M.fmtTs(x.ts)}</b> · ${x.text}</span>
            </label>`)}</div>`,
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Seçilenleri ekle', tone:'primary', act:'note-split-apply' })}`),
      });
    },
    async 'note-split-apply'(){
      const note = openNote();
      if(!note) return;
      let added = 0;
      document.querySelectorAll('[data-split]').forEach(el => {
        if(!el.checked) return;
        const seg = pendingSplit[Number(el.dataset.split)];
        if(seg){ note.segments.push({ ts:seg.ts, text:seg.text, tag:seg.tag }); added++; }
      });
      pendingSplit = [];
      await M.saveVideoNote(note);
      UI.closeSheet();
      UI.toast(added+' not eklendi');
      R.App.render();
    },

    async 'note-new'(){
      UI.sheet({
        title:'Ders ekle', subtitle:'Video bağlantısı isteğe bağlı — not almaya hemen başlayabilirsin',
        body:String(K.Stack([
          K.Field({ label:'Başlık', input:K.Input({ id:'nn-title', placeholder:'ör. Paragrafta ana düşünce' }) }),
          K.Field({ label:'Video bağlantısı', hint:'YouTube bağlantısı gömülü açılır',
            input:K.Input({ id:'nn-url', placeholder:'https://www.youtube.com/watch?v=…' }) }),
          K.Cols(2, [
            K.Field({ label:'Ders', input:K.Select({ id:'nn-subject', options:subjectOptions(), value:'' }) }),
            K.Field({ label:'Konu', input:K.Select({ id:'nn-topic', options:topicOptions(null), value:'' }) }),
          ]),
          K.Notice({ tone:'info', body:'Transcript otomatik çekilmez. İzlerken durakla, '
            + 'zaman damgası ve tek cümle notla ilerle.' }),
        ])),
        footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
          ${K.Button({ label:'Ekle ve aç', tone:'primary', act:'note-create' })}`),
      });
      const sel = document.getElementById('nn-subject');
      if(sel) sel.addEventListener('change', () => {
        const topic = document.getElementById('nn-topic');
        if(topic) topic.outerHTML = String(K.Select({ id:'nn-topic', options:topicOptions(sel.value), value:'' }));
      });
    },
    async 'note-create'(){
      const val = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
      const note = M.newVideoNote({
        title: val('nn-title'),
        url: val('nn-url'),
        subjectId: val('nn-subject') || null,
        topicId: val('nn-topic') || null,
      });
      if(!note.title && !note.url){ UI.toast('Başlık veya bağlantı gir'); return; }
      await M.saveVideoNote(note);
      UI.closeSheet();
      S.ui.noteOpen = note.id;
      UI.toast('Ders eklendi');
      R.App.render();
    },
    async 'note-delete'(el){
      const id = el.dataset.id;
      UI.confirmSheet('Dersi sil', 'Bu ders ve altındaki notlar silinecek. Üretilmiş tekrar kartları kalır.', async () => {
        await M.deleteVideoNote(id);
        S.ui.noteOpen = null;
        UI.closeSheet();
        UI.toast('Ders silindi');
        R.App.render();
      }, true);
    },
    async 'note-toggle-done'(){
      const note = openNote();
      if(!note) return;
      note.done = !note.done;
      await M.saveVideoNote(note);
      R.App.render();
    },

    async 'note-seg-add'(){
      const note = openNote();
      if(!note) return;
      const tsEl = document.getElementById('nf-ts');
      const textEl = document.getElementById('nf-text');
      const tagEl = document.getElementById('nf-tag');
      const text = textEl ? textEl.value.trim() : '';
      if(!text){ UI.toast('Not boş olamaz'); return; }
      const ts = M.parseTs(tsEl ? tsEl.value : '');
      if(ts == null){ UI.toast('Zaman "mm:ss" biçiminde olmalı'); return; }

      const q = M.noteQuality(text);
      if(!q.ok){
        const box = document.getElementById('note-quality');
        if(box) box.innerHTML = String(html`<div class="mt-8">${K.Notice({ tone:'warn',
          title:'Not zayıf.', body:q.issues.map(i => i.why).join(' ') + ' Yine de eklemek için tekrar bas.' })}</div>`);
        if(!S.ui.noteForce){ S.ui.noteForce = true; return; }
      }
      S.ui.noteForce = false;
      note.segments.push({ ts, text, tag:(tagEl && tagEl.value) || 'not' });
      await M.saveVideoNote(note);
      if(textEl) textEl.value = '';
      UI.toast('Not eklendi · '+M.fmtTs(ts));
      await R.App.render();
      const again = document.getElementById('nf-text');
      if(again) again.focus();
    },
    async 'note-seg-del'(el){
      const note = openNote();
      if(!note) return;
      note.segments.splice(Number(el.dataset.i), 1);
      await M.saveVideoNote(note);
      R.App.render();
    },
    async 'note-seg-card'(el){
      const note = openNote();
      if(!note) return;
      const seg = note.segments[Number(el.dataset.i)];
      if(!seg) return;
      await M.saveCard(M.cardFromSegment(note, seg));
      UI.toast('Kart oluşturuldu · yarın tekrar');
      R.App.render();
    },
    async 'note-ai-cards'(el){
      const id = el.dataset.id;
      const out = document.getElementById('ai-cards');
      if(out) out.innerHTML = String(html`<p class="small muted mt-10">Notlar okunuyor…
        <span class="dim">(10–60 sn)</span></p>`);
      try{
        const res = await R.Office.generateCards(id);
        pendingCards = res.cards;
        UI.sheet({
          title:'Önerilen kartlar', subtitle:res.cards.length+' kart · '+(res.dropped ? res.dropped+' öneri elendi' : 'hepsi geçerli'),
          wide:true,
          body:String(K.Stack([
            K.Notice({ tone:'info', body:'Onaylamadan önce oku. Yanlış bir kart, yanlış bir ezberdir.' }),
            html`<div class="stack-sm">${map(res.cards, (c, i) => K.Card({ flat:true, pad:'sm', body:html`
              <div class="row between"><b class="small">${c.front}</b>
                ${K.IconButton({ icon:'trash', size:'sm', plain:true, aria:'öneriyi çıkar',
                  act:'note-ai-drop', data:{ 'data-i':i } })}</div>
              <p class="small muted mt-4">${c.back}</p>` }))}</div>`,
          ])),
          footer:String(html`${K.Button({ label:'Vazgeç', act:'sheet-close' })}
            ${K.Button({ label:'Hepsini ekle', tone:'primary', act:'note-ai-accept' })}`),
        });
      }catch(err){
        const msg = R.LLM.errorText(err && err.code);
        if(out) out.innerHTML = String(html`<div class="mt-10">${K.Notice({ tone:'warn', body:msg })}</div>`);
      }
    },
    async 'note-ai-drop'(el){
      pendingCards.splice(Number(el.dataset.i), 1);
      UI.toast('Öneri çıkarıldı');
      const card = el.closest('.card');
      if(card) card.remove();
    },
    async 'note-ai-accept'(){
      if(!pendingCards.length){ UI.toast('Eklenecek kart yok'); return; }
      for(const c of pendingCards) await M.saveCard(c);
      const n = pendingCards.length;
      pendingCards = [];
      UI.closeSheet();
      UI.toast(n+' kart eklendi · yarın tekrar');
      R.App.render();
    },
    async 'note-cards-all'(){
      const note = openNote();
      if(!note || !note.segments.length) return;
      UI.confirmSheet('Tüm notlardan kart üret',
        note.segments.length+' not için tekrar kartı oluşturulacak. Kartlar 1 gün sonra çıkar.', async () => {
          for(const seg of note.segments) await M.saveCard(M.cardFromSegment(note, seg));
          UI.closeSheet();
          UI.toast(note.segments.length+' kart oluşturuldu');
          R.App.render();
        });
    },
  };

  const change = {
    async 'learn-search'(el){ S.ui.learnQuery = el.value; S.ui.learnPage = 1; R.App.render(); },
    async 'note-title'(el){ const n = openNote(); if(!n) return; n.title = el.value; await M.saveVideoNote(n); },
    async 'note-series'(el){ const n = openNote(); if(!n) return; n.series = el.value; await M.saveVideoNote(n); },
    async 'note-page'(el){ const n = openNote(); if(!n) return; n.page = el.value; await M.saveVideoNote(n); },
    async 'note-source'(el){
      const n = openNote(); if(!n) return;
      n.source = el.value;
      await M.saveVideoNote(n);
      R.App.render();
    },
    async 'note-transcript'(el){ const n = openNote(); if(!n) return; n.transcript = el.value; await M.saveVideoNote(n); },
    async 'note-url'(el){
      const n = openNote();
      if(!n) return;
      const parsed = M.parseVideoUrl(el.value);
      n.url = parsed.url; n.provider = parsed.provider; n.videoId = parsed.videoId;
      await M.saveVideoNote(n);
      R.App.render();
    },
    async 'note-subject'(el){
      const n = openNote();
      if(!n) return;
      n.subjectId = el.value || null;
      n.topicId = null;
      await M.saveVideoNote(n);
      R.App.render();
    },
    async 'note-topic'(el){
      const n = openNote();
      if(!n) return;
      n.topicId = el.value || null;
      await M.saveVideoNote(n);
    },
  };

  /* Ctrl+Enter ile not ekle — yazarken elini klavyeden kaldirmadan. */
  function onKey(e){
    if(e.key !== 'Enter') return;
    const el = document.getElementById('nf-text');
    if(el && document.activeElement === el){
      e.preventDefault();
      handle['note-seg-add']();
    }
  }

  return {
    id:'learn',
    title:'Öğrenme',
    subtitle(){
      const note = openNote();
      if(note) return (note.title || 'Adsız ders') + ' · ' + U.plural(note.segments.length, 'not', 'not');
      const segs = S.videoNotes.reduce((a, n) => a + n.segments.length, 0);
      return S.videoNotes.length
        ? U.plural(S.videoNotes.length, 'ders', 'ders') + ' · ' + U.plural(segs, 'not', 'not')
        : 'Video izle, not düş, karta çevir';
    },
    actions(){
      return String(K.Button({ label:'Ders ekle', icon:'plus', size:'sm', tone:'primary', act:'note-new' }));
    },
    render, handle, change, onKey,
  };
})();

/* ==== js/screens/quiz.js ==== */
/* Sınama — kendini test et, boşluğu gör, boşluğu karta çevir.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz.
   Karar motoru R.Quiz'dedir; ekran yalnizca cizer ve olay tasir. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.quiz = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;
  const Q = R.Quiz;

  const VERDICTS = [
    { key:'unknown', label:'Bilmiyordum', tone:'danger', hint:'1' },
    { key:'shaky',   label:'Emin değildim', tone:null,   hint:'2' },
    { key:'known',   label:'Biliyordum',  tone:'primary', hint:'3' },
  ];

  let lastSummary = null;

  /* ---------- kurulum ---------- */

  function setupView(){
    const av = Q.availability();
    const mode = S.ui.quizMode || 'due';
    const size = S.ui.quizSize || 10;
    const count = {
      due:av.due, errors:av.errors, notes:av.notes, mixed:av.mixed,
      subject:Q.pool({ mode:'subject', subjectId:S.ui.quizSubject || null }).length,
      topic:Q.pool({ mode:'topic', subjectId:S.ui.quizSubject || null, topicId:S.ui.quizTopic || null }).length,
    };
    const ready = (count[mode] || 0) > 0;

    const modeItems = Object.keys(Q.MODES).map(k => ({
      value:k, label:Q.MODES[k].label + (count[k] != null ? ' (' + count[k] + ')' : ''),
    }));

    const subject = R.SUBJECTS.find(s => s.id === S.ui.quizSubject);
    const topicOpts = subject
      ? [{ value:'', label:'— tüm konular —' }].concat(subject.topics.map(t => ({ value:t.id, label:t.name })))
      : [{ value:'', label:'— önce ders seç —' }];

    return K.Grid([
      K.Span(7, K.Stack([
        K.Card({
          title:'Sınama kur', hint:'recall',
          sub:'Önce cevabı üret, sonra bak. Tanımak bilmek değildir.',
          body:html`
            ${K.Field({ label:'Kaynak', hint:Q.MODES[mode].note,
              input:K.Select({ id:'qz-mode', options:modeItems, value:mode, change:'quiz-mode' }) })}
            ${when(mode === 'subject' || mode === 'topic', () => K.Cols(2, [
              K.Field({ label:'Ders', input:K.Select({ id:'qz-subject', change:'quiz-subject',
                value:S.ui.quizSubject || '',
                options:[{ value:'', label:'— ders —' }].concat(R.SUBJECTS.map(s => ({ value:s.id, label:s.name }))) }) }),
              K.Field({ label:'Konu', input:K.Select({ id:'qz-topic', options:topicOpts,
                value:S.ui.quizTopic || '', change:'quiz-topic' }) }),
            ]))}
            ${K.Cols(2, [
              K.Field({ label:'Soru sayısı',
                input:K.Segmented({ items:Q.SIZES.map(n => ({ value:n, label:String(n) })),
                  value:size, act:'quiz-size', aria:'Soru sayısı' }) }),
              K.Field({ label:'Biçim', hint:Q.FORMATS[S.ui.quizFormat || 'open'].note,
                input:K.Segmented({ act:'quiz-format', value:S.ui.quizFormat || 'open',
                  items:Object.keys(Q.FORMATS).map(k => ({ value:k, label:Q.FORMATS[k].name })),
                  aria:'Sınama biçimi' }) }),
            ])}
            ${K.Cols(2, [
              K.Field({ label:'Soru başına süre', hint:'süre baskısı hızını ölçer',
                input:K.Segmented({ act:'quiz-timer', value:S.ui.quizSeconds || 0,
                  items:Q.TIMERS.map(n => ({ value:n, label:n ? n + ' sn' : 'süresiz' })),
                  aria:'Soru süresi' }) }),
              K.Field({ label:'Okuma', hint:'ekrana bakmadan tekrar',
                input:K.Segmented({ act:'quiz-voice', value:S.ui.quizVoice ? '1' : '0',
                  items:[{ value:'0', label:'Sessiz' }, { value:'1', label:'Sesli' }],
                  aria:'Sesli okuma' }) }),
            ])}
            ${ready
              ? K.Button({ label:'Sınamayı başlat', icon:'play', tone:'primary', block:true,
                  class:'mt-12', act:'quiz-start' })
              : K.Notice({ tone:'warn', class:'mt-12',
                  body:'Bu seçimde sınanacak madde yok. Ders notu ekle, kart üret ya da '
                     + 'yanlış defterine kök neden yaz.' })}`,
        }),

        when(lastSummary, () => summaryCard(lastSummary)),
      ])),

      K.Span(5, K.Stack([
        K.Card({ title:'Neden sınama?', sub:'Kart çevirmekten farkı', body:html`
          <ul class="bullets small muted">
            <li>Kartı görünce “biliyorum” demek <b>tanımadır</b>; sınav <b>üretme</b> ister.</li>
            <li>Bilinmeyen madde otomatik karta düşer, tekrar takvimine girer.</li>
            <li>Bilinen madde kartın aralığını uzatır — boşuna tekrar etmezsin.</li>
            <li>Oturum sonunda zayıf konular adlandırılır; tahmin yok, sayım var.</li>
          </ul>` }),
        K.Card({ title:'Havuz', sub:'Şu an sınanabilir madde', body:K.Cols(2, [
          K.Stat({ label:'Bugünün kartı', value:U.fmtNum(av.due) }),
          K.Stat({ label:'Açık yanlış', value:U.fmtNum(av.errors) }),
          K.Stat({ label:'Ders notu', value:U.fmtNum(av.notes) }),
          K.Stat({ label:'Toplam', value:U.fmtNum(av.mixed) }),
        ]) }),
        raw(UI.rail(['recall', 'srs', 'closure', 'notebook'])),
      ])),
    ]);
  }

  /* ---------- oturum ---------- */

  function runView(){
    const item = Q.current();
    const p = Q.progress();
    const revealed = Q.isRevealed();
    if(!item) return setupView();

    return K.Grid([
      K.Span(8, K.Stack([
        K.Card({ pad:'sm', body:html`
          <div class="row between mb-10">
            <span class="small muted">${p.index + 1} / ${p.total} · ${Q.MODES[Q.active().mode].label}
              · ${Q.FORMATS[Q.format()].name.toLowerCase()}</span>
            ${Q.active().perQuestion
              ? html`<span class="${(Q.questionLeft() || 0) <= 5 ? 'small num is-late' : 'small num'}"
                  id="quiz-left">${Q.questionLeft()} sn</span>`
              : html`<span class="small dim">${U.fmtClock(p.seconds)}</span>`}
          </div>
          ${K.Bar({ value:U.pct(p.index, p.total), tone:'' })}` }),

        html`<div class="quizcard">
          <span class="quizcard__src">${item.sourceLabel}${item.topic ? ' · ' + item.topic : ''}</span>
          <p class="quizcard__prompt">${item.prompt}</p>
          ${when(!revealed && !item.choices, () => html`<p class="quizcard__hint">Cevabı önce kendine söyle — sonra göster.</p>`)}
          ${when(revealed, () => html`<div class="quizcard__answer"><span class="mono-label">Doğru cevap</span>
            <p>${item.answer}</p></div>`)}
        </div>`,

        when(item.choices, () => html`<div class="choices">${map(item.choices, (opt, i) => {
          const picked = Q.pickedIndex();
          const state = !revealed ? ''
            : i === item.correct ? ' is-correct'
            : i === picked ? ' is-wrong' : ' is-off';
          return html`<button class="${'choice' + state}" data-act="quiz-pick" data-i="${i}"
            ${revealed ? raw('disabled') : ''}>
            <span class="choice__key">${String.fromCharCode(65 + i)}</span>
            <span class="choice__text">${opt}</span></button>`;
        })}</div>`),

        revealed
          ? html`<div class="row gap-8">${map(VERDICTS, v => html`
              <button class="${'btn grow' + (v.tone ? ' btn--' + v.tone : '')}"
                data-act="quiz-answer" data-verdict="${v.key}">
                <span>${v.label}</span><span class="tiny dim">${v.hint}</span></button>`)}</div>`
          : (item.choices
              ? html`<p class="tiny dim center">Bir şık seç — sonra kendini işaretle.</p>`
              : K.Button({ label:'Cevabı göster', icon:'zap', tone:'primary', block:true, act:'quiz-reveal' })),

        K.Row([
          K.Button({ label:'Atla', size:'sm', tone:'ghost', act:'quiz-skip' }),
          K.Button({ label:'Oturumu bitir', size:'sm', tone:'ghost', act:'quiz-cancel' }),
        ], { between:true }),
      ])),

      K.Span(4, K.Stack([
        K.Card({ title:'Nasıl işaretlemeli?', sub:'Dürüstlük burada işe yarar', body:html`
          <div class="stack-xs">
            <div class="row-top gap-8">${K.Badge({ label:'Bilmiyordum', tone:'danger' })}
              <span class="small muted">Aklına gelmedi. Kart yarın geri gelir.</span></div>
            <div class="row-top gap-8">${K.Badge({ label:'Emin değildim', tone:'muted' })}
              <span class="small muted">Kısmen geldi. Aralık kısalır.</span></div>
            <div class="row-top gap-8">${K.Badge({ label:'Biliyordum', tone:'ok' })}
              <span class="small muted">Bakmadan üretebildin. Aralık uzar.</span></div>
          </div>
          <p class="tiny dim mt-10">Kendine iyi not vermek, sınavda ödemeni pahalılaştırır.</p>` }),
        raw(UI.rail(['recall', 'srs'])),
      ])),
    ]);
  }

  /* ---------- özet ---------- */

  function summaryCard(sum){
    const tone = sum.verdict === 'strong' ? 'ok' : sum.verdict === 'ok' ? 'warn' : 'danger';
    return K.Card({
      title:'Son oturum', sub:Q.MODES[sum.mode].label + ' · ' + U.fmtClock(sum.seconds),
      badge:K.Badge({ label:'%' + sum.score, tone }),
      body:html`
        ${K.Cols(3, [
          K.Stat({ label:'Biliyordum', value:sum.known, tone:'ok' }),
          K.Stat({ label:'Emin değil', value:sum.shaky, tone:sum.shaky ? 'warn' : null }),
          K.Stat({ label:'Bilmiyordum', value:sum.unknown, tone:sum.unknown ? 'danger' : null }),
        ])}
        <div class="mt-12">${K.Notice({ tone:tone === 'ok' ? 'ok' : 'info', body:sum.note })}</div>
        ${when(sum.createdCards, () => html`<p class="small muted mt-10">
          ${sum.createdCards} yeni tekrar kartı açıldı; yarın karşına çıkacak.</p>`)}
        ${when(sum.weak.length, () => html`
          <div class="stack-xs mt-12"><span class="mono-label">Zayıf konular</span>
            ${map(sum.weak, w => html`<div class="row between">
              <span class="small">${w.topic}</span>
              <span class="tiny dim num">${w.miss}/${w.total} gelmedi</span></div>`)}</div>`)}
        ${K.Row([
          K.Button({ label:'Tekrar sına', icon:'refresh', size:'sm', act:'quiz-start' }),
          K.Button({ label:'Kartlara git', size:'sm', act:'go', data:{ 'data-route':'cards' } }),
        ], { wrap:true })}`,
    });
  }

  async function render(){
    return String(Q.active() ? runView() : setupView());
  }

  const handle = {
    async 'quiz-size'(el){ S.ui.quizSize = Number(el.dataset.value); R.App.render(); },
    async 'quiz-format'(el){ S.ui.quizFormat = el.dataset.value; R.App.render(); },
    async 'quiz-timer'(el){ S.ui.quizSeconds = Number(el.dataset.value); R.App.render(); },
    async 'quiz-voice'(el){ S.ui.quizVoice = el.dataset.value === '1'; R.App.render(); },
    async 'quiz-pick'(el){
      const res = Q.pick(Number(el.dataset.i));
      if(res) UI.toast(res.correct ? 'Doğru şık' : 'Yanlış şık — doğrusu işaretlendi');
      R.App.render();
    },
    async 'quiz-say'(){ speak(); },
    async 'quiz-start'(){
      const res = Q.start({
        mode:S.ui.quizMode || 'due',
        size:S.ui.quizSize || 10,
        format:S.ui.quizFormat || 'open',
        seconds:S.ui.quizSeconds || 0,
        subjectId:S.ui.quizSubject || null,
        topicId:S.ui.quizTopic || null,
      });
      if(!res.ok){ UI.toast(res.reason); return; }
      lastSummary = null;
      UI.toast(res.total + ' madde · başla');
      R.App.render();
    },
    async 'quiz-reveal'(){ Q.reveal(); R.App.render(); },
    async 'quiz-answer'(el){
      const res = await Q.answer(el.dataset.verdict);
      if(res && res.done){
        lastSummary = res.summary;
        UI.toast('Oturum bitti · %' + res.summary.score);
      }
      R.App.render();
    },
    async 'quiz-skip'(){ Q.skip(); R.App.render(); },
    async 'quiz-cancel'(){
      UI.confirmSheet('Oturumu bitir',
        'Yarım oturum kaydedilmez; verdiğin cevaplar kart aralıklarına zaten işlendi.', async () => {
          Q.cancel();
          UI.closeSheet();
          R.App.render();
        });
    },
  };

  const change = {
    async 'quiz-mode'(el){ S.ui.quizMode = el.value; R.App.render(); },
    async 'quiz-subject'(el){ S.ui.quizSubject = el.value || null; S.ui.quizTopic = null; R.App.render(); },
    async 'quiz-topic'(el){ S.ui.quizTopic = el.value || null; R.App.render(); },
  };

  /* ---------- sesli okuma ve süre sayacı ---------- */

  /* Tarayıcının kendi ses sentezi; ek bağımlılık yok, yoksa sessizce atlanır. */
  function speak(text){
    const item = Q.current();
    const say = text || (item ? item.prompt : '');
    if(!say || !window.speechSynthesis) return false;
    try{
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(say);
      u.lang = 'tr-TR';
      u.rate = 0.95;
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }

  let timer = null;
  function stopTimer(){ if(timer){ clearInterval(timer); timer = null; } }
  function startTimer(){
    stopTimer();
    const run = Q.active();
    if(!run || !run.perQuestion) return;
    timer = setInterval(async () => {
      const el = document.getElementById('quiz-left');
      if(!Q.active()){ stopTimer(); return; }
      const left = Q.questionLeft();
      if(el) el.textContent = left + ' sn';
      if(left <= 0){
        stopTimer();
        const res = await Q.timeout();
        if(res && res.done){ lastSummary = res.summary; UI.toast('Süre doldu — oturum bitti'); }
        else UI.toast('Süre doldu');
        R.App.render();
      }
    }, 1000);
  }

  function afterRender(){
    const run = Q.active();
    if(!run){ stopTimer(); return; }
    startTimer();
    if(S.ui.quizVoice && !Q.isRevealed()) speak();
  }

  /* 1/2/3 ile isaretle, bosluk ile goster — kartlarla ayni refleks. */
  function onKey(e){
    if(S.route !== 'quiz' || UI.isSheetOpen()) return;
    if(e.target && /input|textarea|select/i.test(e.target.tagName)) return;
    if(!Q.active()) return;
    if(e.code === 'Space' && !Q.isRevealed()){
      e.preventDefault();
      handle['quiz-reveal']();
      return;
    }
    const item = Q.current();
    if(!Q.isRevealed() && item && item.choices){
      const letter = 'ABCD'.indexOf(String(e.key || '').toUpperCase());
      if(letter >= 0 && letter < item.choices.length){
        e.preventDefault();
        handle['quiz-pick']({ dataset:{ i:letter } });
        return;
      }
    }
    if(Q.isRevealed()){
      const idx = ['1', '2', '3'].indexOf(e.key);
      if(idx >= 0) handle['quiz-answer']({ dataset:{ verdict:VERDICTS[idx].key } });
    }
  }

  return {
    id:'quiz',
    title:'Sınama',
    subtitle(){
      const p = Q.progress();
      if(p) return p.index + 1 + ' / ' + p.total + ' · geri çağırma testi';
      const av = Q.availability();
      return av.mixed ? U.fmtNum(av.mixed) + ' madde sınanabilir' : 'Önce kart veya ders notu üret';
    },
    actions(){ return ''; },
    render, afterRender, handle, change, onKey,
  };
})();

/* ==== js/screens/subjects.js ==== */
/* Dersler — konu yol haritalari, durum takibi ve kapanis olcumleri.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.subjects = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  const STATE_BADGE = {
    not_started:['Başlanmadı', 'muted'], learning:['Öğreniliyor', 'info'],
    practicing:['Pratik', 'warn'], provisional:['Geçici kapalı', 'info'],
    closed:['Kapalı', 'ok'], reopened:['Yeniden açıldı', 'danger'],
  };

  const FILTERS = [
    { value:'all', label:'Tümü' }, { value:'high', label:'Yüksek frekans' },
    { value:'active', label:'Çalışılan' }, { value:'open', label:'Kapanmayan' },
  ];

  function openId(){ return S.ui.subjectOpen || R.SUBJECTS[0].id; }

  function StateBadge(state){
    const m = STATE_BADGE[state] || STATE_BADGE.not_started;
    return html`<span class="badge badge--${m[1]}"><span class="statedot state-${state}"></span>${m[0]}</span>`;
  }

  /* Iki olcum kurali: ilk test >= %75, 7 gun sonraki test >= %70. */
  function checkInfo(st){
    if(st.first == null) return null;
    if(st.second != null) return html`<span class="tiny dim">%${st.first} → %${st.second}</span>`;

    const dueISO = st.firstAt ? U.iso(U.addDays(U.parse(st.firstAt), R.CLOSURE_RULE.gapDays)) : null;
    const overdue = !!(dueISO && dueISO < U.todayISO());
    const soon = overdue || dueISO === U.todayISO();
    const label = !dueISO ? '—'
      : overdue ? U.diffDays(dueISO, U.todayISO())+' gün gecikti'
      : dueISO === U.todayISO() ? 'bugün' : U.relativeDay(dueISO);
    return html`<span class="${soon ? 'tiny is-due' : 'tiny dim'}">İlk test %${st.first} · 2. ölçüm ${label}</span>`;
  }

  function TopicRow(subject, topic){
    const st = M.topicState(subject.id, topic.id);
    const mod = st.state === 'closed' ? ' is-closed'
      : (st.state === 'learning' || st.state === 'practicing') ? ' is-active' : '';
    const freq = R.TOPIC_FREQ[topic.freq] || R.TOPIC_FREQ.mid;
    const info = checkInfo(st);

    return html`
      <div class="topicrow${mod}" data-act="topic-open" data-subject="${subject.id}" data-topic="${topic.id}">
        <span class="topicrow__order">${topic.order}</span>
        <div class="minw0">
          <div class="topicrow__name">${topic.name}</div>
          <div class="topicrow__meta">${topic.days} ·
            <span class="freq freq--${topic.freq}" title="${freq.note}">${freq.label} frekans</span></div>
          ${when(info, () => html`<div class="mt-2">${info}</div>`)}
        </div>
        ${StateBadge(st.state)}
      </div>`;
  }

  /* Konular brans grubuna gore bolunur — uzun liste okunabilir kalir. */
  function groupTopics(topics){
    const groups = [];
    topics.forEach(t => {
      const key = t.group || '—';
      let g = groups.find(x => x.key === key);
      if(!g){ g = { key, items:[] }; groups.push(g); }
      g.items.push(t);
    });
    return groups;
  }

  function filterTopics(subject){
    const filter = S.ui.topicFilter || 'all';
    const query = U.norm(S.ui.topicQuery || '');
    let topics = subject.topics;

    if(filter === 'high') topics = topics.filter(t => t.freq === 'high');
    else if(filter === 'open') topics = topics.filter(t => M.topicState(subject.id, t.id).state !== 'closed');
    else if(filter === 'active') topics = topics.filter(t => {
      const st = M.topicState(subject.id, t.id).state;
      return st === 'learning' || st === 'practicing' || st === 'provisional';
    });
    if(query) topics = topics.filter(t => U.norm(t.name+' '+(t.group || '')).indexOf(query) >= 0);
    return topics;
  }

  function subjectPanel(subject){
    const closure = C.subjectClosure(subject.id);
    const topics = filterTopics(subject);
    const highCount = subject.topics.filter(t => t.freq === 'high').length;

    return K.Stack([
      K.Card({
        title:subject.name, sub:subject.questions+' soru · '+subject.weight,
        actions:html`<div class="row-sm">${raw(UI.donut(closure.pct, closure.closed+'/'+closure.total, 72))}</div>`,
        body:html`
          ${K.Row([
            K.Chip('Hedef '+subject.targetBand),
            K.Chip(subject.topics.length+' konu'),
            K.Chip(highCount+' yüksek frekans'),
            when(subject.priority === 'support', () => K.Badge({ label:'destek testi', tone:'warn' })),
          ], { wrap:true })}
          <p class="small muted mt-10">${subject.insight}</p>`,
      }),

      K.Card({
        title:'Konular', hint:'source-arch', sub:'Önkoşul ve getiri sırasına göre',
        actions:K.Segmented({ items:FILTERS, value:S.ui.topicFilter || 'all', act:'topic-filter', aria:'Konu süzgeci' }),
        body:html`
          ${K.Input({ class:'mb-10', placeholder:'Konu ara…', value:S.ui.topicQuery || '',
            aria:'konu ara', change:'topic-search', data:{ 'data-debounce':220 } })}
          ${topics.length
            ? html`<div class="list">${map(groupTopics(topics), g => {
                const closed = g.items.filter(t => M.topicState(subject.id, t.id).state === 'closed').length;
                return html`<div class="topicgroup">
                  <div class="topicgroup__head"><span>${g.key}</span>
                    <span class="tiny dim num">${closed}/${g.items.length}</span></div>
                  ${map(g.items, t => TopicRow(subject, t))}
                </div>`;
              })}</div>`
            : K.Empty({ icon:'search', text:'Bu filtreye uyan konu yok.',
                action:K.Button({ label:'Süzgeci sıfırla', size:'sm', act:'topic-reset' }) })}`,
      }),

      K.Card({
        title:'Kaynak mimarisi', sub:'Temel → orta → branş',
        body:html`<div class="ladder">${map(subject.sources, s => html`
          <div class="ladder__row"><span class="ladder__level">${s.level}</span>
            <span class="muted">${s.detail}</span></div>`)}</div>`,
      }),
    ]);
  }

  /* ---------- konu formu ---------- */

  function topicSheet(subjectId, topicId){
    const subject = R.SUBJECTS.find(s => s.id === subjectId);
    const topic = subject.topics.find(t => t.id === topicId);
    const st = M.topicState(subjectId, topicId);
    const stateOptions = Object.keys(R.TOPIC_STATES).map(k => ({ value:k, label:R.TOPIC_STATES[k].label }));
    const freq = (R.TOPIC_FREQ[topic.freq] || {}).label || '';
    const pctInput = (id, value) => K.Input({ id, type:'number', numeric:true, min:0, max:100, value:value == null ? '' : value });

    const body = K.Stack([
      K.Card({ flat:true, pad:'sm', body:html`
        <div class="row between"><b>${topic.name}</b>${StateBadge(st.state)}</div>
        <p class="small muted mt-4">Tahmini süre: ${topic.days} · ${freq} frekans${topic.group ? ' · '+topic.group : ''}</p>` }),
      K.Notice({ tone:'info', body:html`Kapanış kuralı: konu testi ≥%${R.CLOSURE_RULE.first} <b>ve</b>
        ${R.CLOSURE_RULE.gapDays} gün sonraki test ≥%${R.CLOSURE_RULE.second}. Tek ölçüm kapanış saymaz.` }),
      K.Cols(2, [
        K.Field({ label:'1. ölçüm — konu testi %', input:pctInput('tp-first', st.first) }),
        K.Field({ label:'1. ölçüm tarihi', input:K.Input({ id:'tp-first-at', type:'date', value:st.firstAt || U.todayISO() }) }),
      ]),
      K.Cols(2, [
        K.Field({ label:'2. ölçüm — 7 gün sonra %', input:pctInput('tp-second', st.second) }),
        K.Field({ label:'2. ölçüm tarihi', input:K.Input({ id:'tp-second-at', type:'date', value:st.secondAt || '' }) }),
      ]),
      K.Field({ label:'Durum (elle geçersiz kıl)', input:K.Select({ id:'tp-state', options:stateOptions, value:st.state }) }),
      K.Field({ label:'Not', input:K.Textarea({ id:'tp-note', rows:2, value:st.note,
        placeholder:'Kaynak, zorlanılan alt başlık, kart ihtiyacı…' }) }),
    ]);

    UI.sheet({
      title:subject.name,
      subtitle:'Konu '+topic.order+' · durum ve ölçüm',
      body:String(body),
      footer:String(html`${K.Button({ label:'Kapat', act:'sheet-close' })}
        ${K.Button({ label:'Kaydet', tone:'primary', act:'save-topic',
          data:{ 'data-subject':subjectId, 'data-topic':topicId } })}`),
    });
  }

  /* ---------- ekran ---------- */

  function subjectNav(sid){
    return html`<div class="list">${map(R.SUBJECTS, s => {
      const c = C.subjectClosure(s.id);
      return html`
        <button class="${s.id === sid ? 'listitem listitem--tap is-on' : 'listitem listitem--tap'}"
                data-act="open-subject" data-id="${s.id}">
          <div class="grow"><div class="small strong">${s.name}</div>
            <div class="tiny dim">${c.closed}/${c.total} konu kapandı</div></div>
          <div class="w-46">${K.Bar({ value:c.pct, tone:'' })}</div>
        </button>`;
    })}</div>`;
  }

  function riskCard(){
    const list = C.riskRanking(8);
    if(!list.length) return null;
    const reason = r => {
      const parts = [];
      if(r.state === 'not_started') parts.push('başlanmadı');
      else if(r.state !== 'closed') parts.push(R.TOPIC_STATES[r.state].label.toLowerCase());
      if(r.freq === 'high') parts.push('yüksek frekans');
      if(r.errors) parts.push(r.errors+' açık yanlış');
      if(r.staleDays != null && r.staleDays >= R.SCORING.staleDays) parts.push(r.staleDays+' gündür dokunulmadı');
      return parts.slice(0, 3).join(' · ');
    };
    return K.Card({
      title:'Öncelik sırası', hint:'closure',
      sub:'Frekans, kapanış, açık yanlış, gecikmiş kart ve tazelikten hesaplanır',
      actions:K.Button({ label:'Analiste sor', icon:'zap', size:'sm',
        act:'ask-agent', data:{ 'data-agent':'analist' } }),
      body:html`
        ${map(list, r => html`
          <div class="riskrow" data-act="open-topic" data-subject="${r.subjectId}" data-topic="${r.topicId}">
            <span class="riskrow__score is-${r.band}">${r.score}</span>
            <div class="riskrow__text">
              <div class="small strong">${r.topicName}</div>
              <div class="tiny dim truncate">${r.subjectName} · ${reason(r)}</div>
            </div>
            ${K.Badge({ label:r.label, tone:r.tone })}
          </div>`)}
        <p class="tiny dim mt-10">Sıra bir emir değil, bir öneridir: haftanın sözleşmesi imzalıysa
          önce onu bitir, riski gelecek haftaya taşı.</p>`,
    });
  }

  function pendingCard(pending){
    if(!pending.length) return null;
    return K.Span(12, K.Card({ class:'card--accent', title:'Bekleyen 2. ölçümler', sub:'Kapanış için gerekli',
      body:K.Row(map(pending.slice(0, 8), p => K.Chip({
        label:p.topicName+' · '+(p.overdue ? 'gecikti' : U.relativeDay(p.dueISO)),
        act:'open-topic', on:p.overdue,
        data:{ 'data-subject':p.subjectId, 'data-topic':p.topicId },
      })), { wrap:true }) }));
  }

  async function render(){
    const sid = openId();
    const subject = R.SUBJECTS.find(s => s.id === sid);
    const overall = C.overallClosure();
    const tyt = C.examClosure('TYT');
    const ayt = C.examClosure('AYT');

    return String(K.Grid([
      K.Span(12, K.Cols(3, [
        K.Stat({ label:'Toplam konu kapanışı', value:'%'+overall.pct, hint:'closure',
          note:overall.closed+' / '+overall.total+' konu', progress:overall.pct }),
        K.Stat({ label:'TYT kapanış', value:'%'+tyt.pct, note:tyt.closed+' / '+tyt.total, progress:tyt.pct }),
        K.Stat({ label:'AYT kapanış', value:'%'+ayt.pct, note:ayt.closed+' / '+ayt.total,
          progress:ayt.pct, tone:ayt.pct < 55 ? 'warn' : null }),
      ])),
      pendingCard(C.pendingSecondChecks()),
      K.Span(3, K.Stack([
        K.Card({ pad:'sm', title:'Dersler', sub:R.SUBJECTS.length+' ders', body:subjectNav(sid) }),
        riskCard(),
      ])),
      K.Span(7, subjectPanel(subject)),
      K.Span(12, raw(UI.rail(['closure', 'second-check', 'source-arch']))),
    ]));
  }

  const handle = {
    async 'topic-filter'(el){ S.ui.topicFilter = el.dataset.value; R.App.render(); },
    async 'topic-reset'(){ S.ui.topicFilter = 'all'; S.ui.topicQuery = ''; R.App.render(); },
    async 'open-subject'(el){ S.ui.subjectOpen = el.dataset.id; R.App.render(); },
    async 'open-topic'(el){ topicSheet(el.dataset.subject, el.dataset.topic); },
    async 'topic-open'(el){
      S.ui.topicSubject = el.dataset.subject;
      S.ui.topicOpen = el.dataset.topic;
      R.App.go('topic');
    },
    async 'save-topic'(el){
      const subjectId = el.dataset.subject, topicId = el.dataset.topic;
      const firstVal = document.getElementById('tp-first').value;
      const secondVal = document.getElementById('tp-second').value;
      const patch = {
        first: firstVal === '' ? null : Number(firstVal),
        firstAt: firstVal === '' ? null : (document.getElementById('tp-first-at').value || U.todayISO()),
        second: secondVal === '' ? null : Number(secondVal),
        secondAt: secondVal === '' ? null : (document.getElementById('tp-second-at').value || U.todayISO()),
        note: document.getElementById('tp-note').value,
      };
      const chosen = document.getElementById('tp-state').value;
      const auto = (patch.first != null && patch.second != null)
        ? ((patch.first >= R.CLOSURE_RULE.first && patch.second >= R.CLOSURE_RULE.second) ? 'closed' : 'practicing')
        : (patch.first != null ? (patch.first >= R.CLOSURE_RULE.first ? 'provisional' : 'practicing') : 'not_started');
      if(chosen !== auto) patch.state = chosen;

      const next = await M.setTopicState(subjectId, topicId, patch);
      UI.closeSheet();
      UI.toast(next.state === 'closed' ? 'Konu kapandı' : 'Durum kaydedildi');
      R.App.render();
    },
  };

  const change = {
    async 'topic-search'(el){ S.ui.topicQuery = el.value; R.App.render(); },
  };

  return {
    id:'subjects',
    title:'Dersler',
    subtitle(){
      const o = C.overallClosure();
      const total = R.SUBJECTS.reduce((a, s) => a + s.topics.length, 0);
      return o.closed+' / '+o.total+' konu kapandı · '+R.SUBJECTS.length+' derste '+total+' konu';
    },
    actions(){ return ''; },
    render, handle, change,
  };
})();

/* ==== js/screens/topic.js ==== */
/* Konu özeti — bir konunun her şeyi tek ekranda.

   Şu an notlar Öğrenme'de, kartlar Tekrar'da, hatalar Yanlış defterinde,
   ölçümler Dersler'de duruyor. Bir konuya çalışırken dördünü birden görmek
   gerekiyor; bu ekran o dördünü birleştirir.

   Yazim bicimi: STIL.md. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.topic = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  function ctx(){
    const sid = S.ui.topicSubject;
    const tid = S.ui.topicOpen;
    const subject = R.SUBJECTS.find(s => s.id === sid);
    const topic = subject ? subject.topics.find(t => t.id === tid) : null;
    return { subject, topic };
  }

  function cardsOf(subject, topic){
    return S.cards.filter(c => c.subjectId === subject.id
      && (!c.topic || c.topic === topic.name || c.topic.indexOf(topic.name) >= 0));
  }
  function errorsOf(subject, topic){
    return S.errors.filter(e => e.subjectId === subject.id && e.topicId === topic.id);
  }
  function notesOf(subject, topic){
    return S.videoNotes.filter(n => n.subjectId === subject.id
      && (!n.topicId || n.topicId === topic.id));
  }
  function planWeeks(subject, topic){
    const plan = M.activePlan();
    if(!plan) return [];
    return plan.weeks.filter(w => (w.items || []).some(i =>
      i.subjectId === subject.id && i.topicId === topic.id)).map(w => w.n);
  }

  function headerCard(subject, topic, st, risk){
    const freq = R.TOPIC_FREQ[topic.freq] || R.TOPIC_FREQ.mid;
    const weeks = planWeeks(subject, topic);
    return K.Card({
      title:topic.name,
      sub:subject.name + (topic.group ? ' · ' + topic.group : ''),
      badge:when(risk, () => K.Badge({ label:'risk ' + risk.score, tone:risk.tone })),
      actions:K.Button({ label:'Durumu düzenle', size:'sm', tone:'primary', act:'topic-edit' }),
      body:html`
        ${K.Row([
          K.Chip(R.TOPIC_STATES[st.state].label),
          K.Chip(freq.label + ' frekans'),
          K.Chip('tahmini ' + topic.days),
          when(weeks.length, () => K.Chip('plan: H' + weeks.join(', H'))),
        ], { wrap:true })}
        <p class="small muted mt-10">${freq.note}</p>`,
    });
  }

  function measureCard(subject, topic, st){
    const rule = R.CLOSURE_RULE;
    const first = st.first, second = st.second;
    const dueISO = st.firstAt && second == null
      ? U.iso(U.addDays(U.parse(st.firstAt), rule.gapDays)) : null;
    const overdue = dueISO && dueISO < U.todayISO();

    return K.Card({
      title:'Kapanış ölçümü', hint:'second-check',
      sub:'İlk test ≥%' + rule.first + ' ve ' + rule.gapDays + ' gün sonra ≥%' + rule.second,
      body:html`
        ${K.Cols(2, [
          K.Stat({ label:'1. ölçüm', value:first == null ? '—' : '%' + first,
            note:st.firstAt ? U.fmtShort(st.firstAt) : 'girilmedi',
            tone:first == null ? null : first >= rule.first ? 'ok' : 'warn' }),
          K.Stat({ label:'2. ölçüm', value:second == null ? '—' : '%' + second,
            note:second != null ? U.fmtShort(st.secondAt)
              : dueISO ? (overdue ? 'gecikti' : U.relativeDay(dueISO)) : 'ilk ölçümden sonra',
            tone:second == null ? (overdue ? 'warn' : null) : second >= rule.second ? 'ok' : 'warn' }),
        ])}
        ${when(overdue, () => html`<div class="mt-12">${K.Notice({ tone:'warn',
          body:'2. ölçüm gecikti. Tek ölçüm kapanış saymaz; konu kapalı görünüyor ama kapalı değil.' })}</div>`)}
        ${when(st.note, () => html`<p class="small muted mt-10"><span class="dim">Not:</span> ${st.note}</p>`)}`,
    });
  }

  function practiceCard(subject, topic){
    const p = C.topicPractice(subject.id, topic.id);
    const v = R.Analytics.topicValue().find(x => x.subjectId === subject.id && x.topicId === topic.id);
    return K.Card({
      title:'Pratik', sub:'Bu konuya bağlı bloklardan gelen gerçek veri',
      body:html`
        ${K.Cols(3, [
          K.Stat({ label:'Çözülen', value:U.fmtNum(p.solved), note:p.sessions + ' blok' }),
          K.Stat({ label:'Doğruluk', value:p.accuracy == null ? '—' : '%' + p.accuracy,
            tone:p.accuracy == null ? null : p.accuracy >= 70 ? 'ok' : 'warn' }),
          K.Stat({ label:'Net açığı', value:v ? U.fmtNet(v.gap) : '—',
            note:v ? 'potansiyel ' + U.fmtNet(v.potential) : '' }),
        ])}
        ${when(p.solved === 0, () => html`<p class="tiny dim mt-10">
          Henüz bu konuya bağlı blok yok. Bugün ekranında bloğu bu konuya bağlarsan
          doğruluk buradan okunur.</p>`)}`,
    });
  }

  function notesCard(subject, topic){
    const notes = notesOf(subject, topic);
    const segs = [];
    notes.forEach(n => n.segments.forEach(s => segs.push({ note:n, seg:s })));
    if(!segs.length){
      return K.Card({ title:'Ders notları',
        body:K.Empty({ icon:'play', text:'Bu konuya bağlı ders notu yok.',
          action:K.Button({ label:'Ders ekle', size:'sm', act:'go', data:{ 'data-route':'learn' } }) }) });
    }
    return K.Card({
      title:'Ders notları', sub:U.plural(segs.length, 'not', 'not') + ' · ' + notes.length + ' ders',
      body:html`<div class="stack-xs">${map(segs.slice(0, 10), x => html`
        <div class="row-top gap-8">
          <a class="seg-row__ts num" href="${M.tsUrl(x.note, x.seg.ts)}" target="_blank" rel="noopener">${M.fmtTs(x.seg.ts)}</a>
          <span class="small">${x.seg.text}</span>
        </div>`)}</div>`,
    });
  }

  function cardsCard(subject, topic){
    const cards = cardsOf(subject, topic);
    const due = cards.filter(c => c.dueAt <= U.todayISO()).length;
    if(!cards.length){
      return K.Card({ title:'Tekrar kartları',
        body:K.Empty({ icon:'cards', text:'Bu konuda kart yok. Not ya da yanlış kaydından üretilir.' }) });
    }
    return K.Card({
      title:'Tekrar kartları', sub:cards.length + ' kart · ' + due + ' bugün due',
      actions:when(due, () => K.Button({ label:'Sına', icon:'zap', size:'sm', act:'topic-quiz' })),
      body:html`<div class="stack-xs">${map(cards.slice(0, 8), c => html`
        <div class="row between">
          <span class="small truncate">${c.front}</span>
          <span class="${c.dueAt <= U.todayISO() ? 'tiny num is-late' : 'tiny num dim'}">${U.fmtShort(c.dueAt)}</span>
        </div>`)}</div>`,
    });
  }

  function errorsCard(subject, topic){
    const errs = errorsOf(subject, topic);
    if(!errs.length){
      return K.Card({ title:'Bu konudan gelen yanlışlar',
        body:K.Empty({ icon:'list', text:'Bu konudan kayıtlı yanlış yok.' }) });
    }
    const dist = {};
    errs.forEach(e => { dist[e.tag] = (dist[e.tag] || 0) + 1; });
    const top = Object.keys(dist).sort((a, b) => dist[b] - dist[a])[0];
    return K.Card({
      title:'Bu konudan gelen yanlışlar', sub:errs.length + ' kayıt',
      badge:when(top, () => K.Badge({ label:top + ' baskın', tone:'warn' })),
      body:html`
        <div class="stack-xs">${map(errs.slice(0, 6), e => html`
          <div class="row-top gap-8">
            ${raw(UI.tagDot(e.tag))}
            <div class="minw0">
              <div class="small">${e.rootCause || 'kök neden yazılmadı'}</div>
              ${when(e.principle, () => html`<div class="tiny dim">İlke: ${e.principle}</div>`)}
            </div>
          </div>`)}</div>
        ${when(top, () => html`<div class="mt-12">${K.Notice({ tone:'info',
          body:'Baskın hata ' + top + ' — ' + R.ERROR_TAGS[top].name + '. Reçete: ' + R.ERROR_TAGS[top].recipe })}</div>`)}`,
    });
  }

  function riskCard(risk){
    if(!risk) return null;
    const parts = [
      ['Frekans', risk.parts.freq],
      ['Kapanış', risk.parts.closure],
      ['Açık yanlış', risk.parts.errors],
      ['Gecikmiş kart', risk.parts.cards],
      ['Tazelik', risk.parts.stale],
      ['Pratik', risk.parts.practice || 0],
    ];
    return K.Card({
      title:'Risk neden bu kadar?', hint:'risk', sub:'Skoru oluşturan beş girdi',
      body:html`<div class="stack-xs">${map(parts, p => html`
        <div class="stack-xs">
          <div class="row between"><span class="small">${p[0]}</span>
            <span class="tiny dim num">${Math.round(p[1] * 100)}%</span></div>
          ${K.Bar({ value:p[1] * 100, tone:p[1] > 0.66 ? 'danger' : p[1] > 0.33 ? 'warn' : '' })}
        </div>`)}</div>`,
    });
  }

  async function render(){
    const { subject, topic } = ctx();
    if(!subject || !topic){
      return String(K.Card({ body:K.Empty({ icon:'book', text:'Konu seçilmedi.',
        action:K.Button({ label:'Derslere git', tone:'primary', act:'go', data:{ 'data-route':'subjects' } }) }) }));
    }
    const st = M.topicState(subject.id, topic.id);
    const risk = C.topicRisk(subject.id, topic.id);

    return String(K.Grid([
      K.Span(12, K.Row([
        K.Button({ label:'Dersler', icon:'left', size:'sm', tone:'ghost', act:'go', data:{ 'data-route':'subjects' } }),
        K.Row([
          K.Button({ label:'Ders ekle', icon:'plus', size:'sm', act:'topic-add-note' }),
          K.Button({ label:'Kart ekle', icon:'cards', size:'sm', act:'topic-add-card' }),
        ], { wrap:true }),
      ], { between:true, wrap:true })),

      K.Span(7, K.Stack([
        headerCard(subject, topic, st, risk),
        measureCard(subject, topic, st),
        practiceCard(subject, topic),
        notesCard(subject, topic),
      ])),

      K.Span(5, K.Stack([
        riskCard(risk),
        cardsCard(subject, topic),
        errorsCard(subject, topic),
        raw(UI.rail(['closure', 'second-check', 'risk', 'recall'])),
      ])),
    ]));
  }

  const handle = {
    async 'topic-edit'(){
      const { subject, topic } = ctx();
      if(subject && topic) R.Screens.subjects.handle['open-topic']({ dataset:{ subject:subject.id, topic:topic.id } });
    },
    async 'topic-quiz'(){
      const { subject, topic } = ctx();
      if(!subject || !topic) return;
      S.ui.quizMode = 'topic';
      S.ui.quizSubject = subject.id;
      S.ui.quizTopic = topic.id;
      R.App.go('quiz');
    },
    async 'topic-add-note'(){
      const { subject, topic } = ctx();
      S.ui.noteOpen = null;
      R.App.go('learn');
      setTimeout(() => R.Screens.learn.handle['note-new']({ dataset:{
        subject:subject ? subject.id : '', topic:topic ? topic.id : '' } }), 80);
    },
    async 'topic-add-card'(){
      R.App.go('cards');
      setTimeout(() => R.Screens.cards.handle['new-card']({ dataset:{} }), 80);
    },
  };

  return {
    id:'topic',
    title:'Konu',
    subtitle(){
      const { subject, topic } = ctx();
      return topic ? subject.name + ' · ' + topic.name : 'Konu özeti';
    },
    actions(){ return ''; },
    render, handle,
  };
})();

/* ==== js/screens/plan.js ==== */
/* Program — tum programin zaman cizgisi ve yogunluk haritasi.

   Yazim bicimi: STIL.md. Ekran string birlestirme kullanmaz. */

window.R = window.R || {};
R.Screens = R.Screens || {};

R.Screens.plan = (function(){
  const U = R.U, M = R.Model, C = R.Calc, UI = R.UI, S = R.S;
  const { html, raw, when, map } = R.h;
  const K = R.C;

  function WeekRow(n){
    const c = M.curriculumFor(n);
    const cur = M.currentWeek();
    const week = S.weeks[M.weekId(n)];
    const isCurrent = n === cur;
    const isPast = n < cur;
    const comp = (isPast || isCurrent) ? C.planCompletion(n) : null;

    return html`
      <div class="${['tlweek', isCurrent && 'is-current', isPast && 'is-past'].filter(Boolean).join(' ')}"
           data-act="open-week" data-n="${n}">
        <div><div class="tlweek__no">H${n}</div>
          <div class="tlweek__dates">${U.fmtRange(M.weekStart(n), M.weekEnd(n))}</div></div>
        <div class="minw0">
          <div class="row-sm wrap"><b class="small">${c.title}</b>
            ${when(isCurrent, () => K.Badge({ label:'şimdi', tone:'ok' }))}
