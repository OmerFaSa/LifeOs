/* ==== js/core/utils.js ==== */
/* Tarih, sayi ve metin yardimcilari. */

window.SP = window.SP || {};

SP.U = (function(){
  const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];
  const MONTHS_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
  const DAY_MS = 86400000;

  function pad2(n){ return String(n).padStart(2,'0'); }

  function iso(d){ return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }

  function parse(s){
    if(s instanceof Date) return s;
    const parts = String(s).slice(0,10).split('-').map(Number);
    return new Date(parts[0], parts[1]-1, parts[2]);
  }

  function today(){
    const n = new Date();
    return new Date(n.getFullYear(), n.getMonth(), n.getDate());
  }

  function todayISO(){ return iso(today()); }

  function addDays(d, n){
    const r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate()+n);
    return r;
  }

  function diffDays(a, b){
    return Math.round((parse(b) - parse(a)) / DAY_MS);
  }

  /* 0 = Pazartesi ... 6 = Pazar */
  function weekdayIndex(d){ return (parse(d).getDay()+6)%7; }

  function fmtDate(d){
    const x = parse(d);
    return x.getDate()+' '+MONTHS[x.getMonth()]+' '+x.getFullYear();
  }
  function fmtShort(d){
    const x = parse(d);
    return x.getDate()+' '+MONTHS_SHORT[x.getMonth()];
  }
  function fmtRange(a, b){
    const x = parse(a), y = parse(b);
    if(x.getMonth() === y.getMonth()) return x.getDate()+'–'+y.getDate()+' '+MONTHS_SHORT[y.getMonth()];
    return fmtShort(x)+' – '+fmtShort(y);
  }
  function monthName(d){ return MONTHS[parse(d).getMonth()]; }
  function monthKey(d){ const x = parse(d); return x.getFullYear()+'-'+pad2(x.getMonth()+1); }

  function relativeDay(dateISO){
    const n = diffDays(todayISO(), dateISO);
    if(n === 0) return 'bugün';
    if(n === 1) return 'yarın';
    if(n === -1) return 'dün';
    if(n < 0) return Math.abs(n)+' gün gecikmiş';
    return n+' gün sonra';
  }

  /* --- sayi --- */
  function median(arr){
    const s = arr.filter(v => typeof v === 'number' && !isNaN(v)).sort((a,b)=>a-b);
    if(!s.length) return null;
    const m = Math.floor(s.length/2);
    return s.length % 2 ? s[m] : (s[m-1]+s[m])/2;
  }
  function round(x, digits){
    if(!isFinite(x)) return 0;
    const f = Math.pow(10, digits==null?1:digits);
    return Math.round(x*f)/f;
  }
  function clamp(x, lo, hi){ return Math.max(lo, Math.min(hi, x)); }
  function sum(arr){ return arr.reduce((a,b)=>a+(Number(b)||0), 0); }
  function pct(part, whole){
    if(!whole || !isFinite(whole) || !isFinite(part)) return 0;
    return round(100*part/whole, 0);
  }

  function fmtNet(x){
    if(x == null || (typeof x === 'number' && !isFinite(x))) return '—';
    return (Math.round(x*100)/100).toLocaleString('tr-TR', {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  function fmtNum(x){
    if(x == null || (typeof x === 'number' && !isFinite(x))) return '—';
    return Number(x).toLocaleString('tr-TR');
  }
  function fmtMin(mins){
    if(mins == null) return '—';
    const h = Math.floor(mins/60), m = Math.round(mins%60);
    if(h && m) return h+' sa '+m+' dk';
    if(h) return h+' sa';
    return m+' dk';
  }
  function fmtClock(seconds){
    const m = Math.floor(seconds/60), s = Math.floor(seconds%60);
    return pad2(m)+':'+pad2(s);
  }

  /* --- metin --- */
  function esc(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function uid(prefix){
    return (prefix||'id') + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function slug(s){
    return String(s).toLowerCase()
      .replace(/[ığüşöç]/g, c => ({'ı':'i','ğ':'g','ü':'u','ş':'s','ö':'o','ç':'c'}[c]))
      .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
  }
  function plural(n, one, many){ return n+' '+(n===1?one:many); }

  /* Arama normalizasyonu: "ogrenme" ile "öğrenme" eslesir.
     Once Turkce harfler sadelestirilir — "İ".toLowerCase() birlesik nokta
     uretir, bu yuzden kucultme sonra yapilir. */
  const COMBINING = /[\u0300-\u036f]/g;   // birlesik aksan isaretleri
  function norm(s){
    return String(s == null ? '' : s)
      .replace(/[ıİI]/g,'i').replace(/[şŞ]/g,'s').replace(/[ğĞ]/g,'g')
      .replace(/[üÜ]/g,'u').replace(/[öÖ]/g,'o').replace(/[çÇ]/g,'c')
      .toLowerCase()
      .replace(COMBINING, '');   // artakalan birlesik isaretler
  }

  function debounce(fn, wait){
    let t;
    return function(){
      const args = arguments, ctx = this;
      clearTimeout(t);
      t = setTimeout(()=>fn.apply(ctx, args), wait||250);
    };
  }

  /* Son n gunun ISO tarihleri, ESKIDEN YENIYE. Bir pencereyi gezerken
     sirali olmasi onemli: ilk yarisi gecen hafta, ikinci yarisi bu hafta
     gibi karsilastirmalar bu siraya dayanir. */
  function lastDays(n, endISO){
    const end = parse(endISO || todayISO());
    const out = [];
    for(let i = n - 1; i >= 0; i--) out.push(iso(addDays(end, -i)));
    return out;
  }

  return {
    MONTHS, MONTHS_SHORT, DAY_MS,
    pad2, iso, parse, today, todayISO, addDays, diffDays, weekdayIndex, lastDays,
    fmtDate, fmtShort, fmtRange, monthName, monthKey, relativeDay,
    median, round, clamp, sum, pct, fmtNet, fmtNum, fmtMin, fmtClock,
    esc, uid, slug, plural, norm, debounce,
  };
})();

/* ==== js/core/h.js ==== */
/* Sablon katmani.

   html`` etiketli sablonu: araya giren her deger varsayilan olarak KAÇIRILIR.
   Yapisal HTML raw() ile isaretlenir; ic ice html`` cagrilari zaten raw doner.

     h.html`<p>${kullaniciMetni}</p>`            → kacirilir
     h.html`<div>${h.raw(baskaHtml)}</div>`      → oldugu gibi
     h.html`${liste.map(x => h.html`<li>${x}</li>`)}`  → dizi otomatik birlesir

   Kural: kullanici verisi ve metin daima kaçırılır, yapısal HTML raw. */

window.SP = window.SP || {};

SP.h = (function(){
  const esc = s => String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));

  function Raw(s){ this.s = s; }
  Raw.prototype.toString = function(){ return this.s; };

  function raw(s){ return s instanceof Raw ? s : new Raw(s == null ? '' : String(s)); }
  function isRaw(v){ return v instanceof Raw; }

  /* Bir degeri HTML metnine cevirir. */
  function val(v){
    if(v == null || v === false || v === true) return '';
    if(v instanceof Raw) return v.s;
    if(Array.isArray(v)) return v.map(val).join('');
    if(typeof v === 'number') return String(v);
    return esc(v);
  }

  function html(strings, ...vals){
    let out = strings[0];
    for(let i = 0; i < vals.length; i++) out += val(vals[i]) + strings[i+1];
    return new Raw(out);
  }

  /* Kosullu parca: yanlissa hicbir sey uretmez. */
  function when(cond, node){
    if(!cond) return raw('');
    return raw(val(typeof node === 'function' ? node() : node));
  }

  /* Sinif adlarini birlestirir: cls('card', aktif && 'is-active') */
  function cls(){
    return Array.prototype.slice.call(arguments).filter(Boolean).join(' ');
  }

  /* Nitelik sozlugu: attrs({ 'data-act':'go', disabled:true, title:null }) */
  function attrs(map){
    const out = [];
    Object.keys(map || {}).forEach(k => {
      const v = map[k];
      if(v == null || v === false) return;
      if(v === true) out.push(k);
      else out.push(k + '="' + esc(v) + '"');
    });
    return raw(out.join(' '));
  }

  /* Liste: map(dizi, fn) — bos dizide bos doner */
  function map(list, fn){
    return raw((list || []).map((item, i) => val(fn(item, i))).join(''));
  }

  return { html, raw, isRaw, val, when, cls, attrs, map, esc };
})();

/* ==== js/core/store.js ==== */
/* Kalici depolama.
   Once Artifact "db" yetenegi denenir (cihazlar arasi), yoksa localStorage'a duser.
   Her iki durumda da yerel kopya tutulur; boylece cevrimdisi calisir.
   Hatalar yutulmaz: onError kancasi uzerinden arayuze bildirilir. */

window.SP = window.SP || {};

SP.SCHEMA_VERSION = 1;

SP.Store = (function(){
  /* Hane halki: her profil kendi anahtarinda durur. Tahlil ve olcum verisi
     profiller arasinda karismaz; 'ben' varsayilan birincil profildir. */
  function activeProfile(){
    try{ return localStorage.getItem('spi.activeProfile') || 'ben'; }
    catch(e){ return 'ben'; }
  }
  const PROFILE = activeProfile();
  const LOCAL_KEY = 'spi.v1.' + PROFILE;
  let db = null;
  let mode = 'local';

  const health = {
    cloud:'off',        // 'off' | 'ok' | 'error'
    local:'ok',         // 'ok' | 'error'
    lastError:null,     // { scope, code, message, at }
    pendingCloudWrites:0,
  };

  let onError = null;   // app.js tarafindan baglanir

  function report(scope, err, userMessage){
    const code = (err && err.code) || (err && err.name) || 'unknown';
    health.lastError = {
      scope, code,
      message: userMessage || (err && err.message) || String(err),
      at: new Date().toISOString(),
    };
    console.error('[Store:'+scope+']', err);
    if(typeof onError === 'function'){
      try{ onError(health.lastError, health); }catch(e){}
    }
  }

  function isQuotaError(e){
    if(!e) return false;
    return e.name === 'QuotaExceededError'
      || e.name === 'NS_ERROR_DOM_QUOTA_REACHED'
      || e.code === 22 || e.code === 1014
      || /quota|storage.*full/i.test(e.message || '');
  }

  function localAll(){
    try{ return JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'); }
    catch(e){
      report('local-read', e, 'Yerel kayıt okunamadı; veriler geçici olarak bellekte tutuluyor.');
      health.local = 'error';
      return {};
    }
  }
  function localWrite(all){
    try{
      localStorage.setItem(LOCAL_KEY, JSON.stringify(all));
      if(health.local === 'error'){ health.local = 'ok'; }
      return true;
    }catch(e){
      health.local = 'error';
      report('local-write', e, isQuotaError(e)
        ? 'Tarayıcı depolama alanı doldu. Ayarlar → Rehber → Veri bölümünden yedek alıp eski kayıtları temizle.'
        : 'Değişiklik bu cihaza kaydedilemedi.');
      return false;
    }
  }

  function lGet(path){
    const all = localAll();
    return all[path] === undefined ? null : all[path];
  }
  function lSet(path, data){
    const all = localAll();
    all[path] = data;
    return localWrite(all);
  }
  function lDel(path){
    const all = localAll();
    delete all[path];
    localWrite(all);
  }
  function lList(prefix){
    const all = localAll();
    const p = prefix.endsWith('/') ? prefix : prefix + '/';
    const out = [];
    Object.keys(all).forEach(k => {
      if(k.indexOf(p) === 0){
        const rest = k.slice(p.length);
        if(rest && rest.indexOf('/') === -1) out.push(Object.assign({ id:rest }, all[k]));
      }
    });
    return out;
  }

  async function init(){
    try{
      if(window.claude && typeof window.claude.use === 'function'){
        const api = await window.claude.use('db');
        if(api){ db = api; mode = 'cloud'; health.cloud = 'ok'; }
      }
    }catch(e){
      db = null;
      health.cloud = 'error';
      report('cloud-init', e, 'Hesaba bağlı senkronizasyon açılamadı; uygulama bu cihazda çalışmaya devam ediyor.');
    }
    return mode;
  }

  async function get(path){
    if(db){
      try{
        const snap = await db.doc(path).get();
        health.cloud = 'ok';
        if(snap.exists){
          const data = snap.data();
          lSet(path, data);
          return data;
        }
        return lGet(path);
      }catch(e){
        health.cloud = 'error';
        report('cloud-read', e, 'Buluttan okunamadı; bu cihazdaki kopya kullanılıyor.');
        return lGet(path);
      }
    }
    return lGet(path);
  }

  async function set(path, data){
    const localOk = lSet(path, data);
    if(db){
      health.pendingCloudWrites++;
      try{
        await db.doc(path).set(data);
        health.cloud = 'ok';
      }catch(e){
        health.cloud = 'error';
        report('cloud-write', e, localOk
          ? 'Değişiklik bu cihaza kaydedildi ama buluta gönderilemedi. Bağlantı gelince tekrar dene.'
          : 'Değişiklik kaydedilemedi.');
      }finally{
        health.pendingCloudWrites--;
      }
    }
    return localOk;
  }

  async function remove(path){
    lDel(path);
    if(db){
      try{ await db.doc(path).delete(); }
      catch(e){
        health.cloud = 'error';
        report('cloud-delete', e, 'Kayıt buluttan silinemedi.');
      }
    }
  }

  async function list(collection){
    if(db){
      try{
        const snap = await db.collection(collection).get();
        health.cloud = 'ok';
        const rows = snap.docs.map(d => Object.assign({ id:d.id }, d.data()));
        rows.forEach(r => lSet(collection+'/'+r.id, r));
        if(rows.length) return rows;
        return lList(collection);
      }catch(e){
        health.cloud = 'error';
        report('cloud-list', e, 'Bulut verisi okunamadı; bu cihazdaki kopya kullanılıyor.');
        return lList(collection);
      }
    }
    return lList(collection);
  }

  /* ---------- yedekleme ---------- */

  function exportAll(){
    return {
      __meta:{
        app:'spi-saglik',
        schemaVersion:SP.SCHEMA_VERSION,
        exportedAt:new Date().toISOString(),
        mode,
      },
      data:localAll(),
    };
  }

  /* Hem yeni ({__meta,data}) hem eski (duz sozluk) bicimi kabul eder. */
  function readBackup(obj){
    if(!obj || typeof obj !== 'object') return { ok:false, error:'Dosya okunamadı.' };
    if(obj.__meta && obj.data){
      if(obj.__meta.schemaVersion > SP.SCHEMA_VERSION){
        return { ok:false, error:'Bu yedek daha yeni bir sürümle alınmış (şema '+obj.__meta.schemaVersion+'). Önce uygulamayı güncelle.' };
      }
      return { ok:true, data:obj.data, meta:obj.__meta };
    }
    const keys = Object.keys(obj);
    const looksLegacy = keys.some(k => k.indexOf('/') > 0);
    if(!looksLegacy) return { ok:false, error:'Bu dosya bir SPİ yedeği değil.' };
    return { ok:true, data:obj, meta:{ schemaVersion:1, legacy:true } };
  }

  async function importAll(obj){
    const parsed = readBackup(obj);
    if(!parsed.ok) throw new Error(parsed.error);
    localWrite(parsed.data);
    if(db){
      for(const k of Object.keys(parsed.data)){
        try{ await db.doc(k).set(parsed.data[k]); }
        catch(e){ health.cloud = 'error'; }
      }
    }
    return parsed.meta;
  }

  async function clear(){
    const all = localAll();
    try{ localStorage.removeItem(LOCAL_KEY); }catch(e){}
    if(db){
      for(const k of Object.keys(all)){
        try{ await db.doc(k).delete(); }catch(e){}
      }
    }
  }

  /* Kabaca kullanilan yerel alan (byte) */
  function localSize(){
    try{ return (localStorage.getItem(LOCAL_KEY) || '').length; }
    catch(e){ return 0; }
  }

  /* Tarayicilarin localStorage siniri genelde ~5 MB'tir (kaynak basina).
     Kesin deger okunamaz; bu yuzden 5 MB varsayilip doluluk yuzdesi tahmin edilir.
     %75 uzerinde kullaniciyi uyarmak icin `near` isaretlenir. */
  const LOCAL_QUOTA = 5 * 1024 * 1024;
  function localQuota(){
    const bytes = localSize();
    const pct = Math.min(100, Math.round(100*bytes/LOCAL_QUOTA));
    return { bytes, limit:LOCAL_QUOTA, pct, near:pct >= 75, full:pct >= 92 };
  }

  return {
    init, get, set, remove, list,
    exportAll, importAll, readBackup, clear, localSize, localQuota,
    health(){ return Object.assign({ mode }, health); },
    set onError(fn){ onError = fn; },
    get mode(){ return mode; },
  };
})();

   SP.S calisma anindaki durumu tutar; SP.Model onu depoyla (core/store.js)
   konusturur. Ekranlar SP.S'yi okur, degisikligi daima SP.Model uzerinden
   yazar — hicbir ekran dogrudan depoya dokunmaz.

   Depolama yollari:
     profile            aktif profilin kimligi ve hedefleri
     prefs              tercihler (tema, palet, ofis ayarlari)
     labs/<id>          bir tahlil oturumu (tek tarihte gelen degerler)
     vitals/<YYYY-MM-DD> gunluk vital ve vucut olcumleri

     workouts/<id>      bir antrenman kaydi
     progress           hareket merdivenlerindeki mevcut basamaklar
     basket             haftalik sepet
     prices             kullanicinin girdigi fiyatlar
     flags              acik ve gecmis kirmizi bayraklar
     decisions/<id>     ofiste alinan kararlar
     meta               yedek zamani ve sema surumu

   Hane profil listesi profile OZEL DEGILDIR: cihaz genelinde tek yerde,
   ayri bir localStorage anahtarinda durur (bkz. householdList). */

window.SP = window.SP || {};

SP.S = {
  route:'today',
  ready:false,
  sidebarOpen:false,

  profile:null,       // aktif profil
  profiles:[],        // hanedeki butun profiller (ozet)
  prefs:null,

  labs:[],            // tahlil oturumlari, tarihe gore artan
  vitals:{},          // YYYY-MM-DD -> gunluk olcum kaydi
  meals:{},           // YYYY-MM-DD -> ogun dizisi
  workouts:[],        // antrenman kayitlari
  progress:{},        // exId -> { levelId, achievedAt }

  basket:null,        // { items, weeklyLimit, monthlyLimit, testFee, equipment, updatedAt }
  prices:{},          // foodId -> { tl, at, source }

  flags:[],           // kirmizi bayrak kayitlari
  decisions:[],       // ofis kararlari

  office:null,        // ofis ayarlari (saglayici, model, ajan basina secim)

  officeBriefings:{}, // YYYY-MM-DD -> gunluk brifing
  journal:{},         // agentId -> dogrulanmis gozlemler

  meta:null,

  ui:{

    labTab:'sonuc',        // sonuc | giris | gecmis | trend
    labPanel:'vital',      // acik panel id'si
    labQuery:'',           // sonuc ve giris listesindeki arama

    labShowEmpty:false,    // olculmemis satirlar gorunsun mu
    labOpen:null,          // acik tahlil oturumu
    markerOpen:null,       // acik biyobelirtec ayrintisi
    mealDate:null,         // gorunen gun (null = bugun)
    mealTab:'gunluk',      // gunluk | oneri | deger
    mealSlot:'kahvalti',

    foodPage:1,
    kitchenDish:null,      // mutfakta paylastirilan yemek

    moveTab:'bugun',       // bugun | kardiyo | kuvvet | esneklik | dinlenme | ilerleme
    movePattern:'all',     // kuvvet alanindaki kalip seridinde secili olan
    workoutOpen:null,
    basketTab:'butce',     // butce | sepet | ikame | fiyat
    priceEdit:null,
    trendMarker:'weight',

    analyticsTab:'capraz',
    officeAgent:'patron',
    officeDesk:null,

    meetingAgenda:0,
    meetingOpen:null,
    guideTab:'kullanim',
    profileOpen:null,
    quickOpen:false,
  },
};

SP.Model = (function(){
  const U = SP.U;

  /* ------------------------------------------------------------ yardimcilar */

  /* Bos nesne ve diziler depolama katmanindan geri gelmeyebilir; okunan her
     belge kullanilmadan once eksik kaplari tamamlanir. */
  function normLab(doc){
    if(!doc) return doc;
    doc.values = doc.values || {};
    doc.source = doc.source || 'manual';
    Object.keys(doc.values).forEach(k => {
      const cell = doc.values[k];
      if(typeof cell === 'number') doc.values[k] = { v:cell, cert:'measured' };
      else if(cell && cell.cert == null) cell.cert = 'measured';
    });
    return doc;
  }

  function normDayMeals(rows){
    if(!Array.isArray(rows)) return [];
    rows.forEach(m => {
      m.items = Array.isArray(m.items) ? m.items : [];
      m.items.forEach(it => { if(it.cert == null) it.cert = 'estimated'; });
    });
    return rows;
  }

  function normWorkout(doc){
    if(!doc) return doc;
    doc.items = Array.isArray(doc.items) ? doc.items : [];
    if(doc.minutes == null) doc.minutes = 0;
    return doc;
  }

  /* ------------------------------------------------------------------ profil */

  function defaultProfile(){
    return {
      id:activeProfileId(),
      name:'',
      role:'self',            // self | family
      birthYear:null,
      sex:'male',             // male | female
      heightCm:null,
      weightKg:null,
      activity:'moderate',
      goal:'health',
      conditions:[],          // kullanicinin bildirdigi durumlar (serbest metin)
      theme:'system',
      palette:SP.DEFAULT_PALETTE,
      design:SP.DEFAULT_DESIGN,
      createdAt:new Date().toISOString(),
    };
  }

  function ageOf(p){
    const prof = p || SP.S.profile;
    if(!prof || !prof.birthYear) return null;
    return new Date().getFullYear() - Number(prof.birthYear);
  }

  async function saveProfile(patch){
    SP.S.profile = Object.assign({}, SP.S.profile, patch || {});
    await SP.Store.set('profile', SP.S.profile);
    await touchHousehold();
    return SP.S.profile;
  }

  function defaultPrefs(){
    return {
      weeklyBudget:null,       // TL — kullanici koyar
      householdSize:1,
      units:'metric',
      showEstimates:true,
      autoBriefing:true,
    };
  }

  async function savePrefs(patch){
    SP.S.prefs = Object.assign({}, SP.S.prefs, patch || {});
    await SP.Store.set('prefs', SP.S.prefs);
    return SP.S.prefs;
  }

  /* ---------------------------------------------------------------- hane

     Profil listesi cihaz genelindedir: her profil kendi depo anahtarinda
     yasar ama "bu cihazda kimler var" bilgisi ortaktir. Bu yuzden liste
     SP.Store'da degil, ayri bir localStorage anahtarinda durur. */

  const HOUSE_KEY = 'spi.household';
  const ACTIVE_KEY = 'spi.activeProfile';

  function householdList(){
    try{ return JSON.parse(localStorage.getItem(HOUSE_KEY) || '[]'); }
    catch(e){ return []; }
  }
  function writeHousehold(list){
    try{ localStorage.setItem(HOUSE_KEY, JSON.stringify(list)); return true; }
    catch(e){ return false; }
  }
  function activeProfileId(){
    try{ return localStorage.getItem(ACTIVE_KEY) || 'ben'; }
    catch(e){ return 'ben'; }
  }

  /* Aktif profilin ozetini hane listesine yazar; profil secicide ad ve
     rol gorunur ama ham saglik verisi listeye hic girmez. */
  async function touchHousehold(){
    const p = SP.S.profile;
    if(!p) return;
    const list = householdList();
    const row = { id:p.id, name:p.name || 'Adsız', role:p.role || 'family', sex:p.sex,
      birthYear:p.birthYear, seenAt:new Date().toISOString() };
    const i = list.findIndex(x => x.id === row.id);
    if(i >= 0) list[i] = Object.assign(list[i], row); else list.push(row);
    writeHousehold(list);
    SP.S.profiles = list;
  }

  function addHouseholdMember(name, opts){
    const o = opts || {};
    const id = U.slug(name) || U.uid('p');
    const list = householdList();
    if(list.some(x => x.id === id)) return { ok:false, error:'Bu adla bir profil zaten var.' };
    list.push({ id, name, role:o.role || 'family', sex:o.sex || 'female',
      birthYear:o.birthYear || null, seenAt:null });
    writeHousehold(list);
    SP.S.profiles = list;
    return { ok:true, id };
  }

  function removeHouseholdMember(id){
    if(id === activeProfileId()) return { ok:false, error:'Açık olan profil silinemez.' };
    const list = householdList().filter(x => x.id !== id);
    writeHousehold(list);
    SP.S.profiles = list;
    /* Profilin kendi verisi kendi anahtarinda kalir; listeden dusmek
       veriyi silmez. Silmek acikca istenmelidir. */
    return { ok:true };
  }

  function switchProfile(id){
    try{ localStorage.setItem(ACTIVE_KEY, id); }catch(e){}
    location.reload();
  }

  /* ------------------------------------------------------------- tahliller */

  function newLab(dateISO){
    return { id:U.uid('lab'), date:dateISO || U.todayISO(), source:'manual',
      lab:'', values:{}, note:'', createdAt:new Date().toISOString() };
  }

  /* Turetilmis olcumleri hesaplayip oturuma yazar. Girdi eksikse olcum
     hic yazilmaz — tahmin uretilmez. */
  function applyDerived(rec){
    Object.keys(SP.DERIVED).forEach(id => {
      const def = SP.DERIVED[id];
      const vals = {};
      const ok = def.inputs.every(k => {
        const cell = rec.values[k];
        if(!cell || cell.v == null) return false;
        vals[k] = Number(cell.v);
        return true;
      });
      if(!ok){ delete rec.values[id]; return; }
      const out = def.calc(vals);
      if(out == null || !isFinite(out)){ delete rec.values[id]; return; }
      rec.values[id] = { v:U.round(out, 2), cert:'derived' };
    });
    return rec;
  }

  async function saveLab(rec){
    applyDerived(rec);
    rec.updatedAt = new Date().toISOString();
    const i = SP.S.labs.findIndex(l => l.id === rec.id);
    if(i >= 0) SP.S.labs[i] = rec; else SP.S.labs.push(rec);
    SP.S.labs.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    await SP.Store.set('labs/' + rec.id, rec);
    await refreshFlags();
    return rec;
  }

  async function deleteLab(id){
    SP.S.labs = SP.S.labs.filter(l => l.id !== id);
    await SP.Store.remove('labs/' + id);
    await refreshFlags();
  }

  /* Bir biyobelirtecin butun gecmisi — tarihe gore artan.
     Vital olcumler gunluk kayittan, laboratuvar degerleri tahlil
     oturumlarindan gelir; ikisi tek seride birlesir. */
  function seriesOf(markerId){
    const out = [];
    SP.S.labs.forEach(l => {
      const cell = l.values[markerId];
      if(cell && cell.v != null) out.push({ date:l.date, v:Number(cell.v), cert:cell.cert, src:'lab', id:l.id });
    });
    Object.keys(SP.S.vitals).forEach(d => {
      const v = SP.S.vitals[d];
      if(v && v[markerId] != null) out.push({ date:d, v:Number(v[markerId]), cert:'measured', src:'vital' });
    });
    out.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    return out;
  }

  function latestOf(markerId){
    const s = seriesOf(markerId);
    return s.length ? s[s.length - 1] : null;
  }

  /* Butun belirteclerin son degeri — kirmizi bayrak ve ofis brifingi icin. */
  function latestAll(){
    const out = {};
    SP.BIOMARKERS.forEach(b => {
      const l = latestOf(b.id);
      if(l) out[b.id] = l.v;
    });
    return out;
  }

  /* ------------------------------------------------------- gunluk olcumler */

  function defaultVitals(dateISO){
    return { date:dateISO, sbp:null, dbp:null, rhr:null, hrv:null, spo2:null, temp:null,
      sleep:null, weight:null, waist:null, bodyfat:null, soreness:null, water:0, note:'' };
  }

  function vitalsOf(dateISO){
    return SP.S.vitals[dateISO] || null;
  }

  function ensureVitals(dateISO){
    if(!SP.S.vitals[dateISO]) SP.S.vitals[dateISO] = defaultVitals(dateISO);
    return SP.S.vitals[dateISO];
  }

  async function saveVitals(dateISO, patch){
    const rec = Object.assign(ensureVitals(dateISO), patch || {});
    SP.S.vitals[dateISO] = rec;
    await SP.Store.set('vitals/' + dateISO, rec);
    await refreshFlags();
    return rec;
  }

  /* ------------------------------------------------------------------ ogun */

  function mealsOf(dateISO){
    return SP.S.meals[dateISO] || [];
  }

  function newMeal(slot){
    return { id:U.uid('m'), slot:slot || 'kahvalti', items:[], note:'',
      at:new Date().toISOString() };
  }

  async function saveMeals(dateISO, rows){
    SP.S.meals[dateISO] = normDayMeals(rows);
    await SP.Store.set('meals/' + dateISO, { date:dateISO, rows:SP.S.meals[dateISO] });
    return SP.S.meals[dateISO];
  }

  async function addMeal(dateISO, meal){
    const rows = mealsOf(dateISO).slice();
    rows.push(meal);
    return saveMeals(dateISO, rows);
  }

  async function deleteMeal(dateISO, id){
    return saveMeals(dateISO, mealsOf(dateISO).filter(m => m.id !== id));
  }

  /* ------------------------------------------------------------- antrenman */

  function newWorkout(dateISO, templateId){
    const tpl = SP.SESSION_TEMPLATES.find(t => t.id === templateId);
    return {
      id:U.uid('w'), date:dateISO || U.todayISO(),
      templateId:templateId || null,
      name:tpl ? tpl.name : 'Serbest antrenman',
      kind:tpl ? tpl.kind : 'strength',
      items:tpl ? tpl.items.map(exId => ({ exId, levelId:currentLevel(exId), sets:3, reps:null, minutes:null })) : [],
      minutes:tpl ? tpl.minutes : 40,
      rpe:null,
      note:'',
      createdAt:new Date().toISOString(),
    };
  }

  async function saveWorkout(rec){
    normWorkout(rec);
    const i = SP.S.workouts.findIndex(w => w.id === rec.id);
    if(i >= 0) SP.S.workouts[i] = rec; else SP.S.workouts.push(rec);
    SP.S.workouts.sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
    await SP.Store.set('workouts/' + rec.id, rec);
    return rec;
  }

  async function deleteWorkout(id){
    SP.S.workouts = SP.S.workouts.filter(w => w.id !== id);
    await SP.Store.remove('workouts/' + id);
  }

  function workoutsOf(dateISO){
    return SP.S.workouts.filter(w => w.date === dateISO);
  }

  /* --------------------------------------------------- ilerleme merdiveni */

  function currentLevel(exId){
    const ex = SP.EX_BY_ID[exId];
    if(!ex) return null;
    const rec = SP.S.progress[exId];
    return (rec && rec.levelId) || ex.levels[0].id;
  }

  function levelIndex(exId){
    const ex = SP.EX_BY_ID[exId];
    if(!ex) return 0;
    const id = currentLevel(exId);
    const i = ex.levels.findIndex(l => l.id === id);
    return i < 0 ? 0 : i;
  }

  /* Bir ust basamak yalnizca mevcut basamagin hedefi tutturuldugunda acilir.
     Sistem basamak atlatmaz; asiri yuklenmenin en yaygin sebebi budur. */
  async function advanceLevel(exId){
    const ex = SP.EX_BY_ID[exId];
    if(!ex) return { ok:false, error:'Hareket bulunamadı.' };
    const i = levelIndex(exId);
    if(i >= ex.levels.length - 1) return { ok:false, error:'Bu merdivenin son basamağındasın.' };
    SP.S.progress[exId] = { levelId:ex.levels[i + 1].id, achievedAt:new Date().toISOString() };
    await SP.Store.set('progress', SP.S.progress);
    return { ok:true, level:ex.levels[i + 1] };
  }

  async function setLevel(exId, levelId){
    SP.S.progress[exId] = { levelId, achievedAt:new Date().toISOString() };
    await SP.Store.set('progress', SP.S.progress);
    return SP.S.progress[exId];
  }

  /* ------------------------------------------------------------------ sepet */

  function defaultBasket(){
    /* monthlyLimit, testFee ve equipment butce sayfasi icindir. Hepsi
       null/bos baslar: girilmemis bir sinir "sinir yok" demektir, sifir
       degil. */
    return { items:[], weeklyLimit:null, monthlyLimit:null, testFee:null,
      equipment:[], updatedAt:null };
  }

  async function saveBasket(patch){
    SP.S.basket = Object.assign(defaultBasket(), SP.S.basket, patch || {});
    SP.S.basket.updatedAt = new Date().toISOString();
    await SP.Store.set('basket', SP.S.basket);
    return SP.S.basket;
  }

  async function setBasketItem(foodId, kg){
    const items = (SP.S.basket.items || []).slice();
    const i = items.findIndex(x => x.foodId === foodId);
    if(kg <= 0){
      if(i >= 0) items.splice(i, 1);
    }else if(i >= 0){
      items[i] = { foodId, kg };
    }else{
      items.push({ foodId, kg });
    }
    return saveBasket({ items });
  }

  /* Kullanicinin girdigi fiyat seed tahminini ezer ve "olculdu" olur. */
  async function setPrice(foodId, tl){
    if(tl == null || !isFinite(tl) || tl <= 0){
      delete SP.S.prices[foodId];
    }else{
      SP.S.prices[foodId] = { tl:U.round(tl, 2), at:U.todayISO(), source:'user' };
    }
    await SP.Store.set('prices', SP.S.prices);
    return SP.S.prices[foodId] || null;
  }

  /* ---------------------------------------------------------- kirmizi bayrak

     Bayraklar hesaplanir, elle yazilmaz. Her kayit degisiminde yeniden
     uretilir: kosul gecerse bayrak acilir, gecmezse kapanir ama SILINMEZ —
     gecmiste durur, cunku "bir kez tetiklenmis olmak" da bir bulgudur. */

  function evaluateFlags(){
    const vals = latestAll();
    const out = [];

    /* tek olcumle tetiklenenler */
    SP.BIOMARKERS.forEach(b => {
      const v = vals[b.id];
      if(v == null || !b.red) return;
      if(b.red.below != null && v < b.red.below){
        out.push({ id:b.id + ':below', kind:'marker', marker:b.id,
          label:b.name + ' kritik düşük',
          detail:b.name + ' ' + U.fmtNum(v) + ' ' + b.unit + ' — sistemin yorum yaptığı eşiğin altında.' });
      }
      if(b.red.above != null && v > b.red.above){
        out.push({ id:b.id + ':above', kind:'marker', marker:b.id,
          label:b.name + ' kritik yüksek',
          detail:b.name + ' ' + U.fmtNum(v) + ' ' + b.unit + ' — sistemin yorum yaptığı eşiğin üstünde.' });
      }
    });

    /* birden fazla olcumun birlikte anlam kazandigi oruntuler */
    SP.RED_FLAGS.patterns.forEach(p => {
      const has = p.needs.every(k => vals[k] != null);
      if(!has) return;
      let hit = false;
      try{ hit = !!p.test(vals); }catch(e){ hit = false; }
      if(hit) out.push({ id:p.id, kind:'pattern', label:p.label, detail:p.detail, needs:p.needs });
    });

    return out;
  }

  async function refreshFlags(){
    const live = evaluateFlags();
    const now = new Date().toISOString();
    const prev = SP.S.flags || [];
    const byId = {};
    prev.forEach(f => { byId[f.id] = f; });

    live.forEach(f => {
      if(byId[f.id]){
        byId[f.id] = Object.assign(byId[f.id], f, { status:'open', lastSeenAt:now });
      }else{
        byId[f.id] = Object.assign({}, f, { status:'open', openedAt:now, lastSeenAt:now, ack:false });
      }
    });
    /* Artik gecerli olmayanlar kapanir ama kayitta kalir. */
    Object.keys(byId).forEach(id => {
      if(!live.some(f => f.id === id) && byId[id].status === 'open'){
        byId[id].status = 'closed';
        byId[id].closedAt = now;
      }
    });

    SP.S.flags = Object.keys(byId).map(k => byId[k]);
    await SP.Store.set('flags', SP.S.flags);
    return SP.S.flags;
  }

  function openFlags(){
    return (SP.S.flags || []).filter(f => f.status === 'open');
  }

  async function ackFlag(id){
    const f = (SP.S.flags || []).find(x => x.id === id);
    if(!f) return null;
    f.ack = true;
    f.ackAt = new Date().toISOString();
    await SP.Store.set('flags', SP.S.flags);
    return f;
  }

  /* ---------------------------------------------------------------- kararlar */

  async function saveDecision(rec){
    const row = Object.assign({ id:U.uid('d'), at:new Date().toISOString(),
      status:'open', owner:'patron' }, rec);
    const i = SP.S.decisions.findIndex(d => d.id === row.id);
    if(i >= 0) SP.S.decisions[i] = row; else SP.S.decisions.push(row);
    await SP.Store.set('decisions/' + row.id, row);
    return row;
  }

  async function closeDecision(id, outcome){
    const d = SP.S.decisions.find(x => x.id === id);
    if(!d) return null;
    d.status = 'closed';
    d.outcome = outcome || '';
    d.closedAt = new Date().toISOString();
    await SP.Store.set('decisions/' + d.id, d);
    return d;
  }

  function openDecisions(){
    return SP.S.decisions.filter(d => d.status === 'open');
  }

  /* ------------------------------------------------------------------ yedek */

  async function markBackup(){
    SP.S.meta = Object.assign({}, SP.S.meta, { lastBackupAt:new Date().toISOString() });
    await SP.Store.set('meta', SP.S.meta);
  }

  function backupAgeDays(){
    if(!SP.S.meta || !SP.S.meta.lastBackupAt) return null;
    return U.diffDays(SP.S.meta.lastBackupAt.slice(0, 10), U.todayISO());
  }

  function backupDue(){
    const age = backupAgeDays();
    return age == null || age >= 30;
  }

  function dataFootprint(){
    const q = SP.Store.localQuota();
    return {
      labs:SP.S.labs.length,
      vitalDays:Object.keys(SP.S.vitals).length,
      mealDays:Object.keys(SP.S.meals).length,
      workouts:SP.S.workouts.length,
      bytes:q.bytes, pct:q.pct, near:q.near, full:q.full,
    };
  }

  /* ------------------------------------------------------------------ acilis */

  function migrate(meta){
    const v = (meta && meta.schemaVersion) || 0;
    if(v === SP.SCHEMA_VERSION) return meta;
    return Object.assign({}, meta, { schemaVersion:SP.SCHEMA_VERSION });
  }

  async function loadAll(){
    const S = SP.S;
    await SP.Store.init();

    S.meta = migrate(await SP.Store.get('meta') || { schemaVersion:SP.SCHEMA_VERSION });
    await SP.Store.set('meta', S.meta);

    S.profile = (await SP.Store.get('profile')) || defaultProfile();
    S.profile.id = activeProfileId();
    S.prefs = Object.assign(defaultPrefs(), await SP.Store.get('prefs'));

    S.labs = ((await SP.Store.list('labs')) || []).map(normLab)
      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

    S.vitals = {};
    ((await SP.Store.list('vitals')) || []).forEach(row => {
      const d = row.date || row.id;
      S.vitals[d] = Object.assign(defaultVitals(d), row);
    });

    S.meals = {};
    ((await SP.Store.list('meals')) || []).forEach(row => {
      const d = row.date || row.id;
      S.meals[d] = normDayMeals(row.rows || []);
    });

    S.workouts = ((await SP.Store.list('workouts')) || []).map(normWorkout)
      .sort((a, b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

    S.progress = (await SP.Store.get('progress')) || {};
    S.basket = Object.assign(defaultBasket(), await SP.Store.get('basket'));
    S.prices = (await SP.Store.get('prices')) || {};
    S.flags = (await SP.Store.get('flags')) || [];
    S.decisions = ((await SP.Store.list('decisions')) || [])
      .sort((a, b) => (a.at || '') < (b.at || '') ? 1 : -1);

    await touchHousehold();
    await refreshFlags();

    S.ready = true;
    return S;
  }

  return {
    /* profil ve hane */
    defaultProfile, saveProfile, ageOf, defaultPrefs, savePrefs,
    householdList, addHouseholdMember, removeHouseholdMember, switchProfile, activeProfileId,
    /* tahlil */
    newLab, saveLab, deleteLab, applyDerived, seriesOf, latestOf, latestAll,
    /* gunluk olcum */
    defaultVitals, vitalsOf, ensureVitals, saveVitals,
    /* ogun */
    mealsOf, newMeal, saveMeals, addMeal, deleteMeal,
    /* antrenman */
    newWorkout, saveWorkout, deleteWorkout, workoutsOf,
    currentLevel, levelIndex, advanceLevel, setLevel,
    /* ekonomi */
    defaultBasket, saveBasket, setBasketItem, setPrice,
    /* bayrak ve karar */
    evaluateFlags, refreshFlags, openFlags, ackFlag,
    saveDecision, closeDecision, openDecisions,
    /* sistem */
    markBackup, backupAgeDays, backupDue, dataFootprint, migrate, loadAll,
  };
})();

/* ==== js/core/bio.js ==== */
/* Modul 1'in kural motoru — biyobelirtec durumu ve bireysel egilim.

   Burada model yoktur, yalnizca hesap vardir. Ajan Kerem bu dosyanin
   ciktisini cumleye cevirir; sayiyi degistiremez.

   Iki soru cevaplanir:

     1. Bu deger nerede duruyor?   statusOf()
        Referans araliginin disinda mi, hedef bandin disinda mi, kritik mi.

     2. Bu deger nereye gidiyor?   trendOf()
        Referans icinde kalan ama alti ayda kademeli dusen bir ferritin,
        araligin disina cikmis tek bir olcumden daha cok sey soyler.
        Bu, PDF'teki "tekil referans araliklari yerine bireysel trend"
        ilkesinin kod karsiligidir. */

window.SP = window.SP || {};

SP.Bio = (function(){
  const U = SP.U;

  /* ------------------------------------------------------------- referans */

  /* Cinsiyete ve yasa gore aralik cozumleme.
     { male:[...], female:[...] } bicimindeki alanlar profile gore secilir;
     duz dizi olanlar herkes icin aynidir. */
  function pick(field, profile){
    if(field == null) return null;
    if(Array.isArray(field)) return field;
    const p = profile || SP.S.profile || {};
    const sex = p.sex === 'female' ? 'female' : 'male';
    const age = SP.Model.ageOf(p);

    /* Yasa bagli varyantlar once denenir. */
    if(age != null && age >= 50 && field[sex + '50']) return field[sex + '50'];
    if(age != null && age >= 30 && field[sex === 'male' ? 'over30M' : 'over30F']) {
      return field[sex === 'male' ? 'over30M' : 'over30F'];
    }
    if(field[sex]) return field[sex];
    return null;
  }

  function refFor(markerId, profile){
    const b = SP.BIO_BY_ID[markerId];
    if(!b) return null;
    return {
      marker:b,
      ref:pick(b.ref, profile),
      optimal:pick(b.optimal, profile),
      red:b.red || {},
    };
  }

  /* ---------------------------------------------------------------- durum */

  const STATUS = {
    red:      { id:'red',      tone:'danger', label:'kritik' },
    low:      { id:'low',      tone:'warn',   label:'referans altı' },
    high:     { id:'high',     tone:'warn',   label:'referans üstü' },
    belowOpt: { id:'belowOpt', tone:'info',   label:'hedefin altı' },
    aboveOpt: { id:'aboveOpt', tone:'info',   label:'hedefin üstü' },
    ok:       { id:'ok',       tone:'ok',     label:'hedefte' },
    unknown:  { id:'unknown',  tone:'muted',  label:'veri yok' },
  };

  /* Bir degeri sinifa oturtur. Sira onemlidir: kritik esik her seyi yener,
     sonra referans araligi, en son hedef bant bakilir. */
  function statusOf(markerId, value, profile){
    const r = refFor(markerId, profile);
    if(!r) return STATUS.unknown;
    if(value == null || !isFinite(value)) return STATUS.unknown;
    const v = Number(value);

    if(r.red.below != null && v < r.red.below) return STATUS.red;
    if(r.red.above != null && v > r.red.above) return STATUS.red;

    if(r.ref){
      if(v < r.ref[0]) return STATUS.low;
      if(v > r.ref[1]) return STATUS.high;
    }
    if(r.optimal){
      if(v < r.optimal[0]) return STATUS.belowOpt;
      if(v > r.optimal[1]) return STATUS.aboveOpt;
    }
    return STATUS.ok;
  }

  /* Durumun kisa gerekcesi — ekranda rozetin yanina yazilir. */
  function statusNote(markerId, value, profile){
    const b = SP.BIO_BY_ID[markerId];
    const r = refFor(markerId, profile);
    const st = statusOf(markerId, value, profile);
    if(!b || !r) return '';
    const unit = b.unit ? ' ' + b.unit : '';
    switch(st.id){
      case 'red':
        return 'Sistemin yorum yaptığı eşiğin ötesinde. Bu bir teşhis değil, hekime yönlendirmedir.';
      case 'low':
        return 'Referans aralığının altında (' + U.fmtNum(r.ref[0]) + unit + ' beklenir).';
      case 'high':
        return 'Referans aralığının üstünde (' + U.fmtNum(r.ref[1]) + unit + ' beklenir).';
      case 'belowOpt':
        return 'Referans içinde ama hedef bandın altında. Uyarı değil, iyileştirme alanı.';
      case 'aboveOpt':
        return 'Referans içinde ama hedef bandın üstünde.';
      case 'ok':
        return r.optimal ? 'Hedef bandın içinde.' : 'Referans aralığının içinde.';
      default:
        return 'Bu ölçüm hiç girilmemiş. Sıfır sayılmaz.';
    }
  }

  /* ---------------------------------------------------------------- egilim

     En kucuk kareler ile egim hesaplanir. Egim gunluk degisimdir; okunabilir
     olmasi icin 90 gune olceklenir ve son degere gore yuzdeye cevrilir.

     En az uc olcum sarttir: iki nokta her zaman bir dogru cizer ve bu
     "egilim" degil yalnizca iki olcum arasindaki farktir. */
  const MIN_POINTS = 3;

  function trendOf(markerId, opts){
    const o = opts || {};
    const all = SP.Model.seriesOf(markerId);
    const days = o.days || 365;
    const cutoff = U.addDays(U.today(), -days);
    const pts = all.filter(p => U.parse(p.date) >= cutoff);

    if(pts.length < MIN_POINTS){
      return { ok:false, n:pts.length, dir:'flat',
        note:pts.length ? 'Eğilim için en az ' + MIN_POINTS + ' ölçüm gerekir; ' + pts.length + ' var.'
                        : 'Henüz ölçüm yok.' };
    }

    const t0 = U.parse(pts[0].date);
    const xs = pts.map(p => U.diffDays(U.iso(t0), p.date));
    const ys = pts.map(p => p.v);
    const n = xs.length;
    const mx = U.sum(xs) / n, my = U.sum(ys) / n;
    let num = 0, den = 0;
    for(let i = 0; i < n; i++){
      num += (xs[i] - mx) * (ys[i] - my);
      den += (xs[i] - mx) * (xs[i] - mx);
    }
    const slope = den === 0 ? 0 : num / den;          /* birim / gun */
    const per90 = slope * 90;
    const last = ys[n - 1];
    const pct = last ? U.round(100 * per90 / Math.abs(last), 1) : 0;

    /* Gurultuyu egilim sanmamak icin esik: 90 gunde son degerin %5'inden
       az degisim "yatay" sayilir. */
    const dir = Math.abs(pct) < 5 ? 'flat' : (per90 > 0 ? 'up' : 'down');

    return {
      ok:true, n, dir, slope, per90:U.round(per90, 2), pct,
      first:ys[0], last, from:pts[0].date, to:pts[n - 1].date,
      points:pts,
    };
  }

  /* Egilim iyi mi kotu mu? Bu karar `dir` alanindan degil, belirtecin
     hangi yonde iyi oldugundan (`b.dir`) ve degerin nerede durdugundan gelir.
     Ornek: LDL'nin dusmesi iyidir, HDL'nin dusmesi kotudur. */
  function trendVerdict(markerId, trend, profile){
    const b = SP.BIO_BY_ID[markerId];
    if(!b || !trend || !trend.ok) return { tone:'muted', label:'—', text:'' };
    if(trend.dir === 'flat') return { tone:'muted', label:'yatay', text:'Son ölçümlerde belirgin bir yön yok.' };

    const goodDir = b.dir === 'low' ? 'down' : b.dir === 'high' ? 'up' : null;
    const st = statusOf(markerId, trend.last, profile);
    const word = trend.dir === 'up' ? 'yükseliyor' : 'düşüyor';
    const amount = '90 günde %' + Math.abs(trend.pct);

    if(goodDir === null){
      /* Bandin ortasi iyi olan olcumler: hedefe yaklasiyorsa iyi, uzaklasiyorsa kotu. */
      const r = refFor(markerId, profile);
      const band = (r && r.optimal) || (r && r.ref);
      if(!band) return { tone:'info', label:word, text:'Ölçüm ' + word + ' (' + amount + ').' };
      const mid = (band[0] + band[1]) / 2;
      const closer = Math.abs(trend.last - mid) < Math.abs(trend.first - mid);
      return closer
        ? { tone:'ok', label:word, text:'Hedef bandın ortasına yaklaşıyor (' + amount + ').' }
        : { tone:'warn', label:word, text:'Hedef bandın ortasından uzaklaşıyor (' + amount + ').' };
    }

    if(trend.dir === goodDir){
      return { tone:'ok', label:word, text:'İstenen yönde ' + word + ' (' + amount + ').' };
    }
    /* Ters yonde: hedefteyse bilgi, hedefin disindaysa uyari. */
    return st.id === 'ok'
      ? { tone:'info', label:word, text:'Ters yönde ' + word + ' ama hâlâ hedefte (' + amount + ').' }
      : { tone:'warn', label:word, text:'Ters yönde ' + word + ' ve hedefin dışında (' + amount + ').' };
  }

  /* --------------------------------------------------------------- ozetler */

  /* Bir panelin son durumu — ekranin tablo satirlari. */
  function panelRows(panelId, profile){
    return SP.BIOMARKERS.filter(b => b.panel === panelId).map(b => {
      const last = SP.Model.latestOf(b.id);
      const v = last ? last.v : null;
      const r = refFor(b.id, profile);
      return {
        marker:b, value:v, at:last ? last.date : null,
        cert:last ? last.cert : 'missing',
        status:statusOf(b.id, v, profile),
        ref:r ? r.ref : null, optimal:r ? r.optimal : null,
      };
    });
  }

  /* Butun belirteclerin durum sayimi — Bugun ekranindaki ozet kart. */
  function summary(profile){
    const rows = SP.BIOMARKERS.map(b => {
      const last = SP.Model.latestOf(b.id);
      return { id:b.id, value:last ? last.v : null, status:statusOf(b.id, last ? last.v : null, profile) };
    });
    const count = id => rows.filter(r => r.status.id === id).length;
    return {
      total:rows.length,
      measured:rows.filter(r => r.value != null).length,
      red:count('red'),
      out:count('low') + count('high'),
      offTarget:count('belowOpt') + count('aboveOpt'),
      ok:count('ok'),
      missing:count('unknown'),
    };
  }

  /* Dikkat isteyen belirtecler — onem sirasina gore.
     Sira: kritik → referans disi → kotulesen egilim → hedef disi. */
  function attention(profile){
    const out = [];
    SP.BIOMARKERS.forEach(b => {
      const last = SP.Model.latestOf(b.id);
      if(!last) return;
      const st = statusOf(b.id, last.v, profile);
      const tr = trendOf(b.id);
      const vd = trendVerdict(b.id, tr, profile);

      let rank = null;
      if(st.id === 'red') rank = 1;
      else if(st.id === 'low' || st.id === 'high') rank = 2;
      else if(vd.tone === 'warn') rank = 3;
      else if(st.id === 'belowOpt' || st.id === 'aboveOpt') rank = 4;
      if(rank == null) return;

      out.push({ marker:b, value:last.v, at:last.date, status:st, trend:tr, verdict:vd, rank });
    });
    return out.sort((a, b) => a.rank - b.rank || (a.at < b.at ? 1 : -1));
  }

  /* Olcum borcu — hic olculmemis ya da uzun suredir tazelenmemis paneller.
     Vital olcumler gunluk, laboratuvar panelleri 180 gunde bir beklenir. */
  function overdue(){
    const out = [];
    SP.PANELS.forEach(p => {
      if(p.id === 'vital' || p.id === 'body') return;
      const markers = SP.BIOMARKERS.filter(b => b.panel === p.id);
      const dates = markers.map(b => SP.Model.latestOf(b.id)).filter(Boolean).map(x => x.date);
      if(!dates.length){
        out.push({ panel:p, days:null, note:'Hiç ölçülmemiş.' });
        return;
      }
      const newest = dates.sort()[dates.length - 1];
      const age = U.diffDays(newest, U.todayISO());
      if(age >= 180) out.push({ panel:p, days:age, at:newest, note:age + ' gündür tazelenmedi.' });
    });
    return out;
  }

  return {
    STATUS, MIN_POINTS,
    refFor, statusOf, statusNote,
    trendOf, trendVerdict,
    panelRows, summary, attention, overdue,
  };
})();

/* ==== js/core/nutri.js ==== */
/* Modul 2'nin kural motoru — hedef, ogun hesabi ve biyoyararlanim.

   Bu dosyanin ayirt edici iddiasi sudur: ne kadar aldigin kadar ne kadarini
   EMEBILDIGIN de sayilir. Ayni 5 mg demir, yaninda limon varken ve yaninda
   cay varken ayni sey degildir; sistem ikisini ayri hesaplar.

   Ikinci iddia: laboratuvar beslenmeyi degistirir. Ferritin dusukse demir
   hedefi kendiliginden yukselir ve C vitamini eslesmesi zorunlu hale gelir.
   Bu, Modul 1 ile Modul 2 arasindaki tek yonlu bagdir (labAdjust). */

window.SP = window.SP || {};

SP.Nutri = (function(){
  const U = SP.U;

  /* Mikro besin anahtarlari — gida tablosundaki `micro` ile ayni. */
  const MICROS = ['iron', 'calcium', 'magnesium', 'zinc', 'potassium', 'sodium',
    'b12', 'folate', 'vitc', 'vitd', 'omega3', 'selenium', 'iodine'];

  /* ------------------------------------------------------------- enerji */

  /* Mifflin-St Jeor — bazal metabolizma. Formul erkek ve kadin icin
     ayni katsayilari, farkli sabiti kullanir. */
  function bmr(profile){
    const p = profile || SP.S.profile;
    if(!p || !p.weightKg || !p.heightCm) return null;
    const age = SP.Model.ageOf(p);
    if(age == null) return null;
    const base = 10 * p.weightKg + 6.25 * p.heightCm - 5 * age;
    return Math.round(p.sex === 'female' ? base - 161 : base + 5);
  }

  function activityFactor(profile){
    const p = profile || SP.S.profile;
    const lvl = SP.ACTIVITY_LEVELS.find(a => a.id === (p && p.activity));
    return lvl ? lvl.factor : 1.4;
  }

  function tdee(profile){
    const b = bmr(profile);
    if(b == null) return null;
    return Math.round(b * activityFactor(profile));
  }

  /* ------------------------------------------------------------- hedefler */

  /* Laboratuvar bulgusuna gore hedef duzeltmesi.
     Tablo deklaratiftir: kosul, hangi ogeyi ne kadar buyuttugu ve GEREKCESI
     birlikte durur. Gerekce ekranda gorunur; carpanin nedenini kullanicidan
     saklamayiz. */
  const LAB_LINKS = [
    { when:['ferritin', 'low'],    nutrient:'iron',      mult:1.6,
      why:'Ferritin referans aralığının altında — demir deposu boşalmış.' },
    { when:['ferritin', 'belowOpt'], nutrient:'iron',    mult:1.3,
      why:'Ferritin hedef bandın altında.' },
    { when:['hgb', 'low'],         nutrient:'iron',      mult:1.5,
      why:'Hemoglobin düşük.' },
    { when:['vitd', 'low'],        nutrient:'vitd',      mult:2.0,
      why:'D vitamini referans altında — yağlı öğünle eşleştirme gerekir.' },
    { when:['vitd', 'belowOpt'],   nutrient:'vitd',      mult:1.5,
      why:'D vitamini hedef bandın altında.' },
    { when:['b12', 'low'],         nutrient:'b12',       mult:2.0,
      why:'B12 referans altında.' },
    { when:['b12', 'belowOpt'],    nutrient:'b12',       mult:1.4,
      why:'B12 hedef bandın altında (400 pg/mL altı belirti verebilir).' },
    { when:['folate', 'low'],      nutrient:'folate',    mult:1.5,
      why:'Folat referans altında.' },
    { when:['ldl', 'high'],        nutrient:'fiber',     mult:1.25,
      why:'LDL referans üstünde — çözünür lif doğrudan etkiler.' },
    { when:['ldl', 'aboveOpt'],    nutrient:'fiber',     mult:1.15,
      why:'LDL hedef bandın üstünde.' },
    { when:['trig', 'high'],       nutrient:'omega3',    mult:1.6,
      why:'Trigliserit referans üstünde.' },
    { when:['crp', 'high'],        nutrient:'omega3',    mult:1.3,
      why:'hs-CRP yüksek — sistemik yangı.' },
    { when:['hba1c', 'aboveOpt'],  nutrient:'fiber',     mult:1.2,
      why:'HbA1c hedef bandın üstünde.' },
    { when:['glucose', 'high'],    nutrient:'fiber',     mult:1.25,
      why:'Açlık glukozu referans üstünde.' },
    { when:['k', 'low'],           nutrient:'potassium', mult:1.25,
      why:'Potasyum referans altında.' },
    { when:['ca', 'low'],          nutrient:'calcium',   mult:1.2,
      why:'Kalsiyum referans altında.' },
    { when:['mg', 'low'],          nutrient:'magnesium', mult:1.3,
      why:'Magnezyum referans altında.' },
    { when:['zinc', 'low'],        nutrient:'zinc',      mult:1.3,
      why:'Çinko referans altında.' },
    { when:['tsh', 'high'],        nutrient:'iodine',    mult:1.2,
      why:'TSH yüksek — iyot ve selenyum tiroid için gerekli.' },
    { when:['tsh', 'high'],        nutrient:'selenium',  mult:1.2,
      why:'TSH yüksek.' },
    { when:['sbp', 'high'],        nutrient:'sodium',    mult:0.8,
      why:'Sistolik tansiyon referans üstünde — sodyum sınırı daralır.' },
    { when:['alb', 'low'],         nutrient:'protein',   mult:1.15,
      why:'Albümin düşük — uzun vadeli protein durumu zayıf.' },
  ];

  function labAdjust(profile){
    const out = {};
    LAB_LINKS.forEach(link => {
      const [markerId, wanted] = link.when;
      const last = SP.Model.latestOf(markerId);
      if(!last) return;
      const st = SP.Bio.statusOf(markerId, last.v, profile);
      if(st.id !== wanted) return;
      const cur = out[link.nutrient];
      /* Ayni oge icin birden fazla kural tetiklenirse en guclusu gecerlidir;
         carpanlar carpilmaz — ust uste binerek asiri hedef uretmesin. */
      const stronger = !cur || Math.abs(link.mult - 1) > Math.abs(cur.mult - 1);
      if(stronger) out[link.nutrient] = { mult:link.mult, why:link.why, marker:markerId };
    });
    return out;
  }

  /* Mikro besin taban hedefi — yasa ve cinsiyete gore. */
  function baseRda(nutrientId, profile){
    const n = SP.NUTRI_BY_ID[nutrientId];
    if(!n || !n.rda) return null;
    const p = profile || SP.S.profile || {};
    const sex = p.sex === 'female' ? 'female' : 'male';
    const age = SP.Model.ageOf(p);
    const r = n.rda;
    if(age != null && age >= 50 && sex === 'female' && r.female50 != null) return r.female50;
    if(age != null && age >= 50 && r.over50 != null) return r.over50;
    if(age != null && age >= 70 && r.over70 != null) return r.over70;
    if(age != null && age < 19 && r[sex === 'male' ? 'teenM' : 'teenF'] != null){
      return r[sex === 'male' ? 'teenM' : 'teenF'];
    }
    return r[sex] != null ? r[sex] : null;
  }

  /* Gunun tam hedefi: enerji, makrolar ve laboratuvara gore duzeltilmis
     mikro besinler. Profil eksikse hesap yapilmaz — tahmin uretilmez. */
  function targets(profile){
    const p = profile || SP.S.profile;
    const energy = tdee(p);
    const adj = labAdjust(p);

    const out = {
      ok:energy != null,
      bmr:bmr(p), tdee:energy, adjustments:adj,
      missing:[],
    };
    if(!p || !p.weightKg) out.missing.push('kilo');
    if(!p || !p.heightCm) out.missing.push('boy');
    if(!p || !p.birthYear) out.missing.push('doğum yılı');
    if(!out.ok) return out;

    const goal = SP.GOALS.find(g => g.id === (p.goal || 'health')) || SP.GOALS[0];
    out.goal = goal;
    out.kcal = Math.round(energy * (1 + goal.deficit));

    /* protein: g/kg araligi, hedefe gore */
    const pr = SP.MACRO_RULES.protein.byGoal[goal.id] || SP.MACRO_RULES.protein.byGoal.health;
    const pMult = (adj.protein && adj.protein.mult) || 1;
    out.protein = { min:Math.round(pr[0] * p.weightKg * pMult), max:Math.round(pr[1] * p.weightKg * pMult) };

    /* yag: kalorinin yuzdesi, alt sinir kg basina */
    const fLo = Math.max(Math.round(out.kcal * SP.MACRO_RULES.fat.pctRange[0] / 100 / 9),
                         Math.round(SP.MACRO_RULES.fat.minPerKg * p.weightKg));
    const fHi = Math.round(out.kcal * SP.MACRO_RULES.fat.pctRange[1] / 100 / 9);
    out.fat = { min:fLo, max:Math.max(fHi, fLo) };

    /* karbonhidrat: kalandan */
    const usedLo = out.protein.max * 4 + out.fat.max * 9;
    const usedHi = out.protein.min * 4 + out.fat.min * 9;
    out.carb = { min:Math.max(0, Math.round((out.kcal - usedLo) / 4)),
                 max:Math.max(0, Math.round((out.kcal - usedHi) / 4)) };

    /* lif */
    const fibBase = U.clamp(Math.round(out.kcal * SP.MACRO_RULES.fiber.perKcal),
      SP.MACRO_RULES.fiber.min, SP.MACRO_RULES.fiber.max);
    out.fiber = Math.round(fibBase * ((adj.fiber && adj.fiber.mult) || 1));

    /* mikro besinler */
    out.micro = {};
    MICROS.forEach(id => {
      const base = baseRda(id, p);
      if(base == null) return;
      const m = (adj[id] && adj[id].mult) || 1;
      const n = SP.NUTRI_BY_ID[id];
      out.micro[id] = {
        target:U.round(base * m, id === 'omega3' ? 2 : 0),
        base:base, mult:m, limit:!!(n && n.limit),
        ul:n ? n.ul : null,
        why:adj[id] ? adj[id].why : null,
      };
    });

    return out;
  }

  /* -------------------------------------------------------------- porsiyon */

  /* Bir gidanin verilen gramdaki katkisi. */
  function contribution(foodId, grams){
    const f = SP.FOOD_BY_ID[foodId];
    if(!f) return null;
    const k = (Number(grams) || 0) / 100;
    const out = {
      food:f, grams:Number(grams) || 0,
      kcal:f.kcal * k, protein:f.p * k, fat:f.f * k, sat:(f.sat || 0) * k,
      carb:f.c * k, fiber:(f.fib || 0) * k,
      micro:{}, flags:f.flags || [], ironType:f.ironType || 'nonheme',
    };
    MICROS.forEach(id => {
      const v = f.micro ? f.micro[id] : undefined;
      out.micro[id] = v === undefined ? null : v * k;
    });
    return out;
  }

  /* Ev olcusunu grama cevirir: "1 tabak" -> 250 g. */
  function portionGrams(foodId, label){
    const f = SP.FOOD_BY_ID[foodId];
    if(!f || !f.portions) return null;
    const p = f.portions.find(x => U.norm(x.label) === U.norm(label));
    return p ? p.g : null;
  }

  /* -------------------------------------------------------- biyoyararlanim

     Emilim ogun duzeyinde hesaplanir, gun duzeyinde degil: cay demirin
     emilimini yalnizca AYNI ogunde bozar. Bu yuzden toplama girmeden once
     her ogun kendi icinde degerlendirilir. */

  const ABSORB_BASE = { iron:0.05, calcium:0.30, zinc:0.30, vitd:0.60, folate:0.60,
    b12:0.50, magnesium:0.40, omega3:0.80 };

  function absorbMeal(items){
    /* once ham toplam */
    const raw = { kcal:0, protein:0, fat:0, sat:0, carb:0, fiber:0, micro:{} };
    MICROS.forEach(id => { raw.micro[id] = 0; });
    const unknown = {};
    let hemeIron = 0, nonHemeIron = 0;
    const flags = {};

    items.forEach(it => {
      const c = contribution(it.foodId, it.g);
      if(!c) return;
      raw.kcal += c.kcal; raw.protein += c.protein; raw.fat += c.fat;
      raw.sat += c.sat; raw.carb += c.carb; raw.fiber += c.fiber;
      MICROS.forEach(id => {
        if(c.micro[id] == null){ unknown[id] = (unknown[id] || 0) + 1; return; }
        raw.micro[id] += c.micro[id];
      });
      const fe = c.micro.iron || 0;
      if(c.ironType === 'heme') hemeIron += fe; else nonHemeIron += fe;
      (c.flags || []).forEach(fl => { flags[fl] = true; });
    });

    /* --- demir: kaynak tipine ve ogun icerigine gore --- */
    let nonHemeFactor = ABSORB_BASE.iron;
    const notes = [];
    if(raw.micro.vitc >= 25){
      nonHemeFactor *= 3;
      notes.push({ kind:'boost', key:'vitc',
        text:'Öğünde ' + Math.round(raw.micro.vitc) + ' mg C vitamini var — bitkisel demir emilimi 3 katına çıktı.' });
    }
    if(flags.tannin){
      nonHemeFactor *= 0.5;
      notes.push({ kind:'block', key:'tannin',
        text:'Öğünde çay ya da kahve var — demir emilimi yarıya indi. Bir saat sonraya bırakmak farkı geri getirir.' });
    }
    if(raw.micro.calcium >= 300){
      nonHemeFactor *= 0.7;
      notes.push({ kind:'block', key:'calcium',
        text:'Öğünde ' + Math.round(raw.micro.calcium) + ' mg kalsiyum var — demir ve çinko emilimini düşürüyor.' });
    }
    if(flags.phytate){
      nonHemeFactor *= 0.85;
      notes.push({ kind:'block', key:'phytate',
        text:'Tam tahıl ve bakliyattaki fitat mineral emilimini düşürüyor. Islatmak ve mayalamak kaybı azaltır.' });
    }
    nonHemeFactor = U.clamp(nonHemeFactor, 0.01, 0.20);

    /* --- kalsiyum ve D vitamini --- */
    let caFactor = ABSORB_BASE.calcium;
    if(raw.micro.vitd >= 2){
      caFactor *= 1.4;
      notes.push({ kind:'boost', key:'vitd',
        text:'Öğünde D vitamini var — kalsiyum emilimi arttı.' });
    }
    let vitdFactor = ABSORB_BASE.vitd;
    if(raw.fat >= 10){
      vitdFactor *= 1.4;
      notes.push({ kind:'boost', key:'fat',
        text:'Öğün yağ içeriyor — D vitamini yağda çözünür, taşınabiliyor.' });
    }else if(raw.micro.vitd > 0){
      vitdFactor *= 0.6;
      notes.push({ kind:'block', key:'fat',
        text:'Öğünde neredeyse hiç yağ yok — D vitamini yeterince emilemiyor.' });
    }

    /* --- cinko --- */
    let znFactor = ABSORB_BASE.zinc;
    if(flags.phytate) znFactor *= 0.75;
    if(hemeIron > 0) znFactor *= 1.2;

    const absorbed = {};
    MICROS.forEach(id => { absorbed[id] = (raw.micro[id] || 0) * (ABSORB_BASE[id] != null ? ABSORB_BASE[id] : 1); });
    absorbed.iron = hemeIron * 0.25 + nonHemeIron * nonHemeFactor;
    absorbed.calcium = raw.micro.calcium * caFactor;
    absorbed.vitd = raw.micro.vitd * vitdFactor;
    absorbed.zinc = raw.micro.zinc * znFactor;
    absorbed.vitc = raw.micro.vitc * 0.8;
    absorbed.potassium = raw.micro.potassium * 0.9;
    absorbed.sodium = raw.micro.sodium;    /* sinir olcusu; emilim carpani uygulanmaz */
    absorbed.selenium = raw.micro.selenium * 0.8;
    absorbed.iodine = raw.micro.iodine * 0.9;

    return {
      raw, absorbed, notes, unknown,
      iron:{ heme:hemeIron, nonHeme:nonHemeIron, nonHemeFactor:U.round(nonHemeFactor, 3) },
    };
  }

  /* Bir gunun butun ogunleri — her ogun kendi icinde emilim hesaplanip
     sonra toplanir. */
  function dayTotals(dateISO){
    const rows = SP.Model.mealsOf(dateISO);
    const total = { kcal:0, protein:0, fat:0, sat:0, carb:0, fiber:0, micro:{}, absorbed:{} };
    MICROS.forEach(id => { total.micro[id] = 0; total.absorbed[id] = 0; });
    const notes = [];
    const unknown = {};

    rows.forEach(meal => {
      const a = absorbMeal(meal.items || []);
      total.kcal += a.raw.kcal; total.protein += a.raw.protein; total.fat += a.raw.fat;
      total.sat += a.raw.sat; total.carb += a.raw.carb; total.fiber += a.raw.fiber;
      MICROS.forEach(id => {
        total.micro[id] += a.raw.micro[id] || 0;
        total.absorbed[id] += a.absorbed[id] || 0;
      });
      a.notes.forEach(n => notes.push(Object.assign({ slot:meal.slot }, n)));
      Object.keys(a.unknown).forEach(k => { unknown[k] = (unknown[k] || 0) + a.unknown[k]; });
    });

    total.meals = rows.length;
    total.notes = notes;
    total.unknown = unknown;
    total.empty = rows.length === 0;
    return total;
  }

  /* ------------------------------------------------------------------ acik

     Acik tek gunden degil son 7 gunun ortalamasindan okunur: bir gunun
     eksigi "acik" degildir, sureklilesen eksiklik aciktir.

     Hic ogun girilmemis gunler ortalamaya KATILMAZ. Girilmemis gunu sifir
     saymak, kullaniciyi hic yemediğine inandirmak olur. */
  function windowAverage(days){
    const n = days || 7;
    const out = { kcal:0, protein:0, fat:0, carb:0, fiber:0, micro:{}, absorbed:{}, days:0 };
    MICROS.forEach(id => { out.micro[id] = 0; out.absorbed[id] = 0; });

    for(let i = 0; i < n; i++){
      const d = U.iso(U.addDays(U.today(), -i));
      const t = dayTotals(d);
      if(t.empty) continue;
      out.days++;
      out.kcal += t.kcal; out.protein += t.protein; out.fat += t.fat;
      out.carb += t.carb; out.fiber += t.fiber;
      MICROS.forEach(id => { out.micro[id] += t.micro[id]; out.absorbed[id] += t.absorbed[id]; });
    }
    if(!out.days) return Object.assign(out, { empty:true });
    ['kcal', 'protein', 'fat', 'carb', 'fiber'].forEach(k => { out[k] = out[k] / out.days; });
    MICROS.forEach(id => { out.micro[id] = out.micro[id] / out.days; out.absorbed[id] = out.absorbed[id] / out.days; });
    out.empty = false;
    return out;
  }

  /* Hedefin altinda kalan ogeler, en buyuk aciktan baslayarak.
     Sinir tipindeki ogeler (sodyum) ters yonde degerlendirilir. */
  function gaps(days, profile){
    const t = targets(profile);
    const avg = windowAverage(days);
    if(!t.ok || avg.empty) return { ok:false, avg, targets:t, rows:[] };

    const rows = [];
    Object.keys(t.micro).forEach(id => {
      const tg = t.micro[id];
      const got = avg.micro[id];
      const abs = avg.absorbed[id];
      if(tg.limit){
        /* sinir: asilmasi kotu */
        const pct = U.pct(got, tg.target);
        if(pct > 100){
          rows.push({ id, kind:'over', nutrient:SP.NUTRI_BY_ID[id], target:tg.target,
            got, absorbed:abs, pct, gap:got - tg.target, why:tg.why });
        }
        return;
      }
      const pct = U.pct(got, tg.target);
      if(pct < 100){
        rows.push({ id, kind:'under', nutrient:SP.NUTRI_BY_ID[id], target:tg.target,
          got, absorbed:abs, pct, gap:tg.target - got, why:tg.why });
      }
    });

    /* lif ve protein makro tarafinda */
    if(avg.fiber < t.fiber){
      rows.push({ id:'fiber', kind:'under', nutrient:SP.NUTRI_BY_ID.fiber, target:t.fiber,
        got:avg.fiber, absorbed:avg.fiber, pct:U.pct(avg.fiber, t.fiber), gap:t.fiber - avg.fiber,
        why:t.adjustments.fiber ? t.adjustments.fiber.why : null });
    }
    if(avg.protein < t.protein.min){
      rows.push({ id:'protein', kind:'under', nutrient:SP.NUTRI_BY_ID.protein, target:t.protein.min,
        got:avg.protein, absorbed:avg.protein, pct:U.pct(avg.protein, t.protein.min),
        gap:t.protein.min - avg.protein,
        why:t.adjustments.protein ? t.adjustments.protein.why : null });
    }

    rows.sort((a, b) => a.pct - b.pct);
    return { ok:true, avg, targets:t, rows };
  }

  /* Bir acigi kapatmak icin en verimli gidalar — 100 gramda en cok o ogeyi
     tasiyanlar. Emilim tipi de dikkate alinir: demir icin hayvansal kaynak
     one gecer. */
  function sourcesFor(nutrientId, limit){
    const rows = SP.FOODS.map(f => {
      const v = f.micro ? f.micro[nutrientId] : null;
      if(v == null || v <= 0) return null;
      const bonus = nutrientId === 'iron' && f.ironType === 'heme' ? 2.5 : 1;
      return { food:f, per100:v, score:v * bonus };
    }).filter(Boolean);
    rows.sort((a, b) => b.score - a.score);
    return rows.slice(0, limit || 6);
  }

  /* ------------------------------------------------------------ hane mutfagi

     Tek tencere yemek pistiginde her bireyin hedefine gore porsiyon
     carpani hesaplanir. Cikan sayi "kac gram al" demektir; herkese ayri
     yemek pisirme zorunlulugu boylece kalkar. */
  function householdSplit(foodId, totalGrams, members){
    const f = SP.FOOD_BY_ID[foodId];
    if(!f) return { ok:false, error:'Yemek bulunamadı.' };
    const list = (members || []).filter(m => m.weightKg && m.heightCm && m.birthYear);
    if(!list.length) return { ok:false, error:'Porsiyon hesabı için en az bir profilde kilo, boy ve doğum yılı gerekir.' };

    /* Her uye icin gunluk kalori hedefi; bu ogunun payi hedefin %35'i sayilir
       (ana ogun varsayimi). Oran acikca yazilir, gizli sabit degildir. */
    const MEAL_SHARE = 0.35;
    const rows = list.map(m => {
      const t = targets(m);
      const kcalNeed = (t.ok ? t.kcal : 2000) * MEAL_SHARE;
      const gramsFor = f.kcal > 0 ? (kcalNeed / f.kcal) * 100 : 0;
      return { member:m, kcalNeed:Math.round(kcalNeed), grams:Math.round(gramsFor), targets:t };
    });

    const wanted = U.sum(rows.map(r => r.grams));
    const scale = wanted > 0 ? (Number(totalGrams) || 0) / wanted : 0;

    rows.forEach(r => {
      r.share = Math.round(r.grams * scale);
      r.mult = U.round(r.grams / (wanted / rows.length), 2);
      const c = contribution(foodId, r.share);
      r.gets = c;
      /* Ogunun kendi basina kapatamadigi ogeler yan gida ile tamamlanir. */
      r.addons = [];
      if(r.targets.ok){
        const pShare = r.targets.protein.min * MEAL_SHARE;
        if(c && c.protein < pShare * 0.8){
          r.addons.push({ need:'protein',
            text:'Bu porsiyon ' + Math.round(pShare) + ' g protein hedefinin altında kalıyor — '
               + 'yanına yoğurt ya da bir yumurta.' });
        }
      }
    });

    return { ok:true, food:f, totalGrams:Number(totalGrams) || 0, wanted, scale:U.round(scale, 2),
      rows, mealShare:MEAL_SHARE,
      short:scale < 0.9 ? Math.round(wanted - (Number(totalGrams) || 0)) : 0 };
  }

  return {
    MICROS, LAB_LINKS, ABSORB_BASE,
    bmr, tdee, activityFactor, baseRda, labAdjust, targets,
    contribution, portionGrams, absorbMeal, dayTotals, windowAverage,
    gaps, sourcesFor, householdSplit,
  };
})();

/* ==== js/core/move.js ==== */
/* Modul 3'un kural motoru — toparlanma, yuk ve gunun emri.

   Tek dogma: gunun yukunu istek degil toparlanma belirler.

   Toparlanma skoru dort girdiden gelir ve eksik girdi SIFIR SAYILMAZ —
   agirligi kalan girdilere dagitilir. Akilli saati olmayan biri de uyku ve
   nabizla anlamli bir skor alir; cihaz sahibi olmayan cezalandirilmaz.

   HRV ve istirahat nabzi mutlak degil KISISEL olcektir: kendi 30 gunluk
   ortalamana gore okunur. Baskasinin HRV'siyle karsilastirma yapilmaz. */

window.SP = window.SP || {};

SP.Move = (function(){
  const U = SP.U;

  /* ------------------------------------------------------------- taban cizgi */

  /* Bir gunluk olcumun kisisel ortalamasi. Bugun haric tutulur ki
     bugunun degeri kendi taban cizgisini kaydirmasin. */
  function baseline(key, days){
    const n = days || 30;
    const vals = [];
    for(let i = 1; i <= n; i++){
      const d = U.iso(U.addDays(U.today(), -i));
      const rec = SP.S.vitals[d];
      if(rec && rec[key] != null) vals.push(Number(rec[key]));
    }
    if(vals.length < 3) return null;
    return { mean:U.round(U.sum(vals) / vals.length, 1), n:vals.length,
      median:U.median(vals) };
  }

  /* --------------------------------------------------------- toparlanma */

  /* Her girdi 0-100 arasi bir alt skora cevrilir. */
  function sleepScore(hours){
    if(hours == null) return null;
    const t = SP.BIO_BY_ID.sleep.optimal;   /* [7, 8.5] */
    if(hours >= t[0] && hours <= t[1]) return 100;
    if(hours > t[1]) return U.clamp(100 - (hours - t[1]) * 12, 55, 100);
    /* Yetersiz uykuda ceza dogrusal: 7 saatten her eksik saat 22 puan. */
    return U.clamp(100 - (t[0] - hours) * 22, 0, 100);
  }

  function hrvScore(value){
    const b = baseline('hrv');
    if(value == null || !b) return null;
    /* Kendi ortalamana gore yuzde sapma. -%20 ve altinda skor dibe iner. */
    const pct = 100 * (value - b.mean) / b.mean;
    return U.clamp(70 + pct * 2.2, 0, 100);
  }

  function rhrScore(value){
    const b = baseline('rhr');
    if(value == null || !b) return null;
    /* Nabizda YUKSELIS kotudur: ortalamanin 8 atim ustu skoru dibe cekar. */
    const delta = value - b.mean;
    return U.clamp(80 - delta * 7, 0, 100);
  }

  function sorenessScore(value){
    /* Kullanicinin 1-5 arasi bildirdigi his: 1 = cok yorgun, 5 = zinde. */
    if(value == null) return null;
    return U.clamp((Number(value) - 1) * 25, 0, 100);
  }

  function readiness(dateISO, profile){
    const d = dateISO || U.todayISO();
    const v = SP.S.vitals[d] || {};

    const parts = [
      { id:'sleep',    score:sleepScore(v.sleep),        value:v.sleep },
      { id:'hrv',      score:hrvScore(v.hrv),            value:v.hrv },
      { id:'rhr',      score:rhrScore(v.rhr),            value:v.rhr },
      { id:'soreness', score:sorenessScore(v.soreness),  value:v.soreness },
    ].map(p => {
      const def = SP.READINESS_INPUTS.find(x => x.id === p.id);
      return Object.assign({}, p, { label:def.label, weight:def.weight, note:def.note });
    });

    const have = parts.filter(p => p.score != null);
    if(!have.length){
      return { ok:false, score:null, band:null, parts,
        note:'Bugün hiç ölçüm girilmemiş. Toparlanma skoru için en az uyku süresi gerekir.' };
    }

    /* Eksik girdinin agirligi kalanlara dagitilir. */
    const wsum = U.sum(have.map(p => p.weight));
    const score = Math.round(U.sum(have.map(p => p.score * p.weight)) / wsum);
    const band = SP.READINESS_BANDS.find(b => score >= b.min) || SP.READINESS_BANDS[SP.READINESS_BANDS.length - 1];

    /* Ates ve hastalik her seyi yener: 38,5 uzerinde yuk sifirlanir. */
    let override = null;
    if(v.temp != null && v.temp >= 38.5){
      override = { band:SP.READINESS_BANDS[SP.READINESS_BANDS.length - 1],
        why:'Ateş ' + U.fmtNum(v.temp) + ' °C. Ateşliyken antrenman yapılmaz.' };
    }
    if(v.spo2 != null && v.spo2 < 92){
      override = { band:SP.READINESS_BANDS[SP.READINESS_BANDS.length - 1],
        why:'Oksijen satürasyonu %' + U.fmtNum(v.spo2) + '. Bugün yük yok.' };
    }

    return {
      ok:true, score, band:override ? override.band : band, override,
      parts, missing:parts.filter(p => p.score == null).map(p => p.label),
      coverage:U.round(wsum, 2),
    };
  }

  /* --------------------------------------------------------------- yuk

     Seans yuku = sure x zorluk. Zorluk once kullanicinin bildirdigi
     RPE'den (1-10 algilanan zorluk), yoksa hareketlerin MET ortalamasindan
     gelir. Ikisi de yoksa seans sayilmaz — uydurulmus yuk uretilmez. */

  function sessionLoad(w){
    if(!w || !w.minutes) return 0;
    if(w.rpe != null && isFinite(w.rpe)) return Math.round(w.minutes * Number(w.rpe));
    const mets = (w.items || []).map(it => {
      const ex = SP.EX_BY_ID[it.exId];
      return ex ? ex.met : null;
    }).filter(v => v != null);
    if(!mets.length) return 0;
    const avg = U.sum(mets) / mets.length;
    return Math.round(w.minutes * avg);
  }

  function loadOn(dateISO){
    return U.sum(SP.Model.workoutsOf(dateISO).map(sessionLoad));
  }

  function loadWindow(days, endISO){
    const end = endISO || U.todayISO();
    let total = 0;
    for(let i = 0; i < days; i++){
      total += loadOn(U.iso(U.addDays(U.parse(end), -i)));
    }
    return total;
  }

  /* Akut/kronik yuk orani. 28 gunluk gecmis yoksa oran hesaplanmaz;
     kisa gecmisten uretilen ACWR yanilticidir. */
  function acwr(endISO){
    const first = SP.S.workouts.length ? SP.S.workouts[0].date : null;
    if(!first) return { ok:false, note:'Henüz antrenman kaydı yok.' };
    const span = U.diffDays(first, endISO || U.todayISO());
    if(span < 21){
      return { ok:false, span,
        note:'Son haftayı son aya kıyaslamak için en az 3 haftalık geçmiş gerekir; şu an ' + (span + 1) + ' gün var.' };
    }
    const acute = loadWindow(7, endISO) / 7;
    const chronic = loadWindow(28, endISO) / 28;
    if(!chronic) return { ok:false, note:'Son dört haftada yeterli yük kaydı yok.' };

    const ratio = U.round(acute / chronic, 2);
    const r = SP.LOAD_RULES.acwr;
    const zone = ratio < r.low ? 'low' : ratio > r.high ? 'high' : 'ok';
    return {
      ok:true, ratio, acute:Math.round(acute), chronic:Math.round(chronic), zone,
      tone:zone === 'ok' ? 'ok' : zone === 'high' ? 'danger' : 'warn',
      note:zone === 'ok' ? r.okNote : zone === 'high' ? r.highNote : r.lowNote,
    };
  }

  /* Bes haftada bir yuk indirme haftasi. Sayac ilk antrenmandan baslar. */
  function deloadWeek(dateISO){
    /* Hic seans yoksa dongu HENUZ BASLAMAMISTIR. Eksik alanla donmek
       cagiran ekranlarda "undefined/undefined" gibi ciktilar uretiyordu;
       eksik veri sifir sayilmaz ama sekli de bozmaz. */
    if(!SP.S.workouts.length){
      return { due:false, started:false, week:0, inCycle:0,
        every:SP.LOAD_RULES.deload.everyWeeks,
        factor:SP.LOAD_RULES.deload.factor,
        note:'Henüz seans kaydı yok; indirme döngüsü başlamadı.' };
    }
    const first = SP.S.workouts[0].date;
    const weeks = Math.floor(U.diffDays(first, dateISO || U.todayISO()) / 7);
    const every = SP.LOAD_RULES.deload.everyWeeks;
    const inCycle = weeks % every;
    return {
      due:inCycle === every - 1,
      started:true,
      week:weeks + 1, inCycle:inCycle + 1, every,
      factor:SP.LOAD_RULES.deload.factor,
      note:SP.LOAD_RULES.deload.note,
    };
  }

  /* Haftalik buyume siniri: toplam yuk gecen haftadan %10'dan fazla artmaz. */
  function weeklyGrowth(endISO){
    const thisWeek = loadWindow(7, endISO);
    const prevEnd = U.iso(U.addDays(U.parse(endISO || U.todayISO()), -7));
    const lastWeek = loadWindow(7, prevEnd);
    if(!lastWeek) return { ok:false, thisWeek, lastWeek };
    const growth = U.round((thisWeek - lastWeek) / lastWeek, 2);
    return {
      ok:true, thisWeek, lastWeek, growth,
      over:growth > SP.LOAD_RULES.weeklyGrowth.max,
      max:SP.LOAD_RULES.weeklyGrowth.max,
      note:SP.LOAD_RULES.weeklyGrowth.note,
    };
  }

  /* ------------------------------------------------------------ gunun emri

     Toparlanma bandi taban emri verir; ACWR ve indirme haftasi bunu
     yalnizca DAHA TEMKINLI yapabilir, asla daha agir yapamaz. */
  function prescription(dateISO){
    const d = dateISO || U.todayISO();
    const r = readiness(d);
    const a = acwr(d);
    const dl = deloadWeek(d);
    const done = SP.Model.workoutsOf(d);

    let factor = r.ok ? r.band.factor : 1;
    const reasons = [];

    /* Her gerekce kimliklidir: ekran skoru zaten buyuk yaziyorsa ayni cumleyi
       ikinci kez basmasin diye 'readiness' gerekcesini eleyebilir. */
    if(r.ok){
      reasons.push({ id:'readiness', kind:r.band.tone,
        text:'Toparlanma ' + r.score + '/100 — ' + r.band.label + '. ' + r.band.order,
        short:r.band.order });
    }else{
      reasons.push({ id:'no-data', kind:'muted',
        text:r.note + ' Yük planlandığı gibi kabul edildi.',
        short:r.note });
    }
    if(r.override){
      reasons.push({ id:'override', kind:'danger', text:r.override.why, short:r.override.why });
    }
    if(a.ok && a.zone === 'high'){
      factor = Math.min(factor, 0.7);
      const t = 'Akut/kronik yük oranı ' + U.fmtNet(a.ratio) + '. ' + a.note;
      reasons.push({ id:'acwr', kind:'danger', text:t, short:t });
    }
    if(dl.due){
      factor = Math.min(factor, dl.factor);
      const t = dl.week + '. hafta — yük indirme haftası. ' + dl.note;
      reasons.push({ id:'deload', kind:'warn', text:t, short:t });
    }

    const kind = factor === 0 ? 'rest' : factor <= 0.6 ? 'light' : factor < 1 ? 'reduced' : 'full';
    const templates = kind === 'rest' ? ['mobilite']
      : kind === 'light' ? ['mobilite', 'yuruyus-gunu']
      : kind === 'reduced' ? ['yuruyus-gunu', 'tam-vucut-a']
      : ['tam-vucut-a', 'tam-vucut-b', 'dayaniklilik'];

    return {
      date:d, factor:U.round(factor, 2), kind, reasons,
      readiness:r, acwr:a, deload:dl,
      done:done.length, doneLoad:U.sum(done.map(sessionLoad)),
      suggest:templates.map(id => SP.SESSION_TEMPLATES.find(t => t.id === id)).filter(Boolean),
      minimum:SP.LOAD_RULES.minDay,
    };
  }

  /* ------------------------------------------------------ ilerleme merdiveni

     Bir ust basamak, mevcut basamakta yeterli tekrar yapildiginda acilir.
     Sistem basamak atlatmaz. "Yeterli" olcusu son 14 gunde o basamakta
     en az uc seans gormektir; bu, tek iyi gunun ilerleme sanilmasini onler. */
  const ADVANCE_SESSIONS = 3;
