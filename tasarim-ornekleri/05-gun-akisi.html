<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>05 · Gün Akışı</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAFAFB; --yuzey:#FFFFFF; --gecmis:#F3F4F6; --ink:#0F1115; --ink2:#50576A; --ink3:#8D94A3;
  --cizgi:#ECEDF0; --cizgi2:#E2E4E9;
  --sinav:#2F6FEB; --saglik:#0E9888; --gelisim:#D98309; --merkez:#7A5CF0; --simdi:#E5484D;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --saat:48px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0D0E11; --yuzey:#15171B; --gecmis:#111317; --ink:#EDEEF1; --ink2:#A6ACB8; --ink3:#6B7280;
    --cizgi:#1E2126; --cizgi2:#272B32;
    --sinav:#4F86F2; --saglik:#1A9E8B; --gelisim:#C0832A; --merkez:#8A72EE; --simdi:#FF6369; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D0E11; --yuzey:#15171B; --gecmis:#111317; --ink:#EDEEF1; --ink2:#A6ACB8; --ink3:#6B7280;
  --cizgi:#1E2126; --cizgi2:#272B32;
  --sinav:#4F86F2; --saglik:#1A9E8B; --gelisim:#C0832A; --merkez:#8A72EE; --simdi:#FF6369; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;padding-inline:28px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--sinav);outline-offset:2px;border-radius:8px}
.kap{max-width:1120px;margin:0 auto;padding-block:32px 72px;display:grid;grid-template-columns:1fr 340px;gap:56px;align-items:start}

.bas{grid-column:1/-1;display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
.bas h1{margin:0;font-size:40px;font-weight:600;letter-spacing:-.03em;line-height:1}
.bas .t{font:14px var(--mono);color:var(--ink3)}
.gunler{margin-left:auto;display:flex;gap:4px}
.gunler button{width:44px;height:52px;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;font:12px var(--mono);color:var(--ink3);gap:2px}
.gunler button b{font:600 16px var(--sans);color:var(--ink2)}
.gunler button[aria-current="date"]{background:var(--ink);color:var(--bg)}
.gunler button[aria-current="date"] b{color:var(--bg)}
.gunler button:hover:not([aria-current]){background:var(--yuzey)}

/* zaman cizelgesi */
.cizelge{position:relative;margin-left:64px}
.cizelge .gecmis{position:absolute;left:-64px;right:0;top:0;background:linear-gradient(var(--bg),var(--gecmis) 40px);border-radius:0 0 12px 12px;pointer-events:none}
.saat{position:absolute;left:-64px;right:0;height:0;border-top:1px solid var(--cizgi);font:12px var(--mono);color:var(--ink3)}
.saat span{position:absolute;top:-8px;left:0;background:var(--bg);padding-right:10px;line-height:16px}
.blok{position:absolute;left:0;right:0;border-radius:12px;background:color-mix(in oklab,var(--r) 9%,var(--yuzey));border:1px solid color-mix(in oklab,var(--r) 22%,transparent);padding:10px 14px 10px 18px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;overflow:hidden}
.blok::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--r)}
.blok .ad{font-weight:600;letter-spacing:-.005em}
.blok .ay{font:12px var(--mono);color:var(--ink3);margin-top:2px}
.blok .sag{font:12px var(--mono);color:var(--ink2);white-space:nowrap}
.blok.bitti{background:var(--yuzey);border-color:var(--cizgi2)}
.blok.bitti .ad{color:var(--ink2)}
.blok.sira{box-shadow:0 10px 30px -14px color-mix(in oklab,var(--r) 70%,transparent);border-color:color-mix(in oklab,var(--r) 45%,transparent)}
.blok.ince{padding-block:0;align-items:center}
.pin{position:absolute;left:0;right:0;display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);height:22px;margin-top:-11px}
.pin i{width:10px;height:10px;border-radius:50%;background:var(--r);box-shadow:0 0 0 3px var(--bg);margin-left:-5px}
.pin small{font:12px var(--mono);color:var(--ink3)}
.bosluk{position:absolute;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;font:12px var(--mono);color:var(--ink3);border:1px dashed var(--cizgi2);border-radius:12px}
.bosluk button{height:28px;padding:0 12px;border-radius:999px;background:var(--yuzey);border:1px solid var(--cizgi2);font:500 12px var(--sans);color:var(--ink2)}
.bosluk button:hover{color:var(--ink);border-color:var(--ink3)}
.simdi{position:absolute;left:-64px;right:-6px;height:0;border-top:2px solid var(--simdi);z-index:3}
.simdi span{position:absolute;left:0;top:-10px;font:500 12px var(--mono);color:#fff;background:var(--simdi);border-radius:6px;padding:1px 6px}
.simdi::after{content:"";position:absolute;right:0;top:-5px;width:8px;height:8px;border-radius:50%;background:var(--simdi)}

/* yan */
.yan{position:sticky;top:24px;display:flex;flex-direction:column;gap:28px}
.geri{background:var(--ink);color:var(--bg);border-radius:20px;padding:22px}
.geri .k{font:12px var(--mono);opacity:.6}
.geri .s{font-size:46px;font-weight:600;letter-spacing:-.04em;line-height:1;margin-top:10px}
.geri .s small{font-size:18px;opacity:.6;margin-left:4px;letter-spacing:0}
.geri .ad{margin-top:8px;font-weight:500}
.geri button{margin-top:18px;width:100%;height:44px;border-radius:12px;background:var(--bg);color:var(--ink);font-weight:600}
.yan h3{margin:0 0 12px;font:12px var(--mono);color:var(--ink3);font-weight:400}
.dagilim{display:flex;flex-direction:column;gap:14px}
.dagilim .sat{display:grid;grid-template-columns:1fr auto;gap:6px 12px;font-size:14px}
.dagilim .sat b{font-weight:600}
.dagilim .sat span{font:12px var(--mono);color:var(--ink3)}
.dagilim .cb{grid-column:1/-1;height:6px;border-radius:3px;background:color-mix(in oklab,var(--r) 16%,transparent);overflow:hidden}
.dagilim .cb i{display:block;height:100%;background:var(--r);border-radius:3px}
.oneri{border-top:1px solid var(--cizgi2);padding-top:20px}
.oneri b{display:block;font-weight:600}
.oneri p{margin:4px 0 14px;font:12px var(--mono);color:var(--ink3)}
.oneri .d{display:flex;gap:8px}
.oneri button{height:36px;padding:0 14px;border-radius:10px;font-weight:600;font-size:14px}
.oneri .evet{background:var(--merkez);color:#fff}
.oneri .hayir{color:var(--ink2)}
.not{display:flex;flex-direction:column;gap:8px;font-size:14px;color:var(--ink2)}
.not div{display:flex;gap:10px;align-items:center}
.not i{width:6px;height:6px;border-radius:50%;background:#C98A1B}

@media (max-width:900px){
  .kap{grid-template-columns:1fr;gap:32px}
  .yan{position:static;order:-1}
  .bas{order:-2}
}
@media (max-width:560px){
  body{padding-inline:16px}
  .bas h1{font-size:32px}
  .gunler{margin-left:0;width:100%;justify-content:space-between}
  .cizelge{margin-left:52px}
  .cizelge .gecmis,.saat{left:-52px}
  .simdi{left:-52px}
  .bosluk span{display:none}
}
</style>
</head>
<body>
<div class="kap">
  <header class="bas">
    <h1>Perşembe</h1><span class="t">24 Eylül · 7 iş · 3 bitti</span>
    <nav class="gunler" aria-label="Günler">
      <button><span>Pzt</span><b>21</b></button>
      <button><span>Sal</span><b>22</b></button>
      <button><span>Çar</span><b>23</b></button>
      <button aria-current="date"><span>Per</span><b>24</b></button>
      <button><span>Cum</span><b>25</b></button>
      <button><span>Cmt</span><b>26</b></button>
      <button><span>Paz</span><b>27</b></button>
    </nav>
  </header>

  <section class="cizelge" id="cizelge" aria-label="Günün zaman çizelgesi"></section>

  <aside class="yan">
    <div class="geri" aria-live="polite">
      <div class="k">SIRADAKİ · GELİŞİM</div>
      <div class="s">20<small>dk sonra</small></div>
      <div class="ad">Yabancı Dil — kelime tekrarı · 30 dk</div>
      <button>Şimdi başla</button>
    </div>
    <div>
      <h3>Bugün plan / yapılan</h3>
      <div class="dagilim">
        <div class="sat" style="--r:var(--sinav)"><b>Sınav</b><span>70 / 140 dk</span><div class="cb"><i style="width:50%"></i></div></div>
        <div class="sat" style="--r:var(--saglik)"><b>Sağlık</b><span>2 / 4 asgari</span><div class="cb"><i style="width:50%"></i></div></div>
        <div class="sat" style="--r:var(--gelisim)"><b>Gelişim</b><span>20 / 50 dk</span><div class="cb"><i style="width:40%"></i></div></div>
      </div>
    </div>
    <div class="oneri">
      <b>Akşam bloğu tekrara ayrılsın</b>
      <p>Merkez · tekrar borcu %34 · eşik %10</p>
      <div class="d"><button class="evet">Uygula</button><button class="hayir">Geç</button></div>
    </div>
    <div class="not"><div><i></i>Yedek hiç alınmadı</div><div><i></i>11 deneme analiz bekliyor</div></div>
  </aside>
</div>
<script>
(function(){
  var BAS = 7, SON = 24, SAAT = 60;
  var y = function(h, m){ return ((h - BAS) + (m || 0) / 60) * SAAT; };
  var c = document.getElementById('cizelge');
  c.style.height = (SON - BAS) * SAAT + 'px';
  var h = '<div class="gecmis" style="height:' + y(14, 10) + 'px"></div>';
  for(var s = BAS; s <= SON; s++) if(s !== 14) h += '<div class="saat" style="top:' + y(s) + 'px"><span>' + String(s % 24).padStart(2, '0') + ':00</span></div>';
  var bloklar = [
    [8,0,8,20,'gelisim','Tarih','yüzyıl eşlemesi','20 dk','bitti'],
    [9,30,10,40,'sinav','TYT Matematik','24 soru · 18 doğru','70 dk','bitti'],
    [14,30,15,0,'gelisim','Yabancı Dil','ısınma 5 · tekrar 15 · yeni 10','30 dk','sira'],
    [17,30,18,15,'saglik','Antrenman','üst gövde · toparlanma 72','45 dk',''],
    [20,30,21,40,'sinav','Paragraf','30 soru','70 dk',''],
    [23,0,24,0,'saglik','Uyku','hedef 7,5 sa','','']
  ];
  bloklar.forEach(function(b){
    var t = y(b[0], b[1]), hh = Math.max(y(b[2], b[3]) - t, 32), ince = hh < 56;
    h += '<div class="blok ' + b[8] + (ince ? ' ince' : '') + '" style="--r:var(--' + b[4] + ');top:' + (t + 2) + 'px;height:' + (hh - 4) + 'px">' +
      '<div><div class="ad">' + b[5] + '</div>' + (ince ? '' : '<div class="ay">' + b[6] + '</div>') + '</div><span class="sag">' + b[7] + '</span></div>';
  });
  h += '<div class="pin" style="--r:var(--saglik);top:' + y(8, 40) + 'px"><i></i>Sabah ölçümü <small>uyku 7,0 · nabız 58</small></div>';
  h += '<div class="bosluk" style="top:' + (y(10, 40) + 6) + 'px;height:' + (y(14, 5) - y(10, 40) - 12) + 'px"><span>boş · 3 sa 25 dk geçti</span></div>';
  h += '<div class="bosluk" style="top:' + (y(15, 0) + 6) + 'px;height:' + (y(17, 30) - y(15, 0) - 12) + 'px"><span>boş · 2 sa 30 dk</span><button>+ 15 dk&#39;lık iş</button></div>';
  h += '<div class="bosluk" style="top:' + (y(18, 15) + 6) + 'px;height:' + (y(20, 30) - y(18, 15) - 12) + 'px"><span>boş · 2 sa 15 dk</span></div>';
  h += '<div class="simdi" style="top:' + y(14, 10) + 'px"><span>14:10</span></div>';
  c.innerHTML = h;
})();
</script>
</body>
</html>
